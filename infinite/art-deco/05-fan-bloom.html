<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="A peacock fan of fine gold ribs with emerald eye-spots blooms open and closed from a sunburst medallion over a ziggurat base on black.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fan Bloom</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract);
     the light re-theme (deep gold on ivory) is the [data-theme="light"] block.
     The canvas draws with these too — see syncTheme(). */
  :root{--ad05-bg:#0c0b08;--ad05-bg-2:#161208;--ad05-gold:#d4af37;--ad05-gold-2:#f2d97a;--ad05-gold-3:#8a6e22;
    --ad05-emer:#0e5c4a;--ad05-emer-0:rgba(14,92,74,0);--ad05-base:rgba(212,175,55,0.10);
    --ad05-glow:rgba(212,175,55,.18);--ad05-glow-0:rgba(212,175,55,0);--ad05-vignette:rgba(0,0,0,.6);--ad05-cap:#fff;--ad05-cap-o:.42}
  :root[data-theme="light"]{--ad05-bg:#f7f1e4;--ad05-bg-2:#fbf7ec;--ad05-gold:#87681a;--ad05-gold-2:#b08a2a;--ad05-gold-3:#7a5c14;
    --ad05-emer:#0e5c4a;--ad05-emer-0:rgba(14,92,74,0);--ad05-base:rgba(135,104,26,0.16);
    --ad05-glow:rgba(135,104,26,.13);--ad05-glow-0:rgba(135,104,26,0);--ad05-vignette:rgba(95,74,18,.16);--ad05-cap:#2a2110;--ad05-cap-o:.55}
  html,body{margin:0;height:100%;background:var(--ad05-bg)}
  #ad05-stage{position:fixed;inset:0;overflow:hidden;background:
    radial-gradient(120% 90% at 50% 86%,var(--ad05-bg-2) 0%,var(--ad05-bg) 60%);}
  #ad05-c{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* static gold vignette + glow, never repaints */
  #ad05-glow{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(40% 34% at 50% 60%,var(--ad05-glow),var(--ad05-glow-0) 70%);
    box-shadow:inset 0 0 120px 30px var(--ad05-vignette)}
  .cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;
    color:var(--ad05-cap);opacity:var(--ad05-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important}}
</style>
<script type="application/json" id="forever-agent-meta">

 "description": "A 16-rib peacock fan blooms open and closed from a sunburst medallion over a gold ziggurat base; each rib has barbs and an emerald eye-spot.",

 "editableAreas": [
  "rib count (RIB=16)",
  "bloom cycle duration (9s cycle)",
  "spread arc width (0.30+0.65*open multipliers)",
  "gold color palette (GOLD, GOLD2, GOLD3)",
  "emerald eye color (EMER)",
  "barb count per rib (n=7)",

 ],
 "preserveElements": [

 ],
 "knownLimitations": [
  "Background color hardcoded near-black in both CSS and radial-gradient — must edit both to change",

  "Static frame at open=0.78 on reduced-motion may look slightly asymmetric at some viewport sizes"
 ],
 "tier": "curated",
 "labels": [

  "mobile-ready",

  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "art-deco",
  "fan",

</head>
<body>
<div id="ad05-stage" role="img" aria-label="Art Deco peacock fan blooming open with fine gold radial lines on deep black">
  <canvas id="ad05-c"></canvas>
  <div id="ad05-glow"></div>
</div>
<div class="cap">Fan Bloom</div>
<script>
(function(){
  "use strict";
  var stage=document.getElementById("ad05-stage");
  var cv=document.getElementById("ad05-c");
  var ctx=cv.getContext("2d");
  var reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;

  var W=0,H=0,DPR=1,cx=0,cy=0,R=0;
  // every colour the canvas draws with is a CSS token, read once at start and once per
  // theme flip (never per frame); per-frame gradients pick the new values up automatically.
  var root=document.documentElement, GOLD,GOLD2,GOLD3,EMER,EMER0,BASE;
  function syncTheme(){
    var cs=getComputedStyle(root), v=function(n){return cs.getPropertyValue(n).trim();};
    GOLD=v("--ad05-gold"); GOLD2=v("--ad05-gold-2"); GOLD3=v("--ad05-gold-3");
    EMER=v("--ad05-emer"); EMER0=v("--ad05-emer-0"); BASE=v("--ad05-base");
    if(reduce&&W) drawFrame(0.78,0);          // no loop is running to repaint the static frame
  }
  addEventListener("message",function(e){ var d=e.data;
    if(d&&d.type==="forever:theme"&&(d.theme==="light"||d.theme==="dark")){ root.setAttribute("data-theme",d.theme); syncTheme(); } });
  syncTheme();
  var RIB=16;            // fan ribs (<=110 elements total)
  var TAU=Math.PI*2;

  function size(){
    DPR=Math.min(2,window.devicePixelRatio||1);
    W=stage.clientWidth; H=stage.clientHeight;
    cv.width=Math.max(1,W*DPR); cv.height=Math.max(1,H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    cx=W*0.5; cy=H*0.60;
    R=Math.min(W,H)*0.46;
  }

  // smooth ease for bloom open/close
  function ez(t){ return t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }

  // draw one rib (a feather/shell blade) at angle a, with open fraction f (0..1)
  function rib(a,f,phase){
    var len=R*(0.42+0.58*f);
    var ex=cx+Math.cos(a)*len, ey=cy+Math.sin(a)*len;
    // spine
    ctx.strokeStyle=GOLD3; ctx.lineWidth=Math.max(.6,R*0.006);
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(ex,ey); ctx.stroke();
    // fine barbs along the spine
    var n=7, perp=a+Math.PI/2;
    ctx.strokeStyle=GOLD; ctx.lineWidth=Math.max(.5,R*0.0035);
    ctx.globalAlpha=0.55*f;
    for(var i=1;i<=n;i++){
      var t=i/(n+1);
      var sx=cx+Math.cos(a)*len*t, sy=cy+Math.sin(a)*len*t;
      var bl=len*0.10*(1-t*0.4)*f;
      ctx.beginPath();
      ctx.moveTo(sx-Math.cos(perp)*bl,sy-Math.sin(perp)*bl);
      ctx.lineTo(sx+Math.cos(perp)*bl,sy+Math.sin(perp)*bl);
      ctx.stroke();
    }
    ctx.globalAlpha=1;
    // peacock eye near the tip
    var er=R*(0.05+0.02*Math.sin(phase));
    var gx=cx+Math.cos(a)*len*0.92, gy=cy+Math.sin(a)*len*0.92;
    var grd=ctx.createRadialGradient(gx,gy,0,gx,gy,er);
    grd.addColorStop(0,GOLD2); grd.addColorStop(.45,EMER); grd.addColorStop(1,EMER0);
    ctx.globalAlpha=f;
    ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(gx,gy,er,0,TAU); ctx.fill();
    ctx.strokeStyle=GOLD; ctx.lineWidth=Math.max(.5,R*0.004);
    ctx.beginPath(); ctx.arc(gx,gy,er*0.55,0,TAU); ctx.stroke();
    ctx.globalAlpha=1;
  }

  function drawFrame(open,phase){
    ctx.clearRect(0,0,W,H);
    // stepped ziggurat base — symmetric, static silhouette
    ctx.fillStyle=BASE;
    var bw=R*1.05, bh=R*0.16, steps=4;
    for(var s=0;s<steps;s++){
      var w=bw*(1-s*0.18), y=cy+R*0.12+s*(bh/steps);
      ctx.fillRect(cx-w/2,y,w,bh/steps-1);
    }
    // hub fountain stem
    ctx.strokeStyle=GOLD3; ctx.lineWidth=Math.max(1,R*0.012);
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx,cy+R*0.34); ctx.stroke();

    // fan spreads across an arc that widens with `open`
    var spread=(0.30+0.65*open)*Math.PI;     // total angular width
    var base=-Math.PI/2;                       // pointing up
    for(var i=0;i<RIB;i++){
      var t=RIB>1? i/(RIB-1):0.5;
      var a=base+(t-0.5)*spread;
      // per-rib stagger so it blooms outward-in
      var rf=Math.max(0,Math.min(1,open*1.25 - Math.abs(t-0.5)*0.5));
      rib(a,ez(rf),phase+t*2.2);
    }

    // central sunburst medallion (static-feel, sits over hub)
    ctx.save();
    ctx.translate(cx,cy);
    ctx.strokeStyle=GOLD; ctx.lineWidth=Math.max(.6,R*0.005);
    var rays=24, ir=R*0.04, or_=R*0.085*(0.9+0.1*open);
    for(var r=0;r<rays;r++){
      var aa=r/rays*TAU;
      ctx.beginPath();
      ctx.moveTo(Math.cos(aa)*ir,Math.sin(aa)*ir);
      ctx.lineTo(Math.cos(aa)*or_,Math.sin(aa)*or_);
      ctx.stroke();
    }
    var mg=ctx.createRadialGradient(0,0,0,0,0,ir);
    mg.addColorStop(0,GOLD2); mg.addColorStop(1,GOLD3);
    ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(0,0,ir,0,TAU); ctx.fill();
    ctx.restore();
  }

  // ---- loop ----
  var running=true,raf=0,t0=0;
  function frame(ts){
    if(!running) return;
    if(!t0) t0=ts;
    var e=(ts-t0)/1000;
    // breathing bloom: open and close slowly, never strobes
    var cycle=(e%9)/9;                 // 9s cycle
    var open;
    if(cycle<0.55) open=ez(cycle/0.55);
    else if(cycle<0.72) open=1;
    else open=1-ez((cycle-0.72)/0.28);
    drawFrame(open, e*0.6);
    raf=requestAnimationFrame(frame);
  }

  function start(){ if(reduce) return; running=true; t0=0; raf=requestAnimationFrame(frame); }
  function stop(){ running=false; if(raf) cancelAnimationFrame(raf); raf=0; }

  document.addEventListener("visibilitychange",function(){
    if(document.hidden) stop();
    else if(!reduce){ start(); }
  });
  window.addEventListener("resize",function(){
    size(); if(reduce) drawFrame(0.78,0);
  });

  size();
  if(reduce){ drawFrame(0.78,0); return; }
  start();
})();
</script>
</body>
</html>
