<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="A fan of curling peacock-feather plumes with jewel-toned eyes unfurls and drifts in gold and green whiplash lines.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peacock Curl</title>
<script>/* theme hook: ?theme=light|dark (or data-theme on <html>), before first paint — no flash; standalone stays dark */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  :root{ /* theme tokens — dark defaults; the light re-theme is the [data-theme="light"] block */
    --an05-bg:#0e1310; --an05-bg0:#1b2a22; --an05-bg1:#12191400; --an05-bg2:#0e1310;
    --an05-e0:#1c2b6b; --an05-e1:#2f6f63; --an05-e2:#c9a24b; --an05-e3:#7d5a1f;
    --an05-v0:#d8b860; --an05-v1:#6f8a4e; --an05-bl:#6f8a4e; --an05-br:#a98a3c;
    --an05-ring:#0e1310; --an05-pupil:#11183f; --an05-dot:#d8b860; --an05-hi:#e7d28a;
    --an05-ground:#2f4034; --an05-tendril:#c9a24b; --an05-cap:#fff; --an05-cap-o:.42;
  }
  :root[data-theme="light"]{ /* ivory ground; plumes in olive and ochre, jewel eye kept deep */
    --an05-bg:#f4f1e6; --an05-bg0:#fdfbf2; --an05-bg1:#f4f1e600; --an05-bg2:#ece5d3;
    --an05-e0:#22357f; --an05-e1:#2f6f68; --an05-e2:#a98533; --an05-e3:#6f5620;
    --an05-v0:#a98533; --an05-v1:#4f6b3a; --an05-bl:#4f6b3a; --an05-br:#866928;
    --an05-ring:#2b2f22; --an05-pupil:#141c47; --an05-dot:#dcb768; --an05-hi:#f0dfa8;
    --an05-ground:#4f6b3a; --an05-tendril:#866928; --an05-cap:#262a1d; --an05-cap-o:.5;
  }
  #an05-bloom stop:nth-child(1){stop-color:var(--an05-bg0)}#an05-bloom stop:nth-child(2){stop-color:var(--an05-bg1)}#an05-bloom stop:nth-child(3){stop-color:var(--an05-bg2)}
  #an05-eye stop:nth-child(1){stop-color:var(--an05-e0)}#an05-eye stop:nth-child(2){stop-color:var(--an05-e1)}#an05-eye stop:nth-child(3){stop-color:var(--an05-e2)}#an05-eye stop:nth-child(4){stop-color:var(--an05-e3)}
  #an05-vine stop:nth-child(1){stop-color:var(--an05-v0)}#an05-vine stop:nth-child(2){stop-color:var(--an05-v1)}
  .an05-bl{stroke:var(--an05-bl)}.an05-br{stroke:var(--an05-br)}.an05-ring{stroke:var(--an05-ring)}.an05-pupil{fill:var(--an05-pupil)}
  .an05-dot{fill:var(--an05-dot)}.an05-hi{stroke:var(--an05-hi)}.an05-ground{stroke:var(--an05-ground)}.an05-tendril{stroke:var(--an05-tendril)}
  html,body{margin:0;height:100%;background:var(--an05-bg);overflow:hidden}
  #an05-stage{position:fixed;inset:0;display:block;width:100%;height:100%}
  .cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--an05-cap);opacity:var(--an05-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
  /* settle on first frame of every animated value when motion is reduced */
  @media (prefers-reduced-motion:reduce){
    #an05-stage animate,#an05-stage animateTransform{display:none}
  }
</style>

 "agentPrompt": "Change the plume spine color by editing the an05-vine gradient stops from #d8b860/#6f8a4e to #e07aff/#4a3f8a for a purple Art Nouveau palette. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",

<body>
<svg id="an05-stage" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice"
     role="img" aria-label="Art Nouveau peacock feather forms unfurling in curling gold and green whiplash lines">
  <defs>
    <!-- static stained-glass radial bloom, never repaints -->
    <radialGradient id="an05-bloom" cx="50%" cy="46%" r="62%">
      <stop offset="0%"/><stop offset="55%"/><stop offset="100%"/>
    </radialGradient>
    <radialGradient id="an05-eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%"/><stop offset="38%"/><stop offset="70%"/><stop offset="100%"/>
    </radialGradient>
    <linearGradient id="an05-vine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"/><stop offset="100%"/>
    </linearGradient>
    <!-- single feather barb-curl unit, reused & rotated -->
    <g id="an05-plume">
      <!-- whiplash spine -->
      <path d="M0 0 C 6 -54 -10 -104 4 -150 C 12 -176 -8 -198 2 -222"
            fill="none" stroke="url(#an05-vine)" stroke-width="2.4" stroke-linecap="round"/>
      <!-- left barbs (organic asymmetry) -->
      <path d="M2 -40 C -26 -52 -40 -78 -34 -104 M3 -86 C -22 -96 -34 -120 -27 -146 M3 -132 C -18 -140 -28 -162 -21 -184"
            class="an05-bl" fill="none" stroke-width="1.5" stroke-linecap="round" opacity=".82"/>
      <!-- right barbs -->
      <path d="M2 -56 C 28 -66 42 -90 35 -116 M3 -102 C 24 -110 34 -134 27 -158 M3 -150 C 18 -158 26 -178 19 -198"
            class="an05-br" fill="none" stroke-width="1.5" stroke-linecap="round" opacity=".82"/>
      <!-- the eye, drop sits at the tip -->
      <g transform="translate(2 -232)">
        <circle r="22" fill="url(#an05-eye)"/>
        <circle class="an05-ring" r="22" fill="none" stroke-width="2.5"/>
        <circle class="an05-pupil" r="10"/>
        <circle class="an05-dot" r="4"/>
        <path class="an05-hi" d="M0 -22 C 14 -30 22 -16 17 -2" fill="none" stroke-width="1.4" opacity=".7"/>
      </g>
    </g>
  </defs>

  <rect width="400" height="400" fill="url(#an05-bloom)"/>

  <!-- ground vine sweep, static frame anchor -->
  <path d="M40 392 C 120 360 150 300 130 250 C 112 206 150 170 200 178 C 252 186 286 154 270 250 C 260 312 300 360 360 392"
        class="an05-ground" fill="none" stroke-width="3" opacity=".55"/>

  <!-- fan of plumes; each unfurls via grouped transform animation -->
  <g transform="translate(200 300)">
    <!-- far left -->
    <g>
      <g transform="rotate(-44)">
        <use href="#an05-plume" transform="scale(0.78)">
          <animateTransform attributeName="transform" type="scale" additive="sum"
            values="0.04;0.78;0.7;0.78" keyTimes="0;0.55;0.8;1" dur="7.5s"
            calcMode="spline" keySplines="0.16 0.8 0.24 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
            repeatCount="indefinite"/>
        </use>
        <animateTransform attributeName="transform" type="rotate"
          values="-44;-40;-46;-44" dur="9s" calcMode="spline"
          keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
      </g>
    </g>
    <!-- mid left -->
    <g transform="rotate(-22)">
      <use href="#an05-plume" transform="scale(0.9)">
        <animateTransform attributeName="transform" type="scale" additive="sum"
          values="0.04;0.9;0.82;0.9" keyTimes="0;0.55;0.82;1" dur="7.5s" begin="0.5s"
          calcMode="spline" keySplines="0.16 0.8 0.24 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
          repeatCount="indefinite"/>
      </use>
      <animateTransform attributeName="transform" type="rotate"
        values="-22;-18;-25;-22" dur="9.6s" calcMode="spline"
        keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </g>
    <!-- center, tallest -->
    <g>
      <use href="#an05-plume">
        <animateTransform attributeName="transform" type="scale"
          values="0.04;1;0.92;1" keyTimes="0;0.55;0.82;1" dur="7.5s" begin="1s"
          calcMode="spline" keySplines="0.16 0.8 0.24 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
          repeatCount="indefinite"/>
      </use>
    </g>
    <!-- mid right -->
    <g transform="rotate(22)">
      <use href="#an05-plume" transform="scale(0.9)">
        <animateTransform attributeName="transform" type="scale" additive="sum"
          values="0.04;0.9;0.82;0.9" keyTimes="0;0.55;0.82;1" dur="7.5s" begin="0.5s"
          calcMode="spline" keySplines="0.16 0.8 0.24 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
          repeatCount="indefinite"/>
      </use>
      <animateTransform attributeName="transform" type="rotate"
        values="22;26;19;22" dur="9.6s" calcMode="spline"
        keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </g>
    <!-- far right -->
    <g transform="rotate(44)">
      <use href="#an05-plume" transform="scale(0.78)">
        <animateTransform attributeName="transform" type="scale" additive="sum"
          values="0.04;0.78;0.7;0.78" keyTimes="0;0.55;0.8;1" dur="7.5s"
          calcMode="spline" keySplines="0.16 0.8 0.24 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
          repeatCount="indefinite"/>
      </use>
      <animateTransform attributeName="transform" type="rotate"
        values="44;40;46;44" dur="9s" calcMode="spline"
        keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- crowning curl tendril, slow drift -->
  <g transform="translate(200 70)">
    <path d="M0 0 C 30 -8 38 -34 18 -44 C 2 -52 -2 -34 12 -30"
          class="an05-tendril" fill="none" stroke-width="2" stroke-linecap="round" opacity=".8"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum"
      values="0;5;-5;0" dur="12s" calcMode="spline"
      keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
  </g>
</svg>
<div class="cap">Peacock Curl</div>
<script>
(function(){
  "use strict";
  // live re-theme: {type:'forever:theme'}; every colour is a CSS token, so the flip repaints itself
  addEventListener("message",function(e){var d=e.data;if(d&&d.type==="forever:theme"&&(d.theme==="light"||d.theme==="dark"))
    document.documentElement.setAttribute("data-theme",d.theme);});
  var svg=document.getElementById("an05-stage");
  if(!svg)return;
  var reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  if(reduce){
    // settle to one static, on-brand unfurled frame and stop
    try{ svg.setCurrentTime(7.5); svg.pauseAnimations(); }catch(e){}
    return;
  }
  function onVis(){
    if(document.hidden){ try{svg.pauseAnimations();}catch(e){} }
    else { try{svg.unpauseAnimations();}catch(e){} }
  }
  document.addEventListener("visibilitychange",onVis);
})();
</script>
</body>
</html>
