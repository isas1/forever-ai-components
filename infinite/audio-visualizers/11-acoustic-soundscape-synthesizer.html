<style>
  :root {
    --pa-board: #3D5A45;
    --pa-board-deep: #27412F;
    --pa-blush: #E8B4A8;
    --pa-mint: #9FC7B0;
    --pa-butter: #E9C96A;
  }
  .pa01-wrap, .pa01-wrap * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--pa-board-deep);
    color: var(--pa-blush);
    font-family: 'Work Sans', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .pa01-wrap {
    width: 100%;
    max-width: 420px;
    background: var(--pa-board);
    border: 1px solid rgba(232, 180, 168, 0.2);
    border-radius: 16px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    box-shadow: 0 16px 36px rgba(18, 32, 22, 0.5);
  }
  .pa01-header {
    text-align: center;
  }
  .pa01-title {
    font-family: 'Caprasimo', serif;
    font-size: 24px;
    color: var(--pa-blush);
  }
  .pa01-sub {
    font-size: 12px;
    color: var(--pa-mint);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 2px;
  }
  .pa01-canvas-box {
    width: 100%;
    height: 100px;
    background: var(--pa-board-deep);
    border-radius: 10px;
    border: 1px solid rgba(159, 199, 176, 0.15);
    overflow: hidden;
  }
  .pa01-wrap canvas { width: 100%; height: 100%; display: block; }
  .pa01-btn {
    font-family: 'Work Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--pa-board-deep);
    background: var(--pa-blush);
    border: none;
    padding: 10px 24px;
    border-radius: 9999px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pa01-btn:hover { background: var(--pa-butter); transform: scale(1.02); }
  .pa01-btn:focus-visible { outline: 2px solid var(--pa-butter); outline-offset: 3px; }
  .pa01-btn:active { transform: scale(0.96); }
  .pa01-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--pa-board-deep);
    opacity: 0.4;
  }
  .pa01-btn.pa01-active .pa01-dot {
    background: var(--pa-board-deep);
    opacity: 1;
    box-shadow: 0 0 6px var(--pa-board-deep);
  }


.pa01-cap{position:fixed;left:10px;bottom:8px;font:10px system-ui;opacity:.55;pointer-events:none}
@media(prefers-reduced-motion:reduce){.pa01-wrap, .pa01-wrap *{animation:none!important;transition:none!important}}

.pa01-wrap[data-paused] *,.pa01-wrap[data-paused]{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){.pa01-wrap,.pa01-wrap *{animation:none!important;transition:none!important}}
@container fit-11-acoustic-soundscape-synthesizer (max-width:300px){.pa01-wrap{width:calc(100% - 16px);padding:14px;gap:10px}.pa01-title{font-size:18px}.pa01-sub{font-size:12px}.pa01-canvas-box{height:66px}.pa01-btn{padding:8px 14px;font-size:12px}.pa01-cap{display:none}}
@container fit-11-acoustic-soundscape-synthesizer (max-width:210px){.pa01-wrap{padding:10px;gap:6px}.pa01-header{display:none}.pa01-canvas-box{height:54px}.pa01-btn{font-size:12px;padding:8px 12px}}
body{width:100%;container-type:inline-size;container-name:fit-11-acoustic-soundscape-synthesizer}

{
 "file": "infinite/audio-visualizers/11-acoustic-soundscape-synthesizer.html",

 "description": "Acoustic Soundscape control in the Artisan Café system.",

<body>
<div class="pa01-wrap" role="region" aria-label="Café Soundscape">
  <div class="pa01-header">
    <h2 class="pa01-title">artisan café</h2>
    <p class="pa01-sub">ambient soundscape · espresso lounge</p>
  </div>
  <div class="pa01-canvas-box">
    <canvas id="pa01-cv" width="372" height="100"></canvas>
  </div>
  <button class="pa01-btn" id="pa01-toggleBtn">
    <span class="pa01-dot"></span>
    <span id="pa01-btnText">Listen to café</span>
  </button>
</div>
<div class="pa01-cap" aria-hidden="true">Acoustic Soundscape</div>
<script>
(()=>{
  const tileRoot = document.querySelector('.pa01-wrap');
  const pauseCSS = () => tileRoot.toggleAttribute('data-paused', document.hidden);
  document.addEventListener('visibilitychange', pauseCSS); pauseCSS();

  // Local frame lifecycle: stop hidden work, repaint reduced-motion state on input.
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const frames = new Map(), drivers = new Set(); let painting = false;
  let demoEnabled=window.__foreverPreview?window.__foreverPreview.demoEnabled!==false:true,destroyed=false;
  function scheduleFrame(fn) {
    if(fn===draw&&!demoEnabled&&!isPlaying)return;
    drivers.add(fn);
    if (document.hidden || frames.has(fn) || (motion.matches && painting)) return;
    frames.set(fn, requestAnimationFrame(t => {
      frames.delete(fn); if (document.hidden) return;
      painting = true; try { fn(t); } finally { painting = false; }
    }));
  }
  function stopDemo(){demoEnabled=false;if(!isPlaying){const id=frames.get(draw);if(id)cancelAnimationFrame(id);frames.delete(draw);}}
  window.addEventListener('forever:interactive',stopDemo);document.addEventListener('pointerdown',stopDemo,{capture:true});document.addEventListener('click',stopDemo,{capture:true});
  document.addEventListener('keydown',e=>{if(e.key!=='Tab'&&!e.metaKey&&!e.ctrlKey&&!e.altKey)stopDemo();},{capture:true});
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { frames.forEach(cancelAnimationFrame); frames.clear(); }
    else drivers.forEach(scheduleFrame);
  });
  const repaint = () => { if (motion.matches) drivers.forEach(scheduleFrame); };
  ['click','input','pointermove'].forEach(type => document.addEventListener(type, repaint));
  motion.addEventListener('change', () => { reduce = motion.matches; drivers.forEach(scheduleFrame); });

  let audioCtx = null, isPlaying = false, running = true;
  let masterGain, steamGain, rainGain, bossaGain, chordTimer;
  const canvas = document.getElementById('pa01-cv');
  const ctx = canvas.getContext('2d');
  const btn = document.getElementById('pa01-toggleBtn');
  const btnText = document.getElementById('pa01-btnText');
  let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let phase = 0;

  document.addEventListener('visibilitychange', () => {
    running = !document.hidden;
    if (document.hidden) { clearTimeout(chordTimer); if (audioCtx) audioCtx.suspend(); }
    else if (audioCtx && isPlaying) { audioCtx.resume(); playNextChord(); }
  });

  function initAudio() {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();
    masterGain = audioCtx.createGain();
    masterGain.gain.setValueAtTime(0.6, audioCtx.currentTime);
    masterGain.connect(audioCtx.destination);

    // Steam
    steamGain = audioCtx.createGain();
    steamGain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    const sf = audioCtx.createBiquadFilter();
    sf.type = 'bandpass'; sf.frequency.value = 1400; sf.Q.value = 3;
    const sBuf = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
    const sd = sBuf.getChannelData(0);
    for (let i = 0; i < sd.length; i++) sd[i] = Math.random() * 2 - 1;
    const sSrc = audioCtx.createBufferSource();
    sSrc.buffer = sBuf; sSrc.loop = true;
    sSrc.connect(sf); sf.connect(steamGain); steamGain.connect(masterGain);
    sSrc.start();

    // Bossa chords
    bossaGain = audioCtx.createGain();
    bossaGain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    bossaGain.connect(masterGain);
  }
  function teardown(){destroyed=true;clearTimeout(chordTimer);frames.forEach(cancelAnimationFrame);frames.clear();drivers.clear();if(audioCtx&&audioCtx.state!=='closed')audioCtx.close();}
  window.addEventListener('pagehide',teardown,{once:true});

  const chords = [
    [220, 261.6, 329.6, 392],    // Am7
    [146.8, 220, 261.6, 349.2],  // Dm7
    [196, 246.9, 293.6, 392],    // G7
    [130.8, 196, 246.9, 329.6]   // Cmaj7
  ];
  let cIdx = 0;

  function playNextChord() {
    if (!isPlaying || !audioCtx || document.hidden) return;
    clearTimeout(chordTimer);
    const now = audioCtx.currentTime;
    chords[cIdx].forEach((f, i) => {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, now + i * 0.08);
      g.gain.setValueAtTime(0.001, now);
      g.gain.exponentialRampToValueAtTime(0.12, now + 0.2 + i * 0.08);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 3.2);
      osc.connect(g); g.connect(bossaGain);
      osc.start(now + i * 0.08); osc.stop(now + 3.4);
    });
    cIdx = (cIdx + 1) % chords.length;
    chordTimer = setTimeout(playNextChord, 3600);
  }

  btn.addEventListener('click', () => {
    if (!audioCtx) initAudio();
    isPlaying = !isPlaying;
    if (isPlaying) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      btn.classList.add('pa01-active');
      btnText.textContent = 'Pause soundscape';
      btn.setAttribute('aria-pressed', 'true');
      playNextChord();
    } else {
      btn.classList.remove('pa01-active');
      btnText.textContent = 'Listen to café';
      btn.setAttribute('aria-pressed', 'false');
      if (chordTimer) clearTimeout(chordTimer);
      audioCtx.suspend();
    }
    scheduleFrame(draw);
  });

  function draw() {
    if (!running||(!demoEnabled&&!isPlaying)) return;
    ctx.fillStyle = '#27412F';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (!reduce) phase += isPlaying ? 0.04 : 0.015;

    ctx.beginPath();
    ctx.strokeStyle = isPlaying ? '#E9C96A' : '#E8B4A8';
    ctx.lineWidth = 2;
    ctx.globalAlpha = isPlaying ? 0.9 : 0.4;
    const amp = isPlaying ? 22 : 10;
    for (let x = 0; x <= canvas.width; x += 4) {
      const y = canvas.height * 0.5 + Math.sin(x * 0.03 + phase) * amp;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    scheduleFrame(draw);
  }
  if(demoEnabled)scheduleFrame(draw);else draw();
})();
</script>
</body>
