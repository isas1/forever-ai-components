<!DOCTYPE html>
<html lang="en">
<head>
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta charset="UTF-8">
<meta name="description" content="Additive glowing particles in sage, tan and stone trail the pointer on dark canvas, drifting on their own when idle.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursor Trail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
/* theme tokens — dark values are the defaults (solid-dark-bg contract);
   the light re-theme is the [data-theme="light"] block. --trail-* feed the
   canvas: additive glow on dark, plain source-over ink on light. */
:root{
  --bg-900:#08090d;
  --text-2:#8a91a8; --text-3:#565d73; --cap-o:.7;
  --trail-1:#B1CCA4; --trail-2:#D8B297; --trail-3:#AFBCA9;
  --trail-blend:lighter; --trail-a:1; --trail-fade:rgba(0,0,0,0);
  --font-display:"Space Grotesk",system-ui,sans-serif;
  --ease-out-soft:cubic-bezier(0.22,1,0.36,1);
}
:root[data-theme="light"]{
  --bg-900:#f1f3ef;
  --text-2:#414a3e; --text-3:#6b7566; --cap-o:.62;
  --trail-1:#537642; --trail-2:#986139; --trail-3:#617359;
  --trail-blend:source-over; --trail-a:.8; --trail-fade:rgba(241,243,239,0);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;height:100%;overflow:hidden;}
html,body{background:var(--bg-900);}
.c10-frame{position:absolute;inset:0;display:grid;place-items:center;}
.c10-stage{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg-900);}
.c10-trail{position:absolute;inset:0;cursor:crosshair;}
.c10-trail canvas{display:block;width:100%;height:100%;}
.c10-trail__hint{position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--font-display);font-size:13px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--text-3);pointer-events:none;transition:opacity 280ms var(--ease-out-soft);}
.c10-trail--active .c10-trail__hint{opacity:0;}
.caption{position:absolute;left:12px;bottom:10px;z-index:5;
  font-family:var(--font-display);font-size:11px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--text-2);opacity:var(--cap-o);pointer-events:none;}
.c10-trail:focus-visible{outline:2px solid var(--trail-1);outline-offset:-4px;}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/backgrounds/10-cursor-trail.html",
 "title": "Cursor Trail",
 "description": "Glowing sage, tan, and stone particles trail the pointer with additive blending on a dark canvas; idle drift animation keeps the tile alive without interaction.",
 "useWhen": "Dark hero backgrounds, creative portfolio canvases, or interactive demos where pointer feedback adds ambient delight.",
 "avoidWhen": "Light-background UIs (background hardcoded dark), content-heavy layouts where trail competes with text, or contexts without pointer input (pure touch kiosks).",

 "editableAreas": [

  "particle size range (r: 1.5–5)",
  "decay rate (0.012 + random*0.02)",
  "idle drift speed (auto.t += 0.018)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [

 ],
 "knownLimitations": [

  "Touch support uses passive touchmove so emit fires but no cursor feedback is visible on touch devices",
  "Control state is local to each mount; format changes preserve preview takeover but create a fresh source instance.",
  "State remains local to each mounted instance; format/theme remount preserves takeover, not component values."
 ],
 "tier": "curated",
 "labels": [
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "animation-heavy",
  "light-ready"
 ],
 "tags": [
  "cursor",
  "trail",
  "particles",
  "canvas",

  "background"
 ]
}
</script>
</head>
<body>
<div class="c10-frame">
  <div class="c10-stage">
    <div class="c10-trail" data-c10 tabindex="0" aria-label="Particle trail. Use arrow keys to steer.">
      <canvas class="c10-canvas"></canvas>
      <span class="c10-trail__hint">move pointer</span>
    </div>
    <span class="caption">Cursor Trail</span>
  </div>
</div>
<script>
(function(){
  "use strict";
  var REDUCED=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function setupCanvas(host,draw){
    var canvas=host.querySelector("canvas"),ctx=canvas.getContext("2d");
    var dpr=Math.min(window.devicePixelRatio||1,2),w=0,h=0;
    function resize(){
      var r=host.getBoundingClientRect();
      w=Math.max(1,Math.round(r.width));h=Math.max(1,Math.round(r.height));
      canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);
      if(draw.onResize) draw.onResize(w,h);
    }
    if(window.ResizeObserver){new ResizeObserver(resize).observe(host);}
    else{window.addEventListener("resize",resize);}
    resize();
    return {ctx:ctx,get w(){return w;},get h(){return h;}};
  }

  var demoEnabled=window.__foreverPreview?.demoEnabled!==false,wake=function(){};
  function stopDemo(){demoEnabled=false;}
  addEventListener("forever:interactive",stopDemo);
  document.addEventListener("pointerdown",stopDemo,{capture:true});
  document.addEventListener("click",stopDemo,{capture:true});
  function runLoop(tick){
    var running=false,id=0;
    function loop(){id=0;running=false;tick();if(demoEnabled||particles.length)start();}
    function start(){if(running||document.hidden)return;running=true;id=requestAnimationFrame(loop);}
    function stop(){running=false;cancelAnimationFrame(id);id=0;}
    document.addEventListener("visibilitychange",function(){document.hidden?stop():start();});
    start();return start;
  }

  var host=document.querySelector("[data-c10]");
  if(!host) return;
  var root=document.documentElement;
  var COLORS=["#B1CCA4","#D8B297","#AFBCA9"],BLEND="lighter",ALPHA=1,FADE="rgba(0,0,0,0)";
  var MAX=120;
  var particles=[];
  var pointer={x:0,y:0,active:false};
  var auto={t:Math.random()*1000}; // idle drift keeps tile alive at rest
  var cv=setupCanvas(host,{onResize:function(){if(cv){if(REDUCED)staticFrame();else render();}}});
  pointer.x=cv.w/2;pointer.y=cv.h/2;

  // Precompute one soft radial-gradient sprite per color once; draw scaled per frame
  // instead of allocating a fresh gradient for every particle every frame.
  var SPRITE=64; // sprite radius in px (drawn down to particle size)
  var sprites=[];
  function makeSprites(){
    sprites=COLORS.map(function(c){
      var s=document.createElement("canvas");s.width=s.height=SPRITE*2;
      var sc=s.getContext("2d");
      var g=sc.createRadialGradient(SPRITE,SPRITE,0,SPRITE,SPRITE,SPRITE);
      g.addColorStop(0,c);g.addColorStop(1,FADE);
      sc.fillStyle=g;sc.beginPath();sc.arc(SPRITE,SPRITE,SPRITE,0,Math.PI*2);sc.fill();
      return s;
    });
  }
  // canvas colours live in CSS tokens: read once at start and once per theme switch,
  // rebuilding the cached sprites (they bake the palette in).
  function syncTheme(){
    var cs=getComputedStyle(root);
    COLORS=[(cs.getPropertyValue("--trail-1")||"#B1CCA4").trim(),
            (cs.getPropertyValue("--trail-2")||"#D8B297").trim(),
            (cs.getPropertyValue("--trail-3")||"#AFBCA9").trim()];
    BLEND=(cs.getPropertyValue("--trail-blend")||"lighter").trim();
    ALPHA=parseFloat(cs.getPropertyValue("--trail-a"))||1;
    FADE=(cs.getPropertyValue("--trail-fade")||"rgba(0,0,0,0)").trim();
    makeSprites();
  }
  addEventListener("message",function(e){
    var d=e.data;
    if(d&&d.type==="forever:theme"&&(d.theme==="light"||d.theme==="dark")){
      root.setAttribute("data-theme",d.theme);syncTheme();if(REDUCED) staticFrame();else render();
    }
  });
  syncTheme();

  function emit(x,y,n){
    for(var i=0;i<n;i++){
      particles.push({x:x,y:y,
        vx:(Math.random()-0.5)*1.6,vy:(Math.random()-0.5)*1.6,
        life:1,decay:0.012+Math.random()*0.02,
        r:1.5+Math.random()*3.5,ci:(Math.random()*COLORS.length)|0});
    }
    if(particles.length>MAX) particles.splice(0,particles.length-MAX);
  }

  function onMove(e){
    var r=host.getBoundingClientRect();
    var pt=e.touches?e.touches[0]:e;
    pointer.x=pt.clientX-r.left;pointer.y=pt.clientY-r.top;
    if(!pointer.active){pointer.active=true;host.classList.add("c10-trail--active");}
    emit(pointer.x,pointer.y,3);if(REDUCED)render();else wake();
  }
  host.addEventListener("pointermove",onMove);
  host.addEventListener("pointerdown",onMove);

  host.addEventListener("mouseleave",function(){pointer.active=false;});

  function render(){
    var ctx=cv.ctx,w=cv.w,h=cv.h;ctx.clearRect(0,0,w,h);
    if(demoEnabled&&!pointer.active&&w>0){
      auto.t+=0.018;
      var ax=w*(0.5+0.32*Math.cos(auto.t*0.9));
      var ay=h*(0.5+0.3*Math.sin(auto.t*1.3));
      emit(ax,ay,2);
    }
    ctx.globalCompositeOperation=BLEND;
    for(var i=particles.length-1;i>=0;i--){
      var p=particles[i];
      p.x+=p.vx;p.y+=p.vy;p.vx*=0.96;p.vy*=0.96;p.vy+=0.015;
      p.life-=p.decay;
      if(p.life<=0){particles.splice(i,1);continue;}
      ctx.globalAlpha=p.life*ALPHA;
      var rad=p.r*3,d=rad*2;
      ctx.drawImage(sprites[p.ci],p.x-rad,p.y-rad,d,d);
    }
    ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over";
  }

  function staticFrame(){
    var ctx=cv.ctx;ctx.clearRect(0,0,cv.w,cv.h);
    ctx.globalCompositeOperation=BLEND;
    for(var k=0;k<40;k++){
      var px=cv.w/2+(Math.random()-0.5)*cv.w*0.5;
      var py=cv.h/2+(Math.random()-0.5)*cv.h*0.5;
      var rr=4+Math.random()*8;
      ctx.globalAlpha=0.5*ALPHA;
      ctx.drawImage(sprites[k%3],px-rr,py-rr,rr*2,rr*2);
    }
    ctx.globalAlpha=1;ctx.globalCompositeOperation="source-over";
  }

  host.addEventListener('keydown',e=>{if(!/^Arrow(Left|Right|Up|Down)$/.test(e.key))return;e.preventDefault();stopDemo();
    pointer.x=Math.max(0,Math.min(cv.w,pointer.x+(e.key==='ArrowRight'?12:e.key==='ArrowLeft'?-12:0)));
    pointer.y=Math.max(0,Math.min(cv.h,pointer.y+(e.key==='ArrowDown'?12:e.key==='ArrowUp'?-12:0)));
    emit(pointer.x,pointer.y,3);if(REDUCED)render();else wake();});
  if(REDUCED) staticFrame();else wake=runLoop(render);
})();
</script>
</body>
</html>
