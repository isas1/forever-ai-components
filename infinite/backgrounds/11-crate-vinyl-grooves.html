<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Crate Vinyl Grooves — interactive concentric vinyl-groove canvas with pointer deflection ripples and record counter.">
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crate Vinyl Grooves</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
:root{--b:#131316;--i:#F1F1F4;--o:#000;--c:#7B95C4;--grv:rgba(241,241,244,.22);color-scheme:dark}
:root[data-theme="light"]{--b:#EFF0F3;--i:#000;--o:#EFF0F3;--c:#2B4473;--grv:rgba(0,0,0,.22);color-scheme:light}
html,body{margin:0;height:100%;overflow:hidden;background:var(--b);color:var(--i);font:14px/1.3 "Avenir Next",Avenir,system-ui,sans-serif}
.cr20-st,.cr20-st *{box-sizing:border-box}
.cr20-st{position:relative;width:100%;height:100%;display:grid;place-items:center;background:var(--b);color:var(--i);overflow:hidden}
.cr20-st :focus-visible{outline:2px solid var(--c);outline-offset:2px}
.cr20-gv{position:absolute;inset:0;display:grid;place-items:center;touch-action:pan-y}
.cr20-cv{position:absolute;inset:0;width:100%;height:100%}
.cr20-c{position:relative;display:grid;place-items:center;align-content:center;gap:clamp(6px,2.5vmin,10px);width:clamp(108px,42vmin,164px);height:clamp(108px,42vmin,164px);border-radius:50%;background:var(--b);border:1.5px solid var(--i);text-align:center}
.cr20-p{margin:0;font-weight:600;font-size:clamp(11px,3.6vmin,15px)}
.cr20-b{display:inline-flex;align-items:center;justify-content:center;height:clamp(26px,9vmin,40px);padding:0 clamp(10px,3.5vmin,18px);border-radius:999px;border:1.5px solid var(--i);background:var(--i);color:var(--o);font:inherit;font-size:clamp(10.5px,3.2vmin,14px);font-weight:600;white-space:nowrap;cursor:pointer;touch-action:manipulation;transition:scale .15s}
.cr20-b:active{scale:.96}
.cr20-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.cr20-cap{position:absolute;left:10px;bottom:8px;font:500 11px/1 ui-monospace,monospace;color:var(--i);opacity:.45;letter-spacing:.04em;text-transform:uppercase;pointer-events:none;user-select:none}
@media (prefers-reduced-motion:reduce){.cr20-st *{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/backgrounds/11-crate-vinyl-grooves.html",
 "title": "Crate Vinyl Grooves",
 "description": "HiDPI Canvas 2D concentric vinyl grooves that part around the pointer, ripple outward on press, and drift when idle.",
 "useWhen": "Hero surfaces, audio player backdrops, and interactive ambient panels.",
 "avoidWhen": "Small text-heavy buttons where texture reduces legibility.",
 "agentPrompt": "Edit --b/--i/--c/--l tokens in :root and [data-theme=\"light\"].",
 "editableAreas": [
  "theme CSS tokens (--b/--i/--c/--l), data arrays & timings"
 ],
 "preserveElements": [

 ],

 ],
 "tier": "curated",
 "labels": [

<body>
<div class="cr20-st" id="cr20-st"></div>
<div class="cr20-cap" aria-hidden="true">Vinyl Grooves</div>
<script>(()=>{
  const s=document.getElementById('cr20-st'),RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  s.innerHTML=`<div class="cr20-gv"><canvas class="cr20-cv" aria-hidden="true"></canvas><div class="cr20-c"><p class="cr20-p">No records yet</p><button type="button" class="cr20-b">Add record</button></div><div class="cr20-sr" aria-live="polite"></div></div>`;
  const gv=s.querySelector('.cr20-gv'),cv=s.querySelector('.cr20-cv'),ctx=cv.getContext('2d'),btn=s.querySelector('.cr20-b'),txt=s.querySelector('.cr20-p'),sr=s.querySelector('.cr20-sr');
  let W=0,H=0,col='',raf=0,last=0,n=0,rip=[],demo=!RM()&&!(window.__foreverPreview&&window.__foreverPreview.demoEnabled===false),timer=0,t0=performance.now();
  const pt={x:0,y:0,s:0,gx:0,gy:0,gs:0};
  const draw=()=>{if(!W||!H)return;ctx.clearRect(0,0,W,H);ctx.strokeStyle=col;ctx.lineWidth=1;const cx=W/2,cy=H/2,R=Math.hypot(W,H)/2,r0=Math.min(94,gv.querySelector('.cr20-c').offsetWidth*.56);
    for(let r=r0;r<R+12;r+=11){ctx.beginPath();const seg=Math.max(40,r*.45|0);
      for(let a=0;a<=seg;a++){const th=a/seg*Math.PI*2;let x=cx+Math.cos(th)*r,y=cy+Math.sin(th)*r;
        if(pt.s>.002){const dx=x-pt.x,dy=y-pt.y,d2=dx*dx+dy*dy,d=Math.sqrt(d2)||1,f=pt.s*22*Math.exp(-d2/7500);x+=dx/d*f;y+=dy/d*f}
        for(const q of rip){const dx=x-q.x,dy=y-q.y,d=Math.hypot(dx,dy)||1,ph=d-q.r;if(Math.abs(ph)<40){const f=q.a*9*Math.cos(ph/40*Math.PI/2)**2*Math.sin(ph/9);x+=dx/d*f;y+=dy/d*f}}
        a?ctx.lineTo(x,y):ctx.moveTo(x,y)}
      ctx.stroke()}};
  const frame=now=>{raf=0;if(document.hidden||RM())return;const dt=Math.min(40,now-last);last=now;
    if(demo){const t=(now-t0)/1000;pt.gx=W/2+Math.cos(t*1.4)*W*.28;pt.gy=H/2+Math.sin(t*1.1)*H*.28;pt.gs=1}
    pt.x+=(pt.gx-pt.x)*.2;pt.y+=(pt.gy-pt.y)*.2;pt.s+=(pt.gs-pt.s)*.12;
    rip=rip.filter(q=>{q.r+=dt*.36;q.a=1-q.r/q.max;return q.a>0});draw();
    if(demo||rip.length||Math.abs(pt.gs-pt.s)>.002||Math.hypot(pt.gx-pt.x,pt.gy-pt.y)>.3)raf=requestAnimationFrame(frame)};
  const kick=()=>{if(!raf&&!RM()&&!document.hidden){last=performance.now();raf=requestAnimationFrame(frame)}};
  const size=()=>{const r=gv.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;if(!W||!H)return;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);col=getComputedStyle(gv).getPropertyValue('--grv').trim()||'rgba(241,241,244,.22)';draw()};
  const ripple=(x,y)=>{if(!W||!H)return;rip.push({x,y,r:0,a:1,max:Math.hypot(W,H)});rip.length>4&&rip.shift();kick()};
  const loc=e=>{const r=gv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  const halt=()=>{demo=false;clearInterval(timer);timer=0};
  gv.addEventListener('pointermove',e=>{halt();[pt.gx,pt.gy]=loc(e);if(pt.gs===0&&pt.s<.01){pt.x=pt.gx;pt.y=pt.gy}pt.gs=1;kick()});
  ['pointerleave','pointercancel'].forEach(t=>gv.addEventListener(t,()=>{pt.gs=0;kick()}));
  gv.addEventListener('pointerdown',e=>{halt();if(!e.target.closest('button'))ripple(...loc(e))});
  btn.addEventListener('click',()=>{halt();n++;txt.textContent=n===1?'1 record':n+' records';sr.textContent=txt.textContent;ripple(W/2,H/2)});
  size();if(typeof ResizeObserver==='function')new ResizeObserver(size).observe(gv);

  window.addEventListener('forever:interactive',halt);
  document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);clearInterval(timer);raf=timer=0}else if(demo){kick();if(!timer&&!RM())timer=setInterval(()=>ripple(W/2,H/2),1800)}});
  window.addEventListener('message',e=>{if(e.data&&e.data.type==='forever:theme'&&(e.data.theme==='light'||e.data.theme==='dark')){document.documentElement.setAttribute('data-theme',e.data.theme);requestAnimationFrame(size)}});
  if(demo){timer=setInterval(()=>!document.hidden&&ripple(W/2,H/2),1800);kick()}
})();</script>
</body>
</html>
