<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="A curtain of red, blue, yellow and black bars parts left/right to reveal a primary-red circle with gold ring on a dark stage, looping.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stage Reveal</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark defaults (solid-dark-bg contract); light re-theme in [data-theme="light"].
     --bh11-bar is the curtain's neutral bar: it sits a hair off the stage colour in both themes. */
  :root{--bh11-bg:#101012;--bh11-red:#e63329;--bh11-blu:#1f4ea8;--bh11-yel:#f4c20d;--bh11-bar:#0e0e10;--bh11-edge:#1d1d20;--bh11-cap:#fff;--bh11-cap-o:.42}
  :root[data-theme="light"]{--bh11-bg:#f6f2ea;--bh11-red:#cc2b1f;--bh11-blu:#1f4ea8;--bh11-yel:#ad7f08;--bh11-bar:#f2ece0;--bh11-edge:#ded6c6;--bh11-cap:#1b1b20;--bh11-cap-o:.5}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:var(--bh11-bg);overflow:hidden}
  #bh11-stage{position:fixed;inset:0;width:100%;height:100%;background:var(--bh11-bg)}
  .bh11-svg{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* one 4.6s stage cycle: part (8-40%), hold open (40-56%), close (56-88%), hold shut.
     animation-name lives on the same id-scoped rules as transform-origin so the shorthand
     above can't outrank it; the negative delays on each bar start the wall mid-reveal. */
  #bh11-curtain rect{
    transform-box:fill-box;transform-origin:center;
    animation-duration:4.6s;animation-timing-function:cubic-bezier(.76,0,.24,1);
    animation-iteration-count:infinite;animation-fill-mode:both;
  }
  #bh11-curtain g.bh11-L rect{transform-origin:left center;animation-name:bh11-partL}
  #bh11-curtain g.bh11-R rect{transform-origin:right center;animation-name:bh11-partR}

  @keyframes bh11-partL{
    0%,8%{transform:translateX(0)}
    40%,56%{transform:translateX(-118%)}
    88%,100%{transform:translateX(0)}
  }
  @keyframes bh11-partR{
    0%,8%{transform:translateX(0)}
    40%,56%{transform:translateX(118%)}
    88%,100%{transform:translateX(0)}
  }

  #bh11-circle{
    transform-box:fill-box;transform-origin:center;
    animation:bh11-rise 4.6s -1.51s cubic-bezier(.34,1.4,.5,1) infinite both;
  }
  @keyframes bh11-rise{
    0%,18%{transform:scale(.18);opacity:0}
    40%,56%{transform:scale(1);opacity:1}
    78%,100%{transform:scale(.18);opacity:0}
  }
  #bh11-ring{
    transform-box:fill-box;transform-origin:center;
    animation:bh11-ring 4.6s -1.51s cubic-bezier(.34,1.3,.5,1) infinite both;
  }
  @keyframes bh11-ring{
    0%,20%{transform:scale(.4);opacity:0}
    42%{transform:scale(1);opacity:.9}
    58%{transform:scale(1.16);opacity:.5}
    72%,100%{transform:scale(1.5);opacity:0}
  }
  /* the two cue triangles never stop — they turn right through the closed half of the cycle */
  .bh11-tri{
    transform-box:fill-box;transform-origin:center;
    animation:bh11-cue 4.6s -1.51s linear infinite both;
  }
  @keyframes bh11-cue{ from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  /* wing markers ride up and down the side rails, one against the other */
  .bh11-mark{
    transform-box:fill-box;transform-origin:center;
    animation:bh11-mark 4.6s -1.51s ease-in-out infinite both;
  }
  @keyframes bh11-mark{0%,100%{transform:translateY(-30px)}50%{transform:translateY(30px)}}

  .cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--bh11-cap);opacity:var(--bh11-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
    #bh11-curtain .bh11-L rect{transform:translateX(-118%)}
    #bh11-curtain .bh11-R rect{transform:translateX(118%)}
    #bh11-circle{transform:scale(1);opacity:1}
    #bh11-ring{opacity:0}
    .bh11-tri{transform:rotate(180deg)}
    .bh11-mark{transform:none}
  }
</style>

</head>
<body>
<div id="bh11-stage" role="img" aria-label="Bauhaus composition: a curtain of red, blue, yellow and black bars parts to reveal a single primary red circle on a dark stage.">
  <svg class="bh11-svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="bh11-glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="var(--bh11-red)" stop-opacity=".55"/>
        <stop offset="60%" stop-color="var(--bh11-red)" stop-opacity=".12"/>
        <stop offset="100%" stop-color="var(--bh11-red)" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <rect x="0" y="0" width="400" height="400" fill="var(--bh11-bg)"/>
    <rect x="34" y="34" width="332" height="332" fill="none" stroke="var(--bh11-edge)" stroke-width="2"/>

    <circle cx="200" cy="200" r="150" fill="url(#bh11-glow)"/>

    <g id="bh11-ring">
      <circle cx="200" cy="200" r="92" fill="none" stroke="var(--bh11-yel)" stroke-width="6"/>
    </g>

    <g id="bh11-circle">
      <circle cx="200" cy="200" r="74" fill="var(--bh11-red)"/>
      <circle cx="200" cy="200" r="74" fill="none" stroke="var(--bh11-bg)" stroke-width="3"/>
    </g>

    <g id="bh11-curtain">
      <g class="bh11-L">
        <rect x="0"   y="0"   width="50" height="400" fill="var(--bh11-blu)" style="animation-delay:-1.51s"/>
        <rect x="50"  y="0"   width="50" height="400" fill="var(--bh11-bar)" style="animation-delay:-1.46s"/>
        <rect x="100" y="0"   width="50" height="400" fill="var(--bh11-yel)" style="animation-delay:-1.41s"/>
        <rect x="150" y="0"   width="50" height="400" fill="var(--bh11-bar)" style="animation-delay:-1.36s"/>
      </g>
      <g class="bh11-R">
        <rect x="200" y="0"   width="50" height="400" fill="var(--bh11-bar)" style="animation-delay:-1.36s"/>
        <rect x="250" y="0"   width="50" height="400" fill="var(--bh11-red)" style="animation-delay:-1.41s"/>
        <rect x="300" y="0"   width="50" height="400" fill="var(--bh11-bar)" style="animation-delay:-1.46s"/>
        <rect x="350" y="0"   width="50" height="400" fill="var(--bh11-blu)" style="animation-delay:-1.51s"/>
      </g>
    </g>

    <polygon class="bh11-tri" points="200,40 214,66 186,66" fill="var(--bh11-yel)"/>
    <polygon class="bh11-tri" points="200,360 214,334 186,334" fill="var(--bh11-blu)" style="animation-direction:reverse"/>
    <rect class="bh11-mark" x="40" y="194" width="20" height="12" fill="var(--bh11-red)"/>
    <rect class="bh11-mark" x="340" y="194" width="20" height="12" fill="var(--bh11-yel)" style="animation-direction:reverse"/>
  </svg>
  <div class="cap">Stage Reveal</div>
</div>

<script>
(function(){
  "use strict";
  var stage = document.getElementById("bh11-stage");
  if(!stage) return;
  var reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
  // live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'} — CSS tokens do the rest
  addEventListener("message",function(e){ var d=e.data;
    if(d&&d.type==="forever:theme"&&(d.theme==="light"||d.theme==="dark")) document.documentElement.setAttribute("data-theme",d.theme);
  });
  var nodes = stage.querySelectorAll("[style*='animation'],#bh11-curtain rect,#bh11-circle,#bh11-ring,.bh11-tri");

  function setState(s){
    var all = stage.querySelectorAll("*");
    for(var i=0;i<all.length;i++){ all[i].style.animationPlayState = s; }
  }
  if(reduce) return;

  document.addEventListener("visibilitychange", function(){
    setState(document.hidden ? "paused" : "running");
  });
})();
</script>
</body>
</html>
