<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="description" content="Error Manifesto — Neo-Brutalism. A self-contained, zero-dependency animated web component."><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Error Manifesto</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract);
     the light re-theme is the [data-theme="light"] block */
  :root{
    --bru-bg:#111; --bru-ink:#fff; --bru-accent:#ff2d00; --bru-yellow:#ffe640; --cap-o:.35;
  }
  :root[data-theme="light"]{
    --bru-bg:#f2f0ea; --bru-ink:#1c1a15; --bru-accent:#d12500; --bru-yellow:#7a6a00; --cap-o:.5;
  }
html,body{margin:0;height:100%;overflow:hidden;background:var(--bru-bg);display:flex;align-items:center;justify-content:center}
.bru-cap{position:fixed;left:8px;bottom:7px;font:600 10px ui-monospace,monospace;color:var(--bru-ink);opacity:var(--cap-o);letter-spacing:.5px;pointer-events:none;z-index:99}
.bru-error{
  border:3px solid var(--bru-ink);
  box-shadow:6px 6px 0 var(--bru-accent);
  padding:28px 32px 24px;
  max-width:88%;
  text-align:left;
  background:var(--bru-bg);
}
.bru-etype{
  font:900 .72rem/1 "Arial Black","Arial",Impact,system-ui,sans-serif;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--bru-accent);
  margin-bottom:10px;
}
.bru-code{
  font:900 3.8rem/1 "Arial Black","Arial",Impact,system-ui,sans-serif;
  letter-spacing:-.01em;
  text-transform:uppercase;
  margin:0 0 8px;
}
.bru-divider{border:none;border-top:2px solid currentColor;margin:12px 0;}
.bru-desc{
  font:700 .95rem/1.35 system-ui,"Arial",sans-serif;
  letter-spacing:.03em;
  text-transform:uppercase;
  margin:0 0 6px;
}
.bru-meta{
  font:600 .72rem/1.5 ui-monospace,monospace;
  opacity:.6;
  text-transform:uppercase;
  letter-spacing:.08em;
}
@keyframes bru-cycle{
  0%,19%{color:var(--bru-ink)}
  20%,39%{color:var(--bru-accent)}
  40%,59%{color:var(--bru-yellow)}
  60%,79%{color:var(--bru-ink)}
  80%,100%{color:var(--bru-accent)}
}
.bru-error.bru-animate .bru-code,
.bru-error.bru-animate .bru-desc,
.bru-error.bru-animate .bru-divider{
  animation:bru-cycle 3s steps(1,end) infinite;
}
.bru-error.bru-animate .bru-desc{animation-delay:.6s;}
.bru-error.bru-animate .bru-divider{animation-delay:.3s;}
.bru-error.bru-static .bru-code,
.bru-error.bru-static .bru-desc,
.bru-error.bru-static .bru-divider{color:var(--bru-ink);}
</style><script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/brutalism/03-error-manifesto.html",
 "title": "Error Manifesto",
 "description": "A neo-brutalist error card with hard shadow and border cycles its text color between white, red, and yellow in stepped CSS keyframe flashes.",
 "useWhen": "Error states, 404 pages, or brutalist-themed dashboards needing dramatic status callouts.",
 "avoidWhen": "Polished or minimal design systems — the hard-shadow aesthetic and color strobing clash with refined UI. Avoid where flashing colors are an accessibility concern.",
 "agentPrompt": "Change the error code to 'ERR 0x000' and the description to 'FATAL: CONTENT NOT FOUND', then shift the accent shadow color from #ff2d00 to #ffe640. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "error code text (.bru-code content)",
  "description text (.bru-desc content)",
  "accent/shadow color (#ff2d00)",
  "cycle duration (3s in bru-cycle)",
  "color stops in @keyframes bru-cycle",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "bru-animate / bru-static class toggle pattern",
  "prefers-reduced-motion guard",
  "visibilitychange pause handler",
  "IIFE wrapper",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Stepped color cycling may be considered distracting or inaccessible in contexts with photosensitive users even with reduced-motion off",
  "No click or hover interaction — purely decorative auto-cycle"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "brutalism",
  "error",
  "typography",
  "color-cycle",
  "ui-card",
  "monospace",
  "manifesto"
 ]
}
</script>
</head><body>
<div class="bru-error" id="bruErr">
  <div class="bru-etype">System Error</div>
  <div class="bru-code">ERR 0x4F2</div>
  <hr class="bru-divider">
  <div class="bru-desc">FATAL: STRUCTURE CANNOT BE DECORATED</div>
  <div class="bru-meta">MODULE: DESIGN_SYSTEM &nbsp;|&nbsp; LINE 001<br>STACK: HONESTY &gt; ORNAMENT &gt; FAILURE</div>
</div>
<div class="bru-cap">ERROR MANIFESTO</div>
<script>(()=>{
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const el=document.getElementById('bruErr');
  function stop(){el.classList.remove('bru-animate');el.classList.add('bru-static');}
  function play(){el.classList.remove('bru-static');el.classList.add('bru-animate');}
  document.addEventListener('visibilitychange',()=>document.hidden?stop():play());
  // live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
  addEventListener('message',(e)=>{
    const d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')) document.documentElement.setAttribute('data-theme',d.theme);
  });
  if(reduce){el.classList.add('bru-static');}else{play();}
})();</script>
</body></html>
