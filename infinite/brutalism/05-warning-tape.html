<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="description" content="Warning Tape — Neo-Brutalism. A self-contained, zero-dependency animated web component."><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warning Tape</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract);
     the light re-theme is the [data-theme="light"] block. The hazard stripes
     (yellow/black) and label chip keep their literal identity in both themes —
     only the page background peeking through the gap changes. */
  :root{
    --bru-bg:#111; --bru-yellow:#ffe640; --bru-stripe-dark:#111; --bru-ink:#000; --cap-o:.35;
  }
  :root[data-theme="light"]{
    --bru-bg:#f4f1e6; --cap-o:.5;
  }
html,body{margin:0;height:100%;overflow:hidden;background:var(--bru-bg);display:flex;align-items:center;justify-content:center;flex-direction:column}
.bru-cap{position:fixed;left:8px;bottom:7px;font:600 10px ui-monospace,monospace;color:var(--bru-yellow);opacity:var(--cap-o);letter-spacing:.5px;pointer-events:none;z-index:99}
.bru-scene{width:100%;height:100%;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0}
@keyframes bru-stripe-scroll{
  from{background-position:0 0}
  to{background-position:80px 0}
}
.bru-stripe{
  width:100%;
  height:72px;
  background:repeating-linear-gradient(
    -45deg,
    var(--bru-yellow) 0px,
    var(--bru-yellow) 20px,
    var(--bru-stripe-dark) 20px,
    var(--bru-stripe-dark) 40px
  );
  background-size:80px 80px;
  border-top:3px solid var(--bru-ink);
  border-bottom:3px solid var(--bru-ink);
  box-shadow:0 4px 0 var(--bru-yellow),0 -4px 0 var(--bru-yellow);
}
.bru-stripe.bru-animate{
  animation:bru-stripe-scroll 1.2s linear infinite;
}
.bru-label{
  position:relative;
  z-index:2;
  text-align:center;
  padding:0 12px;
}
.bru-label-inner{
  display:inline-block;
  background:var(--bru-yellow);
  border:3px solid var(--bru-ink);
  box-shadow:5px 5px 0 var(--bru-ink);
  padding:14px 28px 12px;
}
.bru-title{
  font:900 1.3rem/1 "Arial Black","Arial",Impact,system-ui,sans-serif;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--bru-ink);
  display:block;
}
.bru-sub{
  font:700 .65rem/1.4 system-ui,"Arial",sans-serif;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--bru-ink);
  display:block;
  margin-top:5px;
}
@keyframes bru-pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.7;transform:scale(.97)}
}
.bru-label-inner.bru-animate{
  animation:bru-pulse 1.4s ease-in-out infinite;
}
</style><script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/brutalism/05-warning-tape.html",
 "title": "Warning Tape",
 "description": "Two scrolling yellow-black hazard stripe bands frame a bold \"UNDER CONSTRUCTION\" label that gently pulses. Pure CSS, zero JS logic.",
 "useWhen": "Maintenance pages, coming-soon placeholders, neo-brutalist hero sections needing high-contrast industrial energy.",
 "avoidWhen": "Polished, minimal, or light-background UIs — background is hardcoded dark (#111) and aesthetic is intentionally abrasive.",
 "agentPrompt": "Change the label text to \"SITE OFFLINE\", set stripe color to #ff3b3b (red), and slow the scroll animation to 2.4s. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "stripe scroll speed (1.2s in bru-stripe-scroll animation)",
  "stripe color (#ffe640 in repeating-linear-gradient)",
  "label title text (UNDER CONSTRUCTION)",
  "label subtitle text (DO NOT CROSS THIS LINE)",
  "stripe height (72px)",
  "pulse animation duration (1.4s)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "prefers-reduced-motion guard (reduce check)",
  "visibilitychange pause/play handlers",
  "IIFE wrapper",
  "bru-animate class toggle pattern",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Background color hardcoded #111 — must edit CSS to change dark surround",
  "Stripe scroll direction is fixed left-to-right; reversing requires negating background-position end value"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "neo-brutalism",
  "warning",
  "stripes",
  "construction",
  "typography",
  "loop",
  "ambient"
 ]
}
</script>
</head><body>
<div class="bru-scene">
  <div class="bru-stripe" id="bruStripe1"></div>
  <div class="bru-label">
    <div class="bru-label-inner" id="bruLabel">
      <span class="bru-title">UNDER CONSTRUCTION</span>
      <span class="bru-sub">DO NOT CROSS THIS LINE</span>
    </div>
  </div>
  <div class="bru-stripe" id="bruStripe2"></div>
</div>
<div class="bru-cap">WARNING TAPE</div>
<script>(()=>{
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const s1=document.getElementById('bruStripe1');
  const s2=document.getElementById('bruStripe2');
  const lbl=document.getElementById('bruLabel');
  function stop(){
    s1.classList.remove('bru-animate');
    s2.classList.remove('bru-animate');
    lbl.classList.remove('bru-animate');
  }
  function play(){
    s1.classList.add('bru-animate');
    s2.classList.add('bru-animate');
    lbl.classList.add('bru-animate');
  }
  document.addEventListener('visibilitychange',()=>document.hidden?stop():play());
  // live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
  addEventListener('message',(e)=>{
    const d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')) document.documentElement.setAttribute('data-theme',d.theme);
  });
  if(reduce){/* static — stripes visible, no motion */}else{play();}
})();</script>
</body></html>
