<html lang="en">
<head>
<meta charset="utf-8">

<style>
  :root{--bg-900:#0a0b0e;--bg-800:#12131a;--border-color:rgba(255,255,255,.05);--border-hover:rgba(255,255,255,.12);--accent-revenue:#5C6670;--accent-users:#75894D;--accent-conversions:#10b981;--accent-bounce:#f59e0b;--text-primary:#f3f4f6;--text-muted:#6b7280;--down:#f43f5e;--tooltip-bg:rgba(10,11,14,.95);--grid-line:rgba(255,255,255,.03);--crosshair:rgba(255,255,255,.15);--scrub-ring:#fff}:root[data-theme="light"]{--bg-900:#f0f1f5;--bg-800:#fff;--border-color:rgba(0,0,0,.08);--border-hover:rgba(0,0,0,.16);--accent-revenue:#5C6670;--accent-users:#617240;--accent-conversions:#0b7c56;--accent-bounce:#996206;--text-primary:#1b2130;--text-muted:#666d7a;--down:#d90c2f;--tooltip-bg:rgba(255,255,255,.97);--grid-line:rgba(0,0,0,.05);--crosshair:rgba(0,0,0,.18);--scrub-ring:#1b2130}*,*::before,*::after{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg-900)}.bg03-stage{position:fixed;inset:0;display:flex;flex-direction:column;padding:20px;font-family:system-ui,-apple-system,sans-serif;color:var(--text-primary)}.bg03-header{margin-bottom:16px;user-select:none}.bg03-header h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}.bg03-header p{margin:4px 0 0 0;font-size:12px;color:var(--text-muted)}.bg03-grid{flex:1;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);gap:12px;min-height:0}.bg03-card{background:var(--bg-800);border:1px solid var(--border-color);border-radius:8px;padding:14px;display:flex;flex-direction:column;position:relative;cursor:pointer;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s}.bg03-card:hover{transform:translateY(-2px);border-color:var(--border-hover);box-shadow:0 6px 20px rgba(0,0,0,.4)}.bg03-card-meta{display:flex;justify-content:space-between;align-items:flex-start;user-select:none}.bg03-card-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted)}.bg03-card-trend{font-size:12px;font-weight:700;font-family:ui-monospace,monospace;padding:2px 6px;border-radius:4px;background:color-mix(in srgb,var(--accent-conversions) 10%,transparent);color:var(--accent-conversions)}.bg03-card-trend.bg03-down{background:color-mix(in srgb,var(--down) 10%,transparent);color:var(--down)}.bg03-card-value{font-size:clamp(18px,4.2vmin,26px);font-weight:800;font-family:ui-monospace,monospace;margin:4px 0 8px 0;color:var(--accent-color,var(--accent-revenue))}.bg03-sparkline-container{flex:1;position:relative;width:100%;min-height:40px}.bg03-sparkline-canvas{position:absolute;left:0;top:0;width:100%;height:100%}.bg03-tooltip{position:absolute;background:var(--tooltip-bg);border:1px solid var(--border-color);padding:4px 8px;border-radius:4px;font-size:12px;font-family:ui-monospace,monospace;color:var(--text-primary);pointer-events:none;opacity:0;transition:opacity .15s;z-index:10}.cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--accent-users);opacity:.5;letter-spacing:.08em;text-transform:uppercase;user-select:none;pointer-events:none}@media (max-width:420px){.bg03-stage{padding:14px}.bg03-header{margin-bottom:8px}.bg03-header h1{font-size:12px}.bg03-header p{display:none}.bg03-grid{grid-template-columns:1fr;grid-template-rows:repeat(4,1fr);gap:6px}.bg03-card{padding:6px 9px}.bg03-card-value{display:none}.bg03-sparkline-container{min-height:14px}}@media (prefers-reduced-motion:reduce){*{transform:none !important;transition:none !important}.bg03-card:hover{transform:none !important}}

@media(max-width:200px){.bg03-stage{padding:8px}.bg03-header{margin-bottom:5px}.bg03-grid{gap:4px}.bg03-card{padding:3px 6px}.bg03-card-title{font-size:12px;line-height:1;white-space:nowrap}.bg03-card-trend{display:none}.bg03-sparkline-container{height:8px;min-height:8px;flex:0 0 8px}}
.bg03-sparkline-canvas{touch-action:pan-y pinch-zoom}
.bg03-revenue{--accent-color:var(--accent-revenue)}.bg03-users{--accent-color:var(--accent-users)}.bg03-conversions{--accent-color:var(--accent-conversions)}.bg03-bounce{--accent-color:var(--accent-bounce)}
</style>

<body>
<div class="bg03-stage" id="bg03-root" role="img" aria-label="Enterprise KPI dashboard: ARR revenue, active users, checkout rate and page load time, each with a live sparkline of its last twelve samples and a period-over-period delta.">
<div class="bg03-header">
<h1 id="bg03-title-el">Enterprise KPI Dashboard</h1>
<p id="bg03-desc-el">Performance metrics with interactive trend sparklines</p>
</div>
<div class="bg03-grid" id="bg03-board"></div>
</div>
<div class="cap" aria-hidden="true">KPI Sparkline</div>
<script>(()=>{'use strict';
const root=document.documentElement,board=document.getElementById('bg03-board');
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const kpis=[
{id:'revenue',title:'ARR Revenue',v0:2482100,base:14.2,vol:.0022,amp:.012,w:.07,ph:0},
{id:'users',title:'Active Users',v0:451902,base:8.7,vol:.0026,amp:.014,w:.055,ph:2.1},
{id:'conversions',title:'Checkout Rate',v0:2.84,base:-.4,vol:.004,amp:.018,w:.09,ph:4.3},
{id:'bounce',title:'Page Load Time',v0:1.24,base:-12.5,vol:.005,amp:.02,w:.065,ph:1.2,invert:true}
];
const C={},pct=p=>(p>=0?'+':'')+p.toFixed(1)+'%';
const fmt=(k,v)=>k.id==='revenue'?'$'+Math.round(v).toLocaleString():k.id==='users'?Math.round(v).toLocaleString():v.toFixed(2)+(k.id==='conversions'?'%':'s');
function syncTheme(){
const cs=getComputedStyle(root);
kpis.forEach(k=>k.color=cs.getPropertyValue('--accent-'+k.id).trim() || '#75894D');
for(const [key,token] of Object.entries({grid:'grid-line',crosshair:'crosshair',ring:'scrub-ring'}))C[key]=cs.getPropertyValue('--'+token).trim() || '#fff';
}
syncTheme();
kpis.forEach(k=>{
const start=k.v0/(1+k.base/100);
k.points=Array.from({length:12},(_,i)=>start+(k.v0-start)*i/11+k.v0*Math.sin(i*1.9+k.ph)*k.vol*1.6);
k.points[11]=k.v0;k.v=k.v0;k.mom=0;k.scrub=-1;
const card=document.createElement('div');card.className='bg03-card bg03-'+k.id;
card.id='bg03-card-'+k.id;
card.innerHTML=`<div class="bg03-card-meta"><span class="bg03-card-title">${k.title}</span><span class="bg03-card-trend"></span></div><div class="bg03-card-value"></div><div class="bg03-sparkline-container"><canvas class="bg03-sparkline-canvas"></canvas></div><div class="bg03-tooltip"></div>`;
board.append(card);k.card=card;k.canvas=card.querySelector('canvas');k.tip=card.querySelector('.bg03-tooltip');
k.tip.id='bg03-tooltip-'+k.id;
function scrub(e){const r=k.canvas.getBoundingClientRect();k.scrub=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));drawSparkline(k);}
function clear(){k.scrub=-1;drawSparkline(k);}
card.addEventListener('pointerdown',scrub);card.addEventListener('pointermove',scrub);
card.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')clear();});card.addEventListener('pointercancel',clear);
});
function drawSparkline(k){
const cv=k.canvas,ctx=cv.getContext('2d'),rect=cv.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2),width=rect.width,height=rect.height;
if(cv.width!==Math.round(width*dpr)||cv.height!==Math.round(height*dpr)){cv.width=Math.round(width*dpr);cv.height=Math.round(height*dpr);}
ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);
const min=Math.min(...k.points),range=Math.max(...k.points)-min||1;
const coords=k.points.map((val,i)=>({x:i/11*width,y:height-6-(val-min)/range*(height-12),val}));
ctx.strokeStyle=C.grid;ctx.lineWidth=.8;
for(let i=1;i<4;i++){const y=i/4*height;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(width,y);ctx.stroke();}
function line(){ctx.beginPath();coords.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));}
ctx.strokeStyle=k.color;ctx.lineWidth=2;ctx.lineCap=ctx.lineJoin='round';line();ctx.stroke();
const grad=ctx.createLinearGradient(0,0,0,height);grad.addColorStop(0,k.color+'33');grad.addColorStop(1,k.color+'00');
ctx.fillStyle=grad;line();ctx.lineTo(width,height);ctx.lineTo(0,height);ctx.closePath();ctx.fill();
const head=coords[11];ctx.fillStyle=k.color;ctx.beginPath();ctx.arc(head.x-1.5,head.y,2.2,0,Math.PI*2);ctx.fill();
const tip=k.tip;if(k.scrub<0){tip.style.opacity='0';return;}
const p=coords[Math.round(k.scrub*11)];
ctx.strokeStyle=C.crosshair;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p.x,0);ctx.lineTo(p.x,height);ctx.stroke();
ctx.fillStyle=k.color;ctx.strokeStyle=C.ring;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p.x,p.y,4.5,0,Math.PI*2);ctx.fill();ctx.stroke();
tip.textContent=fmt(k,p.val);tip.style.opacity='1';const cr=k.card.getBoundingClientRect();
tip.style.left=Math.max(4,Math.min(cr.width-tip.offsetWidth-4,rect.left-cr.left+p.x-tip.offsetWidth/2))+'px';
tip.style.top=Math.max(4,Math.min(cr.height-tip.offsetHeight-4,rect.top-cr.top+p.y-20))+'px';
}
function paint(){kpis.forEach(k=>{
k.card.querySelector('.bg03-card-value').textContent=fmt(k,k.v);
const delta=k.base+(k.v/k.v0-1)*100,chip=k.card.querySelector('.bg03-card-trend');
chip.textContent=pct(delta);chip.classList.toggle('bg03-down',k.invert?delta>=0:delta<0);drawSparkline(k);
});}
paint();
let demo=window.__foreverPreview?.demoEnabled!==false,timer=0,t=0;
function stopDemo(){demo=false;clearInterval(timer);timer=0;}
function startDemo(){if(reduce||!demo||document.hidden||timer)return;timer=setInterval(()=>{
t++;kpis.forEach(k=>{const last=k.points[11],target=k.v0*(1+Math.sin((t+k.ph)*k.w)*k.amp);
k.mom=k.mom*.72+(Math.random()-.5)*k.vol;k.v=last+(target-last)*.22+last*k.mom;k.points.shift();k.points.push(k.v);});paint();
},600);}
window.addEventListener('forever:interactive',stopDemo);
for(const type of ['pointerdown','click'])document.addEventListener(type,stopDemo,{capture:true});
document.addEventListener('keydown',e=>{if(e.key!=='Tab'&&!e.metaKey&&!e.ctrlKey&&!e.altKey)stopDemo();},{capture:true});
document.addEventListener('visibilitychange',()=>{clearInterval(timer);timer=0;startDemo();});
addEventListener('resize',paint);
addEventListener('message',e=>{const d=e.data;if(d?.type==='forever:theme'&&/^(light|dark)$/.test(d.theme)){root.dataset.theme=d.theme;syncTheme();paint();}});
startDemo();
})();</script>
