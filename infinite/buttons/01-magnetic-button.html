<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Dark pill button that magnetically drifts toward the cursor with a soft idle orbital float and emerald-to-copper glow on hover.">
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magnetic Button</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract);
     the light re-theme is the [data-theme="light"] block */
  :root{
    --bg:#08090d; --glow-a:rgba(43,171,107,0.16); --glow-b:rgba(192,132,89,0.14); --cap:#fff; --cap-o:.28;
    --bg-surface:#1c2030; --text-0:#f4f6fb;
    --border-mid:rgba(255,255,255,0.12); --border-glow:rgba(43,171,107,0.45);
    --grad-iris-cyan:linear-gradient(120deg,#2BAB6B,#C08459);
    --r-pill:999px;
    --glow-iris:0 0 0 1px var(--border-glow),0 8px 40px -8px rgba(43,171,107,0.45);
    --ease-out-soft:cubic-bezier(0.22,1,0.36,1);
    --font-display:"Space Grotesk",system-ui,sans-serif;
    --dur-fast:160ms; --dur-base:280ms;
  }
  :root[data-theme="light"]{
    --bg:#f2f4f8; --glow-a:rgba(43,171,107,0.18); --glow-b:rgba(192,132,89,0.16); --cap:#1b2130; --cap-o:.5;
    --bg-surface:#ffffff; --text-0:#1b2130;
    --border-mid:rgba(0,0,0,0.12); --border-glow:rgba(32,126,79,0.55);
    --glow-iris:0 0 0 1px var(--border-glow),0 8px 40px -8px rgba(32,126,79,0.3);
  }
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:var(--bg);display:grid;place-items:center;
    background-image:radial-gradient(60vw 40vw at 20% -10%,var(--glow-a),transparent 60%),radial-gradient(50vw 40vw at 90% 0%,var(--glow-b),transparent 55%);}
  #c01-stage{position:fixed;inset:0;display:grid;place-items:center}

  .c01-mag{
    position:relative;border:0;cursor:pointer;padding:18px 34px;
    font-family:var(--font-display);font-size:clamp(15px,4.5vw,18px);font-weight:600;letter-spacing:-0.01em;
    color:var(--text-0);background:var(--bg-surface);border:1px solid var(--border-mid);border-radius:var(--r-pill);
    transition:border-color var(--dur-fast) var(--ease-out-soft),box-shadow var(--dur-base) var(--ease-out-soft);
    will-change:transform;
  }
  .c01-mag::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--grad-iris-cyan);opacity:0;transition:opacity var(--dur-base) var(--ease-out-soft);z-index:-1;}
  .c01-mag:hover{border-color:var(--border-glow);box-shadow:var(--glow-iris);}
  .c01-mag__label{display:inline-block;will-change:transform;}

  .cap{position:fixed;left:8px;bottom:7px;font-size:10px;letter-spacing:.08em;color:var(--cap);opacity:var(--cap-o);text-transform:uppercase;font-family:var(--font-display)}
  @media (prefers-reduced-motion:reduce){.c01-mag,.c01-mag__label{transition-duration:.001ms}}
  .c01-mag:focus-visible{outline:2px solid var(--text-0);outline-offset:3px}
</style>

</head>
<body>
<div id="c01-stage">
  <button class="c01-mag" type="button"><span class="c01-mag__label">Hover me</span></button>
</div>
<div class="cap">Magnetic button</div>
<script>
(function(){
  "use strict";
  var reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
  var btn = document.querySelector(".c01-mag");
  var label = btn.querySelector(".c01-mag__label");
  var stage = document.getElementById("c01-stage");
  var strength = 0.4, demoEnabled=window.__foreverPreview?.demoEnabled!==false;
  var x=0,y=0,tx=0,ty=0,near=false,touch=null,raf=0,last=0,t0=null;
  if(matchMedia("(hover:none) and (pointer:coarse)").matches) label.textContent="Touch me";

  // One motion owner; pointer targets use the resting center, never the moving hit box.
  function aim(e){
    var r=btn.getBoundingClientRect();
    var dx=e.clientX-(r.left+r.width/2-x),dy=e.clientY-(r.top+r.height/2-y);
    near=Math.abs(dx)<r.width/2+40&&Math.abs(dy)<r.height/2+40;
    tx=near?Math.max(-30,Math.min(30,dx*strength)):0;
    ty=near?Math.max(-20,Math.min(20,dy*strength)):0;
    start();
  }
  function release(){near=false;touch=null;tx=ty=0;start();}
  stage.addEventListener("pointermove",function(e){
    if(e.pointerType!=="touch"||touch===e.pointerId)aim(e);
  });
  stage.addEventListener("pointerleave",release);
  btn.addEventListener("pointerdown",function(e){
    takeover();
    if(e.pointerType==="touch")touch=e.pointerId;
    aim(e);
  });
  window.addEventListener("pointerup",function(e){if(touch===e.pointerId)release();});
  window.addEventListener("pointercancel",release);

  function loop(t){
    raf=0;
    if(document.hidden||reduce)return;
    if(t0===null)t0=t;
    var dt=last?Math.min(t-last,50):16.67;last=t;
    var ax=tx,ay=ty;
    if(demoEnabled&&!near){
      var e=(t-t0)/1000;
      ax=(Math.cos(e*0.9)*14+Math.cos(e*0.37)*5)*strength;
      ay=(Math.sin(e*0.7)*9+Math.sin(e*1.3)*3)*strength;
    }
    var ease=1-Math.exp(-dt/180);
    x+=(ax-x)*ease;y+=(ay-y)*ease;
    var settled=Math.abs(ax-x)+Math.abs(ay-y)<0.02;
    if(settled){x=ax;y=ay;}
    btn.style.transform="translate("+x+"px,"+y+"px)";
    label.style.transform="translate("+x*0.4+"px,"+y*0.4+"px)";
    if(demoEnabled||!settled)raf=requestAnimationFrame(loop);
    else last=0;
  }
  function takeover(){demoEnabled=false;start();}
  window.addEventListener("forever:interactive",takeover);
  btn.addEventListener("keydown",function(e){if(/^(Enter| |Arrow|Escape)/.test(e.key)){takeover();release();}},true);
  function start(){if(!reduce&&!document.hidden&&!raf)raf=requestAnimationFrame(loop);}
  function stop(){if(raf)cancelAnimationFrame(raf);raf=0;last=0;near=false;touch=null;tx=ty=0;}
  document.addEventListener("visibilitychange",function(){document.hidden?stop():start();});
  // live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
  addEventListener("message", function(e){
    var d=e.data; if(d && d.type==="forever:theme" && (d.theme==="light"||d.theme==="dark")) document.documentElement.setAttribute("data-theme", d.theme);
  });
  start();
})();
</script>
</body>
</html>
