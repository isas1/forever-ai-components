<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Dark rounded button that spawns an expanding teal-cyan radial ink ripple from the tap point, looping from random spots at rest.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Material Ripple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract);
     the light re-theme is the [data-theme="light"] block */
  :root{
    --bg:#08090d; --glow-a:rgba(34,174,195,0.14); --ink-a:rgba(34,174,195,0.55); --ink-b:rgba(34,174,195,0.05); --cap:#fff; --cap-o:.28;
    --bg-surface:#1c2030; --text-0:#f4f6fb;
    --border-mid:rgba(255,255,255,0.12); --border-glow:rgba(34,174,195,0.45);
    --r-md:14px;
    --ease-out-soft:cubic-bezier(0.22,1,0.36,1);
    --dur-fast:160ms; --dur-slow:900ms;   /* ink spread — slow enough to read at tile size */
    --font-display:"Space Grotesk",system-ui,sans-serif;
  }
  :root[data-theme="light"]{
    --bg:#f1f6f8; --glow-a:rgba(34,174,195,0.16); --ink-a:rgba(23,120,134,0.45); --ink-b:rgba(23,120,134,0.04); --cap:#16202a; --cap-o:.5;
    --bg-surface:#ffffff; --text-0:#16202a;
    --border-mid:rgba(0,0,0,0.12); --border-glow:rgba(23,120,134,0.55);
  }
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:var(--bg);display:grid;place-items:center;
    background-image:radial-gradient(60vw 40vw at 20% -10%,var(--glow-a),transparent 60%);}
  #stage{position:fixed;inset:0;display:grid;place-items:center}

  .c04-rip{position:relative;overflow:hidden;border:0;cursor:pointer;padding:17px 36px;
    font-family:var(--font-display);font-size:clamp(15px,4.5vw,18px);font-weight:600;color:var(--text-0);
    background:var(--bg-surface);border:1px solid var(--border-mid);border-radius:var(--r-md);
    transition:border-color var(--dur-fast) var(--ease-out-soft);-webkit-tap-highlight-color:transparent;}
  .c04-rip:hover{border-color:var(--border-glow);}
  .c04-rip__ink{position:absolute;border-radius:50%;
    background:radial-gradient(circle,var(--ink-a),var(--ink-b));
    transform:translate(-50%,-50%) scale(0);pointer-events:none;
    animation:c04-rip-spread var(--dur-slow) var(--ease-out-soft) forwards;}
  /* ink holds its density through the first half of the spread, then fades — at 264px a
     straight fade-out is gone before the eye lands on it */
  @keyframes c04-rip-spread{ 0%{opacity:1} 45%{opacity:.9} to{ transform:translate(-50%,-50%) scale(1);opacity:0; } }

  .cap{position:fixed;left:8px;bottom:7px;font-size:10px;letter-spacing:.08em;color:var(--cap);opacity:var(--cap-o);text-transform:uppercase;font-family:var(--font-display)}
  @media (prefers-reduced-motion:reduce){.c04-rip__ink{animation-duration:.001ms}}
</style>

</head>
<body>
<div id="stage">
  <button class="c04-rip" type="button">Tap for ripple</button>
</div>
<div class="cap">Material ripple</div>
<script>
(function(){
  "use strict";
  var reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
  var btn = document.querySelector(".c04-rip");

  function ripple(localX, localY){
    var r = btn.getBoundingClientRect();
    var size = Math.max(r.width, r.height) * 2.2;
    var ink = document.createElement("span");
    ink.className = "c04-rip__ink";
    ink.style.width = ink.style.height = size + "px";
    ink.style.left = localX + "px";
    ink.style.top = localY + "px";
    btn.appendChild(ink);
    ink.addEventListener("animationend", function(){ ink.remove(); });
    if(reduce) setTimeout(function(){ ink.remove(); }, 30);
  }
  btn.addEventListener("pointerdown", function(e){
    var r = btn.getBoundingClientRect();
    takeover();
    ripple(e.clientX-r.left, e.clientY-r.top);
  });
  btn.addEventListener("focus", takeover);

  // idle demo: nothing on the wall ever taps a button, so the tile runs the very same ripple()
  // a real pointerdown runs — first ink LEAD ms after mount, then one every DEMO_EVERY ms,
  // walking a fixed ring of origins so each spread starts from a different point. A real tap
  // takes over (demo stops); the demo resumes after IDLE_RESUME ms of quiet.
  var TICK=100, DEMO_EVERY=2500, IDLE_RESUME=3600, LEAD=400;
  var SPOTS=[[0.30,0.40],[0.72,0.62],[0.52,0.26],[0.24,0.68],[0.68,0.34]];
  var demo=true, phase=DEMO_EVERY-LEAD, idle=0, spot=0, clock=null;
  function tick(){
    if(!demo){ idle+=TICK; if(idle>=IDLE_RESUME){ demo=true; idle=0; phase=DEMO_EVERY-LEAD; } return; }
    phase+=TICK;
    if(phase>=DEMO_EVERY){ phase=0;
      var r=btn.getBoundingClientRect(), s=SPOTS[spot++%SPOTS.length];
      ripple(r.width*s[0], r.height*s[1]);
    }
  }
  function takeover(){ demo=false; idle=0; }   // a real tap ends the idle demo
  function start(){ if(!clock && !reduce) clock=setInterval(tick, TICK); }
  function stop(){ clearInterval(clock); clock=null; }
  document.addEventListener("visibilitychange", function(){ document.hidden?stop():start(); });
  // live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
  addEventListener("message", function(e){
    var d=e.data; if(d && d.type==="forever:theme" && (d.theme==="light"||d.theme==="dark")) document.documentElement.setAttribute("data-theme", d.theme);
  });
  start();                                     // reduced motion: start() is a no-op, no ink fires
})();
</script>
</body>
</html>
