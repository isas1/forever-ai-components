<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Outlined button where a copper-to-emerald gradient sweeps across to fill it and flip the text dark, looping in and out.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sliding Fill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  :root{
    --c08-bg:#08090d; --c08-glow-a:rgba(43,171,107,0.14);
    --text-0:#f4f6fb;
    --border-mid:rgba(255,255,255,0.12);
    --grad-iris-cyan:linear-gradient(120deg,#C08459,#2BAB6B);
    --r-md:14px;
    --cap:#fff; --cap-o:.28;
    --ease-out-soft:cubic-bezier(0.22,1,0.36,1); --ease-in-out:cubic-bezier(0.65,0,0.35,1);
    --dur-base:280ms; --dur-slow:520ms;
    --font-display:"Space Grotesk",system-ui,sans-serif;
  }
  :root[data-theme="light"]{
    --c08-bg:#f2f4f8; --c08-glow-a:rgba(32,126,79,0.10);
    --text-0:#1b2130;
    --border-mid:rgba(0,0,0,0.12);
    --cap:#1b2130; --cap-o:.5;
  }
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:var(--c08-bg);display:grid;place-items:center;
    background-image:radial-gradient(60vw 40vw at 80% 0%,var(--c08-glow-a),transparent 60%);}
  #stage{position:fixed;inset:0;display:grid;place-items:center}

  .c08-fill{position:relative;overflow:hidden;border:1px solid var(--border-mid);cursor:pointer;padding:17px 36px;
    font-family:var(--font-display);font-size:clamp(15px,4.5vw,18px);font-weight:600;color:var(--text-0);
    background:transparent;border-radius:var(--r-md);
    transition:color var(--dur-base) var(--ease-out-soft),border-color var(--dur-base) var(--ease-out-soft);isolation:isolate;}
  .c08-fill::before{content:"";position:absolute;inset:0;background:var(--grad-iris-cyan);
    transform:translateX(-101%);transition:transform var(--dur-slow) var(--ease-in-out);z-index:-1;}
  .c08-fill:hover,.c08-fill.is-filled{color:#0b0c12;border-color:transparent;}
  .c08-fill:hover::before,.c08-fill.is-filled::before{transform:translateX(0);}

  .cap{position:fixed;left:8px;bottom:7px;font-size:10px;letter-spacing:.08em;color:var(--cap);opacity:var(--cap-o);text-transform:uppercase;font-family:var(--font-display)}
  @media (prefers-reduced-motion:reduce){.c08-fill,.c08-fill::before{transition-duration:.001ms}}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/buttons/08-sliding-fill.html",
 "title": "Sliding Fill",
 "description": "Outlined button where a copper-to-emerald gradient sweeps in from the left on hover, filling the button and flipping text dark. Auto-cycles as idle demo.",
 "useWhen": "CTA buttons, hero sections, or any action button needing tactile hover feedback with strong color contrast.",
 "avoidWhen": "Auto-cycle demo mode ships as-is — remove the setTimeout loop before production use. Avoid on light backgrounds without color adjustments.",

 "editableAreas": [

  "button padding and font size",
  "filled text color (#0b0c12)",
  "idle demo cadence (FILL_MS=1500 filled / REST_MS=1500 empty, first sweep after 300 ms)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "::before pseudo-element slide pattern (translateX)",
  "IIFE wrapper",
  "prefers-reduced-motion guard",

  ".is-filled demo class sharing the :hover rules + takeover on real hover/press/focus",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Idle demo cycle runs by default (real input takes over, resumes after a few idle seconds) — remove the demo block for purely on-demand interaction",
  "Light re-theme via the [data-theme=light] token block; catalog bg/accent describe the dark default"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",

 "tags": [
  "button",

</head>
<body>
<div id="stage">
  <button class="c08-fill" type="button">Slide fill</button>
</div>
<div class="cap">Sliding fill</div>
<script>
(function(){
  "use strict";
  var reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
  var btn = document.querySelector(".c08-fill");

  // live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
  addEventListener("message", function(e){
    var d=e.data; if(d && d.type==="forever:theme" && (d.theme==="light"||d.theme==="dark")) document.documentElement.setAttribute("data-theme", d.theme);
  });

  // idle demo: the fill only sweeps on :hover and nothing on the wall ever hovers, so the demo
  // toggles .is-filled — the same CSS rules :hover uses — first sweep ~0.3 s after mount, then
  // FILL_MS filled / REST_MS empty. Real hover/press/focus takes over and hands the button back
  // to :hover; the demo resumes after IDLE_RESUME ms of quiet.
  var TICK=100, FILL_MS=1500, REST_MS=1500, IDLE_RESUME=3600, LEAD=300;
  var demo=true, filled=false, phase=REST_MS-LEAD, idle=0, clock=null;
  function fill(on){ filled=on; btn.classList.toggle("is-filled", on); }
  function tick(){
    if(!demo){ if(over) idle=0; else idle+=TICK; if(idle>=IDLE_RESUME){ demo=true; idle=0; phase=REST_MS-LEAD; } return; }
    phase+=TICK;
    if(phase >= (filled?FILL_MS:REST_MS)){ phase=0; fill(!filled); }
  }
  function takeover(){ demo=false; idle=0; fill(false); }   // real input ends the idle demo
  var over=false;                              // demo stays off while a pointer rests on the control
  btn.addEventListener("pointerenter", function(){ over=true; takeover(); });
  btn.addEventListener("pointerleave", function(){ over=false; idle=0; });
  btn.addEventListener("pointerdown", takeover);
  btn.addEventListener("focus", takeover);
  function start(){ if(!clock && !reduce) clock=setInterval(tick, TICK); }
  function stop(){ clearInterval(clock); clock=null; }
  document.addEventListener("visibilitychange", function(){ document.hidden ? stop() : start(); });
  if(reduce) fill(true);                       // reduced motion: one static filled state, no loop
  else start();
})();
</script>
</body>
</html>
