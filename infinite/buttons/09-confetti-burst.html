<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Magenta-outlined pill button on dark that fires a physics-driven burst of colorful confetti particles on click and idle.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confetti Burst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  :root{
    --c09-bg:#0c0810; --c09-glow-a:rgba(255,92,168,0.12); --burst-glow-hover:rgba(255,92,168,0.6);
    --bg-surface:#1c2030; --text-0:#f4f6fb; --accent-magenta:#ff5ca8;
    --confetti-1:#7c5cff; --confetti-2:#22d3ee; --confetti-3:#ff5ca8; --confetti-4:#f4f6fb;
    --cap:#fff; --cap-o:.28;
    --r-pill:999px;
    --ease-out-soft:cubic-bezier(0.22,1,0.36,1);
    --dur-fast:160ms;
    --font-display:"Space Grotesk",system-ui,sans-serif;
  }
  :root[data-theme="light"]{
    --c09-bg:#f6f1f7; --c09-glow-a:rgba(214,0,100,0.10); --burst-glow-hover:rgba(214,0,100,0.35);
    --bg-surface:#ffffff; --text-0:#241b2e; --accent-magenta:#d60064;
    --confetti-4:#241b2e;
    --cap:#241b2e; --cap-o:.5;
  }
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:var(--c09-bg);display:grid;place-items:center;
    background-image:radial-gradient(60vw 50vw at 50% 50%,var(--c09-glow-a),transparent 60%);}
  #stage{position:fixed;inset:0;display:grid;place-items:center}

  .c09-burst{position:relative;border:0;cursor:pointer;padding:17px 36px;
    font-family:var(--font-display);font-size:clamp(15px,4.5vw,18px);font-weight:600;color:var(--text-0);
    background:var(--bg-surface);border:1px solid var(--accent-magenta);border-radius:var(--r-pill);
    transition:transform var(--dur-fast) var(--ease-out-soft),box-shadow var(--dur-fast) var(--ease-out-soft);}
  .c09-burst:hover{transform:translateY(-2px);box-shadow:0 0 28px -6px var(--burst-glow-hover);}
  .c09-burst:active{transform:translateY(0) scale(0.96);}
  .c09-particle{position:absolute;top:0;left:0;width:8px;height:8px;border-radius:2px;pointer-events:none;will-change:transform,opacity;}

  .cap{position:fixed;left:8px;bottom:7px;font-size:10px;letter-spacing:.08em;color:var(--cap);opacity:var(--cap-o);text-transform:uppercase;font-family:var(--font-display)}
  @media (prefers-reduced-motion:reduce){.c09-burst{transition-duration:.001ms}}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/buttons/09-confetti-burst.html",
 "title": "Confetti Burst",
 "description": "Magenta pill button fires 26 colorful confetti squares and circles in a physics arc on click; auto-bursts every 2.3 s as an idle demo loop.",
 "useWhen": "CTA buttons, success states, celebration moments, onboarding rewards where a burst of delight reinforces the action.",
 "avoidWhen": "Passive display contexts or forms requiring focus — delete the auto-loop timer before shipping to production.",
 "agentPrompt": "Change particle count to 40, swap colors to [\"#facc15\",\"#fb923c\",\"#f43f5e\",\"#ffffff\"], and slow the idle interval to 4000ms. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "particle count (count=26)",
  "color palette (colors array)",
  "idle interval (2300ms)",
  "velocity range (40+90)",
  "gravity coefficient (220*prog*prog)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "IIFE wrapper",
  "visibilitychange stop/loop guard",
  "prefers-reduced-motion count reduction and duration skip",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Auto-cycles by default — remove loop() call before production use",
  "Particles are appended inside the button element, so large counts can briefly bloat the DOM",
  "No aria-live announcement for the burst event"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "confetti",
  "burst",
  "particles",
  "button",
  "click",
  "physics",
  "celebration"
 ]
}
</script>
</head>
<body>
<div id="stage">
  <button class="c09-burst" type="button">Celebrate</button>
</div>
<div class="cap">Confetti burst</div>
<script>
(function(){
  "use strict";
  var reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
  var root = document.documentElement;
  var btn = document.querySelector(".c09-burst");
  var colors = [];
  function syncTheme(){                 // confetti colours are JS-drawn, so re-read tokens on switch
    var cs = getComputedStyle(root);
    colors = [
      cs.getPropertyValue("--confetti-1").trim(),
      cs.getPropertyValue("--confetti-2").trim(),
      cs.getPropertyValue("--confetti-3").trim(),
      cs.getPropertyValue("--confetti-4").trim()
    ];
  }

  function burst(){
    var count = reduce ? 6 : 26;
    var r = btn.getBoundingClientRect();
    var cx = r.width/2, cy = r.height/2;
    for(var i=0;i<count;i++){ spawn(cx, cy, colors[i%colors.length]); }
  }
  function spawn(cx, cy, color){
    var p = document.createElement("span");
    p.className = "c09-particle";
    p.style.background = color;
    p.style.left = cx + "px";
    p.style.top = cy + "px";
    if(Math.random()>0.5) p.style.borderRadius = "50%";
    btn.appendChild(p);

    var angle = Math.random()*Math.PI*2;
    var velocity = 40 + Math.random()*90;
    var vx = Math.cos(angle)*velocity;
    var vy = Math.sin(angle)*velocity - 50;
    var rot = (Math.random()*720 - 360);
    var dur = reduce ? 1 : 700 + Math.random()*500;
    var start = null;
    function frame(t){
      if(start===null) start = t;
      var prog = Math.min((t-start)/dur, 1);
      var x = vx*prog;
      var y = vy*prog + 220*prog*prog;
      p.style.transform = "translate("+x+"px,"+y+"px) rotate("+rot*prog+"deg)";
      p.style.opacity = String(1-prog);
      if(prog<1) requestAnimationFrame(frame); else p.remove();
    }
    requestAnimationFrame(frame);
  }
  btn.addEventListener("click", burst);

  // live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
  addEventListener("message", function(e){
    var d = e.data;
    if(d && d.type === "forever:theme" && (d.theme === "light" || d.theme === "dark")){
      root.setAttribute("data-theme", d.theme);
      syncTheme();
    }
  });
  syncTheme();

  // autonomous idle: celebrate on a loop
  var timer=null;
  function loop(){ if(reduce) return; timer=setTimeout(function(){ burst(); loop(); }, 2300); }
  function stop(){ clearTimeout(timer); }
  document.addEventListener("visibilitychange", function(){ document.hidden?stop():loop(); });
  setTimeout(loop, 600);
})();
</script>
</body>
</html>
