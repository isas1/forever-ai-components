<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Magenta-to-gold gradient button with a layered 3D edge and shadow that depresses and springs back like a tactile key.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Push Button</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  :root{
    --c10-bg:#08090d; --c10-glow-a:rgba(218,62,140,0.16);
    --text-0:#f4f6fb;
    --grad-iris-cyan:linear-gradient(120deg,#DA3E8C,#C0B459);
    --r-md:14px;
    --cap:#fff; --cap-o:.28;
    --ease-out-soft:cubic-bezier(0.22,1,0.36,1);
    --dur-fast:160ms;
    --font-display:"Space Grotesk",system-ui,sans-serif;
  }
  :root[data-theme="light"]{
    --c10-bg:#f2f4f8; --c10-glow-a:rgba(205,39,122,0.10);
    --cap:#1b2130; --cap-o:.5;
  }
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:var(--c10-bg);display:grid;place-items:center;
    background-image:radial-gradient(60vw 40vw at 30% -10%,var(--c10-glow-a),transparent 60%);}
  #stage{position:fixed;inset:0;display:grid;place-items:center}

  .c10-push{position:relative;border:0;background:none;cursor:pointer;padding:0;border-radius:var(--r-md);outline-offset:4px;}
  .c10-push__shadow{position:absolute;inset:0;border-radius:var(--r-md);background:rgba(0,0,0,0.55);
    transform:translateY(8px);filter:blur(1px);transition:transform var(--dur-fast) var(--ease-out-soft);}
  .c10-push__edge{position:absolute;inset:0;border-radius:var(--r-md);background:linear-gradient(180deg,#A18794,#C0B459);}
  .c10-push__face{position:relative;display:block;padding:16px 36px;border-radius:var(--r-md);
    font-family:var(--font-display);font-size:clamp(15px,4.5vw,18px);font-weight:600;color:var(--text-0);
    background:var(--grad-iris-cyan);transform:translateY(-7px);
    transition:transform var(--dur-fast) var(--ease-out-soft);will-change:transform;}
  .c10-push:hover .c10-push__face{transform:translateY(-9px);}
  .c10-push:hover .c10-push__shadow{transform:translateY(10px);}
  .c10-push:active .c10-push__face,
  .c10-push.is-pressed .c10-push__face{transform:translateY(-2px);}
  .c10-push:active .c10-push__shadow,
  .c10-push.is-pressed .c10-push__shadow{transform:translateY(2px);filter:blur(0.5px);}

  .cap{position:fixed;left:8px;bottom:7px;font-size:10px;letter-spacing:.08em;color:var(--cap);opacity:var(--cap-o);text-transform:uppercase;font-family:var(--font-display)}
  @media (prefers-reduced-motion:reduce){.c10-push__face,.c10-push__shadow{transition-duration:.001ms}}
</style>

<body>
<div id="stage">
  <button class="c10-push" type="button">
    <span class="c10-push__shadow"></span>
    <span class="c10-push__edge"></span>
    <span class="c10-push__face">Push down</span>
  </button>
</div>
<div class="cap">3D push button</div>
<script>
(function(){
  "use strict";
  var reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
  var btn = document.querySelector(".c10-push");

  // idle demo: the key only depresses on :hover/:active and nothing on the wall ever touches it,
  // so the demo adds .is-pressed — the same CSS rules :active uses — first press ~0.4 s after
  // mount, held HOLD_MS, then one press every DEMO_EVERY ms. Real input takes over and hands the
  // key back to :active; the demo resumes after IDLE_RESUME ms of quiet.
  var TICK=100, DEMO_EVERY=3000, HOLD_MS=450, IDLE_RESUME=3600, LEAD=400;
  var demo=true, down=false, phase=DEMO_EVERY-LEAD, idle=0, clock=null;
  function setPressed(on){ down=on; btn.classList.toggle("is-pressed", on); }
  function tick(){
    if(!demo){ if(over) idle=0; else idle+=TICK; if(idle>=IDLE_RESUME){ demo=true; idle=0; phase=DEMO_EVERY-LEAD; } return; }
    phase+=TICK;
    if(phase >= (down?HOLD_MS:DEMO_EVERY)){ phase=0; setPressed(!down); }
  }
  function takeover(){ demo=false; idle=0; setPressed(false); }   // real input ends the idle demo
  var over=false;                              // demo stays off while a pointer rests on the control
  btn.addEventListener("pointerenter", function(){ over=true; takeover(); });
  btn.addEventListener("pointerleave", function(){ over=false; idle=0; });
  btn.addEventListener("pointerdown", takeover);
  btn.addEventListener("focus", takeover);
  function start(){ if(!clock && !reduce) clock=setInterval(tick, TICK); }
  function stop(){ clearInterval(clock); clock=null; setPressed(false); }
  document.addEventListener("visibilitychange", function(){ document.hidden ? stop() : start(); });
  // live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
  addEventListener("message", function(e){
    var d=e.data; if(d && d.type==="forever:theme" && (d.theme==="light"||d.theme==="dark")) document.documentElement.setAttribute("data-theme", d.theme);
  });
  start();                                     // reduced motion: start() is a no-op, key sits at rest
})();
</script>
</body>
</html>
