<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
<meta name="description" content="Thanos Snap Delete — Buttons &amp; Toggles. A self-contained, zero-dependency animated web component.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thanos Snap Button</title>
  <script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
  <style>
    :root{ --c11-bg:#111116; --c11-cap:rgba(255,255,255,0.4); --c11-btn-shadow:rgba(255,71,87,0.4); --c11-btn-shadow-hover:rgba(255,71,87,0.6); --c11-btn-shadow-active:rgba(255,71,87,0.4); --c11-dust-a:#ff4757; --c11-dust-b:#ff6b81; --c11-dust-c:#ffffff; --c11-reset:#888; }
    :root[data-theme="light"]{ --c11-bg:#f3f3f6; --c11-cap:rgba(27,33,48,0.45); --c11-btn-shadow:rgba(224,0,20,0.28); --c11-btn-shadow-hover:rgba(224,0,20,0.4); --c11-btn-shadow-active:rgba(224,0,20,0.28); --c11-dust-c:#2a2a30; --c11-reset:#5b6270; }
    html, body{margin:0;height:100%;overflow:hidden;background:var(--c11-bg);display:flex;
      align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;}
    .snap-cap{position:absolute;bottom:16px;right:16px;color:var(--c11-cap);font-size:12px;
      pointer-events:none;letter-spacing:0.5px;}
    .snap-btn-container{position:relative;}
    .snap-btn{background:linear-gradient(135deg,#ff4757,#ff6b81);color:white;border:none;border-radius:8px;
      padding:16px 32px;font-size:18px;font-weight:600;cursor:pointer;letter-spacing:1px;position:relative;
      z-index:2;box-shadow:0 4px 15px var(--c11-btn-shadow);transition:transform 0.1s,box-shadow 0.1s;}
    .snap-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px var(--c11-btn-shadow-hover);}
    .snap-btn:active{transform:translateY(1px) scale(0.95);box-shadow:0 2px 10px var(--c11-btn-shadow-active);}
    .snap-btn.snapping{opacity:0;pointer-events:none;}
    /* Dust particles */
    .dust-particle{position:absolute;background:var(--c11-dust-a);pointer-events:none;z-index:3;border-radius:50%;}
    .reset-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--c11-reset);
      background:none;border:none;font-size:14px;cursor:pointer;opacity:0;visibility:hidden;
      transition:opacity 0.5s ease 1s;text-decoration:underline;}
    .snapped .reset-btn{opacity:1;visibility:visible;}
  </style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/buttons/11-thanos-snap-button.html",
 "title": "Thanos Snap Delete",
 "description": "Red DELETE button that disintegrates into ~200 drifting dust particles on click. Particles drift right and fade; a Restore link resets the state.",
 "useWhen": "Destructive action confirmations (delete, remove, clear) where dramatic feedback reinforces irreversibility. Fun product demos or portfolio pieces.",
 "avoidWhen": "Frequent-action buttons or flows where users repeat the action often — the animation has no auto-reset. Avoid in low-motion contexts where reduced-motion is common.",
 "agentPrompt": "Change the button label from 'DELETE' to 'ERASE', set particle colors to '#00eaff' and '#0080ff', and increase the grid to 30 cols and 15 rows for denser dust. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "button label (innerHTML)",
  "particle grid density (cols=20, rows=10)",
  "particle colors (#ff4757, #ff6b81, #ffffff)",
  "velocity bias (vx, vy values)",
  "particle decay rate (0.015–0.035 range)",
  "idle demo cadence (LEAD=500 / DEMO_EVERY=4000 / REFORM_AFTER=1300 / IDLE_RESUME=3600 ms)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "IIFE wrapper",
  "prefersReducedMotion guard (skip particle creation)",
  "cancelAnimationFrame on reset",
  "isSnapping guard to prevent double-fire",
  "idle demo snap + re-form (the same doSnap()/doReform() the click and Restore paths run)",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "No visibility-change pause — particles keep animating if tab is hidden during snap",
  "Particle positions are DOM-absolute, so resizing mid-snap causes misalignment",
  "Restore button lacks aria attributes for screen readers"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "button",
  "delete",
  "particles",
  "disintegrate",
  "dust",
  "microinteraction",
  "click"
 ]
}
</script>
</head>
<body>

  <div class="snap-btn-container" id="container">
    <button class="snap-btn" id="snapBtn">DELETE</button>
    <button class="reset-btn" id="resetBtn">Restore</button>
  </div>

  <div class="snap-cap">Thanos Snap Button</div>

  <script>
    (() => {
      const btn = document.getElementById('snapBtn');
      const container = document.getElementById('container');
      const resetBtn = document.getElementById('resetBtn');
      const prefersReducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const root = document.documentElement;

      let particles = [], isSnapping = false, mode = 'idle', u = 0, animationFrame = 0;
      let dustColors = [];
      // dust colours are JS-drawn, so re-read tokens on switch
      function syncTheme(){ const cs = getComputedStyle(root); dustColors = ['--c11-dust-a','--c11-dust-b','--c11-dust-c'].map(v => cs.getPropertyValue(v).trim()); }
      syncTheme();

      const createParticles = () => {
        const rect = btn.getBoundingClientRect();
        const cols = 20, rows = 10;
        const pWidth = rect.width / cols, pHeight = rect.height / rows;
        for (let i = 0; i < cols; i++) {
          for (let j = 0; j < rows; j++) {
            // Don't create particles for empty transparent corners (approximate)
            const isCorner = (i < 2 && j < 2) || (i > cols-3 && j < 2) || (i < 2 && j > rows-3) || (i > cols-3 && j > rows-3);
            if (isCorner && Math.random() > 0.3) continue;
            const p = document.createElement('div');
            p.classList.add('dust-particle');
            p.style.width = `${pWidth * 1.5}px`;
            p.style.height = `${pHeight * 1.5}px`;
            // Randomly pick a color from the gradient
            p.style.background = Math.random() > 0.5 ? dustColors[0] : dustColors[1];
            if (Math.random() > 0.8) p.style.background = dustColors[2];
            const startX = i * pWidth, startY = j * pHeight;
            p.style.left = `${startX}px`;
            p.style.top = `${startY}px`;
            container.appendChild(p);
            particles.push({ el: p, x: startX, y: startY, sx: startX, sy: startY,
              vx: (Math.random() - 0.2) * 5 + 2,   // mostly right
              vy: (Math.random() - 0.8) * 5,       // mostly up
              rotation: Math.random() * 360, vRot: (Math.random() - 0.5) * 10,
              life: 1.0, decay: Math.random() * 0.02 + 0.015 });
          }
        }
      };
      const clearParticles = () => { particles.forEach(p => p.el.remove()); particles = []; };
      const paint = (p, x, y, rot, a) => {
        p.el.style.transform = `translate(${x - p.sx}px, ${y - p.sy}px) rotate(${rot}deg) scale(${Math.max(0.001, a)})`;
        p.el.style.opacity = a;
      };

      // one loop, two directions: 'out' disintegrates, 'in' flies the very same dust home
      const animate = () => {
        if (mode === 'out') {
          let alive = false;
          particles.forEach(p => {
            if (p.life <= 0) return;                  // frozen where it died — the re-form starts there
            alive = true;
            p.x += p.vx; p.y += p.vy; p.rotation += p.vRot; p.life -= p.decay;
            paint(p, p.x, p.y, p.rotation, Math.max(0, p.life));
          });
          if (!alive) mode = 'dust';                  // fully dusted, waiting on the re-form
        } else if (mode === 'in') {
          u = Math.min(1, u + 0.045);
          const k = 1 - Math.pow(1 - u, 3);           // ease-out: dust streams back into the slab
          particles.forEach(p => paint(p, p.x + (p.sx - p.x) * k, p.y + (p.sy - p.y) * k,
            p.rotation * (1 - k), Math.min(1, k * 1.3)));
          if (u >= 1) { clearParticles(); btn.classList.remove('snapping');
            container.classList.remove('snapped'); isSnapping = false; mode = 'idle'; }
        }
        // 'dust' and 'idle' need no frames — the clock wakes the loop again for the re-form
        animationFrame = (mode === 'out' || mode === 'in') ? requestAnimationFrame(animate) : 0;
      };
      const run = () => { cancelAnimationFrame(animationFrame); animationFrame = requestAnimationFrame(animate); };

      const doSnap = () => {
        if (isSnapping) return;
        isSnapping = true;
        btn.classList.add('snapping'); container.classList.add('snapped');
        if (prefersReducedMotion) return;             // no dust: the slab just leaves
        createParticles(); mode = 'out'; run();
      };
      const doReform = () => {                        // Restore: the dust reassembles
        if (!isSnapping) return;
        if (prefersReducedMotion || !particles.length) {
          btn.classList.remove('snapping'); container.classList.remove('snapped');
          isSnapping = false; mode = 'idle'; return;
        }
        u = 0; mode = 'in'; run();
      };

      // idle demo: nothing on the wall clicks DELETE, so the tile runs the very same doSnap() a real
      // click runs — first snap LEAD ms after mount, the dust re-forming REFORM_AFTER ms later (just
      // after the last mote fades) through
      // doReform() (the Restore path), one round trip every DEMO_EVERY ms. Real input takes over (demo
      // stops, the Restore link appears); the demo resumes after IDLE_RESUME ms of quiet.
      const TICK = 100, DEMO_EVERY = 4000, REFORM_AFTER = 1300, LEAD = 500, IDLE_RESUME = 3600;
      let demo = true, phase = DEMO_EVERY - LEAD, idle = 0, reformed = true, clock = null;
      resetBtn.hidden = true;                         // the demo re-forms itself; the link is for people
      const tick = () => {
        if (!demo) { idle += TICK;
          if (idle >= IDLE_RESUME) { demo = true; idle = 0; resetBtn.hidden = true;
            phase = DEMO_EVERY - LEAD; reformed = true; doReform(); }
          return; }
        phase += TICK;
        if (phase >= DEMO_EVERY) { phase = 0; reformed = false; doSnap(); }
        else if (!reformed && phase >= REFORM_AFTER) { reformed = true; doReform(); }
      };
      const takeover = () => { demo = false; idle = 0; resetBtn.hidden = false; };
      const start = () => { if (!clock && !prefersReducedMotion) clock = setInterval(tick, TICK); };
      const stop = () => { clearInterval(clock); clock = null; cancelAnimationFrame(animationFrame); animationFrame = 0; };
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) stop(); else { start(); if (mode !== 'idle') run(); }
      });

      btn.addEventListener('click', () => { takeover(); doSnap(); });
      resetBtn.addEventListener('click', () => { takeover(); doReform(); });

      // live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
      addEventListener('message', (e) => {
        const d = e.data;
        if (d && d.type === 'forever:theme' && (d.theme === 'light' || d.theme === 'dark')) { root.setAttribute('data-theme', d.theme); syncTheme(); }
      });

      start();                                        // reduced motion: no clock, the slab sits intact
    })();
  </script>
</body>
</html>
