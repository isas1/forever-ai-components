<style>
  /* forever brand tokens — monochrome base + one rationed accent. Dark is the default,
     the light re-theme (warm paper) is the [data-theme="light"] block. */
  :root{
    --sb12-bg:#0a0a0a;--sb12-surface:#111111;--sb12-text:#ededea;
    --sb12-muted:#8a8a85;--sb12-faint:#5a5a56;
    --sb12-border:rgba(255,255,255,.08);--sb12-strong:rgba(255,255,255,.22);
    --sb12-accent:#3fb680;--sb12-accent-soft:rgba(63,182,128,.14);--sb12-accent-line:rgba(63,182,128,.32);
    --sb12-sans:Geist,ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --sb12-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
    --sb12-ease:cubic-bezier(.22,1,.36,1);--sb12-loop:cubic-bezier(.45,0,.55,1);
  }
  :root[data-theme="light"]{
    --sb12-bg:#fafaf8;--sb12-surface:#f4f4f0;--sb12-text:#1a1a18;--sb12-muted:#6b6b66;--sb12-faint:#9a9a93;
    --sb12-border:rgba(0,0,0,.08);--sb12-strong:rgba(0,0,0,.26);
    --sb12-accent:#1a7a50;--sb12-accent-soft:rgba(26,122,80,.12);--sb12-accent-line:rgba(26,122,80,.35);
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--sb12-bg)}
  .sb12-stage{position:fixed;inset:0;display:grid;place-items:center;align-content:center;gap:clamp(14px,5vmin,26px);
    font-family:var(--sb12-sans);color:var(--sb12-text)}
  .sb12-btn{position:relative;border:1px solid var(--sb12-border);background:var(--sb12-surface);color:var(--sb12-muted);
    border-radius:5px;height:clamp(40px,14vmin,56px);padding:0 clamp(18px,7vmin,32px);
    font:500 clamp(13px,4vmin,16px)/1 var(--sb12-sans);letter-spacing:-.01em;cursor:pointer;outline:none;
    transition:color .25s,background .25s,transform .12s var(--sb12-ease)}
  .sb12-btn:hover,.sb12-btn.is-lit{color:var(--sb12-text)}
  .sb12-btn:active,.sb12-btn.is-down{transform:scale(.97);background:var(--sb12-accent-soft)}
  .sb12-btn:focus-visible{box-shadow:0 0 0 2px var(--sb12-bg),0 0 0 4px var(--sb12-accent-line)}
  .sb12-svg{position:absolute;inset:-1px;width:calc(100% + 2px);height:calc(100% + 2px);overflow:visible;pointer-events:none}
  /* the line with no seam: one short dash travels the border forever (pathLength=1 → a full
     offset cycle wraps exactly, so the loop never jumps) */
  :root[data-preview-taken-over] .sb12-run,:root[data-preview-taken-over] .sb12-dot{animation-play-state:paused!important}
  .sb12-run{fill:none;stroke:var(--sb12-strong);stroke-width:1.5;stroke-linecap:round;
    stroke-dasharray:.2 .8;stroke-dashoffset:1;animation:sb12-travel 2.4s linear infinite;transition:opacity .35s}
  /* the live state: the accent draws the whole frame in, the traveller fades */
  .sb12-draw{fill:none;stroke:var(--sb12-accent);stroke-width:1.5;stroke-dasharray:1 1;stroke-dashoffset:1;
    transition:stroke-dashoffset .7s cubic-bezier(.65,0,.35,1)}
  .sb12-btn:hover .sb12-draw,.sb12-btn.is-lit .sb12-draw,.sb12-btn:focus-visible .sb12-draw{stroke-dashoffset:0}
  .sb12-btn:hover .sb12-run,.sb12-btn.is-lit .sb12-run,.sb12-btn:focus-visible .sb12-run{opacity:0}
  @keyframes sb12-travel{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  /* machine-side register: a mono status line under the control */
  .sb12-status{display:flex;align-items:center;gap:8px;font:400 clamp(10px,2.8vmin,12px)/1 var(--sb12-mono);
    letter-spacing:.02em;color:var(--sb12-muted)}
  .sb12-dot{width:6px;height:6px;border-radius:999px;background:var(--sb12-faint);transition:background .3s}
  .sb12-status.is-live .sb12-dot{background:var(--sb12-accent);animation:sb12-beat 2.8s var(--sb12-loop) infinite}
  @keyframes sb12-beat{0%,100%{box-shadow:0 0 0 0 var(--sb12-accent-line);opacity:1}50%{box-shadow:0 0 0 5px transparent;opacity:.6}}
  .sb12-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 var(--sb12-mono);color:var(--sb12-muted);opacity:.5;
    letter-spacing:.08em;text-transform:uppercase;user-select:none;pointer-events:none}
  @media (prefers-reduced-motion:reduce){
    .sb12-run{animation:none;opacity:0}.sb12-draw{stroke-dashoffset:0;transition:none}.sb12-dot{animation:none!important}
  }
</style>

<body>
<div class="sb12-stage">
  <button class="sb12-btn" id="sb12-btn" type="button" aria-describedby="sb12-txt">
    <span>hand it to your agent</span>
    <svg class="sb12-svg" id="sb12-svg" viewBox="0 0 200 50" aria-hidden="true">
      <rect class="sb12-run"  id="sb12-run"  x=".75" y=".75" width="198.5" height="48.5" rx="5.5" pathLength="1"/>
      <rect class="sb12-draw" id="sb12-draw" x=".75" y=".75" width="198.5" height="48.5" rx="5.5" pathLength="1"/>
    </svg>
  </button>
  <div class="sb12-status" id="sb12-status" role="status" aria-live="polite"><span class="sb12-dot"></span><span id="sb12-txt">idle</span></div>
</div>
<div class="sb12-cap" aria-hidden="true">Seamless Stroke Button</div>
<script>(function(){"use strict";
  var root=document.documentElement, btn=document.getElementById('sb12-btn'), svg=document.getElementById('sb12-svg'),
      run=document.getElementById('sb12-run'), draw=document.getElementById('sb12-draw'),
      status=document.getElementById('sb12-status'), txt=document.getElementById('sb12-txt');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  addEventListener('message',function(e){var d=e.data;if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark'))root.setAttribute('data-theme',d.theme);});
  // fit the SVG frame to the button's real pixel box so the corner radius stays true at every size
  function fit(){var r=btn.getBoundingClientRect(),w=Math.round(r.width)+2,h=Math.round(r.height)+2;
    svg.setAttribute('viewBox','0 0 '+w+' '+h);
    [run,draw].forEach(function(el){el.setAttribute('width',w-1.5);el.setAttribute('height',h-1.5);});}
  fit(); addEventListener('resize',fit); if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
  function show(state){ // state: 'idle' | 'live' | 'pressed'
    btn.classList.toggle('is-lit',state!=='idle'); btn.classList.toggle('is-down',state==='pressed');
    status.classList.toggle('is-live',state!=='idle'); txt.textContent=state; }
  // idle demo: nothing on the wall hovers a button, so a 100 ms phase clock performs the very
  // states a pointer would — hover in, press, release, leave — and real input takes over.
  var TICK=100, CYCLE=4800, demo=!reduce&&window.__foreverPreview?.demoEnabled!==false, t=CYCLE-600, clock=null, held=false;
  function tick(){
    if(!demo)return;
    t=(t+TICK)%CYCLE;
    show(t<2200?'idle': t<3700?'live': t<3950?'pressed': 'live');
  }
  function takeover(){ if(!demo)return; demo=false; root.setAttribute("data-preview-taken-over",""); stop(); run.style.animationPlayState="paused"; }
  if(!demo)root.setAttribute("data-preview-taken-over","");
  window.addEventListener("forever:interactive",takeover);
  btn.addEventListener("pointerdown",takeover,true);
  btn.addEventListener("keydown",function(e){if(e.target.isContentEditable||e.key.length===1||/^(Enter| |Arrow|Escape|Home|End|Page)/.test(e.key))takeover();},true);
  btn.addEventListener('pointerenter',function(){takeover();show('live');});
  btn.addEventListener('pointerdown',function(){takeover();held=true;show('pressed');});
  addEventListener('pointerup',function(){ if(held){held=false;show(btn.matches(':hover')?'live':'idle');} });
  btn.addEventListener('pointerleave',function(){ if(!held){takeover();show('idle');} });
  function start(){ if(demo&&!clock&&!reduce)clock=setInterval(tick,TICK); if(demo)run.style.animationPlayState='running'; }
  function stop(){ clearInterval(clock); clock=null; run.style.animationPlayState='paused'; }
  document.addEventListener('visibilitychange',function(){ document.hidden?stop():start(); });
  if(reduce)show('live'); // reduced motion: the drawn accent frame is the meaningful still
  start();
})();</script>
