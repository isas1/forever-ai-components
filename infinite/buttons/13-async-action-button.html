  html,body{margin:0;height:100%;overflow:hidden;background:var(--ab13-bg)}
  .ab13-stage{position:fixed;inset:0;display:grid;place-items:center;align-content:center;gap:clamp(12px,4.5vmin,22px);
    font-family:var(--ab13-sans);color:var(--ab13-text)}
  .ab13-btn{position:relative;display:inline-grid;grid-template-columns:auto auto;align-items:center;gap:10px;
    border:1px solid var(--ab13-strong);background:var(--ab13-surface);color:var(--ab13-text);border-radius:5px;
    height:clamp(40px,14vmin,56px);padding:0 clamp(18px,7vmin,30px);min-width:clamp(150px,52vmin,240px);justify-content:center;
    font:500 clamp(13px,4vmin,16px)/1 var(--ab13-sans);letter-spacing:-.01em;cursor:pointer;outline:none;
    transition:background .3s,border-color .3s,color .3s,transform .12s var(--ab13-ease)}
  .ab13-btn:active,.ab13-btn.is-down{transform:scale(.97)}
  .ab13-btn:focus-visible{box-shadow:0 0 0 2px var(--ab13-bg),0 0 0 4px var(--ab13-accent-line)}
  .ab13-btn.ab13-working{color:var(--ab13-muted);border-color:var(--ab13-accent-line)}
  .ab13-btn.ab13-done{background:var(--ab13-accent);border-color:var(--ab13-accent);color:var(--ab13-on-accent)}
  .ab13-ico{width:18px;height:18px;display:block}
  .ab13-track{stroke:currentColor;opacity:.18}
  /* the spinner is a short arc of the same single stroke; it only turns while working */
  .ab13-arc{stroke:var(--ab13-accent);stroke-linecap:round;stroke-dasharray:15.8 56.6;transform-origin:12px 12px;
    opacity:0;transition:opacity .25s}
  .ab13-working .ab13-arc{opacity:1;animation:ab13-spin .9s linear infinite}
  .ab13-working .ab13-track{opacity:.18}
  .ab13-track,.ab13-arc{transition:opacity .25s}
  .ab13-idle .ab13-track,.ab13-done .ab13-track{opacity:0}
  @keyframes ab13-spin{to{transform:rotate(360deg)}}
  /* the tick draws itself once the work lands */
  .ab13-tick{stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;stroke-dashoffset:1;transition:stroke-dashoffset .38s var(--ab13-ease)}
  .ab13-done .ab13-tick{stroke-dashoffset:0}
  .ab13-plus{stroke:currentColor;stroke-linecap:round;transition:opacity .25s,transform .3s var(--ab13-ease)}
  .ab13-working .ab13-plus,.ab13-done .ab13-plus{opacity:0;transform:scale(.6);transform-origin:12px 12px}
  .ab13-label{white-space:nowrap}
  /* machine-side register under the control */
  .ab13-log{font:400 clamp(10px,2.8vmin,12px)/1.6 var(--ab13-mono);letter-spacing:.02em;color:var(--ab13-muted);text-align:center;min-height:1.6em}
  .ab13-log b{font-weight:500;color:var(--ab13-text)}
  .ab13-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 var(--ab13-mono);color:var(--ab13-muted);opacity:.5;
    letter-spacing:.08em;text-transform:uppercase;user-select:none;pointer-events:none}
  @media (prefers-reduced-motion:reduce){.ab13-arc{animation:none!important}.ab13-tick,.ab13-btn,.ab13-plus{transition:none}}
</style>

<body>
<div class="ab13-stage">
  <button class="ab13-btn ab13-idle" id="ab13-btn" type="button">
    <svg class="ab13-ico" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true">
      <circle class="ab13-track" cx="12" cy="12" r="9"/>
      <circle class="ab13-arc" cx="12" cy="12" r="9"/>
      <path class="ab13-plus" d="M12 6v12M6 12h12"/>
      <path class="ab13-tick" d="M6.5 12.5 10.2 16.2 17.5 8.5" pathLength="1"/>
    </svg>
    <span class="ab13-label" id="ab13-label">copy component</span>
  </button>
  <div class="ab13-log" id="ab13-log" role="status" aria-live="polite">id: <b>orbital-dots</b> · 3.8 kb</div>
</div>
<div class="ab13-cap" aria-hidden="true">Async Action Button</div>
<script>(function(){"use strict";
  var root=document.documentElement, btn=document.getElementById('ab13-btn'), label=document.getElementById('ab13-label'), log=document.getElementById('ab13-log');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  addEventListener('message',function(e){var d=e.data;if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark'))root.setAttribute('data-theme',d.theme);});
  // realistic ids the demo cycles through — first-name-free, product-shaped
  var items=[['orbital-dots','3.8 kb'],['pricing-stack','9.4 kb'],['hairline-cta','7.1 kb'],['traced-skeleton','6.2 kb']], cur=0;
  var WORK=1400, DONE=1700, GAP=1900, TICK=100, IDLE_RESUME=3600;
  var state='idle', t=0, demo=!reduce&&window.__foreverPreview?.demoEnabled!==false, clock=null;
  function set(s){ state=s; t=0;
    btn.className='ab13-btn ab13-'+s;
    label.textContent = s==='idle'?'copy component': s==='working'?'copying': 'copied';
    log.innerHTML = s==='idle' ? 'id: <b>'+items[cur][0]+'</b> · '+items[cur][1]
                  : s==='working' ? 'fetching <b>'+items[cur][0]+'</b>'
                  : '<b>'+items[cur][0]+'</b> in your clipboard';
  }
  function trigger(){ if(state!=='idle')return; if(reduce){set('done');setTimeout(function(){cur=(cur+1)%items.length;set('idle');},DONE);return;} set('working'); }
  function takeover(){demo=false;if(state==='idle')stop();}
  window.addEventListener("forever:interactive",takeover);
  btn.addEventListener("pointerdown",takeover,true);
  btn.addEventListener("keydown",function(e){if(e.target.isContentEditable||e.key.length===1||/^(Enter| |Arrow|Escape|Home|End|Page)/.test(e.key))takeover();},true);
  // one 100 ms phase clock drives the state machine; the idle demo triggers it the way a click would
  function tick(){
    t+=TICK;
    if(state==='working'&&t>=WORK)set('done');
    else if(state==='done'&&t>=DONE){cur=(cur+1)%items.length;set('idle');}
    else if(state==='idle'&&!demo){stop();return;} else if(state==='idle'&&t>=GAP)trigger();
  }
  btn.addEventListener('click',function(){ takeover(); trigger(); start(); });
  function start(){ if(!clock)clock=setInterval(tick,TICK); }
  function stop(){ clearInterval(clock); clock=null; }
  document.addEventListener('visibilitychange',function(){ document.hidden?stop():start(); });
  set('idle'); t=GAP-500;          // first demo copy lands ~0.5 s after mount
  if(!reduce)start();               // reduced motion: idle button, click still resolves without the spin
})();</script>
