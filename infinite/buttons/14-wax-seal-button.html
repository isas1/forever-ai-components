<script>/* theme hook: ?theme=light|dark, before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  /* Classical Atelier register — limestone, parchment, ink and four mineral pigments.
     Dark register is the default (gallery lighting), the light register is the [data-theme="light"] block. */
  :root{
    --ws14-page:#17130f;--ws14-panel:#241e18;--ws14-ink:#f1e9d8;--ws14-muted:#bdb2a1;
    --ws14-pompeii:#d66b59;--ws14-olive:#929b64;--ws14-bronze:#c99a51;
    --ws14-hair:rgba(241,233,216,.18);--ws14-rule:rgba(241,233,216,.32);--ws14-hi:rgba(241,233,216,.22);
    --ws14-inset:#100d0a;--ws14-inverse:#17130f;
    --ws14-display:Marcellus,Georgia,"Times New Roman",serif;--ws14-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
    --ws14-mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  :root[data-theme="light"]{
    --ws14-page:#e9e4da;--ws14-panel:#f8f4ea;--ws14-ink:#241f19;--ws14-muted:#675f54;
    --ws14-pompeii:#94382f;--ws14-olive:#58613b;--ws14-bronze:#9a6828;
    --ws14-hair:rgba(36,31,25,.16);--ws14-rule:rgba(36,31,25,.34);--ws14-hi:rgba(255,255,255,.72);
    --ws14-inset:#dcd6ca;--ws14-inverse:#f8f4ea;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ws14-page)}
  .ws14-stage{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--ws14-body);color:var(--ws14-ink)}
  .ws14-plaque{width:min(84%,360px);background:var(--ws14-panel);border:1px solid var(--ws14-rule);border-radius:2px;
    box-shadow:0 1px 1px rgba(0,0,0,.1),0 2px 6px -2px rgba(0,0,0,.12);padding:clamp(14px,5vmin,24px);display:grid;gap:clamp(10px,3.4vmin,16px)}
  .ws14-eyebrow{font:400 clamp(12px,3vmin,13px)/1.2 var(--ws14-display);letter-spacing:.18em;text-transform:uppercase;color:var(--ws14-ink)}
  .ws14-reg{display:grid;grid-template-columns:minmax(64px,38.2%) 1fr;font-size:clamp(12px,2.8vmin,13px);line-height:1.4;border-top:1px solid var(--ws14-hair);padding:6px 0}
  .ws14-reg b{font-weight:400;font-size:max(12px,.85em);letter-spacing:.09em;text-transform:uppercase;color:var(--ws14-muted)}
  .ws14-reg i{font:400 max(12px,.95em) var(--ws14-mono);font-style:normal;color:var(--ws14-bronze);letter-spacing:.02em}
  /* the wax seal button: pigment face, 1px darker edge, relief shadow; the disc sinks on press */
  .ws14-btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;overflow:hidden;
    min-height:clamp(36px,12vmin,48px);padding:0 16px;border-radius:2px;cursor:pointer;outline:none;
    background:var(--ws14-pompeii);color:var(--ws14-inverse);border:1px solid color-mix(in oklab,var(--ws14-pompeii) 62%,var(--ws14-ink));
    box-shadow:0 1px 0 0 var(--ws14-hair),inset 0 1px 0 0 var(--ws14-hi);
    font:400 clamp(12px,3.2vmin,14px)/1 var(--ws14-body);letter-spacing:.09em;text-transform:uppercase;
    transition:transform 90ms cubic-bezier(.4,0,.6,1),box-shadow 90ms,background 220ms,color 220ms,border-color 220ms}
  .ws14-btn:focus-visible{box-shadow:0 0 0 2px var(--ws14-panel),0 0 0 4px color-mix(in oklab,#264f72 70%,transparent)}
  .ws14-btn.is-down,.ws14-btn:active{transform:scale(.985);box-shadow:inset 0 1px 2px 0 rgba(0,0,0,.3)}
  .ws14-seal{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--ws14-pompeii);
    border:1px solid color-mix(in oklab,var(--ws14-pompeii) 62%,var(--ws14-ink));
    box-shadow:inset 0 1px 0 0 rgba(255,255,255,.34),inset 0 -1px 2px 0 color-mix(in oklab,var(--ws14-pompeii) 62%,var(--ws14-ink));transition:transform 90ms,background 220ms}
  .ws14-seal i{width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,.46)}
  .ws14-btn.is-down .ws14-seal{transform:translateY(1px) scale(.94);box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
  /* busy: the relief-light sweep — the only sheen in the system */
  .ws14-sheen{position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(100deg,transparent 30%,color-mix(in oklab,var(--ws14-hi) 60%,transparent) 48%,transparent 66%);background-size:200% 100%}
  .ws14-btn.is-busy .ws14-sheen{opacity:1;animation:ws14-sweep 2.6s linear infinite}
  @keyframes ws14-sweep{from{background-position:120% 0}to{background-position:-120% 0}}
  /* sealed: the face turns to parchment plaque, the disc reads as impressed */
  .ws14-btn.is-done{background:var(--ws14-panel);color:var(--ws14-ink);border-color:var(--ws14-rule);cursor:default}
  .ws14-btn.is-done .ws14-seal{background:var(--ws14-inverse);border-color:var(--ws14-pompeii)}
  .ws14-btn.is-done .ws14-seal i{border-color:var(--ws14-pompeii)}
  .ws14-status{font:400 12px/1.4 var(--ws14-mono);letter-spacing:.02em;color:var(--ws14-bronze);min-height:1.4em}
  .ws14-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 var(--ws14-mono);color:var(--ws14-muted);opacity:.5;letter-spacing:.08em;text-transform:uppercase;user-select:none;pointer-events:none}
  @media (max-height:230px){.ws14-reg:not(:first-child),.ws14-status{display:none}.ws14-plaque{padding:10px 12px;gap:6px}.ws14-eyebrow{font-size:12px}}
  @media (prefers-reduced-motion:reduce){.ws14-btn,.ws14-seal{transition:none}.ws14-btn.is-busy .ws14-sheen{animation:none;opacity:0}}
</style>

<body>
<div class="ws14-stage">
  <div class="ws14-plaque">
    <div class="ws14-eyebrow">Deed of transfer</div>
    <div>
      <div class="ws14-reg"><b>Accession</b><i>1962.14</i></div>
      <div class="ws14-reg"><b>Object</b><span>Limestone relief fragment</span></div>
      <div class="ws14-reg"><b>To</b><span>Study collection, room 4</span></div>
    </div>
    <button class="ws14-btn" id="ws14-btn" type="button"><span class="ws14-seal" aria-hidden="true"><i></i></span><span id="ws14-label">Seal the record</span><span class="ws14-sheen" aria-hidden="true"></span></button>
    <div class="ws14-status" id="ws14-status" role="status" aria-live="polite">1962.14 · awaiting seal</div>
  </div>
</div>
<div class="ws14-cap" aria-hidden="true">Wax Seal Button</div>
<script>(function(){"use strict";
  var root=document.documentElement, btn=document.getElementById('ws14-btn'), label=document.getElementById('ws14-label'), status=document.getElementById('ws14-status');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  addEventListener('message',function(e){var d=e.data;if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark'))root.setAttribute('data-theme',d.theme);});
  // states: idle → down (90 ms) → busy (the sweep) → done (sealed) → idle. One 100 ms clock; a click runs the same path.
  var TICK=100, DOWN=200, BUSY=1500, DONE=2000, GAP=1800, state='idle', t=GAP-700, demo=!reduce&&window.__foreverPreview?.demoEnabled!==false, clock=null;
  function set(s){ state=s; t=0; btn.className='ws14-btn'+(s==='down'?' is-down':s==='busy'?' is-busy':s==='done'?' is-done':'');
    btn.setAttribute('aria-busy',s==='busy'?'true':'false'); btn.disabled=(s==='busy'||s==='done');
    label.textContent = s==='busy'?'Sealing': s==='done'?'Sealed':'Seal the record';
    status.textContent = s==='idle'?'1962.14 · awaiting seal': s==='busy'?'1962.14 · impressing': s==='done'?'1962.14 · sealed 14:02':'1962.14 · pressed'; }
  function press(){ if(state!=='idle')return; if(reduce){set('done');setTimeout(function(){set('idle');},DONE);return;} set('down'); }
  function takeover(){demo=false;if(state==='idle')stop();}
  window.addEventListener('forever:interactive',takeover);
  btn.addEventListener('pointerdown',takeover,true);
  btn.addEventListener('keydown',takeover,true);
  function tick(){ if(state==='idle'&&!demo){stop();return;} t+=TICK;
    if(state==='down'&&t>=DOWN)set('busy'); else if(state==='busy'&&t>=BUSY)set('done'); else if(state==='done'&&t>=DONE)set('idle');
    else if(state==='idle'&&t>=GAP)press(); }
  btn.addEventListener('click',function(){ takeover(); press(); start(); });
  function start(){ if(!clock&&!reduce&&(demo||state!=='idle'))clock=setInterval(tick,TICK); }
  function stop(){ clearInterval(clock); clock=null; }
  document.addEventListener('visibilitychange',function(){ document.hidden?stop():start(); });
  set('idle'); t=GAP-700; start(); // reduced motion: the idle plaque; a click seals without the sweep
})();</script>
