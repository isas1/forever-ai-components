<title>Ceramic Toggle Tiles</title>
<script>/* theme hook: ?theme=light|dark, before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  /* Urban Azulejo register — glazed modules on grout, cobalt linework; dark glaze by default, light glaze in the [data-theme="light"] block */
  :root{
    --ct15-bg:#111b25;--ct15-face:#223140;--ct15-shade:#1a2733;--ct15-ink:#eef1ec;--ct15-muted:#adb8bc;--ct15-invert:#fbf8f1;
    --ct15-cobalt:#7a9cc4;--ct15-cobalt-deep:#b7c8dc;--ct15-grout:#0b141d;--ct15-sheen:rgba(255,255,255,.06);--ct15-hair:rgba(238,241,236,.14);
    --ct15-display:"Archivo Black","Arial Black",Impact,sans-serif;--ct15-body:"Source Sans 3",ui-sans-serif,system-ui,sans-serif;--ct15-mono:"Recursive Mono",ui-monospace,Menlo,monospace;
  }
  :root[data-theme="light"]{
    --ct15-bg:#ded9cf;--ct15-face:#fbf8f1;--ct15-shade:#e7e0d2;--ct15-ink:#17263b;--ct15-muted:#616b72;--ct15-invert:#fbf8f1;
    --ct15-cobalt:#1d5295;--ct15-cobalt-deep:#123969;--ct15-grout:#c7bfb0;--ct15-sheen:rgba(255,255,255,.72);--ct15-hair:rgba(23,38,59,.14);
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ct15-bg)}
  .ct15-stage{position:fixed;inset:0;display:grid;place-items:center;align-content:center;gap:clamp(8px,3vmin,14px);padding:4vmin;font-family:var(--ct15-body);color:var(--ct15-ink)}
  .ct15-legend{font:400 clamp(9px,2.7vmin,12px)/1 var(--ct15-display);letter-spacing:.14em;text-transform:uppercase}
  /* grout is the only structural border: a grid whose gap colour shows through */
  .ct15-set{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--ct15-grout);padding:3px;width:min(100%,420px);perspective:900px;border-radius:2px}
  .ct15-tile{position:relative;aspect-ratio:1;border:0;cursor:pointer;overflow:hidden;border-radius:2px;text-align:left;
    display:grid;align-content:end;gap:3px;padding:clamp(6px,2.6vmin,12px);
    background:var(--ct15-face);color:var(--ct15-ink);box-shadow:inset 0 0 0 1px var(--ct15-hair);transform-style:preserve-3d;outline:none;
    transition:background 180ms cubic-bezier(.2,0,0,1),color 180ms cubic-bezier(.2,0,0,1)}
  .ct15-tile:focus-visible{box-shadow:inset 0 0 0 2px var(--ct15-cobalt)}
  .ct15-tile[aria-checked="true"]{background:var(--ct15-cobalt);color:var(--ct15-invert);box-shadow:inset 0 0 0 1px var(--ct15-cobalt-deep)}
  .ct15-tile.is-flip{animation:ct15-flip 320ms cubic-bezier(.2,0,0,1)}
  @keyframes ct15-flip{0%{transform:rotateY(0)}50%{transform:rotateY(-90deg)}100%{transform:rotateY(0)}}
  /* generated motifs: primitive symmetry operations on one square module, never a traced panel */
  .ct15-motif{position:absolute;inset:0;opacity:.28;transition:opacity 180ms;background-repeat:repeat}
  .ct15-tile[aria-checked="true"] .ct15-motif{opacity:.26}
  .ct15-tile[aria-checked="true"]::after{content:"";position:absolute;inset:auto 0 0;height:62%;background:linear-gradient(to top,rgba(23,38,59,.72),rgba(23,38,59,.35) 55%,transparent);pointer-events:none}
  .ct15-name,.ct15-desc{z-index:1}
  .ct15-sheen{position:absolute;inset:0;background:linear-gradient(150deg,var(--ct15-sheen) 0 26%,transparent 27% 74%,rgba(23,38,59,.05) 100%);pointer-events:none}
  .ct15-name{position:relative;font:400 clamp(9px,2.8vmin,13px)/1 var(--ct15-display);letter-spacing:.06em;text-transform:uppercase}
  .ct15-desc{position:relative;font-size:clamp(8px,2.3vmin,11px);line-height:1.35;color:var(--ct15-muted)}
  .ct15-tile[aria-checked="true"] .ct15-desc{color:rgba(251,248,241,.78)}
  .ct15-stamp{position:absolute;top:6px;right:7px;font:400 clamp(8px,2.2vmin,10px)/1 var(--ct15-mono);letter-spacing:.06em;color:var(--ct15-muted)}
  .ct15-tile[aria-checked="true"] .ct15-stamp{color:rgba(251,248,241,.8)}
  .ct15-coord{font:400 clamp(8px,2.4vmin,11px)/1 var(--ct15-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ct15-muted)}
  .ct15-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 var(--ct15-mono);color:var(--ct15-muted);opacity:.5;letter-spacing:.08em;text-transform:uppercase;user-select:none;pointer-events:none}
  @media (max-width:300px){.ct15-desc{display:none}}
  @media (prefers-reduced-motion:reduce){.ct15-tile{animation:none!important;transition:none}}
</style>

<body>
<div class="ct15-stage">
  <div class="ct15-legend" id="ct15-legend">Finish</div>
  <div class="ct15-set" role="radiogroup" aria-labelledby="ct15-legend" id="ct15-set"></div>
  <div class="ct15-coord" id="ct15-coord">bay c4 · glaze</div>
</div>
<div class="ct15-cap" aria-hidden="true">Ceramic Toggle Tiles</div>
<script>(function(){"use strict";
  var root=document.documentElement, set=document.getElementById('ct15-set'), coord=document.getElementById('ct15-coord');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  addEventListener('message',function(e){var d=e.data;if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark'))root.setAttribute('data-theme',d.theme);});
  var L='var(--ct15-cobalt)', W='var(--ct15-invert)';
  var motifs={
    quatrefoil:function(c){return 'radial-gradient(circle at 50% 0,#0000 24%,'+c+' 24% 30%,#0000 30%),radial-gradient(circle at 50% 100%,#0000 24%,'+c+' 24% 30%,#0000 30%),radial-gradient(circle at 0 50%,#0000 24%,'+c+' 24% 30%,#0000 30%),radial-gradient(circle at 100% 50%,#0000 24%,'+c+' 24% 30%,#0000 30%)';},
    lattice:function(c){return 'repeating-linear-gradient(0deg,'+c+' 0 2px,#0000 2px 12px),repeating-linear-gradient(90deg,'+c+' 0 2px,#0000 2px 12px)';},
    pinwheel:function(c){return 'conic-gradient(from 0deg at 50% 50%,'+c+' 0 25%,#0000 25% 50%,'+c+' 50% 75%,#0000 75% 100%)';}
  };
  var opts=[['glaze','quatrefoil','high sheen, sealed'],['matte','lattice','no sheen, porous'],['raw','pinwheel','unfired bisque']], tiles=[], cur=0;
  opts.forEach(function(o,i){ var b=document.createElement('button'); b.type='button'; b.className='ct15-tile'; b.setAttribute('role','radio'); b.setAttribute('aria-checked','false'); b.tabIndex=i?-1:0;
    b.innerHTML='<span class="ct15-motif" aria-hidden="true"></span><span class="ct15-sheen" aria-hidden="true"></span><span class="ct15-stamp" aria-hidden="true">OFF</span><span class="ct15-name">'+o[0]+'</span><span class="ct15-desc">'+o[2]+'</span>';
    b.addEventListener('click',function(){ takeover(); pick(i,true); });
    b.addEventListener('keydown',function(e){ var k=e.key; if(k==='ArrowRight'||k==='ArrowDown'){e.preventDefault();takeover();pick((cur+1)%3,true);tiles[cur].focus();} if(k==='ArrowLeft'||k==='ArrowUp'){e.preventDefault();takeover();pick((cur+2)%3,true);tiles[cur].focus();} });
    set.appendChild(b); tiles.push(b); });
  function paintMotifs(){ tiles.forEach(function(b,i){ var on=b.getAttribute('aria-checked')==='true'; b.querySelector('.ct15-motif').style.backgroundImage=motifs[opts[i][1]](on?W:L); }); }
  function pick(i,flip){ cur=i; tiles.forEach(function(b,j){ var on=j===i; b.setAttribute('aria-checked',on?'true':'false'); b.tabIndex=on?0:-1; b.querySelector('.ct15-stamp').textContent=on?'ON':'OFF';
      b.classList.remove('is-flip'); if(on&&flip&&!reduce){ void b.offsetWidth; b.classList.add('is-flip'); } });
    paintMotifs(); coord.textContent='bay c4 · '+opts[i][0]; }
  // idle demo: the selection walks the row every 3 s; a click or arrow key takes over, the walk resumes after 3.6 s quiet
  var TICK=100, EVERY=3000, t=EVERY-1200, demo=!reduce&&window.__foreverPreview?.demoEnabled!==false, clock=null;
  function takeover(){ if(!demo)return; demo=false; stop(); }
  window.addEventListener("forever:interactive",takeover);
  set.addEventListener("pointerdown",takeover,true);
  set.addEventListener("keydown",function(e){if(e.target.isContentEditable||e.key.length===1||/^(Enter| |Arrow|Escape|Home|End|Page)/.test(e.key))takeover();},true);
  function tick(){ if(demo){ t+=TICK; if(t>=EVERY){t=0;pick((cur+1)%3,true);} } }
  function start(){ if(!clock&&!reduce&&demo)clock=setInterval(tick,TICK); }
  function stop(){ clearInterval(clock); clock=null; }
  document.addEventListener('visibilitychange',function(){ document.hidden?stop():start(); });
  pick(0,false); start(); // reduced motion: the first tile on, no flip, no walk — keys and clicks still switch
})();</script>
