<meta charset="utf-8">

<title>Clay Press Toggle</title>
<script>/* theme hook: ?theme=light|dark, before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  /* Root & Pigment — dark ground by default, pale fibre in the [data-theme="light"] block */
  :root{
    --cp16-ground:#152019;--cp16-fibre:#202d23;--cp16-ink:#edf0e5;--cp16-lichen:#adb8aa;--cp16-clay:#d97459;--cp16-moss:#82a17d;--cp16-water:#70aeb0;--cp16-lift:#3a4a3d;--cp16-shade:#0a110c;--cp16-on:#152019;
    --cp16-hair:rgba(173,184,170,.18);--cp16-rule:rgba(173,184,170,.34);
    --cp16-body:"Noto Sans",ui-sans-serif,system-ui,sans-serif;--cp16-mono:"Noto Sans Mono",ui-monospace,Menlo,monospace;
  }
  :root[data-theme="light"]{
    --cp16-ground:#e7e1d3;--cp16-fibre:#f4efe4;--cp16-ink:#253126;--cp16-lichen:#596458;--cp16-clay:#983f2f;--cp16-moss:#466348;--cp16-water:#39757a;--cp16-lift:#ffffff;--cp16-shade:#253126;--cp16-on:#f4efe4;
    --cp16-hair:rgba(89,100,88,.18);--cp16-rule:rgba(89,100,88,.34);
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--cp16-ground)}
  body{background-image:repeating-linear-gradient(92deg,color-mix(in oklab,var(--cp16-ink) 3%,transparent) 0 1px,transparent 1px 7px),repeating-linear-gradient(3deg,color-mix(in oklab,var(--cp16-ink) 2%,transparent) 0 1px,transparent 1px 9px)}
  .cp16-stage{position:fixed;inset:0;display:grid;place-items:center;padding:4vmin;font-family:var(--cp16-body);color:var(--cp16-ink)}
  .cp16-card{width:min(100%,400px);background:var(--cp16-fibre);border-radius:28px 14px 28px 14px;padding:clamp(12px,4.4vmin,24px);display:grid;gap:clamp(8px,3vmin,14px);
    box-shadow:0 1px 0 color-mix(in oklab,var(--cp16-lift) 60%,transparent),0 12px 26px -20px color-mix(in oklab,var(--cp16-shade) 55%,transparent)}
  .cp16-rows{display:grid;gap:clamp(4px,1.6vmin,8px)}
  .cp16-legend{font-size:clamp(9px,2.7vmin,12px);letter-spacing:.09em;text-transform:uppercase;color:var(--cp16-lichen)}
  .cp16-row{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:clamp(8px,3vmin,14px);cursor:pointer;min-height:44px}
  .cp16-row input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
  /* an unfired clay tile: raised fibre when off, pressed pigment with paper tooth when on — 90 ms, no spring */
  .cp16-tile{position:relative;width:clamp(30px,11vmin,40px);height:clamp(30px,11vmin,40px);display:grid;place-items:center;border-radius:14px;
    background:color-mix(in oklab,var(--cp16-fibre) 62%,var(--cp16-ground));border:1px solid var(--cp16-rule);
    box-shadow:0 1px 0 color-mix(in oklab,var(--cp16-lift) 60%,transparent),0 12px 26px -20px color-mix(in oklab,var(--cp16-shade) 55%,transparent);
    transition:transform 90ms cubic-bezier(.3,0,.2,1),background 90ms,box-shadow 90ms,border-color 90ms}
  .cp16-row.is-down .cp16-tile{transform:translateY(1px) scale(.97)}
  .cp16-row input:checked + .cp16-tile{border-color:transparent;background-color:var(--cp16-tone);
    background-image:radial-gradient(circle at 50% 50%,color-mix(in oklab,var(--cp16-lift) 14%,transparent) 0 .5px,transparent .6px);background-size:5px 5px;
    box-shadow:inset 0 2px 5px -1px color-mix(in oklab,var(--cp16-shade) 34%,transparent),inset 0 -1px 0 color-mix(in oklab,var(--cp16-lift) 40%,transparent)}
  .cp16-row input:focus-visible + .cp16-tile{box-shadow:0 0 0 2px var(--cp16-fibre),0 0 0 4px var(--cp16-water)}
  .cp16-tile svg{width:50%;height:50%}
  .cp16-tile path{fill:none;stroke:var(--cp16-rule);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset 90ms cubic-bezier(.3,0,.2,1),stroke 90ms}
  .cp16-row input:checked + .cp16-tile path{stroke-dashoffset:0;stroke:var(--cp16-on)}
  .cp16-text{display:grid;gap:2px;min-width:0}
  .cp16-name{font-size:clamp(11px,3.2vmin,15px);font-weight:600;line-height:1.25}
  .cp16-desc{font-size:clamp(9px,2.5vmin,12px);line-height:1.45;color:var(--cp16-lichen)}
  .cp16-foot{font:400 clamp(8px,2.4vmin,11px)/1.4 var(--cp16-mono);color:var(--cp16-lichen);border-top:1px solid var(--cp16-hair);padding-top:clamp(6px,2vmin,10px)}
  .cp16-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 var(--cp16-mono);color:var(--cp16-lichen);opacity:.5;letter-spacing:.08em;text-transform:uppercase;user-select:none;pointer-events:none}
  @media (max-height:230px){.cp16-desc,.cp16-foot{display:none}.cp16-row{min-height:30px}.cp16-card{gap:4px;padding:10px 12px}.cp16-tile{width:26px;height:26px;border-radius:9px}}
  @media (prefers-reduced-motion:reduce){.cp16-tile,.cp16-tile path{transition:none}}
</style>

<body>
<div class="cp16-stage">
  <div class="cp16-card"><div class="cp16-legend" id="cp16-legend">Station settings</div><div id="cp16-rows" class="cp16-rows" role="group" aria-labelledby="cp16-legend"></div>
    <div class="cp16-foot" id="cp16-foot">2 of 3 on · saved to plot 3</div></div>
</div>
<div class="cp16-cap" aria-hidden="true">Clay Press Toggle</div>
<script>(function(){"use strict";
  var root=document.documentElement, host=document.getElementById('cp16-rows'), foot=document.getElementById('cp16-foot');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  addEventListener('message',function(e){var d=e.data;if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark'))root.setAttribute('data-theme',d.theme);});
  // every restrictive toggle carries a description; state is never colour alone (the drawn press mark + the checkbox)
  var opts=[['low-render mode','drops textures and ambient motion','clay',false],['field notes','show notes beside each reading','moss',true],['share readings','publish this plot to the station','water',true]], rows=[];
  opts.forEach(function(o,i){ var l=document.createElement('label'); l.className='cp16-row'; l.style.setProperty('--cp16-tone','var(--cp16-'+o[2]+')');
    l.innerHTML='<input type="checkbox"'+(o[3]?' checked':'')+'><span class="cp16-tile" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M4 10.6l4 4L16 6"/></svg></span><span class="cp16-text"><span class="cp16-name">'+o[0]+'</span><span class="cp16-desc">'+o[1]+'</span></span>';
    var inp=l.querySelector('input');
    l.addEventListener('pointerdown',function(){l.classList.add('is-down');}); addEventListener('pointerup',function(){l.classList.remove('is-down');}); l.addEventListener('pointerleave',function(){l.classList.remove('is-down');});
    inp.addEventListener('change',function(){ takeover(); count(); });
    host.appendChild(l); rows.push(l); });
  function count(){ var on=rows.filter(function(r){return r.querySelector('input').checked;}).length; foot.textContent=on+' of 3 on · saved to plot 3'; }
  function press(i){ var r=rows[i], inp=r.querySelector('input'); r.classList.add('is-down'); setTimeout(function(){ r.classList.remove('is-down'); inp.checked=!inp.checked; count(); },90); }
  // idle demo on a 100 ms clock: one tile is pressed every 2.2 s, walking the list; a real press takes over, the walk resumes after 3.6 s quiet
  var TICK=100, EVERY=2200, t=EVERY-900, k=0, demo=!reduce&&window.__foreverPreview?.demoEnabled!==false, clock=null;
  function takeover(){ if(!demo)return; demo=false; stop(); }
  window.addEventListener("forever:interactive",takeover);
  host.addEventListener("pointerdown",takeover,true);
  host.addEventListener("keydown",function(e){if(e.target.isContentEditable||e.key.length===1||/^(Enter| |Arrow|Escape|Home|End|Page)/.test(e.key))takeover();},true);
  function tick(){ if(demo){ t+=TICK; if(t>=EVERY){t=0;press(k);k=(k+1)%3;} } }
  function start(){ if(!clock&&!reduce&&demo)clock=setInterval(tick,TICK); }
  function stop(){ clearInterval(clock); clock=null; }
  document.addEventListener('visibilitychange',function(){ document.hidden?stop():start(); });
  count(); start(); // reduced motion: the still list, instant state changes on press
})();</script>
</body>
