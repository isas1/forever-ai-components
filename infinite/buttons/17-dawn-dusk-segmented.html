<title>Dawn to Dusk Segmented</title>
<script>/* theme hook: ?theme=light|dark, before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  /* Plein-Air Light — dusk by default, warm daylight in the [data-theme="light"] block */
  :root{
    --dd17-bg:#17212b;--dd17-surface:#22303a;--dd17-ink:#f5e9d2;--dd17-muted:#bac0ba;--dd17-sunk:rgba(0,0,0,.22);--dd17-water:#73b0bd;
    --dd17-wash-warm:rgba(226,185,81,.16);--dd17-wash-cool:rgba(115,176,189,.16);--dd17-wash-red:rgba(233,121,91,.16);--dd17-wash-leaf:rgba(140,162,121,.15);
    --dd17-display:Ysabeau,Georgia,"Iowan Old Style",serif;--dd17-ui:"Source Sans 3",ui-sans-serif,system-ui,sans-serif;
  }
  :root[data-theme="light"]{
    --dd17-bg:#f1e5ce;--dd17-surface:#faf4e7;--dd17-ink:#203044;--dd17-muted:#686b6b;--dd17-sunk:rgba(32,48,68,.07);--dd17-water:#356c7d;
    --dd17-wash-warm:rgba(194,138,33,.16);--dd17-wash-cool:rgba(53,108,125,.14);--dd17-wash-red:rgba(158,62,49,.14);--dd17-wash-leaf:rgba(82,107,69,.13);
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--dd17-bg)}
  .dd17-stage{position:fixed;inset:0;display:grid;place-items:center;padding:4vmin;font-family:var(--dd17-ui);color:var(--dd17-ink)}
  .dd17-panel{position:relative;width:min(100%,420px);border-radius:16px;background:var(--dd17-surface);padding:clamp(10px,3.6vmin,22px);overflow:hidden;
    box-shadow:0 2px 4px rgba(32,48,68,.05),0 12px 28px -14px rgba(32,48,68,.2)}
  /* the field: one soft radial pigment wash whose temperature follows the hour — a wash, never a linear gradient */
  .dd17-field{position:absolute;inset:0;transition:background 260ms cubic-bezier(.2,.7,.25,1),opacity 260ms}
  .dd17-bar{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:clamp(28px,9vmin,40px);padding:3px;border-radius:6px;background:var(--dd17-sunk);box-shadow:inset 0 1px 3px rgba(32,48,68,.1)}
  .dd17-ind{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/4);border-radius:4px;background:var(--dd17-surface);box-shadow:0 1px 2px rgba(32,48,68,.12);transition:transform 220ms cubic-bezier(.2,.7,.25,1),background-image 220ms}
  .dd17-b{position:relative;z-index:1;display:grid;place-items:center;font-size:clamp(9px,2.4vmin,13px);font-weight:600;color:var(--dd17-muted);white-space:nowrap;cursor:pointer;border:0;background:none;outline:none;border-radius:4px;transition:color 220ms}
  .dd17-b[aria-checked="true"]{color:var(--dd17-ink)}
  .dd17-b:focus-visible{outline:2px solid var(--dd17-water);outline-offset:-2px}
  .dd17-read{position:relative;margin:clamp(8px,3vmin,18px) 0 0;font:300 clamp(18px,8vmin,40px)/1.1 var(--dd17-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .dd17-sub{position:relative;margin:2px 0 0;font-size:clamp(9px,2.4vmin,12px);color:var(--dd17-muted)}
  .dd17-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--dd17-muted);opacity:.5;letter-spacing:.08em;text-transform:uppercase;user-select:none;pointer-events:none}
  @media (prefers-reduced-motion:reduce){.dd17-ind,.dd17-field,.dd17-b{transition:none}}
@media(max-width:220px){.dd17-b{min-width:0;padding:0 2px}.dd17-panel{padding:8px}}
</style>

<body>
<div class="dd17-stage">
  <div class="dd17-panel">
    <div class="dd17-field" id="dd17-field" aria-hidden="true"></div>
    <div class="dd17-bar" role="radiogroup" aria-label="Time of day" id="dd17-bar"><div class="dd17-ind" id="dd17-ind" aria-hidden="true"></div></div>
    <p class="dd17-read" id="dd17-read">05:41</p>
    <p class="dd17-sub" id="dd17-sub">Cold light, long shadows</p>
  </div>
</div>
<div class="dd17-cap" aria-hidden="true">Dawn to Dusk Segmented</div>
<script>(function(){"use strict";
  var root=document.documentElement, bar=document.getElementById('dd17-bar'), ind=document.getElementById('dd17-ind'), field=document.getElementById('dd17-field'), read=document.getElementById('dd17-read'), sub=document.getElementById('dd17-sub');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  addEventListener('message',function(e){var d=e.data;if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark'))root.setAttribute('data-theme',d.theme);});
  var S=[['Dawn','05:41','Cold light, long shadows','var(--dd17-wash-red)'],['Morning','09:12','Warm ground, cool distance','var(--dd17-wash-warm)'],['Midday','13:04','Flat value, high key','var(--dd17-wash-leaf)'],['Dusk','19:26','Temperature splits','var(--dd17-wash-cool)']], btns=[], k=0;
  S.forEach(function(s,i){ var b=document.createElement('button'); b.type='button'; b.className='dd17-b'; b.setAttribute('role','radio'); b.setAttribute('aria-checked','false'); b.tabIndex=i?-1:0; b.textContent=s[0];
    b.addEventListener('click',function(){ takeover(); set(i); });
    b.addEventListener('keydown',function(e){ var n=e.key==='ArrowRight'||e.key==='ArrowDown'?(k+1)%4: e.key==='ArrowLeft'||e.key==='ArrowUp'?(k+3)%4:-1; if(n<0)return; e.preventDefault(); takeover(); set(n); btns[n].focus(); });
    bar.appendChild(b); btns.push(b); });
  function set(n){ k=n; ind.style.transform='translateX('+(n*100)+'%)'; ind.style.backgroundImage='linear-gradient(to bottom,'+S[n][3]+',transparent)';
    field.style.background='radial-gradient(120% 90% at '+(12+n*26)+'% 10%,'+S[n][3]+' 0,transparent 62%)';
    btns.forEach(function(b,j){ b.setAttribute('aria-checked',j===n?'true':'false'); b.tabIndex=j===n?0:-1; }); read.textContent=S[n][1]; sub.textContent=S[n][2]; }
  // the control answers in 220 ms; the idle demo advances the hour every 3.6 s, and a click or arrow key takes over
  var TICK=100, EVERY=3600, t=EVERY-1400, demo=!reduce&&window.__foreverPreview?.demoEnabled!==false, clock=null;
  function takeover(){ if(!demo)return; demo=false; stop(); }
  window.addEventListener("forever:interactive",takeover);
  bar.addEventListener("pointerdown",takeover,true);
  bar.addEventListener("keydown",function(e){if(e.target.isContentEditable||e.key.length===1||/^(Enter| |Arrow|Escape|Home|End|Page)/.test(e.key))takeover();},true);
  function tick(){ if(demo){ t+=TICK; if(t>=EVERY){t=0;set((k+1)%4);} } }
  function start(){ if(!clock&&!reduce&&demo)clock=setInterval(tick,TICK); }
  function stop(){ clearInterval(clock); clock=null; }
  document.addEventListener('visibilitychange',function(){ document.hidden?stop():start(); });
  set(0); start(); // reduced motion: dawn, still; keys and clicks still change the hour
})();</script>
</body>
