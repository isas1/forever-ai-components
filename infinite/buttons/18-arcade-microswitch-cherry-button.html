  .bg09-card-head {

  .bg09-bezel-rim {

  .bg09-arcade-btn {
    position: relative;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #FF4444 0%, #B81814 100%);
    border: 3px solid #FFA3A3;
    box-shadow: 0 8px 18px rgba(229, 37, 33, 0.45), inset 0 2px 4px #FFFFFF;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
    z-index: 3;
  }
  .bg09-arcade-btn:active {
    transform: scale(0.92) translateY(4px);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
  }
  .bg09-pressed .bg09-arcade-btn {
    background: radial-gradient(circle at 35% 35%, #FFD700 0%, #FF8800 100%);
    border-color: #FFFFFF;
    box-shadow: 0 0 24px rgba(255, 204, 0, 0.8);
  }
  .bg09-btn-glyph {
    font-size: 16px;
    font-weight: 900;

  .bg09-btn-sub {

  .bg09-card-footer {

  }

<body>
<div class="bg09-root" id="bg09-root-box" role="region" aria-label="Arcade Microswitch Pushbutton · 8-Bit Gaming Button">
  <div class="bg09-button-card">
    <div class="bg09-card-head">
      <span class="bg09-head-tag">ARCADE 30MM MICROSWITCH</span>
      <span>PLAYER 1</span>
    </div>

    <div class="bg09-arcade-mount">
      <div class="bg09-bezel-rim"></div>
      <button class="bg09-arcade-btn" id="bg09-push-btn" aria-label="Arcade Microswitch Action">
        <span class="bg09-btn-glyph">A</span>
        <span class="bg09-btn-sub">FIRE</span>
      </button>
    </div>

    <div class="bg09-card-footer">
      <span>COMBO CHAIN:</span>
      <span class="bg09-combo-metric" id="bg09-combo-val">12 HITS · 4x MULTI</span>
    </div>
  </div>
</div>
<div class="bg09-caption" aria-hidden="true">Arcade Microswitch Button</div>

<script>
(()=>{
  // Local frame lifecycle: stop hidden work, repaint reduced-motion state on input.
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const frames = new Map(), drivers = new Set(); let painting = false;
  function scheduleFrame(fn) {
    drivers.add(fn);
    if (document.hidden || frames.has(fn) || (motion.matches && painting)) return;
    frames.set(fn, requestAnimationFrame(t => {
      frames.delete(fn); if (document.hidden) return;
      painting = true; try { fn(t); } finally { painting = false; }
    }));
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { frames.forEach(cancelAnimationFrame); frames.clear(); }
    else drivers.forEach(scheduleFrame);
  });
  const repaint = () => { if (motion.matches) drivers.forEach(scheduleFrame); };
  ['click','input','pointermove'].forEach(type => document.addEventListener(type, repaint));
  motion.addEventListener('change', () => { reduce = motion.matches; drivers.forEach(scheduleFrame); });

  const tileRoot = document.querySelector('.bg09-root');
  const pauseCSS = () => tileRoot.toggleAttribute('data-paused', document.hidden);
  document.addEventListener('visibilitychange', pauseCSS); pauseCSS();

  let hits = 12;
  let userInteracted = window.__foreverPreview?.demoEnabled === false;
  let running = true;
  let reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const btn = document.getElementById("bg09-push-btn");
  const rootBox = document.getElementById("bg09-root-box");
  const comboVal = document.getElementById("bg09-combo-val");
  const takeOver = () => { userInteracted = true; };
  window.addEventListener("forever:interactive", takeOver);
  rootBox.addEventListener("pointerdown", takeOver, true);
  rootBox.addEventListener("keydown", e => { if (/^(Enter| |Arrow|Escape)/.test(e.key)) takeOver(); }, true);

  function hit() {
    hits++;
    if (rootBox) {
      rootBox.classList.add("bg09-pressed");
      setTimeout(() => rootBox.classList.remove("bg09-pressed"), 120);
    }
    const mult = Math.min(8, Math.floor(hits / 5) + 1);
    if (comboVal) comboVal.textContent = `${hits} HITS · ${mult}x MULTI`;
  }

  if (btn) {
    btn.addEventListener("click", () => {
      userInteracted = true;
      hit();
    });
  }

  let timer = 0;
  function loop() {
    if (!running) return;
    if (!reduce && !userInteracted) {
      timer++;
      if (timer > 60) {
        timer = 0;
        hit();
      }
    }
    if (!userInteracted) scheduleFrame(loop);
  }

  document.addEventListener("visibilitychange", () => {
    running = !document.hidden;
  });

  scheduleFrame(loop);
})();
</script>
