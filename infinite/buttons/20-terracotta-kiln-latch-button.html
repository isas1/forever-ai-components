<script>(()=>{const p=new URLSearchParams(location.search).get("theme");if(p)document.documentElement.dataset.theme=p})();window.addEventListener("message",e=>{if(e.data?.type==="forever:theme")document.documentElement.dataset.theme=e.data.theme});</script>
<style>
  :root {
    --ua02-bg: #DED9CF;
    --ua02-surface: #F6F1E7;
    --ua02-ink: #17263B;
    --ua02-muted: #616B72;
    --ua02-cobalt: #1D5295;
    --ua02-coral: #B94430;
    --ua02-aqua: #4F8889;
    --ua02-poster: #C99A20;
    --ua02-tile-face: #FBF8F1;
    --ua02-grout: #C7BFB0;
    --ua02-grout-deep: #A79E8D;
    --ua02-shadow: rgba(23, 38, 59, 0.16);
  }
  [data-theme="dark"] {
    --ua02-bg: #111B25;
    --ua02-surface: #1B2934;
    --ua02-ink: #EEF1EC;
    --ua02-muted: #ADB8BC;
    --ua02-cobalt: #5F93DD;
    --ua02-coral: #E46F58;
    --ua02-aqua: #75B2B0;
    --ua02-poster: #E3BF58;
    --ua02-tile-face: #223140;
    --ua02-grout: #0B141D;
    --ua02-grout-deep: #060C13;
    --ua02-shadow: rgba(0, 0, 0, 0.6);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--ua02-bg);
    color: var(--ua02-ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .ua02-root {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    box-sizing: border-box;
    position: relative;
    user-select: none;
  }
  .ua02-kiln-chassis {
    width: 100%;
    max-width: 320px;
    background: var(--ua02-surface);
    border-radius: 14px;
    box-shadow: 0 14px 30px var(--ua02-shadow), inset 0 0 0 1px var(--ua02-grout);
    padding: 24px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    position: relative;
  }
  .ua02-header-strip {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    color: var(--ua02-muted);
    border-bottom: 1px solid var(--ua02-grout);
    padding-bottom: 8px;
  }
  .ua02-kiln-temp {
    font-weight: 700;
    color: var(--ua02-coral);
  }
  .ua02-button-mount {
    position: relative;
    width: 170px;
    height: 170px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ua02-button-base {
    position: absolute;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: var(--ua02-grout-deep);
    box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.3), 0 4px 8px var(--ua02-shadow);
  }
  .ua02-heat-ring {
    position: absolute;
    width: 148px;
    height: 148px;
    border-radius: 50%;
    border: 3px dashed var(--ua02-coral);
    opacity: 0.2;
    transition: opacity 0.4s ease, transform 0.8s ease;
  }
  .ua02-firing:not([data-preview-taken-over]) .ua02-heat-ring,
  .ua02-root.ua02-user-firing .ua02-heat-ring {
    opacity: 0.85;
    animation: ua02-spin-ring 8s linear infinite;
  }
  @keyframes ua02-spin-ring {
    100% { transform: rotate(360deg); }
  }
  .ua02-tile-button {
    position: relative;
    width: 120px;
    height: 120px;
    background: var(--ua02-tile-face);
    border: 3px solid var(--ua02-cobalt);
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 8px 16px var(--ua02-shadow), inset 0 2px 4px rgba(255, 255, 255, 0.4);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: transform 0.15s cubic-bezier(0.2, 0.9, 0.3, 1.2), box-shadow 0.15s ease, background 0.3s ease;
    z-index: 5;
  }
  .ua02-tile-button:active {
    transform: scale(0.92) translateY(4px);
    box-shadow: 0 2px 4px var(--ua02-shadow);
  }
  .ua02-tile-pattern {
    width: 44px;
    height: 44px;
    stroke: var(--ua02-cobalt);
    fill: none;
    transition: stroke 0.3s ease, transform 0.5s ease;
  }
  .ua02-firing .ua02-tile-button {
    background: #FFFAF5;
    border-color: var(--ua02-coral);
    box-shadow: 0 0 24px rgba(185, 68, 48, 0.4), inset 0 0 8px rgba(185, 68, 48, 0.2);
  }
  .ua02-firing .ua02-tile-pattern {
    stroke: var(--ua02-coral);
    transform: rotate(45deg);
  }
  .ua02-button-label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ua02-cobalt);
    transition: color 0.3s ease;
  }
  .ua02-firing .ua02-button-label {
    color: var(--ua02-coral);
  }
  .ua02-footer-status {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: var(--ua02-tile-face);
    border-radius: 6px;
    border: 1px solid var(--ua02-grout);
    box-sizing: border-box;
    font-size: 12px;
    color: var(--ua02-muted);
  }
  .ua02-status-state {
    font-weight: 700;
    color: var(--ua02-ink);
  }
  .ua02-firing .ua02-status-state {
    color: var(--ua02-coral);
  }
  .ua02-caption {
    position: absolute;
    bottom: 8px;
    right: 12px;
    font-size: 10px;
    letter-spacing: 0.05em;
    color: var(--ua02-muted);
    opacity: 0.65;
    pointer-events: none;
    font-family: ui-monospace, monospace;
  }
@media (prefers-reduced-motion: reduce) { .ua02-root *, .ua02-root *::before, .ua02-root *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

<body>
<div class="ua02-root" id="ua02-root-box" role="region" aria-label="Terracotta Kiln Latch · Azulejo Button">
  <div class="ua02-kiln-chassis">
    <div class="ua02-header-strip">
      <span>KILN 04 · ALVALADE</span>
      <span class="ua02-kiln-temp" id="ua02-kiln-temp">24°C AMBIENT</span>
    </div>

    <div class="ua02-button-mount">
      <div class="ua02-button-base"></div>
      <div class="ua02-heat-ring"></div>
      <button class="ua02-tile-button" id="ua02-fire-btn" aria-label="Engage Vitrification Cycle">
        <svg class="ua02-tile-pattern" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <circle cx="12" cy="12" r="4" />
          <line x1="12" y1="3" x2="12" y2="7" />
          <line x1="12" y1="17" x2="12" y2="21" />
          <line x1="3" y1="12" x2="7" y2="12" />
          <line x1="17" y1="12" x2="21" y2="12" />
        </svg>
        <span class="ua02-button-label" id="ua02-btn-label">IGNITE</span>
      </button>
    </div>

    <div class="ua02-footer-status">
      <span>State:</span>
      <span class="ua02-status-state" id="ua02-status-state">Glaze Curing · Standby</span>
    </div>
  </div>
</div>
<div class="ua02-caption" aria-hidden="true">Terracotta Kiln Latch</div>

<script>
(()=>{
  let isFiring = false;
  let demoEnabled = window.__foreverPreview?.demoEnabled !== false;
  let running = true;
  let frameId = 0;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const btn = document.getElementById("ua02-fire-btn");
  const rootBox = document.getElementById("ua02-root-box");
  const tempLabel = document.getElementById("ua02-kiln-temp");
  const btnLabel = document.getElementById("ua02-btn-label");
  const statusState = document.getElementById("ua02-status-state");

  function toggleFiring() {
    isFiring = !isFiring;
    if (rootBox) rootBox.classList.toggle("ua02-firing", isFiring);
    if (rootBox) rootBox.classList.toggle("ua02-user-firing", isFiring && !demoEnabled);
    if (btnLabel) btnLabel.textContent = isFiring ? "EXTINGUISH" : "IGNITE";
    if (tempLabel) tempLabel.textContent = isFiring ? "1050°C VITRIFYING" : "24°C AMBIENT";
    if (statusState) statusState.textContent = isFiring ? "Active Firing · 9.4 kW" : "Glaze Curing · Standby";
  }

  function takeover() {
    if (!demoEnabled) return;
    demoEnabled = false;
    if (rootBox) rootBox.dataset.previewTakenOver = "";
    if (frameId) cancelAnimationFrame(frameId);
    frameId = 0;
  }

  if (!demoEnabled && rootBox) rootBox.dataset.previewTakenOver = "";
  window.addEventListener("forever:interactive", takeover, { once: true });
  if (btn) {
    btn.addEventListener("pointerdown", takeover, { once: true });
    btn.addEventListener("keydown", event => {
      if (["Enter", " "].includes(event.key)) takeover();
    });
    btn.addEventListener("click", () => {
      toggleFiring();
    });
  }

  // Autonomous demonstration
  let timer = 0;
  function loop() {
    if (!running) return;
    if (!reduce && demoEnabled) {
      timer++;
      if (timer > 240) { // every 4s toggle
        timer = 0;
        toggleFiring();
      }
    }
    if (!reduce && demoEnabled) frameId = requestAnimationFrame(loop);
  }

  document.addEventListener("visibilitychange", () => {
    running = !document.hidden;
    if (running && demoEnabled && !reduce) frameId = requestAnimationFrame(loop);
    else if (!running && frameId) cancelAnimationFrame(frameId);
  });

  if (demoEnabled && !reduce) frameId = requestAnimationFrame(loop);
})();
</script>
