<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Press-and-hold destructive action: the button vibrates as it charges, then shatters into canvas shards at full charge.">
<meta name="forever-preview-lifecycle" content="demo-v1">
<title>Hold-to-Shatter CTA</title>
<script>
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();

<style>
  :root{
    --hts-bg:#0A0A0A; --hts-surface:#111111; --hts-text:#EDEDEA; --hts-muted:#8A8A85; --hts-faint:#5A5A56;
    --hts-border:rgba(255,255,255,0.14); --hts-accent:#C7F000; --hts-soft:rgba(199,240,0,0.14);
    --hts-font:ui-monospace,"SF Mono",Menlo,monospace;
  }
  :root[data-theme="light"]{
    --hts-bg:#FAFAF8; --hts-surface:#F4F4F0; --hts-text:#1A1A18; --hts-muted:#6B6B66; --hts-faint:#9A9A93;
    --hts-border:rgba(0,0,0,0.14); --hts-accent:#4D7A00; --hts-soft:rgba(77,122,0,0.12);
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--hts-bg)}
  .hts-root{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font:clamp(6px,3.4vmin,22px)/1.2 var(--hts-font);color:var(--hts-text);user-select:none;-webkit-user-select:none;box-sizing:border-box}
  .hts-root *{box-sizing:border-box}
  .hts-cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
  .hts-stage{position:relative;width:26em;height:14em;display:flex;align-items:center;justify-content:center}
  .hts-btn{position:relative;width:18.5em;height:5em;border-radius:.4em;background:var(--hts-surface);border:1px solid var(--hts-border);
    color:var(--hts-text);font:700 1em var(--hts-font);letter-spacing:.14em;cursor:pointer;overflow:hidden;display:flex;
    align-items:center;justify-content:center;touch-action:none;outline:none;
    transition:opacity .25s ease,border-color .2s}
  .hts-btn:focus-visible,.hts-reset:focus-visible{outline:2px solid var(--hts-accent);outline-offset:4px}
  .hts-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--hts-soft);box-shadow:inset 0 -3px 0 var(--hts-accent);pointer-events:none}
  .hts-label{position:relative;display:flex;gap:.6em;pointer-events:none;white-space:nowrap}
  .hts-reset{position:absolute;font:600 .92em var(--hts-font);letter-spacing:.12em;color:var(--hts-text);background:var(--hts-surface);
    border:1px dashed var(--hts-border);padding:.9em 1.5em;border-radius:.4em;cursor:pointer;opacity:0;pointer-events:none;
    transform:scale(.94);transition:opacity .3s ease,transform .3s cubic-bezier(.2,1.4,.4,1),border-color .2s;outline:none;z-index:5;white-space:nowrap}
  .hts-reset:hover{border-color:var(--hts-accent)}
  .hts-stage[data-shattered="true"] .hts-btn{opacity:0;pointer-events:none}
  .hts-stage[data-shattered="true"] .hts-reset{opacity:1;pointer-events:auto;transform:scale(1)}
  .hts-hint{margin-top:.6em;font-size:.85em;letter-spacing:.1em;color:var(--hts-muted);text-transform:uppercase;text-align:center;max-width:94%}
  .hts-cap{position:fixed;left:8px;bottom:7px;font:10px var(--hts-font);letter-spacing:.08em;text-transform:uppercase;color:var(--hts-text);opacity:.28}
  @media (prefers-reduced-motion:reduce){.hts-btn,.hts-reset{transition:none}}
</style>

 "useWhen": "",

 "preserveElements": [

  "theme hook: ?theme= bootstrap, forever:theme message listener and :root[data-theme=\"light\"] tokens",

 ],

</head>
<body>
<div class="hts-root" id="hts-root" role="group" aria-label="Hold to vaporize button">
  <canvas class="hts-cv" id="hts-cv" aria-hidden="true"></canvas>
  <div class="hts-stage" id="hts-stage" data-shattered="false">
    <button class="hts-btn" id="hts-btn" type="button" aria-pressed="false" aria-label="Hold to vaporize node">
      <span class="hts-fill" id="hts-fill"></span>
      <span class="hts-label"><span>!</span><span id="hts-txt">HOLD TO VAPORIZE</span></span>
    </button>
    <button class="hts-reset" id="hts-reset" type="button" aria-label="Reconstruct vaporized node">&#8634; RECONSTRUCT</button>
  </div>
  <p class="hts-hint" id="hts-hint">PRESS &amp; HOLD TO INITIATE</p>
</div>
<div class="hts-cap" aria-hidden="true">Hold-to-Shatter CTA</div>
<script>
(function(){
  'use strict';
  var $=function(i){return document.getElementById(i)};
  var root=$('hts-root'),stage=$('hts-stage'),btn=$('hts-btn'),fill=$('hts-fill'),txt=$('hts-txt'),
      rst=$('hts-reset'),hint=$('hts-hint'),cv=$('hts-cv'),ctx=cv.getContext('2d');
  var reduced=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var demoEnabled=window.__foreverPreview?.demoEnabled!==false;
  var holding=false,demoHold=false,progress=0,shards=[],raf=0,last=0,dpr=1,W=0,H=0,sc=1,col={},demoT=0,demoR=0;

  function syncTheme(){var c=getComputedStyle(document.documentElement);
    col={a:c.getPropertyValue('--hts-accent').trim(),t:c.getPropertyValue('--hts-text').trim(),
         m:c.getPropertyValue('--hts-muted').trim(),f:c.getPropertyValue('--hts-faint').trim()};}
  function setTheme(t){if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);syncTheme();}}
  window.addEventListener('message',function(e){if(e.data&&e.data.type==='forever:theme')setTheme(e.data.theme)});

  function size(){dpr=Math.min(window.devicePixelRatio||1,2);var r=root.getBoundingClientRect();
    W=r.width;H=r.height;cv.width=Math.max(1,Math.round(W*dpr));cv.height=Math.max(1,Math.round(H*dpr));
    sc=(parseFloat(getComputedStyle(root).fontSize)||13)/13;}
  new ResizeObserver(size).observe(root);

  function stopDemo(){demoEnabled=false;demoHold=false;clearTimeout(demoT);clearTimeout(demoR);}
  window.addEventListener('forever:interactive',stopDemo);
  root.addEventListener('pointerdown',stopDemo,true);
  root.addEventListener('keydown',stopDemo,true);

  function spawn(){
    var rr=btn.getBoundingClientRect(),o=root.getBoundingClientRect();
    var n=reduced()?8:48;shards=[];
    for(var i=0;i<n;i++){
      var an=Math.random()*6.2832,sp=3+Math.random()*9,roll=Math.random(),c=col.m;
      if(roll>.85)c=col.a;else if(roll>.6)c=col.t;else if(roll>.35)c=col.f;
      shards.push({x:(Math.random()-.5)*200,y:(Math.random()-.5)*50,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-2.5,
        s:5+Math.random()*12,rot:Math.random()*3.14,vr:(Math.random()-.5)*.3,al:1,c:c});
    }
    shards.ox=rr.left-o.left+rr.width/2;shards.oy=rr.top-o.top+rr.height/2;
  }
  function shatter(){
    holding=false;demoHold=false;progress=0;fill.style.width='0';btn.style.transform='none';
    stage.dataset.shattered='true';btn.setAttribute('aria-pressed','true');
    hint.textContent='NODE VAPORIZED // CORE PURGED';spawn();ensure();
  }
  function startHold(e){
    if(stage.dataset.shattered==='true')return;
    if(e&&e.pointerId!=null)try{btn.setPointerCapture(e.pointerId)}catch(_){}
    holding=true;hint.textContent='SEQUENCE ENGAGED // HOLD';ensure();
  }
  function release(){
    if(holding){holding=false;if(stage.dataset.shattered!=='true')hint.textContent='ABORTED // RE-ENGAGE';ensure();}
  }
  btn.addEventListener('pointerdown',startHold);
  window.addEventListener('pointerup',release);
  window.addEventListener('pointercancel',release);
  btn.addEventListener('keydown',function(e){if((e.key===' '||e.key==='Enter')&&!holding){e.preventDefault();startHold();}});
  btn.addEventListener('keyup',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();release();}});
  rst.addEventListener('click',function(){
    stage.dataset.shattered='false';btn.setAttribute('aria-pressed','false');txt.textContent='HOLD TO VAPORIZE';
    hint.textContent='PRESS & HOLD TO INITIATE';shards=[];ctx.clearRect(0,0,cv.width,cv.height);btn.focus();
  });

  /* attract: a short aborted charge every few seconds; ends at first deliberate input */
  function demoCycle(){
    if(!demoEnabled||reduced()||document.hidden||stage.dataset.shattered==='true')return;
    demoHold=true;ensure();
    demoR=setTimeout(function(){demoHold=false;ensure();demoT=setTimeout(demoCycle,2600);},420);
  }

  function tick(now){
    var dt=last?Math.min(now-last,50)/16.667:1;last=now;
    var rd=reduced(),live=holding||demoHold;
    if(live&&stage.dataset.shattered==='false'){
      progress=Math.min(100,progress+(rd?5:2.2)*dt);
      var sh=progress/100*6*sc;
      btn.style.transform=rd?'none':'translate('+((Math.random()-.5)*sh).toFixed(1)+'px,'+((Math.random()-.5)*sh).toFixed(1)+'px) scale('+(1-progress*.0006).toFixed(3)+')';
      txt.textContent='CHARGING '+Math.floor(progress)+'%';
      if(progress>=100)shatter();
    }else if(progress>0&&stage.dataset.shattered==='false'){
      progress=Math.max(0,progress-4.5*dt);btn.style.transform='none';
      if(progress===0){txt.textContent='HOLD TO VAPORIZE';if(!demoHold)hint.textContent='PRESS & HOLD TO INITIATE';}
    }
    fill.style.width=progress+'%';
    ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
    if(shards.length){
      ctx.setTransform(dpr*sc,0,0,dpr*sc,shards.ox*dpr,shards.oy*dpr);
      for(var i=shards.length-1;i>=0;i--){
        var s=shards[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=.32*dt;s.rot=(s.rot||0)+s.vr*dt;s.al-=(rd?.05:.02)*dt;
        if(s.al<=0){shards.splice(i,1);continue;}
        ctx.save();ctx.globalAlpha=Math.max(0,s.al);ctx.translate(s.x,s.y);ctx.rotate(s.rot);ctx.fillStyle=s.c;
        ctx.beginPath();ctx.moveTo(-s.s,-s.s*.6);ctx.lineTo(s.s,0);ctx.lineTo(-s.s*.4,s.s);ctx.closePath();ctx.fill();ctx.restore();
      }
    }
    if(live||progress>0||shards.length)raf=requestAnimationFrame(tick);else{raf=0;last=0;}
  }
  function ensure(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(tick);}}

  document.addEventListener('visibilitychange',function(){
    if(document.hidden){if(raf){cancelAnimationFrame(raf);raf=0;}last=0;clearTimeout(demoT);clearTimeout(demoR);demoHold=false;}
    else{ensure();if(demoEnabled)demoT=setTimeout(demoCycle,300);}
  });
  syncTheme();size();
  if(demoEnabled&&!reduced())demoT=setTimeout(demoCycle,300);
})();
</script>
</body>
</html>
