<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A glass ampoule tilt switch: a bead of mercury rolls under simulated gravity and bridges the contact pins.">
<meta name="forever-preview-lifecycle" content="demo-v1">
<title>Mercury Tilt Toggle</title>
<script>
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();

<style>
  :root{
    --mtt-bg:#0A0A0A; --mtt-surface:#161616; --mtt-text:#EDEDEA; --mtt-muted:#8A8A85; --mtt-faint:#5A5A56;
    --mtt-border:rgba(255,255,255,0.14); --mtt-accent:#C7F000; --mtt-line:rgba(199,240,0,0.32); --mtt-soft:rgba(199,240,0,0.14);
    --mtt-mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  :root[data-theme="light"]{
    --mtt-bg:#FAFAF8; --mtt-surface:#ECECE6; --mtt-text:#1A1A18; --mtt-muted:#6B6B66; --mtt-faint:#9A9A93;
    --mtt-border:rgba(0,0,0,0.14); --mtt-accent:#4D7A00; --mtt-line:rgba(77,122,0,0.35); --mtt-soft:rgba(77,122,0,0.12);
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--mtt-bg)}
  .mtt-root{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6em;
    font:clamp(6px,3.4vmin,22px)/1.2 var(--mtt-mono);color:var(--mtt-text);user-select:none;-webkit-user-select:none;box-sizing:border-box}
  .mtt-amp{position:relative;width:18.5em;height:5.4em;border-radius:999px;background:var(--mtt-surface);border:1px solid var(--mtt-border);
    cursor:pointer;display:flex;align-items:center;padding:.6em .9em;box-sizing:border-box;outline:none;
    transition:transform .35s cubic-bezier(.2,1.3,.4,1),border-color .25s,box-shadow .25s;transform:rotate(-10deg)}
  .mtt-amp:focus-visible{outline:2px solid var(--mtt-accent);outline-offset:.5em}
  .mtt-amp[aria-checked="true"]{border-color:var(--mtt-accent);box-shadow:0 0 0 1px var(--mtt-line),0 0 18px var(--mtt-soft)}
  .mtt-hg{width:4.6em;height:3.7em;border-radius:999px;background:var(--mtt-muted);box-shadow:inset 0 0 0 1px var(--mtt-border);will-change:transform;pointer-events:none}
  .mtt-pins{position:absolute;right:1.4em;display:flex;flex-direction:column;gap:.8em;pointer-events:none}
  .mtt-pin{width:.7em;height:.7em;border-radius:50%;background:var(--mtt-faint);transition:background .2s,box-shadow .2s}
  .mtt-amp[aria-checked="true"] .mtt-pin{background:var(--mtt-accent);box-shadow:0 0 0 1px var(--mtt-line)}
  .mtt-info{font-size:.85em;font-weight:700;letter-spacing:.14em;color:var(--mtt-muted);text-transform:uppercase;display:flex;align-items:center;
    justify-content:center;flex-wrap:wrap;gap:.8em;max-width:94%}
  .mtt-tag{padding:.3em .6em;border-radius:.4em;background:var(--mtt-surface);font-weight:800}
  .mtt-amp[aria-checked="true"]~.mtt-info .mtt-tag{color:var(--mtt-accent);background:var(--mtt-soft)}
  .mtt-cap{position:fixed;left:8px;bottom:7px;font:10px var(--mtt-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mtt-text);opacity:.28}
  @media (prefers-reduced-motion:reduce){.mtt-amp{transition:none}}
</style>

<body>
<div class="mtt-root" role="group" aria-label="Liquid mercury tilt switch">
  <div class="mtt-amp" id="mtt-amp" role="switch" tabindex="0" aria-checked="false" aria-label="Liquid mercury tilt switch">
    <div class="mtt-hg" id="mtt-hg"></div>
    <div class="mtt-pins"><span class="mtt-pin"></span><span class="mtt-pin"></span></div>
  </div>
  <div class="mtt-info"><span>CIRCUIT //</span><span class="mtt-tag" id="mtt-tag">OPEN</span></div>
</div>
<div class="mtt-cap" aria-hidden="true">Mercury Tilt Toggle</div>
<script>
(function(){
  'use strict';
  var amp=document.getElementById('mtt-amp'),hg=document.getElementById('mtt-hg'),tag=document.getElementById('mtt-tag');
  var reduced=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var demoEnabled=window.__foreverPreview?.demoEnabled!==false;
  var right=false,pos=0,vel=0,MAX=152,k=1,raf=0,last=0,demoT=0;

  function setTheme(t){if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}
  window.addEventListener('message',function(e){if(e.data&&e.data.type==='forever:theme')setTheme(e.data.theme)});

  /* physics runs in a 152-unit reference track; k maps it onto the rendered track */
  function size(){var pad=parseFloat(getComputedStyle(amp).paddingLeft)||0;
    k=Math.max(1,amp.clientWidth-hg.offsetWidth-2*pad)/MAX;draw(1);}
  new ResizeObserver(size).observe(amp);

  function draw(stretch){
    hg.style.transform='translateX('+(pos*k).toFixed(1)+'px) scale('+stretch.toFixed(2)+','+(1/stretch).toFixed(2)+')';
    var on=pos>MAX-14;
    if(amp.getAttribute('aria-checked')!==String(on)){amp.setAttribute('aria-checked',String(on));tag.textContent=on?'BRIDGED':'OPEN';}
  }
  function flip(force){
    right=typeof force==='boolean'?force:!right;
    amp.style.transform='rotate('+(right?10:-10)+'deg)';ensure();
  }
  function takeover(){demoEnabled=false;clearTimeout(demoT);}
  window.addEventListener('forever:interactive',takeover);
  amp.addEventListener('pointerdown',takeover,true);
  amp.addEventListener('keydown',function(e){
    takeover();
    if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();}
    else if(e.key==='ArrowRight'){e.preventDefault();flip(true);}
    else if(e.key==='ArrowLeft'){e.preventDefault();flip(false);}
  });
  amp.addEventListener('click',function(){flip()});

  function step(now){
    var dt=last?Math.min(now-last,50)/16.667:1;last=now;
    if(reduced()){pos=right?MAX:0;vel=0;draw(1);raf=0;last=0;return;}
    vel=(vel+(right?.68:-.68)*dt)*Math.pow(.92,dt);pos+=vel*dt;
    if(pos>=MAX){pos=MAX;vel*=-.32;}else if(pos<=0){pos=0;vel*=-.32;}
    draw(1+Math.min(.28,Math.abs(vel)*.025));
    var settled=(right&&pos>=MAX-.2&&Math.abs(vel)<.05)||(!right&&pos<=.2&&Math.abs(vel)<.05);
    if(!settled)raf=requestAnimationFrame(step);else{vel=0;raf=0;last=0;}
  }
  function ensure(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(step);}}

  /* attract: tip the ampoule every few seconds until the first deliberate input */
  function demo(){
    if(!demoEnabled||reduced()||document.hidden)return;
    flip();demoT=setTimeout(demo,2800);
  }
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){if(raf){cancelAnimationFrame(raf);raf=0;}last=0;clearTimeout(demoT);}
    else{ensure();if(demoEnabled&&!reduced())demoT=setTimeout(demo,900);}
  });
  size();ensure();
  if(demoEnabled&&!reduced())demoT=setTimeout(demo,400);
})();
</script>
</body>
</html>
