<div class="tw27-stage">

        <circle class="tw27-surf" cx="120" cy="112" r="52"/>

  </button>

<div class="tw27-cap" aria-hidden="true">Typewriter Key</div>
<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var btn = document.getElementById("tw27-btn");
  var live = document.getElementById("tw27-sr-live");
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "forever:theme" && (e.data.theme === "light" || e.data.theme === "dark")) {
      root.setAttribute("data-theme", e.data.theme);
    }
  });

  function announce(text) {
    if (!live) return;
    live.textContent = text;
  }

  function setActive(active) {
    btn.setAttribute("aria-pressed", active ? "true" : "false");
    announce(active ? "Typewriter key pressed" : "Typewriter key released");
  }

  var demo = !reduce && window.__foreverPreview?.demoEnabled !== false;
  var timer = null, resetTimer = null;

  function attract() {
    if (!demo || reduce || document.hidden) return;
    setActive(true);
    resetTimer = setTimeout(function () {
      if (demo && !reduce) setActive(false);
    }, 1400);
  }

  function start() {
    if (!timer && demo && !reduce) { timer = setInterval(attract, 2800); }
  }

  function stop() {
    if (timer) { clearInterval(timer); timer = null; }
    if (resetTimer) { clearTimeout(resetTimer); resetTimer = null; }
  }

  function takeover() { demo = false; stop(); }

  window.addEventListener("forever:interactive", takeover);
  btn.addEventListener("pointerdown", takeover, true);
  btn.addEventListener("keydown", takeover, true);

  btn.addEventListener("click", function () {
    takeover();
    var active = btn.getAttribute("aria-pressed") !== "true";
    setActive(active);
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { stop(); } else if (demo) { start(); }
  });

  if (demo) {
    setTimeout(attract, 900);
    start();
  }
})();
</script>
