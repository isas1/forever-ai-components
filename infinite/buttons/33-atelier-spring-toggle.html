<script>/* theme hook: ?theme=light|dark, before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  :root {
    --at11-bg: #171614;
    --at11-surface: #211F1C;
    --at11-surface-lo: #12110F;
    --at11-surface-hi: #2B2824;
    --at11-ink: #F4F1EA;
    --at11-muted: #ADA699;
    --at11-border: #57524A;
    --at11-accent: #EC6A43;
    --at11-moss: #4FA37A;
    --at11-spring: cubic-bezier(0.22, 1.35, 0.36, 1);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --at11-bg: #F4F1EA;
    --at11-surface: #EBE7DF;
    --at11-surface-lo: #E2DDD3;
    --at11-surface-hi: #FAF8F5;
    --at11-ink: #1C1B19;
    --at11-muted: #666158;
    --at11-border: #C5BEB0;
    --at11-accent: #C43B16;
    --at11-moss: #2D6A4F;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background-color: var(--at11-bg); color: var(--at11-ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.25s ease, color 0.25s ease;
  }
  .at11-stage {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    padding: clamp(10px, 3vmin, 20px);
    padding-bottom: clamp(24px, 7vmin, 32px);
    background-color: var(--at11-bg); color: var(--at11-ink);
  }
  .at11-unit {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    max-width: 100%;
  }
  .at11-btn {
    appearance: none;
    display: flex; align-items: center; gap: clamp(10px, 4vw, 14px);
    background: var(--at11-surface); color: var(--at11-ink);
    border: 1.5px solid var(--at11-ink);
    padding: clamp(10px, 3.5vmin, 12px) clamp(12px, 4.5vw, 16px);
    border-radius: 8px; box-shadow: 0 2px 0 var(--at11-ink);
    cursor: pointer; font-family: inherit;
    transition: transform 80ms ease, box-shadow 80ms ease;
    touch-action: manipulation;
  }
  .at11-btn:active { transform: translateY(2px); box-shadow: 0 0 0 var(--at11-ink); }
  .at11-btn:focus-visible { outline: 2px solid var(--at11-accent); outline-offset: 2px; }
  .at11-track {
    width: 58px; height: 30px;
    background: var(--at11-surface-lo);
    border: 1.5px solid var(--at11-ink); border-radius: 999px;
    position: relative; padding: 2px;
    transition: background-color 200ms ease;
    display: block; flex-shrink: 0;
  }
  .at11-btn[aria-checked="true"] .at11-track { background: var(--at11-ink); }
  .at11-thumb {
    width: 22px; height: 22px; display: block;
    background: var(--at11-surface-hi);
    border: 1.5px solid var(--at11-ink); border-radius: 50%;
    transition: transform 280ms var(--at11-spring), background-color 150ms ease, border-color 150ms ease;
    box-shadow: 0 1px 0 var(--at11-ink);
  }
  .at11-btn[aria-checked="true"] .at11-thumb {
    transform: translateX(28px);
    background: var(--at11-accent); border-color: var(--at11-bg);
  }
  .at11-meta { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .at11-led {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--at11-border); border: 1px solid var(--at11-ink);
    transition: background-color 150ms ease;
  }
  .at11-btn[aria-checked="true"] .at11-led { background: var(--at11-moss); }
  .at11-lbl { font-size: 11px; font-weight: 700; line-height: 1; }
  .at11-readout {
    width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    font-size: clamp(9px, 2.5vw, 10px); font-weight: 600;
    letter-spacing: 0.08em; color: var(--at11-muted);
    text-transform: uppercase;
  }
  .at11-val { color: var(--at11-ink); }
  .at11-cap {
    position: absolute; left: 10px; bottom: 8px;
    font: 500 11px/1 ui-monospace, monospace;
    color: var(--at11-ink); opacity: 0.45;
    letter-spacing: 0.04em; text-transform: uppercase;
    user-select: none; pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .at11-btn, .at11-track, .at11-thumb, .at11-led { transition-duration: 0.01ms !important; }
  }
</style>

<body>
<div class="at11-stage">
  <div class="at11-unit">
    <button type="button" class="at11-btn" id="at11-btn" role="switch" aria-checked="true" aria-label="48V Phantom Power">
      <span class="at11-track" aria-hidden="true"><span class="at11-thumb"></span></span>
      <span class="at11-meta">
        <span class="at11-led" aria-hidden="true"></span>
        <span class="at11-lbl">+48V</span>
      </span>
    </button>
    <div class="at11-readout">
      <span>PHANTOM</span>
      <span class="at11-val" id="at11-out">RAIL: ENGAGED</span>
    </div>
  </div>
</div>
<div class="at11-cap" aria-hidden="true">Atelier Spring Toggle</div>
<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var btn = document.getElementById("at11-btn");
  var out = document.getElementById("at11-out");
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "forever:theme" && (e.data.theme === "light" || e.data.theme === "dark")) {
      root.setAttribute("data-theme", e.data.theme);
    }
  });

  function setOn(next) {
    btn.setAttribute("aria-checked", next ? "true" : "false");
    out.textContent = next ? "RAIL: ENGAGED" : "RAIL: BYPASSED";
  }

  var demo = !reduce && (!window.__foreverPreview || window.__foreverPreview.demoEnabled !== false);
  var initTimer = null, demoTimer = null;

  function stepDemo() {
    if (!demo || reduce || document.hidden) return;
    setOn(btn.getAttribute("aria-checked") !== "true");
  }
  function startDemo() {
    if (demo && !reduce && !demoTimer) demoTimer = setInterval(stepDemo, 1900);
  }
  function stopDemo() {
    if (initTimer) { clearTimeout(initTimer); initTimer = null; }
    if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }
  }
  function takeover() { demo = false; stopDemo(); }

  window.addEventListener("forever:interactive", takeover);
  btn.addEventListener("pointerdown", takeover, true);
  btn.addEventListener("keydown", takeover, true);
  btn.addEventListener("click", function () {
    takeover();
    setOn(btn.getAttribute("aria-checked") !== "true");
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopDemo(); else if (demo) startDemo();
  });

  if (demo) {
    initTimer = setTimeout(stepDemo, 260);
    startDemo();
  }
})();
</script>
