<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Atelier Magnetic Button — Buttons &amp; Toggles. Pill pulse trigger attracted subtly toward cursor within its perimeter field.">

<title>Atelier Magnetic Button</title>
<script>/* theme hook: ?theme=light|dark, before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  :root {
    --at16-bg: #171614;
    --at16-surface: #211F1C;
    --at16-ink: #F4F1EA;
    --at16-muted: #ADA699;
    --at16-border: #3A3731;
    --at16-accent: #EC6A43;
    --at16-accent-ink: #171614;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --at16-bg: #F4F1EA;
    --at16-surface: #EBE7DF;
    --at16-ink: #1C1B19;
    --at16-muted: #666158;
    --at16-border: #DED9CE;
    --at16-accent: #C43B16;
    --at16-accent-ink: #FAF8F5;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background-color: var(--at16-bg); color: var(--at16-ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.25s ease, color 0.25s ease;
  }
  .at16-stage {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    padding: clamp(10px, 3vmin, 20px);
    padding-bottom: clamp(24px, 7vmin, 32px);
    background-color: var(--at16-bg); color: var(--at16-ink);
  }
  .at16-unit {
    width: min(210px, 100%);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .at16-area {
    width: 100%; height: clamp(78px, 38vmin, 108px);
    display: flex; align-items: center; justify-content: center;
    border: 1px dashed var(--at16-border); border-radius: 10px;
    background: var(--at16-surface);
  }
  .at16-btn {
    appearance: none;
    background: var(--at16-accent); color: var(--at16-accent-ink);
    border: 1.5px solid var(--at16-ink); border-radius: 999px;
    padding: clamp(9px, 3vmin, 12px) clamp(14px, 5vw, 22px);
    font-family: inherit;
    font-size: clamp(10.5px, 3vw, 12px); font-weight: 700;
    letter-spacing: 0.08em; cursor: pointer;
    box-shadow: 0 3px 0 var(--at16-ink);
    display: inline-flex; align-items: center; gap: 8px;
    transition: transform 180ms cubic-bezier(0.2, 1, 0.3, 1), box-shadow 80ms ease;
    touch-action: manipulation; white-space: nowrap;
  }
  .at16-btn:active,
  .at16-btn.is-hit { box-shadow: 0 0 0 var(--at16-ink); }
  .at16-btn:focus-visible { outline: 2px solid var(--at16-ink); outline-offset: 3px; }
  .at16-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--at16-accent-ink); flex-shrink: 0;
  }
  .at16-readout {
    width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 6px;
    font-size: clamp(9px, 2.4vw, 10px); font-weight: 600;
    letter-spacing: 0.08em; color: var(--at16-muted);
    text-transform: uppercase;
  }
  .at16-val { color: var(--at16-ink); }
  .at16-cap {
    position: absolute; left: 10px; bottom: 8px;
    font: 500 11px/1 ui-monospace, monospace;
    color: var(--at16-ink); opacity: 0.45;
    letter-spacing: 0.04em; text-transform: uppercase;
    user-select: none; pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .at16-btn { transition-duration: 0.01ms !important; }
  }
</style>

<body>
<div class="at16-stage">
  <div class="at16-unit">
    <div class="at16-area" id="at16-area">
      <button type="button" class="at16-btn" id="at16-btn">
        <span class="at16-dot" aria-hidden="true"></span>
        <span>TRIG PULSE</span>
      </button>
    </div>
    <div class="at16-readout">
      <span>ATTRACTOR</span>
      <span class="at16-val" id="at16-out">HITS: 00</span>
    </div>
  </div>
</div>
<div class="at16-cap" aria-hidden="true">Atelier Magnetic Button</div>
<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var area = document.getElementById("at16-area");
  var btn = document.getElementById("at16-btn");
  var out = document.getElementById("at16-out");
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var hits = 0;

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "forever:theme" && (e.data.theme === "light" || e.data.theme === "dark")) {
      root.setAttribute("data-theme", e.data.theme);
    }
  });

  function triggerHit(countHit) {
    if (countHit) {
      hits++;
      out.textContent = "HITS: " + String(hits).padStart(2, "0");
    }
    btn.classList.add("is-hit");
    setTimeout(function () { btn.classList.remove("is-hit"); }, 140);
  }

  var demo = !reduce && (!window.__foreverPreview || window.__foreverPreview.demoEnabled !== false);
  var rafId = 0, phase = 0.2, lastPulse = 0;

  function tick(ts) {
    rafId = 0;
    if (!demo || reduce || document.hidden) return;
    phase += 0.04;
    var dx = Math.cos(phase) * 14;
    var dy = Math.sin(phase * 1.5) * 9;
    btn.style.transform = "translate(" + dx.toFixed(1) + "px, " + dy.toFixed(1) + "px)";
    if (!lastPulse || ts - lastPulse > 1700) {
      lastPulse = ts;
      triggerHit(true);
    }
    rafId = requestAnimationFrame(tick);
  }
  function startDemo() { if (demo && !reduce && !rafId) rafId = requestAnimationFrame(tick); }
  function stopDemo() { if (rafId) { cancelAnimationFrame(rafId); rafId = 0; } }
  function takeover(resetCounter) {
    if (!demo) return;
    demo = false;
    stopDemo();
    btn.style.transform = "translate(0px, 0px)";
    if (resetCounter) {
      hits = 0;
      out.textContent = "HITS: 00";
    }
  }

  window.addEventListener("forever:interactive", function () { takeover(true); });
  area.addEventListener("pointermove", function (e) {
    takeover(true);
    if (reduce) return;
    var r = area.getBoundingClientRect();
    if (!r.width || !r.height) return;
    var dx = (e.clientX - (r.left + r.width / 2)) * 0.26;
    var dy = (e.clientY - (r.top + r.height / 2)) * 0.28;
    btn.style.transform = "translate(" + dx.toFixed(1) + "px, " + dy.toFixed(1) + "px)";
  });
  area.addEventListener("pointerleave", function () {
    btn.style.transform = "translate(0px, 0px)";
  });
  btn.addEventListener("click", function () {
    takeover(true);
    triggerHit(true);
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopDemo(); else if (demo) startDemo();
  });

  if (demo) startDemo();
})();
</script>
</body>
</html>
