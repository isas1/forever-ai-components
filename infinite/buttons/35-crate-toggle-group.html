<style>
:root{--b:#131316;--i:#F1F1F4;--o:#000;--c:#7B95C4;--vn:#000;--ve:#3A3B42;--sp:cubic-bezier(.3,1.45,.5,1);color-scheme:dark}
:root[data-theme="light"]{--b:#EFF0F3;--i:#000;--o:#EFF0F3;--c:#2B4473;--ve:transparent;color-scheme:light}
html,body{margin:0;height:100%;overflow:hidden;background:var(--b);color:var(--i);font:14px/1.3 "Avenir Next",Avenir,system-ui,sans-serif}
.cr11-st,.cr11-st *{box-sizing:border-box}
.cr11-st{position:relative;width:100%;height:100%;display:grid;place-items:center;padding:clamp(8px,3vmin,20px);background:var(--b);color:var(--i)}
.cr11-st :focus-visible{outline:2px solid var(--c);outline-offset:2px}
.cr11-tg{display:grid;justify-items:center;gap:clamp(8px,3.5vmin,16px)}
.cr11-pv{position:relative;width:clamp(54px,22vmin,96px);margin:0 clamp(18px,8vmin,34px) 4px 0;--d:92}
.cr11-pv[data-f="1"]{--d:76}.cr11-pv[data-f="2"]{--d:54}
.cr11-disc{display:block;border-radius:50%;background:var(--vn);border:1px solid var(--ve);position:absolute;left:88%;top:50%;width:calc(var(--d)*1%);aspect-ratio:1;translate:-50% -50%;transition:width .5s var(--sp)}
.cr11-disc::after{content:"";position:absolute;inset:33%;border-radius:50%;background:#D5412B;transition:inset .5s var(--sp)}
.cr11-pv[data-f="2"] .cr11-disc::after{inset:24%}
.cr11-art{position:relative;display:block;width:100%;aspect-ratio:1;border-radius:2px}
.cr11-pk{position:absolute;scale:0;transition:scale .45s var(--sp),rotate .45s var(--sp),opacity .2s}
.cr11-pk.cr11-on{scale:1}
.cr11-new{left:-8px;top:-8px;width:clamp(16px,5.5vmin,24px);height:clamp(16px,5.5vmin,24px);background:#E2B01A;rotate:-40deg}
.cr11-new::before{content:"";position:absolute;inset:0;background:inherit;transform:rotate(45deg)}
.cr11-new.cr11-on{rotate:12deg}
.cr11-used{inset:9%;border:1.5px solid rgba(0,0,0,.45);border-radius:50%;opacity:0;scale:.7}
.cr11-used.cr11-on{opacity:1}
.cr11-sale{right:-9px;bottom:-7px;display:grid;place-items:center;width:clamp(20px,7vmin,30px);height:clamp(20px,7vmin,30px);border-radius:50%;background:#C8371F;color:#fff;font-weight:700;font-size:clamp(10px,3.2vmin,14px);font-style:normal;rotate:50deg;z-index:2}
.cr11-sale.cr11-on{rotate:-12deg}
.cr11-seg{position:relative;display:flex;padding:3px;border:1.5px solid var(--i);border-radius:999px}
.cr11-sb{position:relative;z-index:1;min-width:clamp(38px,13vmin,54px);height:clamp(26px,8.5vmin,36px);padding:0 clamp(8px,3vmin,14px);border:0;border-radius:999px;background:none;color:inherit;font:inherit;font-size:clamp(11px,3.2vmin,14px);font-weight:600;cursor:pointer;touch-action:manipulation;transition:color .25s}
.cr11-sb[aria-checked="true"]{color:var(--o)}
.cr11-th{position:absolute;top:3px;bottom:3px;border-radius:999px;background:var(--i);transition:left .32s ease .09s,right .32s ease}
.cr11-seg.cr11-l .cr11-th{transition:left .32s ease,right .32s ease .09s}
.cr11-m{display:flex;gap:clamp(4px,1.5vmin,6px)}
.cr11-cp{position:relative;isolation:isolate;height:clamp(26px,8.5vmin,38px);padding:0 clamp(10px,3.5vmin,16px);border-radius:999px;border:1.5px solid var(--i);background:none;color:inherit;font:inherit;font-size:clamp(11px,3.2vmin,14px);font-weight:600;overflow:hidden;cursor:pointer;touch-action:manipulation;transition:color .3s,scale .15s}
.cr11-cp::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--i);clip-path:circle(0% at var(--x,50%) var(--y,50%));transition:clip-path .45s ease}
.cr11-cp[aria-pressed="true"]{color:var(--o)}.cr11-cp[aria-pressed="true"]::before{clip-path:circle(160% at var(--x,50%) var(--y,50%))}.cr11-cp:active{scale:.95}
.cr11-cap{position:absolute;left:10px;bottom:8px;font:500 11px/1 ui-monospace,monospace;color:var(--i);opacity:.45;letter-spacing:.04em;text-transform:uppercase;pointer-events:none;user-select:none}
@media (prefers-reduced-motion:reduce){.cr11-st *{transition-duration:.01ms!important;animation-duration:.01ms!important}}

<script>(()=>{
  const s=document.getElementById('cr11-st'),RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  s.innerHTML=`<div class="cr11-tg"><div class="cr11-pv" aria-hidden="true" data-f="0"><i class="cr11-disc"></i><svg class="cr11-art" viewBox="0 0 10 10"><rect width="10" height="10" fill="#E2B01A"/><circle cx="5" cy="5.8" r="3" fill="#D5412B"/><rect y="5.8" width="10" height="4.2" fill="#F2F0EA"/><rect y="6.8" width="10" height=".5" fill="#D5412B"/></svg><i class="cr11-pk cr11-used" data-s="used"></i><i class="cr11-pk cr11-new" data-s="new"></i><i class="cr11-pk cr11-sale" data-s="sale">%</i></div><div class="cr11-seg" role="radiogroup" aria-label="Format"><i class="cr11-th"></i>${['LP','EP','7″'].map((l,i)=>`<button type="button" class="cr11-sb" role="radio" aria-checked="${!i}" tabindex="${i?-1:0}"${i===2?' aria-label="7 inch"':''}>${l}</button>`).join('')}</div><div class="cr11-m" role="group" aria-label="Tags">${['New','Used','Sale'].map(l=>`<button type="button" class="cr11-cp" aria-pressed="false" data-s="${l.toLowerCase()}">${l}</button>`).join('')}</div></div>`;
  const prev=s.querySelector('.cr11-pv'),seg=s.querySelector('.cr11-seg'),th=s.querySelector('.cr11-th'),rs=[...s.querySelectorAll('.cr11-sb')],chips=[...s.querySelectorAll('.cr11-cp')];
  let cur=0,timer=0,kick=0,step=0;
  const place=(i,init)=>{const b=rs[i];seg.classList.toggle('cr11-l',i<cur);if(init)th.style.transition='none';
    th.style.left=b.offsetLeft+'px';th.style.right=(seg.clientWidth-b.offsetLeft-b.offsetWidth)+'px';
    if(init){th.offsetWidth;th.style.transition=''}rs.forEach((r,j)=>{r.setAttribute('aria-checked',String(j===i));r.tabIndex=j===i?0:-1});cur=i;prev.dataset.f=String(i)};
  const pressChip=(c,e)=>{const r=c.getBoundingClientRect(),p=e&&e.detail;c.style.setProperty('--x',(p?e.clientX-r.left:r.width/2)+'px');c.style.setProperty('--y',(p?e.clientY-r.top:r.height/2)+'px');
    const on=c.getAttribute('aria-pressed')!=='true';c.setAttribute('aria-pressed',String(on));prev.querySelector(`.cr11-pk[data-s="${c.dataset.s}"]`).classList.toggle('cr11-on',on)};
  place(0,true);if(typeof ResizeObserver==='function')new ResizeObserver(()=>place(cur,true)).observe(seg);
  rs.forEach((b,i)=>b.addEventListener('click',()=>place(i)));
  seg.addEventListener('keydown',e=>{const k=e.key,L=rs.length;let n;if(k==='ArrowRight'||k==='ArrowDown')n=(cur+1)%L;else if(k==='ArrowLeft'||k==='ArrowUp')n=(cur+L-1)%L;else if(k==='Home')n=0;else if(k==='End')n=L-1;else return;e.preventDefault();place(n);rs[n].focus()});
  chips.forEach(c=>c.addEventListener('click',e=>pressChip(c,e)));

  let demo=!RM()&&!(window.__foreverPreview&&window.__foreverPreview.demoEnabled===false);
  const play=()=>{if(!demo||RM()||document.hidden)return;const p=step++%4;
    if(p===0){place(1);pressChip(chips[0])}else if(p===1){place(2);pressChip(chips[2])}else if(p===2){pressChip(chips[1])}else{place(0);chips.forEach(c=>c.getAttribute('aria-pressed')==='true'&&pressChip(c))}};
  const stop=()=>{clearInterval(timer);clearTimeout(kick);timer=kick=0},start=()=>{if(!timer&&demo&&!RM())timer=setInterval(play,1150)},tk=()=>{demo=false;stop()};
  window.addEventListener('forever:interactive',tk);s.addEventListener('pointerdown',tk,true);s.addEventListener('keydown',tk,true);
  document.addEventListener('visibilitychange',()=>document.hidden?stop():demo&&start());
  window.addEventListener('message',e=>{if(e.data&&e.data.type==='forever:theme'&&(e.data.theme==='light'||e.data.theme==='dark'))document.documentElement.setAttribute('data-theme',e.data.theme)});
  if(demo){kick=setTimeout(play,600);start()}
})();</script>
