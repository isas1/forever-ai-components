<style>
:root{--b:#131316;--i:#F1F1F4;--o:#000;--c:#7B95C4;--vn:#000;--ve:#3A3B42;--sp:cubic-bezier(.3,1.45,.5,1);color-scheme:dark}
:root[data-theme="light"]{--b:#EFF0F3;--i:#000;--o:#EFF0F3;--c:#2B4473;--ve:transparent;color-scheme:light}
html,body{margin:0;height:100%;overflow:hidden;background:var(--b);color:var(--i);font:14px/1.3 "Avenir Next",Avenir,system-ui,sans-serif}
.cr14-st,.cr14-st *{box-sizing:border-box}
.cr14-st{position:relative;width:100%;height:100%;display:grid;place-items:center;background:var(--b);color:var(--i);overflow:hidden}
.cr14-st :focus-visible{outline:2px solid var(--c);outline-offset:2px}
.cr14-mg{position:absolute;inset:0;display:grid;place-items:center}
.cr14-b{display:inline-flex;align-items:center;justify-content:center;min-width:clamp(124px,48vmin,176px);height:clamp(38px,13vmin,52px);padding:0 clamp(14px,5vmin,26px);border-radius:999px;border:1.5px solid var(--i);background:var(--i);color:var(--o);font:inherit;font-size:clamp(12px,3.6vmin,15px);font-weight:600;white-space:nowrap;cursor:pointer;will-change:transform;touch-action:manipulation;transition:scale .15s}
.cr14-b:active{scale:.96}
.cr14-l{display:flex;align-items:center;gap:7px;pointer-events:none}
.cr14-sw{position:relative;width:clamp(14px,4.5vmin,18px);height:clamp(14px,4.5vmin,18px);display:inline-block}
.cr14-ic{position:absolute;inset:0;display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:scale .3s var(--sp),opacity .15s}
.cr14-ic2{scale:0;opacity:0}.cr14-sw.cr14-alt .cr14-ic1{scale:0;opacity:0}.cr14-sw.cr14-alt .cr14-ic2{scale:1;opacity:1}
.cr14-cr{position:absolute;top:clamp(10px,3vmin,16px);right:clamp(10px,3vmin,16px);display:flex;align-items:center;gap:5px;font-weight:700;font-size:clamp(12px,3.6vmin,15px);color:var(--i)}
.cr14-cri{display:block;width:clamp(16px,5vmin,20px);height:clamp(16px,5vmin,20px);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cr14-rl{display:inline-block;overflow:hidden;height:1.15em;line-height:1.15em;vertical-align:bottom;text-align:center}
.cr14-rl[data-t="d"]{width:.66em}.cr14-rc{display:block;transition:transform .45s ease}.cr14-rs{display:block;height:1.15em;font-style:normal}
.cr14-fly{position:absolute;left:0;top:0;width:15px;height:15px;border-radius:50%;background:var(--vn);border:1px solid var(--ve);pointer-events:none}
.cr14-fly::after{content:"";position:absolute;inset:33%;border-radius:50%;background:#D5412B}
.cr14-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.cr14-cap{position:absolute;left:10px;bottom:8px;font:500 11px/1 ui-monospace,monospace;color:var(--i);opacity:.45;letter-spacing:.04em;text-transform:uppercase;pointer-events:none;user-select:none}
@media (prefers-reduced-motion:reduce){.cr14-st *{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>

<div class="cr14-st" id="cr14-st"></div>
<div class="cr14-cap" aria-hidden="true">Magnetic Button</div>
<script>(()=>{
  const s=document.getElementById('cr14-st'),RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SPR='cubic-bezier(.3,1.45,.5,1)',NO={finished:Promise.resolve(),cancel(){}},anim=(el,kf,o)=>RM()?NO:el.animate(kf,Object.assign({duration:300,easing:'cubic-bezier(.2,.8,.2,1)'},o));
  const roller=el=>{let slots=[],first=true;return str=>{const ch=[...String(str)].reverse();ch.forEach((c,i)=>{let sl=slots[i],isN=!sl;if(isN){sl=slots[i]=document.createElement('span');sl.className='cr14-rl';el.prepend(sl)}if(c>='0'&&c<='9'){if(sl.dataset.t!=='d'){sl.dataset.t='d';sl.innerHTML='<span class="cr14-rc">'+'0123456789'.replace(/\d/g,'<i class="cr14-rs">$&</i>')+'</span>';const col=sl.firstChild;col.style.transition='none';col.style.transform=`translateY(${first?-c*10:0}%)`;col.offsetHeight;col.style.transition=''}sl.firstChild.style.transitionDelay=i*35+'ms';sl.firstChild.style.transform=`translateY(${-c*10}%)`}else{sl.dataset.t='s';sl.textContent=c}if(isN&&!first)anim(sl,[{width:'0px',opacity:0},{width:sl.offsetWidth+'px',opacity:1}],{duration:260})});while(slots.length>ch.length){const sl=slots.pop();sl.remove()}first=false}};
  s.innerHTML=`<div class="cr14-mg"><div class="cr14-cr" aria-hidden="true"><svg class="cr14-cri" viewBox="0 0 24 24"><path d="M3.5 9h17l-1.5 10H5zM8 13v2M12 13v2M16 13v2M7 9l2-4M17 9l-2-4"/></svg><span class="cr14-n" data-fit-clip-ok></span></div><button type="button" class="cr14-b"><span class="cr14-l"><span class="cr14-sw"><svg class="cr14-ic cr14-ic1" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><svg class="cr14-ic cr14-ic2" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="cr14-tx">Add to crate</span></span></button><div class="cr14-sr" aria-live="polite"></div></div>`;
  const root=s.querySelector('.cr14-mg'),b=s.querySelector('.cr14-b'),l=s.querySelector('.cr14-l'),sw=s.querySelector('.cr14-sw'),tx=s.querySelector('.cr14-tx'),crate=s.querySelector('.cr14-cr'),sr=s.querySelector('.cr14-sr'),nEl=roller(s.querySelector('.cr14-n')),fine=matchMedia('(hover:hover) and (pointer:fine)');
  let n=0,x=0,y=0,vx=0,vy=0,gx=0,gy=0,raf=0,tm=0,alive=true;nEl(0);
  const loop=()=>{raf=0;vx=(vx+(gx-x)*.14)*.72;vy=(vy+(gy-y)*.14)*.72;x+=vx;y+=vy;const on=x||y;
    b.style.transform=on?`translate(${x.toFixed(2)}px,${y.toFixed(2)}px)`:'';l.style.transform=on?`translate(${(x*.3).toFixed(2)}px,${(y*.3).toFixed(2)}px)`:'';
    if(Math.abs(gx-x)+Math.abs(gy-y)+Math.abs(vx)+Math.abs(vy)<.05){x=gx;y=gy;vx=vy=0;b.style.transform=gx||gy?`translate(${gx}px,${gy}px)`:'';l.style.transform=gx||gy?`translate(${gx*.3}px,${gy*.3}px)`:''}else if(!document.hidden&&!RM())raf=requestAnimationFrame(loop)};
  const aim=(px,py)=>{gx=px;gy=py;if(!raf&&!RM())raf=requestAnimationFrame(loop)};
  root.addEventListener('pointermove',e=>{if(!fine.matches||RM()||e.pointerType!=='mouse')return;const r=b.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2-x),dy=e.clientY-(r.top+r.height/2-y),d=Math.hypot(dx,dy),R=140,f=d<R?.42*(1-(d/R)**2):0;aim(dx*f,dy*f)});
  root.addEventListener('pointerleave',()=>aim(0,0));
  const add=()=>{n=(n+1)%100;nEl(n);sw.classList.add('cr14-alt');tx.textContent='Added';clearTimeout(tm);tm=setTimeout(()=>{sw.classList.remove('cr14-alt');tx.textContent='Add to crate'},1050);sr.textContent=`${n} in crate`;
    if(RM())return;const R=root.getBoundingClientRect(),A=b.getBoundingClientRect(),B=crate.getBoundingClientRect(),f=document.createElement('i');f.className='cr14-fly';root.appendChild(f);
    const x0=A.left+A.width/2-R.left-7,y0=A.top-R.top-8,x1=B.left-R.left+2,y1=B.top-R.top+2;
    f.animate([{transform:`translate(${x0}px,${y0}px) scale(.4)`,opacity:0},{transform:`translate(${(x0+x1)/2}px,${Math.min(y0,y1)-24}px) scale(1.5)`,opacity:1,offset:.45},{transform:`translate(${x1}px,${y1}px) scale(.7)`,opacity:1}],{duration:540,easing:'cubic-bezier(.4,0,.3,1)'}).finished.catch(()=>{}).then(()=>{if(!alive)return;f.remove();anim(crate,[{transform:'scale(1.25)'},{transform:'none'}],{duration:340,easing:SPR})})};
  b.addEventListener('click',add);

  let demo=!RM()&&!(window.__foreverPreview&&window.__foreverPreview.demoEnabled===false),timer=0,kick=0,step=0;
  const play=()=>{if(!demo||RM()||document.hidden)return;const p=step++%4;if(p===0)aim(11,-7);else if(p===1){aim(0,0);add()}else if(p===2)aim(-10,-5);else{aim(0,0);add()}};
  const stop=()=>{clearInterval(timer);clearTimeout(kick);cancelAnimationFrame(raf);timer=kick=raf=0},start=()=>{if(!timer&&demo&&!RM())timer=setInterval(play,1150)},tk=()=>{demo=false;clearInterval(timer);clearTimeout(kick);timer=kick=0};
  window.addEventListener('forever:interactive',tk);s.addEventListener('pointerdown',tk,true);s.addEventListener('keydown',tk,true);
  document.addEventListener('visibilitychange',()=>document.hidden?stop():demo&&start());
  window.addEventListener('message',e=>{if(e.data&&e.data.type==='forever:theme'&&(e.data.theme==='light'||e.data.theme==='dark'))document.documentElement.setAttribute('data-theme',e.data.theme)});
  if(demo){kick=setTimeout(play,550);start()}
})();</script>
