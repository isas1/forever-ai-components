<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Magnet Family — five wordless circular buttons that lean toward your pointer or finger and toward each other, then spring home.">
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magnet Family</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
:root{--mf-bg:#1C1B18;--mf-ink:#EEE9DF;--mf-muted:#A39C8F;--mf-icon:#24221E;--mf-ring:#EEE9DF;--mf-sh:rgba(0,0,0,.35);--mf-c1:#C98B6E;--mf-c2:#D8C49E;--mf-c3:#A4B596;--mf-c4:#959DA3;--mf-c5:#93A6BB;color-scheme:dark}
:root[data-theme="light"]{--mf-bg:#F4F1EA;--mf-ink:#24221E;--mf-muted:#6B655B;--mf-ring:#24221E;--mf-sh:rgba(60,45,30,.18);color-scheme:light}
html,body{margin:0;height:100%;overflow:hidden;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;background:var(--mf-bg);color:var(--mf-ink);font:15px/1.3 ui-rounded,"Avenir Next",Avenir,system-ui,sans-serif}
.mf-st{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,6vmin,34px);background:var(--mf-bg);overflow:hidden;-webkit-tap-highlight-color:transparent}
.mf-row{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(8px,3.4vmin,20px);max-width:min(92vw,560px);padding:clamp(10px,4vmin,26px);touch-action:none}
.mf-b{appearance:none;border:0;padding:0;margin:0;width:clamp(44px,14vmin,72px);height:clamp(44px,14vmin,72px);border-radius:50%;background:transparent;cursor:pointer;will-change:transform;touch-action:none;outline:none}
.mf-f{--l:0;display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--c);color:var(--mf-icon);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -2px 0 rgba(0,0,0,.09),0 calc(1px + var(--l)*5px) calc(2px + var(--l)*8px) var(--mf-sh);transition:background-color .18s}
@media (hover:hover){.mf-b:hover .mf-f{background:color-mix(in srgb,var(--c) 86%,#fff)}}
.mf-b:active .mf-f{background:color-mix(in srgb,var(--c) 84%,var(--mf-icon))}
.mf-b:nth-child(1){--c:var(--mf-c1)}.mf-b:nth-child(2){--c:var(--mf-c2)}.mf-b:nth-child(3){--c:var(--mf-c3)}.mf-b:nth-child(4){--c:var(--mf-c4)}.mf-b:nth-child(5){--c:var(--mf-c5)}
.mf-b:focus-visible .mf-f{box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 0 3px var(--mf-bg),0 0 0 5px var(--mf-ring)}
.mf-i{width:38%;height:38%;fill:none;stroke:currentColor;stroke-width:1.9;will-change:transform;stroke-linecap:round;stroke-linejoin:round}
.mf-hit .mf-f{animation:mf-sq .42s cubic-bezier(.3,1.5,.5,1)}
@keyframes mf-sq{0%{transform:scale(1)}25%{transform:scale(1.14,.84)}55%{transform:scale(.94,1.06)}100%{transform:scale(1)}}
.mf-say{margin:0;font-size:clamp(12px,3.6vmin,16px);letter-spacing:.02em;color:var(--mf-muted);transition:opacity .3s}
.mf-say.mf-fade{opacity:0}
.mf-gh{position:absolute;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:1.5px solid var(--mf-ink);opacity:0;pointer-events:none;transition:opacity .4s}
.mf-gh.mf-on{opacity:.32}
.mf-cap{position:absolute;left:10px;bottom:8px;font:500 11px/1 ui-monospace,monospace;color:var(--mf-ink);opacity:.45;letter-spacing:.04em;text-transform:uppercase;pointer-events:none;user-select:none}
@media (prefers-reduced-motion:reduce){.mf-hit .mf-f{animation:none;background:color-mix(in srgb,var(--c) 70%,var(--mf-icon))}.mf-b:focus-visible .mf-f{background:color-mix(in srgb,var(--c) 82%,var(--mf-icon))}}
</style>

<body>
<div class="mf-st" id="mf-st">
<div class="mf-row" id="mf-row" role="group" aria-label="Magnet family">
<button type="button" class="mf-b" aria-label="Play"><span class="mf-f"><svg class="mf-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z"/></svg></span></button>
<button type="button" class="mf-b" aria-label="Like"><span class="mf-f"><svg class="mf-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19.5s-7-4.3-7-9.2A3.8 3.8 0 0 1 12 8a3.8 3.8 0 0 1 7 2.3c0 4.9-7 9.2-7 9.2z"/></svg></span></button>
<button type="button" class="mf-b" aria-label="Add"><span class="mf-f"><svg class="mf-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></button>
<button type="button" class="mf-b" aria-label="Spark"><span class="mf-f"><svg class="mf-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v4M12 16v4M4 12h4M16 12h4M6.6 6.6l2.2 2.2M15.2 15.2l2.2 2.2M17.4 6.6l-2.2 2.2M8.8 15.2l-2.2 2.2"/></svg></span></button>
<button type="button" class="mf-b" aria-label="Done"><span class="mf-f"><svg class="mf-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 12.5l4.2 4.2 8.8-9.4"/></svg></span></button>
</div>
<p class="mf-say">Come closer.</p>
<div class="mf-gh" id="mf-gh" aria-hidden="true"></div>
</div>
<div class="mf-cap" aria-hidden="true">Magnet Family</div>
<script>
(function(){
"use strict";
var root=document.documentElement,st=document.getElementById("mf-st"),row=document.getElementById("mf-row");
var gh=document.getElementById("mf-gh");
var bs=Array.prototype.slice.call(row.querySelectorAll(".mf-b"));
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
var demo=!reduce&&(!window.__foreverPreview||window.__foreverPreview.demoEnabled!==false);
var P={on:false,x:0,y:0},kbd=false,raf=0,t0=0,lastHit=0;
var D=bs.map(function(b){return{b:b,f:b.firstChild,i:b.querySelector(".mf-i"),rx:0,ry:0,x:0,y:0,vx:0,vy:0};});

window.addEventListener("message",function(e){
if(e.data&&e.data.type==="forever:theme"&&(e.data.theme==="light"||e.data.theme==="dark"))root.setAttribute("data-theme",e.data.theme);
});

function seats(){
var s=st.getBoundingClientRect();
D.forEach(function(d){
var r=d.b.getBoundingClientRect();
d.rx=r.left+r.width/2-s.left-d.x;d.ry=r.top+r.height/2-s.top-d.y;d.r=r.width/2;
});
}
var sayEl=document.querySelector(".mf-say"),said=false;
function say(on){
if(on===said)return;said=on;sayEl.classList.add("mf-fade");
setTimeout(function(){sayEl.textContent=said?"Hello.":"Come closer.";sayEl.classList.remove("mf-fade");},300);
}
function hit(d){
d.b.classList.remove("mf-hit");void d.b.offsetWidth;d.b.classList.add("mf-hit");
}
function radius(){var s=st.getBoundingClientRect();return Math.max(90,Math.min(150,Math.min(s.width,s.height)*0.42));}

function frame(ts){
raf=0;
if(document.hidden)return;
var R=radius(),moving=false,near=false,i,d;
if(demo){
if(!t0)t0=ts-900;
var t=(ts-t0)/1000,s=st.getBoundingClientRect(),a=D[0],z=D[D.length-1];
var cx=(a.rx+z.rx)/2,span=Math.max(40,(z.rx-a.rx)/2+a.r);
P.on=true;P.x=cx+Math.sin(t*0.7)*span*0.95;P.y=(a.ry+z.ry)/2+Math.sin(t*1.3)*a.r*1.3;
gh.style.transform="translate("+P.x.toFixed(1)+"px,"+P.y.toFixed(1)+"px)";
if(ts-lastHit>2600){
lastHit=ts;var best=null,bd=1e9;
D.forEach(function(q){var dd=Math.hypot(P.x-q.rx-q.x,P.y-q.ry-q.y);if(dd<bd){bd=dd;best=q;}});
if(best&&bd<best.r*1.6)hit(best);
}
if(s.width)moving=true;
}
var tx=[],ty=[];
for(i=0;i<D.length;i++){
d=D[i];var gx=0,gy=0;
var focusHere=kbd&&document.activeElement===d.b;
if(P.on&&!focusHere){
var dx=P.x-d.rx,dy=P.y-d.ry,dist=Math.hypot(dx,dy);
if(dist<R+d.r){
var pull=Math.pow(1-Math.min(1,dist/(R+d.r)),1.3);
var cap=d.r*0.55;
gx=dx*pull*0.5;gy=dy*pull*0.5;
var m=Math.hypot(gx,gy);if(m>cap){gx*=cap/m;gy*=cap/m;}
}
}
tx[i]=gx;ty[i]=gy;
}
for(i=0;i<D.length;i++){
d=D[i];
var focusMe=kbd&&document.activeElement===d.b;
var nx=0,ny=0,n=0;
if(i>0){nx+=D[i-1].x;ny+=D[i-1].y;n++;}
if(i<D.length-1){nx+=D[i+1].x;ny+=D[i+1].y;n++;}
var goalX=focusMe?0:tx[i]+(n?nx/n:0)*0.42,goalY=focusMe?0:ty[i]+(n?ny/n:0)*0.42;
d.vx=(d.vx+(goalX-d.x)*0.09)*0.8;d.vy=(d.vy+(goalY-d.y)*0.09)*0.8;
d.x+=d.vx;d.y+=d.vy;
if(Math.abs(d.vx)+Math.abs(d.vy)>0.02||Math.abs(d.x-goalX)+Math.abs(d.y-goalY)>0.05)moving=true;
d.b.style.transform="translate("+d.x.toFixed(2)+"px,"+d.y.toFixed(2)+"px)";
d.i.style.transform="translate("+(d.x*0.35).toFixed(2)+"px,"+(d.y*0.35).toFixed(2)+"px)";
d.f.style.setProperty("--l",Math.min(1,Math.hypot(d.x,d.y)/(d.r*0.55)).toFixed(3));
if(Math.hypot(P.x-d.rx,P.y-d.ry)<d.r*2.2)near=true;
}
say(P.on&&near&&!demo);
if((moving||P.on)&&!raf)raf=requestAnimationFrame(frame);
}
function wake(){if(!reduce&&!raf&&!document.hidden)raf=requestAnimationFrame(frame);}

function takeover(){
if(!demo)return;
demo=false;P.on=false;gh.classList.remove("mf-on");wake();
}
window.addEventListener("forever:interactive",takeover);

function at(e){var s=st.getBoundingClientRect();P.x=e.clientX-s.left;P.y=e.clientY-s.top;}
st.addEventListener("pointermove",function(e){
takeover();kbd=false;
if(e.pointerType==="touch"&&!e.buttons&&e.pressure===0)return;
at(e);P.on=true;wake();
});
st.addEventListener("pointerdown",function(e){takeover();kbd=false;at(e);P.on=true;wake();});
function off(e){if(e.pointerType!=="mouse"||e.type==="pointerleave"){P.on=false;wake();}}
st.addEventListener("pointerup",off);st.addEventListener("pointercancel",off);st.addEventListener("pointerleave",off);

bs.forEach(function(b,i){
b.addEventListener("click",function(){takeover();hit(D[i]);});
b.addEventListener("keydown",function(e){
var k=e.key,j=-1;
if(k==="ArrowRight"||k==="ArrowDown")j=(i+1)%bs.length;
else if(k==="ArrowLeft"||k==="ArrowUp")j=(i-1+bs.length)%bs.length;
else if(k==="Home")j=0;else if(k==="End")j=bs.length-1;
if(j>=0){e.preventDefault();bs[j].focus();}
});
b.addEventListener("animationend",function(){b.classList.remove("mf-hit");});
});
document.addEventListener("keydown",function(e){if(e.key==="Tab"||e.key.indexOf("Arrow")===0){takeover();kbd=true;wake();}});
document.addEventListener("visibilitychange",function(){if(!document.hidden)wake();});
addEventListener("resize",function(){seats();wake();});

seats();
if(demo){gh.classList.add("mf-on");wake();}
})();
</script>
</body>
</html>
