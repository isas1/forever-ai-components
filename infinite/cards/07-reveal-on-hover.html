<html lang="en">

<meta charset="UTF-8">
<meta name="description" content="Dark image card whose gradient art dims and zooms as a hidden title-and-copy panel slides up from the bottom on hover.">

<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract);
     the light re-theme is the [data-theme="light"] block */
  :root{
    --bg-700:#12141d;
    --text-0:#f4f6fb; --text-1:#c7ccdb;
    --accent-magenta:#E8B0B5; --accent-iris:#E8B0B5;
    --border-mid:rgba(255,255,255,0.12); --r-md:14px;
    --space-2:8px; --space-6:24px;
    --font-display:"Space Grotesk",system-ui,sans-serif;
    --font-body:"Inter",system-ui,sans-serif;
    --ease-out-soft:cubic-bezier(0.22,1,0.36,1); --dur-base:280ms; --dur-slow:520ms;
    --cap-o:.4;
    --c07-page-a:#12141d; --c07-page-b:#08090d;
    --c07-img-glow:rgba(232,176,181,0.55);
    --c07-panel-shade-a:rgba(8,9,13,0.96); --c07-panel-shade-b:rgba(8,9,13,0.4);
  }
  :root[data-theme="light"]{
    --bg-700:#eef1f6;
    --text-0:#1b2130; --text-1:#606d95;
    --accent-magenta:#c73d4a; --accent-iris:#c73d4a;
    --border-mid:rgba(20,24,38,0.12);
    --cap-o:.55;
    --c07-page-a:#eef1f6; --c07-page-b:#f2f4f8;
    --c07-img-glow:rgba(199,61,74,0.28);
    --c07-panel-shade-a:rgba(255,255,255,0.97); --c07-panel-shade-b:rgba(255,255,255,0.5);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--c07-page-b);}
  html,body{background:radial-gradient(80% 70% at 50% 30%,var(--c07-page-a),var(--c07-page-b));
    font-family:var(--font-body);}
  #c07-stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  .c07-rev{position:relative;width:48vmin;height:57vmin;max-width:240px;max-height:284px;
    border-radius:var(--r-md);overflow:hidden;border:1px solid var(--border-mid);cursor:pointer;}
  .c07-rev__img{position:absolute;inset:0;
    background:radial-gradient(130% 100% at 80% 10%,var(--c07-img-glow),transparent 55%),
      radial-gradient(120% 110% at 0% 100%,var(--c07-img-glow),transparent 55%),var(--bg-700);
    transition:transform var(--dur-slow) var(--ease-out-soft),filter var(--dur-slow) var(--ease-out-soft);}
  .c07-rev:not([aria-expanded]):hover .c07-rev__img,.c07-rev.c07-rev--auto .c07-rev__img{transform:scale(1.08);filter:brightness(0.7);}
  .c07-rev__tag{position:absolute;top:16px;left:16px;font-family:var(--font-display);
    font-weight:600;font-size:14px;color:var(--text-0);z-index:3;}
  .c07-rev__panel{position:absolute;left:0;right:0;bottom:0;padding:var(--space-6);
    background:linear-gradient(to top,var(--c07-panel-shade-a),var(--c07-panel-shade-b) 80%,transparent);
    transform:translateY(56%);transition:transform var(--dur-slow) var(--ease-out-soft);}
  .c07-rev:not([aria-expanded]):hover .c07-rev__panel,.c07-rev:not([aria-expanded]):focus-within .c07-rev__panel,
  .c07-rev.c07-rev--auto .c07-rev__panel{transform:translateY(0);}
  .c07-rev__t{font-family:var(--font-display);font-weight:600;font-size:18px;color:var(--text-0);
    margin:0 0 var(--space-2);letter-spacing:-0.01em;}
  .c07-rev__p{font-size:12px;color:var(--text-1);margin:0;opacity:0;transform:translateY(10px);
    transition:opacity var(--dur-base) var(--ease-out-soft) 120ms,
      transform var(--dur-base) var(--ease-out-soft) 120ms;}
  .c07-rev:not([aria-expanded]):hover .c07-rev__p,.c07-rev:not([aria-expanded]):focus-within .c07-rev__p,
  .c07-rev.c07-rev--auto .c07-rev__p{opacity:1;transform:translateY(0);}
  .cap{position:fixed;left:10px;bottom:8px;color:var(--accent-magenta);opacity:var(--cap-o);
    font-family:var(--font-body);font-size:11px;letter-spacing:.08em;text-transform:uppercase;}
  @media (prefers-reduced-motion:reduce){
    .c07-rev__img,.c07-rev__panel,.c07-rev__p{transition-duration:.001ms;}
  }
  .c07-rev:focus-visible{outline:2px solid var(--text-0);outline-offset:4px;}
@media(max-width:300px){.c07-rev{width:70vmin;height:74vmin}.c07-rev__panel{padding:12px}.c07-rev__t{font-size:15px}.c07-rev__p{font-size:12px}.c07-rev__tag{top:10px;left:10px;font-size:12px}}
</style>

<body>
<div id="c07-stage">
  <div class="c07-rev" tabindex="0" role="button" aria-expanded="false" aria-label="Reveal on hover card">
    <div class="c07-rev__img"></div>
    <span class="c07-rev__tag">Field Notes</span>
    <div class="c07-rev__panel">
      <h3 class="c07-rev__t">Slide Reveal</h3>
      <p class="c07-rev__p">Hidden copy rises into view as the image dims behind it.</p>
    </div>
  </div>
</div>
<div class="cap">Reveal on Hover</div>
<script>
(function(){
  "use strict";
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var card=document.querySelector(".c07-rev"),AUTO="c07-rev--auto";
  var DEMO_ON=1800,DEMO_OFF=1500,TICK=100;
  var timer=0,t=DEMO_OFF-400,open=false,demoEnabled=window.__foreverPreview?.demoEnabled!==false;
  function paint(){card.classList.toggle(AUTO,open);card.setAttribute('aria-expanded',open);}
  function step(){if(card.matches(':hover,:focus-within'))return;if((t+=TICK)>=(open?DEMO_ON:DEMO_OFF)){open=!open;t=0;paint();}}
  function start(){if(!timer&&!reduce&&demoEnabled&&!document.hidden)timer=setInterval(step,TICK);}
  function stop(){clearInterval(timer);timer=0;}
  function stopDemo(){demoEnabled=false;stop();}
  addEventListener('forever:interactive',stopDemo);
  document.addEventListener('pointerdown',stopDemo,{capture:true});
  card.addEventListener('click',()=>{stopDemo();open=!open;paint();});
  card.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();card.click();}});
  document.addEventListener('visibilitychange',()=>{document.hidden?stop():start();});
  addEventListener('message',e=>{const d=e.data;if(d?.type==='forever:theme'&&['light','dark'].includes(d.theme))document.documentElement.dataset.theme=d.theme;});
  paint();start();
})();
</script>
</body>
</html>
