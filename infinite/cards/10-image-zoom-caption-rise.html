<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract);
     the light re-theme is the [data-theme="light"] block */
  :root{
    --text-0:#f4f6fb;
    --accent-cyan:#D8C197;
    --border-mid:rgba(255,255,255,0.12); --r-md:14px;
    --space-1:4px; --space-6:24px;
    --font-display:"Space Grotesk",system-ui,sans-serif;
    --font-body:"Inter",system-ui,sans-serif;
    --ease-out-soft:cubic-bezier(0.22,1,0.36,1); --dur-base:280ms; --dur-slow:520ms;
    --cap-o:.4;
    --c10-page-a:#12141d; --c10-page-b:#08090d;
    --c10-art-1:rgba(216,193,151,0.5); --c10-art-2:rgba(108,97,76,0.55);
    --c10-art-3:#1a140f; --c10-art-4:#0e0d0a;
    --c10-shade:rgba(8,9,13,0.88);
  }
  :root[data-theme="light"]{
    --text-0:#1b2130;
    --accent-cyan:#896b33;
    --border-mid:rgba(20,24,38,0.12);
    --cap-o:.55;
    --c10-page-a:#eef1f6; --c10-page-b:#f2f4f8;
    --c10-art-1:rgba(137,107,51,0.32); --c10-art-2:rgba(137,107,51,0.18);
    --c10-art-3:#f4ede0; --c10-art-4:#e9ddc8;
    --c10-shade:rgba(255,255,255,0.9);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--c10-page-b);}
  html,body{background:radial-gradient(80% 70% at 50% 30%,var(--c10-page-a),var(--c10-page-b));
    font-family:var(--font-body);}
  #c10-stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  .c10-zoom{position:relative;width:48vmin;height:57vmin;max-width:240px;max-height:284px;
    border-radius:var(--r-md);overflow:hidden;border:1px solid var(--border-mid);cursor:pointer;}
  .c10-zoom__img{position:absolute;inset:0;
    background:radial-gradient(120% 90% at 70% 20%,var(--c10-art-1),transparent 55%),
      radial-gradient(120% 100% at 10% 100%,var(--c10-art-2),transparent 55%),
      conic-gradient(from 200deg at 50% 50%,var(--c10-art-3),var(--c10-art-4),var(--c10-art-3));
    transform:scale(1);transition:transform var(--dur-slow) var(--ease-out-soft);}
  .c10-zoom:not([aria-expanded]):hover .c10-zoom__img,.c10-zoom.c10-zoom--auto .c10-zoom__img{transform:scale(1.14);}
  .c10-zoom__shade{position:absolute;inset:0;
    background:linear-gradient(to top,var(--c10-shade),transparent 55%);}
  .c10-zoom__cap{position:absolute;left:0;right:0;bottom:0;padding:var(--space-6);
    transform:translateY(14px);transition:transform var(--dur-slow) var(--ease-out-soft);}
  .c10-zoom:not([aria-expanded]):hover .c10-zoom__cap,.c10-zoom:not([aria-expanded]):focus-within .c10-zoom__cap,
  .c10-zoom.c10-zoom--auto .c10-zoom__cap{transform:translateY(0);}
  .c10-zoom__eyebrow{font-size:11px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;
    color:var(--accent-cyan);margin:0 0 var(--space-1);opacity:0;transform:translateY(10px);
    transition:opacity var(--dur-base) var(--ease-out-soft) 90ms,
      transform var(--dur-base) var(--ease-out-soft) 90ms;}
  .c10-zoom:not([aria-expanded]):hover .c10-zoom__eyebrow,.c10-zoom:not([aria-expanded]):focus-within .c10-zoom__eyebrow,
  .c10-zoom.c10-zoom--auto .c10-zoom__eyebrow{opacity:1;transform:translateY(0);}
  .c10-zoom__t{font-family:var(--font-display);font-weight:600;font-size:19px;color:var(--text-0);
    margin:0;letter-spacing:-0.01em;}
  .cap{position:fixed;left:10px;bottom:8px;color:var(--accent-cyan);opacity:var(--cap-o);
    font-family:var(--font-body);font-size:11px;letter-spacing:.08em;text-transform:uppercase;}
  @media (prefers-reduced-motion:reduce){
    .c10-zoom__img,.c10-zoom__cap,.c10-zoom__eyebrow{transition-duration:.001ms;}
  }
  .c10-zoom:focus-visible{outline:2px solid var(--text-0);outline-offset:4px;}
</style>

<body>
<div id="c10-stage">
  <div class="c10-zoom" tabindex="0" role="button" aria-expanded="false" aria-label="Image zoom and caption rise card">
    <div class="c10-zoom__img"></div>
    <div class="c10-zoom__shade"></div>
    <div class="c10-zoom__cap">
      <p class="c10-zoom__eyebrow">Featured</p>
      <h3 class="c10-zoom__t">Zoom &amp; Rise</h3>
    </div>
  </div>
</div>
<div class="cap">Image Zoom + Caption Rise</div>
<script>
(function(){
  "use strict";
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var card=document.querySelector(".c10-zoom"),AUTO="c10-zoom--auto";
  var DEMO_ON=1900,DEMO_OFF=1700,TICK=100;
  var timer=0,t=DEMO_OFF-400,open=false,demoEnabled=window.__foreverPreview?.demoEnabled!==false;
  function paint(){card.classList.toggle(AUTO,open);card.setAttribute('aria-expanded',open);}
  function step(){if(card.matches(':hover,:focus-within'))return;if((t+=TICK)>=(open?DEMO_ON:DEMO_OFF)){open=!open;t=0;paint();}}
  function start(){if(!timer&&!reduce&&demoEnabled&&!document.hidden)timer=setInterval(step,TICK);}
  function stop(){clearInterval(timer);timer=0;}
  function stopDemo(){demoEnabled=false;stop();}
  addEventListener('forever:interactive',stopDemo);
  document.addEventListener('pointerdown',stopDemo,{capture:true});
  card.addEventListener('click',()=>{stopDemo();open=!open;paint();});
  card.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();card.click();}});
  document.addEventListener('visibilitychange',()=>{document.hidden?stop():start();});
  addEventListener('message',e=>{const d=e.data;if(d?.type==='forever:theme'&&['light','dark'].includes(d.theme))document.documentElement.dataset.theme=d.theme;});
  paint();start();
})();
</script>
</body>
