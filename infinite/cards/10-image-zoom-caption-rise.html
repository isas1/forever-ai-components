<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="Featured image card where the conic-gradient art zooms in while an eyebrow and title caption rise into view under a dark shade.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Zoom + Caption Rise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Inter:wght@400&display=swap" rel="stylesheet">
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract);
     the light re-theme is the [data-theme="light"] block */
  :root{
    --text-0:#f4f6fb;
    --accent-cyan:#D8C197;
    --border-mid:rgba(255,255,255,0.12); --r-md:14px;
    --space-1:4px; --space-6:24px;
    --font-display:"Space Grotesk",system-ui,sans-serif;
    --font-body:"Inter",system-ui,sans-serif;
    --ease-out-soft:cubic-bezier(0.22,1,0.36,1); --dur-base:280ms; --dur-slow:520ms;
    --cap-o:.4;
    --c10-page-a:#12141d; --c10-page-b:#08090d;
    --c10-art-1:rgba(216,193,151,0.5); --c10-art-2:rgba(108,97,76,0.55);
    --c10-art-3:#1a140f; --c10-art-4:#0e0d0a;
    --c10-shade:rgba(8,9,13,0.88);
  }
  :root[data-theme="light"]{
    --text-0:#1b2130;
    --accent-cyan:#896b33;
    --border-mid:rgba(20,24,38,0.12);
    --cap-o:.55;
    --c10-page-a:#eef1f6; --c10-page-b:#f2f4f8;
    --c10-art-1:rgba(137,107,51,0.32); --c10-art-2:rgba(137,107,51,0.18);
    --c10-art-3:#f4ede0; --c10-art-4:#e9ddc8;
    --c10-shade:rgba(255,255,255,0.9);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--c10-page-b);}
  body{background:radial-gradient(80% 70% at 50% 30%,var(--c10-page-a),var(--c10-page-b));
    font-family:var(--font-body);}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  .c10-zoom{position:relative;width:48vmin;height:57vmin;max-width:240px;max-height:284px;
    border-radius:var(--r-md);overflow:hidden;border:1px solid var(--border-mid);cursor:pointer;}
  .c10-zoom__img{position:absolute;inset:0;
    background:radial-gradient(120% 90% at 70% 20%,var(--c10-art-1),transparent 55%),
      radial-gradient(120% 100% at 10% 100%,var(--c10-art-2),transparent 55%),
      conic-gradient(from 200deg at 50% 50%,var(--c10-art-3),var(--c10-art-4),var(--c10-art-3));
    transform:scale(1);transition:transform var(--dur-slow) var(--ease-out-soft);}
  .c10-zoom:hover .c10-zoom__img,.c10-zoom.c10-zoom--auto .c10-zoom__img{transform:scale(1.14);}
  .c10-zoom__shade{position:absolute;inset:0;
    background:linear-gradient(to top,var(--c10-shade),transparent 55%);}
  .c10-zoom__cap{position:absolute;left:0;right:0;bottom:0;padding:var(--space-6);
    transform:translateY(14px);transition:transform var(--dur-slow) var(--ease-out-soft);}
  .c10-zoom:hover .c10-zoom__cap,.c10-zoom:focus-within .c10-zoom__cap,
  .c10-zoom.c10-zoom--auto .c10-zoom__cap{transform:translateY(0);}
  .c10-zoom__eyebrow{font-size:10px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;
    color:var(--accent-cyan);margin:0 0 var(--space-1);opacity:0;transform:translateY(10px);
    transition:opacity var(--dur-base) var(--ease-out-soft) 90ms,
      transform var(--dur-base) var(--ease-out-soft) 90ms;}
  .c10-zoom:hover .c10-zoom__eyebrow,.c10-zoom:focus-within .c10-zoom__eyebrow,
  .c10-zoom.c10-zoom--auto .c10-zoom__eyebrow{opacity:1;transform:translateY(0);}
  .c10-zoom__t{font-family:var(--font-display);font-weight:600;font-size:19px;color:var(--text-0);
    margin:0;letter-spacing:-0.01em;}
  .cap{position:fixed;left:10px;bottom:8px;color:var(--accent-cyan);opacity:var(--cap-o);
    font-family:var(--font-body);font-size:11px;letter-spacing:.08em;text-transform:uppercase;}
  @media (prefers-reduced-motion:reduce){
    .c10-zoom__img,.c10-zoom__cap,.c10-zoom__eyebrow{transition-duration:.001ms;}
  }
</style>
<script type="application/json" id="forever-agent-meta">

 "title": "Image Zoom + Caption Rise",
 "description": "A card with a conic-gradient art panel that scales up on hover while an eyebrow label and title rise into view from beneath a dark gradient shade.",

 "editableAreas": [

 ],

</head>
<body>
<div id="stage">
  <div class="c10-zoom" tabindex="0" aria-label="Image zoom and caption rise card">
    <div class="c10-zoom__img"></div>
    <div class="c10-zoom__shade"></div>
    <div class="c10-zoom__cap">
      <p class="c10-zoom__eyebrow">Featured</p>
      <h3 class="c10-zoom__t">Zoom &amp; Rise</h3>
    </div>
  </div>
</div>
<div class="cap">Image Zoom + Caption Rise</div>
<script>
(function(){
  "use strict";
  /* idle demo: on the wall nobody hovers a card, so the zoom + caption rise plays itself. One
     100ms interval drives it — first pass ~0.4s after mount, then zoomed 1.9s / settled 1.7s
     (~3.6s a cycle). Real hover or focus takes over (the demo class is dropped, so :hover alone
     drives the very same rules — no fighting) and it returns after ~3.5s of idleness. */
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var card=document.querySelector(".c10-zoom"), AUTO="c10-zoom--auto";
  var DEMO_ON=1900, DEMO_OFF=1700, DEMO_FIRST=400, IDLE_RESUME=3500, TICK=100;
  var T0=DEMO_OFF-DEMO_FIRST;                  // so the first (and every resumed) pass lands DEMO_FIRST in
  var timer=0, zoomed=false, demo=true, held=false, idle=0, t=T0;
  function step(){
    if(!demo){                                  // a real visitor is driving — wait them out
      if(!held&&(idle+=TICK)>=IDLE_RESUME){ demo=true; t=T0; }
      return;
    }
    if((t+=TICK)>=(zoomed?DEMO_ON:DEMO_OFF)){ zoomed=!zoomed; t=0; card.classList.toggle(AUTO,zoomed); }
  }
  function hold(){ demo=false; held=true; idle=0; zoomed=false; t=0; card.classList.remove(AUTO); }
  function release(){ held=card.matches(":hover,:focus-within"); idle=0; }
  card.addEventListener("pointerenter",hold);
  card.addEventListener("pointerdown",hold);
  card.addEventListener("pointerleave",release);
  card.addEventListener("focusin",hold);
  card.addEventListener("focusout",release);
  function start(){if(!timer&&!reduce)timer=setInterval(step,TICK);}
  function stop(){clearInterval(timer);timer=0;}
  document.addEventListener("visibilitychange",function(){document.hidden?stop():start();});
  // live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
  addEventListener("message",function(e){
    var d=e.data;
    if(d&&d.type==="forever:theme"&&(d.theme==="light"||d.theme==="dark"))document.documentElement.setAttribute("data-theme",d.theme);
  });
  start();
})();
</script>
</body>
</html>
