<!doctype html>
<html lang="en">
<head>
  <meta name="forever-preview-lifecycle" content="demo-v1">
<meta charset="utf-8">
<meta name="description" content="Holographic Foil Card — Cards. A self-contained, zero-dependency animated web component.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Holographic Foil Card</title>
  <script>
  /* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
     Runs before first paint — no dark flash. Standalone default stays dark. */
  (function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
  </script>
  <style>
    /* theme tokens — dark values are the defaults (solid-dark-bg contract);
       the light re-theme is the [data-theme="light"] block */
    :root{
      --c11-page:#0a0a0c;
      --holo-face-bg:#1a1a24; --c11-ink:#ffffff; --c11-subtitle:#8892b0;
      --c11-shadow-outer:rgba(0,0,0,0.8); --c11-shadow-inset:rgba(255,255,255,0.1);
      --c11-icon-a:#fff; --c11-icon-b:#888;
      --c11-cap:rgba(255,255,255,0.4);
      --c11-foil-blend:color-dodge; --c11-glare-blend:overlay; --holo-lines-blend:screen;
      --c11-glare-color:rgba(255,255,255,0.8); --holo-lines-color:rgba(255,255,255,0.03);
    }
    :root[data-theme="light"]{
      --c11-page:#f2f4f8;
      --holo-face-bg:#ffffff; --c11-ink:#1b2130; --c11-subtitle:#626e93;
      --c11-shadow-outer:rgba(20,24,38,0.28); --c11-shadow-inset:rgba(20,24,38,0.1);
      --c11-icon-a:#2a2a35; --c11-icon-b:#6b6b78;
      --c11-cap:rgba(20,24,38,0.5);
      --c11-foil-blend:multiply; --c11-glare-blend:multiply; --holo-lines-blend:multiply;
      --c11-glare-color:rgba(20,24,38,0.28); --holo-lines-color:rgba(20,24,38,0.035);
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--c11-page);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      perspective: 1000px;
    }

    .holo-cap {
      position: absolute;
      bottom: 16px;
      right: 16px;
      color: var(--c11-cap);
      font-size: 12px;
      pointer-events: none;
      letter-spacing: 0.5px;
    }

    .holo-card-wrapper {
      width: min(64vw, 45vh, 320px);
      aspect-ratio: 2.5 / 3.5;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
    }

    .holo-card {
      width: 100%;
      height: 100%;
      background-color: var(--holo-face-bg);
      border-radius: 16px;
      position: absolute;
      box-shadow:
        0 10px 30px -10px var(--c11-shadow-outer),
        inset 0 0 0 1px var(--c11-shadow-inset);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--c11-ink);
      text-align: center;
      transform-style: preserve-3d;
      will-change: transform;
    }

    /* The foil layer */
    .holo-card::before, .holo-card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      mix-blend-mode: var(--c11-foil-blend);
      will-change: background, opacity;
      transition: opacity 0.3s ease;
      opacity: 0;
    }

    /* Rainbow gradient foil */
    .holo-card::before {
      background: linear-gradient(
        115deg,
        transparent 20%,
        rgba(255, 0, 84, 0.5) 25%,
        rgba(255, 184, 0, 0.5) 35%,
        rgba(0, 255, 136, 0.5) 50%,
        rgba(0, 195, 255, 0.5) 65%,
        rgba(157, 0, 255, 0.5) 75%,
        transparent 80%
      );
      background-size: 300% 300%;
      background-position: var(--pos-x, 50%) var(--pos-y, 50%);
      filter: brightness(1.2) contrast(1.5);
    }

    /* Sparkle/glare overlay */
    .holo-card::after {
      background: radial-gradient(
        circle at var(--pos-x, 50%) var(--pos-y, 50%),
        var(--c11-glare-color) 0%,
        rgba(255, 255, 255, 0) 60%
      );
      mix-blend-mode: var(--c11-glare-blend);
    }

    .holo-card:hover::before, .holo-card-wrapper:focus-within .holo-card::before, .holo-card.holo-demo::before,
    .holo-card:hover::after, .holo-card-wrapper:focus-within .holo-card::after, .holo-card.holo-demo::after {
      opacity: 1;
    }

    /* Card Content */
    .holo-content {
      transform: translateZ(40px); /* Pops out slightly due to preserve-3d */
      padding: 20px;
      pointer-events: none;
    }

    .holo-icon {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, var(--c11-icon-a), var(--c11-icon-b));
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      margin: 0 auto 20px auto;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .holo-title {
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 8px 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.5);
    }

    .holo-subtitle {
      font-size: 12px;
      color: var(--c11-subtitle);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Glitch lines inside the foil */
    .holo-card .holo-lines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        var(--holo-lines-color) 2px,
        var(--holo-lines-color) 4px
      );
      pointer-events: none;
      mix-blend-mode: var(--holo-lines-blend);
    }

    @media (prefers-reduced-motion: reduce) {
      .holo-card-wrapper {
        transform: none !important;
        transition: none !important;
      }
      .holo-card::before, .holo-card::after {
        opacity: 0.5 !important;
        background-position: 50% 50% !important;
        transition: none !important;
      }
    }
    .holo-card-wrapper:focus-visible{outline:2px solid var(--c11-ink);outline-offset:4px;}
@media(max-width:300px){.holo-card-wrapper{width:min(75vw,55vh)}.holo-content{padding:8px}.holo-title{font-size:16px;letter-spacing:1px}.holo-subtitle{font-size:12px}.holo-icon{width:30px;height:30px;margin-bottom:10px}}
</style>
<script type="application/json" id="forever-agent-meta">

 "description": "A dark card tilts in 3D up to 20deg as the pointer moves over it; rainbow foil gradient and radial glare shift with cursor position via CSS custom properties.",
 "useWhen": "Product cards, trading-card showcases, NFT or collectible displays, hero feature cards needing tactile depth.",
 "avoidWhen": "Dense card grids where hover state would constantly trigger on adjacent items. Touch-only devices get no tilt — foil still appears but 3D feel is absent.",
 "agentPrompt": "Adjust the existing palette tokens and effect parameters while preserving manual control. First deliberate input stops idle demo work while manual feedback finishes. Keep demo-v1 lifecycle marker, __foreverPreview.demoEnabled initialization and forever:interactive handler. Preserve reduced motion, visibility suspension and theme switching.",
 "editableAreas": [

 ],

  "prefers-reduced-motion guard in both CSS and JS",

  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)",
  "sticky demo-v1 preview lifecycle; stop attract work, retain manual feedback and settling",
  "pointer/touch takeover, keyboard access and visibility suspension",
  "demo-v1 preview lifecycle: initialize demoEnabled from window.__foreverPreview and stop attract work on the window forever:interactive event; retain manual feedback, settling, cleanup and explicit sessions"
 ],
 "knownLimitations": [
  "Light re-theme via the [data-theme=light] token block; catalog bg/accent describe the dark default",
  "Touch support moves foil but does not tilt the card (touchmove maps to mousemove but no orientation tracking)",
  "Control state is local to each mount; format changes preserve preview takeover but create a fresh source instance.",
  "State remains local to each mounted instance; format/theme remount preserves takeover, not component values."
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "holographic",

 ]
}
</script>
</head>
<body>

  <div class="holo-card-wrapper" id="holo-wrapper" tabindex="0" aria-label="Foil card. Use arrow keys to tilt.">
    <div class="holo-card" id="holo-face">
      <div class="holo-lines"></div>
      <div class="holo-content">
        <div class="holo-icon"></div>
        <h2 class="holo-title">Aether</h2>
        <div class="holo-subtitle">Mythic Rare</div>
      </div>
    </div>
  </div>

  <div class="holo-cap">Holographic Foil Card</div>

  <script>
    (() => {
      const wrapper=document.getElementById('holo-wrapper'),card=document.getElementById('holo-face');
      const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
      let demoEnabled=window.__foreverPreview?.demoEnabled!==false,raf=0,phase=.9;
      let tx=0,ty=0,x=0,y=0;
      const setPos=(px,py)=>{card.style.setProperty('--pos-x',px+'%');card.style.setProperty('--pos-y',py+'%');};
      function paint(){wrapper.style.transform=`perspective(1000px) rotateX(${x}deg) rotateY(${y}deg)`;}
      function wake(){if(!document.hidden&&!raf)raf=requestAnimationFrame(frame);}
      function frame(){raf=0;if(document.hidden)return;
        if(demoEnabled&&!reduce){phase+=.028;tx=Math.sin(phase)*12;ty=Math.cos(phase*.7)*14;setPos(50+Math.cos(phase*.7)*40,50+Math.sin(phase)*40);}
        x=reduce?tx:x+(tx-x)*.1;y=reduce?ty:y+(ty-y)*.1;
        if(Math.abs(tx-x)<.001)x=tx;if(Math.abs(ty-y)<.001)y=ty;paint();
        if((demoEnabled&&!reduce)||x!==tx||y!==ty)wake();
      }
      function stopDemo(){demoEnabled=false;card.classList.remove('holo-demo');}
      addEventListener('forever:interactive',stopDemo);
      document.addEventListener('pointerdown',stopDemo,{capture:true});
      function point(e){const r=wrapper.getBoundingClientRect();tx=-(e.clientY-r.top-r.height/2)/(r.height/2)*20;ty=(e.clientX-r.left-r.width/2)/(r.width/2)*20;setPos((e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100);if(reduce){x=tx;y=ty;paint();}else wake();}
      wrapper.addEventListener('pointermove',point);wrapper.addEventListener('pointerdown',point);
      wrapper.addEventListener('pointerleave',()=>{tx=ty=0;setPos(50,50);wake();});
      wrapper.addEventListener('keydown',e=>{if(!/^Arrow(Left|Right|Up|Down)$/.test(e.key))return;e.preventDefault();stopDemo();tx=Math.max(-20,Math.min(20,tx+(e.key==='ArrowDown'?-4:e.key==='ArrowUp'?4:0)));ty=Math.max(-20,Math.min(20,ty+(e.key==='ArrowRight'?4:e.key==='ArrowLeft'?-4:0)));setPos(50+ty*2,50-tx*2);wake();});
      document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);raf=0;if(!document.hidden&&((demoEnabled&&!reduce)||x!==tx||y!==ty))wake();});
      addEventListener('message',e=>{const d=e.data;if(d?.type==='forever:theme'&&['light','dark'].includes(d.theme))document.documentElement.dataset.theme=d.theme;});
      setPos(50,50);paint();if(demoEnabled&&!reduce){card.classList.add('holo-demo');wake();}
    })();
  </script>
</body>
</html>
