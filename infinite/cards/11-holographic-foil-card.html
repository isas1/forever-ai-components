<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
<meta name="description" content="Holographic Foil Card — Cards. A self-contained, zero-dependency animated web component.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Holographic Foil Card</title>
  <script>
  /* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
     Runs before first paint — no dark flash. Standalone default stays dark. */
  (function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
  </script>
  <style>
    /* theme tokens — dark values are the defaults (solid-dark-bg contract);
       the light re-theme is the [data-theme="light"] block */
    :root{
      --c11-page:#0a0a0c;
      --c11-card-bg:#1a1a24; --c11-ink:#ffffff; --c11-subtitle:#8892b0;
      --c11-shadow-outer:rgba(0,0,0,0.8); --c11-shadow-inset:rgba(255,255,255,0.1);
      --c11-icon-a:#fff; --c11-icon-b:#888;
      --c11-cap:rgba(255,255,255,0.4);
      --c11-foil-blend:color-dodge; --c11-glare-blend:overlay; --c11-lines-blend:screen;
      --c11-glare-color:rgba(255,255,255,0.8); --c11-lines-color:rgba(255,255,255,0.03);
    }
    :root[data-theme="light"]{
      --c11-page:#f2f4f8;
      --c11-card-bg:#ffffff; --c11-ink:#1b2130; --c11-subtitle:#626e93;
      --c11-shadow-outer:rgba(20,24,38,0.28); --c11-shadow-inset:rgba(20,24,38,0.1);
      --c11-icon-a:#2a2a35; --c11-icon-b:#6b6b78;
      --c11-cap:rgba(20,24,38,0.5);
      --c11-foil-blend:multiply; --c11-glare-blend:multiply; --c11-lines-blend:multiply;
      --c11-glare-color:rgba(20,24,38,0.28); --c11-lines-color:rgba(20,24,38,0.035);
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--c11-page);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      perspective: 1000px;
    }

    .holo-cap {
      position: absolute;
      bottom: 16px;
      right: 16px;
      color: var(--c11-cap);
      font-size: 12px;
      pointer-events: none;
      letter-spacing: 0.5px;
    }

    .holo-card-wrapper {
      width: clamp(200px, 40vw, 320px);
      aspect-ratio: 2.5 / 3.5;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
    }

    .holo-card {
      width: 100%;
      height: 100%;
      background-color: var(--c11-card-bg);
      border-radius: 16px;
      position: absolute;
      box-shadow:
        0 10px 30px -10px var(--c11-shadow-outer),
        inset 0 0 0 1px var(--c11-shadow-inset);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--c11-ink);
      text-align: center;
      transform-style: preserve-3d;
      will-change: transform;
    }

    /* The foil layer */
    .holo-card::before, .holo-card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      mix-blend-mode: var(--c11-foil-blend);
      will-change: background, opacity;
      transition: opacity 0.3s ease;
      opacity: 0;
    }

    /* Rainbow gradient foil */
    .holo-card::before {
      background: linear-gradient(
        115deg,
        transparent 20%,
        rgba(255, 0, 84, 0.5) 25%,
        rgba(255, 184, 0, 0.5) 35%,
        rgba(0, 255, 136, 0.5) 50%,
        rgba(0, 195, 255, 0.5) 65%,
        rgba(157, 0, 255, 0.5) 75%,
        transparent 80%
      );
      background-size: 300% 300%;
      background-position: var(--pos-x, 50%) var(--pos-y, 50%);
      filter: brightness(1.2) contrast(1.5);
    }

    /* Sparkle/glare overlay */
    .holo-card::after {
      background: radial-gradient(
        circle at var(--pos-x, 50%) var(--pos-y, 50%),
        var(--c11-glare-color) 0%,
        rgba(255, 255, 255, 0) 60%
      );
      mix-blend-mode: var(--c11-glare-blend);
    }

    .holo-card:hover::before, .holo-card.holo-demo::before,
    .holo-card:hover::after, .holo-card.holo-demo::after {
      opacity: 1;
    }

    /* Card Content */
    .holo-content {
      transform: translateZ(40px); /* Pops out slightly due to preserve-3d */
      padding: 20px;
      pointer-events: none;
    }

    .holo-icon {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, var(--c11-icon-a), var(--c11-icon-b));
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      margin: 0 auto 20px auto;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .holo-title {
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 8px 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.5);
    }

    .holo-subtitle {
      font-size: 12px;
      color: var(--c11-subtitle);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Glitch lines inside the foil */
    .holo-card .lines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        var(--c11-lines-color) 2px,
        var(--c11-lines-color) 4px
      );
      pointer-events: none;
      mix-blend-mode: var(--c11-lines-blend);
    }

    @media (prefers-reduced-motion: reduce) {
      .holo-card-wrapper {
        transform: none !important;
        transition: none !important;
      }
      .holo-card::before, .holo-card::after {
        opacity: 0.5 !important;
        background-position: 50% 50% !important;
        transition: none !important;
      }
    }
  </style>
<script type="application/json" id="forever-agent-meta">

 ],

</script>
</head>
<body>

  <div class="holo-card-wrapper" id="holoWrapper">
    <div class="holo-card" id="holoCard">
      <div class="lines"></div>
      <div class="holo-content">
        <div class="holo-icon"></div>
        <h2 class="holo-title">Aether</h2>
        <div class="holo-subtitle">Mythic Rare</div>
      </div>
    </div>
  </div>

  <div class="holo-cap">Holographic Foil Card</div>

  <script>
    (() => {
      const wrapper = document.getElementById('holoWrapper');
      const card = document.getElementById('holoCard');
      const prefersReducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let isRunning = true, animationFrame, isHovering = false;
      let targetRotX = 0, targetRotY = 0, currentRotX = 0, currentRotY = 0;
      const lerp = (start, end, factor) => start + (end - start) * factor;
      const setPos = (x, y) => { card.style.setProperty('--pos-x', `${x}%`); card.style.setProperty('--pos-y', `${y}%`); };
      // idle demo: nobody on the wall tilts a card, so a synthetic pointer orbits the face through the
      // very same tilt + foil math a real pointer drives (max 20°; the sheen shares the :hover rule via
      // .holo-demo). A real pointer takes over; the orbit resumes after IDLE_RESUME ms of quiet.
      const IDLE_RESUME = 3600, ORBIT_SPEED = 0.028;   // rad per frame ≈ one orbit every 3.7 s
      let demo = true, phase = 0.9, idleSince = 0;
      const orbit = () => {
        phase += ORBIT_SPEED;
        targetRotX = Math.sin(phase) * 12; targetRotY = Math.cos(phase * 0.7) * 14;
        setPos(50 + Math.cos(phase * 0.7) * 40, 50 + Math.sin(phase) * 40);
        card.classList.add('holo-demo');
      };
      const takeover = () => { demo = false; idleSince = performance.now(); card.classList.remove('holo-demo'); };
      const handleMouseMove = (e) => {
        if (!isRunning || prefersReducedMotion) return;
        isHovering = true; takeover();
        const rect = wrapper.getBoundingClientRect();
        const mouseX = e.clientX - (rect.left + rect.width / 2), mouseY = e.clientY - (rect.top + rect.height / 2);
        targetRotX = -(mouseY / (rect.height / 2)) * 20;   // max 20 degrees
        targetRotY = (mouseX / (rect.width / 2)) * 20;
        setPos(((e.clientX - rect.left) / rect.width) * 100, ((e.clientY - rect.top) / rect.height) * 100);
      };
      const handleMouseLeave = () => { isHovering = false; idleSince = performance.now(); targetRotX = 0; targetRotY = 0; setPos(50, 50); };
      const animate = () => {
        if (!isRunning || prefersReducedMotion) return;
        if (!demo && !isHovering && performance.now() - idleSince > IDLE_RESUME) demo = true;
        if (demo) orbit();
        currentRotX = lerp(currentRotX, targetRotX, 0.1);
        currentRotY = lerp(currentRotY, targetRotY, 0.1);
        wrapper.style.transform = `perspective(1000px) rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
        animationFrame = requestAnimationFrame(animate);
      };
      const start = () => { if (!isRunning && !prefersReducedMotion) { isRunning = true; animate(); } };
      const stop = () => { isRunning = false; cancelAnimationFrame(animationFrame); };
      document.addEventListener('visibilitychange', () => { document.hidden ? stop() : start(); });
      addEventListener('message', (e) => {
        const d = e.data;
        if (d && d.type === 'forever:theme' && (d.theme === 'light' || d.theme === 'dark')) {
          document.documentElement.setAttribute('data-theme', d.theme);
        }
      });
      wrapper.addEventListener('mousemove', handleMouseMove);
      wrapper.addEventListener('mouseleave', handleMouseLeave);
      wrapper.addEventListener('touchmove', (e) => handleMouseMove(e.touches[0]));   // mobile: foil follows the finger
      wrapper.addEventListener('touchend', handleMouseLeave);
      if (!prefersReducedMotion) animate();
    })();
  </script>
</body>
</html>
