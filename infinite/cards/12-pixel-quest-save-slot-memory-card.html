<head>
<meta charset="utf-8">
<meta name="description" content="Pixel Quest Save Slot — Cards. A self-contained, zero-dependency animated web component.">

<script>(()=>{const p=new URLSearchParams(location.search).get("theme");if(p==="light"||p==="dark")document.documentElement.dataset.theme=p})();window.addEventListener("message",e=>{if(e.data?.type==="forever:theme"&&(e.data.theme==="light"||e.data.theme==="dark"))document.documentElement.dataset.theme=e.data.theme});</script>
<style>
  :root {
    --bit-bg: #000000;
    --bit-card: #0A0D14;
    --bit-text: #FFFFFF;
    --bit-gold: #FFCC00;
    --bit-red: #E52521;
    --bit-border: #FFFFFF;
    --bit-shadow: #3C4252;
  }
  [data-theme="light"] {
    --bit-bg: #EAE6DF;
    --bit-card: #FFFFFF;
    --bit-text: #111111;
    --bit-gold: #C49000;
    --bit-red: #B81814;
    --bit-border: #111111;
    --bit-shadow: #A8A090;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bit-bg);
    color: var(--bit-text);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .bg11-root {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    position: relative;
    user-select: none;
  }
  .bg11-save-card {
    width: 100%;
    max-width: 350px;
    background: var(--bit-card);
    border: 3px solid var(--bit-border);
    box-shadow: 6px 6px 0 var(--bit-shadow);
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .bg11-save-card:hover {
    transform: translateY(-2px);
  }
  .bg11-card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--bit-border);
    padding-bottom: 6px;
    font-size: 11px;
    font-weight: 700;
  }
  .bg11-slot-badge {
    color: var(--bit-gold);
    letter-spacing: 0.05em;
  }
  .bg11-hero-preview-box {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(255, 255, 255, 0.04);
    border: 1.5px solid var(--bit-border);
    border-radius: 4px;
    padding: 10px 12px;
  }
  .bg11-hero-avatar {
    width: 48px;
    height: 48px;
    background: #181C22;
    border: 2px solid var(--bit-gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
  }
  .bg11-hero-meta {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .bg11-hero-name {
    font-size: 13px;
    font-weight: 800;
    color: var(--bit-gold);
  }
  .bg11-hero-level {
    font-size: 11px;
    color: var(--bit-text);
  }
  .bg11-hearts-row {
    color: var(--bit-red);
    font-size: 11px;
    letter-spacing: 2px;
  }
  .bg11-stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .bg11-stat-box {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--bit-border);
    border-radius: 4px;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .bg11-stat-label {
    font-size: 11px;
    color: var(--bit-text);
    opacity: .7;
    text-transform: uppercase;
  }
  .bg11-stat-val {
    font-size: 11px;
    font-weight: 700;
    color: var(--bit-gold);
  }
  .bg11-card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--bit-border);
    padding-top: 6px;
    font-size: 11px;
  }
  .bg11-time-clock {
    font-weight: 700;
  }
  .bg11-caption {
    position: absolute;
    bottom: 8px;
    right: 12px;
    font-size: 10px;
    letter-spacing: 0.05em;
    color: var(--bit-gold);
    opacity: 0.65;
    pointer-events: none;
    font-family: ui-monospace, monospace;
  }
  @container fit-12-pixel-quest-save-slot-memory-card (max-width:300px){
    .bg11-root{padding:8px}.bg11-save-card{width:calc(100% - 8px);padding:10px;gap:6px;box-shadow:3px 3px 0 var(--bit-shadow)}
    .bg11-card-head{font-size:11px}.bg11-hero-preview-box{gap:8px;padding:6px 8px}.bg11-hero-avatar{width:34px;height:34px;font-size:19px}.bg11-hero-name{font-size:11px}.bg11-hero-level,.bg11-hearts-row{font-size:11px}.bg11-stats-grid{gap:5px}.bg11-stat-box{padding:4px 5px}.bg11-stat-label{font-size:11px}.bg11-stat-val{font-size:11px}.bg11-card-footer{font-size:11px;padding-top:4px}.bg11-caption{display:none}
  }


@media(prefers-reduced-motion:reduce){.bg11-root, .bg11-root *{animation:none!important;transition:none!important}}

.bg11-root[data-paused] *,.bg11-root[data-paused]{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){.bg11-root,.bg11-root *{animation:none!important;transition:none!important}}
@container fit-12-pixel-quest-save-slot-memory-card (max-width:210px){.bg11-save-card{padding:8px;gap:5px}.bg11-card-head,.bg11-hero-level,.bg11-hearts-row{display:none}.bg11-hero-preview-box{padding:5px 7px}.bg11-stats-grid .bg11-stat-box:nth-child(n+3){display:none}.bg11-stat-label{font-size:11px}.bg11-card-footer{font-size:11px}}
body{width:100%;container-type:inline-size;container-name:fit-12-pixel-quest-save-slot-memory-card}

<div class="bg11-root" role="region" aria-label="Pixel Quest Save Slot · 8-Bit Gaming Card">

<script>
(()=>{
  // Local frame lifecycle: stop hidden work, repaint reduced-motion state on input.
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const frames = new Map(), drivers = new Set(); let painting = false;
  function scheduleFrame(fn) {
    drivers.add(fn);
    if (document.hidden || frames.has(fn) || (motion.matches && painting)) return;
    frames.set(fn, requestAnimationFrame(t => {
      frames.delete(fn); if (document.hidden) return;
      painting = true; try { fn(t); } finally { painting = false; }
    }));
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { frames.forEach(cancelAnimationFrame); frames.clear(); }
    else drivers.forEach(scheduleFrame);
  });
  const repaint = () => { if (motion.matches) drivers.forEach(scheduleFrame); };
  ['click','input','pointermove'].forEach(type => document.addEventListener(type, repaint));
  motion.addEventListener('change', () => {
    reduce = motion.matches;
    if (clockTimer !== null) { clearTimeout(clockTimer); clockTimer = null; }
    drivers.forEach(scheduleFrame);
  });

  const tileRoot = document.querySelector('.bg11-root');
  const pauseCSS = () => tileRoot.toggleAttribute('data-paused', document.hidden);
  document.addEventListener('visibilitychange', pauseCSS); pauseCSS();

  let totalSec = 42 * 3600 + 18 * 60 + 24, clockTimer = null;
  let running = true;
  let reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const clockEl = document.getElementById("bg11-playtime-str");

  function loop() {
    if (clockTimer !== null) { clearTimeout(clockTimer); clockTimer = null; }
    if (!running) return;
    if (!reduce) {
      totalSec++;
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      if (clockEl) {
        clockEl.textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }
    }
    if (!reduce) clockTimer = setTimeout(() => { clockTimer = null; scheduleFrame(loop); }, 1000);
  }

  document.addEventListener("visibilitychange", () => {
    running = !document.hidden;
    if (!running && clockTimer !== null) { clearTimeout(clockTimer); clockTimer = null; }
  });

  scheduleFrame(loop);
})();
</script>
