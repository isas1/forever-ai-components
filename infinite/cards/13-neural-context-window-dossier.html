<script>(()=>{const p=new URLSearchParams(location.search).get("theme");if(p)document.documentElement.dataset.theme=p})();window.addEventListener("message",e=>{if(e.data?.type==="forever:theme")document.documentElement.dataset.theme=e.data.theme});</script>
<style>
  :root {
    --fc10-bg: #0A0A0A;
    --fc10-surface: #141414;
    --fc10-text: #EDEDEA;
    --fc10-muted: #7A7A75;
    --fc10-accent: #C7F000;
    --fc10-border: rgba(255, 255, 255, 0.08);
  }
  [data-theme="light"] {
    --fc10-bg: #F4F4F0;
    --fc10-surface: #FFFFFF;
    --fc10-text: #181816;
    --fc10-muted: #82827C;
    --fc10-accent: #6E8800;
    --fc10-border: rgba(0, 0, 0, 0.08);
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--fc10-bg);
    color: var(--fc10-text);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .fc10-root {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    position: relative;
    user-select: none;
  }
  .fc10-dossier-card {
    width: 100%;
    max-width: 360px;
    background: var(--fc10-surface);
    border: 1px solid var(--fc10-border);
    border-radius: 12px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 14px;
    position: relative;
  }
  .fc10-header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--fc10-border);
    padding-bottom: 8px;
    font-size: 12px;
  }
  .fc10-dossier-title {
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  .fc10-window-cap {
    color: var(--fc10-accent);
    font-weight: 600;
  }
  .fc10-heat-strip {
    position: relative;
    width: 100%;
    height: 48px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--fc10-border);
    border-radius: 6px;
    overflow: hidden;
  }
  .fc10-heat-canvas {
    width: 100%;
    height: 48px;
    display: block;
  }
  .fc10-strip-caption {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: var(--fc10-muted);
  }
  .fc10-metrics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .fc10-metric-cell {
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid var(--fc10-border);
    border-radius: 6px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .fc10-cell-label {
    font-size: 12px;
    color: var(--fc10-muted);
  }
  .fc10-cell-value {
    font-size: 12px;
    font-weight: 700;
    color: var(--fc10-text);
  }
  .fc10-card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--fc10-muted);
    border-top: 1px solid var(--fc10-border);
    padding-top: 8px;
  }
  .fc10-compaction-badge {
    color: var(--fc10-accent);
    font-weight: 600;
  }
  .fc10-caption {
    position: absolute;
    bottom: 8px;
    right: 12px;
    font-size: 10px;
    letter-spacing: 0.05em;
    color: var(--fc10-muted);
    opacity: 0.65;
    pointer-events: none;
  }

<div class="fc10-root" role="region" aria-label="Neural Context Window Dossier · Forever Card">
  <div class="fc10-dossier-card">
    <div class="fc10-header-row">
      <span class="fc10-dossier-title">ATTENTION CONTEXT DOSSIER</span>
      <span class="fc10-window-cap">128K TOKENS</span>
    </div>

      </div>

      </div>
      <div class="fc10-metric-cell">

      </div>

      </div>

<div class="fc10-caption" aria-hidden="true">Neural Context Dossier</div>

<script>
(()=>{
  let phase = 0;
  let running = true;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const canvas = document.getElementById("fc10-canvas");
  const ctx = canvas ? canvas.getContext("2d") : null;

  let w = 320, h = 48;
  function resize() {
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    w = canvas.clientWidth || 320;
    h = canvas.clientHeight || 48;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    if (ctx) ctx.scale(dpr, dpr);
  }
  resize();

  function render() {
    if (!running || !ctx) return;
    ctx.clearRect(0, 0, w, h);

    if (!reduce) phase += 0.02;

    const accent = getComputedStyle(document.documentElement).getPropertyValue("--fc10-accent").trim() || "#C7F000";

    const bars = 48;
    const barW = (w - (bars - 1) * 2) / bars;

    for (let i = 0; i < bars; i++) {
      const norm = i / (bars - 1);
      // U-shaped "Lost in the middle" attention curve
      const uShape = Math.pow(Math.abs(norm - 0.5) * 2, 2);
      const wave = Math.sin(phase + i * 0.3) * 0.15;
      const heightFrac = Math.max(0.15, Math.min(0.95, 0.35 + uShape * 0.5 + wave));
      const barH = heightFrac * (h - 8);

      const x = i * (barW + 2);
      const y = h - barH - 4;

      ctx.fillStyle = i < 4 || i > bars - 5 ? accent : "rgba(255, 255, 255, 0.25)";
      ctx.fillRect(x, y, barW, barH);
    }

    requestAnimationFrame(render);
  }

  document.addEventListener("visibilitychange", () => {
    running = !document.hidden;
  });

  requestAnimationFrame(render);
})();
</script>
