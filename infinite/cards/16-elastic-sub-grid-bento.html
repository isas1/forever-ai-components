<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Elastic Sub-Grid Bento — Cards. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="forever-preview-lifecycle" content="demo-v1">
<title>Elastic Sub-Grid Bento</title>
<script>
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();

<style>
:root{
  --accent:#C7F000; --bg:#0A0A0A; --surface:#111111; --surface-2:#161616; --surface-3:#1C1C1C;
  --text:#EDEDEA; --text-muted:#8A8A85; --border:rgba(255,255,255,.08);
  --shadow-lg:0 16px 48px rgba(0,0,0,.55);
  --font-sans:system-ui,-apple-system,Arial,sans-serif; --font-mono:ui-monospace,Menlo,monospace;
}
:root[data-theme="light"]{
  --bg:#FAFAF8; --surface:#F4F4F0; --surface-2:#ECECE6; --surface-3:#FFFFFF;
  --text:#1A1A18; --text-muted:#6B6B66; --border:rgba(0,0,0,.08); --accent:#4D7A00;
  --shadow-lg:0 16px 48px rgba(0,0,0,.14);
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
.bnt-stage{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--font-sans);color:var(--text);font-size:max(4.5px,2.5vmin);user-select:none}
.bnt-stage *{box-sizing:border-box;margin:0;padding:0}
.bnt-bento{width:30em;height:32em;padding:1em;border-radius:1em;background:var(--surface);border:1px solid var(--border);display:grid;grid-template-columns:var(--bnt-c1,1fr) var(--bnt-c2,1fr);grid-template-rows:var(--bnt-r1,1fr) var(--bnt-r2,1fr);gap:.8em;box-shadow:var(--shadow-lg)}
.bnt-cell{background:var(--surface-2);border:1px solid var(--border);border-radius:.7em;padding:1.2em;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;cursor:pointer;min-width:0;min-height:0;transition:background-color .2s,border-color .2s}
.bnt-cell[data-active="true"]{background:var(--surface-3);border-color:var(--accent)}
.bnt-cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bnt-tag{font-family:var(--font-mono);font-size:.9em;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted)}
.bnt-stat{font-size:2em;font-weight:800;letter-spacing:-.03em;transition:color .2s}
.bnt-cell[data-active="true"] .bnt-stat{color:var(--accent)}
.bnt-detail{font-size:1em;color:var(--text-muted);opacity:0;transform:translateY(.5em);transition:opacity .2s,transform .2s;white-space:nowrap}
.bnt-cell[data-active="true"] .bnt-detail{opacity:1;transform:none}
.bnt-cap{position:fixed;left:8px;bottom:7px;font:10px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text);opacity:.3;pointer-events:none}
@media (prefers-reduced-motion:reduce){.bnt-cell,.bnt-stat,.bnt-detail{transition:none}}
</style>

<body>
<div class="bnt-stage" role="group" aria-label="Elastic sub-grid bento card. Hover or focus a cell to expand it.">
  <div class="bnt-bento" id="bnt-bento">
    <div class="bnt-cell" tabindex="0" role="button" aria-pressed="false"><span class="bnt-tag">Latency</span><div><div class="bnt-stat">14.2ms</div><div class="bnt-detail">p99 Edge &middot; eu-west-1</div></div></div>
    <div class="bnt-cell" tabindex="0" role="button" aria-pressed="false"><span class="bnt-tag">Throughput</span><div><div class="bnt-stat">84.6k</div><div class="bnt-detail">req/sec &middot; Autoscale ON</div></div></div>
    <div class="bnt-cell" tabindex="0" role="button" aria-pressed="false"><span class="bnt-tag">Uptime</span><div><div class="bnt-stat">99.99%</div><div class="bnt-detail">Zero incidents &middot; 90d</div></div></div>
    <div class="bnt-cell" tabindex="0" role="button" aria-pressed="false"><span class="bnt-tag">Cache Hit</span><div><div class="bnt-stat">96.4%</div><div class="bnt-detail">L1 + L2 Redis Cluster</div></div></div>
  </div>
</div>
<div class="bnt-cap" aria-hidden="true">Elastic Sub-Grid Bento</div>
<script>
(function(){
  'use strict';
  var bento=document.getElementById('bnt-bento'),cells=[].slice.call(bento.querySelectorAll('.bnt-cell'));
  addEventListener('message',function(e){
    var d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark'))document.documentElement.setAttribute('data-theme',d.theme);
  });
  var demoEnabled=!(window.__foreverPreview&&window.__foreverPreview.demoEnabled===false);
  var isVisible=!document.hidden,activeIdx=0,demoTimer=0,rafId=0,last=0;
  var T=[1.75,1,1.75,1],Cv=[1.75,1,1.75,1];   /* col1, col2, row1, row2 weights: target and current */
  function reduced(){return matchMedia('(prefers-reduced-motion: reduce)').matches;}
  function stopDemo(){demoEnabled=false;}
  addEventListener('forever:interactive',stopDemo);

  function select(idx){
    activeIdx=idx;
    cells.forEach(function(c,i){c.setAttribute('data-active',String(i===idx));c.setAttribute('aria-pressed',String(i===idx));});
    T=idx<0?[1,1,1,1]:[idx%2===0?1.75:1,idx%2===1?1.75:1,idx<2?1.75:1,idx>=2?1.75:1];
    kick();
  }
  cells.forEach(function(c,i){
    c.addEventListener('pointerenter',function(){stopDemo();select(i);});
    c.addEventListener('click',function(){stopDemo();select(i);});
    c.addEventListener('focus',function(){stopDemo();select(i);});
    c.addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter'){stopDemo();select(i);e.preventDefault();}});
  });
  bento.addEventListener('pointerleave',function(){select(-1);});

  function tick(now){
    if(!isVisible){rafId=0;return;}
    var dt=last?Math.min(now-last,50)/16.667:1;last=now;
    var rm=reduced();
    if(demoEnabled&&!rm){demoTimer+=dt;if(demoTimer>=95){demoTimer=0;select((activeIdx+1)%4);}}
    var k=rm?1:1-Math.pow(1-.14,dt),off=0;
    for(var i=0;i<4;i++){Cv[i]+=(T[i]-Cv[i])*k;off+=Math.abs(T[i]-Cv[i]);}
    ['c1','c2','r1','r2'].forEach(function(n,i){bento.style.setProperty('--bnt-'+n,Cv[i].toFixed(3)+'fr');});
    if(off<.002&&(rm||!demoEnabled)){rafId=0;return;}
    rafId=requestAnimationFrame(tick);
  }
  function kick(){if(isVisible&&!rafId){last=0;rafId=requestAnimationFrame(tick);}}
  document.addEventListener('visibilitychange',function(){
    isVisible=!document.hidden;
    if(!isVisible&&rafId){cancelAnimationFrame(rafId);rafId=0;}
    kick();
  });
  select(0);
})();
</script>
</body>
</html>
