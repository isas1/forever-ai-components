<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Chrono-Scrubber Snapshot — Cards. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="forever-preview-lifecycle" content="demo-v1">
<title>Chrono-Scrubber Snapshot</title>
<script>
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
:root{
  --accent:#C7F000; --accent-soft:rgba(199,240,0,.14); --accent-line:rgba(199,240,0,.32);
  --bg:#0A0A0A; --bg-sunken:#070707; --surface:#111111;
  --text:#EDEDEA; --text-muted:#8A8A85; --text-faint:#5A5A56; --border:rgba(255,255,255,.08);
  --shadow-lg:0 16px 48px rgba(0,0,0,.55);
  --font-sans:system-ui,-apple-system,Arial,sans-serif; --font-mono:ui-monospace,Menlo,monospace;
}
:root[data-theme="light"]{
  --bg:#FAFAF8; --bg-sunken:#F1F1EC; --surface:#F4F4F0;
  --text:#1A1A18; --text-muted:#6B6B66; --text-faint:#9A9A93; --border:rgba(0,0,0,.08);
  --accent:#4D7A00; --accent-soft:rgba(77,122,0,.12); --accent-line:rgba(77,122,0,.35);
  --shadow-lg:0 16px 48px rgba(0,0,0,.14);
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
.chs-stage{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--font-sans);color:var(--text);font-size:max(4.5px,2.9vmin);user-select:none}
.chs-stage *{box-sizing:border-box;margin:0;padding:0}
.chs-card{width:29em;border-radius:1em;background:var(--surface);border:1px solid var(--border);padding:1.8em;display:flex;flex-direction:column;gap:1.3em;box-shadow:var(--shadow-lg);touch-action:none}
.chs-card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.chs-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-mono);font-size:1em}
.chs-commit{padding:.35em .65em;border-radius:.4em;background:var(--accent-soft);color:var(--accent);font-weight:700}
.chs-time{color:var(--text-muted)}
.chs-title{font-size:.95em;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.3em}
.chs-val{font-size:2.5em;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.chs-svg{width:100%;height:7.4em;overflow:visible}
.chs-area{fill:var(--accent-soft)}
.chs-line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.chs-scrub{position:relative;height:3.9em;border-radius:.65em;background:var(--bg-sunken);border:1px solid var(--border);cursor:ew-resize;overflow:hidden}
.chs-ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,var(--text-faint) 0 1px,transparent 1px 1em);opacity:.65}
.chs-thumb{position:absolute;top:.3em;bottom:.3em;left:50%;width:.35em;border-radius:.25em;background:var(--accent);box-shadow:0 0 0 1px var(--accent-line),0 0 18px var(--accent-soft);transform:translateX(-50%)}
.chs-cap{position:fixed;left:8px;bottom:7px;font:10px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text);opacity:.3;pointer-events:none}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/cards/17-chrono-scrubber-snapshot.html",
 "title": "Chrono-Scrubber Snapshot",
 "description": "Metric card with a draggable history scrubber that interpolates commit hash, throughput and the sparkline between snapshots.",
 "useWhen": "",
 "avoidWhen": "",
 "agentPrompt": "",
 "editableAreas": [
  "Forever Opus tokens on :root (--bg, --surface*, --text*, --border*, --accent) — one lime accent, no gradients",
  "copy and data values in markup/script"
 ],
 "preserveElements": [
  "demo-v1 preview lifecycle: initialize demoEnabled from window.__foreverPreview and stop attract work on the window forever:interactive event; retain manual feedback, settling, cleanup and explicit sessions",
  "theme hook: ?theme= bootstrap, forever:theme message listener and :root[data-theme=\"light\"] tokens",
  "IIFE wrapper, visibilitychange sleep, prefers-reduced-motion guard, time-based (dt) animation"
 ],
 "knownLimitations": [
  "State remains local to each mounted instance; format/theme remount preserves takeover, not component values.",
  "The card is one focus stop; the scrubber is driven by arrow keys on the card."
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],

 ]

</head>
<body>
<div class="chs-stage" role="group" aria-label="Chrono-scrubber snapshot card">
  <div class="chs-card" id="chs-card" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="65" aria-label="Commit history. Drag the scrubber or use Left and Right arrows.">
    <div class="chs-head"><span class="chs-commit" id="chs-commit">#a8f41c</span><span class="chs-time" id="chs-time">T-04:00h</span></div>
    <div><div class="chs-title">Inference Throughput</div><div class="chs-val" id="chs-val">1,420 tok/s</div></div>
    <svg class="chs-svg" viewBox="0 0 280 90" preserveAspectRatio="none" aria-hidden="true">
      <polygon class="chs-area" id="chs-area" points=""/><polyline class="chs-line" id="chs-line" points=""/>
    </svg>
    <div class="chs-scrub" id="chs-scrub"><div class="chs-ticks"></div><div class="chs-thumb" id="chs-thumb"></div></div>
  </div>
</div>
<div class="chs-cap" aria-hidden="true">Chrono-Scrubber Snapshot</div>
<script>
(function(){
  'use strict';
  var $=function(i){return document.getElementById(i);},
      card=$('chs-card'),scrub=$('chs-scrub'),thumb=$('chs-thumb'),line=$('chs-line'),area=$('chs-area'),
      commitEl=$('chs-commit'),timeEl=$('chs-time'),valEl=$('chs-val');
  addEventListener('message',function(e){
    var d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark'))document.documentElement.setAttribute('data-theme',d.theme);
  });
  var S=[
    {h:'#4f8a09',t:'T-12:00h',v:940,p:[72,68,74,62,58,64,52,49]},
    {h:'#7c8e11',t:'T-08:00h',v:1210,p:[64,52,48,55,42,38,44,34]},
    {h:'#a8f41c',t:'T-04:00h',v:1580,p:[54,44,32,38,26,22,28,16]},
    {h:'#f09d3a',t:'LIVE HEAD',v:1890,p:[42,34,28,20,18,14,19,8]}
  ];
  var demoEnabled=!(window.__foreverPreview&&window.__foreverPreview.demoEnabled===false);
  var isVisible=!document.hidden,target=.65,cur=.65,dragging=false,t=0,rafId=0,last=0;
  function reduced(){return matchMedia('(prefers-reduced-motion: reduce)').matches;}
  function stopDemo(){demoEnabled=false;}
  addEventListener('forever:interactive',stopDemo);

  function setFrom(e){var r=scrub.getBoundingClientRect();target=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));kick();}
  function release(e){
    if(scrub.hasPointerCapture&&scrub.hasPointerCapture(e.pointerId))scrub.releasePointerCapture(e.pointerId);
    dragging=false;
  }
  scrub.addEventListener('pointerdown',function(e){stopDemo();dragging=true;scrub.setPointerCapture(e.pointerId);setFrom(e);});
  scrub.addEventListener('pointermove',function(e){if(dragging)setFrom(e);});
  scrub.addEventListener('pointerup',release);
  scrub.addEventListener('pointercancel',release);
  card.addEventListener('keydown',function(e){
    stopDemo();
    if(e.key==='ArrowLeft')target=Math.max(0,target-.08);
    else if(e.key==='ArrowRight')target=Math.min(1,target+.08);
    else return;
    e.preventDefault();kick();
  });

  function tick(now){
    if(!isVisible){rafId=0;return;}
    var dt=last?Math.min(now-last,50)/16.667:1;last=now;
    var rm=reduced();
    if(demoEnabled&&!rm){t+=.018*dt;target=Math.sin(t)*.45+.5;}
    cur+=(target-cur)*(rm?1:1-Math.pow(1-.15,dt));
    thumb.style.left=(cur*100).toFixed(1)+'%';
    card.setAttribute('aria-valuenow',Math.round(cur*100));
    var sc=cur*(S.length-1),i=Math.min(S.length-2,Math.floor(sc)),f=sc-i,a=S[i],b=S[i+1],pts=[];
    valEl.textContent=Math.round(a.v+(b.v-a.v)*f).toLocaleString()+' tok/s';
    commitEl.textContent=f<.5?a.h:b.h;timeEl.textContent=f<.5?a.t:b.t;
    for(var j=0;j<8;j++)pts.push((j/7*280).toFixed(1)+','+(a.p[j]+(b.p[j]-a.p[j])*f).toFixed(1));
    line.setAttribute('points',pts.join(' '));
    area.setAttribute('points','0,90 '+pts.join(' ')+' 280,90');
    if(Math.abs(target-cur)<.0005&&(rm||!demoEnabled)){rafId=0;return;}
    rafId=requestAnimationFrame(tick);
  }
  function kick(){if(isVisible&&!rafId){last=0;rafId=requestAnimationFrame(tick);}}
  document.addEventListener('visibilitychange',function(){
    isVisible=!document.hidden;
    if(!isVisible&&rafId){cancelAnimationFrame(rafId);rafId=0;}
    kick();
  });
  kick();
})();
</script>
</body>
</html>
