<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Corner Peel Vault</title>
<script>
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
:root{
  --accent:#C7F000; --bg:#0A0A0A; --bg-sunken:#070707; --surface:#111111; --surface-2:#161616; --surface-3:#1C1C1C;
  --text:#EDEDEA; --text-muted:#8A8A85; --text-faint:#5A5A56;
  --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.14);
  --shadow-lg:0 16px 48px rgba(0,0,0,.55);
  --font-sans:system-ui,-apple-system,Arial,sans-serif; --font-mono:ui-monospace,Menlo,monospace;
}
:root[data-theme="light"]{
  --bg:#FAFAF8; --bg-sunken:#F1F1EC; --surface:#F4F4F0; --surface-2:#ECECE6; --surface-3:#FFFFFF;
  --text:#1A1A18; --text-muted:#6B6B66; --text-faint:#9A9A93;
  --border:rgba(0,0,0,.08); --border-strong:rgba(0,0,0,.14); --accent:#4D7A00;
  --shadow-lg:0 16px 48px rgba(0,0,0,.14);
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
.pvl-stage{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--font-sans);color:var(--text);font-size:max(4.5px,2.5vmin);user-select:none}
.pvl-stage *{box-sizing:border-box;margin:0;padding:0}
.pvl-card{position:relative;width:28em;height:34em;border-radius:1em;border:1px solid var(--border);box-shadow:var(--shadow-lg);overflow:hidden;cursor:pointer;touch-action:none;--pvl-p:5.4em}
.pvl-card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.pvl-vault{position:absolute;inset:0;background:var(--surface);padding:2em;display:flex;flex-direction:column;justify-content:space-between}
.pvl-vhead{text-align:right;font-family:var(--font-mono);font-size:.95em;color:var(--text-muted);letter-spacing:.08em}
.pvl-box{margin:auto 0;padding:1.4em;border-radius:.65em;background:var(--bg-sunken);border:1px solid var(--border-strong)}
.pvl-label{font-family:var(--font-mono);font-size:.88em;text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted)}
.pvl-key{font-family:var(--font-mono);font-size:1.12em;font-weight:700;letter-spacing:.05em;color:var(--accent);word-break:break-all;margin:.6em 0 .9em}
.pvl-copy{min-height:3.4em;padding:.8em 1.2em;border-radius:.4em;border:1px solid var(--border-strong);background:var(--surface-3);color:var(--text);font:600 1.04em var(--font-sans);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}
.pvl-copy:disabled{cursor:wait;opacity:.65}
.pvl-status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.pvl-key{user-select:text}
.pvl-copy:hover{background:var(--surface-2);border-color:var(--text-faint)}
.pvl-copy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pvl-note{font-size:.95em;color:var(--text-faint)}
.pvl-cover{position:absolute;inset:0;background:var(--surface-2);padding:2em;display:flex;flex-direction:column;justify-content:space-between;clip-path:polygon(0 0,calc(100% - var(--pvl-p)) 0,100% var(--pvl-p),100% 100%,0 100%);pointer-events:none}
.pvl-flap{position:absolute;top:0;right:0;width:var(--pvl-p);height:var(--pvl-p);background:var(--surface-3);clip-path:polygon(0 0,100% 100%,0 100%);pointer-events:none}
.pvl-seal{font-family:var(--font-mono);font-size:.88em;font-weight:700;letter-spacing:.1em;color:var(--text-muted)}
.pvl-title{font-size:1.65em;font-weight:700;margin-bottom:.3em}
.pvl-sub{font-size:1.04em;color:var(--text-muted);line-height:1.45}
.pvl-cap{position:fixed;left:8px;bottom:7px;font:10px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text);opacity:.3;pointer-events:none}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/cards/18-corner-peel-vault.html",
 "title": "Corner Peel Vault",
 "description": "Sealed credential card: move in from the top-right corner or click to peel the foil and reveal a copyable key.",
 "useWhen": "",
 "avoidWhen": "",
 "agentPrompt": "",
 "editableAreas": [
  "Forever Opus tokens on :root (--bg, --surface*, --text*, --border*, --accent) — one lime accent, no gradients",
  "copy and data values in markup/script"
 ],
 "preserveElements": [
  "demo-v1 preview lifecycle: initialize demoEnabled from window.__foreverPreview and stop attract work on the window forever:interactive event; retain manual feedback, settling, cleanup and explicit sessions",
  "theme hook: ?theme= bootstrap, forever:theme message listener and :root[data-theme=\"light\"] tokens",
  "IIFE wrapper, visibilitychange sleep, prefers-reduced-motion guard, time-based (dt) animation"
 ],
 "knownLimitations": [
  "State remains local to each mounted instance; format/theme remount preserves takeover, not component values.",
  "Hover peel is mouse-only; touch taps pin it open.",
  "Clipboard writes can fail inside sandboxed previews.",
  "The copy button is reachable while the foil is closed."
 ],
 "tier": "curated",
 "labels": [

 ],

 ]
}

</head>
<body>
<div class="pvl-stage" role="group" aria-label="Corner peel vault card">
  <div class="pvl-card" id="pvl-card" tabindex="0" role="group" aria-label="Sealed credential. Move the pointer from the top-right corner, click, or press Space to peel the foil.">
    <div class="pvl-vault">
      <div class="pvl-vhead">UNLOCKED // LEVEL 5</div>
      <div class="pvl-box">
        <div class="pvl-label">Production Bearer Key</div>
        <div class="pvl-key" id="pvl-key">fc_live_98a7xK4mP2vQ0zR</div>
        <button class="pvl-copy" id="pvl-copy" type="button">Copy Secret Key</button>
        <span class="pvl-status" id="pvl-status" role="status" aria-live="polite" aria-atomic="true"></span>
      </div>
      <div class="pvl-note">Click outside button to reseal foil layer.</div>
    </div>
    <div class="pvl-cover">
      <div class="pvl-seal">SEALED CREDENTIAL</div>
      <div><div class="pvl-title">Peel Corner to Reveal</div><p class="pvl-sub">Move pointer from top-right toward bottom-left or click anywhere to peel back the tamper-evident foil.</p></div>
    </div>
    <div class="pvl-flap"></div>
  </div>
</div>
<div class="pvl-cap" aria-hidden="true">Corner Peel Vault</div>
<script>
(function(){
  'use strict';
  var card=document.getElementById('pvl-card'),copyBtn=document.getElementById('pvl-copy'),keyEl=document.getElementById('pvl-key');
  addEventListener('message',function(e){
    var d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark'))document.documentElement.setAttribute('data-theme',d.theme);
  });
  /* peel values are in "350px card" units, scaled to the live card width on write */
  var demoEnabled=!(window.__foreverPreview&&window.__foreverPreview.demoEnabled===false);
  var isVisible=!document.hidden,target=68,cur=68,pinned=false,t=0,rafId=0,last=0;
  function reduced(){return matchMedia('(prefers-reduced-motion: reduce)').matches;}
  function stopDemo(){demoEnabled=false;}
  addEventListener('forever:interactive',stopDemo);
  function toggle(){
    pinned=!pinned;target=pinned?780:56;
    kick();
  }
  var copyStatus=document.getElementById('pvl-status'),copyRun=0,copyPoll=0,copyResult=null;
  function resetCopy(){
    copyRun++;clearInterval(copyPoll);copyPoll=0;copyResult=null;
    copyBtn.disabled=false;copyBtn.removeAttribute('aria-busy');
    copyBtn.textContent='Copy Secret Key';copyStatus.textContent='';
  }
  copyBtn.addEventListener('click',function(e){
    e.stopPropagation();stopDemo();
    if(copyBtn.disabled||document.hidden)return;
    resetCopy();var run=copyRun;
    copyBtn.disabled=true;copyBtn.setAttribute('aria-busy','true');
    copyBtn.textContent='Copying…';copyStatus.textContent='Copying key.';
    /* Promise callbacks store data only. Scoped teardown cancels this poll. */
    copyPoll=setInterval(function(){
      if(!copyBtn.isConnected){copyRun++;clearInterval(copyPoll);copyPoll=0;copyResult=null;return;}
      if(document.hidden){resetCopy();return;}
      if(copyResult===null)return;
      clearInterval(copyPoll);copyPoll=0;copyBtn.disabled=false;copyBtn.removeAttribute('aria-busy');
      copyBtn.textContent=copyResult?'Copied ✓':'Copy failed · Retry';
      copyStatus.textContent=copyResult?'Key copied.':'Copy failed. Select the key and copy manually, or retry.';
    },100);
    try{
      if(!navigator.clipboard||!navigator.clipboard.writeText)throw new Error('Clipboard unavailable');
      Promise.resolve(navigator.clipboard.writeText(keyEl.textContent)).then(function(){if(run===copyRun)copyResult=true;},function(){if(run===copyRun)copyResult=false;});
    }catch(err){copyResult=false;}
  });
  copyBtn.addEventListener('keydown',function(e){e.stopPropagation();});
  card.addEventListener('pointermove',function(e){
    stopDemo();
    if(pinned)return;
    var r=card.getBoundingClientRect();
    target=Math.max(48,Math.min(780,Math.hypot(r.right-e.clientX,e.clientY-r.top)/Math.hypot(r.width,r.height)*780));
    kick();
  });
  card.addEventListener('pointerleave',function(){if(!pinned){target=56;kick();}});
  card.addEventListener('click',function(){stopDemo();toggle();});
  card.addEventListener('keydown',function(e){
    stopDemo();
    if(e.key===' '||e.key==='Enter'){toggle();e.preventDefault();}
  });
  function tick(now){
    if(!isVisible){rafId=0;return;}
    var dt=last?Math.min(now-last,50)/16.667:1;last=now;
    var rm=reduced();
    if(demoEnabled&&!rm){t+=dt/60;target=t%8>1.2&&t%8<5.6?780:56;}
    cur+=(target-cur)*(rm?1:1-Math.pow(1-.14,dt));
    card.style.setProperty('--pvl-p',(cur*card.clientWidth/350).toFixed(1)+'px');
    if(Math.abs(target-cur)<.05&&(rm||!demoEnabled)){rafId=0;return;}
    rafId=requestAnimationFrame(tick);
  }
  function kick(){if(isVisible&&!rafId){last=0;rafId=requestAnimationFrame(tick);}}
  document.addEventListener('visibilitychange',function(){
    isVisible=!document.hidden;
    if(!isVisible)resetCopy();
    if(!isVisible&&rafId){cancelAnimationFrame(rafId);rafId=0;}
    kick();
  });
  addEventListener('pagehide',resetCopy);
  if(window.ResizeObserver)new ResizeObserver(kick).observe(card);
  kick();
})();
</script>
</body>
</html>
