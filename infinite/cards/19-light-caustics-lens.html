<style>
:root{
  --accent:#C7F000; --accent-line:rgba(199,240,0,.32); --bg:#0A0A0A; --surface:#111111;
  --text:#EDEDEA; --text-muted:#8A8A85; --border-strong:rgba(255,255,255,.14);
  --shadow-lg:0 16px 48px rgba(0,0,0,.55);
  --font-sans:system-ui,-apple-system,Arial,sans-serif; --font-mono:ui-monospace,Menlo,monospace;
}
:root[data-theme="light"]{
  --bg:#FAFAF8; --surface:#F4F4F0; --text:#1A1A18; --text-muted:#6B6B66;
  --border-strong:rgba(0,0,0,.14); --accent:#4D7A00; --accent-line:rgba(77,122,0,.35);
  --shadow-lg:0 16px 48px rgba(0,0,0,.14);
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
.cpr-stage{position:fixed;inset:0;display:grid;place-items:center;perspective:900px;font-family:var(--font-sans);color:var(--text);font-size:max(4.5px,2.5vmin);user-select:none}
.cpr-stage *{box-sizing:border-box;margin:0;padding:0}
.cpr-wrap{position:relative;width:28em;height:34em}
.cpr-canvas{position:absolute;inset:-1.6em;width:calc(100% + 3.2em);height:calc(100% + 3.2em);border-radius:1em;opacity:.85}
.cpr-card{position:relative;width:100%;height:100%;border-radius:1em;background:color-mix(in srgb,var(--surface) 62%,transparent);border:1px solid var(--border-strong);padding:2em;display:flex;flex-direction:column;justify-content:space-between;transform:rotateX(var(--cpr-rx,0deg)) rotateY(var(--cpr-ry,0deg));box-shadow:var(--cpr-sx,0px) var(--cpr-sy,0px) 0 var(--accent-line),calc(var(--cpr-sx,0px)*-1) calc(var(--cpr-sy,0px)*-1) 0 var(--border-strong),var(--shadow-lg);touch-action:none}
.cpr-card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.cpr-row{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:.95em}
.cpr-disp{color:var(--accent)}
.cpr-title{font-size:1.75em;font-weight:800;letter-spacing:-.02em;margin-bottom:.4em}
.cpr-sub{font-size:1.04em;line-height:1.45;color:var(--text-muted)}
.cpr-cap{position:fixed;left:8px;bottom:7px;font:10px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text);opacity:.3;pointer-events:none}
</style>

<body>
<div class="cpr-stage">
  <div class="cpr-wrap" role="group" aria-label="Caustic prism card. Sweep the pointer or use arrow keys to tilt the lens.">
    <canvas class="cpr-canvas" id="cpr-canvas" aria-hidden="true"></canvas>
    <div class="cpr-card" id="cpr-card" tabindex="0" role="group" aria-label="Prism lens. Arrow keys tilt it.">
      <div class="cpr-row"><span>IOR // 2.417</span><span class="cpr-disp" id="cpr-disp">&Delta;&lambda;: 4.2nm</span></div>
      <div><div class="cpr-title">Light caustics</div><p class="cpr-sub">Sweep the pointer across the lens to bend the light.</p></div>
    </div>
  </div>
</div>
<div class="cpr-cap" aria-hidden="true">Light Caustics Lens</div>
<script>
(function(){
  'use strict';
  var card=document.getElementById('cpr-card'),canvas=document.getElementById('cpr-canvas'),dispEl=document.getElementById('cpr-disp'),
      ctx=canvas.getContext('2d'),root=document.documentElement,C={};
  function readTokens(){
    var cs=getComputedStyle(root);
    ['accent','text'].forEach(function(k){C[k]=cs.getPropertyValue('--'+k).trim();});
  }
  readTokens();
  addEventListener('message',function(e){
    var d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){root.setAttribute('data-theme',d.theme);readTokens();kick();}
  });
  var demoEnabled=!(window.__foreverPreview&&window.__foreverPreview.demoEnabled===false);
  var isVisible=!document.hidden,tx=0,ty=0,cx=0,cy=0,t=0,rafId=0,last=0;
  function reduced(){return matchMedia('(prefers-reduced-motion: reduce)').matches;}
  function stopDemo(){demoEnabled=false;}
  addEventListener('forever:interactive',stopDemo);
  canvas.width=200;canvas.height=200;   /* low-res on purpose: it is soft, and 200px keeps the fill cost flat */

  card.addEventListener('pointermove',function(e){
    stopDemo();
    var r=card.getBoundingClientRect();
    tx=(e.clientX-(r.left+r.width/2))/(r.width/2);ty=(e.clientY-(r.top+r.height/2))/(r.height/2);kick();
  });
  card.addEventListener('pointerleave',function(){tx=0;ty=0;kick();});
  card.addEventListener('keydown',function(e){
    stopDemo();
    if(e.key==='ArrowLeft')tx=-.7;else if(e.key==='ArrowRight')tx=.7;
    else if(e.key==='ArrowUp')ty=-.7;else if(e.key==='ArrowDown')ty=.7;else return;
    e.preventDefault();kick();
  });

  function tick(now){
    if(!isVisible){rafId=0;return;}
    var dt=last?Math.min(now-last,50)/16.667:1;last=now;
    var rm=reduced();
    if(!rm)t+=.025*dt;
    if(demoEnabled&&!rm){tx=Math.cos(t*1.1)*.85;ty=Math.sin(t*.8)*.85;}
    var k=rm?1:1-Math.pow(1-.14,dt);
    cx+=(tx-cx)*k;cy+=(ty-cy)*k;
    var st=card.style;
    st.setProperty('--cpr-ry',(cx*14).toFixed(2)+'deg');st.setProperty('--cpr-rx',(-cy*14).toFixed(2)+'deg');
    st.setProperty('--cpr-sx',(cx*7).toFixed(1)+'px');st.setProperty('--cpr-sy',(cy*7).toFixed(1)+'px');
    dispEl.textContent='Δλ: '+(2.4+Math.hypot(cx,cy)*6.5).toFixed(1)+'nm';
    ctx.clearRect(0,0,200,200);
    for(var i=0;i<3;i++){
      var x=100+Math.cos(t+i*2.1)*34+cx*18,y=100+Math.sin(t*1.3+i*2.1)*34+cy*18;
      /* flat concentric discs at low alpha stack into a soft falloff (no gradient, no blur filter: cheap per frame; blobs fade out inside the canvas so no hard edge); lime is the one bright caustic */
      ctx.fillStyle=i===0?C.accent:C.text;
      for(var j=0;j<18;j++){ctx.globalAlpha=i===0?.035:.02;ctx.beginPath();ctx.arc(x,y,46-j*2.5,0,Math.PI*2);ctx.fill();}
    }
    ctx.globalAlpha=1;
    if(Math.abs(tx-cx)<.001&&Math.abs(ty-cy)<.001&&(rm||!demoEnabled)){rafId=0;return;}
    rafId=requestAnimationFrame(tick);
  }
  function kick(){if(isVisible&&!rafId){last=0;rafId=requestAnimationFrame(tick);}}
  document.addEventListener('visibilitychange',function(){
    isVisible=!document.hidden;
    if(!isVisible&&rafId){cancelAnimationFrame(rafId);rafId=0;}
    kick();
  });
  kick();
})();
</script>
</body>
</html>
