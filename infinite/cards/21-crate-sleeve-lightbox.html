<style>
:root{--b:#131316;--i:#F1F1F4;--o:#000;--m:#9A9CA6;--l:#2B2C31;--c:#7B95C4;--vn:#000;--ve:#3A3B42;--w:#F2F0EA;--sp:cubic-bezier(.3,1.45,.5,1);color-scheme:dark}
:root[data-theme="light"]{--b:#EFF0F3;--i:#000;--o:#EFF0F3;--m:#5F616B;--l:#CDCFD8;--c:#2B4473;--ve:transparent;color-scheme:light}
html,body{margin:0;height:100%;overflow:hidden;background:var(--b);color:var(--i);font:14px/1.3 system-ui,sans-serif}
.cr06-st,.cr06-st *{box-sizing:border-box}
.cr06-st{position:relative;width:100%;height:100%;display:grid;place-items:center;padding:clamp(8px,3vmin,20px);background:var(--b);color:var(--i)}
.cr06-st :focus-visible{outline:2px solid var(--c);outline-offset:2px}
.cr06-gl{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(6px,2.5vmin,12px);list-style:none;margin:0;padding:0;width:min(100%,300px)}
.cr06-b{position:relative;display:block;width:100%;padding:0;border:0;background:none;border-radius:2px;cursor:pointer;touch-action:manipulation}
.cr06-disc{display:block;border-radius:50%;background:var(--vn);border:1px solid var(--ve);position:absolute;inset:5%;transition:translate .4s var(--sp)}
.cr06-disc::after{content:"";position:absolute;inset:33%;border-radius:50%;background:#D5412B}
.cr06-art{position:relative;display:block;width:100%;aspect-ratio:1;border-radius:2px;transition:translate .4s var(--sp)}
.cr06-b:hover,.cr06-b:focus-visible{z-index:2}
@media (hover:hover){.cr06-b:hover .cr06-disc{translate:34%}.cr06-b:hover .cr06-art{translate:-5%}}
.cr06-b:focus-visible .cr06-disc{translate:34%}.cr06-b:focus-visible .cr06-art{translate:-5%}.cr06-b.cr06-aw{opacity:0}
.cr06-lb{position:absolute;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;background:none;color:var(--w);overflow:hidden;z-index:5;display:none;--pk:22%}.cr06-lb[open]{display:block}
.cr06-bg{position:absolute;inset:0;background:rgba(24,24,30,.95)}
.cr06-lg{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:clamp(6px,2.5vmin,14px);padding:clamp(10px,4vmin,24px);touch-action:none}
.cr06-fig{position:relative;width:min(54vw,44vh,340px);aspect-ratio:1}
.cr06-fig .cr06-disc{inset:4%;opacity:0;border-color:#4A4B54;transition:opacity .1s,translate .2s ease}
.cr06-lb.cr06-in .cr06-fig .cr06-disc{opacity:1;translate:var(--pk);transition:opacity .1s .28s,translate .55s var(--sp) .28s}
.cr06-la{position:relative;width:100%;height:100%;cursor:grab}.cr06-la .cr06-art{height:100%}
.cr06-cpb,.cr06-ib,.cr06-dots{opacity:0;transition:opacity .25s}.cr06-lb.cr06-in .cr06-cpb,.cr06-lb.cr06-in .cr06-ib,.cr06-lb.cr06-in .cr06-dots{opacity:1}
.cr06-cpb{margin:0;text-align:center;font-size:clamp(10px,3vmin,13px);color:rgba(242,240,234,.75)}.cr06-cpb b{display:block;font-family:Futura,Avenir,sans-serif;font-size:clamp(13px,4.2vmin,19px);color:var(--w)}
.cr06-ib{position:absolute;display:inline-grid;place-items:center;width:clamp(26px,9vmin,38px);height:clamp(26px,9vmin,38px);border-radius:50%;border:1.5px solid rgba(242,240,234,.4);background:none;padding:0;color:var(--w);cursor:pointer;transition:border-color .2s,scale .15s,opacity .25s;touch-action:manipulation}
.cr06-ib:hover{border-color:var(--w)}.cr06-ib:active{scale:.9}.cr06-lb :focus-visible{outline-color:var(--w)}
.cr06-ic{display:block;width:clamp(13px,4vmin,18px);height:clamp(13px,4vmin,18px);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cr06-x{top:clamp(8px,2.5vmin,14px);right:clamp(8px,2.5vmin,14px)}.cr06-p,.cr06-n{bottom:clamp(8px,2.5vmin,14px)}.cr06-p{left:clamp(8px,3vmin,16px)}.cr06-n{right:clamp(8px,3vmin,16px)}
@media (min-width:700px){.cr06-p,.cr06-n{bottom:auto;top:calc(50% - 19px)}}
.cr06-dots{display:flex;justify-content:center;gap:5px;pointer-events:none}.cr06-dot{width:5px;height:5px;border-radius:3px;background:rgba(242,240,234,.35);transition:width .3s var(--sp),background .2s}.cr06-dot.cr06-on{width:15px;background:var(--w)}
.cr06-cap{position:absolute;left:10px;bottom:8px;font:500 11px/1 ui-monospace,monospace;color:var(--i);opacity:.45;letter-spacing:.04em;text-transform:uppercase;pointer-events:none}
@media (prefers-reduced-motion:reduce){.cr06-st *{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>

<body>
<div class="cr06-st" id="cr06-st"></div>
<div class="cr06-cap" aria-hidden="true">Sleeve Lightbox</div>
<script>(()=>{
  const s=document.getElementById('cr06-st'),RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SPR='cubic-bezier(.3,1.45,.5,1)',NO={finished:Promise.resolve(),cancel(){}},anim=(el,kf,o)=>RM()?NO:el.animate(kf,Object.assign({duration:300,easing:'cubic-bezier(.2,.8,.2,1)'},o));
  const spring=o=>{if(RM()){o.step(o.to);return()=>{}}let x=o.from,v=0,last=performance.now(),id=0;const t=n=>{const dt=Math.min(.032,(n-last)/1000);last=n;for(let i=0;i<4;i++){v+=(-320*(x-o.to)-24*v)*dt/4;x+=v*dt/4}if(Math.abs(x-o.to)<.3&&Math.abs(v)<6){o.step(o.to);return}o.step(x);id=requestAnimationFrame(t)};id=requestAnimationFrame(t);return()=>cancelAnimationFrame(id)};
  const A=[['F2F0EA','2B4473',3.8,6.2,3.4],['0A0A0A','E2B01A',5,5,2.8],['E2B01A','D5412B',5,5.8,3],['2B4473','F2F0EA',3.2,3.5,1.8],['F2F0EA','D5412B',0,10,7],['5E9470','F2F0EA',7,7,2.4]].map(([b,c,x,y,r])=>`<rect width="10" height="10" fill="#${b}"/><circle cx="${x}" cy="${y}" r="${r}" fill="#${c}"/>`);
  const R=[['Low Tide','Marlo Finch'],['Night Bus','Odessa Quay'],['Paper Sun','The Halves'],['Slow Hands','Juno Abara'],['Kiln','Petra Voss'],['Half Light','Sable & Rue']];
  const art=i=>`<svg class="cr06-art" viewBox="0 0 10 10" aria-hidden="true">${A[i%6]}</svg>`;
  const I=d=>`<svg class="cr06-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;
  s.innerHTML=`<ul class="cr06-gl">${R.map(([t,a],i)=>`<li><button type="button" class="cr06-b" aria-haspopup="dialog" aria-label="View ${t} by ${a}"><i class="cr06-disc"></i>${art(i)}</button></li>`).join('')}</ul><dialog class="cr06-lb" aria-label="Sleeve viewer"><div class="cr06-bg"></div><div class="cr06-lg"><div class="cr06-fig"><i class="cr06-disc"></i><div class="cr06-la"></div></div><p class="cr06-cpb" aria-live="polite"></p><div class="cr06-dots" aria-hidden="true">${'<i class="cr06-dot"></i>'.repeat(6)}</div></div><button type="button" class="cr06-ib cr06-x" aria-label="Close">${I('M6 6l12 12M18 6L6 18')}</button><button type="button" class="cr06-ib cr06-p" aria-label="Previous">${I('M15 6l-6 6 6 6')}</button><button type="button" class="cr06-ib cr06-n" aria-label="Next">${I('M9 6l6 6-6 6')}</button></dialog>`;
  const ul=s.querySelector('.cr06-gl'),d=s.querySelector('.cr06-lb'),thumbs=[...s.querySelectorAll('.cr06-b')],a=d.querySelector('.cr06-la'),bg=d.querySelector('.cr06-bg'),cap=d.querySelector('.cr06-cpb'),dots=[...d.querySelectorAll('.cr06-dot')],lg=d.querySelector('.cr06-lg');
  let cur=0,busy=false,sw=null,alive=true;
  const show=i=>{cur=(i+6)%6;a.innerHTML=art(cur);cap.innerHTML=`<b>${R[cur][0]}</b>${R[cur][1]}`;dots.forEach((x,j)=>x.classList.toggle('cr06-on',j===cur));thumbs.forEach((t,j)=>t.classList.toggle('cr06-aw',j===cur))};
  const flip=t=>{const f=t.getBoundingClientRect(),r=a.getBoundingClientRect();return r.width?`translate(${f.left+f.width/2-r.left-r.width/2}px,${f.top+f.height/2-r.top-r.height/2}px) scale(${f.width/r.width})`:'scale(.4)'};
  const open=(i,foc)=>{if(busy||d.open)return;show(i);d.show();ul.inert=true;d.classList.add('cr06-in');anim(a,[{transform:flip(thumbs[cur])},{transform:'none'}],{duration:440,easing:SPR});anim(bg,[{opacity:0},{opacity:1}],{duration:280});if(foc)d.querySelector('.cr06-x').focus({preventScroll:true})};
  const close=foc=>{if(busy||!d.open)return;busy=true;const t=thumbs[cur];d.classList.remove('cr06-in');a.style.transform='';
    const an=anim(a,[{transform:'none'},{transform:flip(t)}],{duration:280,fill:'forwards'});anim(bg,[{opacity:1},{opacity:0}],{duration:280,fill:'forwards'});
    an.finished.catch(()=>{}).then(()=>{if(!alive)return;d.close();ul.inert=false;[a,bg].forEach(x=>x.getAnimations().forEach(y=>y.cancel()));t.classList.remove('cr06-aw');if(foc)t.focus({preventScroll:true});busy=false})};
  const nav=dir=>{if(busy||!d.open)return;anim(a,[{transform:a.style.transform||'none',opacity:1},{transform:`translateX(${-dir*90}px) rotate(${-dir*5}deg)`,opacity:0}],{duration:140}).finished.catch(()=>{}).then(()=>{if(!alive||!d.open)return;a.style.transform='';show(cur+dir);anim(a,[{transform:`translateX(${dir*60}px) rotate(${dir*4}deg)`,opacity:0},{transform:'none',opacity:1}],{duration:340,easing:SPR})})};
  thumbs.forEach((t,i)=>t.addEventListener('click',()=>open(i,true)));
  d.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')nav(-1);else if(e.key==='ArrowRight')nav(1);else if(e.key==='Escape'){e.preventDefault();close(true)}});
  d.querySelector('.cr06-x').onclick=()=>close(true);d.querySelector('.cr06-p').onclick=()=>nav(-1);d.querySelector('.cr06-n').onclick=()=>nav(1);
  lg.addEventListener('pointerdown',e=>{if(e.button||busy)return;sw={x:e.clientX,dx:0,m:false,on:!!e.target.closest('.cr06-la')};lg.setPointerCapture(e.pointerId)});
  lg.addEventListener('pointermove',e=>{if(!sw)return;sw.dx=e.clientX-sw.x;if(Math.abs(sw.dx)>5)sw.m=true;if(sw.m)a.style.transform=`translateX(${sw.dx}px) rotate(${sw.dx*.025}deg)`});
  const end=()=>{if(!sw)return;const {dx,m,on}=sw;sw=null;if(!m){on||close(true);return}if(Math.abs(dx)>56)nav(dx<0?1:-1);else spring({from:dx,to:0,step:x=>a.style.transform=x?`translateX(${x}px) rotate(${x*.025}deg)`:''})};
  lg.addEventListener('pointerup',end);lg.addEventListener('pointercancel',end);

  let demo=!RM()&&!(window.__foreverPreview&&window.__foreverPreview.demoEnabled===false),tm=0,kk=0,sp=0;
  const pl=()=>{if(!demo||RM()||document.hidden)return;const p=sp++%4;p===0?open(0,0):p<3?nav(1):close(0)};
  const stp=()=>{clearInterval(tm);clearTimeout(kk);tm=kk=0},go=()=>{if(!tm&&demo&&!RM())tm=setInterval(pl,1150)},tk=()=>{demo=0;stp()};
  window.addEventListener('forever:interactive',tk);s.addEventListener('pointerdown',tk,true);s.addEventListener('keydown',tk,true);
  document.addEventListener('visibilitychange',()=>document.hidden?stp():demo&&go());
  window.addEventListener('message',e=>{if(e.data&&e.data.type==='forever:theme'&&(e.data.theme==='light'||e.data.theme==='dark'))document.documentElement.setAttribute('data-theme',e.data.theme)});
  if(demo){kk=setTimeout(pl,600);go()}
})();</script>
