.pt-card:focus-visible .pt-fr,.pt-card:focus-visible .pt-bk{outline:2px solid var(--pt-ink);outline-offset:5px}
.pt-fr,.pt-bk{position:absolute;inset:0;border-radius:3px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}

.pt-gl{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}

.pt-pic{display:block;width:100%;height:100%;border-radius:1px}
.pt-l1,.pt-l2{will-change:transform}
.pt-bk{background:var(--pt-back);transform:rotateY(180deg)}
.pt-bs{display:block;width:100%;height:100%}

<script>
(function(){
"use strict";
var root=document.documentElement,st=document.getElementById("pt-st"),card=document.getElementById("pt-card");
var gl=document.getElementById("pt-gl"),sh=document.getElementById("pt-sh"),l1=document.getElementById("pt-l1"),l2=document.getElementById("pt-l2");
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
var demo=!reduce&&(!window.__foreverPreview||window.__foreverPreview.demoEnabled!==false);
var MAX=14,raf=0,t0=0,lastFlip=0;
var S={nx:0,ny:0,vx:0,vy:0,lift:0,vl:0,f:0,vf:0};
var G={nx:0,ny:0,lift:0,flip:false};
var down=null,moved=0;

window.addEventListener("message",function(e){
if(e.data&&e.data.type==="forever:theme"&&(e.data.theme==="light"||e.data.theme==="dark"))root.setAttribute("data-theme",e.data.theme);
});

function paint(){
var ry=S.nx*MAX+S.f,rx=-S.ny*MAX;
card.style.transform="translateZ("+(S.lift*14).toFixed(1)+"px) rotateX("+rx.toFixed(2)+"deg) rotateY("+ry.toFixed(2)+"deg)";
sh.style.transform="translate("+(-S.nx*9).toFixed(1)+"px,"+(4-S.ny*6+S.lift*6).toFixed(1)+"px) scale("+(1-Math.abs(Math.sin(S.f*Math.PI/180))*0.25).toFixed(3)+",1)";
sh.style.opacity=(0.65+S.lift*0.35).toFixed(2);
l1.style.transform="translate("+(-S.nx*2).toFixed(2)+"px,"+(-S.ny*2).toFixed(2)+"px)";
l2.style.transform="translate("+(S.nx*3).toFixed(2)+"px,"+(S.ny*3).toFixed(2)+"px)";
gl.style.opacity=Math.max(0,(S.nx-S.ny)*0.07).toFixed(3);
}
function spring(k,g,v,kk,dd){S[v]=(S[v]+(g-S[k])*kk)*dd;S[k]+=S[v];return Math.abs(S[v])+Math.abs(g-S[k]);}

function frame(ts){
raf=0;
if(document.hidden)return;
if(demo){
if(!t0)t0=ts-1200;
var t=(ts-t0)/1000;
G.nx=Math.sin(t*0.9)*0.75;G.ny=Math.sin(t*0.6+1)*0.6;G.lift=0.6;
if(!lastFlip)lastFlip=ts;
if(ts-lastFlip>(G.flip?2200:4600)){lastFlip=ts;setFlip(!G.flip);}
}
var m=spring("nx",G.nx,"vx",0.12,0.74)+spring("ny",G.ny,"vy",0.12,0.74)+spring("lift",G.lift,"vl",0.1,0.75);
m+=spring("f",G.flip?180:0,"vf",0.07,0.78)/40;
paint();
if((demo||m>0.002)&&!raf)raf=requestAnimationFrame(frame);
}
function wake(){
if(reduce){S.f=G.flip?180:0;S.nx=S.ny=S.lift=0;paint();return;}
if(!raf&&!document.hidden)raf=requestAnimationFrame(frame);
}
function setFlip(v){G.flip=v;card.setAttribute("aria-pressed",v?"true":"false");wake();}
function takeover(){if(!demo)return;demo=false;G.nx=G.ny=G.lift=0;wake();}
window.addEventListener("forever:interactive",takeover);

function aim(e){
var r=card.getBoundingClientRect();
if(!r.width)return;
G.nx=Math.max(-1,Math.min(1,((e.clientX-r.left)/r.width-0.5)*2));
G.ny=Math.max(-1,Math.min(1,((e.clientY-r.top)/r.height-0.5)*2));
if(G.flip)G.nx=-G.nx;
}
card.addEventListener("pointerdown",function(e){
takeover();moved=0;down={x:e.clientX,y:e.clientY,moved:0};
try{card.setPointerCapture(e.pointerId);}catch(_){}
aim(e);G.lift=1;wake();
});
card.addEventListener("pointermove",function(e){
if(e.pointerType==="touch"&&!down)return;
takeover();
if(down)down.moved=Math.max(down.moved,Math.hypot(e.clientX-down.x,e.clientY-down.y));
aim(e);G.lift=down?1:0.45;wake();
});
function release(e){
if(e.type!=="pointerup"||e.pointerType!=="mouse"){G.nx=G.ny=0;G.lift=0;}
else G.lift=0.45;
wake();
if(down)moved=down.moved;
down=null;
}
card.addEventListener("pointerup",release);card.addEventListener("pointercancel",release);
card.addEventListener("pointerleave",function(){if(!down){G.nx=G.ny=0;G.lift=0;wake();}});
card.addEventListener("click",function(e){
takeover();
if(e.detail&&moved>10){moved=0;return;}
setFlip(!G.flip);
});
card.addEventListener("keydown",function(e){
var k={ArrowLeft:[-0.7,0],ArrowRight:[0.7,0],ArrowUp:[0,-0.7],ArrowDown:[0,0.7]}[e.key];
if(!k)return;
e.preventDefault();takeover();G.nx=k[0];G.ny=k[1];G.lift=0.5;wake();
clearTimeout(card._t);card._t=setTimeout(function(){G.nx=G.ny=G.lift=0;wake();},700);
});
card.addEventListener("blur",function(){G.nx=G.ny=G.lift=0;wake();});
document.addEventListener("visibilitychange",function(){if(!document.hidden)wake();});

if(demo){S.nx=0.4;S.ny=-0.3;S.lift=0.6;}
paint();wake();
})();
</script>
</body>
