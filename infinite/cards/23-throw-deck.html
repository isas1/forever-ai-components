<script>
(function(){
"use strict";
var D=document,root=D.documentElement,$=function(i){return D.getElementById(i);},pile=$("td-p"),btn=$("td-b"),live=$("td-live"),gh=$("td-g"),A=Math.abs,now=function(){return performance.now();};
var cs=[].slice.call(pile.querySelectorAll(".td-c")),N=cs.length,K=["x","y","r","s"];
var NAMES=["a cup of tea","a potted plant","a kite","a sleeping cat"];
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
var demo=!reduce&&(!window.__foreverPreview||window.__foreverPreview.demoEnabled!==false);
var SL=[[0,0,-1.5],[4,5,2.6],[-5,9,-3.4],[6,13,3.8]];
var order=cs.map(function(_,i){return i;});
var S=cs.map(function(){return{x:0,y:0,r:0,s:1,v:{x:0,y:0,r:0,s:0},t:{x:0,y:0,r:0,s:1}};});
var raf=0,drag=null,fly=null,dd=false,W=200,t0=0,cyc=-1;
window.addEventListener("message",function(e){
var t=e.data&&e.data.type==="forever:theme"&&e.data.theme;if(t==="light"||t==="dark")root.setAttribute("data-theme",t);
});
function put(st,x,y,r){st.x=st.t.x=x;st.y=st.t.y=y;st.r=st.t.r=r;st.v={x:0,y:0,r:0,s:0};}
function targets(){
var k=W/250;
order.forEach(function(ci,n){
var t=S[ci].t;cs[ci].style.zIndex=N-n;
if(!n&&(drag||dd)||fly&&fly.c===ci)return;
t.x=SL[n][0]*k;t.y=SL[n][1]*k;t.r=SL[n][2];t.s=1-n*0.025;
});
if(drag||dd||fly){var p=Math.min(1,A(S[order[0]].x)/(W*0.4)),q=1-p,t=S[order[1]].t;t.x=SL[1][0]*k*q;t.y=SL[1][1]*k*q-p*2;t.r=SL[1][2]*q;t.s=1-0.025*q;}
}
function snap(){S.forEach(function(st){K.forEach(function(a){st[a]=st.t[a];st.v[a]=0;});});}
function paint(){
cs.forEach(function(c,i){var st=S[i];
c.style.transform="translate("+st.x.toFixed(1)+"px,"+st.y.toFixed(1)+"px) rotate("+st.r.toFixed(2)+"deg) scale("+st.s.toFixed(3)+")";
c.classList.toggle("td-air",i===order[0]&&(A(st.x)>6||!!fly)||!!fly&&fly.c===i);
});
}
function announce(){
var c=order[0];btn.setAttribute("aria-label","Picture card: "+NAMES[c]+". Arrow keys throw it.");
if(!demo)live.textContent="Card "+(c+1)+" of "+N+": "+NAMES[c];
}
function tuck(){order.push(order.shift());fly=null;}
function toss(dir){
if(fly)tuck();
if(reduce){tuck();targets();snap();paint();announce();return;}
var c=order[0],t=S[c].t;fly={c:c,t:now()};
t.x=dir*W*1.25;t.y=S[c].y-W*0.08;t.r=dir*22;t.s=1.02;wake();
}
function back(){
if(fly)tuck();
var c=order.pop();order.unshift(c);
if(!reduce)put(S[c],-W*1.2,-W*0.06,-20);
targets();if(reduce)snap();paint();announce();wake();
}
function runDemo(ts){
if(!t0)t0=ts-500;
var e=ts-t0,n=Math.floor(e/3400),t=e%3400,dir=n%2?-1:1,top=S[order[0]],q;
if(t>=300&&t<1000){
q=(t-300)/700;q=q*q*(3-2*q);dd=true;
put(top,SL[0][0]*W/250+dir*W*0.36*q,-W*0.03*q,SL[0][2]+dir*10*q);
gh.style.opacity=".4";gh.style.transform="translate("+(W/2+top.x).toFixed(1)+"px,"+(W*0.62+top.y).toFixed(1)+"px)";
}else if(t>=1000&&cyc!==n){cyc=n;dd=false;gh.style.opacity="0";toss(dir);}
}
function frame(ts){
raf=0;
if(D.hidden)return;
W=pile.clientWidth||W;
if(demo)runDemo(ts);
if(fly&&ts-fly.t>240){tuck();announce();}
targets();
var m=0;
S.forEach(function(st,i){var f=fly&&fly.c===i,kk=f?0.2:0.13,d=f?0.72:0.74;
K.forEach(function(a){var v=st.v,g=st.t[a]-st[a];v[a]=(v[a]+g*kk)*d;st[a]+=v[a];m+=(A(v[a])+A(g))*(a==="s"?50:1);});});
paint();
if((demo||drag||fly||m>0.05)&&!raf)raf=requestAnimationFrame(frame);
}
function wake(){if(!raf&&!D.hidden)raf=requestAnimationFrame(frame);}
function takeover(){if(!demo)return;demo=dd=false;gh.style.opacity="0";targets();wake();}
window.addEventListener("forever:interactive",takeover);
function on(t,f){btn.addEventListener(t,f);}
on("pointerdown",function(e){
if(e.button>0)return;
takeover();if(fly){tuck();announce();targets();}
drag={x0:e.clientX,y0:e.clientY,lx:e.clientX,lt:now(),vx:0};
try{btn.setPointerCapture(e.pointerId);}catch(_){}
});
on("pointermove",function(e){
if(!drag)return;
var n=now(),dx=e.clientX-drag.x0;
drag.vx=drag.vx*0.6+(e.clientX-drag.lx)/Math.max(8,n-drag.lt)*0.4;drag.lx=e.clientX;drag.lt=n;
put(S[order[0]],SL[0][0]*W/250+dx,(e.clientY-drag.y0)*0.5,SL[0][2]+dx*0.07);
targets();paint();wake();
});
function release(e){
if(!drag)return;
var dx=e.clientX-drag.x0,v=drag.vx;drag=null;
if(e.type==="pointerup"&&(A(dx)>W*0.32||A(v)>0.5&&A(dx)>12)){toss((dx||v)>0?1:-1);return;}
targets();if(reduce){snap();paint();}wake();
}
on("pointerup",release);on("pointercancel",release);
on("click",function(){takeover();announce();});
on("keydown",function(e){
var k=e.key;
if(k==="ArrowRight"||k==="ArrowDown"){e.preventDefault();takeover();toss(1);}
else if(k==="ArrowLeft"||k==="ArrowUp"){e.preventDefault();takeover();back();}
});
D.addEventListener("visibilitychange",function(){if(!D.hidden)wake();});
W=pile.clientWidth||W;targets();snap();paint();wake();
})();
</script>
