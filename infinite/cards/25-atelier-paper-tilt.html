<script>/* theme hook: ?theme=light|dark, before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  :root {
    --at22-bg: #171614;
    --at22-ink: #F4F1EA;
    --at22-accent: #EC6A43;
    --at22-paper: #EFEBE2;
    --at22-back: #E2DCCF;
    --at22-mark: #1C1B19;
    --at22-clay: #C4683F;
    --at22-sage: #7F9678;
    --at22-sand: #D9C9A8;
    --at22-shadow: rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --at22-bg: #F4F1EA;
    --at22-ink: #1C1B19;
    --at22-accent: #C43B16;
    --at22-paper: #FFFDF8;
    --at22-back: #ECE6D9;
    --at22-shadow: rgba(60, 50, 35, 0.26);
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background-color: var(--at22-bg); color: var(--at22-ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    transition: background-color 0.25s ease;
  }
  .at22-stage { position: absolute; inset: 0; display: grid; place-items: center; background-color: var(--at22-bg); }
  .at22-card {
    position: relative;
    width: min(50vmin, 250px); aspect-ratio: 4 / 5;
    padding: 0; border: 0; background: none;
    cursor: pointer; touch-action: none; perspective: 900px;
    -webkit-tap-highlight-color: transparent;
  }
  .at22-card:focus-visible { outline: 2px solid var(--at22-accent); outline-offset: 6px; border-radius: 4px; }
  .at22-shadow { position: absolute; inset: 6% 4% -3% 4%; border-radius: 6px; box-shadow: 0 6px 16px 2px var(--at22-shadow); }
  .at22-print { position: absolute; inset: 0; border-radius: 3px; overflow: hidden; background: var(--at22-paper); will-change: transform; }
  .at22-face { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .at22-rear { display: none; transform: scaleX(-1); background: var(--at22-back); }
  .at22-print.is-back .at22-front { display: none; }
  .at22-print.is-back .at22-rear { display: block; }
  .at22-p { fill: var(--at22-paper); }
  .at22-s { fill: var(--at22-sand); }
  .at22-c { fill: var(--at22-clay); }
  .at22-g { fill: var(--at22-sage); }
  .at22-k { fill: var(--at22-mark); }
  .at22-l { fill: none; stroke: var(--at22-mark); stroke-width: 1.4; stroke-linecap: round; }
  .at22-st { fill: none; stroke: var(--at22-clay); stroke-width: 1.2; }
  .at22-tx { fill: var(--at22-clay); font: 600 5px ui-monospace, monospace; letter-spacing: 0.18em; }
  .at22-cap {
    position: absolute; left: 10px; bottom: 8px;
    font: 500 11px/1 ui-monospace, monospace;
    color: var(--at22-ink); opacity: 0.45;
    letter-spacing: 0.04em; text-transform: uppercase;
    user-select: none; pointer-events: none;
  }
</style>

</head>
<body>
<div class="at22-stage">
  <button type="button" class="at22-card" id="at22-card" aria-pressed="false" aria-label="Print of a pear. Press to turn it over">
    <span class="at22-shadow" id="at22-shadow"></span>
    <span class="at22-print" id="at22-print">
      <svg class="at22-face at22-front" viewBox="0 0 100 125" aria-hidden="true">
        <rect class="at22-p" width="100" height="125"/>
        <rect class="at22-s" x="8" y="8" width="84" height="109"/>
        <g id="at22-far"><circle class="at22-p" cx="70" cy="34" r="13"/></g>
        <rect class="at22-g" x="8" y="86" width="84" height="31"/>
        <g id="at22-near">
          <ellipse class="at22-k" cx="50" cy="96" rx="23" ry="3.5" opacity="0.22"/>
          <path class="at22-c" d="M50 42c7 0 9 8 11 16 2 7 9 12 9 22 0 10-9 16-20 16s-20-6-20-16c0-10 7-15 9-22 2-8 4-16 11-16z"/>
          <path class="at22-l" d="M50 42c0-5 2-8 5-10"/>
          <path class="at22-g" d="M55 33c5-5 12-4 15-1-4 4-11 5-15 1z"/>
        </g>
      </svg>
      <svg class="at22-face at22-rear" viewBox="0 0 100 125" aria-hidden="true">
        <circle class="at22-st" cx="50" cy="56" r="17"/>
        <circle class="at22-st" cx="50" cy="56" r="12"/>
        <path class="at22-c" d="M50 48c2 0 2.600 2.300 3.200 4.600.6 2 2.600 3.400 2.600 6.300 0 2.900-2.600 4.600-5.800 4.600s-5.800-1.700-5.800-4.600c0-2.900 2-4.300 2.600-6.300.6-2.300 1.200-4.600 3.200-4.600z"/>
        <text class="at22-tx" x="50" y="88" text-anchor="middle">FOREVER</text>
        <path class="at22-l" d="M30 100h40M36 106h28" opacity="0.3"/>
      </svg>
    </span>
  </button>
</div>
<div class="at22-cap" aria-hidden="true">Atelier Paper Tilt</div>
<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var card = document.getElementById("at22-card");
  var print = document.getElementById("at22-print");
  var shadow = document.getElementById("at22-shadow");
  var far = document.getElementById("at22-far");
  var near = document.getElementById("at22-near");
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var demo = !reduce && (!window.__foreverPreview || window.__foreverPreview.demoEnabled !== false);
  var MAX = 13;
  var rx = 0, ry = 0, vx = 0, vy = 0, tx = 0, ty = 0;
  var flip = 0, vf = 0, back = false;
  var raf = 0, down = null, moved = 0, lastFlip = 0, nudge = 0;

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "forever:theme" && (e.data.theme === "light" || e.data.theme === "dark")) root.setAttribute("data-theme", e.data.theme);
  });

  function paint() {
    var showBack = Math.cos(flip * Math.PI / 180) < 0;
    print.classList.toggle("is-back", showBack);
    print.style.transform = "rotateX(" + rx.toFixed(2) + "deg) rotateY(" + (ry + flip).toFixed(2) + "deg)";
    shadow.style.transform = "translate(" + (-ry * 0.5).toFixed(2) + "px," + (rx * 0.5 + 4).toFixed(2) + "px)";
    far.setAttribute("transform", "translate(" + (-ry * 0.1).toFixed(2) + " " + (rx * 0.1).toFixed(2) + ")");
    near.setAttribute("transform", "translate(" + (ry * 0.16).toFixed(2) + " " + (-rx * 0.16).toFixed(2) + ")");
  }
  function toggle() {
    back = !back;
    card.setAttribute("aria-pressed", back ? "true" : "false");
    if (reduce) { flip = back ? 180 : 0; paint(); } else kick();
  }

  function tick(ts) {
    raf = 0;
    if (document.hidden) return;
    if (demo) {
      var a = ts / 1000;
      tx = Math.sin(a * 1.3) * MAX * 0.8; ty = Math.cos(a * 0.9) * MAX;
      if (ts - lastFlip > 4200) { lastFlip = ts; toggle(); }
    }
    var goal = back ? 180 : 0;
    vx = (vx + (tx - rx) * 0.12) * 0.74; rx += vx;
    vy = (vy + (ty - ry) * 0.12) * 0.74; ry += vy;
    vf = (vf + (goal - flip) * 0.09) * 0.74; flip += vf;
    paint();
    var busy = Math.abs(vx) + Math.abs(vy) + Math.abs(vf) + Math.abs(tx - rx) + Math.abs(ty - ry) + Math.abs(goal - flip) > 0.03;
    if (demo || busy) raf = requestAnimationFrame(tick);
  }
  function kick() { if (!raf && !reduce && !document.hidden) raf = requestAnimationFrame(tick); }
  function take() { if (demo) { demo = false; tx = 0; ty = 0; } }

  function aim(e) {
    var r = card.getBoundingClientRect();
    if (!r.width) return;
    var px = Math.max(-1, Math.min(1, (e.clientX - r.left) / r.width * 2 - 1));
    var py = Math.max(-1, Math.min(1, (e.clientY - r.top) / r.height * 2 - 1));
    ty = px * MAX; tx = -py * MAX;
    kick();
  }
  window.addEventListener("forever:interactive", take);
  card.addEventListener("pointerdown", function (e) {
    take();
    down = { x: e.clientX, y: e.clientY }; moved = 0;
    if (card.setPointerCapture) card.setPointerCapture(e.pointerId);
    if (!reduce) aim(e);
  });
  card.addEventListener("pointermove", function (e) {
    take();
    if (down) moved = Math.max(moved, Math.abs(e.clientX - down.x) + Math.abs(e.clientY - down.y));
    if (!reduce && (down || e.pointerType === "mouse")) aim(e);
  });
  function rest(e) {
    if (e.type !== "pointerleave" || !down) { tx = 0; ty = 0; kick(); }
    if (e.type !== "pointerleave") down = null;
  }
  card.addEventListener("pointerup", rest);
  card.addEventListener("pointercancel", rest);
  card.addEventListener("pointerleave", rest);
  card.addEventListener("click", function () {
    take();
    if (moved < 10) toggle();
    moved = 0;
  });
  card.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k.indexOf("Arrow") !== 0 || reduce) return;
    e.preventDefault(); take();
    ty = k === "ArrowLeft" ? -MAX : k === "ArrowRight" ? MAX : 0;
    tx = k === "ArrowUp" ? MAX : k === "ArrowDown" ? -MAX : 0;
    kick();
    clearTimeout(nudge);
    nudge = setTimeout(function () { tx = 0; ty = 0; kick(); }, 420);
  });
  card.addEventListener("blur", function () { tx = 0; ty = 0; kick(); });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = 0; } } else kick();
  });

  paint();
  if (demo) kick();
})();
</script>
</body>
</html>
