<script>/* theme hook: ?theme=light|dark, before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  :root {
    --at26-bg: #171614;
    --at26-ink: #F4F1EA;
    --at26-accent: #EC6A43;
    --at26-paper: #EFEBE2;
    --at26-edge: #CFC8B8;
    --at26-mark: #1C1B19;
    --at26-leaf: #6F8F68; --at26-clay: #C4683F; --at26-sky: #8FA9BD; --at26-sun: #DDB45C;
    --at26-shadow: rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --at26-bg: #F4F1EA;
    --at26-ink: #1C1B19;
    --at26-accent: #C43B16;
    --at26-paper: #FFFDF8;
    --at26-edge: #DDD6C7;
    --at26-shadow: rgba(60, 50, 35, 0.22);
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background-color: var(--at26-bg); color: var(--at26-ink); transition: background-color 0.25s ease; }
  .at26-stage { position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden; background-color: var(--at26-bg); }
  .at26-deck { position: relative; width: min(46vmin, 240px); aspect-ratio: 4 / 5; }
  .at26-c {
    position: absolute; inset: 0; width: 100%; height: 100%;
    padding: 9%; border: 1px solid var(--at26-edge); border-radius: 7px;
    background: var(--at26-paper);
    box-shadow: 0 2px 3px -1px var(--at26-shadow);
    cursor: grab; touch-action: pan-y; will-change: transform;
    -webkit-tap-highlight-color: transparent;
  }
  .at26-c.is-air { box-shadow: 0 10px 14px -6px var(--at26-shadow); cursor: grabbing; }
  .at26-c:focus-visible { outline: 2px solid var(--at26-accent); outline-offset: 4px; }
  .at26-pic { display: block; width: 100%; height: 100%; pointer-events: none; }
  .at26-a { fill: var(--at26-leaf); }
  .at26-b { fill: var(--at26-clay); }
  .at26-s { fill: var(--at26-sky); }
  .at26-d { fill: var(--at26-sun); }
  .at26-k { fill: var(--at26-mark); }
  .at26-l { fill: none; stroke: var(--at26-mark); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .at26-live { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .at26-cap {
    position: absolute; left: 10px; bottom: 8px;
    font: 500 11px/1 ui-monospace, monospace;
    color: var(--at26-ink); opacity: 0.45;
    letter-spacing: 0.04em; text-transform: uppercase;
    user-select: none; pointer-events: none;
  }
</style>

<body>
<div class="at26-stage">
  <div class="at26-deck" id="at26-deck" role="group" aria-label="Pile of picture cards. Arrow keys change the top card">
    <button type="button" class="at26-c" aria-label="Sailing boat"><svg class="at26-pic" viewBox="0 0 60 75" aria-hidden="true"><path class="at26-s" d="M0 0h60v75H0z" opacity="0.35"/><circle class="at26-d" cx="45" cy="15" r="6"/><path class="at26-b" d="M12 46h36l-7 10H19z"/><path class="at26-s" d="M32 18l13 22H32z"/><path class="at26-l" d="M30 14v32M8 64c5-3 8 3 13 0s8 3 13 0 8 3 13 0 5-1 6-1"/></svg></button>
    <button type="button" class="at26-c" aria-label="Hills at sunrise"><svg class="at26-pic" viewBox="0 0 60 75" aria-hidden="true"><path class="at26-d" d="M0 0h60v75H0z" opacity="0.3"/><circle class="at26-b" cx="30" cy="34" r="11"/><path class="at26-a" d="M0 75V46c10-10 22-9 30-1 8-8 20-6 30 4v26z"/><path class="at26-l" d="M12 62c4-3 8-3 12 0M36 60c4-3 8-3 12 0"/></svg></button>
    <button type="button" class="at26-c" aria-label="Small bird"><svg class="at26-pic" viewBox="0 0 60 75" aria-hidden="true"><path class="at26-a" d="M0 0h60v75H0z" opacity="0.25"/><ellipse class="at26-s" cx="29" cy="38" rx="15" ry="12"/><circle class="at26-s" cx="40" cy="26" r="8"/><path class="at26-b" d="M47 24l8 3-8 3z"/><circle class="at26-k" cx="42" cy="25" r="1.6"/><path class="at26-l" d="M25 50v9M33 50v9M21 59h8M29 59h8M18 36c4 4 9 5 14 3"/></svg></button>
    <button type="button" class="at26-c" aria-label="Cactus in a pot"><svg class="at26-pic" viewBox="0 0 60 75" aria-hidden="true"><path class="at26-b" d="M0 0h60v75H0z" opacity="0.2"/><path class="at26-a" d="M24 50V22a6 6 0 0 1 12 0v28z"/><path class="at26-l" d="M24 38h-5a3 3 0 0 1-3-3v-6M36 32h5a3 3 0 0 0 3-3v-5M30 24v4M30 34v4"/><path class="at26-b" d="M19 50h22l-3 14H22z"/></svg></button>
    <button type="button" class="at26-c" aria-label="Kite"><svg class="at26-pic" viewBox="0 0 60 75" aria-hidden="true"><path class="at26-s" d="M0 0h60v75H0z" opacity="0.4"/><path class="at26-d" d="M32 12l13 18-13 20-13-20z"/><path class="at26-l" d="M32 12v38M19 30h26M32 50c-3 6-10 5-12 12"/><path class="at26-b" d="M24 56l-5 2 4 3z"/></svg></button>
  </div>
  <p class="at26-live" id="at26-live" aria-live="polite"></p>
</div>
<div class="at26-cap" aria-hidden="true">Atelier Throw Deck</div>
<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var deck = document.getElementById("at26-deck");
  var live = document.getElementById("at26-live");
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var demo = !reduce && (!window.__foreverPreview || window.__foreverPreview.demoEnabled !== false);
  var tilt = [-3, 2.5, -1.5, 4, -4.5];
  var cards = [].slice.call(deck.querySelectorAll(".at26-c")).map(function (el, i) {
    return { el: el, i: i, x: 0, y: 0, r: tilt[i], s: 1, vx: 0, vy: 0, vr: 0, out: 0, ret: false };
  });
  var n = cards.length, order = cards.map(function (c) { return c.i; });
  var raf = 0, drag = null, W = 1, lastThrow = 0, side = 1;

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "forever:theme" && (e.data.theme === "light" || e.data.theme === "dark")) root.setAttribute("data-theme", e.data.theme);
  });

  function top() { return cards[order[0]]; }
  function sync(say) {
    var had = deck.contains(document.activeElement);
    cards.forEach(function (c) { c.el.tabIndex = c === top() ? 0 : -1; });
    if (had) top().el.focus();
    if (say) live.textContent = "Card " + (top().i + 1) + " of " + n + ": " + top().el.getAttribute("aria-label");
  }
  function goal(c) {
    var d = order.indexOf(c.i), g = { x: 0, y: d * W * 0.035, r: tilt[c.i] * (d ? 1 : 0.35), s: 1 - d * 0.03 };
    var t = top(), lift = drag ? Math.min(1, Math.abs(t.x) / (W * 0.33)) : (t.out && !t.ret ? 1 : 0);
    if (d === 1) { g.y *= 1 - lift; g.s += (1 - g.s) * lift; }
    if (c.out) { g.x = c.out * W * 1.3; g.r = c.out * 16; g.y = c.y; g.s = 1; }
    return g;
  }
  function place(c) {
    var d = order.indexOf(c.i);
    c.el.style.zIndex = c.out ? (c.ret ? 0 : n + 1) : n - d;
    c.el.style.transform = "translate(" + c.x.toFixed(1) + "px," + c.y.toFixed(1) + "px) rotate(" + c.r.toFixed(2) + "deg) scale(" + c.s.toFixed(3) + ")";
    c.el.classList.toggle("is-air", !!(c.out || (drag && drag.c === c)));
  }
  function settle() {
    cards.forEach(function (c) { var g = goal(c); c.x = g.x; c.y = g.y; c.r = g.r; c.s = g.s; c.vx = c.vy = c.vr = 0; place(c); });
  }
  function land(c) {
    order.splice(order.indexOf(c.i), 1);
    if (c.ret) order.unshift(c.i); else order.push(c.i);
    c.out = 0; c.ret = false;
    sync(true);
  }
  function toss(dir, back) {
    var c = back ? cards[order[n - 1]] : top();
    if (c.out) return;
    c.out = dir; c.ret = !!back;
    if (reduce) { land(c); settle(); } else kick();
  }

  function tick(ts) {
    raf = 0;
    if (document.hidden) return;
    var busy = false;
    if (demo && ts - lastThrow > 2300) { lastThrow = ts; side = -side; toss(side); }
    cards.forEach(function (c) {
      if (!(drag && drag.c === c)) {
        var g = goal(c);
        c.vx = (c.vx + (g.x - c.x) * 0.13) * 0.72; c.x += c.vx;
        c.vy = (c.vy + (g.y - c.y) * 0.13) * 0.72; c.y += c.vy;
        c.vr = (c.vr + (g.r - c.r) * 0.13) * 0.72; c.r += c.vr;
        c.s += (g.s - c.s) * 0.2;
        if (c.out && Math.abs(c.x) > W * 0.95) land(c);
        if (c.out || Math.abs(c.vx) + Math.abs(c.vy) + Math.abs(c.vr) + Math.abs(g.x - c.x) + Math.abs(g.y - c.y) > 0.05) busy = true;
      } else busy = true;
      place(c);
    });
    if (demo || busy) raf = requestAnimationFrame(tick);
  }
  function kick() { if (!raf && !document.hidden) raf = requestAnimationFrame(tick); }
  function take() { demo = false; }

  window.addEventListener("forever:interactive", take);
  deck.addEventListener("pointerdown", function (e) {
    take();
    var c = top();
    if (e.target !== c.el || c.out) return;
    drag = { c: c, x: e.clientX, y: e.clientY, lx: e.clientX, v: 0 };
    if (c.el.setPointerCapture) c.el.setPointerCapture(e.pointerId);
    kick();
  });
  deck.addEventListener("pointermove", function (e) {
    if (!drag) return;
    var c = drag.c;
    c.x = e.clientX - drag.x; c.y = (e.clientY - drag.y) * 0.5; c.r = c.x * 0.07;
    drag.v = e.clientX - drag.lx; drag.lx = e.clientX;
    if (reduce) place(c);
  });
  function end() {
    if (!drag) return;
    var c = drag.c, v = drag.v;
    drag = null;
    if (Math.abs(c.x) > W * 0.33 || (Math.abs(v) > 9 && Math.abs(c.x) > 12)) { c.vx = v; toss(c.x > 0 ? 1 : -1); }
    else if (reduce) settle();
    kick();
  }
  deck.addEventListener("pointerup", end);
  deck.addEventListener("pointercancel", end);
  deck.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === "ArrowRight" || k === "ArrowDown") toss(1);
    else if (k === "ArrowLeft" || k === "ArrowUp") toss(-1, true);
    else if (k === "Enter") sync(true);
    else return;
    e.preventDefault(); take();
  });
  function size() { W = deck.clientWidth || 1; }
  window.addEventListener("resize", function () { size(); settle(); });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = 0; } } else kick();
  });

  size(); sync(false); settle();
  if (demo) kick();
})();
</script>
</body>
</html>
