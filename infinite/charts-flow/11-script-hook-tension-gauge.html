    --sc-cream: #F8F6F0;

  .sc06-wrap, .sc06-wrap * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #111;
    font-family: 'Space Grotesk', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;

  .sc06-wrap {
    width: 100%;
    max-width: 440px;
    background: var(--sc-cream);
    border: 2px solid var(--sc-navy);
    border-radius: 8px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 6px 6px 0 var(--sc-navy);
    user-select: none;
  }
  .sc06-hdr {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .sc06-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--sc-navy);
  }
  .sc06-tabs {
    display: flex;
    gap: 6px;
  }
  .sc06-tab {
    font-family:inherit;
    flex: 1;
    background: #fff;
    border: 1.5px solid var(--sc-navy);
    border-radius: 4px;
    padding: 5px 6px;
    font-size: 12px;
    font-weight: 700;
    color: var(--sc-navy);
    cursor: pointer;
    text-align: center;
    box-shadow: 2px 2px 0 var(--sc-navy);
    transition: all 0.1s ease;
  }
  .sc06-tab.sc06-active {
    background: var(--sc-navy);
    color: #fff;
    box-shadow: 2px 2px 0 var(--sc-red);
  }
  .sc06-wrap canvas {
    width: 100%;
    height: 120px;
    background: #fff;
    border: 1.5px solid var(--sc-navy);
    border-radius: 4px;
    display: block;
    box-shadow: 2px 2px 0 var(--sc-navy);
  }
  .sc06-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
  }

 "file": "infinite/charts-flow/11-script-hook-tension-gauge.html",
 "title": "Hook Retention Curve",

<body>
<div class="sc06-wrap" role="region" aria-label="Hook Retention Curve">
  <div class="sc06-hdr">
    <span class="sc06-title">RETENTION BENCHMARK // 0:30 HOOK</span>
    <span class="sc06-preset1">10k SAMPLES</span>
  </div>

  <div class="sc06-tabs" id="sc06-tabGroup" role="group" aria-label="Retention scenario">
    <button type="button" class="sc06-tab sc06-active" data-type="open-loop" aria-pressed="true">OPEN LOOP</button>
    <button type="button" class="sc06-tab" data-type="in-media-res" aria-pressed="false">IN MEDIA RES</button>
    <button type="button" class="sc06-tab" data-type="slow-burn" aria-pressed="false">SLOW INTRO</button>
  </div>

  <canvas id="sc06-cv" width="392" height="120"></canvas>

  <div class="sc06-foot">
    <span class="sc06-preset2" id="sc06-scoreLabel">RETENTION @ 30s: 88.4%</span>
    <span class="sc06-preset3" id="sc06-gradeLabel">TIER: VIRAL S-CLASS</span>
  </div>
</div>

<div class="sc06-cap" aria-hidden="true">Hook Retention Curve</div>
<script>
(()=>{
  const tileRoot = document.querySelector('.sc06-wrap');
  const pauseCSS = () => tileRoot.toggleAttribute('data-paused', document.hidden);
  document.addEventListener('visibilitychange', pauseCSS); pauseCSS();

  // Local frame lifecycle: stop hidden work, repaint reduced-motion state on input.
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const frames = new Map(), drivers = new Set(); let painting = false;
  let demoEnabled=window.__foreverPreview?window.__foreverPreview.demoEnabled!==false:true;
  function stopDemo(){demoEnabled=false;const id=frames.get(render);if(id)cancelAnimationFrame(id);frames.delete(render);}
  window.addEventListener('forever:interactive',stopDemo);
  document.addEventListener('pointerdown',stopDemo,{capture:true});document.addEventListener('click',stopDemo,{capture:true});
  document.addEventListener('keydown',e=>{if(e.key!=='Tab'&&!e.metaKey&&!e.ctrlKey&&!e.altKey)stopDemo();},{capture:true});
  function scheduleFrame(fn,manual=false) {
    if(fn===render&&!demoEnabled&&!manual)return;
    drivers.add(fn);
    if (document.hidden || frames.has(fn) || (motion.matches && painting)) return;
    frames.set(fn, requestAnimationFrame(t => {
      frames.delete(fn); if (document.hidden) return;
      painting = true; try { fn(t); } finally { painting = false; }
    }));
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { frames.forEach(cancelAnimationFrame); frames.clear(); }
    else drivers.forEach(scheduleFrame);
  });
  const repaint = () => { if (motion.matches) drivers.forEach(scheduleFrame); };
  ['click','input','pointermove'].forEach(type => document.addEventListener(type, repaint));
  motion.addEventListener('change', () => { reduce = motion.matches; drivers.forEach(scheduleFrame); });

  let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = document.getElementById('sc06-cv');
  const ctx = cv.getContext('2d');
  const tabs = document.querySelectorAll('.sc06-tab');
  const scoreLabel = document.getElementById('sc06-scoreLabel');
  const gradeLabel = document.getElementById('sc06-gradeLabel');

  const configs = {
    'open-loop': { ret30: 88.4, grade: 'TIER: VIRAL S-CLASS', decay: 0.12, noise: 0.02 },
    'in-media-res': { ret30: 74.2, grade: 'TIER: STRONG A-CLASS', decay: 0.28, noise: 0.04 },
    'slow-burn': { ret30: 41.6, grade: 'TIER: POOR C-CLASS', decay: 0.65, noise: 0.08 }
  };
  let currentKey = 'open-loop';

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => { t.classList.remove('sc06-active'); t.setAttribute('aria-pressed', 'false'); });
      tab.classList.add('sc06-active');
      tab.setAttribute('aria-pressed', 'true');
      currentKey = tab.getAttribute('data-type');
      const cfg = configs[currentKey];
      scoreLabel.textContent = `RETENTION @ 30s: ${cfg.ret30}%`;
      gradeLabel.textContent = cfg.grade;
      scheduleFrame(render,true);
    });
  });

  let running = true;
  document.addEventListener('visibilitychange', () => { running = !document.hidden; });

  let curDecay = configs[currentKey].decay;
  let tick = 0;

  function render() {
    if (!running) return;
    if (!reduce) tick += 0.03;

    // Smoothly interpolate decay toward target
    const targetDecay = configs[currentKey].decay;
    curDecay = reduce ? targetDecay : curDecay + (targetDecay - curDecay) * .1;

    ctx.clearRect(0, 0, cv.width, cv.height);
    const w = cv.width, h = cv.height;
    const pad = 16;
    const plotW = w - pad * 2;
    const plotH = h - pad * 2;

    // Draw grid
    ctx.strokeStyle = 'rgba(14, 42, 71, 0.08)';
    ctx.lineWidth = 1;
    [0.25, 0.5, 0.75].forEach(u => {
      const y = pad + u * plotH;
      ctx.beginPath();
      ctx.moveTo(pad, y);
      ctx.lineTo(w - pad, y);
      ctx.stroke();
    });

    // Draw retention curve
    ctx.beginPath();
    for (let x = 0; x <= plotW; x += 2) {
      const t = x / plotW; // 0 to 1 (0 to 60s)
      const retention = Math.exp(-curDecay * t * 2) + Math.sin(t * 12 + tick) * configs[currentKey].noise;
      const y = h - pad - Math.max(0.1, retention) * plotH;
      if (x === 0) ctx.moveTo(pad + x, y);
      else ctx.lineTo(pad + x, y);
    }
    ctx.strokeStyle = currentKey === 'slow-burn' ? '#BE4D4D' : '#0E2A47';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // 30s Marker (halfway)
    const midX = pad + plotW * 0.5;
    ctx.strokeStyle = 'rgba(190, 77, 77, 0.5)';
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(midX, pad);
    ctx.lineTo(midX, h - pad);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#0E2A47';
    ctx.font = '700 8px "JetBrains Mono", monospace';
    ctx.fillText('30s HOOK MARK', midX + 4, pad + 12);

    scheduleFrame(render);
  }
  scheduleFrame(render);
})();
</script>
</body>
