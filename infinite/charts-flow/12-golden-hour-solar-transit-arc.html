<style>
  :root {
    --dust: #C9B274;
    --red: #D93829;
    --asphalt: #141518;
  }
  .sw04-wrap, .sw04-wrap * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0d0e10;
    color: #fff;
    font-family: 'IBM Plex Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .sw04-wrap {
    width: 100%;
    max-width: 420px;
    background: var(--asphalt);
    border-radius: 8px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
    border: 1px solid rgba(201, 178, 116, 0.15);
    user-select: none;
  }
  .sw04-hdr {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .sw04-title {
    font-family: 'Archivo', sans-serif;

    letter-spacing: -0.02em;
    color: #fff;
  }
  .sw04-badge {
    font-family: 'IBM Plex Mono', monospace;

    font-weight: 700;
    color: var(--dust);
  }
  .sw04-wrap canvas {
    width: 100%;
    height: 140px;
    background: #000;
    border-radius: 4px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    display: block;
    cursor: ew-resize;
  }
  .sw04-foot {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.5);
  }

.sw04-preset1{color:var(--dust)}
.sw04-cap{position:fixed;left:10px;bottom:8px;font:10px system-ui;opacity:.55;pointer-events:none}
@media(prefers-reduced-motion:reduce){.sw04-wrap, .sw04-wrap *{animation:none!important;transition:none!important}}

.sw04-wrap[data-paused] *,.sw04-wrap[data-paused]{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){.sw04-wrap,.sw04-wrap *{animation:none!important;transition:none!important}}

</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/charts-flow/12-golden-hour-solar-transit-arc.html",
 "title": "Golden Hour Solar Transit",
 "description": "Golden Hour Solar Transit control in the Sam Walks system.",
 "useWhen": "",
 "avoidWhen": "",
 "agentPrompt": "",
 "editableAreas": [],
 "preserveElements": [
  "First control stops idle sun drift; selected position repaints once.",
  "demo-v1 preview lifecycle: initialize demoEnabled from window.__foreverPreview and stop attract work on the window forever:interactive event; retain manual feedback, settling, cleanup and explicit sessions"
 ],
 "knownLimitations": [
  "State remains local to each mounted instance; format/theme remount preserves takeover, not component values."
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "accessible",
  "copy-paste-safe",
  "minimal-deps"
 ],
 "tags": [
  "walking",
  "chronometer",
  "cadence",
  "waypoint",
  "solar-transit",
  "compass",
  "golden-hour-solar-transit",
  "chart",

  "elevation",

  "sam-walks",

 ]
}

</head>
<body>
<div class="sw04-wrap" role="region" aria-label="Golden Hour Solar Transit">
  <div class="sw04-hdr">
    <span class="sw04-title">TAGUS RIVER // GOLDEN HOUR</span>
    <span class="sw04-badge" id="sw04-timeLabel">19:42 · 3100K WARMTH</span>
  </div>

  <canvas id="sw04-cv" width="376" height="140"></canvas>

  <div class="sw04-foot">
    <span id="sw04-elevLabel">SOLAR ELEVATION: 4.8°</span>
    <span class="sw04-preset1">SCRUB TO SIMULATE SUNSET</span>
  </div>
</div>

<div class="sw04-cap" aria-hidden="true">Golden Hour Solar Transit</div>
<script>
(()=>{
  const tileRoot = document.querySelector('.sw04-wrap');
  const pauseCSS = () => tileRoot.toggleAttribute('data-paused', document.hidden);
  document.addEventListener('visibilitychange', pauseCSS); pauseCSS();

  // Local frame lifecycle: stop hidden work, repaint reduced-motion state on input.
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const frames = new Map(), drivers = new Set(); let painting = false;
  let demoEnabled=window.__foreverPreview?window.__foreverPreview.demoEnabled!==false:true;
  function stopDemo(){demoEnabled=false;const id=frames.get(render);if(id)cancelAnimationFrame(id);frames.delete(render);}
  window.addEventListener('forever:interactive',stopDemo);
  document.addEventListener('pointerdown',stopDemo,{capture:true});document.addEventListener('click',stopDemo,{capture:true});
  document.addEventListener('keydown',e=>{if(e.key!=='Tab'&&!e.metaKey&&!e.ctrlKey&&!e.altKey)stopDemo();},{capture:true});
  function scheduleFrame(fn,manual=false) {
    if(fn===render&&!demoEnabled&&!manual)return;
    drivers.add(fn);
    if (document.hidden || frames.has(fn) || (motion.matches && painting)) return;
    frames.set(fn, requestAnimationFrame(t => {
      frames.delete(fn); if (document.hidden) return;
      painting = true; try { fn(t); } finally { painting = false; }
    }));
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { frames.forEach(cancelAnimationFrame); frames.clear(); }
    else drivers.forEach(scheduleFrame);
  });
  const repaint = () => { if (motion.matches) drivers.forEach(scheduleFrame); };
  ['click','input','pointermove'].forEach(type => document.addEventListener(type, repaint));
  motion.addEventListener('change', () => { reduce = motion.matches; drivers.forEach(scheduleFrame); });

  let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = document.getElementById('sw04-cv');
  const ctx = cv.getContext('2d');
  // Rasterize the sun halo once; reuse it while the scene moves.
  const sunGlows = ['#D93829', '#C9B274'].map(color => {
    const sprite = document.createElement('canvas'); sprite.width = sprite.height = 68;
    const gctx = sprite.getContext('2d'), r = sprite.width / 2;
    const gradient = gctx.createRadialGradient(r, r, 1, r, r, r);
    gradient.addColorStop(0, color + '99'); gradient.addColorStop(1, color + '00');
    gctx.fillStyle = gradient; gctx.fillRect(0, 0, sprite.width, sprite.height); return sprite;
  });

  const timeLabel = document.getElementById('sw04-timeLabel');
  const elevLabel = document.getElementById('sw04-elevLabel');

  let sunT = 0.75; // 0 (noon) to 1 (post-sunset)
  let dragging = false;

  function setSun(clientX) {
    const r = cv.getBoundingClientRect();
    sunT = Math.max(0.1, Math.min(0.95, (clientX - r.left) / r.width));
    const h = 18 + Math.floor(sunT * 2.5);
    const m = Math.floor((sunT * 150) % 60);
    const kelvin = Math.round(5600 - sunT * 3200);
    timeLabel.textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')} · ${kelvin}K WARMTH`;
    const elev = (1 - sunT) * 35;
    elevLabel.textContent = `SOLAR ELEVATION: ${elev.toFixed(1)}°`;
    scheduleFrame(render,true);
  }

  cv.addEventListener('pointerdown', (e) => {
    dragging = true;
    setSun(e.clientX);
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', (e) => {
    if (dragging) setSun(e.clientX);
  });
  cv.addEventListener('pointerup', () => { dragging = false; });
  cv.addEventListener('pointercancel', () => { dragging = false; });

  let running = true;
  document.addEventListener('visibilitychange', () => { running = !document.hidden; });

  let waveTick = 0;
  function render() {
    if (!running) return;
    waveTick += 0.03;

    const w = cv.width, h = cv.height;
    ctx.clearRect(0, 0, w, h);

    const horizonY = h * 0.7;

    // Sky gradient based on sunT
    const skyG = ctx.createLinearGradient(0, 0, 0, horizonY);
    if (sunT < 0.5) {
      skyG.addColorStop(0, '#10223A');
      skyG.addColorStop(1, '#4A6B82');
    } else {
      skyG.addColorStop(0, '#1B1424');
      skyG.addColorStop(0.6, '#662222');
      skyG.addColorStop(1, '#D93829');
    }
    ctx.fillStyle = skyG;
    ctx.fillRect(0, 0, w, horizonY);

    // River Water
    const waterG = ctx.createLinearGradient(0, horizonY, 0, h);
    waterG.addColorStop(0, '#0D1A26');
    waterG.addColorStop(1, '#050B10');
    ctx.fillStyle = waterG;
    ctx.fillRect(0, horizonY, w, h - horizonY);

    // Sun Arc
    const sunX = sunT * w;
    const sunY = 25 + Math.pow(sunT, 2.2) * (horizonY - 20);

    // Solar Arc guideline
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.moveTo(w * 0.1, 25);
    ctx.quadraticCurveTo(w * 0.5, 45, w * 0.95, horizonY + 5);
    ctx.stroke();
    ctx.setLineDash([]);

    // Water Reflection Glints
    const glintCount = 14;
    for (let i = 0; i < glintCount; i++) {
      const gy = horizonY + 4 + i * 2.5;
      const spread = (i + 1) * 3;
      const gx = sunX + Math.sin(waveTick + i) * spread;
      const gw = 12 + Math.cos(waveTick * 1.5 + i) * 8;

      ctx.fillStyle = sunT > 0.6 ? 'rgba(201, 178, 116, 0.45)' : 'rgba(255, 255, 255, 0.3)';
      ctx.fillRect(gx - gw / 2, gy, gw, 1.5);
    }

    ctx.drawImage(sunGlows[sunT > 0.6 ? 0 : 1], sunX - 34, sunY - 34);
    // Sun Orb with Golden Glow
    ctx.beginPath();
    ctx.arc(sunX, sunY, 10, 0, Math.PI * 2);
    ctx.fillStyle = sunT > 0.6 ? '#FFA726' : '#FFE082';

    ctx.fill();


    // Horizon Line
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, horizonY);
    ctx.lineTo(w, horizonY);
    ctx.stroke();

    scheduleFrame(render);
  }
  scheduleFrame(render);
})();
</script>
</body>
</html>
