  input[type="range"]::-webkit-slider-thumb {

<body>
<div class="ig07-wrap" role="region" aria-label="Diamond Hands Decay">
  <div class="ig07-hdr">
    <span class="ig07-inline-1">interest_game · conviction_half_life</span>
    <span class="ig07-inline-2" id="ig07-drawdownPill">DRAWDOWN: -45%</span>
  </div>

  <canvas class="ig07-canvas ig07-canvas" id="ig07-cv" width="394" height="120"></canvas>

  <div class="ig07-ctrl">
    <div class="ig07-ctrl-hdr">
      <span>PRICE DRAWDOWN SEVERITY</span>
      <span id="ig07-holdRateLabel">HOLD RATE: 62%</span>
    </div>
    <input type="range" id="ig07-ddSlider" min="5" max="85" value="45">
  </div>

  <div class="ig07-foot">
    <span id="ig07-statusLabel">CONVICTION: STEADY BAGHOLDING</span>
    <span class="ig07-inline-3">HALF-LIFE: 42 DAYS</span>
  </div>
</div>

<div class="ig07-caption" aria-hidden="true">Diamond Hands Decay</div>
<script>
(()=>{
  const cv = document.getElementById('ig07-cv');
  const ctx = cv.getContext('2d');
  const ddSlider = document.getElementById('ig07-ddSlider');
  const drawdownPill = document.getElementById('ig07-drawdownPill');
  const holdRateLabel = document.getElementById('ig07-holdRateLabel');
  const statusLabel = document.getElementById('ig07-statusLabel');

  let dd = 45;

  ddSlider.addEventListener('input', (e) => {
    dd = parseInt(e.target.value);
    drawdownPill.textContent = `DRAWDOWN: -${dd}%`;
    const hold = Math.round(100 * Math.exp(-dd * 0.015));
    holdRateLabel.textContent = `HOLD RATE: ${hold}%`;

    if (dd > 70) {
      statusLabel.textContent = 'CONVICTION: MASS CAPITULATION';
      statusLabel.style.color = 'var(--ig07-ss-coral)';
    } else if (dd > 40) {
      statusLabel.textContent = 'CONVICTION: STEADY BAGHOLDING';
      statusLabel.style.color = '#EDEDEA';
    } else {
      statusLabel.textContent = 'CONVICTION: UNWAVERING APES';
      statusLabel.style.color = 'var(--ig07-ss-mint)';
    }
  });

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let running = true;
  document.addEventListener('visibilitychange', () => { running = !document.hidden; if (running) requestAnimationFrame(render); });

  let t = 0;
  function render() {
    if (!running) return;
    t += 0.05;

    ctx.clearRect(0, 0, cv.width, cv.height);
    const w = cv.width, h = cv.height;
    const pad = 14;

    // Decay rate derived from drawdown
    const k = dd * 0.035;

    ctx.beginPath();
    for (let x = 0; x <= w - pad * 2; x += 3) {
      const u = x / (w - pad * 2); // 0 to 1 (0 to 90 days)
      const conv = Math.exp(-k * u) + Math.sin(u * 12 + t) * 0.02;
      const y = h - pad - Math.max(0.05, conv) * (h - pad * 2);
      if (x === 0) ctx.moveTo(pad + x, y);
      else ctx.lineTo(pad + x, y);
    }
    ctx.strokeStyle = dd > 65 ? '#FF4500' : '#00D084';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Half life line (50% mark)
    const hlY = h - pad - 0.5 * (h - pad * 2);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
    ctx.setLineDash([2, 2]);
    ctx.beginPath();
    ctx.moveTo(pad, hlY);
    ctx.lineTo(w - pad, hlY);
    ctx.stroke();
    ctx.setLineDash([]);

    if (!reduce) requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
})();
</script>
</body>
