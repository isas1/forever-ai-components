  .co02-screw{fill:var(--co02-line);stroke:#000;stroke-opacity:.35;stroke-width:.3}
  .co02-slot{stroke:#000;stroke-opacity:.5;stroke-width:.5}
  .co02-ring{fill:url(#co02-gr);stroke:#000;stroke-opacity:.4;stroke-width:.5}
  .co02-knurl{fill:none;stroke:#000;stroke-opacity:.38;stroke-width:2;stroke-dasharray:.6 1.5}
  .co02-hole{fill:var(--co02-hole)}
  .co02-face{fill:none;stroke:var(--co02-b3);stroke-width:.7}
  .co02-dot{fill:var(--co02-muted);opacity:.5;transition:opacity .2s}
  .co02-dot.co02-on{fill:var(--co02-ochre);opacity:1}
  .co02-lb{display:none;fill:var(--co02-muted);font:700 4.4px system-ui,sans-serif;letter-spacing:.14em;text-anchor:middle;text-transform:uppercase}
  .co02-lb.co02-on{fill:var(--co02-ink)}
  .co02-cut{fill:none;stroke:currentColor;stroke-width:.5;stroke-opacity:.55;stroke-linecap:round}
  .co02-key{color:var(--co02-b1);fill:url(#co02-gb);stroke:var(--co02-b3);stroke-width:.5}
  .co02-kh{fill:var(--co02-hole)}
  .co02-sh{color:#000;fill:#000;opacity:.34}
  .co02-bz{fill:var(--co02-hole);stroke:var(--co02-b2);stroke-width:.8}
  .co02-lens{fill:var(--co02-lamp);transition:fill .35s}
  .co02-glow{fill:url(#co02-gg);transform-origin:50px 70px;animation:co02-breathe 3.4s ease-in-out infinite}
  .co02-word{position:absolute;left:0;right:0;top:calc(50% + 31vmin);text-align:center;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding-left:.12em}
  .co02-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .co02-cap{position:fixed;left:8px;bottom:7px;font:10px var(--co02-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--co02-ink);opacity:.28}
  @keyframes co02-breathe{0%,100%{opacity:.7;transform:scale(.98)}50%{opacity:.9;transform:scale(1.02)}}
  @media (min-width:270px){.co02-lb{display:block}}
  @media (prefers-reduced-motion:reduce){.co02-glow{animation:none;opacity:.8}.co02-lens,.co02-lg,.co02-dot{transition:none}}

<script>
(function(){
  'use strict';
  var $=function(i){return document.getElementById(i)};
  var reduced=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var demoEnabled=window.__foreverPreview?.demoEnabled!==false;
  var root=$('co02-root'),key=$('co02-key'),sh=$('co02-sh'),word=$('co02-word'),sr=$('co02-sr');
  var MODES=[{n:'ask',a:-50},{n:'edits',a:0},{n:'plan',a:50}];
  var m=0,ang=-50,vel=0,tgt=-50,raf=0,last=0,demoT=0,demoI=0;
  function setTheme(t){if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}
  window.addEventListener('message',function(e){if(e.data&&e.data.type==='forever:theme')setTheme(e.data.theme)});
  function paint(){
    var a=ang.toFixed(2);
    key.setAttribute('transform','translate(50 46) rotate('+a+')');
    sh.setAttribute('transform','translate(51.2 48) rotate('+a+')');
  }
  function mark(){
    root.className='co02-root co02-m'+m;
    for(var i=0;i<3;i++){$('co02-d'+i).classList.toggle('co02-on',i===m);$('co02-l'+i).classList.toggle('co02-on',i===m);}
    word.textContent=MODES[m].n;sr.textContent='Mode: '+MODES[m].n;
  }
  function go(n){m=((n%3)+3)%3;tgt=MODES[m].a;mark();kick();}
  function frame(now){raf=0;if(document.hidden){last=0;return;}
    var dt=last?Math.min(now-last,50)/16.667:1;last=now;
    if(reduced()){ang=tgt;vel=0;}
    else{vel=(vel+(tgt-ang)*.2*dt)*Math.pow(.8,dt);ang+=vel*dt;}
    paint();
    if(Math.abs(vel)<.01&&Math.abs(tgt-ang)<.05){ang=tgt;vel=0;paint();last=0;return;}
    raf=requestAnimationFrame(frame);}
  function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame);}}
  function stopDemo(){clearTimeout(demoT);clearInterval(demoI);}
  function startDemo(d){if(!demoEnabled||reduced()||document.hidden)return;stopDemo();
    demoT=setTimeout(function(){go(m+1);demoI=setInterval(function(){if(demoEnabled&&!reduced()&&!document.hidden)go(m+1);},2600);},d);}
  function takeover(){demoEnabled=false;stopDemo();}
  window.addEventListener('forever:interactive',takeover);
  root.addEventListener('pointerdown',takeover,true);
  root.addEventListener('click',function(){takeover();go(m+1);});
  root.addEventListener('keydown',function(e){
    takeover();
    if(e.key===' '||e.key==='Enter'){e.preventDefault();go(m+1);}
    else if(e.key==='ArrowRight'||e.key==='ArrowUp'){e.preventDefault();go(m+1);}
    else if(e.key==='ArrowLeft'||e.key==='ArrowDown'){e.preventDefault();go(m-1);}
  });
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){if(raf){cancelAnimationFrame(raf);raf=0;}last=0;stopDemo();}
    else{kick();startDemo(900);}
  });
  mark();paint();
  startDemo(400);
})();
</script>
