<!-- THESIS: Evidence before action. OWN-WORLD: graphite/clay ledger. STORY: Demo cycles; input takes over. FIRST-VIEWPORT: record +44px actions. FORM: disclosure. FINISH: truthful state. -->
<section class="cw03-root" data-kind="permissions" role="group" aria-label="Permission review">
<header class="cw03-head"><h1 class="cw03-title">Permission review</h1><span class="cw03-mode">Demo</span></header>
<div class="cw03-summary"></div><select class="cw03-select" aria-label="Select permissions record"></select>
<div class="cw03-detail" data-fit-clip-ok aria-label="Selected evidence"></div>
<div class="cw03-actions"><button class="cw03-button" type="button">Review</button><button class="cw03-button" data-primary type="button">Refresh</button></div>
<div class="cw03-status" role="status" aria-live="polite"></div></section>
<script>(()=>{"use strict";
const cfg={"id":"permissions","demo":{"items":[{"id":"p1","tool":"Bash","command":"npm run test:parser","scope":"One request \u00b7 current checkout","state":"pending"},{"id":"p2","tool":"Read","command":"src/parser.ts","scope":"One file \u00b7 current checkout","state":"pending"},{"id":"p3","tool":"Bash","command":"git status --short","scope":"One request \u00b7 current checkout","state":"expired"}]},"action":"Review"},root=document.querySelector('.cw03-root'),pick=root.querySelector('.cw03-select'),summary=root.querySelector('.cw03-summary'),detail=root.querySelector('.cw03-detail'),status=root.querySelector('.cw03-status'),mode=root.querySelector('.cw03-mode'),buttons=[...root.querySelectorAll('.cw03-button')];
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let data=cfg.demo,local=false,connection='connected',updatedAt=null,selected=0,view=false,filter=false,manual=false,pending=false,timer=null,draft=false,lastInput=JSON.stringify(cfg.demo),pendingId=null,pendingBefore=null,pendingRequest=null;
const text=v=>v===null||v===undefined?'Unknown':typeof v==='object'?JSON.stringify(v):String(v);
const n=v=>typeof v==='number'&&Number.isFinite(v)?v.toLocaleString('en-US'):'Unknown';
const fields=(o,keys)=>keys.map(k=>k+': '+text(o[k])).join('\n');
function records(){
 let all=(Array.isArray(data.items)?data.items:[]).filter(x=>x&&typeof x==='object');
 all.sort((a,b)=>Number(b.state==='pending')-Number(a.state==='pending'));
 return all.map((x,i)=>({...x,id:typeof x.id==='string'?x.id:null,name:text(x.name??x.file??x.path??x.command??x.event??x.title??x.tool),state:text(x.state),detail:cfg.id==='diff'?text(x.patch):cfg.id==='instructions'?fields(x,['path','scope','loaded','content','conflicts']):fields(x,Object.keys(x))}));
}
function render(keepStatus=false){
 const items=records();selected=Math.min(Math.max(0,selected),Math.max(0,items.length-1));
 const item=items[selected];pick.replaceChildren();
 for(const [i,x]of items.entries()){const op=document.createElement('option');op.value=String(i);op.textContent=x.name+' · '+x.state;pick.append(op)}
 if(!items.length){const op=document.createElement('option');op.textContent='No records supplied';pick.append(op)}
 pick.value=String(selected);pick.disabled=!items.length;
 summary.textContent=items.length+' records · '+(item?item.state:'Unknown');
 detail.textContent=item?item.detail:'No data supplied. Ask host to refresh.';


 mode.textContent=local?'Local':'Demo';root.dataset.view=view?'detail':'list';root.dataset.alert=String(local&&connection!=='connected');
 buttons[0].textContent=view?'Back':'Review';buttons[1].textContent=view?'Deny':'Allow once';


 buttons[0].disabled=false;buttons[1].disabled=pending||local&&connection!=='connected'||!item?.id||item.state!=='pending';
 if(!keepStatus)status.textContent=local?(connection==='connected'?'Host data · '+(updatedAt??'time unknown'):connection==='stale'?'Stale data · refresh host':'Offline · last known data'):'Demo fixtures · '+(items.length?String(selected+1)+'/'+items.length:'empty');
}
function send(action,payload,wait=false){const requestId=cfg.id+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);if(wait){pending=true;pendingRequest=requestId;status.textContent='Pending host acknowledgement'}const out={asset:cfg.id,action,payload,requestId};root.dispatchEvent(new CustomEvent('workbench-action',{detail:out,bubbles:true,composed:true}));if(parent!==window)parent.postMessage({type:'forever:workbench:action',version:1,...out},'*');return requestId}
function take(){if(window.__foreverPreview?.surface!=='wall'){manual=true;sync()}}
function action(){
 take();const item=records()[selected];if(!item&&cfg.id!=='handoff'&&cfg.id!=='context'&&cfg.id!=='usage')return;
 if(cfg.id==='permissions'||cfg.id==='diff'){
 const decision=cfg.id==='permissions'?(view?'deny':'allow'):(view?'needs-work':item.state==='reviewed'?'pending':'reviewed');pendingId=item.id;pendingBefore=item.state;send(cfg.id==='permissions'?'permission-decision':'hunk-decision',{id:item.id,decision},local);
 if(local){render(true)}else{const raw=data.items.find(x=>x.id===item.id);if(raw)raw.state=decision==='allow'?'Decision sent':decision==='deny'?'Denied':decision;render();status.textContent='Demo · '+text(raw?.state)}return;
 }
 send('refresh',{});status.textContent=local?'Refresh requested':'Demo · refresh intent sent';
}
buttons[0].addEventListener('click',()=>{take();view=!view;render();buttons[0].setAttribute('aria-expanded',String(view))});
buttons[1].addEventListener('click',action);

pick.addEventListener('change',()=>{take();selected=Number(pick.value);render()});
root.addEventListener('pointerdown',take);root.addEventListener('keydown',e=>{if(['Enter',' ','ArrowDown','ArrowUp','Tab'].includes(e.key))take()});
window.addEventListener('message',e=>{if(e.source!==parent)return;const m=e.data;if(m?.type==='forever:theme'&&['light','dark'].includes(m.theme)){document.documentElement.dataset.theme=m.theme;return}if(m?.type!=='forever:workbench:state'||m.version!==1||m.asset!==cfg.id||!['demo','local'].includes(m.mode)||!['connected','offline','stale'].includes(m.connection)||!m.data||typeof m.data!=='object'||Array.isArray(m.data))return;let receipt=null;if(pending&&m.ack?.requestId===pendingRequest&&typeof m.ack.ok==='boolean'){pending=false;draft=!m.ack.ok&&cfg.id==='handoff';if(draft)view=true;receipt=(m.ack.ok?'Confirmed':'Rejected · Retry')+(typeof m.ack.message==='string'?' · '+m.ack.message.slice(0,160):'')}local=m.mode==='local';connection=m.connection;updatedAt=typeof m.updatedAt==='string'?m.updatedAt:null;const selectedId=records()[selected]?.id,signature=JSON.stringify(m.data),changed=signature!==lastInput;lastInput=signature;if(!m.ack&&pending&&changed){const ack=Array.isArray(m.data.items)&&m.data.items.some(x=>x?.id===pendingId&&typeof x.state==='string'&&x.state!==pendingBefore);if(ack){pending=false;draft=false}}if(changed&&!draft){data=structuredClone(m.data);const keep=records().findIndex(x=>x.id===selectedId);selected=keep<0?0:keep;}render(pending||draft);if(receipt)status.textContent=receipt;sync()});
function sync(){clearInterval(timer);timer=null;const p=window.__foreverPreview;if(document.hidden||reduced.matches||local||manual||(p&&p.demoEnabled===false))return;timer=setInterval(()=>{if(document.hidden)return;const list=records();if(list.length>1)selected=(selected+1)%list.length;render()},2600)}
window.addEventListener('forever:interactive',e=>{const p=e.detail??window.__foreverPreview;if(p?.surface!=='wall'&&p?.demoEnabled===false)manual=true;else if(p?.demoEnabled===true)manual=false;sync()});
document.addEventListener('visibilitychange',sync);reduced.addEventListener('change',sync);render();sync();
})();</script></body></html>
