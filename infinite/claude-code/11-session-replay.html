<style>

<!-- THESIS: Evidence before action. OWN-WORLD: graphite/clay ledger. STORY: Demo cycles; input takes over. FIRST-VIEWPORT: record +44px actions. FORM: disclosure. FINISH: truthful state. -->
<section class="cw11-root" data-kind="replay" role="group" aria-label="Session replay">
<header class="cw11-head"><h1 class="cw11-title">Session replay</h1><span class="cw11-mode">Demo</span></header>
<div class="cw11-summary"></div><select class="cw11-select" aria-label="Select replay record"></select>
<div class="cw11-detail" data-fit-clip-ok aria-label="Selected evidence"></div>
<div class="cw11-actions"><button class="cw11-button" type="button">Next</button><button class="cw11-button" data-primary type="button">Refresh</button></div>
<div class="cw11-status" role="status" aria-live="polite"></div></section>
<script>(()=>{"use strict";
const cfg={"id":"replay","demo":{"items":[{"id":"r1","time":"10:24:18","type":"tool","title":"Read parser source","detail":"Read src/parser.ts \u00b7 observed null input path."},{"id":"r2","time":"10:24:19","type":"test","title":"Parser checks passed","detail":"npm run test:parser \u00b7 exit 0 \u00b7 commit b62a1d07"},{"id":"r3","time":"10:24:20","type":"note","title":"Review requested","detail":"Hunk h1 awaits review. Replay is inspection only."}]},"action":"Next"},root=document.querySelector('.cw11-root'),pick=root.querySelector('.cw11-select'),summary=root.querySelector('.cw11-summary'),detail=root.querySelector('.cw11-detail'),status=root.querySelector('.cw11-status'),mode=root.querySelector('.cw11-mode'),buttons=[...root.querySelectorAll('.cw11-button')];
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let data=cfg.demo,local=false,connection='connected',updatedAt=null,selected=0,view=false,filter=false,manual=false,pending=false,timer=null,draft=false,lastInput=JSON.stringify(cfg.demo),pendingId=null,pendingBefore=null;
const text=v=>v===null||v===undefined?'Unknown':typeof v==='object'?JSON.stringify(v):String(v);
const n=v=>typeof v==='number'&&Number.isFinite(v)?v.toLocaleString('en-US'):'Unknown';
const fields=(o,keys)=>keys.map(k=>k+': '+text(o[k])).join('\n');
function records(){
 let all=(Array.isArray(data.items)?data.items:[]).filter(x=>x&&typeof x==='object');
 if(filter)all=all.filter(x=>x.state==='failed');
 return all.map((x,i)=>({...x,id:typeof x.id==='string'?x.id:null,name:text(x.name??x.file??x.path??x.command??x.event??x.title??x.tool),state:text(x.state),detail:cfg.id==='diff'?text(x.patch):cfg.id==='instructions'?fields(x,['path','scope','loaded','content','conflicts']):fields(x,Object.keys(x))}));
}
function render(keepStatus=false){
 const items=records();selected=Math.min(Math.max(0,selected),Math.max(0,items.length-1));
 const item=items[selected];pick.replaceChildren();
 for(const [i,x]of items.entries()){const op=document.createElement('option');op.value=String(i);op.textContent=x.name+' · '+x.state;pick.append(op)}
 if(!items.length){const op=document.createElement('option');op.textContent='No records supplied';pick.append(op)}
 pick.value=String(selected);pick.disabled=!items.length;
 summary.textContent=items.length+' records · '+(item?item.state:'Unknown');
 detail.textContent=item?item.detail:'No data supplied. Ask host to refresh.';


 mode.textContent=local?'Local':'Demo';root.dataset.view=view?'detail':'list';root.dataset.alert=String(local&&connection!=='connected');
 buttons[0].textContent=view?'Back':cfg.action;buttons[1].textContent='Refresh';


 const review=cfg.id==='permissions'||cfg.id==='diff';buttons[0].disabled=cfg.id==='handoff'&&(pending||local&&connection!=='connected'&&(view||innerHeight>329));buttons[1].disabled=pending||(review&&(local&&connection!=='connected'||!item||!item.id||(cfg.id==='permissions'&&item.state!=='pending')));
 if(!keepStatus)status.textContent=local?(connection==='connected'?'Host data · '+(updatedAt??'time unknown'):connection==='stale'?'Stale data · refresh host':'Offline · last known data'):'Demo fixtures · '+(items.length?String(selected+1)+'/'+items.length:'empty');
}
function send(action,payload,wait=false){const requestId=cfg.id+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);const out={asset:cfg.id,action,payload,requestId};root.dispatchEvent(new CustomEvent('workbench-action',{detail:out,bubbles:true,composed:true}));if(parent!==window)parent.postMessage({type:'forever:workbench:action',version:1,...out},'*');return requestId}
function take(){if(window.__foreverPreview?.surface!=='wall'){manual=true;sync()}}
function action(){
 take();const item=records()[selected];if(!item&&cfg.id!=='handoff'&&cfg.id!=='context'&&cfg.id!=='usage')return;
 send('refresh',{});status.textContent=local?'Refresh requested':'Demo · refresh intent sent';
}
buttons[0].addEventListener('click',()=>{take();const list=records();selected=list.length?(selected+1)%list.length:0;render()});
buttons[1].addEventListener('click',action);

pick.addEventListener('change',()=>{take();selected=Number(pick.value);render()});
root.addEventListener('pointerdown',take);root.addEventListener('keydown',e=>{if(['Enter',' ','ArrowDown','ArrowUp','Tab'].includes(e.key))take()});
window.addEventListener('message',e=>{if(e.source!==parent)return;const m=e.data;if(m?.type==='forever:theme'&&['light','dark'].includes(m.theme)){document.documentElement.dataset.theme=m.theme;return}if(m?.type!=='forever:workbench:state'||m.version!==1||m.asset!==cfg.id||!['demo','local'].includes(m.mode)||!['connected','offline','stale'].includes(m.connection)||!m.data||typeof m.data!=='object'||Array.isArray(m.data))return;local=m.mode==='local';connection=m.connection;updatedAt=typeof m.updatedAt==='string'?m.updatedAt:null;const signature=JSON.stringify(m.data),changed=signature!==lastInput;lastInput=signature;if(changed)data=structuredClone(m.data);render();sync()});
function sync(){clearInterval(timer);timer=null;const p=window.__foreverPreview;if(document.hidden||reduced.matches||local||manual||(p&&p.demoEnabled===false))return;timer=setInterval(()=>{if(document.hidden)return;const list=records();if(list.length>1)selected=(selected+1)%list.length;render()},2600)}
window.addEventListener('forever:interactive',e=>{const p=e.detail??window.__foreverPreview;if(p?.surface!=='wall'&&p?.demoEnabled===false)manual=true;else if(p?.demoEnabled===true)manual=false;sync()});
document.addEventListener('visibilitychange',sync);reduced.addEventListener('change',sync);render();sync();
})();</script></body></html>
