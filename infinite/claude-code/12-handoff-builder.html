<!-- THESIS: Evidence before action. OWN-WORLD: graphite/clay ledger. STORY: Demo cycles; input takes over. FIRST-VIEWPORT: record +44px actions. FORM: disclosure. FINISH: truthful state. -->
<section class="cw12-root" data-kind="handoff" role="group" aria-label="Handoff builder">
<header class="cw12-head"><h1 class="cw12-title">Handoff builder</h1><span class="cw12-mode">Demo</span></header>
<div class="cw12-summary"></div><select class="cw12-select" aria-label="Select handoff record"></select>
<textarea class="cw12-edit" hidden aria-label="Handoff field" spellcheck="false"></textarea>
<div class="cw12-actions"><button class="cw12-button" type="button">Save</button><button class="cw12-button" data-primary type="button">Refresh</button></div>
<div class="cw12-status" role="status" aria-live="polite"></div></section>
<script>(()=>{"use strict";
const cfg={"id":"handoff","demo":{"goal":"Handle null parser input","notes":"Added null guard; parser checks passed. UI check failed; inspect receipt.","nextSteps":"Review hunk h1, then repair UI check.","checks":[{"command":"npm run test:parser","state":"passed","commit":"b62a1d07"}]},"action":"Save"},root=document.querySelector('.cw12-root'),pick=root.querySelector('.cw12-select'),summary=root.querySelector('.cw12-summary'),edit=root.querySelector('.cw12-edit'),status=root.querySelector('.cw12-status'),mode=root.querySelector('.cw12-mode'),buttons=[...root.querySelectorAll('.cw12-button')];
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let data=cfg.demo,local=false,connection='connected',updatedAt=null,selected=0,view=false,manual=false,pending=false,timer=null,draft=false,lastInput=JSON.stringify(cfg.demo),pendingId=null,pendingBefore=null,pendingRequest=null;
const text=v=>v===null||v===undefined?'Unknown':typeof v==='object'?JSON.stringify(v):String(v);
function records(){
 if(cfg.id==='handoff')return ['goal','notes','nextSteps'].map(k=>({id:k,name:({goal:'Goal',notes:'Notes',nextSteps:'Next steps'})[k],state:'Edit',detail:text(data[k])}));

}
function render(keepStatus=false){
 const items=records();selected=Math.min(Math.max(0,selected),Math.max(0,items.length-1));
 const item=items[selected];pick.replaceChildren();
 for(const [i,x]of items.entries()){const op=document.createElement('option');op.value=String(i);op.textContent=x.name+' · '+x.state;pick.append(op)}
 if(!items.length){const op=document.createElement('option');op.textContent='No records supplied';pick.append(op)}
 pick.value=String(selected);pick.disabled=!items.length;
 summary.textContent='Editable session handoff';


 edit.hidden=false;edit.value=data[item?.id]??'';edit.setAttribute('aria-label',item?.name??'Handoff field');
 mode.textContent=local?'Local':'Demo';root.dataset.view=view?'detail':'list';root.dataset.alert=String(local&&connection!=='connected');
 buttons[0].textContent=view||innerHeight>329?'Save':'Edit';buttons[1].textContent='Export';


 buttons[0].disabled=pending||local&&connection!=='connected'&&(view||innerHeight>329);buttons[1].disabled=pending;
 if(!keepStatus)status.textContent=local?(connection==='connected'?'Host data · '+(updatedAt??'time unknown'):connection==='stale'?'Stale data · refresh host':'Offline · last known data'):'Demo fixtures · '+(items.length?String(selected+1)+'/'+items.length:'empty');
}
function send(action,payload,wait=false){const requestId=cfg.id+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);if(wait){pending=true;pendingRequest=requestId;status.textContent='Pending host acknowledgement'}const out={asset:cfg.id,action,payload,requestId};root.dispatchEvent(new CustomEvent('workbench-action',{detail:out,bubbles:true,composed:true}));if(parent!==window)parent.postMessage({type:'forever:workbench:action',version:1,...out},'*');return requestId}
function take(){if(window.__foreverPreview?.surface!=='wall'){manual=true;sync()}}
function action(){
 take();
 if(parent!==window){send('handoff-export',{goal:data.goal??'',notes:data.notes??'',nextSteps:data.nextSteps??'',draft});status.textContent='Export requested';return}
 const checks=(Array.isArray(data.checks)?data.checks:[]).map(x=>{x=x&&typeof x==='object'?x:{};return ['Command: '+text(x.command),'Result: '+text(x.state),'Commit: '+text(x.commit),'Exit: '+text(x.exitCode),'Time: '+text(x.completedAt)].join('\n')}).join('\n\n');
 const body=(local?'Local observations':'DEMO / illustrative')+'\nUpdated: '+text(updatedAt)+'\nProject: '+text(data.cwd??data.project)+'\nBranch: '+text(data.branch)+'\n\nGoal\n'+text(data.goal)+'\n\nNotes\n'+text(data.notes)+'\n\nNext steps\n'+text(data.nextSteps)+'\n\nChecks\n'+(checks||'No receipts supplied');const blob=new Blob([body],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='workbench-handoff.txt';a.click();URL.revokeObjectURL(a.href);status.textContent='Handoff exported';return;

}
buttons[0].addEventListener('click',()=>{take();if(cfg.id==='handoff'){if(innerHeight<=329&&!view){view=true;render();edit.focus();return}draft=local;view=false;send('handoff-save',{goal:data.goal??'',notes:data.notes??'',nextSteps:data.nextSteps??''},local);render(true);if(!local)status.textContent='Demo · handoff saved';return}});
buttons[1].addEventListener('click',action);
if(cfg.id==='handoff')edit.addEventListener('input',()=>{take();const item=records()[selected];if(item)data[item.id]=edit.value;draft=true;status.textContent='Unsaved edits'});
pick.addEventListener('change',()=>{take();selected=Number(pick.value);render()});
root.addEventListener('pointerdown',take);root.addEventListener('keydown',e=>{if(['Enter',' ','ArrowDown','ArrowUp','Tab'].includes(e.key))take()});
window.addEventListener('message',e=>{if(e.source!==parent)return;const m=e.data;if(m?.type==='forever:theme'&&['light','dark'].includes(m.theme)){document.documentElement.dataset.theme=m.theme;return}if(m?.type!=='forever:workbench:state'||m.version!==1||m.asset!==cfg.id||!['demo','local'].includes(m.mode)||!['connected','offline','stale'].includes(m.connection)||!m.data||typeof m.data!=='object'||Array.isArray(m.data))return;let receipt=null;if(pending&&m.ack?.requestId===pendingRequest&&typeof m.ack.ok==='boolean'){pending=false;draft=!m.ack.ok&&cfg.id==='handoff';if(draft)view=true;receipt=(m.ack.ok?'Confirmed':'Rejected · Retry')+(typeof m.ack.message==='string'?' · '+m.ack.message.slice(0,160):'')}local=m.mode==='local';connection=m.connection;updatedAt=typeof m.updatedAt==='string'?m.updatedAt:null;const signature=JSON.stringify(m.data),changed=signature!==lastInput;lastInput=signature;if(!m.ack&&pending&&changed){const ack=['goal','notes','nextSteps'].every(k=>m.data[k]===data[k]);if(ack){pending=false;draft=false}}if(changed&&!draft)data=structuredClone(m.data);render(pending||draft);if(receipt)status.textContent=receipt;sync()});
function sync(){clearInterval(timer);timer=null;const p=window.__foreverPreview;if(document.hidden||reduced.matches||local||manual||(p&&p.demoEnabled===false))return;timer=setInterval(()=>{if(document.hidden)return;const list=records();if(list.length>1)selected=(selected+1)%list.length;render()},2600)}
window.addEventListener('forever:interactive',e=>{const p=e.detail??window.__foreverPreview;if(p?.surface!=='wall'&&p?.demoEnabled===false)manual=true;else if(p?.demoEnabled===true)manual=false;sync()});
document.addEventListener('visibilitychange',sync);reduced.addEventListener('change',sync);render();sync();
})();</script></body></html>
