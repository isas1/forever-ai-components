<style>
:root{--bg:#141210;--surface:#1d1a17;--ink:#ede6da;--muted:#9a9084;--line:rgba(237,230,218,.14);--accent:#d97757;--on-accent:#1a0d07;

:root[data-theme="light"]{--bg:#f5f0e6;--surface:#ebe4d6;--ink:#211d18;--muted:#6b6256;--line:rgba(33,29,24,.16);--accent:#b4492b;--on-accent:#fff3ea;
--good:#4f7a36;--warn:#8a6410;--bad:#a8341c}
html,body{margin:0;height:100%;overflow:hidden;display:grid;place-items:center;background:var(--bg);color:var(--ink);
font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}
.cc01-root{box-sizing:border-box;width:clamp(180px,92vmin,640px);aspect-ratio:1;position:relative;display:grid;
grid-template-rows:1fr auto 1fr;align-items:center;justify-items:center;padding:clamp(14px,5vmin,32px);user-select:none;--pad:22px;--f:0}
.cc01-root *{box-sizing:border-box}
.cc01-root:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.cc01-track{grid-row:2;position:relative;width:100%;height:56px;touch-action:none;cursor:grab}
.cc01-track:active{cursor:grabbing}
.cc01-rail{position:absolute;left:var(--pad);right:var(--pad);top:50%;height:2px;margin-top:-1px;background:var(--line)}
.cc01-fill{position:absolute;left:var(--pad);right:var(--pad);top:50%;height:4px;margin-top:-2px;background:var(--accent);
transform-origin:0 50%;transform:scaleX(var(--fc,0))}
.cc01-tick{position:absolute;top:50%;left:calc(var(--pad) + var(--t) * (100% - 2 * var(--pad)));width:2px;height:18px;margin:-9px 0 0 -1px;
background:var(--muted)}
.cc01-tick[data-on="1"]{background:var(--accent)}
.cc01-puck{position:absolute;top:50%;left:calc(var(--pad) + var(--f) * (100% - 2 * var(--pad)));width:40px;height:40px;
border-radius:50%;background:var(--surface);border:2px solid var(--ink);color:var(--ink);display:grid;place-items:center;pointer-events:none}
.cc01-root[data-m="1"] .cc01-puck{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.cc01-root[data-m="2"] .cc01-puck{background:var(--good);border-color:var(--good);color:var(--on-accent)}
.cc01-glyph{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cc01-glyph g{display:none}
.cc01-root[data-m="0"] .cc01-g0,.cc01-root[data-m="1"] .cc01-g1,.cc01-root[data-m="2"] .cc01-g2{display:inline}
.cc01-name{grid-row:3;align-self:start;padding-top:clamp(8px,3vmin,20px);font:700 clamp(16px,5vmin,28px)/1 ui-monospace,"SF Mono",Menlo,monospace;
letter-spacing:-.02em;white-space:nowrap}
.cc01-sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.cc01-tick[data-t="0"]{--t:0}.cc01-tick[data-t="1"]{--t:.5}.cc01-tick[data-t="2"]{--t:1}
.cc01-cap{position:fixed;left:8px;bottom:2px;font:8px/1 system-ui,sans-serif;color:var(--muted);opacity:.65;pointer-events:none}

<body><div class="cc01-root" id="cc01-root" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="2" aria-valuenow="0" aria-valuetext="default"
aria-label="Claude Code permission mode: default asks, acceptEdits auto-approves file edits, plan is read-only. Drag the puck, or use arrow keys, Home, End, Enter or Space to cycle."><div class="cc01-track" id="cc01-track"><div class="cc01-rail"></div><div class="cc01-fill" id="cc01-fill"></div><div class="cc01-tick" data-t="0"></div><div class="cc01-tick" data-t="1"></div><div class="cc01-tick" data-t="2"></div><div class="cc01-puck" id="cc01-puck"><svg class="cc01-glyph" viewBox="0 0 24 24" aria-hidden="true"><g class="cc01-g0"><circle cx="12" cy="12" r="6"/></g><g class="cc01-g1"><path d="M5 6l6 6-6 6M13 6l6 6-6 6"/></g><g class="cc01-g2"><path d="M8 5v14M16 5v14"/></g></svg></div></div><span class="cc01-name" id="cc01-name">default</span><span class="cc01-sr" id="cc01-live" aria-live="polite"></span></div><div class="cc01-cap" aria-hidden="true">Permission mode</div>
<script>
(function () {
'use strict';
var root = document.getElementById('cc01-root'), track = document.getElementById('cc01-track');
var puck = document.getElementById('cc01-puck'), fill = document.getElementById('cc01-fill');
var nameEl = document.getElementById('cc01-name'), live = document.getElementById('cc01-live');
var ticks = track.querySelectorAll('.cc01-tick');
var MODES = ['default', 'acceptEdits', 'plan'];
var NOTES = ['asks before edits', 'edits auto-approved', 'read-only'];
var PAD = 22;
var mq = matchMedia('(prefers-reduced-motion: reduce)');
var reduce = function () { return mq.matches; };
var s = { mode: 0, target: 0, pos: 0, vel: 0, press: 0, pv: 0, pulse: 0, locked: true, drag: false, off: 0, hist: [] };
var raf = 0, last = 0, inView = true;
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function rubber(r) { return r < 0 ? r * 0.3 : r > 2 ? 2 + (r - 2) * 0.3 : r; }
function snapToTarget() {
s.pos = s.target; s.vel = 0; s.press = s.drag ? 1 : 0; s.pv = 0; s.pulse = 0; s.locked = true;
}
function step(dt) {
if (!s.drag) {
s.vel = (s.vel + (s.target - s.pos) * 0.2 * dt) * Math.pow(0.76, dt);
s.pos += s.vel * dt;
}
var pt = s.drag ? 1 : 0;
s.pv = (s.pv + (pt - s.press) * 0.3 * dt) * Math.pow(0.7, dt);
s.press += s.pv * dt;
s.pulse *= Math.pow(0.84, dt);
var still = !s.drag && Math.abs(s.target - s.pos) < 0.004 && Math.abs(s.vel) < 0.004;
if (still && !s.locked) { s.pos = s.target; s.vel = 0; s.locked = true; s.pulse = 1; }
var calm = Math.abs(pt - s.press) < 0.01 && Math.abs(s.pv) < 0.01 && s.pulse < 0.02;
if (still && s.locked && calm) { snapToTarget(); return false; }
return true;
}
function draw() {
var f = s.pos / 2, idx = clamp(Math.round(s.pos), 0, 2);
root.style.setProperty('--f', f.toFixed(4));
root.style.setProperty('--fc', clamp(f, 0, 1).toFixed(4));
root.dataset.m = idx;
puck.style.transform = 'translate(-50%,-50%) scale(' + (1 - 0.1 * s.press).toFixed(3) + ')';
if (nameEl.textContent !== MODES[idx]) nameEl.textContent = MODES[idx];
for (var i = 0; i < 3; i++) {
ticks[i].dataset.on = i <= idx ? '1' : '0';
ticks[i].style.transform = 'scaleY(' + (i === idx ? 1 + 0.7 * s.pulse : 1).toFixed(3) + ')';
}
}
function stop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }
function frame(now) {
var dt = last ? Math.min(now - last, 50) / 16.667 : 1;
last = now;
var moving = reduce() ? (snapToTarget(), false) : step(dt);
draw();
raf = moving ? requestAnimationFrame(frame) : 0;
}
function kick() {
if (reduce()) { stop(); snapToTarget(); draw(); return; }
if (!raf && !document.hidden && inView) { last = 0; raf = requestAnimationFrame(frame); }
}
function announce(msg) {
live.textContent = '';
requestAnimationFrame(function () { live.textContent = msg; });
}
// Single mutator of the chosen mode: state, ARIA, announcement and wake-up in one place.
function commit(i, bump) {
i = clamp(Math.round(i), 0, 2);
var changed = i !== s.mode;
s.mode = s.target = i;
s.locked = false;
if (bump) s.press = 1;
root.setAttribute('aria-valuenow', String(i));
root.setAttribute('aria-valuetext', MODES[i]);
if (changed || bump) announce(MODES[i] + ': ' + NOTES[i]);
kick();
}
function rawAt(x) {
var r = track.getBoundingClientRect();
return (x - r.left - PAD) / Math.max(20, r.width - 2 * PAD) * 2;
}
track.addEventListener('pointerdown', function (e) {
if (e.button) return;
track.setPointerCapture(e.pointerId);
var raw = rawAt(e.clientX);
s.hist = [];
if (Math.abs(raw - s.pos) > 0.45) { commit(raw); return; }
s.drag = true; s.locked = false; s.off = raw - s.pos; s.vel = 0;
s.hist.push([s.pos, performance.now()]);
kick();
});
track.addEventListener('pointermove', function (e) {
if (!s.drag) return;
s.pos = rubber(rawAt(e.clientX) - s.off);
var now = performance.now();
s.hist.push([s.pos, now]);
while (s.hist.length > 3) s.hist.shift();
kick();
});
function release() {
if (!s.drag) return;
s.drag = false;
var h = s.hist, v = 0;
if (h.length > 1) v = (h[h.length - 1][0] - h[0][0]) / Math.max(1, h[h.length - 1][1] - h[0][1]) * 16.667;
v = clamp(v, -0.12, 0.12);
s.vel = v;
commit(clamp(s.pos + v * 8, 0, 2));
}
track.addEventListener('pointerup', release);
track.addEventListener('pointercancel', release);
root.addEventListener('keydown', function (e) {
var k = e.key, i = s.mode;
if (k === 'ArrowRight' || k === 'ArrowUp') i = e.shiftKey ? 2 : i + 1;
else if (k === 'ArrowLeft' || k === 'ArrowDown') i = e.shiftKey ? 0 : i - 1;
else if (k === 'Home') i = 0;
else if (k === 'End') i = 2;
else if (k === 'Enter' || k === ' ') i = e.shiftKey ? (i + 2) % 3 : (i + 1) % 3;
else return;
e.preventDefault();
commit(i, true);
});
window.addEventListener('message', function (e) {
if (e.source !== parent || !e.data || e.data.type !== 'forever:theme') return;
if (e.data.theme === 'light' || e.data.theme === 'dark') {
document.documentElement.setAttribute('data-theme', e.data.theme);
draw();
}
});
mq.addEventListener('change', function () { if (reduce()) { stop(); snapToTarget(); draw(); } });
if ('IntersectionObserver' in window) {
new IntersectionObserver(function (es) {
inView = es[0].isIntersecting;
if (!inView) stop(); else draw();
}, { threshold: 0 }).observe(root);
}
document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); else draw(); });
window.addEventListener('pagehide', stop);
root.style.setProperty('--pad', PAD + 'px');
snapToTarget();
draw();
// Demo uses the same state mutators as manual controls; no remote Claude session.
var demoRoot=document.getElementById('cc01-root'),demoClock=0,demoAge=0,demoStep=0,demoVisible=true;
var demoEnabled=window.__foreverPreview?.demoEnabled!==false;
function demoTick(){commit((s.mode+1)%3, true);}
function syncDemo(){
clearInterval(demoClock);demoClock=0;
if(!demoEnabled||reduce()||document.hidden||!demoVisible)return;
demoClock=setInterval(function(){demoAge+=250;if(demoAge>=1000){demoAge=-2200;demoTick()}},250);
}
function takeover(){
if(window.__foreverPreview?.surface==='wall')return;
if(!demoEnabled)return;demoEnabled=false;clearInterval(demoClock);demoClock=0;
}
['pointerdown','keydown','input'].forEach(function(type){demoRoot.addEventListener(type,takeover,true)});
window.addEventListener('forever:interactive',takeover);
window.addEventListener('pagehide',function(){demoEnabled=false;clearInterval(demoClock)});
document.addEventListener('visibilitychange',function(){syncDemo();if(!document.hidden)kick()});
mq.addEventListener('change',syncDemo);
if('IntersectionObserver' in window)new IntersectionObserver(function(es){demoVisible=es[0].isIntersecting;syncDemo();if(demoVisible)kick()}).observe(demoRoot);
syncDemo();
})();
</script>
