<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Hook rail — Claude Code. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="component-profile" content="tile">
<meta name="forever-preview-lifecycle" content="demo-v1">
<title>Claude Code · Hook rail</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})();</script>
<style>
:root{--bg:#141210;--surface:#1d1a17;--ink:#ede6da;--muted:#9a9084;--line:rgba(237,230,218,.14);--accent:#d97757;--on-accent:#1a0d07;
    --good:#8fb573;--warn:#e0b350;--bad:#e5694f}
:root[data-theme="light"]{--bg:#f5f0e6;--surface:#ebe4d6;--ink:#211d18;--muted:#6b6256;--line:rgba(33,29,24,.16);--accent:#b4492b;--on-accent:#fff3ea;
    --good:#4f7a36;--warn:#8a6410;--bad:#a8341c}
html,body{margin:0;height:100%;overflow:hidden;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:600 13px/1 ui-monospace,"SF Mono",Menlo,monospace}
.cc06-root{box-sizing:border-box;width:clamp(180px,92vmin,640px);aspect-ratio:1;display:grid;grid-template-rows:1fr 44px;padding:clamp(8px,3vmin,24px);user-select:none;position:relative}
.cc06-root *{box-sizing:border-box}
.cc06-stage{position:relative;min-height:0}
.cc06-cv{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.cc06-gate{position:absolute;top:50%;width:44px;height:max(44px,64%);transform:translate(-50%,-50%);margin:0;padding:0;border:0;border-radius:5px;background:transparent;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.cc06-gate:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cc06-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;white-space:nowrap}
.cc06-val{font-size:clamp(16px,5vmin,28px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cc06-val[data-v="2"]{color:var(--bad)}
.cc06-val[data-v="0"]{color:var(--good)}
.cc06-call{color:var(--muted);font-size:13px}
.cc06-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.cc06-cap{position:fixed;left:8px;bottom:2px;font:8px/1 system-ui,sans-serif;color:var(--muted);opacity:.65;pointer-events:none}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/claude-code/16-hook-rail.html",
 "title": "Hook rail",
 "description": "Arm hook gates and watch a synthetic tool call pass or stop. Warm graphite and clay instrument palette.",
 "useWhen": "Illustrative local developer-tool controls.",
 "avoidWhen": "Real Claude commands or persistent storage are needed.",
 "agentPrompt": "Keep reviewed graphite/clay palette (clean-modern exception), state mutators, dt springs, theme hook, demo-v1 takeover, reduced motion, visibility guards and keyboard/touch controls. Synthetic data only.",
 "editableAreas": [

 ],

 ],

 ],
 "tier": "curated",
 "labels": [

 ]

</head>
<body>
<div class="cc06-root" id="cc06-root" role="group" aria-label="Hook rail: three PreToolUse hooks guard a tool call. Tap a hook to arm or disarm it; a seeded call then runs the rail and exit 2 means a hook blocked it, exit 0 means it passed.">
<div class="cc06-stage" id="cc06-stage">
  <canvas class="cc06-cv" id="cc06-cv" aria-hidden="true"></canvas>
  <button class="cc06-gate" type="button" aria-pressed="true"></button>
  <button class="cc06-gate" type="button" aria-pressed="true"></button>
  <button class="cc06-gate" type="button" aria-pressed="false"></button>
</div>
<div class="cc06-bar"><span class="cc06-val" id="cc06-val">exit 2</span><span class="cc06-call" id="cc06-call">rm -rf</span></div>
<span class="cc06-sr" id="cc06-live" aria-live="polite"></span>
</div>
<div class="cc06-cap" aria-hidden="true">Hook rail</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const stage=$('cc06-stage'),cv=$('cc06-cv'),cx=cv.getContext('2d'),val=$('cc06-val'),callEl=$('cc06-call'),live=$('cc06-live');
const btns=[...stage.querySelectorAll('.cc06-gate')];
const mq=matchMedia('(prefers-reduced-motion: reduce)'),reduce=()=>mq.matches;
const G=[{call:'rm -rf',armed:true,d:1,v:0},{call:'.env',armed:true,d:1,v:0},{call:'push -f',armed:false,d:0,v:0}];
const GX=[.23,.5,.77],X0=.04,X1=.94;
const run={i:0,x:0,v:0,ph:'go',tm:0,tv:0};
const C={};let P=[],fires=0,raf=0,last=0,inView=true;
const blockedAt=i=>G[i].armed?i:-1; // hook k vetoes only the call it guards; other armed hooks let it pass
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function readTokens(){const cs=getComputedStyle(document.documentElement);for(const k of['ink','muted','line','accent','good','bad'])C[k]=cs.getPropertyValue('--'+k).trim()}
function say(m){live.textContent='';setTimeout(()=>{live.textContent=m},40)}
function labels(){G.forEach((g,i)=>{btns[i].setAttribute('aria-pressed',String(g.armed));btns[i].setAttribute('aria-label','Hook '+(i+1)+' blocks '+g.call+', '+(g.armed?'armed':'off'))})}
function settle(quiet){const b=blockedAt(run.i),code=b<0?0:2;
val.textContent='exit '+code;val.dataset.v=code;
if(!quiet)say(G[run.i].call+(code?' blocked by hook '+(b+1):' passed all hooks')+', exit '+code)}
// single mutator: toggling a hook re-fires the call that hook guards
function commit(i){G[i].armed=!G[i].armed;labels();fire(i)}
function fire(i){fires++;Object.assign(run,{i,x:X0,v:0,ph:'go',tm:0,tv:0});P=[];
val.textContent='exit –';val.dataset.v='';callEl.textContent=G[i].call;kick()}
function shatter(b){const r=rng(fires*97+b);
for(let k=0;k<16;k++)P.push({x:GX[b]-.03,y:(r()-.5)*.05,vx:-run.v*(.1+r()*.45)+(r()-.5)*.006,vy:(r()-.5)*.018-.003,l:.7+r()*.3})}
function snapToTarget(){
for(const g of G){g.d=g.armed?1:0;g.v=0}
P=[];const b=blockedAt(run.i);
if(run.ph==='go'){run.ph=b<0?'done':'dead';run.x=b<0?X1:GX[b]-.035;settle(true)}
run.tm=run.ph==='done'?1:0;run.tv=0}
function step(dt){let m=false;
for(const g of G){const t=g.armed?1:0;g.v=(g.v+(t-g.d)*.16*dt)*Math.pow(.58,dt);g.d+=g.v*dt;
  if(Math.abs(t-g.d)>.004||Math.abs(g.v)>.004)m=true;else{g.d=t;g.v=0}}
if(run.ph==='go'){m=true;const b=blockedAt(run.i),end=b<0?X1:GX[b]-.035;
  run.v=Math.min(run.v+.0014*dt,.03);run.x+=run.v*dt;
  if(run.x>=end){run.x=end;run.ph=b<0?'done':'dead';if(b<0)run.tv=.1;else{shatter(b);G[b].v-=.05}settle()}}
const tt=run.ph==='done'?1:0;run.tv=(run.tv+(tt-run.tm)*.2*dt)*Math.pow(.55,dt);run.tm+=run.tv*dt;
if(Math.abs(tt-run.tm)>.004||Math.abs(run.tv)>.004)m=true;else{run.tm=tt;run.tv=0}
for(const p of P){p.vx*=Math.pow(.93,dt);p.vy=(p.vy+.0004*dt)*Math.pow(.93,dt);p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=.022*dt}
P=P.filter(p=>p.l>0);if(P.length)m=true;
return m}
function line(a,b,c,d,col,lw){cx.strokeStyle=col;cx.lineWidth=lw;cx.beginPath();cx.moveTo(a,b);cx.lineTo(c,d);cx.stroke()}
function draw(){const w=cv.clientWidth,h=cv.clientHeight;cx.clearRect(0,0,w,h);if(!w||!h)return;
const y=h/2,s=Math.max(7,w*.04),H=Math.min(h*.62,w*.4),done=run.ph==='done',bi=run.ph==='dead'?blockedAt(run.i):-1;
line(w*X0,y,w*X1,y,C.line,2);
cx.strokeStyle=C.muted;cx.lineWidth=1.5;cx.beginPath();cx.arc(w*X0,y,s*.5,0,7);cx.stroke();
const t=s*1.3,tx=w*X1;cx.strokeStyle=done?C.good:C.muted;cx.lineWidth=2;cx.setLineDash(done?[]:[3,3]);cx.strokeRect(tx-t,y-t,t*2,t*2);cx.setLineDash([]);
if(run.tm>.01){const k=run.tm;cx.strokeStyle=C.good;cx.lineWidth=2.5;cx.beginPath();cx.moveTo(tx-t*.5*k,y);cx.lineTo(tx-t*.1*k,y+t*.4*k);cx.lineTo(tx+t*.55*k,y-t*.4*k);cx.stroke()}
G.forEach((g,i)=>{const gx=w*GX[i],top=y-H/2,col=bi===i?C.bad:g.armed?C.accent:C.muted;
  line(gx-7,top,gx+7,top,C.muted,2);line(gx-7,y+H/2,gx+7,y+H/2,C.muted,2);
  const L=H*Math.max(0,Math.min(1.04,g.d));if(L>.5)line(gx,top,gx,top+L,col,2+2*Math.min(1,g.d));
  if(bi===i){const q=s*.9;line(gx-q,y-q,gx+q,y+q,C.bad,2.5);line(gx-q,y+q,gx+q,y-q,C.bad,2.5)}});
if(run.ph==='go'){const px=w*run.x;line(px-w*run.v*7,y,px,y,C.ink,2);cx.fillStyle=C.ink;cx.fillRect(px-s/2,y-s/2,s,s)}
cx.fillStyle=C.bad;const q=Math.max(2,w*.012);
for(const p of P){cx.globalAlpha=Math.min(1,p.l);cx.fillRect(w*p.x-q/2,y+p.y*w-q/2,q,q)}cx.globalAlpha=1}
function layout(){const dpr=Math.min(devicePixelRatio||1,2),r=cv.getBoundingClientRect();
cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));cx.setTransform(dpr,0,0,dpr,0,0);
btns.forEach((b,i)=>{b.style.left=GX[i]*r.width+'px'});draw()}
function frame(now){const dt=last?Math.min(now-last,50)/16.667:1;last=now;
const moving=reduce()?(snapToTarget(),false):step(dt);draw();raf=moving?requestAnimationFrame(frame):0}
function stop(){if(raf){cancelAnimationFrame(raf);raf=0}}
function kick(){if(reduce()){stop();snapToTarget();draw();return}
if(!raf&&!document.hidden&&inView){last=0;raf=requestAnimationFrame(frame)}}
// press anticipation: the gate leans toward the state it is about to take
function lean(e){const i=btns.indexOf(e.target.closest('.cc06-gate'));
if(i<0||reduce()||(e.type==='keydown'&&e.key!==' '&&e.key!=='Enter'))return;
G[i].v+=G[i].armed?-.05:.05;kick()}
stage.addEventListener('pointerdown',lean);stage.addEventListener('keydown',lean);
btns.forEach((b,i)=>b.addEventListener('click',()=>commit(i)));
stage.addEventListener('keydown',e=>{const i=btns.indexOf(document.activeElement),n=btns.length;let j=-1;
if(e.key==='ArrowRight'||e.key==='ArrowDown')j=Math.min(n-1,i+1);
else if(e.key==='ArrowLeft'||e.key==='ArrowUp')j=Math.max(0,i-1);
else if(e.key==='Home')j=0;else if(e.key==='End')j=n-1;
if(j>=0){e.preventDefault();btns[j].focus()}});
mq.addEventListener('change',()=>{if(reduce()){stop();snapToTarget();draw()}});
if('IntersectionObserver' in window)new IntersectionObserver(es=>{inView=es[0].isIntersecting;if(!inView)stop();else draw()},{threshold:0}).observe(stage);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else draw()});
addEventListener('pagehide',stop);
addEventListener('message',e=>{if(e.source!==parent)return;const m=e.data;
if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){document.documentElement.dataset.theme=m.theme;readTokens();draw()}});
readTokens();labels();snapToTarget();new ResizeObserver(layout).observe(stage);layout();
// Demo uses the same state mutators as manual controls; no remote Claude session.
var demoRoot=document.getElementById('cc06-root'),demoClock=0,demoAge=0,demoStep=0,demoVisible=true;
var demoEnabled=window.__foreverPreview?.demoEnabled!==false;
function demoTick(){fire((run.i+1)%G.length);}
function syncDemo(){
clearInterval(demoClock);demoClock=0;
if(!demoEnabled||reduce()||document.hidden||!demoVisible)return;
demoClock=setInterval(function(){demoAge+=250;if(demoAge>=1000){demoAge=-2200;demoTick()}},250);
}
function takeover(){
if(window.__foreverPreview?.surface==='wall')return;
if(!demoEnabled)return;demoEnabled=false;clearInterval(demoClock);demoClock=0;
}
['pointerdown','keydown','input'].forEach(function(type){demoRoot.addEventListener(type,takeover,true)});
window.addEventListener('forever:interactive',takeover);
window.addEventListener('pagehide',function(){demoEnabled=false;clearInterval(demoClock)});
document.addEventListener('visibilitychange',function(){syncDemo();if(!document.hidden)kick()});
mq.addEventListener('change',syncDemo);
if('IntersectionObserver' in window)new IntersectionObserver(function(es){demoVisible=es[0].isIntersecting;syncDemo();if(demoVisible)kick()}).observe(demoRoot);
syncDemo();
})();
</script>
</body>
</html>
