<style>
:root{--bg:#141210;--surface:#1d1a17;--ink:#ede6da;--muted:#9a9084;--line:rgba(237,230,218,.14);--accent:#d97757;--on-accent:#1a0d07;--good:#8fb573;--warn:#e0b350;--bad:#e5694f}
:root[data-theme="light"]{--bg:#f5f0e6;--surface:#ebe4d6;--ink:#211d18;--muted:#6b6256;--line:rgba(33,29,24,.16);--accent:#b4492b;--on-accent:#fff3ea;--good:#4f7a36;--warn:#8a6410;--bad:#a8341c}

.cc16-root{box-sizing:border-box;width:clamp(180px,92vmin,640px);aspect-ratio:1;position:relative;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:8px;padding:clamp(12px,5vmin,28px);overflow:hidden}
.cc16-root *{box-sizing:border-box}
.cc16-file{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:0}
.cc16-n{position:absolute;top:0;right:10px;height:26px;display:flex;align-items:center;font-variant-numeric:tabular-nums;color:var(--muted)}
.cc16-row{position:absolute;left:10px;top:0;border-radius:2px;background:var(--accent);transition:background-color .7s ease-out,opacity .25s}
.cc16-row.cc16-set{background:var(--muted)}
.cc16-in{position:relative;height:44px}

.cc16-inp{width:100%;height:44px;margin:0;padding:0 10px 0 30px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:5px;font:16px ui-monospace,"SF Mono",Menlo,monospace}
.cc16-inp::placeholder{color:var(--muted);opacity:1}
.cc16-inp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cc16-fly{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;background:var(--accent);color:var(--on-accent);border-radius:3px;pointer-events:none;font-size:13px}
.cc16-fly span{display:block;padding:0 10px}
.cc16-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

.cc16-cap{position:fixed;left:8px;bottom:2px;font:8px/1 system-ui,sans-serif;color:var(--muted);opacity:.65;pointer-events:none}

<div class="cc16-root" id="cc16-root" role="group" aria-label="CLAUDE.md memory file. Type a note after the hash and press Enter to append it as a new line. Esc clears the note.">
<div class="cc16-file" id="cc16-file"><span class="cc16-n" id="cc16-n"></span></div>
<div class="cc16-in"><b aria-hidden="true">#</b><input class="cc16-inp" id="cc16-inp" type="text" aria-label="Memory note" placeholder="note" maxlength="80" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"></div>

<script>(function(){
var $=function(i){return document.getElementById(i)};
var root=$('cc16-root'),file=$('cc16-file'),cnt=$('cc16-n'),inp=$('cc16-inp'),live=$('cc16-live');
var mq=matchMedia('(prefers-reduced-motion: reduce)'),reduce=function(){return mq.matches};
var raf=0,last=0,inView=true,tm=0;
var HEAD=26,PAD=10,K=.16,CD=2*.85*Math.sqrt(K),FK=.03,FC=2*.7*Math.sqrt(FK);
var lines=[],air=[],bump=0,bv=0,M={pitch:14,cap:4,bw:100,bh:5};
function mk(txt){var n=Math.min(txt.length,32);return{len:n,y:0,v:0,el:null,txt:txt}}
function row(l,set){var e=document.createElement('div');e.className='cc16-row'+(set?' cc16-set':'');file.appendChild(e);l.el=e;
if(!set)setTimeout(function(){e.classList.add('cc16-set')},30)}
function announce(m){clearTimeout(tm);live.textContent='';tm=setTimeout(function(){live.textContent=m},30)}
function metrics(){var ah=file.clientHeight-HEAD-PAD;M.pitch=Math.max(14,Math.min(30,ah/7));
M.cap=Math.max(1,Math.floor(ah/M.pitch));M.bw=file.clientWidth-2*PAD;M.bh=Math.max(4,Math.round(M.pitch*.38))}
function off(){return Math.max(0,lines.length+air.length-M.cap)}
function slotY(i){return HEAD+(i-off())*M.pitch+(M.pitch-M.bh)/2}
function frac(l){return Math.max(.12,l.len/32)}
function land(a){air.shift();if(a.el.parentNode)a.el.parentNode.removeChild(a.el);
var l=mk(a.txt);l.y=slotY(lines.length);lines.push(l);row(l,false);bv+=1.6;
announce('Filed to CLAUDE.md: '+a.txt+'. '+lines.length+(lines.length===1?' line':' lines'))}
function step(dt){var moving=false,i,l,t,a;
for(i=0;i<lines.length;i++){l=lines[i];t=slotY(i);
  l.v+=(-(l.y-t)*K-CD*l.v)*dt;l.y+=l.v*dt;
  if(Math.abs(l.y-t)<.05&&Math.abs(l.v)<.05){l.y=t;l.v=0}else moving=true}
for(i=0;i<air.length;i++){a=air[i];a.v+=(-(a.p-1)*FK-FC*a.v)*dt;a.p+=a.v*dt;moving=true}
while(air.length&&Math.abs(air[0].p-1)<.004&&Math.abs(air[0].v)<.004)land(air[0]);
bv+=(-bump*K-CD*bv)*dt;bump+=bv*dt;
if(Math.abs(bump)<.02&&Math.abs(bv)<.02){bump=0;bv=0}else moving=true;
return moving||air.length>0}
function snapToTarget(){while(air.length)land(air[0]);
for(var i=0;i<lines.length;i++){lines[i].y=slotY(i);lines[i].v=0}bump=0;bv=0}
function draw(){var i,l,o=off(),n=lines.length,rr=root.getBoundingClientRect(),fr=file.getBoundingClientRect(),ir=inp.getBoundingClientRect();
cnt.textContent=n+(n===1?' line':' lines');
file.style.transform='translateY('+bump.toFixed(2)+'px)';
for(i=0;i<n;i++){l=lines[i];
  if(i-o<-1&&l.el){l.el.parentNode.removeChild(l.el);l.el=null}
  if(!l.el)continue;
  l.el.style.width=(frac(l)*M.bw).toFixed(1)+'px';l.el.style.height=M.bh+'px';
  l.el.style.opacity=i-o<0?0:1;
  l.el.style.transform='translateY('+l.y.toFixed(2)+'px)'}
for(i=0;i<air.length;i++){var a=air[i],p=a.p,q=1-p,
  ex=fr.left-rr.left+PAD,ey=fr.top-rr.top+slotY(n+i),ew=frac(a)*M.bw,
  sx=ir.left-rr.left,sy=ir.top-rr.top,
  cx=(sx+ex)/2,cy=ey-.3*Math.abs(sy-ey)-12,
  x=q*q*sx+2*q*p*cx+p*p*ex,y=q*q*sy+2*q*p*cy+p*p*ey,
  w=ir.width+(ew-ir.width)*p,h=ir.height+(M.bh-ir.height)*p;
  a.el.style.transform='translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px)';
  a.el.style.width=w.toFixed(1)+'px';a.el.style.height=h.toFixed(1)+'px';
  a.el.style.lineHeight=h.toFixed(1)+'px';a.el.firstChild.style.opacity=Math.max(0,1-p/.6).toFixed(2)}}
function stop(){if(raf){cancelAnimationFrame(raf);raf=0}}
function frame(now){var dt=last?Math.min(now-last,50)/16.667:1;last=now;
var moving=reduce()?(snapToTarget(),false):step(dt);draw();raf=moving?requestAnimationFrame(frame):0}
function kick(){if(reduce()){stop();snapToTarget();draw();return}
if(!raf&&!document.hidden&&inView){last=0;raf=requestAnimationFrame(frame)}}
function submit(){var t=inp.value.replace(/^\s*#\s*/,'').replace(/\s+/g,' ').trim();
if(!t){bv-=1.6;announce('Type a note first');kick();return}
var a=mk(t),e=document.createElement('div'),s=document.createElement('span');
s.textContent=t;e.className='cc16-fly';e.appendChild(s);root.appendChild(e);a.el=e;a.p=0;a.v=0;air.push(a);
inp.value='';bv-=1;kick();if(reduce())return;draw()}
inp.addEventListener('keydown',function(e){
if(e.key==='Enter'&&!e.isComposing){e.preventDefault();submit()}
else if(e.key==='Escape'){inp.value=''}});
file.addEventListener('pointerdown',function(){inp.focus()});
mq.addEventListener('change',function(){if(reduce()){stop();snapToTarget();draw()}});
if('IntersectionObserver' in window){new IntersectionObserver(function(es){inView=es[0].isIntersecting;
if(!inView)stop();else{draw();if(air.length)kick()}},{threshold:0}).observe(root)}
document.addEventListener('visibilitychange',function(){if(document.hidden)stop();else{draw();if(air.length)kick()}});
window.addEventListener('pagehide',stop);
window.addEventListener('message',function(e){if(e.source!==parent)return;var m=e.data;
if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){
  document.documentElement.setAttribute('data-theme',m.theme);draw()}});
new ResizeObserver(function(){metrics();snapToTarget();draw()}).observe(file);
metrics();
['use pnpm not npm','tests before fixes','never edit .env','small diffs, ask first'].forEach(function(t){
var l=mk(t);l.y=slotY(lines.length);lines.push(l);row(l,true)});
draw();
// Demo uses the same state mutators as manual controls; no remote Claude session.
var demoRoot=document.getElementById('cc16-root'),demoClock=0,demoAge=0,demoStep=0,demoVisible=true;
var demoEnabled=window.__foreverPreview?.demoEnabled!==false;
function demoTick(){if(lines.length>=8){lines.forEach(function(l){if(l.el)l.el.remove()});lines=[];metrics()} inp.value=['keep diffs small','test before merge','use clear names'][demoStep++%3];submit();}
function syncDemo(){
clearInterval(demoClock);demoClock=0;
if(!demoEnabled||reduce()||document.hidden||!demoVisible)return;
demoClock=setInterval(function(){demoAge+=250;if(demoAge>=1000){demoAge=-2200;demoTick()}},250);
}
function takeover(){
if(window.__foreverPreview?.surface==='wall')return;
if(!demoEnabled)return;demoEnabled=false;clearInterval(demoClock);demoClock=0;
}
['pointerdown','keydown','input'].forEach(function(type){demoRoot.addEventListener(type,takeover,true)});
window.addEventListener('forever:interactive',takeover);
window.addEventListener('pagehide',function(){demoEnabled=false;clearInterval(demoClock)});
document.addEventListener('visibilitychange',function(){syncDemo();if(!document.hidden)kick()});
mq.addEventListener('change',syncDemo);
if('IntersectionObserver' in window)new IntersectionObserver(function(es){demoVisible=es[0].isIntersecting;syncDemo();if(demoVisible)kick()}).observe(demoRoot);
syncDemo();
})();</script>
