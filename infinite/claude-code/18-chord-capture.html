<div class="cc17-root" id="cc17-root" role="group" aria-label="Key chord capture. Press any key combination, for example control shift K, and read its normalized keybindings string. The four modifier buttons latch ctrl, alt, shift and meta for touch. Tap the key cap to type on a soft keyboard. Escape clears.">

<script>(function(){
var $=function(i){return document.getElementById(i)};
var root=$('cc17-root'),box=$('cc17-mods'),keyW=$('cc17-key'),kc=$('cc17-kc'),inp=$('cc17-inp'),out=$('cc17-out'),live=$('cc17-live');
var mq=matchMedia('(prefers-reduced-motion: reduce)'),reduce=function(){return mq.matches};
var raf=0,last=0,inView=true,tm=0,rel=0;
var MODS=['ctrl','alt','shift','meta'],GLY={ctrl:'\u2303',alt:'\u2325',shift:'\u21E7',meta:'\u2318'},
KG={space:'\u2423',enter:'\u21B5',up:'\u2191',down:'\u2193',left:'\u2190',right:'\u2192',tab:'\u21E5',backspace:'\u232B',delete:'\u2326',escape:'esc'},
NAME={' ':'space',ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Escape:'escape'};
var K=.22,C=2*.8*Math.sqrt(K);
var S={m:{ctrl:1,alt:0,shift:1,meta:0},key:'k'},lat={ctrl:0,alt:0,shift:0,meta:0},held={ctrl:0,alt:0,shift:0,meta:0},keyDown=false;
var caps={};
function mkCap(id,wrap,glyph){var c=document.createElement('span');c.className='cc17-c';if(glyph)c.textContent=glyph;wrap.appendChild(c);
return caps[id]={d:0,v:0,w:wrap,c:c}}
MODS.forEach(function(m){var b=document.createElement('button');b.type='button';b.className='cc17-w';
b.setAttribute('aria-label',m+' modifier');b.setAttribute('aria-pressed','false');mkCap(m,b,GLY[m]);
b.addEventListener('click',function(){lat[m]=lat[m]?0:1;S.m[m]=lat[m];say(lat[m]?'Latched '+m:'Released '+m);kick();draw()});
box.appendChild(b)});
caps.key={d:0,v:0,w:keyW,c:kc};
function say(m){clearTimeout(tm);live.textContent='';tm=setTimeout(function(){live.textContent=m},30)}
function shown(){var any=false,m={};MODS.forEach(function(k){if(held[k])any=true;m[k]=held[k]||lat[k]?1:0});
return any&&!keyDown?{m:m,key:''}:S}
function fmt(c){var p=MODS.filter(function(m){return c.m[m]});if(c.key)p.push(c.key);
return p.length?p.join('+')+(c.key?'':'+'):''}
function tok(e){var c=e.code||'';if(/^Key[A-Z]$/.test(c))return c[3].toLowerCase();if(/^Digit\d$/.test(c))return c[5];
return(NAME[e.key]||e.key).toLowerCase()}
function target(id){if(id==='key')return keyDown?1:0;return held[id]||lat[id]||(keyDown&&S.m[id])?1:0}
function step(dt){var mv=false;for(var id in caps){var o=caps[id],t=target(id);
o.v+=(-(o.d-t)*K-C*o.v)*dt;o.d+=o.v*dt;
if(Math.abs(o.d-t)<.003&&Math.abs(o.v)<.003){o.d=t;o.v=0}else mv=true}return mv}
function snapToTarget(){for(var id in caps){caps[id].d=target(id);caps[id].v=0}}
function draw(){var c=shown(),s=fmt(c),g=c.key?(KG[c.key]||(c.key.length===1?c.key.toUpperCase():c.key)):'\u00B7',id;
MODS.forEach(function(m){caps[m].w.classList.toggle('cc17-lit',!!c.m[m]);caps[m].w.setAttribute('aria-pressed',lat[m]?'true':'false')});
keyW.classList.toggle('cc17-lit',!!c.key);kc.textContent=g;
out.textContent=s||'press keys';out.classList.toggle('cc17-dim',!s);
for(id in caps){var o=caps[id];o.c.style.transform='translateY('+(o.d*4).toFixed(2)+'px) scaleY('+(1-o.d*.04).toFixed(3)+')'}}
function stop(){if(raf){cancelAnimationFrame(raf);raf=0}}
function frame(now){var dt=last?Math.min(now-last,50)/16.667:1;last=now;
var moving=reduce()?(snapToTarget(),false):step(dt);draw();raf=moving?requestAnimationFrame(frame):0}
function kick(){if(reduce()){stop();snapToTarget();draw();return}
if(!raf&&!document.hidden&&inView){last=0;raf=requestAnimationFrame(frame)}}
function release(){keyDown=false;kick();draw()}
function commit(m,key){S={m:m,key:key};keyDown=true;clearTimeout(rel);say('Captured '+fmt(S));kick();draw()}
function clear(){MODS.forEach(function(m){lat[m]=0});S={m:{ctrl:0,alt:0,shift:0,meta:0},key:''};keyDown=false;say('Cleared');kick();draw()}
function sync(e){held.ctrl=e.ctrlKey?1:0;held.alt=e.altKey?1:0;held.shift=e.shiftKey?1:0;held.meta=e.metaKey?1:0}
root.addEventListener('keydown',function(e){
if(e.key==='Unidentified'||e.key==='Process'||e.isComposing||e.keyCode===229)return;
sync(e);
if(/^(Control|Shift|Alt|Meta|AltGraph|CapsLock)$/.test(e.key)){kick();draw();return}
var nm=!(e.ctrlKey||e.altKey||e.metaKey);
if(e.key==='Tab'&&nm){kick();return}
if(e.target.tagName==='BUTTON'&&(e.key==='Enter'||e.key===' ')&&nm&&!e.shiftKey)return;
e.preventDefault();
var t=tok(e);
if(t==='escape'&&nm&&!e.shiftKey){clear();return}
var m={};MODS.forEach(function(k){m[k]=held[k]||lat[k]?1:0});
commit(m,t);
if(e.metaKey)rel=setTimeout(release,140)});
root.addEventListener('keyup',function(e){sync(e);
if(!/^(Control|Shift|Alt|Meta|AltGraph|CapsLock)$/.test(e.key)&&keyDown){clearTimeout(rel);release();return}
kick();draw()});
inp.addEventListener('input',function(){var v=inp.value;inp.value='';if(!v)return;var ch=v.slice(-1),m={};
MODS.forEach(function(k){m[k]=lat[k]});commit(m,ch===' '?'space':ch.toLowerCase());rel=setTimeout(release,110)});
window.addEventListener('blur',function(){MODS.forEach(function(m){held[m]=0});keyDown=false;kick();draw()});
mq.addEventListener('change',function(){if(reduce()){stop();snapToTarget();draw()}});
if('IntersectionObserver' in window){new IntersectionObserver(function(es){inView=es[0].isIntersecting;
if(!inView)stop();else{draw();kick()}},{threshold:0}).observe(root)}
document.addEventListener('visibilitychange',function(){if(document.hidden)stop();else{draw();kick()}});
window.addEventListener('pagehide',stop);
window.addEventListener('message',function(e){if(e.source!==parent)return;var m=e.data;
if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){
  document.documentElement.setAttribute('data-theme',m.theme);draw()}});
draw();
// Demo uses the same state mutators as manual controls; no remote Claude session.
var demoRoot=document.getElementById('cc17-root'),demoClock=0,demoAge=0,demoStep=0,demoVisible=true;
var demoEnabled=window.__foreverPreview?.demoEnabled!==false;
function demoTick(){var m={ctrl:1,alt:0,shift:demoStep%2,meta:0};commit(m,demoStep++%2?'k':'p');rel=setTimeout(release,220);}
function syncDemo(){
clearInterval(demoClock);demoClock=0;
if(!demoEnabled||reduce()||document.hidden||!demoVisible)return;
demoClock=setInterval(function(){demoAge+=250;if(demoAge>=1000){demoAge=-2200;demoTick()}},250);
}
function takeover(){
if(window.__foreverPreview?.surface==='wall')return;
if(!demoEnabled)return;demoEnabled=false;clearInterval(demoClock);demoClock=0;
}
['pointerdown','keydown','input'].forEach(function(type){demoRoot.addEventListener(type,takeover,true)});
window.addEventListener('forever:interactive',takeover);
window.addEventListener('pagehide',function(){demoEnabled=false;clearInterval(demoClock)});
document.addEventListener('visibilitychange',function(){syncDemo();if(!document.hidden)kick()});
mq.addEventListener('change',syncDemo);
if('IntersectionObserver' in window)new IntersectionObserver(function(es){demoVisible=es[0].isIntersecting;syncDemo();if(demoVisible)kick()}).observe(demoRoot);
syncDemo();
})();</script>
