<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Orrery — Clockwork &amp; Mechanical. A self-contained, zero-dependency animated web component.">
<title>Orrery</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults; light = brass and steel on cream card stock. */
  :root{
    --or-bg:#141414;--or-plate:#1a1408;--or-edge:#5a3c10;--or-engrave:#3a2808;
    --or-sun0:#ffe066;--or-sun1:#e8a020;--or-sun2:#a05010;--or-br0:#d4a755;--or-br1:#7a5420;
    --or-brass:#b5813a;--or-brass2:#c49030;--or-arm:#8a6030;--or-arm2:#7a5420;
    --or-steelbg:#2c2c2c;--or-steel:#8a8a96;--or-body2:#1e1810;--or-body3:#141414;--or-hi:#e8dcc8;
    --or-cap:#b5813a;--or-cap-o:.45;
  }
  :root[data-theme="light"]{
    --or-bg:#f6f0e4;--or-plate:#ece0c8;--or-edge:#8a6a2e;--or-engrave:#b39c6c;
    --or-sun0:#ffd633;--or-sun1:#e08a12;--or-sun2:#95500f;--or-br0:#c08b2a;--or-br1:#6b4718;
    --or-brass:#8a6a2e;--or-brass2:#96701f;--or-arm:#9a7844;--or-arm2:#8a6a2e;
    --or-steelbg:#dfd7c4;--or-steel:#6f7885;--or-body2:#e6dcc2;--or-body3:#efe7d4;--or-hi:#3a3226;
    --or-cap:#8e652e;--or-cap-o:.8;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--or-bg)}
  .or-root{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  .or-svg{width:min(100%,100vmin);height:min(100%,100vmin)}
  .or-caption{position:fixed;left:8px;bottom:7px;font:11px/1 monospace;color:var(--or-cap);opacity:var(--or-cap-o);pointer-events:none}
  /* plate / brass / steel colours on classes so both palettes share one drawing */
  .fpl{fill:var(--or-plate)}.feg{fill:var(--or-engrave)}.fsb{fill:var(--or-steelbg)}.fst{fill:var(--or-steel)}
  .fbr{fill:var(--or-brass)}.fb2{fill:var(--or-body2)}.fb3{fill:var(--or-body3)}.fbz{fill:var(--or-br0)}.fhi{fill:var(--or-hi)}
  .sed{stroke:var(--or-edge)}.seg{stroke:var(--or-engrave)}.ssn{stroke:var(--or-sun0)}.sbr{stroke:var(--or-brass)}
  .sbz{stroke:var(--or-br0)}.sb2{stroke:var(--or-brass2)}.sar{stroke:var(--or-arm)}.sa2{stroke:var(--or-arm2)}
  .os0{stop-color:var(--or-sun0)}.os1{stop-color:var(--or-sun1)}.os2{stop-color:var(--or-sun2)}
  .ob0{stop-color:var(--or-br0)}.ob1{stop-color:var(--or-br1)}
  feDropShadow{flood-color:var(--or-brass)}

  #or-ring1{transform-origin:50% 50%;animation:or-r1 12s linear infinite}
  #or-ring2{transform-origin:50% 50%;animation:or-r2 8s linear infinite}
  #or-ring3{transform-origin:50% 50%;animation:or-r3 5s linear infinite}
  #or-ring4{transform-origin:50% 50%;animation:or-r4 3s linear infinite}
  #or-ring5{transform-origin:50% 50%;animation:or-r5 20s linear infinite reverse}
  #or-armature{transform-origin:50% 50%;animation:or-r1 12s linear infinite}

  @keyframes or-r1{to{transform:rotate(360deg)}}
  @keyframes or-r2{to{transform:rotate(360deg)}}
  @keyframes or-r3{to{transform:rotate(360deg)}}
  @keyframes or-r4{to{transform:rotate(360deg)}}
  @keyframes or-r5{to{transform:rotate(360deg)}}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/clockwork/04-orrery-rings.html",
 "title": "Orrery",
 "description": "Four planetary arms orbit a glowing brass sun at staggered speeds; a counter-rotating dashed ring and crosshair armature give a steampunk orrery feel.",
 "useWhen": "Dark-mode hero backgrounds, science/space themes, steampunk or mechanical UI aesthetics, ambient looping decorations.",
 "avoidWhen": "Light backgrounds (hardcoded dark plate). Contexts where constant rotational motion competes with foreground content.",
 "agentPrompt": "Change the outermost planet speed to 18s by editing #or-ring1 animation duration, and recolor the sun gradient stops to deep red (#ff4400 → #880000). Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "orbit arm speeds (animation durations 12s/8s/5s/3s/20s)",
  "planet fill colors (cx/cy circle fills)",
  "sun gradient stops (#ffe066, #e8a020, #a05010)",
  "ring track radii (r=72/56/40/25)",
  "counter-rotation direction (reverse keyword on or-ring5)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "IIFE wrapper with prefers-reduced-motion guard",
  "visibilitychange pause handler",
  "transform-origin:50% 50% on all rotating groups",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Background color hardcoded to #141414 — must edit CSS to change",
  "No interactivity; purely decorative",
  "SVG filter or-glow uses feComposite which may render differently across browsers"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "orrery",
  "clockwork",
  "orbits",
  "mechanical",
  "svg",
  "astronomy",
  "ambient"
 ]
}
</script>
</head>
<body>
<div class="or-root">
  <svg class="or-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="or-sun" cx="35%" cy="30%">
        <stop class="os0" offset="0%"/>
        <stop class="os1" offset="60%"/>
        <stop class="os2" offset="100%"/>
      </radialGradient>
      <radialGradient id="or-brass" cx="35%" cy="30%">
        <stop class="ob0" offset="0%"/>
        <stop class="ob1" offset="100%"/>
      </radialGradient>
      <filter id="or-glow">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
      </filter>
      <filter id="or-drop">
        <feDropShadow dx="0" dy="0" stdDeviation="2" flood-opacity=".3"/>
      </filter>
    </defs>

    <!-- Base plate -->
    <circle class="fpl sed" cx="100" cy="100" r="92" stroke-width="1.5"/>
    <circle class="seg" cx="100" cy="100" r="88" fill="none" stroke-width=".5" stroke-dasharray="4 4"/>

    <!-- Orbital ring tracks (static, engraved look) -->
    <circle class="seg" cx="100" cy="100" r="72" fill="none" stroke-width=".8"/>
    <circle class="seg" cx="100" cy="100" r="56" fill="none" stroke-width=".8"/>
    <circle class="seg" cx="100" cy="100" r="40" fill="none" stroke-width=".8"/>
    <circle class="seg" cx="100" cy="100" r="25" fill="none" stroke-width=".8"/>

    <!-- Sun at centre -->
    <circle cx="100" cy="100" r="12" fill="url(#or-sun)" filter="url(#or-glow)"/>
    <circle class="ssn" cx="100" cy="100" r="9" fill="none" stroke-width=".4" opacity=".5"/>

    <!-- Outer decorative ring (counter-rotating) -->
    <g id="or-ring5">
      <circle class="sbr" cx="100" cy="100" r="88" fill="none" stroke-width="1.5" stroke-dasharray="3 6"/>
    </g>

    <!-- Ring 1: outermost orbit arm + planet -->
    <g id="or-ring1">
      <line class="sar" x1="100" y1="100" x2="172" y2="100" stroke-width=".8" opacity=".6"/>
      <!-- Gear at orbit radius for visual interest -->
      <circle class="fsb sbr" cx="172" cy="100" r="7" stroke-width="1"/>
      <circle class="fst" cx="172" cy="100" r="4.5"/>
      <circle class="fbr" cx="172" cy="100" r="1.5"/>
      <!-- Teeth suggestion -->
      <circle class="sbr" cx="172" cy="100" r="7" fill="none" stroke-width="1.5" stroke-dasharray="1.5 2.5"/>
    </g>

    <!-- Ring 2 -->
    <g id="or-ring2">
      <line class="sar" x1="100" y1="100" x2="156" y2="100" stroke-width=".7" opacity=".6"/>
      <circle class="feg sbz" cx="156" cy="100" r="6" stroke-width=".8"/>
      <circle class="fbr" cx="156" cy="100" r="3.5"/>
      <circle class="fhi" cx="156" cy="100" r="1"/>
    </g>

    <!-- Ring 3 -->
    <g id="or-ring3">
      <line class="sar" x1="100" y1="100" x2="140" y2="100" stroke-width=".7" opacity=".6"/>
      <circle class="fb2 sb2" cx="140" cy="100" r="5" stroke-width=".8"/>
      <circle class="fst" cx="140" cy="100" r="3"/>
      <circle class="fbz" cx="140" cy="100" r="1"/>
    </g>

    <!-- Ring 4: inner fast orbit -->
    <g id="or-ring4">
      <line class="sa2" x1="100" y1="100" x2="125" y2="100" stroke-width=".6" opacity=".6"/>
      <circle class="fb3 sbr" cx="125" cy="100" r="4" stroke-width=".8"/>
      <circle class="fbz" cx="125" cy="100" r="2"/>
    </g>

    <!-- Armature crossbar (structural, rotates with outer orbit) -->
    <g id="or-armature">
      <line class="sed" x1="28" y1="100" x2="172" y2="100" stroke-width=".5" opacity=".3"/>
      <line class="sed" x1="100" y1="28" x2="100" y2="172" stroke-width=".5" opacity=".3"/>
    </g>

    <!-- Centre pivot -->
    <circle class="sed" cx="100" cy="100" r="3" fill="url(#or-brass)" stroke-width=".5"/>

    <!-- Degree ring -->
    <g class="sed" stroke-width=".4" opacity=".5">
      <line x1="100" y1="10" x2="100" y2="14"/>
      <line x1="100" y1="186" x2="100" y2="190"/>
      <line x1="10" y1="100" x2="14" y2="100"/>
      <line x1="186" y1="100" x2="190" y2="100"/>
      <line x1="135" y1="18" x2="133" y2="22"/>
      <line x1="63" y1="178" x2="65" y2="182"/>
      <line x1="18" y1="65" x2="22" y2="67"/>
      <line x1="178" y1="133" x2="182" y2="135"/>
      <line x1="165" y1="35" x2="162" y2="38"/>
      <line x1="35" y1="165" x2="38" y2="162"/>
      <line x1="165" y1="165" x2="162" y2="162"/>
      <line x1="35" y1="35" x2="38" y2="38"/>
    </g>
  </svg>
</div>
<div class="or-caption">orrery · nested orbits</div>
<script>
(()=>{
  // live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}.
  // Every colour is a CSS token, so re-setting the attribute is the whole switch.
  addEventListener('message',e=>{
    const d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark'))
      document.documentElement.setAttribute('data-theme',d.theme);
  });
  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  const ids = ['or-ring1','or-ring2','or-ring3','or-ring4','or-ring5','or-armature'];
  if(reduce){
    ids.forEach(id=>{ const el=document.getElementById(id); if(el) el.style.animation='none'; });
  }
  document.addEventListener('visibilitychange',()=>{
    const state = document.hidden ? 'paused' : 'running';
    ids.forEach(id=>{ const el=document.getElementById(id); if(el) el.style.animationPlayState=state; });
  });
})();
</script>
</body>
</html>
