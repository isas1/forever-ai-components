<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="Glowing sage-green wireframe cube with radial-orb faces slowly rotating in CSS 3D, reacting subtly to pointer movement on deep charcoal.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotating Cube</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1B1E1A;
    font-family:system-ui,-apple-system,sans-serif;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    perspective:600px;}
  #cube{position:relative;width:38vmin;height:38vmin;transform-style:preserve-3d;
    transform:rotateX(-22deg) rotateY(0deg);will-change:transform;}
  .face{position:absolute;inset:0;border:1px solid rgba(177,204,164,.5);
    display:flex;align-items:center;justify-content:center;
    background:rgba(216,178,151,.12);box-shadow:inset 0 0 30px rgba(177,204,164,.25);
    backface-visibility:visible;}
  .face::after{content:"";width:46%;height:46%;border-radius:50%;
    background:radial-gradient(circle,#B1CCA4,#D8B297 70%,transparent);
    filter:blur(1px);opacity:.85;}
  .f1{transform:translateZ(19vmin)}
  .f2{transform:rotateY(180deg) translateZ(19vmin)}
  .f3{transform:rotateY(90deg) translateZ(19vmin)}
  .f4{transform:rotateY(-90deg) translateZ(19vmin)}
  .f5{transform:rotateX(90deg) translateZ(19vmin)}
  .f6{transform:rotateX(-90deg) translateZ(19vmin)}
  .cap{position:fixed;left:10px;bottom:8px;color:#B1CCA4;opacity:.32;
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/css-3d/01-rotating-cube.html",
 "title": "Rotating Cube",
 "description": "Glowing sage-green wireframe cube slowly auto-rotates in CSS 3D with a subtle sine-wave tilt; pointer movement offsets the rotation to follow the cursor.",
 "useWhen": "Hero backgrounds, tech or data product landing pages, dark-mode ambient displays needing a 3D accent.",
 "avoidWhen": "Light backgrounds (hardcoded dark charcoal). Contexts where pointer distraction competes with UI controls above the cube.",
 "agentPrompt": "Change the cube face glow color from sage to gold by replacing #B1CCA4 and rgba(177,204,164,.5) with #ffe07e and rgba(255,220,120,.5), and slow rotation to ry+=0.25.",
 "editableAreas": [
  "rotation speed (ry += 0.5)",
  "pointer influence range (tx *40 / ty *30)",
  "face glow color (#B1CCA4)",
  "cube size (38vmin)",
  "perspective depth (600px)"
 ],
 "preserveElements": [
  "visibilitychange stop/start guards",
  "prefers-reduced-motion static fallback",
  "viewport cache with resize listener (never per-frame)"
 ],
 "knownLimitations": [
  "Background color hardcoded to dark navy — must edit CSS to use on light pages",
  "CSS 3D with backface-visibility:visible can look odd on some rotations without a depth cull tweak"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps"
 ],
 "tags": [
  "3d",
  "cube",
  "css-3d",
  "perspective",
  "ambient",
  "wireframe",
  "glow"
 ]
}
</script>
</head>
<body>
<div id="stage">
  <div id="cube">
    <div class="face f1"></div><div class="face f2"></div>
    <div class="face f3"></div><div class="face f4"></div>
    <div class="face f5"></div><div class="face f6"></div>
  </div>
</div>
<div class="cap">Rotating Cube</div>
<script>
  const cube=document.getElementById('cube');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let ry=0,rx=-22,tx=0,ty=0,raf;
  // Cache viewport size once; re-read only on resize (never per pointermove/frame).
  let vw=innerWidth,vh=innerHeight;
  addEventListener('resize',()=>{vw=innerWidth;vh=innerHeight;});
  function loop(){
    ry+=0.5; rx=-22+Math.sin(ry/90)*8;
    cube.style.transform=`rotateX(${rx+ty}deg) rotateY(${ry+tx}deg)`;
    raf=requestAnimationFrame(loop);
  }
  addEventListener('pointermove',e=>{
    tx=(e.clientX/vw-.5)*40; ty=-(e.clientY/vh-.5)*30;
  });
  function start(){if(!raf&&!reduce)loop();}
  function stop(){cancelAnimationFrame(raf);raf=0;}
  document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
  if(reduce){cube.style.transform='rotateX(-22deg) rotateY(35deg)';}else start();
</script>
</body>
</html>
