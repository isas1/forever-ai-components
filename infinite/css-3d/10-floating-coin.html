<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="A glossy gold star coin spinning on its axis while bobbing above a soft shadow on a dark amber background.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Coin</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<meta name="forever-preview-lifecycle" content="demo-v1">
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract);
     the light re-theme is the [data-theme="light"] block */
  :root{
    --c10-bg:#1b1405;
    --c10-face:radial-gradient(circle at 35% 30%,#fff3b0,#f5c542 45%,#b8860b 90%);
    --c10-rim:#d9a526; --c10-rim-shade:rgba(120,80,0,.4);
    --c10-ink:#8a5a08; --c10-emboss:#ffe89a; --c10-cast:rgba(0,0,0,.5);
    --c10-cap:#f5c542; --c10-cap-o:.34;
  }
  :root[data-theme="light"]{
    --c10-bg:#f7f1e2;
    --c10-face:radial-gradient(circle at 35% 30%,#ffeaa0,#e8b52e 45%,#8c6907 90%);
    --c10-rim:#b4841a; --c10-rim-shade:rgba(120,80,0,.3);
    --c10-ink:#6b4506; --c10-cast:rgba(120,90,20,.32);
    --c10-cap:#33280b; --c10-cap-o:.5;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--c10-bg);
    font-family:system-ui,-apple-system,sans-serif;}
  #fc10-stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    perspective:800px;}
  #fc10-wrap{transform-style:preserve-3d;}
  #fc10-coin{position:relative;width:34vmin;height:34vmin;transform-style:preserve-3d;}
  .fc10-face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;
    display:flex;align-items:center;justify-content:center;
    background:var(--c10-face);
    box-shadow:inset 0 0 0 1.4vmin var(--c10-rim), inset 0 0 5vmin var(--c10-rim-shade);}
  .fc10-front span{font-size:16vmin;font-weight:800;color:var(--c10-ink);
    text-shadow:0 1px 0 var(--c10-emboss);}
  .fc10-back{transform:rotateY(180deg);}
  .fc10-back span{font-size:9vmin;color:var(--c10-ink);text-shadow:0 1px 0 var(--c10-emboss);}
  .fc10-edge{position:absolute;left:50%;top:0;width:2vmin;height:100%;
    transform-style:preserve-3d;}
  #fc10-shadow{position:absolute;bottom:14%;left:50%;width:24vmin;height:4vmin;
    transform:translateX(-50%);border-radius:50%;
    background:radial-gradient(ellipse,var(--c10-cast),transparent 70%);}
  .cap{position:fixed;left:10px;bottom:8px;color:var(--c10-cap);opacity:var(--c10-cap-o);
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/css-3d/10-floating-coin.html",
 "title": "Floating Coin",
 "description": "A glossy gold coin spins on its Y-axis and bobs up/down with a reactive shadow; pointer X position adjusts spin speed in real time.",
 "useWhen": "Game UIs, reward/achievement screens, crypto/NFT landing pages, or any dark-theme hero needing a tactile 3D object.",
 "avoidWhen": "Light backgrounds (dark amber is hardcoded). Contexts where constant rotation is distracting alongside body text.",
 "agentPrompt": "Change the front face star emoji to '💎', set the base spin speed to 2.5 (spin variable), and update the background to #0d1b2a for a night-blue theme. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "base spin speed (spin=1.6)",
  "bob amplitude (Math.sin(t)*4)",
  "coin size (34vmin)",
  "front/back face content (★ / 3D)",
  "background color (#1b1405)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "prefers-reduced-motion guard + static fallback",
  "visibilitychange stop/start pair",
  "transform-style:preserve-3d on #coin and #wrap",
  "backface-visibility:hidden on .face",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)",
  "demo-v1 preview lifecycle: initialize demoEnabled from window.__foreverPreview and stop attract work on the window forever:interactive event; retain manual feedback, settling, cleanup and explicit sessions"
 ],
 "knownLimitations": [
  "Coin size in vmin — may appear too large on ultra-wide viewports",
  "No click interactivity; pointer only affects spin speed, not state",
  "Background color hardcoded in CSS body rule",
  "State remains local to each mounted instance; format/theme remount preserves takeover, not component values."
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "3d",
  "coin",
  "spin",
  "bob",
  "css-3d",
  "perspective",
  "gold"
 ]
}
</script>
</head>
<body>
<div id="fc10-stage">
  <div id="fc10-shadow"></div>
  <div id="fc10-wrap"><div id="fc10-coin">
    <div class="fc10-face fc10-front"><span>★</span></div>
    <div class="fc10-face fc10-back"><span>3D</span></div>
  </div></div>
</div>
<div class="cap">Floating Coin</div>
<script>
(function(){
  const coin=document.getElementById('fc10-coin');
  const wrap=document.getElementById('fc10-wrap');
  const shadow=document.getElementById('fc10-shadow');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let ry=0,t=0,raf,interacted=false,spin=1.6,demo=window.__foreverPreview?.demoEnabled!==false,interactionUntil=0;
  function takeover(){demo=false;interactionUntil=performance.now()+1100;if(!document.hidden)start();}
  window.addEventListener('forever:interactive',takeover);
  document.addEventListener('pointerdown',takeover,{capture:true,once:true});
  document.addEventListener('keydown',e=>{if(['Enter',' ','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))takeover();},{capture:true,once:true});
  document.addEventListener('pointermove',()=>{if(!demo){interactionUntil=performance.now()+1100;if(!document.hidden)start();}},{passive:true});
  function loop(){
    if(demo)t+=0.03;
    if(demo||performance.now()<interactionUntil)ry+=spin;
    const bob=Math.sin(t)*4;
    wrap.style.transform=`translateY(${bob}vmin)`;
    coin.style.transform=`rotateX(8deg) rotateY(${ry}deg)`;
    shadow.style.transform=`translateX(-50%) scale(${1-bob*0.02})`;
    shadow.style.opacity=(0.5-bob*0.03).toFixed(2);
    if(demo||performance.now()<interactionUntil)raf=requestAnimationFrame(loop);else raf=0;
  }
  addEventListener('pointermove',e=>{interacted=true;
    spin=1.6+(e.clientX/innerWidth-.5)*6;
    if(reduce){ry+=spin;coin.style.transform=`rotateX(8deg) rotateY(${ry}deg)`;}
  });
  function start(){if(!raf&&!reduce&&(demo||performance.now()<interactionUntil))loop();}
  function stop(){cancelAnimationFrame(raf);raf=0;}
  document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
  // live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
  addEventListener('message',e=>{const d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark'))
      document.documentElement.setAttribute('data-theme',d.theme);});
  if(reduce||!demo){coin.style.transform='rotateX(8deg) rotateY(28deg)';}else start();
})();
</script>
</body>
</html>
