<script>
(function () {
  "use strict";
  var root = document.documentElement;
  function $(id) { return document.getElementById("at30-" + id); }
  var pages = $("pages"), left = $("l"), right = $("r"), turnEl = $("turn"), top = $("top"), flap = $("flap");
  var prev = $("prev"), next = $("next"), live = $("live");
  var dots = [].slice.call(document.querySelectorAll(".at30-dot"));
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var demo = !reduce && (!window.__foreverPreview || window.__foreverPreview.demoEnabled !== false);
  var N = 4, k = 0, W = 1, H = 1, turn = null, press = null, raf = 0, lastDemo = 0, way = 1;

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "forever:theme" && (e.data.theme === "light" || e.data.theme === "dark")) root.setAttribute("data-theme", e.data.theme);
  });

  /* f: 0..N-1 = picture, -1 = plain back of a sheet, -2 = nothing (cover board shows) */
  function face(el, f) {
    el.classList.toggle("is-off", f === -2);
    el.classList.toggle("is-plain", f === -1);
    var u = el.querySelector("use");
    if (u && f >= 0) u.setAttribute("href", "#at30-s" + f);
  }
  function rest(say) {
    turnEl.classList.remove("is-on");
    face(left, k > 0 ? -1 : -2);
    face(right, k < N ? k : -2);
    prev.disabled = k === 0; next.disabled = k === N;
    dots.forEach(function (d, i) { d.classList.toggle("is-on", i === k); });
    if (say) live.textContent = "Page " + (k + 1) + " of " + (N + 1);
  }
  function cut(pts, mx, my, nx, ny, s) {
    var o = [], i, a, b, da, db, t;
    for (i = 0; i < pts.length; i++) {
      a = pts[i]; b = pts[(i + 1) % pts.length];
      da = s * ((a[0] - mx) * nx + (a[1] - my) * ny); db = s * ((b[0] - mx) * nx + (b[1] - my) * ny);
      if (da >= 0) o.push(a);
      if (da * db < 0) { t = da / (da - db); o.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]); }
    }
    return "polygon(" + (o.length ? o : [[0, 0]]).map(function (p) { return (p[0] - W).toFixed(1) + "px " + p[1].toFixed(1) + "px"; }).join(",") + ")";
  }
  function fold() {
    var px = turn.px, py = turn.py, dx = px - W, dy = py - H, d = Math.sqrt(dx * dx + dy * dy), D = Math.sqrt(W * W + H * H);
    if (d > W) { px = W + dx / d * W; py = H + dy / d * W; }
    dx = px - W; d = Math.sqrt(dx * dx + py * py);
    if (d > D) { px = W + dx / d * D; py = py / d * D; }
    var nx = 2 * W - px, ny = H - py, len = Math.sqrt(nx * nx + ny * ny);
    if (len < 1) { top.style.clipPath = "none"; flap.style.visibility = "hidden"; return; }
    nx /= len; ny /= len;
    var mx = (2 * W + px) / 2, my = (H + py) / 2, rect = [[W, 0], [2 * W, 0], [2 * W, H], [W, H]];
    top.style.clipPath = cut(rect, mx, my, nx, ny, -1);
    flap.style.clipPath = cut(rect, mx, my, nx, ny, 1);
    var a = 1 - 2 * nx * nx, b = -2 * nx * ny, c = 1 - 2 * ny * ny, mn = mx * nx + my * ny;
    flap.style.visibility = "visible";
    flap.style.transform = "matrix(" + a.toFixed(4) + "," + b.toFixed(4) + "," + b.toFixed(4) + "," + c.toFixed(4) + "," + (a * W + 2 * mn * nx - W).toFixed(2) + "," + (b * W + 2 * mn * ny).toFixed(2) + ")";
  }
  function begin(dir, drag) {
    if (turn || (dir > 0 ? k >= N : k <= 0)) return false;
    turn = { dir: dir, px: 2 * W - 2, py: H - 1, tx: 0, drag: !!drag };
    turnEl.classList.toggle("is-mir", dir < 0);
    if (dir > 0) { face(top, k); face(flap, -1); face(right, k + 1 < N ? k + 1 : -2); }
    else { face(top, -1); face(flap, k - 1); face(left, k - 1 > 0 ? -1 : -2); }
    fold();
    turnEl.classList.add("is-on");
    kick();
    return true;
  }
  function go(dir) {
    if (!reduce) return begin(dir);
    if (dir > 0 ? k >= N : k <= 0) return false;
    k += dir; rest(true);
    return true;
  }

  function tick(ts) {
    raf = 0;
    if (document.hidden) return;
    if (demo && !turn && ts - lastDemo > 2500) {
      lastDemo = ts;
      if (!go(way)) { way = -way; go(way); }
    }
    if (turn && !turn.drag) {
      turn.px += (turn.tx - turn.px) * 0.11 + (turn.tx ? 2 : -2);
      turn.py = turn.tx ? turn.py + (H - turn.py) * 0.2 : H - Math.sin((1 - turn.px / (2 * W)) * Math.PI) * H * 0.2;
      if (turn.tx ? turn.px >= turn.tx - 1 : turn.px <= 1) {
        if (!turn.tx) k += turn.dir;
        turn = null; rest(true);
      }
    }
    if (turn) fold();
    if (demo || turn) raf = requestAnimationFrame(tick);
  }
  function kick() { if (!raf && !document.hidden) raf = requestAnimationFrame(tick); }
  function take() { demo = false; }
  function at(e) {
    var r = pages.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  window.addEventListener("forever:interactive", take);
  pages.addEventListener("pointerdown", function (e) {
    take();
    if (turn) return;
    var p = at(e);
    press = { x: p.x, y: p.y, dir: p.x > W ? 1 : -1 };
    if (pages.setPointerCapture) pages.setPointerCapture(e.pointerId);
  });
  pages.addEventListener("pointermove", function (e) {
    if (!press) return;
    var p = at(e);
    if (!turn) {
      if (reduce || Math.abs(p.x - press.x) + Math.abs(p.y - press.y) < 6) return;
      if (!begin(press.dir, true)) { press = null; return; }
    }
    turn.px = press.dir > 0 ? p.x : 2 * W - p.x; turn.py = p.y;
  });
  function end() {
    if (!press) return;
    var dir = press.dir;
    press = null;
    if (turn && turn.drag) { turn.drag = false; turn.tx = turn.px < W ? 0 : 2 * W; kick(); }
    else if (!turn) go(dir);
  }
  pages.addEventListener("pointerup", end);
  pages.addEventListener("pointercancel", end);
  pages.addEventListener("keydown", function (e) {
    var dir = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
    if (!dir) return;
    e.preventDefault(); take(); go(dir);
  });
  prev.addEventListener("click", function () { take(); go(-1); });
  next.addEventListener("click", function () { take(); go(1); });
  function size() { W = pages.clientWidth / 2 || 1; H = pages.clientHeight || 1; }
  window.addEventListener("resize", function () { size(); if (turn) fold(); });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = 0; } } else if (demo || turn) kick();
  });

  size(); rest(false);
  if (demo) { lastDemo = -1900; kick(); }
})();
</script>
