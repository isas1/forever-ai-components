<style>
/* theme tokens — dark values are the defaults; light re-theme is the [data-theme="light"] block. */
:root{
  --ccp01-bg:#0a0a0f; --ccp01-acc:#ff5ca8;
  --ccp01-ring-a:.85; --ccp01-halo-a:.05; --ccp01-tendril-a:.45; --cap-o:.42;
}
:root[data-theme="light"]{
  --ccp01-bg:#f2f2f6; --ccp01-acc:#d60064;
  --ccp01-ring-a:.92; --ccp01-halo-a:.09; --ccp01-tendril-a:.4; --cap-o:.55;
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ccp01-bg)}
#ccp01-c{display:block;width:100%;height:100%;touch-action:none;cursor:none}
.ccp01-canvas:focus-visible{outline:2px solid var(--ccp01-acc);outline-offset:-4px}
.cap{position:fixed;left:9px;bottom:8px;font:600 10px/1 ui-monospace,Menlo,monospace;
  color:var(--ccp01-acc);opacity:var(--cap-o);letter-spacing:.1em;text-transform:uppercase;user-select:none;pointer-events:none}
</style><script type="application/json" id="forever-agent-meta">

</head><body>
<canvas class="ccp01-canvas" tabindex="0" aria-label="Pointer effect. Use arrow keys to steer." id="ccp01-c" role="img" aria-label="A follower dot and ring springing toward a moving pointer"></canvas>
<div class="cap">Magnetic Dot</div>
<script>(function(){
var cv=document.getElementById('ccp01-c'),ctx=cv.getContext('2d');
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
var demoEnabled=window.__foreverPreview?.demoEnabled!==false;
window.addEventListener('forever:interactive',takeover);
document.addEventListener('pointerdown',function(e){if(e.button===0)takeover();},{capture:true,passive:true});
var root=document.documentElement;
var W=0,H=0,DPR=1,running=true,raf=0,t0=0;

// colours JS draws with — read from tokens, re-read + invalidated on theme switch
var C={};
function hex2rgb(h){h=h.replace('#','');var n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];}
function syncTheme(){
  var cs=getComputedStyle(root);
  C.acc=cs.getPropertyValue('--ccp01-acc').trim();
  C.rgb=hex2rgb(C.acc);
  C.ringA=parseFloat(cs.getPropertyValue('--ccp01-ring-a'))||.85;
  C.haloA=parseFloat(cs.getPropertyValue('--ccp01-halo-a'))||.05;
  C.tendrilA=parseFloat(cs.getPropertyValue('--ccp01-tendril-a'))||.45;
}
// live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
addEventListener('message',function(e){
  var d=e.data;
  if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
    root.setAttribute('data-theme',d.theme);syncTheme();
    draw();      // no rAF loop in reduced motion — force a recolor
  }
});
syncTheme();

// target (the "pointer"), dot (fast follower), ring (laggy follower)
var tx=0,ty=0, dx=0,dy=0, rx=0,ry=0;       // positions
var rvx=0,rvy=0;                            // ring velocity (for squash)
var real=!demoEnabled, lastMove=-1e9;              // real-pointer takeover state

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=cv.clientWidth;H=cv.clientHeight;
  cv.width=Math.max(1,W*DPR);cv.height=Math.max(1,H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',function(){resize();draw();wake();});resize();
tx=dx=rx=W/2;ty=dy=ry=H/2;

// Lissajous self-demo path, eased & breathing, scaled to the frame
function demo(t){
  var cx=W/2,cy=H/2, ax=W*0.30, ay=H*0.26;
  return {x:cx+Math.sin(t*0.41)*ax+Math.sin(t*0.93)*ax*0.18,
          y:cy+Math.sin(t*0.67+1.1)*ay+Math.cos(t*0.31)*ay*0.22};
}

function onMove(e){
  var r=cv.getBoundingClientRect();
  tx=e.clientX-r.left;ty=e.clientY-r.top;
  real=true;lastMove=performance.now();
  if(reduce){dx=rx=tx;dy=ry=ty;rvx=rvy=0;draw();}else wake();
}
cv.addEventListener('pointermove',onMove);cv.addEventListener('pointerdown',onMove);
cv.addEventListener('pointerleave',function(){if(demoEnabled)real=false;});

cv.addEventListener('keydown',function(e){
  if(!/^Arrow(Left|Right|Up|Down)$/.test(e.key))return;
  e.preventDefault();takeover();var r=cv.getBoundingClientRect(),step=Math.max(8,Math.min(W,H)*.06);
  var x=tx+(e.key==='ArrowRight'?step:e.key==='ArrowLeft'?-step:0),y=ty+(e.key==='ArrowDown'?step:e.key==='ArrowUp'?-step:0);
  onMove({clientX:r.left+Math.max(0,Math.min(W,x)),clientY:r.top+Math.max(0,Math.min(H,y))});
});
function takeover(){if(!demoEnabled)return;demoEnabled=false;real=true;wake();}
function wake(){if(!reduce&&!document.hidden&&!raf){running=true;raf=requestAnimationFrame(frame);}}

function frame(now){
  raf=0;if(!running)return;
  if(!t0)t0=now;var t=(now-t0)/1000;
  // hand back to self-demo after 2.4s of stillness
  if(demoEnabled&&real && now-lastMove>2400)real=false;
  if(demoEnabled&&!real){var p=demo(t);tx=p.x;ty=p.y;}

  // springs: dot is tight & snappy, ring lags behind the dot
  dx+=(tx-dx)*0.22; dy+=(ty-dy)*0.22;
  var ox=rx,oy=ry;
  rx+=(dx-rx)*0.10; ry+=(dy-ry)*0.10;
  rvx=rx-ox; rvy=ry-oy;

  draw();
  if(running&&(demoEnabled||Math.abs(tx-dx)+Math.abs(ty-dy)+Math.abs(dx-rx)+Math.abs(dy-ry)>.03))raf=requestAnimationFrame(frame);
}

// Glows are baked once into offscreen sprites (rebuilt on resize / theme switch);
// a canvas shadow blur per frame is the expensive way to get the same look.
var SP={key:''};
function bake(half,paint){
  var c=document.createElement('canvas'),n=Math.ceil(half*2*DPR),g=c.getContext('2d');
  c.width=c.height=n;g.setTransform(DPR,0,0,DPR,n/2,n/2);paint(g);return c;
}
function ensureSprites(base,dr){
  var k=[base,dr,DPR,C.acc,C.rgb,C.ringA].join();
  if(SP.key===k)return;SP.key=k;
  SP.rh=base+26;SP.dh=dr+28;
  SP.ring=bake(SP.rh,function(g){
    g.lineWidth=1.6;g.strokeStyle='rgba('+C.rgb+','+C.ringA+')';
    g.shadowColor=C.acc;g.shadowBlur=14;
    g.beginPath();g.arc(0,0,base,0,6.2832);g.stroke();
  });
  SP.dot=bake(SP.dh,function(g){
    g.shadowColor=C.acc;g.shadowBlur=18;g.fillStyle=C.acc;
    g.beginPath();g.arc(0,0,dr,0,6.2832);g.fill();
  });
}
function draw(){
  ctx.clearRect(0,0,W,H);

  // velocity -> directional squash for the ring
  var sp=Math.sqrt(rvx*rvx+rvy*rvy);
  var ang=Math.atan2(rvy,rvx);
  var stretch=Math.min(sp*0.045,0.7);
  var base=Math.min(W,H)*0.085+10;

  // connecting tendril (dot -> ring), fades with distance
  var ddx=dx-rx,ddy=dy-ry,dist=Math.sqrt(ddx*ddx+ddy*ddy);
  if(dist>1){
    ctx.strokeStyle='rgba('+C.rgb+','+Math.min(dist/220,C.tendrilA)+')';
    ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(dx,dy);ctx.stroke();
  }

  // outer ring — squashed ellipse aligned to travel
  ctx.save();
  ctx.translate(rx,ry);ctx.rotate(ang);
  ctx.scale(1+stretch,1-stretch*0.55);
  ensureSprites(base,Math.min(W,H)*0.018+3.5);
  ctx.drawImage(SP.ring,-SP.rh,-SP.rh,SP.rh*2,SP.rh*2);
  ctx.restore();

  // faint trailing halo on the ring
  ctx.save();
  ctx.translate(rx,ry);
  ctx.fillStyle='rgba('+C.rgb+','+C.haloA+')';
  ctx.beginPath();ctx.arc(0,0,base*0.96,0,6.2832);ctx.fill();
  ctx.restore();

  // core dot — solid, glowing, with a tiny velocity smear
  ctx.save();
  var dr=Math.min(W,H)*0.018+3.5;
  ctx.drawImage(SP.dot,dx-SP.dh,dy-SP.dh,SP.dh*2,SP.dh*2);
  ctx.fillStyle='rgba(255,255,255,0.9)';
  ctx.beginPath();ctx.arc(dx-dr*0.25,dy-dr*0.25,dr*0.35,0,6.2832);ctx.fill();
  ctx.restore();
}

if(reduce){
  // settle to a single legible static frame: dot at center, ring concentric
  tx=dx=rx=W/2;ty=dy=ry=H/2;rvx=rvy=0;draw();return;
}

function vis(){
  if(document.hidden){running=false;cancelAnimationFrame(raf);raf=0;}
  else{t0=0;wake();}
}
document.addEventListener('visibilitychange',vis);
raf=requestAnimationFrame(frame);
})();</script>
</body></html>
