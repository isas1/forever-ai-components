<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="description" content="A glowing pink dot springs to the pointer while a laggy outer ring squashes along its travel, joined by a fading tendril.">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Magnetic Dot</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
/* theme tokens — dark values are the defaults; light re-theme is the [data-theme="light"] block. */
:root{
  --ccp01-bg:#0a0a0f; --ccp01-acc:#ff5ca8;
  --ccp01-ring-a:.85; --ccp01-halo-a:.05; --ccp01-tendril-a:.45; --cap-o:.42;
}
:root[data-theme="light"]{
  --ccp01-bg:#f2f2f6; --ccp01-acc:#d60064;
  --ccp01-ring-a:.92; --ccp01-halo-a:.09; --ccp01-tendril-a:.4; --cap-o:.55;
}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--ccp01-bg);display:grid;place-items:center}
#ccp01-c{display:block;width:100vw;height:100vh;cursor:none}
.cap{position:fixed;left:9px;bottom:8px;font:600 10px/1 ui-monospace,Menlo,monospace;
  color:var(--ccp01-acc);opacity:var(--cap-o);letter-spacing:.1em;text-transform:uppercase;user-select:none;pointer-events:none}
</style><script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/cursor-pointer/01-magnetic-dot.html",
 "title": "Magnetic Dot",
 "description": "Glowing pink dot springs to the pointer; a laggy outer ring squashes along its travel, joined by a fading tendril. Self-demos via Lissajous path when idle.",
 "useWhen": "Custom cursor replacements, interactive portfolio heroes, or any dark-background canvas needing a tactile pointer feel.",
 "avoidWhen": "Light backgrounds (hardcoded dark body), or UIs where hiding the native cursor would confuse users.",
 "agentPrompt": "Change the accent color from '#ff5ca8' to '#00eaff', increase dot spring stiffness from 0.22 to 0.35, and slow ring lag from 0.10 to 0.06. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "accent color (ACC = '#ff5ca8')",
  "dot spring stiffness (0.22)",
  "ring spring lag (0.10)",
  "ring base radius (W*0.085+10)",
  "self-demo Lissajous path amplitudes (ax, ay)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "DPR-aware canvas sizing",
  "visibilitychange pause/resume",
  "prefers-reduced-motion static fallback",
  "IIFE wrapper",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Light re-theme via the [data-theme=light] token block; catalog bg/accent describe the dark default",
  "cursor:none hides native cursor globally on the canvas element"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "cursor",
  "spring",
  "follower",

</head><body>
<canvas id="ccp01-c" role="img" aria-label="A follower dot and ring springing toward a moving pointer"></canvas>
<div class="cap">Magnetic Dot</div>
<script>(function(){
var cv=document.getElementById('ccp01-c'),ctx=cv.getContext('2d');
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
var root=document.documentElement;
var W=0,H=0,DPR=1,running=true,raf=0,t0=0;

// colours JS draws with — read from tokens, re-read + invalidated on theme switch
var C={};
function hex2rgb(h){h=h.replace('#','');var n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];}
function syncTheme(){
  var cs=getComputedStyle(root);
  C.acc=cs.getPropertyValue('--ccp01-acc').trim();
  C.rgb=hex2rgb(C.acc);
  C.ringA=parseFloat(cs.getPropertyValue('--ccp01-ring-a'))||.85;
  C.haloA=parseFloat(cs.getPropertyValue('--ccp01-halo-a'))||.05;
  C.tendrilA=parseFloat(cs.getPropertyValue('--ccp01-tendril-a'))||.45;
}
// live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
addEventListener('message',function(e){
  var d=e.data;
  if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
    root.setAttribute('data-theme',d.theme);syncTheme();
    if(reduce)draw();      // no rAF loop in reduced motion — force a recolor
  }
});
syncTheme();

// target (the "pointer"), dot (fast follower), ring (laggy follower)
var tx=0,ty=0, dx=0,dy=0, rx=0,ry=0;       // positions
var rvx=0,rvy=0;                            // ring velocity (for squash)
var real=false, lastMove=-1e9;              // real-pointer takeover state

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=cv.clientWidth;H=cv.clientHeight;
  cv.width=Math.max(1,W*DPR);cv.height=Math.max(1,H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize);resize();
tx=dx=rx=W/2;ty=dy=ry=H/2;

// Lissajous self-demo path, eased & breathing, scaled to the frame
function demo(t){
  var cx=W/2,cy=H/2, ax=W*0.30, ay=H*0.26;
  return {x:cx+Math.sin(t*0.41)*ax+Math.sin(t*0.93)*ax*0.18,
          y:cy+Math.sin(t*0.67+1.1)*ay+Math.cos(t*0.31)*ay*0.22};
}

function onMove(e){
  var r=cv.getBoundingClientRect();
  tx=e.clientX-r.left;ty=e.clientY-r.top;
  real=true;lastMove=performance.now();
}
cv.addEventListener('pointermove',onMove);
cv.addEventListener('pointerleave',function(){real=false;});

function frame(now){
  if(!t0)t0=now;var t=(now-t0)/1000;
  // hand back to self-demo after 2.4s of stillness
  if(real && now-lastMove>2400)real=false;
  if(!real){var p=demo(t);tx=p.x;ty=p.y;}

  // springs: dot is tight & snappy, ring lags behind the dot
  dx+=(tx-dx)*0.22; dy+=(ty-dy)*0.22;
  var ox=rx,oy=ry;
  rx+=(dx-rx)*0.10; ry+=(dy-ry)*0.10;
  rvx=rx-ox; rvy=ry-oy;

  draw();
  if(running)raf=requestAnimationFrame(frame);
}

function draw(){
  ctx.clearRect(0,0,W,H);

  // velocity -> directional squash for the ring
  var sp=Math.sqrt(rvx*rvx+rvy*rvy);
  var ang=Math.atan2(rvy,rvx);
  var stretch=Math.min(sp*0.045,0.7);
  var base=Math.min(W,H)*0.085+10;

  // connecting tendril (dot -> ring), fades with distance
  var ddx=dx-rx,ddy=dy-ry,dist=Math.sqrt(ddx*ddx+ddy*ddy);
  if(dist>1){
    ctx.strokeStyle='rgba('+C.rgb+','+Math.min(dist/220,C.tendrilA)+')';
    ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(dx,dy);ctx.stroke();
  }

  // outer ring — squashed ellipse aligned to travel
  ctx.save();
  ctx.translate(rx,ry);ctx.rotate(ang);
  ctx.scale(1+stretch,1-stretch*0.55);
  ctx.lineWidth=1.6;
  ctx.strokeStyle='rgba('+C.rgb+','+C.ringA+')';
  ctx.shadowColor=C.acc;ctx.shadowBlur=14;
  ctx.beginPath();ctx.arc(0,0,base,0,6.2832);ctx.stroke();
  ctx.restore();

  // faint trailing halo on the ring
  ctx.save();
  ctx.translate(rx,ry);
  ctx.fillStyle='rgba('+C.rgb+','+C.haloA+')';
  ctx.beginPath();ctx.arc(0,0,base*0.96,0,6.2832);ctx.fill();
  ctx.restore();

  // core dot — solid, glowing, with a tiny velocity smear
  ctx.save();
  ctx.shadowColor=C.acc;ctx.shadowBlur=18;
  ctx.fillStyle=C.acc;
  var dr=Math.min(W,H)*0.018+3.5;
  ctx.beginPath();ctx.arc(dx,dy,dr,0,6.2832);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,0.9)';
  ctx.beginPath();ctx.arc(dx-dr*0.25,dy-dr*0.25,dr*0.35,0,6.2832);ctx.fill();
  ctx.restore();
}

if(reduce){
  // settle to a single legible static frame: dot at center, ring concentric
  tx=dx=rx=W/2;ty=dy=ry=H/2;rvx=rvy=0;draw();return;
}

function vis(){
  if(document.hidden){running=false;cancelAnimationFrame(raf);}
  else if(!running){running=true;t0=0;raf=requestAnimationFrame(frame);}
}
document.addEventListener('visibilitychange',vis);
raf=requestAnimationFrame(frame);
})();</script>
</body></html>
