</head><body>
<canvas class="ccp04-canvas" tabindex="0" aria-label="Pointer effect. Use arrow keys to steer." id="ccp04-c" role="img" aria-label="Elastic ring trailing a moving pointer"></canvas>
<div class="cap">Elastic Ring</div>
<script>(function(){
var cv=document.getElementById('ccp04-c'),ctx=cv.getContext('2d');
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
var demoEnabled=window.__foreverPreview?.demoEnabled!==false;
window.addEventListener('forever:interactive',takeover);
document.addEventListener('pointerdown',function(e){if(e.button===0)takeover();},{capture:true,passive:true});
var root=document.documentElement;
var W=0,H=0,DPR=1,raf=0,running=true,t=0;

// colours JS draws with — read from tokens, re-read + invalidated on theme switch
var C={};
function hex2rgb(h){h=h.replace('#','');var n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];}
function syncTheme(){
  var cs=getComputedStyle(root);
  C.bg=cs.getPropertyValue('--ccp04-bg').trim();
  C.bgRgb=hex2rgb(C.bg);
  C.acc=cs.getPropertyValue('--ccp04-acc').trim();
  C.trailA=parseFloat(cs.getPropertyValue('--ccp04-trail-a'))||.30;
}
// live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
addEventListener('message',function(e){
  var d=e.data;
  if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
    root.setAttribute('data-theme',d.theme);syncTheme();
    render();    // no rAF loop in reduced motion — force a recolor
  }
});
syncTheme();

// pointer state: target (where we steer toward) and ring (lagging follower)
var tx=0,ty=0,rx=0,ry=0,vx=0,vy=0; // ring pos + velocity
var px=0,py=0; // raw pointer for spring target when real
var real=!demoEnabled,lastMove=-1e9,prx=0,pry=0;

function size(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=cv.clientWidth;H=cv.clientHeight;
  cv.width=Math.max(1,W*DPR);cv.height=Math.max(1,H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
size();window.addEventListener('resize',function(){size();render();wake();});

// Self-demo path: eased Lissajous figure, centred, scaled to frame
function demoPath(time){
  var cx=W/2,cy=H/2,R=Math.min(W,H)*0.30;
  var a=time*0.0011;
  // figure-eight-ish 3:2 Lissajous, slight breathing radius
  var br=R*(0.92+0.08*Math.sin(a*0.7));
  return {x:cx+Math.sin(a*2)*br*1.02, y:cy+Math.sin(a*3+0.6)*br*0.66};
}

function move(e){
  var r=cv.getBoundingClientRect();
  px=e.clientX-r.left;py=e.clientY-r.top;
  real=true;lastMove=t;
  if(reduce){tx=rx=px;ty=ry=py;vx=vy=0;render();}else wake();
}
cv.addEventListener('pointermove',move,{passive:true});cv.addEventListener('pointerdown',move,{passive:true});

cv.addEventListener('keydown',function(e){
  if(!/^Arrow(Left|Right|Up|Down)$/.test(e.key))return;
  e.preventDefault();takeover();var r=cv.getBoundingClientRect(),step=Math.max(8,Math.min(W,H)*.06);
  var x=px+(e.key==='ArrowRight'?step:e.key==='ArrowLeft'?-step:0),y=py+(e.key==='ArrowDown'?step:e.key==='ArrowUp'?-step:0);
  move({clientX:r.left+Math.max(0,Math.min(W,x)),clientY:r.top+Math.max(0,Math.min(H,y))});
});
function takeover(){if(!demoEnabled)return;demoEnabled=false;real=true;px=tx;py=ty;wake();}
function wake(){if(!reduce&&!document.hidden&&!raf){running=true;raf=requestAnimationFrame(loop);}}

// Glows are baked once as shadow-only sprites (rebuilt on resize / theme switch);
// the crisp stroke is still drawn live, so only the cheap part runs per frame.
var HS={key:''};
function halo(r,lw,glow,dash,fill){
  var h=Math.ceil(r+glow*2+lw+2),n=Math.ceil(h*2*DPR),off=n+16,c=document.createElement('canvas'),g=c.getContext('2d');
  c.width=c.height=n;g.setTransform(DPR,0,0,DPR,n/2-off,n/2);
  g.shadowOffsetX=off;g.shadowBlur=glow;g.shadowColor=C.acc;
  g.strokeStyle=g.fillStyle=C.acc;g.lineWidth=lw;g.setLineDash(dash||[]);
  g.beginPath();g.arc(0,0,r,0,Math.PI*2);fill?g.fill():g.stroke();
  return {c:c,h:h};
}
function ensureHalos(base){
  var k=[base,DPR,C.acc].join();
  if(HS.key===k)return;HS.key=k;
  HS.tgt=halo(base*0.34,1.5,8,[2,5]);HS.echo=halo(base*0.92,2,10);
  HS.main=halo(base,3,18);HS.dot=halo(base*0.10,0,14,null,true);
}
function drawRing(cx,cy,base,sx,sy,ang,alpha,lw,hs){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(ang);ctx.scale(sx,sy);
  ctx.globalAlpha=alpha;ctx.drawImage(hs.c,-hs.h,-hs.h,hs.h*2,hs.h*2);
  ctx.beginPath();ctx.arc(0,0,base,0,Math.PI*2);ctx.restore();
  ctx.lineWidth=lw;ctx.globalAlpha=alpha;ctx.strokeStyle=C.acc;ctx.stroke();
}

function render(){
  // trailing fade clears canvas + leaves faint motion trail
  ctx.globalAlpha=1;
  ctx.fillStyle='rgba('+C.bgRgb+','+C.trailA+')';ctx.fillRect(0,0,W,H);

  var base=Math.max(10,Math.min(W,H)*0.085);
  ensureHalos(base);

  // ---- pointer target selection ----
  if(demoEnabled&&real&&(t-lastMove)>2600){real=false;} // idle: hand back to demo
  if(real){
    // spring the demo target onto the real pointer
    tx+=(px-tx)*0.35;ty+=(py-ty)*0.35;
  }else if(demoEnabled){
    var d=demoPath(t);tx+=(d.x-tx)*0.10;ty+=(d.y-ty)*0.10; // ease onto path
  }

  // ---- ring follows target with lag + momentum ----
  var ox=rx,oy=ry;
  var ax=(tx-rx)*0.14, ay=(ty-ry)*0.14;
  vx=(vx+ax)*0.80;vy=(vy+ay)*0.80; // damped spring -> velocity
  rx+=vx;ry+=vy;

  // velocity drives deformation: stretch along travel, squash across
  var sp=Math.hypot(vx,vy);
  var ang=Math.atan2(vy,vx);
  var k=Math.min(0.85,sp*0.045);            // deform amount, capped
  var sx=1+k, sy=1-k*0.62;                   // stretch / squash (volume-ish)

  // soft outer echo ring lags a touch more — secondary motion
  var ex=rx-vx*1.4, ey=ry-vy*1.4;

  // dotted target reticle (where it's chasing)
  ctx.setLineDash([2,5]);
  drawRing(tx,ty,base*0.34,1,1,0,0.30,1.5,HS.tgt);
  ctx.setLineDash([]);

  // echo
  drawRing(ex,ey,base*0.92,1+k*0.5,1-k*0.3,ang,0.18,2,HS.echo);
  // main elastic ring
  drawRing(rx,ry,base,sx,sy,ang,0.95,3,HS.main);
  // inner core dot, scales subtly with speed
  var dr=Math.max(1.5,base*0.10*(1+k*0.5)),ds=dr/(base*0.10);
  ctx.globalAlpha=0.9;ctx.drawImage(HS.dot.c,rx-HS.dot.h*ds,ry-HS.dot.h*ds,HS.dot.h*ds*2,HS.dot.h*ds*2);
  ctx.fillStyle=C.acc;ctx.beginPath();ctx.arc(rx,ry,dr,0,Math.PI*2);ctx.fill();

  // velocity streak from echo to head
  // a wider faint underlay stands in for the old per-frame shadow on this line
  ctx.globalAlpha=Math.min(0.5,sp*0.03);
  ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(rx,ry);ctx.stroke();
  ctx.globalAlpha*=0.3;ctx.lineWidth=7;ctx.stroke();

  ctx.globalAlpha=1;
}

function loop(){
  raf=0;if(!running)return;
  t+=16.7;render();
  if(demoEnabled||Math.abs(tx-rx)+Math.abs(ty-ry)+Math.abs(tx-px)+Math.abs(ty-py)+Math.abs(vx)+Math.abs(vy)>.03)raf=requestAnimationFrame(loop);
}

function start(){
  // seed positions at centre
  px=tx=rx=W/2;py=ty=ry=H/2;
  if(reduce){
    var d=demoPath(0);tx=d.x;ty=d.y;rx=tx-40;ry=ty-26;
    vx=8;vy=5; // frozen mid-flight so deformation is visible
    ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
    render();return;
  }
  loop();
}

function vis(){
  if(document.hidden){running=false;if(raf)cancelAnimationFrame(raf);raf=0;}
  else wake();
}
document.addEventListener('visibilitychange',vis);
start();
})();</script>
</body></html>
