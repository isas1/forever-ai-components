<!doctype html><html lang="en"><head><meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1"><title>Ripple Field</title>
<script>

   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>

:root{
  --ccp06-bg:#0a0a0f; --ccp06-acc:#ff5ca8; --ccp06-neutral:#9696a8; --cap-o:.45;
}
:root[data-theme="light"]{
  --ccp06-bg:#f2f2f6; --ccp06-acc:#d60064; --ccp06-neutral:#8a8a9e; --cap-o:.55;
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ccp06-bg)}
#ccp06-c{display:block;width:100%;height:100%;touch-action:none}
.ccp06-canvas:focus-visible{outline:2px solid var(--ccp06-acc);outline-offset:-4px}
.cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;
  color:var(--ccp06-acc);opacity:var(--cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none;pointer-events:none}
</style><script type="application/json" id="forever-agent-meta">

 "avoidWhen": "Low-end devices — per-frame dot displacement loop scales with grid size. Light backgrounds require CSS overrides; avoid where subtle motion is needed.",

 "editableAreas": [

  "max simultaneous ripples (MAXR=8)",
  "auto-fire interval (interval=real?0.34:0.62)",

 ],
 "preserveElements": [

</head><body>
<canvas class="ccp06-canvas" tabindex="0" aria-label="Pointer effect. Use arrow keys to steer." id="ccp06-c"></canvas>
<div class="cap">Ripple Field</div>
<script>(function(){
var cv=document.getElementById('ccp06-c'), x=cv.getContext('2d');
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
var demoEnabled=window.__foreverPreview?.demoEnabled!==false;
window.addEventListener('forever:interactive',takeover);
document.addEventListener('pointerdown',function(e){if(e.button===0)takeover();},{capture:true,passive:true});
var root=document.documentElement;
var W=0,H=0,dpr=Math.min(2,window.devicePixelRatio||1),DT=0;
var dots=[],cols=0,rows=0,gap=0,ox=0,oy=0,R=2.2;
var ripples=[],MAXR=8;

// colours JS draws with — read from tokens, re-read + invalidated on theme switch
var C={};
function hex2rgb(h){h=h.replace('#','');var n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];}
function syncTheme(){
  var cs=getComputedStyle(root);
  C.accRgb=hex2rgb(cs.getPropertyValue('--ccp06-acc').trim());
  C.neutralRgb=hex2rgb(cs.getPropertyValue('--ccp06-neutral').trim());
}
// live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
addEventListener('message',function(e){
  var d=e.data;
  if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
    root.setAttribute('data-theme',d.theme);syncTheme();
    draw();      // no rAF loop in reduced motion — force a recolor
  }
});
syncTheme();

function resize(){
  W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
  gap=Math.max(14,Math.min(W,H)/16);
  R=Math.max(1.6,gap*0.16);
  cols=Math.floor(W/gap)-1;rows=Math.floor(H/gap)-1;
  cols=Math.max(3,cols);rows=Math.max(3,rows);
  ox=(W-(cols-1)*gap)/2;oy=(H-(rows-1)*gap)/2;
  dots.length=0;
  for(var j=0;j<rows;j++)for(var i=0;i<cols;i++){
    dots.push({hx:ox+i*gap,hy:oy+j*gap,x:0,y:0,s:1,o:0});
  }
}
function fire(px,py){
  if(ripples.length>=MAXR)ripples.shift();
  ripples.push({x:px,y:py,t:0,life:1.55});
}
// virtual pointer
var vt=0,vx=0,vy=0,px=0,py=0,real=!demoEnabled,lastMove=-1e9,lastFire=0;
function lissa(t){
  var cx=W*0.5,cy=H*0.5,ax=W*0.34,ay=H*0.30;
  return [cx+Math.sin(t*0.62)*ax, cy+Math.sin(t*0.41+0.9)*ay];
}
function vis(){if(document.hidden){running=false;if(raf)cancelAnimationFrame(raf);raf=0;}else wake();}
var running=true,raf=0,last=0;
window.addEventListener('resize',function(){resize();draw();wake();});
function move(e){
  var r=cv.getBoundingClientRect();
  px=e.clientX-r.left;py=e.clientY-r.top;real=true;lastMove=performance.now();
  if(!demoEnabled){fire(px,py);if(reduce){vx=px;vy=py;draw();}else wake();}
}
cv.addEventListener('pointermove',move);cv.addEventListener('pointerdown',move);

cv.addEventListener('keydown',function(e){
  if(!/^Arrow(Left|Right|Up|Down)$/.test(e.key))return;
  e.preventDefault();takeover();var r=cv.getBoundingClientRect(),step=Math.max(8,Math.min(W,H)*.06);
  var x=px+(e.key==='ArrowRight'?step:e.key==='ArrowLeft'?-step:0),y=py+(e.key==='ArrowDown'?step:e.key==='ArrowUp'?-step:0);
  move({clientX:r.left+Math.max(0,Math.min(W,x)),clientY:r.top+Math.max(0,Math.min(H,y))});
});
function takeover(){if(!demoEnabled)return;demoEnabled=false;real=true;px=vx;py=vy;wake();}
function wake(){if(!reduce&&!document.hidden&&!raf){running=true;last=performance.now();raf=requestAnimationFrame(loop);}}
document.addEventListener('visibilitychange',vis);

function step(dt){
  var now=performance.now();
  if(demoEnabled&&real&&now-lastMove>2600)real=false;
  vt+=dt;
  var tx,ty;
  if(real){tx=px;ty=py;}else{var p=lissa(vt);tx=p[0];ty=p[1];}
  // spring follow for cursor marker
  vx+=(tx-vx)*Math.min(1,dt*(real?14:5));
  vy+=(ty-vy)*Math.min(1,dt*(real?14:5));
  // auto-fire taps along the path / under real pointer
  lastFire+=dt;
  var interval=real?0.34:0.62;
  if(demoEnabled&&lastFire>=interval){lastFire=0;fire(vx,vy);}
  // advance ripples
  for(var k=ripples.length-1;k>=0;k--){
    var rp=ripples[k];rp.t+=dt;if(rp.t>=rp.life)ripples.splice(k,1);
  }
  // displace dots
  var ringSpeed=Math.max(W,H)*0.62;
  for(var n=0;n<dots.length;n++){
    var d=dots[n],dx=0,dy=0,sc=1,glow=0;
    for(var k2=0;k2<ripples.length;k2++){
      var rp2=ripples[k2],e=rp2.t/rp2.life;
      var rad=rp2.t*ringSpeed;
      var ddx=d.hx-rp2.x,ddy=d.hy-rp2.y,dist=Math.sqrt(ddx*ddx+ddy*ddy)||1;
      var band=dist-rad;
      var w=Math.exp(-(band*band)/(gap*gap*2.4));
      var amp=(1-e)*w;
      if(amp>0.002){
        var push=amp*gap*0.55/dist;
        dx+=ddx*push;dy+=ddy*push;
        sc+=amp*1.4;glow+=amp;
      }
    }
    d.x+=(dx-d.x)*Math.min(1,dt*16);
    d.y+=(dy-d.y)*Math.min(1,dt*16);
    d.s+=(sc-d.s)*Math.min(1,dt*16);
    d.o+=(Math.min(1,glow)-d.o)*Math.min(1,dt*14);
  }
}
function draw(){
  x.clearRect(0,0,W,H);
  var a=C.accRgb;
  for(var n=0;n<dots.length;n++){
    var d=dots[n],r=R*d.s;
    var base=0.16+d.o*0.84;
    x.beginPath();x.arc(d.hx+d.x,d.hy+d.y,r,0,6.2832);
    if(d.o>0.04){
      x.fillStyle='rgba('+a+','+base.toFixed(3)+')';
    }else{
      x.fillStyle='rgba('+C.neutralRgb+','+base.toFixed(3)+')';
    }
    x.fill();
  }
  // ripple rings
  var ringSpeed=Math.max(W,H)*0.62;
  for(var k=0;k<ripples.length;k++){
    var rp=ripples[k],e=rp.t/rp.life,rad=rp.t*ringSpeed;
    x.beginPath();x.arc(rp.x,rp.y,rad,0,6.2832);
    x.strokeStyle='rgba('+a+','+((1-e)*0.22).toFixed(3)+')';
    x.lineWidth=1.2;x.stroke();
  }
  // cursor marker
  x.beginPath();x.arc(vx,vy,R*1.5,0,6.2832);
  x.strokeStyle='rgba('+a+',0.55)';
  x.lineWidth=1.4;x.stroke();
  x.beginPath();x.arc(vx,vy,R*0.5,0,6.2832);
  x.fillStyle='rgba('+a+',0.9)';x.fill();
}
function loop(now){
  raf=0;if(!running)return;
  var dt=Math.max(0,Math.min(0.05,(now-last)/1000));last=now;
  step(dt);draw();
  if(demoEnabled||ripples.length||Math.abs(px-vx)+Math.abs(py-vy)>.03||dots.some(function(d){return Math.abs(d.x)+Math.abs(d.y)+Math.abs(d.s-1)+d.o>.01;}))raf=requestAnimationFrame(loop);
}
resize();vx=px=W*.5;vy=py=H*.5;draw();
if(reduce){
  // single static, legible frame: a few settled ripples
  fire(W*0.42,H*0.45);fire(W*0.62,H*0.6);
  for(var s=0;s<40;s++)step(0.016);
  vx=W*0.5;vy=H*0.5;draw();
}else{
  last=performance.now();if(demoEnabled||ripples.length||Math.abs(px-vx)+Math.abs(py-vy)>.03||dots.some(function(d){return Math.abs(d.x)+Math.abs(d.y)+Math.abs(d.s-1)+d.o>.01;}))raf=requestAnimationFrame(loop);
}
})();</script>
</body></html>
