<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Crate Sleeve Loupe — circular 3x optical magnifier over album back cover liner notes and barcode.">
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crate Sleeve Loupe</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
:root{--b:#131316;--i:#F1F1F4;--c:#7B95C4;--sp:cubic-bezier(.3,1.45,.5,1);color-scheme:dark}
:root[data-theme="light"]{--b:#EFF0F3;--i:#000;--c:#2B4473;color-scheme:light}
html,body{margin:0;height:100%;overflow:hidden;background:var(--b);color:var(--i);font:14px/1.3 "Avenir Next",Avenir,system-ui,sans-serif}
.cr15-st,.cr15-st *{box-sizing:border-box}
.cr15-st{position:relative;width:100%;height:100%;display:grid;place-items:center;padding:clamp(8px,3vmin,20px);background:var(--b);color:var(--i)}
.cr15-st :focus-visible{outline:2px solid var(--c);outline-offset:2px}
.cr15-lp{position:relative;width:min(100%,216px);aspect-ratio:1;touch-action:none;user-select:none;border-radius:2px}
@media (hover:hover) and (pointer:fine){.cr15-lp{cursor:none}}
.cr15-img{display:block;width:100%;height:100%;border-radius:2px}
.cr15-ln{position:absolute;left:0;top:0;z-index:3;width:clamp(68px,38vmin,124px);height:clamp(68px,38vmin,124px);border-radius:50%;overflow:hidden;border:2px solid var(--i);background:#F2F0EA;pointer-events:none;scale:0;transition:scale .3s var(--sp)}
.cr15-lp.cr15-on .cr15-ln{scale:1}
.cr15-zm{position:absolute;left:0;top:0;max-width:none}
.cr15-cap{position:absolute;left:10px;bottom:8px;font:500 11px/1 ui-monospace,monospace;color:var(--i);opacity:.45;letter-spacing:.04em;text-transform:uppercase;pointer-events:none;user-select:none}
@media (prefers-reduced-motion:reduce){.cr15-st *{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/cursor-pointer/07-crate-sleeve-loupe.html",
 "title": "Crate Sleeve Loupe",
 "description": "Smooth-pursuit magnification loupe over geometric sleeve art with coordinate alignment and arrow-key stepping.",
 "useWhen": "Print detail inspection, vinyl pressing marks, and product zoom previews.",
 "avoidWhen": "Multi-resolution raster map tiles.",
 "agentPrompt": "Edit --b/--i/--c/--l tokens in :root and [data-theme=\"light\"].",
 "editableAreas": [
  "theme CSS tokens (--b/--i/--c/--l), data arrays & timings"
 ],
 "preserveElements": [
  "IIFE + crNN- prefix, reduced-motion, visibilitychange, theme/demo-v1"
 ],
 "knownLimitations": [
  "Demo state resets on remount"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "themeable",
  "light-ready"
 ],
 "tags": [
  "magnifier",
  "loupe",
  "svg",
  "pointer",
  "zoom",
  "crate"
 ]
}

<body>
<div class="cr15-st" id="cr15-st"></div>
<div class="cr15-cap" aria-hidden="true">Sleeve Loupe</div>
<script>(()=>{
  const s=document.getElementById('cr15-st'),RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  const Z=3,k='#0A0A0A',bars=(()=>{let x=142,o='';[2,1,3,1,1,2,1,3,2,1,1,2,3,1,2,1,1,3,1,2].forEach((w,i)=>{if(i%2===0)o+=`<rect x="${x}" y="140" width="${w}" height="30" fill="${k}"/>`;x+=w+.6});return o})();
  const lines=(a,x,y)=>a.map((t,i)=>`<text x="${x}" y="${y+i*5.2}">${t}</text>`).join('');
  const BACK=`<rect width="200" height="200" fill="#F2F0EA"/><rect x="14" y="14" width="64" height="64" fill="#2B4473"/><circle cx="46" cy="46" r="20" fill="#F2F0EA"/><circle cx="46" cy="46" r="6" fill="#D5412B"/><g fill="${k}" font-family="ui-monospace,Menlo,Consolas,monospace"><text x="90" y="26" font-size="12" font-weight="700">LOW TIDE</text><text x="90" y="35" font-size="5">Marlo Finch</text><g font-size="3.3">${lines(['SIDE A','1 Low Tide ......... 4:12','2 Harbour Wall ..... 3:48','3 Salt Line ........ 5:02','4 Gulls ............ 2:57','','SIDE B','1 Night Ferry ...... 6:10','2 Brackish ......... 4:33','3 Tin Bell ......... 3:21','4 Slack Water ...... 7:05'],90,47)}${lines(['Recorded in two days at Quay Street.','No overdubs. Play loud, flip gently.','Sleeve cut by hand. Pressed on 180 g.','','P.S. Nice eyes.'],14,92)}</g><text x="14" y="187" font-size="4.2" font-weight="700">CR-014 STEREO 33 RPM</text><text x="142" y="177" font-size="3">5 014 2026 1</text></g><rect x="14" y="126" width="172" height="1" fill="${k}"/><circle cx="32" cy="155" r="15" fill="#E2B01A"/><circle cx="66" cy="155" r="15" fill="#D5412B"/><circle cx="100" cy="155" r="15" fill="${k}"/>${bars}`;
  s.innerHTML=`<div class="cr15-lp" tabindex="0" role="group" aria-roledescription="magnifier" aria-label="Back cover of Low Tide. Arrow keys move the magnifier."><svg class="cr15-img" viewBox="0 0 200 200" aria-hidden="true">${BACK}</svg><div class="cr15-ln" aria-hidden="true"><svg class="cr15-zm" viewBox="0 0 200 200">${BACK}</svg></div></div>`;
  const lp=s.querySelector('.cr15-lp'),lens=s.querySelector('.cr15-ln'),zm=s.querySelector('.cr15-zm');
  let px=0,py=0,demo=!RM()&&!(window.__foreverPreview&&window.__foreverPreview.demoEnabled===false),raf=0,t0=0;
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
  const put=(x,y,lift)=>{const W=lp.offsetWidth||160,L=lens.offsetWidth||96;px=clamp(x,0,W);py=clamp(y,0,W);zm.style.width=zm.style.height=W*Z+'px';zm.style.transform=`translate(${L/2-2-px*Z}px,${L/2-2-py*Z}px)`;lens.style.transform=`translate(${px-L/2}px,${Math.max(py-L/2-(lift?54:0),-34)}px)`};
  const at=e=>{const r=lp.getBoundingClientRect();put(e.clientX-r.left,e.clientY-r.top,e.pointerType!=='mouse')};
  const on=v=>lp.classList.toggle('cr15-on',v);
  const stop=()=>{cancelAnimationFrame(raf);raf=0},halt=()=>{demo=false;stop()};
  lp.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'){halt();at(e);on(true)}});
  lp.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'){halt();lp.setPointerCapture(e.pointerId);at(e);on(true)}});
  lp.addEventListener('pointermove',e=>{if(lp.classList.contains('cr15-on')&&!demo)at(e)});
  lp.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')on(false)});
  ['pointerup','pointercancel'].forEach(t=>lp.addEventListener(t,e=>{if(e.pointerType!=='mouse')on(false)}));
  lp.addEventListener('focus',()=>{if(lp.matches(':focus-visible')){halt();const W=lp.offsetWidth;put(W*.62,W*.3);on(true)}});
  lp.addEventListener('blur',()=>on(false));
  lp.addEventListener('keydown',e=>{const st=e.shiftKey?36:12,m={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[e.key];if(m){e.preventDefault();halt();put(px+m[0],py+m[1]);on(true)}else if(e.key==='Escape')on(false)});

  const tick=now=>{if(!demo||RM()||document.hidden){raf=0;return}const t=(now-t0)/1000,W=lp.offsetWidth||160;
    on(true);put(W*(.5+.24*Math.sin(t*1.15)),W*(.44+.22*Math.sin(t*1.9)));raf=requestAnimationFrame(tick)};
  const start=()=>{if(!raf&&demo&&!RM()&&!document.hidden){t0=performance.now();raf=requestAnimationFrame(tick)}};
  window.addEventListener('forever:interactive',halt);
  document.addEventListener('visibilitychange',()=>document.hidden?stop():demo&&start());
  window.addEventListener('message',e=>{if(e.data&&e.data.type==='forever:theme'&&(e.data.theme==='light'||e.data.theme==='dark'))document.documentElement.setAttribute('data-theme',e.data.theme)});
  if(demo)start();
})();</script>
</body>
</html>
