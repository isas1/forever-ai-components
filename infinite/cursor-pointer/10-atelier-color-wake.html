  }
  @media (max-aspect-ratio: 3/4) {

<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var wrap = document.getElementById("at23-wrap");
  var grid = document.getElementById("at23-grid");
  var over = document.getElementById("at23-over");
  var tiles = [].slice.call(grid.querySelectorAll(".at23-t"));
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var demo = !reduce && (!window.__foreverPreview || window.__foreverPreview.demoEnabled !== false);
  var trail = [], pins = [], raf = 0, head = null, focusI = -1;

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "forever:theme" && (e.data.theme === "light" || e.data.theme === "dark")) root.setAttribute("data-theme", e.data.theme);
  });

  tiles.forEach(function (t) {
    var d = document.createElement("div");
    d.className = "at23-t";
    d.innerHTML = t.innerHTML;
    over.appendChild(d);
  });

  function centre(i) {
    var w = wrap.getBoundingClientRect(), r = tiles[i].getBoundingClientRect();
    return { x: r.left - w.left + r.width / 2, y: r.top - w.top + r.height / 2, r: r.width * 0.95, life: 1 };
  }
  function setMask(list) {
    var s = list.map(function (b) {
      var r = Math.max(0, b.r * b.life);
      return "radial-gradient(circle " + r.toFixed(1) + "px at " + b.x.toFixed(1) + "px " + b.y.toFixed(1) + "px,#000 35%,transparent)";
    }).join(",") || "linear-gradient(transparent,transparent)";
    over.style.webkitMaskImage = s;
    over.style.maskImage = s;
  }
  function drop(x, y) {
    var size = wrap.clientWidth * 0.3, last = trail[trail.length - 1];
    if (last && Math.abs(last.x - x) + Math.abs(last.y - y) < size * 0.3) { last.x = x; last.y = y; last.life = 1; return; }
    trail.push({ x: x, y: y, r: size, life: 1 });
    if (trail.length > 9) trail.shift();
  }
  function fixed() {
    var list = pins.map(centre);
    if (focusI >= 0 && pins.indexOf(focusI) < 0) list.push(centre(focusI));
    return list;
  }

  function tick(ts) {
    raf = 0;
    if (document.hidden) return;
    if (demo) {
      var a = ts / 1000, w = wrap.clientWidth, h = wrap.clientHeight;
      drop(w / 2 + Math.cos(a * 0.9) * w * 0.4, h / 2 + Math.sin(a * 1.7) * h * 0.36);
    }
    trail = trail.filter(function (b) {
      if (b !== head) b.life -= 0.018;
      return b.life > 0;
    });
    setMask(trail.concat(fixed()));
    if (demo || trail.length) raf = requestAnimationFrame(tick);
  }
  function kick() {
    if (reduce) return;
    if (!raf && !document.hidden) raf = requestAnimationFrame(tick);
  }
  function take() { demo = false; }

  function trace(e) {
    take();
    if (reduce) return;
    var w = wrap.getBoundingClientRect();
    drop(e.clientX - w.left, e.clientY - w.top);
    head = trail[trail.length - 1];
    kick();
  }
  function lift() { head = null; kick(); }
  window.addEventListener("forever:interactive", take);
  window.addEventListener("pointermove", trace);
  window.addEventListener("pointerdown", trace);
  window.addEventListener("pointerup", function (e) { if (e.pointerType !== "mouse") lift(); });
  window.addEventListener("pointercancel", lift);
  root.addEventListener("pointerleave", lift);

  tiles.forEach(function (t, i) {
    t.addEventListener("focus", function () {
      if (t.matches(":focus-visible")) { take(); focusI = i; if (reduce) return; setMask(trail.concat(fixed())); kick(); }
    });
    t.addEventListener("blur", function () { focusI = -1; if (!reduce) { setMask(trail.concat(fixed())); kick(); } });
    t.addEventListener("click", function () {
      take();
      var at = pins.indexOf(i);
      if (at < 0) pins.push(i); else pins.splice(at, 1);
      t.setAttribute("aria-pressed", at < 0 ? "true" : "false");
      if (!reduce) { setMask(trail.concat(fixed())); kick(); }
    });
    t.addEventListener("keydown", function (e) {
      var step = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : e.key === "ArrowDown" ? 3 : e.key === "ArrowUp" ? -3 : 0;
      if (!step) return;
      e.preventDefault();
      tiles[(i + step + tiles.length) % tiles.length].focus();
    });
  });
  window.addEventListener("resize", function () { if (!reduce) setMask(trail.concat(fixed())); });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = 0; } } else kick();
  });

  if (!reduce) { setMask([]); if (demo) kick(); }
})();
</script>
