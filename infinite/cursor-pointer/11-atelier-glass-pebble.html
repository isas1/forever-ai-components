<style>

    --at25-clay: #C4683F; --at25-sage: #7F9678; --at25-slate: #8C97A6;

    --at25-ink: #1C1B19;
    --at25-accent: #C43B16;
    --at25-frost: rgba(110, 124, 136, 0.1);
    --at25-rim: rgba(28, 27, 25, 0.26);
    --at25-stone: #C9CCCB;
    --at25-shadow: rgba(60, 50, 35, 0.32);
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background-color: var(--at25-bg); color: var(--at25-ink); transition: background-color 0.25s ease; }
  .at25-stage { position: absolute; inset: 0; overflow: hidden; background-color: var(--at25-bg); }
  .at25-defs { position: absolute; width: 0; height: 0; }
  .at25-scene { position: absolute; inset: 0; background-color: var(--at25-bg); user-select: none; }
  .at25-copy { inset: auto; left: 0; top: 0; }
  .at25-word {
    position: absolute; left: 0; right: 0; top: 50%;
    transform: translateY(-58%); text-align: center;
    font: 600 clamp(34px, 21vmin, 132px)/1 ui-serif, Georgia, "Times New Roman", serif;
    letter-spacing: -0.02em; color: var(--at25-ink);

  .at25-o1 { position: absolute; left: 13%; top: 14%; width: 20vmin; height: 20vmin; border-radius: 50%; background: var(--at25-clay); }
  .at25-o2 { position: absolute; right: 12%; bottom: 17%; width: 32vmin; height: 5vmin; border-radius: 99px; background: var(--at25-sage); }
  .at25-o3 { position: absolute; right: 17%; top: 13%; width: 14vmin; height: 14vmin; border-radius: 50%; border: 1.4vmin solid var(--at25-slate); }
  .at25-o4 { position: absolute; left: 17%; bottom: 26%; width: 22vmin; height: 2px; background: var(--at25-ink); }
  .at25-peb {
    --at25-shape: 58% 42% 47% 53% / 55% 48% 52% 45%;
    position: absolute; left: 0; top: 0;
    width: clamp(88px, 34vmin, 170px); aspect-ratio: 1 / 0.86;
    padding: 0; border: 0; background: none;
    border-radius: var(--at25-shape);
    box-shadow: 0 12px 14px -9px var(--at25-shadow);
    cursor: grab; touch-action: none; will-change: transform;
    -webkit-tap-highlight-color: transparent;

  .at25-peb:active { cursor: grabbing; }
  .at25-peb:focus-visible { outline: 2px solid var(--at25-accent); outline-offset: 4px; }
  .at25-lens, .at25-rim { position: absolute; inset: 0; border-radius: var(--at25-shape); }
  .at25-lens { overflow: hidden; filter: url(#at25-warp); }
  .at25-rim { background: var(--at25-frost); box-shadow: inset 0 0 0 1.5px var(--at25-rim), inset 0 -8px 10px -8px var(--at25-shadow); }

<body>
<div class="at25-stage" id="at25-stage">
  <svg class="at25-defs" aria-hidden="true"><filter id="at25-warp" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="1" seed="7"/><feDisplacementMap in="SourceGraphic" scale="16" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
  <div class="at25-scene" id="at25-scene" aria-hidden="true">
    <span class="at25-o1"></span><span class="at25-o3"></span><span class="at25-o2"></span><span class="at25-o4"></span>
    <span class="at25-word">Forever</span>
  </div>
  <button type="button" class="at25-peb" id="at25-peb" aria-label="Glass pebble. Arrow keys move it, Home puts it back">
    <span class="at25-lens" id="at25-lens"></span><span class="at25-rim"></span>
  </button>
</div>
<div class="at25-cap" aria-hidden="true">Atelier Glass Pebble</div>
<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var stage = document.getElementById("at25-stage");
  var peb = document.getElementById("at25-peb");
  var lens = document.getElementById("at25-lens");
  var copy = document.getElementById("at25-scene").cloneNode(true);
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var demo = !reduce && (!window.__foreverPreview || window.__foreverPreview.demoEnabled !== false);
  var W = 1, H = 1, pw = 1, ph = 1, x = 0, y = 0, vx = 0, vy = 0, tx = 0, ty = 0, raf = 0, grab = null;

  copy.removeAttribute("id");
  copy.classList.add("at25-copy");
  lens.appendChild(copy);

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "forever:theme" && (e.data.theme === "light" || e.data.theme === "dark")) root.setAttribute("data-theme", e.data.theme);
  });

  function clamp() {
    tx = Math.max(4, Math.min(W - pw - 4, tx));
    ty = Math.max(4, Math.min(H - ph - 4, ty));
  }
  function home() { tx = W * 0.6 - pw / 2; ty = H * 0.47 - ph / 2; clamp(); }
  function size() {
    W = stage.clientWidth || 1; H = stage.clientHeight || 1;
    pw = peb.offsetWidth || 1; ph = peb.offsetHeight || 1;
    copy.style.width = W + "px"; copy.style.height = H + "px";
  }
  function paint() {
    peb.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) rotate(" + (vx * 0.5).toFixed(2) + "deg)";
    var ox = x + pw / 2, oy = y + ph / 2;
    var sx = (ox - W / 2) * 0.1 - vx * 2.2, sy = (oy - H / 2) * 0.1 - vy * 2.2;
    copy.style.transformOrigin = ox.toFixed(1) + "px " + oy.toFixed(1) + "px";
    copy.style.transform = "translate(" + (-x + sx).toFixed(1) + "px," + (-y + sy).toFixed(1) + "px) scale(1.32)";
  }
  function tick(ts) {
    raf = 0;
    if (document.hidden) return;
    if (demo) {
      var a = ts / 1000;
      tx = W / 2 - pw / 2 + Math.cos(a * 0.7) * W * 0.27;
      ty = H / 2 - ph / 2 + Math.sin(a * 1.1) * H * 0.14;
      clamp();
    }
    if (reduce) { x = tx; y = ty; vx = vy = 0; }
    else {
      vx = (vx + (tx - x) * 0.085) * 0.76; x += vx;
      vy = (vy + (ty - y) * 0.085) * 0.76; y += vy;
    }
    paint();
    if (demo || grab || Math.abs(vx) + Math.abs(vy) + Math.abs(tx - x) + Math.abs(ty - y) > 0.05) raf = requestAnimationFrame(tick);
  }
  function kick() { if (!raf && !document.hidden) raf = requestAnimationFrame(tick); }
  function take() { demo = false; }

  window.addEventListener("forever:interactive", take);
  peb.addEventListener("pointerdown", function (e) {
    take();
    grab = { x: e.clientX - tx, y: e.clientY - ty };
    tx = x; ty = y; grab.x = e.clientX - x; grab.y = e.clientY - y;
    if (peb.setPointerCapture) peb.setPointerCapture(e.pointerId);
    kick();
  });
  peb.addEventListener("pointermove", function (e) {
    if (!grab) return;
    tx = e.clientX - grab.x; ty = e.clientY - grab.y; clamp(); kick();
  });
  function drop() { grab = null; kick(); }
  peb.addEventListener("pointerup", drop);
  peb.addEventListener("pointercancel", drop);
  peb.addEventListener("keydown", function (e) {
    var k = e.key, s = e.shiftKey ? 56 : 14;
    if (k === "Home") home();
    else if (k === "ArrowLeft") tx -= s;
    else if (k === "ArrowRight") tx += s;
    else if (k === "ArrowUp") ty -= s;
    else if (k === "ArrowDown") ty += s;
    else return;
    e.preventDefault(); take(); clamp(); kick();
  });
  window.addEventListener("resize", function () { size(); clamp(); kick(); });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = 0; } } else kick();
  });

  size(); home(); x = tx; y = ty; paint();
  if (demo) kick();
})();
</script>
