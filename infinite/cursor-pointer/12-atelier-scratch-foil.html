<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var card = document.getElementById("at29-card");
  var cv = document.getElementById("at29-cv");
  var again = document.getElementById("at29-again");
  var live = document.getElementById("at29-live");
  var ctx = cv.getContext("2d");
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function coat(op) {

    ctx.fillStyle = cs.getPropertyValue("--at29-coat").trim();

    if (say) { again.hidden = false; live.textContent = "Picture revealed."; }

  function mark(x, y, r) {

    for (j = Math.max(0, (y - r) / ch | 0); j <= Math.min(GY - 1, (y + r) / ch | 0); j++) {

    }
  }
  function scratch(a, b, say) {
    var r = Math.max(14, Math.min(20, w * 0.085)), n = Math.ceil((Math.abs(b.x - a.x) + Math.abs(b.y - a.y)) / r) + 1, i;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = "destination-out";
    ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = r * 2;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x + 0.01, b.y); ctx.stroke();
    for (i = 0; i <= n; i++) mark(a.x + (b.x - a.x) * i / n, a.y + (b.y - a.y) * i / n, r * 0.7);
    if (hit / (GX * GY) >= 0.5) reveal(say);
  }

  function tick(ts) {
    raf = 0;
    if (document.hidden || !demo) return;
    if (done) {
      if (ts - doneAt > 2000) { reset(); t0 = ts; }
    } else {
      var a = (ts - t0) / 1000;
      var p = { x: w * (0.5 + 0.4 * Math.sin(a * 3.4)), y: h * (0.14 + 0.72 * ((a * 0.24) % 1)) };

      last = p;
    }
    raf = requestAnimationFrame(tick);
  }

    demo = false;
    reset();
  }

  });

    var p = pos(e);
