<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Simultaneous Disc — Orphist Colour Discs. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simultaneous Disc</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults; light re-theme = the [data-theme="light"] block.
     Every colour the canvas draws is read from here in syncTheme(). */
  :root{
    --del01-bg:#0c0d11; --del01-ink:#0d0e12; --del01-paper:#f3f0e8; --del01-fa:1;
    --del01-c1:#e23b2e; --del01-c2:#f08a24; --del01-c3:#f4c81e;
    --del01-c4:#2fa86a; --del01-c5:#1f6fd0; --del01-c6:#7b3fa0;
    --del01-cap:#f3f0e8; --del01-cap-o:.46;
  }
  :root[data-theme="light"]{
    --del01-bg:#f7f3ea; --del01-ink:#2c2418; --del01-paper:#fdfaf2; --del01-fa:.85;
    --del01-c1:#d42b1d; --del01-c2:#c26708; --del01-c3:#a07a06;
    --del01-c4:#248152; --del01-c5:#1a5cbb; --del01-c6:#6a3690;
    --del01-cap:#2c2418; --del01-cap-o:.5;
  }
  html,body{margin:0;height:100%;background:var(--del01-bg);overflow:hidden}
  #del01-stage{position:fixed;inset:0;width:100%;height:100%}
  #del01-cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  .del01-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--del01-cap);opacity:var(--del01-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/delaunay/01-simultaneous-disc.html",
 "title": "Simultaneous Disc",
 "description": "7 concentric spectrum rings counter-rotate in alternating directions; a shimmer overlay and pulsing center dot evoke Orphist colour.",
 "useWhen": "Art/design portfolios, colorful ambient backgrounds, exhibition kiosks inspired by early 20th-century abstract painting.",
 "avoidWhen": "Contexts requiring legible text overlays — constant rotation competes with reading. Not suitable where reduced-motion users need animation.",
 "agentPrompt": "Change RINGS from 7 to 9, slow outer ring speed by setting the per-ring increment from 0.04 to 0.02, and swap SPECTRUM to warm reds and golds. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "ring count (RINGS=7)",
  "segment count per ring (SEG=24)",
  "rotation speed base (0.12) and per-ring increment (0.04)",
  "color palette (SPECTRUM array)",
  "shimmer intensity (0.16*shimmer)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "DPR-aware fitCanvas with setTransform",
  "visibilitychange stop/start guard",
  "prefers-reduced-motion static draw fallback",
  "IIFE wrapper",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Background color hardcoded in both CSS and ctx.fillStyle — must change both to retheme",
  "No pointer interactivity — purely passive display",
  "Reduced-motion users see only a single static frame"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "orphism",
  "concentric-rings",
  "canvas",
  "color-theory",
  "generative",
  "ambient"
 ]
}
</script>
</head>
<body>
<div id="del01-stage" role="img" aria-label="Orphist colour: concentric full-spectrum rings counter-rotate against one another, simultaneous contrast shimmering where each band meets its neighbour.">
  <canvas id="del01-cv"></canvas>
</div>
<div class="del01-cap">Simultaneous Disc</div>
<script>
(function(){
  "use strict";
  const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv=document.getElementById('del01-cv'); if(!cv) return;
  const root=document.documentElement;
  const C={}, SPECTRUM=[];           /* colours JS draws with — read from the CSS tokens */
  function syncTheme(){
    const cs=getComputedStyle(root), v=n=>cs.getPropertyValue(n).trim();
    C.bg=v('--del01-bg'); C.ink=v('--del01-ink'); C.paper=v('--del01-paper');
    C.fa=parseFloat(v('--del01-fa'))||1;
    SPECTRUM.length=0;               /* invalidate the cached ring palette */
    for(let i=1;i<=6;i++) SPECTRUM.push(v('--del01-c'+i));
  }
  addEventListener('message',function(e){
    const d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
      root.setAttribute('data-theme',d.theme); syncTheme(); if(REDUCED) draw(performance.now());
    }
  });
  syncTheme();
  function fitCanvas(c){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const r=c.getBoundingClientRect();
    const w=Math.max(2,r.width), h=Math.max(2,r.height);
    c.width=Math.round(w*dpr); c.height=Math.round(h*dpr);
    const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
    return {ctx,w,h,dpr};
  }
  let S=fitCanvas(cv);
  const RINGS=7, SEG=24;
  let t=0,last=performance.now();
  function draw(now){
    const dt=Math.min(0.05,(now-last)/1000); last=now;
    if(!REDUCED) t+=dt;
    const ctx=S.ctx,W=S.w,H=S.h,cx=W/2,cy=H/2;
    const R=Math.min(W,H)*0.46;
    ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=C.fa;   /* light mode lays the discs as washes on paper; dark stays opaque */
    for(let ri=0;ri<RINGS;ri++){
      const r0=R*ri/RINGS, r1=R*(ri+1)/RINGS;
      const dir=ri%2? -1:1;
      const spin=t*(0.12+ri*0.04)*dir;
      for(let s=0;s<SEG;s++){
        const a0=spin + (s/SEG)*Math.PI*2;
        const a1=spin + ((s+1)/SEG)*Math.PI*2;
        ctx.beginPath();
        ctx.arc(cx,cy,r1,a0,a1);
        ctx.arc(cx,cy,r0,a1,a0,true);
        ctx.closePath();
        ctx.fillStyle=SPECTRUM[(s+ri)%SPECTRUM.length];
        ctx.fill();
      }
    }
    ctx.globalAlpha=1;
    const shimmer=0.5+0.5*Math.sin(t*1.6);
    ctx.globalCompositeOperation='overlay';
    ctx.globalAlpha=0.16*shimmer;
    ctx.fillStyle=C.paper;
    ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1;
    ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(cx,cy,R*0.13,0,7);ctx.fill();
    ctx.fillStyle=SPECTRUM[2];ctx.beginPath();ctx.arc(cx,cy,R*0.06+R*0.02*Math.sin(t*3),0,7);ctx.fill();
  }
  let raf=0, running=false;
  function loop(){ if(!running) return; draw(performance.now()); raf=requestAnimationFrame(loop); }
  function start(){ if(running) return; running=true; last=performance.now(); raf=requestAnimationFrame(loop); }
  function stop(){ running=false; if(raf) cancelAnimationFrame(raf); raf=0; }
  S.ctx.fillStyle=C.bg;S.ctx.fillRect(0,0,S.w,S.h);
  let _rt;
  window.addEventListener('resize', ()=>{ clearTimeout(_rt); _rt=setTimeout(()=>{ S=fitCanvas(cv); if(REDUCED) draw(performance.now()); },150); }, {passive:true});
  document.addEventListener('visibilitychange', ()=>{ if(REDUCED) return; if(document.hidden) stop(); else start(); });
  if(REDUCED){ draw(performance.now()); }
  else start();
})();
</script>
</body>
</html>
