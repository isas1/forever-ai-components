<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Circular Rhythm — Orphist Colour Discs. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Circular Rhythm</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults; light re-theme = the [data-theme="light"] block.
     Every colour the canvas draws is read from here in syncTheme(); --del02-blend swaps the
     additive glow (black ground) for normal compositing on paper. */
  :root{
    --del02-bg:#0c0d11; --del02-ring:#f3f0e8; --del02-fade:rgba(20,21,26,0); --del02-blend:lighter;
    --del02-c1:#e23b2e; --del02-c2:#f08a24; --del02-c3:#f4c81e;
    --del02-c4:#2fa86a; --del02-c5:#1f6fd0; --del02-c6:#7b3fa0;
    --del02-cap:#f3f0e8; --del02-cap-o:.46;
  }
  :root[data-theme="light"]{
    --del02-bg:#f7f3ea; --del02-ring:#3a3120; --del02-fade:rgba(247,243,234,0); --del02-blend:source-over;
    --del02-c1:#d42b1d; --del02-c2:#c26708; --del02-c3:#a07a06;
    --del02-c4:#248152; --del02-c5:#1a5cbb; --del02-c6:#6a3690;
    --del02-cap:#2c2418; --del02-cap-o:.5;
  }
  html,body{margin:0;height:100%;background:var(--del02-bg);overflow:hidden}
  #del02-stage{position:fixed;inset:0;width:100%;height:100%}
  #del02-cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  .del02-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--del02-cap);opacity:var(--del02-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/delaunay/02-circular-rhythm.html",
 "title": "Circular Rhythm",
 "description": "26 color discs pulse with sine-wave rhythm via radial gradients on a dark canvas; additive blending creates luminous overlaps in the Orphist palette.",
 "useWhen": "Dark-mode hero backgrounds, art/generative gallery tiles, ambient looping screensavers with a colorist aesthetic.",
 "avoidWhen": "Light-background UIs (background hardcoded dark near-black). Contexts needing legible text overlays — the additive blending creates bright hot spots.",
 "agentPrompt": "Change disc count to 40 by editing N=26, swap SPECTRUM to warm amber/coral tones, and slow the pulse by reducing each disc's sp range from 0.5+1.4 to 0.3+0.6. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "disc count (N=26)",
  "color palette (SPECTRUM array)",
  "pulse speed range (0.5+Math.random()*1.4)",
  "base radius range (10+Math.random()*46)",
  "opacity range (0.42+0.4*puls)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "globalCompositeOperation='lighter' for additive blending",
  "IIFE wrapper",
  "reduced-motion guard (REDUCED flag)",
  "visibilitychange stop/start",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Background color hardcoded in both CSS and canvas fillRect — must change both",
  "No pointer interactivity — fully passive",
  "40% of discs get a ring stroke; ratio is random per seed, not configurable"
 ],
 "tier": "curated",
 "labels": [
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "mobile-ready",
  "light-ready"
 ],
 "tags": [
  "canvas",
  "circles",
  "radial-gradient",
  "ambient",
  "generative",
  "additive-blend"
 ]
}
</script>
</head>
<body>
<div id="del02-stage" role="img" aria-label="A generative field after Orphist circular forms: many colour discs of varying size pulse in rhythm, swelling and fading like light breathing.">
  <canvas id="del02-cv"></canvas>
</div>
<div class="del02-cap">Circular Rhythm</div>
<script>
(function(){
  "use strict";
  const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv=document.getElementById('del02-cv'); if(!cv) return;
  const root=document.documentElement;
  const C={}, SPECTRUM=[];           /* colours JS draws with — read from the CSS tokens */
  function syncTheme(){
    const cs=getComputedStyle(root), v=n=>cs.getPropertyValue(n).trim();
    C.bg=v('--del02-bg'); C.ring=v('--del02-ring'); C.fade=v('--del02-fade'); C.blend=v('--del02-blend');
    SPECTRUM.length=0;               /* invalidate the cached disc palette (discs hold indices) */
    for(let i=1;i<=6;i++) SPECTRUM.push(v('--del02-c'+i));
  }
  addEventListener('message',function(e){
    const d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
      root.setAttribute('data-theme',d.theme); syncTheme(); if(REDUCED) draw(performance.now());
    }
  });
  syncTheme();
  function fitCanvas(c){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const r=c.getBoundingClientRect();
    const w=Math.max(2,r.width), h=Math.max(2,r.height);
    c.width=Math.round(w*dpr); c.height=Math.round(h*dpr);
    const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
    return {ctx,w,h,dpr};
  }
  let S=fitCanvas(cv);
  let discs=[];
  function seed(){
    discs=[];
    const N=26;
    for(let i=0;i<N;i++){
      discs.push({
        x:Math.random(), y:Math.random(),
        base:10+Math.random()*46,
        ci:(Math.random()*SPECTRUM.length)|0,   /* index, not a frozen colour string */
        ph:Math.random()*Math.PI*2,
        sp:0.5+Math.random()*1.4,
        ring:Math.random()<0.4
      });
    }
  }
  seed();
  let t=0,last=performance.now();
  function draw(now){
    const dt=Math.min(0.05,(now-last)/1000); last=now;
    if(!REDUCED) t+=dt;
    const ctx=S.ctx,W=S.w,H=S.h;
    ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation=C.blend;
    for(const d of discs){
      const puls=0.55+0.45*Math.sin(t*d.sp+d.ph);
      const r=d.base*(0.5+0.7*puls);
      const x=d.x*W, y=d.y*H;
      const col=SPECTRUM[d.ci];
      const g=ctx.createRadialGradient(x,y,0,x,y,r);   /* rebuilt per frame — no stale gradient */
      g.addColorStop(0, col);
      g.addColorStop(0.7, col);
      g.addColorStop(1, C.fade);
      ctx.globalAlpha=0.42+0.4*puls;
      ctx.fillStyle=g;
      ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
      if(d.ring){
        ctx.globalAlpha=0.5*puls;
        ctx.strokeStyle=C.ring;ctx.lineWidth=1.5;
        ctx.beginPath();ctx.arc(x,y,r*1.18,0,7);ctx.stroke();
      }
    }
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1;
  }
  let raf=0, running=false;
  function loop(){ if(!running) return; draw(performance.now()); raf=requestAnimationFrame(loop); }
  function start(){ if(running) return; running=true; last=performance.now(); raf=requestAnimationFrame(loop); }
  function stop(){ running=false; if(raf) cancelAnimationFrame(raf); raf=0; }
  S.ctx.fillStyle=C.bg;S.ctx.fillRect(0,0,S.w,S.h);
  let _rt;
  window.addEventListener('resize', ()=>{ clearTimeout(_rt); _rt=setTimeout(()=>{ S=fitCanvas(cv); seed(); if(REDUCED) draw(performance.now()); },150); }, {passive:true});
  document.addEventListener('visibilitychange', ()=>{ if(REDUCED) return; if(document.hidden) stop(); else start(); });
  if(REDUCED){ draw(performance.now()); }
  else start();
})();
</script>
</body>
</html>
