<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Prismatic Window — Orphist Colour Discs. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prismatic Window</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults; light re-theme = the [data-theme="light"] block.
     Every colour the canvas draws is read from here in syncTheme(); --del03-a* are the plane
     opacities (denser on paper so the panes keep their weight). */
  :root{
    --del03-bg:#0c0d11; --del03-grid:rgba(13,14,18,.5); --del03-a0:.34; --del03-a1:.32;
    --del03-c1:#e23b2e; --del03-c2:#f08a24; --del03-c3:#f4c81e;
    --del03-c4:#2fa86a; --del03-c5:#1f6fd0; --del03-c6:#7b3fa0;
    --del03-cap:#f3f0e8; --del03-cap-o:.46;
  }
  :root[data-theme="light"]{
    --del03-bg:#f7f3ea; --del03-grid:rgba(58,49,32,.32); --del03-a0:.5; --del03-a1:.38;
    --del03-c1:#d42b1d; --del03-c2:#c26708; --del03-c3:#a07a06;
    --del03-c4:#248152; --del03-c5:#1a5cbb; --del03-c6:#6a3690;
    --del03-cap:#2c2418; --del03-cap-o:.5;
  }
  html,body{margin:0;height:100%;background:var(--del03-bg);overflow:hidden}
  #del03-stage{position:fixed;inset:0;width:100%;height:100%}
  #del03-cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  .del03-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--del03-cap);opacity:var(--del03-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/delaunay/03-prismatic-window.html",
 "title": "Prismatic Window",
 "description": "20 colored rectangular planes in a 5x4 grid breathe, skew, and pulse opacity in staggered sine waves over a dark background, evoking Orphist window planes.",
 "useWhen": "Dark hero backgrounds, art/design portfolio sections, ambient screensaver overlays inspired by geometric abstraction.",
 "avoidWhen": "Light-background layouts (background hardcoded dark navy). Contexts needing legible text overlays — constant plane motion competes with reading.",
 "agentPrompt": "Change SPECTRUM to warm earth tones (['#c0392b','#e67e22','#f1c40f','#8e5e3c','#5d4037','#795548']), increase grid to 6 columns and 5 rows, and slow the wobble by changing sp base to 0.2. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "color palette (SPECTRUM array)",
  "grid dimensions (COLS=5, ROWS=4)",
  "wobble speed range (sp: 0.4 + offset)",
  "plane size amplitude (0.7+0.55 multipliers)",
  "skew intensity (0.22 multiplier)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "DPR-aware fitCanvas sizing",
  "visibilitychange pause/resume",
  "prefers-reduced-motion guard (static frame)",
  "IIFE wrapper",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Background color hardcoded in both CSS and canvas fillRect — must change both to retheme",
  "No pointer interactivity — purely autonomous"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "abstract",
  "color-planes",
  "grid",
  "skew",
  "canvas",
  "ambient"
 ]
}
</script>
</head>
<body>
<div id="del03-stage" role="img" aria-label="After Orphist window planes: abstract fragmented planes of colour shift and overlap like daylight broken through faceted leaded glass.">
  <canvas id="del03-cv"></canvas>
</div>
<div class="del03-cap">Prismatic Window</div>
<script>
(function(){
  "use strict";
  const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv=document.getElementById('del03-cv'); if(!cv) return;
  const root=document.documentElement;
  const C={}, SPECTRUM=[];           /* colours JS draws with — read from the CSS tokens */
  function syncTheme(){
    const cs=getComputedStyle(root), v=n=>cs.getPropertyValue(n).trim();
    C.bg=v('--del03-bg'); C.grid=v('--del03-grid');
    C.a0=parseFloat(v('--del03-a0')); C.a1=parseFloat(v('--del03-a1'));
    SPECTRUM.length=0;               /* invalidate the cached plane palette (planes hold indices) */
    for(let i=1;i<=6;i++) SPECTRUM.push(v('--del03-c'+i));
  }
  addEventListener('message',function(e){
    const d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
      root.setAttribute('data-theme',d.theme); syncTheme(); if(REDUCED) draw(performance.now());
    }
  });
  syncTheme();
  function fitCanvas(c){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const r=c.getBoundingClientRect();
    const w=Math.max(2,r.width), h=Math.max(2,r.height);
    c.width=Math.round(w*dpr); c.height=Math.round(h*dpr);
    const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
    return {ctx,w,h,dpr};
  }
  let S=fitCanvas(cv);
  let planes=[];
  function build(){
    planes=[];
    const COLS=5, ROWS=4;
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      planes.push({
        cx:(c+0.5)/COLS, cy:(r+0.5)/ROWS,
        w:1/COLS, h:1/ROWS,
        ci:(r*COLS+c)%SPECTRUM.length,   /* index, not a frozen colour string */
        ph:(r*0.7+c*0.5),
        sp:0.4+((r+c)%3)*0.25
      });
    }
  }
  build();
  let t=0,last=performance.now();
  function draw(now){
    const dt=Math.min(0.05,(now-last)/1000); last=now;
    if(!REDUCED) t+=dt;
    const ctx=S.ctx,W=S.w,H=S.h;
    ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
    for(const p of planes){
      const wob=0.5+0.5*Math.sin(t*p.sp+p.ph);
      const x=p.cx*W, y=p.cy*H;
      const w=p.w*W*(0.7+0.55*wob);
      const h=p.h*H*(0.7+0.55*(1-wob));
      const skew=Math.sin(t*0.5+p.ph)*0.22;
      ctx.save();
      ctx.translate(x,y);
      ctx.transform(1,skew,skew*0.5,1,0,0);
      ctx.globalAlpha=C.a0+C.a1*wob;
      ctx.fillStyle=SPECTRUM[p.ci];
      ctx.beginPath();
      ctx.moveTo(-w/2,-h/2);ctx.lineTo(w/2,-h/2);ctx.lineTo(w/2,h/2);ctx.lineTo(-w/2,h/2);ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha=1;
    ctx.strokeStyle=C.grid;ctx.lineWidth=2;
    const off=Math.sin(t*0.4)*8;
    for(let gx=1;gx<5;gx++){const x=W*gx/5+off;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let gy=1;gy<4;gy++){const y=H*gy/4-off;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  }
  let raf=0, running=false;
  function loop(){ if(!running) return; draw(performance.now()); raf=requestAnimationFrame(loop); }
  function start(){ if(running) return; running=true; last=performance.now(); raf=requestAnimationFrame(loop); }
  function stop(){ running=false; if(raf) cancelAnimationFrame(raf); raf=0; }
  S.ctx.fillStyle=C.bg;S.ctx.fillRect(0,0,S.w,S.h);
  let _rt;
  window.addEventListener('resize', ()=>{ clearTimeout(_rt); _rt=setTimeout(()=>{ S=fitCanvas(cv); build(); if(REDUCED) draw(performance.now()); },150); }, {passive:true});
  document.addEventListener('visibilitychange', ()=>{ if(REDUCED) return; if(document.hidden) stop(); else start(); });
  if(REDUCED){ draw(performance.now()); }
  else start();
})();
</script>
</body>
</html>
