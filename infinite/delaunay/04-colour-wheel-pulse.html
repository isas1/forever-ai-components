<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Colour Wheel Pulse — Orphist Colour Discs. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colour Wheel Pulse</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults; light re-theme = the [data-theme="light"] block.
     Every colour the canvas draws is read from here in syncTheme(). */
  :root{
    --del04-bg:#0c0d11; --del04-ink:#0d0e12; --del04-flare:#f3f0e8; --del04-hub:rgba(243,240,232,.25);
    --del04-a0:.6; --del04-a1:.4; --del04-fl:.6;
    --del04-c1:#e23b2e; --del04-c2:#f08a24; --del04-c3:#f4c81e;
    --del04-c4:#2fa86a; --del04-c5:#1f6fd0; --del04-c6:#7b3fa0;
    --del04-cap:#f3f0e8; --del04-cap-o:.46;
  }
  :root[data-theme="light"]{
    --del04-bg:#f7f3ea; --del04-ink:#2c2418; --del04-flare:#fdfaf2; --del04-hub:rgba(44,36,24,.35);
    --del04-a0:.85; --del04-a1:.15; --del04-fl:.42;
    --del04-c1:#d42b1d; --del04-c2:#c26708; --del04-c3:#a07a06;
    --del04-c4:#248152; --del04-c5:#1a5cbb; --del04-c6:#6a3690;
    --del04-cap:#2c2418; --del04-cap-o:.5;
  }
  html,body{margin:0;height:100%;background:var(--del04-bg);overflow:hidden}
  #del04-stage{position:fixed;inset:0;width:100%;height:100%}
  #del04-cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  .del04-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--del04-cap);opacity:var(--del04-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/delaunay/04-colour-wheel-pulse.html",
 "title": "Colour Wheel Pulse",
 "description": "36-segment spectral disc spins while an energy crest sweeps its segments, causing slices to pulse outward and flare bright as the wave passes.",
 "useWhen": "Dark hero backgrounds, loading screens, or art installations inspired by Orphist simultaneous-contrast colour theory.",
 "avoidWhen": "Light backgrounds (hardcoded dark canvas). Contexts needing legible text overlay — constant radial motion competes with reading.",
 "agentPrompt": "Change SPECTRUM to warm sunset tones (['#ff6b35','#f7c59f','#efefd0','#e63946','#457b9d','#1d3557']), slow the spin by setting vel=0.08, and increase SEG to 48 for finer segments. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "colour palette (SPECTRUM array)",
  "segment count (SEG=36)",
  "spin velocity (vel=0.25)",
  "crest sweep speed (dt*7)",
  "radial pulse depth (0.62+0.38 ratio)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "DPR-aware fitCanvas sizing",
  "visibilitychange pause/start",
  "prefers-reduced-motion guard (single static frame)",
  "IIFE wrapper",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "No user interactivity — purely autonomous; cannot be driven by pointer or click",
  "Background colour hardcoded to #0c0d11 in both CSS and canvas fill"
 ],
 "tier": "curated",
 "labels": [
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "mobile-ready",
  "light-ready"
 ],
 "tags": [
  "colour-wheel",
  "canvas",
  "spectral",
  "loop",
  "ambient",
  "generative"
 ]
}
</script>
</head>
<body>
<div id="del04-stage" role="img" aria-label="A spectral disc spins on of its own accord, a wave of energy travelling around its segments, simultaneous contrast flaring brightest along the moving crest.">
  <canvas id="del04-cv"></canvas>
</div>
<div class="del04-cap">Colour Wheel Pulse</div>
<script>
(function(){
  "use strict";
  const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv=document.getElementById('del04-cv'); if(!cv) return;
  const root=document.documentElement;
  const C={}, SPECTRUM=[];           /* colours JS draws with — read from the CSS tokens */
  function syncTheme(){
    const cs=getComputedStyle(root), v=n=>cs.getPropertyValue(n).trim();
    C.bg=v('--del04-bg'); C.ink=v('--del04-ink'); C.flare=v('--del04-flare'); C.hub=v('--del04-hub');
    C.a0=parseFloat(v('--del04-a0')); C.a1=parseFloat(v('--del04-a1')); C.fl=parseFloat(v('--del04-fl'));
    SPECTRUM.length=0;               /* invalidate the cached segment palette */
    for(let i=1;i<=6;i++) SPECTRUM.push(v('--del04-c'+i));
  }
  addEventListener('message',function(e){
    const d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
      root.setAttribute('data-theme',d.theme); syncTheme(); if(REDUCED) draw(performance.now());
    }
  });
  syncTheme();
  function fitCanvas(c){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const r=c.getBoundingClientRect();
    const w=Math.max(2,r.width), h=Math.max(2,r.height);
    c.width=Math.round(w*dpr); c.height=Math.round(h*dpr);
    const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
    return {ctx,w,h,dpr};
  }
  let S=fitCanvas(cv);
  const SEG=36;
  let energy=new Array(SEG).fill(0);
  let spin=0, vel=0.25;
  let crest=0;
  let t=0,last=performance.now();
  function draw(now){
    const dt=Math.min(0.05,(now-last)/1000); last=now;
    if(!REDUCED){ t+=dt; spin+=vel*dt; crest+=dt*7; }
    /* autonomous energy crest sweeping the wheel */
    const head=((crest%SEG)+SEG)%SEG;
    for(let k=-2;k<=2;k++){
      const idx=((Math.floor(head)+k)%SEG+SEG)%SEG;
      energy[idx]=Math.min(1.4, energy[idx]+ (1-Math.abs(k)*0.3)*0.5);
    }
    for(let i=0;i<SEG;i++) energy[i]*=0.94;
    const ctx=S.ctx,W=S.w,H=S.h,cx=W/2,cy=H/2,R=Math.min(W,H)*0.46;
    ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
    for(let s=0;s<SEG;s++){
      const a0=spin+(s/SEG)*Math.PI*2;
      const a1=spin+((s+1)/SEG)*Math.PI*2;
      const e=energy[s];
      const rOut=R*(0.62+0.38*Math.min(1,e));
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,rOut,a0,a1);
      ctx.closePath();
      ctx.fillStyle=SPECTRUM[s%SPECTRUM.length];
      ctx.globalAlpha=C.a0+C.a1*Math.min(1,e);
      ctx.fill();
      if(e>0.05){
        ctx.globalAlpha=Math.min(0.7,e*C.fl);
        ctx.fillStyle=C.flare;
        ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,rOut,a0,a1);ctx.closePath();ctx.fill();
      }
    }
    ctx.globalAlpha=1;
    ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(cx,cy,R*0.16,0,7);ctx.fill();
    ctx.strokeStyle=C.hub;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,R*0.16,0,7);ctx.stroke();
  }
  let raf=0, running=false;
  function loop(){ if(!running) return; draw(performance.now()); raf=requestAnimationFrame(loop); }
  function start(){ if(running) return; running=true; last=performance.now(); raf=requestAnimationFrame(loop); }
  function stop(){ running=false; if(raf) cancelAnimationFrame(raf); raf=0; }
  S.ctx.fillStyle=C.bg;S.ctx.fillRect(0,0,S.w,S.h);
  let _rt;
  window.addEventListener('resize', ()=>{ clearTimeout(_rt); _rt=setTimeout(()=>{ S=fitCanvas(cv); if(REDUCED) draw(performance.now()); },150); }, {passive:true});
  document.addEventListener('visibilitychange', ()=>{ if(REDUCED) return; if(document.hidden) stop(); else start(); });
  if(REDUCED){ draw(performance.now()); }
  else start();
})();
</script>
</body>
</html>
