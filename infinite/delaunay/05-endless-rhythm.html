<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Endless Rhythm — Orphist Colour Discs. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Endless Rhythm</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults; light re-theme = the [data-theme="light"] block.
     The disc colours are written from JS, so syncTheme() re-reads --del05-c* and repaints them. */
  :root{
    --del05-bg:#0c0d11; --del05-edge:rgba(243,240,232,.18);
    --del05-c1:#e23b2e; --del05-c2:#f08a24; --del05-c3:#f4c81e;
    --del05-c4:#2fa86a; --del05-c5:#1f6fd0; --del05-c6:#7b3fa0;
    --del05-cap:#f3f0e8; --del05-cap-o:.46;
  }
  :root[data-theme="light"]{
    --del05-bg:#f7f3ea; --del05-edge:rgba(44,36,24,.22);
    --del05-c1:#d42b1d; --del05-c2:#c26708; --del05-c3:#a07a06;
    --del05-c4:#248152; --del05-c5:#1a5cbb; --del05-c6:#6a3690;
    --del05-cap:#2c2418; --del05-cap-o:.5;
  }
  html,body{margin:0;height:100%;background:var(--del05-bg);overflow:hidden}
  #del05-stage{position:fixed;inset:0;width:100%;height:100%}
  .del05-band{position:absolute;inset:0;overflow:hidden;display:flex;align-items:center;}
  .del05-track{display:flex;align-items:center;gap:0;will-change:transform;}
  @keyframes del05-march{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  .del05-disc{flex:0 0 auto;border-radius:50%;position:relative;box-shadow:0 0 0 1px var(--del05-edge);}
  .del05-half{position:absolute;inset:0;border-radius:50%;clip-path:polygon(0 0,50% 0,50% 100%,0 100%);transform-origin:50% 50%;}
  .del05-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--del05-cap);opacity:var(--del05-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
  @media (prefers-reduced-motion: reduce){
    .del05-track{animation:none !important;transform:translateX(0);}
  }
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/delaunay/05-endless-rhythm.html",
 "title": "Endless Rhythm",
 "description": "A horizontal band of split half-disc circles in spectral colors marches endlessly left in a seamless CSS loop, inspired by Orphist's rhythm motifs.",
 "useWhen": "Ambient art-inspired backgrounds, gallery headers, or looping decorative banners needing bold color and motion.",
 "avoidWhen": "Contexts requiring legible overlaid text (high-contrast moving shapes compete with copy) or where reduced-motion users expect a static image.",
 "agentPrompt": "Change SPECTRUM to cool blues and purples (e.g. ['#1f6fd0','#7b3fa0','#2fa86a','#1a9eb5','#4b3fa0','#0d3b8c']), slow the march to 36s, and increase disc count per sequence from 14 to 20. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "SPECTRUM color array (6 hues)",
  "sizes array (disc size sequence)",
  "animation duration (22s in del05-march)",
  "disc count per sequence (i<14)",
  "margin spacing formula (8+(i%3)*6)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "double seq() call for seamless 50% loop",
  "visibilitychange pause listener",
  "prefers-reduced-motion guard (animation:none + no JS animation)",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Band is a single horizontal row — no vertical stacking or grid layout without restructuring",
  "Background color hardcoded in CSS (#0c0d11)"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "disc",
  "spectral",
  "loop",
  "marquee",
  "color",
  "geometric"
 ]
}
</script>
</head>
<body>
<div id="del05-stage" role="img" aria-label="A band of split spectral half-discs marches endlessly sideways in a seamless loop, after Orphist endless-rhythm motifs, pure CSS keeping time.">
  <div class="del05-band" id="del05-band"></div>
</div>
<div class="del05-cap">Endless Rhythm</div>
<script>
(function(){
  "use strict";
  const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const band=document.getElementById('del05-band'); if(!band) return;
  const root=document.documentElement;
  const SPECTRUM=[], discs=[];       /* disc colours come from the CSS tokens, repainted on switch */
  function syncTheme(){
    const cs=getComputedStyle(root);
    SPECTRUM.length=0;               /* invalidate the palette cached on the discs */
    for(let i=1;i<=6;i++) SPECTRUM.push(cs.getPropertyValue('--del05-c'+i).trim());
    for(const o of discs){
      o.d.style.background=SPECTRUM[(o.i+3)%SPECTRUM.length];
      o.half.style.background=SPECTRUM[o.i%SPECTRUM.length];
    }
  }
  addEventListener('message',function(e){
    const d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
      root.setAttribute('data-theme',d.theme); syncTheme();
    }
  });
  const track=document.createElement('div');
  track.className='del05-track';
  band.appendChild(track);
  const sizes=[58,40,72,48,64,36];
  function seq(parent){
    for(let i=0;i<14;i++){
      const d=document.createElement('div');
      d.className='del05-disc';
      const sz=sizes[i%sizes.length];
      d.style.width=d.style.height=sz+'px';
      d.style.margin='0 '+(8+(i%3)*6)+'px';
      const half=document.createElement('div');
      half.className='del05-half';
      half.style.transform='rotate('+((i*40)%360)+'deg)';
      d.appendChild(half);
      parent.appendChild(d);
      discs.push({d:d,half:half,i:i});
    }
  }
  seq(track); seq(track);
  syncTheme();                       /* first paint of the token palette */
  if(!REDUCED){
    track.style.animation='del05-march 22s linear infinite';
    document.addEventListener('visibilitychange', ()=>{
      track.style.animationPlayState = document.hidden ? 'paused' : 'running';
    });
  }
})();
</script>
</body>
</html>
