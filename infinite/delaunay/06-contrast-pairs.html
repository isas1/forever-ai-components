<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Contrast Pairs — Orphist Colour Discs. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contrast Pairs</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults; light re-theme = the [data-theme="light"] block.
     Every colour the canvas draws is read from here in syncTheme(); the complementary PAIRS are
     rebuilt from the tokens on every switch. */
  :root{
    --del06-bg:#0c0d11; --del06-divider:#f3f0e8; --del06-edge:rgba(13,14,18,.6);
    --del06-c1:#e23b2e; --del06-c2:#f08a24; --del06-c3:#f4c81e;
    --del06-c4:#2fa86a; --del06-c5:#1f6fd0; --del06-c6:#7b3fa0;
    --del06-cap:#f3f0e8; --del06-cap-o:.46;
  }
  :root[data-theme="light"]{
    --del06-bg:#f7f3ea; --del06-divider:#fdfaf2; --del06-edge:rgba(44,36,24,.5);
    --del06-c1:#d42b1d; --del06-c2:#c26708; --del06-c3:#a07a06;
    --del06-c4:#248152; --del06-c5:#1a5cbb; --del06-c6:#6a3690;
    --del06-cap:#2c2418; --del06-cap-o:.5;
  }
  html,body{margin:0;height:100%;background:var(--del06-bg);overflow:hidden}
  #del06-stage{position:fixed;inset:0;width:100%;height:100%}
  #del06-cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  .del06-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--del06-cap);opacity:var(--del06-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/delaunay/06-contrast-pairs.html",
 "title": "Contrast Pairs",
 "description": "Three split circles rotate complementary halves against each other — red/green, blue/orange, violet/yellow — enacting Orphist's simultaneous contrast law.",
 "useWhen": "Art/design portfolio heroes, color-theory explainers, ambient dark-mode backgrounds where rhythmic geometric motion is desired.",
 "avoidWhen": "Light-background layouts (background hardcoded #0c0d11). Contexts where slow looping geometry feels too abstract.",
 "agentPrompt": "Add a fourth pair by appending [PAL.blue, PAL.yellow] to the PAIRS array; the cellW math auto-adjusts since it divides W by cols. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "color pairs (PAIRS array)",
  "rotation speed multiplier (0.5+i*0.25)",
  "circle radius ratio (0.40)",
  "divider line opacity pulse (0.4+0.4*Math.abs(...))",
  "background color (#0c0d11)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "REDUCED prefers-reduced-motion guard (static frame fallback)",
  "visibilitychange pause/resume",
  "DPR-aware fitCanvas with setTransform",
  "IIFE wrapper",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Background color hardcoded in both CSS and canvas fill — must change both to retheme",
  "No touch/pointer interactivity — purely passive",
  "Pair count drives column width automatically but PAL only defines 7 named colors"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "color-theory",
  "circles",
  "complementary",
  "geometric",
  "rotation",
  "ambient"
 ]
}
</script>
</head>
<body>
<div id="del06-stage" role="img" aria-label="Complementary halves rotate against one another, red against green, blue against orange, the law of simultaneous contrast turned into a slow mechanism of light.">
  <canvas id="del06-cv"></canvas>
</div>
<div class="del06-cap">Contrast Pairs</div>
<script>
(function(){
  "use strict";
  const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv=document.getElementById('del06-cv'); if(!cv) return;
  const root=document.documentElement;
  const C={};                        /* colours JS draws with — read from the CSS tokens */
  let PAIRS=[];
  function syncTheme(){
    const cs=getComputedStyle(root), v=n=>cs.getPropertyValue(n).trim();
    C.bg=v('--del06-bg'); C.divider=v('--del06-divider'); C.edge=v('--del06-edge');
    const red=v('--del06-c1'), orange=v('--del06-c2'), yellow=v('--del06-c3'),
          green=v('--del06-c4'), blue=v('--del06-c5'), violet=v('--del06-c6');
    PAIRS=[[red,green],[blue,orange],[violet,yellow]];   /* cached pairs rebuilt on every switch */
  }
  addEventListener('message',function(e){
    const d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
      root.setAttribute('data-theme',d.theme); syncTheme(); if(REDUCED) draw(performance.now());
    }
  });
  syncTheme();
  function fitCanvas(c){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const r=c.getBoundingClientRect();
    const w=Math.max(2,r.width), h=Math.max(2,r.height);
    c.width=Math.round(w*dpr); c.height=Math.round(h*dpr);
    const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
    return {ctx,w,h,dpr};
  }
  let S=fitCanvas(cv);
  let t=0,last=performance.now();
  function half(ctx,cx,cy,r,a0,col){
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a0,a0+Math.PI);ctx.closePath();
    ctx.fillStyle=col;ctx.fill();
  }
  function draw(now){
    const dt=Math.min(0.05,(now-last)/1000); last=now;
    if(!REDUCED) t+=dt;
    const ctx=S.ctx,W=S.w,H=S.h;
    ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
    const cols=PAIRS.length;
    const cellW=W/cols;
    PAIRS.forEach((p,i)=>{
      const cx=cellW*(i+0.5), cy=H/2;
      const r=Math.min(cellW,H)*0.40;
      const a=t*(0.5+i*0.25)*(i%2?-1:1);
      ctx.save();
      half(ctx,cx,cy,r,a,p[0]);
      half(ctx,cx,cy,r,a+Math.PI,p[1]);
      ctx.globalAlpha=0.4+0.4*Math.abs(Math.sin(t*2+i));
      ctx.strokeStyle=C.divider;ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
      ctx.lineTo(cx+Math.cos(a+Math.PI)*r,cy+Math.sin(a+Math.PI)*r);
      ctx.stroke();
      ctx.globalAlpha=1;
      ctx.strokeStyle=C.edge;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.stroke();
      ctx.restore();
    });
  }
  let raf=0, running=false;
  function loop(){ if(!running) return; draw(performance.now()); raf=requestAnimationFrame(loop); }
  function start(){ if(running) return; running=true; last=performance.now(); raf=requestAnimationFrame(loop); }
  function stop(){ running=false; if(raf) cancelAnimationFrame(raf); raf=0; }
  S.ctx.fillStyle=C.bg;S.ctx.fillRect(0,0,S.w,S.h);
  let _rt;
  window.addEventListener('resize', ()=>{ clearTimeout(_rt); _rt=setTimeout(()=>{ S=fitCanvas(cv); if(REDUCED) draw(performance.now()); },150); }, {passive:true});
  document.addEventListener('visibilitychange', ()=>{ if(REDUCED) return; if(document.hidden) stop(); else start(); });
  if(REDUCED){ draw(performance.now()); }
  else start();
})();
</script>
</body>
</html>
