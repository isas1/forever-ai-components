<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="The Disc, Breathing — Orphist Colour Discs. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Disc, Breathing</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults; light re-theme = the [data-theme="light"] block.
     Every colour the canvas draws is read from here in syncTheme(). */
  :root{
    --del08-bg:#0c0d11; --del08-ink:#0d0e12; --del08-halo:#f3f0e8; --del08-a0:.55; --del08-a1:.45;
    --del08-c1:#e23b2e; --del08-c2:#f08a24; --del08-c3:#f4c81e;
    --del08-c4:#2fa86a; --del08-c5:#1f6fd0; --del08-c6:#7b3fa0;
    --del08-cap:#f3f0e8; --del08-cap-o:.46;
  }
  :root[data-theme="light"]{
    --del08-bg:#f7f3ea; --del08-ink:#2c2418; --del08-halo:#fdfaf2; --del08-a0:.78; --del08-a1:.22;
    --del08-c1:#d42b1d; --del08-c2:#c26708; --del08-c3:#a07a06;
    --del08-c4:#248152; --del08-c5:#1a5cbb; --del08-c6:#6a3690;
    --del08-cap:#2c2418; --del08-cap-o:.5;
  }
  html,body{margin:0;height:100%;background:var(--del08-bg);overflow:hidden}
  #del08-stage{position:fixed;inset:0;width:100%;height:100%}
  #del08-cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  .del08-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--del08-cap);opacity:var(--del08-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/delaunay/08-the-disc-breathing.html",
 "title": "The Disc, Breathing",
 "description": "9 concentric rings of 6 arc segments rotate in alternating directions and pulse opacity in a slow breathing rhythm, cycling a 6-color spectrum.",
 "useWhen": "Art-themed hero backgrounds, music visualizer stills, calm ambient loops on dark-mode landing pages.",
 "avoidWhen": "Light-background UIs (background hardcoded dark navy). Contexts requiring text legibility over the disc center.",
 "agentPrompt": "Change RINGS to 12, slow the breath cycle by setting the multiplier from 0.8 to 0.4, and swap SPECTRUM to warm earth tones. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "ring count (RINGS=9)",
  "segment count (SEG=6)",
  "spectrum palette (SPECTRUM array)",
  "breath speed (t*0.8)",
  "rotation speed per ring (0.06+ri*0.015)",
  "disc radius ratio (0.46)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "DPR-aware fitCanvas()",
  "visibilitychange pause/resume",
  "prefers-reduced-motion static frame guard",
  "IIFE wrapper",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Background color hardcoded in both CSS and canvas fillRect — must change both to recolor",
  "Centre dot color cycles on floor(t) causing a sharp jump each second"
 ],
 "tier": "curated",
 "labels": [
  "accessible",
  "mobile-ready",
  "copy-paste-safe",
  "minimal-deps",
  "easy-to-modify",
  "light-ready"
 ],
 "tags": [
  "concentric",
  "canvas",
  "spectrum",
  "breathing",
  "generative",
  "color"
 ]
}
</script>
</head>
<body>
<div id="del08-stage" role="img" aria-label="A single grand concentric disc breathes slowly through the whole spectrum, segment by segment, after Orphist pure-disc abstractions: colour alone its form and subject.">
  <canvas id="del08-cv"></canvas>
</div>
<div class="del08-cap">The Disc, Breathing</div>
<script>
(function(){
  "use strict";
  const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv=document.getElementById('del08-cv'); if(!cv) return;
  const root=document.documentElement;
  const C={}, SPECTRUM=[];           /* colours JS draws with — read from the CSS tokens */
  function syncTheme(){
    const cs=getComputedStyle(root), v=n=>cs.getPropertyValue(n).trim();
    C.bg=v('--del08-bg'); C.ink=v('--del08-ink'); C.halo=v('--del08-halo');
    C.a0=parseFloat(v('--del08-a0')); C.a1=parseFloat(v('--del08-a1'));
    SPECTRUM.length=0;               /* invalidate the cached ring palette */
    for(let i=1;i<=6;i++) SPECTRUM.push(v('--del08-c'+i));
  }
  addEventListener('message',function(e){
    const d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
      root.setAttribute('data-theme',d.theme); syncTheme(); if(REDUCED) draw(performance.now());
    }
  });
  syncTheme();
  function fitCanvas(c){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const r=c.getBoundingClientRect();
    const w=Math.max(2,r.width), h=Math.max(2,r.height);
    c.width=Math.round(w*dpr); c.height=Math.round(h*dpr);
    const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
    return {ctx,w,h,dpr};
  }
  let S=fitCanvas(cv);
  const RINGS=9, SEG=6;
  let t=0,last=performance.now();
  function draw(now){
    const dt=Math.min(0.05,(now-last)/1000); last=now;
    if(!REDUCED) t+=dt;
    const ctx=S.ctx,W=S.w,H=S.h,cx=W/2,cy=H/2;
    const R=Math.min(W,H)*0.46;
    ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
    ctx.save();
    ctx.globalAlpha=0.06;
    for(let i=0;i<24;i++){
      const a=(i/24)*Math.PI*2 + t*0.05;
      ctx.strokeStyle=SPECTRUM[i%SPECTRUM.length];ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*R*1.4,cy+Math.sin(a)*R*1.4);ctx.stroke();
    }
    ctx.restore();
    for(let ri=0;ri<RINGS;ri++){
      const r0=R*ri/RINGS, r1=R*(ri+1)/RINGS;
      const breath=0.5+0.5*Math.sin(t*0.8 - ri*0.55);
      const dir=ri%2?-1:1;
      const rot=t*(0.06+ri*0.015)*dir;
      for(let s=0;s<SEG;s++){
        const a0=rot+(s/SEG)*Math.PI*2;
        const a1=rot+((s+1)/SEG)*Math.PI*2;
        const idx=(s+ri+Math.floor(t*0.5))%SPECTRUM.length;
        ctx.beginPath();
        ctx.arc(cx,cy,r1,a0,a1);
        ctx.arc(cx,cy,r0,a1,a0,true);
        ctx.closePath();
        ctx.fillStyle=SPECTRUM[idx];
        ctx.globalAlpha=C.a0+C.a1*breath;
        ctx.fill();
      }
    }
    ctx.globalAlpha=1;
    const halo=0.5+0.5*Math.sin(t*0.8);
    ctx.globalCompositeOperation='overlay';
    ctx.globalAlpha=0.18*halo;
    ctx.fillStyle=C.halo;
    ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1;
    ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(cx,cy,R*0.12,0,7);ctx.fill();
    const cr=R*(0.05+0.03*Math.sin(t*2));
    ctx.fillStyle=SPECTRUM[Math.floor(t)%SPECTRUM.length];
    ctx.beginPath();ctx.arc(cx,cy,cr,0,7);ctx.fill();
  }
  let raf=0, running=false;
  function loop(){ if(!running) return; draw(performance.now()); raf=requestAnimationFrame(loop); }
  function start(){ if(running) return; running=true; last=performance.now(); raf=requestAnimationFrame(loop); }
  function stop(){ running=false; if(raf) cancelAnimationFrame(raf); raf=0; }
  S.ctx.fillStyle=C.bg;S.ctx.fillRect(0,0,S.w,S.h);
  let _rt;
  window.addEventListener('resize', ()=>{ clearTimeout(_rt); _rt=setTimeout(()=>{ S=fitCanvas(cv); if(REDUCED) draw(performance.now()); },150); }, {passive:true});
  document.addEventListener('visibilitychange', ()=>{ if(REDUCED) return; if(document.hidden) stop(); else start(); });
  if(REDUCED){ draw(performance.now()); }
  else start();
})();
</script>
</body>
</html>
