<script>
(()=>{
  // Local frame lifecycle: stop hidden work, repaint reduced-motion state on input.
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const frames = new Map(), drivers = new Set(); let painting = false;
  function scheduleFrame(fn) {
    drivers.add(fn);
    if (document.hidden || frames.has(fn) || (motion.matches && painting)) return;
    frames.set(fn, requestAnimationFrame(t => {
      frames.delete(fn); if (document.hidden) return;
      painting = true; try { fn(t); } finally { painting = false; }
    }));
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { frames.forEach(cancelAnimationFrame); frames.clear(); }
    else drivers.forEach(scheduleFrame);
  });
  const repaint = () => { if (motion.matches) drivers.forEach(scheduleFrame); };
  ['click','input','pointermove'].forEach(type => document.addEventListener(type, repaint));
  motion.addEventListener('change', () => { reduce = motion.matches; drivers.forEach(scheduleFrame); });

  const tileRoot = document.querySelector('.sc12-root');
  const pauseCSS = () => tileRoot.toggleAttribute('data-paused', document.hidden);
  document.addEventListener('visibilitychange', pauseCSS); pauseCSS();

  let phase = 0;
  let running = true;
  let reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const canvas = document.getElementById("sc12-canvas");
  const ctx = canvas ? canvas.getContext("2d") : null;
  const bitrateEl = document.getElementById("sc12-bitrate-val");

  let w = 310, h = 100;
  function resize() {
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    w = canvas.clientWidth || 310;
    h = canvas.clientHeight || 100;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    if (ctx) ctx.scale(dpr, dpr);
  }
  resize();

  function render() {
    if (!running || !ctx) return;
    ctx.clearRect(0, 0, w, h);

    if (!reduce) phase += 0.04;

    // Bitrate waterfall bars
    const bars = 36;
    const barW = (w - (bars - 1) * 2) / bars;

    for (let i = 0; i < bars; i++) {
      const x = i * (barW + 2);
      const wave = Math.sin(phase + i * 0.4) * 18 + Math.cos(phase * 0.7 + i * 0.2) * 10;
      const barH = Math.max(12, Math.min(h - 16, 50 + wave));
      const y = h - barH - 8;

      ctx.fillStyle = i === bars - 1 ? "#E06C6C" : (i % 2 === 0 ? "#BE4D4D" : "#E29D38");
      ctx.fillRect(x, y, barW, barH);
    }

    const curMbps = Math.round(210 + Math.sin(phase) * 15);
    if (bitrateEl) bitrateEl.textContent = `${curMbps} Mbps`;

    scheduleFrame(render);
  }

  document.addEventListener("visibilitychange", () => {
    running = !document.hidden;
  });

  scheduleFrame(render);
})();
</script>
