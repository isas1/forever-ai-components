<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Token Bucket Rate Limiter — Dev Status. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="forever-preview-lifecycle" content="demo-v1">
<title>Token Bucket Rate Limiter</title>
<script>
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
:root{
--accent:#C7F000;--accent-soft:rgba(199,240,0,.14);--accent-line:rgba(199,240,0,.3);
--bg:#0A0A0A;--bg-sunken:#070707;--surface:#111111;--surface-2:#161616;
--text:#EDEDEA;--text-muted:#8A8A85;--text-faint:#5A5A56;
--border:rgba(255,255,255,.08);
--warning:#E0A23B;--danger:#E5604D;
--radius-sm:5px;--radius-md:8px;--radius-lg:12px;--radius-pill:999px;
--font-mono:ui-monospace,"SF Mono",Menlo,monospace;
}
:root[data-theme="light"]{
--bg:#FAFAF8;--bg-sunken:#F1F1EC;--surface:#F4F4F0;--surface-2:#ECECE6;
--text:#1A1A18;--text-muted:#6B6B66;--text-faint:#9A9A93;
--border:rgba(0,0,0,.08);
--accent:#4D7A00;--accent-soft:rgba(77,122,0,.12);--accent-line:rgba(77,122,0,.35);
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{display:grid;place-items:center;color:var(--text);font-family:var(--font-mono);user-select:none}
.tbk-card{box-sizing:border-box;width:36.7em;font-size:min(2.6vmin,12px);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.33em;display:flex;flex-direction:column;gap:1em}
.tbk-hdr{display:flex;justify-content:space-between;align-items:center}
.tbk-pill{padding:.17em .67em;border-radius:var(--radius-pill);font-size:.83em;font-weight:700;font-variant-numeric:tabular-nums;background:var(--accent-soft);color:var(--accent)}
.tbk-pill[data-s="low"]{background:color-mix(in srgb,var(--warning) 18%,transparent);color:var(--warning)}
.tbk-pill[data-s="out"]{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}
.tbk-main{display:grid;grid-template-columns:9.2em 1fr;gap:1.17em;align-items:center}
.tbk-cv{width:9.2em;height:12.5em;background:var(--bg-sunken);border:1px solid var(--border);border-radius:var(--radius-md);display:block}
.tbk-metrics{display:flex;flex-direction:column;gap:.83em;min-width:0}
.tbk-row{display:flex;justify-content:space-between;gap:.5em;font-size:.92em;font-variant-numeric:tabular-nums}
.tbk-lbl{color:var(--text-muted)}
.tbk-err{color:var(--danger)}
.tbk-track{height:.5em;margin-top:.33em;background:var(--bg-sunken);border-radius:var(--radius-pill);overflow:hidden;border:1px solid var(--border)}
.tbk-fill{height:100%;background:var(--accent)}
.tbk-fill[data-s="low"]{background:var(--warning)}
.tbk-fill[data-s="out"]{background:var(--danger)}
.tbk-log{height:3.8em;background:var(--bg-sunken);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.5em .67em;font-size:.83em;overflow:hidden;display:flex;flex-direction:column;gap:.25em;font-variant-numeric:tabular-nums;color:var(--text-muted)}
.tbk-log .tbk-e{color:var(--danger)}
.tbk-ctl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5em}
.tbk-btn{background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.5em .67em;font:inherit;font-size:.83em;font-weight:600;cursor:pointer;transition:border-color .15s,transform .1s}
.tbk-btn:hover{border-color:var(--accent-line)}
.tbk-btn:active{transform:scale(.97)}
.tbk-btn[aria-pressed="true"]{border-color:var(--danger);color:var(--danger)}
.tbk-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbk-cap{position:fixed;left:8px;bottom:6px;font:10px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text);opacity:.28;pointer-events:none}
@media (prefers-reduced-motion:reduce){.tbk-btn{transition:none}}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/dev-status/13-token-bucket-rate-limiter.html",
 "title": "Token Bucket Rate Limiter",
 "description": "A 20 req/s token-bucket limiter with a live bucket, 200 and 429 counters, a request log and single, burst and flood controls.",
 "useWhen": "",
 "avoidWhen": "",
 "agentPrompt": "",
 "editableAreas": [
  "Forever Opus tokens on :root (--bg, --surface*, --text*, --border*, --accent) — one lime accent, no gradients",
  "copy and data values in markup/script"
 ],
 "preserveElements": [
  "demo-v1 preview lifecycle: initialize demoEnabled from window.__foreverPreview and stop attract work on the window forever:interactive event; retain manual feedback, settling, cleanup and explicit sessions",
  "theme hook: ?theme= bootstrap, forever:theme message listener and :root[data-theme=\"light\"] tokens",
  "IIFE wrapper, visibilitychange sleep, prefers-reduced-motion guard, time-based (dt) animation"
 ],
 "knownLimitations": [
  "State remains local to each mounted instance; format/theme remount preserves takeover, not component values.",
  "Text is very small at 180px tiles."
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "rate-limit",
  "token-bucket",
  "api",
  "devops",
  "status"
 ]
}
</script>
</head>
<body>
<div class="tbk-card" id="tbk-card" role="group" aria-label="Token bucket rate limiter, 20 requests per second">
<div class="tbk-hdr"><strong>Rate Limiter &middot; 20 req/s</strong><span class="tbk-pill" id="tbk-pill">200 HEALTHY</span></div>
<div class="tbk-main">
<canvas class="tbk-cv" id="tbk-cv" aria-hidden="true"></canvas>
<div class="tbk-metrics">
<div><div class="tbk-row"><span class="tbk-lbl">Available Tokens</span><strong id="tbk-tok">16.0 / 20</strong></div><div class="tbk-track"><div class="tbk-fill" id="tbk-bar"></div></div></div>
<div class="tbk-row"><span class="tbk-lbl">Refill Rate</span><span>+4.0 tok/sec</span></div>
<div class="tbk-row"><span class="tbk-lbl">Accepted (2xx)</span><span id="tbk-ok">0</span></div>
<div class="tbk-row"><span class="tbk-lbl">Throttled (429)</span><span class="tbk-err" id="tbk-drop">0</span></div>
<div class="tbk-log" id="tbk-log" aria-live="off"></div>
</div>
</div>
<div class="tbk-ctl">
<button type="button" class="tbk-btn" id="tbk-one">Consume 1</button>
<button type="button" class="tbk-btn" id="tbk-burst">Fire Burst (6)</button>
<button type="button" class="tbk-btn" id="tbk-flood" aria-pressed="false">429 Flood: OFF</button>
</div>
</div>
<div class="tbk-cap" aria-hidden="true">Token bucket</div>
<script>
(() => {
const mq = matchMedia('(prefers-reduced-motion: reduce)');
const reduced = () => mq.matches;
addEventListener('message', e => {
const d = e.data;
if (d && (d.type === 'forever:theme' || d.type === 'theme') && (d.theme === 'light' || d.theme === 'dark'))
document.documentElement.setAttribute('data-theme', d.theme);
});
const $ = id => document.getElementById(id);
const cv = $('tbk-cv'), ctx = cv.getContext('2d'), card = $('tbk-card');
const tokEl = $('tbk-tok'), bar = $('tbk-bar'), okEl = $('tbk-ok'), dropEl = $('tbk-drop');
const pill = $('tbk-pill'), logEl = $('tbk-log'), floodBtn = $('tbk-flood');
const MAX = 20, C = {};
let tokens = 16, ok = 142, drops = 0, flood = false, particles = [];
let demo = window.__foreverPreview?.demoEnabled !== false;
let raf = 0, last = 0, attractT = 0, floodT = 0, refillT = 0, dpr = 1;

function readTokens() {
const cs = getComputedStyle(document.documentElement);
['accent', 'text-faint', 'warning', 'danger'].forEach(k => { C[k] = cs.getPropertyValue('--' + k).trim(); });
}
new MutationObserver(() => { readTokens(); draw(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
readTokens();

function size() {
dpr = Math.min(2, devicePixelRatio || 1);
cv.width = Math.round(cv.clientWidth * dpr) || 220;
cv.height = Math.round(cv.clientHeight * dpr) || 300;
draw();
}
new ResizeObserver(size).observe(cv);

function log(status, msg) {
const d = document.createElement('div');
if (status !== 200) d.className = 'tbk-e';
d.textContent = `${new Date().toISOString().slice(14, 22)} [${status}] ${msg}`;
logEl.prepend(d);
while (logEl.children.length > 3) logEl.lastChild.remove();
}
function consume(n) {
for (let i = 0; i < n; i++) {
if (tokens >= 1) {
tokens -= 1; ok++;
particles.push({ x: 110 + (Math.random() - 0.5) * 80, y: 260, vy: 4, ok: true, a: 1 });
if (!i) log(200, `tok=${Math.floor(tokens)} pass`);
} else {
drops++;
particles.push({ x: 110 + (Math.random() - 0.5) * 90, y: 30, vy: -3, ok: false, a: 1 });
if (!i) log(429, 'Retry-After: 1s');
}
}
if (reduced()) particles = [];
ui(); kick();
}
function ui() {
const s = tokens < 1 ? 'out' : tokens < 6 ? 'low' : 'ok';
tokEl.textContent = `${tokens.toFixed(1)} / ${MAX}`;
bar.style.width = Math.max(0, Math.min(100, tokens / MAX * 100)) + '%';
bar.dataset.s = s;
okEl.textContent = ok;
dropEl.textContent = drops;
pill.dataset.s = s;
pill.textContent = s === 'out' ? '429 THROTTLED' : s === 'low' ? '200 BURST LOW' : '200 HEALTHY';
}
function draw() {
const k = cv.width / 220;
ctx.setTransform(k, 0, 0, cv.height / 300, 0, 0);
ctx.clearRect(0, 0, 220, 300);
const fillH = tokens / MAX * 240;
ctx.globalAlpha = 0.6; ctx.strokeStyle = C['text-faint']; ctx.lineWidth = 4;
ctx.beginPath(); ctx.moveTo(24, 25); ctx.lineTo(24, 270); ctx.lineTo(196, 270); ctx.lineTo(196, 25); ctx.stroke();
const col = tokens < 2 ? C.danger : tokens < 6 ? C.warning : C.accent;
ctx.globalAlpha = 0.18; ctx.fillStyle = col; ctx.fillRect(26, 270 - fillH, 168, fillH);
ctx.globalAlpha = 1;
for (let i = 0, n = Math.floor(tokens); i < n; i++) {
ctx.beginPath(); ctx.arc(48 + (i % 4) * 40, 252 - Math.floor(i / 4) * 42, 11, 0, 6.2832); ctx.fill();
}
particles.forEach(p => {
ctx.globalAlpha = Math.max(0, p.a); ctx.fillStyle = p.ok ? C.accent : C.danger;
ctx.beginPath(); ctx.arc(p.x, p.y, 7, 0, 6.2832); ctx.fill();
});
ctx.globalAlpha = 1;
}
function tick(now) {
raf = 0;
if (document.hidden) return;
const f = last ? Math.min(now - last, 50) / 16.667 : 1;   // 1.0 at 60 fps
last = now;
tokens = Math.min(MAX, tokens + 0.0667 * f);              // 4 tokens / s
particles.forEach(p => { p.y += p.vy * f; p.a -= 0.04 * f; });
particles = particles.filter(p => p.a > 0);
ui(); draw();
if (tokens < MAX || particles.length) raf = requestAnimationFrame(tick);   // idle loop sleeps when full
}
function kick() { if (raf || document.hidden || reduced()) { if (reduced()) { ui(); draw(); } return; } last = 0; raf = requestAnimationFrame(tick); }

function attract() {
clearTimeout(attractT);
if (!demo || reduced() || document.hidden) return;
attractT = setTimeout(() => { if (demo && !flood) consume(Math.random() > 0.4 ? 5 : 2); attract(); }, 1800);
}
function refillStep() {   // reduced motion: tokens jump +4 once per second instead of gliding
clearInterval(refillT);
refillT = reduced() ? setInterval(() => { if (tokens < MAX) { tokens = Math.min(MAX, tokens + 4); ui(); draw(); } }, 1000) : 0;
}
function setFlood(on) {
flood = on;
floodBtn.setAttribute('aria-pressed', on);
floodBtn.textContent = `429 Flood: ${on ? 'ON' : 'OFF'}`;
clearInterval(floodT);
floodT = on ? setInterval(() => { if (!document.hidden) consume(1); }, reduced() ? 600 : 120) : 0;
}
function act() { demo = false; clearTimeout(attractT); }
addEventListener('forever:interactive', act);
card.addEventListener('pointerdown', act, true);
card.addEventListener('keydown', e => { if (/^(Enter| |Arrow|Escape)/.test(e.key)) act(); }, true);
$('tbk-one').addEventListener('click', () => consume(1));
$('tbk-burst').addEventListener('click', () => consume(6));
floodBtn.addEventListener('click', () => setFlood(!flood));
document.addEventListener('visibilitychange', () => {
if (document.hidden) { if (raf) cancelAnimationFrame(raf); raf = 0; clearTimeout(attractT); }
else { kick(); attract(); }
});
mq.addEventListener('change', () => { refillStep(); attract(); kick(); });

log(200, 'bucket initialized');
ui(); size(); refillStep();
if (demo && !reduced()) { consume(5); attract(); } else kick();
})();
</script>
</body>
</html>
