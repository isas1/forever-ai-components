<style>
:root{
--accent:#C7F000;--accent-soft:rgba(199,240,0,.14);
--bg:#0A0A0A;--bg-sunken:#070707;--surface:#111111;--surface-2:#161616;--surface-3:#1C1C1C;
--text:#EDEDEA;--text-muted:#8A8A85;
--border:rgba(255,255,255,.08);
--danger:#E5604D;
--radius-sm:5px;--radius-md:8px;--radius-lg:12px;--radius-pill:999px;
--font-mono:ui-monospace,"SF Mono",Menlo,monospace;
}
:root[data-theme="light"]{
--bg:#FAFAF8;--bg-sunken:#F1F1EC;--surface:#F4F4F0;--surface-2:#ECECE6;--surface-3:#FFFFFF;
--text:#1A1A18;--text-muted:#6B6B66;
--border:rgba(0,0,0,.08);
--accent:#4D7A00;--accent-soft:rgba(77,122,0,.12);
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{display:grid;place-items:center;color:var(--text);font-family:var(--font-mono);user-select:none}
.cnr-card{box-sizing:border-box;width:38.3em;font-size:min(2.5vmin,12px);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.33em;display:flex;flex-direction:column;gap:1em}
.cnr-hdr{display:flex;justify-content:space-between;align-items:center;gap:.5em}
.cnr-badge{padding:.17em .67em;border-radius:var(--radius-pill);font-size:.83em;font-weight:700;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.cnr-badge[data-s="halt"]{background:var(--surface-3);color:var(--text-muted)}
.cnr-badge[data-s="roll"]{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}
.cnr-split{height:2.17em;border-radius:var(--radius-sm);overflow:hidden;display:flex;border:1px solid var(--border);font-size:.83em;font-weight:700;font-variant-numeric:tabular-nums}
.cnr-stable,.cnr-canary{display:flex;align-items:center;transition:width .2s;overflow:hidden;white-space:nowrap}
.cnr-stable{background:var(--surface-3);color:var(--text-muted);padding-left:.8em}
.cnr-canary{background:var(--accent-soft);color:var(--accent);justify-content:flex-end;padding-right:.8em}
.cnr-lanes{display:grid;grid-template-columns:1fr 1fr;gap:.83em}
.cnr-lane{background:var(--bg-sunken);border:1px solid var(--border);border-radius:var(--radius-md);padding:.83em;display:flex;flex-direction:column;gap:.5em;font-size:.92em;font-variant-numeric:tabular-nums}
.cnr-lane[data-bad]{border-color:var(--danger)}
.cnr-lane [data-bad]{color:var(--danger)}
.cnr-name{font-weight:700;color:var(--text-muted)}
.cnr-name.cnr-c{color:var(--accent)}
.cnr-ctl{display:flex;align-items:center;gap:.83em;font-size:.92em}
.cnr-range{flex:1;min-width:0;accent-color:var(--accent);cursor:pointer;margin:0}
.cnr-btn{background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.5em .75em;font:inherit;font-size:.83em;cursor:pointer;white-space:nowrap}
.cnr-btn:hover{border-color:var(--danger);color:var(--danger)}
.cnr-btn:focus-visible,.cnr-range:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cnr-cap{position:fixed;left:8px;bottom:6px;font:10px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text);opacity:.28;pointer-events:none}
@media (prefers-reduced-motion:reduce){.cnr-stable,.cnr-canary{transition:none}}
</style>

<body>
<div class="cnr-card" id="cnr-card" role="group" aria-label="Canary traffic splitter, release v2.14.0-rc3">
<div class="cnr-hdr"><strong>Canary Gate &middot; v2.14.0-rc3</strong><span class="cnr-badge" id="cnr-badge">CANARY 25%</span></div>
<div class="cnr-split" aria-hidden="true"><div class="cnr-stable" id="cnr-st"></div><div class="cnr-canary" id="cnr-ca"></div></div>
<div class="cnr-lanes">
<div class="cnr-lane"><span class="cnr-name">● Stable v2.13</span><div>p99: <strong>42 ms</strong></div><div>5xx: <strong>0.02%</strong></div></div>
<div class="cnr-lane" id="cnr-lane"><span class="cnr-name cnr-c">● Canary v2.14</span><div>p99: <strong id="cnr-p99">46 ms</strong></div><div>5xx: <strong id="cnr-err">0.04%</strong></div></div>
</div>
<div class="cnr-ctl"><span>Weight</span><input class="cnr-range" type="range" id="cnr-w" min="0" max="100" step="5" value="25" aria-label="Canary traffic weight, percent"><button type="button" class="cnr-btn" id="cnr-spike">Inject 5xx Spike</button></div>
</div>
<div class="cnr-cap" aria-hidden="true">Canary splitter</div>
<script>
(() => {
const mq = matchMedia('(prefers-reduced-motion: reduce)');
addEventListener('message', e => {
const d = e.data;
if (d && (d.type === 'forever:theme' || d.type === 'theme') && (d.theme === 'light' || d.theme === 'dark'))
document.documentElement.setAttribute('data-theme', d.theme);
});
const $ = id => document.getElementById(id);
const card = $('cnr-card'), slider = $('cnr-w'), st = $('cnr-st'), ca = $('cnr-ca');
const p99 = $('cnr-p99'), err = $('cnr-err'), badge = $('cnr-badge'), lane = $('cnr-lane');
let weight = 25, spiking = false, spikeT = 0, tickT = 0;
let demo = window.__foreverPreview?.demoEnabled !== false;

function setWeight(w) {
weight = Math.max(0, Math.min(100, w));
slider.value = weight;
st.style.width = (100 - weight) + '%';
ca.style.width = weight + '%';
st.textContent = 100 - weight >= 20 ? `Stable ${100 - weight}%` : '';
ca.textContent = weight >= 20 ? `Canary ${weight}%` : '';
badge.dataset.s = spiking ? 'roll' : weight === 0 ? 'halt' : 'ok';
badge.textContent = spiking ? 'AUTO-ROLLBACK' : weight === 100 ? '100% PROMOTED' : weight === 0 ? 'HALTED (0%)' : `CANARY ${weight}%`;
slider.setAttribute('aria-valuetext', `${weight} percent canary`);
}
function bad(on) {
[lane, p99, err].forEach(el => el.toggleAttribute('data-bad', on));
}
slider.addEventListener('input', () => { clearTimeout(spikeT); spiking = false; bad(false); setWeight(Number(slider.value)); });
$('cnr-spike').addEventListener('click', () => {
clearTimeout(spikeT);
spiking = true; bad(true);
p99.textContent = '890 ms'; err.textContent = '6.40%';
setWeight(0);
spikeT = setTimeout(() => { spiking = false; bad(false); setWeight(0); }, 2600);
});

function drift() {
if (document.hidden || !demo || spiking) return;
p99.textContent = `${43 + Math.floor(Math.random() * 7)} ms`;
err.textContent = `0.0${Math.floor(Math.random() * 5)}%`;
setWeight(weight >= 100 ? 10 : weight + 15);
}
function start() {
clearInterval(tickT);
if (demo && !mq.matches) tickT = setInterval(drift, 1500);   // reduced motion: no attract, static 25%
}
function act() { demo = false; clearInterval(tickT); }
addEventListener('forever:interactive', act);
card.addEventListener('pointerdown', act, true);
card.addEventListener('keydown', e => { if (/^(Enter| |Arrow|Escape)/.test(e.key)) act(); }, true);
mq.addEventListener('change', start);

setWeight(25);
start();
})();
</script>
</body>
</html>
