<html lang="en">

<meta charset="utf-8">
<meta name="description" content="Consensus Quorum Ring — Dev Status. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Consensus Quorum Ring</title>
<script>
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();

<style>
:root{
--accent:#C7F000;--accent-line:rgba(199,240,0,.3);
--bg:#0A0A0A;--bg-sunken:#070707;--surface:#111111;--surface-2:#161616;
--text:#EDEDEA;--text-muted:#8A8A85;
--border:rgba(255,255,255,.08);
--success:#5BB98C;--danger:#E5604D;
--radius-sm:5px;--radius-lg:12px;--radius-pill:999px;
--font-mono:ui-monospace,"SF Mono",Menlo,monospace;
}
:root[data-theme="light"]{
--bg:#FAFAF8;--bg-sunken:#F1F1EC;--surface:#F4F4F0;--surface-2:#ECECE6;
--text:#1A1A18;--text-muted:#6B6B66;
--border:rgba(0,0,0,.08);
--accent:#4D7A00;--accent-line:rgba(77,122,0,.35);
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{display:grid;place-items:center;color:var(--text);font-family:var(--font-mono);user-select:none}
.cqr-card{box-sizing:border-box;width:36.7em;font-size:min(2.6vmin,12px);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.33em;display:flex;flex-direction:column;gap:1em}
.cqr-hdr{display:flex;justify-content:space-between;align-items:center;gap:.5em}
.cqr-badge{padding:.17em .67em;border-radius:var(--radius-pill);font-size:.83em;font-weight:700;white-space:nowrap;background:color-mix(in srgb,var(--success) 16%,transparent);color:var(--success)}
.cqr-badge[data-s="bad"]{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}
.cqr-box{width:100%;height:17.5em}
.cqr-svg{display:block;width:100%;height:100%;overflow:visible}
.cqr-ln{stroke:var(--border);stroke-width:1.5;stroke-dasharray:4 4;opacity:.12}
.cqr-ln[data-up]{opacity:.6}
.cqr-n{cursor:pointer;outline:none}
.cqr-c{fill:var(--bg-sunken);stroke-width:2.5;transition:stroke .2s,r .2s}
.cqr-n:hover .cqr-c{r:24px}
.cqr-c[data-down]{fill:color-mix(in srgb,var(--danger) 16%,var(--bg-sunken))}
.cqr-fr{display:none;fill:none;stroke:var(--accent);stroke-width:2}
.cqr-n:focus-visible .cqr-fr{display:block}
.cqr-ftr{display:flex;justify-content:space-between;align-items:center;gap:.8em;font-size:.92em;color:var(--text-muted);border-top:1px solid var(--border);padding-top:.83em}
.cqr-btn{background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.4em .83em;font:inherit;font-size:.83em;cursor:pointer;white-space:nowrap}
.cqr-btn:hover{border-color:var(--accent-line)}
.cqr-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cqr-cap{position:fixed;left:8px;bottom:6px;font:10px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text);opacity:.28;pointer-events:none}
@media (prefers-reduced-motion:reduce){.cqr-c{transition:none}}
</style>

{
 "file": "infinite/dev-status/15-consensus-quorum-ring.html",
 "title": "Consensus Quorum Ring",
 "description": "Five-node Raft ring with leader election, term and commit index; click or key-activate nodes to partition them and lose quorum below three.",
 "useWhen": "",
 "avoidWhen": "",
 "agentPrompt": "",
 "editableAreas": [

 ],

<body>
<div class="cqr-card" id="cqr-card" role="group" aria-label="Raft consensus quorum, five nodes, activate a node to partition it">
<div class="cqr-hdr"><strong>&#11041; Raft Quorum &middot; Term <span id="cqr-term">42</span></strong><span class="cqr-badge" id="cqr-badge">5/5 QUORUM OK</span></div>
<div class="cqr-box"><svg class="cqr-svg" id="cqr-svg" viewBox="0 0 360 210"></svg></div>
<div class="cqr-ftr"><span id="cqr-log" aria-live="polite">Commit Index #9,412</span><button type="button" class="cqr-btn" id="cqr-elect">Step Down Leader</button></div>
</div>
<div class="cqr-cap" aria-hidden="true">Raft quorum</div>
<script>
(() => {
const mq = matchMedia('(prefers-reduced-motion: reduce)');
addEventListener('message', e => {
const d = e.data;
if (d && (d.type === 'forever:theme' || d.type === 'theme') && (d.theme === 'light' || d.theme === 'dark'))
document.documentElement.setAttribute('data-theme', d.theme);
});
const $ = id => document.getElementById(id);
const card = $('cqr-card'), svg = $('cqr-svg'), badge = $('cqr-badge'), termEl = $('cqr-term'), logEl = $('cqr-log');
const NS = 'http://www.w3.org/2000/svg', cx = 180, cy = 105, R = 76;
let term = 42, commit = 9412, leader = 0, tickT = 0, ticks = 0;
let demo = window.__foreverPreview?.demoEnabled !== false;
const nodes = Array.from({ length: 5 }, (_, i) => {
const a = i * 2 * Math.PI / 5 - Math.PI / 2;
return { id: 'N' + (i + 1), x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R, up: true };
});
const upCount = () => nodes.filter(n => n.up).length;

function render(focusIdx) {
svg.textContent = '';
const q = upCount() >= 3;
const mk = (tag, attrs, parent) => {
const el = document.createElementNS(NS, tag);
for (const k in attrs) el.setAttribute(k, attrs[k]);
(parent || svg).appendChild(el);
return el;
};
nodes.forEach((a, i) => nodes.forEach((b, j) => {
if (i < j) mk('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: 'cqr-ln' }).toggleAttribute('data-up', a.up && b.up);
}));
mk('text', { x: cx, y: cy + 4, 'text-anchor': 'middle', fill: q ? 'var(--success)' : 'var(--danger)', 'font-size': 11, 'font-weight': 700 }).textContent =
q ? `QUORUM ${upCount()}/5` : `SPLIT BRAIN ${upCount()}/5`;
nodes.forEach((n, i) => {
const lead = i === leader && n.up && q;
const stroke = !n.up ? 'var(--danger)' : lead ? 'var(--accent)' : 'var(--text-muted)';
const role = !n.up ? 'DOWN' : lead ? 'LEADER' : 'FOLLOW';
const g = mk('g', { class: 'cqr-n', tabindex: 0, role: 'button', 'aria-label': `${n.id} ${role.toLowerCase()}, activate to ${n.up ? 'partition' : 'restore'}` });
mk('circle', { class: 'cqr-fr', cx: n.x, cy: n.y, r: 28 }, g);
mk('circle', { class: 'cqr-c', cx: n.x, cy: n.y, r: 22, stroke }, g).toggleAttribute('data-down', !n.up);
mk('text', { x: n.x, y: n.y - 2, 'text-anchor': 'middle', fill: 'var(--text)', 'font-size': 10, 'font-weight': 700 }, g).textContent = n.id;
mk('text', { x: n.x, y: n.y + 10, 'text-anchor': 'middle', fill: stroke, 'font-size': 8 }, g).textContent = role;
const flip = () => {
demo = false; clearInterval(tickT);
n.up = !n.up;
if ((!n.up && i === leader) || (n.up && !nodes[leader].up)) elect();
meta(); render(i);
};
g.addEventListener('click', flip);
g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
if (focusIdx === i) g.focus({ focusVisible: true });
});
}
function elect() {
const up = nodes.map((n, i) => i).filter(i => nodes[i].up);
if (up.length >= 3) { leader = up[Math.floor(Math.random() * up.length)]; term++; termEl.textContent = term; }
}
function meta() {
const u = upCount(), ok = u >= 3;
if (ok) commit++;
badge.dataset.s = ok ? 'ok' : 'bad';
badge.textContent = ok ? `${u}/5 QUORUM OK` : `${u}/5 NO QUORUM`;
logEl.textContent = ok ? `Commit #${commit.toLocaleString()} · Leader ${nodes[leader].id}` : `Writes halted, need ${3 - u} more node(s)`;
}
$('cqr-elect').addEventListener('click', () => {
demo = false; clearInterval(tickT);
leader = (leader + 1) % 5; nodes[leader].up = true; term++; termEl.textContent = term;
meta(); render();
});

function drift() {
if (document.hidden || !demo) return;
if (upCount() === 5 && (!ticks++ || Math.random() < 0.5)) nodes[ticks === 1 ? leader : 2].up = false;
else nodes.forEach(n => { n.up = true; });
if (!nodes[leader].up) elect();
meta(); render();
}
function start() {
clearInterval(tickT);
if (demo && !mq.matches) tickT = setInterval(drift, 1200);   // reduced motion: static healthy ring, input still works
}
function act() { demo = false; clearInterval(tickT); }
addEventListener('forever:interactive', act);
card.addEventListener('pointerdown', act, true);
mq.addEventListener('change', start);

meta(); render(); start();
})();
</script>
</body>
</html>
