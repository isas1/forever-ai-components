<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Dissolve — Infinitude. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dissolve — A Swarm of Dots</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract);
     the light re-theme is the [data-theme="light"] block. JS reads these in syncTheme().
     --dot05-fade is the per-frame trail wash, so it must match the ground in both themes. */
  :root{
    --dot05-bg:#060406; --dot05-fade:rgba(6,4,6,0.32);
    --dot05-c1:#e8112d; --dot05-c2:#ff2d8a; --dot05-c3:#ffd400; --dot05-c4:#fbf6ef;
    --dot05-cap:#ff63ac; --dot05-cap-o:.5;
  }
  :root[data-theme="light"]{
    --dot05-bg:#f6f1f0; --dot05-fade:rgba(246,241,240,0.32);
    --dot05-c1:#c20c22; --dot05-c2:#c2005a; --dot05-c3:#8a6a00; --dot05-c4:#4a4034;
    --dot05-cap:#b0004f; --dot05-cap-o:.6;
  }
  html,body{margin:0;height:100%;background:var(--dot05-bg);overflow:hidden}
  #dot05-stage{position:fixed;inset:0;width:100%;height:100%}
  #dot05-cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  .dot05-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--dot05-cap);opacity:var(--dot05-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/dot-field/05-dissolve-swarm.html",
 "title": "Dissolve",
 "description": "115 colored dots orbit an empty center in a slow ellipse, periodically dissolving outward in a breathing scatter pattern with depth-based opacity.",
 "useWhen": "Dark-mode ambient backgrounds, screensaver-style hero sections, or any context needing gentle looping motion with a cosmic/particle aesthetic.",
 "avoidWhen": "Light backgrounds (hardcoded dark fill). Contexts requiring legible text overlays — dots occupy the center zone during reformation.",
 "agentPrompt": "Change the color palette to cool blues and teals by setting cols to ['#00eaff','#0080ff','#a0e0ff','#ffffff'], increase dot count N to 180, and slow the dissolve cycle by changing t*0.33 to t*0.18. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "dot count (N=115)",
  "color palette (cols array)",
  "scatter/dissolve rate (t*0.33)",
  "breath amplitude (0.6+0.5*Math.sin)",
  "orbital speed multiplier (p.sp*0.012)",
  "spin rate (0.0025)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "IIFE wrapper",
  "prefers-reduced-motion guard (REDUCED)",
  "visibilitychange pause/resume",
  "DPR-aware canvas sizing with fitCanvas()",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Background color hardcoded as #060406 — must edit CSS and initial fillStyle to change",
  "No pointer interactivity — purely passive"
 ],
 "tier": "curated",
 "labels": [
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "mobile-ready",
  "agent-ready",
  "light-ready"
 ],
 "tags": [
  "dots",
  "swarm",
  "orbital",
  "dissolve",
  "ambient",
  "canvas",
  "generative"
 ]
}
</script>
</head>
<body>
<div id="dot05-stage" role="img" aria-label="A cloud of coloured dots orbiting an empty centre, periodically dissolving outward and reforming as it slowly rotates.">
  <canvas id="dot05-cv"></canvas>
</div>
<div class="dot05-cap">Dissolve</div>
<script>
(function(){
  "use strict";
  const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv=document.getElementById('dot05-cv'); if(!cv) return;
  const root=document.documentElement, C={cols:[]};
  function syncTheme(){            // every colour the canvas draws with comes from the tokens
    const cs=getComputedStyle(root);
    C.bg=cs.getPropertyValue('--dot05-bg').trim();
    C.fade=cs.getPropertyValue('--dot05-fade').trim();
    C.cols=[1,2,3,4].map(i=>cs.getPropertyValue('--dot05-c'+i).trim());  // per-dot colour is an index, never a cached string
  }
  syncTheme();
  addEventListener('message', (e)=>{   // live re-theme from the canvas
    const d=e.data;
    if(d && d.type==='forever:theme' && (d.theme==='light'||d.theme==='dark')){
      root.setAttribute('data-theme', d.theme); syncTheme();
      if(REDUCED) draw(performance.now());
    }
  });
  function fitCanvas(c){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const r=c.getBoundingClientRect();
    const w=Math.max(2,r.width), h=Math.max(2,r.height);
    c.width=Math.round(w*dpr); c.height=Math.round(h*dpr);
    const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
    return {ctx,w,h,dpr};
  }
  let S=fitCanvas(cv), last=performance.now(), t=0;
  const N=115, P=new Array(N);
  for(let i=0;i<N;i++){
    P[i]={ a:Math.random()*Math.PI*2, rad:30+Math.random()*130,
      z:Math.random()*2-1, sp:(0.2+Math.random()*0.6)*(Math.random()<0.5?1:-1),
      ci:(Math.random()*4)|0, s:1.2+Math.random()*3.4, ph:Math.random()*Math.PI*2 };
  }
  let spin=0;
  function draw(now){
    const dt=Math.min(0.05,(now-last)/1000); last=now;
    if(!REDUCED) t+=dt;
    const ctx=S.ctx;
    ctx.fillStyle=C.fade; ctx.fillRect(0,0,S.w,S.h);
    const cx=S.w/2, cy=S.h/2;
    if(!REDUCED) spin+=0.0025;
    const breath=0.6+0.5*Math.sin(t*0.5);
    const scatter=Math.max(0,Math.sin(t*0.33));
    for(let i=0;i<N;i++){
      const p=P[i];
      if(!REDUCED) p.a+=p.sp*0.012;
      const wob=1+scatter*(0.4+Math.sin(p.ph+t*2)*0.6);
      const R=p.rad*breath*wob;
      const ang=p.a+spin+p.z*0.4;
      const px=cx+Math.cos(ang)*R;
      const py=cy+Math.sin(ang)*R*0.62+p.z*18;
      const depth=(p.z+1)/2;
      ctx.globalAlpha=0.35+depth*0.6;
      ctx.fillStyle=C.cols[p.ci];
      ctx.beginPath(); ctx.arc(px,py,p.s*(0.6+depth*0.9),0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  let raf=0, running=false;
  function loop(){ if(!running) return; draw(performance.now()); raf=requestAnimationFrame(loop); }
  function start(){ if(running) return; running=true; last=performance.now(); raf=requestAnimationFrame(loop); }
  function stop(){ running=false; if(raf) cancelAnimationFrame(raf); raf=0; }
  S.ctx.fillStyle=C.bg; S.ctx.fillRect(0,0,S.w,S.h);
  let _rt;
  window.addEventListener('resize', ()=>{ clearTimeout(_rt); _rt=setTimeout(()=>{ S=fitCanvas(cv); if(REDUCED) draw(performance.now()); },150); }, {passive:true});
  document.addEventListener('visibilitychange', ()=>{ if(REDUCED) return; if(document.hidden) stop(); else start(); });
  if(REDUCED){ for(let i=0;i<6;i++) draw(performance.now()); }
  else start();
})();
</script>
</body>
</html>
