<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="A vertical list of dark rows with grip handles that lift, glow cyan and spring into place when dragged or arrow-keyed to reorder.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drag Handle</title>
<script>/* theme hook: ?theme=light|dark or postMessage flips data-theme; runs pre-paint, no dark flash */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  :root{--dr09-bg:#0c0e13;--dr09-accent:#22d3ee;--dr09-ink:#e8ecf2;--dr09-row:#161a23;--dr09-line:#2a3140;--dr09-shadow:rgba(0,0,0,.4);--dr09-lift-shadow:rgba(0,0,0,.7);--dr09-lift-glow:rgba(34,211,238,.35);--dr09-focus-glow:rgba(34,211,238,.18);--dr09-bar-lift:#33404f;--cap:#fff;--cap-o:.42}
  :root[data-theme="light"]{--dr09-bg:#eef1f6;--dr09-accent:#0a7686;--dr09-ink:#1b2230;--dr09-row:#ffffff;--dr09-line:#d7dde6;--dr09-shadow:rgba(27,34,48,.15);--dr09-lift-shadow:rgba(27,34,48,.22);--dr09-lift-glow:rgba(10,118,134,.3);--dr09-focus-glow:rgba(10,118,134,.18);--dr09-bar-lift:#aab4c2;--cap:#1b2230;--cap-o:.5}
  html,body{margin:0;height:100%}
  #dr09-stage{position:fixed;inset:0;background:var(--dr09-bg);overflow:hidden;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;display:flex;align-items:center;justify-content:center}
  #dr09-list{position:relative;width:78%;max-width:430px;outline:none}
  .dr09-row{position:absolute;left:0;right:0;height:var(--dr09-h);display:flex;align-items:center;gap:0;
    background:var(--dr09-row);border:1px solid var(--dr09-line);border-radius:7px;will-change:transform;
    box-sizing:border-box;transform:translateY(0) scale(1);
    box-shadow:0 1px 0 var(--dr09-shadow);   /* lift shadow toggled by class, never animated */
    transition:box-shadow .18s linear, background .18s linear, border-color .18s linear}
  .dr09-row.dr09-lift{background:var(--dr09-row);border-color:var(--dr09-accent);z-index:5;
    box-shadow:0 18px 38px -8px var(--dr09-lift-shadow), 0 0 0 1px var(--dr09-accent),
               0 0 22px -2px var(--dr09-lift-glow)}
  .dr09-handle{flex:0 0 auto;width:30px;align-self:stretch;cursor:grab;border-right:1px solid var(--dr09-line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
  .dr09-row.dr09-lift .dr09-handle{cursor:grabbing}
  .dr09-dot{width:13px;height:2px;border-radius:2px;background:var(--dr09-line)}
  .dr09-row.dr09-lift .dr09-dot{background:var(--dr09-accent)}
  .dr09-body{flex:1 1 auto;padding:0 13px;min-width:0;display:flex;align-items:center;gap:11px}
  .dr09-num{flex:0 0 auto;width:20px;height:20px;border-radius:5px;display:flex;align-items:center;
    justify-content:center;font-size:10px;font-weight:700;color:var(--dr09-bg);background:var(--dr09-accent)}
  .dr09-bar{flex:1 1 auto;height:7px;border-radius:4px;background:var(--dr09-line)}
  .dr09-row.dr09-lift .dr09-bar{background:var(--dr09-bar-lift)}
  .cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--cap);
    opacity:var(--cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
  .dr09-hint{position:fixed;right:8px;bottom:7px;font:600 9px/1 ui-monospace,Menlo,monospace;
    color:var(--dr09-accent);opacity:.5;letter-spacing:.1em;text-transform:uppercase;user-select:none}
  #dr09-list:focus-visible{box-shadow:0 0 0 2px var(--dr09-accent),0 0 0 6px var(--dr09-focus-glow);border-radius:10px}
  /* prefers-reduced-motion: JS paints one static frame, no rAF loop */
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/drag-reorder/09-reorder-handle.html",
 "title": "Drag Handle",
 "description": "5 dark rows with grip handles spring-animate to new positions when dragged or arrow-keyed; the lifted row glows cyan and scales up slightly.",
 "useWhen": "Settings panels, playlist editors, priority queues, or any sortable list needing tactile drag-to-reorder with keyboard accessibility.",
 "avoidWhen": "Lists longer than ~10 items (absolute positioning covers full height). Touch-only contexts where pointer capture may conflict with scroll.",
 "agentPrompt": "Change accent color to purple (#a855f7), increase row height (ROWH) to 56, and add a 6th row by setting N=6 and extending the order array. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "accent color (--dr09-accent)",
  "row count (N=5)",
  "row height (ROWH=44)",
  "spring stiffness (K=0.18) and damping (D=0.74)",
  "demo idle timeout (3400ms)",
  "bar widths (52+i*9)%",
  "idle demo cadence (D_FIRST=300 / D_WAIT=1480 / D_LIFT=500 / D_REST=520 ms, resume IDLE_BACK=3400 ms)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "IIFE wrapper",
  "prefers-reduced-motion static fallback",
  "visibilitychange pause/resume",
  "pointerCapture for reliable drag tracking",
  "idle demo hop (the same move routine the drag/keyboard path uses; real input takes over)",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Row count is fixed at build time — dynamic add/remove requires structural changes",
  "Drag handle covers entire row, not just the grip icon — fine for demos but may conflict with row-level click handlers in production"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "drag-and-drop",
  "reorder",
  "list",
  "spring",
  "grip-handle",
  "keyboard",
  "ui-control"
 ]
}
</script>
</head>
<body>
<div id="dr09-stage">
  <div id="dr09-list" role="listbox" tabindex="0" aria-label="Reorderable list. Use arrow keys to move the selected row."></div>
</div>
<div class="cap">Drag Handle</div>
<div class="dr09-hint" aria-hidden="true">drag / ↑ ↓</div>
<script>
(function(){
  "use strict";
  var reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  var list = document.getElementById('dr09-list');
  var N = 5, GAP = 9, ROWH = 44;

  var order = [0,1,2,3,4];   // order[i] = row element at slot i
  var rows = [];
  // animated Y, target Y and velocity per row element
  var curY = new Float32Array(N), tgtY = new Float32Array(N), vel = new Float32Array(N);
  var lift = -1;          // lifted element index (-1 none)
  var liftAmt = 0, liftTgt = 0;
  var sel = 0;            // keyboard slot

  function slotY(slot){ return slot*(ROWH+GAP); }
  function slotOf(el){ return order.indexOf(el); }

  for(var i=0;i<N;i++){
    var r=document.createElement('div'); r.className='dr09-row';
    r.style.setProperty('--dr09-h', ROWH+'px');
    r.setAttribute('role','option');
    var h=document.createElement('div'); h.className='dr09-handle';
    for(var d=0;d<3;d++){var dd=document.createElement('span');dd.className='dr09-dot';h.appendChild(dd);}
    var b=document.createElement('div'); b.className='dr09-body';
    var num=document.createElement('div'); num.className='dr09-num';
    var bar=document.createElement('div'); bar.className='dr09-bar';
    bar.style.maxWidth = (52+i*9)+'%';
    b.appendChild(num); b.appendChild(bar);
    r.appendChild(h); r.appendChild(b);
    list.appendChild(r);
    rows.push({el:r,num:num});
    curY[i]=tgtY[i]=slotY(i);
  }
  list.style.height = (N*ROWH+(N-1)*GAP)+'px';

  function renumber(){ for(var s=0;s<N;s++){ rows[order[s]].num.textContent=(s+1); } }
  function retarget(){
    for(var s=0;s<N;s++){ tgtY[order[s]] = slotY(s); }
    rows.forEach(function(r,idx){ r.el.setAttribute('aria-selected', slotOf(idx)===sel?'true':'false'); });
  }
  renumber(); retarget();

  function moveSlot(a,b){   // element at slot a -> slot b
    if(a===b||b<0||b>=N) return;
    order.splice(b,0,order.splice(a,1)[0]); renumber(); retarget();
  }

  // ---- self-demo: nobody drags a tile on the wall, so the list hops a row one slot by itself,
  // through the same moveSlot() the handle and keys use. Fixed pairs alternate direction.
  var demo = !reduce, phase=0, demoEl=0, demoDir=1, HOP=[[1,1],[3,-1],[0,1],[4,-1]], hopI=0;
  var D_WAIT=1480, D_LIFT=500, D_REST=520, D_FIRST=300, IDLE_BACK=3400;   // ms — a hop per ~2.5s
  var demoT=D_WAIT-D_FIRST;    // first lift ~0.3s in, dropped by ~0.8s
  function startHop(){
    var h = HOP[hopI++%HOP.length], s = Math.max(0,Math.min(N-1,h[0]));
    demoDir = (s+h[1]<0||s+h[1]>=N) ? -h[1] : h[1];
    if(lift>=0) rows[lift].el.classList.remove('dr09-lift');
    demoEl = order[s]; lift = demoEl; liftTgt = 1; sel = s;
    rows[demoEl].el.classList.add('dr09-lift'); retarget();
  }
  function endHop(){
    moveSlot(slotOf(demoEl), slotOf(demoEl)+demoDir);   // the drop — same path as drag/keys
    sel = slotOf(demoEl); rows[demoEl].el.classList.remove('dr09-lift'); lift=-1; liftTgt=0;
  }

  var K=0.18, D=0.74;   // spring
  function step(){
    for(var i=0;i<N;i++){ vel[i]=(vel[i]+(tgtY[i]-curY[i])*K)*D; curY[i]+=vel[i]; }
    liftAmt += (liftTgt-liftAmt)*0.22;
  }
  function paint(){
    for(var i=0;i<N;i++){
      var y=curY[i], sc=1, lz=0;
      if(i===lift){ sc=1+0.035*liftAmt; lz=-7*liftAmt; }
      rows[i].el.style.transform='translateY('+(y+lz).toFixed(2)+'px) scale('+sc.toFixed(3)+')';
    }
  }

  // ---- pointer drag ----
  var dragging=-1, dragSlot=0, startPtr=0, baseY=0, idleAt=0;
  function userActive(){ demo=false; idleAt=performance.now(); }

  list.addEventListener('pointerdown',function(e){
    var hr=e.target.closest('.dr09-row'); if(!hr) return;
    var idx=rows.findIndex(function(r){return r.el===hr;}); if(idx<0)return;
    userActive();
    if(lift>=0 && lift!==idx){ rows[lift].el.classList.remove('dr09-lift'); }
    dragging=idx; lift=idx; liftTgt=1; dragSlot=slotOf(idx); sel=dragSlot;
    rows[idx].el.classList.add('dr09-lift');
    startPtr=e.clientY; baseY=slotY(dragSlot); retarget();
    list.setPointerCapture(e.pointerId); e.preventDefault();
  });
  list.addEventListener('pointermove',function(e){
    if(dragging<0)return;
    var dy=e.clientY-startPtr, y=baseY+dy;
    tgtY[dragging]=y; curY[dragging]=y; vel[dragging]=0;
    var ns=Math.max(0,Math.min(N-1,Math.round(y/(ROWH+GAP))));
    if(ns!==dragSlot){ moveSlot(dragSlot,ns); dragSlot=ns; sel=ns; }
  });
  function endDrag(){
    if(dragging<0)return;
    rows[dragging].el.classList.remove('dr09-lift'); lift=-1; liftTgt=0; vel[dragging]=0; dragging=-1; retarget();
  }
  list.addEventListener('pointerup',endDrag);
  list.addEventListener('pointercancel',endDrag);

  // ---- keyboard ----
  var kbTimer=0; // keyboard repeat debounce (closure-scoped, no globals)
  list.addEventListener('keydown',function(e){
    if(e.key!=='ArrowUp'&&e.key!=='ArrowDown')return;
    e.preventDefault(); userActive();
    var dir=e.key==='ArrowDown'?1:-1, el=order[sel], ns=sel+dir;
    if(ns<0||ns>=N)return;
    if(lift>=0){rows[lift].el.classList.remove('dr09-lift');}
    lift=el; liftTgt=1; rows[el].el.classList.add('dr09-lift');
    moveSlot(sel,ns); sel=ns;
    clearTimeout(kbTimer);
    kbTimer=setTimeout(function(){
      rows[el].el.classList.remove('dr09-lift'); lift=-1; liftTgt=0;
    },260);
  });
  list.addEventListener('blur',function(){ idleAt=performance.now(); });
  addEventListener('message',function(e){var d=e.data;if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark'))document.documentElement.setAttribute('data-theme',d.theme);});

  // ---- loop ----
  var raf=0, running=true, last=0;
  function frame(t){
    if(!running)return;
    if(!last)last=t; var dt=t-last; last=t;
    if(!demo && performance.now()-idleAt>IDLE_BACK && dragging<0){ demo=true; demoT=D_WAIT-D_FIRST; phase=0; }
    if(demo){
      demoT+=dt;
      if(phase===0 && demoT>D_WAIT){ startHop(); phase=1; demoT=0; }
      else if(phase===1 && demoT>D_LIFT){ endHop(); phase=2; demoT=0; }
      else if(phase===2 && demoT>D_REST){ phase=0; demoT=0; }
    }
    step(); paint();
    raf=requestAnimationFrame(frame);
  }

  if(reduce){
    // one static frame: ordered list, one row emphasized
    for(var i=0;i<N;i++){curY[i]=tgtY[i]=slotY(i);}
    rows[1].el.classList.add('dr09-lift'); lift=1; liftAmt=liftTgt=1;
    sel=1; retarget(); paint();
    return;
  }
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ running=false; if(raf)cancelAnimationFrame(raf); }
    else if(!running){ running=true; last=0; raf=requestAnimationFrame(frame); }
  });
  raf=requestAnimationFrame(frame);
})();
</script>
</body>
</html>
