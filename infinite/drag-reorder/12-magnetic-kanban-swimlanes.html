<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta name="description" content="Two-lane kanban board: lift a card, a dashed placeholder snaps between lanes as you drag, and lane counts update on drop.">
<title>Magnetic Kanban Swimlanes</title>
<script>
/* theme hook: ?theme=light|dark is applied before first paint */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  :root{
    --bg:#0A0A0A; --bg-sunken:#070707; --surface:#111111; --surface-2:#161616; --surface-3:#1C1C1C;
    --text:#EDEDEA; --text-muted:#8A8A85; --text-faint:#5A5A56;
    --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.14);
    --accent:#C7F000; --accent-line:rgba(199,240,0,0.32); --accent-soft:rgba(199,240,0,0.14);
    --shadow-lg:0 16px 48px rgba(0,0,0,.55);
    --font-sans:ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --font-mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  :root[data-theme="light"]{
    --bg:#FAFAF8; --bg-sunken:#F1F1EC; --surface:#F4F4F0; --surface-2:#ECECE6; --surface-3:#FFFFFF;
    --text:#1A1A18; --text-muted:#6B6B66; --text-faint:#9A9A93;
    --border:rgba(0,0,0,0.08); --border-strong:rgba(0,0,0,0.14);
    --accent:#4D7A00; --accent-line:rgba(77,122,0,0.35); --accent-soft:rgba(77,122,0,0.12);
    --shadow-lg:0 16px 40px rgba(40,50,10,.18);
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
  .mks-board{
    position:absolute;inset:0;box-sizing:border-box;display:grid;grid-template-columns:1fr 1fr;gap:min(2.6vmin,10px);
    padding:clamp(8px,4.4vmin,20px) clamp(8px,4.4vmin,20px) clamp(14px,8vmin,32px);
    background:var(--surface);color:var(--text);font-family:var(--font-sans);user-select:none;-webkit-user-select:none;
  }
  .mks-board *{box-sizing:border-box}
  .mks-col{display:flex;flex-direction:column;min-height:0;padding:min(2.4vmin,9px);background:var(--bg-sunken);border:1px solid var(--border);border-radius:8px}
  .mks-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:min(2.2vmin,8px);font-size:clamp(7px,3vmin,11px);font-weight:600;color:var(--text-muted)}
  .mks-count{font:clamp(6px,2.6vmin,10px) var(--font-mono);background:var(--surface-3);padding:1px 6px;border-radius:999px}
  .mks-lane{flex:1;min-height:0;display:flex;flex-direction:column;gap:min(1.9vmin,7px)}
  .mks-card{
    background:var(--surface-2);border:1px solid var(--border-strong);border-radius:8px;padding:min(2.2vmin,8px) min(2.4vmin,9px);
    font-size:clamp(7px,3.2vmin,12px);cursor:grab;touch-action:none;transition:transform .2s ease,border-color .2s;
  }
  .mks-keys{position:absolute;right:min(3vmin,10px);bottom:min(2vmin,7px);font:clamp(6px,2.4vmin,9px) var(--font-mono);color:var(--text-muted)}
  .mks-status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  .mks-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .mks-id{display:block;font:clamp(6px,2.6vmin,10px) var(--font-mono);color:var(--text-faint);margin-bottom:2px}
  .mks-card.mks-float{
    position:fixed;z-index:999;pointer-events:none;border-color:var(--accent);transition:none;
    box-shadow:var(--shadow-lg),0 0 0 1px var(--accent-line),0 0 18px var(--accent-soft);transform:rotate(2.5deg) scale(1.04);
  }
  .mks-hold{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:8px}
  @media (prefers-reduced-motion:reduce){.mks-card{transition:none}.mks-card.mks-float{transform:none}}
  .mks-cap{position:absolute;left:min(3vmin,10px);bottom:min(2vmin,7px);font:clamp(6px,2.4vmin,9px) var(--font-mono);color:var(--text-muted);opacity:.55;pointer-events:none}
</style>

</head>
<body>
<div class="mks-board" id="mks-board" role="group" aria-label="Kanban board with two lanes">
  <div class="mks-col" role="group" aria-label="Queued">
    <div class="mks-head"><span>Queued</span><em class="mks-count">2</em></div>
    <div class="mks-lane" data-lane="todo" role="list" aria-label="Queued cards">
      <div class="mks-card" data-id="k1" tabindex="0" role="listitem" aria-describedby="mks-help" aria-keyshortcuts="ArrowUp ArrowDown ArrowLeft ArrowRight"><span class="mks-id">KB-408</span> OAuth PKCE flow</div>
      <div class="mks-card" data-id="k2" tabindex="0" role="listitem" aria-describedby="mks-help" aria-keyshortcuts="ArrowUp ArrowDown ArrowLeft ArrowRight"><span class="mks-id">KB-411</span> WebSocket retry</div>
    </div>
  </div>
  <div class="mks-col" role="group" aria-label="In flight">
    <div class="mks-head"><span>In Flight</span><em class="mks-count">1</em></div>
    <div class="mks-lane" data-lane="live" role="list" aria-label="In flight cards">
      <div class="mks-card" data-id="k3" tabindex="0" role="listitem" aria-describedby="mks-help" aria-keyshortcuts="ArrowUp ArrowDown ArrowLeft ArrowRight"><span class="mks-id">KB-402</span> GPU shader cache</div>
    </div>
  </div>
  <span id="mks-help" hidden>Arrow Left or Right changes lane. Arrow Up or Down changes position within a lane.</span>
  <span class="mks-status" id="mks-status" role="status" aria-live="polite" aria-atomic="true"></span>
  <span class="mks-keys" aria-hidden="true">Arrows move card</span>
</div>
<div class="mks-cap" aria-hidden="true">Kanban Swimlanes</div>
<script>
(() => {
  addEventListener('message', (e) => {
    const d = e.data;
    if (d && d.type === 'forever:theme' && (d.theme === 'light' || d.theme === 'dark')) document.documentElement.setAttribute('data-theme', d.theme);
  });
  const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const board = document.getElementById('mks-board');
  const lanes = [...board.querySelectorAll('.mks-lane')];
  let card = null, hold = null, offX = 0, offY = 0;
  let demoEnabled = window.__foreverPreview?.demoEnabled !== false, demoTimer = 0, hop = 0;

  const announce = (el) => {
    const lane = el.parentElement, cards = [...lane.querySelectorAll('.mks-card')];
    board.querySelector('#mks-status').textContent = el.textContent.trim().replace(/\s+/g, ' ') + ': ' + lane.parentElement.getAttribute('aria-label') + ', position ' + (cards.indexOf(el) + 1) + ' of ' + cards.length + '.';
  };
  const syncCounts = () => board.querySelectorAll('.mks-col').forEach((col) => {
    col.querySelector('.mks-count').textContent = col.querySelectorAll('.mks-card').length;
  });
  // Animate settled cards.
  const flip = (fn) => {
    const cards = [...board.querySelectorAll('.mks-card:not(.mks-float)')];
    const first = new Map(cards.map((c) => [c, c.getBoundingClientRect()]));
    fn();
    if (reduced()) return;
    cards.forEach((c) => {
      const a = first.get(c), b = c.getBoundingClientRect();
      if (!a.width || (a.left === b.left && a.top === b.top)) return;
      c.style.transition = 'none';
      c.style.transform = 'translate(' + (a.left - b.left) + 'px,' + (a.top - b.top) + 'px)';
      requestAnimationFrame(() => { if (document.hidden) return; c.style.transition = ''; c.style.transform = ''; });
    });
  };

  // Idle demo shuttles a card every 1.6 s.
  const ORDER = ['k2', 'k3', 'k1'];
  function demoStep() {
    demoTimer = 0;
    if (!demoEnabled || document.hidden || reduced() || card) return;
    const el = board.querySelector('[data-id="' + ORDER[hop++ % ORDER.length] + '"]');
    if (el) flip(() => { lanes[lanes[0].contains(el) ? 1 : 0].appendChild(el); syncCounts(); });
    demoTimer = setTimeout(demoStep, 1600);
  }
  const demoStart = () => { if (!demoTimer && demoEnabled && !document.hidden && !reduced()) demoTimer = setTimeout(demoStep, 800); };
  const takeover = () => { demoEnabled = false; clearTimeout(demoTimer); demoTimer = 0; };
  addEventListener('forever:interactive', takeover);
  document.addEventListener('pointerdown', takeover, true);
  document.addEventListener('keydown', takeover, true);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { clearTimeout(demoTimer); demoTimer = 0; } else demoStart(); });

  board.addEventListener('keydown', (e) => {
    const el = e.target.closest('.mks-card');
    if (!el || !['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) return;
    e.preventDefault();
    if (card) finish();
    const lane = el.parentElement, cards = [...lane.querySelectorAll('.mks-card')], index = cards.indexOf(el);
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      const next = lanes[e.key === 'ArrowLeft' ? 0 : 1];
      if (next !== lane) next.insertBefore(el, next.children[index] || null);
    } else if (e.key === 'ArrowUp' && index > 0) lane.insertBefore(el, cards[index - 1]);
    else if (e.key === 'ArrowDown' && index < cards.length - 1) lane.insertBefore(el, cards[index + 1].nextSibling);
    syncCounts();el.focus({preventScroll:true});announce(el);
  });

  board.addEventListener('pointerdown', (e) => {
    const target = e.target.closest('.mks-card');
    if (!target || e.button !== 0 || card) return;
    card = target;card.focus({preventScroll:true});
    const r = card.getBoundingClientRect();
    offX = e.clientX - r.left; offY = e.clientY - r.top;
    hold = document.createElement('div');
    hold.className = 'mks-hold';
    hold.style.height = r.height + 'px';
    card.parentNode.insertBefore(hold, card);
    card.style.width = r.width + 'px';
    card.style.left = r.left + 'px';
    card.style.top = r.top + 'px';
    card.classList.add('mks-float');
    board.setPointerCapture(e.pointerId);
  });

  board.addEventListener('pointermove', (e) => {
    if (!card) return;
    card.style.left = (e.clientX - offX) + 'px';
    card.style.top = (e.clientY - offY) + 'px';
    const root = board.getRootNode();
    const lane = root.elementFromPoint(e.clientX, e.clientY)?.closest('.mks-lane');
    if (!lane) return;
    const after = [...lane.querySelectorAll('.mks-card:not(.mks-float)')].find((c) => {
      const r = c.getBoundingClientRect();
      return e.clientY < r.top + r.height / 2;
    });
    if (after) { if (hold.nextSibling !== after) lane.insertBefore(hold, after); }
    else if (hold.parentNode !== lane || hold.nextSibling) lane.appendChild(hold);
  });

  const finish = () => {
    if (!card) return;
    card.classList.remove('mks-float');
    card.style.width = card.style.left = card.style.top = '';
    hold.replaceWith(card);
    card.focus({preventScroll:true});announce(card);
    hold = card = null;
    syncCounts();
  };
  board.addEventListener('pointerup', finish);
  board.addEventListener('pointercancel', finish);
  demoStart();
})();
</script>
</body>
</html>
