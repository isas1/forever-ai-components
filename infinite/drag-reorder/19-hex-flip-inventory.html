<script>
(function(){
var $=function(i){return document.getElementById('wig-'+i)},R=$('r'),C=$('c'),X=C.getContext('2d'),S=300,D=1,K={},raf=0,last=0,M=Math,P=M.PI,T=P*2;
function rm(){return matchMedia('(prefers-reduced-motion: reduce)').matches}
function rd(){var s=getComputedStyle(document.documentElement);['paper','ink','mid','acc'].forEach(function(n){K[n]=s.getPropertyValue('--'+n).trim()})}
function sp(o,p,t,k,f,dt){if(rm()){o[p]=t;o[p+'v']=0;return 0}var v=o[p+'v']||0;v+=(t-o[p])*k*dt;v*=M.pow(f,dt);o[p]+=v*dt;o[p+'v']=v;return M.abs(v)>.0004||M.abs(t-o[p])>.0004}
function say(t){$('s').textContent=t}
function fit(){S=R.clientWidth||300;D=M.min(window.devicePixelRatio||1,2);C.width=C.height=M.round(S*D);kick()}
function kick(){if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(tick)}}
function tick(n){raf=0;var dt=M.min(n-last,50)/16.667;last=n;var a=step(dt);X.setTransform(D*S,0,0,D*S,0,0);X.clearRect(0,0,1,1);X.lineJoin='round';X.lineCap='round';draw();if(a)raf=requestAnimationFrame(tick)}
function pt(e){var r=R.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
function lw(p){X.lineWidth=p/S}
function poly(x,y,r,n,a){X.beginPath();for(var i=0;i<n;i++){var q=a+i/n*T;X[i?'lineTo':'moveTo'](x+r*M.cos(q),y+r*M.sin(q))}X.closePath()}
function fa(c,a){X.globalAlpha=a;X.fillStyle=c;X.fill();X.globalAlpha=1}
function txt(s,x,y,sz,c){X.save();X.setTransform(D,0,0,D,0,0);X.fillStyle=c;X.font=(sz*S)+'px Georgia,"Times New Roman",serif';X.textAlign='center';X.textBaseline='middle';X.fillText(s,x*S,y*S);X.restore()}
function foc(){return R.matches(':focus-visible')}

var W=[1,2,3,2,4,3],N=6,CAP=9,Rh=.165,I=[],L={p:0},mp=null,fl=0,sel=0,SQ=M.sqrt(3);
function cc(i){var a=i*P/3;return[.5+SQ*Rh*M.cos(a),.5+SQ*Rh*M.sin(a)]}
function load(){var s=0;I.forEach(function(o,i){if(o.e)s+=W[i]});return s}
for(var i=0;i<N;i++){var e=i===1||i===2;I.push({e:e,f:e?1:0,h:0})}
L.p=load();
function step(dt){var a=0;
I.forEach(function(o,i){var c=cc(i),t=mp?M.exp(-M.pow(M.hypot(mp[0]-c[0],mp[1]-c[1])/.2,2)):0;
a|=sp(o,'f',o.e?1:0,.1,.8,dt);a|=sp(o,'h',t,.14,.72,dt)});
a|=sp(L,'p',load(),.09,.8,dt);fl*=M.pow(.9,dt);if(fl<.01)fl=0;else a=1;return a}
function cell(i){var o=I[i],c=cc(i),s=(1+.14*o.h)*Rh*.94,W2=W[i];
for(var j=0;j<6;j++){
var ff=M.max(0,M.min(1,o.f*1.7-j*.14)),ax=P/3*(j+1),ux=M.cos(ax),uy=M.sin(ax),nx=-uy,ny=ux,cs=M.cos(P*ff),
q1=P/6+j*P/3,q2=q1+P/3,v1=[s*M.cos(q1),s*M.sin(q1)],v2=[s*M.cos(q2),s*M.sin(q2)],g=[(v1[0]+v2[0])/3,(v1[1]+v2[1])/3];
for(var k=0;k<W2;k++){var z=1-.27*k,pts=[[0,0],v1,v2];
X.beginPath();pts.forEach(function(p,n){var x=g[0]+(p[0]-g[0])*z,y=g[1]+(p[1]-g[1])*z,a=x*ux+y*uy,b=(x*nx+y*ny)*cs;
X[n?'lineTo':'moveTo'](c[0]+ux*a+nx*b,c[1]+uy*a+ny*b)});X.closePath();
if(k===0&&ff>.5)fa(K.acc,.14);lw(1.3);X.strokeStyle=ff>.5?K.acc:K.ink;X.stroke()}}
if(i===sel&&foc()){poly(c[0],c[1],s+.014,6,P/6);X.setLineDash([.008,.012]);lw(1.2);X.strokeStyle=K.acc;X.stroke();X.setLineDash([])}}
function draw(){
for(var k=0;k<CAP;k++){var r=Rh*(.97-k*.5/CAP),pr=M.max(0,M.min(1,L.p-k));poly(.5,.5,r,6,P/6);lw(1);X.strokeStyle=pr>0?K.ink:K.mid;X.globalAlpha=pr>0?.25+.7*pr:.2;X.stroke();X.globalAlpha=1}
if(fl>0){poly(.5,.5,Rh*.97,6,P/6);X.globalAlpha=fl;lw(3);X.strokeStyle=K.acc;X.stroke();X.globalAlpha=1}
txt(M.round(L.p)+'/'+CAP,.5,.5,.07,fl>0?K.acc:K.ink);
I.forEach(function(o,i){cell(i)})}
function pick(x,y){var b=-1,bd=9;for(var i=0;i<N;i++){var c=cc(i),d=M.hypot(c[0]-x,c[1]-y);if(d<Rh*.95&&d<bd){bd=d;b=i}}return b}
function tog(i){var o=I[i];
if(o.e){o.e=false;say('Closed cell '+(i+1)+'. Load '+load()+' of '+CAP+'.')}
else if(load()+W[i]<=CAP){o.e=true;say('Equipped cell '+(i+1)+'. Load '+load()+' of '+CAP+'.')}
else{o.fv=(o.fv||0)+.14;fl=1;say('Too heavy. Limit '+CAP+'.')}kick()}
R.addEventListener('pointermove',function(e){mp=pt(e);kick()});
R.addEventListener('pointerdown',function(e){mp=pt(e);kick()});
R.addEventListener('pointerleave',function(){mp=null;kick()});
R.addEventListener('click',function(e){var p=pt(e),i=pick(p[0],p[1]);if(i<0)return;sel=i;tog(i)});
R.addEventListener('keydown',function(e){var k=e.key;
if(k==='ArrowRight'||k==='ArrowDown'){sel=(sel+1)%N;say('Cell '+(sel+1)+', weight '+W[sel]+(I[sel].e?', equipped':''))}
else if(k==='ArrowLeft'||k==='ArrowUp'){sel=(sel+N-1)%N;say('Cell '+(sel+1)+', weight '+W[sel]+(I[sel].e?', equipped':''))}
else if(k==='Enter'||k===' '){tog(sel)}else return;e.preventDefault();kick()});

rd();

var demoEnabled=window.__foreverPreview?.demoEnabled!==false,demoTimer=0,demoIndex=0;
function demoStop(){demoEnabled=false;clearInterval(demoTimer);demoTimer=0}
function demoStart(){if(demoTimer||!demoEnabled||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;demoTimer=setInterval(function(){if(!demoEnabled||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;tog(demoIndex++%N)},1400)}
window.addEventListener('forever:interactive',demoStop);
['pointerdown','keydown','wheel','click'].forEach(function(t){document.addEventListener(t,function(e){if(e.isTrusted)demoStop()},{capture:true,passive:true})});
document.addEventListener('visibilitychange',function(){clearInterval(demoTimer);demoTimer=0;if(!document.hidden)demoStart()});
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',function(){clearInterval(demoTimer);demoTimer=0;demoStart()});
demoStart();
})();
</script></body></html>
