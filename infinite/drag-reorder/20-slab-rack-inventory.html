<script>
(function(){
var $=function(i){return document.getElementById('wih-'+i)},R=$('r'),C=$('c'),X=C.getContext('2d'),S=300,D=1,K={},raf=0,last=0,M=Math,P=M.PI,T=P*2;
function rm(){return matchMedia('(prefers-reduced-motion: reduce)').matches}
function rd(){var s=getComputedStyle(document.documentElement);['paper','ink','mid','acc'].forEach(function(n){K[n]=s.getPropertyValue('--'+n).trim()})}
function sp(o,p,t,k,f,dt){if(rm()){o[p]=t;o[p+'v']=0;return 0}var v=o[p+'v']||0;v+=(t-o[p])*k*dt;v*=M.pow(f,dt);o[p]+=v*dt;o[p+'v']=v;return M.abs(v)>.0004||M.abs(t-o[p])>.0004}
function say(t){$('s').textContent=t}
function fit(){S=R.clientWidth||300;D=M.min(window.devicePixelRatio||1,2);C.width=C.height=M.round(S*D);kick()}
function kick(){if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(tick)}}
function tick(n){raf=0;var dt=M.min(n-last,50)/16.667;last=n;var a=step(dt);X.setTransform(D*S,0,0,D*S,0,0);X.clearRect(0,0,1,1);X.lineJoin='round';X.lineCap='round';draw();if(a)raf=requestAnimationFrame(tick)}
function pt(e){var r=R.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
function lw(p){X.lineWidth=p/S}
function poly(x,y,r,n,a){X.beginPath();for(var i=0;i<n;i++){var q=a+i/n*T;X[i?'lineTo':'moveTo'](x+r*M.cos(q),y+r*M.sin(q))}X.closePath()}
function fa(c,a){X.globalAlpha=a;X.fillStyle=c;X.fill();X.globalAlpha=1}
function txt(s,x,y,sz,c){X.save();X.setTransform(D,0,0,D,0,0);X.fillStyle=c;X.font=(sz*S)+'px Georgia,"Times New Roman",serif';X.textAlign='center';X.textBaseline='middle';X.fillText(s,x*S,y*S);X.restore()}
function foc(){return R.matches(':focus-visible')}

var W=[1,2,2,3,4],N=5,CAP=8,u=.06,HW=.13,FL=.93,I=[],pk=[1,2],dr=-1,ox=0,oy=0,fl=0,sel=0,px=0,py=0,pvx=0,pvy=0,lt=0;
function hh(i){return W[i]*u-.008}
function load(){var s=0;pk.forEach(function(i){s+=W[i]});return s}
function ty(i){if(I[i].e){var s=0;for(var q=0;q<pk.indexOf(i);q++)s+=W[pk[q]]*u;return FL-s-W[i]*u/2}
var s2=0;for(var j=0;j<i;j++)s2+=W[j]*u+.02;return FL-s2-W[i]*u/2}
function tx(i){return I[i].e?.26:.72}
for(var i=0;i<N;i++)I.push({e:pk.indexOf(i)>=0,x:0,y:0,vx:0,vy:0});
I.forEach(function(o,i){o.x=tx(i);o.y=ty(i)});
function step(dt){var a=0;
I.forEach(function(o,i){if(i===dr)return;var tX=tx(i),tY=ty(i);
if(rm()){o.x=tX;o.y=tY;o.vx=o.vy=0;return}
o.vx+=(tX-o.x)*.03*dt;o.vx*=M.pow(.86,dt);o.vy+=.0024*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;
if(o.y>=tY){o.y=tY;if(o.vy>.005)o.vy=-o.vy*.38;else o.vy=0}
if(M.abs(o.vx)>.0003||M.abs(tX-o.x)>.001||M.abs(o.vy)>.0003||o.y<tY-.001)a=1;else{o.x=tX;o.vx=0}});
fl*=M.pow(.9,dt);if(fl<.01)fl=0;else a=1;return a||dr>=0}
function slab(i){var o=I[i],h=hh(i),x0=o.x-HW,y0=o.y-h/2,d=i===dr;
if(d){X.beginPath();X.rect(x0+.01,y0+.013,HW*2,h);X.globalAlpha=.3;lw(1.4);X.strokeStyle=K.mid;X.stroke();X.globalAlpha=1}
X.beginPath();X.rect(x0,y0,HW*2,h);if(o.e)fa(K.acc,.12);lw(d?2.4:1.6);X.strokeStyle=o.e?K.acc:K.ink;X.stroke();
X.beginPath();for(var k=1;k<W[i];k++){X.moveTo(x0,y0+k*u);X.lineTo(x0+HW*2,y0+k*u)}
for(var m=1;m*u<HW*2;m++){X.moveTo(x0+m*u,y0);X.lineTo(x0+m*u,y0+h)}
lw(.8);X.globalAlpha=.4;X.stroke();X.globalAlpha=1;
if(i===sel&&foc()){X.beginPath();X.rect(x0-.015,y0-.015,HW*2+.03,h+.03);X.setLineDash([.008,.012]);lw(1.2);X.strokeStyle=K.acc;X.stroke();X.setLineDash([])}}
function draw(){var cy=FL-CAP*u;
X.strokeStyle=K.mid;lw(1.4);X.beginPath();X.moveTo(.08,cy);X.lineTo(.08,FL+.004);X.lineTo(.44,FL+.004);X.lineTo(.44,cy);X.moveTo(.56,FL+.004);X.lineTo(.88,FL+.004);X.stroke();
X.setLineDash([.012,.012]);lw(1.4+fl*2);X.strokeStyle=K.acc;X.beginPath();X.moveTo(.08,cy);X.lineTo(.44,cy);X.stroke();X.setLineDash([]);
txt(load()+'/'+CAP,.26,cy-.1,.07,fl>0?K.acc:K.ink);
I.forEach(function(o,i){if(i!==dr)slab(i)});if(dr>=0)slab(dr)}
function decide(i,w){var o=I[i];
if(w&&!o.e){if(load()+W[i]<=CAP){o.e=true;pk.push(i);say('Equipped item '+(i+1)+'. Load '+load()+' of '+CAP+'.')}else{o.vx=.035;o.vy=-.012;fl=1;say('Too heavy. Limit '+CAP+'.')}}
else if(w&&o.e){pk.splice(pk.indexOf(i),1);pk.push(i)}
else if(!w&&o.e){o.e=false;pk.splice(pk.indexOf(i),1);say('Unequipped item '+(i+1)+'. Load '+load()+' of '+CAP+'.')}}
function cl(v){return M.max(-.05,M.min(.05,v))}
R.addEventListener('pointerdown',function(e){var p=pt(e),b=-1;I.forEach(function(o,i){if(M.abs(o.x-p[0])<HW&&M.abs(o.y-p[1])<hh(i)/2+.01)b=i});if(b<0)return;
dr=b;sel=b;ox=I[b].x-p[0];oy=I[b].y-p[1];px=p[0];py=p[1];pvx=pvy=0;lt=e.timeStamp;I[b].vx=I[b].vy=0;R.setPointerCapture(e.pointerId);kick()});
R.addEventListener('pointermove',function(e){if(dr<0)return;var p=pt(e),d=M.max(e.timeStamp-lt,8)/16.667;
pvx=pvx*.5+(p[0]-px)/d*.5;pvy=pvy*.5+(p[1]-py)/d*.5;px=p[0];py=p[1];lt=e.timeStamp;I[dr].x=px+ox;I[dr].y=py+oy;kick()});
R.addEventListener('pointerup',function(e){if(dr<0)return;var i=dr,o=I[i];dr=-1;
if(e.timeStamp-lt>90){pvx=0;pvy=0}
o.vx=cl(pvx);o.vy=cl(pvy);decide(i,o.x+o.vx*6<.5);kick()});
R.addEventListener('pointercancel',function(){dr=-1;kick()});
R.addEventListener('keydown',function(e){var k=e.key;
if(k==='ArrowRight'||k==='ArrowDown'){sel=(sel+1)%N;say('Item '+(sel+1)+', weight '+W[sel]+(I[sel].e?', equipped':''))}
else if(k==='ArrowLeft'||k==='ArrowUp'){sel=(sel+N-1)%N;say('Item '+(sel+1)+', weight '+W[sel]+(I[sel].e?', equipped':''))}
else if(k==='Enter'||k===' '){var o=I[sel],w=!o.e;decide(sel,w);if(o.e===w){o.vx=w?-.04:.04;o.vy=-.015}}else return;e.preventDefault();kick()});

rd();
document.addEventListener('visibilitychange',function(){if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick()});
window.addEventListener('message',function(e){var m=e.data;if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){document.documentElement.setAttribute('data-theme',m.theme);rd();kick()}});
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',kick);
new ResizeObserver(fit).observe(R);fit();

var demoEnabled=window.__foreverPreview?.demoEnabled!==false,demoTimer=0,demoIndex=0;
function demoStop(){demoEnabled=false;clearInterval(demoTimer);demoTimer=0}
function demoStart(){if(demoTimer||!demoEnabled||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;demoTimer=setInterval(function(){if(!demoEnabled||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;var i=demoIndex++%N;decide(i,!I[i].e);kick()},1400)}
window.addEventListener('forever:interactive',demoStop);
['pointerdown','keydown','wheel','click'].forEach(function(t){document.addEventListener(t,function(e){if(e.isTrusted)demoStop()},{capture:true,passive:true})});
document.addEventListener('visibilitychange',function(){clearInterval(demoTimer);demoTimer=0;if(!document.hidden)demoStart()});
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',function(){clearInterval(demoTimer);demoTimer=0;demoStart()});
demoStart();
})();
</script></body></html>
