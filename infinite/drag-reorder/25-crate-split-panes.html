<script>/* theme hook: ?theme=light|dark before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
:root{
  --cr04-bg:#131316;--cr04-ink:#F1F1F4;--cr04-mute:#9A9CA6;--cr04-line:#2B2C31;--cr04-soft:#1F2024;--cr04-cobalt:#7B95C4;
  --cr04-vinyl:#000;--cr04-ve:#3A3B42;--cr04-r:3px;--cr04-p:44;--cr04-spr:cubic-bezier(.3,1.45,.5,1);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --cr04-bg:#EFF0F3;--cr04-ink:#000;--cr04-mute:#5F616B;--cr04-line:#CDCFD8;--cr04-soft:#E1E3EA;--cr04-cobalt:#2B4473;
  --cr04-ve:transparent;color-scheme:light;
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--cr04-bg);color:var(--cr04-ink);font-family:"Avenir Next",Avenir,"Segoe UI",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.cr04-stage,.cr04-stage *,.cr04-stage *::before,.cr04-stage *::after{box-sizing:border-box}
.cr04-stage{position:relative;width:100%;height:100%;display:grid;place-items:center;padding:clamp(8px,3vmin,18px);background:var(--cr04-bg);color:var(--cr04-ink)}
.cr04-stage :focus-visible{outline:2px solid var(--cr04-cobalt);outline-offset:2px}
.cr04-sp{display:grid;grid-template-columns:calc(var(--cr04-p) * 1%) clamp(10px,3vmin,16px) minmax(0,1fr);width:100%;max-width:460px;height:min(100%,252px);border:1px solid var(--cr04-line);border-radius:var(--cr04-r);overflow:hidden}
.cr04-a{min-width:0;overflow:hidden;container-type:inline-size}
.cr04-ul{list-style:none;margin:0;padding:clamp(3px,1.2vmin,6px);display:grid;gap:2px}
.cr04-sp.cr04-shut .cr04-ul{visibility:hidden}
.cr04-item{display:flex;align-items:center;gap:clamp(5px,2vmin,9px);width:100%;padding:clamp(3px,1.2vmin,6px);border-radius:var(--cr04-r);border:0;margin:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;transition:background .2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.cr04-item[aria-current]{background:var(--cr04-soft)}
.cr04-art{display:block;width:100%;aspect-ratio:1;border-radius:2px}
.cr04-a .cr04-art{width:clamp(22px,8vmin,36px);flex:none}
.cr04-tx{min-width:0}
.cr04-title,.cr04-artist{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(10px,3.2vmin,14px)}
.cr04-artist,.cr04-d-a{color:var(--cr04-mute);font-size:clamp(9px,2.8vmin,12px)}
@container (max-width:108px){.cr04-tx{display:none}.cr04-item{justify-content:center}}
.cr04-h{position:relative;display:grid;place-items:center;cursor:col-resize;touch-action:none}
.cr04-h::before{content:"";position:absolute;inset:0 -8px}
.cr04-h::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--cr04-line)}
.cr04-knob{position:relative;z-index:1;width:5px;height:clamp(18px,8vmin,30px);border-radius:3px;background:var(--cr04-ink);transition:height .3s var(--cr04-spr),background .2s}
.cr04-h:hover .cr04-knob,.cr04-h:focus-visible .cr04-knob,.cr04-sp.cr04-drag .cr04-knob{height:clamp(28px,12vmin,48px)}
.cr04-sp.cr04-drag .cr04-knob{background:var(--cr04-cobalt)}
.cr04-h:focus-visible{outline-offset:-2px}
.cr04-b{min-width:0;overflow:hidden;display:grid;place-items:center;padding:clamp(6px,2.5vmin,12px)}
.cr04-d{display:grid;justify-items:start;width:100%;max-width:min(100%,150px)}
.cr04-cov{position:relative;width:min(76%,clamp(54px,24vmin,112px));margin-bottom:clamp(5px,2vmin,12px)}
.cr04-disc{position:absolute;inset:5%;transform:translateX(36%);display:block;border-radius:50%;background:var(--cr04-vinyl);border:1px solid var(--cr04-ve)}
.cr04-disc::after{content:"";position:absolute;inset:33%;border-radius:50%;background:#D5412B}
.cr04-cov .cr04-art{position:relative}
.cr04-d-t{font-family:Futura,"Avenir Next",Avenir,ui-sans-serif,system-ui,sans-serif;font-size:clamp(12px,3.8vmin,17px);line-height:1.15}
.cr04-pr{margin-top:clamp(4px,1.5vmin,8px);padding:2px clamp(6px,2vmin,10px);border-radius:999px;border:1.5px solid var(--cr04-ink);font-weight:600;font-size:clamp(10px,3vmin,13px)}
.cr04-cap{position:absolute;left:10px;bottom:8px;font:500 11px/1 ui-monospace,monospace;color:var(--cr04-ink);opacity:.45;letter-spacing:.04em;text-transform:uppercase;pointer-events:none;user-select:none}
@media (prefers-reduced-motion:reduce){.cr04-stage *,.cr04-stage *::before,.cr04-stage *::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/drag-reorder/25-crate-split-panes.html",
 "title": "Crate Split Panes",
 "description": "Resizable sleeve list and detail view using CSS container-query collapse, keyboard slider steps, and spring-damped release.",
 "useWhen": "Master-detail browsers, inspector layouts, and catalog comparison panes.",
 "avoidWhen": "Fixed single-column mobile forms.",
 "agentPrompt": "Edit --b/--i/--c/--l tokens in :root and [data-theme=\"light\"].",
 "editableAreas": [
  "theme CSS tokens (--b/--i/--c/--l), data arrays & timings"
 ],
 "preserveElements": [
  "IIFE + crNN- prefix, reduced-motion, visibilitychange, theme/demo-v1"
 ],
 "knownLimitations": [
  "Demo state resets on remount"
 ],
 "tier": "curated",
 "labels": [

<body>
<div class="cr04-stage" id="cr04-stage"></div>
<div class="cr04-cap" aria-hidden="true">Split Panes</div>
<script>(()=>{
  const s=document.getElementById('cr04-stage');
  const mq=matchMedia('(prefers-reduced-motion: reduce)');
  const RM=()=>mq.matches;
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
  const NO={finished:Promise.resolve(),cancel(){}};
  const anim=(el,kf,o={})=>RM()?NO:el.animate(kf,Object.assign({duration:300,easing:'cubic-bezier(.2,.8,.2,1)'},o));
  const SPR='cubic-bezier(.3,1.45,.5,1)';
  const spring=o=>{
    if(RM()){o.step(o.to);o.done&&o.done();return()=>{}}
    let x=o.from,v=o.v0||0,last=performance.now(),id=0;const k=o.k||260,c=o.c||26,eps=o.eps||.3;
    const tick=now=>{const dt=Math.min(.032,(now-last)/1000);last=now;
      for(let i=0;i<4;i++){v+=(-k*(x-o.to)-c*v)*dt/4;x+=v*dt/4}
      if(Math.abs(x-o.to)<eps&&Math.abs(v)<eps*20){o.step(o.to);o.done&&o.done();return}
      o.step(x);id=requestAnimationFrame(tick)};
    id=requestAnimationFrame(tick);return()=>cancelAnimationFrame(id);
  };
  const C={p:'#F2F0EA',k:'#0A0A0A',b:'#2B4473',r:'#D5412B',m:'#E2B01A',s:'#5E9470',u:'#5A3A5C'};
  const bg=c=>`<rect width="100" height="100" fill="${c}"/>`;
  const ART=[
    bg(C.p)+`<circle cx="38" cy="62" r="34" fill="${C.b}"/><rect x="64" y="10" width="8" height="80" fill="${C.k}"/><circle cx="85" cy="18" r="6" fill="${C.r}"/>`,
    bg(C.p)+`<circle cx="0" cy="100" r="92" fill="${C.k}"/><circle cx="0" cy="100" r="72" fill="${C.p}"/><circle cx="0" cy="100" r="52" fill="${C.r}"/><circle cx="0" cy="100" r="32" fill="${C.p}"/>`,
    bg(C.s)+`<path d="M0 100L100 0v100z" fill="${C.p}"/><circle cx="70" cy="70" r="14" fill="${C.k}"/>`,
    bg(C.p)+`<circle cx="36" cy="40" r="22" fill="${C.k}"/><circle cx="64" cy="58" r="22" fill="${C.b}"/><rect x="10" y="86" width="30" height="4" fill="${C.k}"/>`
  ];
  const art=i=>`<svg class="cr04-art" viewBox="0 0 100 100" aria-hidden="true">${ART[i]}</svg>`;
  const RECS=[{t:'Low Tide',a:'Marlo Finch',p:24},{t:'Kiln',a:'Petra Voss',p:31},{t:'Half Light',a:'Sable & Rue',p:17},{t:'Salt',a:'Ines Maro',p:21}];
  let p=44,last=44,stop=null,curR=0;
  s.innerHTML=`<div class="cr04-sp"><div class="cr04-a" id="cr04-pane"><ul class="cr04-ul">${RECS.map((R,i)=>`<li><button type="button" class="cr04-item" data-r="${i}" aria-label="${R.t}"${i?'':' aria-current="true"'}>${art(i)}<span class="cr04-tx"><b class="cr04-title">${R.t}</b><small class="cr04-artist">${R.a}</small></span></button></li>`).join('')}</ul></div><div class="cr04-h" role="separator" tabindex="0" aria-orientation="vertical" aria-controls="cr04-pane" aria-label="Resize record list" aria-valuemin="0" aria-valuemax="70" aria-valuenow="44"><i class="cr04-knob"></i></div><div class="cr04-b" aria-live="polite"></div></div>`;
  const root=s.querySelector('.cr04-sp'),a=s.querySelector('.cr04-a'),h=s.querySelector('.cr04-h'),b=s.querySelector('.cr04-b'),items=[...a.querySelectorAll('.cr04-item')];
  const detail=(r,an)=>{curR=r;const R=RECS[r];b.innerHTML=`<div class="cr04-d"><div class="cr04-cov"><i class="cr04-disc"></i>${art(r)}</div><b class="cr04-d-t">${R.t}</b><small class="cr04-d-a">${R.a}</small><span class="cr04-pr">£${R.p}</span></div>`;
    if(an)anim(b.firstChild,[{transform:'translateY(12px)',opacity:0},{transform:'none',opacity:1}],{duration:340,easing:SPR})};
  const pickRec=r=>{items.forEach((x,j)=>j===r?x.setAttribute('aria-current','true'):x.removeAttribute('aria-current'));detail(r,true)};
  detail(0);
  a.addEventListener('click',e=>{const t=e.target.closest('button');if(!t||t.hasAttribute('aria-current'))return;pickRec(+t.dataset.r)});
  const set=v=>{p=v;root.style.setProperty('--cr04-p',Math.max(v,0).toFixed(2));h.setAttribute('aria-valuenow',String(Math.round(clamp(v,0,70))));const shut=v<2;a.inert=shut;root.classList.toggle('cr04-shut',shut)};
  const settle=to=>{stop&&stop();if(to>=26)last=to;stop=spring({from:p,to,k:320,c:24,eps:.05,step:set})};
  h.addEventListener('pointerdown',e=>{if(e.button)return;e.preventDefault();h.focus({preventScroll:true});h.setPointerCapture(e.pointerId);stop&&stop();const r=root.getBoundingClientRect();root.classList.add('cr04-drag');
    const mv=ev=>set(clamp((ev.clientX-r.left-8)/r.width*100,0,70));
    const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);root.classList.remove('cr04-drag');settle(p<15?0:p<26?26:p)};
    h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up)});
  h.addEventListener('keydown',e=>{const k=e.key;let v=null;
    if(k==='ArrowLeft')v=p<=26?0:Math.max(26,p-4);else if(k==='ArrowRight')v=p<26?26:Math.min(70,p+4);else if(k==='Home')v=0;else if(k==='End')v=70;else if(k==='Enter')v=p<2?last:0;
    if(v!==null){e.preventDefault();settle(v)}});
  h.addEventListener('dblclick',()=>settle(44));

  let demo=!RM()&&!(window.__foreverPreview&&window.__foreverPreview.demoEnabled===false);
  let timer=0,kick=0,step=0;
  const seq=[[26,1],[56,2],[44,3],[44,0]];
  const play=()=>{if(!demo||RM()||document.hidden)return;const [np,nr]=seq[step++%seq.length];settle(np);if(nr!==curR)pickRec(nr)};
  const stopDemo=()=>{if(timer){clearInterval(timer);timer=0}if(kick){clearTimeout(kick);kick=0}};
  const start=()=>{if(!timer&&demo&&!RM())timer=setInterval(play,1450)};
  const takeover=()=>{demo=false;stopDemo()};
  window.addEventListener('forever:interactive',takeover);
  s.addEventListener('pointerdown',takeover,true);
  s.addEventListener('keydown',takeover,true);
  document.addEventListener('visibilitychange',()=>{if(document.hidden){stop&&stop();stopDemo()}else if(demo)start()});
  window.addEventListener('message',e=>{if(e.data&&e.data.type==='forever:theme'&&(e.data.theme==='light'||e.data.theme==='dark'))document.documentElement.setAttribute('data-theme',e.data.theme)});
  if(demo){kick=setTimeout(play,650);start()}
})();</script>
</body>
