<style>

<body>
<div class="ps-st">

<script>
(function(){
var root=document.documentElement,bd=document.getElementById("ps-bd");
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
var demo=!reduce&&(!window.__foreverPreview||window.__foreverPreview.demoEnabled!==false);
var star="M";
for(var k=0;k<10;k++){var an=-Math.PI/2+k*Math.PI/5,rr=k%2?21:44;star+=(50+Math.cos(an)*rr).toFixed(1)+" "+(52+Math.sin(an)*rr).toFixed(1)+(k<9?"L":"z");}
var pear="M53 16c-2 12-25 22-25 48 0 17 10 26 22 26s22-9 22-26c0-26-16-36-19-48zM55 15c6-8 16-8 20-4-6 6-14 7-20 4z";
var tick="M10 30h80v12a8 8 0 0 0 0 16v12H10V58a8 8 0 0 0 0-16z";
var cat="M18 42l6-26 18 14h16l18-14 6 26c4 8 4 16 0 24-6 13-20 20-32 20S24 79 18 66c-4-8-4-16 0-24z";
var DEF=[
{n:"Star",d:star,art:'<path d="'+star+'" fill="#D8B978" stroke="#D8B978" stroke-width="4" stroke-linejoin="round"/><path d="M50 24l5 14" stroke="#EDD9AE" stroke-width="3" stroke-linecap="round"/>',fx:.3,fy:.36,a:-8},
{n:"Pear",d:pear,art:'<path d="'+pear.split("z")[0]+'z" fill="#A4B596"/><path d="M55 15c6-8 16-8 20-4-6 6-14 7-20 4z" fill="#7E9468"/><path d="M60 40c6 6 8 14 7 24" fill="none" stroke="#C3D0B4" stroke-width="3" stroke-linecap="round"/><path d="M53 16c0-4 1-7 3-9" stroke="#5A4A3A" stroke-width="2"/>',fx:.7,fy:.34,a:10},
{n:"Ticket",d:tick,art:'<path d="'+tick+'" fill="#C98B6E"/><path d="M70 32v36" stroke="#FBF8F1" stroke-width="2" stroke-dasharray="3 3"/><text x="40" y="54" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" fill="#2E2B26">ADMIT</text>',fx:.36,fy:.7,a:-14},
{n:"Cat",d:cat,art:'<path d="'+cat+'" fill="#93A6BB"/><circle cx="38" cy="54" r="4" fill="#24221E"/><circle cx="62" cy="54" r="4" fill="#24221E"/><path d="M47 62h6l-3 3z" fill="#C98B6E"/><path d="M30 62l-12-2M30 66l-11 3M70 62l12-2M70 66l11 3" stroke="#FBF8F1" stroke-width="1.2"/>',fx:.68,fy:.68,a:6}
];
var BOX="-30 -30 160 -30 160 160 -30 160",z=10,raf=0,bw=0,bh=0,S=100,t0=0,cyc=-1;
var ST=DEF.map(function(o,i){
var b=document.createElement("button");
b.type="button";b.className="ps-s";b.ariaLabel=o.n+" sticker";b.ariaPressed="false";
b.innerHTML='<svg class="ps-v" viewBox="-12 -12 124 124" aria-hidden="true"><defs><clipPath id="ps-k'+i+'"><polygon points="'+BOX+'"/></clipPath><clipPath id="ps-f'+i+'"><polygon points=""/></clipPath></defs>'+
'<g clip-path="url(#ps-k'+i+')"><path class="ps-pp" d="'+o.d+'"/>'+o.art+'</g><g><g clip-path="url(#ps-f'+i+')"><path class="ps-fs" transform="translate(1.5 2.5)" d="'+o.d+'"/><path class="ps-un" d="'+o.d+'"/></g></g></svg>';
bd.appendChild(b);
var q=b.querySelectorAll("polygon");
return{b:b,kc:q[0],fc:q[1],fl:b.querySelector("svg > g:last-child"),fx:o.fx,fy:o.fy,a:o.a,sc:1,m:"seat",G:{x:0,y:0},D:{x:0,y:0},T:{x:0,y:0},vx:0,vy:0,px:0,py:0};
});

window.addEventListener("message",function(e){
if(e.data&&e.data.type==="forever:theme"&&(e.data.theme==="light"||e.data.theme==="dark"))root.setAttribute("data-theme",e.data.theme);
});

function size(){var r=bd.getBoundingClientRect();bw=r.width;bh=r.height;S=Math.max(72,Math.min(220,Math.min(bw,bh)*0.44));ST.forEach(function(s){s.b.style.width=s.b.style.height=S+"px";});}
function U(){return 124/S;}
function cp(a,b){a.x=b.x;a.y=b.y;}
function edge(s,e,k){var p=local(s,e.clientX,e.clientY),dx=p.x-50,dy=p.y-50,l=Math.hypot(dx,dy)||1;s.G.x=50+dx/l*44;s.G.y=50+dy/l*44;s.T.x=s.G.x-dx/l*k;s.T.y=s.G.y-dy/l*k;}
function rot(x,y,deg){var c=Math.cos(deg*Math.PI/180),s=Math.sin(deg*Math.PI/180);return{x:x*c-y*s,y:x*s+y*c};}
function local(s,cx,cy){var r=bd.getBoundingClientRect(),v=rot(cx-r.left-s.fx*bw,cy-r.top-s.fy*bh,-s.a);return{x:v.x/s.sc*U()+50,y:v.y/s.sc*U()+50};}
function poly(M,n,u,g){return[[1,0],[1,g],[-1,g],[-1,0]].map(function(c){return(M.x+(u.x*c[0]+n.x*c[1])*300).toFixed(1)+" "+(M.y+(u.y*c[0]+n.y*c[1])*300).toFixed(1);}).join(" ");}
function fold(s){
var dx=s.D.x-s.G.x,dy=s.D.y-s.G.y,l=Math.hypot(dx,dy);
if(l<0.6){s.kc.setAttribute("points",BOX);s.fc.setAttribute("points","");return;}
var n={x:dx/l,y:dy/l},u={x:-n.y,y:n.x},M={x:(s.G.x+s.D.x)/2,y:(s.G.y+s.D.y)/2};
s.kc.setAttribute("points",poly(M,n,u,1));s.fc.setAttribute("points",poly(M,n,u,-1));
var c2=u.x*u.x-u.y*u.y,s2=2*u.x*u.y;
s.fl.setAttribute("transform","matrix("+[c2,s2,s2,-c2,M.x-(c2*M.x+s2*M.y),M.y-(s2*M.x-c2*M.y)].map(function(v){return v.toFixed(3);}).join(" ")+")");
}
function place(s){s.b.style.transform="translate("+(s.fx*bw-S/2).toFixed(1)+"px,"+(s.fy*bh-S/2).toFixed(1)+"px) rotate("+s.a.toFixed(1)+"deg) scale("+s.sc.toFixed(3)+")";}
function top(s){s.b.style.zIndex=++z;}
function lift(s,kb){s.m=kb?"held":"up";s.sc=reduce?1.04:s.sc;cp(s.D,s.G);fold(s);s.b.classList.add("ps-up");s.b.ariaPressed="true";top(s);}
function slap(s){
s.m="seat";s.sc=1;s.b.classList.remove("ps-up");s.b.ariaPressed="false";
s.b.classList.remove("ps-slap");void s.b.offsetWidth;reduce||s.b.classList.add("ps-slap");place(s);
}
function keepIn(s){var mx=S*0.38/bw,my=S*0.38/bh;s.fx=Math.max(mx,Math.min(1-mx,s.fx));s.fy=Math.max(my,Math.min(1-my,s.fy));}

function frame(ts){
raf=0;
if(document.hidden)return;
var busy=demo;
if(demo)runDemo(ts);
ST.forEach(function(s){
if(s.m==="peel"||s.m==="back"){
s.D.x+=(s.T.x-s.D.x)*0.35;s.D.y+=(s.T.y-s.D.y)*0.35;fold(s);
if(s.m==="back"&&Math.hypot(s.D.x-s.G.x,s.D.y-s.G.y)<0.5){cp(s.D,s.G);fold(s);s.m="seat";}
busy=true;
}else if(s.m==="up"){
s.sc+=(1.06-s.sc)*0.25;s.fx+=(s.px/bw-s.fx)*0.35;s.fy+=(s.py/bh-s.fy)*0.35;place(s);busy=true;
}else if(s.m==="fly"){
s.fx+=s.vx/bw;s.fy+=s.vy/bh;s.vx*=0.88;s.vy*=0.88;s.a+=s.vx*0.15;
var fx=s.fx,fy=s.fy;keepIn(s);if(fx!==s.fx)s.vx*=-0.3;if(fy!==s.fy)s.vy*=-0.3;
place(s);busy=true;
if(Math.hypot(s.vx,s.vy)<0.35)slap(s);
}
});
if((busy)&&!raf)raf=requestAnimationFrame(frame);
}
function wake(){if(!raf&&!document.hidden)raf=requestAnimationFrame(frame);}

function runDemo(ts){
if(!t0)t0=ts-1700;
var t=(ts-t0)/3600,c=Math.floor(t),p=t-c,s=ST[c%ST.length];
if(c!==cyc){ST.forEach(function(q){if(q.m!=="seat"){q.m="back";cp(q.T,q.G);}});cyc=c;var g=[[1,1],[-1,1],[1,-1],[-1,-1]][c%4];s.G.x=50+g[0]*30;s.G.y=50+g[1]*30;cp(s.D,s.G);top(s);}
var e=p<0.3?p/0.3:p<0.55?1:p<0.8?1-(p-0.55)/0.25:0;
e=e*e*(3-2*e);
s.m="peel";s.T.x=s.G.x+(50-s.G.x)*0.75*e;s.T.y=s.G.y+(50-s.G.y)*0.75*e;
}
function takeover(){
if(!demo)return;demo=false;
ST.forEach(function(q){if(q.m==="peel"){q.m="back";cp(q.T,q.G);}});wake();
}
window.addEventListener("forever:interactive",takeover);

var drag=null;
function on(el,t,f){el.addEventListener(t,f);}
ST.forEach(function(s){
on(s.b,"pointerdown",function(e){
takeover();e.preventDefault();
try{s.b.setPointerCapture(e.pointerId);}catch(_){}
var r=bd.getBoundingClientRect();
drag={s:s,x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,t:performance.now()};
s.px=e.clientX-r.left;s.py=e.clientY-r.top;s.vx=s.vy=0;top(s);
if(s.m==="held"||reduce){lift(s,false);return;}
edge(s,e,0);cp(s.D,s.G);s.m="peel";wake();
});
on(s.b,"pointermove",function(e){
if(!drag){if(e.pointerType=="mouse"&&!reduce&&/seat|peel|back/.test(s.m)){takeover();if(s.m=="seat"){edge(s,e,0);cp(s.D,s.G);}edge(s,e,8);s.m="peel";wake();}return;}
if(drag.s!==s)return;
var r=bd.getBoundingClientRect(),now=performance.now(),dt=Math.max(8,now-drag.t);
s.vx=s.vx*0.5+(e.clientX-drag.lx)/dt*8;s.vy=s.vy*0.5+(e.clientY-drag.ly)/dt*8;
drag.lx=e.clientX;drag.ly=e.clientY;drag.t=now;
s.px=e.clientX-r.left;s.py=e.clientY-r.top;
if(s.m==="peel"){
var v=rot(e.clientX-drag.x,e.clientY-drag.y,-s.a);
s.T.x=s.G.x+v.x*U()*0.85;s.T.y=s.G.y+v.y*U()*0.85;
if(Math.hypot(s.T.x-s.G.x,s.T.y-s.G.y)>52){lift(s,false);}
}else if(s.m==="up"&&reduce){s.fx=s.px/bw;s.fy=s.py/bh;keepIn(s);place(s);}
wake();
});
function up(){
if(!drag||drag.s!==s)return;drag=null;
if(s.m==="peel"){s.m="back";cp(s.T,s.G);}
else if(s.m==="up"){if(reduce){keepIn(s);slap(s);}else{s.m="fly";s.a+=Math.max(-8,Math.min(8,s.vx*0.6));}}
wake();
}
on(s.b,"pointerleave",function(){if(!drag&&s.m=="peel"){s.m="back";cp(s.T,s.G);wake();}});
on(s.b,"pointerup",up);on(s.b,"pointercancel",up);
on(s.b,"click",function(e){if(e.detail!==0)return;takeover();if(s.m==="held")slap(s);else{lift(s,true);s.sc=reduce?1.04:1.06;place(s);}});
on(s.b,"keydown",function(e){
if(e.key==="Escape"&&s.m==="held"){slap(s);return;}
var d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
if(!d||s.m!=="held")return;
e.preventDefault();var st=e.shiftKey?32:8;
s.fx+=d[0]*st/bw;s.fy+=d[1]*st/bh;keepIn(s);place(s);
});
on(s.b,"blur",function(){if(s.m==="held")slap(s);});
on(s.b,"animationend",function(){s.b.classList.remove("ps-slap");});
});
on(document,"keydown",function(e){if(e.key==="Tab")takeover();});
on(document,"visibilitychange",function(){if(!document.hidden)wake();});
addEventListener("resize",function(){size();ST.forEach(function(s){keepIn(s);place(s);});});

size();ST.forEach(function(s){place(s);top(s);});
if(demo)wake();
})();
</script>
