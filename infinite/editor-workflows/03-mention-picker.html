<script>(function(){"use strict";var root=document.documentElement,stage=document.getElementById("mnp-stage"),query=document.getElementById("mnp-query"),reduce=matchMedia("(prefers-reduced-motion:reduce)").matches,step=0,timer=0,running=!document.hidden,demoEnabled=window.__foreverPreview?.demoEnabled!==false,vals=["","@","@ma","@ma",""];addEventListener("message",function(e){var d=e.data;if(d&&d.type==="forever:theme"&&(d.theme==="light"||d.theme==="dark"))root.setAttribute("data-theme",d.theme)});if(!stage)return;function show(n){step=n;stage.dataset.step=n;query.textContent=vals[n]}function next(){show((step+1)%5);schedule(step===4?2300:step===3?700:850)}function schedule(ms){clearTimeout(timer);if(running&&!reduce&&demoEnabled)timer=setTimeout(next,ms)}function act(){takeover();show(step===4?0:step+1)}function takeover(){if(!demoEnabled)return;demoEnabled=false;clearTimeout(timer)}window.addEventListener("forever:interactive",takeover);stage.addEventListener("pointerdown",takeover,true);stage.addEventListener("keydown",function(e){if(e.target.isContentEditable||e.key.length===1||/^(Enter| |Arrow|Escape|Home|End|Page)/.test(e.key))takeover();},true);stage.addEventListener("pointerdown",act);stage.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();act()}});document.addEventListener("visibilitychange",function(){running=!document.hidden;clearTimeout(timer);if(running&&!reduce&&demoEnabled)schedule(500)});if(reduce){show(4);return}show(1);if(demoEnabled)schedule(600)})();</script>
