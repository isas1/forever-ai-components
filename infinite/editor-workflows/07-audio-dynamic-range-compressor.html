<style>
  :root {
    --sc-navy: #0E2A47;
    --sc-red: #BE4D4D;
    --sc-cream: #F8F6F0;
  }
  .sc04-wrap, .sc04-wrap * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #111;
    font-family: 'Space Grotesk', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .sc04-wrap {
    width: 100%;
    max-width: 440px;
    background: var(--sc-cream);
    border: 2px solid var(--sc-navy);
    border-radius: 8px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    box-shadow: 6px 6px 0 var(--sc-navy);
    user-select: none;
  }
  .sc04-hdr {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .sc04-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--sc-navy);
  }
  .sc04-meter-bay {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .sc04-vu {
    flex: 1;
    height: 80px;
    background: #fff;
    border: 1.5px solid var(--sc-navy);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
    box-shadow: 2px 2px 0 var(--sc-navy);
  }
  .sc04-wrap canvas { width: 100%; height: 100%; display: block; }
  .sc04-leds {
    display: flex;
    flex-direction: column-reverse;
    gap: 3px;
    width: 14px;
    height: 80px;
  }
  .sc04-led {
    flex: 1;
    background: rgba(14, 42, 71, 0.15);
    border-radius: 1px;
    transition: background 0.05s ease;
  }
  .sc04-led.sc04-lit-grn { background: #2E7D32; }
  .sc04-led.sc04-lit-yel { background: #F9A825; }
  .sc04-led.sc04-lit-red { background: var(--sc-red); }

  .sc04-knobs {
    display: flex;
    justify-content: space-around;
    padding-top: 4px;
  }
  .sc04-knob-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .sc04-knob-dial {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--sc-navy);
    box-shadow: 2px 2px 0 var(--sc-navy);
    position: relative;
    cursor: ns-resize;
    touch-action: none;
    outline-offset: 4px;
  }
  .sc04-knob-dial:focus-visible { outline: 2px solid var(--sc-red); }
  .sc04-knob-tick {
    position: absolute;
    top: 4px;
    left: 50%;
    width: 2px;
    height: 12px;
    background: var(--sc-red);
    transform-origin: bottom center;
    transform: translateX(-50%);
  }
  .sc04-knob-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--sc-navy);
  }
  .sc04-knob-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--sc-red);
  }

.sc04-preset1{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--sc-red)}
.sc04-preset2{transform: translateX(-50%) rotate(-30deg)}
.sc04-preset3{transform: translateX(-50%) rotate(20deg)}
.sc04-preset4{transform: translateX(-50%) rotate(0deg)}
.sc04-cap{position:fixed;left:10px;bottom:8px;font:10px system-ui;opacity:.55;pointer-events:none}
@container fit-07-audio-dynamic-range-compressor (max-width:300px){
  .sc04-wrap{width:calc(100% - 16px);padding:12px;gap:9px;box-shadow:3px 3px 0 var(--sc-navy)}.sc04-title{font-size:11px}.sc04-preset1{font-size:11px}.sc04-meter-bay{gap:7px}.sc04-vu,.sc04-leds{height:54px}.sc04-leds{width:10px;gap:2px}.sc04-knobs{padding-top:0}.sc04-knob-dial{width:34px;height:34px}.sc04-knob-tick{height:9px;top:3px}.sc04-knob-label,.sc04-knob-val{font-size:11px}.sc04-cap{display:none}
}
@media(prefers-reduced-motion:reduce){.sc04-wrap, .sc04-wrap *{animation:none!important;transition:none!important}}

.sc04-wrap[data-paused] *,.sc04-wrap[data-paused]{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){.sc04-wrap,.sc04-wrap *{animation:none!important;transition:none!important}}
@container fit-07-audio-dynamic-range-compressor (max-width:210px){.sc04-wrap{padding:8px;gap:5px}.sc04-preset1{display:none}.sc04-vu,.sc04-leds{height:50px}.sc04-knob-dial{width:32px;height:32px}.sc04-knob-box{gap:2px}}
body{width:100%;container-type:inline-size;container-name:fit-07-audio-dynamic-range-compressor}

<body>
<div class="sc04-wrap" role="region" aria-label="Audio Compressor">
  <div class="sc04-hdr">
    <span class="sc04-title">VCA MASTER COMPRESSOR // GR</span>
    <span class="sc04-preset1">ANALOGUE LIMIT</span>
  </div>

  <div class="sc04-meter-bay">
    <div class="sc04-vu">
      <canvas id="sc04-vuCv" width="340" height="80"></canvas>
    </div>
    <div class="sc04-leds" id="sc04-ledLadder">
      <div class="sc04-led"></div>
      <div class="sc04-led"></div>
      <div class="sc04-led"></div>
      <div class="sc04-led"></div>
      <div class="sc04-led"></div>
      <div class="sc04-led"></div>
      <div class="sc04-led"></div>
      <div class="sc04-led"></div>
    </div>
  </div>

  <div class="sc04-knobs">
    <div class="sc04-knob-box">
      <div class="sc04-knob-dial" id="sc04-threshKnob" role="slider" tabindex="0" aria-label="Threshold, decibels" aria-orientation="vertical" aria-valuemin="-36" aria-valuemax="0" aria-valuenow="-16">
        <div class="sc04-preset2 sc04-knob-tick" id="sc04-threshTick"></div>
      </div>
      <span class="sc04-knob-label">THRESHOLD</span>
      <span class="sc04-knob-val" id="sc04-threshVal">-16 dB</span>
    </div>
    <div class="sc04-knob-box">
      <div class="sc04-knob-dial" id="sc04-ratioKnob" role="slider" tabindex="0" aria-label="Compression ratio" aria-orientation="vertical" aria-valuemin="1" aria-valuemax="20" aria-valuenow="4">
        <div class="sc04-preset3 sc04-knob-tick" id="sc04-ratioTick"></div>
      </div>
      <span class="sc04-knob-label">RATIO</span>
      <span class="sc04-knob-val" id="sc04-ratioVal">4:1</span>
    </div>
    <div class="sc04-knob-box">
      <div class="sc04-knob-dial" id="sc04-gainKnob" role="slider" tabindex="0" aria-label="Makeup gain, decibels" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="18" aria-valuenow="4">
        <div class="sc04-preset4 sc04-knob-tick" id="sc04-gainTick"></div>
      </div>
      <span class="sc04-knob-label">MAKEUP</span>
      <span class="sc04-knob-val" id="sc04-gainVal">+4.0 dB</span>
    </div>
  </div>
</div>

<div class="sc04-cap" aria-hidden="true">VCA Audio Compressor</div>
<script>
(()=>{
  const tileRoot = document.querySelector('.sc04-wrap');
  const pauseCSS = () => tileRoot.toggleAttribute('data-paused', document.hidden);
  document.addEventListener('visibilitychange', pauseCSS); pauseCSS();

  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  let demoEnabled=window.__foreverPreview?.demoEnabled!==false,raf=0;
  function scheduleFrame(fn){if(!document.hidden&&!raf)raf=requestAnimationFrame(()=>{raf=0;fn();});}
  function stopDemo(){demoEnabled=false;scheduleFrame(render);}
  addEventListener('forever:interactive',stopDemo);
  document.addEventListener('pointerdown',stopDemo,{capture:true});document.addEventListener('click',stopDemo,{capture:true});
  document.addEventListener('keydown',e=>{if(e.key!=='Tab')stopDemo();},{capture:true});
  document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);raf=0;if(!document.hidden)scheduleFrame(render);});
  motion.addEventListener('change',()=>{reduce=motion.matches;scheduleFrame(render);});

  let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = document.getElementById('sc04-vuCv');
  const ctx = cv.getContext('2d');
  const ledNodes = Array.from(document.getElementById('sc04-ledLadder').children);
  let running = !document.hidden;
  document.addEventListener('visibilitychange', () => { running = !document.hidden; });
  let threshDb = -16, ratio = 4, makeup = 4;
  const knobs = [
    { name: 'thresh', min: -36, max: 0, step: 1, sensitivity: .4, get: () => threshDb, set: v => { threshDb = v; }, text: v => `${v.toFixed(0)} dB` },
    { name: 'ratio', min: 1, max: 20, step: .5, sensitivity: .15, get: () => ratio, set: v => { ratio = v; }, text: v => `${v}:1` },
    { name: 'gain', min: 0, max: 18, step: .5, sensitivity: .15, get: () => makeup, set: v => { makeup = v; }, text: v => `+${v.toFixed(1)} dB` }
  ];
  function setKnob(knob, value) {
    const next = Math.max(knob.min, Math.min(knob.max, Math.round(value / knob.step) * knob.step));
    knob.set(next);
    knob.label.textContent = knob.text(next);
    knob.dial.setAttribute('aria-valuenow', next);
    knob.dial.setAttribute('aria-valuetext', knob.text(next));
    const deg = -120 + ((next - knob.min) / (knob.max - knob.min)) * 240;
    knob.tick.style.transform = `translateX(-50%) rotate(${deg}deg)`;
    tileRoot.dataset[knob.name] = next;
    scheduleFrame(render);
  }
  knobs.forEach(knob => {
    knob.dial = document.getElementById(`sc04-${knob.name}Knob`);
    knob.tick = document.getElementById(`sc04-${knob.name}Tick`);
    knob.label = document.getElementById(`sc04-${knob.name}Val`);
    let pointerId = null, startY = 0, startValue = 0;
    knob.dial.addEventListener('pointerdown', e => {
      if (e.button !== 0 || pointerId !== null) return;
      e.preventDefault(); knob.dial.focus();
      pointerId = e.pointerId; startY = e.clientY; startValue = knob.get();
      knob.dial.setPointerCapture(pointerId);
    });
    knob.dial.addEventListener('pointermove', e => {
      if (e.pointerId === pointerId) setKnob(knob, startValue + (startY - e.clientY) * knob.sensitivity);
    });
    const stop = e => {
      if (e.pointerId !== pointerId) return;
      if (knob.dial.hasPointerCapture(pointerId)) knob.dial.releasePointerCapture(pointerId);
      pointerId = null;
    };
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(type => knob.dial.addEventListener(type, stop));
    knob.dial.addEventListener('keydown', e => {
      const keys = { ArrowUp: knob.step, ArrowRight: knob.step, ArrowDown: -knob.step, ArrowLeft: -knob.step, PageUp: knob.step * 5, PageDown: -knob.step * 5 };
      if (!(e.key in keys) && e.key !== 'Home' && e.key !== 'End') return;
      e.preventDefault();
      setKnob(knob, e.key === 'Home' ? knob.min : e.key === 'End' ? knob.max : knob.get() + keys[e.key]);
    });
    setKnob(knob, knob.get());
  });

  let gr = 0, signalTime = 0;


  function render() {
    if (!running) return;

    // Simulate input signal drift
    if(demoEnabled&&!reduce)signalTime=performance.now()*.005;
    const time = reduce ? 0 : signalTime;
    const rawSignal = Math.max(0, Math.min(1, Math.sin(time) * .4 + Math.cos(time * 2.3) * .3 + .3));
    const rawDb = -30 + rawSignal * 28;

    // Gain reduction calculation
    const over = rawDb - threshDb;
    const targetGr = over > 0 ? (over * (1 - 1 / ratio)) : 0;
    gr = reduce ? targetGr : gr + (targetGr - gr) * .2;
    const outputDb = rawDb - gr + makeup;
    tileRoot.dataset.reduction = gr.toFixed(2);
    tileRoot.dataset.outputDb = outputDb.toFixed(2);

    // Draw VU Needle Meter
    ctx.clearRect(0, 0, cv.width, cv.height);
    const w = cv.width, h = cv.height;

    // Scale markings
    ctx.fillStyle = '#0E2A47';
    ctx.font = '700 8px "JetBrains Mono", monospace';
    ctx.textAlign = 'center';
    const marks = [0, -3, -6, -10, -15, -20];
    marks.forEach(m => {
      const u = (-m) / 20;
      const x = w - 20 - u * (w - 40);
      ctx.fillRect(x, 15, 1, 6);
      ctx.fillText(`${m}`, x, 11);
    });

    // Needle pivot at bottom center
    const pivotX = w / 2;
    const pivotY = h + 40;
    const needleAngle = -.65 + Math.min(1, gr / 20) * 1.3;

    ctx.save();
    ctx.translate(pivotX, pivotY);
    ctx.rotate(needleAngle);
    ctx.strokeStyle = '#BE4D4D';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, -(h + 20));
    ctx.stroke();
    ctx.restore();

    // LEDs
    const activeLeds = Math.max(0, Math.min(8, Math.round((outputDb + 36) / 36 * 8)));
    ledNodes.forEach((led, i) => {
      led.className = 'sc04-led';
      if (i < activeLeds) {
        if (i < 5) led.classList.add('sc04-lit-grn');
        else if (i < 7) led.classList.add('sc04-lit-yel');
        else led.classList.add('sc04-lit-red');
      }
    });

    if((demoEnabled&&!reduce)||Math.abs(targetGr-gr)>.001)scheduleFrame(render);
  }
  scheduleFrame(render);
})();
</script>
</body>
</html>
