<style>
  :root {
    --sc-navy: #0E2A47;
    --sc-red: #BE4D4D;
    --sc-cream: #F8F6F0;
  }
  .sc07-wrap, .sc07-wrap * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #111;
    font-family: 'Space Grotesk', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .sc07-wrap {
    width: 100%;
    max-width: 440px;
    background: var(--sc-cream);
    border: 2px solid var(--sc-navy);
    border-radius: 8px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 6px 6px 0 var(--sc-navy);
    user-select: none;
  }
  .sc07-hdr {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .sc07-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--sc-navy);
  }
  .sc07-stage {
    width: 100%;
    height: 160px;
    background: #000;
    border: 1.5px solid var(--sc-navy);
    border-radius: 4px;
    position: relative;
    overflow: hidden;
    cursor: ew-resize;
    box-shadow: 2px 2px 0 var(--sc-navy);
  }
  .sc07-wrap canvas { width: 100%; height: 100%; display: block; }
  .sc07-handle {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    background: #fff;
    pointer-events: none;
    box-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
  }
  .sc07-handle::after {
    content: '↔';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 20px;
    height: 20px;
    background: var(--sc-navy);
    color: #fff;
    border: 1.5px solid #fff;
    border-radius: 50%;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sc07-label-left {
    position: absolute;
    top: 10px;
    left: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.7);
    pointer-events: none;
  }
  .sc07-label-right {
    position: absolute;
    top: 10px;
    right: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: #FFB366;
    pointer-events: none;
  }
  .sc07-foot {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--sc-navy);
    font-weight: 600;
  }

.sc07-preset1{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--sc-red);font-weight:700}
.sc07-preset2{left: 50%;}
.sc07-preset3{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--sc-navy)}
.sc07-cap{position:fixed;left:10px;bottom:8px;font:10px system-ui;opacity:.55;pointer-events:none}
@media(prefers-reduced-motion:reduce){.sc07-wrap, .sc07-wrap *{animation:none!important;transition:none!important}}

.sc07-wrap[data-paused] *,.sc07-wrap[data-paused]{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){.sc07-wrap,.sc07-wrap *{animation:none!important;transition:none!important}}
@container fit-08-color-grade-lut-split-preview (max-width:300px){.sc07-wrap{width:calc(100% - 16px);padding:12px;gap:8px;box-shadow:3px 3px 0 var(--sc-navy)}.sc07-title{font-size:9px}.sc07-preset1{font-size:8px}.sc07-stage{height:88px}.sc07-label-left,.sc07-label-right{font-size:7px}.sc07-foot{font-size:8px}.sc07-foot .sc07-preset3{display:none}.sc07-cap{display:none}}
body{width:100%;container-type:inline-size;container-name:fit-08-color-grade-lut-split-preview}

{
 "file": "infinite/editor-workflows/08-color-grade-lut-split-preview.html",
 "title": "Color Grade LUT Wiper",
 "description": "Color Grade LUT Wiper control in the Sam Creates system.",
 "useWhen": "",

<body>
<div class="sc07-wrap" role="region" aria-label="Color Grade LUT Preview">
  <div class="sc07-hdr">
    <span class="sc07-title">COLOR GRADE // A/B SPLIT WIPER</span>
    <span class="sc07-preset1">33-POINT 3D LUT</span>
  </div>

  <div class="sc07-stage" id="sc07-stage">
    <canvas id="sc07-cv" width="392" height="160"></canvas>
    <div class="sc07-preset2 sc07-handle" id="sc07-handle"></div>
    <div class="sc07-label-left">FLAT LOG</div>
    <div class="sc07-label-right">AMBER PRINT</div>
  </div>

  <div class="sc07-foot">
    <span>HIGHLIGHT WARMTH: +14%</span>
    <span class="sc07-preset3">DRAG SPLIT TO COMPARE</span>
  </div>
</div>

<div class="sc07-cap" aria-hidden="true">Color Grade LUT Wiper</div>
<script>
(()=>{
  const tileRoot = document.querySelector('.sc07-wrap');
  const pauseCSS = () => tileRoot.toggleAttribute('data-paused', document.hidden);
  document.addEventListener('visibilitychange', pauseCSS); pauseCSS();

  // Local frame lifecycle: stop hidden work, repaint reduced-motion state on input.
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const frames = new Map(), drivers = new Set(); let painting = false;
  function scheduleFrame(fn) {
    drivers.add(fn);
    if (document.hidden || frames.has(fn) || (motion.matches && painting)) return;
    frames.set(fn, requestAnimationFrame(t => {
      frames.delete(fn); if (document.hidden) return;
      painting = true; try { fn(t); } finally { painting = false; }
    }));
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { frames.forEach(cancelAnimationFrame); frames.clear(); }
    else drivers.forEach(scheduleFrame);
  });
  const repaint = () => { if (motion.matches) drivers.forEach(scheduleFrame); };
  ['click','input','pointermove'].forEach(type => document.addEventListener(type, repaint));
  motion.addEventListener('change', () => { reduce = motion.matches; drivers.forEach(scheduleFrame); });

  let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const stage = document.getElementById('sc07-stage');
  const cv = document.getElementById('sc07-cv');
  const ctx = cv.getContext('2d');
  // Rasterize the sun halo once; reuse it while the scene moves.
  const sunGlows = ['#FF8A65'].map(color => {
    const sprite = document.createElement('canvas'); sprite.width = sprite.height = 96;
    const gctx = sprite.getContext('2d'), r = sprite.width / 2;
    const gradient = gctx.createRadialGradient(r, r, 1, r, r, r);
    gradient.addColorStop(0, color + '99'); gradient.addColorStop(1, color + '00');
    gctx.fillStyle = gradient; gctx.fillRect(0, 0, sprite.width, sprite.height); return sprite;
  });

  const handle = document.getElementById('sc07-handle');

  let split = 0.5;
  let dragging = false;
  let demoEnabled = window.__foreverPreview?.demoEnabled !== false;
  const takeOver = () => { demoEnabled = false; };
  window.addEventListener("forever:interactive", takeOver);
  stage.addEventListener("pointerdown", takeOver, true);

  function updatePos(clientX) {
    const r = stage.getBoundingClientRect();
    split = Math.max(0.05, Math.min(0.95, (clientX - r.left) / r.width));
    handle.style.left = `${split * 100}%`;
    scheduleFrame(render);
  }

  stage.addEventListener('pointerdown', (e) => {
    dragging = true;
    updatePos(e.clientX);
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', (e) => {
    if (dragging) updatePos(e.clientX);
  });
  stage.addEventListener('pointerup', () => { dragging = false; });
  stage.addEventListener('pointercancel', () => { dragging = false; });

  let running = true;
  document.addEventListener('visibilitychange', () => { running = !document.hidden; });

  let t = 0;
  function render() {
    if (!running) return;
    if (!reduce && demoEnabled && !dragging) { t += 0.008; split = 0.5 + Math.sin(t) * 0.28; handle.style.left = `${split * 100}%`; }

    const w = cv.width, h = cv.height;
    ctx.clearRect(0, 0, w, h);

    const splitPx = split * w;

    // Draw Left Side (Flat Log: low contrast, muted tones)
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, splitPx, h);
    ctx.clip();

    // Backdrop gradient (flat grey-ish teal)
    const gFlat = ctx.createLinearGradient(0, 0, w, h);
    gFlat.addColorStop(0, '#3A444C');
    gFlat.addColorStop(1, '#525B60');
    ctx.fillStyle = gFlat;
    ctx.fillRect(0, 0, w, h);

    // Architectural geometric silhouette
    ctx.fillStyle = '#2C3439';
    ctx.fillRect(40, 40, 100, 120);
    ctx.fillRect(160, 20, 120, 140);
    ctx.fillRect(300, 60, 80, 100);

    // Sun orb flat
    ctx.beginPath();
    ctx.arc(280, 60, 28, 0, Math.PI * 2);
    ctx.fillStyle = '#9C9F96';
    ctx.fill();
    ctx.restore();

    // Draw Right Side (Amber Print: rich contrast, deep navy shadows, amber highlights)
    ctx.save();
    ctx.beginPath();
    ctx.rect(splitPx, 0, w - splitPx, h);
    ctx.clip();

    const gKodak = ctx.createLinearGradient(0, 0, w, h);
    gKodak.addColorStop(0, '#0E2A47');
    gKodak.addColorStop(0.6, '#BE4D4D');
    gKodak.addColorStop(1, '#FFB366');
    ctx.fillStyle = gKodak;
    ctx.fillRect(0, 0, w, h);

    // Architectural silhouette with deep blacks
    ctx.fillStyle = '#061320';
    ctx.fillRect(40, 40, 100, 120);
    ctx.fillRect(160, 20, 120, 140);
    ctx.fillRect(300, 60, 80, 100);

    ctx.drawImage(sunGlows[0], 280 - 48, 60 - 48);
    // Sun orb warm glow
    ctx.beginPath();
    ctx.arc(280, 60, 28, 0, Math.PI * 2);
    ctx.fillStyle = '#FFE082';

    ctx.fill();

    ctx.restore();

    if (demoEnabled || dragging) scheduleFrame(render);
  }
  scheduleFrame(render);
})();
</script>
</body>
