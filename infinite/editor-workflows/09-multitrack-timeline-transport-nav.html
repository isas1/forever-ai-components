  .sc08-needle-head {
    position: absolute;
    top: -4px;

    width: 2px;
    background: var(--sc-red);
    left: 30%;
    z-index: 5;
    transition: left 0.1s linear;
  }
  .sc08-needle-pip {
    position: absolute;
    top: -6px;

<script>
(()=>{
  // Local frame lifecycle: stop hidden work, repaint reduced-motion state on input.
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const frames = new Map(), drivers = new Set(); let painting = false;
  function scheduleFrame(fn) {
    drivers.add(fn);
    if (document.hidden || frames.has(fn) || (motion.matches && painting)) return;
    frames.set(fn, requestAnimationFrame(t => {
      frames.delete(fn); if (document.hidden) return;
      painting = true; try { fn(t); } finally { painting = false; }
    }));
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { frames.forEach(cancelAnimationFrame); frames.clear(); }
    else drivers.forEach(scheduleFrame);
  });
  const repaint = () => { if (motion.matches) drivers.forEach(scheduleFrame); };
  ['click','input','pointermove'].forEach(type => document.addEventListener(type, repaint));
  motion.addEventListener('change', () => { reduce = motion.matches; drivers.forEach(scheduleFrame); });

  const tileRoot = document.querySelector('.sc08-root');
  const pauseCSS = () => tileRoot.toggleAttribute('data-paused', document.hidden);
  document.addEventListener('visibilitychange', pauseCSS); pauseCSS();

  let currentPct = 42;
  let userInteracted = window.__foreverPreview?.demoEnabled === false;
  const takeOver = () => { userInteracted = true; };
  window.addEventListener("forever:interactive", takeOver);
  tileRoot.addEventListener("pointerdown", takeOver, true);
  tileRoot.addEventListener("keydown", e => { if (/^(Enter| |Arrow|Escape|Home|End|Page)/.test(e.key)) takeOver(); }, true);
  let running = true;
  let reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const playhead = document.getElementById("sc08-playhead");
  const tcDisplay = document.getElementById("sc08-tc-display");
  const markerDisplay = document.getElementById("sc08-cur-marker");
  const buttons = document.querySelectorAll(".sc08-ch-btn");

  function setPos(pct, tc, name) {
    currentPct = pct;
    if (playhead) playhead.style.left = pct + "%";
    if (tcDisplay) tcDisplay.textContent = tc;
    if (markerDisplay) markerDisplay.textContent = `MARKER: ${name}`;
  }

  buttons.forEach(btn => {
    btn.addEventListener("click", () => {
      userInteracted = true;
      buttons.forEach(b => b.classList.remove("sc08-active"));
      btn.classList.add("sc08-active");
      const pct = parseFloat(btn.getAttribute("data-pct"));
      const tc = btn.getAttribute("data-tc");
      setPos(pct, tc, btn.textContent);
    });
  });

  let t = 0;
  function loop() {
    if (!running) return;
    if (!reduce && !userInteracted) {
      t += 0.05;
      const scrub = 10 + (Math.sin(t * 0.3) + 1) * 40;
      if (playhead) playhead.style.left = scrub + "%";
      const frames = Math.floor(scrub * 2.4);
      if (tcDisplay) tcDisplay.textContent = `00:01:${String(Math.floor(frames / 24)).padStart(2, '0')}:${String(frames % 24).padStart(2, '0')}`;
    }
    if (!userInteracted) scheduleFrame(loop);
  }

  document.addEventListener("visibilitychange", () => {
    running = !document.hidden;
  });

  setPos(42, "00:01:24:18", "02 CORE");
  buttons.forEach((b, i) => b.classList.toggle("sc08-active", i === 1));
  scheduleFrame(loop);
})();
</script>
