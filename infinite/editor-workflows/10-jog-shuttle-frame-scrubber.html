<script>
(()=>{
  // Local frame lifecycle: stop hidden work, repaint reduced-motion state on input.
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const frames = new Map(), drivers = new Set(); let painting = false;
  function scheduleFrame(fn) {
    drivers.add(fn);
    if (document.hidden || frames.has(fn) || (motion.matches && painting)) return;
    frames.set(fn, requestAnimationFrame(t => {
      frames.delete(fn); if (document.hidden) return;
      painting = true; try { fn(t); } finally { painting = false; }
    }));
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { frames.forEach(cancelAnimationFrame); frames.clear(); }
    else drivers.forEach(scheduleFrame);
  });
  const repaint = () => { if (motion.matches) drivers.forEach(scheduleFrame); };
  ['click','input','pointermove'].forEach(type => document.addEventListener(type, repaint));
  motion.addEventListener('change', () => { reduce = motion.matches; drivers.forEach(scheduleFrame); });

  const tileRoot = document.querySelector('.sc10-root');
  const pauseCSS = () => tileRoot.toggleAttribute('data-paused', document.hidden);
  document.addEventListener('visibilitychange', pauseCSS); pauseCSS();

  let angle = 0;
  let isDragging = false;
  let lastPointerAngle = 0, pointerId = null;
  let userInteracted = window.__foreverPreview?.demoEnabled === false;
  const takeOver = () => { userInteracted = true; };
  window.addEventListener("forever:interactive", takeOver);
  tileRoot.addEventListener("pointerdown", takeOver, true);
  tileRoot.addEventListener("keydown", e => { if (/^(Enter| |Arrow|Escape|Home|End|Page)/.test(e.key)) takeOver(); }, true);
  let running = true;
  let reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const wheel = document.getElementById("sc10-wheel");
  const speedEl = document.getElementById("sc10-speed-readout");
  const frameEl = document.getElementById("sc10-frame-display");

  function setWheelAngle(rad) {
    angle = Math.max(-20 * Math.PI, Math.min(20 * Math.PI, rad));
    if (wheel) wheel.style.transform = `rotate(${angle}rad)`;
    const frames = Math.round((angle * 12) / Math.PI);
    wheel.setAttribute("aria-valuenow", frames);
    wheel.setAttribute("aria-valuetext", `${frames} frames`);
    if (frameEl) frameEl.textContent = `${frames >= 0 ? '+' : ''}${frames} FRAMES`;
    const speed = (Math.abs(Math.sin(angle)) * 2.5 + 0.5).toFixed(1);
    if (speedEl) speedEl.textContent = `${speed}x JOG`;
  }

  function getAngleFromPointer(e) {
    if (!wheel) return 0;
    const rect = wheel.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    return Math.atan2(e.clientY - cy, e.clientX - cx);
  }

  if (wheel) {
    wheel.addEventListener("pointerdown", (e) => {
      if (e.button !== 0 || pointerId !== null) return;
      e.preventDefault(); wheel.focus();
      userInteracted = true;
      isDragging = true; pointerId = e.pointerId;
      lastPointerAngle = getAngleFromPointer(e);
      wheel.setPointerCapture(e.pointerId);
    });
    wheel.addEventListener("pointermove", (e) => {
      if (!isDragging || e.pointerId !== pointerId) return;
      const cur = getAngleFromPointer(e);
      const delta = Math.atan2(Math.sin(cur - lastPointerAngle), Math.cos(cur - lastPointerAngle));
      lastPointerAngle = cur; setWheelAngle(angle + delta);
    });
    const stop = e => {
      if (e.pointerId !== pointerId) return;
      const id = pointerId; isDragging = false; pointerId = null;
      if (wheel.hasPointerCapture(id)) wheel.releasePointerCapture(id);
    };
    ['pointerup','pointercancel','lostpointercapture'].forEach(type => wheel.addEventListener(type, stop));
    wheel.addEventListener('keydown', e => {
      const steps = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1, PageUp: 10, PageDown: -10 };
      if (!(e.key in steps) && e.key !== 'Home' && e.key !== 'End') return;
      e.preventDefault(); userInteracted = true;
      setWheelAngle(e.key === 'Home' ? -20 * Math.PI : e.key === 'End' ? 20 * Math.PI : angle + steps[e.key] * Math.PI / 12);
    });
  }

  let autoT = 0;
  function loop() {
    if (!running) return;
    if (!reduce && !userInteracted && !isDragging) {
      autoT += 0.03;
      setWheelAngle(Math.sin(autoT) * 1.8);
    }
    if (!userInteracted) scheduleFrame(loop);
  }

  document.addEventListener("visibilitychange", () => {
    running = !document.hidden;
  });

  setWheelAngle(0.6);
  scheduleFrame(loop);
})();
