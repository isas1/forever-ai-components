<script>(function(){

  var log=[],vi=0;function add(){log.push(V[vi++%V.length])}

  function cl(n){return Math.max(0,Math.min(N(),n))}

    root.setAttribute('aria-valuemin','0');root.setAttribute('aria-valuemax',N());root.setAttribute('aria-valuenow',sb);

  var ac=null;
  function snd(){}
  function step(dt){
    v+=(tgt-a)*.18*dt;v*=Math.pow(.8,dt);a+=v*dt;
    var r=Math.round(a);if(r!==lastR){if(r>=0&&r<=N()&&ac)snd(r<lastR,r);lastR=r}
    if(pulse>0){pulse*=Math.pow(.9,dt);if(pulse<.01)pulse=0}
    if(!drag&&Math.abs(v)<.002&&Math.abs(tgt-a)<.002){a=tgt;v=0}
    return !!drag||a!==tgt||v!==0||pulse>0}

    var W=cv.width;if(!W)return;var s=W/2,cs=getComputedStyle(root),ink=cs.getPropertyValue('--ink').trim(),acc=cs.getPropertyValue('--acc').trim(),n=N();
    g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,W,W);g.translate(s,s);g.lineCap='round';

        g.globalAlpha=done?1:.32;g.strokeStyle=ink;g.lineWidth=s*(done?.016:.012);

      else{g.globalAlpha=.14;g.fillStyle=ink;g.beginPath();g.arc(c*.93*s,sn*.93*s,s*.007,0,T);g.fill()}}
    g.globalAlpha=1;g.fillStyle=acc;g.beginPath();g.arc(0,-.93*s,s*.016,0,T);g.fill();
    if(n>a+.01){g.globalAlpha=.35;g.strokeStyle=acc;g.lineWidth=s*.012;g.beginPath();
      g.arc(0,0,.7*s,ang(Math.max(a,0)),ang(n));g.stroke()}
    if(pulse>0){var pt=ang(pulseI);g.globalAlpha=pulse;g.strokeStyle=acc;g.lineWidth=s*.008;
      for(var j=0;j<6;j++){var q=pt+(j-2.5)*.05,rr=(.93+(1-pulse)*.12)*s;
        g.beginPath();g.arc(Math.cos(q)*rr,Math.sin(q)*rr,s*.008,0,T);g.stroke()}}
    var h=ang(a),hc=Math.cos(h),hs=Math.sin(h);
    g.globalAlpha=1;g.strokeStyle=acc;g.lineWidth=s*.024;g.beginPath();
    g.moveTo(hc*.22*s,hs*.22*s);g.lineTo(hc*.76*s,hs*.76*s);g.stroke();
    g.fillStyle=acc;g.beginPath();g.arc(hc*.76*s,hs*.76*s,s*.03,0,T);g.fill();
    g.globalAlpha=.45;g.strokeStyle=ink;g.lineWidth=s*.006;g.beginPath();g.arc(0,0,.2*s,0,T);g.stroke();g.globalAlpha=1}

    if(log.length>MAX){log.shift();a-=1;lastR-=1}

  window.addEventListener('forever:interactive',stopDemo);
  root.addEventListener('pointerdown',stopDemo,true);root.addEventListener('keydown',stopDemo,true);
  document.addEventListener('pointerdown',stopDemo,true);
  update();draw();
})();</script>
