<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="A dark email input field shakes horizontally, borders flush red, a red X pops in and a validation message slides up.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Error Shake</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark defaults; light re-theme in [data-theme="light"]. border-idle/-err/-static feed the JS lerp via syncTheme(). */
  :root{
    --fb02-bg:#0b0d12; --fb02-field-bg:#11151d; --fb02-field-ink:#aeb6c2;
    --fb02-border-idle:#232a36; --fb02-border-err:#9a3a3c; --fb02-border-static:#7a2f33;
    --fb02-label:#5b6472; --fb02-ghost:#6b7484; --fb02-caret:#34d399; --fb02-mark:#fb6a6a;
    --fb02-focus-ring:rgba(52,211,153,.2); --fb02-inset:#000a; --fb02-cap:#fff; --fb02-cap-o:.42;
  }
  :root[data-theme="light"]{
    --fb02-bg:#f2f4f8; --fb02-field-bg:#ffffff; --fb02-field-ink:#69778c;
    --fb02-border-idle:#dfe2e8; --fb02-border-err:#9a3a3c; --fb02-border-static:#7a2f33;
    --fb02-label:#5b6472; --fb02-ghost:#666f7e; --fb02-caret:#1b7c59; --fb02-mark:#df0606;
    --fb02-focus-ring:rgba(27,124,89,.2); --fb02-inset:rgba(0,0,0,.06); --fb02-cap:#171b22; --fb02-cap-o:.5;
  }
  html,body{margin:0;height:100%;background:var(--fb02-bg);overflow:hidden}
  #fb02-stage{position:fixed;inset:0;display:grid;place-items:center;
    font:500 14px/1.3 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent}
  #fb02-card{width:min(64%,300px);outline:none}
  #fb02-label{font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;
    text-transform:uppercase;color:var(--fb02-label);margin:0 0 10px 2px}
  #fb02-field{position:relative;display:flex;align-items:center;gap:10px;
    height:clamp(40px,9vh,52px);padding:0 12px 0 16px;border-radius:12px;
    background:var(--fb02-field-bg);border:1.5px solid var(--fb02-border-idle);color:var(--fb02-field-ink);
    box-shadow:0 1px 0 var(--fb02-inset) inset;will-change:transform;
    transform:translate3d(0,0,0)}
  #fb02-ghost{flex:1;letter-spacing:.02em;color:var(--fb02-ghost);
    white-space:nowrap;overflow:hidden}
  #fb02-caret{width:2px;height:1.1em;background:var(--fb02-caret);border-radius:2px;
    margin-left:-2px;will-change:opacity}
  #fb02-mark{position:relative;flex:none;width:22px;height:22px;will-change:transform}
  #fb02-mark svg{display:block;width:100%;height:100%;overflow:visible}
  #fb02-mark line{stroke:var(--fb02-mark);stroke-width:2.4;stroke-linecap:round;
    transform-box:fill-box;transform-origin:center;will-change:transform}
  #fb02-msg{height:14px;margin:9px 0 0 2px;font:600 11px/1 ui-sans-serif,system-ui,sans-serif;
    letter-spacing:.01em;color:var(--fb02-mark);will-change:transform,opacity}
  #fb02-card:focus-visible #fb02-field{border-color:var(--fb02-caret);
    box-shadow:0 0 0 3px var(--fb02-focus-ring),0 1px 0 var(--fb02-inset) inset}
  .cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;
    color:var(--fb02-cap);opacity:var(--fb02-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important}}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/feedback-states/02-error-shake.html",
 "title": "Error Shake",
 "description": "Dark email input shakes horizontally with decaying-sine, border flushes red, X icon pops in with overshoot spring, validation message slides up.",
 "useWhen": "Form validation feedback, login/signup error states, any input needing a tactile rejection signal.",
 "avoidWhen": "High-frequency repeated errors — the 2.7s hold+reset cycle feels sluggish; reduce settle time or debounce triggers.",
 "agentPrompt": "Change shake amplitude from AMP=13 to AMP=8, set border target color to orange-red by editing the hex constants in the lerp block, and update msg.textContent to \"invalid address\". Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "shake amplitude (AMP=13)",
  "decay rate (DECAY=7.5)",
  "error message text (msg.textContent)",
  "border target color (hex constants in lerp block)",
  "auto-cycle interval (nextAuto 3200ms)",
  "X mark overshoot scale (0.18)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "IIFE wrapper",
  "prefers-reduced-motion guard (applyStatic fallback)",
  "visibilitychange pause/resume",
  "aria-live polite on #fb02-msg",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Auto-cycles in demo — remove nextAuto scheduler and call trigger() manually for production",
  "Border color interpolation uses hardcoded hex constants; changing target requires editing the lerp block"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "form",
  "error",
  "shake",
  "microinteraction",
  "validation",
  "feedback",
  "input"
 ]
}
</script>
</head>
<body>
  <div id="fb02-stage">
    <div id="fb02-card" role="button" tabindex="0"
         aria-label="Submit field. Activate to trigger an error.">
      <p id="fb02-label">email</p>
      <div id="fb02-field">
        <span id="fb02-ghost">not-an-email</span>
        <span id="fb02-caret"></span>
        <span id="fb02-mark" aria-hidden="true">
          <svg viewBox="0 0 22 22">
            <line id="fb02-l1" x1="5" y1="5" x2="17" y2="17"></line>
            <line id="fb02-l2" x1="17" y1="5" x2="5" y2="17"></line>
          </svg>
        </span>
      </div>
      <div id="fb02-msg" role="status" aria-live="polite"></div>
    </div>
  </div>
  <div class="cap">Error Shake</div>
<script>
(function(){
  "use strict";
  var reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  var field=document.getElementById("fb02-field"),
      mark=document.getElementById("fb02-mark"),
      l1=document.getElementById("fb02-l1"),
      l2=document.getElementById("fb02-l2"),
      caret=document.getElementById("fb02-caret"),
      msg=document.getElementById("fb02-msg"),
      card=document.getElementById("fb02-card");

  var root=document.documentElement, C={};   // border-lerp colours, read from tokens
  function hex(v){ v=v.trim().replace("#",""); if(v.length===3)v=v.replace(/./g,"$&$&"); var n=parseInt(v,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
  function syncTheme(){ var cs=getComputedStyle(root); C.idle=hex(cs.getPropertyValue("--fb02-border-idle")); C.err=hex(cs.getPropertyValue("--fb02-border-err")); }
  addEventListener("message",function(e){ var d=e.data; if(d && d.type==="forever:theme" && (d.theme==="light"||d.theme==="dark")){ root.setAttribute("data-theme",d.theme); syncTheme(); } });
  syncTheme();

  function applyStatic(){
    field.style.transform="translate3d(0,0,0)";
    field.style.borderColor="var(--fb02-border-static)";
    mark.style.transform="scale(1)";
    l1.style.transform="scale(1)";l2.style.transform="scale(1)";
    msg.textContent="enter a valid email";
    msg.style.opacity="1";msg.style.transform="translate3d(0,0,0)";
    caret.style.opacity="0";
  }
  if(reduce){applyStatic();return;}

  // spring + decaying-sine shake, transform only. amplitude in px.
  var AMP=13, FREQ=22, DECAY=7.5;        // shake envelope
  var t=0, running=true, active=false;   // active = shake playing
  var phase=0;                            // 0 idle, rising 0..1 cross draw
  var idleUntil=0, userControl=false;
  var nextAuto=performance.now()+1400;
  var caretT=0;

  function trigger(){
    if(active) return;
    active=true; t=0; phase=0;
    msg.textContent="enter a valid email";
  }

  function settle(){
    active=false; phase=0;
    field.style.transform="translate3d(0,0,0)";
    field.style.borderColor="var(--fb02-border-idle)";
    mark.style.transform="scale(0)";
    l1.style.transform="scale(0)";l2.style.transform="scale(0)";
    msg.textContent="";msg.style.opacity="0";
  }
  settle();

  // ease helpers
  function eo(x){return 1-Math.pow(1-x,3);}

  var last=performance.now();
  function frame(now){
    if(!running) return;
    var dt=(now-last)/1000; if(dt>0.05)dt=0.05; last=now;

    // self-demo scheduler
    if(!userControl && !active && now>nextAuto){
      trigger(); nextAuto=now+3200;
    }
    if(userControl && now>idleUntil){ userControl=false; nextAuto=now+1200; }

    // caret blink (opacity only) while idle/no error
    if(!active){
      caretT+=dt;
      caret.style.opacity = (caretT%1.0<0.5)?"0.9":"0.15";
    } else { caret.style.opacity="0"; }

    if(active){
      t+=dt;
      // shake: decaying sine, ~0.55s
      var env=Math.exp(-DECAY*t);
      var x=Math.sin(t*FREQ*Math.PI*2*0.5)*AMP*env;
      // tiny counter-rotate via skew-free: keep transform-only translate
      field.style.transform="translate3d("+x.toFixed(2)+"px,0,0)";

      // border flush to red, eased
      var bc=eo(Math.min(1,t/0.18));
      var r=Math.round(C.idle[0]+(C.err[0]-C.idle[0])*bc),
          g=Math.round(C.idle[1]+(C.err[1]-C.idle[1])*bc),
          b=Math.round(C.idle[2]+(C.err[2]-C.idle[2])*bc);
      field.style.borderColor="rgb("+r+","+g+","+b+")";

      // cross pop: overshoot spring on scale, draw the two strokes
      var cp=Math.min(1,t/0.42);
      var s=cp<1 ? (1.0 - (1-eo(cp)))*1 : 1;
      // overshoot: scale to 1.18 then back
      var os = t<0.30 ? 1 + Math.sin(eo(Math.min(1,t/0.30))*Math.PI)*0.18 : 1;
      mark.style.transform="scale("+(eo(Math.min(1,t/0.22))*os).toFixed(3)+")";
      var d1=eo(Math.min(1,t/0.26)), d2=eo(Math.min(1,Math.max(0,(t-0.07)/0.26)));
      l1.style.transform="scale("+d1.toFixed(3)+")";
      l2.style.transform="scale("+d2.toFixed(3)+")";

      // message slides up + fades in
      var mp=eo(Math.min(1,Math.max(0,(t-0.10)/0.30)));
      msg.style.opacity=mp.toFixed(3);
      msg.style.transform="translate3d(0,"+((1-mp)*4).toFixed(2)+"px,0)";

      if(t>2.7){ settle(); }   // hold, then reset for next cycle
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // real interaction: hand control to user, ease back after idle
  function userTrigger(){
    userControl=true; idleUntil=performance.now()+4000;
    if(active){ active=false; } // restart cleanly
    trigger();
  }
  card.addEventListener("pointerdown",function(){ userTrigger(); });
  card.addEventListener("keydown",function(e){
    if(e.key==="Enter"||e.key===" "){ e.preventDefault(); userTrigger(); }
  });

  document.addEventListener("visibilitychange",function(){
    if(document.hidden){ running=false; }
    else if(!running){ running=true; last=performance.now();
      nextAuto=last+1200; requestAnimationFrame(frame); }
  });
})();
</script>
</body>
</html>
