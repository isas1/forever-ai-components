<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta name="description" content="A heart springs into rose-and-verdigris enamel tones, firing 96 dots and ring shards.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Like Burst</title>
<script>/* theme hook: ?theme=light|dark, before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  :root{--fb07-bg:#0b0d12;--fb07-mint:#65b99a;--fb07-cyan:#a2c9bb;--fb07-mag:#d58c9d;--fb07-vio:#b7a187;--fb07-sun:#d8b673;--fb07-mint-rgb:101,185,154;--fb07-cyan-rgb:162,201,187;--fb07-idle:#11151c;--fb07-cap:#fff;--fb07-cap-o:.42;--fb07-hint-o:.34}
  :root[data-theme="light"]{--fb07-bg:#f2f4f8;--fb07-mint:#286249;--fb07-cyan:#396b60;--fb07-mag:#9b4c62;--fb07-vio:#7b604d;--fb07-sun:#765920;--fb07-mint-rgb:40,98,73;--fb07-cyan-rgb:57,107,96;--fb07-idle:#fff;--fb07-cap:#182029;--fb07-cap-o:.5;--fb07-hint-o:.55}
  html,body{margin:0;height:100%}
  body{background:var(--fb07-bg);overflow:hidden}
  #fb07-stage{position:fixed;inset:0;display:grid;place-items:center;outline:none}
  #fb07-stage:focus-visible{box-shadow:inset 0 0 0 2px rgba(var(--fb07-mint-rgb),.55)}
  #fb07-c{width:100%;height:100%;display:block}
  .cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;
    color:var(--fb07-cap);opacity:var(--fb07-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
  #fb07-hint{position:fixed;right:9px;bottom:7px;font:600 9px/1 ui-monospace,Menlo,monospace;
    color:var(--fb07-mint);opacity:var(--fb07-hint-o);letter-spacing:.1em;text-transform:uppercase;user-select:none}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important}}

.fb07-style1{position:fixed;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
<script type="application/json" id="forever-agent-meta">

 "file": "infinite/feedback-states/07-like-burst.html",

 "description": "Rose-and-verdigris enamel palette: a heart spring-pops with 96 dots and ring shards. First input stops the demo; later input toggles the liked state.",
 "useWhen": "Social feeds, reaction buttons, content-save interactions needing a dramatic particle burst on dark backgrounds.",
 "avoidWhen": "Production reactions without connecting the local liked state to application data; the idle cycle is a demonstration.",
 "agentPrompt": "Tune N=96 particles and DUR=1100 spring duration. Recolor the --fb07-* dark/light tokens and matching JS DARK/LIGHT fallback arrays together, including RGB glow tokens; keep the rose-and-verdigris enamel register. Preserve empty-token recovery, first-input demo stop, native input, finite manual feedback, reduced motion and visibility suspension. Theme: ?theme=light or forever:theme message.",
 "editableAreas": [

 ],

 ],

 ],
 "tier": "curated",
 "labels": [

 ],
 "tags": [

 ]

</head>
<body>
<div id="fb07-stage" role="button" tabindex="0" aria-label="Like button. Activate to send a like with a particle burst.">
  <canvas id="fb07-c" aria-hidden="true"></canvas>
<div id="fb07-hint" aria-hidden="true">tap / space</div>
<div class="fb07-style1" id="fb07-live" role="status" aria-live="polite" data-fit-clip-ok></div>
</div>
<div class="cap">Like Burst</div>



<script>
(function(){
  var demoEnabled=window.__foreverPreview?.demoEnabled!==false;
  function stopDemo(){demoEnabled=false;}
  addEventListener('forever:interactive',stopDemo);
  document.addEventListener('pointerdown',stopDemo,{capture:true});document.addEventListener('click',stopDemo,{capture:true});document.addEventListener('keydown',e=>{if(e.key!=='Tab')stopDemo();},{capture:true});

  "use strict";
  var reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
  var stage = document.getElementById("fb07-stage");
  var cv    = document.getElementById("fb07-c");
  var live  = document.getElementById("fb07-live");
  var ctx   = cv.getContext("2d");

  var root=document.documentElement, MINT,CYAN,MAG,VIO,SUN,SWATCH,MINT_RGB,CYAN_RGB,IDLE, PK=["mint","cyan","mag","vio","sun"];
  var paletteReady=false,paletteFrame=0,paletteAttempts=0;
  var DARK=["#65b99a","#a2c9bb","#d58c9d","#b7a187","#d8b673","101,185,154","162,201,187","#11151c"];
  var LIGHT=["#286249","#396b60","#9b4c62","#7b604d","#765920","40,98,73","57,107,96","#fff"];
  function tokDef(n){var m=document.querySelector('style').textContent.match(new RegExp(n+'\\s*:\\s*([^;}]+)'));return m?m[1].trim():'';}  // dark :root default, for engines that read '' from a fresh frame
  function syncTheme(){
    var cs=getComputedStyle(root), v=PK.map(function(k){return cs.getPropertyValue("--fb07-"+k).trim()||tokDef("--fb07-"+k);});
    v.push(cs.getPropertyValue("--fb07-mint-rgb").trim()||'101,185,154',cs.getPropertyValue("--fb07-cyan-rgb").trim()||'162,201,187',cs.getPropertyValue("--fb07-idle").trim()||'#11151c');
    paletteReady=v.every(Boolean);
    // Firefox can return empty computed tokens while a new iframe has no box.
    if(!paletteReady)v=root.getAttribute("data-theme")==="light"?LIGHT:DARK;
    MINT=v[0];CYAN=v[1];MAG=v[2];VIO=v[3];SUN=v[4];SWATCH=v.slice(0,5);MINT_RGB=v[5];CYAN_RGB=v[6];IDLE=v[7];
  }
  function queuePalettePaint(){
    if(!reduce||paletteReady||paletteFrame||paletteAttempts>=2||document.hidden)return;
    paletteFrame=requestAnimationFrame(function(){paletteFrame=0;if(document.hidden)return;paletteAttempts++;syncTheme();resize();drawOneFrame();queuePalettePaint();});
  }
  addEventListener("message",function(e){ var d=e.data; if(d&&d.type==="forever:theme"&&(d.theme==="light"||d.theme==="dark")){ root.setAttribute("data-theme",d.theme); syncTheme(); if(reduce){drawOneFrame();paletteAttempts=0;queuePalettePaint();} } });
  syncTheme();

  var W=0,H=0,cx=0,cy=0,R=0,DPR=1;
  function resize(){
    DPR=Math.min(2,window.devicePixelRatio||1);
    W=stage.clientWidth; H=stage.clientHeight;
    cv.width=W*DPR; cv.height=H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    cx=W/2; cy=H/2;
    R=Math.max(26,Math.min(W,H)*0.20);   // heart scale unit
    if(reduce&&typeof liked==="boolean")drawOneFrame();
  }
  resize();
  window.addEventListener("resize",resize);

  // heart path in unit coords, scaled by s, centered at (cx,cy)
  function heartPath(s){
    ctx.beginPath();
    var k=R*s/16;
    ctx.moveTo(cx, cy + 12*k);
    ctx.bezierCurveTo(cx-16*k, cy-4*k, cx-13*k, cy-18*k, cx, cy-8*k);
    ctx.bezierCurveTo(cx+13*k, cy-18*k, cx+16*k, cy-4*k, cx, cy+12*k);
    ctx.closePath();
  }

  // ---- particles (cap 96) ----
  var N=96;
  var px=new Float32Array(N), py=new Float32Array(N),
      vx=new Float32Array(N), vy=new Float32Array(N),
      pr=new Float32Array(N), pa=new Float32Array(N),  // radius, alpha
      plife=new Float32Array(N), pmax=new Float32Array(N),
      pc=new Int8Array(N), pkind=new Int8Array(N);      // color idx, kind(0 dot,1 ring shard)
  var active=0;

  function burst(){
    active=N;
    for(var i=0;i<N;i++){
      var ang = (i/N)*Math.PI*2 + Math.random()*0.4;
      var spd = R*(0.10+Math.random()*0.16);
      px[i]=cx; py[i]=cy - R*0.02;
      vx[i]=Math.cos(ang)*spd; vy[i]=Math.sin(ang)*spd - R*0.02;
      pr[i]=R*(0.04+Math.random()*0.06);
      pmax[i]=plife[i]=42+Math.random()*22;
      pa[i]=1;
      pc[i]=(Math.random()*SWATCH.length)|0;
      pkind[i]=Math.random()<0.32?1:0;
    }
  }

  // ---- state machine ----
  var DUR=1100;            // heart pop + burst lifetime
  var IDLE_AFTER=4200, AUTO_GAP=2600;
  var running=true, rafId=0;
  var playStart=-1, nextAuto=0, userMode=false, lastInput=0, liked=false;

  function spring(t){
    if(t>=1) return 1;
    return 1 + Math.pow(2,-7*t)*Math.sin((t*7-0.18)*(Math.PI*2))*0.5;
  }
  function easeOut(t){ return 1-Math.pow(1-t,3); }

  function drawHeart(scale, on, glow){
    if(!paletteReady)syncTheme();
    // static radial glow gradient (no per-frame filter/shadow repaint of layout)
    if(glow>0){
      var g=ctx.createRadialGradient(cx,cy,R*0.2,cx,cy,R*1.9);
      g.addColorStop(0,"rgba("+MINT_RGB+","+(0.16*glow).toFixed(3)+")");
      g.addColorStop(1,"rgba("+MINT_RGB+",0)");
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    }
    heartPath(scale);
    if(on){
      var lg=ctx.createLinearGradient(cx,cy-R,cx,cy+R);
      lg.addColorStop(0,MAG); lg.addColorStop(1,MINT);
      ctx.fillStyle=lg; ctx.fill();
    } else {
      ctx.fillStyle=IDLE; ctx.fill();
      ctx.lineWidth=Math.max(2,R*0.07); ctx.strokeStyle="rgba("+CYAN_RGB+",.55)"; ctx.stroke();
    }
  }

  function drawParticles(){
    for(var i=0;i<active;i++){
      if(plife[i]<=0) continue;
      var col=SWATCH[pc[i]];
      ctx.globalAlpha=pa[i];
      if(pkind[i]===0){
        ctx.beginPath(); ctx.arc(px[i],py[i],pr[i],0,Math.PI*2);
        ctx.fillStyle=col; ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(px[i],py[i],pr[i]*1.4,0,Math.PI*2);
        ctx.lineWidth=Math.max(1,pr[i]*0.5); ctx.strokeStyle=col; ctx.stroke();
      }
    }
    ctx.globalAlpha=1;
  }

  function stepParticles(){
    var any=false;
    for(var i=0;i<active;i++){
      if(plife[i]<=0) continue;
      any=true;
      px[i]+=vx[i]; py[i]+=vy[i];
      vx[i]*=0.90; vy[i]=vy[i]*0.90 + R*0.006;  // drag + gentle gravity
      plife[i]-=1;
      pa[i]=Math.max(0,plife[i]/pmax[i]);
      pr[i]*=0.985;
    }
    if(!any) active=0;
  }

  function drawOneFrame(){
    ctx.clearRect(0,0,W,H);
    drawHeart(1, liked, liked?0.6:0);
    live.textContent=liked?"Liked":"Not liked";
  }


  function frame(now){
    rafId=0;if(!running||document.hidden)return;
    if(playStart<0){
      if(demoEnabled && now>=nextAuto && !userMode) trigger(now,false);
    }

    ctx.clearRect(0,0,W,H);

    var scale=1, glow=0, on=liked;
    if(playStart>=0){
      var ms=now-playStart; var t=ms/DUR; if(t>1)t=1;
      // heart: collapse dip then spring pop on activation
      var sp=spring(Math.min(1,ms/560));
      // tiny pre-dip in first 90ms for tactile press
      if(ms<90){ scale=1-0.12*(ms/90); on=false; }
      else { scale=0.88+(sp-0.88); on=true; }
      glow=Math.max(0, 1-ms/DUR)*0.9;

      stepParticles();

      if(t>=1){ playStart=-1; nextAuto=now+AUTO_GAP; active=0; if(demoEnabled)liked=false; }
    }

    drawHeart(scale, on, glow);
    if(active>0) drawParticles();

    if(demoEnabled||playStart>=0)start();
  }

  function trigger(now, fromUser){
    playStart=now; liked=true; burst();
    if(fromUser){ userMode=true; lastInput=now; }
    live.textContent="Liked";
  }
  function userPlay(){if(playStart>=0)return;if(liked){liked=false;live.textContent="Not liked";ctx.clearRect(0,0,W,H);drawHeart(1,false,0);return;}if(reduce){liked=true;drawOneFrame();return;}start();trigger(performance.now(),true);}

  function start(){if(document.hidden||reduce)return;running=true;if(!rafId)rafId=requestAnimationFrame(frame);}
  function stop(){ running=false; cancelAnimationFrame(rafId);rafId=0;cancelAnimationFrame(paletteFrame);paletteFrame=0; }

  stage.addEventListener("pointerdown", function(){ userPlay(); });
  stage.addEventListener("keydown", function(e){
    if(e.key===" "||e.key==="Enter"){ e.preventDefault(); userPlay(); }
  });
  document.addEventListener("visibilitychange", function(){
    if(document.hidden){ stop(); }
    else { nextAuto=performance.now()+400;if(reduce){drawOneFrame();paletteAttempts=0;queuePalettePaint();}else start(); }
  });

  if(reduce){liked=true;drawOneFrame();queuePalettePaint();return;}
  // idle visuals: empty (un-liked) heart, kick first autonomous like shortly
  drawHeart(1,false,0);
  nextAuto=performance.now()+700;
  rafId=requestAnimationFrame(frame);
})();
</script>
</body>
</html>
