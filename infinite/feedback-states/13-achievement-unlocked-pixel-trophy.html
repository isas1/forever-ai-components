<script>(()=>{const p=new URLSearchParams(location.search).get("theme");if(p==="light"||p==="dark")document.documentElement.dataset.theme=p})();window.addEventListener("message",e=>{if(e.data?.type==="forever:theme"&&(e.data.theme==="light"||e.data.theme==="dark"))document.documentElement.dataset.theme=e.data.theme});</script>
<style>
  :root {
    --bit-bg: #000000;
    --bit-card: #0A0D14;

    --bit-gold: #FFCC00;

  [data-theme="light"] {
    --bit-bg: #EAE6DF;
    --bit-card: #FFFFFF;
    --bit-text: #111111;
    --bit-gold: #C49000;
    --bit-red: #B81814;

    --bit-shadow: #A8A090;

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bit-bg);
    color: var(--bit-text);

  .bg12-root {
    width: 100%;

    justify-content: center;

    box-sizing: border-box;
    position: relative;
    user-select: none;
  }
  .bg12-trophy-card {
    width: 100%;
    max-width: 340px;
    background: var(--bit-card);
    border: 3px solid var(--bit-border);
    box-shadow: 6px 6px 0 var(--bit-shadow);
    padding: 22px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    position: relative;

  .bg12-card-head {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 2px solid var(--bit-border);
    padding-bottom: 6px;
    font-size: 12px;
    font-weight: 700;
  }
  .bg12-award-title {
    color: var(--bit-gold);
    letter-spacing: 0.05em;
  }
  .bg12-xp-score {
    font-weight: 800;
    color: var(--bit-red);
  }
  .bg12-trophy-display {
    position: relative;
    width: 150px;
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bg12-trophy-canvas {
    width: 150px;
    height: 150px;
    display: block;
  }
  .bg12-trophy-sprite {
    position: absolute;
    font-size: 38px;
    animation: bg12-float 2s infinite ease-in-out;
  }
  @keyframes bg12-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .bg12-toast-banner {
    width: 100%;
    background: #FFCC00;
    color: #000000;
    padding: 8px 12px;
    border-radius: 4px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    box-shadow: 0 4px 12px rgba(255, 204, 0, 0.4);
  }
  .bg12-toast-title {
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0.05em;
  }
  .bg12-toast-sub {
    font-size: 12px;
    font-weight: 700;
  }
  .bg12-card-footer {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--bit-border);
    padding: 8px 10px;
    font-size: 12px;
  }
  .bg12-badge-rarity {
    font-weight: 800;
    color: var(--bit-gold);
  }
  .bg12-caption {
    position: absolute;
    bottom: 8px;
    right: 12px;
    font-size: 10px;
    letter-spacing: 0.05em;
    color: var(--bit-gold);
    opacity: 0.65;
    pointer-events: none;
    font-family: ui-monospace, monospace;
  }


@media(prefers-reduced-motion:reduce){.bg12-root, .bg12-root *{animation:none!important;transition:none!important}}

<div class="bg12-root" role="region" aria-label="Achievement Unlocked Pixel Trophy · 8-Bit Gaming Feedback">

<script>
(()=>{
  // Local frame lifecycle: stop hidden work, repaint reduced-motion state on input.
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const frames = new Map(), drivers = new Set(); let painting = false;
  function scheduleFrame(fn) {
    drivers.add(fn);
    if (document.hidden || frames.has(fn) || (motion.matches && painting)) return;
    frames.set(fn, requestAnimationFrame(t => {
      frames.delete(fn); if (document.hidden) return;
      painting = true; try { fn(t); } finally { painting = false; }
    }));
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { frames.forEach(cancelAnimationFrame); frames.clear(); }
    else drivers.forEach(scheduleFrame);
  });
  const repaint = () => { if (motion.matches) drivers.forEach(scheduleFrame); };
  ['click','input','pointermove'].forEach(type => document.addEventListener(type, repaint));
  motion.addEventListener('change', () => { reduce = motion.matches; drivers.forEach(scheduleFrame); });

  const tileRoot = document.querySelector('.bg12-root');
  const pauseCSS = () => tileRoot.toggleAttribute('data-paused', document.hidden);
  document.addEventListener('visibilitychange', pauseCSS); pauseCSS();

  let phase = 0;
  let running = true;
  let reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const canvas = document.getElementById("bg12-canvas");
  const ctx = canvas ? canvas.getContext("2d") : null;

  let w = 150, h = 150;
  function resize() {
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    w = canvas.clientWidth || 150;
    h = canvas.clientHeight || 150;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    if (ctx) ctx.scale(dpr, dpr);
  }
  resize();

  function render() {
    if (!running || !ctx) return;
    ctx.clearRect(0, 0, w, h);

    const cx = w / 2;
    const cy = h / 2;

    if (!reduce) phase += 0.04;

    // Starburst rays behind trophy
    const rays = 12;
    for (let i = 0; i < rays; i++) {
      const a = (i * Math.PI * 2) / rays + phase;
      const r = 50 + Math.sin(phase * 2 + i) * 6;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
      ctx.strokeStyle = i % 2 === 0 ? "rgba(255, 204, 0, 0.4)" : "rgba(255, 255, 255, 0.2)";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Sparkle particles
    for (let i = 0; i < 8; i++) {
      const pAngle = phase * 1.5 + (i * Math.PI * 2) / 8;
      const pDist = 38 + Math.sin(phase * 3 + i) * 12;
      const px = cx + Math.cos(pAngle) * pDist;
      const py = cy + Math.sin(pAngle) * pDist;

      ctx.fillStyle = "#FFCC00";
      ctx.fillRect(px - 2, py - 2, 4, 4);
    }

    scheduleFrame(render);
  }

  document.addEventListener("visibilitychange", () => {
    running = !document.hidden;
  });

  scheduleFrame(render);
})();
</script>
