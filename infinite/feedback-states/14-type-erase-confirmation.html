<style>:root{--bg:var(--paper);--paper:#0A1F35;--ink:#E7EBF0;--mute:#9BAABB;--line:#2E4664;--acc:#E07A7A;--on:#0A1F35;color-scheme:dark}
:root[data-theme="light"]{--paper:#fff;--ink:#0E2A47;--mute:#4A5D72;--line:#DCE2E9;--acc:#BE4D4D;--on:#fff;color-scheme:light}
.wda-root,.wda-root *{box-sizing:border-box}.wda-root [hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;display:grid;place-items:center;background:var(--bg);color:var(--ink);--d:"Mozilla Headline","Arial Narrow","Helvetica Neue",Arial,sans-serif;--m:ui-monospace,SFMono-Regular,Menlo,monospace}
.wda-r{width:min(92vmin,640px);aspect-ratio:1;position:relative;container-type:size}
.wda-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
:where(.wda-root) button,:where(.wda-root) input{font:inherit;color:inherit}
.wda-root :focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.wda-in{width:100%;background:transparent;border:0;border-bottom:2px solid var(--ink);border-radius:0;padding:.3em 0;font-family:var(--m);font-weight:600;caret-color:var(--acc);outline-offset:6px}
.wda-b{font:600 15px/1 var(--d);min-height:44px;padding:0 14px;border:0;border-radius:6px;cursor:pointer;background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.wda-b.wda-a{box-shadow:none;color:color-mix(in srgb,var(--on) calc(var(--f,0)*100%),var(--mute));background:color-mix(in srgb,var(--acc) calc(var(--f,0)*100%),var(--line))}
.wda-b[aria-disabled=true]{cursor:not-allowed}
.wda-row{display:flex;gap:2cqw;justify-content:center}
.wda-gone .wda-ctl{visibility:hidden}
.wda-res{position:absolute;left:50%;top:50%;translate:-50% -50%}
.wda-r{display:grid;grid-template-rows:1fr auto;padding:7cqw;gap:6cqw}
.wda-g{display:grid;grid-template-columns:repeat(6,1fr);gap:2.4cqw;align-content:center}
.wda-t{position:relative;aspect-ratio:1/1.2;display:grid;place-items:center;font:700 8cqw/1 var(--m);color:color-mix(in srgb,var(--on) calc(var(--f,0)*100%),var(--mute));border-radius:1.6cqw;isolation:isolate;box-shadow:inset 0 0 0 1.5px var(--line);will-change:transform}
.wda-t::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:var(--ink);opacity:var(--f,0)}
.wda-t.wda-bad{box-shadow:inset 0 0 0 2.5px var(--acc)}
.wda-in{font-size:max(11px,6cqw);margin-bottom:4cqw}
.wda-ctl .wda-b{min-width:22cqw}
.wda-cap{position:fixed;left:8px;bottom:7px;font:9px/1.2 system-ui,sans-serif;color:var(--ink);opacity:.45;pointer-events:none}
.wda-root input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.wda-root *{transition:none!important}}

<div id="wda-r" class="wda-r wda-root" role="group" aria-label="Confirm deleting forever-copy: type its name exactly to enable Delete">
<div id="wda-g" class="wda-g" aria-hidden="true"></div>
<div class="wda-ctl"><input id="wda-in" class="wda-in" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Type forever-copy to confirm deleting it"><div class="wda-row"><button id="wda-can" class="wda-b" type="button">Cancel</button><button id="wda-del" class="wda-b wda-a" type="button" aria-disabled="true" aria-describedby="wda-st">Delete</button></div></div>
<button id="wda-res" class="wda-b wda-res" type="button" hidden>Restore</button><p id="wda-st" class="wda-sr" aria-live="polite" data-fit-clip-ok></p>
</div>
<div class="wda-cap" aria-hidden="true">Type Tile Delete</div>
<script>(()=>{
let demoEnabled=window.__foreverPreview?.demoEnabled!==false,demoTimer=0,demoPhase=0;
const focus=el=>{if(!demoEnabled)el.focus({preventScroll:true})};

'use strict';
const NAME='forever-copy',$=s=>document.getElementById('wda-'+s),rm=()=>matchMedia('(prefers-reduced-motion: reduce)').matches,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const sp=(o,dt,k,d)=>{o.v+=(o.t-o.s)*k*dt;o.v*=Math.pow(d,dt);o.s+=o.v*dt;return Math.abs(o.t-o.s)>.002||Math.abs(o.v)>.002};
const R=$('r'),inp=$('in'),del=$('del'),can=$('can'),res=$('res'),st=$('st');
let raf=0,last=0,gone=false,ok=false;
function kick(){if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(tick)}}
function tick(n){raf=0;const dt=Math.min(n-last,50)/16.667;last=n;if(step(dt))raf=requestAnimationFrame(tick)}
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick()});
function sync(){ok=!gone&&inp.value===NAME;del.setAttribute('aria-disabled',ok?'false':'true');st.textContent=ok?'Name matches. Delete is enabled.':'Delete is disabled until the name matches.';onSync();kick()}
function cancel(){if(gone)return;inp.value='';sync();focus(inp)}
function doDel(){if(!ok)return;gone=true;ok=false;R.classList.add('wda-gone');res.hidden=false;st.textContent='Deleted.';onSync();onGone();kick();focus(res)}
function restore(){gone=false;R.classList.remove('wda-gone');res.hidden=true;inp.value='';sync();focus(inp)}
inp.addEventListener('input',sync);inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doDel()}});
can.addEventListener('click',cancel);del.addEventListener('click',doDel);res.addEventListener('click',restore);
addEventListener('keydown',e=>{if(e.key==='Escape'&&!gone){cancel()}});
function setTheme(t){if(t==='light'||t==='dark'){document.documentElement.dataset.theme=t;if(typeof recolor==='function')recolor();kick()}}
addEventListener('message',e=>{const d=e.data;if(d&&d.type==='forever:theme')setTheme(d.theme)});
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',()=>{sync()});
const g=$('g');
const T=[...NAME].map((c,i)=>{const e=document.createElement('span');e.className='wda-t';e.textContent=c;g.appendChild(e);return{e,p:{s:0,v:0,t:0},x:{s:0,v:0,t:0},d:0,bad:false}});
const A={s:0,v:0,t:0};
function onSync(){const v=inp.value;T.forEach((o,i)=>{const m=!gone&&v[i]===NAME[i],b=!gone&&i<v.length&&!m;o.p.t=m?1:0;if(b&&!o.bad&&!rm())o.x.v=(i%2?1:-1)*1.6;o.bad=b;o.e.classList.toggle('wda-bad',b)});A.t=ok?1:0}
function onGone(){T.forEach((o,i)=>{o.p.t=-1;o.d=i*2.5});A.t=0}
function paint(){T.forEach(o=>{const s=o.p.s,f=cl(s,0,1),y=s<0?-s*16:(1-s)*-7;o.e.style.cssText='--f:'+f+';opacity:'+cl(1+s,0,1)+';transform:translate('+o.x.s+'cqw,'+y+'cqw) scale('+(.8+.2*Math.max(s,0))+')'});
del.style.setProperty('--f',cl(A.s,0,1));del.style.transform='scale('+(.94+.06*A.s)+')'}
function step(dt){let b=false;const q=rm();
T.forEach(o=>{if(o.d>0&&!q){o.d-=dt;b=true;return}
if(q){o.p.s=o.p.t;o.p.v=0;o.x.s=o.x.v=0}else{if(sp(o.p,dt,.2,.8))b=true;if(sp(o.x,dt,.34,.72))b=true}});
if(q){A.s=A.t;A.v=0}else if(sp(A,dt,.16,.78))b=true;
paint();return b}
sync();

function demoStep(){if(!demoEnabled||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 demoPhase++;if(demoPhase<=NAME.length){inp.value=NAME.slice(0,demoPhase);sync()}
 else if(demoPhase===NAME.length+2){doDel()}
 else if(demoPhase>=NAME.length+5){restore();demoPhase=0}}
function demoStart(){if(demoEnabled&&!document.hidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches&&!demoTimer)demoTimer=setInterval(demoStep,450)}
function takeover(){if(!demoEnabled)return;demoEnabled=false;clearInterval(demoTimer);demoTimer=0;}
window.addEventListener('forever:interactive',takeover);
['pointerdown','keydown','input'].forEach(t=>document.addEventListener(t,takeover,true));
document.addEventListener('visibilitychange',()=>{clearInterval(demoTimer);demoTimer=0;if(!document.hidden)demoStart()});
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',()=>{clearInterval(demoTimer);demoTimer=0;demoStart()});
demoStep();demoStart();
})();</script></body></html>
