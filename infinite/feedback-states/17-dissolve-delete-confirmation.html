<script>(()=>{
let demoEnabled=window.__foreverPreview?.demoEnabled!==false,demoTimer=0,demoPhase=0;
const focus=el=>{if(!demoEnabled)el.focus({preventScroll:true})};

'use strict';
const NAME='forever-copy',$=s=>document.getElementById('wdd-'+s),rm=()=>matchMedia('(prefers-reduced-motion: reduce)').matches,cl=(v,a,b)=>Math.max(a,Math.min(b,v));

function tick(n){raf=0;const dt=Math.min(n-last,50)/16.667;last=n;if(step(dt))raf=requestAnimationFrame(tick)}

function cancel(){if(gone)return;inp.value='';sync();focus(inp)}
function doDel(){if(!ok)return;gone=true;ok=false;R.classList.add('wdd-gone');res.hidden=false;st.textContent='Deleted.';onSync();onGone();kick();focus(res)}
function restore(){gt=0;gone=false;R.classList.remove('wdd-gone');res.hidden=true;inp.value='';sync();focus(inp)}
inp.addEventListener('input',sync);inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doDel()}});
can.addEventListener('click',cancel);del.addEventListener('click',doDel);res.addEventListener('click',restore);
addEventListener('keydown',e=>{if(e.key==='Escape'&&!gone){cancel()}});
function setTheme(t){if(t==='light'||t==='dark'){document.documentElement.dataset.theme=t;if(typeof recolor==='function')recolor();kick()}}

const nm=$('nm'),D={x:0,y:0,vx:0,vy:0},A={s:0,v:0,t:0};let px=0,py=0,act=false,Gs=0,gt=0;
function onSync(){A.t=ok?1:0;del.tabIndex=gone?-1:0}
function onGone(){gt=1}

function mv(ev){px=ev.clientX;py=ev.clientY;act=true;kick()}
R.addEventListener('pointermove',mv);R.addEventListener('pointerdown',mv);R.addEventListener('pointerleave',()=>{act=false;kick()});
function step(dt){const q=rm();let b=false;
if(q){A.s=A.t;A.v=0;Gs=gt;D.x=D.y=D.vx=D.vy=0}else{
if(sp(A,dt,.14,.8))b=true;Gs+=(gt-Gs)*(1-Math.pow(.88,dt));if(Math.abs(gt-Gs)>.004)b=true;else Gs=gt;
const r=del.getBoundingClientRect(),rad=r.width/2,cxx=r.left+rad-D.x,cyy=r.top+r.height/2-D.y;
if(act&&!gone){const dx=px-cxx,dy=py-cyy,d=Math.hypot(dx,dy)||1,z=rad*1.9;
if(d<z){const f=(1-d/z)*dt*rad*.014*(ok?.6:1.5)*(ok?1:-1);D.vx+=dx/d*f;D.vy+=dy/d*f}b=true}
const k=ok?.02:.035;D.vx+=-D.x*k*dt;D.vy+=-D.y*k*dt;D.vx*=Math.pow(.88,dt);D.vy*=Math.pow(.88,dt);D.x+=D.vx*dt;D.y+=D.vy*dt;
const lim=rad*.45,L=Math.hypot(D.x,D.y);if(L>lim){D.x*=lim/L;D.y*=lim/L}

del.style.transform='translate('+D.x+'px,'+D.y+'px) scale('+((.94+.06*A.s)+Gs*.7)+')';del.style.opacity=1-Gs;nm.style.opacity=1-Gs*.7;
return b}
