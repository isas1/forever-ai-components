<style>
:root{--bg:var(--p);--p:#15130F;--i:#E9E2D0;--a:#D2705D}
:root[data-theme="light"]{--p:#EFE8D8;--i:#1E1B16;--a:#7A2E22}
.wde-root,.wde-root *{box-sizing:border-box;margin:0}

html,body{margin:0;height:100%;background:var(--bg);color:var(--i);display:grid;place-items:center;font:clamp(11px,2.7vmin,17px)/1.2 Georgia,serif;overflow:hidden}
#wde-r{--s:min(100vmin,640px);position:relative;width:var(--s);height:var(--s)}
#wde-c{position:absolute;inset:0;width:100%;height:100%}
#wde-u{position:absolute;left:9%;right:9%;bottom:4%;display:grid;gap:.7em;justify-items:center}
#wde-nm{font-size:1.35em;font-style:italic;letter-spacing:.04em}
#wde-in{width:100%;background:none;border:0;border-bottom:1.5px solid var(--i);color:inherit;font:inherit;text-align:center;padding:.3em 0;border-radius:0}
.wde-b{display:flex;gap:1.2em}
.wde-b button{font:inherit;color:inherit;background:none;border:1.5px solid var(--i);padding:.4em 1.1em;cursor:pointer;min-height:2.4em;transition:border-color .2s,color .2s,opacity .2s}
.wde-b button:disabled{border-style:dashed;opacity:.4;cursor:default}
#wde-d:not(:disabled){border-color:var(--a);color:var(--a);border-width:2px}
.wde-root :focus-visible{outline:2px solid var(--a);outline-offset:3px}
.wde-root input:focus-visible{outline-offset:1px}
.wde-root [hidden]{display:none!important}

.wde-cap{position:fixed;left:8px;bottom:7px;font:9px/1.2 system-ui,sans-serif;color:var(--i);opacity:.45;pointer-events:none}
.wde-root input:focus-visible{outline:2px solid var(--a);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.wde-root *{transition:none!important}}
</style><script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/feedback-states/18-mosaic-delete-confirmation.html",
 "title": "Polygon Weave Delete",
 "description": "Stone-and-parchment terracotta register: matching letters trace a polygon weave that contracts after deletion.",
 "useWhen": "A reversible confirmation pattern with animated removal feedback.",
 "avoidWhen": "Actual destructive actions without connecting validated server-side permission and recovery rules.",
 "agentPrompt": "Adapt content through existing data arrays; retain named palette, controls and demo-v1 lifecycle.",

</head><body>
<main id="wde-r" role="group" aria-label="Confirm deleting old-memes. Type its name exactly to arm Delete." class="wde-root">
<canvas id="wde-c" aria-hidden="true"></canvas>
<div id="wde-u"><b id="wde-nm" aria-hidden="true">old-memes</b>
<input id="wde-in" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type old-memes to confirm deletion">
<div class="wde-b"><button id="wde-x" type="button">Cancel</button><button id="wde-d" type="button" disabled>Delete</button></div></div>
</main>
<div class="wde-cap" aria-hidden="true">Polygon Weave Delete</div>
<script>
(()=>{
let demoEnabled=window.__foreverPreview?.demoEnabled!==false,demoTimer=0,demoPhase=0;
const focus=el=>{if(!demoEnabled)el.focus({preventScroll:true})};

const NAME='old-memes',N=NAME.length,$=i=>document.getElementById('wde-'+i),
R=$('r'),cv=$('c'),cx=cv.getContext('2d'),inp=$('in'),bd=$('d'),bx=$('x'),
rm=()=>matchMedia('(prefers-reduced-motion: reduce)').matches,
sp=(x=0)=>({x,v:0,t:x}),mk=()=>Array.from({length:N},()=>sp()),
E=mk(),P=mk(),S=sp(),SC=sp(1),RO=sp(),all=[...E,...P,S,SC,RO];
let C={},W=1,D=1,raf=0,last=0,ok=false,bad=false,dead=false,pm=0;
const col=()=>{const s=getComputedStyle(document.documentElement);C.i=s.getPropertyValue('--i').trim();C.a=s.getPropertyValue('--a').trim()};
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
function step(dt){let b=false;const snap=rm();
 for(const o of all){if(snap){o.x=o.t;o.v=0;continue}
  o.v+=(o.t-o.x)*.12*dt;o.v*=Math.pow(.8,dt);o.x+=o.v*dt;
  if(Math.abs(o.v)>.0008||Math.abs(o.t-o.x)>.0008)b=true}
 return b}
function draw(){
 cx.setTransform(D,0,0,D,0,0);cx.clearRect(0,0,W,W);
 const r=W*.34*Math.max(SC.x,0),a0=-Math.PI/2+RO.x*Math.PI/N,V=[];
 cx.translate(W/2,W*.4);cx.lineJoin='round';
 for(let i=0;i<N;i++){const a=a0+i*2*Math.PI/N,q=r*(1+P[i].x);V.push([Math.cos(a)*q,Math.sin(a)*q])}
 cx.lineWidth=1.5;cx.strokeStyle=C.i;cx.globalAlpha=.2;cx.beginPath();
 V.forEach((p,i)=>cx[i?'lineTo':'moveTo'](p[0],p[1]));cx.closePath();cx.stroke();
 cx.globalAlpha=1;cx.lineWidth=2;cx.strokeStyle=bad?C.a:C.i;cx.beginPath();
 for(let i=0;i<N;i++){const e=cl(E[i].x),a=V[i],b=V[(i+1)%N];
  if(e>.002){cx.moveTo(a[0],a[1]);cx.lineTo(a[0]+(b[0]-a[0])*e,a[1]+(b[1]-a[1])*e)}}
 cx.stroke();
 if(S.x>.01){const q=r*Math.max(S.x,0),b=a0+Math.PI/N,U=[];
  for(let i=0;i<N;i++){const a=b+i*2*Math.PI/N;U.push([Math.cos(a)*q*.82,Math.sin(a)*q*.82])}
  cx.strokeStyle=C.a;cx.lineWidth=1.6;cx.beginPath();
  for(let i=0;i<N;i++){const a=U[i],c=U[(i+2)%N];cx.moveTo(a[0],a[1]);cx.lineTo(c[0],c[1])}
  cx.stroke()}
}
function tick(now){raf=0;const dt=Math.min(now-last,50)/16.667;last=now;const b=step(dt);draw();if(b)raf=requestAnimationFrame(tick)}
const wake=()=>{if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(tick)}};
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0}else wake()});
let prev=0;
function sync(){const v=inp.value;let m=0;while(m<v.length&&m<N&&v[m]===NAME[m])m++;
 const was=bad;bad=v.length>m;ok=v===NAME;
 E.forEach((o,i)=>o.t=i<m?1:0);
 for(let i=prev;i<m;i++)P[i].v+=.05;prev=m;
 if(bad&&!was)RO.v+=(Math.random()<.5?-1:1)*.06;
 S.t=ok?1:0;RO.t=ok?1:0;bd.disabled=!ok||dead;wake()}
function del(){if(!ok||dead)return;dead=true;SC.t=0;RO.t=3;S.t=1.4;bd.hidden=true;inp.disabled=true;bx.textContent='Undo';focus(bx);wake()}
function cancel(){if(dead){dead=false;SC.t=1;inp.disabled=false;bd.hidden=false;bx.textContent='Cancel'}
 inp.value='';prev=0;sync();focus(inp)}
inp.addEventListener('input',sync);
inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();del()}});
bd.addEventListener('click',del);bx.addEventListener('click',cancel);
document.addEventListener('keydown',e=>{if(e.key==='Escape')cancel()});
new ResizeObserver(()=>{W=R.clientWidth;D=Math.min(devicePixelRatio||1,2);cv.width=cv.height=Math.round(W*D);draw()}).observe(R);
const setTheme=t=>{if(t==='light'||t==='dark'){document.documentElement.dataset.theme=t;col();draw()}};
addEventListener('message',e=>{const d=e.data;if(d&&d.type==='forever:theme')setTheme(d.theme)});
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',wake);
col();sync();draw();

function demoStep(){if(!demoEnabled||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 demoPhase++;if(demoPhase<=NAME.length){inp.value=NAME.slice(0,demoPhase);sync()}
 else if(demoPhase===NAME.length+2){del()}
 else if(demoPhase>=NAME.length+5){cancel();demoPhase=0}}
function demoStart(){if(demoEnabled&&!document.hidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches&&!demoTimer)demoTimer=setInterval(demoStep,450)}
function takeover(){if(!demoEnabled)return;demoEnabled=false;clearInterval(demoTimer);demoTimer=0;}
window.addEventListener('forever:interactive',takeover);
['pointerdown','keydown','input'].forEach(t=>document.addEventListener(t,takeover,true));
document.addEventListener('visibilitychange',()=>{clearInterval(demoTimer);demoTimer=0;if(!document.hidden)demoStart()});
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',()=>{clearInterval(demoTimer);demoTimer=0;demoStart()});
demoStep();demoStart();
})();
</script></body></html>
