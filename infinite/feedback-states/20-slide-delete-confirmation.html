<style>
:root{--bg:var(--p);--p:#15130F;--i:#E9E2D0;--a:#D2705D}
:root[data-theme="light"]{--p:#EFE8D8;--i:#1E1B16;--a:#7A2E22}
.wdg-root,.wdg-root *{box-sizing:border-box;margin:0}

html,body{margin:0;height:100%;background:var(--bg);color:var(--i);display:grid;place-items:center;font:clamp(11px,2.7vmin,17px)/1.2 Georgia,serif;overflow:hidden}
#wdg-r{--s:min(100vmin,640px);position:relative;width:var(--s);height:var(--s)}
#wdg-c{position:absolute;inset:0;width:100%;height:100%}
#wdg-u{position:absolute;left:10%;right:10%;bottom:5%;display:grid;gap:.8em;justify-items:center}
#wdg-in{width:100%;background:none;border:0;border-bottom:1.5px solid var(--i);color:inherit;font:inherit;text-align:center;padding:.3em 0;border-radius:0}
#wdg-t{position:relative;width:100%;height:2.8em;border:1.5px solid var(--i);border-radius:2em}
#wdg-d{position:absolute;left:0;top:-1.5px;bottom:-1.5px;width:42%;font:inherit;color:inherit;background:var(--bg);border:1.5px dashed var(--i);border-radius:2em;opacity:.45;touch-action:none;cursor:default;will-change:transform}
#wdg-d:not(:disabled){opacity:1;border:2px solid var(--a);color:var(--a);cursor:grab}
#wdg-d.wdg-g{cursor:grabbing}
#wdg-x{font:inherit;color:inherit;background:none;border:0;border-bottom:1.5px solid var(--i);padding:.3em .2em;cursor:pointer;min-height:2.2em}
.wdg-root :focus-visible{outline:2px solid var(--a);outline-offset:3px}
.wdg-root [hidden]{display:none!important}

.wdg-cap{position:fixed;left:8px;bottom:7px;font:9px/1.2 system-ui,sans-serif;color:var(--i);opacity:.45;pointer-events:none}
.wdg-root input:focus-visible{outline:2px solid var(--a);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.wdg-root *{transition:none!important}}
</style><script type="application/json" id="forever-agent-meta">
{

 "useWhen": "A reversible confirmation pattern with animated removal feedback.",

</head><body>
<main id="wdg-r" role="group" aria-label="Confirm deleting final2.psd. Type its name exactly, then slide or press Delete." class="wdg-root">
<canvas id="wdg-c" aria-hidden="true"></canvas>
<div id="wdg-u">
<input id="wdg-in" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type final2.psd to confirm deletion">
<div id="wdg-t"><button id="wdg-d" type="button" disabled>Delete</button></div>
<button id="wdg-x" type="button">Cancel</button></div>
</main>
<div class="wdg-cap" aria-hidden="true">Triangle Slide Delete</div>
<script>
(()=>{
let demoEnabled=window.__foreverPreview?.demoEnabled!==false,demoTimer=0,demoPhase=0;
const focus=el=>{if(!demoEnabled)el.focus({preventScroll:true})};

const NAME='final2.psd',N=NAME.length,$=i=>document.getElementById('wdg-'+i),
R=$('r'),cv=$('c'),cx=cv.getContext('2d'),inp=$('in'),bd=$('d'),bx=$('x'),tr=$('t'),
rm=()=>matchMedia('(prefers-reduced-motion: reduce)').matches,
sp=(x=0)=>({x,v:0,t:x}),cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),
T=Array.from({length:N},()=>({f:sp(),j:sp(),x:0,vx:0,go:0})),H=sp();
let C={},W=1,D=1,raf=0,last=0,ok=false,m=0,dead=false,drag=false,max=1,sx=0,x0=0,moved=0,lx=0,lt=0,lv=0;
const col=()=>{const s=getComputedStyle(document.documentElement);C.i=s.getPropertyValue('--i').trim();C.a=s.getPropertyValue('--a').trim()};
function spr(o,dt,k,f){o.v+=(o.t-o.x)*k*dt;o.v*=Math.pow(f,dt);o.x+=o.v*dt;return Math.abs(o.v)>.0008||Math.abs(o.t-o.x)>.0008}
function step(dt){let b=false;const snap=rm();
 T.forEach(t=>{for(const o of[t.f,t.j]){if(snap){o.x=o.t;o.v=0}else if(spr(o,dt,.1,.76))b=true}
  if(t.go){t.go-=dt;if(t.go<=0){t.go=0;t.vx=snap?0:W*.03*(1+t.i*.12);if(snap)t.x=W}b=true}
  if(Math.abs(t.vx)>.05){t.x+=t.vx*dt;t.vx*=Math.pow(.94,dt);b=true}})
 if(!drag){if(snap){H.x=H.t;H.v=0}else{H.v+=(H.t-H.x)*.07*dt;H.v*=Math.pow(.84,dt);H.x+=H.v*dt;if(Math.abs(H.v)>.05||Math.abs(H.t-H.x)>.3)b=true}
  if(!dead&&H.t>0&&H.x>=max*.97){H.v=0;del()}}
 bd.style.transform='translateX('+H.x+'px)';
 return b}
function draw(){
 cx.setTransform(D,0,0,D,0,0);cx.clearRect(0,0,W,W);cx.lineJoin='round';
 const w=W*1.6/(N+1),h2=w/2,ht=w*.866,x0=(W-(N+1)*h2)/2,yt=W*.2,yb=yt+ht;
 cx.font=Math.max(9,w*.36)+'px Georgia,serif';cx.textAlign='center';cx.textBaseline='middle';
 T.forEach((t,i)=>{t.i=i;
  const up=i%2===0,a=x0+i*h2+t.x,al=cl(1-t.x/(W*.4)),y=up?yb:yt,y2=up?yt:yb,cxm=a+h2,cy=(y+y+y2)/3-0*1,cyy=up?yb-ht/3:yt+ht/3;
  if(al<=.01)return;
  const dy=t.j.x*w*.06,hit=i===m&&!dead&&inp.value.length>m;
  cx.save();cx.globalAlpha=al;cx.translate(0,dy);
  cx.lineWidth=1.5;cx.strokeStyle=hit?C.a:C.i;
  if(i!==m||ok)cx.globalAlpha=al*(i<m?1:.55);
  cx.setLineDash(i===m&&!ok&&!dead?[4,3]:[]);
  cx.beginPath();cx.moveTo(a,y);cx.lineTo(a+w,y);cx.lineTo(cxm,y2);cx.closePath();cx.stroke();cx.setLineDash([]);
  const f=t.f.x;
  if(f>.01){cx.strokeStyle=C.a;cx.lineWidth=1.3;
   for(const s of[.82]){const k=Math.max(f*s,0);cx.beginPath();
    for(const [px,py] of[[a,y],[a+w,y],[cxm,y2]]){const X=cxm+(px-cxm)*k,Y=cyy+(py-cyy)*k;cx.lineTo(X,Y)}
    cx.closePath();cx.stroke()}}
  cx.fillStyle=i<m?C.a:C.i;cx.globalAlpha=al*(i<m?1:.7);
  cx.fillText(NAME[i],cxm,cyy+(up?w*.06:-w*.06));
  cx.restore()})
}
function tick(now){raf=0;const dt=Math.min(now-last,50)/16.667;last=now;const b=step(dt);draw();if(b||drag)raf=requestAnimationFrame(tick)}
const wake=()=>{if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(tick)}};
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0}else wake()});
function sync(){const v=inp.value;let n=0;while(n<v.length&&n<N&&v[n]===NAME[n])n++;
 const was=m;m=n;ok=v===NAME;
 T.forEach((t,i)=>t.f.t=i<m?1:0);
 if(v.length>m&&m<N)T[m].j.v+=.9;
 for(let i=was;i<m;i++)T[i].j.v+=.6;
 bd.disabled=!ok||dead;if(!ok&&!dead){H.t=0}wake()}
function del(){if(dead||!ok)return;dead=true;bd.disabled=true;inp.disabled=true;T.forEach((t,i)=>{if(rm()){t.x=W;t.vx=t.go=0}else t.go=(i+1)*1.6});tr.hidden=true;bx.textContent='Undo';focus(bx);wake()}
function cancel(){if(dead){dead=false;T.forEach(t=>{t.x=0;t.vx=0;t.go=0});tr.hidden=false;H.x=H.t=H.v=0;inp.disabled=false;bx.textContent='Cancel'}
 inp.value='';sync();focus(inp)}
bd.addEventListener('pointerdown',e=>{if(bd.disabled)return;drag=true;moved=0;sx=e.clientX;x0=H.x;lx=e.clientX;lt=performance.now();lv=0;bd.setPointerCapture(e.pointerId);bd.classList.add('wdg-g');wake()});
bd.addEventListener('pointermove',e=>{if(!drag)return;const n=performance.now();lv=(e.clientX-lx)/Math.max(n-lt,1)*16.667;lx=e.clientX;lt=n;
 moved=Math.max(moved,Math.abs(e.clientX-sx));H.x=cl(x0+e.clientX-sx,0,max);H.v=0;H.t=H.x;wake()});
const up=()=>{if(!drag)return;drag=false;bd.classList.remove('wdg-g');
 H.v=lv;H.t=(H.x+lv*8>max*.6)?max:0;wake()};
bd.addEventListener('pointerup',up);bd.addEventListener('pointercancel',()=>{drag=false;lv=0;H.t=H.v=0;bd.classList.remove('wdg-g');wake()});
bd.addEventListener('click',()=>{const m=moved;moved=0;if(m>4)return;H.t=max;wake()});
inp.addEventListener('input',sync);
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&ok){e.preventDefault();H.t=max;wake()}});
bx.addEventListener('click',cancel);
document.addEventListener('keydown',e=>{if(e.key==='Escape')cancel()});
new ResizeObserver(()=>{W=R.clientWidth;D=Math.min(devicePixelRatio||1,2);cv.width=cv.height=Math.round(W*D);
 max=Math.max(tr.clientWidth-bd.offsetWidth,1);draw()}).observe(R);
const setTheme=t=>{if(t==='light'||t==='dark'){document.documentElement.dataset.theme=t;col();draw()}};
addEventListener('message',e=>{const d=e.data;if(d&&d.type==='forever:theme')setTheme(d.theme)});
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',wake);
col();sync();draw();

function demoStep(){if(!demoEnabled||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 demoPhase++;if(demoPhase<=NAME.length){inp.value=NAME.slice(0,demoPhase);sync()}
 else if(demoPhase===NAME.length+2){del()}
 else if(demoPhase>=NAME.length+5){cancel();demoPhase=0}}
function demoStart(){if(demoEnabled&&!document.hidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches&&!demoTimer)demoTimer=setInterval(demoStep,450)}
function takeover(){if(!demoEnabled)return;demoEnabled=false;clearInterval(demoTimer);demoTimer=0;}
window.addEventListener('forever:interactive',takeover);
['pointerdown','keydown','input'].forEach(t=>document.addEventListener(t,takeover,true));
document.addEventListener('visibilitychange',()=>{clearInterval(demoTimer);demoTimer=0;if(!document.hidden)demoStart()});
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',()=>{clearInterval(demoTimer);demoTimer=0;demoStart()});
demoStep();demoStart();
})();
</script></body></html>
