<style>

.wdh-root,.wdh-root *{box-sizing:border-box;margin:0}

html,body{margin:0;height:100%;background:var(--bg);color:var(--i);display:grid;place-items:center;font:clamp(11px,2.7vmin,17px)/1.2 Georgia,serif;overflow:hidden}

.wdh-root input:focus-visible{outline:2px solid var(--a);outline-offset:2px}

<main id="wdh-r" role="group" aria-label="Confirm deleting quadra. Type its name exactly, then press and hold Delete." class="wdh-root">
<canvas id="wdh-c" aria-hidden="true"></canvas>
<div id="wdh-u"><b id="wdh-nm" aria-hidden="true">quadra</b>
<input id="wdh-in" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type quadra to confirm deletion">
<div class="wdh-b"><button id="wdh-x" type="button">Cancel</button><button id="wdh-d" type="button" disabled>Delete</button></div></div>
</main>
<div class="wdh-cap" aria-hidden="true">Nested Square Hold Delete</div>
<script>
(()=>{
let demoEnabled=window.__foreverPreview?.demoEnabled!==false,demoTimer=0,demoPhase=0;
const focus=el=>{if(!demoEnabled)el.focus({preventScroll:true})};

const NAME='quadra',N=NAME.length,$=i=>document.getElementById('wdh-'+i),
R=$('r'),cv=$('c'),cx=cv.getContext('2d'),inp=$('in'),bd=$('d'),bx=$('x'),
rm=()=>matchMedia('(prefers-reduced-motion: reduce)').matches,
sp=(x=0)=>({x,v:0,t:x}),cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),
L=Array.from({length:N},()=>sp()),PM=sp(),SC=sp(1),K=sp();
let C={},W=1,D=1,raf=0,last=0,ok=false,bad=false,dead=false,held=false,p=0,th=0,om=0,m=0,dragging=false,px=0;
const col=()=>{const s=getComputedStyle(document.documentElement);C.i=s.getPropertyValue('--i').trim();C.a=s.getPropertyValue('--a').trim()};
function spr(o,dt,k,f){o.v+=(o.t-o.x)*k*dt;o.v*=Math.pow(f,dt);o.x+=o.v*dt;return Math.abs(o.v)>.0008||Math.abs(o.t-o.x)>.0008}
function step(dt){let b=false;const snap=rm();
 if(held&&!dead){p=Math.min(1,p+dt/(snap?18:42));if(p>=1)del()}else if(p>0&&!dead){p=Math.max(0,p-dt/10)}
 PM.t=p;bd.style.setProperty('--pp',p.toFixed(3));
 if(snap){th+=om*0;om=0}else{th+=om*dt;om*=Math.pow(.95,dt);if(Math.abs(om)>.0004)b=true}
 for(const o of[...L,PM,SC,K]){if(snap){o.x=o.t;o.v=0}else if(spr(o,dt,.1,.78))b=true}
 if(held||(p>0&&!dead))b=true;
 return b}
function draw(){
 cx.setTransform(D,0,0,D,0,0);cx.clearRect(0,0,W,W);cx.lineJoin='round';
 cx.translate(W/2,W*.38);
 const R0=W*.33*Math.max(SC.x,0)*(1-.12*PM.x),kk=.17+.33*cl(PM.x,0,1.15),a0=th+K.x+Math.PI/4+PM.x*.5;
 let V=[0,1,2,3].map(k=>[Math.cos(a0+k*Math.PI/2)*R0,Math.sin(a0+k*Math.PI/2)*R0]);
 for(let j=0;j<=N;j++){
  const s=j?L[j-1].x:1;
  if(s>.01){cx.beginPath();V.forEach((q,k)=>cx[k?'lineTo':'moveTo'](q[0]*s,q[1]*s));cx.closePath();
   const cur=j===m&&j>0;cx.strokeStyle=(j===0&&bad)||(cur&&!dead)?C.a:C.i;
   cx.lineWidth=j===0?2:1.5;cx.globalAlpha=j===0?1:cl(.4+s*.6);cx.stroke()}
  V=V.map((q,k)=>{const n=V[(k+1)%4];return[q[0]+(n[0]-q[0])*kk,q[1]+(n[1]-q[1])*kk]})}
 cx.globalAlpha=1
}
function tick(now){raf=0;const dt=Math.min(now-last,50)/16.667;last=now;const b=step(dt);draw();if(b)raf=requestAnimationFrame(tick)}
const wake=()=>{if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(tick)}};
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0;held=false;p=0}else wake()});
function sync(){const v=inp.value;let n=0;while(n<v.length&&n<N&&v[n]===NAME[n])n++;
 const was=bad;m=n;bad=v.length>n;ok=v===NAME;
 L.forEach((o,i)=>o.t=i<m?1:0);
 if(bad&&!was)K.v+=(Math.random()<.5?-1:1)*.05;
 if(ok)om+=.09;
 bd.disabled=!ok||dead;if(!ok){held=false}wake()}
function del(){if(dead)return;dead=true;held=false;p=1;SC.t=0;PM.t=1;K.t=2.5;bd.hidden=true;inp.disabled=true;bx.textContent='Undo';focus(bx);wake()}
function cancel(){if(dead){dead=false;p=0;SC.t=1;K.t=0;K.x=K.v=0;PM.x=PM.t=0;inp.disabled=false;bd.hidden=false;bx.textContent='Cancel'}
 held=false;p=0;inp.value='';sync();focus(inp)}
const hold=on=>{if(on&&bd.disabled)return;held=on;wake()};
bd.addEventListener('pointerdown',e=>{bd.setPointerCapture(e.pointerId);hold(true)});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>bd.addEventListener(t,()=>hold(false)));
bd.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();hold(true)}});
bd.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();hold(false)}});
bd.addEventListener('blur',()=>hold(false));
inp.addEventListener('input',sync);
bx.addEventListener('click',cancel);
document.addEventListener('keydown',e=>{if(e.key==='Escape')cancel()});
cv.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!dragging)return;om=cl((e.clientX-px)*.012,-.35,.35);px=e.clientX;wake()});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>dragging=false));
new ResizeObserver(()=>{W=R.clientWidth;D=Math.min(devicePixelRatio||1,2);cv.width=cv.height=Math.round(W*D);draw()}).observe(R);
const setTheme=t=>{if(t==='light'||t==='dark'){document.documentElement.dataset.theme=t;col();draw()}};
addEventListener('message',e=>{const d=e.data;if(d&&d.type==='forever:theme')setTheme(d.theme)});
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',wake);
col();sync();draw();

function demoStep(){if(!demoEnabled||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 demoPhase++;if(demoPhase<=NAME.length){inp.value=NAME.slice(0,demoPhase);sync()}
 else if(demoPhase===NAME.length+2){hold(true)}
 else if(demoPhase>=NAME.length+7){cancel();demoPhase=0}}
function demoStart(){if(demoEnabled&&!document.hidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches&&!demoTimer)demoTimer=setInterval(demoStep,450)}
function takeover(){if(!demoEnabled)return;demoEnabled=false;clearInterval(demoTimer);demoTimer=0;held=false;p=0;}
window.addEventListener('forever:interactive',takeover);
['pointerdown','keydown','input'].forEach(t=>document.addEventListener(t,takeover,true));
document.addEventListener('visibilitychange',()=>{clearInterval(demoTimer);demoTimer=0;if(!document.hidden)demoStart()});
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',()=>{clearInterval(demoTimer);demoTimer=0;demoStart()});
demoStep();demoStart();
})();
</script></body></html>
