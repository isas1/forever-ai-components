<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Letter Fall Delete — Feedback &amp; States. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Letter Fall Delete</title>
<meta name="forever-preview-lifecycle" content="demo-v1">
<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
:root{--bg:#0E1630;--ink:#FFF6D6;--dim:#4A5683;--live:#F2C230;--glow:rgba(242,194,48,.55);--warn:#E8893A;--on:#0E1630}
:root[data-theme="light"]{--bg:#DCE3F2;--ink:#1A2340;--dim:#8B96B8;--live:#805C08;--glow:rgba(184,134,11,.4);--warn:#A5470A;--on:#fff}
.wdi-root,.wdi-root *{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}
#wdi-root{container-type:inline-size;position:relative;width:min(100vmin,640px);aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7cqw;overflow:hidden}
#wdi-name{display:flex;font:italic 700 11.5cqw/1 Georgia,serif;perspective:60cqw}
.wdi-l{display:inline-block;color:var(--dim);will-change:transform}
.wdi-l[data-s="1"]{color:var(--live);text-shadow:0 0 .35em var(--glow)}
.wdi-l[data-s="2"]{color:var(--warn)}
#wdi-in{width:78cqw;background:none;border:0;border-bottom:2px solid var(--dim);color:var(--ink);font:600 max(11px,6cqw) ui-monospace,Menlo,monospace;text-align:center;padding:1.5cqw 0;caret-color:var(--live);border-radius:0}
#wdi-in:focus{outline:0;border-color:var(--live)}
#wdi-row{display:flex;gap:4cqw;align-items:center}
.wdi-b{font:600 max(11px,5.2cqw) Georgia,serif;font-style:italic;min-height:44px;padding:0 5cqw;border-radius:99px;border:2px solid var(--dim);background:none;color:var(--ink);cursor:pointer}
#wdi-d{background:var(--live);border-color:var(--live);color:var(--on);transform-origin:center;box-shadow:0 0 5cqw var(--glow)}
#wdi-d:disabled{background:none;border-color:var(--dim);color:var(--dim);box-shadow:none;cursor:not-allowed}
.wdi-b:focus-visible{outline:2px solid var(--live);outline-offset:3px}
#wdi-u{position:absolute}
.wdi-root [hidden]{display:none!important}
.wdi-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.wdi-cap{position:fixed;left:8px;bottom:7px;font:9px/1.2 system-ui,sans-serif;color:var(--ink);opacity:.45;pointer-events:none}
.wdi-root input:focus-visible{outline:2px solid var(--live);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.wdi-root *{transition:none!important}}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/feedback-states/22-firefly-type-delete.html",
 "title": "Letter Fall Delete",
 "description": "Lamplight indigo-and-ochre register: matching cat-pics-2 warms individual letters before they tumble away on deletion.",
 "useWhen": "A reversible confirmation pattern with animated removal feedback.",
 "avoidWhen": "Actual destructive actions without connecting validated server-side permission and recovery rules.",
 "agentPrompt": "Adapt content through existing data arrays; retain named palette, controls and demo-v1 lifecycle.",
 "editableAreas": [
  "Dark/light palette tokens",
  "Sample data and visible labels",
  "Animation timing and geometry"
 ],
 "preserveElements": [
  "IIFE and namespaced CSS/IDs",
  "Initial Manual mode; sticky first-input takeover",
  "Theme URL/message hook; redraw canvas palette",
  "Keyboard/focus/live status; reduced motion; hidden pause"
 ],
 "knownLimitations": [
  "Illustrative data; local state resets on remount.",
  "Client-side delete/restore demo; no backend deletion."
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready",
  "mobile-ready"
 ],
 "tags": [
  "delete",
  "type-to-confirm",
  "letter-fall",
  "spring",
  "keyboard"
 ]
}
</script>
</head>
<body>
<div id="wdi-root" role="group" aria-label="Confirm deleting the item cat-pics-2 by typing its name" class="wdi-root">
  <div id="wdi-name" aria-hidden="true"></div>
  <input id="wdi-in" aria-label="Type cat-pics-2 to arm delete" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="10">
  <div id="wdi-row"><button class="wdi-b" id="wdi-x" type="button">cancel</button><button class="wdi-b" id="wdi-d" type="button" disabled>delete</button></div>
  <button class="wdi-b" id="wdi-u" type="button" hidden>undo</button>
  <p class="wdi-sr" id="wdi-live" aria-live="polite" data-fit-clip-ok></p>
</div>
<div class="wdi-cap" aria-hidden="true">Letter Fall Delete</div>
<script>
(()=>{
let demoEnabled=window.__foreverPreview?.demoEnabled!==false,demoTimer=0,demoPhase=0;
const focus=el=>{if(!demoEnabled)el.focus({preventScroll:true})};

const NAME='cat-pics-2',$=s=>document.getElementById('wdi-'+s),mq=matchMedia('(prefers-reduced-motion: reduce)');
const nameEl=$('name'),inp=$('in'),del=$('d'),und=$('u'),live=$('live'),root=$('root'),row=$('row');
const L=[...NAME].map((c,i)=>{const e=document.createElement('span');e.className='wdi-l';e.textContent=c;nameEl.appendChild(e);
  return{e,s:0,y:0,vy:0,x:0,vx:0,sc:1,vs:0,fall:0,g:false,rot:0,vr:0}});
let armed=false,gone=false,bs=1,bv=0,raf=0,last=0;
const tgtSc=l=>l.s===1?1.12:1;
function paint(){L.forEach(l=>{l.e.style.transform=`translate(${l.x}px,${l.y}px) rotate(${l.rot}deg) scale(${l.sc})`;
  l.e.style.opacity=l.g?Math.max(0,1-l.y/(root.clientHeight*.55)):1});
  del.style.transform=`scaleX(${bs})`}
function step(dt){let busy=false;const H=root.clientHeight;
  L.forEach((l,i)=>{if(l.g){if(l.fall>0){l.fall-=dt;busy=true}else{l.vy+=.9*dt*H/400;l.y+=l.vy*dt;l.rot+=l.vr*dt;if(l.y<H)busy=true}return}
    l.vs+=(tgtSc(l)-l.sc)*.22*dt;l.vs*=Math.pow(.78,dt);l.sc+=l.vs*dt;
    l.vy+=(0-l.y)*.22*dt;l.vy*=Math.pow(.78,dt);l.y+=l.vy*dt;
    l.vx+=(0-l.x)*.3*dt;l.vx*=Math.pow(.7,dt);l.x+=l.vx*dt;
    if(Math.abs(l.vs)+Math.abs(l.vy)+Math.abs(l.vx)+Math.abs(l.sc-tgtSc(l))+Math.abs(l.y)+Math.abs(l.x)>.01)busy=true});
  const t=armed?1:.78;bv+=(t-bs)*.2*dt;bv*=Math.pow(.75,dt);bs+=bv*dt;if(Math.abs(bv)+Math.abs(bs-t)>.002)busy=true;
  paint();return busy}
function tick(now){raf=0;const dt=Math.min(now-last,50)/16.667;last=now;if(step(dt))raf=requestAnimationFrame(tick);else finish()}
function run(){if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(tick)}}
function finish(){if(gone){und.hidden=false;row.hidden=true;und.style.cssText='';focus(und)}}
function settle(){L.forEach(l=>{l.x=l.rot=0;l.y=gone?1e4:0;l.sc=tgtSc(l);l.vs=l.vy=l.vx=0});bs=armed?1:.78;paint()}
function sync(){const v=inp.value;
  L.forEach((l,i)=>{const s=i>=v.length?0:v[i]===NAME[i]?1:2;if(s!==l.s){if(s===1){l.vs=.28;l.vy=-6}else if(s===2)l.vx=(i%2?1:-1)*9;l.s=s;l.e.dataset.s=s}});
  armed=v===NAME;del.disabled=!armed;live.textContent=armed?'Name matches. Delete is armed.':'';
  mq.matches?settle():run()}
function reset(){inp.value='';gone=false;armed=false;und.hidden=true;row.hidden=false;
  L.forEach(l=>{l.g=false;l.s=0;l.e.dataset.s=0;l.sc=mq.matches?1:.2;l.y=mq.matches?0:-20;l.rot=0;l.vs=l.vy=0});
  del.disabled=true;live.textContent='';mq.matches?settle():run();focus(inp)}
function commit(){if(!armed||gone)return;gone=true;live.textContent='Deleted.';
  if(mq.matches){L.forEach(l=>{l.g=true;l.fall=0;l.y=1e4});paint();finish();return}
  L.forEach((l,i)=>{l.g=true;l.fall=i*3;l.vy=-4;l.vr=(i%2?1:-1)*(2+i%3)});run()}
inp.addEventListener('input',sync);del.addEventListener('click',commit);und.addEventListener('click',reset);$('x').addEventListener('click',reset);
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&!gone){e.preventDefault();reset()}});
root.addEventListener('pointerdown',e=>{if(!gone&&e.target===root)setTimeout(()=>focus(inp))});
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0}else run()});
mq.addEventListener('change',()=>{if(mq.matches){cancelAnimationFrame(raf);raf=0;settle();if(gone)finish()}else run()});
addEventListener('message',e=>{const d=e.data;if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark'))document.documentElement.dataset.theme=d.theme});
settle();

function demoStep(){if(!demoEnabled||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 demoPhase++;if(demoPhase<=NAME.length){inp.value=NAME.slice(0,demoPhase);sync()}
 else if(demoPhase===NAME.length+2){commit()}
 else if(demoPhase>=NAME.length+5){reset();demoPhase=0}}
function demoStart(){if(demoEnabled&&!document.hidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches&&!demoTimer)demoTimer=setInterval(demoStep,450)}
function takeover(){if(!demoEnabled)return;demoEnabled=false;clearInterval(demoTimer);demoTimer=0;}
window.addEventListener('forever:interactive',takeover);
['pointerdown','keydown','input'].forEach(t=>document.addEventListener(t,takeover,true));
document.addEventListener('visibilitychange',()=>{clearInterval(demoTimer);demoTimer=0;if(!document.hidden)demoStart()});
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',()=>{clearInterval(demoTimer);demoTimer=0;demoStart()});
demoStep();demoStart();
})();
</script>
</body>
</html>
