<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
:root{--bg:#0E1630;--ink:#FFF6D6;--dim:#3C4878;--live:#F2C230;--warn:#E8893A;--on:#0E1630}
:root[data-theme="light"]{--bg:#DCE3F2;--ink:#1A2340;--dim:#9AA5C6;--live:#805C08;--warn:#A5470A;--on:#fff}
.wdj-root,.wdj-root *{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}
#wdj-root{container-type:inline-size;position:relative;width:min(100vmin,640px);aspect-ratio:1}
#wdj-cv{position:absolute;inset:0;width:100%;height:100%}
#wdj-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.5cqw}
#wdj-name{font:italic 700 9cqw/1 Georgia,serif;color:var(--ink)}
#wdj-in{width:52cqw;background:none;border:0;border-bottom:2px solid var(--dim);color:var(--ink);font:600 max(11px,5.4cqw) ui-monospace,Menlo,monospace;text-align:center;padding:1cqw 0;caret-color:var(--live);border-radius:0}
#wdj-in:focus{outline:0;border-color:var(--live)}
#wdj-row{display:flex;gap:2.5cqw}
.wdj-b{font:italic 600 max(11px,4.6cqw) Georgia,serif;min-height:44px;min-width:44px;padding:0 3.6cqw;border-radius:99px;border:2px solid var(--dim);background:none;color:var(--ink);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
#wdj-d:not(:disabled){border-color:var(--live);color:var(--live)}
#wdj-d:disabled{color:var(--dim);cursor:not-allowed}
.wdj-b:focus-visible{outline:2px solid var(--live);outline-offset:3px}
.wdj-root [hidden]{display:none!important}
.wdj-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.wdj-cap{position:fixed;left:8px;bottom:7px;font:9px/1.2 system-ui,sans-serif;color:var(--ink);opacity:.45;pointer-events:none}
.wdj-root input:focus-visible{outline:2px solid var(--live);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.wdj-root *{transition:none!important}}
</style>
<script type="application/json" id="forever-agent-meta">
{

<body>
<div id="wdj-root" role="group" aria-label="Confirm deleting cat-pics-2: type its name, then press and hold delete" class="wdj-root">
  <canvas id="wdj-cv" aria-hidden="true"></canvas>
  <div id="wdj-mid">
    <div id="wdj-name">cat-pics-2</div>
    <input id="wdj-in" aria-label="Type cat-pics-2 to arm delete" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="10">
    <div id="wdj-row"><button class="wdj-b" id="wdj-x" type="button">cancel</button><button class="wdj-b" id="wdj-d" type="button" disabled aria-label="Press and hold to delete">delete</button></div>
    <button class="wdj-b" id="wdj-u" type="button" hidden>undo</button>
  </div>
  <p class="wdj-sr" id="wdj-live" aria-live="polite" data-fit-clip-ok></p>
</div>
<div class="wdj-cap" aria-hidden="true">Lamplight Hold Delete</div>
<script>
(()=>{
let demoEnabled=window.__foreverPreview?.demoEnabled!==false,demoTimer=0,demoPhase=0;
const focus=el=>{if(!demoEnabled)el.focus({preventScroll:true})};

const NAME='cat-pics-2',N=NAME.length,$=s=>document.getElementById('wdj-'+s),TAU=Math.PI*2,mq=matchMedia('(prefers-reduced-motion: reduce)');
const inp=$('in'),del=$('d'),und=$('u'),live=$('live'),root=$('root'),cv=$('cv'),mid=$('mid'),ctx=cv.getContext('2d');
let S=300,dpr=1,col={},a=0,tA=0,bad=-1,h=0,holding=false,c=0,gone=false,rot=0,armed=false,raf=0,last=0;
function colors(){const s=getComputedStyle(document.documentElement);['live','warn','dim'].forEach(k=>col[k]=s.getPropertyValue('--'+k).trim())}
function size(){S=root.clientWidth;dpr=Math.min(devicePixelRatio||1,2);cv.width=cv.height=Math.round(S*dpr);draw()}
function stroke(R,a0,a1,w,color,glow,wob){ctx.strokeStyle=color;
  for(let k=-2;k<=2;k++){ctx.globalAlpha=k===0?1:.38;ctx.lineWidth=w*(k===0?1:.45);ctx.beginPath();
    for(let t=a0;t<=a1+.001;t+=.04){const r=R+k*w*.28+Math.sin(t*5+k*2+rot*6)*wob;const x=S/2+Math.cos(t)*r,y=S/2+Math.sin(t)*r;t===a0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()}ctx.globalAlpha=1}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,S,S);ctx.lineCap='round';
  const k=1-c,R=S*.45*(1-.1*h)*k,w=S*(.012+.016*h),st=-Math.PI/2+rot;if(R<1)return;
  for(let i=0;i<N;i++){const t=st+i/N*TAU,x=S/2+Math.cos(t)*R,y=S/2+Math.sin(t)*R;ctx.beginPath();ctx.arc(x,y,S*.008*k+(i===bad?S*.006:0),0,TAU);ctx.fillStyle=i===bad?col.warn:col.dim;ctx.fill()}
  if(a>.02)stroke(R,st,st+a,w,col.live,S*.03*(1+h),S*.004);
  if(bad>=0)stroke(R,st+bad/N*TAU-.1,st+bad/N*TAU+.1,w*.9,col.warn,S*.02,0)}
function step(dt){let busy=false,f=1-Math.pow(1-.16,dt);
  a=mq.matches?tA:a+(tA-a)*f;if(Math.abs(tA-a)>.002)busy=true;else a=tA;
  if(armed&&!gone&&demoEnabled&&!mq.matches){rot+=.006*dt;busy=true}else if(Math.abs(rot)>.001&&!gone){rot*=Math.pow(.9,dt);busy=true}
  if(holding&&!gone){h+=dt/45;busy=true;if(h>=1){h=1;holding=false;commit()}}else if(h>0&&!gone){h=Math.max(0,h-dt/12);busy=true}
  if(gone){c+=(1-c)*(1-Math.pow(1-.07,dt))+.002*dt;rot+=.05*dt;busy=true;if(c>=.995){c=1;busy=false;finish()}}
  draw();return busy}
function tick(now){raf=0;const dt=Math.min(now-last,50)/16.667;last=now;if(step(dt))raf=requestAnimationFrame(tick)}
function run(){if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(tick)}}
function finish(){mid.querySelectorAll('div,input').forEach(e=>e.hidden=true);und.hidden=false;focus(und)}
function sync(){const v=inp.value;let p=0;while(p<v.length&&v[p]===NAME[p])p++;
  bad=p<v.length?p:-1;tA=p/N*TAU;armed=v===NAME;if(!armed){holding=false;h=0}del.disabled=!armed;live.textContent=armed?'Name matches. Press and hold delete.':'';
  if(mq.matches){a=tA;rot=0;draw()}else run()}
function commit(){if(!armed||gone)return;gone=true;holding=false;live.textContent='Deleted.';if(mq.matches){c=1;draw();finish()}else run()}
function reset(){inp.value='';gone=false;holding=false;h=0;c=0;armed=false;bad=-1;tA=0;del.disabled=true;live.textContent='';
  mid.querySelectorAll('div,input').forEach(e=>e.hidden=false);und.hidden=true;if(mq.matches){a=0;rot=0;draw()}else run();focus(inp)}
function hold(on){if(gone||del.disabled||mq.matches)return;holding=on;run()}
del.addEventListener('pointerdown',e=>{hold(true);del.setPointerCapture(e.pointerId)});
del.addEventListener('pointerup',()=>hold(false));del.addEventListener('pointercancel',()=>hold(false));del.addEventListener('lostpointercapture',()=>hold(false));
del.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!mq.matches){e.preventDefault();if(!e.repeat)hold(true)}});
del.addEventListener('keyup',e=>{if(e.key==='Enter'||e.key===' ')hold(false)});
del.addEventListener('blur',()=>hold(false));
del.addEventListener('click',()=>{if(mq.matches&&armed)commit()});
inp.addEventListener('input',sync);$('x').addEventListener('click',reset);und.addEventListener('click',reset);
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&!gone){e.preventDefault();reset()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0;holding=false;h=0}else run()});
mq.addEventListener('change',()=>{if(mq.matches){cancelAnimationFrame(raf);raf=0;holding=false;a=tA;rot=0;h=0;draw()}else run()});
addEventListener('message',e=>{const d=e.data;if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){document.documentElement.dataset.theme=d.theme;colors();draw()}});
new ResizeObserver(size).observe(root);colors();size();

function demoStep(){if(!demoEnabled||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 demoPhase++;if(demoPhase<=NAME.length){inp.value=NAME.slice(0,demoPhase);sync()}
 else if(demoPhase===NAME.length+2){hold(true)}
 else if(demoPhase>=NAME.length+7){reset();demoPhase=0}}
function demoStart(){if(demoEnabled&&!document.hidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches&&!demoTimer)demoTimer=setInterval(demoStep,450)}
function takeover(){if(!demoEnabled)return;demoEnabled=false;clearInterval(demoTimer);demoTimer=0;holding=false;h=0;}
window.addEventListener('forever:interactive',takeover);
['pointerdown','keydown','input'].forEach(t=>document.addEventListener(t,takeover,true));
document.addEventListener('visibilitychange',()=>{clearInterval(demoTimer);demoTimer=0;if(!document.hidden)demoStart()});
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',()=>{clearInterval(demoTimer);demoTimer=0;demoStart()});
demoStep();demoStart();
})();
</script>
</body>
</html>
