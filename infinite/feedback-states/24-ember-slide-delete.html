<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Lamplight Slide Delete — Feedback &amp; States. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lamplight Slide Delete</title>
<meta name="forever-preview-lifecycle" content="demo-v1">
<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
:root{--bg:#0E1630;--ink:#FFF6D6;--dim:#3C4878;--live:#F2C230;--glow:rgba(242,194,48,.5);--warn:#E8893A;--on:#0E1630}
:root[data-theme="light"]{--bg:#DCE3F2;--ink:#1A2340;--dim:#9AA5C6;--live:#805C08;--glow:rgba(184,134,11,.4);--warn:#A5470A;--on:#fff}
.wdk-root,.wdk-root *{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}
#wdk-root{container-type:inline-size;position:relative;width:min(100vmin,640px);aspect-ratio:1}
#wdk-box{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8cqw}
#wdk-name{font:italic 700 12cqw/1 Georgia,serif}
#wdk-in{width:80cqw;background:none;border:0;border-bottom:2px solid var(--dim);color:var(--ink);font:600 max(11px,6cqw) ui-monospace,Menlo,monospace;text-align:center;padding:1.5cqw 0;caret-color:var(--live);border-radius:0}
#wdk-in:focus{outline:0;border-color:var(--live)}
#wdk-track{position:relative;width:80cqw;height:15cqw;min-height:48px;border-radius:99px;border:2px solid var(--dim);overflow:hidden;transition:border-color .3s}
#wdk-track[data-a="1"]{border-color:var(--live)}
#wdk-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,transparent,var(--glow));opacity:.9}
#wdk-k{position:absolute;left:0;top:0;bottom:0;width:34cqw;border:0;border-radius:99px;background:var(--dim);color:var(--ink);font:italic 700 max(11px,5.4cqw) Georgia,serif;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;transition:background .3s,color .3s}
#wdk-track[data-a="1"] #wdk-k{background:var(--live);color:var(--on);box-shadow:0 0 5cqw var(--glow)}
#wdk-k:focus-visible,.wdk-t:focus-visible{outline:2px solid var(--live);outline-offset:3px}
.wdk-t{background:none;border:0;color:var(--ink);font:italic 600 max(11px,5cqw) Georgia,serif;min-height:44px;min-width:44px;padding:0 4cqw;cursor:pointer;text-decoration:underline;text-underline-offset:.25em;text-decoration-color:var(--dim)}
#wdk-u{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:0 6cqw;border:2px solid var(--live);border-radius:99px;text-decoration:none;color:var(--live)}
.wdk-root [hidden]{display:none!important}
.wdk-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.wdk-cap{position:fixed;left:8px;bottom:7px;font:9px/1.2 system-ui,sans-serif;color:var(--ink);opacity:.45;pointer-events:none}
.wdk-root input:focus-visible{outline:2px solid var(--live);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.wdk-root *{transition:none!important}}
@media(max-width:270px){#wdk-box{gap:5cqw}}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/feedback-states/24-ember-slide-delete.html",
 "title": "Lamplight Slide Delete",
 "description": "Lamplight indigo-and-ochre register: typing cat-pics-2 arms an inertial slide-to-delete pill with an ochre trail.",
 "useWhen": "A reversible confirmation pattern with animated removal feedback.",
 "avoidWhen": "Actual destructive actions without connecting validated server-side permission and recovery rules.",
 "agentPrompt": "Adapt content through existing data arrays; retain named palette, controls and demo-v1 lifecycle.",
 "editableAreas": [
  "Dark/light palette tokens",
  "Sample data and visible labels",
  "Animation timing and geometry"
 ],
 "preserveElements": [
  "IIFE and namespaced CSS/IDs",
  "Initial Manual mode; sticky first-input takeover",
  "Theme URL/message hook; redraw canvas palette",
  "Keyboard/focus/live status; reduced motion; hidden pause"
 ],
 "knownLimitations": [
  "Illustrative data; local state resets on remount.",
  "Client-side delete/restore demo; no backend deletion."
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready",

 ],
 "tags": [
  "delete",
  "type-to-confirm",
  "slide-to-delete",
  "spring",
  "keyboard"
 ]
}
</script>
</head>
<body>
<div id="wdk-root" role="group" aria-label="Confirm deleting cat-pics-2: type its name, then drag delete across" class="wdk-root">
  <div id="wdk-box">
    <div id="wdk-name">cat-pics-2</div>
    <input id="wdk-in" aria-label="Type cat-pics-2 to arm delete" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="10">
    <div id="wdk-track"><div id="wdk-fill"></div><button id="wdk-k" type="button" aria-label="Delete. Drag right, or press Enter when armed">delete</button></div>
    <button class="wdk-t" id="wdk-x" type="button">cancel</button>
  </div>
  <button class="wdk-t" id="wdk-u" type="button" hidden>undo</button>
  <p class="wdk-sr" id="wdk-live" aria-live="polite" data-fit-clip-ok></p>
</div>
<div class="wdk-cap" aria-hidden="true">Lamplight Slide Delete</div>
<script>
(()=>{
let demoEnabled=window.__foreverPreview?.demoEnabled!==false,demoTimer=0,demoPhase=0;
const focus=el=>{if(!demoEnabled)el.focus({preventScroll:true})};

const NAME='cat-pics-2',$=s=>document.getElementById('wdk-'+s),mq=matchMedia('(prefers-reduced-motion: reduce)');
const inp=$('in'),k=$('k'),track=$('track'),fill=$('fill'),box=$('box'),und=$('u'),live=$('live'),root=$('root');
let x=0,v=0,travel=100,armed=false,drag=false,go=false,done=false,o=1,raf=0,last=0,px=0,x0=0,moved=0,vs=[];
function size(){travel=Math.max(1,track.clientWidth-4-k.offsetWidth)}
function paint(){k.style.transform=`translateX(${x}px)`;fill.style.width=(x+k.offsetWidth*.6)+'px';box.style.opacity=o}
function lockX(raw){return armed?Math.max(0,Math.min(raw,travel)):16*Math.tanh(Math.max(raw,0)/40)}
function step(dt){let busy=false;
  if(done){o=Math.max(0,o-dt/28);if(o<=0){o=0;box.hidden=true;und.hidden=false;focus(und)}else busy=true;paint();return busy}
  if(!drag){
    if(go){v+=.07*travel*dt/16;busy=true}
    else{v+=-(x)*(armed?.012:.12)*dt}
    v*=Math.pow(armed?.94:.8,dt);x+=v*dt;
    if(x<0){x=0;v=Math.abs(v)*.35}
    if(armed&&x>=travel){x=travel;v=0;go=false;paint();commit();return true}
    if(Math.abs(v)>.05||Math.abs(x)>.2)busy=true;
  }else busy=true;
  paint();return busy}
function tick(now){raf=0;const dt=Math.min(now-last,50)/16.667;last=now;if(step(dt))raf=requestAnimationFrame(tick)}
function run(){if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(tick)}}
function commit(){if(done)return;done=true;live.textContent='Deleted.';if(mq.matches){o=0;box.hidden=true;und.hidden=false;focus(und);paint()}else run()}
function activate(){if(!armed||done)return;if(mq.matches){x=travel;paint();commit()}else{go=true;run()}}
function nudge(){if(!mq.matches){v=9;run()}}
function sync(){armed=inp.value===NAME;k.setAttribute('aria-disabled',!armed);track.dataset.a=armed?1:0;
  live.textContent=armed?'Name matches. Delete is armed.':'';if(!armed){go=false;x=Math.min(x,16)}run()}
function reset(){inp.value='';armed=false;done=false;go=false;x=v=0;o=1;track.dataset.a=0;k.setAttribute('aria-disabled','true');
  box.hidden=false;und.hidden=true;live.textContent='';paint();focus(inp)}
k.addEventListener('pointerdown',e=>{if(done)return;k.setPointerCapture(e.pointerId);drag=true;go=false;px=e.clientX;x0=x;moved=0;vs=[];k.style.cursor='grabbing'});
k.addEventListener('pointermove',e=>{if(!drag)return;const raw=x0+e.clientX-px;moved=Math.max(moved,Math.abs(e.clientX-px));x=lockX(raw);
  vs.push([performance.now(),x]);if(vs.length>5)vs.shift();paint()});
function up(){if(!drag)return;drag=false;k.style.cursor='';
  if(moved<5){activate();if(!armed)nudge();return}
  const a=vs[0],b=vs[vs.length-1];v=a&&b&&b[0]>a[0]?(b[1]-a[1])/(b[0]-a[0])*16.667:0;if(armed&&x>=travel*.98){commit();return}if(mq.matches){x=0;v=0;paint();return}run()}
k.addEventListener('pointerup',up);k.addEventListener('pointercancel',()=>{drag=false;go=false;x=v=0;k.style.cursor='';paint()});
k.addEventListener('click',e=>{if(e.detail===0){if(armed)activate();else nudge()}});
k.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&armed&&!mq.matches){e.preventDefault();v+=travel*.04;run()}else if(e.key==='ArrowRight'&&armed){x=Math.min(travel,x+travel*.25);paint();if(x>=travel)commit()}});
inp.addEventListener('input',sync);$('x').addEventListener('click',reset);und.addEventListener('click',reset);
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&!done){e.preventDefault();reset()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0}else run()});
mq.addEventListener('change',()=>{if(mq.matches){v=0;go=false;x=armed?x:0;paint()}else run()});
addEventListener('message',e=>{const d=e.data;if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark'))document.documentElement.dataset.theme=d.theme});
new ResizeObserver(()=>{size();paint()}).observe(root);size();k.setAttribute('aria-disabled','true');paint();

function demoStep(){if(!demoEnabled||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 demoPhase++;if(demoPhase<=NAME.length){inp.value=NAME.slice(0,demoPhase);sync()}
 else if(demoPhase===NAME.length+2){activate()}
 else if(demoPhase>=NAME.length+5){reset();demoPhase=0}}
function demoStart(){if(demoEnabled&&!document.hidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches&&!demoTimer)demoTimer=setInterval(demoStep,450)}
function takeover(){if(!demoEnabled)return;demoEnabled=false;clearInterval(demoTimer);demoTimer=0;}
window.addEventListener('forever:interactive',takeover);
['pointerdown','keydown','input'].forEach(t=>document.addEventListener(t,takeover,true));
document.addEventListener('visibilitychange',()=>{clearInterval(demoTimer);demoTimer=0;if(!document.hidden)demoStart()});
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',()=>{clearInterval(demoTimer);demoTimer=0;demoStart()});
demoStep();demoStart();
})();
</script>
</body>
</html>
