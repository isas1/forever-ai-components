<style>
:root{--bg:#0E1630;--ink:#FFF6D6;--dim:#3C4878;--live:#F2C230;--warn:#E8893A;--on:#0E1630}
:root[data-theme="light"]{--bg:#DCE3F2;--ink:#1A2340;--dim:#9AA5C6;--live:#805C08;--warn:#A5470A;--on:#fff}
.wdl-root,.wdl-root *{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}
#wdl-root{container-type:inline-size;position:relative;width:min(100vmin,640px);aspect-ratio:1}
#wdl-cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#wdl-ui{position:absolute;left:0;right:0;bottom:6cqw;display:flex;flex-direction:column;align-items:center;gap:4cqw}
#wdl-in{width:70cqw;background:none;border:0;border-bottom:2px solid var(--dim);color:var(--ink);font:600 max(11px,6cqw) ui-monospace,Menlo,monospace;text-align:center;padding:1.2cqw 0;caret-color:var(--live);border-radius:0}
#wdl-in:focus{outline:0;border-color:var(--live)}
#wdl-row{display:flex;gap:3cqw}
.wdl-b{font:italic 600 max(11px,5cqw) Georgia,serif;min-height:44px;padding:0 5cqw;border-radius:99px;border:2px solid var(--dim);background:none;color:var(--ink);cursor:pointer}
#wdl-d:not(:disabled){background:var(--live);border-color:var(--live);color:var(--on)}
#wdl-d:disabled{color:var(--dim);cursor:not-allowed}
.wdl-b:focus-visible{outline:2px solid var(--live);outline-offset:3px}
#wdl-u{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-color:var(--live);color:var(--live)}
.wdl-root [hidden]{display:none!important}
.wdl-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.wdl-cap{position:fixed;left:8px;bottom:7px;font:9px/1.2 system-ui,sans-serif;color:var(--ink);opacity:.45;pointer-events:none}
.wdl-root input:focus-visible{outline:2px solid var(--live);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.wdl-root *{transition:none!important}}
</style>

<body>
<div id="wdl-root" role="group" aria-label="Confirm deleting cat-pics-2 by typing its name" class="wdl-root">
  <canvas id="wdl-cv" aria-hidden="true"></canvas>
  <div id="wdl-ui">
    <input id="wdl-in" aria-label="Type cat-pics-2 to arm delete" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="10">
    <div id="wdl-row"><button class="wdl-b" id="wdl-x" type="button">cancel</button><button class="wdl-b" id="wdl-d" type="button" disabled>delete</button></div>
  </div>
  <button class="wdl-b" id="wdl-u" type="button" hidden>undo</button>
  <p class="wdl-sr" id="wdl-live" aria-live="polite" data-fit-clip-ok></p>
</div>
<div class="wdl-cap" aria-hidden="true">Firefly Scatter Delete</div>
<script>
(()=>{
let demoEnabled=window.__foreverPreview?.demoEnabled!==false,demoTimer=0,demoPhase=0;
const focus=el=>{if(!demoEnabled)el.focus({preventScroll:true})};

const NAME='cat-pics-2',N=NAME.length,$=s=>document.getElementById('wdl-'+s),mq=matchMedia('(prefers-reduced-motion: reduce)');
const inp=$('in'),del=$('d'),und=$('u'),ui=$('ui'),live=$('live'),root=$('root'),cv=$('cv'),ctx=cv.getContext('2d');
const glyph=document.createElement('canvas'),gc=glyph.getContext('2d');let marks=[];
let S=300,dpr=1,P=[],st=new Array(N).fill(0),col={},mx=-999,my=-999,e=1,gone=false,armed=false,fade=1,raf=0,last=0,T=0;
function colors(){const s=getComputedStyle(document.documentElement);['ink','live','warn'].forEach(k=>col[k]=s.getPropertyValue('--'+k).trim())}
function build(){const o=document.createElement('canvas'),c=o.getContext('2d');o.width=S;o.height=S;
  let fs=S*.17;c.font=`italic 700 ${fs}px Georgia,serif`;const w=c.measureText(NAME).width;fs*=Math.min(1,S*.88/w);c.font=`italic 700 ${fs}px Georgia,serif`;
  const tw=c.measureText(NAME).width,x0=(S-tw)/2,cy=S*.34,b=[...NAME].map((_,i)=>x0+c.measureText(NAME.slice(0,i+1)).width);
  c.textBaseline='middle';c.fillText(NAME,x0,cy);const d=c.getImageData(0,0,S,S).data,g=Math.max(2,Math.round(S/95));P=[];
  for(let y=0;y<S;y+=g)for(let x=0;x<S;x+=g)if(d[(y*S+x)*4+3]>140){let li=0;while(li<N-1&&x>b[li])li++;
    P.push({hx:x,hy:y,x,y,vx:0,vy:0,li,ph:Math.random()*6.28,r:Math.random()})}marks=P.slice();stamp();if(P.length>116){const all=P;P=Array.from({length:116},(_,i)=>all[Math.floor(i*all.length/116)])}}
function size(){S=root.clientWidth;dpr=Math.min(devicePixelRatio||1,2);cv.width=cv.height=Math.round(S*dpr);if(!gone)build();draw()}
function stamp(){glyph.width=glyph.height=Math.ceil(S);const r=Math.max(1.1,S*.0048);for(const p of marks){gc.fillStyle=st[p.li]===1?col.live:st[p.li]===2?col.warn:col.ink;gc.globalAlpha=st[p.li]===0?.55:1;gc.beginPath();gc.arc(p.hx,p.hy,r*(.8+.4*p.r),0,6.283);gc.fill()}}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,S,S);const R=Math.max(1.1,S*.0048);ctx.globalAlpha=gone?fade*fade:.7;ctx.drawImage(glyph,0,0);
  for(const m of[0,2,1]){const f=P.filter(p=>st[p.li]===m);if(!f.length)continue;
    ctx.fillStyle=m===1?col.live:m===2?col.warn:col.ink;ctx.globalAlpha=(m===0?.55:1)*fade;ctx.beginPath();
    for(const p of f){ctx.moveTo(p.x+R,p.y);ctx.arc(p.x,p.y,R*(.8+.4*p.r),0,6.283)}ctx.fill();
    if(m===1){ctx.globalAlpha=.16*fade;ctx.beginPath();for(const p of f){ctx.moveTo(p.x+R*3,p.y);ctx.arc(p.x,p.y,R*3,0,6.283)}ctx.fill()}}
  ctx.globalAlpha=1}
function step(dt){T+=dt;let busy=false;
  if(gone){fade*=Math.pow(.955,dt);for(const p of P){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=.01*dt}
    if(fade<.03){fade=0;draw();und.hidden=false;focus(und);return false}draw();return true}
  e*=Math.pow(.985,dt);const rr=S*.15;
  for(const p of P){const s=st[p.li],A=(s===2?S*.05:S*.012)*e,k=s===1?.14:s===0?.05:.02;
    let tx=p.hx+Math.sin(T*.05+p.ph)*A,ty=p.hy+Math.cos(T*.04+p.ph*1.3)*A;
    const dx=p.x-mx,dy=p.y-my,d2=dx*dx+dy*dy;if(d2<rr*rr&&d2>.01){const d=Math.sqrt(d2),f=(1-d/rr)*S*.012*dt;p.vx+=dx/d*f;p.vy+=dy/d*f}
    p.vx+=(tx-p.x)*k*dt;p.vy+=(ty-p.y)*k*dt;const fr=Math.pow(.82,dt);p.vx*=fr;p.vy*=fr;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(Math.abs(p.vx)+Math.abs(p.vy)+Math.abs(tx-p.x)+Math.abs(ty-p.y)>.08)busy=true}
  draw();return busy||e>.01}
function tick(now){raf=0;const dt=Math.min(now-last,50)/16.667;last=now;if(step(dt))raf=requestAnimationFrame(tick)}
function run(){if(!raf&&!document.hidden&&!mq.matches){last=performance.now();raf=requestAnimationFrame(tick)}}
function home(){for(const p of P){p.x=p.hx;p.y=p.hy;p.vx=p.vy=0}draw()}
function sync(){const v=inp.value;for(let i=0;i<N;i++)st[i]=i>=v.length?0:v[i]===NAME[i]?1:2;
  stamp();armed=v===NAME;del.disabled=!armed;live.textContent=armed?'Name matches. Delete is armed.':'';e=1;mq.matches?home():run()}
function commit(){if(!armed||gone)return;gone=true;live.textContent='Deleted.';ui.hidden=true;
  if(mq.matches){fade=0;draw();und.hidden=false;focus(und);return}
  for(const p of P){const a=Math.atan2(p.y-S*.34,p.x-S/2)+(Math.random()-.5),v=(1+Math.random()*3)*S/300;p.vx=Math.cos(a)*v;p.vy=Math.sin(a)*v-1.5*S/300}run()}
function reset(){inp.value='';st.fill(0);armed=gone=false;fade=1;e=1;del.disabled=true;ui.hidden=false;und.hidden=true;live.textContent='';
  build();mq.matches?home():run();focus(inp)}
cv.addEventListener('pointermove',ev=>{const r=cv.getBoundingClientRect();mx=(ev.clientX-r.left)*S/r.width;my=(ev.clientY-r.top)*S/r.height;if(!gone){e=Math.max(e,.3);run()}});
cv.addEventListener('pointerleave',()=>{mx=my=-999});cv.addEventListener('pointerup',()=>{mx=my=-999});
cv.addEventListener('pointerdown',ev=>{if(!gone)focus(inp)});
inp.addEventListener('input',sync);del.addEventListener('click',commit);$('x').addEventListener('click',reset);und.addEventListener('click',reset);
root.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!gone){ev.preventDefault();reset()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0}else run()});
mq.addEventListener('change',()=>{mq.matches?(cancelAnimationFrame(raf),raf=0,gone||home()):run()});
addEventListener('message',ev=>{const d=ev.data;if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){document.documentElement.dataset.theme=d.theme;colors();stamp();draw()}});
colors();new ResizeObserver(size).observe(root);size();

function demoStep(){if(!demoEnabled||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 demoPhase++;if(demoPhase<=NAME.length){inp.value=NAME.slice(0,demoPhase);sync()}
 else if(demoPhase===NAME.length+2){commit()}
 else if(demoPhase>=NAME.length+5){reset();demoPhase=0}}
function demoStart(){if(demoEnabled&&!document.hidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches&&!demoTimer)demoTimer=setInterval(demoStep,450)}
function takeover(){if(!demoEnabled)return;demoEnabled=false;clearInterval(demoTimer);demoTimer=0;}
window.addEventListener('forever:interactive',takeover);
['pointerdown','keydown','input'].forEach(t=>document.addEventListener(t,takeover,true));
document.addEventListener('visibilitychange',()=>{clearInterval(demoTimer);demoTimer=0;if(!document.hidden)demoStart()});
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',()=>{clearInterval(demoTimer);demoTimer=0;demoStart()});
demoStep();demoStart();
})();
</script>
</body>
</html>
