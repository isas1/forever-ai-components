<div class="dt16-cap" aria-hidden="true">Accession Stack</div>
<script>(function(){
  var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var raf=0,last=0,MAX=8;
  var names=['Forever plan','cat-pics-2','Monday','Emotional baggage','Delete me later','Forever backup','cat-pics-3','Tuesday'];
  var root=document.querySelector('.dt16-root'),cv=document.createElement('canvas');
  cv.className='dt16-cv';root.appendChild(cv);var ctx=cv.getContext('2d');
  var W=300,dpr=1,C={};
  var tgt=0,p=0,v=0,n=0,out=1,ov=0,tw=0,ph=0;
  function step(dt){
    v+=(tgt-p)*0.17*dt;v*=Math.pow(0.8,dt);p+=v*dt;
    var ot=n===0?1:0,k=ot>out?0.035:0.2;
    ov+=(ot-out)*k*dt;ov*=Math.pow(ot>out?0.86:0.78,dt);out+=ov*dt;
    tw=Math.max(0,tw-0.025*dt);ph+=0.35*dt;
    var m=Math.abs(tgt-p)>0.002||Math.abs(v)>0.002||Math.abs(ot-out)>0.003||Math.abs(ov)>0.002||tw>0;
    if(!m){p=tgt;out=ot;v=ov=0}return m}
  function snapToTarget(){p=tgt;v=0;out=n===0?1:0;ov=0;tw=0}
  function cl(a,b,c){return a<b?b:a>c?c:a}
  function hatch(x,y,w,h,s){ctx.beginPath();for(var k=-h;k<w;k+=s){ctx.moveTo(x+k,y+h);ctx.lineTo(x+k+h,y)}ctx.stroke()}
  function draw(){
    var s=getComputedStyle(document.documentElement);
    C={ink:s.getPropertyValue('--ink').trim(),acc:s.getPropertyValue('--acc').trim(),mute:s.getPropertyValue('--mute').trim(),bg:s.getPropertyValue('--bg').trim()};
    ctx.clearRect(0,0,W,W);
    var m=W*0.1,lw=Math.max(1,W/400),u=W/320;
    ctx.lineJoin='round';ctx.lineCap='round';
    var fs=Math.max(12,W*0.055);
    ctx.font='600 '+fs+'px -apple-system,system-ui,sans-serif';ctx.textBaseline='alphabetic';
    ctx.fillStyle=C.mute;ctx.fillText('No.',m,m+fs*0.4);
    var nw=ctx.measureText('No. ').width;ctx.fillStyle=C.acc;ctx.fillText(String(n),m+nw,m+fs*0.4);
    var top=m+fs*1.1,bot=W-m;
    ctx.strokeStyle=C.mute;ctx.lineWidth=1;ctx.strokeRect(m+0.5,top+0.5,W-2*m-1,bot-top-1);
    var R=W*0.065,cy=bot-R*1.7,yT=top+W*0.03,slot=(cy-R*1.6-yT)/MAX,x0=m+W*0.035,x1=W-m-W*0.035,w=x1-x0,y=yT;
    for(var i=0;i<MAX;i++){
      var f=cl(p-i,0,1.08);if(f<=0.003)break;
      var fc=Math.min(f,1),lh=slot*0.84*f,c=y+lh/2,ins=(1-fc)*w*0.05;
      ctx.lineWidth=lw;ctx.strokeStyle=C.ink;
      ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.lineTo(x1-ins,c);ctx.lineTo(x0+ins,c);ctx.closePath();
      ctx.fillStyle=C.bg;ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.moveTo(x0+ins,c);ctx.lineTo(x1-ins,c);ctx.lineTo(x1,y+lh);ctx.lineTo(x0,y+lh);ctx.closePath();
      ctx.fill();ctx.stroke();
      if(fc<0.97){ctx.save();ctx.clip();ctx.lineWidth=Math.max(0.6,lw*0.6);hatch(x0,c,w,lh/2,(2.5+fc*9)*u);ctx.restore()}
      if(fc>0.55){ctx.globalAlpha=(fc-0.55)/0.45;var r=slot*0.11,hx=x0+slot*0.45;
        ctx.beginPath();ctx.arc(hx,c,r,0,7);
        if(i===n-1){ctx.fillStyle=C.acc;ctx.fill()}else{ctx.lineWidth=lw;ctx.stroke()}
        ctx.strokeStyle=C.mute;ctx.lineWidth=1;ctx.beginPath();
        ctx.moveTo(hx+slot*0.45,y+lh*0.36);ctx.lineTo(x0+w*(0.5+((i*37)%17)/80),y+lh*0.36);
        ctx.moveTo(hx+slot*0.45,y+lh*0.64);ctx.lineTo(x0+w*(0.3+((i*53)%13)/70),y+lh*0.64);ctx.stroke();
        ctx.globalAlpha=1}
      y+=slot*f}
    crab(W/2,cy,R,cl(out,0,1.1),lw,u);
  }
  function crab(cx,cy,R,o,lw,u){
    ctx.strokeStyle=C.mute;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx-R*2.6,cy+R*1.02);ctx.lineTo(cx+R*2.6,cy+R*1.02);ctx.stroke();
    ctx.strokeStyle=C.ink;ctx.lineWidth=lw;
    var sx=cx+R*0.35+(1-o)*R*0.15,bx=cx-R*0.45,t=Math.sin(ph)*tw;
    if(o>0.02){
      for(var k=0;k<3;k++){var lx=bx-k*R*0.18,ex=lx-R*(0.55+k*0.12)*o,kx=lx-R*0.35*o;
        ctx.beginPath();ctx.moveTo(lx,cy+R*0.35);ctx.lineTo(kx,cy+R*(0.35-0.3*o));ctx.lineTo(ex,cy+R*(0.35+0.65*o));ctx.stroke()}
      ctx.beginPath();ctx.arc(bx-R*0.75*o,cy+R*0.05,R*0.2*o,0,7);ctx.stroke();
      for(var e=0;e<2;e++){var ex2=bx-R*(0.2+e*0.2),a=-1.3-e*0.25+t*0.5,L=R*0.75*o;
        var tx=ex2+Math.cos(a)*L,ty=cy-R*0.1+Math.sin(a)*L;
        ctx.beginPath();ctx.moveTo(ex2,cy-R*0.1);ctx.lineTo(tx,ty);ctx.stroke();
        ctx.beginPath();ctx.arc(tx,ty,Math.max(1.2,R*0.07),0,7);ctx.fillStyle=C.ink;ctx.fill()}}
    ctx.save();ctx.translate(sx,cy);ctx.rotate((1-o)*0.12-t*0.04);
    ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fillStyle=C.bg;ctx.fill();
    ctx.save();ctx.clip();ctx.lineWidth=Math.max(0.6,lw*0.6);ctx.beginPath();ctx.rect(-R,0,R*2,R);ctx.clip();hatch(-R,-R,R*2,R*2,3*u);ctx.restore();
    ctx.lineWidth=lw;ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.stroke();
    ctx.beginPath();for(var q=0;q<=60;q++){var an=q/60*Math.PI*4,rr=R*(1-q/60*0.88);
      var px=Math.cos(an)*rr,py=Math.sin(an)*rr;q?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.stroke();
    ctx.restore()}
  function frame(now){var dt=last?Math.min(now-last,50)/16.667:1;last=now;
    var moving=reduce()?(snapToTarget(),false):step(dt);draw();
    raf=moving?requestAnimationFrame(frame):0;}
  function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}
  function tick(){}
  function aria(){root.setAttribute('aria-valuenow',n);
    root.setAttribute('aria-valuetext',n?n+' items, latest: '+names[n-1]:'0 items, empty')}
  function setN(k,snap){k=cl(k,0,MAX);var up=k>n;if(k!==n){n=k;aria();tick(up)}if(snap)tgt=n;kick()}
  var drag=false,sy=0,sv=0,moved=false;
  function slotPx(){return root.getBoundingClientRect().width*0.06}
  root.addEventListener('pointerdown',function(e){drag=true;moved=false;sy=e.clientY;sv=n;root.setPointerCapture(e.pointerId);root.focus({preventScroll:true})});
  root.addEventListener('pointermove',function(e){if(!drag)return;var dy=e.clientY-sy;if(Math.abs(dy)>5)moved=true;if(!moved)return;
    var r=sv+dy/slotPx();if(r>MAX)r=MAX+(r-MAX)*0.3;if(r<0)r*=0.3;tgt=r;setN(Math.round(r),false)});
  function end(){if(!drag)return;drag=false;if(!moved)setN(n<MAX?n+1:0,true);else setN(n,true)}
  root.addEventListener('pointerup',end);root.addEventListener('pointercancel',end);
  var wacc=0;root.addEventListener('wheel',function(e){e.preventDefault();wacc+=e.deltaY;
    while(Math.abs(wacc)>=50){setN(n+(wacc>0?1:-1),true);wacc-=wacc>0?50:-50}},{passive:false});
  root.addEventListener('keydown',function(e){var k=e.key,h=true;
    if(k==='ArrowDown'||k==='ArrowRight'||k==='Enter'||k===' ')setN(n+1,true);
    else if(k==='ArrowUp'||k==='ArrowLeft'||k==='Backspace')setN(n-1,true);
    else if(k==='Escape'||k==='Home')setN(0,true);else if(k==='End')setN(MAX,true);else h=false;
    if(h)e.preventDefault()});
  setInterval(function(){if(!document.hidden&&n===0&&!reduce()&&amb()&&out>0.9){tw=1;ph=0;kick()}},3600);
  new ResizeObserver(function(){var r=root.getBoundingClientRect();W=r.width;dpr=Math.min(devicePixelRatio||1,2);
    cv.width=Math.round(W*dpr);cv.height=Math.round(W*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw()}).observe(root);
  window.addEventListener('beforeprint',draw);window.addEventListener('afterprint',draw);
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick()});
  window.addEventListener('message',function(e){var m=e.data;
    if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){
      document.documentElement.setAttribute('data-theme',m.theme);draw()}});
  tw=amb()?1:0;draw();kick();
  // Idle demo (demo-v1): performs the control on its own until the first real input.
  function amb(){var p=window.__foreverPreview;return !p||p.demoEnabled!==false}
  var demo=amb(),dI=0,dT=0;
  function stopDemo(){demo=false;clearInterval(dT)}
  dT=setInterval(function(){if(!demo||document.hidden||reduce())return;
    if('aaaddd'.charAt(dI++%6)==='a'){setN(n+1,true)}else{setN(n-1,true)}},1100);
  window.addEventListener('forever:interactive',stopDemo);
  ['pointerdown','keydown','wheel'].forEach(function(t){document.addEventListener(t,stopDemo,true)});
})();</script>
