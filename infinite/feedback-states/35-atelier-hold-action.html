  :root[data-theme="light"] {

  }
  .at12-btn.is-armed { background: var(--at12-accent); color: var(--at12-accent-ink); }
  .at12-btn:focus-visible { outline: 2px solid var(--at12-accent); outline-offset: 2px; }
  .at12-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .at12-rect-bg { fill: none; stroke: var(--at12-ink); stroke-width: 2; }

<body>
<div class="at12-stage">
  <div class="at12-unit">
    <button type="button" class="at12-btn" id="at12-btn" aria-label="Hold to Arm Master">
      <svg class="at12-svg" viewBox="0 0 164 52" preserveAspectRatio="none" aria-hidden="true">
        <rect class="at12-rect-bg" x="1.5" y="1.5" width="161" height="49" rx="7"/>
        <rect class="at12-rect-bar" id="at12-bar" x="1.5" y="1.5" width="161" height="49" rx="7"/>
      </svg>
      <span id="at12-lbl">HOLD TO ARM</span>
    </button>
    <div class="at12-readout">
      <span>SAFETY</span>
      <span class="at12-val" id="at12-out">SAFE</span>
    </div>
  </div>
</div>
<div class="at12-cap" aria-hidden="true">Atelier Hold Action</div>
<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var btn = document.getElementById("at12-btn");
  var bar = document.getElementById("at12-bar");
  var lbl = document.getElementById("at12-lbl");
  var out = document.getElementById("at12-out");
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var rafId = 0, progress = 0, holding = false, armed = false;

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "forever:theme" && (e.data.theme === "light" || e.data.theme === "dark")) {
      root.setAttribute("data-theme", e.data.theme);
    }
  });

  function renderProgress(p) {
    progress = p;
    bar.style.strokeDashoffset = String(420 * (1 - p));
  }

  function resetSafe() {
    armed = false;
    holding = false;
    renderProgress(0);
    btn.classList.remove("is-armed");
    lbl.textContent = "HOLD TO ARM";
    out.textContent = "SAFE";
  }

  function stepHold() {
    rafId = 0;
    if (document.hidden) return;
    if (holding && !armed) {
      renderProgress(Math.min(1, progress + 0.025));
      out.textContent = "ARMING " + Math.round(progress * 100) + "%";
      if (progress >= 1) {
        armed = true;
        holding = false;
        btn.classList.add("is-armed");
        lbl.textContent = "ARMED (TAP)";
        out.textContent = "ARMED";
        return;
      }
      rafId = requestAnimationFrame(stepHold);
    } else if (!holding && !armed && progress > 0) {
      renderProgress(Math.max(0, progress - 0.06));
      out.textContent = progress > 0 ? "ABORTED" : "SAFE";
      if (progress > 0) rafId = requestAnimationFrame(stepHold);
    }
  }

  function beginHold() {
    if (armed) { resetSafe(); return; }
    if (reduce) {
      renderProgress(1); armed = true; btn.classList.add("is-armed");
      lbl.textContent = "ARMED (TAP)"; out.textContent = "ARMED"; return;
    }
    holding = true; cancelAnimationFrame(rafId); rafId = requestAnimationFrame(stepHold);
  }
  function endHold() {
    if (!holding) return;
    holding = false; cancelAnimationFrame(rafId); rafId = requestAnimationFrame(stepHold);
  }

  var demo = !reduce && (!window.__foreverPreview || window.__foreverPreview.demoEnabled !== false);
  var demoTimer = null, demoReset = null, initTimer = null;

  function runDemoCycle() {
    if (!demo || reduce || document.hidden) return;
    resetSafe(); beginHold();
    demoReset = setTimeout(function () { if (demo && !reduce) resetSafe(); }, 1850);
  }
  function startDemo() { if (demo && !reduce && !demoTimer) demoTimer = setInterval(runDemoCycle, 2600); }
  function stopDemo() {
    if (initTimer) { clearTimeout(initTimer); initTimer = null; }
    if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }
    if (demoReset) { clearTimeout(demoReset); demoReset = null; }
  }
  function takeover() {
    if (!demo) return;
    demo = false; stopDemo(); cancelAnimationFrame(rafId); rafId = 0; resetSafe();
  }

  window.addEventListener("forever:interactive", takeover);
  btn.addEventListener("pointerdown", function (e) { takeover(); if (btn.setPointerCapture) btn.setPointerCapture(e.pointerId); beginHold(); });
  btn.addEventListener("pointerup", endHold);
  btn.addEventListener("pointercancel", endHold);
  btn.addEventListener("pointerleave", endHold);
  btn.addEventListener("keydown", function (e) { if ((e.key === " " || e.key === "Enter") && !e.repeat) { takeover(); beginHold(); } });
  btn.addEventListener("keyup", function (e) { if (e.key === " " || e.key === "Enter") endHold(); });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { stopDemo(); cancelAnimationFrame(rafId); rafId = 0; }
    else if (demo) startDemo();
  });
  if (demo) { initTimer = setTimeout(runDemoCycle, 240); startDemo(); }
})();
</script>
