<style>
:root{--b:#131316;--i:#F1F1F4;--o:#000;--l:#2B2C31;--c:#7B95C4;--rd:#EE7A63;--vn:#000;--ve:#3A3B42;--sp:cubic-bezier(.3,1.45,.5,1);color-scheme:dark}

.cr19-b{position:relative;width:clamp(132px,46vmin,168px);border:0;padding:0;background:none;overflow:hidden;color:var(--rd)}

.cr19-rg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cr19-rg rect{fill:none;stroke-width:2.5}
.cr19-tr{stroke:var(--l)}.cr19-pr{stroke:var(--rd)}

.cr19-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.cr19-cap{position:absolute;left:10px;bottom:8px;font:500 11px/1 ui-monospace,monospace;color:var(--i);opacity:.45;letter-spacing:.04em;text-transform:uppercase;pointer-events:none;user-select:none}

<div class="cr19-st" id="cr19-st"></div>

<script>(()=>{
  const s=document.getElementById('cr19-st'),RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SPR='cubic-bezier(.3,1.45,.5,1)',anim=(el,kf,o)=>RM()?{finished:Promise.resolve()}:el.animate(kf,Object.assign({duration:340,easing:SPR},o));
  const I=d=>`<svg class="cr19-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;
  s.innerHTML=`<div class="cr19-hd"><div class="cr19-it" aria-hidden="true"><i class="cr19-disc"></i><svg class="cr19-art" viewBox="0 0 10 10"><rect width="10" height="10" fill="#5A3A5C"/><path d="M1 7l2-3.6L5 7z" fill="#E2B01A"/><path d="M5 7l2-3.6L9 7z" fill="#F2F0EA"/><rect x="1" y="7.6" width="8" height=".5" fill="#F2F0EA"/></svg></div><button type="button" class="cr19-b" aria-label="Delete Tin Roof. Press and hold to confirm."><svg class="cr19-rg" viewBox="0 0 168 48" preserveAspectRatio="none" aria-hidden="true"><rect class="cr19-tr" x="1.5" y="1.5" width="165" height="45" rx="22.5"/><rect class="cr19-pr" x="1.5" y="1.5" width="165" height="45" rx="22.5"/></svg><span class="cr19-l">${I('M5 7h14M9 7V4.5h6V7M7 7l1 12.5h8L17 7M10 11v5M14 11v5')}Hold to delete</span></button><button type="button" class="cr19-u" hidden>${I('M9 7L4.5 11.5 9 16M5 11.5h9a5 5 0 010 10h-2')}Undo</button><div class="cr19-sr" aria-live="polite"></div></div>`;
  const item=s.querySelector('.cr19-it'),b=s.querySelector('.cr19-b'),pr=s.querySelector('.cr19-pr'),u=s.querySelector('.cr19-u'),sr=s.querySelector('.cr19-sr');
  const LEN=(pr.getTotalLength&&pr.getTotalLength())||381.4;pr.style.strokeDasharray=String(LEN);
  let p=0,holding=false,raf=0,last=0,armed=false,kbd=false,at=0,demoT=0,demo=!RM()&&!(window.__foreverPreview&&window.__foreverPreview.demoEnabled===false);
  const paint=()=>{pr.style.strokeDashoffset=String(LEN*(1-p));b.style.setProperty('--cr19-p',String(p));const k=p>0&&p<1&&!RM();
    item.style.transform=k?`translate(${((Math.random()-.5)*p*6).toFixed(1)}px,${((Math.random()-.5)*p*4).toFixed(1)}px) rotate(${((Math.random()-.5)*p*5).toFixed(2)}deg)`:''};
  const finish=(foc=true)=>{holding=false;raf=0;p=0;paint();const had=foc&&document.activeElement===b;item.classList.add('cr19-gn');item.style.transform='';
    anim(item,[{transform:'none',opacity:1},{transform:'translateY(64px) rotate(16deg)',opacity:0}],{duration:420,easing:'cubic-bezier(.5,0,.9,.5)'});
    b.hidden=true;u.hidden=false;anim(u,[{transform:'scale(.7)',opacity:0},{transform:'none',opacity:1}]);had&&u.focus();sr.textContent='Tin Roof deleted. Undo available.'};
  const restore=(foc=true)=>{item.classList.remove('cr19-gn');anim(item,[{transform:'translateY(-40px) scale(.9)',opacity:0},{transform:'none',opacity:1}],{duration:440});u.hidden=true;b.hidden=false;if(foc)b.focus();sr.textContent='Tin Roof restored'};
  const tick=now=>{if(document.hidden){raf=0;return}const dt=Math.min(50,now-last);last=now;p=Math.min(1,Math.max(0,p+(holding?dt/1100:-dt/320)));
    if(p>=1){finish(false);if(demo)demoT=setTimeout(()=>{if(demo){restore(false);demoT=setTimeout(()=>{demo&&!document.hidden&&start()},650)}},1100);return}
    paint();raf=p>0||holding?requestAnimationFrame(tick):0};
  const start=()=>{if(holding||b.hidden)return;holding=true;last=performance.now();raf||(raf=requestAnimationFrame(tick))};
  const stopHold=()=>{holding=false};
  const haltDemo=()=>{if(!demo)return;demo=false;clearTimeout(demoT);demoT=0;if(b.hidden&&p===0)holding=false};
  b.addEventListener('pointerdown',e=>{if(e.button)return;haltDemo();b.setPointerCapture(e.pointerId);start()});
  ['pointerup','pointercancel','lostpointercapture','blur'].forEach(t=>b.addEventListener(t,stopHold));
  b.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();haltDemo();kbd=true;e.repeat||start()}});
  b.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter'){stopHold();setTimeout(()=>kbd=false,50)}});
  b.addEventListener('contextmenu',e=>e.preventDefault());
  b.addEventListener('click',e=>{if(e.detail||kbd)return;haltDemo();if(armed){clearTimeout(at);armed=false;finish()}else{armed=true;sr.textContent='Activate again to delete';at=setTimeout(()=>armed=false,5000)}});
  u.onclick=()=>{haltDemo();restore(true)};paint();

  window.addEventListener('forever:interactive',haltDemo);
  document.addEventListener('visibilitychange',()=>{if(document.hidden){stopHold();cancelAnimationFrame(raf);clearTimeout(demoT);raf=demoT=0}else if(demo)demoT=setTimeout(()=>!RM()&&start(),350)});
  window.addEventListener('message',e=>{if(e.data&&e.data.type==='forever:theme'&&(e.data.theme==='light'||e.data.theme==='dark'))document.documentElement.setAttribute('data-theme',e.data.theme)});
  if(demo)demoT=setTimeout(start,450);
})();</script>
