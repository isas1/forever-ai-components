<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="A Julia set whose complex constant traces a slow loop, morphing dendritic green filaments between connected and dust forms on black.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Julia Morph</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract); the light
     re-theme is the one [data-theme="light"] block. --fr02-s0..s6 are the escape-time
     ramp the JS LUT interpolates (dark: deep green -> accent -> gold rim; light: the
     same hues with the ramp inverted, so the gold rim becomes the deepest ink).
     --fr02-imix is what the bounded-set interior is mixed toward: black in dark
     (keeps the historic *0.5 dim exactly), paper in light. */
  :root{--fr02-bg:#06070b;--fr02-accent:#378651;
    --fr02-glow:rgba(55,134,81,.14);--fr02-vig:rgba(6,7,11,.82);--fr02-blend:screen;
    --fr02-frame:rgba(55,134,81,.10);--fr02-cap:#fff;--fr02-cap-o:.42;
    --fr02-idim:.5;--fr02-imix:#000000;
    --fr02-s0:#16201a;--fr02-s1:#1e4630;--fr02-s2:#378651;--fr02-s3:#87a190;
    --fr02-s4:#c09c59;--fr02-s5:#ffe1aa;--fr02-s6:#966028}
  :root[data-theme="light"]{--fr02-bg:#eef3ef;--fr02-accent:#337b4a;
    --fr02-glow:rgba(51,123,74,.14);--fr02-vig:rgba(108,80,27,.26);--fr02-blend:multiply;
    --fr02-frame:rgba(51,123,74,.22);--fr02-cap:#16261c;--fr02-cap-o:.62;
    --fr02-idim:.5;--fr02-imix:#eef3ef;
    --fr02-s0:#dce3df;--fr02-s1:#c1d9cc;--fr02-s2:#95c0a3;--fr02-s3:#94a399;
    --fr02-s4:#ad9870;--fr02-s5:#6c501b;--fr02-s6:#d1b89f}
  html,body{margin:0;height:100%;background:var(--fr02-bg)}
  .fr02-stage{position:fixed;inset:0;overflow:hidden;background:var(--fr02-bg)}
  #fr02-c{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:auto}
  /* STATIC glow + vignette — painted once, never animated */
  .fr02-glow{position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(96% 96% at 50% 50%,var(--fr02-glow),transparent 60%),
      radial-gradient(140% 130% at 50% 50%,transparent 50%,var(--fr02-vig) 100%);
    mix-blend-mode:var(--fr02-blend)}
  .fr02-frame{position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 0 1px var(--fr02-frame)}
  .cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;
    color:var(--fr02-cap);opacity:var(--fr02-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none;z-index:3}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important}}
</style>
<script type="application/json" id="forever-agent-meta">

 "file": "infinite/fractals-automata/02-julia-morph.html",
 "title": "Julia Morph",
 "description": "Julia set fractal whose complex constant traces a slow Lissajous loop, morphing green filaments between connected and dendritic forms over ~70 seconds.",
 "useWhen": "Dark hero backgrounds, generative art displays, screensavers, or anywhere that needs slow ambient complexity without user interaction.",
 "avoidWhen": "Low-end mobile devices (CPU-bound pixel loop at up to 420px resolution). Light-background layouts — background is hardcoded near-black.",
 "agentPrompt": "Change the palette to warm amber/red tones by replacing the stops array (e.g. [[20,5,0],[100,30,10],[220,80,20],[255,140,60],[255,210,130],[255,255,200],[80,40,10]]) and slow the morph by changing 0.00009 to 0.00005. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [

  "palette color stops array (stops[])",

  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],

  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "CPU-bound pixel loop — each frame iterates up to MAXIT=150 times per pixel; expensive on slow CPUs",
  "Background and glow colors hardcoded — must edit both CSS vars and LUT stops to retheme",
  "No interactivity — complex constant path is fixed; user cannot steer or zoom"
 ],
 "tier": "curated",
 "labels": [

  "copy-paste-safe",
  "minimal-deps",
  "animation-heavy",
  "mobile-ready",
  "light-ready"
 ],
 "tags": [

</script>
</head>
<body>
  <div class="fr02-stage" role="img" aria-label="A Julia set fractal slowly morphing as its complex constant traces a closed loop, dendritic green filaments breathing on near-black, shaded in deep green, sage and gold.">
    <canvas id="fr02-c"></canvas>
    <div class="fr02-glow"></div>
    <div class="fr02-frame"></div>
    <div class="cap">Julia Morph</div>
  </div>
<script>
(function(){
  "use strict";
  var reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  var cv = document.getElementById('fr02-c');
  var ctx = cv.getContext('2d', {alpha:false});
  var stage = cv.parentNode;

  // View: a fixed window on the dynamical plane; topology changes via c, not zoom.
  var VIEW = 3.05;           // complex height of the framed window
  var MAXIT = 150;           // iteration cap (sane for full-frame Julia)
  var ESC = 64.0;            // escape radius squared

  var W=0,H=0,SW=0,SH=0,buf=null,img=null,pix=null;
  var LUT_R=new Uint8Array(1024),LUT_G=new Uint8Array(1024),LUT_B=new Uint8Array(1024);

  // Palette LUT + interior mix, both rebuilt from the CSS tokens on every theme
  // switch. Dark: deep green -> accent green -> sage -> gold rim. Light: the same
  // hues with the ramp inverted, so the field is paper and the rim is the ink.
  var root=document.documentElement, IDIM=0.5, IMR=0, IMG=0, IMB=0;
  function hex2rgb(h){ h=(h||'').trim().replace('#','');
    if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; var v=parseInt(h,16);
    return h.length===6&&isFinite(v)?[(v>>16)&255,(v>>8)&255,v&255]:[0,0,0]; }
  function buildLUT(){
    var cs=getComputedStyle(root);
    function lerp(a,b,t){return a+(b-a)*t;}
    var stops=[],i;
    for(i=0;i<7;i++) stops.push(hex2rgb(cs.getPropertyValue('--fr02-s'+i)));
    for(i=0;i<1024;i++){
      var t=i/1023, f=t*(stops.length-1), k=f|0, fr=f-k;
      if(k>=stops.length-1){k=stops.length-2;fr=1;}
      var a=stops[k],b=stops[k+1];
      LUT_R[i]=lerp(a[0],b[0],fr)|0;
      LUT_G[i]=lerp(a[1],b[1],fr)|0;
      LUT_B[i]=lerp(a[2],b[2],fr)|0;
    }
    IDIM=parseFloat(cs.getPropertyValue('--fr02-idim'))||0.5;
    var m=hex2rgb(cs.getPropertyValue('--fr02-imix'));
    IMR=m[0]*(1-IDIM); IMG=m[1]*(1-IDIM); IMB=m[2]*(1-IDIM);
  }
  function syncTheme(){ buildLUT(); if(img){var c=constantAt(lastT); render(c[0],c[1]);} }
  addEventListener('message',function(ev){ var d=ev.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
      root.setAttribute('data-theme',d.theme);syncTheme(); } });

  // Render at a capped internal resolution, then let CSS upscale the canvas.
  // Keeps the per-frame Julia evaluation affordable on any screen size.
  function resize(){
    var dpr=Math.min(2,window.devicePixelRatio||1);
    W=Math.max(1,(stage.clientWidth*dpr)|0);
    H=Math.max(1,(stage.clientHeight*dpr)|0);
    var cap=420; // internal long-edge cap -> bounded pixel work per frame
    var s=Math.min(1,cap/Math.max(W,H));
    SW=Math.max(1,(W*s)|0); SH=Math.max(1,(H*s)|0);
    cv.width=SW; cv.height=SH;
    img=ctx.createImageData(SW,SH);
    buf=new ArrayBuffer(img.data.length);
    pix=new Uint32Array(buf);
  }

  var LOG2=Math.log(2), out=new Uint8ClampedArray(0);
  // Render one frame for constant (ccx,ccy). Allocation-free in steady state.
  function render(ccx,ccy){
    var aspect=SW/SH;
    var halfH=VIEW*0.5, halfW=halfH*aspect;
    var x0=-halfW, y0=-halfH;
    var dx=(2*halfW)/SW, dy=(2*halfH)/SH;
    var maxit=MAXIT, esc=ESC;
    var p=0, zy0=y0;
    for(var py=0; py<SH; py++){
      var zx0=x0;
      for(var px=0; px<SW; px++){
        var zr=zx0, zi=zy0, zr2=zr*zr, zi2=zi*zi, it=0;
        // orbit trap: nearest approach to origin -> interior structure / glow seams
        var trap=1e9;
        while(zr2+zi2<=esc && it<maxit){
          zi=2.0*zr*zi+ccy;
          zr=zr2-zi2+ccx;
          zr2=zr*zr; zi2=zi*zi;
          var d=zr2+zi2; if(d<trap)trap=d;
          it++;
        }
        var col;
        if(it>=maxit){
          // bounded set: shade by orbit-trap distance for filamentary interior detail
          var g=Math.sqrt(trap); if(g>1)g=1;
          var ii=(g*340)|0; if(ii>1023)ii=1023;
          // dim the interior toward bg so exterior filaments read as the figure
          col=0xff000000|((LUT_B[ii]*IDIM+IMB)|0)<<16|((LUT_G[ii]*IDIM+IMG)|0)<<8|((LUT_R[ii]*IDIM+IMR)|0);
        }else{
          var nu=it+1-Math.log(Math.log(zr2+zi2)*0.5)/LOG2;
          var idx=((nu*30.0)%1024+1024)%1024|0;
          col=0xff000000|(LUT_B[idx]<<16)|(LUT_G[idx]<<8)|LUT_R[idx];
        }
        pix[p++]=col;
        zx0+=dx;
      }
      zy0+=dy;
    }
    if(out.length!==img.data.length) out=new Uint8ClampedArray(buf);
    img.data.set(out);
    ctx.putImageData(img,0,0);
  }

  // c traces a slow closed loop just outside the main cardioid cusp, where the
  // Julia topology shifts dramatically between connected and dendritic forms.
  function constantAt(t){
    // gentle two-frequency Lissajous loop centered near the cusp region
    var a=t, b=t*0.5;
    var cx=-0.512+0.36*Math.cos(a)+0.045*Math.cos(b*3.0);
    var cy= 0.560*Math.sin(a)+0.045*Math.sin(b*3.0);
    return [cx,cy];
  }

  var running=true, raf=0, t0=0, lastT=2.35;
  function frame(ts){
    if(!t0)t0=ts;
    var t=(ts-t0)*0.00009;           // slow morph: full loop ~70s
    lastT=t;
    var c=constantAt(t);
    render(c[0],c[1]);
    if(running)raf=requestAnimationFrame(frame);
  }

  function start(){ if(!raf){t0=0;raf=requestAnimationFrame(frame);} }
  function stop(){ if(raf){cancelAnimationFrame(raf);raf=0;} }

  document.addEventListener('visibilitychange',function(){
    if(document.hidden){running=false;stop();}
    else if(!reduce){running=true;start();}
  });

  window.addEventListener('resize',function(){
    resize();
    if(reduce){var c=constantAt(2.35);render(c[0],c[1]);}
  },{passive:true});

  syncTheme();
  resize();
  if(reduce){ var c=constantAt(lastT); render(c[0],c[1]); return; } // one static dendritic frame
  start();
})();
</script>
</body>
</html>
