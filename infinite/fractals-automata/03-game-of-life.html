<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Conway's Game of Life: glowing magenta cells flicker, drift and die across a dark pixel grid, reseeding when the field thins.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game of Life</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract); the light
     re-theme is the one [data-theme="light"] block. --fr03-t0..t2 are the three age
     tiers the JS packs into its LUTs: dark paints bright cells on black, light paints
     the same hues as ink on paper (ramp inverted, magenta/gold kept). The vignette is
     always bg-coloured, so it fades the edges into whichever ground is in play. */
  :root{--fr03-bg:#06070b;--fr03-vig:rgba(6,7,11,.78);--fr03-shade:rgba(6,7,11,.92);
    --fr03-glow:rgba(211,69,164,.10);--fr03-cap:#fff;--fr03-cap-o:.42;
    --fr03-t0:#965a82;--fr03-t1:#d345a4;--fr03-t2:#e6b478}
  :root[data-theme="light"]{--fr03-bg:#f7f0f5;--fr03-vig:rgba(247,240,245,.85);--fr03-shade:rgba(247,240,245,.90);
    --fr03-glow:rgba(193,46,145,.12);--fr03-cap:#3a1c30;--fr03-cap-o:.62;
    --fr03-t0:#c8a3bb;--fr03-t1:#c12e91;--fr03-t2:#9b621d}
  html,body{margin:0;height:100%;background:var(--fr03-bg)}
  #fr03-stage{position:fixed;inset:0;overflow:hidden;background:var(--fr03-bg)}
  #fr03-c{position:absolute;inset:0;width:100%;height:100%;display:block;
    image-rendering:pixelated;
    box-shadow:inset 0 0 120px 30px var(--fr03-shade),inset 0 0 30px 6px var(--fr03-glow)}
  .fr03-vig{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 120% at 50% 42%,transparent 52%,var(--fr03-vig) 100%)}
  .cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;
    color:var(--fr03-cap);opacity:var(--fr03-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important}}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/fractals-automata/03-game-of-life.html",
 "title": "Game of Life",
 "description": "Conway's Game of Life with glowing magenta cells aging through three color tiers; field reseeds automatically when population collapses.",
 "useWhen": "Ambient backgrounds for tech/generative-art themes, screensavers, or loading screens needing emergent organic motion.",
 "avoidWhen": "Contexts requiring legible text overlays or light-background UIs — background is hardcoded dark navy and cell flicker competes with content.",
 "agentPrompt": "Change palette to green-on-black: set BG=[5,10,5], TIERS=[[80,200,80],[120,255,120],[200,255,200]], and slow step rate to STEP_MS=180. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "cell color tiers (TIERS array)",
  "step rate (STEP_MS=110)",
  "initial seed density (0.30 in seed())",
  "reseed threshold (0.018 * grid size)",
  "reseed injection rate (0.16 per cell)",
  "grid size cap (COLS/ROWS max 180)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "IIFE wrapper",
  "reduced-motion static-frame fallback",
  "visibilitychange pause/resume",
  "low-res ImageData stretch pattern (critical for perf)",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Age tracking resets on cell death — settled patterns rarely reach tier-2 color",
  "Background color hardcoded in both CSS and BG array — must update both to retheme",
  "No pointer interactivity; fully passive"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "cellular-automata",
  "game-of-life",
  "canvas",
  "pixel",
  "generative",
  "loop",
  "grid"
 ]
}
</script>
</head>
<body>
<div id="fr03-stage" role="img" aria-label="Conway's Game of Life: glowing magenta cells flicker, drift and die across a dark grid, reseeding when the field thins.">
  <canvas id="fr03-c"></canvas>
  <div class="fr03-vig"></div>
</div>
<div class="cap">Game of Life</div>
<script>
(function(){
  "use strict";
  var reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  var stage = document.getElementById('fr03-stage');
  var cv = document.getElementById('fr03-c');
  var ctx = cv.getContext('2d', { alpha:false });

  // Palette around #D345A4 over #06070b — three age tiers (premultiplied RGBA in a LUT).
  // Tier by neighbours/age: born=dim rose, settled=accent magenta, old=warm gold. Dead fades to bg.
  var BG=[6,7,11];
  var TIERS=[[150,90,130],[211,69,164],[230,180,120]];

  // Capped logical grid. Cell pixels chosen so total cells stay modest (<~9000).
  var COLS=0, ROWS=0, CELL=0, PW=0, PH=0;
  var a=null, b=null, img=null, buf=null, buf32=null, age=null;
  var deadLUT=null; // 8-level fade-to-bg lookup (packed 0xAABBGGRR)

  function packLUT(){
    deadLUT=new Uint32Array(8);
    for(var i=0;i<8;i++){
      var t=i/7, k=0.30*(1-t); // dim afterglow trail toward bg
      var r=Math.round(BG[0]+(TIERS[0][0]-BG[0])*k);
      var g=Math.round(BG[1]+(TIERS[0][1]-BG[1])*k);
      var bl=Math.round(BG[2]+(TIERS[0][2]-BG[2])*k);
      deadLUT[i]=(255<<24)|(bl<<16)|(g<<8)|r;
    }
  }
  var liveLUT=new Uint32Array(3);
  // theme: the ground and the three age tiers come from the CSS tokens, so both LUTs
  // (live cells + the fade-to-bg afterglow trail) are rebuilt on every switch.
  var root=document.documentElement;
  function hex2rgb(h){
    h=(h||'').trim().replace('#','');
    if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var v=parseInt(h,16);
    return h.length===6&&isFinite(v)?[(v>>16)&255,(v>>8)&255,v&255]:[0,0,0];
  }
  function syncTheme(){
    var cs=getComputedStyle(root);
    BG=hex2rgb(cs.getPropertyValue('--fr03-bg'));
    for(var i=0;i<3;i++) TIERS[i]=hex2rgb(cs.getPropertyValue('--fr03-t'+i));
    for(i=0;i<3;i++){var c=TIERS[i];liveLUT[i]=((255<<24)|(c[2]<<16)|(c[1]<<8)|c[0])>>>0;}
    packLUT();
    if(img) render();          // repaint at once (matters for the reduced-motion still)
  }
  addEventListener('message',function(ev){
    var d=ev.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
      root.setAttribute('data-theme',d.theme);syncTheme();
    }
  });
  syncTheme();

  function seed(){
    for(var i=0;i<a.length;i++){a[i]=Math.random()<0.30?1:0; age[i]=0;}
  }

  function resize(){
    var w=stage.clientWidth||300, h=stage.clientHeight||300;
    var dpr=Math.min(2,window.devicePixelRatio||1);
    // pick a cell size that yields a crisp, capped grid regardless of frame size
    CELL=Math.max(3,Math.round(Math.min(w,h)/96));
    COLS=Math.min(180,Math.max(24,Math.ceil(w/CELL)));
    ROWS=Math.min(180,Math.max(24,Math.ceil(h/CELL)));
    PW=COLS; PH=ROWS;
    cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
    a=new Uint8Array(COLS*ROWS); b=new Uint8Array(COLS*ROWS); age=new Uint8Array(COLS*ROWS);
    img=ctx.createImageData(PW,PH); buf=img.data; buf32=new Uint32Array(buf.buffer);
    seed();
    ctx.imageSmoothingEnabled=false;
  }

  function step(){
    var c=COLS, r=ROWS, live=0;
    for(var y=0;y<r;y++){
      var yp=((y-1+r)%r)*c, yc=y*c, yn=((y+1)%r)*c;
      for(var x=0;x<c;x++){
        var xp=(x-1+c)%c, xn=(x+1)%c;
        var n=a[yp+xp]+a[yp+x]+a[yp+xn]+a[yc+xp]+a[yc+xn]+a[yn+xp]+a[yn+x]+a[yn+xn];
        var cur=a[yc+x], nv=cur?(n===2||n===3?1:0):(n===3?1:0);
        b[yc+x]=nv;
        if(nv){ live++; var ag=age[yc+x]; if(ag<200) age[yc+x]=ag+(cur?2:0)|0; if(!cur)age[yc+x]=0; }
        else age[yc+x]=0;
      }
    }
    var t=a; a=b; b=t;
    // reseed when the field collapses to near-stasis (sparse) — keep it alive
    if(live < (c*r)*0.018){
      for(var i=0;i<a.length;i++){ if(Math.random()<0.16){a[i]=1;age[i]=0;} }
    }
  }

  function render(){
    var len=a.length;
    for(var i=0;i<len;i++){
      if(a[i]){
        var ag=age[i];
        buf32[i]= ag>40?liveLUT[2] : ag>12?liveLUT[1] : liveLUT[0];
      } else {
        buf32[i]=deadLUT[0];
      }
    }
    ctx.putImageData(img,0,0);
    // stretch the small ImageData across the full canvas via the smoothing-disabled draw
    ctx.drawImage(cv,0,0,PW,PH,0,0,cv.width,cv.height);
  }

  var running=true, raf=0, last=0, STEP_MS=110, acc=0;
  function loop(ts){
    if(!running)return;
    raf=requestAnimationFrame(loop);
    var dt=ts-last; last=ts; if(dt>250)dt=250; acc+=dt;
    if(acc>=STEP_MS){ acc-=STEP_MS; if(acc>STEP_MS)acc=0; step(); render(); }
  }

  resize();
  // For the initial blit we must render once so the canvas isn't blank.
  render();

  if(reduce){
    // settle a few generations to a legible, on-brand still frame, then stop.
    for(var s=0;s<6;s++) step();
    render();
    return;
  }

  var rt=0;
  window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){resize();render();},160)});
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ running=false; if(raf)cancelAnimationFrame(raf); }
    else if(!running){ running=true; last=performance.now(); acc=0; raf=requestAnimationFrame(loop); }
  });
  last=performance.now();
  raf=requestAnimationFrame(loop);
})();
</script>
</body>
</html>
