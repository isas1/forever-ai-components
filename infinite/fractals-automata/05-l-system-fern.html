<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="An algorithmic fern drawing itself branch by branch via an L-system rule, growing in warm brown-to-gold then restarting.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>L-System Fern</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract); the light
     re-theme is the one [data-theme="light"] block. --fr05-p0..p7 are the by-depth
     stroke palette: dark runs deep brown (near-invisible trunk) -> gold -> cream tips,
     light runs the same warm hues inverted, so the tips are the deepest sepia ink and
     the trunk sits just off the paper. Weight distribution is identical either way. */
  :root{--fr05-bg:#06070b;--fr05-g1:rgba(178,146,52,.16);--fr05-g2:rgba(200,170,110,.05);
    --fr05-cap:#fff;--fr05-cap-o:.42;--fr05-tip:#F7EFD9;
    --fr05-p0:#2e2210;--fr05-p1:#6b4a1f;--fr05-p2:#C08459;--fr05-p3:#B29234;
    --fr05-p4:#A19A87;--fr05-p5:#D9B878;--fr05-p6:#EAD9A8;--fr05-p7:#F7EFD9}
  :root[data-theme="light"]{--fr05-bg:#f6f2ea;--fr05-g1:rgba(131,107,38,.13);--fr05-g2:rgba(140,120,80,.05);
    --fr05-cap:#332813;--fr05-cap-o:.62;--fr05-tip:#66521b;
    --fr05-p0:#eee4d4;--fr05-p1:#e6d0b4;--fr05-p2:#cfa98e;--fr05-p3:#c7ab5a;
    --fr05-p4:#afaa9c;--fr05-p5:#b38a3b;--fr05-p6:#897028;--fr05-p7:#66521b}
  html,body{margin:0;height:100%;background:var(--fr05-bg);overflow:hidden}
  #fr05-stage{position:fixed;inset:0;display:block;
    background:
      radial-gradient(120% 90% at 50% 108%, var(--fr05-g1), transparent 60%),
      radial-gradient(60% 60% at 50% 40%, var(--fr05-g2), transparent 70%),
      var(--fr05-bg);}
  #fr05-c{position:absolute;inset:0;width:100%;height:100%;display:block}
  .cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--fr05-cap);opacity:var(--fr05-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important}}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/fractals-automata/05-l-system-fern.html",
 "title": "L-System Fern",
 "description": "A fractal fern draws itself branch by branch via an L-system grammar, coloring segments brown-to-gold by depth; it holds then restarts.",
 "useWhen": "Nature-themed hero backgrounds, generative art showcases, algorithmic illustration demos.",
 "avoidWhen": "Contexts needing instant full visuals — 3.4s draw cycle means content appears progressively. Avoid on light backgrounds (hardcoded dark theme).",
 "agentPrompt": "Change the palette to warm amber/orange tones by replacing PAL with ['#7a2f0a','#b84b1a','#e06530','#ff9b5b','#ffcba0','#ffe0c7','#fff0e8','#ffffff'] and slow growth to 5 seconds by changing GROW_PER_SEC to SEGN/5. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "recursion depth (DEPTH=5)",
  "branch angle (ANG = 23 * Math.PI/180)",
  "palette array (PAL)",
  "grow duration (GROW_PER_SEC=SEGN/3.4)",
  "hold pause (holdUntil=t+2200)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "pre-computed typed Float32Array segments (critical for perf)",
  "IIFE wrapper",

  "reduced-motion static fallback (drawTo(SEGN) + return)",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "DEPTH=5 is near the cap of 9000 segments; increasing to 6+ will silently truncate at the hard cap",
  "Light re-theme via the [data-theme=light] token block; catalog bg/accent describe the dark default"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "fractal",
  "l-system",
  "fern",
  "turtle-graphics",

  "canvas",
  "loop"
 ]

</script>
</head>
<body>
  <div id="fr05-stage" role="img" aria-label="An algorithmic fern drawing itself, branch by branch, via an L-system rewriting rule.">
    <canvas id="fr05-c"></canvas>
  </div>
  <div class="cap">L-System Fern</div>

<script>
(function(){
  "use strict";
  var reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  var stage = document.getElementById('fr05-stage');
  var cv = document.getElementById('fr05-c');
  var ctx = cv.getContext('2d');
  var W=0,H=0,DPR=1;

  // --- L-system: a plant grammar. axiom X, rules expand to a fern. ---
  // X -> F+[[X]-X]-F[-FX]+X ; F -> FF   (classic fractal plant, original layout)
  var DEPTH = 5;            // recursion depth (capped)
  function build(){
    var s = "X";
    for(var i=0;i<DEPTH;i++){
      var o="",j;
      for(j=0;j<s.length;j++){
        var ch=s[j];
        if(ch==='X') o+="F+[[X]-X]-F[-FX]+X";
        else if(ch==='F') o+="FF";
        else o+=ch;
      }
      s=o;
    }
    return s;
  }
  var SEQ = build();

  // Pre-compute every segment ONCE into typed arrays (x0,y0,x1,y1,gen).
  // Turtle in normalized space; mapped to canvas at draw time via cached scale.
  var ANG = 23 * Math.PI/180;
  var segX0,segY0,segX1,segY1,segGen,SEGN=0;
  var minx,maxx,miny,maxy;
  function turtle(){
    var cap = 9000;                 // hard cap on segment count
    segX0=new Float32Array(cap); segY0=new Float32Array(cap);
    segX1=new Float32Array(cap); segY1=new Float32Array(cap);
    segGen=new Uint8Array(cap);
    var x=0,y=0,a=Math.PI/2;        // pointing up
    var step=1, gen=0;
    var stx=new Float32Array(64),sty=new Float32Array(64),sta=new Float32Array(64),stg=new Uint8Array(64),sp=0;
    minx=miny=1e9; maxx=maxy=-1e9; SEGN=0;
    for(var i=0;i<SEQ.length && SEGN<cap;i++){
      var c=SEQ[i];
      if(c==='F'){
        var nx=x+Math.cos(a)*step, ny=y+Math.sin(a)*step;
        segX0[SEGN]=x;segY0[SEGN]=y;segX1[SEGN]=nx;segY1[SEGN]=ny;segGen[SEGN]=gen>7?7:gen;
        SEGN++;
        if(x<minx)minx=x; if(nx<minx)minx=nx; if(x>maxx)maxx=x; if(nx>maxx)maxx=nx;
        if(y<miny)miny=y; if(ny<miny)miny=ny; if(y>maxy)maxy=y; if(ny>maxy)maxy=ny;
        x=nx;y=ny;
      } else if(c==='+'){ a+=ANG; }
      else if(c==='-'){ a-=ANG; }
      else if(c==='['){ if(sp<63){stx[sp]=x;sty[sp]=y;sta[sp]=a;stg[sp]=gen;sp++;} gen++; }
      else if(c===']'){ if(sp>0){sp--;x=stx[sp];y=sty[sp];a=sta[sp];gen=stg[sp];} }
    }
  }
  turtle();

  var scale=1,offx=0,offy=0;        // cached transform, recomputed on resize
  function fit(){
    var w=maxx-minx||1, h=maxy-miny||1, pad=0.10;
    var sx=(W*(1-pad*2))/w, sy=(H*(1-pad*2))/h;
    scale=Math.min(sx,sy);
    var cx=(minx+maxx)/2, cy=(miny+maxy)/2;
    offx=W/2 - cx*scale;
    offy=H/2 + cy*scale;             // flip Y (turtle up = screen up)
  }

  function resize(){
    DPR=Math.min(2,window.devicePixelRatio||1);
    W=stage.clientWidth; H=stage.clientHeight;
    cv.width=Math.max(1,(W*DPR)|0); cv.height=Math.max(1,(H*DPR)|0);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.lineCap='round';
    fit();
  }
  resize();
  window.addEventListener('resize',resize);

  // palette by generation depth + the growing-tip node, both re-read from the CSS
  // tokens on every theme switch (the canvas clears to transparent, so the ground
  // itself stays CSS-side and needs no colour read here).
  var PAL=['#2e2210','#6b4a1f','#C08459','#B29234','#A19A87','#D9B878','#EAD9A8','#F7EFD9'];
  var TIP='#F7EFD9', root=document.documentElement, lastN=0;
  function syncTheme(){
    var cs=getComputedStyle(root);
    for(var i=0;i<8;i++) PAL[i]=cs.getPropertyValue('--fr05-p'+i).trim()||PAL[i];
    TIP=cs.getPropertyValue('--fr05-tip').trim()||TIP;
    if(lastN>0) drawTo(lastN);       // repaint at once, reduced-motion still included
  }
  addEventListener('message',function(ev){
    var d=ev.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
      root.setAttribute('data-theme',d.theme);syncTheme();
    }
  });
  syncTheme();

  function drawTo(count){
    ctx.clearRect(0,0,W,H);
    var n = count|0; if(n>SEGN)n=SEGN;
    lastN=n;
    var prevGen=-1;
    for(var i=0;i<n;i++){
      var g=segGen[i];
      if(g!==prevGen){
        ctx.strokeStyle=PAL[g];
        ctx.lineWidth = g<2 ? 2.0 : (g<4?1.3:0.85);
        prevGen=g;
        ctx.beginPath();
      }
      ctx.moveTo(segX0[i]*scale+offx, offy - segY0[i]*scale);
      ctx.lineTo(segX1[i]*scale+offx, offy - segY1[i]*scale);
      // stroke per gen-run: flush when next gen differs or at end
      if(i+1>=n || segGen[i+1]!==g){ ctx.stroke(); }
    }
    // growing tip glow (static-radius, opacity-free): a single soft node at the frontier
    if(n>0 && n<SEGN){
      var tx=segX1[n-1]*scale+offx, ty=offy-segY1[n-1]*scale;
      ctx.fillStyle=TIP;
      ctx.beginPath(); ctx.arc(tx,ty,1.8,0,6.2832); ctx.fill();
    }
  }

  if(reduce){ drawTo(SEGN); return; }   // settle to full static fern

  // animation: grow from 0 -> SEGN, hold, fade-restart by redrawing. one rAF.
  var running=true, raf=0;
  var grown=0, GROW_PER_SEC=SEGN/3.4;   // full draw in ~3.4s
  var holdUntil=0, last=0;
  var PHASE_GROW=0, PHASE_HOLD=1, phase=PHASE_GROW;

  function frame(t){
    if(!running) return;
    if(!last) last=t;
    var dt=(t-last)/1000; if(dt>0.05)dt=0.05; last=t;
    if(phase===PHASE_GROW){
      grown+=GROW_PER_SEC*dt;
      if(grown>=SEGN){ grown=SEGN; phase=PHASE_HOLD; holdUntil=t+2200; }
      drawTo(grown);
    } else {
      if(t>=holdUntil){ phase=PHASE_GROW; grown=0; }
      else if(grown===SEGN){ drawTo(SEGN); grown=SEGN+1e-3; } // draw final once
    }
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);

  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ running=false; if(raf)cancelAnimationFrame(raf); }
    else if(!running){ running=true; last=0; raf=requestAnimationFrame(frame); }
  });
})();
</script>
</body>
</html>
