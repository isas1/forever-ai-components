<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="A Sierpinski triangle accreting from thousands of chaos-game points, glowing red on near-black with three anchor pips.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sierpinski</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract); the light
     re-theme is the one [data-theme="light"] block. --fr07-cold/warm/hot are the three
     chaos-game point classes the JS packs into ABGR: dark plots them bright on
     near-black, light plots the same hues as rose/red/espresso ink on paper, each held
     at the contrast ratio against the ground that it had in dark (the hot leading edge
     stays the strongest mark either way). The canvas fills its own background, so
     --fr07-bg is read by the script too. */
  :root{--fr07-bg:#06070b;--fr07-vig:rgba(13,16,28,.9);--fr07-cap:#fff;--fr07-cap-o:.42;
    --fr07-cold:#8c4646;--fr07-warm:#c43131;--fr07-hot:#ffe0b4;
    --fr07-pip:#ffdfae;--fr07-pip-glow:rgba(196,49,49,.55)}
  :root[data-theme="light"]{--fr07-bg:#f6f1ee;--fr07-vig:rgba(246,241,238,.9);--fr07-cap:#3a2118;--fr07-cap-o:.62;
    --fr07-cold:#b06060;--fr07-warm:#c43131;--fr07-hot:#452800;
    --fr07-pip:#8a5a12;--fr07-pip-glow:rgba(196,49,49,.35)}
  html,body{margin:0;height:100%;background:var(--fr07-bg)}
  #fr07-stage{position:fixed;inset:0;background:var(--fr07-bg);overflow:hidden}
  #fr07-c{position:absolute;inset:0;width:100%;height:100%;display:block;
    /* static glow, never repainted */
    box-shadow:inset 0 0 120px 8px var(--fr07-vig)}
  /* three anchor pips, pure CSS, static */
  .fr07-pip{position:absolute;width:7px;height:7px;margin:-3.5px;border-radius:50%;
    background:var(--fr07-pip);box-shadow:0 0 10px 2px var(--fr07-pip-glow);opacity:.9}
  #fr07-p0{left:50%;top:8%}
  #fr07-p1{left:8%;top:92%}
  #fr07-p2{left:92%;top:92%}
  .cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;
    color:var(--fr07-cap);opacity:var(--fr07-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important}}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/fractals-automata/07-sierpinski.html",
 "title": "Sierpinski",
 "description": "Sierpinski triangle accretes from 26,000 chaos-game points, glowing red on near-black; recent points flash white-hot before cooling.",
 "useWhen": "Dark-mode hero backgrounds, generative art showcases, screensaver-style ambient displays with a mathematical aesthetic.",
 "avoidWhen": "Light-background UIs (background hardcoded near-black). Contexts needing immediate full image — triangle builds over many frames before settling.",
 "agentPrompt": "Change palette to cyan/teal: set COLD=abgr(80,200,200,255), WARM=abgr(160,240,240,255), HOT=abgr(230,255,255,255) and update pip background to #a0f0f0. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "point count cap (MAXPTS=26000)",
  "points per frame (PER_FRAME=260)",
  "color palette (COLD/WARM/HOT abgr values)",
  "vertex positions (ax/ay percentages)",
  "pip CSS color (#c8beff)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "Uint32 direct pixel write (allocation-free loop)",
  "IIFE wrapper",

  "drawStatic reduced-motion fallback with seeded RNG",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Animation auto-stops when MAXPTS reached — resize resets and restarts",
  "Background color hardcoded in both CSS and JS buffer fill — must change both",
  "No interactivity; pointer position has no effect on the chaos game"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "fractal",
  "sierpinski",
  "chaos-game",
  "canvas",

  "accretion",
  "ambient"
 ]
}
</script>
</head>
<body>
<div id="fr07-stage" role="img" aria-label="A Sierpinski triangle forming from thousands of accreting points in the chaos game, glowing red on near-black.">
  <canvas id="fr07-c"></canvas>
  <span class="fr07-pip" id="fr07-p0"></span>
  <span class="fr07-pip" id="fr07-p1"></span>
  <span class="fr07-pip" id="fr07-p2"></span>
  <div class="cap">Sierpinski</div>
</div>
<script>
(function(){
  "use strict";
  var stage=document.getElementById("fr07-stage");
  var c=document.getElementById("fr07-c");
  var ctx=c.getContext("2d",{alpha:false});
  var reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;

  var W=0,H=0,dpr=1;
  var ax=[0,0,0],ay=[0,0,0];     // triangle vertices in device px
  var px=0,py=0;                  // chaos-game cursor
  var img=null,buf=null;         // ImageData + Uint32 view
  var raf=0,running=false;

  // movement palette: dim -> accent -> hot highlight by recency, written straight into
  // Uint32 (ABGR, little-endian). All three classes and the buffer's own background come
  // from the CSS tokens. Every plotted point is recorded (class + device px), so a live
  // theme switch recolours the whole accreted figure rather than only points drawn after.
  function abgr(r,g,b,a){return ((a<<24)|(b<<16)|(g<<8)|r)>>>0;}
  var root=document.documentElement;
  var COLS=[abgr(140,70,70,255),abgr(196,49,49,255),abgr(255,224,180,255)];
  var BGC=abgr(6,7,11,255);
  var recX=null,recY=null,recC=null,recN=0;
  function hex2rgb(h){
    h=(h||'').trim().replace('#','');
    if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var v=parseInt(h,16);
    return h.length===6&&isFinite(v)?[(v>>16)&255,(v>>8)&255,v&255]:[0,0,0];
  }
  function syncTheme(){
    var cs=getComputedStyle(root), names=['--fr07-cold','--fr07-warm','--fr07-hot'];
    for(var i=0;i<3;i++){ var c=hex2rgb(cs.getPropertyValue(names[i])); COLS[i]=abgr(c[0],c[1],c[2],255); }
    var b=hex2rgb(cs.getPropertyValue('--fr07-bg')); BGC=abgr(b[0],b[1],b[2],255);
    if(!buf) return;
    for(i=0;i<buf.length;i++) buf[i]=BGC;            // repaint ground...
    for(i=0;i<recN;i++) buf[recY[i]*W+recX[i]]=COLS[recC[i]];   // ...then every recorded point
    ctx.putImageData(img,0,0);
  }
  addEventListener('message',function(ev){
    var d=ev.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
      root.setAttribute('data-theme',d.theme);syncTheme();
    }
  });

  function resize(){
    var r=stage.getBoundingClientRect();
    dpr=Math.min(2,window.devicePixelRatio||1);
    W=Math.max(2,(r.width*dpr)|0); H=Math.max(2,(r.height*dpr)|0);
    c.width=W; c.height=H;
    // vertices match the CSS pip positions: apex 50%/8%, base 8%/92% & 92%/92%
    ax[0]=W*0.50; ay[0]=H*0.08;
    ax[1]=W*0.08; ay[1]=H*0.92;
    ax[2]=W*0.92; ay[2]=H*0.92;
    px=W*0.5; py=H*0.5;
    img=ctx.createImageData(W,H);
    buf=new Uint32Array(img.data.buffer);
    if(!recX){ recX=new Uint16Array(MAXPTS); recY=new Uint16Array(MAXPTS); recC=new Uint8Array(MAXPTS); }
    recN=0;
    // paint background once into the buffer
    var bg=BGC;
    for(var i=0,n=buf.length;i<n;i++) buf[i]=bg;
    ctx.putImageData(img,0,0);
  }

  // plot one point by colour class (0 cold, 1 warm, 2 hot) and record it for re-theming
  function plot(x,y,ci){
    var ix=x|0, iy=y|0;
    if(ix<0||iy<0||ix>=W||iy>=H) return;
    buf[iy*W+ix]=COLS[ci];
    if(recN<MAXPTS){ recX[recN]=ix; recY[recN]=iy; recC[recN]=ci; recN++; }
  }

  // STEP_RATE capped: fixed points per frame, allocation-free loop
  var PER_FRAME=260, MAXPTS=26000, count=0, t=0;

  function step(){
    var added=PER_FRAME;
    if(count+added>MAXPTS) added=MAXPTS-count;
    for(var k=0;k<added;k++){
      var v=(Math.random()*3)|0;
      px=(px+ax[v])*0.5;
      py=(py+ay[v])*0.5;
      // recent points hottest -> creates an advancing accretion shimmer
      var ci = (k>added-40)?2 : ((v===0)?1:0);
      plot(px,py,ci);
    }
    count+=added;
    ctx.putImageData(img,0,0);
  }

  function frame(){
    if(!running) return;
    t++;
    step();
    if(count>=MAXPTS){ running=false; return; } // settle when filled
    raf=requestAnimationFrame(frame);
  }

  function start(){ if(running||count>=MAXPTS) return; running=true; raf=requestAnimationFrame(frame); }
  function stop(){ running=false; if(raf) cancelAnimationFrame(raf); raf=0; }

  document.addEventListener("visibilitychange",function(){
    if(document.hidden) stop();
    else if(!reduce && count<MAXPTS) start();
  });

  window.addEventListener("resize",function(){
    stop(); resize(); count=0;
    if(reduce) drawStatic(); else start();
  });

  // reduced-motion: deterministic dense single frame, no loop
  function drawStatic(){
    px=W*0.5; py=H*0.5; count=0; recN=0;
    var seed=20240601;
    function rnd(){ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; }
    for(var k=0;k<MAXPTS;k++){
      var v=(rnd()*3)|0;
      px=(px+ax[v])*0.5; py=(py+ay[v])*0.5;
      plot(px,py,(v===0)?1:0);
    }
    ctx.putImageData(img,0,0);
  }

  syncTheme();
  resize();
  if(reduce){ drawStatic(); }
  else { start(); }
})();
</script>
</body>
</html>
