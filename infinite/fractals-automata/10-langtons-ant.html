<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Langton's ant traces emergent cyan highways across a square grid with a glowing recency trail and bright head dot.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Langton's Ant</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract); the light
     re-theme is the one [data-theme="light"] block. --fr10-c0 is the unvisited cell the
     canvas fills itself; --fr10-p0..p3 the recency ramp (p0 oldest .. p3 newest) and
     --fr10-head the ant. Dark draws the highway as brightening cyan on near-black;
     light draws it as deepening cyan ink on paper — each band holds the contrast ratio
     against the field that it had in dark, so the trail reads the same either way. */
  :root{--fr10-bg:#06070b;--fr10-glow:rgba(29,172,201,.10);--fr10-shade:rgba(6,7,11,.9);
    --fr10-cap:#fff;--fr10-cap-o:.42;--fr10-c0:#0e181a;
    --fr10-p0:#143c44;--fr10-p1:#146e80;--fr10-p2:#1dacc9;--fr10-p3:#8ce0e8;--fr10-head:#dcf5fa}
  :root[data-theme="light"]{--fr10-bg:#eef4f6;--fr10-glow:rgba(20,119,139,.10);--fr10-shade:rgba(238,244,246,.9);
    --fr10-cap:#12292e;--fr10-cap-o:.62;--fr10-c0:#e7eef0;
    --fr10-p0:#87cddc;--fr10-p1:#1b93ab;--fr10-p2:#0f5a69;--fr10-p3:#0a3034;--fr10-head:#041519}
  html,body{margin:0;height:100%;background:var(--fr10-bg)}
  #fr10-stage{position:fixed;inset:0;background:var(--fr10-bg);overflow:hidden}
  /* static glow halo — never repaints */
  #fr10-stage::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 120% at 50% 42%,var(--fr10-glow),transparent 60%);
    box-shadow:inset 0 0 140px var(--fr10-shade)}
  #fr10-c{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    image-rendering:pixelated;width:92%;height:92%;object-fit:contain}
  .cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;
    color:var(--fr10-cap);opacity:var(--fr10-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important}}
</style>

<body>
<div id="fr10-stage" role="img" aria-label="Langton's ant: a single automaton tracing emergent highways across a square grid.">
  <canvas id="fr10-c"></canvas>
</div>
<div class="cap">Langton&rsquo;s Ant</div>
<script>
(function(){
  "use strict";
  var reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  var cv = document.getElementById('fr10-c');
  var ctx = cv.getContext('2d', {alpha:false});

  // ---- capped square grid ----
  var N = 121;                 // cells per side (odd → centred ant)
  var cells = new Uint8Array(N*N);   // 0=dark, 1=lit
  var age   = new Uint16Array(N*N);  // recency for trail glow

  // palette around #06070b / #1DACC9 (Riso Duotone cyan bias)
  var BG=[10,16,17], C0=[14,24,26];
  var pal=[[20,60,68],[20,110,128],[29,172,201],[140,224,232]]; // depth ramp

  // pixel buffer — one ImageData blit per frame
  var img, data;
  function alloc(){ img = ctx.createImageData(N,N); data = img.data;
    for(var i=0;i<data.length;i+=4){data[i+3]=255;} }
  alloc();

  // ---- ant state ----
  var ax, ay, dir, reset;
  function init(){
    cells.fill(0); age.fill(0);
    ax=(N>>1); ay=(N>>1); dir=0; reset=0;
  }
  init();
  var DX=[0,1,0,-1], DY=[-1,0,1,0]; // N,E,S,W

  var STEPS = 90;          // ant moves per frame — capped, fixed
  var MAXAGE = 900;        // trail fade horizon
  var clock = 0;

  // theme: the unvisited field, the four recency bands and the ant head all come from
  // the CSS tokens, and the frame is repainted on a switch so the already-drawn highway
  // recolours too (the canvas fills every pixel, so nothing here falls back to CSS).
  var root=document.documentElement, HEAD=[220,245,250];
  function hex2rgb(h){
    h=(h||'').trim().replace('#','');
    if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var v=parseInt(h,16);
    return h.length===6&&isFinite(v)?[(v>>16)&255,(v>>8)&255,v&255]:[0,0,0];
  }
  function syncTheme(){
    var cs=getComputedStyle(root);
    C0=hex2rgb(cs.getPropertyValue('--fr10-c0'));
    for(var i=0;i<4;i++) pal[i]=hex2rgb(cs.getPropertyValue('--fr10-p'+i));
    HEAD=hex2rgb(cs.getPropertyValue('--fr10-head'));
    paint();
  }
  addEventListener('message',function(ev){
    var d=ev.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
      root.setAttribute('data-theme',d.theme);syncTheme();
    }
  });
  syncTheme();

  function step(){
    var idx = ay*N+ax, s = cells[idx];
    dir = s ? (dir+3)&3 : (dir+1)&3;   // on lit turn left, on dark turn right
    cells[idx] = s^1;
    age[idx] = clock;
    ax += DX[dir]; ay += DY[dir];
    // wrap toroidally — keeps the highway on the capped grid
    if(ax<0)ax=N-1; else if(ax>=N)ax=0;
    if(ay<0)ay=N-1; else if(ay>=N)ay=0;
    // auto-reset when the highway runs long, for an eternal loop
    if(++reset>14000){ init(); }
  }

  function paint(){
    var c=clock;
    for(var i=0,p=0;i<cells.length;i++,p+=4){
      if(cells[i]){
        var d=c-age[i]; if(d<0)d+=65536;
        var t = d>MAXAGE?0:1-(d/MAXAGE);   // recency 0..1
        var k = t>.66?2:(t>.30?1:0);        // depth band
        var col = pal[ t>.92?3:k ];
        data[p]=col[0]; data[p+1]=col[1]; data[p+2]=col[2];
      } else {
        data[p]=C0[0]; data[p+1]=C0[1]; data[p+2]=C0[2];
      }
    }
    // ant head — the strongest mark against the field in either theme
    var hi=ay*N+ax, hp=hi*4;
    data[hp]=HEAD[0]; data[hp+1]=HEAD[1]; data[hp+2]=HEAD[2];
    ctx.putImageData(img,0,0);
  }

  // ---- sizing (cached; recompute on resize only) ----
  function size(){
    var s = N; // canvas is the grid; CSS scales it up crisply
    cv.width = s; cv.height = s;
    ctx.imageSmoothingEnabled = false;
    paint();
  }

  // ---- single rAF loop, pause on hidden ----
  var raf=0, running=false;
  function frame(){
    if(!running) return;
    for(var k=0;k<STEPS;k++) step();
    clock++;
    paint();
    raf=requestAnimationFrame(frame);
  }
  function start(){ if(running)return; running=true; raf=requestAnimationFrame(frame); }
  function stop(){ running=false; if(raf)cancelAnimationFrame(raf); raf=0; }

  size();
  window.addEventListener('resize', size);

  if(reduce){
    // settle to a static, legible frame: run a fixed budget once, draw, stop.
    for(var q=0;q<11000;q++) step();
    clock++; paint();
    return;
  }

  document.addEventListener('visibilitychange', function(){
    if(document.hidden) stop(); else start();
  });
  start();
})();
</script>
</body>
</html>
