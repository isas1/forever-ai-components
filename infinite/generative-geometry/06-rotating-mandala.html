<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="A 12-fold symmetric mandala of nested rotating polygons in lilac-gold hues that breathe and counter-spin.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotating Mandala</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract);
     the light re-theme is the [data-theme="light"] block. st/fi/ce numbers feed the JS hsl()
     for the polygon strokes, their translucent fills and the pulsing centre disc. */
  :root{
    --gg06-bg:#1B191D; --gg06-cap:#D0C3DF; --gg06-cap-o:.45;
    --gg06-st-s:80; --gg06-st-l:65; --gg06-fi-s:85; --gg06-fi-l:60; --gg06-fi-a:0.18;
    --gg06-ce-s:90; --gg06-ce-l:70;
  }
  :root[data-theme="light"]{
    --gg06-bg:#f4f1f6; --gg06-cap:#825faa; --gg06-cap-o:.8;
    --gg06-st-s:62; --gg06-st-l:42; --gg06-fi-s:70; --gg06-fi-l:52; --gg06-fi-a:0.22;
    --gg06-ce-s:72; --gg06-ce-l:44;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--gg06-bg)}
  #c{display:block;width:100%;height:100%}
  #cap{position:fixed;left:8px;bottom:7px;font:11px/1 ui-monospace,monospace;
       color:var(--gg06-cap);opacity:var(--gg06-cap-o);letter-spacing:.5px;pointer-events:none;user-select:none}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/generative-geometry/06-rotating-mandala.html",
 "title": "Rotating Mandala",
 "description": "12-fold mandala of 5 nested polygon rings that counter-spin, breathe in scale, and cycle through lilac-gold hues. Tap adds a spin impulse.",
 "useWhen": "Ambient backgrounds for creative or generative art contexts. Hero sections needing mesmerizing looping visuals with subtle user interactivity.",
 "avoidWhen": "Light-background UIs (background hardcoded dark lilac-charcoal). Layouts where continuous motion competes with foreground text.",
 "agentPrompt": "Change symmetry from 12 to 8 by setting sym=8, increase ring count to 7, and shift hue base by changing the formula to (t*0.02+ring*45+20)%360. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "symmetry count (sym=12)",
  "ring count (ring<5)",
  "rotation speed (t*0.0003 multiplier)",
  "hue cycle rate (t*0.02+ring*55)",
  "breathe depth (Math.sin*0.06)",
  "polygon sides formula (3+ring)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "IIFE wrapper",
  "prefers-reduced-motion guard (reduce branch)",
  "visibilitychange pause/resume",
  "DPR-aware canvas sizing",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Background color hardcoded in CSS (#1B191D) — must edit to change from dark lilac-charcoal",
  "Reduced-motion renders a single static frame only",
  "Spin impulse on pointerdown decays (spin*=0.96) — no persistent user control"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "mandala",
  "generative",
  "canvas",
  "polygon",
  "radial-symmetry",
  "breathing",
  "counter-spin"
 ]
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="cap">rotating mandala</div>
<script>
(function(){
  const cv=document.getElementById('c'),ctx=cv.getContext('2d');
  let W,H,DPR,spin=0;
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  // theme: every canvas colour is read from the CSS tokens, once at start and once per switch
  const root=document.documentElement;
  const C={bg:'#1B191D',stS:80,stL:65,fiS:85,fiL:60,fiA:'0.18',ceS:90,ceL:70};
  function syncTheme(){
    const cs=getComputedStyle(root);
    C.bg=cs.getPropertyValue('--gg06-bg').trim()||C.bg;
    C.stS=parseFloat(cs.getPropertyValue('--gg06-st-s'))||80;
    C.stL=parseFloat(cs.getPropertyValue('--gg06-st-l'))||65;
    C.fiS=parseFloat(cs.getPropertyValue('--gg06-fi-s'))||85;
    C.fiL=parseFloat(cs.getPropertyValue('--gg06-fi-l'))||60;
    C.fiA=cs.getPropertyValue('--gg06-fi-a').trim()||C.fiA;
    C.ceS=parseFloat(cs.getPropertyValue('--gg06-ce-s'))||90;
    C.ceL=parseFloat(cs.getPropertyValue('--gg06-ce-l'))||70;
  }
  addEventListener('message',e=>{const d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
      root.setAttribute('data-theme',d.theme);syncTheme();if(reduce&&W)draw(0);}
  });
  syncTheme();
  function resize(){DPR=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;
    cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
  function draw(t){
    ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
    const s=Math.min(W,H)*0.46;
    ctx.save();ctx.translate(W/2,H/2);
    const sym=12;
    const breathe=1+Math.sin(t*0.0009)*0.06;
    for(let ring=0;ring<5;ring++){
      const rad=s*(0.22+ring*0.18)*breathe;
      const rot=t*0.0003*(ring%2?-1:1)*(1+ring*0.3)+spin;
      const hue=(t*0.02+ring*55)%360;
      for(let i=0;i<sym;i++){
        const a=rot+i*(Math.PI*2/sym);
        const x=Math.cos(a)*rad,y=Math.sin(a)*rad;
        ctx.save();ctx.translate(x,y);ctx.rotate(a+t*0.0006);
        const sz=s*(0.10-ring*0.012)*(1+Math.sin(t*0.0012+ring)*0.18);
        ctx.strokeStyle='hsl('+hue+','+C.stS+'%,'+C.stL+'%)';
        ctx.fillStyle='hsla('+((hue+30)%360)+','+C.fiS+'%,'+C.fiL+'%,'+C.fiA+')';
        ctx.lineWidth=1.4;
        ctx.beginPath();
        const sides=3+ring;
        for(let k=0;k<=sides;k++){const an=k/sides*Math.PI*2;
          const px=Math.cos(an)*sz,py=Math.sin(an)*sz;k===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}
        ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
      }
    }
    // center
    ctx.fillStyle='hsl('+((t*0.04)%360)+','+C.ceS+'%,'+C.ceL+'%)';
    ctx.beginPath();ctx.arc(0,0,s*0.06*(1+Math.sin(t*0.002)*0.2),0,7);ctx.fill();
    ctx.restore();
  }
  let raf;
  function loop(t){if(!reduce){spin*=0.96;draw(t);}raf=requestAnimationFrame(loop);}
  function start(){cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);}
  addEventListener('resize',resize);
  cv.addEventListener('pointerdown',()=>spin+=0.5);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAnimationFrame(raf);else start();});
  resize();if(reduce)draw(0);else start();
})();
</script>
</body>
</html>
