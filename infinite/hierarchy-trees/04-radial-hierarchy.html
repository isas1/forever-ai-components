<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Radial hierarchy - six divisions on an inner ring with their teams on an outer ring, spokes running back to a central hub; the whole diagram turns slowly while the selection walks division by division and a caption names the teams under it.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radial Hierarchy</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  :root{
    --pro-bg:#0d1117;
    --pro-surface:#161b22;
    --pro-border:rgba(255,255,255,.08);
    --pro-text:#e6edf3;
    --pro-muted:#8b949e;
    --pro-accent:#A68D3F;
    --pro-font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --rhx-dim:color-mix(in srgb,var(--pro-text) 33%,transparent);
  }
  :root[data-theme="light"]{--pro-bg:#f6f8fa;--pro-surface:#fff;--pro-border:rgba(0,0,0,.08);--pro-text:#1f2328;--pro-muted:#59636e;--pro-accent:#6f5d21;--rhx-dim:color-mix(in srgb,var(--pro-text) 48%,transparent)}
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--pro-bg)}
  .rhx-stage{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;
    padding:3.6vmin 3.6vmin clamp(16px,3vmin,24px);font-family:var(--pro-font);color:var(--pro-text)}
  .rhx-head{display:flex;align-items:baseline;gap:1.6vmin;flex:none;min-width:0}
  .rhx-title{font-size:clamp(10px,2.4vmin,14px);font-weight:700;white-space:nowrap}
  .rhx-sub{margin-left:auto;font-size:clamp(7px,1.6vmin,10px);color:var(--pro-muted);
    font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
  /* square box so the 0-100 SVG grid stays circular at any tile size */
  .rhx-mid{flex:1;min-height:0;container-type:size;display:grid;place-items:center;margin:1.2vmin 0}
  .rhx-svg{width:100%;height:100%;width:min(100cqw,100cqh);height:min(100cqw,100cqh)}
  .rhx-ring{fill:none;stroke:var(--pro-border);stroke-width:.35;stroke-dasharray:1.4 1.8}
  .rhx-spin{transform-box:view-box;transform-origin:50% 50%;animation:rhx-rot 96s linear infinite}
  .rhx-stage.paused .rhx-spin{animation-play-state:paused}
  @keyframes rhx-rot{to{transform:rotate(360deg)}}
  .rhx-div{opacity:.5;transition:opacity .45s}
  .rhx-div.on{opacity:1}
  .rhx-sp{stroke:var(--rhx-dim);stroke-width:.55;stroke-linecap:round;transition:stroke .45s,stroke-width .45s}
  .rhx-div.on .rhx-sp{stroke:var(--pro-accent);stroke-width:.9}
  .rhx-tw{stroke:var(--rhx-dim);stroke-width:.35;stroke-linecap:round;transition:stroke .45s}
  .rhx-div.on .rhx-tw{stroke:color-mix(in srgb,var(--pro-accent) 70%,transparent)}
  .rhx-b{fill:var(--pro-bg);stroke:var(--rhx-dim);stroke-width:.6;transition:stroke .45s,fill .45s}
  .rhx-div.on .rhx-b{fill:var(--pro-accent);stroke:var(--pro-accent)}
  .rhx-l{fill:var(--rhx-dim);transition:fill .45s}
  .rhx-div.on .rhx-l{fill:color-mix(in srgb,var(--pro-accent) 85%,transparent)}
  .rhx-hub{fill:var(--pro-accent)}
  .rhx-hub2{fill:none;stroke:var(--pro-accent);stroke-width:.4;opacity:.4}
  /* the caption names whichever division is lit */
  .rhx-dock{flex:none;display:flex;align-items:center;gap:clamp(5px,1.6vmin,11px);min-width:0;
    background:var(--pro-surface);border:1px solid var(--pro-border);border-radius:10px;
    padding:clamp(5px,1.6vmin,11px) clamp(7px,2vmin,14px)}
  .rhx-swatch{flex:none;width:clamp(6px,1.8vmin,10px);height:clamp(6px,1.8vmin,10px);
    border-radius:50%;background:var(--pro-accent)}
  .rhx-nm{font-size:clamp(8px,1.9vmin,12px);font-weight:700;white-space:nowrap}
  .rhx-teams{font-size:clamp(6.5px,1.5vmin,9.5px);color:var(--pro-muted);font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .rhx-ct{margin-left:auto;flex:none;font-size:clamp(6.5px,1.5vmin,9.5px);font-weight:700;
    color:var(--pro-accent);font-variant-numeric:tabular-nums;white-space:nowrap}
  .cap{position:fixed;left:8px;bottom:6px;font:600 10px/1 ui-monospace,Menlo,monospace;
    color:var(--pro-muted);opacity:.45;letter-spacing:.08em;text-transform:uppercase;
    user-select:none;pointer-events:none}
  @media (max-width:300px){ .rhx-teams{display:none} }
  @media (prefers-reduced-motion:reduce){
    .rhx-spin{animation:none}
    .rhx-div,.rhx-sp,.rhx-tw,.rhx-b,.rhx-l{transition:none}
  }
</style>

<body>
  <div class="rhx-stage" id="rhxStage" role="img"
       aria-label="Radial org hierarchy: a central hub with six divisions on an inner ring - Engineering, Revenue, Operations, Design, Data and Support - each fanning out to its teams on an outer ring. The diagram turns slowly while the selection moves division by division and the caption names that division's teams and headcount.">
    <div class="rhx-head">
      <span class="rhx-title">Acme Robotics</span>
      <span class="rhx-sub">6 divisions · 186 people</span>
    </div>
    <div class="rhx-mid">
      <svg class="rhx-svg" id="rhxSvg" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="rhx-ring" cx="50" cy="50" r="25"/>
        <circle class="rhx-ring" cx="50" cy="50" r="41"/>
        <g class="rhx-spin" id="rhxSpin"></g>
        <circle class="rhx-hub2" cx="50" cy="50" r="7.2"/>
        <circle class="rhx-hub" cx="50" cy="50" r="3.9"/>
      </svg>
    </div>
    <div class="rhx-dock">
      <span class="rhx-swatch"></span>
      <span class="rhx-nm" id="rhxNm">Engineering</span>
      <span class="rhx-teams" id="rhxTeams">Platform · Product · Quality</span>
      <span class="rhx-ct" id="rhxCt">58 people</span>
    </div>
  </div>
  <div class="cap" aria-hidden="true">Radial Hierarchy</div>
  <script>(function(){"use strict";
    var root=document.documentElement;
    addEventListener("message",function(e){var d=e.data;
      if(d&&d.type==="forever:theme"&&(d.theme==="light"||d.theme==="dark"))root.setAttribute("data-theme",d.theme);});
    var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    var NS="http://www.w3.org/2000/svg";
    // divisions in ring order — teams become the outer nodes on that spoke
    var divs=[
      {n:"Engineering",p:58,k:["Platform","Product","Quality"]},
      {n:"Revenue",    p:47,k:["Sales","Partnerships"]},
      {n:"Operations", p:37,k:["Finance","People Ops","Legal"]},
      {n:"Support",    p:19,k:["Frontline","Success"]},
      {n:"Design",     p:14,k:["Brand","Product"]},
      {n:"Data",       p:11,k:["Analytics","ML Platform"]}
    ];
    var R1=25,R2=41,SPREAD=11;                     // ring radii + degrees between sibling teams
    var spin=document.getElementById("rhxSpin"),stage=document.getElementById("rhxStage");
    if(!spin)return;
    function el(t,a){ var n=document.createElementNS(NS,t); for(var k in a) n.setAttribute(k,a[k]); return n; }
    function pt(deg,r){ var a=deg*Math.PI/180; return [50+Math.cos(a)*r,50+Math.sin(a)*r]; }

    var groups=divs.map(function(d,i){
      var base=-90+i*(360/divs.length),g=el("g",{class:"rhx-div"}),b=pt(base,R1);
      g.appendChild(el("line",{class:"rhx-sp",x1:50,y1:50,x2:b[0].toFixed(2),y2:b[1].toFixed(2)}));
      d.k.forEach(function(_,j){
        var a=base+(j-(d.k.length-1)/2)*SPREAD,l=pt(a,R2);
        g.appendChild(el("line",{class:"rhx-tw",x1:b[0].toFixed(2),y1:b[1].toFixed(2),
                                 x2:l[0].toFixed(2),y2:l[1].toFixed(2)}));
        g.appendChild(el("circle",{class:"rhx-l",cx:l[0].toFixed(2),cy:l[1].toFixed(2),r:1.35}));
      });
      g.appendChild(el("circle",{class:"rhx-b",cx:b[0].toFixed(2),cy:b[1].toFixed(2),r:2.3}));
      spin.appendChild(g);
      return g;
    });

    var nm=document.getElementById("rhxNm"),tm=document.getElementById("rhxTeams"),
        ct=document.getElementById("rhxCt");
    function pick(i){
      groups.forEach(function(g,n){ g.classList.toggle("on",n===i); });
      var d=divs[i];
      nm.textContent=d.n;
      tm.textContent=d.k.join(" · ");
      ct.textContent=d.k.length+" teams · "+d.p+" people";
    }

    if(reduce){ pick(0); return; }                 // static: hub, all spokes, one division lit

    var i=0,timer=null;
    function advance(){ pick(i); i=(i+1)%divs.length; }
    function play(){ if(!timer) timer=setInterval(advance,2600); }
    function halt(){ clearInterval(timer); timer=null; }
    document.addEventListener("visibilitychange",function(){
      stage.classList.toggle("paused",document.hidden);
      document.hidden?halt():play();
    });
    advance(); play();
  })();
  </script>
</body>
</html>
