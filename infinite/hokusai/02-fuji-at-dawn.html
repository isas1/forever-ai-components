<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Fuji at Dawn — Ukiyo-e Wave &amp; Mountain. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fuji at Dawn</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (night-to-dawn sky);
     the light re-theme is the fine-wind-clear-morning sky in [data-theme="light"] */
  :root{
    --hok02-bg:#0d2347;
    --hok02-sky0:#0d2347; --hok02-sky1:#1b3a6b; --hok02-sky2:#2e5c9a; --hok02-sky3:#d96a7a; --hok02-sky4:#e9a6ad;
    --hok02-sun0:#fbf8f0; --hok02-sun1:#e9a6ad; --hok02-sun2:#d96a7a; --hok02-sun-glow:rgba(217,106,122,.5);
    --hok02-cone:#0d2347; --hok02-line:#1a1714; --hok02-snow:#fbf8f0;
    --hok02-cloud:rgba(243,234,214,.85); --hok02-cloud-line:rgba(26,23,20,.25);
    --hok02-cap:#1a1714; --hok02-cap-o:.5;
  }
  :root[data-theme="light"]{
    --hok02-bg:#f6f2ea;
    --hok02-sky0:#aecbe4; --hok02-sky1:#cfe0ee; --hok02-sky2:#e8eef4; --hok02-sky3:#f4cdc7; --hok02-sky4:#f9e7de;
    --hok02-sun0:#fffaf0; --hok02-sun1:#f0b8a8; --hok02-sun2:#d96a7a; --hok02-sun-glow:rgba(217,106,122,.28);
    --hok02-cone:#2e5c9a; --hok02-line:#1a1714; --hok02-snow:#fbf8f0;
    --hok02-cloud:rgba(255,255,255,.92); --hok02-cloud-line:rgba(26,23,20,.3);
    --hok02-cap:#1a1714; --hok02-cap-o:.62;
  }
  html,body{margin:0;height:100%;background:var(--hok02-bg);overflow:hidden}
  #hok02-stage{position:fixed;inset:0;width:100%;height:100%;overflow:hidden}
  .hok02-sky{position:absolute;inset:0;background:linear-gradient(180deg,var(--hok02-sky0) 0%,var(--hok02-sky1) 30%,var(--hok02-sky2) 55%,var(--hok02-sky3) 88%,var(--hok02-sky4) 100%);animation:hok02-cycle 16s ease-in-out infinite}
  @keyframes hok02-cycle{0%,100%{filter:hue-rotate(0deg) brightness(.9)}50%{filter:hue-rotate(-12deg) brightness(1.12)}}
  .hok02-sun{position:absolute;width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 40% 40%,var(--hok02-sun0),var(--hok02-sun1) 60%,var(--hok02-sun2) 100%);left:62%;top:55%;box-shadow:0 0 38px 10px var(--hok02-sun-glow);animation:hok02-rise 16s ease-in-out infinite}
  @keyframes hok02-rise{0%,100%{transform:translateY(50px);opacity:.4}50%{transform:translateY(-30px);opacity:1}}
  .hok02-cone{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:36vmin solid transparent;border-right:36vmin solid transparent;border-bottom:44vmin solid var(--hok02-cone);filter:drop-shadow(0 -2px 0 var(--hok02-line))}
  .hok02-snow{position:absolute;bottom:31vmin;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14vmin solid transparent;border-right:14vmin solid transparent;border-bottom:16vmin solid var(--hok02-snow)}
  .hok02-cloud{position:absolute;height:16px;border-radius:14px;background:var(--hok02-cloud);box-shadow:0 0 0 2px var(--hok02-cloud-line);animation:hok02-drift linear infinite}
  @keyframes hok02-drift{from{transform:translateX(-180px)}to{transform:translateX(110vw)}}
  .hok02-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--hok02-cap);opacity:var(--hok02-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none;z-index:5}
  @media (prefers-reduced-motion: reduce){.hok02-sky,.hok02-sun,.hok02-cloud{animation:none!important}}
</style>

</head>
<body>
<div id="hok02-stage" role="img" aria-label="Red Fuji at dawn: a flat woodblock cone of indigo with a white snow cap, the sky cycling from night to beni-pink morning while a sun rises behind and clouds drift in flat bands.">
  <div class="hok02-sky"></div>
  <div class="hok02-sun"></div>
  <div class="hok02-cone"></div>
  <div class="hok02-snow"></div>
  <div class="hok02-cloud" style="top:18%;width:120px;animation-duration:19s;"></div>
  <div class="hok02-cloud" style="top:30%;width:80px;animation-duration:26s;animation-delay:-8s;"></div>
  <div class="hok02-cloud" style="top:12%;width:150px;animation-duration:32s;animation-delay:-15s;"></div>
</div>
<div class="hok02-cap">Fuji at Dawn</div>
<script>
(function(){
  "use strict";
  // live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}.
  // All colours are CSS tokens, so flipping the attribute is the whole repaint.
  var root=document.documentElement;
  addEventListener('message', function(e){
    var d=e.data;
    if(d && d.type==='forever:theme' && (d.theme==='light'||d.theme==='dark')) root.setAttribute('data-theme', d.theme);
  });
})();
</script>
</body>
</html>
