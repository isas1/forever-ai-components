<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Thirty-Six Views of Fuji — Ukiyo-e Wave &amp; Mountain. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thirty-Six Views of Fuji</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark defaults; light lifts all three views to a high-key daylight woodblock.
     Scenes are built in JS: syncTheme() re-reads these and rebuilds. m- morning, s- storm, w- wave. */
  :root{
    --hok09-bg:#f3ead6; --hok09-cap:#0d2347; --hok09-cap-o:.5;
    --hok09-m-paper:#f3ead6; --hok09-m-sky:#aecbe4; --hok09-m-band:#e9a6ad; --hok09-m-sun:#d96a7a;
    --hok09-m-fuji:#1b3a6b; --hok09-m-fuji-line:#0d2347; --hok09-m-snow:#f3ead6; --hok09-m-sea:#2e5c9a;
    --hok09-m-cloud:#f3ead6; --hok09-m-bird:#1a1714;
    --hok09-s-bg:#1b2740; --hok09-s-veil:#0d2347; --hok09-s-fuji:#10294f; --hok09-s-fuji-line:#0a1c38;
    --hok09-s-snow:#aecbe4; --hok09-s-bolt:#d96a7a; --hok09-s-bolt2:#e9a6ad; --hok09-s-rain:#6f9fcf; --hok09-s-sea:#0d2347;
    --hok09-w-bg:#cfe0ee; --hok09-w-fuji:#1b3a6b; --hok09-w-snow:#f3ead6; --hok09-w-wave:#1b3a6b;
    --hok09-w-line:#0a1c38; --hok09-w-foam:#fbf8f0;
  }
  :root[data-theme="light"]{
    --hok09-bg:#faf6ee; --hok09-cap:#1a1714; --hok09-cap-o:.6;
    --hok09-m-paper:#faf6ee; --hok09-m-sky:#cfe0ee; --hok09-m-band:#f4cdc7; --hok09-m-sun:#d96a7a;
    --hok09-m-fuji:#6f9fcf; --hok09-m-fuji-line:#2e5c9a; --hok09-m-snow:#fbf8f0; --hok09-m-sea:#a6c4de;
    --hok09-m-cloud:#ffffff; --hok09-m-bird:#1a1714;
    --hok09-s-bg:#dfe6ee; --hok09-s-veil:#c3d3e4; --hok09-s-fuji:#7d9dc4; --hok09-s-fuji-line:#2e5c9a;
    --hok09-s-snow:#fbf8f0; --hok09-s-bolt:#c0392f; --hok09-s-bolt2:#d96a7a; --hok09-s-rain:#4e79ad; --hok09-s-sea:#8fb3d6;
    --hok09-w-bg:#f0f6fb; --hok09-w-fuji:#4e79ad; --hok09-w-snow:#fbf8f0; --hok09-w-wave:#7ba0cd;
    --hok09-w-line:#2e5c9a; --hok09-w-foam:#ffffff;
  }
  html,body{margin:0;height:100%;background:var(--hok09-bg);overflow:hidden}
  #hok09-stage{position:fixed;inset:0;width:100%;height:100%}
  #hok09-svg{width:100%;height:100%;display:block}
  .hok09-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--hok09-cap);opacity:var(--hok09-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none;z-index:5}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/hokusai/09-thirty-six-views.html",
 "title": "Thirty-Six Views of Fuji",
 "description": "Three ukiyo-e SVG scenes — morning Fuji, stormy lightning, great wave — auto cross-fade every 5s with per-scene live animation.",
 "useWhen": "Art-themed hero backgrounds, Japanese aesthetic UIs, ambient gallery displays cycling historical scenes.",
 "avoidWhen": "Contexts requiring text legibility over the background; low-end devices running many concurrent SVG animations.",
 "agentPrompt": "Change scene dwell time from 5 to 8 seconds by editing `switchAt = t + 5` to `switchAt = t + 8`, and add a fourth scene builder into the `builders` array. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "scene dwell duration (switchAt = t + 5)",
  "cross-fade speed (0.6s transition)",
  "lightning flash threshold (f2 > 0.92)",
  "wave crest height (crest * 230)",
  "color palette per scene builder",
  "rain line count (i < 50)",
  "view cadence (every 3.4 s)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "IIFE wrapper",
  "prefers-reduced-motion guard and static fallback",
  "visibilitychange pause/resume",
  "getBBox flush before opacity rAF",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Lightning flicker is sine-wave driven — not truly random; can feel repetitive on long loops",
  "Rain positions fixed at load time — reposition requires scene rebuild",
  "SVG inline style transitions require modern browser (all fine in practice)"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "woodblock",
  "japanese",
  "cross-fade",
  "svg",
  "ambient",
  "generative"
 ]
}
</script>
</head>
<body>
<div id="hok09-stage" role="img" aria-label="Thirty-six views of Fuji: three flat woodblock scenes — calm morning Fuji, a storm with red lightning, and the great wave — auto cross-fading, Fuji always present near or far.">
  <svg id="hok09-svg" viewBox="0 0 1000 400" preserveAspectRatio="xMidYMid slice"></svg>
</div>
<div class="hok09-cap">Thirty-Six Views of Fuji</div>
<script>
(function(){
  "use strict";
  var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var svg=document.getElementById('hok09-svg'); if(!svg) return;
  var NS="http://www.w3.org/2000/svg";
  function el(tag,attrs){ var e=document.createElementNS(NS,tag); for(var k in attrs) e.setAttribute(k,attrs[k]); return e; }
  var root=document.documentElement;
  var C={};   // every scene colour, read from the tokens above
  function syncTheme(){
    var cs=getComputedStyle(root), g=function(n){ return cs.getPropertyValue('--hok09-'+n).trim(); };
    C.mPaper=g('m-paper'); C.mSky=g('m-sky'); C.mBand=g('m-band'); C.mSun=g('m-sun');
    C.mFuji=g('m-fuji'); C.mFujiLine=g('m-fuji-line'); C.mSnow=g('m-snow'); C.mSea=g('m-sea');
    C.mCloud=g('m-cloud'); C.mBird=g('m-bird');
    C.sBg=g('s-bg'); C.sVeil=g('s-veil'); C.sFuji=g('s-fuji'); C.sFujiLine=g('s-fuji-line');
    C.sSnow=g('s-snow'); C.sBolt=g('s-bolt'); C.sBolt2=g('s-bolt2'); C.sRain=g('s-rain'); C.sSea=g('s-sea');
    C.wBg=g('w-bg'); C.wFuji=g('w-fuji'); C.wSnow=g('w-snow'); C.wWave=g('w-wave');
    C.wLine=g('w-line'); C.wFoam=g('w-foam');
  }
  syncTheme();

  function sceneMorning(){
    var g=el("g",{});
    g.appendChild(el("rect",{x:0,y:0,width:1000,height:400,fill:C.mPaper}));
    g.appendChild(el("rect",{x:0,y:0,width:1000,height:120,fill:C.mSky,opacity:0.6}));
    g.appendChild(el("rect",{x:0,y:120,width:1000,height:60,fill:C.mBand,opacity:0.5}));
    g.appendChild(el("circle",{cx:760,cy:90,r:42,fill:C.mSun}));
    g.appendChild(el("path",{d:"M 320 300 L 500 110 L 680 300 Z",fill:C.mFuji,stroke:C.mFujiLine,"stroke-width":2}));
    g.appendChild(el("path",{d:"M 452 158 L 500 110 L 548 158 L 528 150 L 512 168 L 494 150 L 476 166 Z",fill:C.mSnow}));
    var sea=el("path",{d:"M 0 300 Q 250 270 1000 300 L 1000 400 L 0 400 Z",fill:C.mSea}); g.appendChild(sea);
    var c1=el("rect",{x:120,y:150,width:140,height:14,rx:7,fill:C.mCloud,opacity:0.85}); g.appendChild(c1);
    var c2=el("rect",{x:600,y:180,width:100,height:12,rx:6,fill:C.mCloud,opacity:0.8}); g.appendChild(c2);
    var birds=el("g",{stroke:C.mBird,"stroke-width":2,fill:"none"});
    [[180,80],[210,70],[250,90]].forEach(function(b){ birds.appendChild(el("path",{d:"M "+b[0]+" "+b[1]+" q 8 -8 16 0 q 8 -8 16 0"})); });
    g.appendChild(birds);
    g._anim=function(T){   // mist bands drift across the cone, the tide breathes, the flock crosses
      c1.setAttribute("x",(T*24+120)%1240-180); c2.setAttribute("x",(T*15+700)%1240-180);
      sea.setAttribute("transform","translate(0,"+(Math.sin(T*0.8)*5-5)+")");
      birds.setAttribute("transform","translate("+((T*22)%560-70)+","+Math.sin(T*1.2)*7+")");
    };
    return g;
  }
  function sceneStorm(){
    var g=el("g",{});
    g.appendChild(el("rect",{x:0,y:0,width:1000,height:400,fill:C.sBg}));
    g.appendChild(el("rect",{x:0,y:0,width:1000,height:200,fill:C.sVeil,opacity:0.7}));
    g.appendChild(el("path",{d:"M 300 320 L 500 120 L 700 320 Z",fill:C.sFuji,stroke:C.sFujiLine,"stroke-width":2}));
    g.appendChild(el("path",{d:"M 470 150 L 500 120 L 530 150 L 514 144 L 500 158 L 486 144 Z",fill:C.sSnow}));
    var bolt=el("path",{d:"M 500 130 L 470 230 L 490 230 L 450 320",fill:"none",stroke:C.sBolt,"stroke-width":3,opacity:0});
    g.appendChild(bolt);
    var bolt2=el("path",{d:"M 540 160 L 560 240 L 545 240 L 580 310",fill:"none",stroke:C.sBolt2,"stroke-width":2,opacity:0});
    g.appendChild(bolt2);
    var rain=el("g",{stroke:C.sRain,"stroke-width":1,opacity:0.5});
    for(var i=0;i<50;i++){ var x=Math.random()*1000,y=Math.random()*400; rain.appendChild(el("line",{x1:x,y1:y,x2:x-10,y2:y+24})); }
    g.appendChild(rain);
    g.appendChild(el("path",{d:"M 0 330 Q 500 310 1000 330 L 1000 400 L 0 400 Z",fill:C.sSea}));
    g._anim=function(T){ var on=Math.sin(T*0.9)>0.92?1:0; bolt.setAttribute("opacity",on); bolt2.setAttribute("opacity",on*0.8); };
    return g;
  }
  function sceneWave(){
    var g=el("g",{});
    g.appendChild(el("rect",{x:0,y:0,width:1000,height:400,fill:C.wBg}));
    g.appendChild(el("path",{d:"M 440 250 L 500 200 L 560 250 Z",fill:C.wFuji}));
    g.appendChild(el("path",{d:"M 482 214 L 500 200 L 518 214 Z",fill:C.wSnow}));
    var wave=el("path",{fill:C.wWave,stroke:C.wLine,"stroke-width":3}); g.appendChild(wave);
    var foam=el("path",{fill:"none",stroke:C.wFoam,"stroke-width":5,"stroke-linecap":"round"}); g.appendChild(foam);
    var claws=el("g",{fill:C.wFoam,stroke:C.wLine,"stroke-width":1}); g.appendChild(claws);
    g._anim=function(time){
      var ph=time, d="M 0 360 ", foamPts=[];
      for(var i=0;i<=20;i++){ var u=i/20,x=u*1000,crest=Math.pow(Math.max(0,1-u*1.1),1.5),y=360-crest*230-Math.sin(u*8+ph)*14*(1-u); d+="L "+x.toFixed(0)+" "+y.toFixed(0)+" "; foamPts.push([x,y,crest]); }
      d+="L 1000 400 L 0 400 Z"; wave.setAttribute("d",d);
      var fd="M "+foamPts[0][0]+" "+foamPts[0][1]+" ";
      for(var j=1;j<foamPts.length;j++) fd+="L "+foamPts[j][0]+" "+foamPts[j][1]+" ";
      foam.setAttribute("d",fd);
      while(claws.firstChild) claws.removeChild(claws.firstChild);
      foamPts.forEach(function(p,idx){ if(p[2]>0.5 && idx%2===0){ var r=3+p[2]*5; claws.appendChild(el("circle",{cx:p[0]+Math.sin(ph+idx)*6,cy:p[1]-r-4,r:r})); } });
    };
    return g;
  }
  var builders=[sceneMorning,sceneStorm,sceneWave];
  var currentG=null, animFn=null, current=-1, t=0, switchAt=0;

  function show(idx){
    if(currentG){ var old=currentG; old.style.transition="opacity 0.6s ease"; old.style.opacity="0"; setTimeout(function(){ if(old.parentNode) old.parentNode.removeChild(old); },640); }
    var g=builders[idx](); g.style.opacity="0"; g.style.transition="opacity 0.6s ease";
    svg.appendChild(g); void g.getBBox();
    requestAnimationFrame(function(){ g.style.opacity="1"; });
    currentG=g; animFn=g._anim||null; current=idx; }

  var raf=0, running=false;
  function loop(){ if(!running) return; t+=0.016; if(animFn) animFn(t); if(t>switchAt){ switchAt=t+3.4; show((current+1)%builders.length); } raf=requestAnimationFrame(loop); }
  function start(){ if(running) return; running=true; raf=requestAnimationFrame(loop); }
  function stop(){ running=false; if(raf) cancelAnimationFrame(raf); raf=0; }
  document.addEventListener('visibilitychange', function(){ if(REDUCED) return; if(document.hidden) stop(); else start(); });

  // live re-theme: rebuild the visible scene with the new tokens (scenes bake colours at build time)
  function repaint(){ if(current<0) return;
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    var g=builders[current](); g.style.opacity="1"; svg.appendChild(g);
    currentG=g; animFn=g._anim||null; if(animFn) animFn(t); }
  addEventListener('message', function(e){
    var d=e.data;
    if(d && d.type==='forever:theme' && (d.theme==='light'||d.theme==='dark')){
      root.setAttribute('data-theme', d.theme); syncTheme(); repaint();
    }
  });

  switchAt=2; show(0);
  if(REDUCED){ if(animFn) animFn(0.6); } else start();
})();
</script>
</body>
</html>
