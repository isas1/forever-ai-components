<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta name="description" content="Plum-to-teal neon-glow range slider with a glowing knob and a floating value bubble that tracks the handle.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glow Slider</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  :root{
    --c02-bg:#1E1A1C; --c02-cap:#925D78; --c02-cap-o:.4;
    --c02-track-bg:#2b2226; --c02-grad-a:#5E7A78; --c02-grad-b:#925D78;
    --c02-bub-ink:#fff; --c02-knob:#fff;
  }
  :root[data-theme="light"]{
    --c02-bg:#f6f1f7; --c02-cap:#925D78; --c02-cap-o:.5;
    --c02-track-bg:#e7dde3; --c02-grad-a:#5a7472; --c02-grad-b:#925D78;
    --c02-bub-ink:#fff; --c02-knob:#794d64;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--c02-bg);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .c02-wrap{height:100%;display:flex;align-items:center;justify-content:center}
  .c02-stage{width:min(74vmin,340px)}
  .c02-svg{width:100%;height:auto;overflow:visible}
  .cap{position:fixed;left:10px;bottom:9px;font-size:11px;letter-spacing:.08em;color:var(--c02-cap);opacity:var(--c02-cap-o);text-transform:uppercase}
  .c02-bub{font:700 16px ui-sans-serif,system-ui,sans-serif;fill:var(--c02-bub-ink)}


.c02-stage{position:relative}.c02-range{position:absolute;left:10%;top:58%;width:80%;height:24%;margin:0;opacity:0;cursor:ew-resize;touch-action:none}
.c02-stage:has(.c02-range:focus-visible){outline:2px solid var(--c02-cap);outline-offset:6px;border-radius:12px}
</style>

<body>
<div class="c02-wrap"><div class="c02-stage"><svg class="c02-svg" viewBox="0 0 200 120" aria-hidden="true">
<defs><linearGradient id="c02-fill" x1="0" x2="1"><stop offset="0" stop-color="var(--c02-grad-a)"/><stop offset="1" stop-color="var(--c02-grad-b)"/></linearGradient><filter id="c02-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x="20" y="78" width="160" height="8" rx="4" fill="var(--c02-track-bg)"/><rect id="c02-prog" x="20" y="78" width="64" height="8" rx="4" fill="url(#c02-fill)" filter="url(#c02-glow)"/><g filter="url(#c02-glow)"><path id="c02-bubp" fill="url(#c02-fill)"/><text id="c02-bubt" class="c02-bub" x="84" y="40" text-anchor="middle">40</text></g><circle id="c02-knob" cx="84" cy="82" r="9" fill="var(--c02-knob)" filter="url(#c02-glow)"/></svg>
<input class="c02-range" id="c02-range" type="range" min="0" max="100" value="40" aria-label="Glow slider value"></div></div><div class="cap" aria-hidden="true">Glow Slider</div>
<script>
(function(){
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let demoEnabled=window.__foreverPreview?.demoEnabled!==false,raf=0;
  function stopDemo(){demoEnabled=false;}
  addEventListener('forever:interactive',stopDemo);
  document.addEventListener('pointerdown',stopDemo,{capture:true});
  document.addEventListener('click',stopDemo,{capture:true});
  document.addEventListener('keydown',e=>{if(e.key!=='Tab'&&!e.metaKey&&!e.ctrlKey&&!e.altKey)stopDemo();},{capture:true});
  addEventListener('message',e=>{const d=e.data;if(d?.type==='forever:theme'&&['light','dark'].includes(d.theme)){document.documentElement.dataset.theme=d.theme;syncTheme();}});
  function wake(){if(!document.hidden&&!raf)raf=requestAnimationFrame(frame);}
  document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);raf=0;if(!document.hidden)wake();});
  const input=document.getElementById('c02-range'),prog=document.getElementById('c02-prog'),knob=document.getElementById('c02-knob'),bubt=document.getElementById('c02-bubt'),bubp=document.getElementById('c02-bubp');
  let t=0,target=.4,val=.4;
  function syncTheme(){}
  function paint(){const x=20+160*val,bx=Math.min(Math.max(x,36),164);prog.setAttribute('width',Math.max(0,x-20));knob.setAttribute('cx',x);bubp.setAttribute('d','M'+(bx-15)+' 30 q0 -14 15 -14 q15 0 15 14 q0 12 -10 16 l-5 9 l-5 -9 q-10 -4 -10 -16 z');bubt.setAttribute('x',bx);bubt.textContent=Math.round(val*100);}
  input.addEventListener('input',()=>{stopDemo();target=Number(input.value)/100;if(reduce){val=target;paint();}else wake();});
  function frame(){raf=0;if(document.hidden)return;if(demoEnabled&&!reduce){target=.5+.42*Math.sin(++t*.018);input.value=Math.round(target*100);}
    val=reduce?target:val+(target-val)*.12;if(Math.abs(target-val)<.0001)val=target;paint();if((demoEnabled&&!reduce)||val!==target)wake();
  }
  paint();if(!reduce&&demoEnabled)wake();
})();
</script>
</body>
