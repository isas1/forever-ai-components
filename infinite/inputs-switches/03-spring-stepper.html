<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta name="description" content="Mint plus/minus stepper with a rolling number reel that springs and overshoots between digits on each step.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spring Stepper</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  :root{
    --c03-bg:#06231f; --c03-cap:#5fffcf; --c03-cap-o:.4;
    --c03-btn-bg:#0e3a32; --c03-btn-active:#165247; --c03-btn-ink:#5fffcf;
    --c03-num-bg:#0a2e29; --c03-roll-ink:#eafff8;
    --c03-shadow:rgba(0,0,0,.4);
  }
  :root[data-theme="light"]{
    --c03-bg:#f0faf7; --c03-cap:#007f59; --c03-cap-o:.5;
    --c03-btn-bg:#ffffff; --c03-btn-active:#d7f3e9; --c03-btn-ink:#007f59;
    --c03-num-bg:#e2f5ee; --c03-roll-ink:#0b3b30;
    --c03-shadow:rgba(0,127,89,.18);
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--c03-bg);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .c03-wrap{height:100%;display:flex;align-items:center;justify-content:center}
  .c03-stepper{display:flex;align-items:center;gap:14px;user-select:none}
  .c03-btn{width:54px;height:54px;border-radius:16px;background:var(--c03-btn-bg);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--c03-btn-ink);font-size:30px;font-weight:600;line-height:1;box-shadow:0 6px 18px var(--c03-shadow);transition:transform .12s,background .2s}
  .c03-btn:active{transform:scale(.9);background:var(--c03-btn-active)}
  .c03-num{width:78px;height:74px;overflow:hidden;position:relative;border-radius:14px;background:var(--c03-num-bg)}
  .c03-roll{position:absolute;left:0;width:100%;text-align:center;font-size:46px;font-weight:800;color:var(--c03-roll-ink);line-height:74px;will-change:transform}
  .cap{position:fixed;left:10px;bottom:9px;font-size:11px;letter-spacing:.08em;color:var(--c03-cap);opacity:var(--c03-cap-o);text-transform:uppercase}


.c03-btn{border:0;font-family:inherit}.c03-btn:focus-visible{outline:2px solid var(--c03-btn-ink);outline-offset:4px}
.c03-roll{height:888px}.c03-row{height:74px}.c03-value{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:210px){.c03-stepper{gap:8px}.c03-btn{width:38px;height:48px}.c03-num{width:58px}}
</style>
<script type="application/json" id="forever-agent-meta">

</head>
<body>
<div class="c03-wrap"><div class="c03-stepper" id="c03-stepper"><button type="button" class="c03-btn" id="c03-minus" aria-label="Decrease value">&minus;</button><div class="c03-num" aria-hidden="true"><div class="c03-roll" id="c03-roll"></div></div><output class="c03-value" data-fit-clip-ok id="c03-value" aria-live="polite">4</output><button type="button" class="c03-btn" id="c03-plus" aria-label="Increase value">+</button></div></div><div class="cap" aria-hidden="true">Spring Stepper</div>
<script>
(function(){
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let demoEnabled=window.__foreverPreview?.demoEnabled!==false,raf=0;
  function stopDemo(){demoEnabled=false;}
  addEventListener('forever:interactive',stopDemo);
  document.addEventListener('pointerdown',stopDemo,{capture:true});
  document.addEventListener('click',stopDemo,{capture:true});
  document.addEventListener('keydown',e=>{if(e.key!=='Tab'&&!e.metaKey&&!e.ctrlKey&&!e.altKey)stopDemo();},{capture:true});
  addEventListener('message',e=>{const d=e.data;if(d?.type==='forever:theme'&&['light','dark'].includes(d.theme)){document.documentElement.dataset.theme=d.theme;syncTheme();}});
  function wake(){if(!document.hidden&&!raf)raf=requestAnimationFrame(frame);}
  document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);raf=0;if(!document.hidden)wake();});
  const roll=document.getElementById('c03-roll'),root=document.getElementById('c03-stepper'),output=document.getElementById('c03-value');
  let val=4,disp=4,vel=0,auto=0;
  for(let i=0;i<12;i++){const row=document.createElement('div');row.className='c03-row';row.textContent=i;roll.append(row);}
  function syncTheme(){}
  function paint(){roll.style.transform='translateY('+(-disp*74)+'px)';root.dataset.value=val;}
  function step(d){val=Math.max(0,Math.min(9,val+d));output.value=val;if(reduce){disp=val;vel=0;paint();}else wake();}
  document.getElementById('c03-plus').addEventListener('click',()=>step(1));document.getElementById('c03-minus').addEventListener('click',()=>step(-1));
  function frame(){raf=0;if(document.hidden)return;if(demoEnabled&&!reduce&&++auto>90){auto=0;step(Math.random()>.5?1:-1);}
    vel=(vel+(val-disp)*.16)*.62;disp+=vel;if(Math.abs(val-disp)<.001&&Math.abs(vel)<.001){disp=val;vel=0;}paint();if((demoEnabled&&!reduce)||disp!==val||vel)wake();
  }
  paint();if(!reduce&&demoEnabled)wake();
})();
</script>
</body>
</html>
