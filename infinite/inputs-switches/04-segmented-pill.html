<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta name="description" content="Day/Week/Month/Year segmented control with a slate-to-sage gradient pill that springs and stretches as it slides between options.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Segmented Control</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  :root{
    --c04-bg:#181D1B; --c04-seg-bg:#1e2420; --c04-inset:rgba(0,0,0,.5);
    --c04-pill-a:#4B5560; --c04-pill-b:#5A8C73; --c04-pill-shadow:rgba(90,140,115,.5);
    --c04-opt-ink:#8b9088; --c04-opt-on-ink:#fff;
    --c04-cap:#5A8C73; --c04-cap-o:.45;
  }
  :root[data-theme="light"]{
    --c04-bg:#f1f4f1; --c04-seg-bg:#e3e8e2; --c04-inset:rgba(24,29,27,.12);
    --c04-pill-a:#4B5560; --c04-pill-b:#4c7661; --c04-pill-shadow:rgba(76,118,97,.35);
    --c04-opt-ink:#6c716a; --c04-opt-on-ink:#fff;
    --c04-cap:#4c7661; --c04-cap-o:.5;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--c04-bg);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .c04-wrap{height:100%;display:flex;align-items:center;justify-content:center}
  .c04-seg{position:relative;display:flex;background:var(--c04-seg-bg);border-radius:16px;padding:6px;width:min(80vmin,330px);box-shadow:inset 0 1px 3px var(--c04-inset)}
  .c04-pill{position:absolute;top:6px;height:calc(100% - 12px);border-radius:11px;background:linear-gradient(135deg,var(--c04-pill-a),var(--c04-pill-b));box-shadow:0 4px 14px var(--c04-pill-shadow);transition:none;z-index:0}
  .c04-opt{flex:1;text-align:center;padding:13px 6px;font-size:14px;font-weight:600;color:var(--c04-opt-ink);cursor:pointer;position:relative;z-index:1;transition:color .25s;user-select:none}
  .c04-opt.c04-on{color:var(--c04-opt-on-ink)}
  .cap{position:fixed;left:10px;bottom:9px;font-size:11px;letter-spacing:.08em;color:var(--c04-cap);opacity:var(--c04-cap-o);text-transform:uppercase}
.c04-opt{border:0;background:transparent;font-family:inherit;min-width:0}.c04-opt:focus-visible{outline:2px solid var(--c04-cap);outline-offset:2px;border-radius:8px}@media(max-width:210px){.c04-opt{font-size:12px;padding:12px 2px}}
</style>
<script type="application/json" id="forever-agent-meta">

 "file": "infinite/inputs-switches/04-segmented-pill.html",

 "description": "Slate-to-sage pill slides between four native segment buttons with elastic spring stretch. First input stops automatic cycling; committed selection remains.",
 "useWhen": "Date-range pickers, tab bars, filter controls in dark-themed dashboards or app UIs.",
 "avoidWhen": "Production use without removing the auto-cycle loop. Light-background UIs where the hardcoded dark background clashes.",
 "agentPrompt": "Change options to ['S','M','T','W'] in .c04-opt native buttons, set pill gradient to linear-gradient(135deg,#f97316,#ec4899), slow spring by changing k from 0.18 to 0.10. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "option labels (Day/Week/Month/Year in .opt divs)",
  "pill gradient colors (#4B5560, #5A8C73)",
  "spring stiffness (k=0.18) and damping (damp=0.65)",
  "auto-cycle interval (auto>75)",
  "pill stretch multiplier (vel*40)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "geometry cache (geoms array, measure() on resize only)",
  "visibilitychange pause guard",
  "IIFE wrapper",

  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)",
  "demo-v1 preview lifecycle: initialize demoEnabled from window.__foreverPreview and stop attract work on the window forever:interactive event; retain manual feedback, settling, cleanup and explicit sessions"
 ],
 "knownLimitations": [
  "First deliberate input permanently disables idle demo; manual input, finite feedback and settling remain active. Host demoEnabled=false skips the initial attract cycle.",
  "Light re-theme via the [data-theme=light] token block; catalog bg/accent describe the dark default",
  "No aria-selected or role=tablist — add for full accessibility",
  "State remains local to each mounted instance; format/theme remount preserves takeover, not component values."
 ],
 "tier": "curated",
 "labels": [

</head>
<body>
<div class="c04-wrap">
  <div class="c04-seg" id="c04-seg">
    <div class="c04-pill" id="c04-pill"></div>
    <button type="button" class="c04-opt c04-on" aria-pressed="true">Day</button>
    <button type="button" class="c04-opt" aria-pressed="false">Week</button>
    <button type="button" class="c04-opt" aria-pressed="false">Month</button>
    <button type="button" class="c04-opt" aria-pressed="false">Year</button>
  </div>
</div>
<div class="cap">Segmented Control</div>
<script>
(function(){
  const seg=document.getElementById('c04-seg'),pill=document.getElementById('c04-pill'),opts=[...seg.querySelectorAll('.c04-opt')];
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

  let demoEnabled=window.__foreverPreview?.demoEnabled!==false;
  function stopDemo(){demoEnabled=false;}
  addEventListener('forever:interactive',stopDemo);document.addEventListener('pointerdown',stopDemo,{capture:true});document.addEventListener('click',stopDemo,{capture:true});document.addEventListener('keydown',e=>{if(e.key!=='Tab')stopDemo();},{capture:true});
  let idx=0,cur=0,vel=0,running=true,auto=0,raf=0;
  // cache option geometry once; re-read only on resize (never per-frame -> no reflow)
  let geoms=[];
  function geom(i){return geoms[i];}
  function measure(){geoms=opts.map(o=>({x:o.offsetLeft,w:o.offsetWidth}));}
  function select(i){opts.forEach((o,j)=>{o.classList.toggle('c04-on',j===i);o.setAttribute('aria-pressed',j===i);});idx=i;if(reduce){cur=idx;vel=0;frame();}else wake();}
  opts.forEach((o,i)=>o.addEventListener('click',()=>select(i)));
  function frame(){
    raf=0;if(!running)return;
    if(!geoms.length)measure();   // frame() can win the race with the bootstrap init() below
    auto++;
    if(demoEnabled&&!reduce&&auto>75){auto=0;select((idx+1)%opts.length);}
    const k=0.18,damp=0.65,f=(idx-cur)*k;vel=(vel+f)*damp;cur+=vel;
    // the spring overshoots past both ends (wrapping Year -> Day dips cur below 0): read the
    // geometry from the nearest real pair and let fr run outside 0..1 so the pill still bounces
    const i0=Math.max(0,Math.min(opts.length-2,Math.floor(cur))),a=geom(i0),b=geom(i0+1),fr=cur-i0;
    const x=a.x+(b.x-a.x)*fr, w=a.w+(b.w-a.w)*fr;
    // stretch pill while moving
    const stretch=Math.abs(vel)*40;
    pill.style.left=(x-stretch/2)+'px';pill.style.width=(w+stretch)+'px';
    if((demoEnabled&&!reduce)||Math.abs(cur-idx)>.001||Math.abs(vel)>.001)wake();
  }
  function wake(){if(!raf&&!document.hidden)raf=requestAnimationFrame(frame);}
  function init(){measure();const g=geom(0);pill.style.left=g.x+'px';pill.style.width=g.w+'px';}
  addEventListener('resize',()=>{measure();wake();});
  document.addEventListener('visibilitychange',()=>{running=!document.hidden;cancelAnimationFrame(raf);raf=0;if(running)wake();});
  // live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
  addEventListener('message', function(e){
    var d=e.data;
    if(d && d.type==='forever:theme' && (d.theme==='light'||d.theme==='dark')) document.documentElement.setAttribute('data-theme', d.theme);
  });
  // cancel-before-arm here too: loading in a background tab parks this callback, and the
  // visibilitychange handler above can start a chain first — without the cancel both run
  requestAnimationFrame(()=>{init();if(!reduce&&demoEnabled)wake();});
})();
</script>
</body>
</html>
