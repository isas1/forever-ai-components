<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta name="description" content="Row of three amber rounded checkboxes that fill and draw an animated checkmark stroke as they toggle on and off.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkbox Morph</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  :root{
    --c05-bg:#1a1206; --c05-box-off:#5a4520; --c05-box-on:#ffb02e; --c05-check:#1a1206;
    --c05-cap:#ffb02e; --c05-cap-o:.45;
  }
  :root[data-theme="light"]{
    --c05-bg:#f6f2ea; --c05-box-off:#5a4520; --c05-box-on:#995f00; --c05-check:#f6f2ea;
    --c05-cap:#995f00; --c05-cap-o:.5;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--c05-bg);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .c05-wrap{height:100%;display:flex;align-items:center;justify-content:center;gap:18px}
  .c05-svg{width:min(20vmin,86px);height:auto;cursor:pointer}
  .c05-box{fill:none;stroke:var(--c05-box-off);stroke-width:7;transition:fill .35s,stroke .35s}
  .c05-box.c05-on{fill:var(--c05-box-on);stroke:var(--c05-box-on)}
  .c05-check{fill:none;stroke:var(--c05-check);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
  .cap{position:fixed;left:10px;bottom:9px;font-size:11px;letter-spacing:.08em;color:var(--c05-cap);opacity:var(--c05-cap-o);text-transform:uppercase}

.c05-button{border:0;background:transparent;padding:0;cursor:pointer}.c05-button:focus-visible{outline:2px solid var(--c05-cap);outline-offset:4px;border-radius:10px}@media(prefers-reduced-motion:reduce){.c05-box{transition:none}}
</style>

<body>
<div class="c05-wrap" id="c05-wrap"></div>
<div class="cap">Checkbox Morph</div>
<script>
(function(){
  const wrap=document.getElementById('c05-wrap');
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

  let demoEnabled=window.__foreverPreview?.demoEnabled!==false;
  function stopDemo(){demoEnabled=false;}
  addEventListener('forever:interactive',stopDemo);document.addEventListener('pointerdown',stopDemo,{capture:true});document.addEventListener('click',stopDemo,{capture:true});document.addEventListener('keydown',e=>{if(e.key!=='Tab')stopDemo();},{capture:true});
  const NS='http://www.w3.org/2000/svg';
  const LEN=80; // path length approx
  const boxes=[];
  for(let i=0;i<3;i++){
    const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','0 0 100 100');s.classList.add('c05-svg');s.setAttribute('aria-hidden','true');const button=document.createElement('button');button.type='button';button.className='c05-button';button.setAttribute('aria-label','Option '+(i+1));button.setAttribute('aria-pressed','false');
    const r=document.createElementNS(NS,'rect');r.setAttribute('class','c05-box');r.setAttribute('x','12');r.setAttribute('y','12');r.setAttribute('width','76');r.setAttribute('height','76');r.setAttribute('rx','20');
    const p=document.createElementNS(NS,'path');p.setAttribute('class','c05-check');p.setAttribute('d','M28 52 L44 68 L74 34');
    p.style.strokeDasharray=LEN;p.style.strokeDashoffset=LEN;
    s.appendChild(r);s.appendChild(p);button.append(s);wrap.append(button);
    const o={r,p,button,on:i===0,phase:i*0.9};
    button.addEventListener('click',()=>{toggle(o);if(reduce)o.p.style.strokeDashoffset=o.on?0:LEN;wake();});
    boxes.push(o);render(o);if(o.on)p.style.strokeDashoffset=0;
  }
  function toggle(o){o.on=!o.on;render(o);}
  function render(o){
    o.r.classList.toggle('c05-on',o.on);o.button.setAttribute('aria-pressed',o.on);
  }
  let running=true,clock=0,raf=0;
  function frame(){
    raf=0;if(!running)return;
    clock++;
    boxes.forEach((o)=>{
      if(demoEnabled&&!reduce&&clock%150===Math.floor(o.phase*40)%150){o.on=!o.on;render(o);}
      const tgt=o.on?0:LEN;
      const off=parseFloat(o.p.style.strokeDashoffset);
      o.p.style.strokeDashoffset=reduce||Math.abs(tgt-off)<.01?tgt:off+(tgt-off)*0.18;
    });
    if((demoEnabled&&!reduce)||boxes.some(o=>Math.abs((o.on?0:LEN)-parseFloat(o.p.style.strokeDashoffset))>.01))wake();
  }
  function wake(){if(!raf&&!document.hidden)raf=requestAnimationFrame(frame);}
  document.addEventListener('visibilitychange',()=>{running=!document.hidden;cancelAnimationFrame(raf);raf=0;if(running)wake();});
  // live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
  addEventListener('message', function(e){
    var d=e.data;
    if(d && d.type==='forever:theme' && (d.theme==='light'||d.theme==='dark')) document.documentElement.setAttribute('data-theme', d.theme);
  });
  if(reduce){boxes.forEach(o=>{o.on=true;render(o);o.p.style.strokeDashoffset=0;});}
  else if(demoEnabled)wake();
})();
</script>
</body>
</html>
