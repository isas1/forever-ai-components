<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta name="description" content="Four teal monospace OTP cells with a blinking caret that auto-fill digits with a slide-up bounce then clear and repeat.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OTP Boxes</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  :root{
    --c08-bg:#0a1418; --c08-cell-bg:#10242b; --c08-cell-border:#1c3b44;
    --c08-accent:#3ff0c0; --c08-glow:rgba(63,240,192,.4);
    --c08-cap-o:.45;
  }
  :root[data-theme="light"]{
    --c08-bg:#eef7f5; --c08-cell-bg:#ffffff; --c08-cell-border:#cfe9e0;
    --c08-accent:#0a7d5e; --c08-glow:rgba(10,125,94,.25);
    --c08-cap-o:.5;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--c08-bg);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .c08-wrap{height:100%;display:flex;align-items:center;justify-content:center}
  .c08-row{display:flex;gap:10px}
  .c08-cell{width:46px;height:60px;border-radius:12px;background:var(--c08-cell-bg);border:2px solid var(--c08-cell-border);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;color:var(--c08-accent);position:relative;overflow:hidden;transition:border-color .2s,box-shadow .2s}
  .c08-cell.c08-active{border-color:var(--c08-accent);box-shadow:0 0 14px var(--c08-glow)}
  .c08-caret{position:absolute;width:2px;height:30px;background:var(--c08-accent);opacity:0}
  .c08-cell.c08-active .c08-caret{animation:bl 1s steps(2) infinite}
  @keyframes bl{0%,50%{opacity:1}50.01%,100%{opacity:0}}
  .c08-digit{display:inline-block;transform:translateY(120%);opacity:0}
  .cap{position:fixed;left:10px;bottom:9px;font-size:11px;letter-spacing:.08em;color:var(--c08-accent);opacity:var(--c08-cap-o);text-transform:uppercase;font-family:ui-sans-serif,system-ui,sans-serif}

.c08-cell{font-family:inherit;text-align:center;box-sizing:border-box;outline-offset:3px}.c08-cell:focus{outline:2px solid var(--c08-accent)}@media(max-width:250px){.c08-row{gap:6px}.c08-cell{width:32px;height:46px;font-size:23px}}@media(prefers-reduced-motion:reduce){.c08-cell{transition:none}}
</style>

<body>
<div class="c08-wrap"><div class="c08-row" id="c08-row"></div></div>
<div class="cap">OTP Boxes</div>
<script>
(function(){
  const row=document.getElementById('c08-row'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let demoEnabled=window.__foreverPreview?.demoEnabled!==false,timer=0,pos=0;const cells=[];
  function stopDemo(){demoEnabled=false;clearInterval(timer);timer=0;}
  addEventListener('forever:interactive',stopDemo);document.addEventListener('pointerdown',stopDemo,{capture:true});document.addEventListener('click',stopDemo,{capture:true});document.addEventListener('keydown',e=>{if(e.key!=='Tab')stopDemo();},{capture:true});
  for(let i=0;i<4;i++){const input=document.createElement('input');input.className='c08-cell';input.type='text';input.inputMode='numeric';input.maxLength=1;input.autocomplete=i===0?'one-time-code':'off';input.setAttribute('aria-label','Code digit '+(i+1));input.value=['2','8','4','7'][i];row.append(input);cells.push(input);
    input.addEventListener('beforeinput',e=>{if(e.data&&/\D/.test(e.data))e.preventDefault();});
    input.addEventListener('focus',()=>input.select());
    input.addEventListener('input',()=>{stopDemo();input.value=input.value.replace(/\D/g,'').slice(-1);if(input.value&&i<3)cells[i+1].focus();});
    input.addEventListener('paste',e=>{e.preventDefault();stopDemo();const digits=(e.clipboardData?.getData('text')||'').replace(/\D/g,'').slice(0,4-i);[...digits].forEach((d,j)=>cells[i+j].value=d);cells[Math.min(3,i+digits.length)].focus();});
    input.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!input.value&&i>0){e.preventDefault();cells[i-1].value='';cells[i-1].focus();}else if(e.key==='ArrowLeft'&&i>0){e.preventDefault();cells[i-1].focus();}else if(e.key==='ArrowRight'&&i<3){e.preventDefault();cells[i+1].focus();}});
  }
  // A tap starts a fresh code: the first one clears the demo digits, every tap lands on
  // the first empty box, so digits always go in order. Arrow keys still move freely.
  let fresh=true,tapped=false;
  row.addEventListener('pointerdown',()=>{tapped=true;});
  row.addEventListener('focusin',e=>{
    if(!tapped)return;tapped=false;stopDemo();
    if(fresh){fresh=false;cells.forEach(c=>c.value='');}
    const next=cells.find(c=>!c.value)||cells[3];
    if(e.target!==next)next.focus();
  });
  function startDemo(){if(demoEnabled&&!reduce&&!document.hidden&&!timer)timer=setInterval(()=>{cells[pos%4].value=String(Math.floor(Math.random()*10));pos++;},800);}
  document.addEventListener('visibilitychange',()=>{clearInterval(timer);timer=0;startDemo();});addEventListener('message',e=>{if(e.data?.type==='forever:theme')document.documentElement.dataset.theme=e.data.theme;});startDemo();
})();
</script>
</body>
</html>
