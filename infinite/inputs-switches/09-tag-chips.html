<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Dark rust-toned field that auto-fills and removes rounded colored tag chips with pop-scale spring animation and a blinking cursor.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tag Chips</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  :root{
    --c09-bg:#1C1B1A; --c09-field-bg:#241f1a; --c09-field-border:#3d3327;
    --c09-chip-ink:#fff; --c09-x-bg:rgba(255,255,255,.25);
    --c09-accent:#AE6147; --c09-cap-o:.45;
    --c09-c1:#8C8478; --c09-c2:#db2777; --c09-c3:#6B6B47; --c09-c4:#0891b2; --c09-c5:#ca8a04; --c09-c6:#dc2626;
  }
  :root[data-theme="light"]{
    --c09-bg:#f6f0ec; --c09-field-bg:#ffffff; --c09-field-border:#ddd0c2;
    --c09-chip-ink:#fff; --c09-x-bg:rgba(255,255,255,.25);
    --c09-accent:#9c5740; --c09-cap-o:.5;
    --c09-c1:#8C8478; --c09-c2:#db2777; --c09-c3:#6B6B47; --c09-c4:#0891b2; --c09-c5:#ca8a04; --c09-c6:#dc2626;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--c09-bg);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{height:100%;display:flex;align-items:center;justify-content:center;padding:18px;box-sizing:border-box}
  .field{width:min(82vmin,340px);min-height:120px;background:var(--c09-field-bg);border:2px solid var(--c09-field-border);border-radius:16px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;box-sizing:border-box}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:20px;color:var(--c09-chip-ink);font-size:14px;font-weight:600;transform:scale(0);will-change:transform,opacity}
  .chip .x{width:16px;height:16px;border-radius:50%;background:var(--c09-x-bg);display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1}
  .cursor{width:2px;height:22px;background:var(--c09-accent);align-self:center;animation:bl 1s steps(2) infinite}
  @keyframes bl{0%,50%{opacity:1}50.01%,100%{opacity:0}}
  .cap{position:fixed;left:10px;bottom:9px;font-size:11px;letter-spacing:.08em;color:var(--c09-accent);opacity:var(--c09-cap-o);text-transform:uppercase}
</style>

<body>
<div class="wrap"><div class="field" id="field"><span class="cursor"></span></div></div>
<div class="cap">Tag Chips</div>
<script>
(function(){
  const field=document.getElementById('field'),cursor=field.querySelector('.cursor');
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const words=['design','react','css','motion','ux','svg','dark','grid','type','flow'];
  const cs=getComputedStyle(document.documentElement);
  const colors=['--c09-c1','--c09-c2','--c09-c3','--c09-c4','--c09-c5','--c09-c6'].map(v=>cs.getPropertyValue(v).trim());
  let running=true,timer=0,chips=[];
  function add(){
    const w=words[Math.floor(Math.random()*words.length)];
    const c=document.createElement('span');c.className='chip';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.innerHTML=w+'<span class="x">&times;</span>';
    field.insertBefore(c,cursor);
    requestAnimationFrame(()=>{c.style.transition='transform .4s cubic-bezier(.2,1.5,.4,1)';c.style.transform='scale(1)';});
    chips.push(c);
    c.querySelector('.x').addEventListener('pointerdown',e=>{e.stopPropagation();remove(c);});
  }
  function remove(c){
    c.style.transition='transform .25s,opacity .25s';c.style.transform='scale(0)';c.style.opacity='0';
    chips=chips.filter(x=>x!==c);setTimeout(()=>c.remove(),260);
  }
  function frame(){
    if(!running)return;
    timer++;
    if(timer%32===0){
      if(chips.length>=7){const c=chips[0];remove(c);}
      else add();
    }
    requestAnimationFrame(frame);
  }
  field.addEventListener('pointerdown',()=>{if(chips.length<9)add();});
  document.addEventListener('visibilitychange',()=>{running=!document.hidden;if(running&&!reduce)requestAnimationFrame(frame);});
  // live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
  addEventListener('message', function(e){
    var d=e.data;
    if(d && d.type==='forever:theme' && (d.theme==='light'||d.theme==='dark')) document.documentElement.setAttribute('data-theme', d.theme);
  });
  if(reduce){for(let i=0;i<4;i++)add();chips.forEach(c=>c.style.transform='scale(1)');}
  else requestAnimationFrame(frame);
})();
</script>
</body>
</html>
