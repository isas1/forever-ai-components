<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();

<style>
  :root{
    --c09-bg:#1C1B1A; --c09-field-bg:#241f1a; --c09-field-border:#3d3327;
    --c09-chip-ink:#fff; --c09-x-bg:rgba(255,255,255,.25);
    --c09-accent:#C07E62; --c09-cap-o:.45;
    --c09-c1:#8C8478; --c09-c2:#db2777; --c09-c3:#6B6B47; --c09-c4:#0891b2; --c09-c5:#ca8a04; --c09-c6:#dc2626;
  }
  :root[data-theme="light"]{
    --c09-bg:#f6f0ec; --c09-field-bg:#ffffff; --c09-field-border:#ddd0c2;
    --c09-chip-ink:#fff; --c09-x-bg:rgba(255,255,255,.25);
    --c09-accent:#9c5740; --c09-cap-o:.5;
    --c09-c1:#8C8478; --c09-c2:#db2777; --c09-c3:#6B6B47; --c09-c4:#0891b2; --c09-c5:#ca8a04; --c09-c6:#dc2626;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--c09-bg);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .c09-wrap{height:100%;display:flex;align-items:center;justify-content:center;padding:clamp(8px,4vmin,18px);box-sizing:border-box}
  .c09-field{width:min(100%,340px);min-height:120px;background:var(--c09-field-bg);border:2px solid var(--c09-field-border);border-radius:16px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;box-sizing:border-box}
  .c09-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:20px;color:var(--c09-chip-ink);font-size:14px;font-weight:600;animation:c09-pop .4s cubic-bezier(.2,1.5,.4,1)}
  .c09-chip .c09-x{width:16px;height:16px;border-radius:50%;background:var(--c09-x-bg);display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1}
  .c09-cursor{width:2px;height:22px;background:var(--c09-accent);align-self:center;animation:bl 1s steps(2) infinite}
  @keyframes bl{0%,50%{opacity:1}50.01%,100%{opacity:0}}
  .cap{position:fixed;left:10px;bottom:9px;font-size:11px;letter-spacing:.08em;color:var(--c09-accent);opacity:var(--c09-cap-o);text-transform:uppercase}

.c09-field{max-height:100%;overflow:auto;gap:6px;min-height:min(104px,100%)}
.c09-chip{max-width:100%;padding:6px 9px;box-sizing:border-box;font-size:12px}
.c09-word{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c09-chip .c09-x{border:0;color:inherit;padding:0;flex:none;cursor:pointer}
.c09-entry{display:flex;gap:6px;width:100%;min-width:0}.c09-input{min-width:0;width:100%;border:0;border-bottom:1px solid var(--c09-field-border);background:transparent;color:var(--c09-accent);font:inherit;font-size:12px;padding:6px 0}
.c09-add{border:1px solid var(--c09-accent);border-radius:7px;color:var(--c09-accent);background:transparent;font-size:12px;cursor:pointer;padding:4px 6px}
.c09-input:focus-visible,.c09-add:focus-visible,.c09-x:focus-visible{outline:2px solid var(--c09-accent);outline-offset:2px}
.c09-status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.c09-color1{background:var(--c09-c1)}.c09-color2{background:var(--c09-c2)}.c09-color3{background:var(--c09-c3)}.c09-color4{background:var(--c09-c4)}.c09-color5{background:var(--c09-c5)}.c09-color6{background:var(--c09-c6)}
.c09-removing{animation:c09-out .25s forwards;pointer-events:none}@keyframes c09-pop{from{transform:scale(0)}to{transform:scale(1)}}@keyframes c09-out{to{transform:scale(0);opacity:0}}
.c09-wrap[data-hidden] *{animation-play-state:paused!important}@media(prefers-reduced-motion:reduce){.c09-chip{animation:none}.c09-removing{opacity:0}}
</style>

<body>
<div class="c09-wrap" id="c09-root"><div class="c09-field" id="c09-field" role="group" aria-label="Tags"><form class="c09-entry" id="c09-form"><input class="c09-input" id="c09-input" aria-label="New tag" placeholder="Add tag" maxlength="24" autocomplete="off"><button class="c09-add" type="button">Add</button></form><span class="c09-status" data-fit-clip-ok id="c09-status" role="status"></span></div></div><div class="cap" aria-hidden="true">Tag Chips</div>
<script>
(function(){
  const root=document.getElementById('c09-root'),field=document.getElementById('c09-field'),form=document.getElementById('c09-form'),input=document.getElementById('c09-input'),status=document.getElementById('c09-status');
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches,words=['design','react','css','motion','ux','svg','dark','grid','type','flow'];
  let demoEnabled=window.__foreverPreview?.demoEnabled!==false,timer=0,chips=[];
  function stopDemo(){demoEnabled=false;clearInterval(timer);timer=0;}
  addEventListener('forever:interactive',stopDemo);document.addEventListener('pointerdown',stopDemo,{capture:true});document.addEventListener('click',stopDemo,{capture:true});document.addEventListener('keydown',e=>{if(e.key!=='Tab')stopDemo();},{capture:true});
  function add(word){word=word.trim();if(!word)return false;if(chips.some(c=>c.word.toLowerCase()===word.toLowerCase())){status.textContent='Tag already added';return false;}if(chips.length>=9){status.textContent='Nine tags maximum';return false;}
    const chip=document.createElement('span'),label=document.createElement('span'),button=document.createElement('button');chip.className='c09-chip c09-color'+(chips.length%6+1);chip.word=word;label.className='c09-word';label.textContent=word;button.className='c09-x';button.type='button';button.textContent='×';button.setAttribute('aria-label','Remove '+word);chip.append(label,button);field.insertBefore(chip,form);chips.push(chip);button.addEventListener('click',()=>remove(chip));status.textContent=word+' added';return true;
  }
  function remove(chip){chips=chips.filter(c=>c!==chip);chip.classList.add('c09-removing');if(chip.contains(document.activeElement))input.focus();status.textContent=chip.word+' removed';if(reduce)chip.remove();else setTimeout(()=>chip.remove(),260);}
  function submitTag(){stopDemo();if(add(input.value))input.value='';input.focus();}
  form.addEventListener('submit',e=>{e.preventDefault();submitTag();});form.querySelector('.c09-add').addEventListener('click',submitTag);input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitTag();return;}if(e.key==='Backspace'&&!input.value&&chips.length){e.preventDefault();remove(chips[chips.length-1]);}});
  function startDemo(){if(demoEnabled&&!reduce&&!document.hidden&&!timer)timer=setInterval(()=>{if(chips.length>=7)remove(chips[0]);else{const next=words.find(word=>!chips.some(c=>c.word===word));if(next)add(next);}},900);}
  document.addEventListener('visibilitychange',()=>{root.toggleAttribute('data-hidden',document.hidden);clearInterval(timer);timer=0;startDemo();});
  addEventListener('message',e=>{const d=e.data;if(d?.type==='forever:theme'&&['light','dark'].includes(d.theme))document.documentElement.dataset.theme=d.theme;});
  add('design');add('css');startDemo();
})();
</script>
