<style>
  :root {
    --fc05-bg: #0A0A0A;
    --fc05-surface: #141414;
    --fc05-text: #EDEDEA;
    --fc05-accent: #C7F000;
    --fc05-warn: #FF9900;
    --fc05-trip: #FF4444;
    --fc05-border: rgba(255, 255, 255, 0.08);
  }
  .fc05-wrap * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--fc05-bg);
    color: var(--fc05-text);
    font-family: 'Geist Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .fc05-wrap {
    width: 100%;
    max-width: 440px;
    background: var(--fc05-surface);
    border: 1px solid var(--fc05-border);
    border-radius: 8px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    box-shadow: 0 20px 48px rgba(0, 0, 0, 0.8);
    position: relative;
    user-select: none;
  }
  .fc05-hdr {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
  }
  .fc05-status {
    padding: 2px 8px;
    border-radius: 9999px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
    transition: all 0.2s ease;
  }
  .fc05-st-closed { background: rgba(199, 240, 0, 0.12); color: var(--fc05-accent); border: 1px solid rgba(199, 240, 0, 0.3); }
  .fc05-st-open { background: rgba(255, 68, 68, 0.15); color: var(--fc05-trip); border: 1px solid rgba(255, 68, 68, 0.4); }
  .fc05-st-half { background: rgba(255, 153, 0, 0.15); color: var(--fc05-warn); border: 1px solid rgba(255, 153, 0, 0.4); } .fc05-canvas{
    width: 100%;
    height: 120px;
    display: block;
    background: #0D0D0D;
    border-radius: 4px;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  .fc05-meter {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .fc05-labels {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.45);
  }
  .fc05-bar-track {
    width: 100%;
    height: 6px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }
  .fc05-bar-fill {
    height: 100%;
    width: 15%;
    background: var(--fc05-accent);
    border-radius: 3px;
    transition: width 0.15s ease, background 0.2s ease;
  }

  .fc05-chaos-btn {
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    color: var(--fc05-text);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--fc05-border);
    padding: 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: center;
  }
  .fc05-chaos-btn:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.2);
  }
  .fc05-chaos-btn:focus-visible {
    outline: 2px solid var(--fc05-accent, #C7F000);
    outline-offset: 3px;
  }
  .fc05-chaos-btn:active {
    transform: scale(0.99);
  }
.fc05-inline-1{color:rgba(255,255,255,0.5)}
@media (prefers-reduced-motion: reduce) { .fc05-wrap *, .fc05-wrap *::before, .fc05-wrap *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
.fc05-caption{position:fixed;right:10px;bottom:7px;z-index:5;font-size:9px;opacity:.5;pointer-events:none}
@container fit-22-entropy-chaos-circuit-breaker (max-width:300px){.fc05-wrap{width:calc(100% - 16px);padding:12px;gap:8px}.fc05-hdr{font-size:12px}.fc05-status{font-size:12px;padding:2px 5px}.fc05-canvas{height:78px}.fc05-labels{font-size:12px}.fc05-chaos-btn{font-size:12px;padding:8px}}
@container fit-22-entropy-chaos-circuit-breaker (max-width:210px){.fc05-wrap{padding:6px;gap:4px}.fc05-hdr{display:none}.fc05-canvas{height:44px}.fc05-chaos-btn{font-size:12px;padding:5px 4px}}
body{width:100%;container-type:inline-size;container-name:fit-22-entropy-chaos-circuit-breaker}

<body>
<div class="fc05-wrap" role="region" aria-label="Circuit Breaker Telemetry">
  <div class="fc05-hdr">
    <span class="fc05-inline-1">swarm · circuit_breaker</span>
    <span id="fc05-statusPill" class="fc05-status fc05-st-closed">CLOSED (NORMAL)</span>
  </div>
  
  <canvas class="fc05-canvas fc05-canvas" id="fc05-hist" width="396" height="120"></canvas>

  <div class="fc05-meter">
    <div class="fc05-labels">
      <span>LATENCY FAULT ENTROPY</span>
      <span id="fc05-failRate">3.2% / THRESH: 40%</span>
    </div>
    <div class="fc05-bar-track">
      <div id="fc05-barFill" class="fc05-bar-fill"></div>
    </div>
  </div>

  <button id="fc05-injectBtn" class="fc05-chaos-btn" type="button">INJECT CHAOS LATENCY SPIKE</button>
</div>

<div class="fc05-caption" aria-hidden="true">Entropy Chaos Circuit Breaker</div>
<script>
(()=>{
  const cv = document.getElementById('fc05-hist');
  const ctx = cv.getContext('2d');
  const statusPill = document.getElementById('fc05-statusPill');
  const failRate = document.getElementById('fc05-failRate');
  const barFill = document.getElementById('fc05-barFill');
  const injectBtn = document.getElementById('fc05-injectBtn');

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let running = !document.hidden,raf=0,demoEnabled=window.__foreverPreview?.demoEnabled!==false;
  function stopDemo(){demoEnabled=false;}
  addEventListener('forever:interactive',stopDemo);document.addEventListener('pointerdown',stopDemo,{capture:true});document.addEventListener('click',stopDemo,{capture:true});document.addEventListener('keydown',e=>{if(e.key!=='Tab')stopDemo();},{capture:true});
  function wake(){if(!raf&&!document.hidden)raf=requestAnimationFrame(update);}
  document.addEventListener('visibilitychange', () => { running = !document.hidden; cancelAnimationFrame(raf);raf=0;if(running)wake(); });

  const buckets = new Array(30).fill(12);
  let entropy = 12;
  let state = 'CLOSED'; // CLOSED, OPEN, HALF-OPEN
  let openTimer = 0;

  injectBtn.addEventListener('click', () => {
    entropy = Math.min(100, entropy + 45);
    if (entropy > 50 && state !== 'OPEN') {
      tripBreaker();
    }
    if(reduce)update();else wake();
  });

  function tripBreaker() {
    state = 'OPEN';
    statusPill.className = 'fc05-status fc05-st-open';
    statusPill.textContent = 'OPEN (TRIPPED)';
    barFill.style.background = 'var(--fc05-trip)';
    openTimer = 180; // ~3 seconds at 60fps
  }

  function halfOpenBreaker() {
    state = 'HALF-OPEN';
    statusPill.className = 'fc05-status fc05-st-half';
    statusPill.textContent = 'HALF-OPEN (TESTING)';
    barFill.style.background = 'var(--fc05-warn)';
  }

  function resetBreaker() {
    state = 'CLOSED';
    statusPill.className = 'fc05-status fc05-st-closed';
    statusPill.textContent = 'CLOSED (NORMAL)';
    barFill.style.background = 'var(--fc05-accent)';
  }

  let tick = 0;
  function update() {
    raf=0;if (!running) return;
    tick++;

    // Decay entropy only during demo or a user-started simulation.
    if(!reduce){
    if (state === 'OPEN') {
      openTimer--;
      entropy = Math.max(25, entropy - 0.25);
      if (openTimer <= 0) halfOpenBreaker();
    } else if (state === 'HALF-OPEN') {
      entropy = Math.max(10, entropy - 0.35);
      if (entropy <= 18) resetBreaker();
    } else if(demoEnabled&&!reduce) {
      entropy = Math.max(8, entropy + (Math.random() - 0.52) * 2);
    }

    if ((demoEnabled||state!=="CLOSED")&&tick % 4 === 0) {
      buckets.shift();
      const jitter = state === 'OPEN' ? 80 + Math.random() * 40 : entropy * (0.8 + Math.random() * 0.4);
      buckets.push(Math.min(110, jitter));
    }

    }
    failRate.textContent = `${entropy.toFixed(1)}% / THRESH: 40%`;
    barFill.style.width = `${Math.min(100, entropy)}%`;

    // Render Canvas Histogram
    ctx.clearRect(0, 0, cv.width, cv.height);
    const bw = cv.width / buckets.length;

    // Threshold line
    ctx.strokeStyle = 'rgba(255, 68, 68, 0.3)';
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    const thY = cv.height - (40 / 120) * cv.height;
    ctx.moveTo(0, thY);
    ctx.lineTo(cv.width, thY);
    ctx.stroke();
    ctx.setLineDash([]);

    buckets.forEach((val, i) => {
      const bh = (val / 120) * cv.height;
      const x = i * bw;
      const y = cv.height - bh;

      let col = '#C7F000';
      if (val > 60) col = '#FF4444';
      else if (val > 35) col = '#FF9900';

      ctx.fillStyle = col;
      ctx.fillRect(x + 1, y, bw - 2, bh);
    });

    if(!reduce&&(demoEnabled||state!=="CLOSED"))wake();
  }
  update();
})();
</script>
</body>
