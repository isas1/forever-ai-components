<script>(()=>{const p=new URLSearchParams(location.search).get("theme");if(p)document.documentElement.dataset.theme=p})();window.addEventListener("message",e=>{if(e.data?.type==="forever:theme")document.documentElement.dataset.theme=e.data.theme});</script>
<style>
  :root {
    --fc08-bg: #0A0A0A;
    --fc08-surface: #141414;
    --fc08-text: #EDEDEA;
    --fc08-muted: #7A7A75;
    --fc08-accent: #C7F000;
    --fc08-border: rgba(255, 255, 255, 0.08);
  }
  [data-theme="light"] {
    --fc08-bg: #F4F4F0;
    --fc08-surface: #FFFFFF;
    --fc08-text: #181816;
    --fc08-muted: #82827C;
    --fc08-accent: #6E8800;
    --fc08-border: rgba(0, 0, 0, 0.08);

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--fc08-bg);
    color: var(--fc08-text);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .fc08-root {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    position: relative;
    user-select: none;
  }
  .fc08-vernier-card {
    width: 100%;
    max-width: 360px;
    background: var(--fc08-surface);
    border: 1px solid var(--fc08-border);
    border-radius: 12px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .fc08-card-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--fc08-border);
    padding-bottom: 8px;
  }
  .fc08-title-text {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  .fc08-temp-readout {
    font-size: 13px;
    font-weight: 700;
    color: var(--fc08-accent);
  }
  .fc08-curve-box {
    width: 100%;
    height: 90px;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--fc08-border);
    border-radius: 8px;
    overflow: hidden;
    position: relative;
  }
  .fc08-curve-canvas {
    width: 100%;
    height: 90px;
    display: block;
  }
  .fc08-vernier-rail-wrap {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .fc08-rail-labels {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--fc08-muted);
  }
  .fc08-slider-rail {
    position: relative;
    width: 100%;
    height: 28px;
    cursor: pointer;
    display: flex;
    align-items: center;
  }
  .fc08-slider-rail:focus-visible {
    outline: 2px solid var(--fc08-accent, #C7F000);
    outline-offset: 3px;
  }
  .fc08-rail-groove {
    position: absolute;
    left: 0;
    right: 0;
    height: 6px;
    background: #1c1c1c;
    border-radius: 3px;
    border: 1px solid var(--fc08-border);
  }
  .fc08-rail-fill {
    position: absolute;
    left: 0;
    height: 6px;
    background: var(--fc08-accent);
    border-radius: 3px;
    width: 70%;
  }
  .fc08-thumb {
    position: absolute;
    width: 20px;
    height: 24px;
    background: #252525;
    border: 2px solid var(--fc08-accent);
    border-radius: 4px;
    left: 70%;
    transform: translateX(-50%);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
  }
  .fc08-thumb:active {
    cursor: grabbing;
    transform: translateX(-50%) scale(1.1);
  }
  .fc08-thumb-pip {
    width: 2px;
    height: 12px;
    background: var(--fc08-accent);
    border-radius: 1px;
  }
  .fc08-bottom-stats {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid var(--fc08-border);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
  }
  .fc08-stat-metric {
    color: var(--fc08-accent);
    font-weight: 700;
  }
  .fc08-caption {
    position: absolute;
    bottom: 8px;
    right: 12px;
    font-size: 10px;
    letter-spacing: 0.05em;
    color: var(--fc08-muted);
    opacity: 0.65;
    pointer-events: none;
  }
  @container fit-23-vernier-quantum-temperature-slider (max-width:300px){
    .fc08-root{padding:8px}.fc08-vernier-card{width:calc(100% - 8px);padding:12px;gap:8px}.fc08-title-text{font-size:12px}.fc08-temp-readout{font-size:12px}.fc08-curve-box,.fc08-curve-canvas{height:58px}.fc08-rail-labels,.fc08-bottom-stats{font-size:12px}.fc08-bottom-stats{padding:6px 8px}.fc08-caption{display:none}
  }
@media (prefers-reduced-motion: reduce) { .fc08-root *, .fc08-root *::before, .fc08-root *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
@container fit-23-vernier-quantum-temperature-slider (max-width:210px){.fc08-vernier-card{padding:6px;gap:3px}.fc08-title-text{display:none}.fc08-card-header{justify-content:flex-end;padding-bottom:4px}.fc08-curve-box,.fc08-curve-canvas{height:30px}.fc08-vernier-rail-wrap{gap:2px}.fc08-rail-labels{font-size:12px}.fc08-rail-labels span:nth-child(2){display:none}.fc08-slider-rail{height:24px}.fc08-bottom-stats{padding:5px 6px}.fc08-bottom-stats span:first-child{display:none}}
body{width:100%;container-type:inline-size;container-name:fit-23-vernier-quantum-temperature-slider}

<body>
<div class="fc08-root" role="region" aria-label="Vernier Quantum Temperature · Forever Input">
  <div class="fc08-vernier-card">
    <div class="fc08-card-header">
      <span class="fc08-title-text">LLM SAMPLING TEMPERATURE</span>
      <span class="fc08-temp-readout" id="fc08-temp-display">T = 0.70</span>
    </div>

    <div class="fc08-curve-box">
      <canvas class="fc08-curve-canvas" id="fc08-curve"></canvas>
    </div>

    <div class="fc08-vernier-rail-wrap">
      <div class="fc08-rail-labels">
        <span>0.00 (GREEDY)</span>
        <span>0.70 (CREATIVE)</span>
        <span>2.00 (CHAOS)</span>
      </div>
      <div class="fc08-slider-rail" id="fc08-slider-track" role="slider" tabindex="0" aria-label="Temperature" aria-valuemin="0" aria-valuemax="2" aria-valuenow="0.70">
        <div class="fc08-rail-groove"></div>
        <div class="fc08-rail-fill" id="fc08-rail-fill"></div>
        <div class="fc08-thumb" id="fc08-slider-thumb">
          <div class="fc08-thumb-pip"></div>
        </div>
      </div>
    </div>

    <div class="fc08-bottom-stats">
      <span>ENTROPY DENSITY:</span>
      <span class="fc08-stat-metric" id="fc08-entropy-val">4.28 BITS · TOP-P: 0.95</span>
    </div>
  </div>
</div>
<div class="fc08-caption" aria-hidden="true">Vernier Quantum Temperature</div>

<script>
(()=>{
  let tempNorm = 0.35; // Maps 0.0 to 2.0 (0.35 = 0.70)
  let isDragging = false;
  let userInteracted = window.__foreverPreview?.demoEnabled===false;
  let running = !document.hidden, raf = 0;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const track = document.getElementById("fc08-slider-track");
  const thumb = document.getElementById("fc08-slider-thumb");
  const fill = document.getElementById("fc08-rail-fill");
  const tempDisplay = document.getElementById("fc08-temp-display");
  const entropyVal = document.getElementById("fc08-entropy-val");
  const canvas = document.getElementById("fc08-curve");
  const ctx = canvas ? canvas.getContext("2d") : null;

  let w = 320, h = 90;
  function resize() {
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    w = canvas.clientWidth || 320;
    h = canvas.clientHeight || 90;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    if (ctx) ctx.scale(dpr, dpr);
  }
  resize();

  function updateTemp(norm) {
    tempNorm = Math.max(0, Math.min(1.0, norm));
    if (track) track.setAttribute("aria-valuenow", (tempNorm * 2).toFixed(2));
    const tVal = (tempNorm * 2.0).toFixed(2);
    if (thumb) thumb.style.left = (tempNorm * 100) + "%";
    if (fill) fill.style.width = (tempNorm * 100) + "%";
    if (tempDisplay) tempDisplay.textContent = `T = ${tVal}`;

    const entropy = (tempNorm * 8.4).toFixed(2);
    if (entropyVal) entropyVal.textContent = `${entropy} BITS · TOP-P: ${(0.8 + tempNorm * 0.19).toFixed(2)}`;

    drawCurve();
  }

  function drawCurve() {
    if (!ctx) return;
    ctx.clearRect(0, 0, w, h);

    const accent = getComputedStyle(document.documentElement).getPropertyValue("--fc08-accent").trim() || "#C7F000";

    const cx = w * 0.5;
    const sigma = 15 + tempNorm * 75; // Spread widening as temperature increases
    const peak = h * 0.75;

    ctx.beginPath();
    ctx.moveTo(10, h - 10);

    for (let x = 10; x <= w - 10; x += 4) {
      const dist = (x - cx);
      const y = (h - 12) - Math.exp(-(dist * dist) / (2 * sigma * sigma)) * peak;
      ctx.lineTo(x, y);
    }

    ctx.strokeStyle = accent;
    ctx.lineWidth = 2;
    ctx.stroke();

    // Baseline axis
    ctx.beginPath();
    ctx.moveTo(10, h - 10);
    ctx.lineTo(w - 10, h - 10);
    ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function handlePointer(e) {
    if (!track) return;
    const rect = track.getBoundingClientRect();
    const x = e.clientX - rect.left;
    updateTemp(x / rect.width);
  }

  if (track) {
    track.addEventListener("keydown", (e) => {
      const step = e.shiftKey ? 0.1 : 0.02;
      if (e.key === "ArrowRight" || e.key === "ArrowUp") updateTemp(tempNorm + step);
      else if (e.key === "ArrowLeft" || e.key === "ArrowDown") updateTemp(tempNorm - step);
      else if (e.key === "Home") updateTemp(0); else if (e.key === "End") updateTemp(1); else return;
      e.preventDefault(); userInteracted = true;
    });
    track.addEventListener("pointerdown", (e) => {
      userInteracted = true;
      isDragging = true;
      handlePointer(e);
      track.setPointerCapture(e.pointerId);
    });
    track.addEventListener("pointermove", (e) => {
      if (isDragging) handlePointer(e);
    });
    track.addEventListener("pointerup", (e) => {
      isDragging = false;
      if(track.hasPointerCapture(e.pointerId))track.releasePointerCapture(e.pointerId);
    });
    track.addEventListener("pointercancel", () => {
      isDragging = false;
    });
  }

  let osc = 0;
  function stopDemo(){userInteracted=true;cancelAnimationFrame(raf);raf=0;}
  addEventListener('forever:interactive',stopDemo);
  document.addEventListener('pointerdown',stopDemo,{capture:true});
  document.addEventListener('click',stopDemo,{capture:true});
  document.addEventListener('keydown',e=>{if(e.key!=='Tab')stopDemo();},{capture:true});
  function tick() {
    raf=0;if (!running || reduce || userInteracted) return;
    osc += 0.02;updateTemp(0.35 + Math.sin(osc) * 0.2);
    raf=requestAnimationFrame(tick);
  }
  document.addEventListener("visibilitychange", () => { running = !document.hidden;cancelAnimationFrame(raf);raf=0;if(running&&!reduce&&!userInteracted)raf=requestAnimationFrame(tick); });
  addEventListener('resize',()=>{resize();drawCurve();});
  addEventListener('message',e=>{if(e.data?.type==='forever:theme')drawCurve();});
  updateTemp(0.35);
  if(!reduce&&!userInteracted)raf=requestAnimationFrame(tick);
})();
</script>
</body>
