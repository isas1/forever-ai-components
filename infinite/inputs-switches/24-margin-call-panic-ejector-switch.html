    width: 100%;

    align-items: center;
    border-bottom: 1px solid var(--ig08-border);
    padding-bottom: 6px;
    font-size: 12px;
  }
  .ig08-terminal-title {
    font-weight: 700;
    color: var(--ig08-coral);
    letter-spacing: 0.05em;
  }
  .ig08-margin-ratio {
    font-size: 12px;
    color: var(--ig08-yellow);
  }
  .ig08-switch-mount {
    position: relative;
    width: 150px;
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ig08-hazard-ring {
    position: absolute;
    width: 144px;
    height: 144px;
    border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, #181C22 0deg 20deg, #2D1408 20deg 40deg);
    border: 2px solid var(--ig08-border);
  }
  .ig08-eject-btn {
    position: relative;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #FF5A1F 0%, #A82500 100%);
    border: 3px solid #FF8052;
    box-shadow: 0 8px 20px rgba(255, 69, 0, 0.4), inset 0 2px 4px #FFFFFF;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    outline: none;
    transition: transform 0.1s ease, box-shadow 0.2s ease;
    z-index: 3;
  }
  .ig08-eject-btn:active {
    transform: scale(0.92) translateY(3px);
  }
  .ig08-ejected .ig08-eject-btn {
    background: radial-gradient(circle at 35% 35%, #252830 0%, #111317 100%);
    border-color: #404652;
    box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.8);
  }
  .ig08-btn-label {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: #FFFFFF;
  }
  .ig08-ejected .ig08-btn-label {
    color: #727B8A;
  }
  .ig08-card-footer {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0, 0, 0, 0.35);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 12px;
  }
  .ig08-status-text {
    font-weight: 700;
    color: var(--ig08-mint);
  }
  .ig08-ejected .ig08-status-text {
    color: var(--ig08-coral);
  }
  .ig08-caption {
    position: absolute;
    bottom: 8px;
    right: 12px;
    font-size: 10px;
    letter-spacing: 0.05em;
    color: #6C7A89;
    opacity: 0.65;
    pointer-events: none;
    font-family: ui-monospace, monospace;

<body>
<div class="ig08-root" id="ig08-root-box" role="region" aria-label="Margin Call Panic Ejector · The Interest Game Button">
  <div class="ig08-ejector-card">
    <div class="ig08-card-header">
      <span class="ig08-terminal-title">PANIC LIQUIDATION EJECTOR</span>
      <span class="ig08-margin-ratio">MAINT: 84.2%</span>
    </div>

    <div class="ig08-switch-mount">
      <div class="ig08-hazard-ring"></div>
      <button class="ig08-eject-btn" id="ig08-eject-btn" aria-label="Engage Panic Liquidation">
        <span class="ig08-btn-label" id="ig08-btn-label">EJECT ALL</span>
      </button>
    </div>

    <div class="ig08-card-footer">
      <span>POSITION STATE:</span>
      <span class="ig08-status-text" id="ig08-status-text">LEVERAGED LONG · 50X</span>
    </div>
  </div>
</div>
<div class="ig08-caption" aria-hidden="true">Panic Liquidation Ejector</div>

<script>
(()=>{
  let isEjected = false;
  let userInteracted = window.__foreverPreview?.demoEnabled===false;
  let running = true;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const btn = document.getElementById("ig08-eject-btn");
  const rootBox = document.getElementById("ig08-root-box");
  const btnLabel = document.getElementById("ig08-btn-label");
  const statusText = document.getElementById("ig08-status-text");

  function setEjected(val) {
    isEjected = val;
    if (rootBox) rootBox.classList.toggle("ig08-ejected", isEjected);
    if(btn)btn.setAttribute("aria-pressed",isEjected);
    if (btnLabel) btnLabel.textContent = isEjected ? "RE-ENTER" : "EJECT ALL";
    if (statusText) statusText.textContent = isEjected ? "ALL POSITIONS CLOSED (100% FIAT)" : "LEVERAGED LONG · 50X";
  }

  if (btn) {
    btn.addEventListener("click", () => {
      userInteracted = true;
      setEjected(!isEjected);
    });
  }

  let demoTimer=0;
  function stopDemo(){userInteracted=true;clearInterval(demoTimer);demoTimer=0;}
  addEventListener('forever:interactive',stopDemo);document.addEventListener('pointerdown',stopDemo,{capture:true});document.addEventListener('click',stopDemo,{capture:true});document.addEventListener('keydown',e=>{if(e.key!=='Tab')stopDemo();},{capture:true});
  function startDemo(){if(!userInteracted&&!reduce&&!document.hidden&&!demoTimer)demoTimer=setInterval(()=>{setEjected(!isEjected);},4000);}
  document.addEventListener('visibilitychange',()=>{clearInterval(demoTimer);demoTimer=0;startDemo();});
  setEjected(false);startDemo();
})();
</script>
</body>
