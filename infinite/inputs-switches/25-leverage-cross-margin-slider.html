<style>
  :root {
    --ig10-ink: #0B0E14;
    --ig10-coral: #FF4500;
    --ig10-mint: #00D084;
    --ig10-yellow: #FFB703;

  [data-theme="light"] {

    --ig10-coral: #D03400;
    --ig10-mint: #00875A;

  html, body {

    justify-content: center;
    padding: 20px;

    position: relative;

  .ig10-leverage-card {
    width: 100%;
    max-width: 350px;
    background: var(--ig10-ink);
    border: 1px solid var(--ig10-border);
    border-radius: 12px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8);
    padding: 22px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .ig10-card-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--ig10-border);
    padding-bottom: 6px;
  }
  .ig10-head-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--ig10-coral);
    letter-spacing: 0.04em;
  }
  .ig10-lev-mult {
    font-size: 16px;
    font-weight: 800;
    color: var(--ig10-mint);
  }
  .ig10-high-lev .ig10-lev-mult {
    color: var(--ig10-coral);
  }
  .ig10-buffer-display {
    width: 100%;
    height: 60px;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid var(--ig10-border);
    border-radius: 6px;
    padding: 8px 12px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .ig10-buffer-labels {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #8C9BA8;
  }
  .ig10-liquid-bar-track {
    position: relative;
    width: 100%;
    height: 10px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 5px;
    overflow: hidden;
  }
  .ig10-liquid-bar-fill {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    background: linear-gradient(90deg, var(--ig10-mint), var(--ig10-yellow) 60%, var(--ig10-coral));
    width: 50%;
    border-radius: 5px;
  }
  .ig10-slider-well {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .ig10-slider-ticks {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #8C9BA8;
  }
  .ig10-slider-track {
    position: relative;
    width: 100%;
    height: 26px;
    cursor: pointer;
    display: flex;
    align-items: center;
  }
  .ig10-groove {
    position: absolute;
    left: 0;
    right: 0;
    height: 6px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 3px;
    border: 1px solid var(--ig10-border);
  }
  .ig10-groove-fill {
    position: absolute;
    left: 0;
    height: 6px;
    background: var(--ig10-mint);
    border-radius: 3px;
    width: 32%;
  }
  .ig10-high-lev .ig10-groove-fill {
    background: var(--ig10-coral);
  }
  .ig10-slider-thumb {
    position: absolute;
    width: 24px;
    height: 24px;
    background: #1C222B;
    border: 2px solid var(--ig10-mint);
    border-radius: 50%;
    left: 32%;
    transform: translateX(-50%);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
    cursor: grab;
  }
  .ig10-high-lev .ig10-slider-thumb {
    border-color: var(--ig10-coral);
  }
  .ig10-slider-thumb:active {
    cursor: grabbing;
    transform: translateX(-50%) scale(1.15);
  }
  .ig10-footer-metric {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0, 0, 0, 0.35);
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 12px;
  }
  .ig10-price-tag {
    color: var(--ig10-yellow);
    font-weight: 700;
  }
  .ig10-caption {
    position: absolute;
    bottom: 8px;
    right: 12px;
    font-size: 10px;
    letter-spacing: 0.05em;
    color: #6C7A89;
    opacity: 0.65;
    pointer-events: none;
    font-family: ui-monospace, monospace;
  }
@media (prefers-reduced-motion: reduce) { .ig10-root *, .ig10-root *::before, .ig10-root *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
@container fit-25-leverage-cross-margin-slider (max-width:300px){.ig10-root{padding:8px}.ig10-leverage-card{width:calc(100% - 8px);padding:12px;gap:8px}.ig10-head-title{font-size:12px}.ig10-lev-mult{font-size:21px}.ig10-buffer-display{height:46px}.ig10-footer-metric{padding:6px;font-size:12px}.ig10-caption{display:none}}
@container fit-25-leverage-cross-margin-slider (max-width:210px){.ig10-leverage-card{padding:8px;gap:5px}.ig10-head-title{display:none}.ig10-card-head{justify-content:flex-end}.ig10-buffer-display{height:38px}.ig10-footer-metric{font-size:12px}.ig10-footer-metric span:first-child{display:none}}
body{width:100%;container-type:inline-size;container-name:fit-25-leverage-cross-margin-slider}

.ig10-slider-track{touch-action:none}.ig10-slider-track:focus-visible{outline:2px solid var(--ig10-yellow);outline-offset:4px}

<body>
<div class="ig10-root" id="ig10-root-box" role="region" aria-label="Cross-Margin Leverage Multiplier · The Interest Game Input">
  <div class="ig10-leverage-card">
    <div class="ig10-card-head">
      <span class="ig10-head-title">CROSS-MARGIN LEVERAGE</span>
      <span class="ig10-lev-mult" id="ig10-lev-display">25x</span>
    </div>

    <div class="ig10-buffer-display">
      <div class="ig10-buffer-labels">
        <span>CURRENT: $134.75</span>
        <span id="ig10-buffer-pct">SAFETY BUFFER: 4.2%</span>
      </div>
      <div class="ig10-liquid-bar-track">
        <div class="ig10-liquid-bar-fill" id="ig10-buffer-bar"></div>
      </div>
    </div>

    <div class="ig10-slider-well">
      <div class="ig10-slider-ticks">
        <span>1x</span>
        <span>25x</span>
        <span>50x</span>
        <span>75x</span>
        <span>100x</span>
      </div>
      <div class="ig10-slider-track" id="ig10-track" role="slider" tabindex="0" aria-label="Leverage" aria-valuemin="1" aria-valuemax="100" aria-valuenow="26">
        <div class="ig10-groove"></div>
        <div class="ig10-groove-fill" id="ig10-groove-fill"></div>
        <div class="ig10-slider-thumb" id="ig10-thumb"></div>
      </div>
    </div>

    <div class="ig10-footer-metric">
      <span>LIQUIDATION PRICE:</span>
      <span class="ig10-price-tag" id="ig10-liq-price">$129.09 (-4.2%)</span>
    </div>
  </div>
</div>
<div class="ig10-caption" aria-hidden="true">Cross-Margin Leverage Slider</div>

<script>
(()=>{
  let norm = 0.25; // 1x to 100x
  let isDragging = false;
  let userInteracted = window.__foreverPreview?.demoEnabled===false;
  let running = !document.hidden,raf=0;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const track = document.getElementById("ig10-track");
  const thumb = document.getElementById("ig10-thumb");
  const grooveFill = document.getElementById("ig10-groove-fill");
  const bufferBar = document.getElementById("ig10-buffer-bar");
  const levDisplay = document.getElementById("ig10-lev-display");
  const bufferPct = document.getElementById("ig10-buffer-pct");
  const liqPrice = document.getElementById("ig10-liq-price");
  const rootBox = document.getElementById("ig10-root-box");

  function updateLev(val) {
    norm = Math.max(0, Math.min(1.0, val));
    if (track) track.setAttribute("aria-valuenow", String(Math.round(1 + norm * 99)));
    const lev = Math.round(1 + norm * 99);
    if (thumb) thumb.style.left = (norm * 100) + "%";
    if (grooveFill) grooveFill.style.width = (norm * 100) + "%";
    if (levDisplay) levDisplay.textContent = `${lev}x`;

    const isHigh = lev > 50;
    if (rootBox) rootBox.classList.toggle("ig10-high-lev", isHigh);

    // Safety buffer shrinks inversely
    const buffer = (100 / lev).toFixed(1);
    const liq = (134.75 * (1 - 1 / lev)).toFixed(2);
    if (bufferPct) bufferPct.textContent = `SAFETY BUFFER: ${buffer}%`;
    if (bufferBar) bufferBar.style.width = Math.min(100, buffer * 4) + "%";
    if (liqPrice) liqPrice.textContent = `$${liq} (-${buffer}%)`;
  }

  function handlePointer(e) {
    if (!track) return;
    const rect = track.getBoundingClientRect();
    const x = e.clientX - rect.left;
    updateLev(x / rect.width);
  }

  if (track) {
    track.addEventListener("keydown", (e) => {
      const step = e.shiftKey ? 0.05 : 0.01;
      if (e.key === "ArrowRight" || e.key === "ArrowUp") updateLev(norm + step);
      else if (e.key === "ArrowLeft" || e.key === "ArrowDown") updateLev(norm - step);
      else if (e.key === "Home") updateLev(0); else if (e.key === "End") updateLev(1); else return;
      e.preventDefault(); userInteracted = true;
    });
    track.addEventListener("pointerdown", (e) => {
      userInteracted = true;
      isDragging = true;
      handlePointer(e);
      track.setPointerCapture(e.pointerId);
    });
    track.addEventListener("pointermove", (e) => {
      if (isDragging) handlePointer(e);
    });
    track.addEventListener("pointerup", (e) => {
      isDragging = false;
      if(track.hasPointerCapture(e.pointerId))track.releasePointerCapture(e.pointerId);
    });
    track.addEventListener("pointercancel", () => {
      isDragging = false;
    });
  }

  function stopDemo(){userInteracted=true;cancelAnimationFrame(raf);raf=0;}
  addEventListener('forever:interactive',stopDemo);document.addEventListener('pointerdown',stopDemo,{capture:true});document.addEventListener('click',stopDemo,{capture:true});document.addEventListener('keydown',e=>{if(e.key!=='Tab')stopDemo();},{capture:true});
  let osc = 0;
  function loop() {
    raf=0;if (!running || reduce || userInteracted) return;
    if (!reduce && !userInteracted && !isDragging) {
      osc += 0.02;
      const v = 0.25 + Math.sin(osc) * 0.18;
      updateLev(v);
    }
    if (!reduce&&!userInteracted) raf=requestAnimationFrame(loop);
  }

  document.addEventListener("visibilitychange", () => { running = !document.hidden; cancelAnimationFrame(raf);raf=0;if (running&&!reduce&&!userInteracted) raf=requestAnimationFrame(loop); });

  updateLev(0.25);
  if(!reduce&&!userInteracted)raf=requestAnimationFrame(loop);
})();
</script>
