<html lang="en">

<meta name="description" content="Ternary mix pad: drag a puck inside a triangle to blend three sources, with tension struts and live percentages.">
<title>Barycentric Tri-Mix Pad</title>
<script>
/* theme hook: ?theme=light|dark is applied before first paint */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();

<style>
  :root{
    --bg:#0A0A0A; --bg-sunken:#070707; --surface:#111111;
    --text:#EDEDEA; --text-muted:#8A8A85; --text-faint:#5A5A56;
    --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.14);
    --accent:#C7F000;
    --font-mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  :root[data-theme="light"]{
    --bg:#FAFAF8; --bg-sunken:#F1F1EC; --surface:#F4F4F0;
    --text:#1A1A18; --text-muted:#6B6B66; --text-faint:#9A9A93;
    --border:rgba(0,0,0,0.08); --border-strong:rgba(0,0,0,0.14);
    --accent:#4D7A00;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
  .tmx-tile{
    position:absolute;inset:0;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;
    gap:min(2vmin,8px);padding:clamp(8px,4.6vmin,20px) clamp(8px,5.5vmin,24px) clamp(14px,8vmin,30px);
    background:var(--surface);color:var(--text);font-family:var(--font-mono);
    font-size:clamp(7px,3.1vmin,11px);user-select:none;-webkit-user-select:none;
  }
  .tmx-tile *{box-sizing:border-box}
  .tmx-head{display:flex;justify-content:space-between;align-items:center;gap:6px;white-space:nowrap}
  .tmx-label{color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em}
  .tmx-reset{
    background:transparent;color:var(--text-muted);border:1px solid var(--border);border-radius:5px;
    font:inherit;font-size:.9em;padding:2px 6px;cursor:pointer;touch-action:manipulation;
  }
  .tmx-reset:hover{color:var(--text);border-color:var(--text-muted)}
  .tmx-reset:focus-visible,.tmx-pad:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tmx-pad{flex:1;min-height:0;position:relative;touch-action:none;cursor:crosshair;border-radius:5px}
  .tmx-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;font-family:var(--font-mono)}
  .tmx-tri{fill:var(--bg-sunken);stroke:var(--border-strong);stroke-width:1.5;stroke-linejoin:round}
  .tmx-grid{stroke:var(--border);stroke-width:.75;stroke-dasharray:2 3;opacity:.7}
  .tmx-strut{stroke-width:1.5;stroke-dasharray:3 3}
  .tmx-ta{stroke:var(--text);fill:var(--text)}
  .tmx-tb{stroke:var(--text-muted);fill:var(--text-muted)}
  .tmx-tc{stroke:var(--text-faint);fill:var(--text-faint)}
  .tmx-vt{font-size:10px;font-weight:700;stroke:none}
  .tmx-puck{fill:var(--surface);stroke:var(--accent);stroke-width:2}
  .tmx-dot{fill:var(--accent)}
  .tmx-meters{display:grid;grid-template-columns:repeat(3,1fr);gap:min(1.8vmin,6px);font-weight:700}
  .tmx-chip{display:flex;justify-content:space-between;gap:2px;padding:min(1.3vmin,4px) min(2vmin,6px);border-radius:5px;background:var(--bg-sunken);border:1px solid var(--border)}
  .tmx-ca{color:var(--text)} .tmx-cb{color:var(--text-muted)} .tmx-cc{color:var(--text-faint)}
  .tmx-cap{position:absolute;left:min(3vmin,10px);bottom:min(2vmin,7px);font:clamp(6px,2.4vmin,9px) var(--font-mono);color:var(--text-muted);opacity:.55;pointer-events:none}
</style>

</head>
<body>
<div class="tmx-tile" role="group" aria-label="Barycentric tri-mix pad">
  <div class="tmx-head"><span class="tmx-label">Ternary Balance</span><button class="tmx-reset" id="tmx-ctr" type="button">CENTER 33%</button></div>
  <div class="tmx-pad" id="tmx-pad" tabindex="0" role="slider" aria-label="Warm, sync, deep mix" aria-valuemin="0" aria-valuemax="100" aria-valuenow="33" aria-valuetext="Warm 33%, Sync 33%, Deep 34%">
    <svg class="tmx-svg" viewBox="0 0 268 205" aria-hidden="true">
      <polygon class="tmx-tri" points="134,18 242,184 26,184"/>
      <g class="tmx-grid"><line x1="98" y1="73.3" x2="170" y2="73.3"/><line x1="62" y1="128.6" x2="206" y2="128.6"/><line x1="98" y1="73.3" x2="62" y2="184"/><line x1="170" y1="73.3" x2="206" y2="184"/></g>
      <line class="tmx-strut tmx-ta" id="tmx-la" x1="134" y1="18" x2="134" y2="128"/>
      <line class="tmx-strut tmx-tb" id="tmx-lb" x1="242" y1="184" x2="134" y2="128"/>
      <line class="tmx-strut tmx-tc" id="tmx-lc" x1="26" y1="184" x2="134" y2="128"/>
      <circle class="tmx-ta" cx="134" cy="18" r="5"/><text class="tmx-ta tmx-vt" x="134" y="10" text-anchor="middle">WARM</text>
      <circle class="tmx-tb" cx="242" cy="184" r="5"/><text class="tmx-tb tmx-vt" x="246" y="198" text-anchor="end">SYNC</text>
      <circle class="tmx-tc" cx="26" cy="184" r="5"/><text class="tmx-tc tmx-vt" x="22" y="198" text-anchor="start">DEEP</text>
      <g id="tmx-puck" transform="translate(134,128.6)"><circle class="tmx-puck" r="14"/><circle class="tmx-dot" r="5"/></g>
    </svg>
  </div>
  <div class="tmx-meters">
    <div class="tmx-chip tmx-ca"><span>W</span><span id="tmx-va">33%</span></div>
    <div class="tmx-chip tmx-cb"><span>S</span><span id="tmx-vb">33%</span></div>
    <div class="tmx-chip tmx-cc"><span>D</span><span id="tmx-vc">34%</span></div>
  </div>
</div>
<div class="tmx-cap" aria-hidden="true">Tri-Mix Pad</div>
<script>
(() => {
  addEventListener('message', (e) => {
    const d = e.data;
    if (d && d.type === 'forever:theme' && (d.theme === 'light' || d.theme === 'dark')) document.documentElement.setAttribute('data-theme', d.theme);
  });
  const $ = (id) => document.getElementById(id);
  const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const A = { x: 134, y: 18 }, B = { x: 242, y: 184 }, C = { x: 26, y: 184 };
  const W = 268, H = 205;
  const pad = $('tmx-pad'), puck = $('tmx-puck'), lines = [$('tmx-la'), $('tmx-lb'), $('tmx-lc')];
  const vals = [$('tmx-va'), $('tmx-vb'), $('tmx-vc')];
  let wA = 1 / 3, wB = 1 / 3, wC = 1 / 3;
  let curX = 134, curY = 128.6, vx = 0, vy = 0, t = 0;
  let dragging = false, raf = 0, last = 0;
  let demoEnabled = window.__foreverPreview?.demoEnabled !== false;

  function clampBary(px, py) {
    const det = (B.y - C.y) * (A.x - C.x) + (C.x - B.x) * (A.y - C.y);
    let u = ((B.y - C.y) * (px - C.x) + (C.x - B.x) * (py - C.y)) / det;
    let v = ((C.y - A.y) * (px - C.x) + (A.x - C.x) * (py - C.y)) / det;
    let w = 1 - u - v;
    u = Math.max(0, u); v = Math.max(0, v); w = Math.max(0, w);
    const s = u + v + w || 1;
    return [u / s, v / s, w / s];
  }
  // the svg letterboxes (meet), so map through the scale actually used
  function fromPointer(e) {
    const r = pad.getBoundingClientRect(), k = Math.min(r.width / W, r.height / H) || 1;
    const px = (e.clientX - r.left - (r.width - W * k) / 2) / k;
    const py = (e.clientY - r.top - (r.height - H * k) / 2) / k;
    [wA, wB, wC] = clampBary(px, py);
    kick();
  }
  const target = () => [wA * A.x + wB * B.x + wC * C.x, wA * A.y + wB * B.y + wC * C.y];

  function draw() {
    const x = curX.toFixed(1), y = curY.toFixed(1);
    puck.setAttribute('transform', 'translate(' + x + ',' + y + ')');
    lines.forEach((l) => { l.setAttribute('x2', x); l.setAttribute('y2', y); });
    const pA = Math.round(wA * 100), pB = Math.round(wB * 100), pC = 100 - pA - pB;
    vals[0].textContent = pA + '%'; vals[1].textContent = pB + '%'; vals[2].textContent = pC + '%';
    pad.setAttribute('aria-valuenow', pA);
    pad.setAttribute('aria-valuetext', 'Warm ' + pA + '%, Sync ' + pB + '%, Deep ' + pC + '%');
  }

  // time-based: dt is 1.0 at 60 fps, clamped after tab sleep
  function tick(now) {
    raf = 0;
    if (document.hidden) return;
    const dt = last ? Math.min(now - last, 50) / 16.667 : 1;
    last = now;
    if (demoEnabled && !dragging) {
      t += 0.022 * dt;
      const a = 0.33 + Math.sin(t) * 0.25, b = 0.33 + Math.sin(t + 2.094) * 0.25, c = Math.max(0, 1 - a - b), s = a + b + c;
      wA = a / s; wB = b / s; wC = c / s;
    }
    const [tx, ty] = target();
    vx = (tx - curX) * 0.25 * dt + vx * Math.pow(0.55, dt);
    vy = (ty - curY) * 0.25 * dt + vy * Math.pow(0.55, dt);
    curX += vx * dt; curY += vy * dt;
    const settled = Math.abs(tx - curX) + Math.abs(ty - curY) + Math.abs(vx) + Math.abs(vy) < 0.05;
    if (settled && !demoEnabled) { curX = tx; curY = ty; vx = vy = 0; }
    draw();
    if (demoEnabled || !settled) raf = requestAnimationFrame(tick);
  }
  // input moves the target; reduced motion jumps straight there, otherwise the puck glides
  function kick() {
    if (reduced()) { [curX, curY] = target(); vx = vy = 0; draw(); return; }
    if (!raf && !document.hidden) { last = 0; raf = requestAnimationFrame(tick); }
  }
  const stop = () => { if (raf) { cancelAnimationFrame(raf); raf = 0; } };
  function takeover() { demoEnabled = false; }

  addEventListener('forever:interactive', takeover);
  document.addEventListener('visibilitychange', () => { document.hidden ? stop() : kick(); });
  matchMedia('(prefers-reduced-motion: reduce)').addEventListener?.('change', () => { stop(); kick(); });

  pad.addEventListener('pointerdown', (e) => { takeover(); dragging = true; pad.setPointerCapture(e.pointerId); fromPointer(e); });
  pad.addEventListener('pointermove', (e) => { if (dragging) fromPointer(e); });
  const end = () => { dragging = false; };
  pad.addEventListener('pointerup', end);
  pad.addEventListener('pointercancel', end);
  $('tmx-ctr').addEventListener('click', () => { takeover(); wA = wB = wC = 1 / 3; kick(); });
  pad.addEventListener('keydown', (e) => {
    const m = { ArrowUp: [0, -8], ArrowDown: [0, 8], ArrowLeft: [-8, 0], ArrowRight: [8, 0] }[e.key];
    takeover();
    if (!m) return;
    e.preventDefault();
    [wA, wB, wC] = clampBary(curX + m[0], curY + m[1]);
    kick();
  });

  if (reduced()) { demoEnabled = false; [curX, curY] = target(); }
  draw();
  kick();
})();
</script>
</body>
</html>
