</head><body>
<div class="dt01-root" id="dt01-root" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Dye tub. A round cloth sits in the middle of five dye vats. Move your finger or pointer toward a vat and the cloth reaches into it and slowly takes its color; the closer you go, the faster it dyes. Lift to stop. Keyboard: left and right arrows pick a vat, up and down set how far the cloth reaches, Enter or Space dips or lifts, Escape lifts. The cloth color is saved in this browser."></div>
<div class="dt01-cap" aria-hidden="true">Sound Hole Tub</div>
<script>(function(){
  var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var raf=0,last=0;
  var root=document.getElementById('dt01-root'),cv=document.createElement('canvas');
  cv.className='dt01-cv';root.appendChild(cv);var ctx=cv.getContext('2d');
  function lin(h){return [1,3,5].map(function(i){var x=parseInt(h.substr(i,2),16)/255;return x<=.04045?x/12.92:Math.pow((x+.055)/1.055,2.4)})}
  function rgb(c,m){m=m||1;return 'rgb('+c.map(function(x){x=Math.max(0,Math.min(1,x*m));return Math.round(255*(x<=.0031308?12.92*x:1.055*Math.pow(x,1/2.4)-.055))}).join(',')+')'}
  var VATS=[['Forever Indigo','#2E4A6F'],['Madder, plan B','#A63A2A'],['Monday Weld','#C7A43A'],['Coffee spill','#5C3A24'],['Logwood, Forever plan','#4D3650']];
  var VC=VATS.map(function(v){return lin(v[1])}),LINEN=lin('#EFE6D4');
  var N=5,STEP=Math.PI*2/N,P=56,R0=.17,R1=.31,R2=.45,KEY='dt01-cloth';
  var c,cur=0,near=0,pa=-Math.PI/2,ph=0,saveT=0;
  var r=new Float32Array(P),rv=new Float32Array(P),b=new Float32Array(N),bv=new Float32Array(N);
  try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.c&&s.c.length===3){c=s.c.map(Number);cur=(s.v|0)%N}}catch(e){}
  if(!c){c=LINEN.map(function(x,i){return x+(VC[0][i]-x)*.35})}
  function ctr(j){return -Math.PI/2+j*STEP}
  pa=ctr(cur);
  function tgt(a,n){var d=Math.cos(a-pa),f=d>0?Math.pow(d,4):0;return R0*(1-.1*n)+(R1+.045-R0)*n*f}
  for(var i=0;i<P;i++)r[i]=tgt(i/P*Math.PI*2,.85);
  b[cur]=.8;
  function depth(){var v=VC[cur],a=0,t=0;for(var i=0;i<3;i++){a+=Math.pow(c[i]-v[i],2);t+=Math.pow(LINEN[i]-v[i],2)}
    return Math.max(0,Math.min(100,Math.round(100*(1-Math.sqrt(a/(t||1))))))}
  function save(){try{localStorage.setItem(KEY,JSON.stringify({c:c,v:cur}))}catch(e){}
    var d=depth();root.setAttribute('aria-valuenow',d);root.setAttribute('aria-valuetext',VATS[cur][0]+', '+d+' percent'+(near>0?', dipping':', lifted'))}
  function dye(k){var v=VC[cur];for(var i=0;i<3;i++)c[i]+=(v[i]-c[i])*k}
  function step(dt){var mv=false,K=.16,D=Math.pow(.8,dt);
    for(var i=0;i<P;i++){var t=tgt(i/P*Math.PI*2,near);rv[i]+=(t-r[i])*K*dt;rv[i]*=D;r[i]+=rv[i]*dt;
      if(Math.abs(rv[i])>2e-5||Math.abs(t-r[i])>2e-4)mv=true}
    for(var j=0;j<N;j++){var bt=j===cur?near:0;bv[j]+=(bt-b[j])*.2*dt;bv[j]*=Math.pow(.78,dt);b[j]+=bv[j]*dt;
      if(Math.abs(bv[j])>1e-4||Math.abs(bt-b[j])>1e-3)mv=true}
    if(near>0){dye(1-Math.exp(-near*near*dt/330));ph+=dt*.05;mv=true;
      if((saveT+=dt)>40){saveT=0;save()}}
    return mv}
  function snapToTarget(){for(var i=0;i<P;i++){r[i]=tgt(i/P*Math.PI*2,near);rv[i]=0}
    for(var j=0;j<N;j++){b[j]=j===cur?near:0;bv[j]=0}
    if(near>0){dye(.05*near);save()}}
  var S=0,dpr=1,col={};
  function readCol(){var cs=getComputedStyle(document.documentElement);['bg','ink','acc'].forEach(function(k){col[k]=cs.getPropertyValue('--'+k).trim()})}
  readCol();
  function sector(j,ri,ro){var a0=ctr(j)-STEP/2+.05,a1=ctr(j)+STEP/2-.05;
    ctx.beginPath();ctx.arc(0,0,ro,a0,a1);ctx.arc(0,0,ri,a1,a0,true);ctx.closePath()}
  function draw(){if(!S)return;
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,S,S);ctx.translate(S/2,S/2);
    var u=S;
    for(var j=0;j<N;j++){var bb=b[j],ri=(R1-.012*bb)*u,ro=(R2+.018*bb)*u;
      sector(j,ri,ro);ctx.fillStyle=rgb(VC[j]);ctx.fill();
      ctx.save();ctx.clip();ctx.lineWidth=Math.max(1,u*.003);
      for(var k=0;k<4;k++){var rr=ri+(ro-ri)*((k+.5)/4+.06*Math.sin(ph+k*1.7+j));
        ctx.strokeStyle='rgba(255,246,230,'+(.05+.12*bb*(1-k/5))+')';
        ctx.beginPath();ctx.arc(0,0,rr,ctr(j)-STEP/2,ctr(j)+STEP/2);ctx.stroke()}
      ctx.restore();
      if(j===cur){sector(j,ri,ro);ctx.strokeStyle=col.acc;ctx.lineWidth=Math.max(1.5,u*.005);ctx.stroke()}}
    ctx.beginPath();
    for(var i=0;i<=P;i++){var a=i/P*Math.PI*2,n=(i+1)/P*Math.PI*2,x=Math.cos(a)*r[i%P]*u,y=Math.sin(a)*r[i%P]*u,
      x2=Math.cos(n)*r[(i+1)%P]*u,y2=Math.sin(n)*r[(i+1)%P]*u,mx=(x+x2)/2,my=(y+y2)/2;
      if(i===0)ctx.moveTo(mx,my);else ctx.quadraticCurveTo(x,y,mx,my)}
    ctx.closePath();ctx.fillStyle=rgb(c);ctx.fill();
    ctx.save();ctx.clip();var g=Math.max(3,u/110);ctx.lineWidth=1;
    ctx.strokeStyle='rgba(0,0,0,.07)';ctx.beginPath();
    for(var q=-u*.5;q<u*.5;q+=g){ctx.moveTo(q,-u*.5);ctx.lineTo(q,u*.5)}ctx.stroke();
    ctx.strokeStyle='rgba(255,250,240,.07)';ctx.beginPath();
    for(q=-u*.5+g/2;q<u*.5;q+=g){ctx.moveTo(-u*.5,q);ctx.lineTo(u*.5,q)}ctx.stroke();
    ctx.restore();ctx.strokeStyle=rgb(c,.6);ctx.lineWidth=Math.max(1,u*.004);ctx.stroke()}
  function frame(now){var dt=last?Math.min(now-last,50)/16.667:1;last=now;
    var moving=reduce()?(snapToTarget(),false):step(dt);draw();
    raf=moving?requestAnimationFrame(frame):0;}
  function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}
  new ResizeObserver(function(){var w=root.clientWidth;dpr=Math.min(2,window.devicePixelRatio||1);S=w;
    cv.width=Math.round(w*dpr);cv.height=Math.round(w*dpr);draw()}).observe(root);
  function setNear(n){var was=near;near=Math.max(0,Math.min(1,n));if(was>0&&near===0)save();kick()}
  function at(e){var bx=root.getBoundingClientRect(),dx=(e.clientX-bx.left)/bx.width-.5,dy=(e.clientY-bx.top)/bx.height-.5,
    d=Math.hypot(dx,dy);pa=Math.atan2(dy,dx);
    var j=Math.round((pa+Math.PI/2)/STEP);cur=((j%N)+N)%N;setNear((d-.1)/(R1+.04-.1))}
  root.addEventListener('pointerdown',function(e){if(e.pointerType!=='mouse')root.setPointerCapture(e.pointerId);at(e)});
  root.addEventListener('pointermove',at);
  function off(e){if(e.pointerType!=='mouse'||e.type==='pointerleave')setNear(0)}
  root.addEventListener('pointerup',off);root.addEventListener('pointercancel',off);root.addEventListener('pointerleave',off);
  root.addEventListener('keydown',function(e){var k=e.key;
    if(k==='ArrowLeft'||k==='ArrowRight'){cur=(cur+(k==='ArrowRight'?1:N-1))%N;pa=ctr(cur);save();kick()}
    else if(k==='ArrowUp'||k==='ArrowDown'){pa=ctr(cur);setNear(near+(k==='ArrowUp'?.25:-.25))}
    else if(k==='Enter'||k===' '){pa=ctr(cur);setNear(near>0?0:1)}
    else if(k==='Escape')setNear(0);else return;
    e.preventDefault()});
  root.addEventListener('blur',function(){setNear(0)});
  window.addEventListener('pagehide',save);
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){cancelAnimationFrame(raf);raf=0;save()}else kick()});
  window.addEventListener('message',function(e){var m=e.data;
    if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){
      document.documentElement.setAttribute('data-theme',m.theme);readCol();draw()}});
  var demo=window.__foreverPreview?window.__foreverPreview.demoEnabled!==false:true,demoT=0;
  function stopDemo(){demo=false;clearInterval(demoT)}
  window.addEventListener('forever:interactive',stopDemo);
  root.addEventListener('pointerdown',stopDemo,true);root.addEventListener('keydown',stopDemo,true);
  document.addEventListener('pointerdown',stopDemo,true);
  root.addEventListener('pointermove',stopDemo,true);
  var dstep=0;
  demoT=setInterval(function(){if(!demo||document.hidden||reduce())return;
    if(near>0&&dstep%3===2)setNear(0);
    else if(near===0){cur=(cur+1)%N;pa=ctr(cur);setNear(.9)}
    dstep++},1200);
  save();draw();kick();
})();</script>
</body></html>
