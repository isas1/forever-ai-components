<script>(function(){
  var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var raf=0,last=0;
  var demo=window.__foreverPreview?window.__foreverPreview.demoEnabled!==false:true,demoT=0;
  function stopDemo(){demo=false;clearInterval(demoT)}
  var root=document.querySelector('.dt07-root');
  var cv=document.createElement('canvas');cv.className='dt07-c';root.appendChild(cv);
  var ctx=cv.getContext('2d');
  var num=document.createElement('div');num.className='dt07-n';
  var nv=document.createTextNode('');num.appendChild(nv);
  var un=document.createElement('span');un.textContent='KB/s';num.appendChild(un);root.appendChild(num);
  var W=0,H=0,CK=64,N=40,name='cat-pics-2';
  var rec=[.3,.33,.36,.5,.62,.58,.41,.28,.22,.26,.38,.45];
  var prog=12*CK+18,u=.43,v=0,drag=null;
  function cl(x){return x<0?0:x>1?1:x}
  function rate(){return Math.round(16*Math.pow(2,u*7))}
  function tot(){return N*CK}
  function audio(){}
  function chime(){}
  new ResizeObserver(function(){var r=root.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);
    W=r.width;H=r.height;cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);draw()}).observe(root);
  function step(dt){
    if(!drag){
      if(Math.abs(v)>2e-5){u+=v*dt;v*=Math.pow(.93,dt);
        if(u<0){u=0;v=-v*.35}if(u>1){u=1;v=-v*.35}}else v=0}
    var T=tot();
    if(prog<T){prog=Math.min(T,prog+rate()*dt/60);
      while(rec.length<Math.floor(prog/CK))rec.push(u);
      if(prog>=T)chime()}
    return !!drag||v!==0||prog<T}
  function draw(){
    if(!W)return;
    var cs=getComputedStyle(root),ink=cs.getPropertyValue('--ink').trim(),
      acc=cs.getPropertyValue('--acc').trim(),mut=cs.getPropertyValue('--mut').trim();
    var r=rate(),T=tot();
    nv.textContent=r;
    root.setAttribute('aria-valuenow',r);
    root.setAttribute('aria-valuetext',r+' KB/s, '+name+', '+rec.length+' of '+N+' chunks');
    ctx.clearRect(0,0,W,H);
    var x0=W*.08,lw=W*.84,by=Math.round(H*.66),hmax=H*.34,sw=lw/N,
      bw=Math.max(1,Math.min(sw*.5,9)),i,cx,h;
    for(i=0;i<N;i++){cx=x0+(i+.5)*sw;
      if(i<rec.length){h=hmax*(.12+.88*(1-rec[i]));
        ctx.globalAlpha=.82+((i*37)%7)/40;ctx.fillStyle=ink;ctx.fillRect(cx-bw/2,by-h,bw,h)}
      else if(i===rec.length&&prog<T){var f=(prog-i*CK)/CK;h=hmax*(.12+.88*(1-u));
        ctx.globalAlpha=.25;ctx.fillStyle=mut;ctx.fillRect(cx-bw/2,by-h,bw,h);
        ctx.globalAlpha=1;ctx.fillStyle=acc;ctx.fillRect(cx-bw/2,by-h*f,bw,h*f)}
      else{ctx.globalAlpha=1;ctx.fillStyle=mut;ctx.fillRect(Math.round(cx),by-3,1,3)}}
    ctx.globalAlpha=1;
    var hc=hmax*(.12+.88*(1-u));
    ctx.fillStyle=acc;ctx.globalAlpha=.45;ctx.fillRect(x0,Math.round(by-hc),lw,1);ctx.globalAlpha=1;
    ctx.fillStyle=ink;ctx.fillRect(x0,by,lw,1);
    ctx.fillStyle=mut;
    for(i=0;i<8;i++)ctx.fillRect(Math.round(x0+i/7*lw),by+6,1,5);
    var mx=x0+u*lw,ky=by+H*.14,kr=Math.max(6,W*.018);
    ctx.fillStyle=acc;ctx.fillRect(Math.round(mx)-1,by+1,2,ky-by);
    ctx.beginPath();ctx.arc(mx,ky,kr,0,6.2832);ctx.fill()}
  function snapToTarget(){v=0;prog=tot();while(rec.length<N)rec.push(u)}
  function frame(now){var dt=last?Math.min(now-last,50)/16.667:1;last=now;
    var moving=reduce()?(snapToTarget(),!!drag):step(dt);draw();
    raf=moving?requestAnimationFrame(frame):0;}
  function kick(){if(!raf&&!document.hidden){last=0;raf=requestAnimationFrame(frame)}}

    drag={x:e.clientX,u:u,pu:u,t:performance.now(),m:false,v:0};v=0;kick()});

    var nu=cl(drag.u+(e.clientX-drag.x)/(W*.84));if(Math.abs(e.clientX-drag.x)>4)drag.m=true;

    drag.v=(nu-drag.pu)/df*.6+drag.v*.4;drag.pu=nu;drag.t=t;u=nu;kick()});

    drag=null;kick()}

  root.addEventListener('wheel',function(e){e.preventDefault();

    if(reduce())u=cl(u+d*.001);else v=Math.max(-.06,Math.min(.06,v+d*.00012));kick()},{passive:false});
  root.addEventListener('keydown',function(e){var k=e.key,s=e.shiftKey?3:1,d=0;

    else if(k==='Escape')v=0;
    else if(k==='Home'){u=0;v=0}else if(k==='End'){u=1;v=0}

    e.preventDefault();kick();draw()});
  root.addEventListener('dragover',function(e){e.preventDefault()});

  document.addEventListener('pointerdown',stopDemo,true);document.addEventListener('keydown',stopDemo,true);document.addEventListener('wheel',stopDemo,true);
  var dd=1;
  if(demo)demoT=setInterval(function(){if(!demo||document.hidden||reduce()||drag)return;
    if(prog>=tot()){restart();return}
    if(u>.78)dd=-1;else if(u<.22)dd=1;v+=dd*.006;kick()},900);
})();</script>
