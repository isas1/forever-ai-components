<style>

    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background-color: var(--at02-bg); color: var(--at02-ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  }
  .at02-stage {
    position: absolute; inset: 0; display: grid; place-items: center;
    padding: clamp(10px, 3vmin, 20px); padding-bottom: clamp(24px, 7vmin, 32px);
    background-color: var(--at02-bg); color: var(--at02-ink);
  }
  .at02-unit { width: min(210px, 100%); display: flex; flex-direction: column; gap: 10px; }
  .at02-list { display: flex; flex-direction: column; gap: clamp(7px, 2vmin, 10px); width: 100%; }
  .at02-item {
    appearance: none; width: 100%; display: flex; align-items: center; gap: 10px;
    padding: clamp(7px, 2vmin, 8px) clamp(8px, 2.5vmin, 10px);
    background: var(--at02-surface-hi); border: 1.5px solid var(--at02-border);
    border-radius: 5px; cursor: pointer; box-shadow: 0 2px 0 var(--at02-border);
    transition: transform 90ms ease, border-color 150ms ease, background-color 200ms ease;
    text-align: left; font-family: inherit; color: var(--at02-ink); touch-action: manipulation;
  }
  .at02-item:active { transform: translateY(1px); }
  .at02-item:focus-visible { outline: 2px solid var(--at02-accent); outline-offset: 2px; }
  .at02-box {
    width: 20px; height: 20px; border: 1.5px solid var(--at02-ink); border-radius: 4px;
    background: var(--at02-bg); display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: background-color 150ms ease, border-color 150ms ease;
  }
  .at02-item[aria-checked="true"] .at02-box { background: var(--at02-moss); border-color: var(--at02-moss); }
  .at02-svg {
    width: 14px; height: 14px; fill: none; stroke: var(--at02-moss-ink); stroke-width: 2.5;
    stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24;
    transition: stroke-dashoffset 280ms var(--at02-spring);
  }
  .at02-item[aria-checked="true"] .at02-svg { stroke-dashoffset: 0; }
  .at02-bar { flex: 1; position: relative; min-width: 0; display: flex; align-items: center; }
  .at02-label { font-size: clamp(10px, 2.8vw, 11px); font-weight: 700; color: var(--at02-ink); white-space: nowrap; transition: color 180ms ease; }
  .at02-item[aria-checked="true"] .at02-label { color: var(--at02-muted); }
  .at02-strike {
    position: absolute; left: 0; right: 0; top: 50%; height: 1.5px; background: var(--at02-ink);
    transform: scaleX(0); transform-origin: left center; transition: transform 240ms var(--at02-ease);
  }
  .at02-item[aria-checked="true"] .at02-strike { transform: scaleX(1); }
  .at02-readout {
    display: flex; justify-content: space-between; align-items: center;
    font-size: clamp(9px, 2.5vw, 10px); font-weight: 600;
    letter-spacing: 0.08em; color: var(--at02-muted); text-transform: uppercase;
  }
  .at02-val { color: var(--at02-ink); }
  .at02-cap {
    position: absolute; left: 10px; bottom: 8px; font: 500 11px/1 ui-monospace, monospace;

<body>
<div class="at02-stage">
  <div class="at02-unit">
    <div class="at02-list" id="at02-list" role="group" aria-label="Pre-flight Checklist">
      <button type="button" class="at02-item" role="checkbox" aria-checked="true">
        <span class="at02-box" aria-hidden="true">
          <svg class="at02-svg" viewBox="0 0 16 16"><path d="M3 8.5L6.5 12L13 4"/></svg>
        </span>
        <span class="at02-bar">
          <span class="at02-label">SYNC CLOCK</span>
          <span class="at02-strike" aria-hidden="true"></span>
        </span>
      </button>
      <button type="button" class="at02-item" role="checkbox" aria-checked="false">
        <span class="at02-box" aria-hidden="true">
          <svg class="at02-svg" viewBox="0 0 16 16"><path d="M3 8.5L6.5 12L13 4"/></svg>
        </span>
        <span class="at02-bar">
          <span class="at02-label">ARM TRACK 1</span>
          <span class="at02-strike" aria-hidden="true"></span>
        </span>
      </button>
    </div>
    <div class="at02-readout">
      <span>PRE-FLIGHT</span>
      <span class="at02-val" id="at02-out">1 / 2 READY</span>
    </div>
  </div>
  <div class="at02-sr" id="at02-live" aria-live="polite"></div>
</div>
<div class="at02-cap" aria-hidden="true">Atelier Draw Checkbox</div>
<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var list = document.getElementById("at02-list");
  var items = Array.prototype.slice.call(list.querySelectorAll(".at02-item"));
  var out = document.getElementById("at02-out");
  var live = document.getElementById("at02-live");
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var phase = 0;

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "forever:theme" && (e.data.theme === "light" || e.data.theme === "dark")) {
      root.setAttribute("data-theme", e.data.theme);
    }
  });

  function toggle(item, announceText) {
    var next = item.getAttribute("aria-checked") !== "true";
    item.setAttribute("aria-checked", next ? "true" : "false");
    var count = items.filter(function (el) { return el.getAttribute("aria-checked") === "true"; }).length;
    out.textContent = count + " / " + items.length + " READY";
    if (announceText && live) {
      var lbl = item.querySelector(".at02-label").textContent;
      live.textContent = lbl + (next ? " checked" : " unchecked") + ", " + count + " of " + items.length + " ready";
    }
  }

  var demo = !reduce && (!window.__foreverPreview || window.__foreverPreview.demoEnabled !== false);
  var initTimer = null, demoTimer = null;

  function stepDemo() {
    if (!demo || reduce || document.hidden) return;
    phase = (phase + 1) % 2;
    toggle(items[phase === 0 ? 1 : 1], false);
    if (phase === 0) toggle(items[0], false);
  }
  function startDemo() {
    if (demo && !reduce && !demoTimer) demoTimer = setInterval(stepDemo, 2200);
  }
  function stopDemo() {
    if (initTimer) { clearTimeout(initTimer); initTimer = null; }
    if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }
  }
  function takeover() { demo = false; stopDemo(); }

  window.addEventListener("forever:interactive", takeover);
  list.addEventListener("pointerdown", takeover, true);
  list.addEventListener("keydown", takeover, true);

  items.forEach(function (item) {
    item.addEventListener("click", function () {
      takeover();
      toggle(item, true);
    });
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopDemo(); else if (demo) startDemo();
  });

  if (demo) {
    initTimer = setTimeout(function () {
      if (demo && !reduce && !document.hidden) toggle(items[1], false);
    }, 300);
    startDemo();
  }
})();
</script>
