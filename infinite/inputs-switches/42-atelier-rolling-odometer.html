<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Atelier Rolling Odometer — Inputs &amp; Switches. Mechanical three-digit BPM counter with spring-rolling digit strips.">
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier Rolling Odometer</title>
<script>/* theme hook: ?theme=light|dark, before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  :root {
    --at03-bg: #171614;
    --at03-surface: #211F1C;
    --at03-surface-hi: #2B2824;
    --at03-ink: #F4F1EA;
    --at03-ink-fg: #171614;
    --at03-muted: #ADA699;
    --at03-accent: #EC6A43;
    --at03-spring: cubic-bezier(0.22, 1.35, 0.36, 1);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --at03-bg: #F4F1EA;
    --at03-surface: #EBE7DF;
    --at03-surface-hi: #FAF8F5;
    --at03-ink: #1C1B19;
    --at03-ink-fg: #FAF8F5;
    --at03-muted: #666158;
    --at03-accent: #C43B16;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background-color: var(--at03-bg); color: var(--at03-ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.25s ease, color 0.25s ease;
  }
  .at03-stage {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    padding: clamp(10px, 3vmin, 20px);
    padding-bottom: clamp(24px, 7vmin, 32px);
    background-color: var(--at03-bg); color: var(--at03-ink);
  }
  .at03-unit {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    max-width: 100%;
  }
  .at03-shell {
    display: flex; align-items: center; gap: clamp(6px, 2.5vw, 8px);
    background: var(--at03-surface-hi);
    border: 1.5px solid var(--at03-ink);
    padding: clamp(6px, 2.5vmin, 8px) clamp(7px, 2.5vmin, 10px);
    border-radius: 6px;
    box-shadow: 0 2px 0 var(--at03-ink);
  }
  .at03-btn {
    appearance: none;
    width: clamp(26px, 14vw, 32px); height: 36px;
    background: var(--at03-surface);
    border: 1.5px solid var(--at03-ink);
    border-radius: 4px;
    font-family: inherit; font-size: 16px; font-weight: 700;
    color: var(--at03-ink); cursor: pointer;
    box-shadow: 0 2px 0 var(--at03-ink);
    transition: transform 60ms ease, box-shadow 60ms ease;
    touch-action: manipulation;
  }
  .at03-btn:active { transform: translateY(2px); box-shadow: 0 0 0 var(--at03-ink); }
  .at03-btn:focus-visible { outline: 2px solid var(--at03-accent); outline-offset: 2px; }
  .at03-window {
    display: flex; align-items: center; gap: 2px;
    background: var(--at03-ink); color: var(--at03-ink-fg);
    border-radius: 4px; padding: 0 clamp(6px, 2vw, 8px);
    height: 40px; overflow: hidden;
  }
  .at03-col {
    width: clamp(14px, 7vw, 18px); height: 40px;
    overflow: hidden; position: relative;
  }
  .at03-strip {
    display: flex; flex-direction: column;
    transition: transform 320ms var(--at03-spring);
  }
  .at03-digit {
    height: 40px;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(16px, 7vw, 20px); font-weight: 700;
  }
  .at03-readout {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    font-size: clamp(9px, 2.5vw, 10px); font-weight: 600;
    letter-spacing: 0.08em; color: var(--at03-muted);
    text-transform: uppercase;
  }
  .at03-val { color: var(--at03-ink); }
  .at03-cap {
    position: absolute; left: 10px; bottom: 8px;
    font: 500 11px/1 ui-monospace, monospace;
    color: var(--at03-ink); opacity: 0.45;
    letter-spacing: 0.04em; text-transform: uppercase;
    user-select: none; pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .at03-strip, .at03-btn { transition-duration: 0.01ms !important; }
  }
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/inputs-switches/42-atelier-rolling-odometer.html",
 "title": "Atelier Rolling Odometer",
 "description": "Editorial mechanical BPM tempo counter with three independent spring-rolling digit strips and tactile stepper buttons.",

 ]

</head>
<body>
<div class="at03-stage">
  <div class="at03-unit">
    <div class="at03-shell" id="at03-shell" role="group" aria-label="BPM Counter">
      <button type="button" class="at03-btn" id="at03-minus" aria-label="Decrease BPM">−</button>
      <div class="at03-window" id="at03-win" aria-live="polite">
        <div class="at03-col" data-fit-clip-ok="1"><div class="at03-strip"></div></div>
        <div class="at03-col" data-fit-clip-ok="1"><div class="at03-strip"></div></div>
        <div class="at03-col" data-fit-clip-ok="1"><div class="at03-strip"></div></div>
      </div>
      <button type="button" class="at03-btn" id="at03-plus" aria-label="Increase BPM">+</button>
    </div>
    <div class="at03-readout">
      <span>TEMPO CLOCK</span>
      <span class="at03-val" id="at03-out">124 BPM</span>
    </div>
  </div>
</div>
<div class="at03-cap" aria-hidden="true">Atelier Rolling Odometer</div>
<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var shell = document.getElementById("at03-shell");
  var minus = document.getElementById("at03-minus");
  var plus = document.getElementById("at03-plus");
  var strips = Array.prototype.slice.call(document.querySelectorAll("#at03-win .at03-strip"));
  var out = document.getElementById("at03-out");
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var bpm = 124;

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "forever:theme" && (e.data.theme === "light" || e.data.theme === "dark")) {
      root.setAttribute("data-theme", e.data.theme);
    }
  });

  strips.forEach(function (strip) {
    for (var d = 0; d <= 9; d++) {
      var cell = document.createElement("div");
      cell.className = "at03-digit";
      cell.textContent = String(d);
      strip.appendChild(cell);
    }
  });

  function render(val) {
    bpm = Math.max(40, Math.min(240, val));
    var str = String(bpm).padStart(3, "0");
    for (var i = 0; i < 3; i++) {
      strips[i].style.transform = "translateY(-" + (parseInt(str[i], 10) * 40) + "px)";
    }
    out.textContent = bpm + " BPM";
  }
  render(bpm);

  var presets = [128, 96, 132, 124];
  var stepIdx = 0;
  var demo = !reduce && (!window.__foreverPreview || window.__foreverPreview.demoEnabled !== false);
  var initTimer = null, demoTimer = null;

  function stepDemo() {
    if (!demo || reduce || document.hidden) return;
    render(presets[stepIdx % presets.length]);
    stepIdx++;
  }
  function startDemo() {
    if (demo && !reduce && !demoTimer) demoTimer = setInterval(stepDemo, 1900);
  }
  function stopDemo() {
    if (initTimer) { clearTimeout(initTimer); initTimer = null; }
    if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }
  }
  function takeover() { demo = false; stopDemo(); }

  window.addEventListener("forever:interactive", takeover);
  shell.addEventListener("pointerdown", takeover, true);
  shell.addEventListener("keydown", takeover, true);

  minus.addEventListener("click", function () { takeover(); render(bpm - 1); });
  plus.addEventListener("click", function () { takeover(); render(bpm + 1); });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopDemo(); else if (demo) startDemo();
  });

  if (demo) {
    initTimer = setTimeout(stepDemo, 260);
    startDemo();
  }
})();
</script>
</body>
</html>
