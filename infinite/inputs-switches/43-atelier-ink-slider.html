<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Atelier Ink Slider — Inputs &amp; Switches. Tactile horizontal gain fader with lifting ink pill value thumb.">
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier Ink Slider</title>
<script>/* theme hook: ?theme=light|dark, before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  :root {
    --at04-bg: #171614;
    --at04-surface: #211F1C;
    --at04-ink: #F4F1EA;
    --at04-muted: #ADA699;
    --at04-accent: #EC6A43;
    --at04-accent-ink: #171614;
    --at04-spring: cubic-bezier(0.22, 1.35, 0.36, 1);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --at04-bg: #F4F1EA;
    --at04-surface: #EBE7DF;
    --at04-ink: #1C1B19;
    --at04-muted: #666158;
    --at04-accent: #C43B16;
    --at04-accent-ink: #FAF8F5;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background-color: var(--at04-bg); color: var(--at04-ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.25s ease, color 0.25s ease;
  }
  .at04-stage {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    padding: clamp(10px, 3vmin, 20px);
    padding-bottom: clamp(24px, 7vmin, 32px);
    background-color: var(--at04-bg); color: var(--at04-ink);
  }
  .at04-unit {
    width: min(230px, 100%);
    display: flex; flex-direction: column; gap: 10px;
  }
  .at04-wrap {
    width: 100%; padding: 18px 18px;
    cursor: ew-resize; touch-action: none; position: relative;
  }
  .at04-wrap:focus-visible { outline: 2px solid var(--at04-accent); outline-offset: 2px; border-radius: 6px; }
  .at04-rail { position: relative; width: 100%; }
  .at04-track {
    width: 100%; height: 12px;
    background: var(--at04-surface);
    border: 1.5px solid var(--at04-ink);
    border-radius: 999px; position: relative; overflow: hidden;
  }
  .at04-fill {
    position: absolute; top: 0; left: 0; bottom: 0;
    background: var(--at04-ink); width: 64%;
    border-radius: 999px 0 0 999px;
    transition: width 160ms var(--at04-spring);
  }
  .at04-thumb {
    position: absolute; top: 50%; left: 64%;
    transform: translate(-50%, -50%);
    background: var(--at04-accent); color: var(--at04-accent-ink);
    border: 1.5px solid var(--at04-ink); border-radius: 999px;
    padding: 4px 8px;
    font-size: 11px; font-weight: 700; line-height: 1;
    box-shadow: 0 2px 0 var(--at04-ink);
    transition: left 160ms var(--at04-spring), transform 160ms var(--at04-spring);
    pointer-events: none; white-space: nowrap;
  }
  .at04-wrap.is-drag .at04-fill,
  .at04-wrap.is-drag .at04-thumb { transition: transform 160ms var(--at04-spring); }
  .at04-wrap.is-drag .at04-thumb,
  .at04-wrap:focus-visible .at04-thumb {
    transform: translate(-50%, -62%) scale(1.1);
  }
  .at04-readout {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 4px;
    font-size: clamp(9px, 2.5vw, 10px); font-weight: 600;
    letter-spacing: 0.08em; color: var(--at04-muted);
    text-transform: uppercase;
  }
  .at04-val { color: var(--at04-ink); }
  .at04-cap {
    position: absolute; left: 10px; bottom: 8px;
    font: 500 11px/1 ui-monospace, monospace;
    color: var(--at04-ink); opacity: 0.45;
    letter-spacing: 0.04em; text-transform: uppercase;
    user-select: none; pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .at04-fill, .at04-thumb { transition-duration: 0.01ms !important; }
  }
</style>

<body>
<div class="at04-stage">
  <div class="at04-unit">
    <div class="at04-wrap" id="at04-slider" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="64" aria-label="Gain Fader">
      <div class="at04-rail" id="at04-rail">
        <div class="at04-track"><div class="at04-fill" id="at04-fill"></div></div>
        <div class="at04-thumb" id="at04-thumb">64</div>
      </div>
    </div>
    <div class="at04-readout">
      <span>ATTENUATOR</span>
      <span class="at04-val" id="at04-out">GAIN: 64%</span>
    </div>
  </div>
</div>
<div class="at04-cap" aria-hidden="true">Atelier Ink Slider</div>
<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var slider = document.getElementById("at04-slider");
  var rail = document.getElementById("at04-rail");
  var fill = document.getElementById("at04-fill");
  var thumb = document.getElementById("at04-thumb");
  var out = document.getElementById("at04-out");
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var val = 64;
  var dragging = false;

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "forever:theme" && (e.data.theme === "light" || e.data.theme === "dark")) {
      root.setAttribute("data-theme", e.data.theme);
    }
  });

  function setValue(next) {
    var clamped = Math.max(0, Math.min(100, Math.round(next)));
    val = clamped;
    fill.style.width = clamped + "%";
    thumb.style.left = clamped + "%";
    thumb.textContent = String(clamped);
    slider.setAttribute("aria-valuenow", String(clamped));
    out.textContent = "GAIN: " + clamped + "%";
  }

  function pointerToVal(e) {
    var r = rail.getBoundingClientRect();
    if (!r.width) return;
    setValue(((e.clientX - r.left) / r.width) * 100);
  }

  var stops = [82, 36, 74, 52, 64];
  var stopIdx = 0;
  var demo = !reduce && (!window.__foreverPreview || window.__foreverPreview.demoEnabled !== false);
  var initTimer = null, demoTimer = null;

  function stepDemo() {
    if (!demo || reduce || document.hidden) return;
    setValue(stops[stopIdx % stops.length]);
    stopIdx++;
  }
  function startDemo() {
    if (demo && !reduce && !demoTimer) demoTimer = setInterval(stepDemo, 1800);
  }
  function stopDemo() {
    if (initTimer) { clearTimeout(initTimer); initTimer = null; }
    if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }
  }
  function takeover() { demo = false; stopDemo(); }

  window.addEventListener("forever:interactive", takeover);
  slider.addEventListener("pointerdown", function (e) {
    takeover();
    dragging = true;
    slider.classList.add("is-drag");
    if (slider.setPointerCapture) slider.setPointerCapture(e.pointerId);
    pointerToVal(e);
  });
  slider.addEventListener("pointermove", function (e) {
    if (dragging) pointerToVal(e);
  });
  slider.addEventListener("pointerup", function () {
    dragging = false;
    slider.classList.remove("is-drag");
  });
  slider.addEventListener("pointercancel", function () {
    dragging = false;
    slider.classList.remove("is-drag");
  });
  slider.addEventListener("keydown", function (e) {
    takeover();
    if (e.key === "ArrowRight" || e.key === "ArrowUp") { e.preventDefault(); setValue(val + 2); }
    else if (e.key === "ArrowLeft" || e.key === "ArrowDown") { e.preventDefault(); setValue(val - 2); }
    else if (e.key === "Home") { e.preventDefault(); setValue(0); }
    else if (e.key === "End") { e.preventDefault(); setValue(100); }
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopDemo(); else if (demo) startDemo();
  });

  if (demo) {
    initTimer = setTimeout(stepDemo, 260);
    startDemo();
  }
})();
</script>
</body>
</html>
