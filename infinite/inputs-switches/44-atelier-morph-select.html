<head>
<meta charset="utf-8">

<title>Atelier Morph Select</title>
<script>/* theme hook: ?theme=light|dark, before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  :root {
    --at07-bg: #171614; --at07-surface: #211F1C; --at07-surface-hi: #2B2824;
    --at07-ink: #F4F1EA; --at07-muted: #ADA699; --at07-hairline: #3A3731;
    --at07-accent: #EC6A43; --at07-spring: cubic-bezier(0.22, 1.35, 0.36, 1);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --at07-bg: #F4F1EA; --at07-surface: #EBE7DF; --at07-surface-hi: #FAF8F5;
    --at07-ink: #1C1B19; --at07-muted: #666158; --at07-hairline: #DED9CE; --at07-accent: #C43B16;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background-color: var(--at07-bg); color: var(--at07-ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased; transition: background-color 0.25s ease, color 0.25s ease;
  }
  .at07-stage {
    position: absolute; inset: 0; display: grid; place-items: center;
    padding: clamp(8px, 3vmin, 18px); padding-bottom: clamp(22px, 6.5vmin, 30px);
    background-color: var(--at07-bg); color: var(--at07-ink);
  }
  .at07-unit { width: min(190px, 100%); display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .at07-wrap { position: relative; width: 100%; height: clamp(102px, 50vmin, 118px); display: flex; align-items: center; justify-content: center; }
  .at07-box {
    width: min(148px, 100%); height: 36px; background: var(--at07-surface-hi);
    border: 1.5px solid var(--at07-ink); border-radius: 6px; box-shadow: 0 2px 0 var(--at07-ink);
    overflow: hidden; transition: width 240ms var(--at07-spring), height 240ms var(--at07-spring);
    display: flex; flex-direction: column; position: relative;
  }
  .at07-box.is-open { width: min(176px, 100%); height: clamp(98px, 48vmin, 114px); }
  .at07-trigger {
    appearance: none; width: 100%; height: 34px; border: none; background: transparent;
    display: flex; align-items: center; justify-content: space-between; padding: 0 11px;
    font-family: inherit; font-size: clamp(11px, 3vw, 12px); font-weight: 700;
    color: var(--at07-ink); cursor: pointer; flex-shrink: 0; touch-action: manipulation;
  }
  .at07-trigger:focus-visible { outline: 2px solid var(--at07-accent); outline-offset: -2px; border-radius: 4px; }
  .at07-opts {
    display: flex; flex-direction: column; border-top: 1px solid var(--at07-hairline);
    opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 150ms ease, visibility 150ms ease;
  }
  .at07-box.is-open .at07-opts { opacity: 1; visibility: visible; pointer-events: auto; }
  .at07-opt {
    appearance: none; border: none; background: transparent; padding: clamp(4px, 1.5vmin, 6px) 11px;
    text-align: left; font-family: inherit; font-size: clamp(10px, 2.8vw, 11px); color: var(--at07-ink);
    cursor: pointer; display: flex; justify-content: space-between; align-items: center; touch-action: manipulation;
  }
  .at07-opt:hover, .at07-opt[aria-selected="true"] { background: var(--at07-surface); font-weight: 700; }
  .at07-opt[aria-selected="true"]::after { content: "●"; color: var(--at07-accent); font-size: 9px; }
  .at07-opt:focus-visible { outline: 2px solid var(--at07-accent); outline-offset: -2px; }
  .at07-readout {
    width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 6px;
    font-size: clamp(8.5px, 2.4vw, 10px); font-weight: 600;
    letter-spacing: 0.06em; color: var(--at07-muted); text-transform: uppercase;
  }
  .at07-val { color: var(--at07-ink); }
  .at07-cap {
    position: absolute; left: 10px; bottom: 8px; font: 500 11px/1 ui-monospace, monospace;
    color: var(--at07-ink); opacity: 0.45; letter-spacing: 0.04em; text-transform: uppercase;
    user-select: none; pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) { .at07-box, .at07-opts { transition-duration: 0.01ms !important; } }
</style>

<body>
<div class="at07-stage">
  <div class="at07-unit">
    <div class="at07-wrap">
      <div class="at07-box" id="at07-box">
        <button type="button" class="at07-trigger" id="at07-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="Sample Rate">
          <span id="at07-val">48.0 kHz</span>
          <span aria-hidden="true">▾</span>
        </button>
        <div class="at07-opts" id="at07-opts" role="listbox" aria-label="Sample Rate Options">
          <button type="button" class="at07-opt" role="option" aria-selected="false" tabindex="-1" data-val="44.1 kHz">44.1 kHz</button>
          <button type="button" class="at07-opt" role="option" aria-selected="true" tabindex="-1" data-val="48.0 kHz">48.0 kHz</button>
          <button type="button" class="at07-opt" role="option" aria-selected="false" tabindex="-1" data-val="96.0 kHz">96.0 kHz</button>
        </div>
      </div>
    </div>
    <div class="at07-readout">
      <span>RATE</span>
      <span class="at07-val" id="at07-out">24-BIT / 48.0 kHz</span>
    </div>
  </div>
</div>
<div class="at07-cap" aria-hidden="true">Atelier Morph Select</div>
<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var box = document.getElementById("at07-box");
  var btn = document.getElementById("at07-btn");
  var valEl = document.getElementById("at07-val");
  var out = document.getElementById("at07-out");
  var opts = Array.prototype.slice.call(box.querySelectorAll(".at07-opt"));
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var curIdx = 1;

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "forever:theme" && (e.data.theme === "light" || e.data.theme === "dark")) {
      root.setAttribute("data-theme", e.data.theme);
    }
  });

  function setOpen(next) {
    var open = typeof next === "boolean" ? next : !box.classList.contains("is-open");
    box.classList.toggle("is-open", open);
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    opts.forEach(function (o) { o.tabIndex = open ? 0 : -1; });
  }

  function pick(idx, closeAfter) {
    curIdx = idx;
    opts.forEach(function (o, i) { o.setAttribute("aria-selected", i === idx ? "true" : "false"); });
    var v = opts[idx].dataset.val;
    valEl.textContent = v;
    out.textContent = "24-BIT / " + v;
    if (closeAfter) setOpen(false);
  }

  var demo = !reduce && (!window.__foreverPreview || window.__foreverPreview.demoEnabled !== false);
  var demoStep = 0;
  var initTimer = null, demoTimer = null, subTimer = null;

  function cycleDemo() {
    if (!demo || reduce || document.hidden) return;
    setOpen(true);
    if (subTimer) clearTimeout(subTimer);
    subTimer = setTimeout(function () {
      if (!demo || reduce || document.hidden) return;
      demoStep = (curIdx + 1) % opts.length;
      pick(demoStep, true);
    }, 850);
  }
  function startDemo() {
    if (demo && !reduce && !demoTimer) demoTimer = setInterval(cycleDemo, 2600);
  }
  function stopDemo() {
    if (initTimer) { clearTimeout(initTimer); initTimer = null; }
    if (subTimer) { clearTimeout(subTimer); subTimer = null; }
    if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }
  }
  function takeover() { demo = false; stopDemo(); }

  window.addEventListener("forever:interactive", takeover);
  box.addEventListener("pointerdown", takeover, true);
  box.addEventListener("keydown", takeover, true);

  btn.addEventListener("click", function () {
    takeover();
    setOpen();
  });

  opts.forEach(function (opt, idx) {
    opt.addEventListener("click", function () {
      takeover();
      pick(idx, true);
      btn.focus();
    });
  });

  document.addEventListener("click", function (e) {
    if (!box.contains(e.target) && box.classList.contains("is-open")) {
      takeover();
      setOpen(false);
    }
  });
  box.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && box.classList.contains("is-open")) {
      takeover();
      setOpen(false);
      btn.focus();
    }
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopDemo(); else if (demo) startDemo();
  });

  if (demo) {
    initTimer = setTimeout(cycleDemo, 260);
    startDemo();
  }
})();
</script>
</body>
</html>
