<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Atelier Range Calendar — Inputs &amp; Switches. Compact two-week studio booking grid with continuous day-range pill highlighting.">
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier Range Calendar</title>
<script>/* theme hook: ?theme=light|dark, before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  :root {
    --at08-bg: #171614;
    --at08-surface-lo: #2B2824;
    --at08-surface-hi: #211F1C;
    --at08-ink: #F4F1EA;
    --at08-ink-fg: #171614;
    --at08-muted: #ADA699;
    --at08-accent: #EC6A43;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --at08-bg: #F4F1EA;
    --at08-surface-lo: #E2DDD3;
    --at08-surface-hi: #FAF8F5;
    --at08-ink: #1C1B19;
    --at08-ink-fg: #FAF8F5;
    --at08-muted: #666158;
    --at08-accent: #C43B16;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background-color: var(--at08-bg); color: var(--at08-ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.25s ease, color 0.25s ease;
  }
  .at08-stage {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    padding: clamp(10px, 3vmin, 20px);
    padding-bottom: clamp(24px, 7vmin, 32px);
    background-color: var(--at08-bg); color: var(--at08-ink);
  }
  .at08-unit {
    width: min(224px, 100%);
    display: flex; flex-direction: column; gap: 10px;
  }
  .at08-grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 3px 0; width: 100%;
    background: var(--at08-surface-hi);
    border: 1.5px solid var(--at08-ink); border-radius: 6px;
    padding: clamp(5px, 2vmin, 8px);
    box-shadow: 0 2px 0 var(--at08-ink);
    touch-action: manipulation;
  }
  .at08-cell {
    appearance: none;
    height: clamp(22px, 10vmin, 28px);
    border: none; background: transparent; padding: 0;
    font-family: inherit;
    font-size: clamp(9.5px, 2.7vw, 11px); font-weight: 600;
    color: var(--at08-ink); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background-color 140ms ease, color 140ms ease;
    touch-action: manipulation;
  }
  .at08-cell:focus-visible { outline: 2px solid var(--at08-accent); outline-offset: -2px; z-index: 1; }
  .at08-cell.at08-in-range { background: var(--at08-surface-lo); }
  .at08-cell.at08-range-start,
  .at08-cell.at08-range-end {
    background: var(--at08-ink); color: var(--at08-ink-fg); font-weight: 700;
  }
  .at08-cell.at08-range-start { border-radius: 4px 0 0 4px; }
  .at08-cell.at08-range-end { border-radius: 0 4px 4px 0; }
  .at08-cell.at08-range-start.at08-range-end { border-radius: 4px; }
  .at08-readout {
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
    font-size: clamp(8.5px, 2.3vw, 10px); font-weight: 600;
    letter-spacing: 0.06em; color: var(--at08-muted);
    text-transform: uppercase;
  }
  .at08-val { color: var(--at08-ink); }
  .at08-cap {
    position: absolute; left: 10px; bottom: 8px;
    font: 500 11px/1 ui-monospace, monospace;
    color: var(--at08-ink); opacity: 0.45;
    letter-spacing: 0.04em; text-transform: uppercase;
    user-select: none; pointer-events: none;
  }
</style>

 "title": "Atelier Range Calendar",
 "description": "Compact 14-day studio booking date-range picker with joined start, span, and end highlight styling.",

</head>
<body>
<div class="at08-stage">
  <div class="at08-unit">
    <div class="at08-grid" id="at08-grid" role="grid" aria-label="Session Booking Days"></div>
    <div class="at08-readout">
      <span>BOOKING</span>
      <span class="at08-val" id="at08-out">MAY 04 → MAY 09</span>
    </div>
  </div>
</div>
<div class="at08-cap" aria-hidden="true">Atelier Range Calendar</div>
<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var grid = document.getElementById("at08-grid");
  var out = document.getElementById("at08-out");
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var rangeStart = 4, rangeEnd = 9, pickingEnd = false;
  var cells = [];

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "forever:theme" && (e.data.theme === "light" || e.data.theme === "dark")) {
      root.setAttribute("data-theme", e.data.theme);
    }
  });

  function pad(n) { return String(n).padStart(2, "0"); }

  function render() {
    var s = Math.min(rangeStart, rangeEnd);
    var e = Math.max(rangeStart, rangeEnd);
    cells.forEach(function (c) {
      var d = Number(c.dataset.day);
      c.classList.toggle("at08-in-range", d > s && d < e);
      c.classList.toggle("at08-range-start", d === s);
      c.classList.toggle("at08-range-end", d === e);
      c.setAttribute("aria-pressed", d >= s && d <= e ? "true" : "false");
    });
    out.textContent = "MAY " + pad(s) + " → MAY " + pad(e);
  }

  for (var d = 1; d <= 14; d++) {
    (function (day) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "at08-cell";
      btn.textContent = pad(day);
      btn.dataset.day = String(day);
      btn.setAttribute("aria-label", "May " + day);
      grid.appendChild(btn);
      cells.push(btn);
      btn.addEventListener("click", function () {
        takeover();
        if (!pickingEnd) {
          rangeStart = day; rangeEnd = day; pickingEnd = true;
        } else {
          rangeEnd = day; pickingEnd = false;
        }
        render();
      });
    })(d);
  }
  render();

  var spans = [[2, 6], [6, 12], [9, 14], [4, 9]];
  var spanIdx = 0;
  var demo = !reduce && (!window.__foreverPreview || window.__foreverPreview.demoEnabled !== false);
  var initTimer = null, demoTimer = null;

  function stepDemo() {
    if (!demo || reduce || document.hidden) return;
    var pair = spans[spanIdx % spans.length];
    rangeStart = pair[0]; rangeEnd = pair[1]; pickingEnd = false;
    spanIdx++;
    render();
  }
  function startDemo() {
    if (demo && !reduce && !demoTimer) demoTimer = setInterval(stepDemo, 2000);
  }
  function stopDemo() {
    if (initTimer) { clearTimeout(initTimer); initTimer = null; }
    if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }
  }
  function takeover() { demo = false; stopDemo(); }

  window.addEventListener("forever:interactive", takeover);
  grid.addEventListener("pointerdown", takeover, true);
  grid.addEventListener("keydown", takeover, true);

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopDemo(); else if (demo) startDemo();
  });

  if (demo) {
    initTimer = setTimeout(stepDemo, 280);
    startDemo();
  }
})();
</script>
</body>
</html>
