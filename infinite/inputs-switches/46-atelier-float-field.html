<head>
<meta charset="utf-8">

<script>/* theme hook: ?theme=light|dark, before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  :root {
    --at09-bg: #171614;
    --at09-surface-hi: #211F1C;
    --at09-ink: #F4F1EA;
    --at09-muted: #ADA699;
    --at09-border: #57524A;
    --at09-accent: #EC6A43;
    --at09-spring: cubic-bezier(0.22, 1.35, 0.36, 1);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --at09-bg: #F4F1EA;
    --at09-surface-hi: #FAF8F5;
    --at09-ink: #1C1B19;
    --at09-muted: #666158;
    --at09-border: #C5BEB0;
    --at09-accent: #C43B16;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background-color: var(--at09-bg); color: var(--at09-ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.25s ease, color 0.25s ease;
  }
  .at09-stage {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    padding: clamp(10px, 3vmin, 20px);
    padding-bottom: clamp(24px, 7vmin, 32px);
    background-color: var(--at09-bg); color: var(--at09-ink);
  }
  .at09-unit {
    width: min(210px, 100%);
    padding-top: 8px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .at09-field { position: relative; width: 100%; }
  .at09-input {
    width: 100%; padding: 12px 20px 10px 11px;
    background: var(--at09-surface-hi);
    border: 1.5px solid var(--at09-ink); border-radius: 5px;
    font-family: inherit;
    font-size: clamp(11px, 3vw, 13px); font-weight: 700;
    color: var(--at09-ink);
    box-shadow: 0 2px 0 var(--at09-ink);
    transition: border-color 150ms ease, background-color 0.2s ease;
  }
  .at09-input:focus { outline: none; border-color: var(--at09-accent); }
  .at09-label {
    position: absolute; left: 10px; top: 50%;
    transform: translateY(-50%);
    background: var(--at09-surface-hi); padding: 0 4px;
    font-size: 11px; font-weight: 700;
    color: var(--at09-muted); letter-spacing: 0.06em;
    pointer-events: none;
    transition: top 180ms var(--at09-spring), font-size 180ms ease, color 180ms ease;
  }
  .at09-input:focus + .at09-label,
  .at09-input:not(:placeholder-shown) + .at09-label,
  .at09-field.at09-active .at09-label {
    top: 0; font-size: 9px; color: var(--at09-accent);
  }
  .at09-corner {
    position: absolute; right: 9px; top: 50%;
    transform: translateY(-50%);
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--at09-border);
    transition: background-color 150ms ease;
    pointer-events: none;
  }
  .at09-input:focus ~ .at09-corner,
  .at09-field.at09-active .at09-corner { background: var(--at09-accent); }
  .at09-readout {
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
    font-size: clamp(8.5px, 2.4vw, 10px); font-weight: 600;
    letter-spacing: 0.06em; color: var(--at09-muted);
    text-transform: uppercase;
  }
  .at09-val { color: var(--at09-ink); }
  .at09-cap {
    position: absolute; left: 10px; bottom: 8px;
    font: 500 11px/1 ui-monospace, monospace;
    color: var(--at09-ink); opacity: 0.45;
    letter-spacing: 0.04em; text-transform: uppercase;
    user-select: none; pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .at09-input, .at09-label, .at09-corner { transition-duration: 0.01ms !important; }
  }
</style>

<body>
<div class="at09-stage">
  <div class="at09-unit">
    <div class="at09-field at09-active" id="at09-field">
      <input type="text" id="at09-input" class="at09-input" placeholder=" " value="WARM_TAPE_01" maxlength="16" aria-label="Patch Name">
      <label for="at09-input" class="at09-label">PATCH NAME</label>
      <span class="at09-corner" aria-hidden="true"></span>
    </div>
    <div class="at09-readout">
      <span>MEMORY</span>
      <span class="at09-val" id="at09-out">12 / 16 CHARS</span>
    </div>
  </div>
</div>
<div class="at09-cap" aria-hidden="true">Atelier Float Field</div>
<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var field = document.getElementById("at09-field");
  var input = document.getElementById("at09-input");
  var out = document.getElementById("at09-out");
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "forever:theme" && (e.data.theme === "light" || e.data.theme === "dark")) {
      root.setAttribute("data-theme", e.data.theme);
    }
  });

  function syncCounter() {
    var len = input.value.length;
    out.textContent = String(len).padStart(2, "0") + " / 16 CHARS";
  }

  var patches = ["ANALOG_PAD", "", "SUB_DRIFT_04", "WARM_TAPE_01"];
  var pIdx = 0;
  var demo = !reduce && (!window.__foreverPreview || window.__foreverPreview.demoEnabled !== false);
  var initTimer = null, demoTimer = null;

  function stepDemo() {
    if (!demo || reduce || document.hidden || document.activeElement === input) return;
    var next = patches[pIdx % patches.length];
    pIdx++;
    input.value = next;
    field.classList.toggle("at09-active", next.length > 0);
    syncCounter();
  }
  function startDemo() {
    if (demo && !reduce && !demoTimer) demoTimer = setInterval(stepDemo, 1900);
  }
  function stopDemo() {
    if (initTimer) { clearTimeout(initTimer); initTimer = null; }
    if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }
  }
  function takeover() {
    demo = false;
    stopDemo();
    field.classList.remove("at09-active");
  }

  window.addEventListener("forever:interactive", takeover);
  input.addEventListener("pointerdown", takeover, true);
  input.addEventListener("focus", takeover);
  input.addEventListener("keydown", takeover, true);
  input.addEventListener("input", function () {
    takeover();
    syncCounter();
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopDemo(); else if (demo) startDemo();
  });

  if (demo) {
    initTimer = setTimeout(stepDemo, 280);
    startDemo();
  }
})();
</script>
</body>
