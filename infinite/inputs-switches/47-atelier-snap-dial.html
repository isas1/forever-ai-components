<script>/* theme hook: ?theme=light|dark, before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  :root {
    --at14-bg: #171614;
    --at14-surface: #211F1C;
    --at14-surface-hi: #2B2824;
    --at14-ink: #F4F1EA;
    --at14-muted: #ADA699;
    --at14-border: #57524A;
    --at14-accent: #EC6A43;
    --at14-spring: cubic-bezier(0.22, 1.35, 0.36, 1);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --at14-bg: #F4F1EA;
    --at14-surface: #EBE7DF;
    --at14-surface-hi: #FAF8F5;
    --at14-ink: #1C1B19;
    --at14-muted: #666158;
    --at14-border: #C5BEB0;
    --at14-accent: #C43B16;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background-color: var(--at14-bg); color: var(--at14-ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.25s ease, color 0.25s ease;
  }
  .at14-stage {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    padding: clamp(8px, 3vmin, 18px);
    padding-bottom: clamp(22px, 6.5vmin, 30px);
    background-color: var(--at14-bg); color: var(--at14-ink);
  }
  .at14-unit {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    max-width: 100%;
  }
  .at14-dial {
    display: flex; align-items: center; justify-content: center;
    touch-action: none; cursor: ns-resize; border-radius: 50%; padding: 2px;
  }
  .at14-dial:focus-visible { outline: 2px solid var(--at14-accent); outline-offset: 2px; }
  .at14-svg {
    width: clamp(92px, 46vmin, 116px);
    height: clamp(82px, 42vmin, 104px);
    overflow: visible; display: block;
  }
  .at14-tick {
    stroke: var(--at14-border); stroke-width: 2; stroke-linecap: round;
    transition: stroke 120ms ease;
  }
  .at14-tick.is-on { stroke: var(--at14-accent); }
  .at14-base { fill: var(--at14-surface); stroke: var(--at14-ink); stroke-width: 2; }
  .at14-cap-top { fill: var(--at14-surface-hi); stroke: var(--at14-ink); stroke-width: 1.5; }
  .at14-needle { stroke: var(--at14-accent); stroke-width: 3; stroke-linecap: round; }
  .at14-rotor {
    transition: transform 160ms var(--at14-spring);
    transform-origin: 58px 58px;
  }
  .at14-readout {
    width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    font-size: clamp(9px, 2.5vw, 10px); font-weight: 600;
    letter-spacing: 0.08em; color: var(--at14-muted);
    text-transform: uppercase;
  }
  .at14-val { color: var(--at14-ink); }
  .at14-cap {
    position: absolute; left: 10px; bottom: 8px;
    font: 500 11px/1 ui-monospace, monospace;
    color: var(--at14-ink); opacity: 0.45;
    letter-spacing: 0.04em; text-transform: uppercase;
    user-select: none; pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .at14-tick, .at14-rotor { transition-duration: 0.01ms !important; }
  }
</style>

<body>
<div class="at14-stage">
  <div class="at14-unit">
    <div class="at14-dial" id="at14-dial" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="10" aria-valuenow="6" aria-label="Drive Detent Knob">
      <svg class="at14-svg" viewBox="0 0 116 104" aria-hidden="true">
        <g id="at14-ticks"></g>
        <circle class="at14-base" cx="58" cy="58" r="30"/>
        <g class="at14-rotor" id="at14-rotor">
          <circle class="at14-cap-top" cx="58" cy="58" r="24"/>
          <line class="at14-needle" x1="58" y1="36" x2="58" y2="48"/>
        </g>
      </svg>
    </div>
    <div class="at14-readout">
      <span>DRIVE</span>
      <span class="at14-val" id="at14-out">06 / 10</span>
    </div>
  </div>
</div>
<div class="at14-cap" aria-hidden="true">Atelier Snap Dial</div>
<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var dial = document.getElementById("at14-dial");
  var ticksGrp = document.getElementById("at14-ticks");
  var rotor = document.getElementById("at14-rotor");
  var out = document.getElementById("at14-out");
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var total = 10, step = 6, ticks = [];

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "forever:theme" && (e.data.theme === "light" || e.data.theme === "dark")) {
      root.setAttribute("data-theme", e.data.theme);
    }
  });

  for (var i = 0; i <= total; i++) {
    var deg = -135 + (i / total) * 270;
    var rad = (deg - 90) * (Math.PI / 180);
    var ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
    ln.setAttribute("x1", (58 + Math.cos(rad) * 37).toFixed(1));
    ln.setAttribute("y1", (58 + Math.sin(rad) * 37).toFixed(1));
    ln.setAttribute("x2", (58 + Math.cos(rad) * 44).toFixed(1));
    ln.setAttribute("y2", (58 + Math.sin(rad) * 44).toFixed(1));
    ln.setAttribute("class", "at14-tick");
    ticksGrp.appendChild(ln);
    ticks.push(ln);
  }

  function setStep(s) {
    step = Math.max(0, Math.min(total, Math.round(s)));
    var deg = -135 + (step / total) * 270;
    rotor.style.transform = "rotate(" + deg + "deg)";
    for (var i = 0; i < ticks.length; i++) {
      ticks[i].classList.toggle("is-on", i <= step);
    }
    dial.setAttribute("aria-valuenow", String(step));
    out.textContent = String(step).padStart(2, "0") + " / 10";
  }
  setStep(step);

  var targets = [9, 3, 7, 1, 6];
  var tIdx = 0;
  var demo = !reduce && (!window.__foreverPreview || window.__foreverPreview.demoEnabled !== false);
  var initTimer = null, demoTimer = null;

  function stepDemo() {
    if (!demo || reduce || document.hidden) return;
    setStep(targets[tIdx % targets.length]);
    tIdx++;
  }
  function startDemo() {
    if (demo && !reduce && !demoTimer) demoTimer = setInterval(stepDemo, 1800);
  }
  function stopDemo() {
    if (initTimer) { clearTimeout(initTimer); initTimer = null; }
    if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }
  }
  function takeover() { demo = false; stopDemo(); }

  var dragStartY = 0, dragStartVal = step, dragging = false;
  window.addEventListener("forever:interactive", takeover);
  dial.addEventListener("pointerdown", function (e) {
    takeover();
    dragging = true;
    dragStartY = e.clientY;
    dragStartVal = step;
    if (dial.setPointerCapture) dial.setPointerCapture(e.pointerId);
  });
  dial.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    setStep(dragStartVal + (dragStartY - e.clientY) / 12);
  });
  dial.addEventListener("pointerup", function () { dragging = false; });
  dial.addEventListener("pointercancel", function () { dragging = false; });
  dial.addEventListener("keydown", function (e) {
    takeover();
    if (e.key === "ArrowUp" || e.key === "ArrowRight") { e.preventDefault(); setStep(step + 1); }
    else if (e.key === "ArrowDown" || e.key === "ArrowLeft") { e.preventDefault(); setStep(step - 1); }
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopDemo(); else if (demo) startDemo();
  });

  if (demo) {
    initTimer = setTimeout(stepDemo, 260);
    startDemo();
  }
})();
</script>
</body>
