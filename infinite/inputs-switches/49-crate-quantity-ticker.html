<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Crate Quantity Ticker — hold-to-repeat stepper with rolling odometer total and accessible status updates.">
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crate Quantity Ticker</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
:root{--b:#131316;--i:#F1F1F4;--m:#9A9CA6;--l:#2B2C31;--s:#1F2024;--c:#7B95C4;color-scheme:dark}
:root[data-theme="light"]{--b:#EFF0F3;--i:#000;--m:#5F616B;--l:#CDCFD8;--s:#E1E3EA;--c:#2B4473;color-scheme:light}
html,body{margin:0;height:100%;overflow:hidden;background:var(--b);color:var(--i);font:14px/1.3 "Avenir Next",Avenir,system-ui,sans-serif}
.cr16-st,.cr16-st *{box-sizing:border-box}
.cr16-st{position:relative;width:100%;height:100%;display:grid;place-items:center;padding:clamp(8px,3vmin,20px);background:var(--b);color:var(--i)}
.cr16-st :focus-visible{outline:2px solid var(--c);outline-offset:2px}
.cr16-tk{display:grid;justify-items:center;gap:clamp(8px,4vmin,18px);width:100%}
.cr16-it{display:flex;align-items:center;gap:clamp(7px,2.5vmin,10px)}
.cr16-art{display:block;width:clamp(28px,10vmin,44px);aspect-ratio:1;border-radius:2px}
.cr16-it b,.cr16-it small{display:block;font-size:clamp(11px,3.2vmin,14px)}.cr16-it small{color:var(--m);font-size:clamp(10px,2.8vmin,12px)}
.cr16-tot{font-family:Futura,"Avenir Next",sans-serif;font-size:clamp(24px,10vmin,44px);font-weight:700;line-height:1;white-space:nowrap}
.cr16-step{display:flex;align-items:center;gap:2px;padding:3px;border:1.5px solid var(--i);border-radius:999px}
.cr16-ib{display:inline-grid;place-items:center;width:clamp(26px,9vmin,38px);height:clamp(26px,9vmin,38px);border-radius:50%;border:0;background:none;padding:0;color:inherit;cursor:pointer;touch-action:manipulation;transition:background .2s,scale .15s,opacity .2s}
.cr16-ib:hover{background:var(--s)}.cr16-ib:active{scale:.9}.cr16-ib[aria-disabled="true"]{opacity:.35;cursor:default}
.cr16-ic{display:block;width:clamp(13px,4.5vmin,18px);height:clamp(13px,4.5vmin,18px);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cr16-q{display:block;min-width:clamp(30px,10vmin,44px);text-align:center;font-weight:700;font-size:clamp(13px,4vmin,17px)}
.cr16-rl{display:inline-block;overflow:hidden;height:1.15em;line-height:1.15em;vertical-align:bottom;text-align:center}
.cr16-rl[data-t="d"]{width:.66em}.cr16-rc{display:block;transition:transform .5s ease}.cr16-rs{display:block;height:1.15em;font-style:normal}
.cr16-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.cr16-cap{position:absolute;left:10px;bottom:8px;font:500 11px/1 ui-monospace,monospace;color:var(--i);opacity:.45;letter-spacing:.04em;text-transform:uppercase;pointer-events:none;user-select:none}
@media (prefers-reduced-motion:reduce){.cr16-st *{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/inputs-switches/49-crate-quantity-ticker.html",
 "title": "Crate Quantity Ticker",
 "description": "Quantity stepper with directional odometer digit roll, accelerating press-and-hold repeat, and limit bump feedback.",
 "useWhen": "Cart item quantities, order counters, and compact numeric adjusters.",
 "avoidWhen": "Arbitrary decimal numbers or wide value ranges.",
 "agentPrompt": "Edit --b/--i/--c/--l tokens in :root and [data-theme=\"light\"].",
 "editableAreas": [
  "theme CSS tokens (--b/--i/--c/--l), data arrays & timings"
 ],
 "preserveElements": [
  "IIFE + crNN- prefix, reduced-motion, visibilitychange, theme/demo-v1"
 ],
 "knownLimitations": [
  "Demo state resets on remount"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "themeable",
  "light-ready"
 ],
 "tags": [
  "stepper",
  "odometer",
  "counter",
  "hold-repeat",
  "input",
  "crate"
 ]
}
</script>
</head>
<body>
<div class="cr16-st" id="cr16-st"></div>
<div class="cr16-cap" aria-hidden="true">Quantity Ticker</div>
<script>(()=>{
  const s=document.getElementById('cr16-st'),RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  const anim=(el,kf,o)=>RM()?{finished:Promise.resolve()}:el.animate(kf,Object.assign({duration:260,easing:'cubic-bezier(.2,.8,.2,1)'},o));
  const shake=el=>anim(el,[{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(4px)'},{transform:'none'}],{duration:280});
  const roller=el=>{let slots=[],first=true;return str=>{const ch=[...String(str)].reverse();ch.forEach((c,i)=>{let sl=slots[i],isN=!sl;if(isN){sl=slots[i]=document.createElement('span');sl.className='cr16-rl';el.prepend(sl)}if(c>='0'&&c<='9'){if(sl.dataset.t!=='d'){sl.dataset.t='d';sl.innerHTML='<span class="cr16-rc">'+'0123456789'.replace(/\d/g,'<i class="cr16-rs">$&</i>')+'</span>';const col=sl.firstChild;col.style.transition='none';col.style.transform=`translateY(${first?-c*10:0}%)`;col.offsetHeight;col.style.transition=''}sl.firstChild.style.transitionDelay=i*35+'ms';sl.firstChild.style.transform=`translateY(${-c*10}%)`}else{sl.dataset.t='s';sl.textContent=c}if(isN&&!first)anim(sl,[{width:'0px',opacity:0},{width:sl.offsetWidth+'px',opacity:1}],{duration:240})});while(slots.length>ch.length){const sl=slots.pop();sl.remove()}first=false}};
  const I=d=>`<svg class="cr16-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`,P=24;
  s.innerHTML=`<div class="cr16-tk"><div class="cr16-it"><svg class="cr16-art" viewBox="0 0 10 10" aria-hidden="true"><rect width="10" height="10" fill="#F2F0EA"/><circle cx="3.8" cy="6.2" r="3.4" fill="#2B4473"/><rect x="6.4" y="1" width=".8" height="8" fill="#0A0A0A"/><circle cx="8.5" cy="1.8" r=".6" fill="#D5412B"/></svg><div><b>Low Tide</b><small>£${P} each</small></div></div><div class="cr16-tot" data-fit-clip-ok aria-hidden="true"></div><span class="cr16-sr" role="status"></span><div class="cr16-step" role="group" aria-label="Quantity"><button type="button" class="cr16-ib" aria-label="Decrease quantity" data-d="-1">${I('M5 12h14')}</button><span class="cr16-q" data-fit-clip-ok aria-hidden="true"></span><button type="button" class="cr16-ib" aria-label="Increase quantity" data-d="1">${I('M12 5v14M5 12h14')}</button></div></div>`;
  const tot=roller(s.querySelector('.cr16-tot')),qEl=roller(s.querySelector('.cr16-q')),sr=s.querySelector('.cr16-sr'),btns=[...s.querySelectorAll('.cr16-ib')],qBox=s.querySelector('.cr16-q');
  const fmt=n=>'£'+n.toLocaleString('en-GB',{minimumFractionDigits:2});
  let q=1,rep=0,st=0,timer=0,kick=0,ds=0;
  const paint=an=>{tot(fmt(q*P));qEl(q);btns[0].setAttribute('aria-disabled',String(q<=1));btns[1].setAttribute('aria-disabled',String(q>=99));
    if(an){clearTimeout(st);st=setTimeout(()=>sr.textContent=`Quantity ${q}, total ${fmt(q*P)}`,350)}};
  const step=(d,an=true)=>{const n=q+d;if(n<1||n>99){shake(qBox);return false}q=n;paint(an);return true};
  const halt=()=>{clearTimeout(rep);rep=0};
  btns.forEach(b=>{const d=+b.dataset.d;
    b.addEventListener('pointerdown',e=>{if(e.button)return;halt();if(!step(d))return;let gap=420;const tick=()=>{if(step(d)){gap=Math.max(45,gap*.8);rep=setTimeout(tick,gap)}};rep=setTimeout(tick,gap)});
    ['pointerup','pointerleave','pointercancel','blur'].forEach(t=>b.addEventListener(t,halt));
    b.addEventListener('click',e=>{e.detail||step(d)});b.addEventListener('contextmenu',e=>e.preventDefault())});
  paint(false);

  let demo=!RM()&&!(window.__foreverPreview&&window.__foreverPreview.demoEnabled===false);
  const sq=[1,1,1,-1,-1,-1];
  const play=()=>{if(!demo||RM()||document.hidden)return;step(sq[ds++%sq.length],false)};
  const stop=()=>{clearInterval(timer);clearTimeout(kick);halt();clearTimeout(st);timer=kick=st=0},start=()=>{if(!timer&&demo&&!RM())timer=setInterval(play,950)},tk=()=>{demo=false;clearInterval(timer);clearTimeout(kick);timer=kick=0};
  window.addEventListener('forever:interactive',tk);s.addEventListener('pointerdown',tk,true);s.addEventListener('keydown',tk,true);
  document.addEventListener('visibilitychange',()=>document.hidden?stop():demo&&start());
  window.addEventListener('message',e=>{if(e.data&&e.data.type==='forever:theme'&&(e.data.theme==='light'||e.data.theme==='dark'))document.documentElement.setAttribute('data-theme',e.data.theme)});
  if(demo){kick=setTimeout(play,550);start()}
})();</script>
</body>
</html>
