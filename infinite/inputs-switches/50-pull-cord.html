<script>
(function(){
"use strict";
var D=document,root=D.documentElement,$=function(i){return D.getElementById(i);},svg=$("pc-s"),cord=$("pc-c"),bead=$("pc-b"),hit=$("pc-h"),hb=$("pc-hb"),sw=$("pc-sw"),stg=$("pc-st"),gh=$("pc-g"),M=Math;

for(var i=0;i<N;i++){var x=AX+(demo?M.sin(i/3)*i*1.4:0),y=AY+i*SEG;pts.push({x:x,y:y,px:x,py:y});}
function aria(){sw.setAttribute("aria-checked",getComputedStyle(stg).getPropertyValue("--pc-on").trim()==="1");}
function flip(){stg.classList.toggle("pc-flip");aria();}
aria();
window.addEventListener("message",function(e){

function toSvg(cx,cy){var m=svg.getScreenCTM();if(!m)return{x:0,y:0};var p=svg.createSVGPoint();p.x=cx;p.y=cy;p=p.matrixTransform(m.inverse());return{x:p.x,y:p.y};}

function step(){
var e=0,i,p,q,k;

if(grab){p=pts[grab.i];p.x=grab.x;p.y=grab.y;}
for(i=0;i<N-1;i++){
p=pts[i];q=pts[i+1];
var L=SEG*(grab&&i>=grab.i?1:1+st),dx=q.x-p.x,dy=q.y-p.y,d=M.hypot(dx,dy)||0.001,f=(d-L)/d,pin=i===0||grab&&i===grab.i,qin=grab&&i+1===grab.i;

else if(qin&&!pin){p.x+=dx*f;p.y+=dy*f;}
else if(!pin){p.x+=dx*f/2;p.y+=dy*f/2;q.x-=dx*f/2;q.y-=dy*f/2;}

}
function paint(){
var d="M"+pts.map(function(p){return p.x.toFixed(1)+" "+p.y.toFixed(1);}).join("L"),b=pts[N-1];

bead.setAttribute("cx",b.x.toFixed(1));bead.setAttribute("cy",b.y.toFixed(1));hb.setAttribute("cx",b.x.toFixed(1));hb.setAttribute("cy",b.y.toFixed(1));
var s=toScr(b.x,b.y);sw.style.transform="translate("+(s.x-22).toFixed(1)+"px,"+(s.y-22).toFixed(1)+"px)";

function runDemo(ts){

var t=(ts-t0)%5200,n=M.floor((ts-t0)/5200),b=pts[N-1],s;
if(t>=350&&t<1150){

})();
