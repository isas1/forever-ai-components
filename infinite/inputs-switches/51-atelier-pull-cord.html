<body>
<div class="at28-stage" id="at28-stage">
  <svg class="at28-svg" id="at28-svg" viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <path class="at28-cn" d="M66 70L24 168h152L134 70z"/>

<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var stage = document.getElementById("at28-stage");
  var svg = document.getElementById("at28-svg");
  var cord = document.getElementById("at28-cord");
  var hitEl = document.getElementById("at28-hit");
  var bead = document.getElementById("at28-bead");
  var ring = document.getElementById("at28-ring");
  var sw = document.getElementById("at28-sw");
  var cap = document.querySelector(".at28-cap");
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var demo = !reduce && (!window.__foreverPreview || window.__foreverPreview.demoEnabled !== false);
  var AX = 118, AY = 72, L = 60, N = 8;
  var pts = [], i, raf = 0, hand = null, armed = true, toggled = false, t0 = 0;
  for (i = 0; i < N; i++) pts.push({ x: AX, y: AY + L * i / (N - 1), px: AX, py: AY + L * i / (N - 1) });

  function mode() {
    var eve = (root.getAttribute("data-theme") !== "light") !== toggled;
    stage.classList.toggle("is-day", !eve);
    sw.setAttribute("aria-checked", eve ? "true" : "false");
    if (cap) cap.classList.toggle("is-flip", toggled);
  }
  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "forever:theme" && (e.data.theme === "light" || e.data.theme === "dark")) {
      root.setAttribute("data-theme", e.data.theme);
      mode();
    }
  });
  function flip() { toggled = !toggled; mode(); }

  function paint() {
    var d = "M" + pts[0].x.toFixed(1) + " " + pts[0].y.toFixed(1), e = pts[N - 1];
    for (i = 1; i < N - 1; i++) {
      d += "Q" + pts[i].x.toFixed(1) + " " + pts[i].y.toFixed(1) + " " + ((pts[i].x + pts[i + 1].x) / 2).toFixed(1) + " " + ((pts[i].y + pts[i + 1].y) / 2).toFixed(1);
    }
    d += "L" + e.x.toFixed(1) + " " + e.y.toFixed(1);
    cord.setAttribute("d", d); hitEl.setAttribute("d", d);
    bead.setAttribute("cx", e.x.toFixed(1)); bead.setAttribute("cy", e.y.toFixed(1));
    ring.setAttribute("cx", e.x.toFixed(1)); ring.setAttribute("cy", e.y.toFixed(1));
  }
  function step(h) {
    var seg = L / (N - 1), p, q, k, dx, dy, d, f, move = 0;
    if (h) {
      dx = h.x - AX; dy = h.y - AY; d = Math.sqrt(dx * dx + dy * dy) || 1;
      var pull = Math.max(0, d - L) * 0.42, len = Math.min(d, L) + pull;
      if (pull > 9 && armed) { armed = false; flip(); }
      seg = Math.max(seg, len / (N - 1));
      p = pts[N - 1]; p.x = p.px = AX + dx / d * len; p.y = p.py = AY + dy / d * len;
    }
    for (i = 1; i < N - (h ? 1 : 0); i++) {
      p = pts[i]; dx = (p.x - p.px) * 0.985; dy = (p.y - p.py) * 0.985;
      p.px = p.x; p.py = p.y; p.x += dx; p.y += dy + 0.32;
      move += Math.abs(dx) + Math.abs(dy);
    }
    for (k = 0; k < 10; k++) {
      for (i = 0; i < N - 1; i++) {
        p = pts[i]; q = pts[i + 1];
        dx = q.x - p.x; dy = q.y - p.y; d = Math.sqrt(dx * dx + dy * dy) || 1; f = (d - seg) / d / 2;
        var a = i === 0 ? 0 : (h && i + 1 === N - 1 ? 2 : 1), b = h && i + 1 === N - 1 ? 0 : (i === 0 ? 2 : 1);
        p.x += dx * f * a; p.y += dy * f * a; q.x -= dx * f * b; q.y -= dy * f * b;
      }
    }
    return move;
  }
  function tick(ts) {
    raf = 0;
    if (document.hidden) return;
    var h = hand;
    if (demo) {
      if (!t0) t0 = ts;
      var c = (ts - t0) % 3400;
      if (c < 620) { var e = Math.sin(c / 620 * Math.PI / 2); h = { x: AX + 8 * e, y: AY + L + 30 * e }; } else armed = true;
    }
    var move = step(h);
    paint();
    if (demo || hand || move > 0.03) raf = requestAnimationFrame(tick);
  }
  function kick() { if (!raf && !reduce && !document.hidden) raf = requestAnimationFrame(tick); }
  function take() { if (demo) { demo = false; armed = true; } }
  function at(e) {
    var m = svg.getScreenCTM(), p = svg.createSVGPoint();
    p.x = e.clientX; p.y = e.clientY;
    return m ? p.matrixTransform(m.inverse()) : { x: AX, y: AY + L };
  }

  window.addEventListener("forever:interactive", take);
  hitEl.addEventListener("pointerdown", function (e) {
    take();
    if (reduce) { flip(); return; }
    var p = at(e);
    hand = { x: p.x, y: p.y, ox: pts[N - 1].x - p.x, oy: pts[N - 1].y - p.y };
    hand.x += hand.ox; hand.y += hand.oy;
    armed = true;
    if (hitEl.setPointerCapture) hitEl.setPointerCapture(e.pointerId);
    kick();
  });
  hitEl.addEventListener("pointermove", function (e) {
    if (!hand) return;
    var p = at(e);
    hand.x = p.x + hand.ox; hand.y = p.y + hand.oy;
  });
  function drop() { hand = null; armed = true; kick(); }
  hitEl.addEventListener("pointerup", drop);
  hitEl.addEventListener("pointercancel", drop);
  sw.addEventListener("click", function () {
    take(); flip();
    if (!reduce) { pts[N - 1].py -= 5; pts[N - 1].px += 1.5; kick(); }
  });
  sw.addEventListener("focus", function () { stage.classList.toggle("is-kb", sw.matches(":focus-visible")); });
  sw.addEventListener("blur", function () { stage.classList.remove("is-kb"); });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = 0; } } else kick();
  });

  mode(); paint();
  if (demo) kick();
})();
</script>
