<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Several Circles — Abstract Geometric Improvisations. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Several Circles</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract);
     the light re-theme is the [data-theme="light"] block. JS reads --kan01-c* / -blend-* */
  :root{
    --kan01-bg:#17151a; --kan01-ink:#16130f; --kan01-line:#f4efe2;
    --kan01-c1:#B29234; --kan01-c2:#f7c80b; --kan01-c3:#d8321b; --kan01-c4:#C08459; --kan01-c5:#1f7a4d; --kan01-c6:#5a3e1a;
    --kan01-halo-a:#f4efe2; --kan01-halo-b:#f7c80b;
    --kan01-blend-a:screen; --kan01-blend-b:lighten;
    --kan01-cap:#f4efe2; --kan01-cap-o:.46;
  }
  :root[data-theme="light"]{
    --kan01-bg:#f4efe2; --kan01-line:#16130f;
    --kan01-c1:#7f6825; --kan01-c2:#a68605; --kan01-c3:#ca2f19; --kan01-c4:#945f38; --kan01-c5:#1f7a4d; --kan01-c6:#5a3e1a;
    --kan01-halo-a:#16130f; --kan01-halo-b:#836a04;
    --kan01-blend-a:multiply; --kan01-blend-b:darken;
    --kan01-cap:#16130f; --kan01-cap-o:.5;
  }
  html,body{margin:0;height:100%;background:var(--kan01-bg);overflow:hidden}
  #kan01-stage{position:fixed;inset:0;width:100%;height:100%}
  .kan01-sky{position:absolute;inset:0;}
  .kan01-orb{position:absolute;border-radius:50%;will-change:transform;}
  .kan01-halo{position:absolute;border-radius:50%;border:2px solid var(--kan01-ink);opacity:.5;}
  @keyframes kan01-drift{
    0%{transform:translate(0,0) scale(1);}
    50%{transform:translate(var(--dx),var(--dy)) scale(var(--sc));}
    100%{transform:translate(0,0) scale(1);}
  }
  @keyframes kan01-pulse{0%,100%{transform:scale(1);opacity:.5;}50%{transform:scale(1.35);opacity:.12;}}
  @keyframes kan01-sway{0%,100%{transform:rotate(-18deg) scaleX(1);}50%{transform:rotate(-15deg) scaleX(1.03);}}
  .kan01-line{position:absolute;left:6%;top:80%;width:88%;height:3px;background:var(--kan01-line);transform:rotate(-18deg);transform-origin:left center;opacity:.85;animation:kan01-sway 11s ease-in-out infinite;}
  @media(prefers-reduced-motion:reduce){.kan01-line{animation:none;}}
  .kan01-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--kan01-cap);opacity:var(--kan01-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/kandinsky/01-several-circles.html",
 "title": "Several Circles",
 "description": "13 coloured discs drift and pulse on a charcoal ground with blend-mode overlaps and halos; a pale diagonal line sways below. An abstract composition.",
 "useWhen": "Art-inspired hero backgrounds, ambient gallery displays, or contexts wanting painterly generative motion with a fine-art reference.",
 "avoidWhen": "Layouts needing legible content overlaid or a light background — the dark ground and blended circles compete with text.",
 "agentPrompt": "Change the circle count from N=13 to N=20, add '#ff6b00' to the cols array, and slow drift by changing the max duration from 18 to 28 seconds. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "circle count (N=13)",
  "color palette (cols array)",
  "drift distance (--dx/--dy range +/-30px)",
  "drift duration (9-18s range)",
  "halo probability (Math.random()<0.5)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "IIFE wrapper",
  "prefers-reduced-motion guard (REDUCED check on all animations)",
  "role=img + aria-label on stage div",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Circle positions randomised each load — layout not deterministic",
  "Background color hardcoded (#17151a) — edit CSS to change dark ground"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "circles",
  "generative",
  "css-animation",
  "art",
  "ambient",
  "blend-mode"
 ]
}
</script>
</head>
<body>
<div id="kan01-stage" role="img" aria-label="Several drifting circles: ochre, cadmium and vermilion discs drift and pulse on their own slow breath against a charcoal ground, a single pale line crossing below.">
  <div class="kan01-sky" id="kan01-sky"></div>
</div>
<div class="kan01-cap">Several Circles</div>
<script>
(function(){
  "use strict";
  const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sky=document.getElementById('kan01-sky'); if(!sky) return;
  const root=document.documentElement;
  // every colour the script paints with lives in a token; syncTheme re-reads them and
  // repaints the discs/halos already in the DOM (screen/lighten on the dark ground,
  // multiply/darken on paper — additive blending has no meaning over a light field)
  const cols=[]; const orbs=[], halos=[];
  let blendA='screen', blendB='lighten', haloA='#f4efe2', haloB='#f7c80b';
  function syncTheme(){
    const cs=getComputedStyle(root), g=n=>cs.getPropertyValue(n).trim();
    cols.length=0; for(let i=1;i<=6;i++) cols.push(g('--kan01-c'+i));
    blendA=g('--kan01-blend-a'); blendB=g('--kan01-blend-b');
    haloA=g('--kan01-halo-a');   haloB=g('--kan01-halo-b');
    for(const o of orbs){ o.el.style.background=cols[o.ci]; o.el.style.mixBlendMode=o.s?blendA:blendB; }
    for(const h of halos){ h.el.style.borderColor=h.a?haloA:haloB; }
  }
  addEventListener('message',function(e){
    const d=e.data;
    if(d && d.type==='forever:theme' && (d.theme==='light'||d.theme==='dark')){
      root.setAttribute('data-theme',d.theme); syncTheme();
    }
  });
  syncTheme();
  const N=13;
  for(let i=0;i<N;i++){
    const o=document.createElement('div');
    o.className='kan01-orb';
    const d=22+Math.random()*120;
    const x=Math.random()*82+4, y=Math.random()*72+6;
    const c=cols[i%cols.length];
    o.style.width=o.style.height=d+'px';
    o.style.left=x+'%'; o.style.top=y+'%';
    o.style.background=c;
    o.style.opacity=(0.55+Math.random()*0.4).toFixed(2);
    o.style.mixBlendMode=i%3?blendA:blendB;
    orbs.push({el:o,ci:i%cols.length,s:!!(i%3)});
    if(!REDUCED){
      o.style.setProperty('--dx',(Math.random()*60-30).toFixed(0)+'px');
      o.style.setProperty('--dy',(Math.random()*60-30).toFixed(0)+'px');
      o.style.setProperty('--sc',(0.8+Math.random()*0.5).toFixed(2));
      o.style.animation=`kan01-drift ${(9+Math.random()*9).toFixed(1)}s ease-in-out ${(-Math.random()*8).toFixed(1)}s infinite`;
    }
    sky.appendChild(o);
    if(Math.random()<0.5){
      const h=document.createElement('div');
      h.className='kan01-halo';
      const hd=d*(1.4+Math.random());
      h.style.width=h.style.height=hd+'px';
      h.style.left=`calc(${x}% + ${d/2}px - ${hd/2}px)`;
      h.style.top=`calc(${y}% + ${d/2}px - ${hd/2}px)`;
      h.style.borderColor=i%2?haloA:haloB;
      halos.push({el:h,a:!!(i%2)});
      if(!REDUCED) h.style.animation=`kan01-pulse ${(5+Math.random()*5).toFixed(1)}s ease-in-out ${(-Math.random()*4).toFixed(1)}s infinite`;
      sky.appendChild(h);
    }
  }
  const line=document.createElement('div');
  line.className='kan01-line';
  sky.appendChild(line);
})();
</script>
</body>
</html>
