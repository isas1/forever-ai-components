<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Concentric Resonance — Abstract Geometric Improvisations. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concentric Resonance</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract);
     the light re-theme is the [data-theme="light"] block. JS reads --kan04-c* / -alt */
  :root{
    --kan04-bg:#17151a;
    --kan04-c1:#C43131; --kan04-c2:#f7c80b; --kan04-c3:#d8321b; --kan04-c4:#C08459; --kan04-c5:#1f7a4d;
    --kan04-alt:#f4efe2;
    --kan04-cap:#f4efe2; --kan04-cap-o:.46;
  }
  :root[data-theme="light"]{
    --kan04-bg:#f4efe2;
    --kan04-c1:#c43131; --kan04-c2:#836a04; --kan04-c3:#ca2f19; --kan04-c4:#945f38; --kan04-c5:#1f7a4d;
    --kan04-alt:#16130f;
    --kan04-cap:#16130f; --kan04-cap-o:.5;
  }
  html,body{margin:0;height:100%;background:var(--kan04-bg);overflow:hidden}
  #kan04-stage{position:fixed;inset:0;width:100%;height:100%}
  #kan04-cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  .kan04-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--kan04-cap);opacity:var(--kan04-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/kandinsky/04-concentric-resonance.html",
 "title": "Concentric Resonance",
 "description": "Colored rings burst outward from random points on a dark field, fading as they expand — abstract's concentric forms in perpetual motion.",
 "useWhen": "Art-themed hero backgrounds, ambient displays, dark-mode canvases needing gentle generative motion.",
 "avoidWhen": "Light backgrounds (hardcoded dark bg). Contexts requiring user interaction — it runs fully autonomously with no pointer response.",
 "agentPrompt": "Change the auto-strike interval from 1.4s to 0.8s, add PAL.green as a third ring color alternate, and increase ring count per strike from 4 to 6. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "auto-strike interval (autoT > 1.4)",
  "ring count per strike (i < 4)",
  "ring speed range (sp: 60 + i*22)",
  "color palette (cols array)",
  "fade duration (g.t/2.4)",
  "max rings cap (80)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "DPR-aware canvas sizing (fitCanvas)",
  "visibilitychange pause/resume",
  "prefers-reduced-motion guard",
  "ring cap splice (rings.length > 80)",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "No pointer/click interaction — rings only emit on auto-timer",
  "Background color hardcoded in CSS (#17151a)",
  "Reduced-motion mode renders a static frame loop (30 draws) rather than a true single static image"
 ],
 "tier": "curated",
 "labels": [
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "mobile-ready",
  "agent-ready",
  "light-ready"
 ],
 "tags": [
  "rings",
  "concentric",
  "generative",
  "canvas",
  "ambient",
  "ripple"
 ]
}
</script>
</head>
<body>
<div id="kan04-stage" role="img" aria-label="Concentric resonance: rings race outward from struck points like a gong, colour following pitch, sounding tone after tone of their own accord across a charcoal field.">
  <canvas id="kan04-cv"></canvas>
</div>
<div class="kan04-cap">Concentric Resonance</div>
<script>
(function(){
  "use strict";
  const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv=document.getElementById('kan04-cv'); if(!cv) return;
  const root=document.documentElement;
  // ring colours live in tokens; rings store a palette index so a live theme flip
  // recolours the rings already in flight instead of stranding stale strings
  const cols=[]; let ALT='#f4efe2';
  function syncTheme(){
    const cs=getComputedStyle(root), g=n=>cs.getPropertyValue(n).trim();
    cols.length=0; for(let i=1;i<=5;i++) cols.push(g('--kan04-c'+i));
    ALT=g('--kan04-alt');
  }
  addEventListener('message',function(e){
    const d=e.data;
    if(d && d.type==='forever:theme' && (d.theme==='light'||d.theme==='dark')){
      root.setAttribute('data-theme',d.theme); syncTheme();
    }
  });
  syncTheme();
  function fitCanvas(c){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const r=c.getBoundingClientRect();
    const w=Math.max(2,r.width), h=Math.max(2,r.height);
    c.width=Math.round(w*dpr); c.height=Math.round(h*dpr);
    const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
    return {ctx,w,h,dpr};
  }
  let S=fitCanvas(cv);
  const rings=[];
  function strike(x,y){
    const base=(Math.random()*cols.length)|0;
    for(let i=0;i<4;i++) rings.push({x,y,r:6+i*8,k:base,alt:!(i%2),t:0,sp:60+i*22});
  }
  let last=performance.now(), autoT=0;
  function draw(now){
    const dt=(now-last)/1000; last=now; autoT+=dt;
    if(!REDUCED && autoT>1.4){autoT=0; strike(40+Math.random()*(S.w-80),40+Math.random()*(S.h-80));}
    S.ctx.clearRect(0,0,S.w,S.h);
    for(const g of rings){
      if(!REDUCED){ g.t+=dt; g.r+=g.sp*dt; }
      const a=Math.max(0,1-g.t/2.4);
      if(a<=0){g.dead=true;continue;}
      S.ctx.globalAlpha=a;S.ctx.strokeStyle=g.alt?ALT:cols[g.k];S.ctx.lineWidth=2.5;
      S.ctx.beginPath();S.ctx.arc(g.x,g.y,g.r,0,7);S.ctx.stroke();
    }
    S.ctx.globalAlpha=1;
    for(let i=rings.length-1;i>=0;i--) if(rings[i].dead) rings.splice(i,1);
    if(rings.length>80) rings.splice(0,rings.length-80);
  }
  strike(S.w*0.5,S.h*0.5);

  let raf=0, running=false;
  function loop(){ if(!running) return; draw(performance.now()); raf=requestAnimationFrame(loop); }
  function start(){ if(running) return; running=true; last=performance.now(); raf=requestAnimationFrame(loop); }
  function stop(){ running=false; if(raf) cancelAnimationFrame(raf); raf=0; }

  let _rt;
  window.addEventListener('resize',()=>{ clearTimeout(_rt); _rt=setTimeout(()=>{ S=fitCanvas(cv); if(REDUCED) draw(performance.now()); },150); }, {passive:true});
  document.addEventListener('visibilitychange',()=>{ if(REDUCED) return; if(document.hidden) stop(); else start(); });

  if(REDUCED){ for(let i=0;i<30;i++) draw(performance.now()); }
  else start();
})();
</script>
</body>
</html>
