<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="The Great Gate of the Spiritual — Abstract Geometric Improvisations. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Great Gate of the Spiritual</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract);
     the light re-theme is the [data-theme="light"] block. The canvas paints its own
     trail wash, so --kan10-fade must match the page ground in both themes. */
  :root{
    --kan10-bg:#17151a; --kan10-fade:rgba(23,21,26,0.28); --kan10-ray:rgba(244,239,226,.18);
    --kan10-stroke:#f4efe2;
    --kan10-c1:#879CA1; --kan10-c2:#1DACC9; --kan10-c3:#d8321b; --kan10-c4:#C0B459; --kan10-c5:#1f7a4d;
    --kan10-cap:#f4efe2; --kan10-cap-o:.46;
  }
  :root[data-theme="light"]{
    --kan10-bg:#f4efe2; --kan10-fade:rgba(244,239,226,0.28); --kan10-ray:rgba(22,19,15,.20);
    --kan10-stroke:#16130f;
    --kan10-c1:#5c7075; --kan10-c2:#14778b; --kan10-c3:#ca2f19; --kan10-c4:#776e2d; --kan10-c5:#1f7a4d;
    --kan10-cap:#16130f; --kan10-cap-o:.5;
  }
  html,body{margin:0;height:100%;background:var(--kan10-bg);overflow:hidden}
  #kan10-stage{position:fixed;inset:0;width:100%;height:100%}
  #kan10-cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  .kan10-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--kan10-cap);opacity:var(--kan10-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/kandinsky/10-great-gate-of-the-spiritual.html",
 "title": "The Great Gate of the Spiritual",
 "description": "7 concentric coloured arcs breathe outward from a focal point while 36 radial rays beat rhythmically; a stacked circle and triangle pulse at the centre gate.",
 "useWhen": "Dark-mode hero backgrounds, art/gallery contexts, ambient looping screensavers inspired by abstract expressionism.",
 "avoidWhen": "Light-background UIs (background hardcoded dark near-black). Contexts requiring legible text overlays — the motion competes with reading.",
 "agentPrompt": "Change the arc count from 7 to 9 by setting N=9, shift the focal point upward with cy=H*0.5, and replace PAL.blue with '#0a6e6e' for a teal centre circle. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "arc count (N=7)",
  "focal point position (cy=H*0.62)",
  "ray count (rays=36)",
  "colour palette (PAL object)",
  "breath speed (t*1.2 phase)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "DPR-aware fitCanvas() sizing",
  "visibilitychange pause/resume",
  "prefers-reduced-motion guard with static fallback",
  "IIFE wrapper",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Background colour hardcoded in CSS (#17151a) — must edit to change dark field",
  "No pointer interactivity — purely passive",
  "Trail-based rendering (fillRect with alpha) can leave ghost artefacts on some GPU compositors"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "canvas",
  "arcs",
  "radial",
  "ambient",
  "abstract",
  "generative"
 ]
}
</script>
</head>
<body>
<div id="kan10-stage" role="img" aria-label="A closing chord: concentric coloured arcs breathe outward from a single point while radiating teal bell-rays beat, a stacked circle, triangle and square pulsing at the gate.">
  <canvas id="kan10-cv"></canvas>
</div>
<div class="kan10-cap">The Great Gate of the Spiritual</div>
<script>
(function(){
  "use strict";
  const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv=document.getElementById('kan10-cv'); if(!cv) return;
  const root=document.documentElement;
  // every colour the canvas paints with is read from a token, once per theme — never per frame
  const C={}, cols=[];
  function syncTheme(){
    const cs=getComputedStyle(root), g=n=>cs.getPropertyValue(n).trim();
    C.fade=g('--kan10-fade'); C.ray=g('--kan10-ray'); C.stroke=g('--kan10-stroke');
    cols.length=0; for(let i=1;i<=5;i++) cols.push(g('--kan10-c'+i));
    C.blue=cols[0]; C.yellow=cols[1];
  }
  addEventListener('message',function(e){
    const d=e.data;
    if(d && d.type==='forever:theme' && (d.theme==='light'||d.theme==='dark')){
      root.setAttribute('data-theme',d.theme); syncTheme();
    }
  });
  syncTheme();
  function fitCanvas(c){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const r=c.getBoundingClientRect();
    const w=Math.max(2,r.width), h=Math.max(2,r.height);
    c.width=Math.round(w*dpr); c.height=Math.round(h*dpr);
    const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
    return {ctx,w,h,dpr};
  }
  let S=fitCanvas(cv);
  let t=0,last=performance.now();
  function draw(now){
    const dt=(now-last)/1000;last=now;
    if(!REDUCED) t+=dt;
    const ctx=S.ctx,W=S.w,H=S.h, cx=W*0.5, cy=H*0.62, R=Math.min(W,H)*0.62;
    ctx.fillStyle=C.fade;ctx.fillRect(0,0,W,H);
    const rays=36;
    for(let i=0;i<rays;i++){
      const a=(i/rays)*Math.PI*2;
      const beat=0.6+0.4*Math.sin(t*2 + i*0.4);
      const len=R*0.5*beat;
      ctx.strokeStyle=i%3? C.ray:C.yellow;
      ctx.globalAlpha=i%3?0.5:0.35;
      ctx.lineWidth=i%6===0?2.5:1;
      ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*22,cy+Math.sin(a)*22);
      ctx.lineTo(cx+Math.cos(a)*(22+len),cy+Math.sin(a)*(22+len));ctx.stroke();
    }
    ctx.globalAlpha=1;
    const N=7;
    for(let i=0;i<N;i++){
      const phase=t*1.2 - i*0.5;
      const breath=(Math.sin(phase)*0.5+0.5);
      const r=18 + i*(R/N)*0.9 + breath*16;
      ctx.strokeStyle=cols[i%cols.length];
      ctx.lineWidth=3+(i%2?0:2);
      ctx.globalAlpha=0.55+0.4*breath;
      ctx.beginPath();
      const s=-Math.PI*0.95 + Math.sin(t*0.5+i)*0.2;
      const e= Math.PI*0.95 + Math.sin(t*0.4+i)*0.2;
      ctx.arc(cx,cy,r, s, e);
      ctx.stroke();
    }
    ctx.globalAlpha=1;
    ctx.fillStyle=C.blue;ctx.beginPath();ctx.arc(cx,cy,15+3*Math.sin(t*3),0,7);ctx.fill();
    ctx.fillStyle=C.yellow;ctx.beginPath();
    const ts=10+2*Math.sin(t*3+1);ctx.moveTo(cx,cy-ts-8);ctx.lineTo(cx+ts,cy-8+ts*.4);ctx.lineTo(cx-ts,cy-8+ts*.4);ctx.closePath();ctx.fill();
    ctx.strokeStyle=C.stroke;ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,15+3*Math.sin(t*3),0,7);ctx.stroke();
  }

  let raf=0, running=false;
  function loop(){ if(!running) return; draw(performance.now()); raf=requestAnimationFrame(loop); }
  function start(){ if(running) return; running=true; last=performance.now(); raf=requestAnimationFrame(loop); }
  function stop(){ running=false; if(raf) cancelAnimationFrame(raf); raf=0; }

  let _rt;
  window.addEventListener('resize',()=>{ clearTimeout(_rt); _rt=setTimeout(()=>{ S=fitCanvas(cv); if(REDUCED) draw(performance.now()); },150); }, {passive:true});
  document.addEventListener('visibilitychange',()=>{ if(REDUCED) return; if(document.hidden) stop(); else start(); });

  if(REDUCED){ draw(performance.now()); }
  else start();
})();
</script>
</body>
</html>
