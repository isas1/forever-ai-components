<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="The word WAVES~ in aquamarine, each letter bobbing and rotating along a sine wave with hue shifts on deep teal.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wavy Sine</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract);
     the light re-theme is the [data-theme="light"] block. --c08-l feeds the JS hue loop. */
  :root{
    --c08-bg:#001b2e; --c08-l:75%; --c08-ink:#7fffd4; --c08-glow:rgba(127,255,212,.3);
    --c08-cap:#7fffd4; --c08-cap-o:.35;
  }
  :root[data-theme="light"]{
    --c08-bg:#eef4f9; --c08-l:25%; --c08-ink:#067953; --c08-glow:rgba(6,121,83,.2);
    --c08-cap:#10283a; --c08-cap-o:.5;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--c08-bg);}
  body{display:flex;align-items:center;justify-content:center;
       font-family:"Helvetica Neue",Arial,sans-serif;}
  #wave{display:flex;}
  #wave span{
    display:inline-block;
    font-size:clamp(36px,16vw,120px);
    font-weight:800;
    color:var(--c08-ink);
    will-change:transform;
    text-shadow:0 0 16px var(--c08-glow);
  }
  .cap{position:absolute;left:10px;bottom:8px;font-size:11px;letter-spacing:.08em;
       color:var(--c08-cap);opacity:var(--c08-cap-o);text-transform:uppercase;font-weight:600;}
</style>
<script type="application/json" id="forever-agent-meta">

 ],

</head>
<body>
  <div id="wave"></div>
  <div class="cap">Wavy Sine</div>
<script>
(function(){
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var root = document.documentElement;
  var text="WAVES~";
  var host=document.getElementById('wave');
  var spans=[];
  for(var i=0;i<text.length;i++){
    var s=document.createElement('span');
    s.textContent=text[i]===' '?' ':text[i];
    host.appendChild(s); spans.push(s);
  }
  var t=0, raf=0, amp=0.28;
  var lastHue=[];
  var lightness='75%';
  function syncTheme(){        // JS-drawn colors read the token, so CSS stays the single source
    lightness = (getComputedStyle(root).getPropertyValue('--c08-l')||'75%').trim();
    lastHue=[];                 // force a recolor pass on the next frame
  }
  function frame(){
    t+=0.06;
    for(var i=0;i<spans.length;i++){
      var ph=t - i*0.55;
      var sin=Math.sin(ph);
      var y=sin*26;
      var rot=Math.cos(ph)*10;
      var hue=Math.round(160+ sin*40);
      spans[i].style.transform='translateY('+y.toFixed(2)+'px) rotate('+rot.toFixed(2)+'deg)';
      if(hue!==lastHue[i]){ spans[i].style.color='hsl('+hue+',90%,'+lightness+')'; lastHue[i]=hue; }
    }
    raf=requestAnimationFrame(frame);
  }
  function start(){ if(!raf&&!reduce) raf=requestAnimationFrame(frame); }
  function stop(){ cancelAnimationFrame(raf); raf=0; }
  document.addEventListener('visibilitychange',function(){document.hidden?stop():start();});
  // live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
  addEventListener('message', function(e){
    var d = e.data;
    if (d && d.type === 'forever:theme' && (d.theme === 'light' || d.theme === 'dark')) {
      root.setAttribute('data-theme', d.theme);
      syncTheme();
    }
  });
  syncTheme();
  if(!reduce) start(); else for(var si=0;si<spans.length;si++){ spans[si].style.color='hsl(160,90%,'+lightness+')'; }
})();
</script>
</body>
</html>
