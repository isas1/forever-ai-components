<!doctype html>
<html lang="en">
<head>
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta charset="utf-8">
<meta name="description" content="Thin pink word BREATHE whose letter-spacing widens and tightens like a slow breath, hairlines glowing in the gaps from the center out.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kerning Breath</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults; light re-theme = the [data-theme="light"] block.
     --kb-accent-rgb feeds the JS text-shadow (same colour as --kb-accent, comma triple for rgba()). */
  :root{
    --kb-bg:#1a1014; --kb-ink:#ffd9e2; --kb-accent:#ff7b9c; --kb-accent-rgb:255,123,156; --cap-o:.34;
  }
  :root[data-theme="light"]{
    --kb-bg:#faf1f3; --kb-ink:#a80028; --kb-accent:#db0037; --kb-accent-rgb:219,0,55; --cap-o:.5;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--kb-bg);}
  .kb-stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
       font-family:"Helvetica Neue",Helvetica,Arial,"Segoe UI",sans-serif;}
  .kb-word{
    display:flex;white-space:nowrap;
    font-size:clamp(18px,12vw,112px);
    font-weight:200;
    color:var(--kb-accent);
    will-change:contents;
  }
  .kb-word .kb-g{
    display:inline-block;
    color:var(--kb-ink);
  }
  .kb-word .kb-sp{
    display:inline-block;
    position:relative;
  }
  .kb-cap{position:fixed;right:11px;bottom:9px;font-size:10px;letter-spacing:.22em;
       color:var(--kb-accent);opacity:var(--cap-o);text-transform:uppercase;pointer-events:none;
       font-family:ui-monospace,"SFMono-Regular",monospace;}
#kb-kbWord:focus-visible{outline:2px solid currentColor;outline-offset:-3px}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/kinetic-type/13-kerning-breath.html",
 "title": "Kerning Breath",
 "description": "The word BREATHE expands and contracts letter-spacing in a slow 5.2-second breath cycle; hairline glows pulse in each gap, rippling outward from center.",
 "useWhen": "Meditation, wellness, or calm-brand hero sections. Ambient idle screens where slow organic motion sets tone. Autonomous preview ends at first deliberate input and never resumes.",
 "avoidWhen": "High-information layouts where subtle glow competes with content. Contexts needing static, legible display text.",
 "agentPrompt": "Change the word to 'INHALE', slow the breath to 8 seconds (period=8), and shift the glow color from #ff7b9c to #7bc8ff. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "word content (word variable)",
  "breath period in seconds (period=5.2)",
  "gap range in em (MINGAP=0.02, MAXGAP=0.74)",
  "glow color (#ff7b9c)",
  "ripple phase spread (0.34 multiplier)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "IIFE wrapper",
  "prefers-reduced-motion guard with static fallback",
  "visibilitychange pause/resume",
  "phase offset array for center-out ripple",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)",
  "demo-v1 preview lifecycle: initialize demoEnabled from window.__foreverPreview and stop attract work on the window forever:interactive event; retain manual feedback, settling, cleanup and explicit sessions",
  "Enter/Space activation and visible focus; manual word/geometry changes finish before the renderer sleeps"
 ],
 "knownLimitations": [
  "Pointer nudge (push) adds abrupt gap expansion that may feel jarring in calm contexts",
  "Font weight 200 requires a system font with thin weight — may render heavier on some Android devices",
  "State remains local to each mounted instance; format/theme remount preserves takeover, not component values."
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "typography",
  "kerning",
  "breathing",
  "glow",
  "loop",
  "ambient",
  "kinetic-text"
 ]
}
</script>
</head>
<body>
  <div class="kb-stage"><div class="kb-word" id="kb-kbWord" tabindex="0" role="button" aria-label="Activate kinetic text."></div></div>
  <div class="kb-cap">Kerning Breath</div>
<script>
(function(){
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var word = "BREATHE";
  var root = document.getElementById('kb-kbWord');
  var glyphs=[], gaps=[];

  // build glyph spans interleaved with breathing-gap spans
  for(var i=0;i<word.length;i++){
    var g=document.createElement('span'); g.className='kb-g'; g.textContent=word[i];
    root.appendChild(g); glyphs.push(g);
    if(i<word.length-1){
      var s=document.createElement('span'); s.className='kb-sp';
      root.appendChild(s); gaps.push(s);
    }
  }

  var raf=0, t=0, push=0;
  // per-gap phase offset so the breath ripples outward from the centre
  var mid=(gaps.length-1)/2;
  var phase=gaps.map(function(_,i){ return Math.abs(i-mid)*0.34; });

  // eased breath: slow inhale, held top, slower exhale, held bottom
  function breath(x){
    // x in [0,1) over the cycle; map to 0..1..0 with long holds
    var u;
    if(x<0.42){ u=ease(x/0.42); }                 // inhale (wide)
    else if(x<0.5){ u=1; }                         // hold full
    else if(x<0.92){ u=1-ease((x-0.5)/0.42); }     // exhale (tight)
    else { u=0; }                                  // hold empty
    return u;
  }
  function ease(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }

  var MINGAP=0.02, MAXGAP=0.30; // em

  // cache font size once; re-read only on resize (never inside the rAF loop)
  var fs=100;
  function measure(){ fs=parseFloat(getComputedStyle(root).fontSize)||100; }
  measure();

  function render(){
    for(var i=0;i<gaps.length;i++){
      var ph=(t - phase[i]);
      var u=breath(((ph%1)+1)%1);
      var em=MINGAP + (MAXGAP-MINGAP)*u;
      gaps[i].style.width=(em*fs + push*22*u)+'px';
    }
    paintLines();
  }

  // JS-drawn colour: the hairline gradient and text-shadow are built from the
  // --kb-accent(-rgb) tokens so they stay in sync with the CSS accent across themes.
  var htmlEl=document.documentElement;
  var C={accent:'#ff7b9c', accentRgb:'255,123,156'};
  function lineBg(){ return 'linear-gradient(to bottom,transparent,'+C.accent+',transparent)'; }
  function syncTheme(){
    var cs=getComputedStyle(htmlEl);
    C.accent = (cs.getPropertyValue('--kb-accent')||'#ff7b9c').trim();
    C.accentRgb = (cs.getPropertyValue('--kb-accent-rgb')||'255,123,156').trim();
    for(var i=0;i<lines.length;i++){ lines[i].style.background = lineBg(); } // rebuild cached gradient
    lastPeak=-1; // force text-shadow rewrite on next frame
  }

  // lightweight hairlines drawn as child nodes (one per gap)
  var lines=gaps.map(function(g){
    var L=document.createElement('span');
    L.style.cssText='position:absolute;top:50%;left:50%;width:1px;height:0.5em;'+
      'transform:translate(-50%,-50%);opacity:0;pointer-events:none;';
    L.style.background=lineBg();
    g.appendChild(L); return L;
  });
  function paintLines(){
    for(var i=0;i<gaps.length;i++){
      var ph=(t - phase[i]);
      var u=breath(((ph%1)+1)%1);
      lines[i].style.opacity=(u*0.85).toFixed(3);
    }
    var peak=breath(((t%1)+1)%1);
    var pk=Math.round(peak*40)/40;           // quantize -> skip identical shadow rewrites
    if(pk!==lastPeak){
      lastPeak=pk;
      root.style.textShadow='0 0 '+(8+26*pk).toFixed(1)+'px rgba('+C.accentRgb+','+(0.15+0.4*pk).toFixed(3)+')';
    }
  }
  var lastPeak=-1;

  var last=0, period=5.2, demo=window.__foreverPreview?.demoEnabled!==false; // seconds per full breath
  function tick(now){
    if(!last) last=now;
    var dt=(now-last)/1000; last=now;
    if(demo)t += dt/period;
    push *= Math.pow(0.9, dt*60);
    render();
    if(demo||push>0.02)raf=requestAnimationFrame(tick);else raf=0;
  }
  function start(){ if(!raf&&!reduce){ last=0; raf=requestAnimationFrame(tick); } }
  function stop(){ cancelAnimationFrame(raf); raf=0; }
  function takeover(){demo=false;}
  window.addEventListener('forever:interactive',takeover,{once:true});document.addEventListener('pointerdown',takeover,{once:true});document.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key))takeover();});
  document.addEventListener('visibilitychange',function(){document.hidden?stop():start();});
  window.addEventListener('resize',function(){ measure(); render(); });
  // pointer nudge: a sharp inhale
  document.addEventListener('pointermove',function(){ push=Math.min(push+0.15,1.4); if(!demo)start(); });
  document.addEventListener('click',function(){ push=reduce&&push>0?0:1.8; if(reduce)render();else if(!demo)start(); });
  // live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
  addEventListener('message', function(e){
    var d = e.data;
    if(d && d.type==='forever:theme' && (d.theme==='light'||d.theme==='dark')){
      htmlEl.setAttribute('data-theme', d.theme);
      syncTheme();
      render();
    }
  });
  syncTheme();

  if(reduce){ t=0.46; render(); } else { render(); if(demo)start(); }
  root.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();root.click();}});
})();
</script>
</body>
</html>
