<!doctype html>
<html lang="en">
<head>
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta charset="utf-8">
<meta name="description" content="Teal split-flap letter reels spin and brake to lock onto each glyph of a word with motion-blur streaks and a flash on the dark green canvas.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ticker Tape Fall</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  :root{ --ttf-bg:#07120f; --ttf-bg-rgb:7,18,15; --ttf-accent:#2ec4b6; --ttf-accent-rgb:46,196,182; --ttf-ink:#d8fff7; --cap-o:.34; } /* canvas paints its own bg — JS reads these via syncTheme() */
  :root[data-theme="light"]{ --ttf-bg:#eef4f1; --ttf-bg-rgb:238,244,241; --ttf-accent:#1d7a71; --ttf-accent-rgb:29,122,113; --ttf-ink:#005c49; --cap-o:.5; }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ttf-bg);}
  #kt15-c{display:block;width:100%;height:100%;}
  .kt15-cap{position:fixed;left:9px;bottom:8px;font:600 10px/1.2 ui-monospace,"SFMono-Regular",monospace;
       letter-spacing:.14em;color:var(--ttf-accent);opacity:var(--cap-o);text-transform:uppercase;
       pointer-events:none;user-select:none;}
#kt15-c:focus-visible{outline:2px solid currentColor;outline-offset:-3px}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/kinetic-type/15-ticker-tape-fall.html",
 "title": "Ticker Tape Fall",
 "description": "Split-flap letter reels spin and brake staggered onto each letter with motion-blur streaks and a teal glow flash on lock. Auto-cycles four words.",
 "useWhen": "Dark-theme hero displays, departure/arrival board aesthetics, retro terminal branding, looping word reveals.",
 "avoidWhen": "Light backgrounds (hardcoded dark canvas). Words longer than ~8 chars may overflow on narrow viewports.",
 "agentPrompt": "Change the WORDS array to [\"LAUNCH\",\"DEPLOY\",\"SHIP\",\"BUILD\"] and set accent to #a855f7 (update fillStyle '#2ec4b6' and all shadowColor rgba values). Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "WORDS array (cycling word list)",
  "accent color (#2ec4b6 teal)",
  "lockAt stagger timing (0.9+i*0.62)",
  "hold duration before next word (2.6s)",
  "initial reel velocity (34+random*10)",
  "cell/font sizing ratio (cell*0.82)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "DPR-aware canvas sizing and setTransform",
  "reduced-motion static fallback (single resting frame)",
  "visibilitychange pause/start guard",
  "IIFE wrapper",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)",
  "demo-v1 preview lifecycle: initialize demoEnabled from window.__foreverPreview and stop attract work on the window forever:interactive event; retain manual feedback, settling, cleanup and explicit sessions",
  "Enter/Space activation and visible focus; manual word/geometry changes finish before the renderer sleeps"
 ],
 "knownLimitations": [
  "Background color hardcoded to #07120f — must change CSS and canvas fillRect to use a different background",
  "pointermove accelerates spinning reels but has no touch equivalent beyond click",
  "Very long words shrink glyphs significantly on short viewports",
  "State remains local to each mounted instance; format/theme remount preserves takeover, not component values."
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "split-flap",
  "typography",
  "canvas",
  "kinetic",
  "monospace",
  "motion-blur",
  "loop"
 ]
}
</script>
</head>
<body>
<canvas id="kt15-c" tabindex="0" role="button" aria-label="Activate kinetic text."></canvas>
<div class="kt15-cap">Ticker Tape Fall</div>
<script>
(function(){
  const cv=document.getElementById('kt15-c'),ctx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ALPHA="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const WORDS=["DESCEND","CASCADE","FALLING","GRAVITY"];
  let W,H,DPR,cell,fs,ox,oy,word,reels,wi=0,phase=0;
  const htmlEl=document.documentElement; // JS-drawn colours read from tokens via syncTheme()
  const C={bg:'#07120f',bgRgb:'7,18,15',accent:'#2ec4b6',accentRgb:'46,196,182',ink:'#d8fff7'};
  function syncTheme(){ const cs=getComputedStyle(htmlEl);
    C.bg=(cs.getPropertyValue('--ttf-bg')||C.bg).trim(); C.bgRgb=(cs.getPropertyValue('--ttf-bg-rgb')||C.bgRgb).trim();
    C.accent=(cs.getPropertyValue('--ttf-accent')||C.accent).trim(); C.accentRgb=(cs.getPropertyValue('--ttf-accent-rgb')||C.accentRgb).trim();
    C.ink=(cs.getPropertyValue('--ttf-ink')||C.ink).trim(); }
  syncTheme();
  function size(){ DPR=Math.min(devicePixelRatio||1,2);
    W=cv.clientWidth;H=cv.clientHeight;
    cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
    build();
  }
  function build(){
    word=WORDS[wi];
    const n=word.length;
    cell=Math.min(H/(n+1.4),W*0.62);
    fs=cell*0.82;
    ox=W/2;
    oy=(H-cell*n)/2+cell*0.5;
    reels=[];
    for(let i=0;i<n;i++){
      const tgt=ALPHA.indexOf(word[i]);
      reels.push({
        tgt:tgt,
        pos:0,            // scroll offset in glyph units (fractional)
        vel:34+Math.random()*10,
        lockAt:0.9+i*0.62,// staggered brake time (seconds)
        locked:false,
        flash:0
      });
    }
    phase=0;
  }
  const fnt=()=>'700 '+fs.toFixed(1)+'px ui-monospace,"SFMono-Regular",Menlo,monospace';
  let gc={},gk='';
  function gsp(ch,q){  // pre-rendered glow; q = lock flash 0..1, -1 = moving glyph
    const k=[fs,DPR,C.accentRgb,C.ink,C.accent].join();
    if(gk!==k){gk=k;gc={};}
    const id=ch+q;
    if(!gc[id]){
      const gl=q<0?8:10+q*22;
      const h=Math.ceil(fs*0.75+gl*2+4),n=Math.ceil(h*2*DPR),c=document.createElement('canvas'),g=c.getContext('2d');
      c.width=c.height=n;g.setTransform(DPR,0,0,DPR,n/2,n/2);
      g.font=fnt();
      g.textAlign='center';g.textBaseline='middle';
      g.shadowColor='rgba('+C.accentRgb+','+(q<0?.5:.55+q*.4).toFixed(2)+')';g.shadowBlur=gl;
      g.fillStyle=q<0?C.accent:C.ink;g.fillText(ch,0,0);
      gc[id]={c:c,h:h};
    }
    return gc[id];
  }
  function glyph(idx){ idx=((idx%26)+26)%26; return ALPHA[idx]; }

  let raf=0,last=0,hold=0;
  cv.addEventListener('pointermove',()=>{ reels&&reels.forEach(r=>{ if(!r.locked) r.vel+=2.2; }); if(!demo)start(); });
  cv.addEventListener('click',()=>{ takeover();wi=(wi+1)%WORDS.length;build();if(reduce)paintReduced();else start(); });

  let demo=window.__foreverPreview?.demoEnabled!==false;
  function frame(ts){
    if(!last)last=ts;
    let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05;
    phase+=dt;
    // trail / fade
    ctx.fillStyle='rgba('+C.bgRgb+',0.34)';ctx.fillRect(0,0,W,H);

    ctx.textAlign='center';ctx.textBaseline='middle';
    const ff=fnt();
    let allLocked=true;
    for(let i=0;i<reels.length;i++){
      const r=reels[i], cy=oy+i*cell;
      // physics: spin then brake onto target
      if(!r.locked){
        allLocked=false;
        if(phase<r.lockAt){
          r.pos+=r.vel*dt;
        } else {
          // ease the residual distance to the target glyph (pos integer == tgt at frac 0)
          if(r.targetPos===undefined){
            const base=Math.ceil(r.pos)+6+i; // a few more spins
            r.targetPos=base;
            // adjust so the resting glyph equals tgt
            const restIdx=((-Math.round(base))%26+26)%26;
            let diff=((r.tgt-restIdx)%26+26)%26;
            r.targetPos=base+diff;
          }
          const remain=r.targetPos-r.pos;
          if(remain<=0.001){
            r.pos=r.targetPos; r.locked=true; r.flash=1;
          } else {
            // critically-damped-ish approach
            const step=Math.max(remain*0.12, 0.55)*(dt*60);
            r.pos+=Math.min(step,remain);
          }
        }
      }
      if(r.flash>0) r.flash=Math.max(0,r.flash-dt*2.4);

      const fp=r.pos%1;                 // fractional scroll within a cell
      const speed=r.locked?0:(phase<r.lockAt?r.vel:Math.max(0,(r.targetPos-r.pos)*7));
      const blur=Math.min(1,speed/26);  // motion-blur amount

      // draw the reel: a few glyphs scrolling downward through the cell window
      ctx.save();
      ctx.beginPath();
      ctx.rect(ox-cell*0.62,cy-cell*0.5,cell*1.24,cell);
      ctx.clip();
      ctx.font=ff;
      for(let k=-2;k<=2;k++){
        const showIdx=Math.floor(r.pos)+k;
        const ch=glyph(-showIdx);
        const gy=cy + (k+fp)*cell;
        if(gy<cy-cell*0.9||gy>cy+cell*0.9) continue;
        const center=1-Math.min(1,Math.abs(gy-cy)/(cell*0.62));
        if(r.locked){
          if(k!==0) continue;
          ctx.globalAlpha=1;
          const e=gsp(ch,Math.round(r.flash*3)/3);
          ctx.drawImage(e.c,ox-e.h,gy-e.h,e.h*2,e.h*2);
          continue;
        }
        ctx.globalAlpha=(0.16+center*0.7)*(1-blur*0.45);
        ctx.fillStyle=C.accent;
        // motion-blur streaks: stamp ghosts along the travel direction
        if(blur>0.08){
          const streak=blur*cell*0.5;
          for(let s=1;s<=3;s++){
            ctx.globalAlpha=(0.10+center*0.22)*(1-s/4)*(1-blur*0.2);
            ctx.fillText(ch,ox,gy - streak*(s/3));
          }
          ctx.globalAlpha=0.16+center*0.62;
        }
        const e=gsp(ch,-1);
        ctx.drawImage(e.c,ox-e.h,gy-e.h,e.h*2,e.h*2);
      }
      ctx.restore();
      ctx.globalAlpha=1;

      // lock indicator: a thin accent baseline that snaps in
      if(r.locked||r.flash>0){
        ctx.strokeStyle='rgba('+C.accentRgb+','+(0.18+r.flash*0.5)+')';
        ctx.lineWidth=1;
        const lw=fs*0.34;
        ctx.beginPath();
        ctx.moveTo(ox-lw,cy+cell*0.42);ctx.lineTo(ox+lw,cy+cell*0.42);ctx.stroke();
      }
    }

    if(allLocked){
      hold+=dt;
      if(demo&&hold>2.6){hold=0;wi=(wi+1)%WORDS.length;build();}
    } else hold=0;

    if(demo||!allLocked)raf=requestAnimationFrame(frame);else raf=0;
  }
  function start(){ if(!raf&&!reduce){ last=0; raf=requestAnimationFrame(frame);} }
  function stop(){ cancelAnimationFrame(raf); raf=0; }
  function paintReduced(){ // single resting frame: every reel locked on target
    ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font=fnt();
    for(let i=0;i<reels.length;i++){
      const cy=oy+i*cell;
      const e=gsp(word[i],0.1);
      ctx.drawImage(e.c,ox-e.h,cy-e.h,e.h*2,e.h*2);
      ctx.strokeStyle='rgba('+C.accentRgb+',0.2)';ctx.lineWidth=1;
      const lw=fs*0.34;ctx.beginPath();
      ctx.moveTo(ox-lw,cy+cell*0.42);ctx.lineTo(ox+lw,cy+cell*0.42);ctx.stroke();
    }
  }
  addEventListener('resize',size);
  function takeover(){demo=false;}
  window.addEventListener('forever:interactive',takeover,{once:true});document.addEventListener('pointerdown',takeover,{once:true});document.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key))takeover();});
  document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
  // live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
  addEventListener('message', e=>{ const d=e.data;
    if(d && d.type==='forever:theme' && (d.theme==='light'||d.theme==='dark')){ htmlEl.setAttribute('data-theme', d.theme); syncTheme(); if(reduce) paintReduced(); }
  });
  size();
  if(reduce){ paintReduced(); } else if(demo)start(); else paintReduced();
  cv.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();cv.click();}});
})();
</script>
</body>
</html>
