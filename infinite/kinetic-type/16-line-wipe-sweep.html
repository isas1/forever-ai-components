<!doctype html>
<html lang="en">
<head>
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta charset="utf-8">
<meta name="description" content="A bright gold scan bar sweeps down outlined letters, developing them into solid glowing fill with a hot edge, like a darkroom print emerging">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Line Wipe Sweep</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults; light re-theme = the [data-theme="light"] block.
     canvas paints its own bg every frame, so JS reads these via syncTheme(), not CSS. */
  :root{
    --lws-bg:#12060c; --lws-accent:#ffd166; --lws-accent-rgb:255,209,102;
    --lws-hot:#fff7e0; --lws-spark:#fff3cf; --cap-o:.34;
  }
  :root[data-theme="light"]{
    --lws-bg:#f7f0f3; --lws-accent:#8f6400; --lws-accent-rgb:143,100,0;
    --lws-hot:#664c00; --lws-spark:#664c00; --cap-o:.5;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--lws-bg);}
  #kt16-c{display:block;width:100%;height:100%;}
  .kt16-cap{position:fixed;left:9px;bottom:8px;font:600 10px/1.2 ui-monospace,"SFMono-Regular",monospace;
       letter-spacing:.14em;color:var(--lws-accent);opacity:var(--cap-o);text-transform:uppercase;
       pointer-events:none;user-select:none;}
#kt16-c:focus-visible{outline:2px solid currentColor;outline-offset:-3px}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/kinetic-type/16-line-wipe-sweep.html",
 "title": "Line Wipe Sweep",
 "description": "A gold scan bar sweeps down outlined letters, filling them with glowing solid color as it passes — like a darkroom print developing. Cycles through four words.",
 "useWhen": "Hero text reveals, loading screens, or brand moments where a dramatic develop/reveal effect fits. Dark backgrounds only.",
 "avoidWhen": "Light backgrounds (BG is hardcoded dark maroon). Contexts where auto-cycling word changes would distract from surrounding content.",
 "agentPrompt": "Change the words array to [\"LAUNCH\",\"BUILD\",\"SHIP\",\"GROW\"], set ACC to '#00eaff' for a cyan glow, and slow the sweep speed by changing 0.012 to 0.007. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "words array (words=[...])",
  "accent color (ACC='#ffd166')",
  "sweep speed (0.012 base speed)",
  "hold pause duration (hold>70)",
  "font size scale (H*0.42)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "IIFE wrapper",
  "prefers-reduced-motion guard with static fallback",
  "visibilitychange pause/stop",
  "DPR-aware canvas sizing",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)",
  "demo-v1 preview lifecycle: initialize demoEnabled from window.__foreverPreview and stop attract work on the window forever:interactive event; retain manual feedback, settling, cleanup and explicit sessions",
  "Enter/Space activation and visible focus; manual word/geometry changes finish before the renderer sleeps"
 ],
 "knownLimitations": [
  "Background color hardcoded in CSS and JS — must change both BG constant and CSS to recolor",
  "Pointer nudge only accelerates sweep, not a full pointer interaction",
  "No aria labels on canvas or click target",
  "State remains local to each mounted instance; format/theme remount preserves takeover, not component values."
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "typography",
  "canvas",
  "scan",
  "wipe",
  "reveal",
  "darkroom",
  "monospace"
 ]
}
</script>
</head>
<body>
<canvas id="kt16-c" tabindex="0" role="button" aria-label="Activate kinetic text."></canvas>
<div class="kt16-cap">Line Wipe Sweep</div>
<script>
(function(){
  const cv=document.getElementById('kt16-c'),ctx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const words=["DEVELOP","REVEAL","IMPRINT","EXPOSE"];
  // JS-drawn colours — read from tokens so the canvas repaints correctly on theme switch
  const htmlEl=document.documentElement;
  const C={bg:'#12060c',accent:'#ffd166',accentRgb:'255,209,102',hot:'#fff7e0',spark:'#fff3cf'};
  function syncTheme(){
    const cs=getComputedStyle(htmlEl);
    C.bg=(cs.getPropertyValue('--lws-bg')||'#12060c').trim();
    C.accent=(cs.getPropertyValue('--lws-accent')||'#ffd166').trim();
    C.accentRgb=(cs.getPropertyValue('--lws-accent-rgb')||'255,209,102').trim();
    C.hot=(cs.getPropertyValue('--lws-hot')||'#fff7e0').trim();
    C.spark=(cs.getPropertyValue('--lws-spark')||'#fff3cf').trim();
  }
  syncTheme();
  let W,H,DPR,word=words[0],wi=0,fs,baseY,top,bot;
  function size(){
    DPR=Math.min(devicePixelRatio||1,2);
    W=cv.clientWidth;H=cv.clientHeight;
    cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
    fs=Math.min(W/(word.length*0.66),H*0.42);
    ctx.font='900 '+fs+'px ui-monospace,"SFMono-Regular",Menlo,monospace';
    baseY=H/2+fs*0.34;            // baseline
    top=baseY-fs*0.74; bot=baseY+fs*0.20; // glyph cap..baseline band
  }
  addEventListener('resize',function(){size();});
  // sweep position in px, plus afterglow trail markers
  let y=0,hold=0,raf=0,nudge=0;
  function reset(){ word=words[wi]; size(); y=top-fs*0.5; hold=0; }
  cv.addEventListener('pointermove',function(){ nudge=Math.min(nudge+0.6,2.4); if(!demo)start(); });
  cv.addEventListener('click',function(){ takeover();wi=(wi+1)%words.length;reset();if(reduce)paintReduced();else start(); });

  // Glows are baked into offscreen sprites (rebuilt on resize / word / theme change)
  // so the sweep only blits them; a live shadow blur per frame was the cost.
  let SP=null,spk='';
  function sprites(){
    const k=[W,H,DPR,fs,word,baseY,C.accent,C.accentRgb,C.hot,C.spark].join();
    if(spk===k)return;spk=k;
    const mk=(w,h,fn)=>{const c=document.createElement('canvas');c.width=Math.ceil(w*DPR);c.height=Math.ceil(h*DPR);
      const g=c.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);fn(g);return c;};
    const wordPaint=(col,glow,blur)=>g=>{
      g.font='900 '+fs+'px ui-monospace,"SFMono-Regular",Menlo,monospace';g.textAlign='center';g.textBaseline='alphabetic';
      g.fillStyle=col;g.shadowColor=glow;g.shadowBlur=blur;g.fillText(word,W/2,baseY);};
    const halfW=Math.min(W*0.42,word.length*fs*0.34),m=fs*0.8+4;
    SP={fill:mk(W,H,wordPaint(C.accent,'rgba('+C.accentRgb+',0.55)',fs*0.10)),
      hot:mk(W,H,wordPaint(C.hot,C.accent,fs*0.18)),m:m,
      bar:mk(halfW*2+m*2,m*2,g=>{
        const gr=g.createLinearGradient(m,0,m+halfW*2,0);
        gr.addColorStop(0,'rgba('+C.accentRgb+',0)');gr.addColorStop(.5,C.spark);gr.addColorStop(1,'rgba('+C.accentRgb+',0)');
        g.strokeStyle=gr;g.lineWidth=Math.max(2,fs*0.03);g.shadowColor=C.accent;g.shadowBlur=fs*0.4;
        g.beginPath();g.moveTo(m,m);g.lineTo(m+halfW*2,m);g.stroke();})};
  }
  function drawWord(sweepY){
    sprites();
    ctx.font='900 '+fs+'px ui-monospace,"SFMono-Regular",Menlo,monospace';
    ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    const cx=W/2, txt=word;
    // 1) outline (un-developed) of full word
    ctx.lineWidth=Math.max(1.2,fs*0.018);
    ctx.strokeStyle='rgba('+C.accentRgb+',0.30)';
    ctx.lineJoin='round';
    ctx.strokeText(txt,cx,baseY);
    // 2) solid fill, clipped to area ABOVE the sweep line (already developed)
    ctx.save();
    ctx.beginPath();
    ctx.rect(0,0,W,Math.max(0,sweepY));
    ctx.clip();
    ctx.drawImage(SP.fill,0,0,W,H);
    ctx.restore();
    // 3) hot edge where fill meets outline: a thin re-stroke clipped to a band at the line
    if(sweepY>top-2 && sweepY<bot+fs*0.3){
      ctx.save();
      ctx.beginPath();
      ctx.rect(0,sweepY-fs*0.06,W,fs*0.12);
      ctx.clip();
      ctx.drawImage(SP.hot,0,0,W,H);
      ctx.restore();
    }
  }

  var demo=window.__foreverPreview?.demoEnabled!==false;
  function frame(){
    ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H);
    // active band for the scan bar
    const start=top-fs*0.5, end=bot+fs*0.5;
    drawWord(y);
    // the scan bar itself (bright horizontal line + glow), spanning text width
    const cx=W/2, halfW=Math.min(W*0.42, word.length*fs*0.34);
    if(y>start-4 && y<end+4){
      ctx.drawImage(SP.bar,cx-halfW-SP.m,y-SP.m,halfW*2+SP.m*2,SP.m*2);
      // faint scan ticks above/below the bar
      ctx.strokeStyle='rgba('+C.accentRgb+',0.12)'; ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(cx-halfW,y-fs*0.07); ctx.lineTo(cx+halfW,y-fs*0.07);
      ctx.stroke();
    }
    if(!reduce){
      const spd=fs*(0.012+nudge*0.02);
      nudge*=0.93;
      if(y<end){y+=spd;}else{hold++;if(demo&&hold>70){wi=(wi+1)%words.length;reset();}}
    }
    if(demo||y<end)raf=requestAnimationFrame(frame);else raf=0;
  }
  function start(){ if(!raf && !reduce) raf=requestAnimationFrame(frame); }
  function stop(){ cancelAnimationFrame(raf); raf=0; }
  function paintReduced(){
    // static resting frame: word fully developed
    ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H);
    y=bot+fs; drawWord(y);
  }
  function takeover(){demo=false;}
  window.addEventListener('forever:interactive',takeover,{once:true});document.addEventListener('pointerdown',takeover,{once:true});document.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key))takeover();});
  document.addEventListener('visibilitychange',function(){document.hidden?stop():start();});
  // live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
  addEventListener('message', function(e){
    var d=e.data;
    if(d && d.type==='forever:theme' && (d.theme==='light'||d.theme==='dark')){
      htmlEl.setAttribute('data-theme', d.theme);
      syncTheme();
      if(reduce) paintReduced();
    }
  });
  reset();
  if(reduce){ paintReduced(); } else if(demo){start();} else {paintReduced();}
  cv.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();cv.click();}});
})();
</script>
</body>
</html>
