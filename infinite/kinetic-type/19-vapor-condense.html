<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Teal particle haze drifts and condenses into the crisp word VAPOR, then dissolves back into a soft glowing cloud on a near-black field.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vapor Condense</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults; light re-theme = the [data-theme="light"] block.
     canvas paints its own bg every frame and uses additive 'lighter' blending on black, so
     JS reads these via syncTheme() and switches to normal blending + more opaque particles in light. */
  :root{
    --vc-bg:#0b0f0e; --vc-bg-rgb:11,15,14; --vc-blend:lighter;
    --vc-vapor-rgb:80,170,180; --vc-core-rgb:168,230,220; --vc-accent:#a8dadc; --vc-accent-rgb:168,218,220;
    --vc-alpha-boost:0; --cap-o:.34;
  }
  :root[data-theme="light"]{
    --vc-bg:#eef4f3; --vc-bg-rgb:238,244,243; --vc-blend:source-over;
    --vc-vapor-rgb:69,151,161; --vc-core-rgb:35,123,109; --vc-accent:#237b6d; --vc-accent-rgb:35,123,109;
    --vc-alpha-boost:.2; --cap-o:.5;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--vc-bg);}
  #vc-c{display:block;width:100%;height:100%;}
  .vc-cap{position:fixed;left:9px;bottom:8px;font:600 10px/1.2 ui-monospace,"SFMono-Regular",monospace;
       letter-spacing:.16em;color:var(--vc-accent);opacity:var(--cap-o);text-transform:uppercase;
       pointer-events:none;user-select:none;}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/kinetic-type/19-vapor-condense.html",
 "title": "Vapor Condense",
 "description": "300 teal particles drift as a glowing haze then gradually condense into the crisp word VAPOR via cosine easing, then dissolve back — looping continuously.",
 "useWhen": "Dark-mode hero sections, loading screens, or ambient brand reveals where a word needs to emerge from atmospheric noise.",
 "avoidWhen": "Light backgrounds (hardcoded dark canvas). Contexts requiring fast legibility — the condense phase takes half the cycle.",
 "agentPrompt": "Change WORD to \"DREAM\", increase N to 450, and shift the teal palette by setting r/g/b base to rgba(120,80,220) in the color calculation. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "word content (WORD constant)",
  "particle count (N=300)",
  "cycle speed (t += 0.0052)",
  "drift spread (drift=18*scale)",
  "color teal base (r/g/b formula in frame loop)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "offscreen canvas pixel-sampling for anchor points",
  "visibilitychange pause/start",
  "prefers-reduced-motion static frame",
  "IIFE wrapper",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Background color hardcoded to near-black #0b0f0e — must edit CSS to change",
  "Click resets cycle to t=0 but pointermove nudge effect is very subtle",
  "No aria label on canvas — purely decorative"
 ],
 "tier": "curated",
 "labels": [
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "mobile-ready",
  "agent-ready",
  "light-ready"
 ],
 "tags": [
  "typography",
  "particles",
  "canvas",
  "condense",
  "vapor",
  "ambient",
  "generative"
 ]
}
</script>
</head>
<body>
<canvas id="vc-c"></canvas>
<div class="vc-cap">Vapor Condense</div>
<script>
(function(){
  const cv=document.getElementById('vc-c'),ctx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const WORD="VAPOR", N=300;   // capped particle count (was 900) — keeps the cloud dense but cheap
  let W,H,DPR,scale,anchors=[],P=[],t=0,nudge=0;
  // JS-drawn colours — read from tokens so the additive-glow canvas repaints correctly on theme switch
  const htmlEl=document.documentElement;
  const C={bg:'#0b0f0e',bgRgb:'11,15,14',blend:'lighter',vaporRgb:[80,170,180],coreRgb:[168,230,220],accent:'#a8dadc',accentRgb:'168,218,220',alphaBoost:0};
  function parseRgb(s,fallback){ var p=s.split(',').map(Number); return p.length===3&&p.every(n=>!isNaN(n))?p:fallback; }
  function syncTheme(){
    const cs=getComputedStyle(htmlEl);
    C.bg=(cs.getPropertyValue('--vc-bg')||'#0b0f0e').trim();
    C.bgRgb=(cs.getPropertyValue('--vc-bg-rgb')||'11,15,14').trim();
    C.blend=(cs.getPropertyValue('--vc-blend')||'lighter').trim();
    C.vaporRgb=parseRgb((cs.getPropertyValue('--vc-vapor-rgb')||'80,170,180').trim(),[80,170,180]);
    C.coreRgb=parseRgb((cs.getPropertyValue('--vc-core-rgb')||'168,230,220').trim(),[168,230,220]);
    C.accent=(cs.getPropertyValue('--vc-accent')||'#a8dadc').trim();
    C.accentRgb=(cs.getPropertyValue('--vc-accent-rgb')||'168,218,220').trim();
    C.alphaBoost=parseFloat(cs.getPropertyValue('--vc-alpha-boost'))||0;
  }
  syncTheme();

  // sample word pixels from an offscreen canvas -> anchor points
  function buildAnchors(){
    const oc=document.createElement('canvas'),octx=oc.getContext('2d');
    const fs=Math.round(Math.min(W,H)*0.42);
    oc.width=W; oc.height=H;
    octx.fillStyle='#fff';
    octx.font='800 '+fs+'px ui-monospace,"SFMono-Regular",monospace';
    octx.textAlign='center'; octx.textBaseline='middle';
    octx.fillText(WORD, W/2, H/2);
    const img=octx.getImageData(0,0,W,H).data, pts=[];
    const step=Math.max(3,Math.round(Math.min(W,H)/130));
    for(let y=0;y<H;y+=step){for(let x=0;x<W;x+=step){
      if(img[(y*W+x)*4+3]>128) pts.push([x,y]);
    }}
    // pick N evenly
    anchors=[];
    for(let i=0;i<N;i++) anchors.push(pts.length?pts[(i*pts.length/N)|0]:[W/2,H/2]);
  }

  function size(){
    DPR=Math.min(devicePixelRatio||1,2);
    W=cv.clientWidth;H=cv.clientHeight;
    cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
    scale=Math.min(W,H)/400;
    buildAnchors();
    if(!P.length){for(let i=0;i<N;i++)P.push({x:Math.random()*W,y:Math.random()*H,
      px:Math.random()*W,py:Math.random()*H,ph:Math.random()*6.28,sp:0.6+Math.random()*0.8});}
  }
  addEventListener('resize',size);

  cv.addEventListener('pointermove',e=>{nudge=1;});
  cv.addEventListener('click',()=>{t=0;});

  // cycle: 0..1 scatter-haze, 1..2 condense-sharp hold, then dissolve back
  function frame(){
    t+=reduce?0:0.0052;
    nudge*=0.93;
    // phase: smooth gather/scatter via cosine; cond=1 fully formed, 0 fully vapor
    const cyc=t%1;
    const cond=0.5-0.5*Math.cos(Math.max(0,Math.min(1,(cyc<0.5?cyc/0.5:1-(cyc-0.5)/0.5)))*Math.PI);
    const sharp=cond*cond; // sharpness lags behind gather

    ctx.fillStyle='rgba('+C.bgRgb+',0.28)';ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation=C.blend;

    const tt=t*60, drift=18*scale*(1-cond)+3*scale;
    for(let i=0;i<N;i++){
      const p=P[i],a=anchors[i];
      // haze target: wandering offset from anchor; condense target: the anchor itself
      const wob=Math.sin(tt*0.02*p.sp+p.ph), wob2=Math.cos(tt*0.017*p.sp+p.ph*1.7);
      const tx=a[0]+wob*drift*(2-cond)+(1-cond)*(p.px-a[0])*0.0,
            ty=a[1]+wob2*drift*(2-cond);
      // also pull from a dispersed cloud when vapor
      const cloudX=a[0]+(p.ph-3.14)*38*scale*(1-cond),
            cloudY=a[1]+(Math.sin(p.ph*3)*46*scale)*(1-cond);
      const gx=tx*cond+cloudX*(1-cond), gy=ty*cond+cloudY*(1-cond);
      const ease=0.045+0.08*cond + nudge*0.12;
      p.x+=(gx-p.x)*ease; p.y+=(gy-p.y)*ease;

      const rad=(1.05 + (1-sharp)*3.7 + nudge*1.5)*scale; // blurred big when vapor, tight when sharp (sized up for lower count)
      const al=Math.min(1,(0.05 + sharp*0.5) * (0.4+0.6*Math.abs(wob)) + C.alphaBoost);
      // cool teal vapor -> bright accent core (endpoints from tokens)
      const vr=C.vaporRgb, cr=C.coreRgb;
      const r=Math.round(vr[0]+sharp*(cr[0]-vr[0])), g=Math.round(vr[1]+sharp*(cr[1]-vr[1])), b=Math.round(vr[2]+sharp*(cr[2]-vr[2]));
      ctx.fillStyle='rgba('+r+','+g+','+b+','+al+')';
      ctx.beginPath();ctx.arc(p.x,p.y,rad,0,6.283);ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';
    raf=requestAnimationFrame(frame);
  }
  let raf=0;
  function start(){if(!raf&&!reduce)raf=requestAnimationFrame(frame);}
  function stop(){cancelAnimationFrame(raf);raf=0;}
  function paintReduced(){
    // one static resting frame: fully condensed crisp word
    ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation=C.blend;
    for(let i=0;i<N;i++){const a=anchors[i];
      ctx.fillStyle='rgba('+C.accentRgb+','+Math.min(1,0.55+C.alphaBoost)+')';
      ctx.beginPath();ctx.arc(a[0],a[1],1.15*scale,0,6.283);ctx.fill();}
    ctx.globalCompositeOperation='source-over';
  }
  document.addEventListener('visibilitychange',()=>{document.hidden?stop():start();});
  // live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
  addEventListener('message',e=>{
    const d=e.data;
    if(d && d.type==='forever:theme' && (d.theme==='light'||d.theme==='dark')){
      htmlEl.setAttribute('data-theme', d.theme);
      syncTheme();
      if(reduce) paintReduced();
    }
  });

  size();
  if(reduce){ paintReduced(); } else start();
})();
</script>
</body>
</html>
