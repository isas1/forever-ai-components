<script>/* theme hook: ?theme=light|dark, before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  :root {
    --at13-bg: #171614;
    --at13-surface-hi: #211F1C;
    --at13-ink: #F4F1EA;
    --at13-muted: #ADA699;
    --at13-border: #57524A;
    --at13-accent: #EC6A43;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --at13-bg: #F4F1EA;
    --at13-surface-hi: #FAF8F5;
    --at13-ink: #1C1B19;
    --at13-muted: #666158;
    --at13-border: #C5BEB0;
    --at13-accent: #C43B16;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background-color: var(--at13-bg); color: var(--at13-ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.25s ease, color 0.25s ease;
  }
  .at13-stage {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    padding: clamp(10px, 3vmin, 20px);
    padding-bottom: clamp(24px, 7vmin, 32px);
    background-color: var(--at13-bg); color: var(--at13-ink);
  }
  .at13-unit {
    width: min(224px, 100%);
    display: flex; flex-direction: column; gap: 10px;
  }
  .at13-pad {
    width: 100%; height: clamp(78px, 36vmin, 110px);
    display: flex; align-items: center; justify-content: center;
    cursor: crosshair; touch-action: none;
    background: var(--at13-surface-hi);
    border: 1.5px solid var(--at13-ink); border-radius: 6px;
    box-shadow: 0 2px 0 var(--at13-ink);
    overflow: hidden; padding: 0 10px;
  }
  .at13-pad:focus-visible { outline: 2px solid var(--at13-accent); outline-offset: 2px; }
  .at13-word {
    display: flex;
    font-size: clamp(22px, 12vw, 34px); font-weight: 700;
    color: var(--at13-ink); line-height: 1;
    transition: letter-spacing 80ms linear, transform 80ms linear;
  }
  .at13-char {
    display: inline-block;
    transition: transform 90ms ease-out;
  }
  .at13-readout {
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
    font-size: clamp(8.5px, 2.3vw, 10px); font-weight: 600;
    letter-spacing: 0.06em; color: var(--at13-muted);
    text-transform: uppercase;
  }
  .at13-val { color: var(--at13-ink); }
  .at13-cap {
    position: absolute; left: 10px; bottom: 8px;
    font: 500 11px/1 ui-monospace, monospace;
    color: var(--at13-ink); opacity: 0.45;
    letter-spacing: 0.04em; text-transform: uppercase;
    user-select: none; pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) {
    .at13-word, .at13-char { transition-duration: 0.01ms !important; }
  }
</style>

<body>
<div class="at13-stage">
  <div class="at13-unit">
    <div class="at13-pad" id="at13-pad" tabindex="0" role="slider" aria-label="Modulate Typography" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0">
      <div class="at13-word" id="at13-word">
        <span class="at13-char">S</span>
        <span class="at13-char">Y</span>
        <span class="at13-char">N</span>
        <span class="at13-char">C</span>
      </div>
    </div>
    <div class="at13-readout">
      <span>LFO MOD</span>
      <span class="at13-val" id="at13-out">SKEW: 0° / TRK: 4PX</span>
    </div>
  </div>
</div>
<div class="at13-cap" aria-hidden="true">Atelier Kinetic Type</div>
<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var pad = document.getElementById("at13-pad");
  var word = document.getElementById("at13-word");
  var chars = Array.prototype.slice.call(word.querySelectorAll(".at13-char"));
  var out = document.getElementById("at13-out");
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "forever:theme" && (e.data.theme === "light" || e.data.theme === "dark")) {
      root.setAttribute("data-theme", e.data.theme);
    }
  });

  function apply(nx, ny) {
    var skew = Math.round(nx * 18);
    var trk = Math.max(0, Math.round((nx + 1) * 4));
    word.style.letterSpacing = trk + "px";
    word.style.transform = "skewX(" + (-skew) + "deg)";
    for (var i = 0; i < chars.length; i++) {
      var wy = Math.sin(i * 1.3 + nx * 3) * ny * 7;
      chars[i].style.transform = "translateY(" + wy.toFixed(1) + "px)";
    }
    pad.setAttribute("aria-valuenow", String(Math.round(nx * 100)));
    out.textContent = "SKEW: " + skew + "° / TRK: " + trk + "PX";
  }

  var demo = !reduce && (!window.__foreverPreview || window.__foreverPreview.demoEnabled !== false);
  var rafId = 0, phase = 0.4;

  function tick() {
    rafId = 0;
    if (!demo || reduce || document.hidden) return;
    phase += 0.032;
    apply(Math.sin(phase) * 0.75, Math.cos(phase * 1.3) * 0.7);
    rafId = requestAnimationFrame(tick);
  }
  function startDemo() { if (demo && !reduce && !rafId) rafId = requestAnimationFrame(tick); }
  function stopDemo() { if (rafId) { cancelAnimationFrame(rafId); rafId = 0; } }
  function takeover() { demo = false; stopDemo(); }

  window.addEventListener("forever:interactive", takeover);
  pad.addEventListener("pointermove", function (e) {
    takeover();
    var r = pad.getBoundingClientRect();
    if (!r.width || !r.height) return;
    apply(((e.clientX - r.left) / r.width) * 2 - 1, ((e.clientY - r.top) / r.height) * 2 - 1);
  });
  pad.addEventListener("pointerleave", function () {
    if (!demo) apply(0, 0);
  });
  pad.addEventListener("keydown", function (e) {
    takeover();
    if (e.key === "ArrowRight") { e.preventDefault(); apply(0.7, 0.4); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); apply(-0.7, -0.4); }
    else if (e.key === "0") { apply(0, 0); }
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopDemo(); else if (demo) startDemo();
  });

  if (demo) startDemo();
})();
</script>
</body>
