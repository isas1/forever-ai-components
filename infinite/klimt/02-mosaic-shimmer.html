<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Mosaic Shimmer — Gold-Leaf Ornamental Studies. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mosaic Shimmer</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults. Light re-theme: the gold tesserae become
     deep gold/bronze on ivory, so the shimmer reads as gilding rather than glow. */
  :root{
    --kli02-bg:#0a0805; --kli02-t1:#9a7d28; --kli02-t2:#c8a951; --kli02-t3:#e6cf86;
    --kli02-gold:#c8a951; --kli02-a1:#1f6b4f; --kli02-a2:#b8331f; --kli02-a3:#1c3f8f;
    --kli02-cap:#e6cf86; --kli02-cap-o:.46;
  }
  :root[data-theme="light"]{
    --kli02-bg:#f8f3e8; --kli02-t1:#6b5518; --kli02-t2:#8f7328; --kli02-t3:#9e8640;
    --kli02-gold:#8f7328; --kli02-a1:#1a5c43; --kli02-a2:#a32a17; --kli02-a3:#16336f;
    --kli02-cap:#4a3a14; --kli02-cap-o:.66;
  }
  html,body{margin:0;height:100%;background:var(--kli02-bg);overflow:hidden}
  #kli02-stage{position:fixed;inset:0;width:100%;height:100%}
  .kli02-grid{position:absolute;inset:0;display:grid;gap:2px;padding:6px}
  .kli02-tess{position:relative;border-radius:2px;will-change:opacity,transform;
    background:linear-gradient(135deg,var(--kli02-t1),var(--kli02-t2) 50%,var(--kli02-t3));
    opacity:.32;transition:opacity .1s linear, transform .1s linear}
  .kli02-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--kli02-cap);opacity:var(--kli02-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/klimt/02-mosaic-shimmer.html",
 "title": "Mosaic Shimmer",
 "description": "A 14x10 grid of gold tesserae pulses in diagonal sine-wave shimmer; sparse jewel-toned accents pop against the gold, evoking Byzantine mosaic.",
 "useWhen": "Luxury or art-themed hero backgrounds, gold-leaf/Art Nouveau design contexts, ambient looping screensavers with a gold palette.",
 "avoidWhen": "Light backgrounds (hardcoded dark body). Contexts requiring legible text overlays — the constant tile scaling competes with content.",
 "agentPrompt": "Change grid to 18 columns and 12 rows by setting COLS=18 and ROWS=12, then shift accent colors to deep violet (#4b1fa0) and teal (#0d6b6b). Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "grid dimensions (COLS=14, ROWS=10)",
  "accent colors (accents array)",
  "wave speed (t*1.6 and t*0.9)",
  "scale on highlight (scale(1.06))",
  "accent tile probability (0.12)",
  "opacity range (0.22 + 0.6 * ...)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "IIFE wrapper",
  "prefers-reduced-motion guard with static fallback",
  "visibilitychange pause/resume",
  "role=img + aria-label on stage",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Background color hardcoded in CSS (#0a0805) — must edit to change from near-black",
  "Scale transform on individual DOM cells may cause jank at large grid sizes on low-end devices"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "mosaic",
  "gold",
  "grid",
  "shimmer",
  "ambient",
  "byzantine"
 ]
}
</script>
</head>
<body>
<div id="kli02-stage" role="img" aria-label="A field of gold tesserae in Byzantine mosaic manner: diagonal waves of light cross the grid, each tile catching and losing the gleam, with sparse jewel-toned accents.">
  <div class="kli02-grid" id="kli02-grid"></div>
</div>
<div class="kli02-cap">Mosaic Shimmer</div>
<script>
(function(){
  "use strict";
  const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const grid=document.getElementById('kli02-grid'); if(!grid) return;
  const root=document.documentElement;
  const COLS=14, ROWS=10;
  grid.style.gridTemplateColumns='repeat('+COLS+',1fr)';
  grid.style.gridTemplateRows='repeat('+ROWS+',1fr)';
  const cells=[];
  let GOLD='', accents=[];                 // JS-painted tesserae read their colours from the tokens
  function syncTheme(){
    const cs=getComputedStyle(root);
    GOLD=cs.getPropertyValue('--kli02-gold').trim();
    accents=['--kli02-a1','--kli02-a2','--kli02-a3'].map(function(v){return cs.getPropertyValue(v).trim();});
    for(const c of cells) if(c.ai>=0)      // repaint the jewel tesserae already in the grid
      c.d.style.background='linear-gradient(135deg,'+accents[c.ai]+','+GOLD+')';
  }
  addEventListener('message',function(e){
    const d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
      root.setAttribute('data-theme',d.theme); syncTheme();
    }
  });
  syncTheme();
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const d=document.createElement('div');d.className='kli02-tess';
    const ai=Math.random()<0.12?(Math.random()*accents.length)|0:-1;
    if(ai>=0) d.style.background='linear-gradient(135deg,'+accents[ai]+','+GOLD+')';
    grid.appendChild(d);
    cells.push({d, ai, diag:(c/COLS)+(r/ROWS)});
  }
  if(REDUCED){ cells.forEach(c=>c.d.style.opacity=(0.4+Math.random()*0.4).toFixed(2)); return; }
  let t=0,last=performance.now();
  function step(){
    if(!running) return;
    const now=performance.now();const dt=(now-last)/1000;last=now;t+=dt;
    for(const c of cells){
      const w1=Math.sin((c.diag*6.2)-t*1.6);
      const w2=Math.sin((c.diag*3.0)+t*0.9+1.4);
      const v=(w1*0.6+w2*0.4);
      const o=0.22+0.6*(v*0.5+0.5);
      c.d.style.opacity=o.toFixed(3);
      c.d.style.transform = v>0.7? 'scale(1.06)' : 'scale(1)';
    }
    raf=requestAnimationFrame(step);
  }
  let raf=0, running=false;
  function start(){ if(running) return; running=true; last=performance.now(); raf=requestAnimationFrame(step); }
  function stop(){ running=false; if(raf) cancelAnimationFrame(raf); raf=0; }
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) stop(); else start(); });
  start();
})();
</script>
</body>
</html>
