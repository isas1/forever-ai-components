<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Falling Gold — Gold-Leaf Ornamental Studies. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Falling Gold</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults. Light re-theme: the leaf flakes fall as two
     tones of deep gold/bronze on ivory, so the shimmer still separates the two populations. */
  :root{
    --kli06-bg:#070502; --kli06-gold:#c8a951; --kli06-hi:#e6cf86;
    --kli06-cap:#e6cf86; --kli06-cap-o:.46;
  }
  :root[data-theme="light"]{
    --kli06-bg:#f8f3e8; --kli06-gold:#7d6520; --kli06-hi:#5f4b12;
    --kli06-cap:#4a3a14; --kli06-cap-o:.66;
  }
  html,body{margin:0;height:100%;background:var(--kli06-bg);overflow:hidden}
  #kli06-stage{position:fixed;inset:0;width:100%;height:100%}
  #kli06-cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  .kli06-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--kli06-cap);opacity:var(--kli06-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/klimt/06-falling-gold.html",
 "title": "Falling Gold",
 "description": "Diamond-shaped gold flakes drift and sway downward against a near-black background, each shimmering in opacity as they tumble and rotate.",
 "useWhen": "Luxury or art-themed hero backgrounds, gold-leaf-inspired design systems, ambient dark-mode decorative panels.",
 "avoidWhen": "Light backgrounds (hardcoded dark canvas), contexts where falling motion competes with readable content, or low-end devices needing minimal repaints.",
 "agentPrompt": "Increase flake count by changing the divisor in `Math.round(S.w*S.h/5200)` to 3000, slow fall speed by reducing `vy` max from 34 to 18, and shift color to rose gold by setting GOLD to '#c47c5a' and GOLD_HI to '#e8a87c'. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "flake count (density divisor 5200)",
  "fall speed range (14+Math.random()*34)",
  "gold colors (GOLD, GOLD_HI constants)",
  "flake size range (2+Math.random()*5)",
  "sway amplitude (8*dt multiplier)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "DPR-aware fitCanvas with setTransform",
  "visibilitychange pause/resume guards",
  "IIFE wrapper",
  "prefers-reduced-motion static fallback",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Background color hardcoded in both CSS (#070502) and canvas fill — must change both",
  "No pointer interactivity; entirely passive",
  "Flake count capped at 110 regardless of screen size"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "gold",
  "particles",
  "falling",
  "ambient",
  "canvas",
  "generative"
 ]
}
</script>
</head>
<body>
<div id="kli06-stage" role="img" aria-label="Flecks of gold leaf drift down through the dark, tumbling and swaying as they fall and catching the light with a soft shimmer.">
  <canvas id="kli06-cv"></canvas>
</div>
<div class="kli06-cap">Falling Gold</div>
<script>
(function(){
  "use strict";
  const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv=document.getElementById('kli06-cv'); if(!cv) return;
  const root=document.documentElement;
  let GOLD, GOLD_HI, BG;                       // every drawn colour comes from the CSS tokens
  function syncTheme(){
    const cs=getComputedStyle(root), g=function(n){return cs.getPropertyValue(n).trim();};
    GOLD=g('--kli06-gold'); GOLD_HI=g('--kli06-hi'); BG=g('--kli06-bg');
  }
  addEventListener('message',function(e){
    const d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
      root.setAttribute('data-theme',d.theme); syncTheme();
      if(REDUCED) draw(performance.now());     // the static frame needs a repaint in the new palette
    }
  });
  syncTheme();
  function fitCanvas(c){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const r=c.getBoundingClientRect();
    const w=Math.max(2,r.width), h=Math.max(2,r.height);
    c.width=Math.round(w*dpr); c.height=Math.round(h*dpr);
    const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
    return {ctx,w,h,dpr};
  }
  let S=fitCanvas(cv);
  let bits=[];
  function make(y){
    return {x:Math.random()*S.w, y, vy:14+Math.random()*34,
      sz:2+Math.random()*5, rot:Math.random()*7, vr:(Math.random()-.5)*2.4,
      sway:Math.random()*7, swaySp:0.4+Math.random()*0.8, hi:Math.random()<0.5};
  }
  function seed(){
    bits=[];
    const N=Math.min(110,Math.round(S.w*S.h/5200));
    for(let i=0;i<Math.max(28,N);i++) bits.push(make(Math.random()*S.h));
  }
  let last=performance.now(),t=0;
  function draw(now){
    const dt=Math.min(0.05,(now-last)/1000);last=now;
    if(!REDUCED) t+=dt;
    const ctx=S.ctx;
    ctx.clearRect(0,0,S.w,S.h);
    for(const b of bits){
      if(!REDUCED){
        b.y+=b.vy*dt;
        b.x+=Math.sin(t*b.swaySp+b.sway)*8*dt;
        b.rot+=b.vr*dt;
        if(b.y>S.h+8){ Object.assign(b, make(-8)); b.x=Math.random()*S.w; }
      }
      const shimmer=0.55+0.45*Math.sin(t*2+b.sway);
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.rot);
      ctx.globalAlpha=(REDUCED?0.6:0.4+0.5*shimmer);
      ctx.fillStyle=b.hi?GOLD_HI:GOLD;
      ctx.beginPath();
      ctx.moveTo(0,-b.sz);ctx.lineTo(b.sz*0.7,0);ctx.lineTo(0,b.sz);ctx.lineTo(-b.sz*0.7,0);ctx.closePath();
      ctx.fill();ctx.restore();
    }
    ctx.globalAlpha=1;
  }
  let raf=0, running=false;
  function loop(){ if(!running) return; draw(performance.now()); raf=requestAnimationFrame(loop); }
  function start(){ if(running) return; running=true; last=performance.now(); raf=requestAnimationFrame(loop); }
  function stop(){ running=false; if(raf) cancelAnimationFrame(raf); raf=0; }
  S.ctx.fillStyle=BG;S.ctx.fillRect(0,0,S.w,S.h);
  seed();
  let _rt;
  window.addEventListener('resize', ()=>{ clearTimeout(_rt); _rt=setTimeout(()=>{ S=fitCanvas(cv); seed(); if(REDUCED) draw(performance.now()); },150); }, {passive:true});
  document.addEventListener('visibilitychange', ()=>{ if(REDUCED) return; if(document.hidden) stop(); else start(); });
  if(REDUCED){ draw(performance.now()); }
  else start();
})();
</script>
</body>
</html>
