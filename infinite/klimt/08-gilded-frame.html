<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="The Gilded Frame — Gold-Leaf Ornamental Studies. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Gilded Frame</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults. Light re-theme: the frames are struck in deep
     gold/bronze on ivory and the centre bloom stops being a glow — it becomes a soft tinted
     gold medallion (low-alpha, no white core) with the ink spiral still reading on top. */
  :root{
    --kli08-bg:#070502; --kli08-gold:#c8a951; --kli08-gold2:#9a7d28; --kli08-hi:#e6cf86;
    --kli08-ink:#0d0b07; --kli08-wash:rgba(154,125,40,.16); --kli08-wash0:rgba(7,5,2,0);
    --kli08-core:rgba(230,207,134,.9); --kli08-core2:rgba(200,169,81,.45); --kli08-core0:rgba(200,169,81,0);
    --kli08-cap:#e6cf86; --kli08-cap-o:.46;
  }
  :root[data-theme="light"]{
    --kli08-bg:#f8f3e8; --kli08-gold:#7d6520; --kli08-gold2:#a08033; --kli08-hi:#5f4b12;
    --kli08-ink:#1a150c; --kli08-wash:rgba(157,124,36,.16); --kli08-wash0:rgba(248,243,232,0);
    --kli08-core:rgba(125,101,32,.55); --kli08-core2:rgba(160,128,51,.28); --kli08-core0:rgba(160,128,51,0);
    --kli08-cap:#4a3a14; --kli08-cap-o:.66;
  }
  html,body{margin:0;height:100%;background:var(--kli08-bg);overflow:hidden}
  #kli08-stage{position:fixed;inset:0;width:100%;height:100%}
  #kli08-cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  .kli08-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--kli08-cap);opacity:var(--kli08-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/klimt/08-gilded-frame.html",
 "title": "The Gilded Frame",
 "description": "Four nested gold rectangular frames breathe in and out with corner coils and pulsing dot edges; a rotating golden spiral glows at center.",
 "useWhen": "Dark-background hero sections, luxury or art-deco themed UIs, ambient loading screens needing an ornate gold-leaf aesthetic.",
 "avoidWhen": "Light backgrounds (hardcoded dark canvas). Layouts needing legible text overlay — center glow competes with content.",
 "agentPrompt": "Change frame layer count to 6 by setting layers=6, slow the breathing to t*0.4, and shift the gold palette to rose-gold by replacing GOLD='#c8a951' with GOLD='#c9857a'. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "layer count (layers=4)",
  "breath speed (t*0.8)",
  "gold palette (GOLD, GOLD2, GOLD_HI constants)",
  "dot density (w/26 divisor)",
  "center spiral rotation speed (t*0.4)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "DPR-aware fitCanvas sizing",
  "visibilitychange pause/start guard",
  "IIFE wrapper",
  "prefers-reduced-motion static frame branch",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Background color hardcoded in CSS (#070502) — must edit both CSS and canvas fill to change",
  "No touch or pointer interactivity — purely passive",
  "Corner coil spiral uses lineTo approximation; may look rough at very small canvas sizes"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "gold",
  "frame",
  "ornamental",
  "spiral",
  "ambient",
  "canvas"
 ]
}
</script>
</head>
<body>
<div id="kli08-stage" role="img" aria-label="Nested ornamented gold frames with corner coils and dotted edges breathe in and out around a single pulsing core of light with a spiral at its center.">
  <canvas id="kli08-cv"></canvas>
</div>
<div class="kli08-cap">The Gilded Frame</div>
<script>
(function(){
  "use strict";
  const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv=document.getElementById('kli08-cv'); if(!cv) return;
  const root=document.documentElement;
  let GOLD, GOLD2, GOLD_HI, BLACK, BG, WASH, WASH0, CORE, CORE2, CORE0;  // all from the tokens
  function syncTheme(){
    const cs=getComputedStyle(root), g=function(n){return cs.getPropertyValue(n).trim();};
    GOLD=g('--kli08-gold'); GOLD2=g('--kli08-gold2'); GOLD_HI=g('--kli08-hi'); BLACK=g('--kli08-ink');
    BG=g('--kli08-bg'); WASH=g('--kli08-wash'); WASH0=g('--kli08-wash0');
    CORE=g('--kli08-core'); CORE2=g('--kli08-core2'); CORE0=g('--kli08-core0');
  }
  addEventListener('message',function(e){
    const d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
      root.setAttribute('data-theme',d.theme); syncTheme();
      if(REDUCED) draw(performance.now());   // the static frame needs a repaint in the new palette
    }
  });
  syncTheme();
  function fitCanvas(c){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    const r=c.getBoundingClientRect();
    const w=Math.max(2,r.width), h=Math.max(2,r.height);
    c.width=Math.round(w*dpr); c.height=Math.round(h*dpr);
    const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
    return {ctx,w,h,dpr};
  }
  let S=fitCanvas(cv);
  let t=0,last=performance.now();
  function draw(now){
    const dt=(now-last)/1000;last=now;
    if(!REDUCED) t+=dt;
    const ctx=S.ctx,W=S.w,H=S.h, cx=W/2, cy=H/2;
    ctx.clearRect(0,0,W,H);
    const bg=ctx.createRadialGradient(cx,cy,8,cx,cy,Math.max(W,H)*0.6);
    bg.addColorStop(0,WASH);bg.addColorStop(1,WASH0);
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    const breath=REDUCED?0.5:(Math.sin(t*0.8)*0.5+0.5);
    const layers=4;
    for(let i=0;i<layers;i++){
      const inset=14 + i*16 + breath*10;
      const x=inset, y=inset, w=W-inset*2, h=H-inset*2;
      if(w<20||h<20) continue;
      ctx.strokeStyle = i%2? GOLD2 : GOLD;
      ctx.globalAlpha=0.4+0.5*(1-i/layers);
      ctx.lineWidth = i%2?1:2;
      ctx.strokeRect(x,y,w,h);
      const corners=[[x,y,1,1],[x+w,y,-1,1],[x,y+h,1,-1],[x+w,y+h,-1,-1]];
      for(const [ccx,ccy,sx,sy] of corners){
        ctx.save();ctx.translate(ccx,ccy);ctx.scale(sx,sy);
        ctx.beginPath();let r=2,an=Math.PI;
        for(let k=0;k<14;k++){an+=0.5;r*=1.12;ctx.lineTo(Math.cos(an)*r,Math.sin(an)*r);}
        ctx.strokeStyle=GOLD_HI;ctx.lineWidth=1;ctx.stroke();ctx.restore();
      }
      if(i===1){
        const dots=Math.max(6,Math.floor(w/26));
        for(let d=0;d<=dots;d++){
          const px=x+(w*d/dots);
          ctx.fillStyle=GOLD_HI;
          ctx.globalAlpha=0.5+0.5*Math.sin(t*2+d*0.6);
          ctx.beginPath();ctx.arc(px,y,2.2,0,7);ctx.fill();
          ctx.beginPath();ctx.arc(px,y+h,2.2,0,7);ctx.fill();
        }
      }
    }
    ctx.globalAlpha=1;
    const pr=18+10*breath;
    const cg=ctx.createRadialGradient(cx,cy,1,cx,cy,pr*2.4);
    cg.addColorStop(0,CORE);cg.addColorStop(0.4,CORE2);cg.addColorStop(1,CORE0);
    ctx.fillStyle=cg;ctx.beginPath();ctx.arc(cx,cy,pr*2.4,0,7);ctx.fill();
    ctx.save();ctx.translate(cx,cy);ctx.rotate(t*0.4);
    ctx.beginPath();let r=1.5,an=0;
    for(let k=0;k<46;k++){an+=0.42;r*=1.07;ctx.lineTo(Math.cos(an)*r,Math.sin(an)*r);}
    ctx.strokeStyle=BLACK;ctx.globalAlpha=0.5;ctx.lineWidth=1.4;ctx.stroke();ctx.restore();
    ctx.fillStyle=BLACK;ctx.globalAlpha=0.85;
    ctx.beginPath();ctx.arc(cx,cy,5+2*breath,0,7);ctx.fill();
    ctx.globalAlpha=1;
  }
  let raf=0, running=false;
  function loop(){ if(!running) return; draw(performance.now()); raf=requestAnimationFrame(loop); }
  function start(){ if(running) return; running=true; last=performance.now(); raf=requestAnimationFrame(loop); }
  function stop(){ running=false; if(raf) cancelAnimationFrame(raf); raf=0; }
  S.ctx.fillStyle=BG;S.ctx.fillRect(0,0,S.w,S.h);
  let _rt;
  window.addEventListener('resize', ()=>{ clearTimeout(_rt); _rt=setTimeout(()=>{ S=fitCanvas(cv); if(REDUCED) draw(performance.now()); },150); }, {passive:true});
  document.addEventListener('visibilitychange', ()=>{ if(REDUCED) return; if(document.hidden) stop(); else start(); });
  if(REDUCED){ draw(performance.now()); }
  else start();
})();
</script>
</body>
</html>
