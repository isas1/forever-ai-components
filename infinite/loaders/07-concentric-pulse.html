<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Concentric teal, tan and slate rings ripple outward from a beating gradient core on a dark backdrop.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concentric Pulse</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
/* theme tokens — dark values are the defaults (solid-dark-bg contract);
   the light re-theme is the [data-theme="light"] block */
:root{
  --bg-900:#08090d;
  --accent-iris:#22AEC3; --accent-cyan:#C09C59; --accent-magenta:#879DA1;
  --grad-iris-cyan:linear-gradient(120deg,var(--accent-iris),var(--accent-cyan));
  --glow-a:rgba(34,174,195,.16); --glow-b:rgba(192,156,89,.16);
  --cap:#C09C59; --cap-o:.45;
}
:root[data-theme="light"]{
  --bg-900:#f2f4f8;
  --accent-iris:#177886; --accent-cyan:#896b34; --accent-magenta:#5c7175;
  --glow-a:rgba(34,174,195,.18); --glow-b:rgba(192,156,89,.18);
  --cap:#1b2130; --cap-o:.5;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:var(--bg-900);
  background-image:
    radial-gradient(60vw 40vw at 15% -10%,var(--glow-a),transparent 60%),
    radial-gradient(50vw 40vw at 90% 0%,var(--glow-b),transparent 55%);
  display:grid;place-items:center;
}
.c07-ripple{position:relative;width:min(40vmin,170px);aspect-ratio:1;display:grid;place-items:center}
.c07-ripple__wave{position:absolute;width:100%;height:100%;border-radius:50%;
  border:2px solid var(--accent-cyan);opacity:0;animation:c07-ripple-out 2.6s cubic-bezier(.22,1,.36,1) infinite}
.c07-ripple__wave:nth-child(2){animation-delay:.65s;border-color:var(--accent-iris)}
.c07-ripple__wave:nth-child(3){animation-delay:1.3s;border-color:var(--accent-magenta)}
.c07-ripple__wave:nth-child(4){animation-delay:1.95s;border-color:var(--accent-cyan)}
.c07-ripple__core{position:relative;z-index:2;width:13%;height:13%;border-radius:50%;
  background:var(--grad-iris-cyan);box-shadow:0 0 24px -2px var(--accent-iris);
  animation:c07-ripple-beat 2.6s cubic-bezier(.65,0,.35,1) infinite}
@keyframes c07-ripple-out{0%{transform:scale(.18);opacity:.9}100%{transform:scale(1);opacity:0}}
@keyframes c07-ripple-beat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;
  color:var(--cap);opacity:var(--cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important}
}
</style>

  "core glow spread (box-shadow 24px)",

</head>
<body>
<div class="c07-ripple" role="img" aria-label="Pulsing concentric rings">
  <span class="c07-ripple__wave"></span>
  <span class="c07-ripple__wave"></span>
  <span class="c07-ripple__wave"></span>
  <span class="c07-ripple__wave"></span>
  <span class="c07-ripple__core"></span>
</div>
<div class="cap">Concentric Pulse</div>
<script>
(function(){
  var root=document.documentElement;
  var nodes=document.querySelectorAll('.c07-ripple > *');
  function vis(){var s=document.hidden?'paused':'running';nodes.forEach(function(n){n.style.animationPlayState=s;});}
  document.addEventListener('visibilitychange',vis);vis();
  // live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
  addEventListener('message',function(e){
    var d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
      root.setAttribute('data-theme',d.theme);
    }
  });
})();
</script>
</body>
</html>
