<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="A pulsing orange fruit loader with glowing segment animations.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fruit Orange</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract);
     the light re-theme is the [data-theme="light"] block */
  :root{
    --c14-bg:#08090d; --c14-glow-a:rgba(124,92,255,.16); --c14-glow-b:rgba(34,211,238,.16);
    --c14-peel:#f97316; --c14-peel-sh:rgba(249,115,22,0.5);
    --c14-seg-a:#f59e0b; --c14-seg-b:#ff781f; --c14-core:#f4f6fb; --c14-cap-o:.45;
  }
  :root[data-theme="light"]{
    --c14-bg:#f2f4f8; --c14-glow-a:rgba(124,92,255,.18); --c14-glow-b:rgba(34,211,238,.18);
    --c14-peel:#b94e05; --c14-peel-sh:rgba(185,78,5,0.3);
    --c14-seg-a:#c07c08; --c14-seg-b:#f05f00; --c14-core:#241b12; --c14-cap-o:.5;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--c14-bg)}
  body{
    display:grid;place-items:center;
    background-image:
      radial-gradient(60vw 40vw at 15% -10%,var(--c14-glow-a),transparent 60%),
      radial-gradient(50vw 40vw at 90% 0%,var(--c14-glow-b),transparent 55%);
  }
  .c14-orange {
    width: 120px; height: 120px;
    position: relative;
    animation: c14-spin 8s linear infinite;
  }
  .c14-peel {
    fill: none;
    stroke: var(--c14-peel);
    stroke-width: 4;
    filter: drop-shadow(0 0 5px var(--c14-peel-sh));
  }
  .c14-core {
    fill: var(--c14-core);
  }
  .c14-segment {
    fill: var(--c14-seg-a);
    opacity: 0.15;
    transform-origin: 60px 60px;
    animation: c14-pulse 1.6s ease-in-out infinite;
  }
  .c14-segment:nth-child(3) { transform: rotate(0deg); animation-delay: 0.0s; }
  .c14-segment:nth-child(4) { transform: rotate(45deg); animation-delay: 0.2s; }
  .c14-segment:nth-child(5) { transform: rotate(90deg); animation-delay: 0.4s; }
  .c14-segment:nth-child(6) { transform: rotate(135deg); animation-delay: 0.6s; }
  .c14-segment:nth-child(7) { transform: rotate(180deg); animation-delay: 0.8s; }
  .c14-segment:nth-child(8) { transform: rotate(225deg); animation-delay: 1.0s; }
  .c14-segment:nth-child(9) { transform: rotate(270deg); animation-delay: 1.2s; }
  .c14-segment:nth-child(10) { transform: rotate(315deg); animation-delay: 1.4s; }

  @keyframes c14-spin {
    to { transform: rotate(360deg); }
  }
  @keyframes c14-pulse {
    0%, 100% { opacity: 0.15; fill: var(--c14-seg-a); }
    50% { opacity: 1; fill: var(--c14-seg-b); }
  }
  .cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 "Space Grotesk",ui-monospace,monospace;
    color:var(--c14-peel);opacity:var(--c14-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
  @media (prefers-reduced-motion:reduce){
    .c14-orange, .c14-segment {
      animation: none !important;
    }
    .c14-segment { opacity: 0.8; }
  }
</style>

<script>
(function(){
  var org = document.querySelector('.c14-orange');
  function vis(){
    var state = document.hidden ? 'paused' : 'running';
    org.style.animationPlayState = state;
    org.querySelectorAll('.c14-segment').forEach(function(n){
      n.style.animationPlayState = state;
    });
  }
  document.addEventListener('visibilitychange', vis);
  vis();
  // live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
  addEventListener('message', function(e){
    var d=e.data; if(d && d.type==='forever:theme' && (d.theme==='light'||d.theme==='dark')) document.documentElement.setAttribute('data-theme', d.theme);
  });
})();
</script>
</body>
