<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Newton's cradle physics loader using CSS keyframe swings.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Newton's Cradle</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract);
     the light re-theme is the [data-theme="light"] block */
  :root{
    --c15-bg:#08090d; --c15-glow-a:rgba(192,180,89,.16); --c15-glow-b:rgba(218,62,140,.16);
    --c15-bar:#C0B459; --c15-wire:rgba(255,255,255,0.15);
    --c15-ball:#DA3E8C; --c15-ball-sh:rgba(218,62,140,0.6);
    --c15-ball2:#A18794; --c15-ball2-sh:rgba(161,135,148,0.6); --c15-cap-o:.45;
  }
  :root[data-theme="light"]{
    --c15-bg:#f2f4f8; --c15-glow-a:rgba(192,180,89,.2); --c15-glow-b:rgba(218,62,140,.18);
    --c15-bar:#776e2d; --c15-wire:rgba(27,33,48,0.22);
    --c15-ball:#cd277a; --c15-ball-sh:rgba(205,39,122,0.35);
    --c15-ball2:#846775; --c15-ball2-sh:rgba(132,103,117,0.35); --c15-cap-o:.5;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--c15-bg)}
  body{
    display:grid;place-items:center;
    background-image:
      radial-gradient(60vw 40vw at 15% -10%,var(--c15-glow-a),transparent 60%),
      radial-gradient(50vw 40vw at 90% 0%,var(--c15-glow-b),transparent 55%);
  }
  .c15-cradle {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    width: 180px; height: 110px;
    border-top: 4px solid var(--c15-bar);
    border-radius: 2px;
    padding-top: 10px;
  }
  .c15-wire {
    width: 2px; height: 50px;
    background: var(--c15-wire);
    position: relative;
    transform-origin: top center;
    margin: 0 8px;
  }
  .c15-wire::after {
    content: "";
    position: absolute;
    bottom: -18px; left: -8px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--c15-ball);
    box-shadow: 0 0 10px var(--c15-ball-sh);
  }
  .c15-wire:nth-child(1) {
    animation: c15-swing-l 1.2s cubic-bezier(0.25, 0, 0.75, 1) infinite;
  }
  .c15-wire:nth-child(5) {
    animation: c15-swing-r 1.2s cubic-bezier(0.25, 0, 0.75, 1) infinite;
    animation-delay: 0.6s;
  }
  .c15-wire:nth-child(5)::after {
    background: var(--c15-ball2);
    box-shadow: 0 0 10px var(--c15-ball2-sh);
  }

  @keyframes c15-swing-l {
    0% { transform: rotate(0deg); }
    25% { transform: rotate(35deg); }
    50% { transform: rotate(0deg); }
    100% { transform: rotate(0deg); }
  }
  @keyframes c15-swing-r {
    0% { transform: rotate(0deg); }
    25% { transform: rotate(-35deg); }
    50% { transform: rotate(0deg); }
    100% { transform: rotate(0deg); }
  }
  .cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 "Space Grotesk",ui-monospace,monospace;
    color:var(--c15-ball);opacity:var(--c15-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
  @media (prefers-reduced-motion:reduce){
    .c15-wire {
      animation: none !important;
    }
  }
</style>
<script type="application/json" id="forever-agent-meta">

 "useWhen": "Loading states that benefit from a physics or computation-in-progress metaphor. Developer tools, data-processing or simulation apps.",
 "avoidWhen": "Contexts narrower than 180px width. Confirm the static middle balls read correctly as intentional — they can look broken if the context is unfamiliar.",

 "editableAreas": [

  "swing speed (1.2s on animation duration)",

  "theme tokens (:root dark defaults + [data-theme=light] overrides)"

 "preserveElements": [
  "animation-delay: 0.6s on .c15-wire:nth-child(5) — exactly half the cycle; changing this breaks the cradle illusion",

</script>
</head>
<body>
<div class="c15-cradle">
  <div class="c15-wire"></div>
  <div class="c15-wire"></div>
  <div class="c15-wire"></div>
  <div class="c15-wire"></div>
  <div class="c15-wire"></div>
</div>
<div class="cap">Newton's Cradle</div>
<script>
(function(){
  var wires = document.querySelectorAll('.c15-wire');
  function vis(){
    var state = document.hidden ? 'paused' : 'running';
    wires.forEach(function(n){
      n.style.animationPlayState = state;
    });
  }
  document.addEventListener('visibilitychange', vis);
  vis();
  // live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
  addEventListener('message', function(e){
    var d=e.data; if(d && d.type==='forever:theme' && (d.theme==='light'||d.theme==='dark')) document.documentElement.setAttribute('data-theme', d.theme);
  });
})();
</script>
</body>
</html>
