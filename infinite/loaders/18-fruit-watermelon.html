<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="A bouncy fruit watermelon loader with falling seed particles.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fruit Watermelon</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract);
     the light re-theme is the [data-theme="light"] block. --c18-seed stays a fixed
     dark ink in both themes: black watermelon seeds are the tile's identity, not a
     page-contrast color. */
  :root{
    --c18-bg:#08090d; --c18-glow-a:rgba(124,92,255,.16); --c18-glow-b:rgba(34,211,238,.16);
    --c18-flesh:#ff5ca8; --c18-flesh-sh:rgba(255,92,168,0.5);
    --c18-rind:#10b981; --c18-rim:#f4f6fb; --c18-seed:#08090d;
    --c18-cap:#ff5ca8; --c18-cap-o:.45;
  }
  :root[data-theme="light"]{
    --c18-bg:#f2f4f8; --c18-glow-a:rgba(124,92,255,.18); --c18-glow-b:rgba(34,211,238,.18);
    --c18-flesh:#ff3392; --c18-flesh-sh:rgba(255,51,146,0.3);
    --c18-rind:#0b7c56; --c18-rim:#f4f6fb; --c18-seed:#08090d;
    --c18-cap:#db0066; --c18-cap-o:.5;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--c18-bg)}
  body{
    display:grid;place-items:center;
    background-image:
      radial-gradient(60vw 40vw at 15% -10%,var(--c18-glow-a),transparent 60%),
      radial-gradient(50vw 40vw at 90% 0%,var(--c18-glow-b),transparent 55%);
  }
  .c18-container {
    position: relative;
    width: 120px; height: 120px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .c18-slice {
    width: 80px; height: 40px;
    background: var(--c18-flesh);
    border-bottom: 8px solid var(--c18-rind);
    border-left: 4px solid var(--c18-rim);
    border-right: 4px solid var(--c18-rim);
    border-radius: 0 0 80px 80px;
    box-shadow: 0 0 15px var(--c18-flesh-sh);
    position: relative;
    animation: c18-bounce 1.5s ease-in-out infinite;
  }
  .c18-seed {
    position: absolute;
    width: 4px; height: 7px;
    background: var(--c18-seed);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    animation: c18-seed-drop 1.5s linear infinite;
  }
  .c18-seed--1 { left: 25px; top: 10px; animation-delay: 0.1s; }
  .c18-seed--2 { left: 40px; top: 18px; animation-delay: 0.5s; }
  .c18-seed--3 { left: 55px; top: 12px; animation-delay: 0.9s; }

  @keyframes c18-bounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-12px) rotate(-5deg); }
  }
  @keyframes c18-seed-drop {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    30% { transform: translateY(35px) scale(0.9); opacity: 0.8; }
    60%, 100% { transform: translateY(60px) scale(0.6); opacity: 0; }
  }
  .cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 "Space Grotesk",ui-monospace,monospace;
    color:var(--c18-cap);opacity:var(--c18-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
  @media (prefers-reduced-motion:reduce){
    .c18-slice, .c18-seed {
      animation: none !important;
    }
  }
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/loaders/18-fruit-watermelon.html",
 "title": "Fruit Watermelon",
 "description": "A CSS watermelon slice (pink semicircle with green rind, white border) bounces gently while three black seeds fall and fade in staggered loops.",
 "useWhen": "Playful loading for food, consumer, or children's apps. Summer or fruit-themed UIs where high whimsy is appropriate.",
 "avoidWhen": "Serious or professional contexts. Light backgrounds — fill colors hardcoded dark.",
 "agentPrompt": "Change to a lime by setting .c18-slice background to #4ade80, border-bottom to #166534, and border-left/right to #bbf7d0. Remove seeds by deleting the three .c18-seed divs and their CSS rules. Increase bounce height by changing -12px in c18-bounce to -20px. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "slice flesh color (#ff5ca8 on .c18-slice background)",
  "rind color (#10b981 on border-bottom)",
  "border/highlight color (#f4f6fb on border-left and border-right)",
  "bounce height (-12px in c18-bounce keyframe translateY)",
  "seed count (3 .c18-seed divs + matching CSS rules)",
  "seed fall distance (35px and 60px translateY in c18-seed-drop keyframe)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "visibilitychange handler — must pause both .c18-slice and all .c18-seed nodes separately",
  "border-radius: 0 0 80px 80px — relies on exact 80px/40px width/height ratio for semicircle; changing dimensions requires recalculating",
  "c18- namespace on all classes",
  "prefers-reduced-motion guard",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"

 "knownLimitations": [
  "Seed positions (left/top values) are hardcoded inside the slice — resizing the slice requires manually recalculating seed coordinates",
  "Semicircle shape relies on exact 80px width / 40px height ratio in .c18-slice"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "watermelon",
  "fruit",
  "bounce",
  "seeds",
  "drop",
  "playful",
  "novelty",
  "css",
  "summer",
  "consumer"
 ]
}
</script>
</head>
<body>
<div class="c18-container">
  <div class="c18-slice">
    <div class="c18-seed c18-seed--1"></div>
    <div class="c18-seed c18-seed--2"></div>
    <div class="c18-seed c18-seed--3"></div>
  </div>
</div>
<div class="cap">Fruit Watermelon</div>
<script>
(function(){
  var slice = document.querySelector('.c18-slice');
  var seeds = document.querySelectorAll('.c18-seed');
  function vis(){
    var state = document.hidden ? 'paused' : 'running';
    slice.style.animationPlayState = state;
    seeds.forEach(function(n){
      n.style.animationPlayState = state;
    });
  }
  document.addEventListener('visibilitychange', vis);
  vis();
  // live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
  addEventListener('message', function(e){
    var d=e.data; if(d && d.type==='forever:theme' && (d.theme==='light'||d.theme==='dark')) document.documentElement.setAttribute('data-theme', d.theme);
  });
})();
</script>
</body>
</html>
