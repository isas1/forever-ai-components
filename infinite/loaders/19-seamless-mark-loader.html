<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Seamless Mark Loader — Loaders. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seamless Mark Loader</title>
<script>/* theme hook: ?theme=light|dark, before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  /* forever brand tokens — dark default, warm-paper light in the [data-theme="light"] block */
  :root{
    --ml19-bg:#0a0a0a;--ml19-text:#ededea;--ml19-muted:#8a8a85;--ml19-faint:#5a5a56;
    --ml19-strong:rgba(255,255,255,.14);--ml19-accent:#3fb680;--ml19-accent-line:rgba(63,182,128,.32);
    --ml19-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;--ml19-loop:cubic-bezier(.45,0,.55,1);
  }
  :root[data-theme="light"]{
    --ml19-bg:#fafaf8;--ml19-text:#1a1a18;--ml19-muted:#6b6b66;--ml19-faint:#9a9a93;
    --ml19-strong:rgba(0,0,0,.14);--ml19-accent:#1a7a50;--ml19-accent-line:rgba(26,122,80,.35);
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ml19-bg)}
  .ml19-stage{position:fixed;inset:0;display:grid;place-items:center;align-content:center;gap:clamp(10px,4vmin,22px)}
  .ml19-mark{width:min(44vmin,240px);height:min(44vmin,240px);display:block;overflow:visible}
  .ml19-mark path{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
  /* base: the whole figure, faint. live: one accent segment runs the closed loop; pathLength=1
     makes a full dashoffset cycle wrap exactly, so the loop never jumps. */
  .ml19-base{stroke:var(--ml19-strong)}
  .ml19-live{stroke:var(--ml19-accent);stroke-dasharray:.3 .7;stroke-dashoffset:1;animation:ml19-run 2.4s linear infinite}
  /* a second, dimmer segment half a cycle behind — the figure-eight reads as two lobes handing over */
  .ml19-echo{stroke:var(--ml19-accent);opacity:.28;stroke-dasharray:.16 .84;stroke-dashoffset:.5;animation:ml19-run 2.4s linear infinite}
  .ml19-live{animation-name:ml19-a}.ml19-echo{animation-name:ml19-b}
  @keyframes ml19-a{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  @keyframes ml19-b{from{stroke-dashoffset:1.5}to{stroke-dashoffset:.5}}
  .ml19-label{font:400 clamp(10px,3vmin,13px)/1 var(--ml19-mono);letter-spacing:.02em;color:var(--ml19-muted);
    display:flex;align-items:center;gap:8px;min-height:1em}
  .ml19-label i{width:6px;height:6px;border-radius:999px;background:var(--ml19-accent);
    animation:ml19-beat 2.8s var(--ml19-loop) infinite}
  @keyframes ml19-beat{0%,100%{box-shadow:0 0 0 0 var(--ml19-accent-line);opacity:1}50%{box-shadow:0 0 0 5px transparent;opacity:.55}}
  .ml19-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 var(--ml19-mono);color:var(--ml19-muted);opacity:.5;
    letter-spacing:.08em;text-transform:uppercase;user-select:none;pointer-events:none}
  @media (prefers-reduced-motion:reduce){
    .ml19-live,.ml19-echo,.ml19-label i{animation:none}
    .ml19-live{stroke-dasharray:1 0;stroke-dashoffset:0}.ml19-echo{opacity:0}
  }
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/loaders/19-seamless-mark-loader.html",
 "title": "Seamless Mark Loader",
 "description": "A single-stroke figure-eight mark drawn faint, with an accent segment (and a dimmer echo half a cycle behind) running its closed loop with no visible reset. A mono label cycles 'loading', 'still here', 'almost', 'always here'.",
 "useWhen": "Full-screen or first-paint loading where the logo and the loader are the same object; brand-led products with a monochrome base and one accent.",
 "avoidWhen": "Inline or button-sized waits (use an arc spinner); interfaces that need a determinate percentage.",
 "agentPrompt": "Replace the three identical path d attributes with your own closed single-stroke mark (keep pathLength=1), change the loop length (2.4s on ml19-a / ml19-b) and the accent via --ml19-accent, and edit the words array the label cycles. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "mark path (the shared d attribute on the three paths; keep pathLength=1)",
  "segment lengths (stroke-dasharray .3 .7 live, .16 .84 echo) and loop speed (2.4s)",
  "label words array and its 2400 ms interval",
  "accent tokens (--ml19-accent, --ml19-accent-line)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "IIFE wrapper",
  "pathLength=1 + a full 1→0 dashoffset cycle — that is what makes the loop seamless",
  "prefers-reduced-motion guard (static accent mark, no label cycle)",
  "visibilitychange pause (animation-play-state on the three animated nodes + the label clock)",
  "role=img + aria-label on the stage",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "The mark is a fixed closed path; an open path would show a start and an end at the wrap"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "loader",
  "mark",
  "stroke",
  "figure-eight",
  "infinity",
  "loop",
  "accent",
  "brand"
 ]
}
</script>
</head>
<body>
<div class="ml19-stage" role="img" aria-label="Loading: a single-stroke figure-eight mark with an accent segment running its loop forever">
  <svg class="ml19-mark" viewBox="0 0 100 100" aria-hidden="true">
    <path class="ml19-base" d="M50 50 C 64 30, 66 14, 50 14 C 34 14, 36 34, 50 50 C 64 66, 70 88, 50 88 C 30 88, 36 66, 50 50 Z" pathLength="1"/>
    <path class="ml19-echo" id="ml19-echo" d="M50 50 C 64 30, 66 14, 50 14 C 34 14, 36 34, 50 50 C 64 66, 70 88, 50 88 C 30 88, 36 66, 50 50 Z" pathLength="1"/>
    <path class="ml19-live" id="ml19-live" d="M50 50 C 64 30, 66 14, 50 14 C 34 14, 36 34, 50 50 C 64 66, 70 88, 50 88 C 30 88, 36 66, 50 50 Z" pathLength="1"/>
  </svg>
  <div class="ml19-label"><i id="ml19-dot"></i><span id="ml19-txt">loading</span></div>
</div>
<div class="ml19-cap" aria-hidden="true">Seamless Mark Loader</div>
<script>(function(){"use strict";
  var root=document.documentElement, txt=document.getElementById('ml19-txt');
  var anim=[document.getElementById('ml19-live'),document.getElementById('ml19-echo'),document.getElementById('ml19-dot')];
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  addEventListener('message',function(e){var d=e.data;if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark'))root.setAttribute('data-theme',d.theme);});
  // quiet mono label: the brand's three-word promise, cycling once per loop
  var words=['loading','still here','almost','always here'], i=0, clock=null;
  function next(){ i=(i+1)%words.length; txt.textContent=words[i]; }
  function start(){ anim.forEach(function(el){el.style.animationPlayState='running';}); if(!clock&&!reduce)clock=setInterval(next,2400); }
  function stop(){ anim.forEach(function(el){el.style.animationPlayState='paused';}); clearInterval(clock); clock=null; }
  document.addEventListener('visibilitychange',function(){ document.hidden?stop():start(); });
  start();
})();</script>
</body>
</html>
