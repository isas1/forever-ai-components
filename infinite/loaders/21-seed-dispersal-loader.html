<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Seed Dispersal Loader — Loaders. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seed Dispersal Loader</title>
<script>/* theme hook: ?theme=light|dark, before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  /* Root & Pigment — eight raw pigments; dark ground by default, pale recycled fibre in the [data-theme="light"] block */
  :root{
    --sd21-ground:#152019;--sd21-fibre:#202d23;--sd21-ink:#edf0e5;--sd21-lichen:#adb8aa;--sd21-butter:#ddbd61;--sd21-moss:#82a17d;--sd21-lift:#3a4a3d;
    --sd21-hair:rgba(173,184,170,.18);--sd21-rule:rgba(173,184,170,.34);
    --sd21-body:"Noto Sans",ui-sans-serif,system-ui,sans-serif;--sd21-mono:"Noto Sans Mono",ui-monospace,Menlo,monospace;
  }
  :root[data-theme="light"]{
    --sd21-ground:#e7e1d3;--sd21-fibre:#f4efe4;--sd21-ink:#253126;--sd21-lichen:#596458;--sd21-butter:#c49a2c;--sd21-moss:#466348;--sd21-lift:#ffffff;
    --sd21-hair:rgba(89,100,88,.18);--sd21-rule:rgba(89,100,88,.34);
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--sd21-ground)}
  /* pressed fibre ground: two crossed hairlines at 2–3% ink — one paint layer */
  body{background-image:repeating-linear-gradient(92deg,color-mix(in oklab,var(--sd21-ink) 3%,transparent) 0 1px,transparent 1px 7px),repeating-linear-gradient(3deg,color-mix(in oklab,var(--sd21-ink) 2%,transparent) 0 1px,transparent 1px 9px)}
  .sd21-stage{position:fixed;inset:0;display:grid;place-items:center;align-content:center;gap:clamp(8px,3vmin,14px);font-family:var(--sd21-body);color:var(--sd21-ink)}
  .sd21-plate{width:min(58vmin,240px);height:min(58vmin,240px);border-radius:50%;border:1px solid var(--sd21-hair);display:grid;place-items:center;
    background:color-mix(in oklab,var(--sd21-fibre) 62%,var(--sd21-ground));
    background-image:radial-gradient(circle at 50% 50%,color-mix(in oklab,var(--sd21-lift) 14%,transparent) 0 .5px,transparent .6px);background-size:5px 5px}
  .sd21-plate canvas{width:100%;height:100%;display:block;border-radius:50%}
  .sd21-label{font-size:clamp(9px,2.7vmin,12px);letter-spacing:.09em;text-transform:uppercase;color:var(--sd21-lichen)}
  .sd21-label i{font:400 1em var(--sd21-mono);font-style:normal;letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
  .sd21-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 var(--sd21-mono);color:var(--sd21-lichen);opacity:.5;letter-spacing:.08em;text-transform:uppercase;user-select:none;pointer-events:none}
</style>

<body>
<div class="sd21-stage" role="status" aria-live="polite" aria-label="Loading: seeds lift off a seed head and drift out of frame on their pappus hairs">
  <div class="sd21-plate"><canvas id="sd21-c" aria-hidden="true"></canvas></div>
  <div class="sd21-label" id="sd21-label">dispersing · <i id="sd21-n">18</i> seeds</div>
</div>
<div class="sd21-cap" aria-hidden="true">Seed Dispersal Loader</div>
<script>(function(){"use strict";
  var root=document.documentElement, cv=document.getElementById('sd21-c'), ctx=cv.getContext('2d'), nEl=document.getElementById('sd21-n');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var MAX=28, N=18, size=0, c=0, dpr=1, seeds=[], raf=0, last=0, running=true, ink,accent,line;
  function syncTheme(){ var cs=getComputedStyle(root); ink=cs.getPropertyValue('--sd21-ink').trim(); accent=cs.getPropertyValue('--sd21-butter').trim(); line=cs.getPropertyValue('--sd21-rule').trim(); }
  addEventListener('message',function(e){var d=e.data;if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){root.setAttribute('data-theme',d.theme);syncTheme();if(reduce)still();}});
  function fit(){ var r=cv.parentNode.getBoundingClientRect(); size=Math.max(40,Math.round(r.width)); c=size/2; dpr=Math.min(devicePixelRatio||1,2);
    cv.width=size*dpr; cv.height=size*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  var seed=11; function rnd(){ seed=(seed*9301+49297)%233280; return seed/233280; }
  function spawn(i,seeded){ return { a:(i/N)*Math.PI*2+rnd()*.3, r:seeded?14+rnd()*(c-26):12+rnd()*4, v:(.16+rnd()*.22)*(size/132), spin:(rnd()-.5)*.03, rot:rnd()*Math.PI, drift:(rnd()-.5)*.004 }; }
  function drawSeed(s){ var x=c+Math.cos(s.a)*s.r, y=c+Math.sin(s.a)*s.r, fade=Math.max(0,1-Math.max(0,s.r-(c-30))/26), k=size/132;
    ctx.save(); ctx.translate(x,y); ctx.rotate(s.rot); ctx.globalAlpha=.25+fade*.75;
    ctx.strokeStyle=line; ctx.lineWidth=.8; for(var j=-1;j<=1;j++){ ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-7*k,j*3.4*k); ctx.stroke(); } // pappus: three hairs
    ctx.fillStyle=accent; ctx.beginPath(); ctx.ellipse(0,0,3.1*k,1.7*k,0,0,Math.PI*2); ctx.fill(); ctx.restore(); }
  function head(){ var k=size/132; ctx.strokeStyle=line; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(c,c,10*k,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle=ink; ctx.globalAlpha=.65; ctx.beginPath(); ctx.arc(c,c,3*k,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; }
  function frame(t){ if(!running)return; ctx.clearRect(0,0,size,size); head(); var dt=last?Math.min(48,t-last):16; last=t;
    for(var i=0;i<seeds.length;i++){ var s=seeds[i]; s.r+=s.v*(dt/16); s.a+=s.drift*(dt/16); s.rot+=s.spin*(dt/16); if(s.r>c-4)seeds[i]=spawn(i,false); drawSeed(seeds[i]); }
    raf=requestAnimationFrame(frame); }
  function still(){ ctx.clearRect(0,0,size,size); head(); seeds.forEach(drawSeed); }
  function reset(){ fit(); seeds=[]; for(var i=0;i<N;i++)seeds.push(spawn(i,true)); }
  function start(){ if(reduce){still();return;} if(!raf){ running=true; last=0; raf=requestAnimationFrame(frame); } }
  function stop(){ running=false; cancelAnimationFrame(raf); raf=0; }
  document.addEventListener('visibilitychange',function(){ document.hidden?stop():start(); });
  addEventListener('resize',function(){ reset(); if(reduce)still(); });
  syncTheme(); reset(); nEl.textContent=Math.min(MAX,N); start(); // reduced motion: one painted scatter around the head, no loop
})();</script>
</body>
