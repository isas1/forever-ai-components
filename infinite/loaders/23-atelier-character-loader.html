<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Atelier Character Loader — Loaders. Split-flap five-cell mechanical glyph spinner with manual sync pause toggle.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier Character Loader</title>
<script>/* theme hook: ?theme=light|dark, before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  :root {
    --at10-bg: #171614;
    --at10-surface-hi: #211F1C;
    --at10-ink: #F4F1EA;
    --at10-ink-fg: #171614;
    --at10-muted: #ADA699;
    --at10-border: #57524A;
    --at10-accent: #EC6A43;
    --at10-seam: rgba(23, 22, 20, 0.25);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --at10-bg: #F4F1EA;
    --at10-surface-hi: #FAF8F5;
    --at10-ink: #1C1B19;
    --at10-ink-fg: #FAF8F5;
    --at10-muted: #666158;
    --at10-border: #C5BEB0;
    --at10-accent: #C43B16;
    --at10-seam: rgba(255, 255, 255, 0.14);
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background-color: var(--at10-bg); color: var(--at10-ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.25s ease, color 0.25s ease;
  }
  .at10-stage {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    padding: clamp(10px, 3vmin, 20px);
    padding-bottom: clamp(24px, 7vmin, 32px);
    background-color: var(--at10-bg); color: var(--at10-ink);
  }
  .at10-unit {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    max-width: 100%;
  }
  .at10-cells { display: flex; gap: clamp(3px, 1.5vw, 5px); }
  .at10-cell {
    width: clamp(24px, 12vw, 34px); height: clamp(30px, 15vmin, 40px);
    background: var(--at10-ink); color: var(--at10-ink-fg);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(14px, 6vw, 18px); font-weight: 700;
    box-shadow: 0 2px 0 var(--at10-border);
    position: relative;
  }
  .at10-cell::after {
    content: ""; position: absolute; left: 0; right: 0; top: 50%;
    height: 1px; background: var(--at10-seam);
  }
  .at10-btn {
    appearance: none;
    background: var(--at10-surface-hi); color: var(--at10-ink);
    border: 1.5px solid var(--at10-ink);
    padding: 5px 10px; border-radius: 4px;
    font-family: inherit; font-size: 10px; font-weight: 700;
    cursor: pointer; box-shadow: 0 2px 0 var(--at10-ink);
    touch-action: manipulation;
  }
  .at10-btn:active { transform: translateY(2px); box-shadow: none; }
  .at10-btn:focus-visible { outline: 2px solid var(--at10-accent); outline-offset: 2px; }
  .at10-readout {
    width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    font-size: clamp(9px, 2.5vw, 10px); font-weight: 600;
    letter-spacing: 0.08em; color: var(--at10-muted);
    text-transform: uppercase;
  }
  .at10-val { color: var(--at10-ink); }
  .at10-cap {
    position: absolute; left: 10px; bottom: 8px;
    font: 500 11px/1 ui-monospace, monospace;
    color: var(--at10-ink); opacity: 0.45;
    letter-spacing: 0.04em; text-transform: uppercase;
    user-select: none; pointer-events: none;
  }
</style>

{
 "file": "infinite/loaders/23-atelier-character-loader.html",
 "title": "Atelier Character Loader",
 "description": "Five-cell split-flap mechanical character spinner with hardware center crease and interactive sync pause control.",
 "useWhen": "",
 "avoidWhen": "",
 "agentPrompt": "Keep visibilitychange interval cleanup and reduced-motion pause behavior intact.",
 "editableAreas": [
  "tokens",
  "glyphs"
 ],
 "preserveElements": [
  "visibilitychange"
 ],
 "knownLimitations": [],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [

  "spinner",

  "split-flap",

  "atelier"
 ]
}
</script>
</head>
<body>
<div class="at10-stage">
  <div class="at10-unit">
    <div class="at10-cells" id="at10-cells" aria-hidden="true">
      <div class="at10-cell">/</div>
      <div class="at10-cell">—</div>
      <div class="at10-cell">\</div>
      <div class="at10-cell">|</div>
      <div class="at10-cell">/</div>
    </div>
    <button type="button" class="at10-btn" id="at10-btn" aria-pressed="true">PAUSE SYNC</button>
    <div class="at10-readout">
      <span>BUFFER</span>
      <span class="at10-val" id="at10-out">STATE: ACTIVE</span>
    </div>
  </div>
</div>
<div class="at10-cap" aria-hidden="true">Atelier Character Loader</div>
<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var cells = Array.prototype.slice.call(document.querySelectorAll("#at10-cells .at10-cell"));
  var btn = document.getElementById("at10-btn");
  var out = document.getElementById("at10-out");
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var glyphs = ["/", "—", "\\", "|", "▪", "▫"];
  var running = !reduce && (!window.__foreverPreview || window.__foreverPreview.demoEnabled !== false);
  var tick = 0;
  var iv = null;

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "forever:theme" && (e.data.theme === "light" || e.data.theme === "dark")) {
      root.setAttribute("data-theme", e.data.theme);
    }
  });

  function step() {
    tick++;
    for (var i = 0; i < cells.length; i++) {
      cells[i].textContent = glyphs[(tick + i) % glyphs.length];
    }
  }

  function syncUi() {
    btn.textContent = running ? "PAUSE SYNC" : "RESUME SYNC";
    btn.setAttribute("aria-pressed", running ? "true" : "false");
    out.textContent = running ? "STATE: ACTIVE" : "STATE: HALTED";
  }

  function startLoop() {
    if (!iv && running && !reduce && !document.hidden) {
      iv = setInterval(step, 130);
    }
  }
  function stopLoop() {
    if (iv) { clearInterval(iv); iv = null; }
  }

  btn.addEventListener("click", function () {
    running = !running;
    syncUi();
    if (running) {
      step();
      startLoop();
    } else {
      stopLoop();
    }
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopLoop(); else startLoop();
  });

  syncUi();
  startLoop();
})();
</script>
</body>
</html>
