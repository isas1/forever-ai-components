<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta name="description" content="Hairline CTA — Marketing Sections. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hairline CTA</title>
<script>/* theme hook: ?theme=light|dark, before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  /* shared pro theme tokens (dark defaults; --pro-bg == catalog bg, --pro-accent == catalog accent) */
  :root{
    --pro-bg:#0a0a0a;
    --pro-surface:#111111;
    --pro-border:rgba(255,255,255,.08);
    --pro-text:#ededea;
    --pro-muted:#8a8a85;
    --pro-accent:#3fb680;
    --pro-radius:8px;
    --pro-font:Geist,ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --hc06-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
    --hc06-on-accent:#011a0c;
  }
  :root[data-theme="light"]{
    --pro-bg:#fafaf8;--pro-surface:#f4f4f0;--pro-border:rgba(0,0,0,.08);--pro-text:#1a1a18;--pro-muted:#6b6b66;
    --pro-accent:#1a7a50;--hc06-on-accent:#e0fff2;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--pro-bg)}
  .hc06-stage{position:fixed;inset:0;display:grid;place-items:center;padding:4vmin 4vmin max(4vmin,22px);font-family:var(--pro-font);color:var(--pro-text)}
  .hc06-card{position:relative;width:min(100%,520px);background:var(--pro-surface);border:1px solid var(--pro-border);border-radius:var(--pro-radius);
    padding:clamp(14px,6vmin,44px) clamp(14px,6vmin,40px);display:grid;gap:clamp(6px,2.6vmin,16px)}
  /* the line with no seam: one faint dash runs the card's frame forever */
  .hc06-trace{position:absolute;inset:-1px;width:calc(100% + 2px);height:calc(100% + 2px);pointer-events:none;overflow:visible}
  .hc06-trace rect{fill:none;stroke:color-mix(in srgb,var(--pro-text) 45%,transparent);stroke-width:1.2;vector-effect:non-scaling-stroke;
    stroke-dasharray:.18 .82;stroke-dashoffset:1;animation:hc06-run 5s linear infinite}
  @keyframes hc06-run{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  .hc06-eyebrow{display:flex;align-items:center;gap:8px;font:400 clamp(9px,2.6vmin,11px)/1 var(--hc06-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--pro-muted);min-height:1em}
  .hc06-eyebrow i{width:7px;height:7px;border-radius:999px;background:var(--pro-accent);animation:hc06-beat 2.8s cubic-bezier(.45,0,.55,1) infinite}
  @keyframes hc06-beat{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--pro-accent) 35%,transparent);opacity:1}50%{box-shadow:0 0 0 5px transparent;opacity:.55}}
  .hc06-eyebrow span{transition:opacity .4s}.hc06-eyebrow span.is-out{opacity:0}
  .hc06-head{margin:0;font-size:clamp(16px,6vmin,40px);font-weight:500;line-height:1.05;letter-spacing:-.03em}
  .hc06-head b{font-weight:500;color:var(--pro-muted)}
  .hc06-sub{margin:0;max-width:36ch;font-size:clamp(10px,2.7vmin,15px);line-height:1.45;color:var(--pro-muted)}
  .hc06-actions{display:flex;align-items:center;gap:clamp(10px,3.4vmin,18px);margin-top:clamp(4px,1.6vmin,10px);flex-wrap:wrap}
  .hc06-btn{border:0;border-radius:5px;background:var(--pro-accent);color:var(--hc06-on-accent);cursor:pointer;
    height:clamp(30px,10vmin,48px);padding:0 clamp(12px,4.6vmin,24px);font:500 clamp(11px,3.2vmin,15px)/1 var(--pro-font);letter-spacing:-.01em;
    transition:transform .12s cubic-bezier(.22,1,.36,1),filter .2s;outline:none}
  .hc06-btn:hover{filter:brightness(1.06)}.hc06-btn:active,.hc06-btn.is-down{transform:scale(.97)}
  .hc06-btn:focus-visible{box-shadow:0 0 0 2px var(--pro-surface),0 0 0 4px color-mix(in srgb,var(--pro-accent) 40%,transparent)}
  .hc06-link{font:400 clamp(10px,2.8vmin,12px)/1 var(--hc06-mono);letter-spacing:.02em;color:var(--pro-muted);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--pro-border)}
  /* after a press: a hairline progress runs under the actions, and a mono status reports it */
  .hc06-line{position:relative;height:2px;border-radius:999px;background:color-mix(in srgb,var(--pro-text) 10%,transparent);overflow:hidden;opacity:0;transition:opacity .3s}
  .hc06-line b{position:absolute;inset:0;background:var(--pro-accent);transform:translateX(-100%);transition:transform 1.3s cubic-bezier(.65,0,.35,1)}
  .hc06-card.is-go .hc06-line{opacity:1}.hc06-card.is-go .hc06-line b{transform:none}
  .hc06-status{font:400 clamp(9px,2.6vmin,11px)/1 var(--hc06-mono);letter-spacing:.02em;color:var(--pro-muted);opacity:.7;min-height:1em}
  .hc06-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 var(--hc06-mono);color:var(--pro-muted);opacity:.5;letter-spacing:.08em;text-transform:uppercase;user-select:none;pointer-events:none}
  @media (max-height:230px){.hc06-sub,.hc06-link,.hc06-status{display:none}.hc06-card{gap:6px;padding:10px 12px}.hc06-head{font-size:15px}}
  @media (prefers-reduced-motion:reduce){.hc06-trace rect,.hc06-eyebrow i{animation:none}.hc06-line b{transition:none}}

  :root[data-preview-taken-over] .hc06-trace rect,:root[data-preview-taken-over] .hc06-eyebrow i{animation-play-state:paused!important}
</style>
<script type="application/json" id="forever-agent-meta">

 "useWhen": "Closing sections and mid-page prompts on monochrome marketing pages; products whose brand spends one accent only where it matters.",

</head>
<body>
<div class="hc06-stage">
  <div class="hc06-card" id="hc06-card" role="img" aria-label="Call to action on a hairline card traced by a slow running stroke: eyebrow 'always here', headline 'discover better ideas. hand it to your agent.', a short subline, an accent 'browse the canvas' button and a 'read the docs' link">
    <svg class="hc06-trace" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><rect x=".4" y=".4" width="99.2" height="99.2" rx="1.6" pathLength="1"/></svg>
    <div class="hc06-eyebrow"><i></i><span id="hc06-fact">always here</span></div>
    <h2 class="hc06-head">discover better ideas.<br><b>hand it to your agent.</b></h2>
    <p class="hc06-sub">one file each, zero dependencies, and metadata your agent can read.</p>
    <div class="hc06-actions"><button class="hc06-btn" id="hc06-btn" type="button">browse the canvas</button><span class="hc06-link">read the docs</span></div>
    <div class="hc06-line" aria-hidden="true"><b></b></div>
    <div class="hc06-status" id="hc06-status" role="status" aria-live="polite"></div>
  </div>
</div>
<div class="hc06-cap" aria-hidden="true">Hairline CTA</div>
<script>(function(){"use strict";
  var root=document.documentElement, card=document.getElementById('hc06-card'), btn=document.getElementById('hc06-btn'), fact=document.getElementById('hc06-fact'), status=document.getElementById('hc06-status');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  addEventListener('message',function(e){var d=e.data;if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark'))root.setAttribute('data-theme',d.theme);});
  // quiet facts for the eyebrow — approximate counts only, never a snapshot that goes stale
  var facts=['always here','600+ components','one file each','zero dependencies','dark and light'], fi=0;
  var TICK=100, FACT_EVERY=3000, PRESS_EVERY=5200, IDLE_RESUME=3600, t=0, pressAt=1400, demo=!reduce&&window.__foreverPreview?.demoEnabled!==false, idle=0, clock=null;
  function go(){ card.classList.add('is-go'); btn.classList.add('is-down'); status.textContent='opening canvas';
    setTimeout(function(){btn.classList.remove('is-down');},160);
    setTimeout(function(){status.textContent='600+ components · ready';},1400);
    setTimeout(function(){card.classList.remove('is-go');status.textContent='';},2600); }
  function tick(){ t+=TICK;
    if(t%FACT_EVERY===0){ fact.classList.add('is-out'); setTimeout(function(){fi=(fi+1)%facts.length;fact.textContent=facts[fi];fact.classList.remove('is-out');},400); }
    if(demo){ if(t>=pressAt){ pressAt=t+PRESS_EVERY; go(); } }
     }
  btn.addEventListener('click',function(){ demo=false; idle=0; go(); });
  function start(){ if(demo&&!clock&&!reduce)clock=setInterval(tick,TICK); }
  function stop(){ clearInterval(clock); clock=null; }
function takeover(){if(!demo)return;demo=false;root.dataset.previewTakenOver='';idle=0;stop();}
  window.addEventListener('forever:interactive',takeover,{once:true});document.addEventListener('pointerdown',takeover,{once:true});document.addEventListener('keydown',function(e){if(['Enter',' '].includes(e.key))takeover();});
  document.addEventListener('visibilitychange',function(){ document.hidden?stop():start(); });
  if(!demo)root.dataset.previewTakenOver='';
  if(demo)start(); // reduced motion: the still card with its first fact — the press still works, without the demo
})();</script>
</body>
