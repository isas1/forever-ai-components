<script>/* theme hook: ?theme=light|dark, before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  /* shared pro theme tokens (dark defaults; --pro-bg == catalog bg, --pro-accent == catalog accent) */
  :root{
    --pro-bg:#0a0a0a;
    --pro-surface:#111111;
    --pro-border:rgba(255,255,255,.08);
    --pro-text:#ededea;
    --pro-muted:#8a8a85;
    --pro-accent:#3fb680;
    --pro-radius:8px;
    --pro-font:Geist,ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --ah07-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
    --ah07-well:#070707;--ah07-on-accent:#011a0c;
  }
  :root[data-theme="light"]{
    --pro-bg:#fafaf8;--pro-surface:#f4f4f0;--pro-border:rgba(0,0,0,.08);--pro-text:#1a1a18;--pro-muted:#6b6b66;
    --pro-accent:#1a7a50;--ah07-well:#f1f1ec;--ah07-on-accent:#e0fff2;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--pro-bg)}
  .ah07-stage{position:fixed;inset:0;display:grid;place-items:center;padding:3.4vmin 3.4vmin max(3.4vmin,22px);font-family:var(--pro-font);color:var(--pro-text)}
  .ah07-wrap{width:min(100%,640px);display:grid;grid-template-columns:1fr;gap:clamp(8px,3vmin,20px)}
  @media (min-width:520px){.ah07-wrap{grid-template-columns:1.1fr 1fr;align-items:center}}
  .ah07-copy{display:grid;gap:clamp(5px,2.2vmin,14px)}
  .ah07-eyebrow{font:400 12px/1 var(--ah07-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--pro-muted)}
  .ah07-head{margin:0;font-size:clamp(16px,5.6vmin,34px);font-weight:500;line-height:1.05;letter-spacing:-.03em}
  .ah07-sub{margin:0;max-width:34ch;font-size:clamp(12px,2.6vmin,14px);line-height:1.45;color:var(--pro-muted)}
  .ah07-btn{justify-self:start;border:0;border-radius:5px;background:var(--pro-accent);color:var(--ah07-on-accent);cursor:pointer;
    height:clamp(28px,9vmin,44px);padding:0 clamp(11px,4.2vmin,22px);font:500 clamp(12px,3vmin,14px)/1 var(--pro-font);letter-spacing:-.01em;
    transition:transform .12s cubic-bezier(.22,1,.36,1);outline:none;margin-top:clamp(2px,1vmin,6px)}
  .ah07-btn:active,.ah07-btn.is-down{transform:scale(.97)}
  .ah07-btn:focus-visible{box-shadow:0 0 0 2px var(--pro-bg),0 0 0 4px color-mix(in srgb,var(--pro-accent) 40%,transparent)}
  /* the machine side: a mono bundle that types itself, then streams out over a hairline */
  .ah07-code{position:relative;background:var(--ah07-well);border:1px solid var(--pro-border);border-radius:var(--pro-radius);
    padding:clamp(8px,3vmin,18px) clamp(10px,3.6vmin,18px) clamp(12px,4vmin,20px);font:400 12px/1.55 var(--ah07-mono);letter-spacing:.02em;color:var(--pro-muted)}
  .ah07-code b{font-weight:400;color:var(--pro-text)}
  .ah07-code .ah07-k{color:var(--pro-muted)}.ah07-code .ah07-v{color:var(--pro-accent)}
  .ah07-code i{display:inline-block;width:.6em;height:1.1em;vertical-align:-.2em;background:var(--pro-accent);animation:ah07-blink 1s steps(2) infinite}
  @keyframes ah07-blink{to{opacity:0}}
  .ah07-lines{min-height:calc(1.55em * 5);white-space:pre}
  .ah07-line{position:absolute;left:0;right:0;bottom:0;height:2px;background:color-mix(in srgb,var(--pro-text) 8%,transparent);border-radius:0 0 var(--pro-radius) var(--pro-radius);overflow:hidden}
  .ah07-line b{position:absolute;inset:0;background:var(--pro-accent);transform:translateX(-100%);transition:transform 1.4s cubic-bezier(.65,0,.35,1)}
  .ah07-code.is-send .ah07-line b{transform:none}
  .ah07-stat{display:flex;justify-content:space-between;margin-top:.5em;color:var(--pro-muted);opacity:.75}
  .ah07-stat .ah07-ok{color:var(--pro-accent)}
  .ah07-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 var(--ah07-mono);color:var(--pro-muted);opacity:.5;letter-spacing:.08em;text-transform:uppercase;user-select:none;pointer-events:none}
  @media (max-height:230px){.ah07-sub,.ah07-eyebrow{display:none}.ah07-wrap{gap:6px}.ah07-code{padding:6px 8px 8px;font-size:12px;line-height:1.45}.ah07-stat{display:none}.ah07-lines{min-height:calc(1.45em * 5)}}
  @media (prefers-reduced-motion:reduce){.ah07-code i{animation:none}.ah07-line b{transition:none}}
:root[data-preview-taken-over] .ah07-code i{animation-play-state:paused!important}
</style>
<script type="application/json" id="forever-agent-meta">

 "title": "Agent Handoff CTA",
 "description": "A two-register call to action: the human side carries a lowercase headline, a subline and one accent button; the machine side is a mono bundle (id, framework, category, size, theme) that types itself with a blinking accent cursor, then streams out over a hairline progress and reports 'handed off' before the next bundle types.",
 "useWhen": "Developer-tool and AI-product marketing where the pitch is 'paste this to your agent'; feature sections that pair copy with a live code-ish artefact.",

<body>
<div class="ah07-stage">
  <div class="ah07-wrap" role="img" aria-label="Agent handoff call to action: headline 'hand it to your agent.', a subline, an accent 'copy handoff bundle' button, and a mono metadata bundle that types itself line by line, then streams out over a hairline progress and reports 'handed off'">
    <div class="ah07-copy">
      <span class="ah07-eyebrow">handoff</span>
      <h2 class="ah07-head">hand it to your agent.</h2>
      <p class="ah07-sub">structured metadata ships with every component. paste, describe, ship.</p>
      <button class="ah07-btn" id="ah07-btn" type="button">copy handoff bundle</button>
    </div>
    <div class="ah07-code" id="ah07-code" aria-hidden="true">
      <div class="ah07-lines" id="ah07-lines"></div>
      <div class="ah07-stat"><span id="ah07-stat">ready</span><span id="ah07-size"></span></div>
      <div class="ah07-line"><b></b></div>
    </div>
  </div>
</div>
<div class="ah07-cap" aria-hidden="true">Agent Handoff CTA</div>
<script>(function(){"use strict";
  var root=document.documentElement, code=document.getElementById('ah07-code'), lines=document.getElementById('ah07-lines'), stat=document.getElementById('ah07-stat'), size=document.getElementById('ah07-size'), btn=document.getElementById('ah07-btn');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  addEventListener('message',function(e){var d=e.data;if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark'))root.setAttribute('data-theme',d.theme);});
  // bundles the demo cycles through — product-shaped ids, honest sizes
  var bundles=[[['id','"pricing-stack"'],['framework','"html"'],['category','"sales"'],['size','"9.4 kb"'],['theme','"dark | light"']],
               [['id','"traced-skeleton"'],['framework','"html"'],['category','"loading"'],['size','"6.2 kb"'],['theme','"dark | light"']],
               [['id','"hairline-cta"'],['framework','"html"'],['category','"marketing"'],['size','"7.1 kb"'],['theme','"dark | light"']]], bi=0;
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
  function render(n,cursor){ var b=bundles[bi], out='', c=0;   // n = characters revealed so far
    for(var i=0;i<b.length;i++){ var row=(b[i][0]+':').padEnd(11)+b[i][1]; if(c>=n)break; var part=row.slice(0,n-c);
      var k=part.slice(0,Math.min(part.length,b[i][0].length+1)), v=part.slice(k.length);
      out+='<span class="ah07-k">'+esc(k)+'</span><b>'+esc(v.slice(0,v.indexOf('"')<0?v.length:v.indexOf('"')))+'</b><span class="ah07-v">'+esc(v.slice(v.indexOf('"')<0?v.length:v.indexOf('"')))+'</span>'+(i<b.length-1?'\n':''); c+=row.length+1; }
    lines.innerHTML=out+(cursor?'<i></i>':''); }
  var total=function(){return bundles[bi].reduce(function(a,r){return a+r[0].length+1+10+r[1].length;},0);};
  // phases on a 100 ms clock: type (chars per tick) → send (hairline fills) → handed off → clear → next bundle
  var TICK=100, CPT=4, SEND=1500, DONE=1700, GAP=700, t=0, n=0, phase='type', demo=!reduce&&window.__foreverPreview?.demoEnabled!==false, idle=0, clock=null;
  function send(){ phase='send'; t=0; code.classList.add('is-send'); stat.textContent='streaming'; btn.classList.add('is-down'); setTimeout(function(){btn.classList.remove('is-down');},160); }
  function tick(){ t+=TICK;
    if(phase==='type'){ n=Math.min(total(),n+CPT); render(n,true); if(n>=total()){phase='ready';t=0;stat.textContent='ready';size.textContent=bundles[bi][3][1].replace(/"/g,'');} }
    else if(phase==='ready'){ if(demo&&t>=1200)send();  }
    else if(phase==='send'&&t>=SEND){ phase='done'; t=0; stat.innerHTML='<span class="ah07-ok">handed off</span>'; }
    else if(phase==='done'&&t>=DONE){ phase='gap'; t=0; code.classList.remove('is-send'); lines.innerHTML=''; stat.textContent=''; size.textContent=''; bi=(bi+1)%bundles.length; n=0; }
    else if(phase==='gap'&&t>=GAP){ phase='type'; } if(!demo&&phase==='ready'&&n>=total())stop(); }
  btn.addEventListener('click',function(){ takeover(); if(phase!=='ready'){n=total();render(n,false);phase='ready';stat.textContent='ready';} send();start(true); });
  function start(force){ if((demo||force)&&!clock&&!reduce)clock=setInterval(tick,TICK); }
  function stop(){ clearInterval(clock); clock=null; }
function takeover(){if(!demo)return;demo=false;root.dataset.previewTakenOver='';idle=0;stop();}
  window.addEventListener('forever:interactive',takeover,{once:true});document.addEventListener('pointerdown',takeover,{once:true});document.addEventListener('keydown',function(e){if(['Enter',' '].includes(e.key))takeover();},{once:true});
  document.addEventListener('visibilitychange',function(){ document.hidden?stop():start(); });
  n=Math.floor(total()*.45); render(n,true); // pre-roll: half the bundle is already typed at first paint
  if(reduce){ n=total(); render(n,false); phase='ready'; stat.textContent='ready'; size.textContent='9.4 kb'; }
  if(!demo)root.dataset.previewTakenOver='';
  if(demo)start();
})();</script>
</body>
