<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>

  :root{
    --pro-bg:#0a0a0a;
    --pro-surface:#111111;
    --pro-border:rgba(255,255,255,.08);
    --pro-text:#ededea;
    --pro-muted:#8a8a85;
    --pro-accent:#3fb680;
    --pro-radius:8px;
    --pro-font:Geist,ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --ps08-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
    --ps08-surface-2:#161616;--ps08-on-accent:#011a0c;
  }
  :root[data-theme="light"]{
    --pro-bg:#fafaf8;--pro-surface:#f4f4f0;--pro-border:rgba(0,0,0,.08);--pro-text:#1a1a18;--pro-muted:#6b6b66;
    --pro-accent:#1a7a50;--ps08-surface-2:#ecece6;--ps08-on-accent:#e0fff2;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--pro-bg)}
  .ps08-stage{position:fixed;inset:0;display:grid;place-items:center;padding:3.4vmin 3.4vmin max(3.4vmin,22px);font-family:var(--pro-font);color:var(--pro-text)}
  .ps08-card{width:min(100%,380px);background:var(--pro-surface);border:1px solid var(--pro-border);border-radius:var(--pro-radius);
    padding:clamp(12px,4.4vmin,28px) clamp(12px,4.6vmin,28px);display:grid;gap:clamp(8px,2.8vmin,18px)}
  .ps08-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .ps08-eyebrow{font:400 clamp(9px,2.6vmin,11px)/1 var(--ps08-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--pro-muted)}

  .ps08-seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--ps08-surface-2);border:1px solid var(--pro-border);border-radius:999px;padding:2px;cursor:pointer;user-select:none;outline:none}
  .ps08-seg:focus-visible{box-shadow:0 0 0 2px var(--pro-surface),0 0 0 4px color-mix(in srgb,var(--pro-accent) 40%,transparent)}
  .ps08-seg span{position:relative;z-index:1;padding:5px clamp(8px,2.8vmin,12px);font:500 clamp(9px,2.6vmin,11px)/1 var(--pro-font);color:var(--pro-muted);text-align:center;transition:color .3s}
  .ps08-seg span.ps08-on{color:var(--pro-text)}
  .ps08-thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc(50% - 2px);border-radius:999px;background:var(--pro-surface);border:1px solid var(--pro-border);transition:transform .4s cubic-bezier(.22,1,.36,1)}
  .ps08-card.ps08-annual .ps08-thumb{transform:translateX(100%)}

  .ps08-price{display:flex;align-items:baseline;gap:6px;letter-spacing:-.04em}
  .ps08-roll{position:relative;height:clamp(28px,9vmin,52px);overflow:hidden;font-size:clamp(26px,8.6vmin,50px);font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
  .ps08-roll div{transition:transform .5s cubic-bezier(.22,1,.36,1)}
  .ps08-roll div span{display:block;height:clamp(28px,9vmin,52px)}
  .ps08-card.ps08-annual .ps08-roll div{transform:translateY(-50%)}
  .ps08-per{font:400 clamp(10px,2.9vmin,13px)/1 var(--ps08-mono);letter-spacing:.02em;color:var(--pro-muted)}
  .ps08-note{font:400 clamp(9px,2.6vmin,11px)/1 var(--ps08-mono);letter-spacing:.02em;color:var(--pro-accent);min-height:1em;opacity:0;transition:opacity .4s}
  .ps08-card.ps08-annual .ps08-note{opacity:1}
  .ps08-list{list-style:none;margin:0;padding:0;display:grid;gap:clamp(5px,1.9vmin,10px);border-top:1px solid var(--pro-border);padding-top:clamp(8px,2.8vmin,16px)}
  .ps08-list li{display:flex;align-items:center;gap:9px;font-size:clamp(11px,3vmin,14px);color:var(--pro-text)}
  .ps08-list svg{width:14px;height:14px;flex:none}
  .ps08-list path{fill:none;stroke:var(--pro-accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;stroke-dashoffset:1;transition:stroke-dashoffset .4s cubic-bezier(.22,1,.36,1)}
  .ps08-card.ps08-in .ps08-list path{stroke-dashoffset:0}
  .ps08-list li:nth-child(2) path{transition-delay:.08s}.ps08-list li:nth-child(3) path{transition-delay:.16s}.ps08-list li:nth-child(4) path{transition-delay:.24s}
  .ps08-btn{border:0;border-radius:5px;background:var(--pro-accent);color:var(--ps08-on-accent);cursor:pointer;height:clamp(30px,9.6vmin,46px);
    font:500 clamp(12px,3.3vmin,15px)/1 var(--pro-font);letter-spacing:-.01em;transition:transform .12s cubic-bezier(.22,1,.36,1);outline:none}
  .ps08-btn:active{transform:scale(.97)}
  .ps08-btn:focus-visible{box-shadow:0 0 0 2px var(--pro-surface),0 0 0 4px color-mix(in srgb,var(--pro-accent) 40%,transparent)}
  .ps08-fine{font:400 clamp(9px,2.5vmin,11px)/1.4 var(--ps08-mono);letter-spacing:.02em;color:var(--pro-muted);text-align:center;opacity:.75}
  .ps08-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 var(--ps08-mono);color:var(--pro-muted);opacity:.5;letter-spacing:.08em;text-transform:uppercase;user-select:none;pointer-events:none}
  @media (max-height:230px){.ps08-fine,.ps08-note,.ps08-list li:nth-child(n+3){display:none}.ps08-card{gap:6px;padding:10px 12px}.ps08-list{padding-top:6px}}
  @media (max-width:220px){.ps08-eyebrow{display:none}.ps08-seg span{padding:4px 6px}}
  @media (prefers-reduced-motion:reduce){.ps08-card *{transition:none!important}}
</style>

<body>
<div class="ps08-stage">
  <div class="ps08-card ps08-in" id="ps08-card" role="group" aria-label="Demo membership plan selector">
    <div class="ps08-top"><span class="ps08-eyebrow">membership</span>
      <div class="ps08-seg" id="ps08-seg" role="switch" aria-checked="false" tabindex="0" aria-label="bill annually"><i class="ps08-thumb"></i><span class="ps08-on" id="ps08-m">monthly</span><span id="ps08-a">annual</span></div></div>
    <div>
      <div class="ps08-price"><div class="ps08-roll" data-fit-clip-ok><div><span>£5</span><span>£50</span></div></div><span class="ps08-per" id="ps08-per">/ month</span></div>
      <div class="ps08-note">two months free</div>
    </div>
    <ul class="ps08-list" id="ps08-list"></ul>
    <button class="ps08-btn" id="ps08-select" type="button" aria-pressed="false">Select plan</button>
    <div class="ps08-fine" id="ps08-status" role="status">Demo selection · no checkout</div>
  </div>
</div>
<div class="ps08-cap" aria-hidden="true">Pricing Stack</div>
<script>(function(){"use strict";
  var root=document.documentElement, card=document.getElementById('ps08-card'), seg=document.getElementById('ps08-seg'), m=document.getElementById('ps08-m'), a=document.getElementById('ps08-a'), per=document.getElementById('ps08-per');
  var motion=matchMedia('(prefers-reduced-motion: reduce)'), reduce=motion.matches;
  var select=document.getElementById('ps08-select'), status=document.getElementById('ps08-status');
  addEventListener('message',function(e){var d=e.data;if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark'))root.setAttribute('data-theme',d.theme);});
  var feats=['unlimited copies','every new component','dark and light variants','agent handoff bundles'];
  document.getElementById('ps08-list').innerHTML=feats.map(function(f){return '<li><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5 6.5 12 13 4.5" pathLength="1"/></svg>'+f+'</li>';}).join('');
  var annual=false;
  function set(on){ annual=on; card.classList.toggle('ps08-annual',on); m.classList.toggle('ps08-on',!on); a.classList.toggle('ps08-on',on);
    per.textContent=on?'/ year':'/ month'; seg.setAttribute('aria-checked',on?'true':'false');
    select.textContent='Select plan'; select.setAttribute('aria-pressed','false'); status.textContent='Demo selection · no checkout'; card.ps08Selection=null;
    // the check marks redraw on every plan change
    card.classList.remove('ps08-in'); setTimeout(function(){card.classList.add('ps08-in');},60); }
  // Preview flips plans; deliberate input ends the preview for this mount.
  var TICK=100, FLIP=3600, t=FLIP-2100, demo=!reduce&&window.__foreverPreview?.demoEnabled!==false, idle=0, clock=null;
  function tick(){ if(demo){ t+=TICK; if(t>=FLIP){t=0;set(!annual);} }  }
  function user(){ takeover(); set(!annual); }
  select.addEventListener('click',function(){takeover();var plan={period:annual?'year':'month',price:annual?50:5,currency:'GBP'};card.ps08Selection=plan;select.textContent=(annual?'£50/yr':'£5/mo')+' selected';select.setAttribute('aria-pressed','true');status.textContent='Selected in this demo · no checkout';card.dispatchEvent(new CustomEvent('ps08:select',{bubbles:true,detail:plan}));});
  seg.addEventListener('click',user);
  seg.addEventListener('keydown',function(e){ if(e.key===' '||e.key==='Enter'){e.preventDefault();user();} });
  function start(){ if(demo&&!clock&&!reduce)clock=setInterval(tick,TICK); }
  function stop(){ clearInterval(clock); clock=null; }
function takeover(){if(!demo)return;demo=false;idle=0;stop();}
  window.addEventListener('forever:interactive',takeover,{once:true});document.addEventListener('pointerdown',takeover,{once:true});document.addEventListener('keydown',function(e){if(['Enter',' '].includes(e.key))takeover();},{once:true});
  document.addEventListener('visibilitychange',function(){ document.hidden?stop():start(); });
  motion.addEventListener('change',function(e){reduce=e.matches;reduce?stop():start();});
  if(demo&&!document.hidden)start(); // reduced motion: the monthly card, checks drawn, switch still works
})();</script>
