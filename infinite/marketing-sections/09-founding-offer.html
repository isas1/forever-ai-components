<html lang="en">

<meta charset="utf-8">

<script>/* theme hook: ?theme=light|dark, before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  /* shared pro theme tokens (dark defaults; --pro-bg == catalog bg, --pro-accent == catalog accent) */
  :root{
    --pro-bg:#0a0a0a;
    --pro-surface:#111111;
    --pro-border:rgba(255,255,255,.08);
    --pro-text:#ededea;
    --pro-muted:#8a8a85;
    --pro-accent:#3fb680;
    --pro-radius:8px;
    --pro-font:Geist,ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --fo09-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;--fo09-on-accent:#011a0c;
  }
  :root[data-theme="light"]{
    --pro-bg:#fafaf8;--pro-surface:#f4f4f0;--pro-border:rgba(0,0,0,.08);--pro-text:#1a1a18;--pro-muted:#6b6b66;
    --pro-accent:#1a7a50;--fo09-on-accent:#e0fff2;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--pro-bg)}
  .fo09-stage{position:fixed;inset:0;display:grid;place-items:center;padding:3.4vmin;font-family:var(--pro-font);color:var(--pro-text)}
  .fo09-card{width:min(100%,420px);background:var(--pro-surface);border:1px solid var(--pro-border);border-radius:var(--pro-radius);
    padding:clamp(12px,4.6vmin,30px) clamp(12px,4.8vmin,30px);display:grid;gap:clamp(6px,2.4vmin,16px);position:relative}
  .fo09-trace{position:absolute;inset:-1px;width:calc(100% + 2px);height:calc(100% + 2px);pointer-events:none;overflow:visible}
  .fo09-trace rect{fill:none;stroke:color-mix(in srgb,var(--pro-accent) 70%,transparent);stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-dasharray:.14 .86;stroke-dashoffset:1;animation:fo09-run 4s linear infinite}
  @keyframes fo09-run{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  .fo09-eyebrow{display:flex;align-items:center;gap:8px;font:400 clamp(9px,2.6vmin,11px)/1 var(--fo09-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--pro-muted)}
  .fo09-eyebrow i{width:7px;height:7px;border-radius:999px;background:var(--pro-accent);animation:fo09-beat 2.8s cubic-bezier(.45,0,.55,1) infinite}
  @keyframes fo09-beat{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--pro-accent) 35%,transparent);opacity:1}50%{box-shadow:0 0 0 5px transparent;opacity:.55}}
  .fo09-head{margin:0;font-size:clamp(22px,8vmin,48px);font-weight:500;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
  .fo09-head small{font-size:.42em;font-weight:400;letter-spacing:-.02em;color:var(--pro-muted);margin-left:.2em}
  .fo09-sub{margin:0;max-width:36ch;font-size:clamp(10px,2.6vmin,14px);line-height:1.45;color:var(--pro-muted)}
  /* the seat meter: hairline track, accent fill, mono count — the one place the accent moves */
  .fo09-meter{display:grid;gap:7px;padding-top:clamp(6px,2vmin,10px)}
  .fo09-row{display:flex;justify-content:space-between;gap:8px;font:400 clamp(9.5px,2.7vmin,12px)/1 var(--fo09-mono);letter-spacing:.02em;color:var(--pro-muted);font-variant-numeric:tabular-nums}
  .fo09-row b{font-weight:400;color:var(--pro-text)}
  .fo09-track{position:relative;height:3px;border-radius:999px;background:color-mix(in srgb,var(--pro-text) 10%,transparent);overflow:hidden}
  .fo09-fill{position:absolute;inset:0;transform:scaleX(.62);transform-origin:left;background:var(--pro-accent);border-radius:999px;transition:transform .8s cubic-bezier(.22,1,.36,1);overflow:hidden}
  .fo09-fill::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--pro-text) 55%,transparent),transparent);animation:fo09-sheen 2.4s cubic-bezier(.45,0,.55,1) infinite}
  @keyframes fo09-sheen{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
  .fo09-ticks{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
  .fo09-ticks b{height:2px;background:color-mix(in srgb,var(--pro-text) 8%,transparent);border-radius:1px;transition:background .4s}
  .fo09-ticks b.fo09-on{background:color-mix(in srgb,var(--pro-accent) 55%,transparent)}
  .fo09-btn{border:0;border-radius:5px;background:var(--pro-accent);color:var(--fo09-on-accent);cursor:pointer;height:clamp(30px,9.6vmin,46px);
    font:500 clamp(12px,3.3vmin,15px)/1 var(--pro-font);letter-spacing:-.01em;transition:transform .12s cubic-bezier(.22,1,.36,1);outline:none;margin-top:clamp(2px,1vmin,6px)}
  .fo09-btn:active,.fo09-btn.is-down{transform:scale(.97)}
  .fo09-btn:focus-visible{box-shadow:0 0 0 2px var(--pro-surface),0 0 0 4px color-mix(in srgb,var(--pro-accent) 40%,transparent)}
  .fo09-row>*,.fo09-fine>*{white-space:nowrap}
  .fo09-fine{display:flex;justify-content:space-between;font:400 clamp(9px,2.5vmin,11px)/1.4 var(--fo09-mono);letter-spacing:.02em;color:var(--pro-muted);opacity:.75}
  .fo09-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 var(--fo09-mono);color:var(--pro-muted);opacity:.5;letter-spacing:.08em;text-transform:uppercase;user-select:none;pointer-events:none}
  @media (max-height:230px){.fo09-sub,.fo09-ticks,.fo09-fine{display:none}.fo09-card{gap:6px}}
  @media (max-width:220px){#fo09-left{display:none}}
  @media (prefers-reduced-motion:reduce){.fo09-eyebrow i,.fo09-fill::after,.fo09-trace rect{animation:none}.fo09-card *{transition:none!important}}

  :root[data-preview-taken-over] .fo09-trace rect,:root[data-preview-taken-over] .fo09-eyebrow i,:root[data-preview-taken-over] .fo09-fill::after{animation-play-state:paused!important}
</style>

<body>
<div class="fo09-stage">
  <div class="fo09-card" role="img" aria-label="Founding member offer card: £399 once for permanent membership, a seat meter showing how many of fifty founding seats are taken and slowly filling, and an accent 'claim a seat' button">
    <svg class="fo09-trace" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><rect x=".4" y=".4" width="99.2" height="99.2" rx="1.6" pathLength="1"/></svg>
    <div class="fo09-eyebrow"><i></i><span>founding member</span></div>
    <h2 class="fo09-head">£399<small>once, permanent</small></h2>
    <p class="fo09-sub">permanent membership, early access to pro packs, your name in the credits. fifty seats, then it closes.</p>
    <div class="fo09-meter">
      <div class="fo09-row"><span><b id="fo09-n">31</b> of 50 seats taken</span><span id="fo09-left">19 left</span></div>
      <div class="fo09-track" role="progressbar" aria-valuemin="0" aria-valuemax="50" aria-valuenow="31" id="fo09-bar"><div class="fo09-fill" id="fo09-fill"></div></div>
      <div class="fo09-ticks" id="fo09-ticks" aria-hidden="true"></div>
    </div>
    <button class="fo09-btn" id="fo09-btn" type="button">claim a seat</button>
    <div class="fo09-fine"><span id="fo09-last">last seat 4m ago</span><span>closes when full</span></div>
  </div>
</div>
<div class="fo09-cap" aria-hidden="true">Founding Offer</div>
<script>(function(){"use strict";
  var root=document.documentElement, n=document.getElementById('fo09-n'), left=document.getElementById('fo09-left'), fill=document.getElementById('fo09-fill'), bar=document.getElementById('fo09-bar'), ticks=document.getElementById('fo09-ticks'), last=document.getElementById('fo09-last'), btn=document.getElementById('fo09-btn');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  addEventListener('message',function(e){var d=e.data;if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark'))root.setAttribute('data-theme',d.theme);});
  var SEATS=50, START=31, taken=START;
  ticks.innerHTML=new Array(11).join('<b></b>');
  function paint(){ n.textContent=taken; left.textContent=(SEATS-taken)+' left'; fill.style.transform='scaleX('+(taken/SEATS).toFixed(3)+')'; bar.setAttribute('aria-valuenow',taken);
    for(var i=0;i<10;i++)ticks.children[i].classList.toggle('fo09-on',(i+1)*5<=taken); }
  // a 100 ms clock: a seat goes every ~6 s (demo pacing — plausible, never a scramble); the footer clock counts up between seats
  var TICK=100, EVERY=3200, t=EVERY-900, since=240, clock=null, demo=!reduce&&window.__foreverPreview?.demoEnabled!==false;
  function ago(s){ return s<60? s+'s ago' : Math.floor(s/60)+'m ago'; }
  function take(){ taken = taken>=SEATS? START : taken+1; since=0; paint(); last.textContent='last seat just now';
    btn.classList.add('is-down'); setTimeout(function(){btn.classList.remove('is-down');},160); }
  function tick(){ t+=TICK; if(t%1000===0){ since++; last.textContent="last seat "+ago(since); } if(t>=EVERY){t=0;take();} }
  btn.addEventListener('click',function(){ t=0; take(); });
  function start(){ if(demo&&!clock&&!reduce)clock=setInterval(tick,TICK); }
  function stop(){ clearInterval(clock); clock=null; }
function takeover(){if(!demo)return;demo=false;root.dataset.previewTakenOver='';stop();}
  window.addEventListener('forever:interactive',takeover,{once:true});document.addEventListener('pointerdown',takeover,{once:true});document.addEventListener('keydown',function(e){if(['Enter',' '].includes(e.key))takeover();});
  document.addEventListener('visibilitychange',function(){ document.hidden?stop():start(); });
  if(!demo)root.dataset.previewTakenOver='';
  paint(); if(demo)start(); // reduced motion: the meter at its starting count, no pulse; the button still takes a seat
})();</script>
</body>
