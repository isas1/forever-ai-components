<script>/* theme hook: ?theme=light|dark, before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  /* shared pro theme tokens (dark defaults; --pro-bg == catalog bg, --pro-accent == catalog accent) — Classical Atelier register */
  :root{
    --pro-bg:#17130f;
    --pro-surface:#241e18;
    --pro-border:rgba(241,233,216,.32);
    --pro-text:#f1e9d8;
    --pro-muted:#bdb2a1;
    --pro-accent:#d66b59;
    --pro-radius:2px;
    --pro-font:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
    --av10-display:Marcellus,Georgia,"Times New Roman",serif;--av10-mono:ui-monospace,"SF Mono",Menlo,monospace;
    --av10-olive:#929b64;--av10-bronze:#c99a51;--av10-hair:rgba(241,233,216,.18);--av10-hi:rgba(241,233,216,.22);--av10-inset:#100d0a;--av10-inverse:#17130f;
  }
  :root[data-theme="light"]{
    --pro-bg:#e9e4da;--pro-surface:#f8f4ea;--pro-border:rgba(36,31,25,.34);--pro-text:#241f19;--pro-muted:#675f54;--pro-accent:#94382f;
    --av10-olive:#58613b;--av10-bronze:#9a6828;--av10-hair:rgba(36,31,25,.16);--av10-hi:rgba(255,255,255,.72);--av10-inset:#dcd6ca;--av10-inverse:#f8f4ea;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--pro-bg)}
  .av10-stage{position:fixed;inset:0;display:grid;place-items:center;padding:4vmin 4vmin max(4vmin,22px);font-family:var(--pro-font);color:var(--pro-text)}
  .av10-card{width:min(100%,400px);background:var(--pro-surface);border:1px solid var(--pro-border);border-radius:var(--pro-radius);
    box-shadow:0 1px 1px rgba(0,0,0,.1),0 2px 6px -2px rgba(0,0,0,.12);padding:clamp(12px,4.4vmin,24px) clamp(14px,5vmin,24px);display:grid;gap:clamp(8px,3vmin,14px)}
  .av10-eyebrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .av10-label{font-size:clamp(9px,2.6vmin,12px);letter-spacing:.09em;text-transform:uppercase;color:var(--pro-muted)}
  .av10-acc{font:400 clamp(9px,2.6vmin,12px)/1 var(--av10-mono);letter-spacing:.02em;color:var(--av10-bronze);white-space:nowrap}
  .av10-fig{display:flex;align-items:baseline;gap:8px;min-width:0}
  .av10-fig b{font:400 clamp(28px,9.5vmin,44px)/1.05 var(--av10-display);letter-spacing:.005em;color:var(--pro-accent);transition:color .22s}
  .av10-fig span{font-size:clamp(11px,3vmin,14px);line-height:1.4}
  .av10-slots{display:grid;gap:2px}
  .av10-slots i{height:10px;border-radius:var(--pro-radius);background:var(--av10-inset);border:1px solid var(--av10-hair);box-shadow:inset 0 1px 2px rgba(0,0,0,.14);transition:background .32s,border-color .32s}
  .av10-slots i.av10-on{background:color-mix(in oklab,var(--pro-accent) 30%,var(--pro-surface));border-color:color-mix(in oklab,var(--pro-accent) 55%,transparent);box-shadow:none}
  .av10-lede{margin:0;font-size:clamp(10px,2.8vmin,13px);line-height:1.5;color:var(--pro-muted)}
  .av10-btn{position:relative;overflow:hidden;width:100%;min-height:clamp(36px,11vmin,48px);border-radius:var(--pro-radius);cursor:pointer;outline:none;
    background:var(--pro-accent);color:var(--av10-inverse);border:1px solid color-mix(in oklab,var(--pro-accent) 62%,var(--pro-text));
    box-shadow:0 1px 0 0 var(--av10-hair),inset 0 1px 0 0 var(--av10-hi);font:400 clamp(11px,3vmin,14px)/1 var(--pro-font);letter-spacing:.09em;text-transform:uppercase;
    transition:transform 90ms,box-shadow 90ms}
  .av10-btn:active,.av10-btn.is-down{transform:scale(.985);box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
  .av10-btn:focus-visible{box-shadow:0 0 0 2px var(--pro-surface),0 0 0 4px color-mix(in oklab,#6f9fc1 70%,transparent)}
  .av10-btn::after{content:"";position:absolute;inset:0;opacity:0;background:linear-gradient(100deg,transparent 30%,color-mix(in oklab,var(--av10-hi) 60%,transparent) 48%,transparent 66%);background-size:200% 100%}
  .av10-btn.is-busy::after{opacity:1;animation:av10-sweep 2.6s linear infinite}
  @keyframes av10-sweep{from{background-position:120% 0}to{background-position:-120% 0}}
  /* noted: olive mark, display title, a 38.2% bronze rule engraves itself */
  .av10-ready{display:grid;gap:clamp(8px,3vmin,14px)}
  .av10-done-text{min-width:0;display:grid;gap:6px}
  .av10-done{display:none;gap:12px;align-items:flex-start}
  .av10-mark{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;background:color-mix(in oklab,var(--av10-olive) 16%,var(--pro-surface));border:1px solid color-mix(in oklab,var(--av10-olive) 42%,transparent);color:var(--av10-olive)}
  .av10-mark svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.25;stroke-linecap:square;stroke-linejoin:miter}
  .av10-mark path{stroke-dasharray:1 1;stroke-dashoffset:1;transition:stroke-dashoffset .32s}
  .av10-title{margin:0;font:400 clamp(15px,4.6vmin,20px)/1.18 var(--av10-display);letter-spacing:.005em}
  .av10-rule{height:2px;width:0;background:var(--av10-bronze);transition:width .9s cubic-bezier(.2,0,0,1)}
  .av10-card.is-done .av10-ready{display:none}.av10-card.is-done .av10-done{display:flex}
  .av10-card.is-done .av10-rule{width:38.2%}.av10-card.is-done .av10-mark path{stroke-dashoffset:0}
  .av10-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 var(--av10-mono);color:var(--pro-muted);opacity:.5;letter-spacing:.08em;text-transform:uppercase;user-select:none;pointer-events:none}
  @media (max-height:230px){.av10-lede,.av10-done .av10-acc,.av10-rule{display:none}.av10-card{gap:6px;padding:10px 12px}}
  @media (prefers-reduced-motion:reduce){.av10-card *{transition:none!important}.av10-btn.is-busy::after{animation:none;opacity:0}}
</style>

<body>
<div class="av10-stage">
  <div class="av10-card" id="av10-card" role="img" aria-label="Availability card: two of six project slots left this month, six slot marks, and an ask-about-a-slot action that confirms with enquiry noted">
    <div class="av10-eyebrow"><span class="av10-label" id="av10-eye">Availability</span><span class="av10-acc">Updated today</span></div>
    <div class="av10-ready">
      <div class="av10-fig"><b id="av10-n">2</b><span id="av10-txt">of 6 project slots left this month</span></div>
      <div class="av10-slots" id="av10-slots" role="progressbar" aria-valuemin="0" aria-valuemax="6" aria-valuenow="4" aria-label="4 of 6 slots taken"></div>
      <p class="av10-lede">New work starts from 22 September.</p>
      <button class="av10-btn" id="av10-btn" type="button">Ask about a slot</button>
    </div>
    <div class="av10-done">
      <span class="av10-mark" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 8.4 6.3 11.7 13 4.6" pathLength="1"/></svg></span>
      <div class="av10-done-text"><p class="av10-title">Enquiry noted</p><p class="av10-lede">Maya K. replies by Thursday with next steps.</p>
        <span class="av10-acc" id="av10-ref">2/6 · project slots</span><div class="av10-rule"></div></div>
    </div>
  </div>
</div>
<div class="av10-cap" aria-hidden="true">Availability Signal</div>
<script>(function(){"use strict";
  var root=document.documentElement, card=document.getElementById('av10-card'), btn=document.getElementById('av10-btn'), eye=document.getElementById('av10-eye'), n=document.getElementById('av10-n'), txt=document.getElementById('av10-txt'), slots=document.getElementById('av10-slots'), ref=document.getElementById('av10-ref');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  addEventListener('message',function(e){var d=e.data;if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark'))root.setAttribute('data-theme',d.theme);});
  var TOTAL=6, free=2;
  slots.style.gridTemplateColumns='repeat('+TOTAL+',minmax(0,1fr))'; slots.innerHTML=new Array(TOTAL+1).join('<i></i>');
  function paint(){ var taken=TOTAL-free; n.textContent=free; txt.textContent='of '+TOTAL+' project slots left this month';
    var scarce=free<=Math.ceil(TOTAL/3); n.style.color=scarce?'var(--pro-accent)':'var(--av10-olive)';
    for(var i=0;i<TOTAL;i++)slots.children[i].classList.toggle('av10-on',i<taken);
    slots.setAttribute('aria-valuenow',taken); slots.setAttribute('aria-label',taken+' of '+TOTAL+' slots taken'); ref.textContent=free+'/'+TOTAL+' · project slots'; }
  // ready → sending → noted → ready with one slot fewer; a click runs the same path
  var TICK=100, READY=2400, SEND=1000, DONE=2600, state='ready', t=READY-1200, demo=!reduce&&window.__foreverPreview?.demoEnabled!==false, idle=0, clock=null;
  function set(s){ state=s; t=0; btn.classList.toggle('is-busy',s==='sending'); btn.disabled=(s!=='ready'); btn.textContent=s==='sending'?'Sending':'Ask about a slot';
    card.classList.toggle('is-done',s==='done'); eye.textContent=s==='done'?'Noted':'Availability';
    if(s==='ready'){ free=free<=1?3:free-1; paint(); } }
  function send(){ if(state!=='ready')return; btn.classList.add('is-down'); setTimeout(function(){btn.classList.remove('is-down');},120); if(reduce){set('done');setTimeout(function(){set('ready');},DONE);return;} set('sending'); }
  function tick(){ t+=TICK; if(state==='sending'&&t>=SEND)set('done'); else if(state==='done'&&t>=DONE){set('ready');if(!demo)stop();}
    else if(state==='ready'){ if(demo){ if(t>=READY)send(); }  } }
  btn.addEventListener('click',function(){ demo=false; idle=0; send(); });
  function start(){ if(demo&&!clock&&!reduce)clock=setInterval(tick,TICK); }
  function stop(){ clearInterval(clock); clock=null; }
function takeover(){if(!demo)return;demo=false;idle=0;}
  window.addEventListener('forever:interactive',takeover,{once:true});document.addEventListener('pointerdown',takeover,{once:true});document.addEventListener('keydown',function(e){if(['Enter',' '].includes(e.key))takeover();},{once:true});
  document.addEventListener('visibilitychange',function(){ document.hidden?stop():start(); });
  paint(); start(); // reduced motion: the still card at two free slots; the button confirms without the sweep
})();</script>
