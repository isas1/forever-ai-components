<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta name="description" content="Dappled Light Hero — Marketing Sections. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dappled Light Hero</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>

  :root{
    --pro-bg:#17212b;
    --pro-surface:#22303a;
    --pro-border:rgba(245,233,210,.12);
    --pro-text:#f5e9d2;
    --pro-muted:#bac0ba;
    --pro-accent:#e9795b;
    --pro-accent-2:#73b0bd;
    --pro-warn:#e2b951;
    --pro-ok:#8ca279;
    --pro-radius:16px;
    --pro-font:"Source Sans 3",ui-sans-serif,system-ui,-apple-system,sans-serif;
    --dh12-display:Ysabeau,Georgia,"Iowan Old Style",serif;
    --dh12-wash-warm:rgba(226,185,81,.16);--dh12-wash-cool:rgba(115,176,189,.16);--dh12-wash-red:rgba(233,121,91,.16);--dh12-wash-leaf:rgba(140,162,121,.15);--dh12-on-accent:#17212b;
  }
  :root[data-theme="light"]{
    --pro-bg:#f1e5ce;--pro-surface:#faf4e7;--pro-border:rgba(32,48,68,.1);--pro-text:#203044;--pro-muted:#686b6b;--pro-accent:#9e3e31;--pro-accent-2:#356c7d;--pro-warn:#c28a21;--pro-ok:#526b45;
    --dh12-wash-warm:rgba(194,138,33,.16);--dh12-wash-cool:rgba(53,108,125,.14);--dh12-wash-red:rgba(158,62,49,.14);--dh12-wash-leaf:rgba(82,107,69,.13);--dh12-on-accent:#faf4e7;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--pro-bg)}
  .dh12-hero{position:fixed;inset:0;isolation:isolate;display:flex;flex-direction:column;padding:clamp(12px,5vmin,30px) clamp(12px,5vmin,30px) clamp(24px,9vmin,40px);font-family:var(--pro-font);color:var(--pro-text)}

  .dh12-wash{position:absolute;inset:-18% -14%;z-index:-3;background:radial-gradient(120% 90% at 12% 8%,var(--dh12-wash-warm) 0,transparent 58%),radial-gradient(100% 80% at 88% 26%,var(--dh12-wash-cool) 0,transparent 62%);
    animation:dh12-drift 24s cubic-bezier(.45,.05,.55,.95) -9s infinite alternate}
  .dh12-dabs{position:absolute;inset:-10%;z-index:-2;background-size:100% 100%;background-repeat:no-repeat;
    background-image:radial-gradient(circle at 7% 19%,var(--dh12-wash-warm) 0 5px,transparent 6px),radial-gradient(circle at 19% 63%,var(--dh12-wash-leaf) 0 4px,transparent 5px),radial-gradient(circle at 26% 11%,var(--dh12-wash-warm) 0 6px,transparent 7px),radial-gradient(circle at 34% 41%,var(--dh12-wash-red) 0 3px,transparent 4px),radial-gradient(circle at 43% 84%,var(--dh12-wash-leaf) 0 5px,transparent 6px),radial-gradient(circle at 51% 27%,var(--dh12-wash-warm) 0 7px,transparent 8px),radial-gradient(circle at 58% 59%,var(--dh12-wash-cool) 0 4px,transparent 5px),radial-gradient(circle at 66% 9%,var(--dh12-wash-red) 0 5px,transparent 6px),radial-gradient(circle at 71% 73%,var(--dh12-wash-warm) 0 3px,transparent 4px),radial-gradient(circle at 79% 36%,var(--dh12-wash-leaf) 0 6px,transparent 7px),radial-gradient(circle at 86% 88%,var(--dh12-wash-warm) 0 4px,transparent 5px),radial-gradient(circle at 93% 52%,var(--dh12-wash-red) 0 5px,transparent 6px);
    -webkit-mask-image:linear-gradient(to bottom,#000 62%,rgba(0,0,0,.7) 80%,transparent);mask-image:linear-gradient(to bottom,#000 62%,rgba(0,0,0,.7) 80%,transparent);
    animation:dh12-dab 18s cubic-bezier(.45,.05,.55,.95) -6s infinite alternate}
  .dh12-land{position:absolute;left:0;right:0;bottom:0;height:36%;z-index:-1;background:linear-gradient(to bottom,transparent,var(--dh12-wash-leaf));opacity:.9}
  @keyframes dh12-drift{from{transform:translate3d(-2%,-1%,0) scale(1.04)}to{transform:translate3d(2.5%,1.5%,0) scale(1.1)}}
  @keyframes dh12-dab{from{transform:translate3d(0,0,0);opacity:.62}to{transform:translate3d(4%,-2.5%,0);opacity:1}}

  .dh12-in{margin-top:auto;margin-inline-start:clamp(0px,3vmin,24px);max-width:84%}
  .dh12-k{margin:0 0 clamp(4px,1.6vmin,8px);font-size:clamp(8px,2.4vmin,11px);letter-spacing:.14em;text-transform:uppercase;color:var(--pro-muted);display:flex;gap:8px;align-items:center}
  .dh12-k i{width:7px;height:7px;border-radius:60% 40% 55% 45%/50% 58% 42% 50%;background:var(--pro-warn);animation:dh12-br 12s cubic-bezier(.45,.05,.55,.95) infinite alternate}
  @keyframes dh12-br{from{transform:rotate(-7deg) scale(.9);opacity:.8}to{transform:rotate(9deg) scale(1.08);opacity:1}}
  .dh12-h{margin:0 0 clamp(6px,2.2vmin,14px);font:300 clamp(22px,10vmin,58px)/1.05 var(--dh12-display);letter-spacing:-.02em;text-wrap:balance}
  .dh12-b{margin:0 0 clamp(8px,3vmin,18px);font-size:clamp(10px,2.8vmin,15px);line-height:1.5;color:var(--pro-muted);max-width:34ch}
  .dh12-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .dh12-cta{border:0;cursor:pointer;font:600 clamp(10px,2.7vmin,14px)/1 var(--pro-font);padding:clamp(7px,2.2vmin,12px) clamp(12px,4vmin,22px);border-radius:6px;background:var(--pro-accent);color:var(--dh12-on-accent);outline:none;
    transition:transform 220ms cubic-bezier(.2,.7,.25,1),background 220ms}
  .dh12-cta:active,.dh12-cta.dh12-down{transform:scale(.985)}
  .dh12-cta:focus-visible{outline:2px solid var(--pro-accent-2);outline-offset:3px}
  .dh12-note{font-size:clamp(9px,2.5vmin,12px);color:var(--pro-muted);font-variant-numeric:tabular-nums;min-height:1.2em;transition:opacity 220ms}
  .dh12-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--pro-muted);opacity:.5;letter-spacing:.08em;text-transform:uppercase;user-select:none;pointer-events:none}
  .dh12-hero.dh12-paused .dh12-wash,.dh12-hero.dh12-paused .dh12-dabs,.dh12-hero.dh12-paused .dh12-k i{animation-play-state:paused}
  @media (max-height:260px){.dh12-b{display:none}}
  @media (prefers-reduced-motion:reduce){.dh12-wash,.dh12-dabs,.dh12-k i{animation:none}.dh12-wash{transform:translate3d(1%,0,0) scale(1.07)}.dh12-dabs{opacity:.85}}

  :root[data-preview-taken-over] .dh12-wash,:root[data-preview-taken-over] .dh12-dabs,:root[data-preview-taken-over] .dh12-k i{animation-play-state:paused!important}
</style>
<script type="application/json" id="forever-agent-meta">

</head>
<body>
<div class="dh12-hero" role="group" aria-label="Field notes study demo">
  <div class="dh12-wash" aria-hidden="true"></div><div class="dh12-dabs" aria-hidden="true"></div><div class="dh12-land" aria-hidden="true"></div>
  <div class="dh12-in">
    <p class="dh12-k"><i aria-hidden="true"></i><span id="dh12-k">Field notes · 14:20</span></p>
    <h1 class="dh12-h">Twenty minutes of usable light</h1>
    <p class="dh12-b">A working record of colour, weather and the moment before it goes.</p>
    <div class="dh12-row"><button class="dh12-cta" id="dh12-cta" type="button">Start a study</button><span class="dh12-note" id="dh12-note" role="status" aria-live="polite">Demo · this tab</span></div>
  </div>
</div>
<div class="dh12-cap" aria-hidden="true">Dappled Light Hero</div>
<script>(function(){"use strict";
  var root=document.documentElement, hero=document.querySelector('.dh12-hero'), cta=document.getElementById('dh12-cta'), note=document.getElementById('dh12-note'), k=document.getElementById('dh12-k');
  var motion=matchMedia('(prefers-reduced-motion: reduce)'), reduce=motion.matches;
  addEventListener('message',function(e){var d=e.data;if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark'))root.setAttribute('data-theme',d.theme);});
  // Preview demonstrates the press without creating records. Manual starts create session records.
  var preview=false, studies=[], TICK=100, EVERY=5200, t=EVERY-1600, demo=window.__foreverPreview?.demoEnabled!==false, idle=0, clock=null;
  hero.dh12Studies=studies;
  function press(){cta.classList.add('dh12-down');setTimeout(function(){cta.classList.remove('dh12-down');},200);}
  function study(){takeover();press();var record={id:studies.length+1,title:'Usable light',startedAt:new Date().toISOString(),minutes:20};studies.push(record);note.textContent='Study '+record.id+' · this tab';cta.textContent='Start another';hero.dispatchEvent(new CustomEvent('dh12:study',{bubbles:true,detail:record}));}
  function tick(){if(demo){t+=TICK;if(t>=EVERY){t=0;press();preview=!preview;note.textContent=preview?'Preview · 20 min':'Demo · this tab';}}}
  cta.addEventListener('click',study);
  function start(){ if(demo&&!clock&&!reduce)clock=setInterval(tick,TICK); if(demo)hero.classList.remove('dh12-paused'); }
  function stop(){ clearInterval(clock); clock=null; hero.classList.add('dh12-paused'); }
function takeover(){if(!demo)return;demo=false;root.dataset.previewTakenOver='';idle=0;stop();}
  window.addEventListener('forever:interactive',takeover,{once:true});document.addEventListener('pointerdown',takeover,{once:true});document.addEventListener('keydown',function(e){if(['Enter',' '].includes(e.key))takeover();});
  document.addEventListener('visibilitychange',function(){ document.hidden?stop():start(); });
  if(!demo)root.dataset.previewTakenOver='';
  motion.addEventListener('change',function(e){reduce=e.matches;reduce?stop():start();});
  if(demo&&!document.hidden)start(); // reduced motion: the composition settles complete and still; the button still records a study
})();</script>
</body>
</html>
