<script>/* theme hook: ?theme=light|dark, before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  /* shared pro theme tokens (dark defaults; --pro-bg == catalog bg, --pro-accent == catalog accent) —
     Urban Azulejo register: a stencilled notice band on plaster; the torn mustard label is the view's one break */
  :root{
    --pro-bg:#111b25;
    --pro-surface:#1b2934;
    --pro-border:#0b141d;
    --pro-text:#eef1ec;
    --pro-muted:#adb8bc;
    --pro-accent:#7a9cc4;
    --pro-radius:2px;
    --pro-font:"Source Sans 3",ui-sans-serif,system-ui,sans-serif;
    --st13-display:"Archivo Black","Arial Black",Impact,sans-serif;--st13-mono:"Recursive Mono",ui-monospace,Menlo,monospace;
    --st13-band:#eef1ec;--st13-on-band:#223140;--st13-poster:#e3bf58;--st13-aqua:#75b2b0;--st13-coral:#e46f58;--st13-plaster:#2a3742;--st13-chip:#32404c;
  }
  :root[data-theme="light"]{
    --pro-bg:#ded9cf;--pro-surface:#f6f1e7;--pro-border:#c7bfb0;--pro-text:#17263b;--pro-muted:#616b72;--pro-accent:#1d5295;
    --st13-band:#17263b;--st13-on-band:#fbf8f1;--st13-poster:#c99a20;--st13-aqua:#4f8889;--st13-coral:#b94430;--st13-plaster:#d2cbbe;--st13-chip:#cfc6b4;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--pro-bg)}
  .st13-stage{position:fixed;inset:0;display:grid;place-items:center;align-content:center;gap:clamp(8px,3vmin,16px);padding:4vmin;font-family:var(--pro-font);color:var(--pro-text)}
  /* worn plaster ground around the band (chip blooms + an 84° grain), nothing interactive sits on it */
  .st13-wall{width:min(100%,480px);background:var(--st13-plaster);background-image:radial-gradient(120% 80% at 18% 20%,rgba(255,255,255,.07) 0 38%,#0000 60%),repeating-linear-gradient(84deg,rgba(23,38,59,.06) 0 1px,#0000 1px 5px);
    padding:clamp(10px,4vmin,22px);border-radius:var(--pro-radius);display:grid;gap:clamp(8px,3vmin,14px)}
  .st13-head{display:flex;justify-content:space-between;font:400 clamp(8px,2.4vmin,11px)/1 var(--st13-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--pro-muted)}
  .st13-band{position:relative;display:flex;align-items:stretch;background:var(--st13-band);color:var(--st13-on-band);border-radius:var(--pro-radius);overflow:hidden;min-height:clamp(32px,11vmin,44px)}
  .st13-label{display:flex;align-items:center;padding:0 clamp(10px,3.6vmin,16px);background:var(--st13-poster);color:#17263b;font:400 clamp(8px,2.5vmin,11px)/1 var(--st13-display);letter-spacing:.14em;text-transform:uppercase;flex:none;
    clip-path:polygon(0 0,92% 0,100% 7%,93% 15%,100% 24%,92% 33%,100% 42%,93% 51%,100% 60%,92% 69%,100% 78%,93% 87%,100% 95%,94% 100%,0 100%);padding-right:clamp(14px,4.6vmin,22px)}
  .st13-run{position:relative;flex:1;overflow:hidden;min-width:0;-webkit-mask:linear-gradient(90deg,transparent,#000 12px);mask:linear-gradient(90deg,transparent,#000 12px)}
  .st13-run::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.28) 0 1px,#0000 1px),radial-gradient(circle at 70% 60%,rgba(255,255,255,.18) 0 1px,#0000 1px);background-size:14px 14px;opacity:.5;pointer-events:none;z-index:1}
  .st13-strip{display:flex;width:max-content;height:100%;animation:st13-scroll 34s linear infinite}
  .st13-band:hover .st13-strip,.st13-band.is-paused .st13-strip{animation-play-state:paused}
  @keyframes st13-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .st13-item{display:flex;align-items:center;gap:10px;padding:0 clamp(14px,4.6vmin,26px);border-right:1px solid color-mix(in srgb,var(--st13-on-band) 14%,transparent);white-space:nowrap}
  .st13-item i{width:8px;height:8px;border-radius:var(--pro-radius);flex:none}
  .st13-item s{text-decoration:none;font:400 clamp(8px,2.3vmin,11px)/1 var(--st13-mono);letter-spacing:.06em;opacity:.6}
  .st13-item span{font:500 clamp(9px,2.7vmin,13px)/1 var(--pro-font);letter-spacing:.1em;text-transform:uppercase}
  .st13-pause{position:absolute;right:6px;top:50%;transform:translateY(-50%);z-index:2;border:0;cursor:pointer;padding:4px 8px;background:color-mix(in srgb,var(--st13-on-band) 12%,transparent);color:var(--st13-on-band);font:400 10px/1 var(--st13-mono);letter-spacing:.06em;border-radius:var(--pro-radius);opacity:0;transition:opacity 180ms}
  .st13-band:hover .st13-pause,.st13-pause:focus-visible,.st13-band.is-paused .st13-pause{opacity:1}
  .st13-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);margin:0;padding:0}
  .st13-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 var(--st13-mono);color:var(--pro-muted);opacity:.5;letter-spacing:.08em;text-transform:uppercase;user-select:none;pointer-events:none}
  @media (prefers-reduced-motion:reduce){.st13-strip{animation:none}}
</style>

<body>
<div class="st13-stage">
  <div class="st13-wall">
    <div class="st13-head"><span>Notices · 4</span><span>updated 14:20</span></div>
    <section class="st13-band" id="st13-band" aria-label="Offers">
      <div class="st13-label" aria-hidden="true">Offers</div>
      <div class="st13-run"><div class="st13-strip" id="st13-strip" aria-hidden="true"></div></div>
      <button class="st13-pause" id="st13-pause" type="button" aria-pressed="false">PAUSE</button>
      <ul class="st13-sr" data-fit-clip-ok id="st13-list"></ul>
    </section>
  </div>
</div>
<div class="st13-cap" aria-hidden="true">Stencil Notice Ticker</div>
<script>(function(){"use strict";
  var root=document.documentElement, band=document.getElementById('st13-band'), strip=document.getElementById('st13-strip'), list=document.getElementById('st13-list'), pause=document.getElementById('st13-pause');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  addEventListener('message',function(e){var d=e.data;if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark'))root.setAttribute('data-theme',d.theme);});
  // invented civic-offer copy, stamped with a coordinate each; tones map to the status vocabulary
  var tones={live:'var(--st13-aqua)',info:'var(--pro-accent)',warn:'var(--st13-poster)',fault:'var(--st13-coral)'};
  var items=[['A1','Founding seats · 18 of 50 left','live'],['B3','Membership £5 a month · cancel any time','info'],['C4','Every component ships as one file','info'],['D2','Pro packs · early access opens October','warn']];
  var run=items.concat(items); // doubled so the -50% translate wraps with no seam
  strip.innerHTML=run.map(function(it){return '<span class="st13-item"><i style="background:'+tones[it[2]]+'"></i><s>'+it[0]+'</s><span>'+it[1]+'</span></span>';}).join('');
  list.innerHTML=items.map(function(it){return '<li>'+it[0]+' — '+it[1]+'</li>';}).join('');
  var user=false, demo=window.__foreverPreview?.demoEnabled!==false;
  function takeover(){demo=false;user=true;band.classList.add('is-paused');pause.setAttribute('aria-pressed','true');pause.textContent='PLAY';}
  window.addEventListener('forever:interactive',takeover,{once:true});document.addEventListener('pointerdown',takeover,{once:true});document.addEventListener('keydown',function(e){if(['Enter',' '].includes(e.key))takeover();},{once:true});
  if(!demo){user=true;band.classList.add('is-paused');pause.setAttribute('aria-pressed','true');pause.textContent='PLAY';}
  pause.addEventListener('click',function(){ user=!user; band.classList.toggle('is-paused',user); pause.setAttribute('aria-pressed',user?'true':'false'); pause.textContent=user?'PLAY':'PAUSE'; });
  document.addEventListener('visibilitychange',function(){ strip.style.animationPlayState=document.hidden?'paused':'running'; });
  // reduced motion: the strip does not scroll; the hidden list carries every notice for readers
})();</script>
