<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Three Memphis pattern bands — dots, zigzags, squiggles, confetti, rings — scroll horizontally in opposing directions split by crisp accent s">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pattern Clash</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark defaults, light re-theme below; --mp10-p0..p6 feed the bands via syncTheme() */
  :root{--mp10-bg:#211A17;--mp10-cap:#fff;--mp10-cap-o:.42;
    --mp10-p0:#D345A4;--mp10-p1:#ff4d80;--mp10-p2:#ffd23f;--mp10-p3:#C0B459;--mp10-p4:#ff8c42;--mp10-p5:#f4f0e6;--mp10-p6:#A18798}
  :root[data-theme="light"]{--mp10-bg:#f7f3ef;--mp10-cap:#211a17;--mp10-cap-o:.5;
    --mp10-p0:#c12e91;--mp10-p1:#db003f;--mp10-p2:#8a6900;--mp10-p3:#776e2d;--mp10-p4:#bd4a00;--mp10-p5:#2b211c;--mp10-p6:#84677a}
  html,body{margin:0;height:100%;background:var(--mp10-bg);overflow:hidden}
  #mp10-stage{position:fixed;inset:0;background:var(--mp10-bg)}
  #mp10-c{position:absolute;inset:0;width:100%;height:100%;display:block}
  .cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--mp10-cap);opacity:var(--mp10-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important}}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/memphis/10-pattern-clash.html",
 "title": "Pattern Clash",
 "description": "Three Memphis pattern bands — dots, zigzags, squiggles, triangles, rings — scroll in opposing directions at different speeds, split by crisp accent seams.",
 "useWhen": "Memphis or 80s retro themed hero backgrounds, pattern showcases, decorative section dividers with high visual energy.",
 "avoidWhen": "Content-heavy layouts where text must be legible over the background. Low-end mobile where continuous canvas redraws may stutter.",
 "agentPrompt": "Change the top band accent color from '#D345A4' to '#00ff99', slow the top scroll speed from 78 to 48, and increase cell size divisor from 6.2 to 5 for larger motifs. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "Memphis color palette (PAL array)",
  "scroll speeds per band (oTop/oMid/oBot multipliers)",
  "cell size divisor (W/6.2)",
  "motif kind assignments per band (kindA/kindB args)",
  "seam accent colors (#D345A4 / #ff4d80)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "IIFE wrapper",
  "prefers-reduced-motion static fallback (drawOneFrame)",
  "visibilitychange stop/start guards",
  "DPR-aware canvas sizing",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "No interactivity — purely passive; adding pointer response requires significant rework",
  "Cell size is viewport-width-relative so very wide screens may show oversized motifs",
  "Background color hardcoded in both CSS and JS BG variable — must update both"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "memphis",
  "pattern",
  "scrolling",
  "canvas",
  "geometric",
  "retro",
  "80s",
  "tiled"
 ]
}
</script>
</head>
<body>
<div id="mp10-stage" role="img" aria-label="Two clashing Memphis-style pattern bands — zigzags, polka dots, confetti and squiggles — sliding past each other in opposite directions.">
  <canvas id="mp10-c"></canvas>
</div>
<div class="cap">Pattern Clash</div>
<script>
(function(){
  "use strict";
  var cv=document.getElementById("mp10-c"),ctx=cv.getContext("2d");
  var reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  // Memphis palette around #D345A4 accent — read from theme tokens so light recolours the bands.
  var root=document.documentElement;
  var BG="#211A17";
  var PAL=["#D345A4","#ff4d80","#ffd23f","#C0B459","#ff8c42","#f4f0e6","#A18798"];
  function syncTheme(){
    var cs=getComputedStyle(root),i;
    for(i=0;i<PAL.length;i++)PAL[i]=cs.getPropertyValue("--mp10-p"+i).trim();
    BG=cs.getPropertyValue("--mp10-bg").trim();
  }
  addEventListener("message",function(e){ // live re-theme broadcast by the canvas
    var d=e.data;
    if(d&&d.type==="forever:theme"&&(d.theme==="light"||d.theme==="dark")){root.setAttribute("data-theme",d.theme);syncTheme();if(reduce)drawOneFrame();}
  });

  var W=0,H=0,DPR=1,band=0,running=false,raf=0,t0=0;
  // motif kinds: 0 dot, 1 zig, 2 squiggle, 3 confetti-triangle, 4 ring
  var KIND=[0,1,2,3,4];

  function resize(){
    DPR=Math.min(2,window.devicePixelRatio||1);
    W=cv.clientWidth;H=cv.clientHeight;
    cv.width=Math.max(1,Math.round(W*DPR));
    cv.height=Math.max(1,Math.round(H*DPR));
    ctx.setTransform(DPR,0,0,DPR,0,0);
    band=H/3;
  }

  // Draw one motif at local origin, size s, color col, rotation rot.
  function motif(kind,s,col,rot){
    ctx.save();ctx.rotate(rot);
    ctx.fillStyle=col;ctx.strokeStyle=col;
    ctx.lineWidth=s*0.18;ctx.lineCap="round";ctx.lineJoin="round";
    if(kind===0){ // dot
      ctx.beginPath();ctx.arc(0,0,s*0.5,0,6.2832);ctx.fill();
    }else if(kind===1){ // zigzag stroke
      ctx.beginPath();
      ctx.moveTo(-s*0.7,-s*0.4);ctx.lineTo(-s*0.23,s*0.4);
      ctx.lineTo(s*0.23,-s*0.4);ctx.lineTo(s*0.7,s*0.4);
      ctx.stroke();
    }else if(kind===2){ // squiggle
      ctx.beginPath();
      ctx.moveTo(-s*0.7,0);
      ctx.bezierCurveTo(-s*0.45,-s*0.7,-s*0.15,s*0.7,0,0);
      ctx.bezierCurveTo(s*0.15,-s*0.7,s*0.45,s*0.7,s*0.7,0);
      ctx.stroke();
    }else if(kind===3){ // confetti triangle
      ctx.beginPath();
      ctx.moveTo(0,-s*0.55);ctx.lineTo(s*0.5,s*0.45);ctx.lineTo(-s*0.5,s*0.45);
      ctx.closePath();ctx.fill();
    }else{ // ring
      ctx.beginPath();ctx.arc(0,0,s*0.42,0,6.2832);ctx.stroke();
    }
    ctx.restore();
  }

  // A band: tiled motif grid scrolling horizontally.
  // bandIdx 0 top,1 mid,2 bottom. dir +/-1. each band a distinct motif set.
  function drawBand(y,h,off,kindA,kindB,baseCol,altCol,cell,jitterSeed){
    ctx.save();
    ctx.beginPath();ctx.rect(0,y,W,h);ctx.clip();
    var cols=Math.ceil(W/cell)+2;
    var rows=Math.ceil(h/cell)+1;
    var s=cell*0.62;
    var cy=y+cell*0.5;
    for(var r=0;r<rows;r++){
      var rowY=cy+r*cell;
      // staggered row offset for organic Memphis feel
      var stag=(r&1)?cell*0.5:0;
      for(var i=-1;i<cols;i++){
        var x=i*cell+stag-((off%cell)+cell)%cell+cell;
        var id=(r*31+i*17+jitterSeed)>>>0;
        var kind=((id%5)<3)?kindA:kindB;
        var col=((id&3)===0)?altCol:(((id>>2)&1)?baseCol:PAL[(id>>3)%PAL.length]);
        var rot=((id%7)-3)*0.32;
        ctx.save();
        ctx.translate(x,rowY+((id&8)?-cell*0.06:cell*0.06));
        motif(kind,s*(0.78+((id%5)*0.06)),col,rot);
        ctx.restore();
      }
    }
    ctx.restore();
  }

  // Static glow seam between bands — drawn once per frame as a flat gradient
  // already-baked-into-bg style. We pre-render seams as solid bars (no per-frame filter).
  function drawSeams(){
    // thin accent rule lines where bands meet (static, crisp)
    ctx.save();
    ctx.fillStyle=BG;
    // top seam
    ctx.fillRect(0,band-2.5,W,5);
    ctx.fillRect(0,band*2-2.5,W,5);
    ctx.fillStyle=PAL[0];
    ctx.fillRect(0,band-1.2,W,2.4);
    ctx.fillStyle=PAL[1];
    ctx.fillRect(0,band*2-1.2,W,2.4);
    ctx.restore();
  }

  function frame(now){
    if(!running)return;
    if(!t0)t0=now;
    var e=(now-t0)/1000;
    // opposite-direction scroll speeds; bottom slowest for parallax clash
    var oTop=e*78;
    var oMid=-e*54;
    var oBot=e*36;

    ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);

    var cell=Math.max(30,Math.min(64,W/6.2));
    // Band 1: magenta dots + zigzags
    drawBand(0,band,oTop,0,1,PAL[0],PAL[2],cell,2);
    // Band 2 (clash core): pink squiggles + confetti, opposite dir, tighter cell
    drawBand(band,band,oMid,2,3,PAL[1],PAL[3],cell*0.86,57);
    // Band 3: gold rings + dots
    drawBand(band*2,H-band*2,oBot,4,0,PAL[3],PAL[4],cell,113);

    drawSeams();
    raf=requestAnimationFrame(frame);
  }

  function drawOneFrame(){
    ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
    var cell=Math.max(30,Math.min(64,W/6.2));
    drawBand(0,band,W*0.18,0,1,PAL[0],PAL[2],cell,2);
    drawBand(band,band,-W*0.22,2,3,PAL[1],PAL[3],cell*0.86,57);
    drawBand(band*2,H-band*2,W*0.1,4,0,PAL[3],PAL[4],cell,113);
    drawSeams();
  }

  function start(){
    if(running)return;
    running=true;t0=0;raf=requestAnimationFrame(frame);
  }
  function stop(){
    running=false;if(raf)cancelAnimationFrame(raf);raf=0;
  }

  syncTheme();
  resize();
  window.addEventListener("resize",function(){
    resize();
    if(reduce)drawOneFrame();
  });

  if(reduce){drawOneFrame();return;}

  document.addEventListener("visibilitychange",function(){
    if(document.hidden)stop();else start();
  });

  start();
})();
</script>
</body>
</html>
