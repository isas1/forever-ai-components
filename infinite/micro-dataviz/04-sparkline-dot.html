<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="A green sparkline traces itself across a faint full path, led by a haloed white moving dot, then regenerates a new random series.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sparkline Moving Dot</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract);
     the light re-theme is the [data-theme="light"] block. --c04-line/-base/-dot/-blur feed the canvas. */
  :root{
    --c04-bg:#0c1512; --c04-cap:#3ee08f; --c04-cap-o:.4;
    --c04-line:#3ee08f; --c04-base:#ffffff10; --c04-dot:#ffffff; --c04-blur:7;
  }
  :root[data-theme="light"]{
    --c04-bg:#eef6f1; --c04-cap:#15804a; --c04-cap-o:.62;
    --c04-line:#15804a; --c04-base:#0c15121a; --c04-dot:#0f2a1f; --c04-blur:4;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--c04-bg);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  canvas{display:block;width:100%;height:100%}
  .cap{position:fixed;right:8px;bottom:6px;font-size:10px;letter-spacing:.08em;
    color:var(--c04-cap);opacity:var(--c04-cap-o);text-transform:uppercase}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/micro-dataviz/04-sparkline-dot.html",
 "title": "Sparkline Moving Dot",
 "description": "A green sparkline traces itself across a faint ghost path, led by a haloed white dot; on completion it regenerates a new random 28-point series.",
 "useWhen": "Dashboard widgets, metric cards, ambient data displays needing lightweight motion without real data.",
 "avoidWhen": "Contexts requiring real data binding — series is randomly generated; also avoid when motion competes with dense UI.",
 "agentPrompt": "Change accent color from #3ee08f to #38bdf8, increase point count from N=28 to N=40, and slow the trace cycle from 4200ms to 6000ms. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "accent color (COL='#3ee08f')",
  "point count (N=28)",
  "trace cycle duration (dt/4200)",
  "vertical padding range (top H*0.22, bot H*0.78)",
  "dot radius (arc r=4) and halo radius (arc r=7)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "IIFE wrapper",
  "prefers-reduced-motion guard (reduce flag)",
  "visibilitychange pause pattern",
  "DPR-aware canvas sizing",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Data is randomly generated — no API or real data binding",
  "Background color is hardcoded in CSS (#0c1512); must edit to change theme"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "sparkline",
  "data-viz",
  "canvas",
  "line-chart",
  "ambient",
  "generative",
  "loop"
 ]
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap">sparkline</div>
<script>
(function(){
  const cv=document.getElementById('c'),ctx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const root=document.documentElement;
  let W,H,DPR; let COL='#3ee08f';
  const C={base:'',dot:'',blur:7};
  const N=28; let pts=[];
  function syncTheme(){            // every colour the canvas draws with comes from the tokens
    const cs=getComputedStyle(root);
    COL=cs.getPropertyValue('--c04-line').trim();   // ghost line (COL+'2a') and glow rebuild from COL
    C.base=cs.getPropertyValue('--c04-base').trim();
    C.dot=cs.getPropertyValue('--c04-dot').trim();
    C.blur=parseFloat(cs.getPropertyValue('--c04-blur'))||0;
  }
  addEventListener('message',function(e){
    const d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
      root.setAttribute('data-theme',d.theme);syncTheme();
    }
  });
  function gen(){pts=[];let v=0.5;for(let i=0;i<N;i++){v+=(Math.random()-0.5)*0.35;v=Math.max(0.1,Math.min(0.9,v));pts.push(v);}}
  function resize(){DPR=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;
    cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
  let last=0,prog=0;
  function draw(t){
    if(document.hidden){last=t;return raf()}
    const dt=Math.min(64,t-last);last=t;
    if(!reduce)prog+=dt/4200; else prog=0.999;
    if(prog>=1){prog=0;gen();}
    ctx.clearRect(0,0,W,H);
    const padL=W*0.08,padR=W*0.08,top=H*0.22,bot=H*0.78;
    const px=i=>padL+(W-padL-padR)*i/(N-1);
    const py=v=>bot-(bot-top)*v;
    // baseline
    ctx.strokeStyle=C.base;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(padL,(top+bot)/2);ctx.lineTo(W-padR,(top+bot)/2);ctx.stroke();
    // full faint line
    ctx.beginPath();for(let i=0;i<N;i++){const x=px(i),y=py(pts[i]);i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
    ctx.strokeStyle=COL+'2a';ctx.lineWidth=1.5;ctx.stroke();
    // animated traced portion
    const fp=prog*(N-1), idx=Math.floor(fp), fr=fp-idx;
    ctx.beginPath();ctx.moveTo(px(0),py(pts[0]));
    for(let i=1;i<=idx;i++)ctx.lineTo(px(i),py(pts[i]));
    let dx,dy;
    if(idx<N-1){dx=px(idx)+(px(idx+1)-px(idx))*fr;dy=py(pts[idx])+(py(pts[idx+1])-py(pts[idx]))*fr;ctx.lineTo(dx,dy);}
    else{dx=px(N-1);dy=py(pts[N-1]);}
    ctx.strokeStyle=COL;ctx.lineWidth=2.4;ctx.shadowColor=COL;ctx.shadowBlur=C.blur;ctx.stroke();ctx.shadowBlur=0;
    // moving dot
    ctx.fillStyle=C.dot;ctx.beginPath();ctx.arc(dx,dy,4,0,7);ctx.fill();
    ctx.strokeStyle=COL;ctx.lineWidth=2;ctx.beginPath();ctx.arc(dx,dy,7,0,7);ctx.stroke();
    raf();
  }
  function raf(){requestAnimationFrame(draw)}
  addEventListener('resize',resize);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)last=performance.now()});
  cv.addEventListener('pointerdown',()=>{prog=0;gen();});
  syncTheme();resize();gen();raf();
})();
</script>
</body>
</html>
