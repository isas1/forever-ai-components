<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Scrolling green/red candlestick stock chart with wicks, gridlines and a dashed last-price line plus live price label.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Candlestick Ticker</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract);
     the light re-theme is the [data-theme="light"] block. --c10-up/-dn/-grid/-ink feed the canvas. */
  :root{
    --c10-bg:#0a0f0d; --c10-cap:#9aa7a0; --c10-cap-o:.45;
    --c10-up:#2fd47a; --c10-dn:#ff5a6e; --c10-grid:#ffffff0d; --c10-ink:#ffffff;
  }
  :root[data-theme="light"]{
    --c10-bg:#eef4f0; --c10-cap:#64726b; --c10-cap-o:.8;
    --c10-up:#1a7e47; --c10-dn:#d1102a; --c10-grid:#0a0f0d16; --c10-ink:#101a15;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--c10-bg);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  canvas{display:block;width:100%;height:100%}
  .cap{position:fixed;right:8px;bottom:6px;font-size:10px;letter-spacing:.08em;
    color:var(--c10-cap);opacity:var(--c10-cap-o);text-transform:uppercase}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/micro-dataviz/10-candlestick-ticker.html",
 "title": "Candlestick Ticker",
 "description": "22 green/red candlesticks scroll left continuously, generating random OHLC data; a dashed last-price line with live label updates in real time.",
 "useWhen": "Finance dashboards, trading UI mockups, ambient data-viz backgrounds for fintech products.",
 "avoidWhen": "Contexts needing real data — all prices are procedurally generated. Not suitable where motion competes with dense text content.",
 "agentPrompt": "Change UP color to '#00cfff' and DN color to '#ff9500', increase candle count to 30 (N=30), and slow scroll speed by changing 1100 to 1800. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "candle count (N=22)",
  "scroll speed (acc/1100 threshold)",
  "up/down colors (UP, DN constants)",
  "price volatility (random spread *7)",
  "canvas padding (padL/padR as W fraction)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "DPR-aware canvas resize",
  "visibilitychange pause guard",
  "prefers-reduced-motion freeze (shift=0 branch)",
  "IIFE wrapper",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Price scale is normalized 0–100 internally — not real market data",
  "Pointerdown resets chart entirely (init()) which may surprise users expecting click-to-pause",
  "Background color hardcoded to #0a0f0d in CSS"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "candlestick",
  "stock",
  "chart",
  "finance",
  "scrolling",
  "canvas",
  "data-viz"
 ]
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap">candles</div>
<script>
(function(){
  const cv=document.getElementById('c'),ctx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const root=document.documentElement;
  let W,H,DPR; let UP='#2fd47a',DN='#ff5a6e';
  const C={grid:'',ink:''};
  const N=22; let candles=[], price=50;
  function syncTheme(){            // every colour the canvas draws with comes from the tokens
    const cs=getComputedStyle(root);
    UP=cs.getPropertyValue('--c10-up').trim();   // candle + dashed last-price colours derive from these
    DN=cs.getPropertyValue('--c10-dn').trim();
    C.grid=cs.getPropertyValue('--c10-grid').trim();
    C.ink=cs.getPropertyValue('--c10-ink').trim();
  }
  addEventListener('message',function(e){
    const d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
      root.setAttribute('data-theme',d.theme);syncTheme();
    }
  });
  function mk(){
    const o=price; let c=o+(Math.random()-0.48)*7; c=Math.max(8,Math.min(92,c));
    const hi=Math.max(o,c)+Math.random()*4, lo=Math.min(o,c)-Math.random()*4;
    price=c; return {o,c,hi:Math.min(99,hi),lo:Math.max(1,lo)};
  }
  function init(){candles=[];price=50;for(let i=0;i<N+1;i++)candles.push(mk());}
  function resize(){DPR=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;
    cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
  let last=0,acc=0,shift=0;
  function draw(t){
    if(document.hidden){last=t;return raf()}
    const dt=Math.min(64,t-last);last=t;
    if(!reduce){acc+=dt;shift=acc/1100;
      if(shift>=1){acc-=1100;shift=0;candles.shift();candles.push(mk());}}
    else shift=0;
    ctx.clearRect(0,0,W,H);
    const padL=W*0.05,padR=W*0.05,top=H*0.14,bot=H*0.86;
    const slot=(W-padL-padR)/N, cw=slot*0.56;
    // y maps 0..100 price
    const py=v=>bot-(bot-top)*(v/100);
    // grid
    ctx.strokeStyle=C.grid;ctx.lineWidth=1;
    for(let i=0;i<5;i++){const y=top+(bot-top)*i/4;ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();}
    ctx.save();
    ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
    for(let i=0;i<candles.length;i++){
      const k=candles[i];
      const x=padL+slot*(i-shift)+slot/2;
      if(x<padL-slot||x>W-padR+slot)continue;
      const up=k.c>=k.o, col=up?UP:DN;
      // wick
      ctx.strokeStyle=col;ctx.lineWidth=Math.max(1,cw*0.12);
      ctx.beginPath();ctx.moveTo(x,py(k.hi));ctx.lineTo(x,py(k.lo));ctx.stroke();
      // body
      const yo=py(k.o),yc=py(k.c);
      const by=Math.min(yo,yc), bh=Math.max(1.5,Math.abs(yc-yo));
      ctx.fillStyle=col;
      rr(x-cw/2,by,cw,bh,Math.min(2,cw/3));ctx.fill();
    }
    ctx.restore();
    // last price line + dot (rightmost full candle)
    const lastK=candles[candles.length-2];
    const ly=py(lastK.c);
    ctx.strokeStyle=(lastK.c>=lastK.o?UP:DN)+'aa';ctx.lineWidth=1;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(padL,ly);ctx.lineTo(W-padR,ly);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=C.ink;ctx.textAlign='right';ctx.textBaseline='bottom';
    ctx.font='700 '+(H*0.1)+'px ui-monospace,monospace';
    ctx.fillText(lastK.c.toFixed(2),W-padR,ly-3);
    raf();
  }
  function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  function raf(){requestAnimationFrame(draw)}
  addEventListener('resize',resize);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)last=performance.now()});
  cv.addEventListener('pointerdown',init);
  syncTheme();resize();init();raf();
})();
</script>
</body>
</html>
