<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Five plum-toned stacked streamgraph ribbons drifting inside-out with smooth bezier flow and a glowing right-edge data-entry seam.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Streamgraph Drift</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract);
     the light re-theme is the [data-theme="light"] block. The canvas paints its own
     backdrop, so --c11-bg0/-bg1 (vignette), --c11-h0..h4 (ribbons), --c11-contour and
     the seam colours are all re-read on a theme switch. */
  :root{
    --c11-bg0:#1E1A1C; --c11-bg1:#140f11; --c11-cap:#925D78; --c11-cap-o:.36;
    --c11-h0:#5C3A4B; --c11-h1:#999086; --c11-h2:#925D78; --c11-h3:#5E7A78; --c11-h4:#D9C2CE;
    --c11-contour:#f0e0e8; --c11-seam0:rgba(146,93,120,0); --c11-seam1:rgba(146,93,120,0.16);
    --c11-edge:rgba(217,194,206,0.6);
  }
  :root[data-theme="light"]{
    --c11-bg0:#f7f1f4; --c11-bg1:#ece0e7; --c11-cap:#925D78; --c11-cap-o:.75;
    --c11-h0:#d9c3cf; --c11-h1:#6b625a; --c11-h2:#a86e8b; --c11-h3:#5f7f7c; --c11-h4:#6d4457;
    --c11-contour:#7a4c63; --c11-seam0:rgba(122,76,99,0); --c11-seam1:rgba(122,76,99,0.18);
    --c11-edge:rgba(122,76,99,0.55);
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--c11-bg0);}
  #sgd-c{display:block;width:100%;height:100%;}
  .sgd-cap{position:fixed;left:9px;bottom:8px;font:600 10px/1.2 ui-monospace,"SFMono-Regular",Menlo,monospace;
       letter-spacing:.14em;color:var(--c11-cap);opacity:var(--c11-cap-o);text-transform:uppercase;
       pointer-events:none;user-select:none;}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/micro-dataviz/11-streamgraph-drift.html",
 "title": "Streamgraph Drift",
 "description": "Five stacked blue ribbons flow as a streamgraph using bezier curves and layered sines; ribbons swell organically with a glowing right-edge data-entry seam.",
 "useWhen": "Dashboard hero sections, analytics loading screens, ambient data-flow backgrounds on dark UIs.",
 "avoidWhen": "Light backgrounds (dark navy hardcoded). Contexts where actual data values need to be read — this is decorative only.",
 "agentPrompt": "Change the color palette from blue to warm amber/gold by replacing the hues array with ['#8f4a1a','#d06a20','#ff8c38','#ffb870','#ffddb0'] and set background to #1a1008. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "ribbon count (N=5)",
  "color palette (hues array)",
  "column buffer length (COLS=120)",
  "vertical scale (vscale=H*0.30)",
  "amplitude range (amp: 0.55+random*0.5)",
  "pointer boost strength (boost+=0.25)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "IIFE wrapper",

  "visibilitychange pause/resume",
  "DPR-aware canvas sizing",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)",
  "First deliberate input freezes procedural chart drift after its input paint; hover alone keeps idle demonstration running.",
  "demo-v1 preview lifecycle: initialize demoEnabled from window.__foreverPreview and stop attract work on the window forever:interactive event; retain manual feedback, settling, cleanup and explicit sessions",

 ],
 "knownLimitations": [
  "Background color hardcoded in CSS (#0e1424) — must edit to change theme",
  "Streamgraph shows synthetic noise data only, not real data series",
  "Pointer boost decays quickly; sustained motion needed for lasting effect",
  "State remains local to each mounted instance; format/theme remount preserves takeover, not component values."
 ],
 "tier": "curated",
 "labels": [
  "accessible",

 ],
 "tags": [

 ]

</script>
<meta name="forever-preview-lifecycle" content="demo-v1">
</head>
<body>
<canvas id="sgd-c" class="sgd-canvas"></canvas>
<div class="sgd-cap">Streamgraph Drift</div>
<script>
(function(){
  const cv=document.getElementById('sgd-c'),ctx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const preview=window.__foreverPreview;
  let demoEnabled=preview?preview.demoEnabled!==false:true;
  function shouldFrame(){return demoEnabled;}
  function takeOver(){demoEnabled=false;cancelAnimationFrame(raf);raf=0;if(!document.hidden&&!reduce)raf=requestAnimationFrame(frame);else if(reduce)frame();}
  window.addEventListener('forever:interactive',takeOver);
  document.addEventListener('pointerdown',takeOver,{capture:true});
  document.addEventListener('click',takeOver,{capture:true});
  document.addEventListener('keydown',e=>{if(e.key!=='Tab'&&e.key!=='Escape'&&!/^(Shift|Control|Alt|Meta)$/.test(e.key)&&!e.metaKey&&!e.ctrlKey&&!e.altKey)takeOver();},{capture:true});
  let W,H,DPR;
  function size(){
    DPR=Math.min(devicePixelRatio||1,2);
    W=cv.clientWidth;H=cv.clientHeight;
    cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  addEventListener('resize',size);size();

  // Five series, each a column buffer of values that drift over time.
  const root=document.documentElement;
  const N=5, COLS=120;
  let hues=['#5C3A4B','#999086','#925D78','#5E7A78','#D9C2CE'];
  const C={bg0:'',bg1:'',contour:'',seam0:'',seam1:'',edge:''};
  const DARK=['#5C3A4B','#999086','#925D78','#5E7A78','#D9C2CE','#1E1A1C','#140f11','#f0e0e8','rgba(146,93,120,0)','rgba(146,93,120,0.16)','rgba(217,194,206,0.6)'];
  const LIGHT=['#d9c3cf','#6b625a','#a86e8b','#5f7f7c','#6d4457','#f7f1f4','#ece0e7','#7a4c63','rgba(122,76,99,0)','rgba(122,76,99,0.18)','rgba(122,76,99,0.55)'];
  let paletteReady=false;
  function tokDef(n){var m=document.querySelector('style').textContent.match(new RegExp(n+'\\s*:\\s*([^;}]+)'));return m?m[1].trim():'';}  // dark :root default, for engines that read '' from a fresh frame
  function syncTheme(){            // every colour the canvas draws with comes from the tokens
    const cs=getComputedStyle(root);
    const keys=['bg0','bg1','contour','seam0','seam1','edge'];
    let values=[...hues.map((_,i)=>cs.getPropertyValue('--c11-h'+i).trim()||tokDef('--c11-h'+i)),...keys.map(k=>cs.getPropertyValue('--c11-'+k).trim()||tokDef('--c11-'+k))];
    paletteReady=values.every(Boolean);
    if(!paletteReady)values=root.getAttribute('data-theme')==='light'?LIGHT:DARK;
    hues=values.slice(0,N);keys.forEach((k,i)=>C[k]=values[N+i]);
  }                                // backdrop + seam gradients are rebuilt from C every frame
  addEventListener('message',function(e){
    const d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
      root.setAttribute('data-theme',d.theme);syncTheme();
      if(reduce)frame();           // reduced motion draws one static frame — repaint it
    }
  });
  syncTheme();
  const series=[];
  for(let s=0;s<N;s++){
    const col=[]; for(let i=0;i<COLS;i++) col.push(0.4+0.3*Math.random());
    series.push({col, phase:Math.random()*6.28, freq:0.5+Math.random()*1.1,
                 drift:Math.random()*6.28, amp:0.55+Math.random()*0.5});
  }
  let t=0, boost=0;
  cv.addEventListener('pointermove',e=>{boost=Math.min(boost+0.25,1.4);});
  cv.addEventListener('click',()=>{boost=1.6;});

  function pushColumn(){
    // generate next value per series from layered sines -> organic swell
    for(let s=0;s<N;s++){
      const S=series[s];
      const v=S.amp*(0.55
        +0.42*Math.sin(t*0.013*S.freq+S.phase)
        +0.22*Math.sin(t*0.031*S.freq+S.drift)
        +0.12*Math.sin(t*0.071+s*1.3));
      S.col.push(Math.max(0.06,v));
      if(S.col.length>COLS) S.col.shift();
    }
  }

  // wiggle-minimized baseline (Byron/Wattenberg g0): weights earlier-stacked layers.
  function baseline(vals){
    let sum=0; for(let s=0;s<N;s++) sum+=vals[s];
    let wsum=0; for(let s=0;s<N;s++) wsum+=(N-s)*vals[s];
    return -wsum/(N+1) - sum/2; // centering offset for inside-out look
  }

  function frame(){
    if(!paletteReady)syncTheme();
    if(!reduce){ t+=1+boost*2; boost*=0.95; pushColumn(); pushColumn(); }
    ctx.clearRect(0,0,W,H);
    // subtle vertical vignette backdrop
    const bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,C.bg0);bg.addColorStop(1,C.bg1);
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

    const cy=H*0.5, vscale=H*0.30;
    // precompute stacked layer boundaries per column
    const xs=COLS;
    // upper[s] and lower[s] arrays of y per column
    const lo=[],up=[];
    for(let s=0;s<N;s++){lo.push(new Float32Array(xs));up.push(new Float32Array(xs));}
    let total=0,cnt=0;
    for(let i=0;i<xs;i++){
      const vals=[]; let colSum=0;
      for(let s=0;s<N;s++){const v=series[s].col[i]||0.1; vals.push(v); colSum+=v;}
      total+=colSum;cnt++;
      let y=cy + baseline(vals)*vscale*0.5;
      for(let s=0;s<N;s++){
        const h=vals[s]*vscale;
        lo[s][i]=y; up[s][i]=y+h; y+=h;
      }
    }
    const avg=total/Math.max(cnt,1);
    const xAt=i=>(i/(xs-1))*W;

    // draw each band as a smooth filled ribbon, newest data at right
    for(let s=0;s<N;s++){
      ctx.beginPath();
      ctx.moveTo(xAt(0),lo[s][0]);
      for(let i=1;i<xs;i++){const x0=xAt(i-1),x1=xAt(i);ctx.bezierCurveTo((x0+x1)/2,lo[s][i-1],(x0+x1)/2,lo[s][i],x1,lo[s][i]);}
      for(let i=xs-1;i>0;i--){const x0=xAt(i),x1=xAt(i-1);ctx.bezierCurveTo((x0+x1)/2,up[s][i],(x0+x1)/2,up[s][i-1],x1,up[s][i-1]);}
      ctx.closePath();
      // shade by current thickness rank: thicker = brighter accent
      const cur=series[s].col[xs-1]||0.1;
      const lum=Math.min(1,cur/(avg*1.8+0.001));
      const g=ctx.createLinearGradient(0,0,W,0);
      g.addColorStop(0,hues[s]); g.addColorStop(1,hues[s]);
      ctx.fillStyle=hues[s];
      ctx.globalAlpha=0.62+0.30*lum;
      ctx.fill();
      // top contour highlight
      ctx.globalAlpha=0.20+0.4*lum;
      ctx.lineWidth=1; ctx.strokeStyle=C.contour;
      ctx.beginPath();ctx.moveTo(xAt(0),lo[s][0]);
      for(let i=1;i<xs;i++){const x0=xAt(i-1),x1=xAt(i);ctx.bezierCurveTo((x0+x1)/2,lo[s][i-1],(x0+x1)/2,lo[s][i],x1,lo[s][i]);}
      ctx.stroke();
    }
    ctx.globalAlpha=1;

    // right-edge data-entry seam (where new columns arrive)
    const seam=ctx.createLinearGradient(W-40,0,W,0);
    seam.addColorStop(0,C.seam0);seam.addColorStop(1,C.seam1);
    ctx.fillStyle=seam;ctx.fillRect(W-40,0,40,H);
    ctx.fillStyle=C.edge;ctx.fillRect(W-1.2,0,1.2,H);

    if(!reduce&&shouldFrame())raf=requestAnimationFrame(frame);else raf=0;
  }
  let raf=0;
  function start(){if(!raf&&!reduce&&shouldFrame())raf=requestAnimationFrame(frame);}
  function stop(){cancelAnimationFrame(raf);raf=0;}
  document.addEventListener('visibilitychange',()=>{document.hidden?stop():start();});
  if(reduce){for(let k=0;k<200;k++){t+=2;pushColumn();}frame();}else if(demoEnabled)start();else frame();
})();
</script>
</body>
</html>
