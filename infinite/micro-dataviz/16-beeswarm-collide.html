<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Coral dots drop onto a value axis and collide-relax into a bimodal beeswarm silhouette, new points falling in continuously.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beeswarm Collide</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults; --bsw-rgb/-halo feed JS rgba() alphas and
     --bsw-fs/-fl (fresh dot) + --bsw-ss/-sl (settled dot) feed the hsl() ramps */
  :root{
    --bsw-bg:#1c1018; --bsw-accent:#ff6f7d; --bsw-rgb:255,111,125; --bsw-halo:255,200,205;
    --bsw-fs:100; --bsw-fl:72; --bsw-ss:85; --bsw-sl:66; --bsw-am:1; --bsw-cap-o:.34;
  }
  :root[data-theme="light"]{
    --bsw-bg:#f7f0f3; --bsw-accent:#db0015; --bsw-rgb:219,0,21; --bsw-halo:110,20,40;
    --bsw-fs:78; --bsw-fl:47; --bsw-ss:66; --bsw-sl:41; --bsw-am:1.5; --bsw-cap-o:.6;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bsw-bg);}
  #bsw-c{display:block;width:100%;height:100%;}
  .bsw-cap{position:fixed;left:9px;bottom:8px;font:600 10px/1.2 ui-monospace,Menlo,Consolas,monospace;
       letter-spacing:.14em;color:var(--bsw-accent);opacity:var(--bsw-cap-o);text-transform:uppercase;
       pointer-events:none;user-select:none;}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/micro-dataviz/16-beeswarm-collide.html",
 "title": "Beeswarm Collide",
 "description": "Coral dots drop onto a value axis and collide-relax into a bimodal beeswarm silhouette; new points spawn continuously and pointer adds dots at cursor position.",
 "useWhen": "Data visualization demos, distribution illustrations, ambient generative backgrounds with a stats/analytics theme.",
 "avoidWhen": "Contexts requiring actual labeled data or interactive tooltips — values are synthetic and dots carry no readable metadata.",
 "agentPrompt": "Change dot color to teal (#00c9b1) by setting AC='#00c9b1' and updating the hsl fill strings, increase MAX to 180, and slow spawning by changing acc+=0.016 to acc+=0.010. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "dot count cap (MAX=120)",
  "accent color (AC='#ff6f7d')",
  "dot radius scale (W,H / 110)",
  "bimodal hump centers and spreads in sampleVal()",
  "spawn rate (acc+=0.016)",
  "collision gap multiplier (md=R*2.05)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "IIFE wrapper",
  "prefers-reduced-motion guard with static fallback draw",
  "visibilitychange stop/start",
  "DPR-aware canvas sizing",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "O(n^2) collision relax runs every frame — keep MAX under ~150 for smooth 60fps on low-end devices",
  "Background color hardcoded in BG constant and CSS — must change both to retheme",
  "Pointer adds unbounded dots each move event; fast swipes can flood the MAX cap quickly"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "beeswarm",
  "dataviz",
  "canvas",
  "collision",
  "particles",
  "bimodal",
  "ambient"
 ]
}
</script>
</head>
<body>
<canvas id="bsw-c"></canvas>
<div class="bsw-cap">Beeswarm Collide</div>
<script>
(function(){
  const cv=document.getElementById('bsw-c'),ctx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  // theme: every colour the canvas draws with is read from the tokens, once per switch
  const root=document.documentElement, C={};
  let ready=0;
  function syncTheme(){
    const cs=getComputedStyle(root);
    C.bg=cs.getPropertyValue('--bsw-bg').trim();
    C.rgb=cs.getPropertyValue('--bsw-rgb').trim();
    C.halo=cs.getPropertyValue('--bsw-halo').trim();
    C.fs=parseFloat(cs.getPropertyValue('--bsw-fs'));
    C.fl=parseFloat(cs.getPropertyValue('--bsw-fl'));
    C.ss=parseFloat(cs.getPropertyValue('--bsw-ss'));
    C.sl=parseFloat(cs.getPropertyValue('--bsw-sl'));
    C.am=parseFloat(cs.getPropertyValue('--bsw-am'));
    if(reduce&&ready)draw();                    // running loop repaints itself
  }
  addEventListener('message',e=>{
    const d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
      root.setAttribute('data-theme',d.theme);syncTheme();
    }
  });
  syncTheme();
  let W,H,DPR,axisY,padX,scale,R;
  function size(){
    DPR=Math.min(devicePixelRatio||1,2);
    W=cv.clientWidth;H=cv.clientHeight;
    cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
    axisY=H*0.62;padX=W*0.1;
    R=Math.max(2.2,Math.min(W,H)/110);     // dot radius scales w/ tile
    scale=W-padX*2;
  }
  addEventListener('resize',()=>{size();layoutAll();});
  // value generator: bimodal distribution (two humps) -> distinctive silhouette
  function sampleVal(){
    const g=()=>{let s=0;for(let i=0;i<4;i++)s+=Math.random();return s/4;};
    return Math.random()<0.55 ? 0.34+(g()-0.5)*0.34 : 0.72+(g()-0.5)*0.30;
  }
  const MAX=120,dots=[];
  function spawn(){
    const v=Math.min(0.98,Math.max(0.02,sampleVal()));
    dots.push({v,x:padX+v*scale,tx:padX+v*scale,y:-R*4,ty:axisY,vy:0,age:0});
    if(dots.length>MAX)dots.shift();
  }
  // collision relax: push apart along value axis (x), settle on baseline rows above axis
  // `iters` defaults high for one-shot settling (init/resize); the per-frame loop
  // passes 1 since the swarm is already near-settled — avoids O(n^2)*3 every frame.
  function relax(iters){
    iters=iters||1;
    for(let it=0;it<iters;it++){
      for(let i=0;i<dots.length;i++){
        const a=dots[i];
        for(let j=i+1;j<dots.length;j++){
          const b=dots[j];
          let dx=b.tx-a.tx,dy=b.ty-a.ty;
          const d2=dx*dx+dy*dy,md=R*2.05;
          if(d2<md*md&&d2>0.0001){
            const d=Math.sqrt(d2),ov=(md-d)/d*0.5;
            dx*=ov;dy*=ov;
            a.tx-=dx;a.ty-=dy;b.tx+=dx;b.ty+=dy;
          }
        }
      }
      for(const a of dots){                       // anchor: x toward value, y to baseline
        a.tx+=(padX+a.v*scale-a.tx)*0.10;
        a.tx=Math.max(padX*0.5,Math.min(W-padX*0.5,a.tx));
        if(a.ty>axisY)a.ty=axisY;                 // stack upward from axis
      }
    }
  }
  function layoutAll(){for(const d of dots){d.x=d.tx;d.y=d.ty;}relax(3);}
  // seed a resting swarm — AFTER size(): axisY/padX/scale only exist once the canvas is fitted.
  // Seeding first left every seeded dot at NaN, so the wall showed a bare axis and only the
  // slow trickle of new drops ever appeared (audit: two dots at 3s). Jitter the rows so the
  // relax pass can stack the seeds into a real swarm instead of one flat line.
  size();
  for(let i=0;i<MAX;i++){const v=Math.min(0.98,Math.max(0.02,sampleVal()));const tx=padX+v*scale,ty=axisY-Math.random()*R*7;dots.push({v,x:tx,tx,ty,y:ty,vy:0,age:30});}
  relax(8);layoutAll();

  let t=0,acc=0,hue=0;
  cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();const mv=(e.clientX-r.left-padX)/scale;dots.push({v:Math.min(0.98,Math.max(0.02,mv)),x:e.clientX-r.left,tx:e.clientX-r.left,y:-R*4,ty:axisY,vy:0,age:0});if(dots.length>MAX)dots.shift();});

  function draw(){
    ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
    // value axis + ticks
    ctx.strokeStyle='rgba('+C.rgb+','+(0.28*C.am)+')';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(padX*0.6,axisY+R+3);ctx.lineTo(W-padX*0.6,axisY+R+3);ctx.stroke();
    ctx.fillStyle='rgba('+C.rgb+','+(0.5*C.am)+')';
    for(let k=0;k<=4;k++){const x=padX+k/4*scale;ctx.fillRect(x-0.5,axisY+R+3,1,5);}
    relax();
    for(const d of dots){
      if(d.age<30){d.vy+=0.6;d.y+=d.vy;if(d.y>d.ty){d.y=d.ty;d.vy*=-0.28;}d.x+=(d.tx-d.x)*0.2;}
      else{d.x+=(d.tx-d.x)*0.22;d.y+=(d.ty-d.y)*0.22;}
      d.age++;
      const fresh=Math.max(0,1-d.age/26);
      const h=d.v*40;                              // subtle value->hue tilt around accent
      ctx.beginPath();ctx.arc(d.x,d.y,R+fresh*R*0.6,0,6.2832);
      ctx.fillStyle=fresh>0.02?`hsl(${352+h},${C.fs}%,${C.fl-d.v*8}%)`:`hsla(${352+h},${C.ss}%,${C.sl-d.v*10}%,0.92)`;
      ctx.fill();
      if(fresh>0.05){ctx.strokeStyle=`rgba(${C.halo},${fresh*0.7})`;ctx.lineWidth=1;ctx.stroke();}
    }
    if(!reduce){
      acc+=0.03;                                   // a fresh drop every ~0.55s keeps the swarm shuffling
      if(acc>=1){acc=0;spawn();}
      t++;
    }
    raf=reduce?0:requestAnimationFrame(draw);
  }
  let raf=0;
  function start(){if(!raf&&!reduce)raf=requestAnimationFrame(draw);}
  function stop(){cancelAnimationFrame(raf);raf=0;}
  document.addEventListener('visibilitychange',()=>{document.hidden?stop():start();});
  ready=1;
  if(reduce){for(let i=0;i<6;i++)relax();for(const d of dots){d.x=d.tx;d.y=d.ty;d.age=40;}draw();}
  else start();
})();
</script>
</body>
</html>
