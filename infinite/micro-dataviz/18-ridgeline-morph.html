<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Stacked rust-toned ridgeline of layered density curves continuously morphing between bimodal and unimodal peaks with glowing crests.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ridgeline Morph</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults; the rgb triples feed the JS rgba() alphas
     (--rm-fill ridge wash, --rm-crest top edge, --rm-peak mode markers) */
  :root{
    --rm-bg:#1C1B1A; --rm-accent:#AE6147; --rm-tick:rgba(174,97,71,0.07);
    --rm-fill:48,43,46; --rm-crest:174,97,71; --rm-peak:255,255,255; --rm-cap-o:.34;
  }
  :root[data-theme="light"]{
    --rm-bg:#f4f2f0; --rm-accent:#a35b43; --rm-tick:rgba(163,91,67,0.16);
    --rm-fill:214,196,184; --rm-crest:163,91,67; --rm-peak:60,32,22; --rm-cap-o:.6;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--rm-bg);}
  #rm-c{display:block;width:100%;height:100%;}
  .rm-cap{position:fixed;left:9px;bottom:8px;font:600 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;
       letter-spacing:.14em;color:var(--rm-accent);opacity:var(--rm-cap-o);text-transform:uppercase;
       pointer-events:none;user-select:none;}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/micro-dataviz/18-ridgeline-morph.html",
 "title": "Ridgeline Morph",
 "description": "14 stacked rust-toned density curves continuously morph between bimodal and unimodal distributions with glowing crests; pointer Y position amplifies nearby ridges.",
 "useWhen": "Data dashboard hero backgrounds, statistical visualization demos, ambient displays with an analytical aesthetic.",
 "avoidWhen": "Contexts needing real data — distributions are synthetic. Light backgrounds (hardcoded dark background).",
 "agentPrompt": "Change ROWS to 10, set accent color AC to '#80cbc4' (teal), and slow the morph cycle by changing t+=0.006 to t+=0.003. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "row count (ROWS=14)",
  "morph speed (t += 0.006)",
  "accent color (AC='#AE6147')",
  "ridge height multiplier (ridge=gap*3.1)",
  "sample resolution (SAMP=120)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "DPR-aware canvas sizing",
  "visibilitychange pause/resume",
  "prefers-reduced-motion guard (static single frame)",
  "IIFE wrapper",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Background color hardcoded in CSS and canvas fill — must change both to alter theme",
  "No reduced-motion animation fallback beyond a single static frame",
  "Pointer nudge decays but never fully resets until next pointer event"
 ],
 "tier": "curated",
 "labels": [
  "accessible",
  "mobile-ready",
  "copy-paste-safe",
  "minimal-deps",
  "agent-ready",
  "light-ready"
 ],
 "tags": [
  "ridgeline",
  "data-viz",
  "canvas",
  "gaussian",
  "morph",
  "density",
  "ambient"
 ]
}
</script>
</head>
<body>
<canvas id="rm-c"></canvas>
<div class="rm-cap">Ridgeline Morph</div>
<script>
(function(){
  const cv=document.getElementById('rm-c'),ctx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  // theme: every colour the canvas draws with is read from the tokens, once per switch
  const root=document.documentElement, C={};
  let ready=0;
  function syncTheme(){
    const cs=getComputedStyle(root);
    C.bg=cs.getPropertyValue('--rm-bg').trim();
    C.ac=cs.getPropertyValue('--rm-accent').trim();
    C.tick=cs.getPropertyValue('--rm-tick').trim();
    C.fill=cs.getPropertyValue('--rm-fill').trim();
    C.crest=cs.getPropertyValue('--rm-crest').trim();
    C.peak=cs.getPropertyValue('--rm-peak').trim();
    if(reduce&&ready)frame();                   // running loop repaints itself
  }
  addEventListener('message',e=>{
    const d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
      root.setAttribute('data-theme',d.theme);syncTheme();
    }
  });
  syncTheme();
  let W,H,DPR;
  function size(){
    DPR=Math.min(devicePixelRatio||1,2);
    W=cv.clientWidth;H=cv.clientHeight;
    cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  addEventListener('resize',size);size();

  const ROWS=14, SAMP=120;
  // each row migrates between a bimodal and a unimodal distribution on a slow loop
  const rows=[];
  for(let i=0;i<ROWS;i++){
    rows.push({
      ph:i*0.42,                       // phase offset along the morph cycle
      sp:0.9+ (i%3)*0.12,              // peak slide speed
      base:0.35+ (i*0.013),            // bimodal centre spread
      amp:0.55+0.4*Math.sin(i*0.7),    // base height
      sw:0.10+0.02*((i*7)%5)/5         // peak width
    });
  }
  function gauss(x,mu,s){const d=(x-mu)/s;return Math.exp(-0.5*d*d);}

  let t=0,nudge=0;
  cv.addEventListener('pointermove',e=>{
    const r=cv.getBoundingClientRect();
    nudge=1-Math.abs((e.clientY-r.top)/r.height-0.5)*1.6;
    if(nudge<0)nudge=0;
  });

  function frame(){
    t+=reduce?0:0.006;
    ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);

    const padX=W*0.10, padTop=H*0.12, padBot=H*0.10;
    const plotW=W-padX*2, plotH=H-padTop-padBot;
    const gap=plotH/(ROWS-1);
    const ridge=gap*3.1;                // vertical reach of a curve
    const n=nudge; nudge*=0.93;

    // faint baseline axis ticks
    ctx.strokeStyle=C.tick;ctx.lineWidth=1;
    for(let g=0;g<=4;g++){
      const gx=padX+plotW*g/4;
      ctx.beginPath();ctx.moveTo(gx,padTop);ctx.lineTo(gx,H-padBot);ctx.stroke();
    }

    // draw back-to-front so nearer ridges overlap farther ones
    for(let i=ROWS-1;i>=0;i--){
      const r=rows[i];
      const yb=padTop+gap*i;            // baseline of this ridge
      // morph 0..1: 1 = bimodal split, 0 = unimodal merged
      const m=0.5+0.5*Math.sin(t*1.0+r.ph);
      const slide=Math.sin(t*r.sp+i*0.5)*0.16;        // peaks drift along axis
      const spread=r.base*m;                          // separation of the two modes
      const mu1=0.5+slide-spread, mu2=0.5+slide+spread;
      const w1=r.sw*(1+0.6*(1-m)), w2=r.sw;
      const a2=m;                                     // 2nd mode fades as it merges
      const h=ridge*(r.amp+ n*0.5*(1-Math.abs(i/(ROWS-1)-0.5)*2));

      // build curve
      const pts=[];
      let peak=0;
      for(let s=0;s<=SAMP;s++){
        const x=s/SAMP;
        let d=gauss(x,mu1,w1)+a2*gauss(x,mu2,w2);
        if(d>peak)peak=d;
        pts.push(d);
      }
      const inv=peak>0?1/peak:1;
      ctx.beginPath();
      ctx.moveTo(padX,yb);
      for(let s=0;s<=SAMP;s++){
        const x=padX+plotW*s/SAMP;
        const y=yb-pts[s]*inv*h;
        ctx.lineTo(x,y);
      }
      ctx.lineTo(padX+plotW,yb);
      ctx.closePath();

      // fill: dark violet wash, depth-shaded so front rows read brighter
      const dep=i/(ROWS-1);
      const fl=0.40+0.30*(1-dep);
      ctx.fillStyle=`rgba(${C.fill},${fl})`;
      ctx.fill();

      // accent stroke along the top edge, brighter where density is high
      ctx.beginPath();
      for(let s=0;s<=SAMP;s++){
        const x=padX+plotW*s/SAMP;
        const y=yb-pts[s]*inv*h;
        if(s===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      }
      const lal=0.30+0.55*(1-dep);
      ctx.strokeStyle=`rgba(${C.crest},${lal})`;
      ctx.lineWidth=1.1;
      ctx.shadowColor=C.ac;ctx.shadowBlur=6*(1-dep)+1;
      ctx.stroke();
      ctx.shadowBlur=0;

      // small mode-peak markers (truth-per-pixel: mark the actual maxima)
      const peaks=m>0.18?[mu1,mu2]:[ (mu1+mu2)/2 ];
      ctx.fillStyle=`rgba(${C.peak},${0.5+0.4*(1-dep)})`;
      peaks.forEach(mp=>{
        let dd=gauss(mp,mu1,w1)+a2*gauss(mp,mu2,w2);
        const px=padX+plotW*mp, py=yb-dd*inv*h;
        ctx.beginPath();ctx.arc(px,py,1.3,0,Math.PI*2);ctx.fill();
      });
    }

    if(!reduce)raf=requestAnimationFrame(frame);
  }
  let raf=0;
  function start(){if(!raf&&!reduce)raf=requestAnimationFrame(frame);}
  function stop(){cancelAnimationFrame(raf);raf=0;}
  document.addEventListener('visibilitychange',()=>{document.hidden?stop():start();});
  ready=1;
  if(reduce){frame();}else start();
})();
</script>
</body>
</html>
