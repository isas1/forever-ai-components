<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Context Topology Gauge — Micro Data-Viz. A self-contained, zero-dependency animated web component.">
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Micro Data-Viz — Context Topology Gauge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --fc03-bg: #0A0A0A;
    --fc03-surface: #141414;
    --fc03-text: #EDEDEA;
    --fc03-text-muted: #8A8A85;
    --fc03-accent: #C7F000;
  }
  .fc03-gauge-wrap * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--fc03-bg);
    color: var(--fc03-text);
    font-family: 'Geist Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }
  .fc03-gauge-wrap {
    width: 100%;
    max-width: 380px;
    background: var(--fc03-surface);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    box-shadow: 0 20px 48px rgba(0, 0, 0, 0.8);
    cursor: pointer;
  }
  .fc03-title {
    font-size: 12px;
    color: var(--fc03-text-muted);
    letter-spacing: 0.06em;
  }
  .fc03-stage {
    width: 180px;
    height: 180px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  } .fc03-svg{
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  } .fc03-circle{
    fill: none;
    transition: stroke-dashoffset 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .fc03-center {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .fc03-tokens {
    font-size: 24px;
    font-weight: 700;
    color: var(--fc03-text);
    line-height: 1;
  }
  .fc03-percent {
    font-size: 12px;
    color: var(--fc03-accent);
    margin-top: 4px;
  }
  .fc03-tip {
    font-size: 12px;
    color: var(--fc03-text-muted);
  }
.fc03-caption{position:fixed;right:10px;bottom:7px;z-index:5;font-size:9px;opacity:.5;pointer-events:none}
@container fit-21-context-memory-topology-gauge (max-width:300px){.fc03-gauge-wrap{width:calc(100% - 16px);padding:14px;gap:8px}.fc03-stage{width:112px;height:112px}.fc03-tokens{font-size:19px}.fc03-title,.fc03-tip{font-size:12px}}
@container fit-21-context-memory-topology-gauge (max-width:210px){.fc03-gauge-wrap{padding:10px;gap:5px}.fc03-title,.fc03-tip{display:none}.fc03-stage{width:100px;height:100px}}
body{width:100%;container-type:inline-size;container-name:fit-21-context-memory-topology-gauge}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/micro-dataviz/21-context-memory-topology-gauge.html",
 "title": "Context Topology Gauge",
 "description": "Context Topology Gauge control in the Forever system.",
 "useWhen": "",
 "avoidWhen": "",
 "agentPrompt": "",
 "editableAreas": [],
 "preserveElements": [
  "First control stops idle chart cycle; user-triggered gauge state remains.",
  "demo-v1 preview lifecycle: initialize demoEnabled from window.__foreverPreview and stop attract work on the window forever:interactive event; retain manual feedback, settling, cleanup and explicit sessions"
 ],
 "knownLimitations": [
  "State remains local to each mounted instance; format/theme remount preserves takeover, not component values."
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "accessible",
  "copy-paste-safe",
  "minimal-deps"
 ],
 "tags": [
  "system",
  "ai",
  "vector-field",
  "telemetry",
  "circuit-breaker",
  "dashboard",
  "context-topology-gauge",
  "dataviz",
  "gauge",
  "topology",
  "memory",
  "fragmentation",
  "ring-meter",
  "forever",
  "metrics"
 ]
}
</script>
</head>
<body>
<div class="fc03-gauge-wrap" id="fc03-wrap" role="region" aria-label="Forever Context Gauge">
  <div class="fc03-title">forever · context_window</div>
  <div class="fc03-stage">
    <svg class="fc03-svg fc03-svg" viewBox="0 0 100 100">
      <circle class="fc03-circle fc03-circle" cx="50" cy="50" r="42" stroke="rgba(255,255,255,0.08)" stroke-width="7"/>
      <circle class="fc03-circle fc03-circle" id="fc03-ring" cx="50" cy="50" r="42" stroke="#C7F000" stroke-width="7" stroke-dasharray="264" stroke-dashoffset="100" stroke-linecap="round"/>
    </svg>
    <div class="fc03-center">
      <span class="fc03-tokens" id="fc03-tokVal">124k</span>
      <span class="fc03-percent" id="fc03-pctVal">62% load</span>
    </div>
  </div>
  <div class="fc03-tip" id="fc03-tipText">toque para compactar histórico</div>
</div>
<div class="fc03-caption" aria-hidden="true">Context Topology Gauge</div>
<script>
(()=>{
  const wrap = document.getElementById('fc03-wrap');
  const ring = document.getElementById('fc03-ring');
  const tokVal = document.getElementById('fc03-tokVal');
  const pctVal = document.getElementById('fc03-pctVal');
  const tipText = document.getElementById('fc03-tipText');
  let compacted = false;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let demoEnabled=window.__foreverPreview?window.__foreverPreview.demoEnabled!==false:true,demoTimer=0;
  function activate(){
    compacted = !compacted;
    if (compacted) {
      ring.style.strokeDashoffset = '174';
      tokVal.textContent = '68k'; pctVal.textContent = '34% load'; tipText.textContent = 'compactado ✓ toque para restaurar';
    } else {
      ring.style.strokeDashoffset = '100';
      tokVal.textContent = '124k'; pctVal.textContent = '62% load'; tipText.textContent = 'toque para compactar histórico';
    }
  }
  function stopDemo(){demoEnabled=false;clearInterval(demoTimer);demoTimer=0;}
  window.addEventListener('forever:interactive',stopDemo);
  document.addEventListener('pointerdown',stopDemo,{capture:true});
  document.addEventListener('click',stopDemo,{capture:true});
  document.addEventListener('keydown',e=>{if(e.key!=='Tab'&&!e.metaKey&&!e.ctrlKey&&!e.altKey)stopDemo();},{capture:true});
  function scheduleDemo() {
    if (demoEnabled && !reduce && !document.hidden && !demoTimer) demoTimer = setInterval(activate, 5000);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { clearInterval(demoTimer); demoTimer = 0; }
    else if(demoEnabled)scheduleDemo();
  });
  scheduleDemo();

  wrap.addEventListener('click',activate);
})();
</script>
</body>
</html>
