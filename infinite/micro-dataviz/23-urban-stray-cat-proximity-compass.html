<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Feline Waypoint Compass — Micro Data-Viz. A self-contained, zero-dependency animated web component.">
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Micro Data-Viz — Feline Waypoint Compass</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --dust: #C9B274;
    --red: #D93829;
    --asphalt: #141518;
  }
  .sw07-wrap, .sw07-wrap * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0d0e10;
    color: #fff;
    font-family: 'IBM Plex Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .sw07-wrap {
    width: 100%;
    max-width: 420px;
    background: var(--asphalt);
    border-radius: 8px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
    border: 1px solid rgba(201, 178, 116, 0.15);
    user-select: none;
  }
  .sw07-hdr {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .sw07-title {
    font-family: 'Archivo', sans-serif;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: -0.02em;
    color: #fff;
  }
  .sw07-pill {
    font-size: 12px;
    color: var(--dust);
    border: 1px solid rgba(201, 178, 116, 0.3);
    padding: 2px 7px;
    border-radius: 9999px;
  }

  .sw07-compass-box {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: 2px solid rgba(201, 178, 116, 0.3);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle, rgba(201, 178, 116, 0.05) 0%, transparent 70%);
  }
  .sw07-compass-dial {
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    border: 1px dashed rgba(255, 255, 255, 0.1);
  }
  .sw07-needle {
    position: absolute;
    width: 4px;
    height: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .sw07-needle-north {
    width: 0;
    height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-bottom: 50px solid var(--red);
  }
  .sw07-needle-south {
    width: 0;
    height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 50px solid var(--dust);
  }
  .sw07-needle-pivot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
  }

  .sw07-waypoints {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .sw07-wp-btn {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #fff;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    padding: 6px 2px;
    border-radius: 4px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s ease;
  }
  .sw07-wp-btn:focus-visible { outline: 2px solid var(--dust); outline-offset: 2px; }
  .sw07-wp-btn.sw07-active {
    background: var(--dust);
    color: var(--asphalt);
    border-color: var(--dust);
  }

  .sw07-foot {
    width: 100%;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.5);
  }

.sw07-preset1{color:var(--dust)}
.sw07-cap{position:fixed;left:10px;bottom:8px;font:10px system-ui;opacity:.55;pointer-events:none}
@media(prefers-reduced-motion:reduce){.sw07-wrap, .sw07-wrap *{animation:none!important;transition:none!important}}

.sw07-wrap[data-paused] *,.sw07-wrap[data-paused]{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){.sw07-wrap,.sw07-wrap *{animation:none!important;transition:none!important}}
@container fit-23-urban-stray-cat-proximity-compass (max-width:300px){.sw07-wrap{width:calc(100% - 16px);padding:12px;gap:8px}.sw07-title{font-size:12px}.sw07-pill,.sw07-foot{font-size:12px}.sw07-compass-box{width:102px;height:102px}.sw07-needle{height:82px}.sw07-needle-north{border-bottom-width:34px}.sw07-needle-south{border-top-width:34px}.sw07-wp-btn{font-size:12px;padding:5px 1px}.sw07-foot span:last-child{display:none}}
@container fit-23-urban-stray-cat-proximity-compass (max-width:210px){.sw07-wrap{padding:3px;gap:5px}.sw07-waypoints{gap:1px}.sw07-hdr,.sw07-foot{display:none}.sw07-compass-box{width:90px;height:90px}.sw07-needle{height:72px}.sw07-needle-north{border-bottom-width:29px}.sw07-needle-south{border-top-width:29px}.sw07-wp-btn{font-size:12px;padding:5px 0;letter-spacing:-.09em}}
body{width:100%;container-type:inline-size;container-name:fit-23-urban-stray-cat-proximity-compass}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/micro-dataviz/23-urban-stray-cat-proximity-compass.html",
 "title": "Feline Waypoint Compass",
 "description": "Feline Waypoint Compass control in the Sam Walks system.",
 "useWhen": "",
 "avoidWhen": "",
 "agentPrompt": "",
 "editableAreas": [],
 "preserveElements": [
  "First deliberate input stops route jitter; selected waypoint state remains.",
  "demo-v1 preview lifecycle: initialize demoEnabled from window.__foreverPreview and stop attract work on the window forever:interactive event; retain manual feedback, settling, cleanup and explicit sessions"
 ],
 "knownLimitations": [
  "State remains local to each mounted instance; format/theme remount preserves takeover, not component values."

</head>
<body>
<div class="sw07-wrap" role="region" aria-label="Feline Waypoint Compass">
  <div class="sw07-hdr">
    <span class="sw07-title">ALLEYWAY PROXIMITY // FELINE</span>
    <span class="sw07-pill" id="sw07-pingBadge">MICRO-PING: 18M</span>
  </div>

  <div class="sw07-compass-box">
    <div class="sw07-compass-dial"></div>
    <div class="sw07-needle" id="sw07-needle">
      <div class="sw07-needle-north"></div>
      <div class="sw07-needle-south"></div>
      <div class="sw07-needle-pivot"></div>
    </div>
  </div>

  <div class="sw07-waypoints" id="sw07-wpGroup">
    <button class="sw07-wp-btn sw07-active" data-deg="35" data-dist="18M" data-desc="CALÇADA SUN SPOT">ALFAMA</button>
    <button class="sw07-wp-btn" data-deg="140" data-dist="45M" data-desc="STAIRWAY ARCH">MOURARIA</button>
    <button class="sw07-wp-btn" data-deg="265" data-dist="32M" data-desc="TRAM RAILS SHADOW">BICA</button>
    <button class="sw07-wp-btn" data-deg="320" data-dist="60M" data-desc="MIRADOURO PINE">GRAÇA</button>
  </div>

  <div class="sw07-foot">
    <span id="sw07-targetMeta">TARGET: CALÇADA SUN SPOT</span>
    <span class="sw07-preset1">LISBON FLÂNEUR COMPASS</span>
  </div>
</div>

<div class="sw07-cap" aria-hidden="true">Feline Waypoint Compass</div>
<script>
(()=>{
  const tileRoot = document.querySelector('.sw07-wrap');
  const pauseCSS = () => tileRoot.toggleAttribute('data-paused', document.hidden);
  document.addEventListener('visibilitychange', pauseCSS); pauseCSS();

  // Local frame lifecycle: stop hidden work, repaint reduced-motion state on input.
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const frames = new Map(), drivers = new Set(); let painting = false;
  function scheduleFrame(fn) {
    if(fn===loop&&!demoEnabled)return;
    drivers.add(fn);
    if (document.hidden || frames.has(fn) || (motion.matches && painting)) return;
    frames.set(fn, requestAnimationFrame(t => {
      frames.delete(fn); if (document.hidden) return;
      painting = true; try { fn(t); } finally { painting = false; }
    }));
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { frames.forEach(cancelAnimationFrame); frames.clear(); }
    else drivers.forEach(scheduleFrame);
  });
  const repaint = () => { if (motion.matches) drivers.forEach(scheduleFrame); };
  ['click','input','pointermove'].forEach(type => document.addEventListener(type, repaint));
  motion.addEventListener('change', () => { reduce = motion.matches; drivers.forEach(scheduleFrame); });

  let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let demoEnabled=window.__foreverPreview?window.__foreverPreview.demoEnabled!==false:true;
  function stopDemo(){demoEnabled=false;running=false;const id=frames.get(loop);if(id)cancelAnimationFrame(id);frames.delete(loop);}
  window.addEventListener('forever:interactive',stopDemo);
  document.addEventListener('pointerdown',stopDemo,{capture:true});
  document.addEventListener('click',stopDemo,{capture:true});
  document.addEventListener('keydown',e=>{if(e.key!=='Tab'&&!e.metaKey&&!e.ctrlKey&&!e.altKey)stopDemo();},{capture:true});
  const needle = document.getElementById('sw07-needle');
  const pingBadge = document.getElementById('sw07-pingBadge');
  const targetMeta = document.getElementById('sw07-targetMeta');
  const buttons = document.querySelectorAll('.sw07-wp-btn');

  let curDeg = 35;

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('sw07-active'));
      btn.classList.add('sw07-active');
      curDeg = parseFloat(btn.getAttribute('data-deg'));
      pingBadge.textContent = `MICRO-PING: ${btn.getAttribute('data-dist')}`;
      targetMeta.textContent = `TARGET: ${btn.getAttribute('data-desc')}`;
      needle.style.transform = `rotate(${curDeg}deg)`;
    });
  });

  // Micro jitter simulation
  let running = true;
  document.addEventListener('visibilitychange', () => { running = !document.hidden&&demoEnabled;if(running)scheduleFrame(loop); });

  let t = 0;
  function loop() {
    if (!running||!demoEnabled) return;
    t += 0.05;
    const jitter = Math.sin(t * 2) * 2.5 + Math.cos(t * 3.5) * 1.5;
    needle.style.transform = `rotate(${curDeg + jitter}deg)`;
    scheduleFrame(loop);
  }
  scheduleFrame(loop);
})();
</script>
</body>
</html>
