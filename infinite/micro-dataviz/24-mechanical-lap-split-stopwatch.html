<style>
  :root {
    --sw-dust: #C9B274;
    --sw-red: #D93829;
    --sw-asphalt: #141518;
    --sw-paper: #EFE8D8;
    --sw-border: rgba(201, 178, 116, 0.25);

  [data-theme="light"] {
    --sw-dust: #947F46;
    --sw-red: #B82518;
    --sw-asphalt: #F4EFE6;
    --sw-paper: #1A1C20;
    --sw-border: rgba(148, 127, 70, 0.25);

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0D0E10;
    color: #FFFFFF;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;

  .sw09-root {
    width: 100%;

    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    position: relative;
    user-select: none;
  }
  .sw09-stopwatch-card {
    width: 100%;
    max-width: 320px;
    background: var(--sw-asphalt);
    border: 1px solid var(--sw-border);
    border-radius: 12px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
    padding: 22px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    position: relative;
  }
  .sw09-card-head {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--sw-border);
    padding-bottom: 6px;
    font-size: 12px;
  }
  .sw09-chrono-title {
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--sw-dust);
  }
  .sw09-plunger-mount {
    position: relative;
    width: 160px;
    height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sw09-brass-bezel {
    position: absolute;
    width: 154px;
    height: 154px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #D8C388 0%, #8E773F 100%);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6), inset 0 2px 4px #FFFFFF;
    border: 2px solid #574823;
  }
  .sw09-watch-dial {
    position: absolute;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: #0E1012;
    border: 2px solid var(--sw-dust);
    box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.8);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sw09-dial-canvas {
    width: 130px;
    height: 130px;
    display: block;
  }
  .sw09-plunger-button {
    position: absolute;
    top: -14px;
    width: 32px;
    height: 20px;
    background: linear-gradient(180deg, #E2CD98 0%, #9E8546 100%);
    border: 1.5px solid #574823;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(0, 0, 0, 0.5);
    z-index: 5;
    transition: transform 0.1s ease;
  }
  .sw09-plunger-button:focus:not(:focus-visible) { outline: none; }
  .sw09-plunger-button:focus-visible { outline: 2px solid var(--sw-dust); outline-offset: 3px; }
  .sw09-plunger-button:active {
    transform: translateY(4px);
  }
  .sw09-time-readout {
    position: absolute;
    bottom: 24px;
    font-size: 13px;
    font-weight: 800;
    color: var(--sw-dust);
    z-index: 3;
    pointer-events: none;
  }
  .sw09-footer-tray {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 12px;
  }
  .sw09-split-tag {
    color: var(--sw-red);
    font-weight: 700;
  }
  .sw09-caption {
    position: absolute;
    bottom: 8px;
    right: 12px;
    font-size: 10px;
    letter-spacing: 0.05em;
    color: var(--sw-dust);
    opacity: 0.65;
    pointer-events: none;
    font-family: ui-monospace, monospace;
  }


@media(prefers-reduced-motion:reduce){.sw09-root, .sw09-root *{animation:none!important;transition:none!important}}

.sw09-root[data-paused] *,.sw09-root[data-paused]{animation-play-state:paused!important}

@container fit-24-mechanical-lap-split-stopwatch (max-width:210px){.sw09-stopwatch-card{padding:8px;gap:5px}.sw09-card-head{display:none}.sw09-plunger-mount{width:96px;height:96px}.sw09-brass-bezel{width:92px;height:92px}.sw09-watch-dial,.sw09-dial-canvas{width:78px;height:78px}.sw09-footer-tray{font-size:12px}}
body{width:100%;container-type:inline-size;container-name:fit-24-mechanical-lap-split-stopwatch}

<body>
<div class="sw09-root" role="region" aria-label="Mechanical Lap Split Stopwatch · Sam Walks Button">
  <div class="sw09-stopwatch-card">
    <div class="sw09-card-head">
      <span class="sw09-chrono-title">EXPEDITION CHRONOMETER</span>
      <span>1/5 SEC RATIO</span>
    </div>

    <div class="sw09-plunger-mount">
      <button class="sw09-plunger-button" id="sw09-plunger-btn" aria-label="Actuate Stopwatch Plunger"></button>
      <div class="sw09-brass-bezel"></div>
      <div class="sw09-watch-dial">
        <canvas class="sw09-dial-canvas" id="sw09-canvas"></canvas>
        <span class="sw09-time-readout" id="sw09-time-str">00:14.4</span>
      </div>
    </div>

    <div class="sw09-footer-tray">
      <span>LAP SPLIT:</span>
      <span class="sw09-split-tag" id="sw09-split-metric">SPLIT 02 · 07:18.2</span>
    </div>
  </div>
</div>
<div class="sw09-caption" aria-hidden="true">Mechanical Stopwatch Button</div>

<script>
(()=>{
  // Local frame lifecycle: stop hidden work, repaint reduced-motion state on input.
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const frames = new Map(), drivers = new Set(); let painting = false;
  function scheduleFrame(fn) {
    if(fn===loop&&!demoEnabled&&!isRunning)return;
    drivers.add(fn);
    if (document.hidden || frames.has(fn) || (motion.matches && painting)) return;
    frames.set(fn, requestAnimationFrame(t => {
      frames.delete(fn); if (document.hidden) return;
      painting = true; try { fn(t); } finally { painting = false; }
    }));
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { frames.forEach(cancelAnimationFrame); frames.clear(); }
    else drivers.forEach(scheduleFrame);
  });
  const repaint = () => { if (motion.matches) drivers.forEach(scheduleFrame); };
  ['click','input','pointermove'].forEach(type => document.addEventListener(type, repaint));
  motion.addEventListener('change', () => { reduce = motion.matches; drivers.forEach(scheduleFrame); });

  const tileRoot = document.querySelector('.sw09-root');
  const pauseCSS = () => tileRoot.toggleAttribute('data-paused', document.hidden);
  document.addEventListener('visibilitychange', pauseCSS); pauseCSS();

  let seconds = 14.4;
  let isRunning = true;
  let userInteracted = false;
  let demoEnabled=window.__foreverPreview?window.__foreverPreview.demoEnabled!==false:true;
  function takeOver(){demoEnabled=false;userInteracted=true;}
  window.addEventListener('forever:interactive',takeOver);
  document.addEventListener('pointerdown',takeOver,{capture:true});
  document.addEventListener('click',takeOver,{capture:true});
  document.addEventListener('keydown',e=>{if(e.key!=='Tab'&&!e.metaKey&&!e.ctrlKey&&!e.altKey)takeOver();},{capture:true});
  let running = true;
  let reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const btn = document.getElementById("sw09-plunger-btn");
  const timeStr = document.getElementById("sw09-time-str");
  const canvas = document.getElementById("sw09-canvas");
  const ctx = canvas ? canvas.getContext("2d") : null;

  let w = 130, h = 130;
  function resize() {
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    w = canvas.clientWidth || 130;
    h = canvas.clientHeight || 130;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    if (ctx) ctx.scale(dpr, dpr);
  }
  resize();

  if (btn) {
    btn.addEventListener("click", () => {
      userInteracted = true;
      isRunning = !isRunning;
      if(isRunning)scheduleFrame(loop);
    });
  }

  function renderDial() {
    if (!ctx) return;
    ctx.clearRect(0, 0, w, h);

    const cx = w / 2;
    const cy = h / 2;
    const r = w * 0.44;

    const dust = getComputedStyle(document.documentElement).getPropertyValue("--sw-dust").trim() || "#C9B274";

    // Hash marks around perimeter (60 marks)
    for (let i = 0; i < 60; i++) {
      const a = (i * Math.PI * 2) / 60;
      const len = i % 5 === 0 ? 7 : 3;
      const x1 = cx + Math.cos(a) * (r - len);
      const y1 = cy + Math.sin(a) * (r - len);
      const x2 = cx + Math.cos(a) * r;
      const y2 = cy + Math.sin(a) * r;

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.strokeStyle = i % 5 === 0 ? dust : "rgba(201, 178, 116, 0.35)";
      ctx.lineWidth = i % 5 === 0 ? 1.5 : 0.8;
      ctx.stroke();
    }

    // Hand angle
    const handA = ((seconds % 60) * Math.PI * 2) / 60 - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(handA) * (r - 12), cy + Math.sin(handA) * (r - 12));
    ctx.strokeStyle = "#D93829";
    ctx.lineWidth = 1.8;
    ctx.stroke();

    // Center pivot pin
    ctx.beginPath();
    ctx.arc(cx, cy, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = dust;
    ctx.fill();
  }

  function loop() {
    if (!running||(!demoEnabled&&!isRunning)) return;
    if (isRunning && !reduce) {
      seconds += 0.04;
      const m = Math.floor(seconds / 60);
      const s = (seconds % 60).toFixed(1);
      if (timeStr) timeStr.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(4, '0')}`;
    }
    renderDial();
    if(demoEnabled||isRunning)scheduleFrame(loop);
  }

  document.addEventListener("visibilitychange", () => {
    running = !document.hidden;
  });

  scheduleFrame(loop);
})();
</script>
