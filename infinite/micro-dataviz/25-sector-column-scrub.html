<style>

:root{--wka-bg:#111B25;--wka-tile:#1B2937;--wka-ink:#EDF3FA;--wka-mut:#96A6B8;--wka-grout:#0A1118;--wka-acc:#4B85D1;--wka-c0:#6EB2B3;--wka-c1:#4B85D1;--wka-c2:#E5B438;--wka-c3:#E06752}

.wka-stage,.wka-stage *{box-sizing:border-box;margin:0;padding:0}

.wka-stage{background:var(--wka-bg);display:grid;place-items:center;overflow:hidden}
#wka-root{width:min(100vmin,640px);height:min(100vmin,640px);background:var(--wka-tile);border:3px solid var(--wka-grout);touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
#wka-root:focus-visible{outline:2px solid var(--wka-acc);outline-offset:-8px}
#wka-c{display:block;width:100%;height:100%}

:root{--bg:var(--wka-bg)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
.wka-stage{width:100%;height:100%;display:grid;place-items:center}
.wka-cap{position:fixed;left:8px;bottom:7px;font:10px/1.2 system-ui,sans-serif;color:var(--wka-ink);opacity:.45;pointer-events:none}

<body>
<div class="wka-stage" role="group" aria-label="Sector Column Scrub">
<div id="wka-root" role="slider" tabindex="0" aria-label="Day KPI comparison: focus, commits, coffee, bugs. Drag or use arrow keys to switch day" aria-valuemin="1" aria-valuemax="3" aria-valuenow="1" aria-valuetext="">
<canvas id="wka-c"></canvas>
</div>
</div>
<div class="wka-cap" aria-hidden="true">Sector Column Scrub</div>
<script>
(function(){
var D=[["Monday",[84.5,1420,342,18]],["Friday",[72.4,980,215,34]],["Forever",[92.1,2150,580,6]]],
MX=[92.1,2150,580,34],root=document.getElementById('wka-root'),cv=document.getElementById('wka-c'),cx=cv.getContext('2d'),
rm=matchMedia('(prefers-reduced-motion: reduce)'),S=0,C={},raf=0,last=0,
idx=0,pos=0,vel=0,tp=0,raw=0,drag=0,moved=0,x0=0,p0=0,lx=0,lt=0,vx=0;
function fmt(i,x){x=Math.max(0,x);return i==0?x.toFixed(1)+'%':i==2?Math.round(x)+' oz':Math.round(x).toLocaleString('en')}
function cols(){var s=getComputedStyle(document.documentElement);['bg','tile','ink','mut','grout','acc','c0','c1','c2','c3'].forEach(function(k){C[k]=s.getPropertyValue('--wka-'+k).trim()})}
function say(){root.setAttribute('aria-valuenow',idx+1);root.setAttribute('aria-valuetext',D[idx][0]+': '+D[idx][1].map(function(v,i){return fmt(i,v)}).join(', '))}
function size(){S=root.clientWidth;var d=Math.min(devicePixelRatio||1,2);cv.width=cv.height=Math.round(S*d);cx.setTransform(d,0,0,d,0,0);draw()}
function vals(){var i=pos<1?0:1,t=pos-i;return MX.map(function(m,k){return D[i][1][k]+(D[i+1][1][k]-D[i][1][k])*t})}
function step(dt){
 if(rm.matches){pos=tp;vel=0;return false}
 vel+=(tp-pos)*.085*dt;vel*=Math.pow(drag?.7:.83,dt);pos+=vel*dt;
 var m=drag||Math.abs(vel)>.0005||Math.abs(tp-pos)>.0005;
 if(!m){pos=tp;vel=0}return m}
function draw(){
 if(!S)return;cx.clearRect(0,0,S,S);
 var v=vals(),w=S*.15,g=S*.04,x=S*.14,b=S*.78,H=S*.56,n=14,ch=H/n,i,k,s;
 cx.textAlign='center';cx.textBaseline='alphabetic';
 for(i=0;i<4;i++){
  var h=Math.max(0,v[i]/MX[i]*H*.94),px=x+i*(w+g);
  cx.fillStyle=C['c'+i];
  for(k=0;k*ch<h;k++){
   var c=Math.min(ch,h-k*ch)-S*.006;if(c<1)continue;
   cx.globalAlpha=k%2?.84:1;cx.fillRect(px,b-k*ch-c,w,c)}
  cx.globalAlpha=1;cx.fillStyle=C.ink;cx.font='900 '+S*.045+'px "Archivo Black",system-ui,sans-serif';
  cx.fillText(fmt(i,v[i]),px+w/2,b-h-S*.025)}
 cx.fillStyle=C.grout;cx.fillRect(x-S*.03,b+S*.004,4*w+3*g+S*.06,3);
 cx.font='700 '+S*.03+'px ui-monospace,Menlo,monospace';
 for(s=0;s<3;s++){
  var a=Math.max(0,1-Math.abs(pos-s)),nx=S*(s+.5)/3;
  cx.globalAlpha=1;cx.fillStyle=C.mut;cx.fillText(D[s][0].toUpperCase(),nx,S*.915);
  cx.globalAlpha=a;cx.fillStyle=C.ink;cx.fillText(D[s][0].toUpperCase(),nx,S*.915)}
 cx.globalAlpha=1;cx.fillStyle=C.acc;cx.fillRect(S*(pos+.5)/3-S*.06,S*.94,S*.12,3)}
function wake(){if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(tick)}}
function tick(n){raf=0;var dt=Math.min(n-last,50)/16.667;last=n;if(step(dt))raf=requestAnimationFrame(tick);draw()}
document.addEventListener('visibilitychange',function(){if(document.hidden){cancelAnimationFrame(raf);raf=0}else wake()});
function go(i){idx=i;tp=i;say();wake()}
function cl(v){return v<0?0:v>2?2:v}
function rub(v){return v<0?v*.25:v>2?2+(v-2)*.25:v}
root.addEventListener('pointerdown',function(e){drag=1;moved=0;x0=lx=e.clientX;p0=raw=pos;lt=e.timeStamp;vx=0;root.setPointerCapture(e.pointerId);root.style.cursor='grabbing';wake()});
root.addEventListener('pointermove',function(e){
 if(!drag)return;var dx=e.clientX-x0,k=S*.33,dt=Math.max(e.timeStamp-lt,1);
 if(Math.abs(dx)>5)moved=1;
 raw=p0+dx/k;tp=rub(raw);vx=.8*vx+.2*(e.clientX-lx)/dt/k;lx=e.clientX;lt=e.timeStamp;wake()});
function up(e){
 if(!drag)return;drag=0;root.style.cursor='';
 if(moved)go(Math.round(cl(raw+vx*160)));
 else{var r=root.getBoundingClientRect();if((e.clientY-r.top-3)/S>.84)go(cl(Math.floor((e.clientX-r.left-3)/S*3)));else go(idx)}}
root.addEventListener('pointerup',up);root.addEventListener('pointercancel',up);
root.addEventListener('keydown',function(e){
 var k=e.key,i=idx;
 if(k=='ArrowRight'||k=='ArrowUp')i++;else if(k=='ArrowLeft'||k=='ArrowDown')i--;
 else if(k=='Home')i=0;else if(k=='End')i=2;else if(k>='1'&&k<='3')i=k-1;else return;
 e.preventDefault();go(cl(i))});
function theme(t){document.documentElement.setAttribute('data-theme',t);cols();draw()}
window.addEventListener('message',function(e){var m=e.data;if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark'))theme(m.theme)});
if(rm.addEventListener)rm.addEventListener('change',wake);
cols();say();
if(window.ResizeObserver)new ResizeObserver(size).observe(root);else{addEventListener('resize',size)}
size();

var demoEnabled=window.__foreverPreview?.demoEnabled!==false,demoClock=0;
function demoStep(){if(!demoEnabled||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;go((idx+1)%3);}
function demoStop(){if(demoClock){clearInterval(demoClock);demoClock=0}}
function demoStart(){demoStop();if(demoEnabled&&!document.hidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches)demoClock=setInterval(demoStep,1600)}
function takeover(){if(window.__foreverPreview?.surface==='wall')return;demoEnabled=false;demoStop()}
window.addEventListener('forever:interactive',takeover);
var stage=document.querySelector('.wka-stage');
stage.addEventListener('pointerdown',takeover,true);stage.addEventListener('keydown',takeover,true);stage.addEventListener('input',takeover,true);stage.addEventListener('wheel',takeover,{capture:true,passive:true});
document.addEventListener('visibilitychange',function(){document.hidden?demoStop():demoStart()});
var demoMotion=matchMedia('(prefers-reduced-motion: reduce)');demoMotion.addEventListener('change',function(){demoStart();wake()});
demoStart();
})();
</script>
