<script>
(function(){
var D=[["Monday",[84.5,1420,342,18]],["Friday",[72.4,980,215,34]],["Forever",[92.1,2150,580,6]]],
MX=[92.1,2150,580,34],AX=[-90,0,90,180],A0=-75,R=Math.PI/180,
root=document.getElementById('wkb-root'),cv=document.getElementById('wkb-c'),cx=cv.getContext('2d'),
rm=matchMedia('(prefers-reduced-motion: reduce)'),S=0,C={},raf=0,last=0,idx=0,pos=0,tp=0;
function fmt(i,x){x=Math.max(0,x);return i==0?x.toFixed(1)+'%':i==2?Math.round(x)+' oz':Math.round(x).toLocaleString('en')}
function cols(){var s=getComputedStyle(document.documentElement);['bg','tile','ink','mut','grout','acc','c0','c1','c2','c3'].forEach(function(k){C[k]=s.getPropertyValue('--wkb-'+k).trim()})}
function say(){root.setAttribute('aria-valuenow',idx+1);root.setAttribute('aria-valuetext',D[idx][0]+': '+D[idx][1].map(function(v,i){return fmt(i,v)}).join(', '))}
function size(){S=root.clientWidth;var d=Math.min(devicePixelRatio||1,2);cv.width=cv.height=Math.round(S*d);cx.setTransform(d,0,0,d,0,0);draw()}
function cd(a,b){var d=a-b;return d-3*Math.round(d/3)}
function wrap(p){return((p%3)+3)%3}
function vals(){var f=Math.floor(pos),i=f%3,j=(i+1)%3,t=pos-f;return MX.map(function(m,k){return D[i][1][k]*(1-t)+D[j][1][k]*t})}
function step(dt){
 if(rm.matches){pos=wrap(tp);return false}
 var d=cd(tp,pos);pos=wrap(pos+d*(1-Math.pow(.88,dt)));
 var m=Math.abs(d)>.001;if(!m)pos=wrap(tp);return m}
function draw(){
 if(!S)return;cx.clearRect(0,0,S,S);
 var m=S/2,L=S*.24,v=vals(),i,s,a;
 cx.save();cx.translate(m,m);cx.lineJoin='round';cx.lineCap='round';cx.textAlign='center';cx.textBaseline='middle';
 for(s=0;s<3;s++){
  var w=Math.max(0,1-Math.abs(cd(pos,s)));a=(A0+120*s)*R;
  cx.globalAlpha=1;cx.strokeStyle=C.grout;cx.lineWidth=S*.012;cx.beginPath();cx.arc(0,0,S*.455,a-.9,a+.9);cx.stroke();
  cx.globalAlpha=w;cx.strokeStyle=C.acc;cx.lineWidth=S*.022;cx.beginPath();cx.arc(0,0,S*.455,a-.9,a+.9);cx.stroke();
  cx.font='700 '+S*.027+'px ui-monospace,Menlo,monospace';
  var nx=Math.cos(a)*S*.365,ny=Math.sin(a)*S*.365,t=D[s][0].toUpperCase();
  cx.globalAlpha=1;cx.fillStyle=C.mut;cx.fillText(t,nx,ny);cx.globalAlpha=w;cx.fillStyle=C.ink;cx.fillText(t,nx,ny)}
 cx.globalAlpha=.5;cx.strokeStyle=C.mut;cx.lineWidth=1;cx.setLineDash([3,4]);
 for(s=0;s<3;s++){cx.beginPath();for(i=0;i<4;i++){var l=D[s][1][i]/MX[i]*L;a=AX[i]*R;cx[i?'lineTo':'moveTo'](Math.cos(a)*l,Math.sin(a)*l)}cx.closePath();cx.stroke()}
 cx.setLineDash([]);
 for(i=0;i<4;i++){
  var l=Math.max(v[i]/MX[i]*L,S*.012),cw=Math.min(S*.1,l*.7);a=AX[i]*R;
  cx.save();cx.rotate(a);cx.beginPath();cx.moveTo(0,0);cx.quadraticCurveTo(l*.5,-cw,l,0);cx.quadraticCurveTo(l*.5,cw,0,0);
  cx.globalAlpha=.92;cx.fillStyle=C['c'+i];cx.fill();cx.globalAlpha=1;cx.strokeStyle=C.ink;cx.lineWidth=1.2;cx.stroke();cx.restore();
  cx.font='900 '+S*.04+'px "Archivo Black",system-ui,sans-serif';
  var tx=fmt(i,v[i]),d=l+S*.02+(i%2?cx.measureText(tx).width/2:S*.025);
  cx.fillStyle=C.ink;cx.fillText(tx,Math.cos(a)*d,Math.sin(a)*d)}
 cx.fillStyle=C.ink;cx.beginPath();cx.arc(0,0,S*.012,0,7);cx.fill();cx.restore()}
function wake(){if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(tick)}}
function tick(n){raf=0;var dt=Math.min(n-last,50)/16.667;last=n;if(step(dt))raf=requestAnimationFrame(tick);draw()}
document.addEventListener('visibilitychange',function(){if(document.hidden){cancelAnimationFrame(raf);raf=0}else wake()});
function set(i){idx=i;say()}
function aim(e){
 var r=root.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;
 if(Math.hypot(dx,dy)<S*.1)return;
 tp=wrap((Math.atan2(dy,dx)/R-A0)/120);
 var n=Math.round(tp)%3;if(n!=idx)set(n);wake()}
function snap(){tp=Math.round(tp)%3;set(tp);wake()}
root.addEventListener('pointerdown',function(e){root.setPointerCapture(e.pointerId);aim(e)});
root.addEventListener('pointermove',aim);
root.addEventListener('pointerup',function(e){if(e.pointerType!='mouse')snap()});
root.addEventListener('pointercancel',snap);
root.addEventListener('pointerleave',function(e){if(e.pointerType=='mouse'&&!(e.buttons&1))snap()});
root.addEventListener('keydown',function(e){
 var k=e.key,i=Math.round(tp)%3;
 if(k=='ArrowRight'||k=='ArrowUp')i++;else if(k=='ArrowLeft'||k=='ArrowDown')i+=2;
 else if(k=='Home')i=0;else if(k=='End')i=2;else if(k>='1'&&k<='3')i=k-1;else return;
 e.preventDefault();tp=i%3;set(tp);wake()});
function theme(t){document.documentElement.setAttribute('data-theme',t);cols();draw()}
window.addEventListener('message',function(e){var m=e.data;if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark'))theme(m.theme)});
if(rm.addEventListener)rm.addEventListener('change',wake);
cols();say();
if(window.ResizeObserver)new ResizeObserver(size).observe(root);else addEventListener('resize',size);
size();

var demoEnabled=window.__foreverPreview?.demoEnabled!==false,demoClock=0;
function demoStep(){if(!demoEnabled||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;tp=(idx+1)%3;set(tp);wake();}
function demoStop(){if(demoClock){clearInterval(demoClock);demoClock=0}}
function demoStart(){demoStop();if(demoEnabled&&!document.hidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches)demoClock=setInterval(demoStep,1600)}
function takeover(){if(window.__foreverPreview?.surface==='wall')return;demoEnabled=false;demoStop()}
window.addEventListener('forever:interactive',takeover);
var stage=document.querySelector('.wkb-stage');
stage.addEventListener('pointerdown',takeover,true);stage.addEventListener('keydown',takeover,true);stage.addEventListener('input',takeover,true);stage.addEventListener('wheel',takeover,{capture:true,passive:true});
document.addEventListener('visibilitychange',function(){document.hidden?demoStop():demoStart()});
var demoMotion=matchMedia('(prefers-reduced-motion: reduce)');demoMotion.addEventListener('change',function(){demoStart();wake()});
demoStart();
})();
