<style>

#wke-cv{width:100%;height:100%;display:block}

:root{--bg:var(--wke-p)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
.wke-stage{width:100%;height:100%;display:grid;place-items:center}
.wke-cap{position:fixed;left:8px;bottom:7px;font:10px/1.2 system-ui,sans-serif;color:var(--wke-i);opacity:.45;pointer-events:none}

<body>
<div class="wke-stage" role="group" aria-label="Tessellated KPI Dial">
<div id="wke-st" role="slider" tabindex="0" aria-label="Sector dial: rotate to switch day and compare KPI values" aria-valuemin="0" aria-valuemax="2" aria-valuenow="0"><canvas id="wke-cv"></canvas></div>
</div>
<div class="wke-cap" aria-hidden="true">Tessellated KPI Dial</div>
<script>
(function(){
var D=document,R=D.documentElement,st=D.getElementById('wke-st'),cv=D.getElementById('wke-cv'),x=cv.getContext('2d'),PI=Math.PI,
S=[[84.5,1420,342,18],[72.4,980,215,34],[92.1,2150,580,6]],N=['Monday','Friday','Forever'],M=[100,2150,580,34],
a=0,va=0,ta=0,n=[.2,.2,.2,.2],vn=[0,0,0,0],tn=[0,0,0,0],W=300,dpr=1,C={},raf=0,last=0,drag=0,pa=0,pt=0,idx=-1,
mq=matchMedia('(prefers-reduced-motion: reduce)');
function col(){var s=getComputedStyle(R);C.p=s.getPropertyValue('--wke-p').trim();C.i=s.getPropertyValue('--wke-i').trim();C.a=s.getPropertyValue('--wke-a').trim()}
function sync(){var k=(((Math.round(-a/120))%3)+3)%3,i;if(k===idx)return;idx=k;for(i=0;i<4;i++)tn[i]=S[k][i]/M[i];
st.setAttribute('aria-valuenow',k);st.setAttribute('aria-valuetext',N[k]+': focus '+S[k][0]+' percent, '+S[k][1]+' commits, '+S[k][2]+' ounces of coffee, '+S[k][3]+' bugs')}
function fmt(i){var v=Math.max(0,n[i]*M[i]);return i<1?Math.min(100,v).toFixed(1)+'%':i<2?Math.round(v).toLocaleString('en-US'):i<3?Math.round(v)+' oz':''+Math.round(v)}
function draw(){var s=W*dpr,c=s/2,i,k,r,q,an,px,py,h,u,j,vx,vy;
x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,s,s);x.lineJoin='miter';x.lineWidth=1.5*dpr;x.strokeStyle=C.i;
x.globalAlpha=.3;x.beginPath();x.arc(c,c,.46*s,0,2*PI);x.stroke();x.globalAlpha=1;
for(k=0;k<3;k++){an=(-90+k*120+a)*PI/180;u=Math.max(0,Math.cos(an+PI/2));h=s*(.02+.025*u);px=c+Math.cos(an)*.46*s;py=c+Math.sin(an)*.46*s;
x.beginPath();x.moveTo(px,py-h);x.lineTo(px+h,py);x.lineTo(px,py+h);x.lineTo(px-h,py);x.closePath();x.fillStyle=k===idx?C.a:C.p;x.fill();x.stroke()}
x.font='700 '+(.058*s)+'px ui-monospace,Menlo,monospace';x.textAlign='center';x.textBaseline='middle';
for(i=0;i<4;i++){r=s*(.06+.28*Math.max(0,n[i]));q=(i*22.5-45+a/6)*PI/180;
x.strokeStyle=x.fillStyle=i===3?C.a:C.i;x.lineWidth=(i===3?2.5:1.5)*dpr;x.beginPath();
for(j=0;j<4;j++){px=c+Math.cos(q+j*PI/2)*r;py=c+Math.sin(q+j*PI/2)*r;j?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.stroke();
an=q+i*PI/2;vx=Math.cos(an);vy=Math.sin(an);
x.fillText(fmt(i),Math.min(.9*s,Math.max(.1*s,c+vx*(r+.1*s))),Math.min(.94*s,Math.max(.06*s,c+vy*(r+.045*s))))}}
function frame(t){raf=0;var dt=Math.min(t-last,50)/16.667,rm=mq.matches,busy=0,i;last=t;
if(!drag){if(rm){a=ta;va=0}else{va+=(ta-a)*.045*dt;va*=Math.pow(.86,dt);a+=va*dt}
if(Math.abs(ta-a)>.05||Math.abs(va)>.02)busy=1;else{a=ta;va=0}}else busy=1;
sync();
for(i=0;i<4;i++){if(rm){n[i]=tn[i];vn[i]=0}else{vn[i]+=(tn[i]-n[i])*(.03+i*.008)*dt;vn[i]*=Math.pow(.88,dt);n[i]+=vn[i]*dt}
if(Math.abs(tn[i]-n[i])>.0005||Math.abs(vn[i])>.0005)busy=1}
draw();if(busy&&!D.hidden)raf=requestAnimationFrame(frame)}
function wake(){if(raf||D.hidden)return;last=performance.now();raf=requestAnimationFrame(frame)}
function size(){W=Math.max(1,st.clientWidth);dpr=Math.min(window.devicePixelRatio||1,2);cv.width=cv.height=Math.round(W*dpr);draw()}
function theme(t){R.setAttribute('data-theme',t);col();draw()}
function ang(e){var b=st.getBoundingClientRect();return Math.atan2(e.clientY-b.top-b.height/2,e.clientX-b.left-b.width/2)*180/PI}
st.addEventListener('pointerdown',function(e){drag=1;try{st.setPointerCapture(e.pointerId)}catch(_){}pa=ang(e);pt=e.timeStamp;va=0;wake()});
st.addEventListener('pointermove',function(e){if(!drag)return;var q=ang(e),d=q-pa,m=Math.max(1,e.timeStamp-pt);if(d>180)d-=360;if(d<-180)d+=360;pa=q;pt=e.timeStamp;a+=d;va=va*.5+d/m*8.333;wake()});
function up(){if(!drag)return;drag=0;ta=Math.round((a+va*8)/120)*120;va*=.4;wake()}
st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
st.addEventListener('keydown',function(e){var d=e.key==='ArrowRight'||e.key==='ArrowDown'?-1:e.key==='ArrowLeft'||e.key==='ArrowUp'?1:0;if(!d)return;e.preventDefault();ta=Math.round(ta/120)*120+d*120;wake()});
D.addEventListener('visibilitychange',function(){if(D.hidden){if(raf){cancelAnimationFrame(raf);raf=0}}else{draw();wake()}});
window.addEventListener('message',function(e){var m=e.data;if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark'))theme(m.theme)});
if(window.ResizeObserver)new ResizeObserver(size).observe(st);else window.addEventListener('resize',size);
col();size();sync();wake();

var demoEnabled=window.__foreverPreview?.demoEnabled!==false,demoClock=0;
function demoStep(){if(!demoEnabled||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;ta=Math.round(ta/120)*120-120;wake();}
function demoStop(){if(demoClock){clearInterval(demoClock);demoClock=0}}
function demoStart(){demoStop();if(demoEnabled&&!document.hidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches)demoClock=setInterval(demoStep,1600)}
function takeover(){if(window.__foreverPreview?.surface==='wall')return;demoEnabled=false;demoStop()}
window.addEventListener('forever:interactive',takeover);
var stage=document.querySelector('.wke-stage');
stage.addEventListener('pointerdown',takeover,true);stage.addEventListener('keydown',takeover,true);stage.addEventListener('input',takeover,true);stage.addEventListener('wheel',takeover,{capture:true,passive:true});
document.addEventListener('visibilitychange',function(){document.hidden?demoStop():demoStart()});
var demoMotion=matchMedia('(prefers-reduced-motion: reduce)');demoMotion.addEventListener('change',function(){demoStart();wake()});
demoStart();
})();
</script>
