<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Folding KPI Columns — Micro Data-Viz. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Folding KPI Columns</title>
<meta name="forever-preview-lifecycle" content="demo-v1">
<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})();</script>
<style>

:root{--wkf-p:#15130F;--wkf-i:#E9E2D0;--wkf-a:#D0705A}
:root[data-theme="light"]{--wkf-p:#EFE8D8;--wkf-i:#1E1B16;--wkf-a:#7A2E22}

.wkf-stage,.wkf-stage *{box-sizing:border-box;margin:0}

.wkf-stage{background:var(--wkf-p);display:grid;place-items:center;overflow:hidden}
#wkf-st{display:block;width:min(92vmin,640px);aspect-ratio:1;padding:0;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#wkf-st:focus-visible{outline:2px solid var(--wkf-a);outline-offset:4px}
#wkf-cv{width:100%;height:100%;display:block}

:root{--bg:var(--wkf-p)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
.wkf-stage{width:100%;height:100%;display:grid;place-items:center}
.wkf-cap{position:fixed;left:8px;bottom:7px;font:10px/1.2 system-ui,sans-serif;color:var(--wkf-i);opacity:.45;pointer-events:none}


</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/micro-dataviz/30-folding-kpi-columns.html",
 "title": "Folding KPI Columns",
 "description": "Folding KPI Columns compares focus, commits, coffee ounces and bugs across Monday, Friday and Forever in a parchment and clay tessellation palette.",
 "useWhen": "A compact comparison of illustrative metrics across selectable days.",
 "avoidWhen": "Financial reporting without replacing the sample data and adding accessible data tables.",
 "agentPrompt": "Adapt content through existing data arrays; retain named palette, controls and demo-v1 lifecycle.",
 "editableAreas": [

 "preserveElements": [

 ],

 "labels": [

</head>
<body>
<div class="wkf-stage" role="group" aria-label="Folding KPI Columns">
<button id="wkf-st" type="button" aria-label="KPI columns. Press to switch day."><canvas id="wkf-cv"></canvas></button>
</div>
<div class="wkf-cap" aria-hidden="true">Folding KPI Columns</div>
<script>
(function(){
var D=document,R=D.documentElement,st=D.getElementById('wkf-st'),cv=D.getElementById('wkf-cv'),x=cv.getContext('2d'),PI=Math.PI,
S=[[84.5,1420,342,18],[72.4,980,215,34],[92.1,2150,580,6]],N=['Monday','Friday','Forever'],M=[100,2150,580,34],ROWS=14,
idx=0,v=[.05,.05,.05,.05],vv=[0,0,0,0],tv=[0,0,0,0],ev=[0,0,0,0],due=[0,0,0,0],pr=[0,0,0,0],tp=[0,0,0,0],W=300,dpr=1,C={},raf=0,last=0,
mq=matchMedia('(prefers-reduced-motion: reduce)');
function col(){var s=getComputedStyle(R);C.p=s.getPropertyValue('--wkf-p').trim();C.i=s.getPropertyValue('--wkf-i').trim();C.a=s.getPropertyValue('--wkf-a').trim()}
function go(k,first){var now=performance.now(),i;idx=k;for(i=0;i<4;i++){tv[i]=S[k][i]/M[i];due[i]=now+(first?250:0)+i*90}
st.setAttribute('aria-label','KPI columns, '+N[k]+': focus '+S[k][0]+' percent, '+S[k][1]+' commits, '+S[k][2]+' ounces of coffee, '+S[k][3]+' bugs. Press to switch day.');wake()}
function fmt(i,f){var q=Math.max(0,f*M[i]);return i<1?Math.min(100,q).toFixed(1)+'%':i<2?Math.round(q).toLocaleString('en-US'):i<3?Math.round(q)+' oz':''+Math.round(q)}
function cx(i){return W*dpr*(.5+(i-1.5)*.215)}
function draw(){var s=W*dpr,i,r,f,hw,hh,y,X,top,st_=s*.047,yb=.84*s,cw=s*.17/2,k;
x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,s,s);x.lineJoin='miter';
x.font='700 '+(.056*s)+'px ui-monospace,Menlo,monospace';x.textAlign='center';x.textBaseline='middle';
for(i=0;i<4;i++){X=cx(i);x.strokeStyle=x.fillStyle=i===3?C.a:C.i;x.lineWidth=(1.4+1.4*pr[i])*dpr;
for(r=0;r<ROWS;r++){f=Math.min(1,Math.max(0,v[i]*ROWS-r));if(f<.01)continue;
hw=cw*(1+.4*pr[i])*Math.sin(f*PI/2);hh=st_;y=yb-(r+.5)*st_;
x.beginPath();x.moveTo(X,y-hh);x.lineTo(X+hw,y);x.lineTo(X,y+hh);x.lineTo(X-hw,y);x.closePath();x.stroke();
x.globalAlpha=.45;x.beginPath();x.moveTo(X,y-hh);x.lineTo(X,y+hh);x.stroke();x.globalAlpha=1}
top=yb-Math.min(v[i],1.05)*ROWS*st_;x.fillText(fmt(i,v[i]),X,Math.max(.07*s,top-.07*s))}
x.strokeStyle=C.i;x.lineWidth=1.5*dpr;
for(k=0;k<3;k++){X=s*(.5+(k-1)*.07);y=.94*s;r=.016*s;x.beginPath();x.moveTo(X,y-r);x.lineTo(X+r,y);x.lineTo(X,y+r);x.lineTo(X-r,y);x.closePath();x.fillStyle=k===idx?C.a:C.p;x.fill();x.stroke()}}
function frame(t){raf=0;var dt=Math.min(t-last,50)/16.667,rm=mq.matches,busy=0,i;last=t;
for(i=0;i<4;i++){if(t>=due[i]||rm)ev[i]=tv[i];else busy=1;
if(rm){v[i]=ev[i];vv[i]=0;pr[i]=tp[i]}else{vv[i]+=(ev[i]-v[i])*.05*dt;vv[i]*=Math.pow(.84,dt);v[i]+=vv[i]*dt;pr[i]+=(tp[i]-pr[i])*(1-Math.pow(.8,dt))}
if(Math.abs(ev[i]-v[i])>.0005||Math.abs(vv[i])>.0005||Math.abs(tp[i]-pr[i])>.003)busy=1}
draw();if(busy&&!D.hidden)raf=requestAnimationFrame(frame)}
function wake(){if(raf||D.hidden)return;last=performance.now();raf=requestAnimationFrame(frame)}
function size(){W=Math.max(1,st.clientWidth);dpr=Math.min(window.devicePixelRatio||1,2);cv.width=cv.height=Math.round(W*dpr);draw()}
function theme(t){R.setAttribute('data-theme',t);col();draw()}
function near(e){var b=st.getBoundingClientRect(),u=(e.clientX-b.left)/b.width,i;for(i=0;i<4;i++){tp[i]=Math.pow(Math.max(0,1-Math.abs(u-(.5+(i-1.5)*.215))/.2),2)}wake()}
function out(){tp=[0,0,0,0];wake()}
st.addEventListener('pointermove',near);st.addEventListener('pointerdown',near);st.addEventListener('pointerleave',out);st.addEventListener('pointercancel',out);
st.addEventListener('pointerup',function(e){if(e.pointerType==='touch')out()});
st.addEventListener('click',function(){go((idx+1)%3)});
st.addEventListener('keydown',function(e){var d=e.key==='ArrowRight'||e.key==='ArrowUp'?1:e.key==='ArrowLeft'||e.key==='ArrowDown'?2:0;if(!d)return;e.preventDefault();go((idx+d)%3)});
D.addEventListener('visibilitychange',function(){if(D.hidden){if(raf){cancelAnimationFrame(raf);raf=0}}else{draw();wake()}});
window.addEventListener('message',function(e){var m=e.data;if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark'))theme(m.theme)});
if(window.ResizeObserver)new ResizeObserver(size).observe(st);else window.addEventListener('resize',size);
col();size();go(0,1);

var demoEnabled=window.__foreverPreview?.demoEnabled!==false,demoClock=0;
function demoStep(){if(!demoEnabled||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;go((idx+1)%3);}
function demoStop(){if(demoClock){clearInterval(demoClock);demoClock=0}}
function demoStart(){demoStop();if(demoEnabled&&!document.hidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches)demoClock=setInterval(demoStep,1600)}
function takeover(){if(window.__foreverPreview?.surface==='wall')return;demoEnabled=false;demoStop()}
window.addEventListener('forever:interactive',takeover);
var stage=document.querySelector('.wkf-stage');
stage.addEventListener('pointerdown',takeover,true);stage.addEventListener('keydown',takeover,true);stage.addEventListener('input',takeover,true);stage.addEventListener('wheel',takeover,{capture:true,passive:true});
document.addEventListener('visibilitychange',function(){document.hidden?demoStop():demoStart()});
var demoMotion=matchMedia('(prefers-reduced-motion: reduce)');demoMotion.addEventListener('change',function(){demoStart();wake()});
demoStart();
})();
</script>
</body>
</html>
