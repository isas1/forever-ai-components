<style>

:root{--wkg-p:#15130F;--wkg-i:#E9E2D0;--wkg-a:#D0705A}
:root[data-theme="light"]{--wkg-p:#EFE8D8;--wkg-i:#1E1B16;--wkg-a:#7A2E22}

.wkg-stage,.wkg-stage *{box-sizing:border-box;margin:0}

.wkg-stage{background:var(--wkg-p);display:grid;place-items:center;overflow:hidden}
#wkg-st{width:min(92vmin,640px);aspect-ratio:1;touch-action:none;cursor:ew-resize;user-select:none;-webkit-user-select:none}
#wkg-st:focus-visible{outline:2px solid var(--wkg-a);outline-offset:4px}
#wkg-cv{width:100%;height:100%;display:block}

:root{--bg:var(--wkg-p)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
.wkg-stage{width:100%;height:100%;display:grid;place-items:center}
.wkg-cap{position:fixed;left:8px;bottom:7px;font:10px/1.2 system-ui,sans-serif;color:var(--wkg-i);opacity:.45;pointer-events:none}


</style>

<body>
<div class="wkg-stage" role="group" aria-label="KPI Tile Scrub">
<div id="wkg-st" role="slider" tabindex="0" aria-label="Tile field: scrub sideways to switch day and compare KPI values" aria-valuemin="0" aria-valuemax="2" aria-valuenow="0"><canvas id="wkg-cv"></canvas></div>
</div>
<div class="wkg-cap" aria-hidden="true">KPI Tile Scrub</div>
<script>
(function(){
var D=document,R=D.documentElement,st=D.getElementById('wkg-st'),cv=D.getElementById('wkg-cv'),x=cv.getContext('2d'),PI=Math.PI,
S=[[84.5,1420,342,18],[72.4,980,215,34],[92.1,2150,580,6]],N=['Monday','Friday','Forever'],M=[100,2150,580,34],
rk=[],o=[],cur=[],tgt=[],due=[],an=[],dv=[0,0,0,0],tv=[0,0,0,0],p=0,tp=0,vp=0,idx=-1,drag=0,px0=0,pt0=0,mv=0,
W=300,dpr=1,C={},raf=0,last=0,seed=7,c,j,t,mq=matchMedia('(prefers-reduced-motion: reduce)');
function rnd(){seed=seed*16807%2147483647;return seed/2147483647}
for(c=0;c<100;c++){rk[c]=c;o[c]=rnd()<.5?0:1;cur[c]=0;tgt[c]=0;due[c]=0;an[c]=-1}
for(c=99;c>0;c--){j=Math.floor(rnd()*(c+1));t=rk[c];rk[c]=rk[j];rk[j]=t}
function col(){var s=getComputedStyle(R);C.p=s.getPropertyValue('--wkg-p').trim();C.i=s.getPropertyValue('--wkg-i').trim();C.a=s.getPropertyValue('--wkg-a').trim()}
function sync(){var k=Math.min(2,Math.max(0,Math.round(drag?p:tp))),dir=k-idx,L,ink,now=performance.now(),q,b=mq.matches;if(k===idx)return;
idx=k;L=S[k][3];ink=Math.min(100-L,Math.round(S[k][0]));
for(c=0;c<100;c++){q=rk[c]<L?2:rk[c]<L+ink?1:0;if(q!==tgt[c]){tgt[c]=q;due[c]=now+(dir>=0?c%10:9-c%10)*38+Math.floor(c/10)*6;if(b)cur[c]=q}}
for(c=0;c<4;c++)tv[c]=S[k][c]/M[c];
st.setAttribute('aria-valuenow',k);st.setAttribute('aria-valuetext',N[k]+': focus '+S[k][0]+' percent, '+S[k][1]+' commits, '+S[k][2]+' ounces of coffee, '+S[k][3]+' bugs')}
function cell(X,Y,z,s,q,od){var r=z/2;x.save();x.translate(X+r,Y+r);x.scale(s,1);x.translate(-r,-r);
if(q===0){x.globalAlpha=.35;x.fillStyle=C.i;x.beginPath();x.arc(r,r,1.5*dpr,0,2*PI);x.fill()}
else{x.strokeStyle=q===2?C.a:C.i;x.lineWidth=(q===2?2.6:1.5)*dpr;x.beginPath();
if(od){x.arc(z,0,r,PI/2,PI);x.moveTo(0,z-r);x.arc(0,z,r,-PI/2,0)}else{x.arc(0,0,r,0,PI/2);x.moveTo(z-r,z);x.arc(z,z,r,PI,1.5*PI)}x.stroke()}
x.restore()}
function fmt(i){var q=Math.max(0,dv[i]*M[i]);return i<1?Math.min(100,q).toFixed(1)+'%':i<2?Math.round(q).toLocaleString('en-US'):i<3?Math.round(q)+' oz':''+Math.round(q)}
function draw(){var s=W*dpr,z=.066*s,x0=(s-10*z)/2,y0=.05*s,i,e,q,xt,ty=.93*s,pp=Math.min(2.2,Math.max(-.2,p)),h;
x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,s,s);x.globalAlpha=1;x.lineJoin='miter';
for(c=0;c<100;c++){e=an[c]>=0?Math.abs(Math.cos(an[c]*PI)):1;cell(x0+c%10*z,y0+Math.floor(c/10)*z,z,Math.max(.02,e),cur[c],o[c])}
x.font='700 '+(.056*s)+'px ui-monospace,Menlo,monospace';x.textAlign='center';x.textBaseline='middle';
for(i=0;i<4;i++){x.fillStyle=i===3?C.a:C.i;x.fillText(fmt(i),s*(.125+.25*i),.805*s)}
x.strokeStyle=C.i;x.lineWidth=1.5*dpr;x.globalAlpha=.5;x.beginPath();x.moveTo(.2*s,ty);x.lineTo(.8*s,ty);x.stroke();x.globalAlpha=1;
for(i=0;i<3;i++){xt=(.2+.3*i)*s;h=.012*s;x.beginPath();x.moveTo(xt,ty-h);x.lineTo(xt+h,ty);x.lineTo(xt,ty+h);x.lineTo(xt-h,ty);x.closePath();x.stroke()}
xt=(.2+.3*pp)*s;h=.026*s;x.beginPath();x.moveTo(xt,ty-h);x.lineTo(xt+h,ty);x.lineTo(xt,ty+h);x.lineTo(xt-h,ty);x.closePath();x.fillStyle=C.a;x.fill()}
function frame(now){raf=0;var dt=Math.min(now-last,50)/16.667,rm=mq.matches,busy=0,i;last=now;
if(!drag){if(rm)p=tp;else p+=(tp-p)*(1-Math.pow(.84,dt));if(Math.abs(tp-p)>.002)busy=1;else p=tp}else busy=1;
sync();
for(c=0;c<100;c++){if(an[c]>=0){an[c]+=dt/16;if(an[c]>=.5&&cur[c]!==tgt[c]){cur[c]=tgt[c];o[c]^=1}if(an[c]>=1)an[c]=-1}
if(an[c]<0&&cur[c]!==tgt[c]){if(rm)cur[c]=tgt[c];else if(now>=due[c])an[c]=0}
if(an[c]>=0||cur[c]!==tgt[c])busy=1}
for(i=0;i<4;i++){if(rm)dv[i]=tv[i];else dv[i]+=(tv[i]-dv[i])*(1-Math.pow(.88,dt));if(Math.abs(tv[i]-dv[i])>.0005)busy=1}
draw();if(busy&&!D.hidden)raf=requestAnimationFrame(frame)}
function wake(){if(raf||D.hidden)return;last=performance.now();raf=requestAnimationFrame(frame)}
function size(){W=Math.max(1,st.clientWidth);dpr=Math.min(window.devicePixelRatio||1,2);cv.width=cv.height=Math.round(W*dpr);draw()}
function theme(q){R.setAttribute('data-theme',q);col();draw()}
st.addEventListener('pointerdown',function(e){drag=1;mv=0;px0=e.clientX;pt0=e.timeStamp;vp=0;try{st.setPointerCapture(e.pointerId)}catch(_){}wake()});
st.addEventListener('pointermove',function(e){if(!drag)return;var d=e.clientX-px0,m=Math.max(1,e.timeStamp-pt0);px0=e.clientX;pt0=e.timeStamp;mv+=Math.abs(d);
p=Math.min(2.2,Math.max(-.2,p+d/(W*.4)));vp=vp*.5+d/(W*.4)/m*8.333;wake()});
function up(e){if(!drag)return;drag=0;var b=st.getBoundingClientRect();
if(mv<4&&e&&e.clientY-b.top>.85*b.height)tp=Math.min(2,Math.max(0,Math.round(((e.clientX-b.left)/b.width-.2)/.3)));
else tp=Math.min(2,Math.max(0,Math.round(p+vp*10)));wake()}
st.addEventListener('pointerup',up);st.addEventListener('pointercancel',function(){up()});
st.addEventListener('keydown',function(e){var d=e.key==='ArrowRight'||e.key==='ArrowUp'?1:e.key==='ArrowLeft'||e.key==='ArrowDown'?-1:0;if(!d)return;e.preventDefault();tp=Math.min(2,Math.max(0,Math.round(tp)+d));wake()});
D.addEventListener('visibilitychange',function(){if(D.hidden){if(raf){cancelAnimationFrame(raf);raf=0}}else{draw();wake()}});
window.addEventListener('message',function(e){var m=e.data;if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark'))theme(m.theme)});
if(window.ResizeObserver)new ResizeObserver(size).observe(st);else window.addEventListener('resize',size);
col();size();sync();wake();

var demoEnabled=window.__foreverPreview?.demoEnabled!==false,demoClock=0;
function demoStep(){if(!demoEnabled||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;tp=(idx+1)%3;wake();}
function demoStop(){if(demoClock){clearInterval(demoClock);demoClock=0}}
function demoStart(){demoStop();if(demoEnabled&&!document.hidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches)demoClock=setInterval(demoStep,1600)}
function takeover(){if(window.__foreverPreview?.surface==='wall')return;demoEnabled=false;demoStop()}
window.addEventListener('forever:interactive',takeover);
var stage=document.querySelector('.wkg-stage');
stage.addEventListener('pointerdown',takeover,true);stage.addEventListener('keydown',takeover,true);stage.addEventListener('input',takeover,true);stage.addEventListener('wheel',takeover,{capture:true,passive:true});
document.addEventListener('visibilitychange',function(){document.hidden?demoStop():demoStart()});
var demoMotion=matchMedia('(prefers-reduced-motion: reduce)');demoMotion.addEventListener('change',function(){demoStart();wake()});
demoStart();
})();
</script>
</body>
</html>
