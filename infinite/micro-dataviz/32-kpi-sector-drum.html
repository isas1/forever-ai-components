<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="KPI Sector Drum — Micro Data-Viz. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KPI Sector Drum</title>
<meta name="forever-preview-lifecycle" content="demo-v1">
<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})();</script>
<style>

:root{--wkh-p:#15130F;--wkh-i:#E9E2D0;--wkh-a:#D0705A}
:root[data-theme="light"]{--wkh-p:#EFE8D8;--wkh-i:#1E1B16;--wkh-a:#7A2E22}

.wkh-stage,.wkh-stage *{box-sizing:border-box;margin:0}

.wkh-stage{background:var(--wkh-p);display:grid;place-items:center;overflow:hidden}
#wkh-st{width:min(92vmin,640px);aspect-ratio:1;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#wkh-st:active{cursor:grabbing}
#wkh-st:focus-visible{outline:2px solid var(--wkh-a);outline-offset:4px}
#wkh-cv{width:100%;height:100%;display:block}

:root{--bg:var(--wkh-p)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
.wkh-stage{width:100%;height:100%;display:grid;place-items:center}
.wkh-cap{position:fixed;left:8px;bottom:7px;font:10px/1.2 system-ui,sans-serif;color:var(--wkh-i);opacity:.45;pointer-events:none}


</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/micro-dataviz/32-kpi-sector-drum.html",
 "title": "KPI Sector Drum",
 "description": "KPI Sector Drum compares focus, commits, coffee ounces and bugs across Monday, Friday and Forever in a parchment and clay tessellation palette.",
 "useWhen": "A compact comparison of illustrative metrics across selectable days.",
 "avoidWhen": "Financial reporting without replacing the sample data and adding accessible data tables.",
 "agentPrompt": "Adapt content through existing data arrays; retain named palette, controls and demo-v1 lifecycle.",
 "editableAreas": [
  "Dark/light palette tokens",
  "Sample data and visible labels",
  "Animation timing and geometry"
 ],
 "preserveElements": [
  "IIFE and namespaced CSS/IDs",
  "Initial Manual mode; sticky first-input takeover",
  "Theme URL/message hook; redraw canvas palette",
  "Keyboard/focus/live status; reduced motion; hidden pause"
 ],
 "knownLimitations": [
  "Illustrative data; local state resets on remount.",
  "Canvas/SVG labels scale with artwork; inspect readability at small sizes."
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready",
  "mobile-ready"
 ],
 "tags": [
  "kpi",
  "day-comparison",
  "metrics",
  "spring",
  "data-visualization"
 ]
}
</script>
</head>
<body>
<div class="wkh-stage" role="group" aria-label="KPI Sector Drum">
<div id="wkh-st" role="slider" tabindex="0" aria-orientation="vertical" aria-label="Sector drum: fling up or down to switch day and compare KPI values" aria-valuemin="0" aria-valuemax="2" aria-valuenow="0"><canvas id="wkh-cv"></canvas></div>
</div>
<div class="wkh-cap" aria-hidden="true">KPI Sector Drum</div>
<script>
(function(){
var D=document,R=D.documentElement,st=D.getElementById('wkh-st'),cv=D.getElementById('wkh-cv'),x=cv.getContext('2d'),PI=Math.PI,
S=[[84.5,1420,342,18],[72.4,980,215,34],[92.1,2150,580,6]],N=['Monday','Friday','Forever'],
pos=-.9,v=0,key=null,drag=0,py0=0,pt0=0,idx=-1,W=300,dpr=1,C={},raf=0,last=0,mq=matchMedia('(prefers-reduced-motion: reduce)');
function col(){var s=getComputedStyle(R);C.p=s.getPropertyValue('--wkh-p').trim();C.i=s.getPropertyValue('--wkh-i').trim();C.a=s.getPropertyValue('--wkh-a').trim()}
function md(j){return(j%3+3)%3}
function sync(){var k=md(Math.round(pos));if(k===idx)return;idx=k;st.setAttribute('aria-valuenow',k);
st.setAttribute('aria-valuetext',N[k]+': focus '+S[k][0]+' percent, '+S[k][1]+' commits, '+S[k][2]+' ounces of coffee, '+S[k][3]+' bugs')}
function draw(){var s=W*dpr,c=s/2,Rr=.44*s,fw=.8*s,fh=Rr,j,th,f=[],i,d,k,tx=[-.2,.2,-.2,.2],ty=[-.085,-.085,.085,.085],tt;
x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,s,s);x.lineJoin='miter';x.textAlign='center';x.textBaseline='middle';
for(j=Math.floor(pos)-3;j<=Math.floor(pos)+4;j++){th=(j-pos)*PI/3;if(Math.cos(th)>.05)f.push([j,th,Math.cos(th)])}
f.sort(function(a,b){return a[2]-b[2]});
for(i=0;i<f.length;i++){d=f[i];k=md(d[0]);tt=[S[k][0].toFixed(1)+'%',S[k][1].toLocaleString('en-US'),S[k][2]+' oz',''+S[k][3]];
x.save();x.translate(c,c+Rr*.866*Math.sin(d[1]));x.scale(1,d[2]);
x.fillStyle=C.p;x.fillRect(-fw/2,-fh/2,fw,fh);x.strokeStyle=C.i;x.lineWidth=1.5*dpr;x.strokeRect(-fw/2,-fh/2,fw,fh);
x.globalAlpha=.4;x.strokeRect(-fw/2+7*dpr,-fh/2+7*dpr,fw-14*dpr,fh-14*dpr);x.beginPath();x.moveTo(0,-fh/2+7*dpr);x.lineTo(0,fh/2-7*dpr);x.moveTo(-fw/2+7*dpr,0);x.lineTo(fw/2-7*dpr,0);x.stroke();x.globalAlpha=1;
x.font='700 '+(.095*s)+'px ui-monospace,Menlo,monospace';
for(j=0;j<4;j++){x.fillStyle=j===3?C.a:C.i;x.fillText(tt[j],tx[j]*s,ty[j]*s)}
x.globalAlpha=(1-d[2])*.4;x.fillStyle=C.i;x.fillRect(-fw/2,-fh/2,fw,fh);x.restore()}}
function frame(t){raf=0;var dt=Math.min(t-last,50)/16.667,rm=mq.matches,busy=0;last=t;
if(drag)busy=1;
else if(key!==null){if(rm)pos=key;else pos+=(key-pos)*(1-Math.pow(.86,dt));if(Math.abs(key-pos)<.002){pos=key;key=null;v=0}else busy=1}
else if(rm){pos=Math.round(pos+v*8);v=0}
else{v-=Math.sin(2*PI*pos)*.006*dt;v*=Math.pow(.92,dt);pos+=v*dt;if(Math.abs(v)>.0008||Math.abs(pos-Math.round(pos))>.0008)busy=1;else{pos=Math.round(pos);v=0}}
sync();draw();if(busy&&!D.hidden)raf=requestAnimationFrame(frame)}
function wake(){if(raf||D.hidden)return;last=performance.now();raf=requestAnimationFrame(frame)}
function size(){W=Math.max(1,st.clientWidth);dpr=Math.min(window.devicePixelRatio||1,2);cv.width=cv.height=Math.round(W*dpr);draw()}
function theme(q){R.setAttribute('data-theme',q);col();draw()}
st.addEventListener('pointerdown',function(e){drag=1;key=null;py0=e.clientY;pt0=e.timeStamp;v=0;try{st.setPointerCapture(e.pointerId)}catch(_){}wake()});
st.addEventListener('pointermove',function(e){if(!drag)return;var d=-(e.clientY-py0)/(W*.34),m=Math.max(1,e.timeStamp-pt0);py0=e.clientY;pt0=e.timeStamp;pos+=d;v=v*.5+d/m*8.333;wake()});
function up(){if(!drag)return;drag=0;v=Math.max(-.3,Math.min(.3,v));wake()}
st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
st.addEventListener('wheel',function(e){e.preventDefault();key=null;v=Math.max(-.25,Math.min(.25,v+e.deltaY*.0005));wake()},{passive:false});
st.addEventListener('keydown',function(e){var d=e.key==='ArrowDown'||e.key==='ArrowRight'?1:e.key==='ArrowUp'||e.key==='ArrowLeft'?-1:0;if(!d)return;e.preventDefault();key=Math.round(key===null?pos:key)+d;v=0;wake()});
D.addEventListener('visibilitychange',function(){if(D.hidden){if(raf){cancelAnimationFrame(raf);raf=0}}else{draw();wake()}});
window.addEventListener('message',function(e){var m=e.data;if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark'))theme(m.theme)});
if(window.ResizeObserver)new ResizeObserver(size).observe(st);else window.addEventListener('resize',size);
col();size();sync();key=0;wake();

var demoEnabled=window.__foreverPreview?.demoEnabled!==false,demoClock=0;
function demoStep(){if(!demoEnabled||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;key=Math.round(pos)+1;v=0;wake();}
function demoStop(){if(demoClock){clearInterval(demoClock);demoClock=0}}
function demoStart(){demoStop();if(demoEnabled&&!document.hidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches)demoClock=setInterval(demoStep,1600)}
function takeover(){if(window.__foreverPreview?.surface==='wall')return;demoEnabled=false;demoStop()}
window.addEventListener('forever:interactive',takeover);
var stage=document.querySelector('.wkh-stage');
stage.addEventListener('pointerdown',takeover,true);stage.addEventListener('keydown',takeover,true);stage.addEventListener('input',takeover,true);stage.addEventListener('wheel',takeover,{capture:true,passive:true});
document.addEventListener('visibilitychange',function(){document.hidden?demoStop():demoStart()});
var demoMotion=matchMedia('(prefers-reduced-motion: reduce)');demoMotion.addEventListener('change',function(){demoStart();wake()});
demoStart();
})();
</script>
</body>
</html>
