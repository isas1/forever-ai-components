<script>
(function(){
var D=[["Monday",84.5,1420,342,18],["Friday",72.4,980,215,34],["Forever",92.1,2150,580,6]],M=[100,2150,580,40];
var $=function(i){return document.getElementById(i)},svg=$('wkj-s'),th=$('wkj-t'),nm=$('wkj-n'),bs=[],vs=[];
for(var k=0;k<4;k++){bs.push($('wkj-b'+k));vs.push($('wkj-v'+k))}
var s=0,v=0,goal=null,drag=false,px=0,lt=0,raf=0,last=0,mq=matchMedia('(prefers-reduced-motion: reduce)');
function cl(x){return Math.min(2,Math.max(0,x))}
function fmt(k,x){return k==0?x.toFixed(1)+'%':k==1?Math.round(x).toLocaleString('en'):Math.round(x)+(k==2?' oz':'')}
function near(){return goal!==null?goal:Math.round(cl(s))}

for(k=0;k<4;k++){x=A[k+1]+(B[k+1]-A[k+1])*f;len=Math.max(9,x/M[k]*84);bs[k].setAttribute('width',len.toFixed(2));vs[k].setAttribute('x',(8+len-3).toFixed(2));vs[k].textContent=fmt(k,x)}

v*=Math.pow(.93,dt);s+=v*dt;

draw();return true}

function tick(n){raf=0;var dt=Math.min(n-last,50)/16.667;last=n;if(step(dt))raf=requestAnimationFrame(tick)}
