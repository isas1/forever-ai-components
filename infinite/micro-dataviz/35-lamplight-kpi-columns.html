<script>
(function(){
var D=[["Monday",84.5,1420,342,18],["Friday",72.4,980,215,34],["Forever",92.1,2150,580,6]],M=[100,2150,580,40],NS='http://www.w3.org/2000/svg';
var svg=document.getElementById('wkk-s'),C=[],t=[1/3,1/3,1/3],vt=[0,0,0],fi=0,raf=0,last=0,mq=matchMedia('(prefers-reduced-motion: reduce)');

function fmt(k,x){return k==0?x.toFixed(1)+'%':k==1?Math.round(x).toLocaleString('en'):Math.round(x)+(k==2?' oz':'')}
D.forEach(function(d,i){var g=el(svg,'g','wkk-c'),o={g:g,bars:[],txt:[]},bg,k,bt;
g.setAttribute('role','radio');g.setAttribute('aria-label',d[0]+': focus '+d[1]+'%, '+d[2]+' commits, '+d[3]+' oz of coffee, '+d[4]+' bugs');
g.setAttribute('tabindex',i?-1:0);g.setAttribute('aria-checked',i?'false':'true');
o.f=el(g,'rect','wkk-f');o.f.setAttribute('y',3);o.f.setAttribute('height',94);o.f.setAttribute('rx',2);
bg=el(g,'g');bg.setAttribute('filter','url(#wkk-b)');
for(k=0;k<4;k++){o.bars.push(el(bg,'rect','wkk-bar'+(k==3?' wkk-o':'')));bt=el(g,'text','wkk-tx');bt.textContent=fmt(k,d[k+1]);o.txt.push(bt)}
o.nm=el(g,'text','wkk-nm');o.nm.textContent=d[0];
g.addEventListener('pointerdown',function(){pick(i,false)});
g.addEventListener('keydown',function(e){var n=-1;
if(e.key==='ArrowRight'||e.key==='ArrowDown')n=(i+1)%3;else if(e.key==='ArrowLeft'||e.key==='ArrowUp')n=(i+2)%3;else if(e.key==='Enter'||e.key===' ')n=i;
if(n>=0){e.preventDefault();pick(n,true)}});
C.push(o)});
function pick(i,f){fi=i;C.forEach(function(o,j){o.g.setAttribute('aria-checked',j==i?'true':'false');o.g.setAttribute('tabindex',j==i?0:-1)});if(f)C[i].g.focus();wake()}
function draw(){var x=2,i,k,o,w,u,bw,cx;
for(i=0;i<3;i++){o=C[i];w=Math.max(8,16+44*t[i]);u=Math.min(1,Math.max(0,t[i]));o.f.setAttribute('x',x.toFixed(2));o.f.setAttribute('width',w.toFixed(2));
bw=Math.max(.5,(w-5)/4);
for(k=0;k<4;k++){var h=D[i][k+1]/M[k]*52*(.7+.3*t[i]);cx=x+2.5+k*bw+bw/2;
o.bars[k].setAttribute('x',(cx-bw*.31).toFixed(2));o.bars[k].setAttribute('width',(bw*.62).toFixed(2));o.bars[k].setAttribute('y',(72-h).toFixed(2));o.bars[k].setAttribute('height',h.toFixed(2));
o.txt[k].setAttribute('x',cx.toFixed(2));o.txt[k].setAttribute('y',9);o.txt[k].style.opacity=u*u}
cx=x+w/2;o.nm.setAttribute('x',cx.toFixed(2));o.nm.setAttribute('y',88);o.nm.setAttribute('transform','rotate('+(-90*(1-u)).toFixed(1)+' '+cx.toFixed(2)+' 86.5)');
x+=w+2}}
function step(dt){var i,m=false,g;
for(i=0;i<3;i++){g=i==fi?1:0;
if(mq.matches){t[i]=g;vt[i]=0}else{vt[i]+=(g-t[i])*.06*dt;vt[i]*=Math.pow(.72,dt);t[i]+=vt[i]*dt;
if(Math.abs(vt[i])<.0005&&Math.abs(g-t[i])<.0008){t[i]=g;vt[i]=0}else m=true}}
