<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Rounded dark hamburger button whose three lines spring-morph into a glowing teal X when toggled.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hamburger Morph</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract);
     the light re-theme is the [data-theme="light"] block */
  :root{
    --bg:#0d0f16; --glow-a:rgba(34,174,195,0.16);
    --bg-surface:#1c2030;
    --text-0:#f4f6fb;
    --accent-iris:#22AEC3;
    --border-soft:rgba(255,255,255,0.07);
    --border-mid:rgba(255,255,255,0.12);
    --border-glow:rgba(34,174,195,0.45);
    --glow-iris:0 0 0 1px var(--border-glow),0 8px 40px -8px rgba(34,174,195,0.45);
    --ease-out-soft:cubic-bezier(0.22,1,0.36,1);
    --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
    --dur-fast:160ms;--dur-base:280ms;
    --cap:#fff; --cap-o:.28;
  }
  :root[data-theme="light"]{
    --bg:#f2f4f8; --glow-a:rgba(23,120,134,0.12);
    --bg-surface:#ffffff;
    --text-0:#1b2130;
    --accent-iris:#177886;
    --border-soft:rgba(0,0,0,0.08);
    --border-mid:rgba(0,0,0,0.14);
    --border-glow:rgba(23,120,134,0.5);
    --glow-iris:0 0 0 1px var(--border-glow),0 8px 40px -8px rgba(23,120,134,0.28);
    --cap:#152026; --cap-o:.5;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:var(--bg);
    background-image:radial-gradient(60vw 40vw at 15% -10%,var(--glow-a),transparent 60%);
    display:grid;place-items:center;
  }
  .c02-burger{
    position:relative;width:84px;height:84px;
    border:1px solid var(--border-soft);border-radius:14px;
    background:var(--bg-surface);cursor:pointer;padding:0;
    transition:border-color var(--dur-base) var(--ease-out-soft),box-shadow var(--dur-base) var(--ease-out-soft);
  }
  .c02-burger:hover{border-color:var(--border-mid)}
  .c02-burger.c02-burger--on{border-color:var(--border-glow);box-shadow:var(--glow-iris)}
  .c02-burger__line{
    position:absolute;left:50%;top:50%;
    width:36px;height:3px;border-radius:3px;
    background:var(--text-0);transform:translate(-50%,-50%);
    transition:transform var(--dur-base) var(--ease-spring),opacity var(--dur-fast) var(--ease-out-soft),background var(--dur-base);
  }
  .c02-burger__line:nth-child(1){transform:translate(-50%,-11px)}
  .c02-burger__line:nth-child(3){transform:translate(-50%,9px)}
  .c02-burger--on .c02-burger__line{background:var(--accent-iris)}
  .c02-burger--on .c02-burger__line:nth-child(1){transform:translate(-50%,-50%) rotate(45deg)}
  .c02-burger--on .c02-burger__line:nth-child(2){opacity:0;transform:translate(-50%,-50%) scaleX(0.3)}
  .c02-burger--on .c02-burger__line:nth-child(3){transform:translate(-50%,-50%) rotate(-45deg)}
  .cap{position:fixed;left:8px;bottom:7px;font-size:10px;letter-spacing:.08em;color:var(--cap);opacity:var(--cap-o);text-transform:uppercase;font-family:system-ui,sans-serif}
  @media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}
</style>

 ],

</head>
<body>
<button class="c02-burger" id="c02-burger" aria-label="Toggle menu" aria-pressed="false">
  <span class="c02-burger__line"></span>
  <span class="c02-burger__line"></span>
  <span class="c02-burger__line"></span>
</button>
<div class="cap">Hamburger Morph</div>
<script>
(function(){
  var b=document.getElementById('c02-burger');
  if(!b)return;
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  /* live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'} */
  addEventListener('message',function(e){
    var d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
      document.documentElement.setAttribute('data-theme',d.theme);
    }
  });
  function set(on){
    b.classList.toggle('c02-burger--on',on);
    b.setAttribute('aria-pressed',on?'true':'false');
  }
  /* idle demo: nobody clicks a tile on the wall, so the button works itself - the lines
     morph to an X at ~0.4s, hold ~1.7s, snap back, and the cycle repeats every DEMO_EVERY
     ms. A real click takes over; the demo resumes after RESUME ms without input. */
  var TICK=100,DEMO_EVERY=3500,OPEN_AT=300,CLOSE_AT=2000,RESUME=3600;
  var demo=!reduce,t=0,idle=0,timer=0;
  b.addEventListener('click',function(){
    demo=false;idle=0;set(!b.classList.contains('c02-burger--on'));
  });
  function tick(){
    if(!demo){idle+=TICK;if(idle>=RESUME){demo=true;t=0;}return;}
    var want=t>=OPEN_AT&&t<CLOSE_AT;
    if(want!==b.classList.contains('c02-burger--on'))set(want);
    t+=TICK;if(t>=DEMO_EVERY)t=0;
  }
  function start(){if(!timer&&!reduce)timer=setInterval(tick,TICK);}
  function stop(){clearInterval(timer);timer=0;}
  document.addEventListener('visibilitychange',function(){document.hidden?stop():start();});
  start();   /* reduced motion: no demo loop - the button rests closed */
})();
</script>
</body>
</html>
