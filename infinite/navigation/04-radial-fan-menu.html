<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="A circular core button rotates to an X and fans five glowing stone-toned icon petals outward in a spring arc, auto-opening and closing.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radial Fan Menu</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract);
     the light re-theme is the [data-theme="light"] block */
  :root{
    --bg:#0d0f16; --glow-a:rgba(80,126,149,0.14);
    --bg-700:#12141d;
    --bg-surface:#1c2030;
    --text-0:#f4f6fb;
    --accent-iris:#507E95;
    --accent-cyan:#857C74;
    --border-soft:rgba(255,255,255,0.07);
    --border-glow:rgba(80,126,149,0.45);
    --glow-iris:0 0 0 1px var(--border-glow),0 8px 40px -8px rgba(80,126,149,0.45);
    --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
    --ease-out-soft:cubic-bezier(0.22,1,0.36,1);
    --dur-base:280ms;
    --cap:#fff; --cap-o:.28;
  }
  :root[data-theme="light"]{
    --bg:#f2f4f8; --glow-a:rgba(73,115,136,0.10);
    --bg-700:#eef1f6;
    --bg-surface:#ffffff;
    --text-0:#1b2130;
    --accent-iris:#497388;
    --accent-cyan:#756d66;
    --border-soft:rgba(0,0,0,0.08);
    --border-glow:rgba(73,115,136,0.55);
    --glow-iris:0 0 0 1px var(--border-glow),0 8px 40px -8px rgba(73,115,136,0.28);
    --cap:#1c2420; --cap-o:.5;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:var(--bg);
    background-image:radial-gradient(60vw 40vw at 50% 110%,var(--glow-a),transparent 60%);
    display:grid;place-items:center;
  }
  .c04-radial{position:relative;width:190px;height:190px;display:flex;align-items:center;justify-content:center}
  .c04-radial__core{
    position:relative;z-index:3;width:64px;height:64px;border-radius:50%;
    border:1px solid var(--border-glow);background:var(--bg-surface);color:var(--text-0);
    font-size:30px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform var(--dur-base) var(--ease-spring),box-shadow var(--dur-base),background var(--dur-base);
  }
  .c04-radial--open .c04-radial__core{transform:rotate(135deg);background:var(--accent-iris);box-shadow:var(--glow-iris)}
  .c04-radial__petal{
    position:absolute;width:46px;height:46px;border-radius:50%;
    border:1px solid var(--border-soft);background:var(--bg-700);color:var(--accent-cyan);
    display:flex;align-items:center;justify-content:center;font-size:18px;
    transform:translate(0,0) scale(0.2);opacity:0;pointer-events:none;
    transition:transform 460ms var(--ease-spring),opacity var(--dur-base) var(--ease-out-soft);
  }
  .c04-radial--open .c04-radial__petal{opacity:1;pointer-events:auto}
  .c04-radial--open .c04-radial__petal:hover{border-color:var(--border-glow);color:var(--accent-iris)}
  .cap{position:fixed;left:8px;bottom:7px;font-size:10px;letter-spacing:.08em;color:var(--cap);opacity:var(--cap-o);text-transform:uppercase;font-family:system-ui,sans-serif}
  @media (prefers-reduced-motion:reduce){.c04-radial__core,.c04-radial__petal{transition-duration:.001ms!important}}
</style>

<body>
<div class="c04-radial" id="c04-radial">
  <button class="c04-radial__core" aria-label="Open menu">+</button>
  <button class="c04-radial__petal" aria-label="Star">&#9733;</button>
  <button class="c04-radial__petal" aria-label="Heart">&#9829;</button>
  <button class="c04-radial__petal" aria-label="Bolt">&#9889;</button>
  <button class="c04-radial__petal" aria-label="Bell">&#9873;</button>
  <button class="c04-radial__petal" aria-label="Pin">&#9678;</button>
</div>
<div class="cap">Radial Fan Menu</div>
<script>
(function(){
  var root=document.getElementById('c04-radial');
  if(!root)return;
  var core=root.querySelector('.c04-radial__core');
  var petals=Array.prototype.slice.call(root.querySelectorAll('.c04-radial__petal'));
  var R=66,start=-150,end=-30,n=petals.length;
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  /* live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'} */
  addEventListener('message',function(e){
    var d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
      document.documentElement.setAttribute('data-theme',d.theme);
    }
  });
  petals.forEach(function(p,i){
    var t=n===1?0.5:i/(n-1);
    var ang=(start+(end-start)*t)*Math.PI/180;
    p.dataset.x=(Math.cos(ang)*R).toFixed(1);
    p.dataset.y=(Math.sin(ang)*R).toFixed(1);
  });
  function setOpen(open){
    root.classList.toggle('c04-radial--open',open);
    petals.forEach(function(p,i){
      if(open){
        p.style.transitionDelay=(i*45)+'ms';
        p.style.transform='translate('+p.dataset.x+'px,'+p.dataset.y+'px) scale(1)';
      }else{
        p.style.transitionDelay=((n-i)*30)+'ms';
        p.style.transform='translate(0,0) scale(0.2)';
      }
    });
  }
  /* idle demo: a closed fan is a single dot on the wall, so it works itself - petals fan
     out at ~0.2s, hold ~1.9s, retract, and the cycle repeats every DEMO_EVERY ms. A real
     click takes over; the demo resumes after RESUME ms without input. */
  var TICK=100,DEMO_EVERY=3500,OPEN_AT=100,CLOSE_AT=2100,RESUME=3600;
  var demo=!reduce,t=0,idle=0,timer=0;
  core.addEventListener('click',function(){
    demo=false;idle=0;setOpen(!root.classList.contains('c04-radial--open'));
  });
  function tick(){
    if(!demo){idle+=TICK;if(idle>=RESUME){demo=true;t=0;}return;}
    var want=t>=OPEN_AT&&t<CLOSE_AT;
    if(want!==root.classList.contains('c04-radial--open'))setOpen(want);
    t+=TICK;if(t>=DEMO_EVERY)t=0;
  }
  function run(){if(!timer&&!reduce)timer=setInterval(tick,TICK);}   /* 'start' is the arc angle */
  function halt(){clearInterval(timer);timer=0;}
  document.addEventListener('visibilitychange',function(){document.hidden?halt():run();});
  if(reduce)setOpen(true);   /* reduced motion: hold one open state, no loop */
  else run();
})();
</script>
</body>
</html>
