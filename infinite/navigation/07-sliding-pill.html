<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="A segmented Day/Week/Month toggle where a glowing translucent pill springs between options on a dark rounded bar.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sliding Pill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract);
     the light re-theme is the [data-theme="light"] block */
  :root{
    --bg:#0d0f16; --glow-a:rgba(43,171,107,0.16);
    --bg-surface:#1c2030;
    --text-0:#f4f6fb;
    --text-2:#8a91a8;
    --accent-iris-dim:rgba(43,171,107,0.16);
    --border-soft:rgba(255,255,255,0.07);
    --border-glow:rgba(43,171,107,0.45);
    --glow-cyan:0 0 32px -6px rgba(43,171,107,0.5);
    --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
    --ease-out-soft:cubic-bezier(0.22,1,0.36,1);
    --dur-base:280ms;
    --cap:#fff; --cap-o:.28;
  }
  :root[data-theme="light"]{
    --bg:#f2f4f8; --glow-a:rgba(32,126,79,0.10);
    --bg-surface:#ffffff;
    --text-0:#1b2130;
    --text-2:#5b6178;
    --accent-iris-dim:rgba(32,126,79,0.14);
    --border-soft:rgba(0,0,0,0.08);
    --border-glow:rgba(32,126,79,0.55);
    --glow-cyan:0 0 24px -8px rgba(32,126,79,0.35);
    --cap:#152018; --cap-o:.5;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:var(--bg);
    background-image:radial-gradient(60vw 40vw at 15% -10%,var(--glow-a),transparent 60%);
    font-family:"Inter",system-ui,sans-serif;
    display:grid;place-items:center;
  }
  .c07-pill{
    position:relative;display:flex;gap:2px;padding:5px;
    background:var(--bg-surface);
    border:1px solid var(--border-soft);border-radius:999px;
  }
  .c07-pill__glide{
    position:absolute;top:5px;left:5px;height:calc(100% - 10px);
    border-radius:999px;background:var(--accent-iris-dim);
    border:1px solid var(--border-glow);box-shadow:var(--glow-cyan);
    transition:transform 440ms var(--ease-spring),width 440ms var(--ease-spring);
    z-index:0;
  }
  .c07-pill__btn{
    position:relative;z-index:1;border:0;background:none;
    font-family:"Inter",system-ui,sans-serif;font-size:14px;font-weight:500;
    color:var(--text-2);padding:9px 17px;cursor:pointer;border-radius:999px;
    transition:color var(--dur-base) var(--ease-out-soft);
  }
  .c07-pill__btn--active{color:var(--text-0)}
  .cap{position:fixed;left:8px;bottom:7px;font-size:10px;letter-spacing:.08em;color:var(--cap);opacity:var(--cap-o);text-transform:uppercase}
  @media (prefers-reduced-motion:reduce){.c07-pill__glide{transition-duration:.001ms!important}}
</style>
<script type="application/json" id="forever-agent-meta">

 "editableAreas": [

  "accent glow color (--glow-cyan / --border-glow)",
  "auto-cycle interval (1700ms)",

 ],

 ],

</head>
<body>
<div class="c07-pill" id="c07-pill">
  <span class="c07-pill__glide" id="c07-glide"></span>
  <button class="c07-pill__btn c07-pill__btn--active">Day</button>
  <button class="c07-pill__btn">Week</button>
  <button class="c07-pill__btn">Month</button>
</div>
<div class="cap">Sliding Pill</div>
<script>
(function(){
  var pill=document.getElementById('c07-pill');
  if(!pill)return;
  var glide=document.getElementById('c07-glide');
  var btns=Array.prototype.slice.call(pill.querySelectorAll('.c07-pill__btn'));
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  /* live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'} */
  addEventListener('message',function(e){
    var d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
      document.documentElement.setAttribute('data-theme',d.theme);
    }
  });
  function move(btn){
    btns.forEach(function(x){x.classList.remove('c07-pill__btn--active');});
    btn.classList.add('c07-pill__btn--active');
    glide.style.width=btn.offsetWidth+'px';
    glide.style.transform='translateX('+(btn.offsetLeft-5)+'px)';
  }
  btns.forEach(function(btn){btn.addEventListener('click',function(){move(btn);});});
  requestAnimationFrame(function(){move(btns[0]);});
  /* autonomous idle: cycle the active segment */
  var i=0,timer;
  function loop(){
    if(reduce)return;
    timer=setTimeout(function(){i=(i+1)%btns.length;move(btns[i]);loop();},1700);
  }
  function stop(){clearTimeout(timer);}
  document.addEventListener('visibilitychange',function(){document.hidden?stop():loop();});
  loop();
})();
</script>
</body>
</html>
