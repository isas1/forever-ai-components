<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="A Cmd+K command palette that opens over a blurred overlay, auto-types search queries, filters command rows, and highlights selections.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Command Palette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script>/* theme hook: canvas loads with ?theme=light|dark; runs before first paint. Standalone stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  /* theme tokens — dark defaults; light re-theme is the [data-theme="light"] block */
  :root{
    --bg:#0d0f16; --glow-a:rgba(232,171,48,0.16); --bg-700:#12141d; --bg-surface:#1c2030;
    --text-0:#f4f6fb; --text-1:#c7ccdb; --text-2:#8a91a8; --text-3:#565d73;
    --accent-iris-dim:rgba(232,171,48,0.16); --accent-cyan:#C09C59;
    --border-soft:rgba(255,255,255,0.07); --border-mid:rgba(255,255,255,0.12); --border-glow:rgba(232,171,48,0.45);
    --glow-iris:0 0 0 1px var(--border-glow),0 8px 40px -8px rgba(232,171,48,0.45);
    --shadow-lift:0 18px 50px -24px rgba(0,0,0,0.9);
    --overlay:rgba(8,9,13,0.62); --kbd-bg:rgba(255,255,255,0.05);
    --ease-spring:cubic-bezier(0.34,1.56,0.64,1); --ease-out-soft:cubic-bezier(0.22,1,0.36,1);
    --dur-fast:160ms;--dur-base:280ms; --cap:#fff; --cap-o:.28;
  }
  :root[data-theme="light"]{
    --bg:#f2f4f8; --glow-a:rgba(146,103,16,0.10); --bg-700:#eef1f6; --bg-surface:#ffffff;
    --text-0:#1b2130; --text-1:#333a4d; --text-2:#5b6178; --text-3:#868ca0;
    --accent-iris-dim:rgba(146,103,16,0.14); --accent-cyan:#896b34;
    --border-soft:rgba(0,0,0,0.08); --border-mid:rgba(0,0,0,0.14); --border-glow:rgba(146,103,16,0.55);
    --glow-iris:0 0 0 1px var(--border-glow),0 8px 40px -8px rgba(146,103,16,0.25);
    --shadow-lift:0 18px 40px -24px rgba(0,0,0,0.2);
    --overlay:rgba(15,15,20,0.35); --kbd-bg:rgba(0,0,0,0.06);
    --cap:#241a0a; --cap-o:.5;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:var(--bg);
    background-image:radial-gradient(60vw 40vw at 15% -10%,var(--glow-a),transparent 60%);
    font-family:"Inter",system-ui,sans-serif;
    display:grid;place-items:center;padding:16px;
  }
  .c10-cmd{position:relative;width:100%;max-width:300px}
  .c10-cmd__trigger{
    width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;
    background:var(--bg-surface);border:1px solid var(--border-soft);border-radius:14px;
    color:var(--text-2);font-family:"Inter",system-ui,sans-serif;font-size:14px;cursor:pointer;
    transition:border-color var(--dur-base);
  }
  .c10-cmd__trigger:hover{border-color:var(--border-mid)}
  .c10-cmd__trigger kbd{
    margin-left:auto;font-family:"Inter",system-ui,sans-serif;font-size:11px;
    padding:2px 7px;border-radius:5px;background:var(--kbd-bg);
    border:1px solid var(--border-soft);color:var(--text-3);
  }
  .c10-cmd__overlay{
    position:fixed;inset:0;background:var(--overlay);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    display:flex;align-items:flex-start;justify-content:center;padding-top:14%;
    opacity:0;pointer-events:none;
    transition:opacity var(--dur-base) var(--ease-out-soft);z-index:5;
  }
  .c10-cmd--open .c10-cmd__overlay{opacity:1;pointer-events:auto}
  .c10-cmd__panel{
    width:86%;max-width:300px;background:var(--bg-700);
    border:1px solid var(--border-glow);border-radius:14px;
    box-shadow:var(--glow-iris),var(--shadow-lift);overflow:hidden;
    transform:translateY(-10px) scale(0.96);opacity:0;
    transition:transform var(--dur-base) var(--ease-spring),opacity var(--dur-base) var(--ease-out-soft);
  }
  .c10-cmd--open .c10-cmd__panel{transform:translateY(0) scale(1);opacity:1}
  .c10-cmd__input{
    width:100%;border:0;border-bottom:1px solid var(--border-soft);background:none;
    padding:12px 14px;color:var(--text-0);font-family:"Inter",system-ui,sans-serif;
    font-size:14px;outline:none;
  }
  .c10-cmd__input::placeholder{color:var(--text-3)}
  .c10-cmd__list{list-style:none;margin:0;padding:6px;max-height:150px;overflow-y:auto}
  .c10-cmd__row{
    display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;
    font-size:13px;color:var(--text-1);cursor:pointer;transition:background var(--dur-fast);
  }
  .c10-cmd__row .c10-cmd__ico{color:var(--accent-cyan);font-size:14px;width:16px;text-align:center}
  .c10-cmd__row--sel,.c10-cmd__row:hover{background:var(--accent-iris-dim);color:var(--text-0)}
  .c10-cmd__empty{padding:14px;font-size:12px;color:var(--text-3);text-align:center}
  .cap{position:fixed;left:8px;bottom:7px;font-size:10px;letter-spacing:.08em;color:var(--cap);opacity:var(--cap-o);text-transform:uppercase;z-index:9}
  @media (prefers-reduced-motion:reduce){.c10-cmd__overlay,.c10-cmd__panel{transition-duration:.001ms!important}}
</style>
<script type="application/json" id="forever-agent-meta">

 "avoidWhen": "Simple sites with fewer than 5 commands — the modal overhead outweighs the UX benefit. Auto-cycle must be removed before production use.",

 ],

  "minimal-deps",
  "light-ready"

</head>
<body>
<div class="c10-cmd" id="c10-cmd">
  <button class="c10-cmd__trigger" id="c10-trigger">
    <span>&#9906;</span> Search commands <kbd>&#8984;K</kbd>
  </button>
  <div class="c10-cmd__overlay" id="c10-overlay">
    <div class="c10-cmd__panel">
      <input class="c10-cmd__input" id="c10-input" type="text" placeholder="Type a command...">
      <ul class="c10-cmd__list" id="c10-list"></ul>
    </div>
  </div>
</div>
<div class="cap">Command Palette</div>
<script>
(function(){
  var root=document.getElementById('c10-cmd');
  if(!root)return;
  var trigger=document.getElementById('c10-trigger');
  var overlay=document.getElementById('c10-overlay');
  var input=document.getElementById('c10-input');
  var list=document.getElementById('c10-list');
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  /* live re-theme: canvas broadcasts {type:'forever:theme', theme:'light'|'dark'} */
  addEventListener('message',function(e){
    var d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark'))document.documentElement.setAttribute('data-theme',d.theme);
  });
  var commands=[
    {i:'⊕',t:'New Project'},
    {i:'✎',t:'Rename Workspace'},
    {i:'☆',t:'Add to Favorites'},
    {i:'↻',t:'Sync Library'},
    {i:'⚙',t:'Open Settings'},
    {i:'↗',t:'Share Link'},
    {i:'✕',t:'Archive Album'}
  ];
  var sel=0,filtered=commands.slice();
  function render(){
    list.innerHTML='';
    if(!filtered.length){
      var e=document.createElement('div');
      e.className='c10-cmd__empty';e.textContent='No commands found';
      list.appendChild(e);return;
    }
    filtered.forEach(function(c,idx){
      var li=document.createElement('li');
      li.className='c10-cmd__row'+(idx===sel?' c10-cmd__row--sel':'');
      li.innerHTML='<span class="c10-cmd__ico">'+c.i+'</span>'+c.t;
      li.addEventListener('click',function(){close();});
      li.addEventListener('mouseenter',function(){
        sel=idx;
        Array.prototype.forEach.call(list.children,function(x,j){
          x.classList.toggle('c10-cmd__row--sel',j===sel);
        });
      });
      list.appendChild(li);
    });
  }
  function filter(){
    var q=input.value.trim().toLowerCase();
    filtered=commands.filter(function(c){return c.t.toLowerCase().indexOf(q)!==-1;});
    sel=0;render();
  }
  function open(){
    root.classList.add('c10-cmd--open');
    input.value='';filtered=commands.slice();sel=0;render();
    setTimeout(function(){try{input.focus();}catch(_){}},60);
  }
  function close(){root.classList.remove('c10-cmd--open');}
  trigger.addEventListener('click',open);
  overlay.addEventListener('click',function(e){if(e.target===overlay)close();});
  input.addEventListener('input',filter);
  input.addEventListener('keydown',function(e){
    if(e.key==='Escape'){close();return;}
    if(!filtered.length)return;
    if(e.key==='ArrowDown'){e.preventDefault();sel=(sel+1)%filtered.length;render();}
    else if(e.key==='ArrowUp'){e.preventDefault();sel=(sel-1+filtered.length)%filtered.length;render();}
    else if(e.key==='Enter'){e.preventDefault();close();}
  });

  /* idle demo: nobody types into a tile on the wall, so the palette drives itself - it opens,
     walks the selection down, types a query through the same filter() the real input uses,
     clears it, closes. Real input takes over; the demo resumes after RESUME ms of quiet. */
  var queries=['sync','set','share','arch','fav'];
  var TICK=100,DEMO_EVERY=4600,RESUME=3600;
  var demo=!reduce,qi=0,t=0,idle=0,timer=0;
  function type(s){input.value=s;filter();}
  function move(){if(filtered.length>1){sel=(sel+1)%filtered.length;render();}}
  function takeover(){demo=false;idle=0;}
  root.addEventListener('pointerdown',takeover,true);
  input.addEventListener('input',takeover);input.addEventListener('keydown',takeover);
  function tick(){
    if(!demo){idle+=TICK;if(idle>=RESUME){demo=true;t=0;close();}return;}
    var q=queries[qi];
    if(t===200)open();                                 /* panel in by ~0.6s */
    else if(t===900||t===1400)move();                  /* selection walks down */
    else if(t>=1900&&t<1900+q.length*TICK)type(q.slice(0,(t-1900)/TICK+1));
    else if(t===3400)type('');                         /* query clears */
    else if(t===3800)close();
    t+=TICK;if(t>=DEMO_EVERY){t=0;qi=(qi+1)%queries.length;}
  }
  function start(){if(!timer&&!reduce)timer=setInterval(tick,TICK);}  function stop(){clearInterval(timer);timer=0;}
  document.addEventListener('visibilitychange',function(){document.hidden?stop():start();});
  if(reduce){open();type(queries[0]);}   /* reduced motion: one static filtered state */
  else start();
})();
</script>
</body>
</html>
