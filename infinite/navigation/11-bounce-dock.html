<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="A frosted dock of five gradient tiles: launching one bounces it twice and lights a running dot beneath it; an idle clock keeps launching and quitting apps on its own.">
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bounce Dock</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract);
     the light re-theme is the [data-theme="light"] block */
  :root{
    --bg:#0d0f16; --glow:rgba(226,96,63,.16);
    --dock-bg:rgba(28,32,48,.62); --dock-hl:rgba(255,255,255,.07); --border:rgba(255,255,255,.08);
    --shadow:0 18px 50px -24px rgba(0,0,0,.9);
    --item-hl:rgba(255,255,255,.22); --item-sh:rgba(0,0,0,.6);
    --tip-bg:#1c2030; --tip-ink:#f4f6fb; --dot:#f4f6fb;
    --cap:#fff; --cap-o:.28;
    --g1:linear-gradient(150deg,#E2603F,#9c2f17);
    --g2:linear-gradient(150deg,#F0A36E,#c8632d);
    --g3:linear-gradient(150deg,#f4f6fb,#9aa1bd);
    --g4:linear-gradient(150deg,#5FB7A1,#237a68);
    --g5:linear-gradient(150deg,#E2603F,#E8AB30);
  }
  :root[data-theme="light"]{
    --bg:#f2f4f8; --glow:rgba(181,64,31,.10);
    --dock-bg:rgba(255,255,255,.66); --dock-hl:rgba(255,255,255,.8); --border:rgba(0,0,0,.08);
    --shadow:0 18px 40px -24px rgba(0,0,0,.18);
    --item-hl:rgba(255,255,255,.5); --item-sh:rgba(0,0,0,.16);
    --tip-bg:#1f2430; --tip-ink:#fff; --dot:#2a2f3d;
    --cap:#2a2013; --cap-o:.5;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:var(--bg);
    background-image:radial-gradient(60vw 40vw at 50% 110%,var(--glow),transparent 60%);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    display:grid;place-items:center;
  }
  .c11-dock{
    --sz:clamp(32px,14vmin,48px);
    display:flex;align-items:flex-end;gap:clamp(6px,2.5vmin,10px);
    padding:10px 12px 13px;
    background:var(--dock-bg);border:1px solid var(--border);border-radius:16px;
    box-shadow:inset 0 1px 0 var(--dock-hl),var(--shadow);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  .c11-item{
    position:relative;width:var(--sz);height:var(--sz);flex:0 0 auto;
    border:0;padding:0;border-radius:calc(var(--sz) * .27);cursor:pointer;
    box-shadow:0 4px 12px -4px var(--item-sh),inset 0 1px 0 var(--item-hl);
    transition:transform 180ms cubic-bezier(.22,1,.36,1);
  }
  .c11-item:nth-child(1){background:var(--g1)}
  .c11-item:nth-child(2){background:var(--g2)}
  .c11-item:nth-child(3){background:var(--g3)}
  .c11-item:nth-child(4){background:var(--g4)}
  .c11-item:nth-child(5){background:var(--g5)}
  .c11-item:hover,.c11-item:focus-visible{transform:translateY(-6px) scale(1.1);outline:none}
  /* the launch bounce: two hops, the second smaller — `animation` wins over the hover transform */
  .c11-item.c11-bouncing{animation:c11-bounce 1.15s cubic-bezier(.3,0,.2,1) 1}
  @keyframes c11-bounce{
    0%,100%{transform:translateY(0)}
    30%{transform:translateY(-30px)}
    52%{transform:translateY(0)}
    70%{transform:translateY(-12px)}
    86%{transform:translateY(0)}
  }
  /* running indicator */
  .c11-dot{
    position:absolute;left:50%;bottom:-9px;width:4px;height:4px;margin-left:-2px;border-radius:50%;
    background:var(--dot);opacity:0;transform:scale(.4);transition:opacity .25s,transform .25s;
  }
  .c11-item.c11-on .c11-dot{opacity:.9;transform:scale(1)}
  /* name tooltip */
  .c11-tip{
    position:absolute;left:50%;bottom:calc(100% + 12px);transform:translate(-50%,4px);
    padding:4px 9px;border-radius:7px;background:var(--tip-bg);color:var(--tip-ink);
    font-size:12px;font-weight:600;line-height:1.3;white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;
  }
  .c11-item:hover .c11-tip,.c11-item:focus-visible .c11-tip,.c11-item.c11-peek .c11-tip{opacity:1;transform:translate(-50%,0)}
  .c11-cap{position:fixed;left:8px;bottom:7px;font-size:10px;letter-spacing:.08em;color:var(--cap);opacity:var(--cap-o);text-transform:uppercase}
  @media (prefers-reduced-motion:reduce){.c11-item{transition:none}.c11-item.c11-bouncing{animation:none}}
@media(max-width:220px){.c11-dock{--sz:26px;gap:4px;padding:8px}}
</style>

<body>
<nav class="c11-dock" id="c11-dock" aria-label="Application dock">
  <button class="c11-item c11-on" type="button" aria-label="Files"><span class="c11-tip" aria-hidden="true">Files</span><span class="c11-dot"></span></button>
  <button class="c11-item" type="button" aria-label="Mail"><span class="c11-tip" aria-hidden="true">Mail</span><span class="c11-dot"></span></button>
  <button class="c11-item c11-on" type="button" aria-label="Notes"><span class="c11-tip" aria-hidden="true">Notes</span><span class="c11-dot"></span></button>
  <button class="c11-item" type="button" aria-label="Terminal"><span class="c11-tip" aria-hidden="true">Terminal</span><span class="c11-dot"></span></button>
  <button class="c11-item" type="button" aria-label="Music"><span class="c11-tip" aria-hidden="true">Music</span><span class="c11-dot"></span></button>
</nav>
<div class="c11-cap">Bounce Dock</div>
<script>
(function(){
  var dock=document.getElementById('c11-dock');
  if(!dock)return;
  var items=Array.prototype.slice.call(dock.querySelectorAll('.c11-item'));
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  /* live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'} */
  addEventListener('message',function(e){
    var d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
      document.documentElement.setAttribute('data-theme',d.theme);
    }
  });
  /* launch = bounce, then the running dot; a running app quits on the next press */
  function launch(it){
    if(it.classList.contains('c11-on')){it.classList.remove('c11-on');return;}
    if(!reduce){it.classList.remove('c11-bouncing');void it.offsetWidth;it.classList.add('c11-bouncing');}
    setTimeout(function(){it.classList.add('c11-on');},reduce?0:600);
  }
  var lastInput=0;
  items.forEach(function(it){
    it.addEventListener('click',function(){lastInput=Date.now();launch(it);});
    it.addEventListener('animationend',function(){it.classList.remove('c11-bouncing');});
  });
  dock.addEventListener('mousemove',function(){lastInput=Date.now();});
  /* autonomous idle: launch or quit an app every 1.8 s, hopping around the dock; a
     real hover or press pauses the demo for a few seconds, then it resumes */
  var i=1,timer=0,lead=0,DEMO_GAP=1800,demoEnabled=window.__foreverPreview?.demoEnabled!==false;
  function tick(){
    if(document.hidden||Date.now()-lastInput<3500)return;
    var it=items[i%items.length];i+=2;
    launch(it);
    it.classList.add('c11-peek');
    setTimeout(function(){it.classList.remove('c11-peek');},1100);
  }
  function start(){if(!timer&&demoEnabled){timer=setInterval(tick,DEMO_GAP);}}
  function stop(){if(timer){clearInterval(timer);timer=0;}clearTimeout(lead);}
  function takeover(){demoEnabled=false;stop();}
  window.addEventListener("forever:interactive",takeover);dock.addEventListener("pointerdown",takeover,true);dock.addEventListener("keydown",function(e){if(e.target.isContentEditable||e.key.length===1||/^(Enter| |Arrow|Escape|Home|End|Page)/.test(e.key))takeover();},true);
  document.addEventListener('visibilitychange',function(){document.hidden?stop():start();});
  if(demoEnabled){lead=setTimeout(tick,450);start();}          /* first hop lands inside the wall's first-sight window */
})();
</script>
</body>
