<style>
  .bg06-wrap, .bg06-wrap * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #000;
    color: #fff;
    font-family: 'Press Start 2P', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .bg06-wrap {
    width: 100%;
    max-width: 380px;
    background: #162450;
    border: 3px double #fff;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 6px 6px 0 #000;
    user-select: none;
  }
  .bg06-log {
    height: 38px;
    background: #101c40;
    border: 2px solid #fff;
    padding: 8px;
    font-size: 12px;
    line-height: 1.6;
    color: #fff;
    display: flex;
    align-items: center;
  }
  .bg06-menu-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .bg06-item {
    font-family:inherit;color:inherit;text-align:left;
    font-size: 12px;
    padding: 8px 10px;
    background: #101c40;
    border: 1.5px solid rgba(255, 255, 255, 0.4);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.1s ease;
  }
  .bg06-item:hover, .bg06-item.bg06-active {
    background: #fff;
    color: #162450;
    border-color: #fff;
  }
  .bg06-cursor {
    color: #FFCC00;
    visibility: hidden;
  }
  .bg06-item.bg06-active .bg06-cursor {
    visibility: visible;
  }
  .bg06-party-hud {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    background: #000066;
    padding: 6px 10px;
    border: 1px solid rgba(255, 255, 255, 0.3);
  }

.bg06-preset1{color:#00E8D8}
.bg06-preset2{color:#FFCC00}
.bg06-cap{position:fixed;left:10px;bottom:8px;font:10px system-ui;opacity:.55;pointer-events:none}
@media(prefers-reduced-motion:reduce){.bg06-wrap, .bg06-wrap *{animation:none!important;transition:none!important}}

.bg06-wrap[data-paused] *,.bg06-wrap[data-paused]{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){.bg06-wrap,.bg06-wrap *{animation:none!important;transition:none!important}}
@container fit-18-turn-based-combat-action-menu (max-width:300px){.bg06-wrap{width:calc(100% - 16px);padding:12px;gap:8px;box-shadow:3px 3px 0 #000}.bg06-log{font-size:11px}.bg06-menu-grid{gap:5px}.bg06-item{font-size:11px;padding:9px 5px}.bg06-party-hud{font-size:11px}.bg06-party-hud .bg06-preset2{display:none}}
body{width:100%;container-type:inline-size;container-name:fit-18-turn-based-combat-action-menu}
  .bg06-item:focus-visible{outline:2px solid #FFCC00;outline-offset:2px}
@container fit-18-turn-based-combat-action-menu (max-width:210px){.bg06-wrap{padding:6px;gap:5px}.bg06-menu-grid{gap:3px}.bg06-item{padding:7px 2px;gap:2px}.bg06-cursor{display:none}}

<body>
<div class="bg06-wrap" role="region" aria-label="Turn-Based Battle Menu">
  <div class="bg06-log" id="bg06-battleLog">
    > SLIME ATTACKS! READY?
  </div>

  <div class="bg06-menu-grid" id="bg06-menuGrid">
    <button type="button" class="bg06-item bg06-active" data-action="ATTACK">
      <span class="bg06-cursor">▶</span>
      <span>ATTACK</span>
    </button>
    <button type="button" class="bg06-item" data-action="MAGIC">
      <span class="bg06-cursor">▶</span>
      <span>MAGIC</span>
    </button>
    <button type="button" class="bg06-item" data-action="ITEM">
      <span class="bg06-cursor">▶</span>
      <span>ITEM</span>
    </button>
    <button type="button" class="bg06-item" data-action="RUN">
      <span class="bg06-cursor">▶</span>
      <span>RUN</span>
    </button>
  </div>

  <div class="bg06-party-hud">
    <span>SAM  LV12</span>
    <span class="bg06-preset1">HP 184/184</span>
    <span class="bg06-preset2">MP 42/42</span>
  </div>
</div>

<div class="bg06-cap" aria-hidden="true">JRPG Battle Menu</div>
<script>
(()=>{
  // Local frame lifecycle: stop hidden work, repaint reduced-motion state on input.
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const frames = new Map(), drivers = new Set(); let painting = false;
  function scheduleFrame(fn) {
    drivers.add(fn);
    if (document.hidden || frames.has(fn) || (motion.matches && painting)) return;
    frames.set(fn, requestAnimationFrame(t => {
      frames.delete(fn); if (document.hidden) return;
      painting = true; try { fn(t); } finally { painting = false; }
    }));
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { frames.forEach(cancelAnimationFrame); frames.clear(); }
    else drivers.forEach(scheduleFrame);
  });
  const repaint = () => { if (motion.matches) drivers.forEach(scheduleFrame); };
  ['click','input','pointermove'].forEach(type => document.addEventListener(type, repaint));
  motion.addEventListener('change', () => { reduce = motion.matches; drivers.forEach(scheduleFrame); });

  const tileRoot = document.querySelector('.bg06-wrap');
  const pauseCSS = () => tileRoot.toggleAttribute('data-paused', document.hidden);
  document.addEventListener('visibilitychange', pauseCSS); pauseCSS();

  let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const items = document.querySelectorAll('.bg06-item');
  const battleLog = document.getElementById('bg06-battleLog');

  const dialogs = {
    'ATTACK': '> SAM STRIKES WITH BROADSWORD! 42 DMG!',
    'MAGIC': '> SAM CASTS THUNDER BOLT! 98 DMG CRIT!',
    'ITEM': '> SAM USES HI-POTION! +50 HP RESTORED!',
    'RUN': '> CANNOT ESCAPE FROM BOSS BATTLE!'
  };

  items.forEach(it => {
    it.addEventListener('click', () => {
      items.forEach(i => i.classList.remove('bg06-active'));
      it.classList.add('bg06-active');
      activeIdx = [...items].indexOf(it);
      const act = it.getAttribute('data-action');
      battleLog.textContent = dialogs[act] || '> READY!';
    });
  });

  // Keyboard arrow keys
  let activeIdx = 0;
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      e.preventDefault();
      activeIdx = (activeIdx + 1) % items.length;
      items[activeIdx].click();
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault();
      activeIdx = (activeIdx - 1 + items.length) % items.length;
      items[activeIdx].click();
    }
  });
  let idleAt = 0, userUsed = false;
  const takeOver = () => { userUsed = true; };
  window.addEventListener("forever:interactive", takeOver);
  tileRoot.addEventListener("pointerdown", takeOver, true);
  tileRoot.addEventListener("keydown", e => { if (/^(Enter| |Arrow|Escape)/.test(e.key)) takeOver(); }, true);
  function idleDemo(now) {
    if (!reduce && !userUsed && now - idleAt > 4000) {
      idleAt = now;
      activeIdx = (activeIdx + 1) % items.length; items[activeIdx].click();
    }
    if (!userUsed) scheduleFrame(idleDemo);
  }
  scheduleFrame(idleDemo);

})();
</script>
</body>
