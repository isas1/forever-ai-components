<script>(()=>{const p=new URLSearchParams(location.search).get("theme");if(p==="light"||p==="dark")document.documentElement.dataset.theme=p})();window.addEventListener("message",e=>{if(e.data?.type==="forever:theme"&&(e.data.theme==="light"||e.data.theme==="dark"))document.documentElement.dataset.theme=e.data.theme});</script>
<style>
  :root {
    --bit-bg: #000000;
    --bit-card: #0A0D14;
    --bit-text: #FFFFFF;
    --bit-gold: #FFCC00;
    --bit-red: #E52521;
    --bit-border: #FFFFFF;
    --bit-shadow: #3C4252;
  }
  [data-theme="light"] {
    --bit-bg: #EAE6DF;
    --bit-card: #FFFFFF;
    --bit-text: #111111;
    --bit-gold: #C49000;
    --bit-red: #B81814;
    --bit-border: #111111;
    --bit-shadow: #A8A090;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bit-bg);
    color: var(--bit-text);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .bg08-root {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    position: relative;
    user-select: none;
  }
  .bg08-wheel-card {
    width: 100%;
    max-width: 350px;
    background: var(--bit-card);
    border: 3px solid var(--bit-border);
    box-shadow: 6px 6px 0 var(--bit-shadow);
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    position: relative;
  }
  .bg08-card-head {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--bit-border);
    padding-bottom: 6px;
    font-size: 12px;
    font-weight: 700;
  }
  .bg08-head-title {
    color: var(--bit-gold);
    letter-spacing: 0.05em;
  }
  .bg08-slots-count {
    font-size: 12px;
    color: var(--bit-shadow);
  }
  .bg08-wheel-viewport {
    position: relative;
    width: 170px;
    height: 170px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bg08-wheel-canvas {
    width: 170px;
    height: 170px;
    display: block;
  }
  .bg08-center-cursor {
    position: absolute;
    width: 38px;
    height: 38px;
    border: 2px dashed var(--bit-gold);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    pointer-events: none;
    box-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
  }
  .bg08-item-selector-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    width: 100%;
  }
  .bg08-item-btn {
    background: transparent;
    border: 2px solid var(--bit-border);
    color: var(--bit-text);
    padding: 6px 2px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    box-shadow: 2px 2px 0 var(--bit-shadow);
    transition: all 0.1s ease;
  }
  .bg08-item-btn:hover {
    background: var(--bit-text);
    color: #000000;
  }
  .bg08-item-btn.bg08-active {
    background: var(--bit-gold);
    color: #000000;
    border-color: var(--bit-gold);
    box-shadow: none;
    transform: translate(1px, 1px);
  }
  .bg08-dossier-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--bit-border);
    padding: 8px 10px;
    box-sizing: border-box;
    font-size: 12px;
  }
  .bg08-item-name {
    color: var(--bit-gold);
    font-weight: 700;
  }
  .bg08-caption {
    position: absolute;
    bottom: 8px;
    right: 12px;
    font-size: 10px;
    letter-spacing: 0.05em;
    color: var(--bit-gold);
    opacity: 0.65;
    pointer-events: none;
    font-family: ui-monospace, monospace;
  }


@media(prefers-reduced-motion:reduce){.bg08-root, .bg08-root *{animation:none!important;transition:none!important}}

.bg08-root[data-paused] *,.bg08-root[data-paused]{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){.bg08-root,.bg08-root *{animation:none!important;transition:none!important}}
@container fit-19-radial-dungeon-inventory-wheel (max-width:300px){.bg08-root{padding:8px}.bg08-wheel-card{width:calc(100% - 8px);padding:10px;gap:7px;box-shadow:3px 3px 0 var(--bit-shadow)}.bg08-card-head{font-size:11px}.bg08-wheel-viewport,.bg08-wheel-canvas{width:108px;height:108px}.bg08-center-cursor{font-size:20px}.bg08-item-selector-row{gap:3px}.bg08-item-btn{font-size:11px;padding:5px 3px}.bg08-dossier-bar{font-size:11px;padding:5px}.bg08-item-name{white-space:normal}.bg08-caption{display:none}}
@container fit-19-radial-dungeon-inventory-wheel (max-width:210px){.bg08-wheel-card{padding:8px;gap:5px}.bg08-card-head,.bg08-dossier-bar{display:none}.bg08-wheel-viewport,.bg08-wheel-canvas{width:84px;height:84px}.bg08-item-btn{font-size:11px;padding:5px 2px}.bg08-item-selector-row{grid-template-columns:1fr 1fr}}
body{width:100%;container-type:inline-size;container-name:fit-19-radial-dungeon-inventory-wheel}
  .bg08-item-btn:focus-visible{outline:2px solid var(--bit-red);outline-offset:3px}

<body>
<div class="bg08-root" role="region" aria-label="Radial Dungeon Inventory Wheel · 8-Bit Gaming Nav">
  <div class="bg08-wheel-card">
    <div class="bg08-card-head">
      <span class="bg08-head-title">RADIAL INVENTORY WHEEL</span>
      <span class="bg08-slots-count">SLOTS: 6/6</span>
    </div>

    <div class="bg08-wheel-viewport">
      <canvas class="bg08-wheel-canvas" id="bg08-canvas"></canvas>
      <div class="bg08-center-cursor" id="bg08-cur-icon">🗡️</div>
    </div>

    <div class="bg08-item-selector-row" id="bg08-item-btns">
      <button class="bg08-item-btn bg08-active" data-index="0" data-icon="🗡️">SWORD</button>
      <button class="bg08-item-btn" data-index="1" data-icon="💣">BOMB</button>
      <button class="bg08-item-btn" data-index="2" data-icon="🧪">POTION</button>
      <button class="bg08-item-btn" data-index="3" data-icon="🗝️">KEY</button>
    </div>

    <div class="bg08-dossier-bar">
      <span>EQUIPPED:</span>
      <span class="bg08-item-name" id="bg08-item-title">EMBER SWORD +2 · ATK 85</span>
    </div>
  </div>
</div>
<div class="bg08-caption" aria-hidden="true">Radial Inventory Wheel</div>

<script>
(()=>{
  // Local frame lifecycle: stop hidden work, repaint reduced-motion state on input.
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const frames = new Map(), drivers = new Set(); let painting = false;
  function scheduleFrame(fn) {
    drivers.add(fn);
    if (document.hidden || frames.has(fn) || (motion.matches && painting)) return;
    frames.set(fn, requestAnimationFrame(t => {
      frames.delete(fn); if (document.hidden) return;
      painting = true; try { fn(t); } finally { painting = false; }
    }));
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { frames.forEach(cancelAnimationFrame); frames.clear(); }
    else drivers.forEach(scheduleFrame);
  });
  const repaint = () => { if (motion.matches) drivers.forEach(scheduleFrame); };
  ['click','input','pointermove'].forEach(type => document.addEventListener(type, repaint));
  motion.addEventListener('change', () => { reduce = motion.matches; drivers.forEach(scheduleFrame); });

  const tileRoot = document.querySelector('.bg08-root');
  const pauseCSS = () => tileRoot.toggleAttribute('data-paused', document.hidden);
  document.addEventListener('visibilitychange', pauseCSS); pauseCSS();

  const items = [
    { name: "EMBER SWORD +2 · ATK 85", icon: "🗡️" },
    { name: "CHERRY BOMB x8 · BLAST 120", icon: "💣" },
    { name: "RED ELIXIR · FULL HP RESTORE", icon: "🧪" },
    { name: "SKELETON KEY · UNLOCKS LEVEL 4", icon: "🗝️" },
    { name: "BOOMERANG · STUNS MONSTERS", icon: "🪃" },
    { name: "LANTERN · REVEALS SECRET DOORS", icon: "🏮" }
  ];

  let activeIdx = 0;
  let angle = 0;
  let userInteracted = window.__foreverPreview?.demoEnabled === false;
  let running = true;
  let reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const canvas = document.getElementById("bg08-canvas");
  const ctx = canvas ? canvas.getContext("2d") : null;
  const buttons = document.querySelectorAll(".bg08-item-btn");
  const curIcon = document.getElementById("bg08-cur-icon");
  const itemTitle = document.getElementById("bg08-item-title");
  const takeOver = () => { userInteracted = true; };
  window.addEventListener("forever:interactive", takeOver);
  tileRoot.addEventListener("pointerdown", takeOver, true);
  tileRoot.addEventListener("keydown", e => { if (/^(Enter| |Arrow|Escape)/.test(e.key)) takeOver(); }, true);

  let w = 170, h = 170;
  function resize() {
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    w = canvas.clientWidth || 170;
    h = canvas.clientHeight || 170;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    if (ctx) ctx.scale(dpr, dpr);
  }
  resize();

  function selectItem(index) {
    activeIdx = index;
    buttons.forEach((b, i) => b.classList.toggle("bg08-active", i === index));
    const it = items[index];
    if (curIcon) curIcon.textContent = it.icon;
    if (itemTitle) itemTitle.textContent = it.name;
  }

  buttons.forEach(btn => {
    btn.addEventListener("click", () => {
      userInteracted = true;
      selectItem(parseInt(btn.getAttribute("data-index"), 10));
    });
  });

  function drawWheel() {
    if (!ctx) return;
    ctx.clearRect(0, 0, w, h);

    const cx = w / 2;
    const cy = h / 2;
    const r = w * 0.42;

    if (!reduce && !userInteracted) angle += 0.015;

    // Outer pixel octagonal ring
    const slots = items.length;
    for (let i = 0; i < slots; i++) {
      const a = (i * Math.PI * 2) / slots + angle;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;

      const isSel = i === activeIdx;

      // Slot box
      ctx.fillStyle = isSel ? "#FFCC00" : "#0A0D14";
      ctx.fillRect(x - 10, y - 10, 20, 20);
      ctx.strokeStyle = isSel ? "#FFFFFF" : "rgba(255, 255, 255, 0.4)";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(x - 10, y - 10, 20, 20);

      // Connecting spokes
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(x, y);
      ctx.strokeStyle = isSel ? "#FFCC00" : "rgba(255, 255, 255, 0.1)";
      ctx.lineWidth = isSel ? 2 : 1;
      ctx.stroke();
    }
  }

  let timer = 0;
  function loop() {
    if (!running) return;
    drawWheel();
    if (!reduce && !userInteracted) {
      timer++;
      if (timer > 200) {
        timer = 0;
        selectItem((activeIdx + 1) % buttons.length);
      }
    }
    if (!userInteracted) scheduleFrame(loop);
  }

  document.addEventListener("visibilitychange", () => {
    running = !document.hidden;
  });

  selectItem(0);
  scheduleFrame(loop);
})();
</script>
</body>
