<!DOCTYPE html>

<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})();</script>
<style>
:root[data-theme="light"]{--wra-bg:#fff;--wra-paper:#F6F2E8;--wra-ink:#181511;--wra-sunk:#F4F1EA;--wra-red:#E0312E;--wra-fd:Impact,-apple-system,"Segoe UI",Roboto,sans-serif}

:root{--wra-fd:Impact,-apple-system,"Segoe UI",Roboto,sans-serif;--wra-bg:#12100E;--wra-paper:#181511;--wra-ink:#F6F2E8;--wra-sunk:#221F1A;--wra-red:#FF4A47}

.wra-stage,.wra-stage *{box-sizing:border-box}
.wra-stage{margin:0;width:100%;height:100%;display:grid;place-items:center;background:var(--wra-bg);color:var(--wra-ink)}
.wra-root{position:relative;width:min(92vmin,640px);aspect-ratio:1;background:var(--wra-paper);border:2px solid var(--wra-ink);box-shadow:3px 3px 0 var(--wra-ink);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.wra-root:active{cursor:grabbing}
.wra-root:focus-visible{outline:2px solid var(--wra-red);outline-offset:4px}
.wra-c{position:absolute;inset:0;width:100%;height:100%;display:block}
.wra-n{position:absolute;left:7%;top:4%;font:900 clamp(56px,22vmin,150px)/1 var(--wra-fd);letter-spacing:-.02em;font-variant-numeric:tabular-nums;pointer-events:none}

:root{--bg:var(--wra-bg)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
.wra-stage{width:100%;height:100%;display:grid;place-items:center}
.wra-cap{position:fixed;left:8px;bottom:7px;font:10px/1.2 system-ui,sans-serif;color:var(--wra-ink);opacity:.45;pointer-events:none}


</style>

{

<body>
<div class="wra-stage" role="group" aria-label="Ridge Profile Route">
<div id="wra-root" class="wra-root" role="slider" tabindex="0" aria-label="Walking route checkpoints. Drag or use arrow keys." aria-valuemin="1" aria-valuemax="5" aria-valuenow="1" aria-valuetext="Checkpoint 1, 39 feet">
<canvas id="wra-c" class="wra-c" aria-hidden="true"></canvas>
<div id="wra-n" class="wra-n" aria-hidden="true">12</div>
</div>
</div>
<div class="wra-cap" aria-hidden="true">Ridge Profile Route</div>
<script>
(function(){
var E=[12,48,96,64,4],root=document.getElementById('wra-root'),cv=document.getElementById('wra-c'),nEl=document.getElementById('wra-n'),g=cv.getContext('2d');
var rm=matchMedia('(prefers-reduced-motion: reduce)'),C={},S=0,dpr=1;
var p=0,v=0,t=0,drag=false,pt=0,lp=0,lt=0,raf=0,last=0,shown=-1;
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function colors(){C={ink:css('--wra-ink'),paper:css('--wra-paper'),sunk:css('--wra-sunk'),red:css('--wra-red')}}
function setTheme(x){if(x!=='light'&&x!=='dark')return;document.documentElement.setAttribute('data-theme',x);colors();wake()}
addEventListener('message',function(e){if(e.data&&e.data.type==='forever:theme')setTheme(e.data.theme)});
function size(){var r=root.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);S=root.clientWidth;cv.width=cv.height=Math.round(S*dpr);wake()}
new ResizeObserver(size).observe(root);
function elev(q){var i=Math.min(3,Math.floor(q)),f=q-i;return E[i]+(E[i+1]-E[i])*f}
function X(q){return S*(.1+.8*q/4)}
function Y(e){return S*.86-e/100*S*.46}
function draw(){
 var s=S*dpr;g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,S,S);
 g.fillStyle=C.sunk;g.beginPath();g.moveTo(X(0),S*.86);
 for(var i=0;i<5;i++)g.lineTo(X(i),Y(E[i]));
 g.lineTo(X(4),S*.86);g.closePath();g.fill();
 g.strokeStyle=C.ink;g.lineWidth=Math.max(2,S*.008);g.lineJoin='miter';g.beginPath();
 for(i=0;i<5;i++)i?g.lineTo(X(i),Y(E[i])):g.moveTo(X(i),Y(E[i]));g.stroke();
 g.beginPath();g.moveTo(X(0),S*.86);g.lineTo(X(4),S*.86);g.stroke();
 var k=S*.03;
 for(i=0;i<5;i++){g.fillStyle=i<=p+.01?C.ink:C.paper;g.fillRect(X(i)-k/2,S*.86+k*.6,k,k);g.strokeRect(X(i)-k/2,S*.86+k*.6,k,k)}
 var mx=X(p),my=Y(elev(p)),m=S*.06;
 g.beginPath();g.moveTo(mx,my);g.lineTo(mx,S*.86);g.stroke();
 g.fillStyle=C.ink;g.fillRect(mx-m/2+3,my-m/2+3,m,m);
 g.fillStyle=C.red;g.fillRect(mx-m/2,my-m/2,m,m);g.strokeRect(mx-m/2,my-m/2,m,m);
 var n=Math.round(elev(p));
 if(n!==shown){shown=n;nEl.textContent=Math.round(n*3.28)}
 var c=Math.round(p)+1;
 if(+root.getAttribute('aria-valuenow')!==c){root.setAttribute('aria-valuenow',c);root.setAttribute('aria-valuetext','Checkpoint '+c+', '+Math.round(E[c-1]*3.28)+' feet')}
}
function step(dt){
 if(drag){var np=pt;v*=Math.pow(.6,dt);p+=(np-p)*(1-Math.pow(.6,dt));return false}
 if(rm.matches){p=t;v=0;return true}
 v+=(-.06*(p-t)-.2*v)*dt;p+=v*dt;
 if(p<0){p=0;v=0}if(p>4){p=4;v=0}
 if(Math.abs(p-t)<.002&&Math.abs(v)<.002){p=t;v=0;return true}
 return false;
}
function tick(now){raf=0;var dt=Math.min(now-last,50)/16.667;last=now;var done=step(dt);draw();if(!done)raf=requestAnimationFrame(tick)}
function wake(){if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(tick)}}
document.addEventListener('visibilitychange',function(){if(document.hidden){cancelAnimationFrame(raf);raf=0}else wake()});
function fromX(e){var r=root.getBoundingClientRect();return Math.max(0,Math.min(4,((e.clientX-r.left)/r.width-.1)/.8*4))}
root.addEventListener('pointerdown',function(e){drag=true;root.setPointerCapture(e.pointerId);pt=fromX(e);lp=pt;lt=performance.now();v=0;wake()});
root.addEventListener('pointermove',function(e){if(!drag)return;pt=fromX(e);var n=performance.now(),d=Math.max(n-lt,1)/16.667;v=v*.5+(pt-lp)/d*.5;lp=pt;lt=n;wake()});
function up(){if(!drag)return;drag=false;t=Math.max(0,Math.min(4,Math.round(p+v*9)));wake()}
root.addEventListener('pointerup',up);root.addEventListener('pointercancel',up);
root.addEventListener('keydown',function(e){var d={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1}[e.key];
 if(e.key==='Home')t=0;else if(e.key==='End')t=4;else if(d)t=Math.max(0,Math.min(4,Math.round(t)+d));else return;e.preventDefault();wake()});
colors();setTheme(document.documentElement.getAttribute('data-theme'));

var demoEnabled=window.__foreverPreview?.demoEnabled!==false,demoClock=0;
function demoStep(){if(!demoEnabled||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;t=(Math.round(t)+1)%5;wake();}
function demoStop(){if(demoClock){clearInterval(demoClock);demoClock=0}}
function demoStart(){demoStop();if(demoEnabled&&!document.hidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches)demoClock=setInterval(demoStep,1600)}
function takeover(){if(window.__foreverPreview?.surface==='wall')return;demoEnabled=false;demoStop()}
window.addEventListener('forever:interactive',takeover);
var stage=document.querySelector('.wra-stage');
stage.addEventListener('pointerdown',takeover,true);stage.addEventListener('keydown',takeover,true);stage.addEventListener('input',takeover,true);stage.addEventListener('wheel',takeover,{capture:true,passive:true});
document.addEventListener('visibilitychange',function(){document.hidden?demoStop():demoStart()});
var demoMotion=matchMedia('(prefers-reduced-motion: reduce)');demoMotion.addEventListener('change',function(){demoStart();wake()});
demoStart();
})();
</script>
</body>
</html>
