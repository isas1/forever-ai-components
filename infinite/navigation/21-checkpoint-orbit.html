<!DOCTYPE html>
<html lang="en">

<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})();</script>
<style>
:root[data-theme="light"]{--wrb-bg:#fff;--wrb-paper:#F6F2E8;--wrb-ink:#181511;--wrb-mid:#8C857A;--wrb-red:#E0312E;--wrb-fd:Impact,-apple-system,"Segoe UI",Roboto,sans-serif}

:root{--wrb-fd:Impact,-apple-system,"Segoe UI",Roboto,sans-serif;--wrb-bg:#12100E;--wrb-paper:#181511;--wrb-ink:#F6F2E8;--wrb-mid:#7A746B;--wrb-red:#FF4A47}

.wrb-stage,.wrb-stage *{box-sizing:border-box}
.wrb-stage{margin:0;width:100%;height:100%;display:grid;place-items:center;background:var(--wrb-bg);color:var(--wrb-ink)}
.wrb-root{position:relative;width:min(92vmin,640px);aspect-ratio:1;background:var(--wrb-paper);border:2px solid var(--wrb-ink);box-shadow:3px 3px 0 var(--wrb-ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
.wrb-root:focus-visible{outline:2px solid var(--wrb-red);outline-offset:4px}
.wrb-c{position:absolute;inset:0;width:100%;height:100%;display:block}

:root{--bg:var(--wrb-bg)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
.wrb-stage{width:100%;height:100%;display:grid;place-items:center}
.wrb-cap{position:fixed;left:8px;bottom:7px;font:10px/1.2 system-ui,sans-serif;color:var(--wrb-ink);opacity:.45;pointer-events:none}


</style>

<body>
<div class="wrb-stage" role="group" aria-label="Checkpoint Orbit">
<div id="wrb-root" class="wrb-root" role="slider" tabindex="0" aria-label="Walking route checkpoints. Tap a stop or use arrow keys." aria-valuemin="1" aria-valuemax="5" aria-valuenow="1" aria-valuetext="Checkpoint 1, 39 feet">
<canvas id="wrb-c" class="wrb-c" aria-hidden="true"></canvas>
</div>
</div>
<div class="wrb-cap" aria-hidden="true">Checkpoint Orbit</div>
<script>
(function(){
var E=[12,48,96,64,4],root=document.getElementById('wrb-root'),cv=document.getElementById('wrb-c'),g=cv.getContext('2d');
var rm=matchMedia('(prefers-reduced-motion: reduce)'),C={},S=0,dpr=1;
var a=0,v=0,t=0,raf=0,last=0,pop=0;
var A0=Math.PI*.75,SW=Math.PI*1.5;
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function colors(){C={ink:css('--wrb-ink'),paper:css('--wrb-paper'),mid:css('--wrb-mid'),red:css('--wrb-red'),fd:css('--wrb-fd')}}
function setTheme(x){if(x!=='light'&&x!=='dark')return;document.documentElement.setAttribute('data-theme',x);colors();wake()}
addEventListener('message',function(e){if(e.data&&e.data.type==='forever:theme')setTheme(e.data.theme)});
function size(){var r=root.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);S=root.clientWidth;cv.width=cv.height=Math.round(S*dpr);wake()}
new ResizeObserver(size).observe(root);
function th(q){return A0+SW*q/4}
function elev(q){q=Math.max(0,Math.min(4,q));var i=Math.min(3,Math.floor(q));return E[i]+(E[i+1]-E[i])*(q-i)}
function draw(){
 var R=S*.36,cx=S/2,cy=S/2,lw=Math.max(3,S*.012);
 g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,S,S);g.lineCap='butt';
 g.lineWidth=lw*.6;g.strokeStyle=C.mid;g.setLineDash([lw*1.5,lw*2]);
 g.beginPath();g.arc(cx,cy,R,th(a),th(4));g.stroke();g.setLineDash([]);
 g.lineWidth=lw*1.8;g.strokeStyle=C.red;g.beginPath();g.arc(cx,cy,R,th(0),th(a));g.stroke();
 g.lineWidth=2;
 for(var i=0;i<5;i++){
  var r=S*(.014+E[i]/100*.03),x=cx+Math.cos(th(i))*R,y=cy+Math.sin(th(i))*R;
  g.beginPath();g.arc(x,y,r,0,7);g.fillStyle=i<=a+.01?C.ink:C.paper;g.fill();g.strokeStyle=C.ink;g.stroke();
 }
 var sp=Math.min(Math.abs(v)*SW/4*R*3.2,R*.5),w=S*(.014+elev(a)/100*.03)+S*.012,
  px=cx+Math.cos(th(a))*R,py=cy+Math.sin(th(a))*R,ang=th(a)+Math.PI/2;
 g.save();g.translate(px,py);g.rotate(ang);
 g.beginPath();g.ellipse(3,3,w+sp,w,0,0,7);g.fillStyle=C.ink;g.fill();
 g.beginPath();g.ellipse(0,0,w+sp,w,0,0,7);g.fillStyle=C.red;g.fill();g.strokeStyle=C.ink;g.stroke();
 g.restore();
 var n=Math.round(a)+1,k=1+pop*.25;
 g.fillStyle=C.ink;g.textAlign='center';g.textBaseline='middle';g.font='900 '+(S*.3*k)+'px '+C.fd;
 g.fillText(n,cx,cy+S*.02);
 if(+root.getAttribute('aria-valuenow')!==n){root.setAttribute('aria-valuenow',n);root.setAttribute('aria-valuetext','Checkpoint '+n+', '+Math.round(E[n-1]*3.28)+' feet');pop=1}
}
function step(dt){
 if(rm.matches){a=t;v=0;pop=0;return true}
 v+=(-.045*(a-t)-.16*v)*dt;a+=v*dt;pop*=Math.pow(.82,dt);
 if(a<0){a=0;v=0}if(a>4){a=4;v=0}
 if(Math.abs(a-t)<.002&&Math.abs(v)<.002&&pop<.01){a=t;v=0;pop=0;return true}
 return false;
}
function tick(now){raf=0;var dt=Math.min(now-last,50)/16.667;last=now;var d=step(dt);draw();if(!d)raf=requestAnimationFrame(tick)}
function wake(){if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(tick)}}
document.addEventListener('visibilitychange',function(){if(document.hidden){cancelAnimationFrame(raf);raf=0}else wake()});
root.addEventListener('pointerdown',function(e){
 var r=root.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;
 if(Math.hypot(dx,dy)<r.width*.2){t=(Math.round(t)+1)%5;wake();return}
 var q=Math.atan2(dy,dx)-A0;q=(q+Math.PI*4)%(Math.PI*2);
 if(q>SW)q=q-SW<Math.PI*2-q?SW:0;
 t=Math.round(q/SW*4);wake();
});
root.addEventListener('keydown',function(e){var d={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1}[e.key];
 if(e.key==='Home')t=0;else if(e.key==='End')t=4;else if(d)t=Math.max(0,Math.min(4,Math.round(t)+d));else return;e.preventDefault();wake()});
colors();setTheme(document.documentElement.getAttribute('data-theme'));

var demoEnabled=window.__foreverPreview?.demoEnabled!==false,demoClock=0;
function demoStep(){if(!demoEnabled||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;t=(Math.round(t)+1)%5;wake();}
function demoStop(){if(demoClock){clearInterval(demoClock);demoClock=0}}
function demoStart(){demoStop();if(demoEnabled&&!document.hidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches)demoClock=setInterval(demoStep,1600)}
function takeover(){if(window.__foreverPreview?.surface==='wall')return;demoEnabled=false;demoStop()}
window.addEventListener('forever:interactive',takeover);
var stage=document.querySelector('.wrb-stage');
stage.addEventListener('pointerdown',takeover,true);stage.addEventListener('keydown',takeover,true);stage.addEventListener('input',takeover,true);stage.addEventListener('wheel',takeover,{capture:true,passive:true});
document.addEventListener('visibilitychange',function(){document.hidden?demoStop():demoStart()});
var demoMotion=matchMedia('(prefers-reduced-motion: reduce)');demoMotion.addEventListener('change',function(){demoStart();wake()});
demoStart();
})();
</script>
</body>
</html>
