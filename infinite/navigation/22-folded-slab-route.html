.wrc-stage{margin:0;width:100%;height:100%;display:grid;place-items:center;background:var(--wrc-bg);color:var(--wrc-ink)}
.wrc-root{width:min(92vmin,640px);aspect-ratio:1;display:flex;flex-direction:column;gap:6px;padding:6px;background:var(--wrc-paper);border:2px solid var(--wrc-ink);box-shadow:3px 3px 0 var(--wrc-ink);touch-action:manipulation}
.wrc-s{flex:1 1 0;min-height:0;position:relative;overflow:hidden;display:block;width:100%;padding:0;margin:0;background:var(--wrc-sunk);border:2px solid var(--wrc-ink);color:var(--wrc-ink);cursor:pointer;font:inherit;text-align:left;-webkit-tap-highlight-color:transparent}
.wrc-b{position:absolute;left:0;top:0;bottom:0;background:var(--wrc-ink);transform-origin:left;pointer-events:none}
.wrc-s[aria-selected="true"] .wrc-b{background:var(--wrc-red)}
.wrc-n{position:absolute;right:4%;top:50%;font:900 clamp(40px,16vmin,110px)/1 var(--wrc-fd);letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--wrc-ink);background:var(--wrc-paper);padding:0 .12em;border:2px solid var(--wrc-ink);opacity:0;pointer-events:none;transform-origin:right center}
.wrc-s:focus-visible{outline:2px solid var(--wrc-red);outline-offset:3px;z-index:1}

:root{--bg:var(--wrc-bg)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
.wrc-stage{width:100%;height:100%;display:grid;place-items:center}
.wrc-cap{position:fixed;left:8px;bottom:7px;font:10px/1.2 system-ui,sans-serif;color:var(--wrc-ink);opacity:.45;pointer-events:none}

<div class="wrc-stage" role="group" aria-label="Folded Slab Route">
<div id="wrc-root" class="wrc-root" role="tablist" aria-label="Walking route checkpoints. Hover, tap or use arrow keys."></div>
</div>
<div class="wrc-cap" aria-hidden="true">Folded Slab Route</div>
<script>
(function(){
var E=[12,48,96,64,4],root=document.getElementById('wrc-root'),rm=matchMedia('(prefers-reduced-motion: reduce)');
var W=[5,1,1,1,1],V=[0,0,0,0,0],t=0,raf=0,last=0,S=[],B=[],N=[];
for(var i=0;i<5;i++){
 var s=document.createElement('button');s.type='button';s.className='wrc-s';s.setAttribute('role','tab');
 s.setAttribute('aria-label','Checkpoint '+(i+1)+', '+Math.round(E[i]*3.28)+' feet');s.tabIndex=i?-1:0;
 var b=document.createElement('span');b.className='wrc-b';b.style.width=E[i]+'%';
 var n=document.createElement('span');n.className='wrc-n';n.textContent=Math.round(E[i]*3.28);n.style.transform='translateY(-50%)';
 s.appendChild(b);s.appendChild(n);root.appendChild(s);S.push(s);B.push(b);N.push(n);
 (function(k){s.addEventListener('click',function(){go(k)});s.addEventListener('focus',function(){go(k)})})(i);
}
function setTheme(x){if(x==='light'||x==='dark')document.documentElement.setAttribute('data-theme',x)}
addEventListener('message',function(e){if(e.data&&e.data.type==='forever:theme')setTheme(e.data.theme)});
function go(k){if(k===t&&S[k].getAttribute('aria-selected')==='true')return;t=k;
 for(var j=0;j<5;j++){S[j].setAttribute('aria-selected',j===k?'true':'false');S[j].tabIndex=j===k?0:-1}wake()}
function paint(){for(var j=0;j<5;j++){var f=Math.max(0,Math.min(1,(W[j]-1)/4));
 S[j].style.flexGrow=Math.max(W[j],.25);
 N[j].style.opacity=f;N[j].style.transform='translateY(-50%) scale('+(.5+.5*f)+')';
 B[j].style.opacity=j<=t?1:.35}}
function step(dt){var done=true;
 for(var j=0;j<5;j++){var g=j===t?5:1;
  if(rm.matches){W[j]=g;V[j]=0;continue}
  V[j]+=(-.05*(W[j]-g)-.15*V[j])*dt;W[j]+=V[j]*dt;
  if(Math.abs(W[j]-g)<.003&&Math.abs(V[j])<.003){W[j]=g;V[j]=0}else done=false}
 return done}
function tick(now){raf=0;var dt=Math.min(now-last,50)/16.667;last=now;var d=step(dt);paint();if(!d)raf=requestAnimationFrame(tick)}
function wake(){if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(tick)}}
document.addEventListener('visibilitychange',function(){if(document.hidden){cancelAnimationFrame(raf);raf=0}else wake()});
root.addEventListener('pointermove',function(e){if(e.pointerType==='touch')return;
 var r=root.getBoundingClientRect(),k=Math.max(0,Math.min(4,Math.floor((e.clientY-r.top)/r.height*5)));go(k)});
root.addEventListener('keydown',function(e){var d={ArrowDown:1,ArrowRight:1,ArrowUp:-1,ArrowLeft:-1}[e.key],k=t;
 if(e.key==='Home')k=0;else if(e.key==='End')k=4;else if(d)k=Math.max(0,Math.min(4,t+d));else return;
 e.preventDefault();go(k);S[k].focus()});
go(0);

var demoEnabled=window.__foreverPreview?.demoEnabled!==false,demoClock=0;
function demoStep(){if(!demoEnabled||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;go((t+1)%5);}
function demoStop(){if(demoClock){clearInterval(demoClock);demoClock=0}}
function demoStart(){demoStop();if(demoEnabled&&!document.hidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches)demoClock=setInterval(demoStep,1600)}
function takeover(){if(window.__foreverPreview?.surface==='wall')return;demoEnabled=false;demoStop()}
window.addEventListener('forever:interactive',takeover);
var stage=document.querySelector('.wrc-stage');
stage.addEventListener('pointerdown',takeover,true);stage.addEventListener('keydown',takeover,true);stage.addEventListener('input',takeover,true);stage.addEventListener('wheel',takeover,{capture:true,passive:true});
document.addEventListener('visibilitychange',function(){document.hidden?demoStop():demoStart()});
var demoMotion=matchMedia('(prefers-reduced-motion: reduce)');demoMotion.addEventListener('change',function(){demoStart();wake()});
demoStart();
})();
</script>
