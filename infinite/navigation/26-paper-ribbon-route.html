<style>

:root{--wrg-paper:#15130F;--wrg-ink:#E9E2D0;--wrg-mid:#8F8670;--wrg-acc:#C8745A}

.wrg-stage,.wrg-stage *{box-sizing:border-box;margin:0;padding:0}
.wrg-stage{width:100%;height:100%;display:grid;place-items:center;background:var(--wrg-paper);font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
#wrg-root{width:min(100vmin,640px);aspect-ratio:1;touch-action:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
#wrg-root:focus-visible{outline:2px solid var(--wrg-acc);outline-offset:-4px}
#wrg-c{display:block;width:100%;height:100%}

:root{--bg:var(--wrg-paper)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
.wrg-stage{width:100%;height:100%;display:grid;place-items:center}
.wrg-cap{position:fixed;left:8px;bottom:7px;font:10px/1.2 system-ui,sans-serif;color:var(--wrg-ink);opacity:.45;pointer-events:none}

<body>
<div class="wrg-stage" role="group" aria-label="Paper Ribbon Route">
<div id="wrg-root" role="slider" tabindex="0" aria-label="Route checkpoints as a folded paper ribbon; hover or tap a fold to open it, or use arrow keys, across 6 checkpoints" aria-orientation="vertical" aria-valuemin="1" aria-valuemax="6" aria-valuenow="1" aria-valuetext="Checkpoint 1 of 6"><canvas id="wrg-c" aria-hidden="true"></canvas></div>
</div>
<div class="wrg-cap" aria-hidden="true">Paper Ribbon Route</div>
<script>
(function(){
var R=document.getElementById('wrg-root'),C=document.getElementById('wrg-c'),X=C.getContext('2d'),S=0,K={},raf=0,last=0,TAU=Math.PI*2;
function rm(){return matchMedia('(prefers-reduced-motion: reduce)').matches}
function cols(){var s=getComputedStyle(document.documentElement);['paper','ink','mid','acc'].forEach(function(k){K[k]=s.getPropertyValue('--wrg-'+k).trim()})}
function wake(){if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(tick)}}
function tick(n){raf=0;var dt=Math.min(n-last,50)/16.667;last=n;var l=step(dt);draw();if(l)raf=requestAnimationFrame(tick)}
function fit(){var d=Math.min(devicePixelRatio||1,2);S=R.clientWidth;C.width=C.height=Math.round(S*d);X.setTransform(d,0,0,d,0,0);layout();wake()}
function aria(i){R.setAttribute('aria-valuenow',i+1);R.setAttribute('aria-valuetext','Checkpoint '+(i+1)+' of '+6)}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function ease(k,dt){return 1-Math.pow(1-k,dt)}
addEventListener('message',function(e){var d=e.data;if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){document.documentElement.setAttribute('data-theme',d.theme);cols();wake()}});
document.addEventListener('visibilitychange',function(){if(document.hidden){cancelAnimationFrame(raf);raf=0}else wake()});
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',wake);

var E=[12,38,26,64,48,80],N=6,sel=0,op=[1,0,0,0,0,0],hy=null,ys=[];
function layout(){}
function go(i){sel=clamp(i,0,N-1);aria(sel);wake()}
function aw(i){return S*(.12+.28*E[clamp(i,0,N-1)]/100)}
function tg(i){var t=i===sel?1:0;if(hy!==null){var h=(hy-S*.06)/(S*.88)*N;t=Math.max(t,Math.max(0,1-Math.abs(h-(i+.5))/1.3)*.75)}return t}
function step(dt){var live=false;
 for(var i=0;i<N;i++){var t=tg(i);if(rm())op[i]=t;else{op[i]+=(t-op[i])*ease(.14,dt)}
  if(Math.abs(t-op[i])>.002)live=true;else op[i]=t}
 return live&&!rm()}
function draw(){
 X.clearRect(0,0,S,S);X.lineJoin='round';var m=S*.06,H=S-2*m,w=[],T=0,i;
 for(i=0;i<N;i++){w[i]=.28+2.4*op[i];T+=w[i]}
 var y=m;ys=[];
 for(i=0;i<N;i++){var h=H*w[i]/T,y1=y+h,yc=y+h/2,xt=(aw(i-1)+aw(i))/2,xb=(aw(i)+aw(i+1))/2,cx=S/2,xm=aw(i),n=4,cw=2*xm/n;
  if(i===0)xt=aw(0)*.7;if(i===N-1)xb=aw(N-1)*.7;
  ys.push([y,y1]);
  X.beginPath();X.moveTo(cx-xt,y);X.lineTo(cx+xt,y);X.lineTo(cx+xb,y1);X.lineTo(cx-xb,y1);X.closePath();
  if(i===sel){X.fillStyle=K.acc;X.globalAlpha=.2;X.fill();X.globalAlpha=1}
  X.strokeStyle=i<sel?K.acc:i===sel?K.ink:K.mid;X.lineWidth=i===sel?2.2:1.5;X.stroke();
  X.lineWidth=1.2;X.beginPath();
  for(var j=0;j<n;j++){var l=cx-xm+j*cw;X.moveTo(l,yc);X.lineTo(l+cw/2,y+h*.04);X.lineTo(l+cw,yc);X.lineTo(l+cw/2,y1-h*.04);X.lineTo(l,yc)}
  X.stroke();
  if(i===sel&&h>S*.11){X.fillStyle=K.ink;X.font=Math.min(h*.5,S*.12)+'px Georgia,serif';X.textAlign='center';X.textBaseline='middle';X.fillText(i+1,cx,yc+h*.02)}
  y=y1}}
function at(e){var r=R.getBoundingClientRect();return (e.clientY-r.top)/r.height*S}
R.addEventListener('pointermove',function(e){hy=at(e);wake()});
R.addEventListener('pointerdown',function(e){hy=at(e);wake()});
R.addEventListener('pointerup',function(e){var v=at(e);for(var i=0;i<N;i++)if(v>=ys[i][0]&&v<ys[i][1]){go(i);break}if(e.pointerType!=='mouse'){hy=null;wake()}});
R.addEventListener('pointerleave',function(){hy=null;wake()});
R.addEventListener('keydown',function(e){var k=e.key;
 if(k==='ArrowDown'||k==='ArrowRight')go(sel+1);else if(k==='ArrowUp'||k==='ArrowLeft')go(sel-1);else if(k==='Home')go(0);else if(k==='End')go(N-1);else return;e.preventDefault()});

cols();new ResizeObserver(fit).observe(R);fit();

var demoEnabled=window.__foreverPreview?.demoEnabled!==false,demoClock=0;
function demoStep(){if(!demoEnabled||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;go((sel+1)%N);}
function demoStop(){if(demoClock){clearInterval(demoClock);demoClock=0}}
function demoStart(){demoStop();if(demoEnabled&&!document.hidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches)demoClock=setInterval(demoStep,1600)}
function takeover(){if(window.__foreverPreview?.surface==='wall')return;demoEnabled=false;demoStop()}
window.addEventListener('forever:interactive',takeover);
var stage=document.querySelector('.wrg-stage');
stage.addEventListener('pointerdown',takeover,true);stage.addEventListener('keydown',takeover,true);stage.addEventListener('input',takeover,true);stage.addEventListener('wheel',takeover,{capture:true,passive:true});
document.addEventListener('visibilitychange',function(){document.hidden?demoStop():demoStart()});
var demoMotion=matchMedia('(prefers-reduced-motion: reduce)');demoMotion.addEventListener('change',function(){demoStart();wake()});
demoStart();
})();
</script>
</body>
