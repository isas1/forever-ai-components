<body>
<div class="wrh-stage" role="group" aria-label="Hex Path Route">
<div id="wrh-root" role="slider" tabindex="0" aria-label="Route checkpoints as a hex tile path; tap a tile or use arrow keys to walk between 5 checkpoints" aria-orientation="horizontal" aria-valuemin="1" aria-valuemax="5" aria-valuenow="1" aria-valuetext="Checkpoint 1 of 5"><canvas id="wrh-c" aria-hidden="true"></canvas></div>
</div>
<div class="wrh-cap" aria-hidden="true">Hex Path Route</div>
<script>
(function(){
var R=document.getElementById('wrh-root'),C=document.getElementById('wrh-c'),X=C.getContext('2d'),S=0,K={},raf=0,last=0,TAU=Math.PI*2;
function rm(){return matchMedia('(prefers-reduced-motion: reduce)').matches}
function cols(){var s=getComputedStyle(document.documentElement);['paper','ink','mid','acc'].forEach(function(k){K[k]=s.getPropertyValue('--wrh-'+k).trim()})}
function wake(){if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(tick)}}
function tick(n){raf=0;var dt=Math.min(n-last,50)/16.667;last=n;var l=step(dt);draw();if(l)raf=requestAnimationFrame(tick)}
function fit(){var d=Math.min(devicePixelRatio||1,2);S=R.clientWidth;C.width=C.height=Math.round(S*d);X.setTransform(d,0,0,d,0,0);layout();wake()}
function aria(i){R.setAttribute('aria-valuenow',i+1);R.setAttribute('aria-valuetext','Checkpoint '+(i+1)+' of '+5)}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function ease(k,dt){return 1-Math.pow(1-k,dt)}
addEventListener('message',function(e){var d=e.data;if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){document.documentElement.setAttribute('data-theme',d.theme);cols();wake()}});
document.addEventListener('visibilitychange',function(){if(document.hidden){cancelAnimationFrame(raf);raf=0}else wake()});
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',wake);

var D=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]],Q=[0,0,5,5,0,1,1,0,0,5,5,0,1,1,0,0],CK=[0,4,8,12,16],EL=[.3,.9,.5,1,.65],N=5,
 T=[[0,0]],pp=0,vel=0,tgt=0,vis=[],P=[],u=10,ox=0,oy=0,k=0,s3=Math.sqrt(3);
Q.forEach(function(d,i){var l=T[i];T.push([l[0]+D[d][0],l[1]+D[d][1]])});
T.forEach(function(){vis.push(0)});
function hx(q,r){return [s3*(q+r/2),1.5*r]}
function layout(){var x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
 T.forEach(function(t){var p=hx(t[0],t[1]);x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])});
 u=Math.min(S*.82/(x1-x0+s3),S*.82/(y1-y0+2));ox=S/2-(x0+x1)/2*u;oy=S/2-(y0+y1)/2*u}
function pt(i){i=clamp(i,0,T.length-1);var a=Math.floor(i),b=Math.min(a+1,T.length-1),f=i-a,p=hx(T[a][0],T[a][1]),q=hx(T[b][0],T[b][1]);return [ox+u*(p[0]+(q[0]-p[0])*f),oy+u*(p[1]+(q[1]-p[1])*f)]}
function hexp(x,y,r){X.beginPath();for(var j=0;j<6;j++){var a=TAU/6*j+Math.PI/6;X[j?'lineTo':'moveTo'](x+r*Math.cos(a),y+r*Math.sin(a))}X.closePath()}
function elev(i){var j=0;while(j<N-2&&i>CK[j+1])j++;var f=clamp((i-CK[j])/(CK[j+1]-CK[j]),0,1);f=(1-Math.cos(f*Math.PI))/2;return EL[j]+(EL[j+1]-EL[j])*f}
function go(c){k=clamp(c,0,N-1);tgt=CK[k];aria(k);wake()}
function step(dt){var live=false,i;
 if(rm()){pp=tgt;vel=0;for(i=0;i<vis.length;i++)vis[i]=i<=pp?1:0;P.length=0;return false}
 vel+=(tgt-pp)*.012*dt;vel*=Math.pow(.88,dt);pp+=vel*dt;
 if(Math.abs(tgt-pp)<.002&&Math.abs(vel)<.002){pp=tgt;vel=0}else{live=true;
  var w=pt(pp),n=Math.abs(vel)>.05?2:1;for(i=0;i<n;i++)P.push({x:w[0],y:w[1],vx:(Math.random()-.5)*.6,vy:(Math.random()-.5)*.6,l:1});if(P.length>70)P.splice(0,P.length-70)}
 for(i=0;i<vis.length;i++){var t=i<=pp+.3?1:0;vis[i]+=(t-vis[i])*ease(.16,dt);if(Math.abs(t-vis[i])>.01)live=true;else vis[i]=t}
 for(i=P.length-1;i>=0;i--){var q=P[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=.03*dt;if(q.l<=0)P.splice(i,1);else live=true}
 return live}
function draw(){
 X.clearRect(0,0,S,S);X.lineJoin='round';var w=pt(pp),i,on={};
 T.forEach(function(t,i){on[t[0]+','+t[1]]=1});
 X.strokeStyle=K.mid;X.lineWidth=1;
 for(var q=-12;q<=12;q++)for(var r=-12;r<=12;r++){var p=hx(q,r),x=ox+u*p[0],y=oy+u*p[1];if(x<-u||y<-u||x>S+u||y>S+u||on[q+','+r])continue;
  var d=Math.hypot(x-w[0],y-w[1])/u,sc=.5+.4*Math.max(0,1-d/3.2);X.globalAlpha=.3+.4*Math.max(0,1-d/3.2);hexp(x,y,u*sc);X.stroke()}
 X.globalAlpha=1;
 for(i=0;i<T.length;i++){var c=pt(i),ck=CK.indexOf(i)>=0,e=elev(i),v=vis[i];
  X.strokeStyle=K.ink;X.lineWidth=ck?2:1.4;hexp(c[0],c[1],u*.96);X.stroke();
  if(ck){hexp(c[0],c[1],u*.8);X.lineWidth=1;X.stroke()}
  hexp(c[0],c[1],u*(.12+.5*e)*(.35+.65*v));
  if(v>.02){X.fillStyle=K.acc;X.globalAlpha=.25+.75*v;X.fill();X.globalAlpha=1}else{X.strokeStyle=K.mid;X.lineWidth=1;X.stroke()}}
 X.fillStyle=K.ink;
 P.forEach(function(p){X.globalAlpha=p.l*.7;X.beginPath();X.arc(p.x,p.y,u*.07*p.l+.5,0,TAU);X.fill()});X.globalAlpha=1;
 X.beginPath();X.arc(w[0],w[1],u*.26,0,TAU);X.fillStyle=K.paper;X.fill();X.strokeStyle=K.ink;X.lineWidth=2.4;X.stroke();
 X.beginPath();X.arc(w[0],w[1],u*.11,0,TAU);X.fillStyle=K.ink;X.fill()}
R.addEventListener('pointerup',function(e){var r=R.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,b=-1,bd=u*1.2;
 for(var i=0;i<T.length;i++){var c=pt(i),d=Math.hypot(c[0]-x,c[1]-y);if(d<bd){bd=d;b=i}}
 if(b<0)return;var c2=0;for(var j=0;j<N;j++)if(CK[j]<=b)c2=j;k=c2;tgt=b;aria(k);wake()});
R.addEventListener('keydown',function(e){var c=0,j;for(j=0;j<N;j++)if(CK[j]<=Math.round(tgt))c=j;
 if(e.key==='ArrowRight'||e.key==='ArrowUp')go(CK[c]<tgt?c+1:c+1);else if(e.key==='ArrowLeft'||e.key==='ArrowDown')go(CK[c]<tgt?c:c-1);else if(e.key==='Home')go(0);else if(e.key==='End')go(N-1);else return;e.preventDefault()});

cols();new ResizeObserver(fit).observe(R);fit();

var demoEnabled=window.__foreverPreview?.demoEnabled!==false,demoClock=0;
function demoStep(){if(!demoEnabled||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;go((k+1)%N);}
function demoStop(){if(demoClock){clearInterval(demoClock);demoClock=0}}
function demoStart(){demoStop();if(demoEnabled&&!document.hidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches)demoClock=setInterval(demoStep,1600)}
function takeover(){if(window.__foreverPreview?.surface==='wall')return;demoEnabled=false;demoStop()}
window.addEventListener('forever:interactive',takeover);
var stage=document.querySelector('.wrh-stage');
stage.addEventListener('pointerdown',takeover,true);stage.addEventListener('keydown',takeover,true);stage.addEventListener('input',takeover,true);stage.addEventListener('wheel',takeover,{capture:true,passive:true});
document.addEventListener('visibilitychange',function(){document.hidden?demoStop():demoStart()});
var demoMotion=matchMedia('(prefers-reduced-motion: reduce)');demoMotion.addEventListener('change',function(){demoStart();wake()});
demoStart();
})();
</script>
