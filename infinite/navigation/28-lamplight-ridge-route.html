:root[data-theme="light"]{--wri-bg:#DCE3F2;--wri-ink:#1A2340;--wri-dim:rgba(26,35,64,.32);--wri-lamp:#B8860B;--wri-org:#C4691F}

:root{--bg:var(--wri-bg)}

.wri-stage{width:100%;height:100%;display:grid;place-items:center}

<body>
<div class="wri-stage" role="group" aria-label="Lamplight Ridge Route">
<div id="wri-root" role="slider" tabindex="0" aria-label="Walking route checkpoints" aria-valuemin="1" aria-valuemax="5" aria-valuenow="1" aria-valuetext="Checkpoint 1 of 5"><canvas aria-hidden="true"></canvas></div>
</div>
<div class="wri-cap" aria-hidden="true">Lamplight Ridge Route</div>
<script>
(function(){
var R=document.getElementById('wri-root'),C=R.firstElementChild,X=C.getContext('2d'),W=0,K={},raf=0,last=0,mq=matchMedia('(prefers-reduced-motion: reduce)');
function rm(){return mq.matches}
function cols(){var s=getComputedStyle(document.documentElement);['bg','ink','dim','lamp','org'].forEach(function(k){K[k]=s.getPropertyValue('--wri-'+k).trim()})}
function setTheme(t){if(t!=='light'&&t!=='dark')return;document.documentElement.setAttribute('data-theme',t);cols();kick()}
addEventListener('message',function(e){if(e.data&&e.data.type==='forever:theme')setTheme(e.data.theme)});
function kick(){if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(frame)}}
function frame(now){raf=0;var dt=cl(now-last,1,50)/16.667;last=now;var b=step(dt);draw();if(b&&!document.hidden)raf=requestAnimationFrame(frame)}
document.addEventListener('visibilitychange',function(){if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick()});
mq.addEventListener('change',kick);
new ResizeObserver(function(){var d=Math.min(devicePixelRatio||1,2);W=R.clientWidth;C.width=C.height=Math.round(W*d);X.setTransform(d,0,0,d,0,0);kick()}).observe(R);
function aria(i){R.setAttribute('aria-valuenow',i+1);R.setAttribute('aria-valuetext','Checkpoint '+(i+1)+' of 5')}
function cl(v,a,b){return v<a?a:v>b?b:v}

var E=[.25,.6,.4,1,.65],J=[-3,1.5,-1,2.5,-2,.5,3],p=0,v=0,T=0,dr=false,pt=0,pu=0,ix=0;
function el(t){t=cl(t,0,1);var f=t*4,i=Math.min(3,f|0),u=(1-Math.cos((f-i)*Math.PI))/2;return E[i]+(E[i+1]-E[i])*u}
function fx(t){return W*.09+t*W*.82}
function fy(t){return W*.6-el(t)*W*.34}
function brush(a,b,col,al,w){X.strokeStyle=col;X.lineCap=X.lineJoin='round';for(var k=0;k<J.length;k++){X.globalAlpha=al*(.4+.12*(k%4));X.lineWidth=w*(1-.1*(k%3));X.beginPath();for(var n=0;n<=48;n++){var t=a+(b-a)*n/48;X[n?'lineTo':'moveTo'](fx(t),fy(t)+J[k]*W*.0045)}X.stroke()}X.globalAlpha=1}
function step(dt){
 var o=p;
 if(rm()){p=dr?pt:T;v=0}
 else if(dr){var q=1-Math.pow(.6,dt);p+=(pt-p)*q;var g=1-Math.pow(.7,dt);v+=((p-o)/dt-v)*g}
 else{v+=(T-p)*.012*dt;v*=Math.pow(.9,dt);p+=v*dt}
 if(p!==p||!isFinite(v)){p=T;v=0}if(p<0){p=0;v=0}if(p>1){p=1;v=0}
 var n=Math.round(p*4);if(n!==ix){ix=n;pu=rm()?0:1;aria(ix)}
 pu*=Math.pow(.9,dt);if(pu<.01)pu=0;
 var busy=dr||Math.abs(v)>2e-4||Math.abs(T-p)>5e-4||pu>0;
 if(!busy&&!dr){p=T;v=0}
 return busy}
function draw(){
 X.clearRect(0,0,W,W);
 brush(0,1,K.ink,.4,W*.014);
 X.lineWidth=1.5;X.strokeStyle=K.dim;
 for(var i=0;i<5;i++){var x=fx(i/4);X.beginPath();X.moveTo(x,fy(i/4));X.lineTo(x,W*.72);X.stroke()}
 brush(0,p,K.lamp,.95,W*.014);
 for(i=0;i<5;i++){var on=i===ix;X.beginPath();X.arc(fx(i/4),fy(i/4),W*(on?.022:.013),0,6.283);X.fillStyle=on?K.lamp:K.bg;X.fill();X.strokeStyle=on?K.lamp:K.ink;X.lineWidth=2;X.stroke()}
 if(Math.abs(v)>5e-4)brush(cl(p-v*14,0,1),p,K.org,.9,W*.03);
 X.beginPath();X.arc(fx(p),fy(p),W*.026,0,6.283);X.fillStyle=K.lamp;X.fill();X.strokeStyle=K.bg;X.lineWidth=3;X.stroke();
 X.font=(W*.15*(1+pu*.3))+'px Georgia,serif';X.textAlign='center';X.textBaseline='middle';X.fillStyle=K.lamp;X.fillText(ix+1,W/2,W*.87)}
function mp(e){var r=R.getBoundingClientRect();if(!r.width||!W)return p;return cl(((e.clientX-r.left)/r.width*W-W*.09)/(W*.82),0,1)}
R.addEventListener('pointerdown',function(e){R.setPointerCapture(e.pointerId);dr=true;pt=mp(e);R.style.cursor='grabbing';kick()});
R.addEventListener('pointermove',function(e){if(dr){pt=mp(e);kick()}});
function up(){if(!dr)return;dr=false;R.style.cursor='';T=cl(Math.round((p+v*10)*4),0,4)/4;kick()}
R.addEventListener('pointerup',up);R.addEventListener('pointercancel',up);
R.addEventListener('keydown',function(e){var d={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1}[e.key];if(d){e.preventDefault();T=cl(ix+d,0,4)/4;kick()}else if(e.key==='Home'){e.preventDefault();T=0;kick()}else if(e.key==='End'){e.preventDefault();T=1;kick()}});

cols();
function wake(){kick()}

var demoEnabled=window.__foreverPreview?.demoEnabled!==false,demoClock=0;
function demoStep(){if(!demoEnabled||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;T=((ix+1)%5)/4;kick();}
function demoStop(){if(demoClock){clearInterval(demoClock);demoClock=0}}
function demoStart(){demoStop();if(demoEnabled&&!document.hidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches)demoClock=setInterval(demoStep,1600)}
function takeover(){if(window.__foreverPreview?.surface==='wall')return;demoEnabled=false;demoStop()}
window.addEventListener('forever:interactive',takeover);
var stage=document.querySelector('.wri-stage');
stage.addEventListener('pointerdown',takeover,true);stage.addEventListener('keydown',takeover,true);stage.addEventListener('input',takeover,true);stage.addEventListener('wheel',takeover,{capture:true,passive:true});
document.addEventListener('visibilitychange',function(){document.hidden?demoStop():demoStart()});
var demoMotion=matchMedia('(prefers-reduced-motion: reduce)');demoMotion.addEventListener('change',function(){demoStart();wake()});
demoStart();
})();
</script>
