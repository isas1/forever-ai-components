<script>
(function(){
var R=document.getElementById('wrj-root'),C=R.firstElementChild,X=C.getContext('2d'),W=0,K={},raf=0,last=0,mq=matchMedia('(prefers-reduced-motion: reduce)');
function rm(){return mq.matches}
function cols(){var s=getComputedStyle(document.documentElement);['bg','ink','dim','lamp','org'].forEach(function(k){K[k]=s.getPropertyValue('--wrj-'+k).trim()})}
function setTheme(t){if(t!=='light'&&t!=='dark')return;document.documentElement.setAttribute('data-theme',t);cols();kick()}
addEventListener('message',function(e){if(e.data&&e.data.type==='forever:theme')setTheme(e.data.theme)});
function kick(){if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(frame)}}
function frame(now){raf=0;var dt=Math.min(now-last,50)/16.667;last=now;var b=step(dt);draw();if(b&&!document.hidden)raf=requestAnimationFrame(frame)}
document.addEventListener('visibilitychange',function(){if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick()});
mq.addEventListener('change',kick);
new ResizeObserver(function(){var d=Math.min(devicePixelRatio||1,2);W=R.clientWidth;C.width=C.height=Math.round(W*d);X.setTransform(d,0,0,d,0,0);kick()}).observe(R);
function aria(i){R.setAttribute('aria-valuenow',i+1);R.setAttribute('aria-valuetext','Checkpoint '+(i+1)+' of 5')}
function cl(v,a,b){return v<a?a:v>b?b:v}

var E=[.3,.7,.45,1,.6],J=[-3,-1,1,3,0],A=0,VA=0,TA=0,ix=0,en=0,pu=0,Q=[];
for(var s=0;s<80;s++)Q.push({u:s/80,s:Math.sin(s*7.3)*8e-4,r:Math.sin(s*3.7),ph:s*1.9,z:.003+.004*((s*37)%10)/10});
function el(u){var f=((u%1)+1)%1*5,i=f|0,w=(1-Math.cos((f-i)*Math.PI))/2;return E[i]+(E[(i+1)%5]-E[i])*w}
function pos(u,o){var a=u*6.2832-1.5708,r=W*.27+el(u)*W*.1+(o||0);return[W/2+Math.cos(a)*r,W/2+Math.sin(a)*r]}
function wr(d){return d-Math.round(d)}
function arc(a,b,col,al,w){X.strokeStyle=col;X.lineCap=X.lineJoin='round';for(var k=0;k<J.length;k++){X.globalAlpha=al*(.45+.12*k%3);X.lineWidth=w*(1-.08*k%2);X.beginPath();for(var n=0;n<=120;n++){var P=pos(a+(b-a)*n/120,J[k]*W*.0045);X[n?'lineTo':'moveTo'](P[0],P[1])}X.stroke()}X.globalAlpha=1}
function set(i){i=((i%5)+5)%5;if(i===ix)return;ix=i;var b=i/5;TA=b+Math.round(A-b);en=1;pu=rm()?0:1;aria(i);kick()}
function step(dt){
 if(rm()){A=TA;VA=0;en=0;pu=0}
 else{VA+=(TA-A)*.02*dt;VA*=Math.pow(.86,dt);A+=VA*dt;en*=Math.pow(.99,dt);pu*=Math.pow(.9,dt);if(en<.02)en=0;if(pu<.01)pu=0;
  for(var i=0;i<Q.length;i++){var q=Q[i];q.u+=(q.s*en*3+wr(A-q.u)*.004)*dt;q.ph+=.05*dt}}
 var busy=en>0||pu>0||Math.abs(VA)>1e-4||Math.abs(TA-A)>5e-4;
 if(!busy){A=TA;VA=0}
 return busy}
function draw(){
 X.clearRect(0,0,W,W);
 arc(0,1,K.ink,.4,W*.012);
 var pr=((A%1)+1)%1;if(pr>.001)arc(0,pr,K.lamp,.95,W*.012);
 for(var i=0;i<5;i++){var P=pos(i/5),on=i===ix;X.beginPath();X.arc(P[0],P[1],W*(on?.02:.012),0,6.283);X.fillStyle=on?K.lamp:K.bg;X.fill();X.strokeStyle=on?K.lamp:K.ink;X.lineWidth=2;X.stroke()}
 if(en>0){X.fillStyle=K.org;for(i=0;i<Q.length;i++){var q=Q[i],d=Math.abs(wr(A-q.u)),P2=pos(q.u,(q.r+Math.sin(q.ph)*.6)*W*.03);X.globalAlpha=en*(.25+.75*cl(1-d/.3,0,1));X.beginPath();X.arc(P2[0],P2[1],W*q.z,0,6.283);X.fill()}X.globalAlpha=1}
 var M=pos(A);X.beginPath();X.arc(M[0],M[1],W*.028,0,6.283);X.fillStyle=K.lamp;X.fill();X.strokeStyle=K.bg;X.lineWidth=3;X.stroke();
 X.font=(W*.2*(1+pu*.3))+'px Georgia,serif';X.textAlign='center';X.textBaseline='middle';X.fillStyle=K.lamp;X.fillText(ix+1,W/2,W/2+W*.01)}
function aim(e){var r=R.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W-W/2,y=(e.clientY-r.top)/r.height*W-W/2;if(x*x+y*y<W*W*.012)return;var u=(Math.atan2(y,x)+1.5708)/6.2832;set(Math.round(((u%1)+1)%1*5))}
R.addEventListener('pointermove',aim);R.addEventListener('pointerdown',aim);
R.addEventListener('keydown',function(e){var d={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1}[e.key];if(d){e.preventDefault();set(ix+d)}});

cols();
function wake(){kick()}

var demoEnabled=window.__foreverPreview?.demoEnabled!==false,demoClock=0;
function demoStep(){if(!demoEnabled||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;set((ix+1)%5);}
function demoStop(){if(demoClock){clearInterval(demoClock);demoClock=0}}
function demoStart(){demoStop();if(demoEnabled&&!document.hidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches)demoClock=setInterval(demoStep,1600)}
function takeover(){if(window.__foreverPreview?.surface==='wall')return;demoEnabled=false;demoStop()}
window.addEventListener('forever:interactive',takeover);
var stage=document.querySelector('.wrj-stage');
stage.addEventListener('pointerdown',takeover,true);stage.addEventListener('keydown',takeover,true);stage.addEventListener('input',takeover,true);stage.addEventListener('wheel',takeover,{capture:true,passive:true});
document.addEventListener('visibilitychange',function(){document.hidden?demoStop():demoStart()});
var demoMotion=matchMedia('(prefers-reduced-motion: reduce)');demoMotion.addEventListener('change',function(){demoStart();wake()});
demoStart();
