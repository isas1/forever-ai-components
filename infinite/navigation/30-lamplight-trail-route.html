<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)})();</script>
<style>

:root{--wrk-bg:#0E1630;--wrk-ink:#FFF6D6;--wrk-dim:rgba(255,246,214,.3);--wrk-lamp:#F2C230;--wrk-org:#E8893A}
:root[data-theme="light"]{--wrk-bg:#DCE3F2;--wrk-ink:#1A2340;--wrk-dim:rgba(26,35,64,.32);--wrk-lamp:#B8860B;--wrk-org:#C4691F}
.wrk-stage,.wrk-stage *{box-sizing:border-box;margin:0}

.wrk-stage{background:var(--wrk-bg);display:grid;place-items:center;overflow:hidden}
#wrk-root{width:min(92vmin,640px);aspect-ratio:1;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
#wrk-root:focus-visible{outline:2px solid var(--wrk-lamp);outline-offset:4px}
#wrk-root canvas{width:100%;height:100%;display:block}

:root{--bg:var(--wrk-bg)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
.wrk-stage{width:100%;height:100%;display:grid;place-items:center}
.wrk-cap{position:fixed;left:8px;bottom:7px;font:10px/1.2 system-ui,sans-serif;color:var(--wrk-ink);opacity:.45;pointer-events:none}


</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/navigation/30-lamplight-trail-route.html",
 "title": "Lamplight Fold Route",
 "description": "Lamplight-on-navy palette with warm gold accents; select five folded brushstroke bands that expand around the current checkpoint.",
 "useWhen": "A compact route or multi-stop progress selector with keyboard access.",

<body>
<div class="wrk-stage" role="group" aria-label="Lamplight Fold Route">
<div id="wrk-root" role="slider" tabindex="0" aria-label="Walking route checkpoints" aria-valuemin="1" aria-valuemax="5" aria-valuenow="1" aria-valuetext="Checkpoint 1 of 5"><canvas aria-hidden="true"></canvas></div>
</div>
<div class="wrk-cap" aria-hidden="true">Lamplight Fold Route</div>
<script>
(function(){
var R=document.getElementById('wrk-root'),C=R.firstElementChild,X=C.getContext('2d'),W=0,K={},raf=0,last=0,mq=matchMedia('(prefers-reduced-motion: reduce)');
function rm(){return mq.matches}
function cols(){var s=getComputedStyle(document.documentElement);['bg','ink','dim','lamp','org'].forEach(function(k){K[k]=s.getPropertyValue('--wrk-'+k).trim()})}
function setTheme(t){if(t!=='light'&&t!=='dark')return;document.documentElement.setAttribute('data-theme',t);cols();kick()}
addEventListener('message',function(e){if(e.data&&e.data.type==='forever:theme')setTheme(e.data.theme)});
function kick(){if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(frame)}}
function frame(now){raf=0;var dt=Math.min(now-last,50)/16.667;last=now;var b=step(dt);draw();if(b&&!document.hidden)raf=requestAnimationFrame(frame)}
document.addEventListener('visibilitychange',function(){if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick()});
mq.addEventListener('change',kick);
new ResizeObserver(function(){var d=Math.min(devicePixelRatio||1,2);W=R.clientWidth;C.width=C.height=Math.round(W*d);X.setTransform(d,0,0,d,0,0);kick()}).observe(R);
function aria(i){R.setAttribute('aria-valuenow',i+1);R.setAttribute('aria-valuetext','Checkpoint '+(i+1)+' of 5')}
function cl(v,a,b){return v<a?a:v>b?b:v}

var E=[.25,.6,.4,1,.65],J=[-2,1,-1,2.5,0,1.5],a=0,h=[3.2,1,1,1,1],hv=[0,0,0,0,0];
function tg(i){return i===a?3.2:1}
function pick(i){i=cl(i,0,4);if(i===a)return;a=i;aria(i);kick()}
function step(dt){
 var busy=false;
 for(var i=0;i<5;i++){
  if(rm()){h[i]=tg(i);hv[i]=0}
  else{hv[i]+=(tg(i)-h[i])*.06*dt;hv[i]*=Math.pow(.8,dt);h[i]=Math.max(.3,h[i]+hv[i]*dt);
   if(Math.abs(hv[i])>1e-3||Math.abs(tg(i)-h[i])>2e-3)busy=true;else{h[i]=tg(i);hv[i]=0}}}
 return busy}
function tot(){return h[0]+h[1]+h[2]+h[3]+h[4]}
function draw(){
 X.clearRect(0,0,W,W);
 var t=tot(),H=W*.92,y=W*.04,x0=W*.08;
 for(var i=0;i<5;i++){
  var rh=h[i]/t*H,th=rh*.6,yt=y+(rh-th)/2,len=W*(.15+.65*E[i]),x1=x0+len,on=i===a;
  X.strokeStyle=on?K.lamp:K.ink;X.lineCap='round';X.lineWidth=th/6*1.5;
  for(var k=0;k<6;k++){X.globalAlpha=(on?.9:i<a?.8:.3)*(.7+.1*(k%3));var yy=yt+th*(k+.5)/6;X.beginPath();X.moveTo(x0+J[(k+i)%6]*W*.006,yy);X.lineTo(x1+J[(k*2+i)%6]*W*.01,yy);X.stroke()}
  X.globalAlpha=1;
  if(on){X.strokeStyle=K.org;X.lineWidth=th*.5;X.beginPath();X.moveTo(x1-W*.04,y+rh/2);X.lineTo(x1,y+rh/2);X.stroke();
   var fs=Math.min(rh*.5,W*.22);X.globalAlpha=cl((rh/H-.16)/.2,0,1);X.font=fs+'px Georgia,serif';X.textAlign='left';X.textBaseline='middle';X.fillStyle=K.bg;X.fillText(i+1,x0+W*.04,y+rh/2+fs*.04);X.globalAlpha=1}
  y+=rh}}
function row(e){var r=R.getBoundingClientRect(),py=(e.clientY-r.top)/r.height*W,t=tot(),y=W*.04;for(var i=0;i<5;i++){y+=h[i]/t*W*.92;if(py<y)return i}return 4}
R.addEventListener('pointerdown',function(e){pick(row(e))});
R.addEventListener('keydown',function(e){var d={ArrowDown:1,ArrowRight:1,ArrowUp:-1,ArrowLeft:-1}[e.key];if(d){e.preventDefault();pick(a+d)}else if(e.key==='Home'){e.preventDefault();pick(0)}else if(e.key==='End'){e.preventDefault();pick(4)}});

cols();
function wake(){kick()}

var demoEnabled=window.__foreverPreview?.demoEnabled!==false,demoClock=0;
function demoStep(){if(!demoEnabled||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;pick((a+1)%5);}
function demoStop(){if(demoClock){clearInterval(demoClock);demoClock=0}}
function demoStart(){demoStop();if(demoEnabled&&!document.hidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches)demoClock=setInterval(demoStep,1600)}
function takeover(){if(window.__foreverPreview?.surface==='wall')return;demoEnabled=false;demoStop()}
window.addEventListener('forever:interactive',takeover);
var stage=document.querySelector('.wrk-stage');
stage.addEventListener('pointerdown',takeover,true);stage.addEventListener('keydown',takeover,true);stage.addEventListener('input',takeover,true);stage.addEventListener('wheel',takeover,{capture:true,passive:true});
document.addEventListener('visibilitychange',function(){document.hidden?demoStop():demoStart()});
var demoMotion=matchMedia('(prefers-reduced-motion: reduce)');demoMotion.addEventListener('change',function(){demoStart();wake()});
demoStart();
})();
</script>
</body>
</html>
