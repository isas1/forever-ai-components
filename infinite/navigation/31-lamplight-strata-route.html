<style>

:root[data-theme="light"]{--wrl-bg:#DCE3F2;--wrl-ink:#1A2340;--wrl-dim:rgba(26,35,64,.32);--wrl-lamp:#B8860B;--wrl-org:#C4691F}
.wrl-stage,.wrl-stage *{box-sizing:border-box;margin:0}

.wrl-stage{background:var(--wrl-bg);display:grid;place-items:center;overflow:hidden}
#wrl-root{width:min(92vmin,640px);aspect-ratio:1;touch-action:none;cursor:ns-resize;user-select:none;-webkit-user-select:none}
#wrl-root:focus-visible{outline:2px solid var(--wrl-lamp);outline-offset:4px}
#wrl-root canvas{width:100%;height:100%;display:block}

:root{--bg:var(--wrl-bg)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
.wrl-stage{width:100%;height:100%;display:grid;place-items:center}
.wrl-cap{position:fixed;left:8px;bottom:7px;font:10px/1.2 system-ui,sans-serif;color:var(--wrl-ink);opacity:.45;pointer-events:none}


</style>

<body>
<div class="wrl-stage" role="group" aria-label="Lamplight Scroll Route">
<div id="wrl-root" role="slider" tabindex="0" aria-label="Walking route checkpoints" aria-valuemin="1" aria-valuemax="5" aria-valuenow="1" aria-valuetext="Checkpoint 1 of 5"><canvas aria-hidden="true"></canvas></div>
</div>
<div class="wrl-cap" aria-hidden="true">Lamplight Scroll Route</div>
<script>
(function(){
var R=document.getElementById('wrl-root'),C=R.firstElementChild,X=C.getContext('2d'),W=0,K={},raf=0,last=0,mq=matchMedia('(prefers-reduced-motion: reduce)');
function rm(){return mq.matches}
function cols(){var s=getComputedStyle(document.documentElement);['bg','ink','dim','lamp','org'].forEach(function(k){K[k]=s.getPropertyValue('--wrl-'+k).trim()})}
function setTheme(t){if(t!=='light'&&t!=='dark')return;document.documentElement.setAttribute('data-theme',t);cols();kick()}
addEventListener('message',function(e){if(e.data&&e.data.type==='forever:theme')setTheme(e.data.theme)});
function kick(){if(!raf&&!document.hidden){last=performance.now();raf=requestAnimationFrame(frame)}}
function frame(now){raf=0;var dt=Math.min(now-last,50)/16.667;last=now;var b=step(dt);draw();if(b&&!document.hidden)raf=requestAnimationFrame(frame)}
document.addEventListener('visibilitychange',function(){if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick()});
mq.addEventListener('change',kick);
new ResizeObserver(function(){var d=Math.min(devicePixelRatio||1,2);W=R.clientWidth;C.width=C.height=Math.round(W*d);X.setTransform(d,0,0,d,0,0);kick()}).observe(R);
function aria(i){R.setAttribute('aria-valuenow',i+1);R.setAttribute('aria-valuetext','Checkpoint '+(i+1)+' of 5')}
function cl(v,a,b){return v<a?a:v>b?b:v}

var E=[.25,.6,.4,1,.65],J=[-3,1.5,-1,2.5,-2],p=0,p0=0,T=0,tw=1,dr=false,pt=0,pb=0,ys=0,mv=0,ix=0,wl=0;
function el(t){t=cl(t,0,1);var f=t*4,i=Math.min(3,f|0),u=(1-Math.cos((f-i)*Math.PI))/2;return E[i]+(E[i+1]-E[i])*u}
function L(){return W*1.7}
function sx(t){return W*.28+el(t)*W*.4}
function sy(t){return W*.5+(p-t)*L()}
function go(i){T=cl(i,0,4)/4;p0=p;tw=0;kick()}
function step(dt){
 if(rm()){p=dr?pt:T;tw=1}
 else if(dr)p=pt;
 else if(tw<1){tw=Math.min(1,tw+dt/26);var e=tw<.5?4*tw*tw*tw:1-Math.pow(-2*tw+2,3)/2;p=p0+(T-p0)*e}
 var n=Math.round(cl(p,0,1)*4);if(n!==ix){ix=n;aria(ix)}
 return dr||tw<1}
function line(a,b,col,al){X.strokeStyle=col;X.lineCap=X.lineJoin='round';X.lineWidth=W*.014;for(var k=0;k<J.length;k++){X.globalAlpha=al*(.45+.12*(k%4));X.beginPath();for(var n=0;n<=70;n++){var t=a+(b-a)*n/70;X[n?'lineTo':'moveTo'](sx(t)+J[k]*W*.0045,sy(t))}X.stroke()}X.globalAlpha=1}
function draw(){
 X.clearRect(0,0,W,W);
 var lo=p-.3,hi=p+.3,t,y;
 X.strokeStyle=K.ink;X.lineWidth=1.2;X.globalAlpha=.14;
 for(t=Math.max(0,lo);t<=Math.min(1,hi);t+=.004){y=sy(t);X.beginPath();X.moveTo(sx(t)-W*.02,y);X.lineTo(sx(t)-el(t)*W*.22*(.6+.4*Math.sin(t*977)),y);X.stroke()}
 X.globalAlpha=1;
 var a=Math.max(0,lo),b=Math.min(1,hi);
 line(a,b,K.ink,.4);
 if(p>a)line(a,Math.min(p,b),K.lamp,.95);
 for(var i=0;i<5;i++){y=sy(i/4);if(y<-20||y>W+20)continue;var x=sx(i/4),nx=i===ix+1;X.strokeStyle=nx?K.org:K.ink;X.lineWidth=nx?3:2;X.beginPath();X.moveTo(x-W*.07,y);X.lineTo(x+W*.07,y);X.stroke()}
 X.beginPath();X.arc(sx(cl(p,0,1)),W*.5,W*.03,0,6.283);X.fillStyle=K.lamp;X.fill();X.strokeStyle=K.bg;X.lineWidth=3;X.stroke();
 var al=1-cl(Math.abs(p*4-ix)*2.2,0,1),fs=W*.2*(.8+.2*al);
 X.globalAlpha=al;X.font=fs+'px Georgia,serif';X.textAlign='center';X.textBaseline='middle';X.fillStyle=K.lamp;X.fillText(ix+1,W*.86,W*.5);X.globalAlpha=1}
R.addEventListener('pointerdown',function(e){R.setPointerCapture(e.pointerId);dr=true;ys=e.clientY;pb=p;pt=p;mv=0;R.style.cursor='grabbing';kick()});
R.addEventListener('pointermove',function(e){if(!dr)return;var dy=(e.clientY-ys)/R.clientHeight*W;mv=Math.max(mv,Math.abs(dy));pt=cl(pb+dy/L(),0,1);kick()});
function up(e){if(!dr)return;dr=false;R.style.cursor='';
 if(mv<W*.02&&e.type==='pointerup'){var r=R.getBoundingClientRect();p=pb;go(ix+((e.clientY-r.top)<r.height/2?1:-1))}
 else go(Math.round(cl(p,0,1)*4))}
R.addEventListener('pointerup',up);R.addEventListener('pointercancel',up);
R.addEventListener('wheel',function(e){e.preventDefault();var n=performance.now();if(n-wl<260)return;wl=n;go(ix+(e.deltaY<0?1:-1))},{passive:false});
R.addEventListener('keydown',function(e){var d={ArrowUp:1,ArrowRight:1,ArrowDown:-1,ArrowLeft:-1}[e.key];if(d){e.preventDefault();go(ix+d)}else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key==='End'){e.preventDefault();go(4)}});

cols();
function wake(){kick()}

var demoEnabled=window.__foreverPreview?.demoEnabled!==false,demoClock=0;
function demoStep(){if(!demoEnabled||document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;go((ix+1)%5);}
function demoStop(){if(demoClock){clearInterval(demoClock);demoClock=0}}
function demoStart(){demoStop();if(demoEnabled&&!document.hidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches)demoClock=setInterval(demoStep,1600)}
function takeover(){if(window.__foreverPreview?.surface==='wall')return;demoEnabled=false;demoStop()}
window.addEventListener('forever:interactive',takeover);
var stage=document.querySelector('.wrl-stage');
stage.addEventListener('pointerdown',takeover,true);stage.addEventListener('keydown',takeover,true);stage.addEventListener('input',takeover,true);stage.addEventListener('wheel',takeover,{capture:true,passive:true});
document.addEventListener('visibilitychange',function(){document.hidden?demoStop():demoStart()});
var demoMotion=matchMedia('(prefers-reduced-motion: reduce)');demoMotion.addEventListener('change',function(){demoStart();wake()});
demoStart();
})();
</script>
</body>
</html>
