<div class="dt24-root" role="slider" tabindex="0" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="4" aria-label="one boot. the trail back up is a line of boot prints. home is the deepest print. drag up or down, or use the wheel, to scrub along the trail; flick to throw the boot. each print deepens when you reach it. arrow keys step one print, enter throws you home, escape returns to where you are."></div>

<script>(function(){
  var reduce=function(){return matchMedia('(prefers-reduced-motion: reduce)').matches};
  var raf=0,last=0;
  var root=document.querySelector('.dt24-root'),cv=document.createElement('canvas');
  cv.className='dt24-cv';root.appendChild(cv);var ctx=cv.getContext('2d');
  var names=['forever plan','monday','cat-pics-2','emotional baggage','you are here'];
  var N=5,counts=[5,4,3,2,1],dd=[0,0,0,0,0],dv=[0,0,0,0,0];
  var p=4,v=0,tgt=4,mode='spring',drag=false,lastIdx=4,W=300,H=300,dpr=1;
  var U=[],M=72;
  for(var j=0;j<M;j++){var t=j/M*Math.PI*2,y=-Math.cos(t),s=Math.sin(t);
    var w=0.37+0.06*(-y)-0.1*Math.exp(-Math.pow((y-0.25)/0.22,2));
    if(s<0)w-=0.07*Math.exp(-Math.pow((y-0.15)/0.28,2));
    U.push([s*w,y])}
  function cl(a,b,c){return Math.max(b,Math.min(c,a))}
  function deepest(){var b=0;for(var i=1;i<N;i++)if(counts[i]>counts[b])b=i;return b}
  function land(){var r=Math.round(p);
    if(Math.abs(p-r)<0.08&&r>=0&&r<N&&r!==lastIdx){lastIdx=r;counts[r]=Math.min(9,counts[r]+1);aria()}}
  function aria(){var r=cl(Math.round(p),0,4);root.setAttribute('aria-valuenow',String(4-r));
    root.setAttribute('aria-valuetext',names[r]+', '+(4-r)+' steps back, depth '+counts[r])}
  function step(dt){var mv=drag;
    if(!drag){
      if(mode==='coast'){v*=Math.pow(0.92,dt);
        if(p<0){v+=(0-p)*0.2*dt;v*=Math.pow(0.82,dt)}else if(p>4){v+=(4-p)*0.2*dt;v*=Math.pow(0.82,dt)}
        p+=v*dt;if(Math.abs(v)<0.025){mode='spring';tgt=cl(Math.round(p),0,4)}mv=true}
      else{v+=(tgt-p)*0.16*dt;v*=Math.pow(0.8,dt);p+=v*dt;
        if(Math.abs(tgt-p)<0.0008&&Math.abs(v)<0.0008){p=tgt;v=0}else mv=true}}
    for(var i=0;i<N;i++){dv[i]+=(counts[i]-dd[i])*0.14*dt;dv[i]*=Math.pow(0.78,dt);dd[i]+=dv[i]*dt;
      if(Math.abs(counts[i]-dd[i])>0.002||Math.abs(dv[i])>0.002)mv=true;else{dd[i]=counts[i];dv[i]=0}}
    land();return mv}
  function snapToTarget(){if(!drag){if(mode==='coast'){tgt=cl(Math.round(p+v*12),0,4);mode='spring'}p=tgt;v=0}
    for(var i=0;i<N;i++){dd[i]=counts[i];dv[i]=0}land()}
  function draw(){var cs=getComputedStyle(root),bg=cs.getPropertyValue('--bg').trim(),
    ink=cs.getPropertyValue('--ink').trim(),acc=cs.getPropertyValue('--acc').trim();
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    var S=W*0.58,L=W*0.25,dp=deepest();
    for(var i=0;i<N;i++){var off=i-p,cy=H/2+off*S;if(cy<-L*1.5||cy>H+L*1.5)continue;
      var side=i%2?1:-1,cx=W/2+side*W*0.1,a=Math.max(0.14,1-Math.abs(off)*0.75),
      rot=Math.PI+side*0.08,co=Math.cos(rot),si=Math.sin(rot),n=Math.max(0,dd[i]);
      ctx.strokeStyle=i===dp?acc:ink;ctx.lineJoin='round';
      for(var k=0;k<Math.ceil(n-0.001)&&k<10;k++){var f=cl(n-k,0,1),s=1-k*0.1;if(s<=0.08)break;
        ctx.globalAlpha=a*f*(k===0?1:0.85);ctx.lineWidth=k===0?1.5:1;ctx.beginPath();
        for(var j=0;j<M;j++){var x=U[j][0]*side*s*L,y=(U[j][1]*s+(1-s)*(-0.38))*L;
          var X=cx+x*co-y*si,Y=cy+x*si+y*co;j?ctx.lineTo(X,Y):ctx.moveTo(X,Y)}

    ctx.globalAlpha=1}

    var moving=reduce()?(snapToTarget(),false):step(dt);draw();
    raf=moving?requestAnimationFrame(frame):0;}

  var ly=0,lt=0,vel=0;
  root.addEventListener('pointerdown',function(e){drag=true;ly=e.clientY;lt=e.timeStamp;vel=0;v=0;
    try{root.setPointerCapture(e.pointerId)}catch(_){}kick()});
  root.addEventListener('pointermove',function(e){if(!drag)return;var dy=e.clientY-ly,dtm=Math.max(1,e.timeStamp-lt);
    ly=e.clientY;lt=e.timeStamp;var d=-dy/(W*0.58);if(p<0||p>4)d*=0.4;p+=d;
    vel=vel*0.6+(d/(dtm/16.667))*0.4;kick()});

  root.addEventListener('pointerup',up);root.addEventListener('pointercancel',up);
  root.addEventListener('wheel',function(e){e.preventDefault();
    v=cl(v+e.deltaY*0.0012,-0.6,0.6);mode='coast';kick()},{passive:false});
  root.addEventListener('keydown',function(e){var k=e.key,r=cl(Math.round(mode==='spring'?tgt:p),0,4);
    if(k==='ArrowUp'||k==='ArrowLeft'){tgt=cl(r-1,0,4);mode='spring'}
    else if(k==='ArrowDown'||k==='ArrowRight'){tgt=cl(r+1,0,4);mode='spring'}
    else if(k==='Home'){tgt=0;mode='spring'}else if(k==='End'||k==='Escape'){tgt=4;mode='spring'}
    else if(k==='Enter'||k===' '){v=-0.5;mode='coast'}else return;
    e.preventDefault();kick()});
  new ResizeObserver(function(){var b=root.getBoundingClientRect();W=b.width||300;H=b.height||300;
    dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);draw();kick()}).observe(root);

    if(document.hidden){cancelAnimationFrame(raf);raf=0}else kick()});
  window.addEventListener('message',function(e){var m=e.data;
    if(m&&m.type==='forever:theme'&&(m.theme==='light'||m.theme==='dark')){
      document.documentElement.setAttribute('data-theme',m.theme);draw()}});
  aria();p=3.55;tgt=4;mode='spring';
  draw();kick();

  var demo=window.__foreverPreview?window.__foreverPreview.demoEnabled!==false:true,demoI=0,demoT=0;
  function stopDemo(){demo=false;clearInterval(demoT)}
  demoT=setInterval(function(){if(!demo||document.hidden||reduce())return;if(drag||mode==='coast')return;tgt=[2,0,3,1,4][demoI++%5];mode='spring';kick()},1500);
  window.addEventListener('forever:interactive',stopDemo);
  ['pointerdown','keydown','wheel'].forEach(function(t){root.addEventListener(t,stopDemo,true)});
  document.addEventListener('pointerdown',stopDemo,true);
})();</script>
