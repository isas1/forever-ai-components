<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Atelier Glide Tabs — Navigation. Tactile segmented bus selector with spring-gliding indicator pill.">
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier Glide Tabs</title>
<script>/* theme hook: ?theme=light|dark, before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  :root {
    --at01-bg: #171614;
    --at01-surface: #211F1C;
    --at01-surface-hi: #2B2824;
    --at01-ink: #F4F1EA;
    --at01-ink-fg: #171614;
    --at01-muted: #ADA699;
    --at01-accent: #EC6A43;
    --at01-spring: cubic-bezier(0.22, 1.35, 0.36, 1);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --at01-bg: #F4F1EA;
    --at01-surface: #EBE7DF;
    --at01-surface-hi: #FAF8F5;
    --at01-ink: #1C1B19;
    --at01-ink-fg: #FAF8F5;
    --at01-muted: #666158;
    --at01-accent: #C43B16;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background-color: var(--at01-bg); color: var(--at01-ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.25s ease, color 0.25s ease;
  }
  .at01-stage {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    padding: clamp(10px, 3vmin, 20px);
    padding-bottom: clamp(24px, 7vmin, 32px);
    background-color: var(--at01-bg); color: var(--at01-ink);
  }
  .at01-unit {
    width: min(230px, 100%);
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .at01-tabs {
    position: relative; width: 100%;
    display: grid; grid-template-columns: repeat(3, 1fr);
    background: var(--at01-surface);
    border: 1.5px solid var(--at01-ink);
    border-radius: 6px; padding: 3px;
    box-shadow: 0 2px 0 var(--at01-ink);
  }
  .at01-pill {
    position: absolute; top: 3px; bottom: 3px; left: 3px;
    width: calc((100% - 6px) / 3);
    background: var(--at01-ink);
    border-radius: 4px;
    transition: transform 260ms var(--at01-spring), background-color 0.2s ease;
    transform-origin: center; z-index: 1;
  }
  .at01-tab {
    appearance: none; position: relative; z-index: 2;
    background: transparent; border: none;
    padding: clamp(7px, 2.5vmin, 10px) 0;
    font-family: inherit;
    font-size: clamp(9.5px, 2.8vw, 11px); font-weight: 700;
    letter-spacing: 0.06em; color: var(--at01-ink);
    cursor: pointer; border-radius: 4px;
    transition: color 180ms ease;
    touch-action: manipulation;
  }
  .at01-tab[aria-selected="true"] { color: var(--at01-ink-fg); }
  .at01-tab:focus-visible { outline: 2px solid var(--at01-accent); outline-offset: -2px; }
  .at01-readout {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    font-size: clamp(9px, 2.5vw, 10px); font-weight: 600;
    letter-spacing: 0.08em; color: var(--at01-muted);
    text-transform: uppercase;
  }
  .at01-val { color: var(--at01-ink); }
  .at01-cap {
    position: absolute; left: 10px; bottom: 8px;
    font: 500 11px/1 ui-monospace, monospace;
    color: var(--at01-ink); opacity: 0.45;
    letter-spacing: 0.04em; text-transform: uppercase;
    user-select: none; pointer-events: none;
  }
  .at01-sr {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap;
  }
  @media (prefers-reduced-motion: reduce) {
    .at01-pill, .at01-tab { transition-duration: 0.01ms !important; }
  }
</style>

<body>
<div class="at01-stage">
  <div class="at01-unit">
    <div class="at01-tabs" id="at01-tabs" role="tablist" aria-label="Studio Bus Mode">
      <div class="at01-pill" id="at01-pill"></div>
      <button type="button" class="at01-tab" role="tab" aria-selected="true" data-idx="0">TAPE</button>
      <button type="button" class="at01-tab" role="tab" aria-selected="false" tabindex="-1" data-idx="1">SYNTH</button>
      <button type="button" class="at01-tab" role="tab" aria-selected="false" tabindex="-1" data-idx="2">MIX</button>
    </div>
    <div class="at01-readout">
      <span>BUS SELECT</span>
      <span class="at01-val" id="at01-out">CH: TAPE</span>
    </div>
  </div>
  <div class="at01-sr" id="at01-live" aria-live="polite"></div>
</div>
<div class="at01-cap" aria-hidden="true">Atelier Glide Tabs</div>
<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var tabsWrap = document.getElementById("at01-tabs");
  var pill = document.getElementById("at01-pill");
  var out = document.getElementById("at01-out");
  var live = document.getElementById("at01-live");
  var tabs = Array.prototype.slice.call(tabsWrap.querySelectorAll(".at01-tab"));
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cur = 0;
  var settleTimer = null;

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "forever:theme" && (e.data.theme === "light" || e.data.theme === "dark")) {
      root.setAttribute("data-theme", e.data.theme);
    }
  });

  function select(idx, announceText) {
    cur = idx;
    tabs.forEach(function (t, i) {
      var active = i === idx;
      t.setAttribute("aria-selected", active ? "true" : "false");
      t.tabIndex = active ? 0 : -1;
    });
    if (settleTimer) { clearTimeout(settleTimer); settleTimer = null; }
    if (reduce) {
      pill.style.transform = "translateX(" + (idx * 100) + "%) scaleX(1)";
    } else {
      pill.style.transform = "translateX(" + (idx * 100) + "%) scaleX(1.06)";
      settleTimer = setTimeout(function () {
        pill.style.transform = "translateX(" + (idx * 100) + "%) scaleX(1)";
        settleTimer = null;
      }, 140);
    }
    var label = tabs[idx].textContent;
    out.textContent = "CH: " + label;
    if (announceText && live) live.textContent = "Bus " + label + " selected";
  }

  var demo = !reduce && (!window.__foreverPreview || window.__foreverPreview.demoEnabled !== false);
  var initTimer = null, demoTimer = null;

  function stepDemo() {
    if (!demo || reduce || document.hidden) return;
    select((cur + 1) % tabs.length, false);
  }
  function startDemo() {
    if (demo && !reduce && !demoTimer) demoTimer = setInterval(stepDemo, 2100);
  }
  function stopDemo() {
    if (initTimer) { clearTimeout(initTimer); initTimer = null; }
    if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }
  }
  function takeover() { demo = false; stopDemo(); }

  window.addEventListener("forever:interactive", takeover);
  tabsWrap.addEventListener("pointerdown", takeover, true);
  tabsWrap.addEventListener("keydown", takeover, true);

  tabs.forEach(function (tab, idx) {
    tab.addEventListener("click", function () {
      takeover();
      select(idx, true);
    });
    tab.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
        e.preventDefault();
        takeover();
        var dir = e.key === "ArrowRight" ? 1 : -1;
        var next = (idx + dir + tabs.length) % tabs.length;
        select(next, true);
        tabs[next].focus();
      }
    });
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopDemo(); else if (demo) startDemo();
  });

  if (demo) {
    initTimer = setTimeout(stepDemo, 280);
    startDemo();
  }
})();
</script>
</body>
</html>
