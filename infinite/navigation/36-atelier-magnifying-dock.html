  :root[data-theme="light"] {
    --at06-bg: #F4F1EA; --at06-surface: #EBE7DF; --at06-surface-hi: #FAF8F5;
    --at06-ink: #1C1B19; --at06-muted: #666158; --at06-accent: #C43B16; --at06-accent-ink: #FAF8F5;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background-color: var(--at06-bg); color: var(--at06-ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased; transition: background-color 0.25s ease, color 0.25s ease;
  }
  .at06-stage {
    position: absolute; inset: 0; display: grid; place-items: center;
    padding: clamp(10px, 3vmin, 20px); padding-bottom: clamp(24px, 7vmin, 32px);
    background-color: var(--at06-bg); color: var(--at06-ink);
  }
  .at06-unit { display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 100%; }
  .at06-dock {
    display: flex; align-items: flex-end; justify-content: center; gap: clamp(4px, 2vw, 6px);
    height: clamp(50px, 26vmin, 64px); padding: clamp(6px, 2vmin, 8px) clamp(7px, 2.5vw, 10px);
    background: var(--at06-surface); border: 1.5px solid var(--at06-ink); border-radius: 8px;
    box-shadow: 0 2px 0 var(--at06-ink); touch-action: none; max-width: 100%;
  }
  .at06-item {
    appearance: none; width: clamp(24px, 12vw, 34px); height: clamp(24px, 12vw, 34px);
    background: var(--at06-surface-hi); color: var(--at06-ink);
    border: 1.5px solid var(--at06-ink); border-radius: 6px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
    transform-origin: bottom center; box-shadow: 0 2px 0 var(--at06-ink); touch-action: manipulation;
    transition: transform 90ms ease-out, background-color 120ms ease, color 120ms ease;
  }
  .at06-item[aria-pressed="true"] { background: var(--at06-accent); color: var(--at06-accent-ink); }
  .at06-item:focus-visible { outline: 2px solid var(--at06-accent); outline-offset: 2px; }
  .at06-icon { width: clamp(12px, 6vw, 16px); height: clamp(12px, 6vw, 16px); stroke: currentColor; stroke-width: 1.8; fill: none; }
  .at06-readout {
    width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px;

    letter-spacing: 0.08em; color: var(--at06-muted); text-transform: uppercase;
  }
  .at06-val { color: var(--at06-ink); }
  .at06-cap {
    position: absolute; left: 10px; bottom: 8px; font: 500 11px/1 ui-monospace, monospace;
    color: var(--at06-ink); opacity: 0.45; letter-spacing: 0.04em; text-transform: uppercase;
    user-select: none; pointer-events: none;

<div class="at06-stage">
  <div class="at06-unit">
    <div class="at06-dock" id="at06-dock" role="toolbar" aria-label="Studio Tools">

      </button>
    </div>

    </div>
  </div>

<div class="at06-cap" aria-hidden="true">Atelier Magnifying Dock</div>
<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var dock = document.getElementById("at06-dock");
  var items = Array.prototype.slice.call(dock.querySelectorAll(".at06-item"));
  var out = document.getElementById("at06-out");
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "forever:theme" && (e.data.theme === "light" || e.data.theme === "dark")) {
      root.setAttribute("data-theme", e.data.theme);
    }
  });

  function magnifyAt(clientX) {
    if (reduce) return;
    items.forEach(function (btn) {
      var rect = btn.getBoundingClientRect();
      var center = rect.left + rect.width / 2;
      var dist = Math.abs(clientX - center);
      var scale = 1 + 0.34 * Math.exp(-(dist * dist) / (2 * 32 * 32));
      btn.style.transform = "scale(" + scale.toFixed(3) + ")";
    });
  }

  function resetScale() {
    items.forEach(function (btn) { btn.style.transform = "scale(1)"; });
  }

  function selectTool(btn) {
    items.forEach(function (b) { b.setAttribute("aria-pressed", "false"); });
    btn.setAttribute("aria-pressed", "true");
    out.textContent = "TOOL: " + btn.dataset.tool;
  }

  var demo = !reduce && (!window.__foreverPreview || window.__foreverPreview.demoEnabled !== false);
  var rafId = 0, phase = 0, lastIdx = 0;

  function tick() {
    rafId = 0;
    if (!demo || reduce || document.hidden) return;
    phase += 0.028;
    var r = dock.getBoundingClientRect();
    if (r.width) {
      var norm = 0.5 + 0.44 * Math.sin(phase);
      magnifyAt(r.left + norm * r.width);
      var idx = Math.min(items.length - 1, Math.max(0, Math.floor(norm * items.length)));
      if (idx !== lastIdx) {
        lastIdx = idx;
        selectTool(items[idx]);
      }
    }
    rafId = requestAnimationFrame(tick);
  }
  function startDemo() { if (demo && !reduce && !rafId) rafId = requestAnimationFrame(tick); }
  function stopDemo() { if (rafId) { cancelAnimationFrame(rafId); rafId = 0; } }
  function takeover() {
    if (!demo) return;
    demo = false;
    stopDemo();
    resetScale();
  }

  window.addEventListener("forever:interactive", takeover);
  dock.addEventListener("pointerdown", takeover, true);
  dock.addEventListener("keydown", takeover, true);

  dock.addEventListener("pointermove", function (e) {
    takeover();
    magnifyAt(e.clientX);
  });
  dock.addEventListener("pointerleave", resetScale);

  items.forEach(function (btn) {
    btn.addEventListener("click", function () {
      takeover();
      selectTool(btn);
    });
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopDemo(); else if (demo) startDemo();
  });

  if (demo) startDemo();
})();
</script>
