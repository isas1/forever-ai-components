<script>/* theme hook: ?theme=light|dark, before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  :root {
    --at20-bg: #171614; --at20-surface-hi: #2B2824; --at20-ink: #F4F1EA; --at20-ink-fg: #171614;
    --at20-muted: #ADA699; --at20-border: #57524A; --at20-accent: #EC6A43; --at20-accent-ink: #171614;
    --at20-spring: cubic-bezier(0.22, 1.35, 0.36, 1); color-scheme: dark;
  }
  :root[data-theme="light"] {
    --at20-bg: #F4F1EA; --at20-surface-hi: #FAF8F5; --at20-ink: #1C1B19; --at20-ink-fg: #FAF8F5;
    --at20-muted: #666158; --at20-border: #C5BEB0; --at20-accent: #C43B16; --at20-accent-ink: #FAF8F5;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background-color: var(--at20-bg); color: var(--at20-ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-font-smoothing: antialiased; transition: background-color 0.25s ease, color 0.25s ease;
  }
  .at20-stage {
    position: absolute; inset: 0; display: grid; place-items: center;
    padding: clamp(6px, 2.5vmin, 16px); padding-bottom: clamp(22px, 6.5vmin, 30px);
    background-color: var(--at20-bg); color: var(--at20-ink);
  }
  .at20-unit { width: min(176px, 100%); display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .at20-hub { position: relative; width: clamp(136px, 76vw, 152px); height: clamp(104px, 52vmin, 126px); display: flex; align-items: center; justify-content: center; }
  .at20-core {
    appearance: none; width: clamp(38px, 20vw, 44px); height: clamp(38px, 20vw, 44px); border-radius: 50%;
    background: var(--at20-ink); color: var(--at20-ink-fg); border: 1.5px solid var(--at20-ink);
    font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer; z-index: 3;
    box-shadow: 0 2px 0 var(--at20-border); display: flex; align-items: center; justify-content: center;
    transition: transform 220ms var(--at20-spring), background-color 150ms ease, color 150ms ease;
    touch-action: manipulation;
  }
  .at20-core:focus-visible { outline: 2px solid var(--at20-accent); outline-offset: 2px; }
  .at20-hub.is-open .at20-core { background: var(--at20-accent); color: var(--at20-accent-ink); transform: rotate(45deg); }
  .at20-node {
    appearance: none; position: absolute; width: clamp(38px, 20vw, 42px); height: 24px; border-radius: 4px;
    background: var(--at20-surface-hi); color: var(--at20-ink); border: 1.5px solid var(--at20-ink);
    font-family: inherit; font-size: 9px; font-weight: 700; cursor: pointer; padding: 0;
    opacity: 0; visibility: hidden; pointer-events: none; transform: translate(0, 0) scale(0.5);
    transition: transform 260ms var(--at20-spring), opacity 180ms ease, visibility 180ms ease, background-color 120ms ease;
    box-shadow: 0 2px 0 var(--at20-ink); z-index: 2; touch-action: manipulation;
  }
  .at20-node:focus-visible { outline: 2px solid var(--at20-accent); outline-offset: 1px; }
  .at20-node.is-selected { background: var(--at20-ink); color: var(--at20-ink-fg); }
  .at20-hub.is-open .at20-node { opacity: 1; visibility: visible; pointer-events: auto; }
  .at20-hub.is-open .at20-node[data-dir="n"] { transform: translate(0, -37px) scale(1); }
  .at20-hub.is-open .at20-node[data-dir="e"] { transform: translate(46px, 0) scale(1); }
  .at20-hub.is-open .at20-node[data-dir="s"] { transform: translate(0, 37px) scale(1); }
  .at20-hub.is-open .at20-node[data-dir="w"] { transform: translate(-46px, 0) scale(1); }
  .at20-readout {
    width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 6px;
    font-size: clamp(8.5px, 2.3vw, 10px); font-weight: 600;
    letter-spacing: 0.06em; color: var(--at20-muted); text-transform: uppercase;
  }
  .at20-val { color: var(--at20-ink); }
  .at20-cap {
    position: absolute; left: 10px; bottom: 8px; font: 500 11px/1 ui-monospace, monospace;
    color: var(--at20-ink); opacity: 0.45; letter-spacing: 0.04em; text-transform: uppercase;
    user-select: none; pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) { .at20-core, .at20-node { transition-duration: 0.01ms !important; } }
</style>

</head>
<body>
<div class="at20-stage">
  <div class="at20-unit">
    <div class="at20-hub" id="at20-hub">
      <button type="button" class="at20-core" id="at20-core" aria-expanded="false" aria-label="Quick Actions">+</button>
      <button type="button" class="at20-node" data-dir="n" data-act="SPLIT" tabindex="-1">SPLIT</button>
      <button type="button" class="at20-node" data-dir="e" data-act="LOOP" tabindex="-1">LOOP</button>
      <button type="button" class="at20-node" data-dir="s" data-act="MUTE" tabindex="-1">MUTE</button>
      <button type="button" class="at20-node" data-dir="w" data-act="SOLO" tabindex="-1">SOLO</button>
    </div>
    <div class="at20-readout">
      <span>ORBITAL</span>
      <span class="at20-val" id="at20-out">CMD: NONE</span>
    </div>
  </div>
</div>
<div class="at20-cap" aria-hidden="true">Atelier Radial Menu</div>
<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var hub = document.getElementById("at20-hub");
  var core = document.getElementById("at20-core");
  var nodes = Array.prototype.slice.call(hub.querySelectorAll(".at20-node"));
  var out = document.getElementById("at20-out");
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var actIdx = 0;

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "forever:theme" && (e.data.theme === "light" || e.data.theme === "dark")) {
      root.setAttribute("data-theme", e.data.theme);
    }
  });

  function setOpen(force) {
    var open = typeof force === "boolean" ? force : !hub.classList.contains("is-open");
    hub.classList.toggle("is-open", open);
    core.setAttribute("aria-expanded", open ? "true" : "false");
    nodes.forEach(function (n) { n.tabIndex = open ? 0 : -1; });
  }

  function pickNode(node, restoreFocus) {
    nodes.forEach(function (n) { n.classList.remove("is-selected"); });
    node.classList.add("is-selected");
    out.textContent = "CMD: " + node.dataset.act;
    setOpen(false);
    if (restoreFocus) core.focus();
  }

  var demo = !reduce && (!window.__foreverPreview || window.__foreverPreview.demoEnabled !== false);
  var initTimer = null, demoTimer = null, subTimer = null;

  function cycleDemo() {
    if (!demo || reduce || document.hidden) return;
    setOpen(true);
    if (subTimer) clearTimeout(subTimer);
    subTimer = setTimeout(function () {
      if (!demo || reduce || document.hidden) return;
      pickNode(nodes[actIdx % nodes.length], false);
      actIdx++;
    }, 1050);
  }
  function startDemo() {
    if (demo && !reduce && !demoTimer) demoTimer = setInterval(cycleDemo, 2400);
  }
  function stopDemo() {
    if (initTimer) { clearTimeout(initTimer); initTimer = null; }
    if (subTimer) { clearTimeout(subTimer); subTimer = null; }
    if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }
  }
  function takeover() { demo = false; stopDemo(); }

  window.addEventListener("forever:interactive", takeover);
  hub.addEventListener("pointerdown", takeover, true);
  hub.addEventListener("keydown", takeover, true);

  core.addEventListener("click", function () {
    takeover();
    setOpen();
  });

  nodes.forEach(function (node) {
    node.addEventListener("click", function () {
      takeover();
      pickNode(node, true);
    });
  });

  hub.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && hub.classList.contains("is-open")) {
      takeover();
      setOpen(false);
      core.focus();
    }
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) stopDemo(); else if (demo) startDemo();
  });

  if (demo) {
    initTimer = setTimeout(cycleDemo, 250);
    startDemo();
  }
})();
</script>
</body>
</html>
