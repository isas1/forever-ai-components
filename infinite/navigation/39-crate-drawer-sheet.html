<style>
:root{--b:#131316;--i:#F1F1F4;--o:#000;--m:#9A9CA6;--l:#2B2C31;--c:#7B95C4;--sp:cubic-bezier(.3,1.45,.5,1);color-scheme:dark}
:root[data-theme="light"]{--b:#EFF0F3;--i:#000;--o:#EFF0F3;--m:#5F616B;--l:#CDCFD8;--c:#2B4473;color-scheme:light}
html,body{margin:0;height:100%;overflow:hidden;background:var(--b);color:var(--i);font:14px/1.3 "Avenir Next",Avenir,system-ui,sans-serif}
.cr07-st,.cr07-st *{box-sizing:border-box}
.cr07-st{position:relative;width:100%;height:100%;display:grid;place-items:center;padding:clamp(8px,3vmin,20px);background:var(--b);color:var(--i);overflow:hidden}
.cr07-st :focus-visible{outline:2px solid var(--c);outline-offset:2px}
.cr07-t{display:grid;justify-items:center;gap:clamp(10px,4.5vmin,26px)}
.cr07-fan{display:flex;justify-content:center;transition:transform .4s ease,opacity .3s}
.cr07-sl{display:block;width:clamp(42px,18vmin,74px);margin:0 clamp(-14px,-3.5vmin,-8px);transition:transform .45s var(--sp)}
.cr07-sl:nth-child(1){transform:rotate(-9deg) translateY(4px)}.cr07-sl:nth-child(2){position:relative;z-index:1}.cr07-sl:nth-child(3){transform:rotate(9deg) translateY(4px)}
@media (hover:hover){.cr07-t:hover .cr07-sl:nth-child(1){transform:rotate(-17deg) translate(-12px,7px)}.cr07-t:hover .cr07-sl:nth-child(2){transform:translateY(-7px)}.cr07-t:hover .cr07-sl:nth-child(3){transform:rotate(17deg) translate(12px,7px)}}
.cr07-t.cr07-out .cr07-fan{transform:translateY(40px) scale(.8);opacity:0}
.cr07-art{display:block;width:100%;aspect-ratio:1;border-radius:2px}
.cr07-btn{display:inline-flex;align-items:center;justify-content:center;gap:clamp(5px,2vmin,8px);height:clamp(32px,10vmin,44px);padding:0 clamp(12px,4vmin,20px);border-radius:999px;border:1.5px solid var(--i);background:var(--i);color:var(--o);font:inherit;font-size:clamp(11px,3.3vmin,14px);font-weight:600;white-space:nowrap;cursor:pointer;touch-action:manipulation;transition:scale .15s}
.cr07-btn:active{scale:.96}
.cr07-bdg{display:grid;place-items:center;min-width:clamp(16px,5vmin,20px);height:clamp(16px,5vmin,20px);padding:0 5px;border-radius:10px;background:var(--o);color:var(--i);font-size:clamp(10px,3vmin,12px)}
.cr07-sh{position:absolute;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;background:transparent;color:var(--i);overflow:hidden;z-index:5;display:none}
.cr07-sh[open]{display:block}
.cr07-bg{position:absolute;inset:0;background:rgba(8,8,10,.55);opacity:0}
.cr07-pan{position:absolute;left:0;right:0;bottom:-36px;max-height:calc(90% + 36px);padding-bottom:36px;display:flex;flex-direction:column;background:var(--b);border-top:1px solid var(--l);border-radius:14px 14px 0 0;will-change:transform}
.cr07-gp{flex:none;display:grid;place-items:center;height:clamp(14px,5vmin,22px);cursor:grab;touch-action:none}
.cr07-gp i{width:34px;height:4px;border-radius:2px;background:var(--l)}
.cr07-hd{flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(10px,3.5vmin,16px) clamp(4px,1.5vmin,8px);cursor:grab;touch-action:none;user-select:none}
.cr07-h3{margin:0;font-family:Futura,"Avenir Next",sans-serif;font-size:clamp(15px,5vmin,22px);line-height:1}
.cr07-ib{display:inline-grid;place-items:center;flex:none;width:clamp(26px,8vmin,36px);height:clamp(26px,8vmin,36px);border-radius:50%;border:1.5px solid var(--l);background:none;padding:0;color:inherit;cursor:pointer;touch-action:manipulation;transition:border-color .2s,scale .15s}
.cr07-ib:hover{border-color:var(--i)}.cr07-ib:active{scale:.9}
.cr07-ic{display:block;width:clamp(13px,4vmin,18px);height:clamp(13px,4vmin,18px);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cr07-ls{flex:1;min-height:0;overflow:auto;list-style:none;margin:0;padding:0 clamp(10px,3.5vmin,16px)}
.cr07-li{display:grid;grid-template-columns:clamp(26px,10vmin,48px) minmax(0,1fr) auto;gap:clamp(6px,2.5vmin,12px);align-items:center;padding:clamp(4px,1.8vmin,8px) 0;border-top:1px solid var(--l);font-size:clamp(11px,3.2vmin,14px)}
.cr07-li b,.cr07-li small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cr07-li small{color:var(--m);font-size:clamp(9.5px,2.8vmin,12px)}
.cr07-li em{font-style:normal;font-weight:600}
.cr07-ft{flex:none;display:flex;align-items:center;gap:clamp(6px,2.5vmin,12px);padding:clamp(6px,2.5vmin,12px) clamp(10px,3.5vmin,16px);border-top:1px solid var(--l);font-size:clamp(11px,3.2vmin,14px)}
.cr07-ft span{color:var(--m)}.cr07-ft b{font-size:clamp(14px,4.5vmin,20px);margin-right:auto}
@media (min-width:700px){.cr07-pan{left:auto;top:0;bottom:0;right:-36px;width:min(86%,380px);max-height:none;padding:0 36px 0 0;border-radius:0;border-top:0;border-left:1px solid var(--l)}.cr07-gp{display:none}.cr07-hd{padding-top:14px}}
.cr07-cap{position:absolute;left:10px;bottom:8px;font:500 11px/1 ui-monospace,monospace;color:var(--i);opacity:.45;letter-spacing:.04em;text-transform:uppercase;pointer-events:none;user-select:none}
@media (prefers-reduced-motion:reduce){.cr07-st *{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>

<div class="cr07-st" id="cr07-st"></div>
<div class="cr07-cap" aria-hidden="true">Drawer Sheet</div>
<script>(()=>{
  const s=document.getElementById('cr07-st'),RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  const spring=o=>{if(RM()){o.step(o.to);o.done&&o.done();return()=>{}}let x=o.from,v=o.v0||0,last=performance.now(),id=0;const k=o.k||260,c=o.c||26,t=n=>{const dt=Math.min(.032,(n-last)/1000);last=n;for(let i=0;i<4;i++){v+=(-k*(x-o.to)-c*v)*dt/4;x+=v*dt/4}if(Math.abs(x-o.to)<.003&&Math.abs(v)<.06){o.step(o.to);o.done&&o.done();return}o.step(x);id=requestAnimationFrame(t)};id=requestAnimationFrame(t);return()=>cancelAnimationFrame(id)};
  const A=[['F2F0EA','2B4473',3.8,6.2,3.4],['E2B01A','D5412B',5,5.8,3],['5E9470','F2F0EA',7,7,2.4]].map(([b,c,x,y,r])=>`<rect width="10" height="10" fill="#${b}"/><circle cx="${x}" cy="${y}" r="${r}" fill="#${c}"/>`);
  const IT=[['Low Tide','Marlo Finch',24],['Paper Sun','The Halves',28],['Half Light','Sable & Rue',17]];
  const art=i=>`<svg class="cr07-art" viewBox="0 0 10 10" aria-hidden="true">${A[i]}</svg>`;
  const I=d=>`<svg class="cr07-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;
  s.innerHTML=`<div class="cr07-t"><div class="cr07-fan" aria-hidden="true">${IT.map((_,i)=>`<span class="cr07-sl">${art(i)}</span>`).join('')}</div><button type="button" class="cr07-btn cr07-open" aria-haspopup="dialog" aria-label="Open crate, 3 records">${I('M3.5 9h17l-1.5 10H5zM8 13v2M12 13v2M16 13v2M7 9l2-4M17 9l-2-4')}Open crate<span class="cr07-bdg" aria-hidden="true">3</span></button></div><dialog class="cr07-sh" aria-labelledby="cr07-h"><div class="cr07-bg"></div><div class="cr07-pan"><div class="cr07-gp" aria-hidden="true"><i></i></div><div class="cr07-hd"><h3 class="cr07-h3" id="cr07-h">Crate</h3><button type="button" class="cr07-ib cr07-x" aria-label="Close crate">${I('M6 6l12 12M18 6L6 18')}</button></div><ul class="cr07-ls" data-fit-clip-ok>${IT.map(([t,a,p],i)=>`<li class="cr07-li">${art(i)}<div><b>${t}</b><small>${a}</small></div><em>£${p}</em></li>`).join('')}</ul><div class="cr07-ft"><span>Total</span><b>£69</b><button type="button" class="cr07-btn cr07-go">Check out</button></div></div></dialog>`;
  const wrap=s.querySelector('.cr07-t'),opener=s.querySelector('.cr07-open'),d=s.querySelector('.cr07-sh'),panel=d.querySelector('.cr07-pan'),bg=d.querySelector('.cr07-bg'),wide=matchMedia('(min-width:700px)');
  let t=1,stop=null,busy=false,alive=true;
  const set=v=>{t=v;panel.style.transform=wide.matches?`translateX(${v*100}%)`:`translateY(${v*100}%)`;bg.style.opacity=String(Math.min(1,Math.max(0,1-v)))};
  const go=(to,v0,done)=>{stop&&stop();stop=spring({from:t,to,v0:v0||0,k:to?300:230,c:to?34:24,step:set,done})};
  const open=foc=>{if(busy||d.open)return;set(1);d.show();wrap.inert=true;wrap.classList.add('cr07-out');go(0);if(foc)d.querySelector('.cr07-x').focus({preventScroll:true})};
  const close=(v0,foc)=>{if(busy||!d.open)return;busy=true;wrap.classList.remove('cr07-out');go(1,v0,()=>{if(!alive)return;busy=false;d.close();wrap.inert=false;if(foc)opener.focus({preventScroll:true})})};
  const drag=e=>{if(e.button||busy||e.target.closest('button'))return;const el=e.currentTarget,hz=wide.matches,sz=Math.max(1,hz?panel.offsetWidth:panel.offsetHeight),p0=hz?e.clientX:e.clientY;let lp=p0,lt=e.timeStamp,vel=0;stop&&stop();el.setPointerCapture(e.pointerId);
    const mv=ev=>{const p=hz?ev.clientX:ev.clientY,dt=e.timeStamp-lt;if(dt>0)vel=(p-lp)/dt*1000/sz;lp=p;lt=ev.timeStamp;const dl=(p-p0)/sz;set(dl<0?-Math.pow(-dl,.7)*.1:dl)};
    const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);(t>.3||vel>1.2)?close(Math.max(vel,0),true):go(0,vel)};
    el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)};
  d.querySelector('.cr07-gp').addEventListener('pointerdown',drag);d.querySelector('.cr07-hd').addEventListener('pointerdown',drag);
  opener.onclick=()=>open(true);bg.onclick=()=>close(0,true);d.querySelector('.cr07-x').onclick=()=>close(0,true);d.querySelector('.cr07-go').onclick=()=>close(0,true);
  d.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();close(0,true)}});

  let demo=!RM()&&!(window.__foreverPreview&&window.__foreverPreview.demoEnabled===false),timer=0,kick=0,step=0;
  const play=()=>{if(!demo||RM()||document.hidden)return;if(step++%2===0)open(false);else close(0,false)};
  const stopD=()=>{clearInterval(timer);clearTimeout(kick);timer=kick=0},start=()=>{if(!timer&&demo&&!RM())timer=setInterval(play,1450)},tk=()=>{demo=false;stopD()};
  window.addEventListener('forever:interactive',tk);s.addEventListener('pointerdown',tk,true);s.addEventListener('keydown',tk,true);
  document.addEventListener('visibilitychange',()=>{if(document.hidden){stop&&stop();stopD()}else if(demo)start()});
  window.addEventListener('message',e=>{if(e.data&&e.data.type==='forever:theme'&&(e.data.theme==='light'||e.data.theme==='dark'))document.documentElement.setAttribute('data-theme',e.data.theme)});
  if(demo){kick=setTimeout(play,650);start()}
})();</script>
