<title>Crate Collapsible Sidebar</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
:root{--b:#131316;--i:#F1F1F4;--o:#000;--m:#9A9CA6;--l:#2B2C31;--c:#7B95C4;--vn:#000;--ve:#3A3B42;--sp:cubic-bezier(.3,1.45,.5,1);color-scheme:dark}
:root[data-theme="light"]{--b:#EFF0F3;--i:#000;--o:#EFF0F3;--m:#5F616B;--l:#CDCFD8;--c:#2B4473;--ve:transparent;color-scheme:light}
html,body{margin:0;height:100%;overflow:hidden;background:var(--b);color:var(--i);font:14px/1.3 "Avenir Next",Avenir,system-ui,sans-serif}
.cr08-st,.cr08-st *{box-sizing:border-box}
.cr08-st{position:relative;width:100%;height:100%;display:grid;place-items:center;padding:clamp(6px,3vmin,18px);background:var(--b);color:var(--i)}
.cr08-st :focus-visible{outline:2px solid var(--c);outline-offset:2px}
.cr08-sb{display:flex;width:min(100%,460px);height:min(100%,252px);border:1px solid var(--l);border-radius:3px;overflow:hidden}
.cr08-nv{position:relative;z-index:2;flex:none;width:clamp(94px,36vmin,134px);padding:clamp(5px,2vmin,8px);border-right:1px solid var(--l);background:var(--b);transition:width .4s ease}
.cr08-sb.cr08-min .cr08-nv{width:clamp(40px,14vmin,53px)}
.cr08-top{display:flex;align-items:center;height:clamp(24px,8.5vmin,36px);margin-bottom:clamp(4px,1.5vmin,8px)}
.cr08-br{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding-left:6px;font-weight:700;font-size:clamp(11px,3.2vmin,14px);overflow:hidden;white-space:nowrap;transition:opacity .2s}
.cr08-disc{display:block;width:14px;height:14px;flex:none;border-radius:50%;background:var(--vn);border:1px solid var(--ve);position:relative}
.cr08-disc::after{content:"";position:absolute;inset:33%;border-radius:50%;background:#D5412B}
.cr08-sb.cr08-min .cr08-br{opacity:0;flex:0;padding:0}
.cr08-tg{display:inline-grid;place-items:center;flex:none;width:clamp(24px,8.5vmin,36px);height:clamp(24px,8.5vmin,36px);border-radius:50%;border:1.5px solid transparent;background:none;padding:0;color:inherit;cursor:pointer;touch-action:manipulation;transition:border-color .2s}
.cr08-tg:hover{border-color:var(--i)}
.cr08-tg .cr08-ic{transition:transform .4s var(--sp)}.cr08-sb.cr08-min .cr08-tg .cr08-ic{transform:rotate(180deg)}
.cr08-ic{display:block;width:clamp(13px,4vmin,17px);height:clamp(13px,4vmin,17px);flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cr08-ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.cr08-i{position:relative;z-index:1;display:flex;align-items:center;gap:8px;width:100%;height:clamp(24px,8.5vmin,36px);padding:0 clamp(6px,2vmin,9px);border-radius:18px;border:0;background:none;color:inherit;font:inherit;font-size:clamp(10.5px,3.2vmin,14px);font-weight:500;white-space:nowrap;cursor:pointer;touch-action:manipulation;transition:color .25s}
.cr08-lb{transition:opacity .2s,transform .3s ease}.cr08-sb.cr08-min .cr08-lb{opacity:0;transform:translateX(-8px)}
.cr08-i[aria-current]{color:var(--o)}
.cr08-ind{position:absolute;left:clamp(5px,2vmin,8px);right:clamp(5px,2vmin,8px);top:0;height:clamp(24px,8.5vmin,36px);border-radius:18px;background:var(--i);transition:transform .4s var(--sp)}
.cr08-sb.cr08-min .cr08-i::after{content:attr(data-tip);position:absolute;left:40px;top:4px;padding:3px 9px;border-radius:999px;background:var(--i);color:var(--o);font-size:11px;opacity:0;transform:translateX(-6px);pointer-events:none;transition:opacity .15s,transform .25s var(--sp)}
.cr08-sb.cr08-min .cr08-i:hover::after,.cr08-sb.cr08-min .cr08-i:focus-visible::after{opacity:1;transform:none}
.cr08-mn{flex:1;min-width:0;padding:clamp(6px,2.5vmin,10px);display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(28px,12vmin,52px),1fr));gap:clamp(5px,2vmin,8px);align-content:start}
.cr08-art{display:block;width:100%;aspect-ratio:1;border-radius:2px}
.cr08-cap{position:absolute;left:10px;bottom:8px;font:500 11px/1 ui-monospace,monospace;color:var(--i);opacity:.45;letter-spacing:.04em;text-transform:uppercase;pointer-events:none;user-select:none}
@media (prefers-reduced-motion:reduce){.cr08-st *{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>

<body>
<div class="cr08-st" id="cr08-st"></div>
<div class="cr08-cap" aria-hidden="true">Collapsible Sidebar</div>
<script>(()=>{
  const s=document.getElementById('cr08-st'),RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SPR='cubic-bezier(.3,1.45,.5,1)',NO={finished:Promise.resolve(),cancel(){}},anim=(el,kf,o)=>RM()?NO:el.animate(kf,Object.assign({duration:300,easing:'cubic-bezier(.2,.8,.2,1)'},o));
  const A=[
    '<rect width="10" height="10" fill="#F2F0EA"/><circle cx="3.8" cy="6.2" r="3.4" fill="#2B4473"/><rect x="6.4" y="1" width=".8" height="8" fill="#0A0A0A"/>',
    '<rect width="10" height="10" fill="#0A0A0A"/><rect x="1.5" y="1.8" width="1.2" height="6.8" fill="#E2B01A"/><rect x="4" y="3" width="1.2" height="5.6" fill="#E2B01A"/><rect x="6.5" y="4.2" width="1.2" height="4.4" fill="#E2B01A"/>',
    '<rect width="10" height="10" fill="#E2B01A"/><circle cx="5" cy="5.8" r="3" fill="#D5412B"/><rect y="5.8" width="10" height="4.2" fill="#F2F0EA"/>',
    '<rect width="10" height="10" fill="#2B4473"/><circle cx="3" cy="3" r="1.4" fill="#F2F0EA"/><circle cx="7" cy="7" r="1.4" fill="#E2B01A"/>',
    '<rect width="10" height="10" fill="#F2F0EA"/><circle cx="0" cy="10" r="9" fill="#0A0A0A"/><circle cx="0" cy="10" r="6" fill="#D5412B"/><circle cx="0" cy="10" r="3" fill="#F2F0EA"/>',
    '<rect width="10" height="10" fill="#5E9470"/><path d="M0 10L10 0v10z" fill="#F2F0EA"/><circle cx="7" cy="7" r="1.4" fill="#0A0A0A"/>'
  ];
  const NAV=[
    ['M12 4a8 8 0 100 16 8 8 0 000-16zM12 10a2 2 0 100 4 2 2 0 000-4z','Stock'],
    ['M6 4h12v16l-3-2-3 2-3-2-3 2zM9 9h6M9 13h6','Orders'],
    ['M9 11a3 3 0 100-6 3 3 0 000 6zM3 19c0-3 2.7-5 6-5s6 2 6 5M16 5.5a3 3 0 010 5.5','People'],
    ['M4 19V5M4 19h16M8 15l4-5 3 3 4-6','Stats'],
    ['M4 7h10M18 7h2M4 17h4M12 17h8M16 5v4M10 15v4','Setup']
  ];
  const I=d=>`<svg class="cr08-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;
  const art=i=>`<svg class="cr08-art" viewBox="0 0 10 10" aria-hidden="true">${A[i%6]}</svg>`;
  s.innerHTML=`<div class="cr08-sb"><nav class="cr08-nv" aria-label="Main"><i class="cr08-ind" aria-hidden="true"></i><div class="cr08-top"><span class="cr08-br"><i class="cr08-disc"></i>Crate</span><button type="button" class="cr08-tg" aria-expanded="true" aria-controls="cr08-ul" aria-label="Collapse sidebar">${I('M15 6l-6 6 6 6')}</button></div><ul class="cr08-ul" id="cr08-ul">${NAV.map(([ic,l],i)=>`<li><button type="button" class="cr08-i" data-tip="${l}"${i?'':' aria-current="page"'}>${I(ic)}<span class="cr08-lb">${l}</span></button></li>`).join('')}</ul></nav><div class="cr08-mn" aria-hidden="true"></div></div>`;
  const root=s.querySelector('.cr08-sb'),ind=s.querySelector('.cr08-ind'),tg=s.querySelector('.cr08-tg'),its=[...s.querySelectorAll('.cr08-i')],main=s.querySelector('.cr08-mn');
  let cur=0;
  const place=()=>ind.style.transform=`translateY(${its[cur].offsetTop}px)`;
  const pick=(i,an)=>{cur=i;its.forEach((b,j)=>j===i?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));place();
    main.innerHTML=[0,1,2,3,4,5].map(j=>art(i*2+j)).join('');
    if(an)[...main.children].forEach((c,j)=>anim(c,[{opacity:0,transform:'scale(.8)'},{opacity:1,transform:'none'}],{duration:320,delay:j*28,easing:SPR,fill:'backwards'}))};
  ind.style.transition='none';pick(0);ind.offsetHeight;ind.style.transition='';
  if(typeof ResizeObserver==='function')new ResizeObserver(place).observe(root);
  its.forEach((b,i)=>b.addEventListener('click',()=>{b.hasAttribute('aria-current')||pick(i,true)}));
  s.querySelector('.cr08-ul').addEventListener('keydown',e=>{const i=its.indexOf(document.activeElement);if(i<0)return;if(e.key==='ArrowDown'){e.preventDefault();its[(i+1)%its.length].focus()}else if(e.key==='ArrowUp'){e.preventDefault();its[(i+its.length-1)%its.length].focus()}});
  const flip=()=>{const m=root.classList.toggle('cr08-min');tg.setAttribute('aria-expanded',String(!m));tg.setAttribute('aria-label',m?'Expand sidebar':'Collapse sidebar')};
  tg.onclick=flip;

  let demo=!RM()&&!(window.__foreverPreview&&window.__foreverPreview.demoEnabled===false),timer=0,kick=0,step=0;
  const play=()=>{if(!demo||RM()||document.hidden)return;const p=step++%4;if(p===0)pick(1,true);else if(p===1)flip();else if(p===2)pick(3,true);else{flip();pick(0,true)}};
  const stop=()=>{clearInterval(timer);clearTimeout(kick);timer=kick=0},start=()=>{if(!timer&&demo&&!RM())timer=setInterval(play,1250)},tk=()=>{demo=false;stop()};
  window.addEventListener('forever:interactive',tk);s.addEventListener('pointerdown',tk,true);s.addEventListener('keydown',tk,true);
  document.addEventListener('visibilitychange',()=>document.hidden?stop():demo&&start());
  window.addEventListener('message',e=>{if(e.data&&e.data.type==='forever:theme'&&(e.data.theme==='light'||e.data.theme==='dark'))document.documentElement.setAttribute('data-theme',e.data.theme)});
  if(demo){kick=setTimeout(play,600);start()}
})();</script>
</body>
