<title>Toggle Switches</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   This tile's default palette is already light, so both themes render the same; the hook keeps it
   on the canvas's light wall and lets it answer the forever:theme protocol. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#e0e5ec}
body{box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:8px 12px 24px}
.neu-cap{position:fixed;left:8px;bottom:7px;font:600 10px ui-monospace,monospace;color:#8a91a8;opacity:.35;letter-spacing:.5px;pointer-events:none;z-index:99}
.neu-panel{
  box-sizing:border-box;width:min(100%,240px);background:#e0e5ec;border-radius:24px;padding:28px 24px;
  box-shadow:8px 8px 18px #b8bec7,-8px -8px 18px #ffffff;
  display:flex;flex-direction:column;gap:22px;
}
.neu-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.neu-row-label{font:600 11px/1 system-ui,-apple-system,sans-serif;letter-spacing:2px;color:#8a91a8;min-width:36px}
.neu-track{
  flex:none;width:58px;height:44px;border:0;border-radius:15px;padding:0;background:transparent;
  position:relative;cursor:pointer;
}
.neu-track::before{content:"";position:absolute;inset:7px 0;border-radius:15px;background:#e0e5ec;
  box-shadow:inset 3px 3px 7px #b8bec7,inset -3px -3px 7px #ffffff}
.neu-track:focus-visible{outline:2px solid #816e31;outline-offset:2px}
.neu-thumb{
  width:22px;height:22px;border-radius:50%;
  background:#e0e5ec;
  box-shadow:3px 3px 7px #b8bec7,-3px -3px 7px #ffffff;
  position:absolute;top:11px;left:4px;
  transition:transform 260ms cubic-bezier(.4,0,.2,1),background 260ms;
}
.neu-track.neu-on .neu-thumb{
  transform:translateX(28px);
  background:#A68D3F;
  box-shadow:2px 2px 5px rgba(166,141,63,.4),-2px -2px 5px rgba(255,255,255,.6);
}
@media(max-width:280px){.neu-panel{padding:4px 12px;gap:0;border-radius:18px}}
@media(prefers-reduced-motion:reduce){.neu-thumb{transition:none}}
</style><script type="application/json" id="forever-agent-meta">

</head><body>
<div class="neu-panel">
  <div class="neu-row">
    <span class="neu-row-label">WIFI</span>
    <button class="neu-track" id="neu-sw0" type="button" role="switch" aria-label="Wi-Fi" aria-checked="false"><span class="neu-thumb"></span></button>
  </div>
  <div class="neu-row">
    <span class="neu-row-label">BT</span>
    <button class="neu-track" id="neu-sw1" type="button" role="switch" aria-label="Bluetooth" aria-checked="false"><span class="neu-thumb"></span></button>
  </div>
  <div class="neu-row">
    <span class="neu-row-label">VPN</span>
    <button class="neu-track" id="neu-sw2" type="button" role="switch" aria-label="VPN" aria-checked="false"><span class="neu-thumb"></span></button>
  </div>
</div>
<div class="neu-cap">TOGGLE SWITCHES</div>
<script>(()=>{
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const sw=[0,1,2].map(i=>document.getElementById('neu-sw'+i));
  const steps=[[0],[1],[2],[0,1,2,'off']];
  let step=0,timer=null,manual=false;
  function setOn(el,on){el.classList.toggle('neu-on',on);el.setAttribute('aria-checked',String(on));}
  function applyStep(s){
    const cur=steps[s];
    if(cur.includes('off')){sw.forEach(el=>setOn(el,false));}
    else{cur.forEach(i=>setOn(sw[i],true));}
  }
  function tick(){step=(step+1)%steps.length;applyStep(step);}
  function stop(){clearInterval(timer);timer=null;}
  function play(){
    stop();if(reduce||manual||document.hidden)return;
    timer=setInterval(tick,1400);
  }
  document.addEventListener('visibilitychange',()=>document.hidden?stop():play());
  sw.forEach(el=>el.addEventListener('click',()=>{
    manual=true;stop();setOn(el,el.getAttribute('aria-checked')!=='true');
  }));
  applyStep(0);
  play();
})();</script>
<script>(function(){addEventListener("message",function(e){var d=e.data;if(d&&d.type==="forever:theme"&&(d.theme==="light"||d.theme==="dark"))document.documentElement.setAttribute("data-theme",d.theme);});})();</script>
