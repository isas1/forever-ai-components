<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   This tile's default palette is already light, so both themes render the same; the hook keeps it
   on the canvas's light wall and lets it answer the forever:theme protocol. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#e0e5ec}
body{box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:12px 12px 28px}
.neu-cap{position:fixed;left:8px;bottom:7px;font:600 10px ui-monospace,monospace;color:#8a91a8;opacity:.35;letter-spacing:.5px;pointer-events:none;z-index:99}
.neu-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;--neu-size:min(62vmin,180px)}
.neu-scene{position:relative;width:var(--neu-size);height:var(--neu-size)}
.neu-ticks{position:absolute;inset:0}
.neu-tick{
  position:absolute;width:4px;height:5.56%;border-radius:2px;
  background:#9ba4b2;top:0;left:50%;transform-origin:2px calc(var(--neu-size)/2);
  margin-left:-2px;
}
.neu-tick.neu-tick-major{height:7.78%;background:#667084}
.neu-socket{
  position:absolute;inset:12.22%;border-radius:50%;
  background:#e0e5ec;
  box-shadow:inset 4px 4px 10px #b8bec7,inset -4px -4px 10px #ffffff;
}
.neu-knob{
  position:absolute;inset:18.89%;border-radius:50%;
  background:#e0e5ec;
  box-shadow:5px 5px 12px #b8bec7,-5px -5px 12px #ffffff;
}
.neu-marker{
  position:absolute;left:50%;top:8.93%;width:4px;height:14.29%;border-radius:2px;
  background:linear-gradient(180deg,#925D78,#999086);
  margin-left:-2px;transform-origin:2px 42px;
}
.neu-label{text-align:center;font:600 10px/1 system-ui,-apple-system,sans-serif;letter-spacing:2px;color:#596375}
</style><script type="application/json" id="forever-agent-meta">

<div class="neu-wrap">
<div class="neu-scene" id="neu-scene">
  <div class="neu-ticks" id="neu-ticks"></div>
  <div class="neu-socket"></div>
  <div class="neu-knob" id="neu-knob">
    <div class="neu-marker" id="neu-marker"></div>
  </div>
</div>
<div class="neu-label">VOLUME</div>
</div>
<div class="neu-cap">VOLUME KNOB</div>
<script>(()=>{
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const ticks=document.getElementById('neu-ticks');
  const knob=document.getElementById('neu-knob');
  const N=24;
  for(let i=0;i<N;i++){
    const t=document.createElement('div');
    t.className='neu-tick'+(i%4===0?' neu-tick-major':'');
    t.style.transform=`rotate(${i*(360/N)}deg)`;
    ticks.appendChild(t);
  }
  const PERIOD=6000;
  let start=null,raf=null,dir=1,base=0,elapsed=0;
  function frame(ts){
    if(!start)start=ts;
    const dt=ts-start;start=ts;
    elapsed+=dt*dir;
    if(elapsed>=PERIOD){elapsed=PERIOD;dir=-1;}
    else if(elapsed<=0){elapsed=0;dir=1;}
    const deg=(elapsed/PERIOD)*360;
    knob.style.transform=`rotate(${deg}deg)`;
    raf=requestAnimationFrame(frame);
  }
  function stop(){cancelAnimationFrame(raf);raf=null;start=null;}
  function play(){if(reduce){knob.style.transform='rotate(120deg)';return;}raf=requestAnimationFrame(frame);}
  document.addEventListener('visibilitychange',()=>document.hidden?stop():play());
  play();
})();</script>
<script>(function(){addEventListener("message",function(e){var d=e.data;if(d&&d.type==="forever:theme"&&(d.theme==="light"||d.theme==="dark"))document.documentElement.setAttribute("data-theme",d.theme);});})();</script>
</body></html>
