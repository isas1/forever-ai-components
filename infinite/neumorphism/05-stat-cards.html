<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="description" content="Stat Cards — Neumorphism. A self-contained, zero-dependency animated web component."><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stat Cards</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   This tile's default palette is already light, so both themes render the same; the hook keeps it
   on the canvas's light wall and lets it answer the forever:theme protocol. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#e0e5ec}
body{box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:8px 8px 24px}
.neu-cap{position:fixed;left:8px;bottom:7px;font:600 10px ui-monospace,monospace;color:#8a91a8;opacity:.35;letter-spacing:.5px;pointer-events:none;z-index:99}
.neu-grid{box-sizing:border-box;width:min(80vmin,240px);display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,2.5vmin,16px);padding:4px}
.neu-card{
  min-width:0;aspect-ratio:1;border-radius:clamp(12px,4vmin,20px);
  background:#e0e5ec;
  box-shadow:6px 6px 14px #b8bec7,-6px -6px 14px #ffffff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(3px,1vmin,6px);
  transition:box-shadow 160ms ease;
}
.neu-card.neu-pulse{
  box-shadow:8px 8px 18px #b0b6c0,-8px -8px 18px #ffffff;
}
.neu-icon{font-size:clamp(20px,6vmin,26px);line-height:1}
.neu-val{font:700 clamp(18px,5.1vmin,22px)/1 system-ui,-apple-system,sans-serif;color:#6b7280}
.neu-lbl{font:600 clamp(8px,2vmin,9px)/1 system-ui,-apple-system,sans-serif;letter-spacing:clamp(1px,.4vmin,1.8px);color:#9ca3af}
</style><script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/neumorphism/05-stat-cards.html",
 "title": "Stat Cards",
 "description": "Four neumorphic stat cards (temp, humidity, power, signal) cycle through live-updating values one at a time, each card pulsing its shadow on update.",
 "useWhen": "IoT dashboards, ambient data displays, smart-home panels, or any context showing slowly changing numeric metrics.",
 "avoidWhen": "Dark backgrounds — neumorphic shadows rely on the hardcoded #e0e5ec light gray. Not suitable where real-time data binding is needed.",
 "agentPrompt": "Change the tick interval from 900ms to 500ms, add a fifth card with icon \"🔋\" label \"BATT\" and range [10,100], and update the neu-grid to a 3-column layout. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "tick interval (setInterval 900ms)",
  "vals array (initial values)",
  "limits array (min/max per card)",
  "card icons and labels",
  "card size (width/height 108px)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "visibilitychange stop/play guard",
  "prefers-reduced-motion early return",
  "IIFE wrapper",
  "neu-pulse class timeout cleanup",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Background color hardcoded to #e0e5ec — neumorphic effect breaks on any other background",
  "No aria live region — screen readers won't announce value updates"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "neumorphism",
  "dashboard",
  "stats",
  "cards",
  "soft-ui",
  "ambient",
  "loop"
 ]
}
</script>
</head><body>
<div class="neu-grid">
  <div class="neu-card" id="neu-c0"><div class="neu-icon">🌡</div><div class="neu-val" id="neu-v0">22</div><div class="neu-lbl">TEMP</div></div>
  <div class="neu-card" id="neu-c1"><div class="neu-icon">💧</div><div class="neu-val" id="neu-v1">48</div><div class="neu-lbl">HUMID</div></div>
  <div class="neu-card" id="neu-c2"><div class="neu-icon">⚡</div><div class="neu-val" id="neu-v2">74</div><div class="neu-lbl">POWER</div></div>
  <div class="neu-card" id="neu-c3"><div class="neu-icon">📶</div><div class="neu-val" id="neu-v3">91</div><div class="neu-lbl">SIGNAL</div></div>
</div>
<div class="neu-cap">STAT CARDS</div>
<script>(()=>{
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const vals=[22,48,74,91];
  const deltas=[1,-1,2,-1];
  const limits=[[18,30],[40,60],[60,90],[80,99]];
  const cards=[0,1,2,3].map(i=>({card:document.getElementById('neu-c'+i),val:document.getElementById('neu-v'+i)}));
  let timer=null,cycle=0;
  function tick(){
    const i=cycle%4;
    vals[i]+=deltas[i];
    if(vals[i]>=limits[i][1]||vals[i]<=limits[i][0])deltas[i]*=-1;
    cards[i].val.textContent=vals[i];
    cards[i].card.classList.add('neu-pulse');
    setTimeout(()=>cards[i].card.classList.remove('neu-pulse'),300);
    cycle++;
  }
  function stop(){clearInterval(timer);}
  function play(){if(reduce)return;timer=setInterval(tick,900);}
  document.addEventListener('visibilitychange',()=>document.hidden?stop():play());
  play();
})();</script>
<script>(function(){addEventListener("message",function(e){var d=e.data;if(d&&d.type==="forever:theme"&&(d.theme==="light"||d.theme==="dark"))document.documentElement.setAttribute("data-theme",d.theme);});})();</script>
</body></html>
