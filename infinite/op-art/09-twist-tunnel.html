<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Concentric black-and-white squares rotate and shrink into a deep central vanishing point with shimmering moire depth bands.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Twist Tunnel</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults; light inverts the ground/ink pair
     (ink squares on white paper) and fades the vignette toward paper. The v0/v1
     pair is the grey ramp the JS maps its per-ring lightness through:
     v = v0 + light*(v1-v0), so dark stays rgb(255*light) exactly. */
  :root{
    --op09-bg:#0a0a0a; --op09-v0:0; --op09-v1:255;
    --op09-glow:rgba(255,255,255,.10); --op09-glow-t:rgba(255,255,255,0);
    --op09-vig-t:rgba(10,10,10,0); --op09-vig:rgba(10,10,10,.72);
    --op09-cap:#fff; --op09-cap-o:.42;
  }
  :root[data-theme="light"]{
    --op09-bg:#f4f4f2; --op09-v0:250; --op09-v1:18;
    --op09-glow:rgba(20,20,20,.06); --op09-glow-t:rgba(20,20,20,0);
    --op09-vig-t:rgba(244,244,242,0); --op09-vig:rgba(244,244,242,.72);
    --op09-cap:#141414; --op09-cap-o:.55;
  }
  html,body{margin:0;height:100%;background:var(--op09-bg);overflow:hidden}
  #op09-stage{position:fixed;inset:0;background:var(--op09-bg);display:block}
  #op09-c{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* static radial vignette + center glow — never repaints */
  #op09-stage::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle at 50% 50%,
      var(--op09-glow) 0%,
      var(--op09-glow-t) 22%,
      var(--op09-vig-t) 60%,
      var(--op09-vig) 100%);
  }
  .cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--op09-cap);opacity:var(--op09-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important}}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/op-art/09-twist-tunnel.html",
 "title": "Twist Tunnel",
 "description": "26 concentric squares shrink and twist into a vanishing point with alternating brightness bands producing moire shimmer and endless-depth illusion.",
 "useWhen": "Dark-mode hero backgrounds, loading screens, or any context needing a hypnotic geometric loop with high visual impact.",
 "avoidWhen": "Light backgrounds (hardcoded near-black canvas). Contexts where sustained motion causes vestibular discomfort — no reduced-motion animation fallback, only a static frame.",
 "agentPrompt": "Change RINGS to 18, set BASE_TWIST to 0.35, and swap stroke colors to alternate between deep purple and white by replacing the rgb(v,v,v) strokeStyle with hsl values. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "ring count (RINGS=26)",
  "shrink ratio per ring (SCALE=0.86)",
  "twist per ring (BASE_TWIST=0.20)",
  "global twist oscillation amplitude (0.35)",
  "drift speed (t*0.06)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "Float64Array corner reuse (allocation-free draw loop)",
  "IIFE wrapper",
  "visibility pause / stop",
  "reduced-motion static frame guard",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Background color hardcoded to near-black — must edit both CSS and fillStyle to change",
  "No color variant; strictly monochrome unless strokeStyle logic is replaced",
  "Moire banding can cause visual discomfort for photosensitive viewers"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "op-art",
  "tunnel",
  "concentric",
  "moire",
  "canvas",
  "geometric",
  "loop"
 ]
}
</script>
</head>
<body>
<div id="op09-stage" role="img" aria-label="Twist Tunnel: concentric black-and-white squares rotating and shrinking into a deep central vanishing point, in an Op Art idiom.">
  <canvas id="op09-c"></canvas>
</div>
<div class="cap">Twist Tunnel</div>
<script>
(function(){
  "use strict";
  var stage=document.getElementById("op09-stage");
  var cv=document.getElementById("op09-c");
  var ctx=cv.getContext("2d");
  var reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  var root=document.documentElement;

  // colours the canvas draws with — read once from the tokens, once per switch
  var C={bg:"#0a0a0a",v0:0,v1:255};
  function syncTheme(){
    var cs=getComputedStyle(root);
    C.bg=cs.getPropertyValue("--op09-bg").trim();
    C.v0=parseFloat(cs.getPropertyValue("--op09-v0"))||0;
    C.v1=parseFloat(cs.getPropertyValue("--op09-v1"))||255;
    if(W&&!running)drawFrame(reducePhase);   // static fallback must repaint on a live switch
  }
  addEventListener("message",function(e){
    var d=e.data;
    if(d&&d.type==="forever:theme"&&(d.theme==="light"||d.theme==="dark")){
      root.setAttribute("data-theme",d.theme); syncTheme();
    }
  });

  // --- sizing (cached; recomputed only on resize) ---
  var W=0,H=0,DPR=1,cx=0,cy=0,unit=0;
  function resize(){
    DPR=Math.min(2,window.devicePixelRatio||1);
    var w=stage.clientWidth||window.innerWidth;
    var h=stage.clientHeight||window.innerHeight;
    W=Math.max(1,Math.round(w*DPR));
    H=Math.max(1,Math.round(h*DPR));
    cv.width=W;cv.height=H;
    cx=W/2;cy=H/2;
    unit=Math.max(W,H)*0.56; // outermost ring reach
    if(reduce||!running){drawFrame(reducePhase);}
  }

  // --- tunnel parameters ---
  var RINGS=26;            // concentric squares (<=110)
  var SCALE=0.86;          // geometric shrink per ring inward
  var BASE_TWIST=0.20;     // radians of twist accumulated per ring
  var reducePhase=0;       // fixed phase for static frame

  // pre-allocated unit square corners (reused every ring, every frame)
  var sqx=new Float64Array(4), sqy=new Float64Array(4);

  function drawRing(s, ang, lw, light){
    // s: half-size in px, ang: rotation, lw: line width, light: 0..1
    var co=Math.cos(ang), si=Math.sin(ang);
    // corners of square at +/- s
    sqx[0]=-s; sqy[0]=-s;
    sqx[1]= s; sqy[1]=-s;
    sqx[2]= s; sqy[2]= s;
    sqx[3]=-s; sqy[3]= s;
    ctx.beginPath();
    for(var i=0;i<4;i++){
      var rx=sqx[i]*co - sqy[i]*si + cx;
      var ry=sqx[i]*si + sqy[i]*co + cy;
      if(i===0)ctx.moveTo(rx,ry);else ctx.lineTo(rx,ry);
    }
    ctx.closePath();
    ctx.lineWidth=lw;
    // alternate value for moire/depth banding, fade with depth
    var v=Math.round(C.v0+light*(C.v1-C.v0));
    ctx.strokeStyle="rgb("+v+","+v+","+v+")";
    ctx.stroke();
  }

  function drawFrame(t){
    ctx.fillStyle=C.bg;
    ctx.fillRect(0,0,W,H);
    // breathing depth: rings drift inward, cycling so the tunnel feels endless
    var drift=(t*0.06)% 1; // 0..1 fractional ring offset
    var twistGlobal=Math.sin(t*0.18)*0.35; // slow oscillating overall twist
    for(var i=RINGS-1;i>=0;i--){
      var d=i+drift;                       // continuous depth index
      var s=unit*Math.pow(SCALE,d);        // shrink inward
      if(s<1.2) continue;
      var ang=d*BASE_TWIST + twistGlobal*(d*0.12); // cumulative + global twist
      // depth shading: outer faint, mid bright, very inner dim toward void
      var depthN=d/RINGS;
      var light=0.18+0.82*Math.max(0,Math.min(1, Math.sin(depthN*Math.PI*0.92)+0.15));
      // alternating value bands create moire shimmer
      var band=((i&1)===0)?1:0.55;
      light*=band;
      var lw=Math.max(1*DPR,(2.4-depthN*1.6)*DPR);
      drawRing(s,ang,lw,light);
    }
  }

  // --- single rAF loop, allocation-free ---
  var running=false, raf=0, start=0;
  function loop(now){
    if(!running)return;
    if(!start)start=now;
    var t=(now-start)/1000;
    drawFrame(t);
    raf=requestAnimationFrame(loop);
  }
  function play(){
    if(running||reduce)return;
    running=true;start=0;
    raf=requestAnimationFrame(loop);
  }
  function stop(){
    running=false;
    if(raf)cancelAnimationFrame(raf);
    raf=0;
  }

  window.addEventListener("resize",resize,{passive:true});
  document.addEventListener("visibilitychange",function(){
    if(document.hidden)stop();
    else if(!reduce)play();
  });

  syncTheme();
  resize();
  if(reduce){
    drawFrame(reducePhase); // one calm static frame, no loop
  }else{
    play();
  }
})();
</script>
</body>
</html>
