<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Physarum slime-mold agents self-organize into glowing purple radial veins on dark ground, trails attract toward the cursor.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slime Mold Network</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract); the light
     re-theme is the [data-theme="light"] block. The per-pixel trail ramp is
     colour = base + pow(t,.7)*span (+ hot boost in the top decile), all "r,g,b", so
     light simply runs a negative span: pale agar ground, dark violet veins. --smn-base
     must equal the page bg — it is what an empty cell paints. */
  :root{
    --smn-bg:#0c0a14; --smn-cap:#d9b3ff; --smn-cap-o:.34;
    --smn-base:12,10,20; --smn-span:205,120,255; --smn-hot:40,90;
  }
  :root[data-theme="light"]{
    --smn-bg:#f6f3fa; --smn-cap:#6d21c4; --smn-cap-o:.66;
    --smn-base:246,243,250; --smn-span:-172,-207,-138; --smn-hot:-22,-18;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--smn-bg);}
  #smn-c{display:block;width:100%;height:100%;}
  .smn-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;
       letter-spacing:.14em;color:var(--smn-cap);opacity:var(--smn-cap-o);text-transform:uppercase;
       pointer-events:none;user-select:none;}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/organic-nature/14-slime-mold-network.html",
 "title": "Slime Mold Network",
 "description": "Up to 6000 agents simulate Physarum slime-mold behavior, self-organizing into glowing purple radial veins on a dark canvas; cursor attracts nearby agents.",
 "useWhen": "Dark-mode hero backgrounds, generative art displays, science or biology themed UIs, ambient screensaver contexts.",
 "avoidWhen": "Low-end devices (heavy per-frame agent and diffuse loops). Light backgrounds — background color is hardcoded dark purple-black.",
 "agentPrompt": "Change the vein color to teal by editing the r/gg/b channel formulas in the paint() function, e.g. set b=20+g*150 and gg=10+g*255 for a green-cyan shift. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "agent count cap (N=6000, GW*GH*0.18)",
  "deposit amount (DEP=22)",
  "decay rate (DECAY=0.90)",
  "sensor offset distance (SO=8)",
  "pointer attraction radius (d<90) and strength (0.08*mPow)",
  "vein color channel formula in paint()",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "low-res sim grid pattern (GMAX=240 cap, critical for perf)",
  "visibilitychange pause/start",
  "reduced-motion static fallback (240 pre-steps then paint)",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "CPU-bound dual loop (agent step + diffuse) — can drop frames on low-end mobile",
  "Sim grid resets on resize, losing all trail state",
  "Background color hardcoded in CSS (#0c0a14)"
 ],
 "tier": "curated",
 "labels": [
  "animation-heavy",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "slime-mold",
  "physarum",
  "particles",
  "simulation",
  "generative",
  "organic",
  "network"
 ]
}
</script>
</head>
<body>
<canvas id="smn-c"></canvas>
<div class="smn-cap">Slime Mold Network</div>
<script>
(function(){
  const cv=document.getElementById('smn-c'),ctx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,H,DPR,GW,GH,trail,next,ag,N,img,buf,tc,tcx;
  const SCALE=2; // sim grid is canvas/SCALE for speed
  const SA=0.55,RA=0.42,SO=8,SS=1.1,DEP=22,DECAY=0.90,DIFF=0.16;
  let mx=-999,my=-999,mPow=0;
  const root=document.documentElement;
  // the trail ramp is the only colour the canvas draws with — read from the tokens
  const C={base:[12,10,20],span:[205,120,255],hot:[40,90]};
  function syncTheme(){
    const cs=getComputedStyle(root),trip=k=>cs.getPropertyValue(k).split(',').map(Number);
    C.base=trip('--smn-base');C.span=trip('--smn-span');C.hot=trip('--smn-hot');
  }
  addEventListener('message',function(e){
    const d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
      root.setAttribute('data-theme',d.theme);syncTheme();paint();   // repaint the field now
    }
  });
  syncTheme();

  function size(){
    DPR=Math.min(devicePixelRatio||1,2);
    W=cv.clientWidth;H=cv.clientHeight;
    cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(1,0,0,1,0,0);
    // cap sim-grid cell budget so the diffuse pass stays bounded on large screens
    const GMAX=240,asp=W/H;
    GW=Math.max(80,Math.min(GMAX,Math.round(W*DPR/SCALE)));GH=Math.max(80,Math.min(GMAX,Math.round(H*DPR/SCALE)));
    if(W*DPR/SCALE>GMAX||H*DPR/SCALE>GMAX){ // preserve aspect within the cap
      if(asp>=1){GW=GMAX;GH=Math.max(80,Math.round(GMAX/asp));}else{GH=GMAX;GW=Math.max(80,Math.round(GMAX*asp));}
    }
    trail=new Float32Array(GW*GH);next=new Float32Array(GW*GH);
    img=ctx.createImageData(GW,GH);buf=new Uint32Array(img.data.buffer);
    tc=tc||document.createElement('canvas');tc.width=GW;tc.height=GH;tcx=tc.getContext('2d');
    N=Math.min(6000,Math.round(GW*GH*0.18));ag=new Float32Array(N*3);
    // seed agents in a disc, headings outward → radial veins
    const ccx=GW/2,ccy=GH/2,rad=Math.min(GW,GH)*0.34;
    for(let i=0;i<N;i++){
      const a=Math.random()*6.2832,r=Math.sqrt(Math.random())*rad;
      ag[i*3]=ccx+Math.cos(a)*r;ag[i*3+1]=ccy+Math.sin(a)*r;
      ag[i*3+2]=a+Math.PI+(Math.random()-0.5);
    }
  }
  addEventListener('resize',size);size();

  function sample(x,y,h){
    let sx=x+Math.cos(h)*SO,sy=y+Math.sin(h)*SO;
    sx=((sx%GW)+GW)%GW;sy=((sy%GH)+GH)%GH;
    return trail[(sy|0)*GW+(sx|0)];
  }
  function step(){
    // sense + steer + move + deposit
    for(let i=0;i<N;i++){
      const o=i*3;let x=ag[o],y=ag[o+1],h=ag[o+2];
      const c=sample(x,y,h),l=sample(x,y,h-SA),r=sample(x,y,h+SA);
      if(c>l&&c>r){}
      else if(l>r)h-=RA*(0.5+Math.random()*0.5);
      else if(r>l)h+=RA*(0.5+Math.random()*0.5);
      else h+=(Math.random()-0.5)*RA;
      // attract to pointer
      if(mPow>0.01){
        const dx=mx-x,dy=my-y,d=Math.hypot(dx,dy);
        if(d<90&&d>1)h+=(((Math.atan2(dy,dx)-h+9.4248)%6.2832)-3.1416)*0.08*mPow;
      }
      x+=Math.cos(h)*SS;y+=Math.sin(h)*SS;
      if(x<0)x+=GW;else if(x>=GW)x-=GW;
      if(y<0)y+=GH;else if(y>=GH)y-=GH;
      ag[o]=x;ag[o+1]=y;ag[o+2]=h;
      const idx=(y|0)*GW+(x|0);trail[idx]=Math.min(255,trail[idx]+DEP);
    }
    // diffuse + decay (cheap 4-neighbour blur)
    for(let yy=1;yy<GH-1;yy++){
      let row=yy*GW;
      for(let xx=1;xx<GW-1;xx++){
        const i=row+xx;
        const v=trail[i]*(1-DIFF)+(trail[i-1]+trail[i+1]+trail[i-GW]+trail[i+GW])*(DIFF*0.25);
        next[i]=v*DECAY;
      }
    }
    const tmp=trail;trail=next;next=tmp;
    mPow*=0.95;
  }
  function paint(){
    const r0=C.base[0],g0=C.base[1],b0=C.base[2];
    const rs=C.span[0],gs=C.span[1],bs=C.span[2],hr=C.hot[0],hg=C.hot[1];
    for(let i=0,n=GW*GH;i<n;i++){
      let v=trail[i];if(v>255)v=255;
      const t=v/255;
      // ground base → purple veins → accent cores (light: pale agar → deep violet)
      const g=Math.pow(t,0.7);
      const r=r0+g*rs+(t>0.75?(t-0.75)*4*hr:0);
      const gg=g0+g*gs+(t>0.8?(t-0.8)*5*hg:0);
      const b=b0+g*bs;
      buf[i]=(255<<24)|((b>255?255:b)<<16)|((gg>255?255:gg)<<8)|(r>255?255:r);
    }
    // nearest-neighbour upscale to backing store
    ctx.save();
    tcx.putImageData(img,0,0);
    ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
    ctx.globalCompositeOperation='source-over';
    ctx.drawImage(tc,0,0,W*DPR,H*DPR);
    ctx.restore();
  }
  cv.addEventListener('pointermove',e=>{
    const r=cv.getBoundingClientRect();
    mx=(e.clientX-r.left)/W*GW;my=(e.clientY-r.top)/H*GH;mPow=1;
  });
  cv.addEventListener('pointerleave',()=>{mPow=0;});

  let raf=0;
  function frame(){step();paint();raf=requestAnimationFrame(frame);}
  function start(){if(!raf&&!reduce)raf=requestAnimationFrame(frame);}
  function stop(){cancelAnimationFrame(raf);raf=0;}
  document.addEventListener('visibilitychange',()=>{document.hidden?stop():start();});
  if(reduce){for(let k=0;k<240;k++)step();paint();}else start();
})();
</script>
</body>
</html>
