<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Rainbow particle sparks emit and arc off a cursor (auto-orbits when idle) on near-black, fading into a glowing trail.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pointer Trail</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract);
     the light re-theme is the [data-theme="light"] block. --c09-fade is the per-frame trail
     wash (must match the page bg); spark lightness = --c09-l0 + life * --c09-lk, so dark
     sparks glow brighter as they are born and light ones ink darker. */
  :root{
    --c09-bg:#05060c; --c09-cap:#67e8f9; --c09-cap-o:.5;
    --c09-fade:rgba(5,6,12,0.18); --c09-s:95; --c09-l0:60; --c09-lk:15;
  }
  :root[data-theme="light"]{
    --c09-bg:#f0f1f6; --c09-cap:#057684; --c09-cap-o:.6;
    --c09-fade:rgba(240,241,246,0.18); --c09-s:90; --c09-l0:30; --c09-lk:-8;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--c09-bg)}
  #c{display:block;width:100%;height:100%}
  .cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;
    color:var(--c09-cap);opacity:var(--c09-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/particles-physics/09-pointer-trail.html",
 "title": "Pointer Trail",
 "description": "Rainbow spark particles arc off the cursor position, fading with a glow trail on near-black. Auto-orbits in a Lissajous path when the pointer leaves.",
 "useWhen": "Dark-background hero sections, creative portfolio landing pages, or ambient interactive demos where cursor magic adds delight.",
 "avoidWhen": "Light backgrounds (hardcoded dark fill), content-dense layouts where cursor trails distract from reading, or reduced-motion contexts needing full animation.",
 "agentPrompt": "Change particle cap from 110 to 60, slow hue cycling by setting t*40 to t*20, and increase gravity from 0.02 to 0.06 so sparks arc downward faster. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "particle cap (parts.length<110)",
  "hue cycle speed (t*40)",
  "gravity strength (p.vy+=0.02)",
  "particle size range (1.5+Math.random()*2.5)",
  "trail fade opacity (rgba 0.18)",
  "auto-orbit radius (W*0.32, H*0.32)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "visibilitychange pause/resume",
  "DPR-aware canvas sizing",
  "auto-orbit fallback when pointer absent",
  "reduced-motion guard (single-frame only)",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Reduced-motion guard only draws one static frame — not a true static fallback (no meaningful still state)",
  "Background color hardcoded in CSS and JS fill — two places to change",
  "Particle cap of 110 may still tax very low-end mobile CPUs"
 ],
 "tier": "curated",
 "labels": [
  "mobile-ready",
  "copy-paste-safe",
  "minimal-deps",
  "animation-heavy",
  "light-ready"
 ],
 "tags": [
  "particles",
  "trail",
  "pointer",
  "rainbow",
  "canvas",
  "generative",
  "ambient"
 ]
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap">Pointer Trail</div>
<script>
(function(){
const cv=document.getElementById('c'),x=cv.getContext('2d');
let W,H,DPR,parts=[],t=0,reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let pos={x:0,y:0},auto=true;
const root=document.documentElement;
let FADE='rgba(5,6,12,0.18)',PS=95,PL0=60,PLK=15;   // trail wash + spark hsl saturation / lightness ramp
function syncTheme(){const cs=getComputedStyle(root),n=k=>parseFloat(cs.getPropertyValue(k));
  FADE=cs.getPropertyValue('--c09-fade').trim();
  PS=n('--c09-s');PL0=n('--c09-l0');PLK=n('--c09-lk');}
// live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
addEventListener('message',e=>{const d=e.data;
  if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){root.setAttribute('data-theme',d.theme);syncTheme();}});
syncTheme();
function size(){DPR=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*DPR;cv.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0);pos.x=W/2;pos.y=H/2;}
addEventListener('resize',size);size();
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();
  pos.x=e.clientX-r.left;pos.y=e.clientY-r.top;auto=false;});
cv.addEventListener('pointerleave',()=>auto=true);
let last={x:W/2,y:H/2};
function emit(px,py,vx,vy){
  const sp=Math.hypot(vx,vy),count=Math.min(4,1+(sp/6|0));
  for(let i=0;i<count&&parts.length<110;i++)
    parts.push({x:px,y:py,vx:vx*0.15+(Math.random()-0.5)*1.2,
      vy:vy*0.15+(Math.random()-0.5)*1.2,life:1,
      r:1.5+Math.random()*2.5,h:(t*40+i*30)%360});
}
function step(){
  x.fillStyle=FADE;x.fillRect(0,0,W,H);t+=0.02;
  let tx,ty;
  if(auto){tx=W/2+Math.cos(t*1.1)*W*0.32+Math.cos(t*2.3)*W*0.1;
    ty=H/2+Math.sin(t*1.5)*H*0.32+Math.sin(t*3.1)*H*0.08;}
  else{tx=pos.x;ty=pos.y;}
  const vx=tx-last.x,vy=ty-last.y;
  emit(tx,ty,vx,vy);last.x=tx;last.y=ty;
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.02;p.vx*=0.96;p.vy*=0.96;p.life-=0.022;
    if(p.life<=0){parts.splice(i,1);continue;}
    x.globalAlpha=p.life;x.fillStyle='hsl('+p.h+','+PS+'%,'+(PL0+p.life*PLK)+'%)';
    x.beginPath();x.arc(p.x,p.y,p.r*p.life+0.4,0,7);x.fill();}
  x.globalAlpha=1;
}
let raf;function loop(){step();raf=requestAnimationFrame(loop);}
function play(){if(!raf&&!document.hidden){if(reduce){step();return;}loop();}}
function stop(){cancelAnimationFrame(raf);raf=0;}
document.addEventListener('visibilitychange',()=>document.hidden?stop():play());
play();
})();
</script>
</body>
</html>
