<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Teal smoke streamlines flow past an invisible cylinder, shedding alternating vortices in a Karman street; pointer disturbs the flow.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smoke Vortex Street</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults; light palette in the [data-theme] block.
     --svs-c0/-cd are the smoke ramp (base rgb + per-heat delta) read back by syncTheme. */
  :root{
    --svs-bg:#0a1416; --svs-fade:rgba(10,20,22,0.13); --svs-accent:#5fd0c4; --svs-cap-o:.34;
    --svs-c0:40,150,150; --svs-cd:70,60,40; --svs-a0:0.10; --svs-ak:0.5;
    --svs-ob:95,208,196; --svs-ob-a:0.10;
  }
  :root[data-theme="light"]{
    --svs-bg:#eef5f5; --svs-fade:rgba(238,245,245,0.13); --svs-accent:#247c73; --svs-cap-o:.62;
    --svs-c0:150,196,192; --svs-cd:-122,-130,-118; --svs-a0:0.14; --svs-ak:0.6;
    --svs-ob:36,124,115; --svs-ob-a:0.16;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--svs-bg);}
  #svs-c{display:block;width:100%;height:100%;}
  .cap{position:fixed;left:9px;bottom:8px;font:600 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;
       letter-spacing:.13em;color:var(--svs-accent);opacity:var(--svs-cap-o);text-transform:uppercase;
       pointer-events:none;user-select:none;}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/particles-physics/13-smoke-vortex-street.html",
 "title": "Smoke Vortex Street",
 "description": "300 teal smoke streamlines flow past an invisible cylinder, shedding alternating Karman vortices; pointer repels nearby particles revealing the swirling wake.",
 "useWhen": "Dark ambient backgrounds, fluid-dynamics demos, science or generative-art hero sections.",
 "avoidWhen": "Light-background UIs (background is hardcoded dark teal-black). Contexts where pointer interaction competes with UI elements above the canvas.",
 "agentPrompt": "Change the smoke color to a warm amber palette by editing the strokeStyle line: replace (40+heat*70|0),(150+heat*60|0),(150+heat*40|0) with (220+heat*35|0),(120+heat*80|0),(20+heat*20|0). Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "particle count (N=300)",
  "obstacle position (oX=W*0.30, oY=H*0.5)",
  "obstacle radius (oR=sc*0.07)",
  "eddy shed period (period=58)",
  "base flow speed (sc*0.0016)",
  "smoke color (strokeStyle heat ramp)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "IIFE wrapper",
  "prefers-reduced-motion guard and static fallback",
  "visibilitychange pause/start",
  "DPR-aware canvas sizing",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Background color is hardcoded in CSS (#0a1416) — must edit to use on non-dark themes",
  "Eddy shedding uses integer modulo (t%period===0) so period must be an integer",
  "Reduced-motion path runs 160 static frames then halts — result may look sparse on large viewports"
 ],
 "tier": "curated",
 "labels": [
  "accessible",
  "mobile-ready",
  "copy-paste-safe",
  "minimal-deps",
  "animation-heavy",
  "light-ready"
 ],
 "tags": [
  "smoke",
  "fluid",
  "vortex",
  "karman-street",
  "particles",
  "physics",
  "ambient"
 ]
}
</script>
</head>
<body>
<canvas id="svs-c"></canvas>
<div class="cap">Smoke Vortex Street</div>
<script>
(function(){
  const cv=document.getElementById('svs-c'),ctx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,H,DPR,oX,oY,oR,sc;
  // smoke colours live in the tokens; a theme flip re-reads them (no per-frame getComputedStyle)
  const root=document.documentElement, C={};
  function syncTheme(){
    const cs=getComputedStyle(root), g=n=>cs.getPropertyValue(n).trim();
    C.bg=g('--svs-bg');C.fade=g('--svs-fade');C.ob=g('--svs-ob');C.obA=g('--svs-ob-a');
    C.c0=g('--svs-c0').split(',').map(Number);C.cd=g('--svs-cd').split(',').map(Number);
    C.a0=+g('--svs-a0');C.ak=+g('--svs-ak');
  }
  addEventListener('message',e=>{const d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
      root.setAttribute('data-theme',d.theme);syncTheme();
      if(reduce){ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);for(let k=0;k<160;k++)frame();}
    }});
  syncTheme();
  function size(){
    DPR=Math.min(devicePixelRatio||1,2);
    W=cv.clientWidth;H=cv.clientHeight;
    cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
    sc=Math.min(W,H);oR=sc*0.07;oX=W*0.30;oY=H*0.5;
  }
  addEventListener('resize',size);size();

  // vortex street: alternating discrete eddies shed from the obstacle, drifting downstream
  const ED=14,eddies=[];
  function seedEddy(e,phase){
    e.x=oX; e.y=oY+(phase?1:-1)*oR*0.85; e.s=(phase?1:-1); // spin sign alternates
    e.born=t; e.life=0; e.k=0.9+Math.random()*0.3; if(e.fade==null)e.fade=0;
  }
  let t=0;
  for(let i=0;i<ED;i++){eddies.push({});seedEddy(eddies[i],i%2); eddies[i].x=oX+i*(W*0.06); eddies[i].born=-i*40;}

  const N=reduce?260:300,P=[];
  for(let i=0;i<N;i++)P.push({x:Math.random()*W,y:Math.random()*H,h:0});

  let mx=-1,my=-1,nudge=0;
  cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;nudge=1;});
  cv.addEventListener('pointerleave',()=>{mx=-1;});

  // smooth curl-ish background flow + obstacle deflection + eddy rotation
  function flow(x,y,vx,out){
    let u=vx, v=0;
    // breathing ripple, lazy left->right
    const ph=t*0.012;
    v += Math.sin(x*0.010+ph)*0.18*vx + Math.cos(y*0.013-ph*1.3)*0.12*vx;
    u += Math.sin(y*0.011+ph*0.7)*0.10*vx;
    // obstacle: push flow around the cylinder
    const dx=x-oX,dy=y-oY,d2=dx*dx+dy*dy,r2=oR*oR;
    if(d2<r2*9){
      const d=Math.sqrt(d2)+1e-3, str=r2/(d2+r2*0.3);
      u += (dx/d)*str*vx*0.9; v += (dy/d)*str*vx*0.9;
    }
    // eddies: tangential swirl
    for(let i=0;i<ED;i++){
      const e=eddies[i];
      if(e.fade<0.01)continue;           // dormant eddy contributes nothing
      const ex=x-e.x,ey=y-e.y,ed2=ex*ex+ey*ey;
      const rad=oR*1.9*e.k, rr=rad*rad;
      if(ed2<rr*4){
        const fall=Math.exp(-ed2/rr), w=e.s*fall*vx*1.35*e.fade;
        u += -ey*w/rad; v += ex*w/rad;
      }
    }
    out[0]=u;out[1]=v;
  }

  const buf=[0,0];
  function frame(){
    t+=reduce?0:1;
    ctx.fillStyle=C.fade;ctx.fillRect(0,0,W,H);
    const vx=sc*0.0016*(1+nudge*0.5);nudge*=0.95;

    // shed an alternating eddy on a steady period (Strouhal-like cadence)
    if(!reduce){
      const period=58;
      if(t%period===0){
        // recycle the eddy that's drifted farthest right
        let far=0;for(let i=1;i<ED;i++)if(eddies[i].x>eddies[far].x)far=i;
        seedEddy(eddies[far],(t/period)%2);
      }
    }
    for(let i=0;i<ED;i++){
      const e=eddies[i];
      if(!reduce){e.x+=vx*1.0;e.y+=Math.sin((e.x-oX)*0.02)*0.15;}
      // ramp in as it leaves the obstacle, fade out near the right edge
      const grow=Math.max(0,Math.min(1,(e.x-oX)/(oR*5)));
      const decay=Math.max(0,1-Math.max(0,e.x-W*0.92)/(W*0.12));
      e.fade=grow*decay;
    }

    ctx.lineCap='round';
    for(let i=0;i<N;i++){
      const p=P[i];
      flow(p.x,p.y,vx,buf);
      let u=buf[0],v=buf[1];
      if(mx>=0){const dx=p.x-mx,dy=p.y-my,dd=dx*dx+dy*dy;if(dd<sc*sc*0.02){const f=sc*0.0009/(dd*0.0006+1);u+=dx*f;v+=dy*f;}}
      const nx=p.x+u, ny=p.y+v;
      const speed=Math.hypot(u,v);
      p.h=p.h*0.9+speed*0.1;
      const heat=Math.min(1,p.h/(vx*2.2));
      // teal smoke -> brighter accent in fast swirls
      const a=C.a0+heat*C.ak;
      ctx.strokeStyle='rgba('+(C.c0[0]+heat*C.cd[0]|0)+','+(C.c0[1]+heat*C.cd[1]|0)+','+(C.c0[2]+heat*C.cd[2]|0)+','+a+')';
      ctx.lineWidth=(0.5+heat*1.1);
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(nx,ny);ctx.stroke();
      p.x=nx;p.y=ny;
      // wrap: recycle off the right / strays, re-emit from the left band
      if(p.x>W+4||p.y<-4||p.y>H+4||p.x<-4){p.x=-3;p.y=Math.random()*H;p.h=0;}
    }

    // faint obstacle marker (invisible cylinder, just a whisper)
    const g=ctx.createRadialGradient(oX,oY,oR*0.2,oX,oY,oR*1.3);
    g.addColorStop(0,'rgba('+C.ob+','+C.obA+')');g.addColorStop(1,'rgba('+C.ob+',0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(oX,oY,oR*1.3,0,Math.PI*2);ctx.fill();

    if(!reduce)raf=requestAnimationFrame(frame);
  }
  let raf=0;
  function start(){if(!raf&&!reduce)raf=requestAnimationFrame(frame);}
  function stop(){cancelAnimationFrame(raf);raf=0;}
  document.addEventListener('visibilitychange',()=>{document.hidden?stop():start();});
  if(reduce){ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);for(let k=0;k<160;k++)frame();}else start();
})();
</script>
</body>
</html>
