    color: #00E8D8;
  }

.bg02-preset1{color:#E52521}

.bg02-wrap[data-paused] *,.bg02-wrap[data-paused]{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){.bg02-wrap,.bg02-wrap *{animation:none!important;transition:none!important}}
@container fit-21-pixel-particle-gravity-fountain (max-width:300px){.bg02-wrap{width:calc(100% - 16px);padding:12px;gap:8px;box-shadow:3px 3px 0 #808080}.bg02-hdr{font-size:12px}.bg02-ctrl{gap:5px}.bg02-btn{font-size:12px;padding:7px}.bg02-stat{font-size:12px}}
@container fit-21-pixel-particle-gravity-fountain (max-width:210px){.bg02-wrap{padding:8px;gap:5px}.bg02-hdr{display:none}.bg02-wrap canvas{height:76px}.bg02-btn{font-size:12px;padding:7px}.bg02-stat{font-size:12px}}

 "file": "infinite/particles-physics/21-pixel-particle-gravity-fountain.html",

<body>
<div class="bg02-wrap" role="region" aria-label="Pixel Particle Fountain">
  <div class="bg02-hdr">
    <span>PIXEL FOUNTAIN</span>
    <span class="bg02-preset1">16-BIT PHY</span>
  </div>

  <canvas id="bg02-cv" width="160" height="100"></canvas>

  <div class="bg02-ctrl">
    <button id="bg02-gravBtn" class="bg02-btn" type="button">GRAV: 1.0G</button>
    <span class="bg02-stat" id="bg02-particleCount">PARTICLES: 64</span>
  </div>
</div>

<div class="bg02-cap" aria-hidden="true">Pixel Particle Fountain</div>
<script>
(()=>{
  let demoEnabled=window.__foreverPreview?.demoEnabled!==false,sessionActive=false,takenOver=window.__foreverPreview?.interactive===true;
  function stopDemo(){if(!takenOver){sessionActive=false;takenOver=true;}demoEnabled=false;pauseCSS();}
  addEventListener('forever:interactive',stopDemo);
  document.addEventListener('pointerdown',stopDemo,{capture:true});document.addEventListener('click',stopDemo,{capture:true});document.addEventListener('keydown',e=>{if(e.key!=='Tab')stopDemo();},{capture:true});

  const tileRoot = document.querySelector('.bg02-wrap');
  const pauseCSS=()=>tileRoot.toggleAttribute('data-paused',document.hidden||!demoEnabled);addEventListener('forever:interactive',pauseCSS);
  document.addEventListener('visibilitychange', pauseCSS); pauseCSS();

  // Local frame lifecycle: stop hidden work, repaint reduced-motion state on input.
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const frames = new Map(), drivers = new Set(); let painting = false;
  function scheduleFrame(fn) {
    drivers.add(fn);
    if (document.hidden || frames.has(fn) || (motion.matches && painting)) return;
    frames.set(fn, requestAnimationFrame(t => {
      frames.delete(fn); if (document.hidden) return;
      painting = true; try { fn(t); } finally { painting = false; }
    }));
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { frames.forEach(cancelAnimationFrame); frames.clear(); }
    else if(demoEnabled||sessionActive)drivers.forEach(scheduleFrame);
  });
  const repaint=e=>{if(!e.target.closest(".bg02-wrap"))return;sessionActive=true;drivers.forEach(scheduleFrame);};
  ['click','input','pointermove'].forEach(type => document.addEventListener(type, repaint));
  motion.addEventListener('change', () => { reduce = motion.matches; drivers.forEach(scheduleFrame); });

  let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = document.getElementById('bg02-cv');
  const ctx = cv.getContext('2d');
  const gravBtn = document.getElementById('bg02-gravBtn');
  const particleCount = document.getElementById('bg02-particleCount');

  const gravModes = [
    { label: 'GRAV: 1.0G (EARTH)', g: 0.12 },
    { label: 'GRAV: 0.2G (MOON)',  g: 0.03 },
    { label: 'GRAV: ZERO G',      g: 0.00 },
    { label: 'GRAV: -0.8G (INV)',  g: -0.09 }
  ];
  let curGrav = 0;

  gravBtn.addEventListener('click', () => {
    sessionActive=true;scheduleFrame(render);
    curGrav = (curGrav + 1) % gravModes.length;
    gravBtn.textContent = gravModes[curGrav].label;
  });

  const colors = ['#FFCC00', '#E52521', '#00E8D8', '#FFFFFF', '#8BAC0F'];
  const particles = [];
  const maxP = 64;

  function spawn() {
    if (particles.length < maxP) {
      particles.push({
        x: cv.width / 2 + (Math.random() - 0.5) * 6,
        y: curGrav === 3 ? 10 : cv.height - 12,
        vx: (Math.random() - 0.5) * 2.8,
        vy: curGrav === 3 ? Math.random() * 2 + 1 : -Math.random() * 3.5 - 2,
        col: colors[Math.floor(Math.random() * colors.length)],
        life: 80 + Math.random() * 40
      });
    }
  }

  // Click on canvas to burst
  cv.addEventListener('click', (e) => {
    const r = cv.getBoundingClientRect();
    const cx = ((e.clientX - r.left) / r.width) * cv.width;
    const cy = ((e.clientY - r.top) / r.height) * cv.height;
    for (let i = 0; i < 20 && particles.length < maxP; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = Math.random() * 3 + 1;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        col: colors[Math.floor(Math.random() * colors.length)],
        life: 60
      });
    }
  });

  for (let i = 0; i < 24; i++) { spawn(); const p = particles[particles.length - 1]; p.x += p.vx * i; p.y += p.vy * i + gravModes[curGrav].g * i * i / 2; }
  let running = true;
  document.addEventListener('visibilitychange', () => { running = !document.hidden; });

  function render() {
    if (!running) return;

    if(demoEnabled&&!reduce){spawn();spawn();}

    const g = gravModes[curGrav].g;

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, cv.width, cv.height);

    // Floor line
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, cv.height - 2, cv.width, 2);

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vy += g;
      p.x += p.vx;
      p.y += p.vy;
      p.life--;

      // Bounce off floor
      if (p.y > cv.height - 4) {
        p.y = cv.height - 4;
        p.vy = -p.vy * 0.65;
      }
      // Bounce off ceiling
      if (p.y < 2) {
        p.y = 2;
        p.vy = -p.vy * 0.65;
      }
      // Bounce walls
      if (p.x < 2 || p.x > cv.width - 4) {
        p.vx = -p.vx * 0.8;
      }

      // Draw 2x2 or 3x3 pixel block
      ctx.fillStyle = p.col;
      ctx.fillRect(Math.floor(p.x), Math.floor(p.y), 2, 2);

      if (p.life <= 0) particles.splice(i, 1);
    }

    particleCount.textContent = `P: ${particles.length}`;
    if(demoEnabled||particles.length)scheduleFrame(render);
  }
  scheduleFrame(render);
})();
</script>
</body>
