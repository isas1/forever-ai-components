<div class="pa06-cup-wrap" role="region" aria-label="Espresso Crema Viscosity">
  <canvas id="pa06-cv" width="360" height="360"></canvas>
  <div class="pa06-caption" aria-hidden="true">stir the espresso</div>
</div>
<div class="pa06-cap" aria-hidden="true">Viscosity Swirl</div>
<script>
(()=>{
  let demoEnabled=window.__foreverPreview?.demoEnabled!==false,sessionActive=false,takenOver=window.__foreverPreview?.interactive===true;
  function stopDemo(){if(!takenOver){sessionActive=false;takenOver=true;}demoEnabled=false;pauseCSS();}
  addEventListener('forever:interactive',stopDemo);
  document.addEventListener('pointerdown',stopDemo,{capture:true});document.addEventListener('click',stopDemo,{capture:true});document.addEventListener('keydown',e=>{if(e.key!=='Tab')stopDemo();},{capture:true});

  const tileRoot = document.querySelector('.pa06-cup-wrap');
  const pauseCSS=()=>tileRoot.toggleAttribute('data-paused',document.hidden||!demoEnabled);addEventListener('forever:interactive',pauseCSS);
  document.addEventListener('visibilitychange', pauseCSS); pauseCSS();

  // Local frame lifecycle: stop hidden work, repaint reduced-motion state on input.
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const frames = new Map(), drivers = new Set(); let painting = false;
  function scheduleFrame(fn) {
    drivers.add(fn);
    if (document.hidden || frames.has(fn) || (motion.matches && painting)) return;
    frames.set(fn, requestAnimationFrame(t => {
      frames.delete(fn); if (document.hidden) return;
      painting = true; try { fn(t); } finally { painting = false; }
    }));
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { frames.forEach(cancelAnimationFrame); frames.clear(); }
    else if(demoEnabled||sessionActive)drivers.forEach(scheduleFrame);
  });
  const repaint=e=>{if(!e.target.closest(".pa06-cup-wrap"))return;sessionActive=true;drivers.forEach(scheduleFrame);};
  ['click','input','pointermove'].forEach(type => document.addEventListener(type, repaint));
  motion.addEventListener('change', () => { reduce = motion.matches; drivers.forEach(scheduleFrame); });

  const canvas = document.getElementById('pa06-cv');
  const ctx = canvas.getContext('2d');
  let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w = canvas.width = 360, h = canvas.height = 360;
  let running = true, time = 0;
  document.addEventListener('visibilitychange', () => { running = !document.hidden; });

  const particles = Array.from({ length: 65 }, () => {
    const angle = Math.random() * Math.PI * 2;
    const r = Math.random() * 120;
    return {
      x: w*0.5 + Math.cos(angle)*r,
      y: h*0.5 + Math.sin(angle)*r,
      r: 6 + Math.random() * 14,
      color: Math.random() > 0.4 ? '#E9C96A' : '#C78C46'
    };
  });

  let pointer = { x: w*0.5, y: h*0.5, on: false };
  canvas.addEventListener('pointermove', (e) => {
    const r = canvas.getBoundingClientRect();
    pointer.x = (e.clientX - r.left) * (w / r.width);
    pointer.y = (e.clientY - r.top) * (h / r.height);
    pointer.on = true;
  });
  canvas.addEventListener('pointerleave', () => { pointer.on = false; });

  function draw() {
    if (!running) return;
    if (demoEnabled&&!reduce) time += 0.015;

    ctx.fillStyle = 'rgba(28, 18, 12, 0.2)';
    ctx.fillRect(0, 0, w, h);

    particles.forEach(p => {
      // Swirl around cup center
      const dx = p.x - w*0.5, dy = p.y - h*0.5;
      const dist = Math.hypot(dx, dy);
      const angle = Math.atan2(dy, dx) + (reduce||!demoEnabled?0:0.012);
      p.x = w*0.5 + Math.cos(angle) * dist;
      p.y = h*0.5 + Math.sin(angle) * dist;

      // Pointer agitation
      if (pointer.on) {
        const pdx = p.x - pointer.x, pdy = p.y - pointer.y;
        const pdist = Math.hypot(pdx, pdy);
        if (pdist > 0.01 && pdist < 80) {
          const push = (1 - pdist / 80) * 4;
          p.x += (pdx / pdist) * push;
          p.y += (pdy / pdist) * push;
        }
      }

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = 0.55;
      ctx.fill();
      ctx.globalAlpha = 1;
    });

    if(demoEnabled)scheduleFrame(draw);
  }
  scheduleFrame(draw);
})();
</script>
