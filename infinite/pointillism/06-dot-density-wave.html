<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="A wave of colored dots sweeps left to right, revealing a glowing sun setting over water in optically mixing pigment.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Density Wave</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults; the light re-theme is the one
     [data-theme="light"] block. Each band is a token of RGB triples; syncTheme()
     re-reads them and rebuilds the baked per-cell pigment. */
  :root{
    --po06-bg:#0d0f14; --po06-cap:#fff; --po06-cap-o:.42;
    --po06-sky:240 168 48/244 196 96/232 118 56/210 142 170/150 118 176;
    --po06-sea:64 96 150/42 70 128/96 128 170/150 110 150/34 52 96;
    --po06-sun:255 224 150/244 176 72/255 200 110/240 150 90;
  }
  :root[data-theme="light"]{
    /* canvas-linen ground; the same bands deepened so the dots read as pigment */
    --po06-bg:#f4efe3; --po06-cap:#2b2418; --po06-cap-o:.55;
    --po06-sky:196 124 10/204 152 44/178 68 26/168 96 126/104 76 140;
    --po06-sea:50 82 140/34 60 116/76 108 152/124 86 128/26 42 84;
    --po06-sun:230 176 60/212 132 30/224 158 48/204 110 44;
  }
  html,body{margin:0;height:100%;background:var(--po06-bg);overflow:hidden}
  #po06-stage{position:fixed;inset:0;display:block}
  #po06-c{position:absolute;inset:0;width:100%;height:100%;display:block}
  .cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--po06-cap);opacity:var(--po06-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important}}
</style>
<script type="application/json" id="forever-agent-meta">
{

 "title": "Density Wave",
 "description": "A density wave sweeps left to right revealing a Divisionist sunset — sky, sun disc, and sea rendered as jittered pigment dots that optically mix at distance.",
 "useWhen": "Ambient hero backgrounds with a painterly aesthetic. Gallery intros, creative portfolio headers, screensavers.",
 "avoidWhen": "Contexts requiring readable text overlay or low-end mobile — per-frame ImageData pixel loop is CPU-bound and background is hardcoded dark.",
 "agentPrompt": "Change sunX to 0.65 and sunY to 0.48 to move the sun right, then swap SKY palette to cool blues/greens for a dawn scene. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "sun position (sunX=0.40, sunY=0.56)",
  "wave speed (divisor 5200 in head calculation)",
  "mount offset (t0=ts-3600: crest starts mid-frame)",
  "dot grid size (GRID default 9*dpr)",
  "color palettes (SKY, SEA, SUN arrays)",
  "sun radius (sunR=0.26)",
  "pigment scatter amount (jit * 44)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "typed array cell buffers (cellR/G/B/JX/JY/Sz/Thr) — allocation-free inner loop",
  "visibility pause via visibilitychange",
  "reduced-motion static fallback (frame(1.4))",
  "IIFE wrapper",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Per-frame full ImageData pixel write is CPU-bound — can drop frames on large viewports on low-end devices",
  "Light re-theme via the [data-theme=light] token block; catalog bg/accent describe the dark default",
  "No pointer interactivity — purely autonomous"
 ],
 "tier": "curated",
 "labels": [

  "mobile-ready",
  "copy-paste-safe",
  "minimal-deps",
  "animation-heavy",
  "light-ready"
 ],
 "tags": [

</script>
</head>
<body>
<div id="po06-stage" role="img" aria-label="Pointillist scene: a wave of colored dots sweeping across the frame to reveal a glowing sun setting over water, rendered as optically mixing points of pigment.">
  <canvas id="po06-c"></canvas>
</div>
<div class="cap">Density Wave</div>
<script>
(function(){
  "use strict";
  var cv=document.getElementById("po06-c");
  var ctx=cv.getContext("2d",{alpha:false});
  var reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;

  // Divisionist palette (pointillist): warm light over cool water. Each band is a small set of
  // pure hues that optically mix at viewing distance; all live in the CSS tokens (syncTheme()).
  var root=document.documentElement;
  var SKY=[], SEA=[], SUN=[], BG=[13,15,20];

  var W=0,H=0,dpr=1,GRID=10,cols=0,rows=0;
  var img=null,data=null;
  // per-cell static attributes (typed arrays, allocation-free loop)
  var cellR=null,cellG=null,cellB=null,cellJX=null,cellJY=null,cellSz=null,cellThr=null;

  function pick(arr,t){ // t 0..1 -> a hue from band with slight scatter
    var i=(arr.length*t)|0; if(i>=arr.length)i=arr.length-1; return arr[i];
  }

  function build(){
    var rect=cv.getBoundingClientRect();
    dpr=Math.min(2,window.devicePixelRatio||1);
    W=Math.max(1,Math.round(rect.width*dpr));
    H=Math.max(1,Math.round(rect.height*dpr));
    cv.width=W; cv.height=H;
    GRID=Math.max(7,Math.round(9*dpr));
    cols=Math.ceil(W/GRID); rows=Math.ceil(H/GRID);
    var n=cols*rows;
    cellR=new Uint8Array(n);cellG=new Uint8Array(n);cellB=new Uint8Array(n);
    cellJX=new Float32Array(n);cellJY=new Float32Array(n);cellSz=new Float32Array(n);cellThr=new Float32Array(n);
    img=ctx.createImageData(W,H); data=img.data;
    // horizon a bit below centre; sun centre on it
    var horizon=0.56, sunX=0.40, sunY=horizon, sunR=0.26;
    var k=0;
    for(var gy=0;gy<rows;gy++){
      for(var gx=0;gx<cols;gx++,k++){
        var u=gx/(cols-1||1), v=gy/(rows-1||1);
        var dx=(u-sunX), dy=(v-sunY)*1.15, dist=Math.sqrt(dx*dx+dy*dy);
        var rnd=(Math.sin(k*12.9898+78.233)*43758.5453); rnd-=Math.floor(rnd);
        var c;
        if(dist<sunR){
          c=pick(SUN, dist/sunR);                         // the sun disc
        } else if(v<horizon){
          var sg=Math.min(1,(v/horizon)+ (dist-sunR)*0.6);// sky: orange near sun -> violet high/away
          c=pick(SKY, sg);
        } else {
          var wv=(v-horizon)/(1-horizon);                 // sea: bright reflection under sun
          var refl=Math.max(0,1-Math.abs(u-sunX)*3.2)*(1-wv*0.7);
          c = refl>0.45 ? pick(SUN,0.5+refl*0.4) : pick(SEA, wv*0.8+(rnd*0.2));
        }
        // pigment scatter so neighbouring dots differ -> optical mixing, not flat fills
        var jit=(rnd-0.5)*44;
        cellR[k]=Math.max(0,Math.min(255,c[0]+jit));
        cellG[k]=Math.max(0,Math.min(255,c[1]+jit*0.7));
        cellB[k]=Math.max(0,Math.min(255,c[2]+jit*0.9));
        cellJX[k]=(rnd-0.5)*GRID*0.5;
        cellJY[k]=((Math.sin(k*3.17)*0.5+0.5)-0.5)*GRID*0.5;
        cellSz[k]=GRID*(0.30+rnd*0.16);
        cellThr[k]=rnd;                                   // stipple threshold for density
      }
    }
  }

  function clear(){
    for(var i=0;i<data.length;i+=4){data[i]=BG[0];data[i+1]=BG[1];data[i+2]=BG[2];data[i+3]=255;}
  }

  // splat a soft round dot into ImageData (additive-ish over bg), allocation-free
  function dot(cx,cy,rad,r,g,b){
    var x0=Math.max(0,(cx-rad)|0), x1=Math.min(W-1,(cx+rad)|0);
    var y0=Math.max(0,(cy-rad)|0), y1=Math.min(H-1,(cy+rad)|0);
    var r2=rad*rad;
    for(var y=y0;y<=y1;y++){
      var row=y*W*4, ddy=y-cy;
      for(var x=x0;x<=x1;x++){
        var ddx=x-cx, q=ddx*ddx+ddy*ddy;
        if(q>r2)continue;
        var a=1-q/r2; a*=a;                 // soft falloff
        var p=row+x*4;
        data[p]  = data[p]  +(r-data[p])  *a;
        data[p+1]= data[p+1]+(g-data[p+1])*a;
        data[p+2]= data[p+2]+(b-data[p+2])*a;
      }
    }
  }

  // density profile: a travelling band, dense at its crest, sparse outside
  function density(u,head){
    var d=u-head;                            // signed distance from wave crest
    if(d>0.04) return 0;                     // ahead of wave: empty (not yet revealed)
    var band=Math.exp(-Math.pow(d*4.2,2));   // gaussian crest
    var settled=1/(1+Math.exp((d+0.55)*9));  // far behind: settle to steady medium density
    return Math.min(1, band*0.7+settled*0.62+0.12);
  }

  function frame(head){
    clear();
    var k=0;
    for(var gy=0;gy<rows;gy++){
      for(var gx=0;gx<cols;gx++,k++){
        var u=gx/(cols-1||1);
        var den=density(u,head);
        if(cellThr[k]>den) continue;          // stipple: skip dot when below local density
        var cx=gx*GRID+GRID*0.5+cellJX[k];
        var cy=gy*GRID+GRID*0.5+cellJY[k];
        var sz=cellSz[k]*(0.7+den*0.5);        // crest dots a touch larger
        dot(cx,cy,sz,cellR[k],cellG[k],cellB[k]);
      }
    }
    ctx.putImageData(img,0,0);
  }

  // JS-drawn colors read the tokens, so CSS stays the single source of truth. The
  // per-cell pigment is baked in build(), so a theme flip has to re-bake it.
  function syncTheme(){
    var cs=getComputedStyle(root), h=cs.getPropertyValue('--po06-bg').trim().replace('#','');
    var band=function(n){return cs.getPropertyValue(n).trim().split('/').map(function(q){return q.trim().split(/\s+/).map(Number);});};
    BG=[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
    SKY=band('--po06-sky'); SEA=band('--po06-sea'); SUN=band('--po06-sun');
    if(cellR){ build(); if(reduce) frame(1.4); }
  }
  // live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
  addEventListener("message",function(e){var d=e.data;
    if(d&&d.type==="forever:theme"&&(d.theme==="light"||d.theme==="dark")){root.setAttribute("data-theme",d.theme);syncTheme();}});

  var running=true,raf=0,head=-0.15,t0=0;
  function loop(ts){
    if(!running)return;
    if(!t0)t0=ts-3600;                        // mount with the crest mid-frame (the empty lead-in reads dead on the wall)
    head=((ts-t0)/5200)%1.5 -0.25;            // sweep crest L->R, then loop with empty lead-in
    frame(head);
    raf=requestAnimationFrame(loop);
  }

  function start(){ if(reduce){frame(1.4);return;} t0=0; running=true; raf=requestAnimationFrame(loop); }
  function stop(){ running=false; if(raf)cancelAnimationFrame(raf); raf=0; }

  document.addEventListener("visibilitychange",function(){
    if(reduce)return;
    if(document.hidden){stop();}
    else if(!running){running=true; t0=0; raf=requestAnimationFrame(loop);}
  });

  var rt=0;
  window.addEventListener("resize",function(){
    clearTimeout(rt);
    rt=setTimeout(function(){ build(); if(reduce){frame(1.4);} },140);
  });

  syncTheme();
  build();
  start();
})();
</script>
</body>
</html>
