<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="description" content="Confetti dots fly in from the edges and settle into three horizontal color bands, then gently shimmer in place.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confetti Mosaic</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark defaults, light in [data-theme="light"]. --po08-bands: a base/fleck pair per band. */
  :root{--po08-bg:#0d0f14;--po08-cap:#fff;--po08-cap-o:.42;
    --po08-bands:240 168 48/120 86 168/40 150 170/235 120 70/150 70 140/120 180 120}
  :root[data-theme="light"]{ /* canvas-linen ground, the bands deepened to pigment */
    --po08-bg:#f4efe3;--po08-cap:#2b2418;--po08-cap-o:.55;
    --po08-bands:188 116 8/86 58 140/16 110 126/186 74 30/112 38 104/54 124 58}
  html,body{margin:0;height:100%;background:var(--po08-bg);overflow:hidden}
  #po08-stage{position:fixed;inset:0;background:var(--po08-bg)}
  #po08-c{position:absolute;inset:0;width:100%;height:100%;display:block}
  .cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--po08-cap);opacity:var(--po08-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important}}
</style><script type="application/json" id="forever-agent-meta">

 "title": "Confetti Mosaic",
 "description": "104 confetti dots fly in from the edges, settle into three color bands (amber/teal/plum), then shimmer with sine-wave opacity.",
 "useWhen": "Decorative hero backgrounds or splash pages that benefit from an energetic build-in followed by calm ambient motion.",
 "avoidWhen": "Contexts requiring legible text overlays or light-mode UIs — background is hardcoded dark.",
 "agentPrompt": "Change BANDS to sunset palette (warm red, orange, gold base colors) and slow settle duration from 2600 to 4000ms. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [

  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [

 ],

  "Resize restarts the intro animation from scratch"
 ],
 "tier": "curated",
 "labels": [

 ],
 "tags": [

</head>
<body>
<div id="po08-stage" role="img" aria-label="Pointillist field of confetti dots settling into three horizontal color bands like a flag">
  <canvas id="po08-c"></canvas>
</div>
<div class="cap">Confetti Mosaic</div>
<script>
(function(){
  "use strict";
  var reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  var cv = document.getElementById('po08-c');
  var ctx = cv.getContext('2d');
  var W=0,H=0,DPR=1;

  // Divisionist palette: amber/teal/plum bands, each mixing its base hue with a
  // complementary fleck. Read from --po08-bands by syncTheme().
  var root=document.documentElement, BANDS=[], BG='#0d0f14';

  var N = 104;                  // dot count cap
  // typed arrays — allocation-free per frame
  var px=new Float32Array(N), py=new Float32Array(N);   // current
  var sx=new Float32Array(N), sy=new Float32Array(N);   // scatter origin
  var tx=new Float32Array(N), ty=new Float32Array(N);   // settled target
  var rad=new Float32Array(N), spin=new Float32Array(N), spd=new Float32Array(N);
  var col=new Array(N);   // precomputed 'rgb(r,g,b)' strings — no per-frame allocation
  var bnd=new Uint8Array(N), flk=new Uint8Array(N), jit=new Float32Array(N); // recolour inputs

  function rnd(a,b){return a+Math.random()*(b-a);}

  function layout(){
    // arrange targets as a jittered grid spanning the frame in 3 bands
    var cols=13, rows=8, i=0;
    var mx=W*0.10, my=H*0.12, gw=(W-mx*2)/(cols-1), gh=(H-my*2)/(rows-1);
    for(var ry=0; ry<rows; ry++){
      for(var cx2=0; cx2<cols; cx2++){
        if(i>=N) break;
        bnd[i] = ry<3?0 : ry<5?1 : 2;
        // optical mixing: ~28% of dots take the complementary fleck, and a per-dot
        // value jitter makes the field shimmer like a pointillist mosaic
        flk[i] = Math.random()<0.28?1:0; jit[i] = rnd(-26,26);
        var gx = mx+cx2*gw + rnd(-gw*0.22,gw*0.22);
        var gy = my+ry*gh  + rnd(-gh*0.22,gh*0.22);
        tx[i]=gx; ty[i]=gy;
        // scatter start: thrown in from edges
        var ang=Math.random()*6.2832, dist=Math.max(W,H)*rnd(0.55,1.05);
        sx[i]=W/2+Math.cos(ang)*dist; sy[i]=H/2+Math.sin(ang)*dist;
        px[i]=sx[i]; py[i]=sy[i];
        rad[i]=Math.min(W,H)*rnd(0.012,0.022);
        spin[i]=Math.random()*6.2832; spd[i]=rnd(-0.06,0.06);
        i++;
      }
    }
    recolor();
  }
  function clamp(v){return v<0?0:v>255?255:v|0;}
  // Cached color strings: a flip rebuilds them, leaving the mosaic layout put.
  function recolor(){
    for(var i=0;i<N;i++){
      var b=BANDS[bnd[i]], c=flk[i]?b.flk:b.base, j=jit[i];
      col[i]='rgb('+clamp(c[0]+j)+','+clamp(c[1]+j)+','+clamp(c[2]+j)+')';
    }
  }

  function size(){
    DPR=Math.min(2,window.devicePixelRatio||1);
    W=cv.clientWidth; H=cv.clientHeight;
    cv.width=Math.max(1,W*DPR); cv.height=Math.max(1,H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0); layout();
  }

  function paintBg(){
    ctx.fillStyle=BG;
    ctx.fillRect(0,0,W,H);
  }

  function drawDot(i,s){
    // ease scatter->settle by interpolating between scatter and target
    var x=sx[i]+(tx[i]-sx[i])*s;
    var y=sy[i]+(ty[i]-sy[i])*s;
    // residual confetti drift while settling
    var drift=(1-s);
    x+=Math.cos(spin[i])*drift*W*0.04;
    y+=Math.sin(spin[i]*1.3)*drift*H*0.04;
    px[i]=x; py[i]=y;
    var r=rad[i]*(0.55+s*0.45);
    ctx.beginPath(); ctx.arc(x,y,r,0,6.2832);
    ctx.fillStyle=col[i]; ctx.globalAlpha=0.55+s*0.45; ctx.fill();
  }

  // ONE rAF loop, two phases: 0 = intro build, 1 = settled shimmer.
  var t0=0, phase=0, sh=0, raf=0, looping=false;

  function tick(now){
    raf=0;
    if(phase===0){
      if(!t0) t0=now;
      var p=(now-t0)/2600;            // settle duration
      if(p>1)p=1;
      var e=1-Math.pow(1-p,3);        // ease-out cubic
      paintBg();
      for(var i=0;i<N;i++){
        // staggered arrival by index for a cascading mosaic build
        var s=(e*1.35)-(i/N)*0.35;
        s=s<0?0:s>1?1:s;
        s=s*s*(3-2*s);                // smootherstep on per-dot s
        drawDot(i,s);
        spin[i]+=spd[i];
      }
      ctx.globalAlpha=1;
      if(p>=1) phase=1;               // hand off to gentle shimmer
    } else {
      sh+=0.012;
      paintBg();
      for(var k=0;k<N;k++){
        ctx.beginPath();
        ctx.arc(px[k],py[k],rad[k],0,6.2832);
        ctx.fillStyle=col[k];
        ctx.globalAlpha=0.78+0.22*Math.sin(sh+k*0.6);
        ctx.fill();
      }
      ctx.globalAlpha=1;
    }
    raf=requestAnimationFrame(tick);
  }

  function run(){
    if(looping) return;              // guarantees a single rAF chain
    looping=true;
    raf=requestAnimationFrame(tick);
  }
  function stop(){
    looping=false;
    if(raf){ cancelAnimationFrame(raf); raf=0; }
  }

  function drawStatic(){
    paintBg();
    for(var i=0;i<N;i++){
      px[i]=tx[i]; py[i]=ty[i];
      ctx.beginPath();
      ctx.arc(tx[i],ty[i],rad[i],0,6.2832);
      ctx.fillStyle=col[i];
      ctx.globalAlpha=0.95;
      ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  function start(){
    size();
    stop();
    if(reduce){ drawStatic(); return; }   // settle to ONE static frame, no loop
    t0=0; phase=0; run();
  }

  // JS-drawn colors read the tokens, so CSS stays the single source of truth.
  function syncTheme(){
    var cs=getComputedStyle(root);
    BG=cs.getPropertyValue('--po08-bg').trim();
    var t=cs.getPropertyValue('--po08-bands').trim().split('/').map(function(q){return q.trim().split(/\s+/).map(Number);});
    BANDS=[{base:t[0],flk:t[1]},{base:t[2],flk:t[3]},{base:t[4],flk:t[5]}];
    if(col[0]){ recolor(); if(reduce) drawStatic(); }
  }
  addEventListener('message',function(e){var d=e.data;   // live re-theme from the canvas
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){root.setAttribute('data-theme',d.theme);syncTheme();}});

  var ro;
  window.addEventListener('resize',function(){
    if(ro)clearTimeout(ro);
    ro=setTimeout(start,140);
  });

  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ stop(); }
    else if(!reduce){ run(); }        // resume current phase; never stacks loops
  });

  syncTheme();
  start();
})();
</script>
</body></html>
