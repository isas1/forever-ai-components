  const show=(n,dir,foc)=>{if(moving)return;moving=1;const old=secs[step],nu=secs[n];step=n;sync();
    E(old,[{translate:0,opacity:1},{translate:(-dir*30)+'px',opacity:0}],{duration:140}).finished.catch(()=>{}).then(()=>{if(!alive)return;moving=0;old.hidden=1;nu.hidden=0;E(nu,[{translate:(dir*30)+'px',opacity:0},{translate:0,opacity:1}],{duration:340,easing:SPR});if(foc)nu.querySelector('.cr12-h3').focus({preventScroll:true});sr.textContent=`Step ${n+1} of 3`;if(n===2){shop.textContent=inp.value.trim();done.classList.remove('cr12-go');done.offsetWidth;done.classList.add('cr12-go')}})};
  const press=(c,e)=>{const r=c.getBoundingClientRect(),p=e&&e.detail,P=(k,v)=>c.style.setProperty(k,v+'px');P('--x',p?e.clientX-r.left:r.width/2);P('--y',p?e.clientY-r.top:r.height/2);SP(c,!GP(c));sync()};
  const setShop=v=>{inp.value=v;tps.forEach(t=>t.textContent=v.toUpperCase());E(labs[0],[{rotate:'-12deg'},{rotate:'0deg'}],{duration:400,easing:SPR});sync()};

  inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();next.click()}};back.onclick=()=>step&&show(step-1,-1,1);
