<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
:root{--b:#131316;--i:#F1F1F4;--o:#000;--m:#9A9CA6;--l:#2B2C31;--c:#7B95C4;--rd:#EE7A63;--gn:#84B895;--sp:cubic-bezier(.3,1.45,.5,1);color-scheme:dark}
:root[data-theme="light"]{--b:#EFF0F3;--i:#000;--o:#EFF0F3;--m:#5F616B;--l:#CDCFD8;--c:#2B4473;--rd:#C8371F;--gn:#4F8A63;color-scheme:light}
html,body{margin:0;height:100%;overflow:hidden;background:var(--b);color:var(--i);font:14px/1.3 "Avenir Next",Avenir,system-ui,sans-serif}
.cr13-st,.cr13-st *{box-sizing:border-box}
.cr13-st{position:relative;width:100%;height:100%;display:grid;place-items:center;padding:clamp(6px,2.5vmin,18px);background:var(--b);color:var(--i)}
.cr13-st :focus-visible{outline:2px solid var(--c);outline-offset:2px}
.cr13-co{width:min(100%,290px);display:grid;gap:clamp(2px,1.2vmin,8px)}
.cr13-card{justify-self:center;width:clamp(88px,34vmin,152px);height:clamp(48px,19vmin,88px);perspective:700px}
.cr13-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s var(--sp)}
.cr13-co.cr13-flip .cr13-in{transform:rotateY(180deg)}
.cr13-f,.cr13-k{position:absolute;inset:0;padding:clamp(6px,2vmin,11px);border-radius:7px;color:#fff;backface-visibility:hidden}
.cr13-f{display:grid;align-content:space-between;background:#2B4473}
.cr13-k{background:#1B1B20;transform:rotateY(180deg)}
.cr13-k::before{content:"";position:absolute;left:0;right:0;top:clamp(8px,3vmin,15px);height:clamp(10px,4vmin,18px);background:#F2F0EA}
.cr13-chip{width:clamp(14px,5vmin,22px);height:clamp(10px,3.8vmin,16px);border-radius:2px;background:#E2B01A}
.cr13-num{display:flex;gap:4px;font:600 clamp(7.5px,2.3vmin,11px) ui-monospace,Menlo,monospace}
.cr13-num span{display:inline-block}
.cr13-exp{font:500 clamp(7px,2vmin,10px) ui-monospace,Menlo,monospace;opacity:.88}
.cr13-cvc{position:absolute;right:10px;bottom:clamp(6px,2.5vmin,12px);display:grid;place-items:center;min-width:34px;height:18px;border-radius:3px;background:#F2F0EA;color:#000;font:600 clamp(8px,2.5vmin,11px) ui-monospace,Menlo,monospace}
.cr13-fld{display:grid;gap:2px;min-width:0;font-size:clamp(9px,2.5vmin,11.5px);color:var(--m)}
.cr13-inp{width:100%;min-width:0;height:clamp(22px,8vmin,40px);padding:0 clamp(6px,2.5vmin,11px);border:1.5px solid var(--l);border-radius:3px;background:transparent;font:inherit;font-size:clamp(10px,3vmin,15px);color:var(--i);transition:border-color .2s}
.cr13-inp::placeholder{color:var(--m);opacity:.7}.cr13-inp:hover,.cr13-inp:focus{border-color:var(--i)}.cr13-inp[aria-invalid="true"]{border-color:var(--rd)}
.cr13-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(4px,2vmin,10px);min-width:0}
.cr13-pay{position:relative;justify-self:center;display:inline-flex;align-items:center;justify-content:center;width:100%;height:clamp(26px,9vmin,42px);padding:0 16px;border-radius:999px;border:1.5px solid var(--i);background:var(--i);color:var(--o);font:inherit;font-size:clamp(10.5px,3.2vmin,14px);font-weight:600;white-space:nowrap;cursor:pointer;touch-action:manipulation;transition:width .4s ease,scale .15s,background .3s,border-color .3s,color .3s}
.cr13-pay:active{scale:.96}
.cr13-l{display:flex;align-items:center;gap:5px;transition:opacity .15s}
.cr13-tk{display:block;width:0;height:clamp(13px,4vmin,16px);fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:width .2s}
.cr13-tk path{stroke-dasharray:1;stroke-dashoffset:1}.cr13-pay.cr13-dn .cr13-tk path{stroke-dashoffset:0;transition:stroke-dashoffset .4s ease .12s}
.cr13-pay.cr13-bz{width:clamp(26px,9vmin,42px);padding:0}.cr13-pay.cr13-bz .cr13-l{opacity:0}
.cr13-rg{position:absolute;left:50%;top:50%;width:clamp(26px,9vmin,42px);height:clamp(26px,9vmin,42px);translate:-50% -50%;opacity:0;rotate:-90deg;pointer-events:none}
.cr13-rg circle{fill:none;stroke:var(--o);stroke-width:3;stroke-dasharray:120;stroke-dashoffset:120}
.cr13-pay.cr13-bz .cr13-rg{opacity:1}.cr13-pay.cr13-bz .cr13-rg circle{stroke-dashoffset:0;transition:stroke-dashoffset .9s cubic-bezier(.4,0,.2,1) .2s}
.cr13-pay.cr13-dn{background:var(--gn);border-color:var(--gn);color:#000}.cr13-pay.cr13-dn .cr13-tk{width:clamp(13px,4vmin,16px)}
.cr13-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.cr13-cap{position:absolute;left:10px;bottom:8px;font:500 11px/1 ui-monospace,monospace;color:var(--i);opacity:.45;letter-spacing:.04em;text-transform:uppercase;pointer-events:none;user-select:none}
@media (prefers-reduced-motion:reduce){.cr13-st *{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
<script type="application/json" id="forever-agent-meta">

<body>
<div class="cr13-st" id="cr13-st"></div>
<div class="cr13-cap" aria-hidden="true">Card Checkout</div>
<script>(()=>{
  const s=document.getElementById('cr13-st'),RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SPR='cubic-bezier(.3,1.45,.5,1)',NO={finished:Promise.resolve(),cancel(){}},anim=(el,kf,o)=>RM()?NO:el.animate(kf,Object.assign({duration:300,easing:'cubic-bezier(.2,.8,.2,1)'},o));
  const shake=el=>anim(el,[{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(5px)'},{transform:'none'}],{duration:300});
  s.innerHTML=`<form class="cr13-co" novalidate aria-label="Card payment"><div class="cr13-card" aria-hidden="true"><div class="cr13-in"><div class="cr13-f"><i class="cr13-chip"></i><div class="cr13-num">${'<span>••••</span>'.repeat(4)}</div><div class="cr13-exp">MM/YY</div></div><div class="cr13-k"><span class="cr13-cvc">•••</span></div></div></div><label class="cr13-fld">Card number<input class="cr13-inp" name="cardnumber" inputmode="numeric" placeholder="4242 4242 4242 4242" maxlength="19"></label><div class="cr13-2"><label class="cr13-fld">Expiry<input class="cr13-inp" name="exp" inputmode="numeric" placeholder="MM/YY" maxlength="5"></label><label class="cr13-fld">CVC<input class="cr13-inp" name="cvc" inputmode="numeric" placeholder="123" maxlength="4"></label></div><button class="cr13-pay" type="submit"><span class="cr13-l"><svg class="cr13-tk" viewBox="0 0 24 24" aria-hidden="true"><path pathLength="1" d="M5 12.5l4.5 4.5L19 7.5"/></svg><span class="cr13-tx">Pay £69</span></span><svg class="cr13-rg" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="19"/></svg></button><div class="cr13-sr" aria-live="polite"></div></form>`;
  const form=s.querySelector('.cr13-co'),[num,exp,cvc]=[...s.querySelectorAll('.cr13-inp')],groups=[...s.querySelectorAll('.cr13-num span')],cExp=s.querySelector('.cr13-exp'),cCvc=s.querySelector('.cr13-cvc'),btn=s.querySelector('.cr13-pay'),tx=s.querySelector('.cr13-tx'),sr=s.querySelector('.cr13-sr');
  let state='idle',payT=0;
  const setNum=raw=>{const d=raw.replace(/\D/g,'').slice(0,16);num.value=d.replace(/(.{4})(?=.)/g,'$1 ');
    groups.forEach((g,i)=>{const t=d.slice(i*4,i*4+4).padEnd(4,'•');if(g.textContent!==t){g.textContent=t;anim(g,[{transform:'translateY(-35%)',opacity:.3},{transform:'none',opacity:1}],{duration:260,easing:SPR})}})};
  const setExp=raw=>{let d=raw.replace(/\D/g,'').slice(0,4);if(d.length===1&&+d>1)d='0'+d;exp.value=d.length>2?d.slice(0,2)+'/'+d.slice(2):d;cExp.textContent=exp.value||'MM/YY'};
  const setCvc=raw=>{cvc.value=raw.replace(/\D/g,'');cCvc.textContent=cvc.value||'•••'};
  num.addEventListener('input',()=>setNum(num.value));exp.addEventListener('input',()=>setExp(exp.value));cvc.addEventListener('input',()=>setCvc(cvc.value));
  cvc.addEventListener('focus',()=>form.classList.add('cr13-flip'));cvc.addEventListener('blur',()=>form.classList.remove('cr13-flip'));
  const resetPay=()=>{state='idle';btn.classList.remove('cr13-dn','cr13-bz');tx.textContent='Pay £69';btn.removeAttribute('aria-label')};
  form.addEventListener('input',e=>{e.target.removeAttribute('aria-invalid');if(state==='done')resetPay()});
  const submit=foc=>{if(state!=='idle')return;const now=new Date(),d=num.value.replace(/\D/g,''),m=+exp.value.slice(0,2),y=2000+ +exp.value.slice(3),bad=[];
    if(d.length<16)bad.push(num);if(exp.value.length<5||m<1||m>12||y*12+m<now.getFullYear()*12+now.getMonth()+1)bad.push(exp);if(cvc.value.length<3)bad.push(cvc);
    [num,exp,cvc].forEach(i=>bad.includes(i)?i.setAttribute('aria-invalid','true'):i.removeAttribute('aria-invalid'));
    if(bad.length){bad.forEach(shake);if(foc)bad[0].focus();sr.textContent='Check payment fields';return}
    state='busy';btn.classList.add('cr13-bz');btn.setAttribute('aria-label','Paying');sr.textContent='Paying';
    payT=setTimeout(()=>{payT=0;state='done';btn.classList.remove('cr13-bz');btn.classList.add('cr13-dn');tx.textContent='Paid';btn.setAttribute('aria-label','Paid');sr.textContent='Payment complete'},RM()?400:1150)};
  form.addEventListener('submit',e=>{e.preventDefault();submit(true)});

  let demo=!RM()&&!(window.__foreverPreview&&window.__foreverPreview.demoEnabled===false),timer=0,kick=0,step=0;
  const play=()=>{if(!demo||RM()||document.hidden)return;const p=step++%5;
    if(p===0)setNum('4242424242424242');
    else if(p===1){setExp('0928');form.classList.add('cr13-flip');setCvc('842')}
    else if(p===2){form.classList.remove('cr13-flip');submit(false)}
    else if(p===4){resetPay();setNum('');setExp('');setCvc('')}};
  const stop=()=>{clearInterval(timer);clearTimeout(kick);clearTimeout(payT);timer=kick=payT=0},start=()=>{if(!timer&&demo&&!RM())timer=setInterval(play,1050)},tk=()=>{demo=false;clearInterval(timer);clearTimeout(kick);timer=kick=0};
  window.addEventListener('forever:interactive',tk);s.addEventListener('pointerdown',tk,true);s.addEventListener('keydown',tk,true);
  document.addEventListener('visibilitychange',()=>document.hidden?stop():demo&&start());
  window.addEventListener('message',e=>{if(e.data&&e.data.type==='forever:theme'&&(e.data.theme==='light'||e.data.theme==='dark'))document.documentElement.setAttribute('data-theme',e.data.theme)});
  if(demo){kick=setTimeout(play,500);start()}
})();</script>
</body>
