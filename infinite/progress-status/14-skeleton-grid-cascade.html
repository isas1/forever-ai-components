<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Skeleton Grid Cascade — Progress &amp; Status. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skeleton Grid Cascade</title>
<script>/* theme hook: ?theme=light|dark, before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  /* forever brand tokens — dark default, warm-paper light in the [data-theme="light"] block */
  :root{
    --sg14-bg:#0a0a0a;--sg14-surface:#111111;--sg14-well:#070707;--sg14-text:#ededea;--sg14-muted:#8a8a85;--sg14-faint:#5a5a56;
    --sg14-border:rgba(255,255,255,.08);--sg14-strong:rgba(255,255,255,.2);--sg14-ink:rgba(237,237,234,.55);
    --sg14-accent:#3fb680;--sg14-accent-line:rgba(63,182,128,.32);
    --sg14-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;--sg14-loop:cubic-bezier(.45,0,.55,1);--sg14-ease:cubic-bezier(.22,1,.36,1);
  }
  :root[data-theme="light"]{
    --sg14-bg:#fafaf8;--sg14-surface:#f4f4f0;--sg14-well:#f1f1ec;--sg14-text:#1a1a18;--sg14-muted:#6b6b66;--sg14-faint:#9a9a93;
    --sg14-border:rgba(0,0,0,.08);--sg14-strong:rgba(0,0,0,.22);--sg14-ink:rgba(26,26,24,.6);
    --sg14-accent:#1a7a50;--sg14-accent-line:rgba(26,122,80,.35);
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--sg14-bg)}
  .sg14-grid{position:fixed;inset:0;padding:clamp(8px,3vmin,16px) clamp(8px,3vmin,16px) calc(clamp(8px,3vmin,16px) + 14px);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:clamp(6px,2.2vmin,12px)}
  .sg14-cell{position:relative;background:var(--sg14-surface);border:1px solid var(--sg14-border);border-radius:8px;overflow:hidden;transition:border-color .5s}
  .sg14-cell.is-ready{border-color:var(--sg14-strong)}
  /* skeleton layer: one faint stroke traces each frame, one accent dot pulses; cells drift in phase */
  .sg14-trace{position:absolute;inset:0;width:100%;height:100%;transition:opacity .45s}
  .sg14-trace rect{fill:none;stroke:var(--sg14-strong);stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-dasharray:.34 .66;stroke-dashoffset:1;animation:sg14-trace 2.4s linear infinite}
  .sg14-cell:nth-child(3n+2) .sg14-trace rect{animation-delay:-.8s}.sg14-cell:nth-child(3n) .sg14-trace rect{animation-delay:-1.6s}
  @keyframes sg14-trace{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  .sg14-dot{position:absolute;top:8px;left:8px;width:6px;height:6px;border-radius:999px;background:var(--sg14-accent);animation:sg14-dot 2.4s var(--sg14-loop) infinite;transition:opacity .4s}
  .sg14-cell:nth-child(2n) .sg14-dot{animation-delay:-1.2s}
  @keyframes sg14-dot{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
  /* content layer: an abstract mark on a sunken well + a mono index */
  .sg14-art{position:absolute;inset:0;opacity:0;transform:scale(.96);transition:opacity .5s var(--sg14-ease),transform .5s var(--sg14-ease)}
  .sg14-art svg{position:absolute;inset:0;width:100%;height:100%;stroke:var(--sg14-ink);fill:none;stroke-width:1.6;stroke-linecap:round}
  .sg14-art .sg14-f{fill:var(--sg14-ink);stroke:none}.sg14-art .sg14-a{stroke:var(--sg14-accent)}.sg14-art .sg14-af{fill:var(--sg14-accent);stroke:none}
  .sg14-idx{position:absolute;right:8px;bottom:6px;font:400 9px/1 var(--sg14-mono);letter-spacing:.06em;color:var(--sg14-faint)}
  .is-ready .sg14-trace,.is-ready .sg14-dot{opacity:0}
  .is-ready .sg14-art{opacity:1;transform:none}
  .sg14-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 var(--sg14-mono);color:var(--sg14-muted);opacity:.5;letter-spacing:.08em;text-transform:uppercase;user-select:none;pointer-events:none}
  @media (prefers-reduced-motion:reduce){.sg14-trace rect,.sg14-dot{animation:none}.sg14-cell *{transition:none!important}}
</style>
<script type="application/json" id="forever-agent-meta">
{

 "title": "Skeleton Grid Cascade",
 "description": "A three-by-three wall of component tiles loading in a diagonal cascade: each frame is traced by a faint stroke with a pulsing accent dot, then resolves one by one into an abstract preview (rings, bars, a dot field, a mark, a chart line) with a mono index; the wave unmounts the same way, reshuffles and repeats.",
 "useWhen": "Gallery, canvas and search-result loading states; onboarding screens that need to suggest 'many things arriving' without real content yet.",
 "avoidWhen": "Single-item loading (use Traced Skeleton), or layouts where nine equal cells do not fit the frame.",
 "agentPrompt": "Change the grid size (repeat(3,1fr) + the order array + the loop of 9), the art vocabulary (the art array of inline SVG fragments), the cascade timing STEP=260 / HOLD=2200 / GAP=900, and the accent via --sg14-accent. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",

</head>
<body>
<div class="sg14-grid" id="sg14-grid" role="img" aria-label="A three-by-three wall of component tiles loading in a diagonal cascade: each frame is traced by a faint stroke with a pulsing dot, then resolves into an abstract preview"></div>
<div class="sg14-cap" aria-hidden="true">Skeleton Grid Cascade</div>
<script>(function(){"use strict";
  var root=document.documentElement, grid=document.getElementById('sg14-grid');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  addEventListener('message',function(e){var d=e.data;if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark'))root.setAttribute('data-theme',d.theme);});
  // a small vocabulary of previews: rings, bars, a diagonal, a dot field, a square, an arc — drawn in a 100×100 box
  var art=[
    '<circle cx="50" cy="50" r="24"/><circle cx="50" cy="50" r="14" class="sg14-a"/><circle cx="50" cy="50" r="3" class="sg14-af"/>',
    '<rect x="22" y="56" width="10" height="20" class="sg14-f"/><rect x="38" y="42" width="10" height="34" class="sg14-f"/><rect x="54" y="30" width="10" height="46" class="sg14-af"/><rect x="70" y="48" width="10" height="28" class="sg14-f"/>',
    '<path d="M24 76 L76 24"/><path d="M24 50 L50 24" class="sg14-a"/><path d="M50 76 L76 50"/>',
    '<g class="sg14-f"><circle cx="32" cy="32" r="3"/><circle cx="50" cy="32" r="3"/><circle cx="68" cy="32" r="3"/><circle cx="32" cy="50" r="3"/><circle cx="50" cy="50" r="3" class="sg14-af"/><circle cx="68" cy="50" r="3"/><circle cx="32" cy="68" r="3"/><circle cx="50" cy="68" r="3"/><circle cx="68" cy="68" r="3"/></g>',
    '<rect x="28" y="28" width="44" height="44" rx="4"/><rect x="40" y="40" width="20" height="20" rx="2" class="sg14-af"/>',
    '<path d="M28 62 A 26 26 0 0 1 72 62" /><path d="M36 62 A 18 18 0 0 1 64 62" class="sg14-a"/><circle cx="50" cy="66" r="3" class="sg14-af"/>',
    '<path d="M24 60 C 36 30, 48 30, 60 60 S 84 90, 76 40" class="sg14-a"/><path d="M24 44 h52"/>',
    '<path d="M50 50 C 60 36, 62 24, 50 24 C 38 24, 40 38, 50 50 C 60 62, 64 76, 50 76 C 36 76, 40 62, 50 50 Z" class="sg14-a" stroke-width="3"/>',
    '<path d="M26 66 L40 46 L54 58 L74 32" class="sg14-a"/><circle cx="74" cy="32" r="3" class="sg14-af"/><path d="M26 74 h48"/>'
  ];
  var cells=[], order=[0,1,3,2,4,6,5,7,8]; // diagonal wave, top-left to bottom-right
  for(var i=0;i<9;i++){ var c=document.createElement('div'); c.className='sg14-cell';
    c.innerHTML='<svg class="sg14-trace" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><rect x=".8" y=".8" width="98.4" height="98.4" rx="4" pathLength="1"/></svg>'+
      '<span class="sg14-dot"></span><div class="sg14-art"><svg viewBox="0 0 100 100" aria-hidden="true"></svg></div><span class="sg14-idx">'+('0'+(i+1)).slice(-2)+'</span>';
    grid.appendChild(c); cells.push(c); }
  var shift=0;
  function paint(){ for(var i=0;i<9;i++)cells[i].querySelector('.sg14-art svg').innerHTML=art[(i+shift)%art.length]; }
  paint();
  // the cascade on a 100 ms clock: resolve one cell every 260 ms, hold, unmount in the same wave, reshuffle, repeat
  var TICK=100, STEP=260, HOLD=2200, GAP=900, t=-600, phase='in', k=0, clock=null;
  function tick(){ t+=TICK;
    if(phase==='in'){ if(t>=k*STEP && k<9){ cells[order[k]].classList.add('is-ready'); k++; } if(k>=9&&t>=9*STEP+HOLD){phase='out';t=0;k=0;} }
    else if(phase==='out'){ if(t>=k*STEP && k<9){ cells[order[k]].classList.remove('is-ready'); k++; } if(k>=9&&t>=9*STEP+GAP){ shift=(shift+4)%art.length; paint(); phase='in'; t=0; k=0; } }
  }
  function start(){ if(!clock&&!reduce)clock=setInterval(tick,TICK); }
  function stop(){ clearInterval(clock); clock=null; }
  document.addEventListener('visibilitychange',function(){ document.hidden?stop():start(); });
  if(reduce)cells.forEach(function(c){c.classList.add('is-ready');}); // reduced motion: the resolved wall
  start();
})();</script>
</body>
