<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Laurel Progress Ring — Progress &amp; Status. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laurel Progress Ring</title>
<script>/* theme hook: ?theme=light|dark, before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  /* Classical Atelier register — dark gallery lighting by default, limestone in the [data-theme="light"] block */
  :root{
    --lr16-page:#17130f;--lr16-panel:#241e18;--lr16-ink:#f1e9d8;--lr16-muted:#bdb2a1;--lr16-olive:#929b64;--lr16-bronze:#c99a51;--lr16-pompeii:#d66b59;
    --lr16-hair:rgba(241,233,216,.18);--lr16-rule:rgba(241,233,216,.32);
    --lr16-display:Marcellus,Georgia,"Times New Roman",serif;--lr16-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;--lr16-mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  :root[data-theme="light"]{
    --lr16-page:#e9e4da;--lr16-panel:#f8f4ea;--lr16-ink:#241f19;--lr16-muted:#675f54;--lr16-olive:#58613b;--lr16-bronze:#9a6828;--lr16-pompeii:#94382f;
    --lr16-hair:rgba(36,31,25,.16);--lr16-rule:rgba(36,31,25,.34);
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--lr16-page)}
  .lr16-stage{position:fixed;inset:0;display:grid;place-items:center;align-content:center;gap:clamp(8px,3vmin,14px);font-family:var(--lr16-body);color:var(--lr16-ink)}
  .lr16-ring{position:relative;width:min(58vmin,240px);height:min(58vmin,240px)}
  .lr16-ring svg{width:100%;height:100%;display:block;overflow:visible}
  .lr16-track{fill:none;stroke:var(--lr16-hair);stroke-width:3}
  .lr16-arc{fill:none;stroke:var(--lr16-olive);stroke-width:3;stroke-dasharray:1 1;stroke-dashoffset:1;transition:stroke-dashoffset .32s cubic-bezier(.4,0,.2,1),stroke .32s}
  /* a generic laurel: two mirrored arcs of tapered leaves with a basal gap — leaves light in proportion to value */
  .lr16-leaf{fill:var(--lr16-hair);opacity:.55;transition:fill .22s,opacity .22s}
  .lr16-leaf.lr16-on{fill:var(--lr16-olive);opacity:1}
  .lr16-centre{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
  .lr16-fig{font:400 clamp(26px,14vmin,58px)/1 var(--lr16-display);letter-spacing:.005em;color:var(--lr16-ink);font-variant-numeric:tabular-nums}
  .lr16-unit{margin-top:4px;font:400 clamp(8px,2.4vmin,11px)/1 var(--lr16-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--lr16-bronze)}
  .lr16-label{font:400 clamp(13px,4vmin,17px)/1.2 var(--lr16-display);letter-spacing:.005em}
  .lr16-records{font-size:clamp(9px,2.6vmin,12px);letter-spacing:.09em;text-transform:uppercase;color:var(--lr16-muted)}
  .lr16-records i{font:400 1em var(--lr16-mono);font-style:normal;color:var(--lr16-bronze);letter-spacing:.02em;text-transform:none}
  .lr16-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 var(--lr16-mono);color:var(--lr16-muted);opacity:.5;letter-spacing:.08em;text-transform:uppercase;user-select:none;pointer-events:none}
  @media (max-height:200px){.lr16-records{display:none}.lr16-ring{width:min(50vmin,240px);height:min(50vmin,240px)}}
  @media (prefers-reduced-motion:reduce){.lr16-arc,.lr16-leaf{transition:none}}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/progress-status/16-laurel-progress-ring.html",
 "title": "Laurel Progress Ring",
 "description": "A hairline ring with an olive arc and a wreath of twenty-four tapered leaves that light in proportion to the value, a display figure with 'per cent' beneath in bronze mono, and a label with a records count. The figure climbs in uneven batches, rests complete, runs an indeterminate reconcile (all leaves lit, an em dash), then starts again.",
 "useWhen": "One headline figure per view in archival, collection, conservation or editorial dashboards — catalogued, digitised, reviewed, complete.",
 "avoidWhen": "Several parallel measures (use plain rules), tiny inline indicators, or anything that reads as a badge or crest.",
 "agentPrompt": "Set TOTAL and the label / caption copy, the leaf count N=24 and basal gap GAP=46, the step clock STEP=400 and the hold lengths, and the tone via --lr16-olive (verified) — Pompeii only for a shortfall. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "TOTAL, label and caption copy",
  "leaf count N and basal gap GAP; leaf length LEN and width WIDE",
  "step clock (STEP) and the hold / reconcile lengths (1600 ms)",
  "tone tokens (--lr16-olive, --lr16-bronze, --lr16-pompeii)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "IIFE wrapper",
  "role=progressbar with aria-valuenow removed while indeterminate",
  "the laurel is a generic pair of mirrored leaf arcs — not a reproduction of any wreath, crest or emblem",
  "prefers-reduced-motion guard (a still 62 per cent)",
  "visibilitychange pause",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Marcellus renders only if installed — Georgia fallback",
  "The demo figure is generated; feed a real value into paint() in a product"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "progress",
  "ring",
  "laurel",
  "classical",
  "leaves",
  "percent",
  "catalogue",
  "display"
 ]
}
</script>
</head>
<body>
<div class="lr16-stage">
  <div class="lr16-ring" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Records catalogued" id="lr16-bar">
    <svg viewBox="0 0 100 100" aria-hidden="true" id="lr16-svg">
      <circle class="lr16-track" cx="50" cy="50" r="38"/>
      <circle class="lr16-arc" id="lr16-arc" cx="50" cy="50" r="38" pathLength="1" transform="rotate(-90 50 50)"/>
      <g id="lr16-leaves"></g>
    </svg>
    <div class="lr16-centre"><div><div class="lr16-fig" id="lr16-fig">0</div><div class="lr16-unit">per cent</div></div></div>
  </div>
  <div class="lr16-label" id="lr16-label">Catalogued</div>
  <div class="lr16-records"><i id="lr16-count">0</i> of <i>148</i> records</div>
</div>
<div class="lr16-cap" aria-hidden="true">Laurel Progress Ring</div>
<script>(function(){"use strict";
  var root=document.documentElement, arc=document.getElementById('lr16-arc'), g=document.getElementById('lr16-leaves'), fig=document.getElementById('lr16-fig'), bar=document.getElementById('lr16-bar'), label=document.getElementById('lr16-label'), count=document.getElementById('lr16-count');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  addEventListener('message',function(e){var d=e.data;if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark'))root.setAttribute('data-theme',d.theme);});
  // 24 tapered leaves around r=38 with a 46° basal gap; the left half leans one way, the right half the other
  var N=24, GAP=46, R=38, C=50, LEN=6.5, WIDE=2.6, leaves=[], NS='http://www.w3.org/2000/svg';
  for(var i=0;i<N;i++){ var t=i/(N-1), ang=GAP/2+180+t*(360-GAP), side=t<.5?-1:1;
    var wrap=document.createElementNS(NS,'g'); wrap.setAttribute('transform','rotate('+ang+' '+C+' '+C+')');
    var el=document.createElementNS(NS,'ellipse'); el.setAttribute('class','lr16-leaf'); el.setAttribute('cx',C); el.setAttribute('cy',C-R-LEN*.62); el.setAttribute('rx',WIDE); el.setAttribute('ry',LEN);
    el.setAttribute('transform','rotate('+(side*22)+' '+C+' '+(C-R)+')'); wrap.appendChild(el); g.appendChild(wrap); leaves.push(el); }
  var TOTAL=148, value=0, mode='count';
  function paint(pct,indet){ arc.style.strokeDashoffset=indet?0:(1-pct).toFixed(4); var lit=indet?N:Math.round(pct*N);
    for(var i=0;i<N;i++)leaves[i].classList.toggle('lr16-on',i<lit);
    fig.textContent=indet?'—':Math.round(pct*100); count.textContent=Math.round(pct*TOTAL);
    if(indet)bar.removeAttribute('aria-valuenow'); else bar.setAttribute('aria-valuenow',Math.round(pct*100));
    arc.style.stroke = indet?'var(--lr16-bronze)':'var(--lr16-olive)'; }
  // demo on a 400 ms step clock: the figure climbs in uneven batches, rests complete, then an indeterminate reconcile, then a fresh pass
  var STEP=400, t=0, hold=0, clock=null, seed=7;
  function rnd(){ seed=(seed*9301+49297)%233280; return seed/233280; }
  function tick(){
    if(mode==='count'){ value=Math.min(1,value+(0.03+rnd()*0.06)); paint(value,false); label.textContent='Catalogued'; if(value>=1){mode='hold';hold=0;label.textContent='Complete';} }
    else if(mode==='hold'){ hold+=STEP; if(hold>=1600){mode='indet';hold=0;label.textContent='Reconciling';paint(1,true);} }
    else if(mode==='indet'){ hold+=STEP; if(hold>=1600){mode='count';value=0;paint(0,false);} } }
  function start(){ if(!clock&&!reduce)clock=setInterval(tick,STEP); }
  function stop(){ clearInterval(clock); clock=null; }
  document.addEventListener('visibilitychange',function(){ document.hidden?stop():start(); });
  value=reduce?0.62:0.18; paint(value,false); // pre-roll: a fifth lit at first paint; reduced motion holds a still 62
  start();
})();</script>
</body>
</html>
