<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Vein Progress — Progress &amp; Status. A self-contained, zero-dependency animated web component.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vein Progress</title>
<script>/* theme hook: ?theme=light|dark, before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
  /* Root & Pigment — dark ground by default, pale fibre in the [data-theme="light"] block */
  :root{
    --vp18-ground:#152019;--vp18-fibre:#202d23;--vp18-ink:#edf0e5;--vp18-lichen:#adb8aa;--vp18-moss:#82a17d;--vp18-water:#70aeb0;--vp18-lift:#3a4a3d;--vp18-shade:#0a110c;
    --vp18-hair:rgba(173,184,170,.18);--vp18-rule:rgba(173,184,170,.34);
    --vp18-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--vp18-body:"Noto Sans",ui-sans-serif,system-ui,sans-serif;--vp18-mono:"Noto Sans Mono",ui-monospace,Menlo,monospace;
  }
  :root[data-theme="light"]{
    --vp18-ground:#e7e1d3;--vp18-fibre:#f4efe4;--vp18-ink:#253126;--vp18-lichen:#596458;--vp18-moss:#466348;--vp18-water:#39757a;--vp18-lift:#ffffff;--vp18-shade:#253126;
    --vp18-hair:rgba(89,100,88,.18);--vp18-rule:rgba(89,100,88,.34);
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--vp18-ground)}
  body{background-image:repeating-linear-gradient(92deg,color-mix(in oklab,var(--vp18-ink) 3%,transparent) 0 1px,transparent 1px 7px),repeating-linear-gradient(3deg,color-mix(in oklab,var(--vp18-ink) 2%,transparent) 0 1px,transparent 1px 9px)}
  .vp18-stage{position:fixed;inset:0;display:grid;place-items:center;padding:4vmin;font-family:var(--vp18-body);color:var(--vp18-ink)}
  /* the leaf shape: a named asymmetric radius, chosen for cards and repeated — never randomised */
  .vp18-card{width:min(100%,420px);background:var(--vp18-fibre);border-radius:28px 14px 28px 14px;padding:clamp(14px,5vmin,26px);display:grid;gap:clamp(6px,2.4vmin,12px);
    box-shadow:0 1px 0 color-mix(in oklab,var(--vp18-lift) 60%,transparent),0 12px 26px -20px color-mix(in oklab,var(--vp18-shade) 55%,transparent)}
  .vp18-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .vp18-label{font-size:clamp(9px,2.7vmin,12px);letter-spacing:.09em;text-transform:uppercase;color:var(--vp18-lichen)}
  .vp18-val{font:500 clamp(18px,6vmin,30px)/1 var(--vp18-display);letter-spacing:-.022em;font-variant-numeric:tabular-nums}
  .vp18-svg{display:block;width:100%;height:clamp(44px,17vmin,72px)}
  .vp18-mid{stroke:var(--vp18-rule);stroke-width:3;stroke-linecap:round}
  .vp18-vein{fill:none;stroke:var(--vp18-hair);stroke-width:2;stroke-linecap:round}
  .vp18-fill .vp18-mid{stroke:var(--vp18-moss);stroke-width:3.4}.vp18-fill .vp18-vein{stroke:var(--vp18-moss);stroke-width:2.2;opacity:.9}
  .vp18-tip{fill:var(--vp18-moss);animation:vp18-idle 3.6s cubic-bezier(.24,1,.32,1) infinite}
  @keyframes vp18-idle{0%,100%{opacity:.55}50%{opacity:1}}
  .vp18-foot{display:grid;gap:2px;font-size:clamp(8px,2.4vmin,11px);line-height:1.4;color:var(--vp18-lichen)}
  .vp18-foot i{font:400 1em var(--vp18-mono);font-style:normal;font-variant-numeric:tabular-nums}
  .vp18-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 var(--vp18-mono);color:var(--vp18-lichen);opacity:.5;letter-spacing:.08em;text-transform:uppercase;user-select:none;pointer-events:none}
  @media (prefers-reduced-motion:reduce){.vp18-tip{animation:none;opacity:1}}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/progress-status/18-vein-progress.html",
 "title": "Vein Progress",
 "description": "A leaf-vein progress line on a pressed-fibre card: a midrib with nine side veins drawn faint as the skeleton, and a moss copy clipped to the value that wicks along it with capillary easing — slow, then rushing — while a growing tip pulses at the front. A display percentage, a readings count and an honest footer line.",
 "useWhen": "Single-process progress in ecological, agricultural, health or craft products — rooting, curing, syncing readings — where a bar should feel grown rather than filled.",
 "avoidWhen": "Multi-stage flows (use a stepped meter), or narrow columns under ~180 px where the veins compress.",
 "agentPrompt": "Change VEINS, the copy (label, readings total 22, footer), the grow / hold / ebb lengths GROW=6000, HOLD=1800, EBB=600, and the tone via --vp18-moss (water for information). Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "VEINS count and vein geometry (len, lean in skeleton())",
  "phase lengths (GROW, HOLD, EBB) and the capillary curve cap()",
  "copy (label, readings total, footer)",
  "tone tokens (--vp18-moss, --vp18-water) and the leaf radius (28px 14px 28px 14px)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "IIFE wrapper",
  "role=progressbar + aria-valuenow on the SVG",
  "the skeleton stays legible under the fill (unfilled midrib + veins always drawn)",
  "prefers-reduced-motion guard (full vein drawn to the final value, tip still)",
  "visibilitychange pause",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Bricolage Grotesque / Noto Sans fall back to the system sans",
  "The value is a demo loop — call paint(p) with a real 0–1 value in a product"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "progress",
  "vein",
  "leaf",
  "midrib",
  "biophilic",
  "capillary",
  "organic",
  "tabular"
 ]
}
</script>
</head>
<body>
<div class="vp18-stage">
  <div class="vp18-card">
    <div class="vp18-head"><span class="vp18-label" id="vp18-label">rooting</span><span class="vp18-val" id="vp18-val">0%</span></div>
    <svg class="vp18-svg" viewBox="0 0 600 60" preserveAspectRatio="none" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Rooting progress" id="vp18-bar">
      <g id="vp18-base"></g>
      <clipPath id="vp18-clip"><rect x="8" y="0" width="0" height="60" id="vp18-rect"/></clipPath>
      <g class="vp18-fill" id="vp18-fillg" clip-path="url(#vp18-clip)"></g>
      <circle class="vp18-tip" id="vp18-tip" cx="8" cy="30" r="4"/>
    </svg>
    <div class="vp18-foot"><span>plot 3 · <i id="vp18-n">0</i> of 22 readings</span><span>figures are plot readings, not claims</span></div>
  </div>
</div>
<div class="vp18-cap" aria-hidden="true">Vein Progress</div>
<script>(function(){"use strict";
  var root=document.documentElement, base=document.getElementById('vp18-base'), fillg=document.getElementById('vp18-fillg'), rect=document.getElementById('vp18-rect'), tip=document.getElementById('vp18-tip'), val=document.getElementById('vp18-val'), bar=document.getElementById('vp18-bar'), n=document.getElementById('vp18-n'), label=document.getElementById('vp18-label');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  addEventListener('message',function(e){var d=e.data;if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark'))root.setAttribute('data-theme',d.theme);});
  // the leaf skeleton: a midrib and nine side veins, drawn twice — the faint skeleton and the moss fill clipped to progress
  var X0=8, X1=592, SPAN=X1-X0, MID=30, VEINS=9, NS='http://www.w3.org/2000/svg';
  function skeleton(){ var s='<line class="vp18-mid" x1="'+X0+'" y1="'+MID+'" x2="'+X1+'" y2="'+MID+'"/>';
    for(var i=0;i<VEINS;i++){ var t=(i+1)/(VEINS+1), x=X0+SPAN*t, up=i%2===0, len=12+Math.sin(t*Math.PI)*12, lean=16, d=up?-1:1;
      s+='<path class="vp18-vein" d="M'+x.toFixed(1)+' '+MID+' Q'+(x+lean*.5).toFixed(1)+' '+(MID+d*len*.6).toFixed(1)+' '+(x+lean).toFixed(1)+' '+(MID+d*len).toFixed(1)+'"/>'; }
    return s; }
  base.innerHTML=skeleton(); fillg.innerHTML=skeleton();
  function paint(p){ rect.setAttribute('width',(SPAN*p).toFixed(1)); tip.setAttribute('cx',(X0+SPAN*p).toFixed(1)); tip.style.opacity=(p>.02&&p<.995)?'':'0';
    var pct=Math.round(p*100); val.textContent=pct+'%'; bar.setAttribute('aria-valuenow',pct); n.textContent=Math.round(p*22); label.textContent=p>=1?'rooted':'rooting'; }
  // capillary easing: wicks slowly, then rushes. One 100 ms clock: grow over 6 s, hold 1.8 s, ebb back over .6 s
  function cap(x){ return x<.5? 2*x*x*(1.6-x*1.2) : 1-Math.pow(1-x,2.2); }
  var TICK=100, GROW=6000, HOLD=1800, EBB=600, t=1800, phase='grow', clock=null;
  function tick(){ t+=TICK;
    if(phase==='grow'){ paint(Math.min(1,cap(t/GROW))); if(t>=GROW){phase='hold';t=0;} }
    else if(phase==='hold'&&t>=HOLD){ phase='ebb'; t=0; }
    else if(phase==='ebb'){ paint(Math.max(0,1-t/EBB)); if(t>=EBB){phase='grow';t=0;} } }
  function start(){ if(!clock&&!reduce)clock=setInterval(tick,TICK); }
  function stop(){ clearInterval(clock); clock=null; }
  document.addEventListener('visibilitychange',function(){ document.hidden?stop():start(); });
  paint(reduce?1:cap(t/GROW)); start(); // pre-roll a third in; reduced motion: the full vein drawn to its final value
})();</script>
</body>
</html>
