<style>
  /* Plein-Air Light — dusk by default, warm daylight in the [data-theme="light"] block */
  :root{
    --as19-bg:#17212b;--as19-surface:#22303a;--as19-ink:#f5e9d2;--as19-muted:#bac0ba;--as19-sunk:rgba(0,0,0,.22);
    --as19-warm:rgba(226,185,81,.16);--as19-cool:rgba(115,176,189,.16);--as19-far:#33454f;--as19-mid:#3e5560;--as19-near:#4e6b76;--as19-leaf:rgba(140,162,121,.4);--as19-sun:#e2b951;
    --as19-display:Ysabeau,Georgia,"Iowan Old Style",serif;--as19-ui:"Source Sans 3",ui-sans-serif,system-ui,sans-serif;
  }
  :root[data-theme="light"]{
    --as19-bg:#f1e5ce;--as19-surface:#faf4e7;--as19-ink:#203044;--as19-muted:#686b6b;--as19-sunk:rgba(32,48,68,.07);
    --as19-warm:rgba(194,138,33,.16);--as19-cool:rgba(53,108,125,.14);--as19-far:#c6d2d6;--as19-mid:#a9bcc1;--as19-near:#7e9aa1;--as19-leaf:rgba(82,107,69,.4);--as19-sun:#c28a21;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--as19-bg)}
  .as19-stage{position:fixed;inset:0;display:grid;place-items:center;padding:clamp(10px,4vmin,26px);font-family:var(--as19-ui);color:var(--as19-ink)}
  .as19-card{position:relative;width:min(100%,420px);aspect-ratio:4/3;max-height:100%;background:var(--as19-surface);border-radius:16px;padding:clamp(10px,3.4vmin,20px);display:flex;flex-direction:column;gap:clamp(6px,2vmin,12px);
    box-shadow:0 2px 4px rgba(32,48,68,.05),0 12px 28px -14px rgba(32,48,68,.2);overflow:hidden}
  /* the skeleton: sunk blocks, a warm and a cool haze passing across each on a 12 s clock, a 3.2 s breathe */
  .as19-b{position:relative;overflow:hidden;background:var(--as19-sunk);border-radius:6px;animation:as19-br 3.2s cubic-bezier(.45,.05,.55,.95) infinite alternate;transition:opacity .5s}
  .as19-b.as19-img{flex:1;min-height:40px;border-radius:10px}.as19-b.as19-l{height:clamp(8px,2.4vmin,13px)}.as19-b.as19-t{height:clamp(12px,3.4vmin,19px)}
  .as19-b i{position:absolute;inset:-40% -60%;background:radial-gradient(60% 120% at 30% 50%,var(--as19-warm) 0,transparent 62%),radial-gradient(50% 110% at 72% 50%,var(--as19-cool) 0,transparent 66%);animation:as19-p 12s cubic-bezier(.45,.05,.55,.95) infinite}
  .as19-img{animation-delay:-.2s}.as19-img i{animation-delay:-3s}.as19-b1{width:38%;animation-delay:-1.1s}.as19-b1 i{animation-delay:-5.1s}
  .as19-b2{width:80%;animation-delay:-1.8s}.as19-b2 i{animation-delay:-7.2s}.as19-b3{width:62%;animation-delay:-3s}.as19-b3 i{animation-delay:-9.4s}
  @keyframes as19-p{0%{transform:translate3d(-46%,0,0)}50%{transform:translate3d(46%,0,0)}100%{transform:translate3d(-46%,0,0)}}
  @keyframes as19-br{from{opacity:.74}to{opacity:1}}
  /* what it resolves into: a layered landscape in the well (far → near, no strokes between bands) and crisp text */
  .as19-content{position:absolute;inset:0;padding:clamp(10px,3.4vmin,20px);display:flex;flex-direction:column;gap:clamp(4px,1.6vmin,9px);opacity:0;transition:opacity .6s .1s;pointer-events:none}
  .as19-land{position:relative;flex:1;min-height:40px;border-radius:10px;overflow:hidden;background:linear-gradient(to bottom,var(--as19-cool),transparent 60%),var(--as19-surface)}
  .as19-land b{position:absolute;left:-6%;right:-6%;bottom:0;border-radius:50% 50% 0 0/28% 22% 0 0;animation:as19-sway 20s cubic-bezier(.45,.05,.55,.95) infinite alternate}
  .as19-land .as19-f{height:70%;background:var(--as19-far);animation-duration:26s}.as19-land .as19-m{height:55%;background:var(--as19-mid);animation-duration:22s;animation-delay:-8s}.as19-land .as19-n{height:41%;background:var(--as19-near);animation-delay:-4s}.as19-land .as19-g{height:27%;background:color-mix(in srgb,var(--as19-near) 60%,var(--as19-leaf));border-radius:0}
  .as19-land s{position:absolute;top:14%;left:18%;width:9%;aspect-ratio:1;border-radius:50%;background:var(--as19-sun);opacity:.7;text-decoration:none}
  @keyframes as19-sway{from{transform:translateX(-1.5%)}to{transform:translateX(1.5%)}}
  .as19-k{font-size:clamp(8px,2.2vmin,10px);letter-spacing:.14em;text-transform:uppercase;color:var(--as19-muted)}
  .as19-h{margin:0;font:300 clamp(15px,5vmin,26px)/1.1 var(--as19-display);letter-spacing:-.02em}
  .as19-m{font-size:clamp(9px,2.5vmin,12px);line-height:1.4;color:var(--as19-muted)}
  .as19-card.is-ready .as19-b{opacity:0}.as19-card.is-ready .as19-content{opacity:1}
  .as19-card.is-paused *{animation-play-state:paused!important}
  .as19-status{position:static;margin-top:auto;font-size:clamp(8px,2.2vmin,10px);letter-spacing:.14em;text-transform:uppercase;color:var(--as19-muted);opacity:.7;transition:opacity .4s}
  .as19-card.is-ready .as19-status{opacity:0}
  .as19-cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--as19-muted);opacity:.5;letter-spacing:.08em;text-transform:uppercase;user-select:none;pointer-events:none}
  @media (prefers-reduced-motion:reduce){.as19-card *{animation:none!important;transition:none!important}.as19-b i{transform:none;opacity:.9}}
</style>

<div class="as19-stage">
  <div class="as19-card" id="as19-card" role="status" aria-busy="true" aria-label="Content loading: warm and cool haze passing across placeholder blocks, which then resolve into a layered landscape card">
    <div class="as19-b as19-img"><i></i></div>
    <div class="as19-b as19-l as19-b1"><i></i></div>
    <div class="as19-b as19-t as19-b2"><i></i></div>

    <div class="as19-status" id="as19-status">Loading · haze pass</div>
    <div class="as19-content" aria-hidden="true">
      <div class="as19-land"><s></s><b class="as19-f"></b><b class="as19-m"></b><b class="as19-n"></b><b class="as19-g"></b></div>
      <span class="as19-k" id="as19-k">Study 04 · 14:20</span><h3 class="as19-h" id="as19-h">Estuary, low tide</h3><span class="as19-m" id="as19-m">Overcast, wind 18kt · cool distance, warm ground</span>
    </div>
  </div>
</div>
<div class="as19-cap" aria-hidden="true">Atmospheric Skeleton</div>
<script>(function(){"use strict";
  var root=document.documentElement, card=document.getElementById('as19-card'), h=document.getElementById('as19-h'), k=document.getElementById('as19-k'), m=document.getElementById('as19-m'), status=document.getElementById('as19-status');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  addEventListener('message',function(e){var d=e.data;if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark'))root.setAttribute('data-theme',d.theme);});
  var items=[['Study 04 · 14:20','Estuary, low tide','Overcast, wind 18kt · cool distance, warm ground'],['Study 05 · 15:02','Ridge after rain','Broken cloud, wind 11kt · high key, flat value'],['Study 06 · 19:26','Dusk on the marsh','Clear, still · temperature splits at the horizon']], cur=0;
  // one 100 ms clock: the haze passes for 3.4 s, the study resolves for 3 s, then the next mounts
  var TICK=100, LOAD=3400, SHOW=3000, t=LOAD-1500, ready=false, clock=null;
  function set(on){ ready=on; card.classList.toggle('is-ready',on); card.setAttribute('aria-busy',on?'false':'true'); card.setAttribute('aria-label',on?items[cur][1]+' — '+items[cur][2]:'Content loading');
    if(!on){ cur=(cur+1)%items.length; k.textContent=items[cur][0]; h.textContent=items[cur][1]; m.textContent=items[cur][2]; } }
  function tick(){ t+=TICK; if(!ready){ status.textContent=t<LOAD*.5?'Loading · haze pass':'Loading · mixing pigment'; if(t>=LOAD){t=0;set(true);} } else if(t>=SHOW){ t=0; set(false); } }
  function start(){ if(!clock&&!reduce)clock=setInterval(tick,TICK); card.classList.remove('is-paused'); }
  function stop(){ clearInterval(clock); clock=null; card.classList.add('is-paused'); }
  document.addEventListener('visibilitychange',function(){ document.hidden?stop():start(); });
  if(reduce)set(true); // reduced motion: the resolved study, complete and still
  start();
})();</script>
