<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Boss Health Bar — Progress & Status. A self-contained, zero-dependency animated web component.">
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress & Status — Bit Gaming — Boss Health Bar</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  .bg04-wrap, .bg04-wrap * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #000;
    color: #fff;
    font-family: 'Press Start 2P', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .bg04-wrap {
    width: 100%;
    max-width: 380px;
    background: #000;
    border: 3px solid #fff;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    box-shadow: 6px 6px 0 #808080;
    user-select: none;
    position: relative;
  }
  .bg04-hdr {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
  }
  .bg04-boss-name {
    color: #E52521;
    text-shadow: 2px 2px 0 #000;
  }
  .bg04-bar-track {
    width: 100%;
    height: 22px;
    background: #222;
    border: 2px solid #fff;
    padding: 2px;
    display: flex;
    gap: 2px;
  }
  .bg04-segment {
    flex: 1;
    height: 100%;
    background: #E52521;
    transition: background 0.1s ease;
  }
  .bg04-segment.bg04-lost {
    background: #111;
  }
  .bg04-subbar {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #FFCC00;
  }
  .bg04-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    background: #E52521;
    color: #fff;
    border: 2px solid #fff;
    padding: 10px;
    cursor: pointer;
    box-shadow: 3px 3px 0 #808080;
    text-align: center;
  }
  .bg04-btn:focus-visible {
    outline: 2px solid #FFCC00;
    outline-offset: 3px;
  }
  .bg04-btn:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 #808080;
  }
  .bg04-dmg-float {
    position: absolute;
    top: 50px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: #FFCC00;
    pointer-events: none;
    opacity: 0;
    transition: all 0.4s ease-out;
  }
  .bg04-dmg-float.bg04-show {
    top: 25px;
    opacity: 1;
  }
  .bg04-shake {
    animation: bg04-shake 0.2s ease-in-out;
  }
  @keyframes bg04-shake {
    0% { transform: translate(0, 0); }
    25% { transform: translate(-3px, 2px); }
    50% { transform: translate(3px, -2px); }
    75% { transform: translate(-2px, -1px); }
    100% { transform: translate(0, 0); }
  }

.bg04-preset1{color:#00E8D8}
.bg04-preset2{color:#8BAC0F}
.bg04-cap{position:fixed;left:10px;bottom:8px;font:10px system-ui;opacity:.55;pointer-events:none}
@media(prefers-reduced-motion:reduce){.bg04-wrap, .bg04-wrap *{animation:none!important;transition:none!important}}

.bg04-wrap[data-paused] *,.bg04-wrap[data-paused]{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){.bg04-wrap,.bg04-wrap *{animation:none!important;transition:none!important}}
@container fit-20-boss-health-bar-strobe-meter (max-width:210px){.bg04-wrap{width:calc(100% - 16px);padding:10px;gap:7px;box-shadow:3px 3px 0 #808080}.bg04-hdr{display:none}.bg04-bar-track{height:38px}.bg04-subbar{font-size:12px}.bg04-btn{font-size:12px;padding:9px}.bg04-cap{display:none}}
body{width:100%;container-type:inline-size;container-name:fit-20-boss-health-bar-strobe-meter}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/progress-status/20-boss-health-bar-strobe-meter.html",
 "title": "Boss Health Bar",
 "description": "Boss Health Bar control in the 8-Bit Gaming system.",
 "useWhen": "",
 "avoidWhen": "",
 "agentPrompt": "",
 "editableAreas": [],
 "preserveElements": [
  "First deliberate attack stops idle combat demo; the clicked attack state applies once.",
  "demo-v1 preview lifecycle: initialize demoEnabled from window.__foreverPreview and stop attract work on the window forever:interactive event; retain manual feedback, settling, cleanup and explicit sessions"
 ],
 "knownLimitations": [
  "State remains local to each mounted instance; format/theme remount preserves takeover, not component values."
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "accessible",
  "copy-paste-safe",
  "minimal-deps"
 ],
 "tags": [
  "arcade",
  "8-bit",
  "pixel",
  "retro",
  "gaming",
  "microswitch",
  "boss-health-bar",
  "progress",
  "health-bar",
  "strobe",
  "damage",
  "meter",
  "8-bit-gaming",
  "rpg",
  "hud"
 ]
}
</script>
</head>
<body>
<div class="bg04-wrap" id="bg04-wrap" role="region" aria-label="Boss Health Bar">
  <div class="bg04-hdr">
    <span class="bg04-boss-name">CYBER-DRAGON</span>
    <span class="bg04-preset1" id="bg04-phasePill">PHASE 1</span>
  </div>

  <div class="bg04-bar-track" id="bg04-barTrack"></div>

  <div class="bg04-subbar">
    <span id="bg04-hpText">HP: 16/16</span>
    <span class="bg04-preset2">STATUS: ACTIVE</span>
  </div>

  <div class="bg04-dmg-float" id="bg04-dmgFloat">-4 HP! CRIT</div>

  <button id="bg04-atkBtn" class="bg04-btn" type="button">ATTACK [A BUTTON]</button>
</div>

<div class="bg04-cap" aria-hidden="true">Boss Health Bar</div>
<script>
(()=>{
  // Local frame lifecycle: stop hidden work, repaint reduced-motion state on input.
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const frames = new Map(), drivers = new Set(); let painting = false;
  function scheduleFrame(fn) {
    if(fn===idleDemo&&!demoEnabled)return;
    drivers.add(fn);
    if (document.hidden || frames.has(fn) || (motion.matches && painting)) return;
    frames.set(fn, requestAnimationFrame(t => {
      frames.delete(fn); if (document.hidden) return;
      painting = true; try { fn(t); } finally { painting = false; }
    }));
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { frames.forEach(cancelAnimationFrame); frames.clear(); }
    else drivers.forEach(scheduleFrame);
  });
  const repaint = () => { if (motion.matches) drivers.forEach(scheduleFrame); };
  ['click','input','pointermove'].forEach(type => document.addEventListener(type, repaint));
  motion.addEventListener('change', () => { reduce = motion.matches; drivers.forEach(scheduleFrame); });

  const tileRoot = document.querySelector('.bg04-wrap');
  const pauseCSS = () => tileRoot.toggleAttribute('data-paused', document.hidden);
  document.addEventListener('visibilitychange', pauseCSS); pauseCSS();

  let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const barTrack = document.getElementById('bg04-barTrack');
  const hpText = document.getElementById('bg04-hpText');
  const phasePill = document.getElementById('bg04-phasePill');
  const atkBtn = document.getElementById('bg04-atkBtn');
  const dmgFloat = document.getElementById('bg04-dmgFloat');
  const wrap = document.getElementById('bg04-wrap');

  const totalSegs = 16;
  let curHp = 16;

  // Build segments
  for (let i = 0; i < totalSegs; i++) {
    const seg = document.createElement('div');
    seg.className = 'bg04-segment';
    barTrack.appendChild(seg);
  }

  function attack() {
    if (curHp <= 0) {
      curHp = 16; // Revive boss
      phasePill.textContent = 'PHASE 1';
      phasePill.style.color = '#00E8D8';
    } else {
      const dmg = Math.random() > 0.4 ? 2 : 1;
      curHp = Math.max(0, curHp - dmg);

      // Float damage
      dmgFloat.textContent = `-${dmg * 120} HP! ${dmg > 1 ? 'CRIT' : ''}`;
      dmgFloat.classList.remove('bg04-show');
      void dmgFloat.offsetWidth; // trigger reflow
      dmgFloat.classList.add('bg04-show');

      // Screen shake
      wrap.classList.add('bg04-shake');
      setTimeout(() => wrap.classList.remove('bg04-shake'), 200);

      if (curHp <= 4) {
        phasePill.textContent = 'ENRAGED!';
        phasePill.style.color = '#E52521';
      } else if (curHp <= 8) {
        phasePill.textContent = 'PHASE 2';
        phasePill.style.color = '#FFCC00';
      }
    }

    hpText.textContent = `HP: ${curHp}/${totalSegs}`;
    const segs = Array.from(barTrack.children);
    segs.forEach((s, idx) => {
      if (idx < curHp) s.classList.remove('bg04-lost');
      else s.classList.add('bg04-lost');
    });

    if (curHp === 0) {
      hpText.textContent = 'HP: 0/16 [DEFEATED]';
      atkBtn.textContent = 'REVIVE BOSS [START]';
    } else {
      atkBtn.textContent = 'ATTACK [A BUTTON]';
    }
  }
  atkBtn.addEventListener('click',attack);
  let idleAt = 0, demoEnabled=window.__foreverPreview?window.__foreverPreview.demoEnabled!==false:true;
  function stopDemo(){demoEnabled=false;const id=frames.get(idleDemo);if(id)cancelAnimationFrame(id);frames.delete(id);drivers.delete(idleDemo);}
  window.addEventListener('forever:interactive',stopDemo);
  document.addEventListener('pointerdown',stopDemo,{capture:true});
  document.addEventListener('click',stopDemo,{capture:true});
  document.addEventListener('keydown',e=>{if(e.key!=='Tab'&&!e.metaKey&&!e.ctrlKey&&!e.altKey)stopDemo();},{capture:true});
  function idleDemo(now) {
    if (demoEnabled && !reduce && now - idleAt > 4000) {
      idleAt = now;
      attack();
    }
    scheduleFrame(idleDemo);
  }
  scheduleFrame(idleDemo);

})();
</script>
</body>
</html>
