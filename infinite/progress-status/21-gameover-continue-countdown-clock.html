<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Arcade Continue Countdown — Progress & Status. A self-contained, zero-dependency animated web component.">
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progress & Status — Bit Gaming — Arcade Continue Countdown</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  .bg07-wrap, .bg07-wrap * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #000;
    color: #fff;
    font-family: 'Press Start 2P', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .bg07-wrap {
    width: 100%;
    max-width: 380px;
    background: #000;
    border: 3px solid #E52521;
    padding: 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    box-shadow: 6px 6px 0 #330000;
    user-select: none;
  }
  .bg07-title {
    font-size: 13px;
    color: #E52521;
    letter-spacing: 0.1em;
  }
  .bg07-clock {
    font-size: 54px;
    color: #FFCC00;
    text-shadow: 4px 4px 0 #804000;
    margin: 8px 0;
    transition: transform 0.1s ease;
  }
  .bg07-clock.bg07-pulse {
    transform: scale(1.15);
    color: #fff;
  }
  .bg07-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    background: #000;
    color: #00E8D8;
    border: 2px solid #00E8D8;
    padding: 10px 16px;
    cursor: pointer;
    box-shadow: 3px 3px 0 #808080;
    animation: bg07-blink 1s infinite steps(1);
  }
  .bg07-btn:focus-visible {
    outline: 2px solid #FFCC00;
    outline-offset: 3px;
  }
  .bg07-btn:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 #808080;
  }
  @keyframes bg07-blink {
    50% { opacity: 0.3; }
  }
  .bg07-foot {
    width: 100%;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #8BAC0F;
  }

.bg07-preset1{color:#FFCC00}
.bg07-cap{position:fixed;left:10px;bottom:8px;font:10px system-ui;opacity:.55;pointer-events:none}
@media(prefers-reduced-motion:reduce){.bg07-wrap, .bg07-wrap *{animation:none!important;transition:none!important}}

.bg07-wrap[data-paused] *,.bg07-wrap[data-paused]{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){.bg07-wrap,.bg07-wrap *{animation:none!important;transition:none!important}}
@container fit-21-gameover-continue-countdown-clock (max-width:300px){.bg07-wrap{width:calc(100% - 16px);padding:12px;gap:9px;box-shadow:3px 3px 0 #330000}.bg07-title{font-size:15px}.bg07-clock{font-size:62px}.bg07-btn{font-size:12px;padding:10px}.bg07-foot{font-size:12px}}
@container fit-21-gameover-continue-countdown-clock (max-width:210px){.bg07-wrap{padding:8px;gap:5px}.bg07-foot{display:none}.bg07-clock{font-size:52px}.bg07-btn{font-size:12px;padding:8px}}
body{width:100%;container-type:inline-size;container-name:fit-21-gameover-continue-countdown-clock}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/progress-status/21-gameover-continue-countdown-clock.html",
 "title": "Arcade Continue Countdown",
 "description": "Arcade Continue Countdown control in the 8-Bit Gaming system.",
 "useWhen": "",
 "avoidWhen": "",
 "agentPrompt": "",
 "editableAreas": [],
 "preserveElements": [
  "First action stops idle countdown. User-started countdown continues to zero; continue starts a new user session.",
  "demo-v1 preview lifecycle: initialize demoEnabled from window.__foreverPreview and stop attract work on the window forever:interactive event; retain manual feedback, settling, cleanup and explicit sessions"
 ],
 "knownLimitations": [
  "State remains local to each mounted instance; format/theme remount preserves takeover, not component values."
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "accessible",
  "copy-paste-safe",
  "minimal-deps"
 ],
 "tags": [
  "arcade",
  "8-bit",
  "pixel",
  "retro",
  "gaming",
  "microswitch",
  "arcade-continue-countdown",
  "progress",
  "countdown",
  "continue",
  "timer",
  "clock",
  "8-bit-gaming",
  "game-over"
 ]
}
</script>
</head>
<body>
<div class="bg07-wrap" role="region" aria-label="Arcade Continue Countdown">
  <div class="bg07-title">CONTINUE ?</div>

  <div class="bg07-clock" id="bg07-clockDigit">9</div>

  <button id="bg07-coinBtn" class="bg07-btn" type="button">INSERT COIN</button>

  <div class="bg07-foot">
    <span id="bg07-creditStat">CREDIT: 00</span>
    <span class="bg07-preset1">HI-SCORE 88,400</span>
  </div>
</div>

<div class="bg07-cap" aria-hidden="true">Arcade Continue Countdown</div>
<script>
(()=>{
  const tileRoot = document.querySelector('.bg07-wrap');
  const pauseCSS = () => tileRoot.toggleAttribute('data-paused', document.hidden);
  document.addEventListener('visibilitychange', pauseCSS); pauseCSS();

  // Local frame lifecycle: stop hidden work, repaint reduced-motion state on input.
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const frames = new Map(), drivers = new Set(); let painting = false;
  function scheduleFrame(fn) {
    if(fn===loop&&!demoEnabled&&!userSession)return;
    drivers.add(fn);
    if (document.hidden || frames.has(fn) || (motion.matches && painting)) return;
    frames.set(fn, requestAnimationFrame(t => {
      frames.delete(fn); if (document.hidden) return;
      painting = true; try { fn(t); } finally { painting = false; }
    }));
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { frames.forEach(cancelAnimationFrame); frames.clear(); }
    else drivers.forEach(scheduleFrame);
  });
  const repaint = () => { if (motion.matches) drivers.forEach(scheduleFrame); };
  ['click','input','pointermove'].forEach(type => document.addEventListener(type, repaint));
  motion.addEventListener('change', () => { reduce = motion.matches; drivers.forEach(scheduleFrame); });

  let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clockDigit = document.getElementById('bg07-clockDigit');
  const coinBtn = document.getElementById('bg07-coinBtn');
  const creditStat = document.getElementById('bg07-creditStat');

  let demoEnabled=window.__foreverPreview?window.__foreverPreview.demoEnabled!==false:true,userSession=false;
  function stopDemo(){demoEnabled=false;}
  window.addEventListener('forever:interactive',stopDemo);
  document.addEventListener('pointerdown',stopDemo,{capture:true});
  document.addEventListener('click',stopDemo,{capture:true});
  document.addEventListener('keydown',e=>{if(e.key!=='Tab'&&!e.metaKey&&!e.ctrlKey&&!e.altKey)stopDemo();},{capture:true});
  let credits = 0;
  let count = 9;
  let running = true;
  document.addEventListener('visibilitychange', () => { running = !document.hidden; });

  coinBtn.addEventListener('click', () => {
    userSession=true;
    coinBtn.textContent = 'INSERT COIN';
    credits++;
    creditStat.textContent = `CREDIT: ${String(credits).padStart(2, '0')}`;
    count = 9;
    clockDigit.textContent = '9';
    clockDigit.style.color = '#00E8D8';
    setTimeout(() => clockDigit.style.color = '#FFCC00', 300);
    scheduleFrame(loop);
  });

  let tick = 0, lastTick = 0;
  function loop(now) {
    if (!running) return;
    if (!lastTick) lastTick = now;

    if (now - lastTick >= 1000) { // ~1 second
      lastTick = now;
      if (count > 0) {
        count--;
        clockDigit.textContent = count;
        clockDigit.classList.add('bg07-pulse');
        setTimeout(() => clockDigit.classList.remove('bg07-pulse'), 150);

        if (count <= 3) {
          clockDigit.style.color = '#E52521';
        }
      } else if(userSession) {
        clockDigit.textContent = '0';
        clockDigit.style.color = '#808080';
        coinBtn.textContent = 'GAME OVER';
        return;
      } else {
        clockDigit.textContent = '0';
        clockDigit.style.color = '#808080';
        coinBtn.textContent = 'GAME OVER';
        count = 10;
      }
    }

    scheduleFrame(loop);
  }
  scheduleFrame(loop);
})();
</script>
</body>
</html>
