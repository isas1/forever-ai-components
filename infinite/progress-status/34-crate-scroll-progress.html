<!doctype html>

<meta charset="utf-8">

<title>Crate Scroll Progress</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
:root{--b:#131316;--i:#F1F1F4;--m:#9A9CA6;--l:#2B2C31;--c:#7B95C4;--vn:#000;--ve:#3A3B42;--sp:cubic-bezier(.3,1.45,.5,1);color-scheme:dark}
:root[data-theme="light"]{--b:#EFF0F3;--i:#000;--m:#5F616B;--l:#CDCFD8;--c:#2B4473;--ve:transparent;color-scheme:light}
html,body{margin:0;height:100%;overflow:hidden;background:var(--b);color:var(--i);font:14px/1.3 "Avenir Next",Avenir,system-ui,sans-serif}
.cr09-st,.cr09-st *{box-sizing:border-box}
.cr09-st{position:relative;width:100%;height:100%;display:grid;place-items:center;padding:clamp(8px,3vmin,18px);background:var(--b);color:var(--i)}
.cr09-st :focus-visible{outline:2px solid var(--c);outline-offset:2px}
.cr09-sc{position:relative;width:min(100%,340px);display:grid;gap:clamp(6px,2vmin,10px)}
.cr09-bar{position:relative;height:20px;margin:0 10px}
.cr09-tr{position:absolute;left:0;right:0;top:9px;height:2px;background:var(--l)}
.cr09-tr i{display:block;height:100%;background:var(--i);transform-origin:left;transform:scaleX(var(--cr09-p,0))}
.cr09-tk{position:relative}
.cr09-tb{position:absolute;top:5px;width:10px;height:10px;margin-left:-5px;padding:0;border-radius:50%;background:var(--b);border:1.5px solid var(--m);cursor:pointer;transition:background .2s,border-color .2s,scale .25s var(--sp)}
.cr09-tb::before{content:"";position:absolute;inset:-10px}
.cr09-tb.cr09-on{background:var(--i);border-color:var(--i)}.cr09-tb:hover{scale:1.5}
.cr09-dc{position:absolute;top:0;left:-10px;width:20px;height:20px;pointer-events:none}
.cr09-dc1{fill:var(--vn);stroke:var(--ve)}
.cr09-vw{position:relative;height:clamp(112px,52vmin,236px);overflow-y:auto;padding:clamp(8px,3vmin,14px);border:1px solid var(--l);border-radius:3px;scrollbar-width:thin}
.cr09-vw:focus-visible{outline-offset:-2px}
.cr09-sec{padding-bottom:clamp(12px,4vmin,22px)}
.cr09-h3{margin:0 0 clamp(6px,2vmin,10px);font-family:Futura,"Avenir Next",sans-serif;font-size:clamp(13px,4vmin,17px)}
.cr09-ln{display:block;height:5px;border-radius:3px;background:var(--l);margin-bottom:7px}
.cr09-w0{width:96%}.cr09-w1{width:88%}.cr09-w2{width:74%}.cr09-w3{width:58%}
.cr09-art{display:block;width:42%;aspect-ratio:1;border-radius:2px;margin:10px 0 4px}
.cr09-up{position:absolute;right:10px;bottom:10px;display:inline-grid;place-items:center;width:clamp(28px,9vmin,38px);height:clamp(28px,9vmin,38px);border-radius:50%;background:var(--b);border:1.5px solid var(--i);padding:0;color:var(--i);cursor:pointer;scale:0;transition:scale .3s var(--sp);touch-action:manipulation}
.cr09-up.cr09-on{scale:1}
.cr09-ic{display:block;width:clamp(14px,4.5vmin,18px);height:clamp(14px,4.5vmin,18px);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cr09-cap{position:absolute;left:10px;bottom:8px;font:500 11px/1 ui-monospace,monospace;color:var(--i);opacity:.45;letter-spacing:.04em;text-transform:uppercase;pointer-events:none;user-select:none}
@media (prefers-reduced-motion:reduce){.cr09-st *{transition-duration:.01ms!important;animation-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/progress-status/34-crate-scroll-progress.html",
 "title": "Crate Scroll Progress",

<body>
<div class="cr09-st" id="cr09-st"></div>
<div class="cr09-cap" aria-hidden="true">Scroll Progress</div>
<script>(()=>{
  const s=document.getElementById('cr09-st'),RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  const A=[
    '<rect width="10" height="10" fill="#F2F0EA"/><circle cx="0" cy="10" r="9" fill="#0A0A0A"/><circle cx="0" cy="10" r="6" fill="#D5412B"/><circle cx="0" cy="10" r="3" fill="#F2F0EA"/>',
    '<rect width="10" height="10" fill="#5E9470"/><path d="M0 10L10 0v10z" fill="#F2F0EA"/><circle cx="7" cy="7" r="1.4" fill="#0A0A0A"/>',
    '<rect width="10" height="10" fill="#5A3A5C"/><path d="M1 7l2-3.6L5 7z" fill="#E2B01A"/><path d="M5 7l2-3.6L9 7z" fill="#F2F0EA"/><rect x="1" y="7.6" width="8" height=".5" fill="#F2F0EA"/>',
    '<rect width="10" height="10" fill="#F2F0EA"/><circle cx="3.6" cy="4" r="2.2" fill="#0A0A0A"/><circle cx="6.4" cy="5.8" r="2.2" fill="#2B4473"/><rect x="1" y="8.6" width="3" height=".4" fill="#0A0A0A"/>'
  ];
  const SECS=[['Side A',3,1],['Side B',4,0],['Credits',3,1],['Thanks',6,1]];
  const art=i=>`<svg class="cr09-art" viewBox="0 0 10 10" aria-hidden="true">${A[i%4]}</svg>`;
  s.innerHTML=`<div class="cr09-sc"><div class="cr09-bar"><div class="cr09-tr" role="progressbar" aria-label="Reading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div><div class="cr09-tk"></div><svg class="cr09-dc" viewBox="0 0 20 20" aria-hidden="true"><circle class="cr09-dc1" cx="10" cy="10" r="9.5"/><circle cx="10" cy="10" r="4" fill="#D5412B"/><circle cx="14.6" cy="6.4" r="1.4" fill="#F2F0EA"/></svg></div><div class="cr09-vw" tabindex="0" role="region" aria-label="Liner notes" data-fit-clip-ok>${SECS.map(([h,n,a],i)=>`<section class="cr09-sec"><h3 class="cr09-h3">${h}</h3>${[...Array(n)].map((_,j)=>`<i class="cr09-ln cr09-w${j===n-1?3:(i+j)%3}"></i>`).join('')}${a?art(i):''}</section>`).join('')}</div><button type="button" class="cr09-up" aria-label="Back to top"><svg class="cr09-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></div>`;
  const v=s.querySelector('.cr09-vw'),tr=s.querySelector('.cr09-tr'),disc=s.querySelector('.cr09-dc'),up=s.querySelector('.cr09-up'),tk=s.querySelector('.cr09-tk'),hs=[...v.querySelectorAll('.cr09-sec')];
  let ticks=[],raf=0,demo=!RM()&&!(window.__foreverPreview&&window.__foreverPreview.demoEnabled===false),timer=0,kick=0,step=0;
  const max=()=>Math.max(1,v.scrollHeight-v.clientHeight),to=y=>v.scrollTo({top:y,behavior:RM()?'auto':'smooth'});
  const paint=()=>{raf=0;const p=Math.min(1,Math.max(0,v.scrollTop/max())),W=tr.offsetWidth;tr.style.setProperty('--cr09-p',String(p));tr.setAttribute('aria-valuenow',String(Math.round(p*100)));disc.style.transform=`translateX(${p*W}px) rotate(${p*W/(Math.PI*20)*360}deg)`;up.classList.toggle('cr09-on',p>.12);up.tabIndex=p>.12?0:-1;ticks.forEach(t=>t.el.classList.toggle('cr09-on',p>=t.f-.01))};
  const layout=()=>{tk.innerHTML='';ticks=hs.map((h,i)=>{const f=Math.min(1,Math.max(0,(h.offsetTop-10)/max())),el=document.createElement('button');el.type='button';el.className='cr09-tb';el.style.left=f*100+'%';el.setAttribute('aria-label','Jump to '+SECS[i][0]);el.onclick=()=>{halt();to(f*max())};tk.appendChild(el);return{f,el}});paint()};
  v.addEventListener('scroll',()=>{raf||(raf=requestAnimationFrame(paint))},{passive:true});
  up.onclick=()=>{halt();to(0);v.focus({preventScroll:true})};
  layout();if(typeof ResizeObserver==='function')new ResizeObserver(layout).observe(v);

  const sq=[.35,.72,1,0];
  const play=()=>{if(!demo||RM()||document.hidden)return;to(sq[step++%sq.length]*max())};
  const stop=()=>{clearInterval(timer);clearTimeout(kick);timer=kick=0},start=()=>{if(!timer&&demo&&!RM())timer=setInterval(play,1250)},halt=()=>{demo=false;stop()};
  window.addEventListener('forever:interactive',halt);s.addEventListener('pointerdown',halt,true);s.addEventListener('keydown',halt,true);v.addEventListener('wheel',halt,{passive:true,once:true});
  document.addEventListener('visibilitychange',()=>document.hidden?stop():demo&&start());
  window.addEventListener('message',e=>{if(e.data&&e.data.type==='forever:theme'&&(e.data.theme==='light'||e.data.theme==='dark'))document.documentElement.setAttribute('data-theme',e.data.theme)});
  if(demo){kick=setTimeout(play,600);start()}
})();</script>
</body>
