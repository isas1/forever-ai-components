<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Iridescent oil-slick sheen of swirling pink, cyan and violet thin-film bands flowing in slow liquid waves.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oil Slick</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark defaults; light = the same thin-film sweep printed on cream.
     --ps08-l0..l6 are the seven anchor stops of the JS iridescence LUT ("r,g,b"). */
  :root{
    --ps08-bg:#0a0612; --ps08-vig1:rgba(10,6,18,.55); --ps08-vig2:#0a0612;
    --ps08-sh1:rgba(255,61,166,.20); --ps08-sh2:rgba(40,200,255,.10); --ps08-cap:#fff; --ps08-cap-o:.42;
    --ps08-l0:255,61,166; --ps08-l1:150,40,200; --ps08-l2:40,120,255; --ps08-l3:40,210,235;
    --ps08-l4:120,235,150; --ps08-l5:255,210,70; --ps08-l6:255,61,166;
  }
  :root[data-theme="light"]{
    --ps08-bg:#f4f1f6; --ps08-vig1:rgba(246,242,248,.55); --ps08-vig2:#f4f1f6;
    --ps08-sh1:rgba(198,20,110,.16); --ps08-sh2:rgba(20,120,160,.10); --ps08-cap:#2a1030; --ps08-cap-o:.62;
    --ps08-l0:216,96,158; --ps08-l1:186,150,215; --ps08-l2:130,175,228; --ps08-l3:110,210,212;
    --ps08-l4:190,228,168; --ps08-l5:245,222,140; --ps08-l6:216,96,158;
  }
  html,body{margin:0;height:100%;background:var(--ps08-bg);overflow:hidden}
  #ps08-stage{position:fixed;inset:0;display:block}
  #ps08-c{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* static iridescent vignette glow — never repaints */
  #ps08-glow{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 42%,transparent 38%,var(--ps08-vig1) 78%,var(--ps08-vig2) 100%);
    box-shadow:inset 0 0 90px var(--ps08-sh1),inset 0 0 160px var(--ps08-sh2)}
  .cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--ps08-cap);opacity:var(--ps08-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important}}
</style>
<script type="application/json" id="forever-agent-meta">

 "title": "Oil Slick",
 "description": "Layered sine interference across a 120x120 grid maps to a magenta-violet-cyan-gold LUT, producing slow liquid oil-film color bands that scroll and morph.",
 "useWhen": "Dark-mode hero backgrounds, psychedelic or holographic brand themes, ambient screensaver-style displays.",
 "avoidWhen": "Light-background layouts (background hardcoded dark), contexts needing legible text overlays, or low-end mobile where the pixel loop may stutter.",
 "agentPrompt": "Change the palette by editing the stops array — replace the cyan stop ([0.52, 40,210,235]) with lime green ([0.52, 80,255,80]) and slow the animation by halving all three phase multipliers (0.00018, 0.00011, 0.00026). Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "palette LUT stops array (color anchors)",
  "simulation grid resolution (FW=120, FH=120)",
  "phase speed multipliers (0.00018, 0.00011, 0.00026)",
  "sine layer coefficients (3.1, 3.7, 4.2, 5.0)",
  "vignette glow CSS rgba values",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "low-res offscreen pattern (FW/FH upscale — critical for perf)",

  "visibilitychange pause/resume",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "120x120 pixel loop runs every frame — moderate CPU cost on battery-constrained devices",
  "Light re-theme via the [data-theme=light] token block; catalog bg/accent describe the dark default",
  "No pointer/touch interactivity — purely passive"
 ],
 "tier": "curated",
 "labels": [
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "mobile-ready",
  "light-ready"
 ],
 "tags": [
  "iridescent",
  "oil-slick",
  "canvas",
  "psychedelic",

 ]

</head>
<body>
<div id="ps08-stage" role="img" aria-label="Iridescent oil-slick sheen of swirling pink, cyan and violet bands flowing in slow liquid waves">
  <canvas id="ps08-c"></canvas>
  <div id="ps08-glow"></div>
</div>
<div class="cap">Oil Slick</div>
<script>
(function(){
  "use strict";
  var cv=document.getElementById("ps08-c");
  var root=document.documentElement;
  var ctx=cv.getContext("2d");
  var reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;

  // low-res field, upscaled by canvas -> cheap, smooth, no per-pixel layout reads
  var FW=120, FH=120;            // simulation grid
  var img, data;
  var W=0,H=0,DPR=1;

  function fitField(){
    img=ctx.createImageData(FW,FH);
    data=img.data;
  }
  fitField();

  function size(){
    DPR=Math.min(2,window.devicePixelRatio||1);
    W=cv.clientWidth; H=cv.clientHeight;
    cv.width=Math.max(1,Math.round(W*DPR));
    cv.height=Math.max(1,Math.round(H*DPR));
  }
  size();

  // iridescent palette LUT (Fillmore-style complementary sheen): magenta->violet->cyan->gold.
  // The seven anchors come from --ps08-l0..l6, so a theme switch re-bakes the table.
  var LUT=new Uint8Array(256*3);
  var LPOS=[0.00,0.18,0.36,0.52,0.68,0.82,1.00];
  var LCOL=[[255,61,166],[150,40,200],[40,120,255],[40,210,235],[120,235,150],[255,210,70],[255,61,166]];
  function buildLUT(){
    var stops=[],j;                      // anchor stops [pos, r,g,b]
    for(j=0;j<7;j++) stops.push([LPOS[j],LCOL[j][0],LCOL[j][1],LCOL[j][2]]);
    for(var i=0;i<256;i++){
      var t=i/255, a=stops[0], b=stops[stops.length-1], k;
      for(k=0;k<stops.length-1;k++){
        if(t>=stops[k][0]&&t<=stops[k+1][0]){a=stops[k];b=stops[k+1];break;}
      }
      var span=(b[0]-a[0])||1, f=(t-a[0])/span;
      LUT[i*3  ]=a[1]+(b[1]-a[1])*f;
      LUT[i*3+1]=a[2]+(b[2]-a[2])*f;
      LUT[i*3+2]=a[3]+(b[3]-a[3])*f;
    }
  }
  function syncTheme(){
    var cs=getComputedStyle(root), p, i;
    for(i=0;i<7;i++){ p=cs.getPropertyValue("--ps08-l"+i).trim().split(","); LCOL[i]=[+p[0],+p[1],+p[2]]; }
    buildLUT();
    if(reduce) render(8200);             // re-bake, then repaint the static frame
  }
  addEventListener("message",function(e){ var d=e.data; if(d&&d.type==="forever:theme"&&(d.theme==="light"||d.theme==="dark")){
    root.setAttribute("data-theme",d.theme); syncTheme(); }});

  // precompute centered grid coords (allocation-free loop later)
  var GX=new Float32Array(FW), GY=new Float32Array(FH);
  (function(){
    for(var x=0;x<FW;x++)GX[x]=(x/FW-0.5)*2;
    for(var y=0;y<FH;y++)GY[y]=(y/FH-0.5)*2;
  })();

  var TAU=Math.PI*2;

  function render(t){
    var p1=t*0.00018, p2=t*0.00011, p3=t*0.00026; // slow phases -> seizure-safe
    var s1=Math.sin(p1), c1=Math.cos(p1*0.7);
    var s2=Math.sin(p2*1.3), c2=Math.cos(p2);
    var i=0, x, y, gy, gx, v, idx;
    for(y=0;y<FH;y++){
      gy=GY[y];
      for(x=0;x<FW;x++){
        gx=GX[x];
        // layered sine interference = liquid oil-film thickness -> color phase
        v = Math.sin(gx*3.1 + s1*2.4 + gy*1.7)
          + Math.sin(gy*3.7 - p2*3.0 + gx*c1*2.0)
          + Math.sin((gx*gx+gy*gy)*4.2 - p3*2.2)
          + Math.sin((gx*c2 - gy*s2)*5.0 + p1*1.6);
        // map to 0..1 thin-film phase, wrap for that metallic banding
        v = v*0.25 + 0.5;
        v = v - Math.floor(v);
        idx=(v*255)|0; idx=idx*3;
        data[i  ]=LUT[idx];
        data[i+1]=LUT[idx+1];
        data[i+2]=LUT[idx+2];
        data[i+3]=255;
        i+=4;
      }
    }
    ctx.putImageData(img,0,0);
    // upscale the small field to fill the frame, smoothly
    ctx.save();
    ctx.imageSmoothingEnabled=true;
    ctx.globalCompositeOperation="copy";
    ctx.drawImage(cv,0,0,FW,FH,0,0,cv.width,cv.height);
    ctx.restore();
  }

  var raf=0, running=false, startT=0;
  function loop(now){
    if(!running)return;
    render(now-startT);
    raf=requestAnimationFrame(loop);
  }
  function start(){
    if(running)return;
    running=true; startT=performance.now()-0;
    raf=requestAnimationFrame(loop);
  }
  function stop(){
    running=false;
    if(raf)cancelAnimationFrame(raf), raf=0;
  }

  function onResize(){
    size();
    if(reduce){ render(8200); }
  }
  window.addEventListener("resize",onResize);

  document.addEventListener("visibilitychange",function(){
    if(document.hidden){ stop(); }
    else if(!reduce){ startT=performance.now()-((performance.now()-startT)); start(); }
  });

  syncTheme();                   // bakes the LUT (after the GX/GY tables exist)
  if(reduce){
    // one calm, on-brand static frame — no loop
    render(8200);
    return;
  }
  start();
})();
</script>
</body>
</html>
