<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Green CRT terminal auto-typing a boot sequence with blinking cursor and scanline overlay, looping.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fake terminal typing</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05080a}
.ft07-stage{position:fixed;inset:0}
.ft07-term{position:absolute;inset:0;padding:5% 6% 25px;box-sizing:border-box;font:600 clamp(11px,3vw,18px)/1.55 ui-monospace,"SF Mono",Menlo,monospace;color:#7dffb0;text-shadow:0 0 4px rgba(125,255,176,.5);overflow:hidden;display:flex;flex-direction:column}
.ft07-line{flex-shrink:0;white-space:pre-wrap;overflow-wrap:anywhere}
.ft07-p{color:#8aceeb}.ft07-w{color:#ffe26b}.ft07-d{color:#91b39f}
.ft07-cur{display:inline-block;width:.6em;height:1.05em;background:#7dffb0;vertical-align:-2px;animation:ft07-bl 1s steps(1) infinite;box-shadow:0 0 6px #7dffb0}
@keyframes ft07-bl{50%{opacity:0}}
.ft07-scan{position:absolute;inset:0;pointer-events:none;opacity:.5;background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(0,0,0,.22) 3px)}
.ft07-cap{position:fixed;right:8px;bottom:7px;font:600 10px ui-monospace,monospace;color:#7dffb0;opacity:.35;letter-spacing:.5px;pointer-events:none}
.ft07-paused .ft07-cur{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){.ft07-cur{animation:none}}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/retro-glitch/07-fake-terminal-typing.html",
 "title": "Fake terminal typing",
 "description": "Green-on-black CRT terminal auto-types a fake boot sequence with randomized keystroke delays, scanline overlay, and blinking block cursor; loops continuously.",
 "useWhen": "Retro/hacker aesthetic hero sections, loading screens, portfolio intros, or any context needing an old-school terminal vibe.",
 "avoidWhen": "Light-background layouts (background is hardcoded dark). Contexts where motion or blinking conflicts with content legibility.",
 "agentPrompt": "Change the typed lines to a custom script by editing the `lines` array, e.g. replace 'HELLO WORLD' with 'SYSTEM READY', and set the prompt color class 'p' to a magenta hex in the CSS `.p` rule.",
 "editableAreas": [
  "lines array content (text + color class per segment)",
  "typing speed (32+Math.random()*40 ms)",
  "text color (#7dffb0 green phosphor)",
  "scanline opacity (.scan opacity:.5)",
  "font size (clamp(11px,3.3vw,18px))",
  "loop pause duration (delay<-80 threshold)"
 ],
 "preserveElements": [
  "visibilitychange pause guard",
  "prefers-reduced-motion instant-render branch",
  "IIFE-style scoped variable block (avoids globals)"
 ],
 "knownLimitations": [
  "Background color hardcoded in CSS — must edit to use on light backgrounds",
  "No click-to-skip or replay interaction; fully passive",
  "Small frames use shorter boot messages and retain complete newest rows"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps"
 ],
 "tags": [
  "terminal",
  "typewriter",
  "retro",
  "crt",
  "green-phosphor",
  "loop",
  "boot-sequence"
 ]
}
</script>
</head>
<body>
<div class="ft07-stage" role="img" aria-label="CRT terminal typing a boot script, kernel and floppy status, then HELLO WORLD."><div class="ft07-term" id="ft07-term"></div><div class="ft07-scan"></div></div>
<div class="ft07-cap" aria-hidden="true">TERMINAL</div>
<script>
(()=>{
'use strict';
const term=document.getElementById('ft07-term');
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function sequence(){return document.documentElement.clientWidth<300?[
 ['$ ./boot.sh','ft07-p'],['[ok] kernel ready','ft07-d'],['[ok] floppy mounted','ft07-d'],['[warn] CRT warm','ft07-w'],['$ echo hello','ft07-p'],['HELLO WORLD',''],['guest@retro:~$ ','ft07-p']
]:[
 ['guest@retro:~$ ./boot.sh --demo','ft07-p'],['[ok] loading kernel modules','ft07-d'],['[ok] mounting /dev/floppy0','ft07-d'],['[warn] CRT phosphor warm','ft07-w'],['guest@retro:~$ echo "HELLO WORLD"','ft07-p'],['HELLO WORLD',''],['guest@retro:~$ ','ft07-p']
];}
let lines=sequence(),li=0,ci=1,hold=0,timer;
function trim(){while(term.children.length>1&&term.scrollHeight>term.clientHeight)term.firstChild.remove();}
function render(){
 term.replaceChildren();
 lines.slice(0,li+1).forEach(([text,cls],i)=>{
  const row=document.createElement('div');row.className='ft07-line '+cls;
  row.textContent=i===li?text.slice(0,ci):text;
  if(i===li){const cur=document.createElement('span');cur.className='ft07-cur';row.appendChild(cur);}
  term.appendChild(row);
 });trim();
}
function tick(){
 if(document.hidden)return;
 if(hold){hold--;if(!hold&&li===lines.length-1&&ci===lines[li][0].length){li=0;ci=1;render();}return;}
 if(ci<lines[li][0].length)ci++;
 else if(li<lines.length-1){li++;ci=0;hold=3;}
 else{hold=45;return;}
 render();
}
function stop(){clearInterval(timer);term.classList.add('ft07-paused');}
function play(){stop();term.classList.remove('ft07-paused');if(!reduce&&!document.hidden)timer=setInterval(tick,65);}
function resize(){lines=sequence();if(reduce){li=lines.length-1;ci=lines[li][0].length;}render();}
document.addEventListener('visibilitychange',()=>document.hidden?stop():play());
addEventListener('resize',resize);
resize();play();
})();
</script>
</body>
</html>
