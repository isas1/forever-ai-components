  .bg05-wrap {

    align-items: center;

  }
  .bg05-crt-screen {
    width: 100%;
    height: 140px;
    background: #041008;
    border: 2px solid #fff;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
  }
  .bg05-wrap canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .bg05-scanlines {
    position: absolute;
    inset: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.45) 50%);
    background-size: 100% 4px;
    pointer-events: none;
  }
  .bg05-vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, transparent 65%, rgba(0, 0, 0, 0.8) 100%);
    pointer-events: none;
  }
  .bg05-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 12px;
    background: #000;
    color: #00E8D8;
    border: 2px solid #00E8D8;
    padding: 8px;
    cursor: pointer;
    text-align: center;
    box-shadow: 2px 2px 0 #808080;
  }
  .bg05-btn:focus-visible{outline:2px solid #fff;outline-offset:4px;}
  .bg05-btn:active {
    transform: translate(2px, 2px);
    box-shadow: 0 0 0 transparent;
  }
  .bg05-foot {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #8BAC0F;
  }

.bg05-preset1{color:#00E8D8}

<body>
<div class="bg05-wrap" role="region" aria-label="CRT Phosphor Degauss">
  <div class="bg05-hdr">
    <span>ARCADE MONITOR 15KHZ</span>
    <span class="bg05-preset1">NTSC 240P</span>
  </div>

  <div class="bg05-crt-screen">
    <canvas id="bg05-crtCv" width="180" height="100"></canvas>
    <div class="bg05-scanlines"></div>
    <div class="bg05-vignette"></div>
  </div>

  <button id="bg05-degaussBtn" class="bg05-btn" type="button">DEGAUSS CRT COIL</button>

  <div class="bg05-foot">
    <span>SHADOW MASK: RGB</span>
    <span class="bg05-preset2">60 FPS SYNCHRONIZED</span>
  </div>
</div>

<div class="bg05-cap" aria-hidden="true">CRT Phosphor Degauss</div>
<script>
(()=>{
  const tileRoot = document.querySelector('.bg05-wrap');
  const pauseCSS = () => tileRoot.toggleAttribute('data-paused', document.hidden);
  document.addEventListener('visibilitychange', pauseCSS); pauseCSS();

  // Local frame lifecycle: stop hidden work, repaint reduced-motion state on input.
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const frames = new Map(), drivers = new Set(); let painting = false;
  function scheduleFrame(fn) {
    drivers.add(fn);
    if (document.hidden || frames.has(fn) || (motion.matches && painting)) return;
    frames.set(fn, requestAnimationFrame(t => {
      frames.delete(fn); if (document.hidden) return;
      painting = true; try { fn(t); } finally { painting = false; }
    }));
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { frames.forEach(cancelAnimationFrame); frames.clear(); }
    else drivers.forEach(scheduleFrame);
  });
  const repaint = () => { if (motion.matches) drivers.forEach(scheduleFrame); };
  ['click','input','pointermove'].forEach(type => document.addEventListener(type, repaint));
  motion.addEventListener('change', () => { reduce = motion.matches; drivers.forEach(scheduleFrame); });

  let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = document.getElementById('bg05-crtCv');
  const ctx = cv.getContext('2d');
  const degaussBtn = document.getElementById('bg05-degaussBtn');

  let demoEnabled=window.__foreverPreview?.demoEnabled!==false;
  function stopDemo(){demoEnabled=false;}
  addEventListener('forever:interactive',stopDemo);
  document.addEventListener('pointerdown',stopDemo,{capture:true});
  document.addEventListener('click',stopDemo,{capture:true});
  let degauss = 0; // 0 to 1
  degaussBtn.addEventListener('click', () => {
    stopDemo();degauss = reduce?0:1.0;scheduleFrame(render);
  });

  let running = true;
  document.addEventListener('visibilitychange', () => { running = !document.hidden; });

  let t = 0;
  function render() {
    if (!running) return;
    t += 0.05;
    degauss = Math.max(0, degauss - 0.03);

    ctx.fillStyle = '#041008';
    ctx.fillRect(0, 0, cv.width, cv.height);

    const cx = cv.width / 2;
    const cy = cv.height / 2;

    // Degauss magnetic distortion
    const warp = Math.sin(t * 15) * degauss * 18;

    // Draw glowing arcade ship sprite
    ctx.save();
    const idleBob = demoEnabled && !reduce ? Math.sin(t * .7) * 5 : 0;
    ctx.translate(cx + warp, cy + idleBob);
    if (degauss > 0.1) {
      ctx.rotate(Math.sin(t * 8) * degauss * 0.4);
    }

    // Green Phosphor Vector Shield
    ctx.strokeStyle = degauss > 0.2 ? '#FFCC00' : '#00E8D8';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, -22);
    ctx.lineTo(16, 18);
    ctx.lineTo(0, 10);
    ctx.lineTo(-16, 18);
    ctx.closePath();
    ctx.stroke();

    // Core pilot dot
    ctx.fillStyle = '#E52521';
    ctx.fillRect(-2, -4, 4, 4);

    // Thrust flame
    if (Math.sin(t * 20) > 0) {
      ctx.fillStyle = '#FFCC00';
      ctx.beginPath();
      ctx.moveTo(-6, 14);
      ctx.lineTo(0, 24);
      ctx.lineTo(6, 14);
      ctx.fill();
    }
    ctx.restore();

    // Horizontal sync hum line
    const rollY = (t * 40) % cv.height;
    ctx.fillStyle = 'rgba(0, 232, 216, 0.08)';
    ctx.fillRect(0, rollY, cv.width, 4);

    if((demoEnabled&&!reduce)||degauss>0) scheduleFrame(render);
  }
  scheduleFrame(render);
})();
</script>
</body>
