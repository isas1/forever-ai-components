<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Gothic Lancet Triptych — Stained Glass. A self-contained, zero-dependency animated web component.">
<title>Gothic Lancet Triptych</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults; light = lead-lined jewel panes on pale
     parchment (leading stays dark). The --gl-lo / --gl-hi pair feeds the keyframe filter swing. */
  :root{
    --gl-bg:#0a0608;--gl-arch:#0a0608;--gl-lead:#0a0608;--gl-stone:#2a1a24;--gl-stone2:#1a1218;--gl-floor:#100810;
    --gl-red:#8b1a1a;--gl-amb:#c8860a;--gl-blu:#1a3a6b;--gl-grn:#0d5c2e;--gl-vio:#5b2d8e;--gl-gld:#d4a017;--gl-crm:#f8f0dc;
    --gl-beam-a:#f8f0dc;--gl-beam-b:#fffbe0;--gl-cap:#c8860a;--gl-cap-o:.45;
    --gl-lo:.75;--gl-lo2:.8;--gl-lo3:.7;--gl-hi:1.5;--gl-tlo:.8;--gl-thi:1.6;
  }
  :root[data-theme="light"]{
    --gl-bg:#f4ece0;--gl-arch:#3b3136;--gl-lead:#2b2026;--gl-stone:#a89685;--gl-stone2:#7d6b5f;--gl-floor:#cfc0aa;
    --gl-red:#d0625c;--gl-amb:#e8b45c;--gl-blu:#7fa6d4;--gl-grn:#79b98d;--gl-vio:#b295d6;--gl-gld:#edc76a;--gl-crm:#fdf8ea;
    --gl-beam-a:#f2c76e;--gl-beam-b:#fff6d8;--gl-cap:#8e5f07;--gl-cap-o:.75;
    --gl-lo:.93;--gl-lo2:.95;--gl-lo3:.92;--gl-hi:1.12;--gl-tlo:.95;--gl-thi:1.15;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--gl-bg)}
  #gl-wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  #gl-svg{width:min(100%,100vh);height:min(100%,100vh);max-width:640px;max-height:640px}
  /* pane / leading colours live on classes so both palettes share one geometry */
  .fr{fill:var(--gl-red)}.fa{fill:var(--gl-amb)}.fb{fill:var(--gl-blu)}.fg{fill:var(--gl-grn)}
  .fv{fill:var(--gl-vio)}.fo{fill:var(--gl-gld)}.fc{fill:var(--gl-crm)}
  .fk{fill:var(--gl-arch)}.ff{fill:var(--gl-floor)}#gl-bgr{fill:var(--gl-bg)}
  .sk{stroke:var(--gl-lead)}.ss{stroke:var(--gl-stone)}.s2{stroke:var(--gl-stone2)}
  .bm0{stop-color:var(--gl-beam-a)}.bm1{stop-color:var(--gl-beam-b)}
  /* Each lancet hue-shifts independently, fast enough to see */
  .gl-left{animation:gl-hueL 3s ease-in-out infinite}
  .gl-centre{animation:gl-hueC 5s ease-in-out infinite}
  .gl-right{animation:gl-hueR 4s ease-in-out infinite}
  /* Bright sweeping light beam */
  #gl-beam{animation:gl-beam 4s linear infinite}
  /* Trefoils pulse */
  .gl-trefoil{animation:gl-trefoil 2.5s ease-in-out infinite}
  @keyframes gl-hueL{
    0%,100%{filter:brightness(var(--gl-lo)) saturate(0.9) hue-rotate(0deg)}
    50%{filter:brightness(var(--gl-hi)) saturate(1.7) hue-rotate(60deg)}
  }
  @keyframes gl-hueC{
    0%,100%{filter:brightness(var(--gl-lo2)) saturate(1) hue-rotate(-20deg)}
    50%{filter:brightness(var(--gl-hi)) saturate(1.8) hue-rotate(80deg)}
  }
  @keyframes gl-hueR{
    0%,100%{filter:brightness(var(--gl-lo3)) saturate(0.85) hue-rotate(30deg)}
    50%{filter:brightness(var(--gl-hi)) saturate(1.6) hue-rotate(-40deg)}
  }
  @keyframes gl-beam{
    0%{transform:translateX(-420px);opacity:0}
    8%{opacity:1}
    85%{opacity:0.9}
    100%{transform:translateX(500px);opacity:0}
  }
  @keyframes gl-trefoil{
    0%,100%{filter:brightness(var(--gl-tlo))}
    50%{filter:brightness(var(--gl-thi)) saturate(1.8)}
  }
  #gl-caption{position:fixed;left:8px;bottom:7px;font:11px/1 monospace;color:var(--gl-cap);opacity:var(--gl-cap-o);pointer-events:none}
</style>

 "useWhen": "Dark-mode hero backgrounds, medieval/fantasy themes, decorative loading screens, or ambient art tiles requiring no interaction.",

 "editableAreas": [

</script>
</head>
<body>
<div id="gl-wrap">
<svg id="gl-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="gl-arch-l">
      <path d="M60,460 L60,160 Q60,80 120,80 Q180,80 180,160 L180,460 Z"/>
    </clipPath>
    <clipPath id="gl-arch-c">
      <path d="M190,460 L190,130 Q190,40 250,40 Q310,40 310,130 L310,460 Z"/>
    </clipPath>
    <clipPath id="gl-arch-r">
      <path d="M320,460 L320,160 Q320,80 380,80 Q440,80 440,160 L440,460 Z"/>
    </clipPath>
    <linearGradient id="gl-beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop class="bm0" offset="0%" stop-opacity="0"/>
      <stop class="bm0" offset="30%" stop-opacity="0.7"/>
      <stop class="bm1" offset="50%" stop-opacity="0.9"/>
      <stop class="bm0" offset="70%" stop-opacity="0.7"/>
      <stop class="bm0" offset="100%" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect id="gl-bgr" width="500" height="500"/>

  <!-- Left lancet — hue-cycles independently -->
  <g class="gl-left">
    <path class="fk ss" d="M60,460 L60,160 Q60,80 120,80 Q180,80 180,160 L180,460 Z" stroke-width="8"/>
    <g clip-path="url(#gl-arch-l)">
      <rect class="fr sk" x="65" y="340" width="110" height="115" stroke-width="3"/>
      <rect class="fa sk" x="65" y="260" width="50" height="75" stroke-width="3"/>
      <rect class="fb sk" x="125" y="260" width="50" height="75" stroke-width="3"/>
      <rect class="fg sk" x="65" y="190" width="50" height="65" stroke-width="3"/>
      <rect class="fv sk" x="125" y="190" width="50" height="65" stroke-width="3"/>
      <path class="fo sk" d="M65,190 L120,100 L175,190 Z" stroke-width="3"/>
      <path class="fc sk" d="M80,170 L120,115 L160,170 Z" stroke-width="2"/>
    </g>
    <path class="s2" d="M60,460 L60,160 Q60,80 120,80 Q180,80 180,160 L180,460" fill="none" stroke-width="8"/>
  </g>

  <!-- Centre lancet — different timing -->
  <g class="gl-centre">
    <path class="fk ss" d="M190,460 L190,130 Q190,40 250,40 Q310,40 310,130 L310,460 Z" stroke-width="8"/>
    <g clip-path="url(#gl-arch-c)">
      <rect class="fb sk" x="195" y="350" width="110" height="105" stroke-width="3"/>
      <rect class="fr sk" x="195" y="270" width="48" height="75" stroke-width="3"/>
      <rect class="fg sk" x="257" y="270" width="48" height="75" stroke-width="3"/>
      <rect class="fo sk" x="195" y="190" width="48" height="75" stroke-width="3"/>
      <rect class="fv sk" x="257" y="190" width="48" height="75" stroke-width="3"/>
      <rect class="fa sk" x="195" y="130" width="48" height="55" stroke-width="3"/>
      <rect class="fr sk" x="257" y="130" width="48" height="55" stroke-width="3"/>
      <path class="fv sk" d="M195,130 L250,48 L305,130 Z" stroke-width="3"/>
      <path class="fc sk" d="M210,118 L250,62 L290,118 Z" stroke-width="2"/>
      <circle class="fo sk" cx="250" cy="90" r="18" stroke-width="2"/>
    </g>
    <path class="s2" d="M190,460 L190,130 Q190,40 250,40 Q310,40 310,130 L310,460" fill="none" stroke-width="8"/>
  </g>

  <!-- Right lancet — third timing -->
  <g class="gl-right">
    <path class="fk ss" d="M320,460 L320,160 Q320,80 380,80 Q440,80 440,160 L440,460 Z" stroke-width="8"/>
    <g clip-path="url(#gl-arch-r)">
      <rect class="fv sk" x="325" y="340" width="110" height="115" stroke-width="3"/>
      <rect class="fo sk" x="325" y="260" width="50" height="75" stroke-width="3"/>
      <rect class="fr sk" x="385" y="260" width="50" height="75" stroke-width="3"/>
      <rect class="fb sk" x="325" y="190" width="50" height="65" stroke-width="3"/>
      <rect class="fa sk" x="385" y="190" width="50" height="65" stroke-width="3"/>
      <path class="fg sk" d="M325,190 L380,100 L435,190 Z" stroke-width="3"/>
      <path class="fc sk" d="M340,170 L380,115 L420,170 Z" stroke-width="2"/>
    </g>
    <path class="s2" d="M320,460 L320,160 Q320,80 380,80 Q440,80 440,160 L440,460" fill="none" stroke-width="8"/>
  </g>

  <!-- Trefoils that pulse brightness -->
  <g class="gl-trefoil">
    <circle class="fa sk" cx="120" cy="65" r="22" stroke-width="3"/>
    <circle class="fr sk" cx="100" cy="52" r="12" stroke-width="2"/>
    <circle class="fb sk" cx="140" cy="52" r="12" stroke-width="2"/>
    <circle class="fg sk" cx="380" cy="65" r="22" stroke-width="3"/>
    <circle class="fv sk" cx="360" cy="52" r="12" stroke-width="2"/>
    <circle class="fo sk" cx="400" cy="52" r="12" stroke-width="2"/>
  </g>

  <!-- Sweeping light beam — translates across full width -->
  <rect id="gl-beam" x="-40" y="40" width="80" height="420" fill="url(#gl-beam-grad)" rx="2"/>

  <!-- Stone floor suggestion -->
  <rect class="ff" x="0" y="460" width="500" height="40"/>
  <line class="ss" x1="0" y1="460" x2="500" y2="460" stroke-width="4"/>
</svg>
</div>
<div id="gl-caption">gothic lancet · stained glass</div>
<script>
(()=>{
  // live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}.
  // Every colour is a CSS token, so re-setting the attribute is the whole switch.
  addEventListener('message',e=>{
    const d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark'))
      document.documentElement.setAttribute('data-theme',d.theme);
  });
  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(reduce){
    document.querySelectorAll('.gl-left,.gl-centre,.gl-right,.gl-trefoil').forEach(el=>el.style.animation='none');
    const beam=document.getElementById('gl-beam');
    if(beam) beam.style.display='none';
    return;
  }
  document.addEventListener('visibilitychange',()=>{});
})();
</script>
</body>
</html>
