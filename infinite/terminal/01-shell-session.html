<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="description" content="Shell Session — Terminal. A self-contained, zero-dependency animated web component."><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shell Session</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0d1117;color:#00ff41;font:clamp(11px,2.3vmin,14px)/1.6 ui-monospace,Menlo,"Courier New",monospace}
.sh01-screen{padding:10px 10px 24px;height:100%;overflow:hidden;display:flex;flex-direction:column;gap:0}
.sh01-line{flex-shrink:0;white-space:pre-wrap;overflow-wrap:anywhere}
.sh01-prompt{color:#4ade80}
.sh01-cmd{color:#e2e8f0}
.sh01-out{color:#00ff41;opacity:.85}
.sh01-err{color:#ff5555}
.sh01-cursor{display:inline-block;width:8px;height:1em;background:#00ff41;animation:sh01-blink 1s step-start infinite;vertical-align:text-bottom;margin-left:1px}
@keyframes sh01-blink{0%,100%{opacity:1}50%{opacity:0}}
.sh01-cap{position:fixed;left:8px;bottom:7px;font:600 10px ui-monospace,monospace;color:#00ff41;opacity:.35;letter-spacing:.5px;pointer-events:none;z-index:99}
.sh01-paused .sh01-cursor{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){.sh01-cursor{animation:none}}
</style><script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/terminal/01-shell-session.html",
 "title": "Shell Session",
 "description": "Simulates a looping shell session: commands type out character-by-character with a blinking cursor, then output lines appear, then the next command begins.",
 "useWhen": "Developer portfolios, tech landing pages, retro/hacker aesthetic backgrounds, loading screens for CLI-adjacent tools.",
 "avoidWhen": "Non-technical audiences or contexts without a dark/terminal theme. Avoid where motion competes with primary content.",
 "agentPrompt": "Change the HOST to 'user@prod-01:~$ ', replace the first session command with 'docker ps --format \"table {{.Names}}\\t{{.Status}}\"', and slow typing speed by changing the base delay from 60 to 100.",
 "editableAreas": [
  "HOST prompt string",
  "sessions array (cmd + out lines)",
  "typing speed (60+Math.random()*40)",
  "output line delay (120ms)",
  "pause between sessions (1400ms)",
  "max visible lines (18)"
 ],
 "preserveElements": [
  "visibilitychange stop/play guard",
  "prefers-reduced-motion static fallback",
  "IIFE wrapper",
  "cursor element insertion before cursor span"
 ],
 "knownLimitations": [
  "Background color hardcoded in CSS (#0d1117) — must edit to change from dark navy",
  "Line cap at 18 removes oldest lines silently with no scroll history"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps"
 ],
 "tags": [
  "terminal",
  "typewriter",
  "shell",
  "retro",
  "ambient",
  "monospace",
  "loop"
 ]
}
</script>
</head><body>
<div class="sh01-screen" id="sh01-screen" role="img" aria-label="A shell session typing commands and showing their output."></div>
<div class="sh01-cap" aria-hidden="true">shell session</div>
<script>(()=>{
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const screen=document.getElementById('sh01-screen');
  const HOST='dave@bbs-1992:~$ ';
  const sessions=[
    {cmd:'ls -la /var/log',out:['total 128','drwxr-xr-x  12 root  root   4096 Jun 28 03:14 .','drwxr-xr-x  14 root  root   4096 Jun 27 22:00 ..','rw-r--r--   1 root  adm   87412 Jun 28 03:14 syslog','-rw-r--r--   1 root  adm    1024 Jun 28 02:00 auth.log']},
    {cmd:'ps aux | grep node',out:['root       814  0.0  0.2  node /usr/bin/server.js','dave      1337  2.1  1.8  node app.js --port 3000','dave      1338  0.0  0.0  grep --color=auto node']},
    {cmd:'ping -c 3 192.168.1.1',out:['PING 192.168.1.1: 56 data bytes','64 bytes from 192.168.1.1: icmp_seq=0 ttl=64 time=0.812 ms','64 bytes from 192.168.1.1: icmp_seq=1 ttl=64 time=0.794 ms','64 bytes from 192.168.1.1: icmp_seq=2 ttl=64 time=0.831 ms','--- 192.168.1.1 ping statistics ---','3 packets transmitted, 3 received, 0% packet loss']},
    {cmd:'cat /etc/hostname',out:['bbs-1992']},
  ];

  if(reduce){
    [['$ ls /var/log','sh01-prompt'],['syslog     85 KB','sh01-out'],['auth.log    1 KB','sh01-out'],['$ hostname','sh01-prompt'],['bbs-1992','sh01-out']].forEach(s=>addLine(...s));
    return;
  }

  function trim(){while(screen.children.length>1&&screen.scrollHeight>screen.clientHeight)screen.firstChild.remove();}
  addEventListener('resize',trim);
  function addLine(txt,cls){
    const d=document.createElement('div');
    d.className='sh01-line '+(cls||'');
    d.textContent=txt;
    screen.appendChild(d);
    trim();
  }

  let si=0,ci=0,phase='typing',timer=null,cmdLine=null,cursor=null;

  function stop(){clearTimeout(timer);screen.classList.add('sh01-paused');}
  function play(){stop();if(!document.hidden){screen.classList.remove('sh01-paused');runPhase();}}

  function runPhase(){
    if(document.hidden)return;
    const s=sessions[si%sessions.length];
    if(phase==='typing'){
      if(ci===0){
        cmdLine=document.createElement('div');
        cmdLine.className='sh01-line';
        const p=document.createElement('span');p.className='sh01-prompt';p.textContent=HOST;
        cmdLine.appendChild(p);
        cursor=document.createElement('span');cursor.className='sh01-cursor';
        cmdLine.appendChild(cursor);
        screen.appendChild(cmdLine);
        trim();
      }
      if(ci<s.cmd.length){
        const t=document.createElement('span');t.className='sh01-cmd';t.textContent=s.cmd[ci];
        cmdLine.insertBefore(t,cursor);
        ci++;trim();
        timer=setTimeout(runPhase,reduce?0:60+Math.random()*40);
      } else {
        phase='output';ci=0;
        timer=setTimeout(runPhase,300);
      }
    } else if(phase==='output'){
      if(ci<s.out.length){
        addLine(s.out[ci],'sh01-out');
        ci++;timer=setTimeout(runPhase,120);
      } else {
        phase='pause';ci=0;
        timer=setTimeout(()=>{
          addLine('','');
          si++;phase='typing';ci=0;runPhase();
        },1400);
      }
    }
  }

  document.addEventListener('visibilitychange',()=>document.hidden?stop():play());
  play();
})();</script>
</body></html>
