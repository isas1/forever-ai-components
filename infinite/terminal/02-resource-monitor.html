<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="description" content="Resource Monitor — Terminal. A self-contained, zero-dependency animated web component."><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resource Monitor</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0a0a0a;color:#ffa500;font:clamp(11px,2.3vmin,13px)/1.45 ui-monospace,Menlo,"Courier New",monospace}
.rm02-wrap{padding:8px 10px 24px;height:100%;overflow:hidden}
.rm02-header{color:#ffcc44;margin-bottom:4px;border-bottom:1px solid #2a1f00;padding-bottom:4px}
.rm02-row{display:flex;align-items:baseline;gap:4px;margin-bottom:2px}
.rm02-label{color:#ff8800;min-width:44px;flex-shrink:0}
.rm02-bar{flex:1;min-width:0;overflow:hidden;color:#ffa500;letter-spacing:0}
.rm02-pct{min-width:32px;text-align:right;flex-shrink:0;color:#ffcc44}
.rm02-hi{color:#ff4444}
.rm02-med{color:#ffaa00}
.rm02-lo{color:#44cc44}
.rm02-section{color:#b68b56;margin-top:4px;margin-bottom:2px;font-size:11px}
.rm02-sep{border:none;border-top:1px solid #1a1000;margin:3px 0}
.rm02-cap{position:fixed;left:8px;bottom:7px;font:600 10px ui-monospace,monospace;color:#ffa500;opacity:.35;letter-spacing:.5px;pointer-events:none;z-index:99}
</style><script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/terminal/02-resource-monitor.html",
 "title": "Resource Monitor",
 "description": "Retro BBS-style system monitor showing 6 CPU core bars and 3 memory rows with ASCII block characters; values drift randomly every 420ms.",
 "useWhen": "Terminal/hacker aesthetic dashboards, loading screens, or ambient system-status displays in dark-mode UIs.",
 "avoidWhen": "Light-background layouts (foreground and background are hardcoded dark orange-on-black). Do not use where real system data is expected.",
 "agentPrompt": "Change CPU core count to 8 by adding two more entries to the cores array, and slow the update interval from 420 to 800ms.",
 "editableAreas": [
  "core count and labels (cores array)",
  "memory row labels and starting values (mems array)",
  "bar width (BARS=10)",
  "update interval (420ms)",
  "color thresholds (cls function: 75/50 cutoffs)"
 ],
 "preserveElements": [
  "visibilitychange stop/play guard",
  "prefers-reduced-motion early return in play()",
  "IIFE wrapper"
 ],
 "knownLimitations": [
  "Values are simulated random drift — not wired to real system APIs",
  "Background and text colors hardcoded; requires manual edit to change palette",
  "DOM rebuild on every tick (innerHTML reset) — acceptable at low frequency but not scalable to high-frequency updates"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "accessible",
  "copy-paste-safe",
  "minimal-deps"
 ],
 "tags": [
  "terminal",
  "monitor",
  "retro",
  "data-display",
  "ascii",
  "bbs",
  "dashboard"
 ]
}
</script>
</head><body>
<div class="rm02-wrap" role="img" aria-label="Simulated system monitor: six CPU cores, memory, swap and buffer usage.">
  <div class="rm02-header">&#x25a0; SYSTEM MONITOR</div>
  <div class="rm02-section">CPU · 6 cores</div>
  <div id="rm02-cores"></div>
  <hr class="rm02-sep">
  <div class="rm02-section">MEMORY</div>
  <div id="rm02-mem"></div>
</div>
<div class="rm02-cap" aria-hidden="true">resource monitor</div>
<script>(()=>{
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const coresEl=document.getElementById('rm02-cores');
  const memEl=document.getElementById('rm02-mem');
  const compact=()=>document.documentElement.clientHeight<320;
  const bars=()=>document.documentElement.clientWidth<300?6:10;

  const cores=[
    {label:'CPU0',val:42,drift:0},
    {label:'CPU1',val:78,drift:0},
    {label:'CPU2',val:23,drift:0},
    {label:'CPU3',val:61,drift:0},
    {label:'CPU4',val:55,drift:0},
    {label:'CPU5',val:33,drift:0},
  ];
  const mems=[
    {label:'MEM ',val:67,max:100,unit:'%'},
    {label:'SWAP',val:12,max:100,unit:'%'},
    {label:'BUF ',val:28,max:100,unit:'%'},
  ];

  function bar(pct){
    const BARS=bars(),filled=Math.round(pct/100*BARS);
    return '['+'█'.repeat(filled)+'░'.repeat(BARS-filled)+']';
  }
  function cls(pct){return pct>75?'rm02-hi':pct>50?'rm02-med':'rm02-lo';}

  function buildRows(container,items){
    container.innerHTML='';
    items.forEach((item,i)=>{
      const row=document.createElement('div');row.className='rm02-row';
      const lbl=document.createElement('span');lbl.className='rm02-label';lbl.textContent=item.label;
      const b=document.createElement('span');b.className='rm02-bar '+cls(item.val);b.textContent=bar(item.val);
      const p=document.createElement('span');p.className='rm02-pct '+cls(item.val);p.textContent=item.val+'%';
      row.appendChild(lbl);row.appendChild(b);row.appendChild(p);
      container.appendChild(row);
    });
  }

  function drift(v){
    const d=(Math.random()-0.48)*8;
    return Math.min(99,Math.max(1,Math.round(v+d)));
  }

  let timer=null;
  function stop(){clearInterval(timer);}
  function render(){
    const peak=cores.reduce((a,b)=>a.val>b.val?a:b);
    const visible=compact()?[{label:'CPU avg',val:Math.round(cores.reduce((n,c)=>n+c.val,0)/cores.length)},peak]:cores;
    buildRows(coresEl,visible);buildRows(memEl,mems);
  }
  addEventListener('resize',render);
  function play(){
    stop();render();
    if(reduce)return;
    timer=setInterval(()=>{
      cores.forEach(c=>c.val=drift(c.val));
      mems.forEach(m=>m.val=drift(m.val));
      render();
    },420);
  }

  document.addEventListener('visibilitychange',()=>document.hidden?stop():play());
  play();
})();</script>
</body></html>
