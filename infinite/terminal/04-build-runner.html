<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="description" content="Build Runner — Terminal. A self-contained, zero-dependency animated web component."><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Build Runner</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0d0f0a;color:#00ff41;font:clamp(11px,2.3vmin,13px)/1.6 ui-monospace,Menlo,"Courier New",monospace}
.bld04-wrap{padding:10px 10px 24px;height:100%;overflow:hidden;display:flex;flex-direction:column}
.bld04-line{flex-shrink:0;white-space:pre-wrap;overflow-wrap:anywhere}
.bld04-dim{color:#829c82}
.bld04-ok{color:#4ade80}
.bld04-warn{color:#ffa500}
.bld04-err{color:#ff5555}
.bld04-hi{color:#e2e8f0}
.bld04-cursor{display:inline-block;width:8px;height:.85em;background:#00ff41;animation:bld04-blink 1s step-start infinite;vertical-align:middle}
@keyframes bld04-blink{0%,100%{opacity:1}50%{opacity:0}}
.bld04-cap{position:fixed;left:8px;bottom:7px;font:600 10px ui-monospace,monospace;color:#00ff41;opacity:.35;letter-spacing:.5px;pointer-events:none;z-index:99}
.bld04-paused .bld04-cursor{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){.bld04-cursor{animation:none}}
</style><script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/terminal/04-build-runner.html",
 "title": "Build Runner",
 "description": "Simulates npm install + build pipeline in a scrolling terminal; packages, lint/compile steps, and file-change events stream in sequence and loop endlessly.",
 "useWhen": "Developer-tool landing pages, loading screens for build/deploy dashboards, or any context needing a credible \"code is running\" ambient backdrop.",
 "avoidWhen": "Non-technical audiences (output is meaningless without dev context). Light-background UIs — background is hardcoded dark (#0d0f0a).",
 "agentPrompt": "Edit the OUTPUT array of [text,class] lines, the compact reduced-motion frame, setInterval(tick,440) and hold=3. This is a local demonstration, not a real build.",
 "editableAreas": [
  "build output (OUTPUT array of [text,class])",
  "line interval (440ms) and completion hold (3 ticks)",
  "compact reduced-motion frame below320px",
  "terminal palette (.bld04-* classes)"
 ],
 "preserveElements": [
  "IIFE wrapper",
  "visibilitychange stop/play guard",
  "prefers-reduced-motion representative completed build",
  "whole newest-row trimming after line insertion and resize",
  "pre-rolled prompt and autonomous tick loop"
 ],
 "knownLimitations": [
  "Invented output only; no package install, command or real build runs",
  "Dark terminal palette; no light-mode claim",
  "Local passive demo; no exposed pause button"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "accessible",
  "copy-paste-safe",
  "minimal-deps"
 ],
 "tags": [
  "terminal",
  "build",
  "typewriter",
  "loop",
  "developer",
  "cli",
  "text-animation"
 ]
}
</script>
</head><body>
<div class="bld04-wrap" id="bld04-wrap" role="img" aria-label="Terminal running npm install and npm run build: packages resolve and install, then lint, compile and bundle steps stream in and finish successfully before the watcher picks up a file change."></div>
<div class="bld04-cap" aria-hidden="true">build runner</div>
<script>(()=>{
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const wrap=document.getElementById('bld04-wrap');
  if(!wrap)return;
  const D='bld04-dim',K='bld04-ok',H='bld04-hi',W='bld04-warn';
  // one entry = one emitted line: [text, class]. resolve -> fetch -> install -> build -> watch
  const OUTPUT=[
    ['$ npm install',H],['',''],
    ['  resolving packages ...',D],
    ['  fetched 127 manifests in 640ms',D],
    ['  added chalk@5.3.0',D],
    ['  added dotenv@16.4.5',D],
    ['  added express@4.18.2',D],
    ['  added nodemon@3.1.0',D],
    ['  added ws@8.17.0',D],['',''],
    ['  added 127 packages in 2.4s',K],['',''],
    ['$ npm run build',H],['',''],
    ['  [1/3] linting ...',D],
    ['  [1/3] lint OK \u2014 0 errors (312ms)',K],
    ['  [2/3] compiling src/index.ts ...',D],
    ['  [2/3] compiled 42 modules (1.1s)',K],
    ['  [3/3] bundling ...',D],
    ['  [3/3] bundle 84.2 kB \u2192 dist/app.js',K],['',''],
    ['  \u2713 Compiled successfully in 1.8s',K],['',''],
    ['  watching for file changes...',D],
    ['  change detected: src/server.ts',W]
  ];
  const caret=document.createElement('span');caret.className='bld04-cursor';

  function trim(){while(wrap.children.length>1&&wrap.scrollHeight>wrap.clientHeight)wrap.firstChild.remove();}
  function fit(){trim();}
  function line(txt,cls){
    const d=document.createElement('div');
    d.className='bld04-line'+(cls?' '+cls:'');
    d.textContent=txt;
    wrap.appendChild(d);trim();
    return d;
  }

  let i=0,hold=0,running=true;
  function tick(){                      // one visible line per tick; blanks ride along with the next
    if(!running)return;
    if(hold){hold--;return;}
    if(i>=OUTPUT.length){wrap.textContent='';i=0;}
    let last;
    do{last=line(OUTPUT[i][0],OUTPUT[i][1]);i++;}while(i<OUTPUT.length&&OUTPUT[i-1][0]==='');
    last.appendChild(caret);trim();
    if(i>=OUTPUT.length)hold=3;         // hold the finished build ~1.3s, then rerun
  }

  fit();
  addEventListener('resize',fit);
  if(reduce){                           // static representative frame: a finished, successful build
    const frame=wrap.clientHeight<320?[['$ npm run build',H],['✓ lint · 0 errors',K],['✓ 42 modules',K],['✓ bundle 84.2 kB',K],['✓ built in 1.8s',K],['watching src/',D]]:OUTPUT;
    frame.forEach(s=>line(s[0],s[1]));
    return;
  }
  tick();tick();                        // pre-roll so the prompt is up before the first tick
  let timer;
  function stop(){running=false;clearInterval(timer);wrap.classList.add('bld04-paused');}
  function play(){stop();if(document.hidden)return;running=true;wrap.classList.remove('bld04-paused');timer=setInterval(tick,440);}
  document.addEventListener('visibilitychange',()=>document.hidden?stop():play());
  play();
})();</script>
</body></html>
