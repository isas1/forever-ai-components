<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="description" content="Build Runner — Terminal. A self-contained, zero-dependency animated web component."><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Build Runner</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0d0f0a;color:#00ff41;font:13px/1.7 ui-monospace,Menlo,"Courier New",monospace}
.trm-wrap{padding:12px 14px;height:100%;overflow:hidden;display:flex;flex-direction:column}
.trm-line{white-space:pre}
.trm-dim{color:#2a5a2a}
.trm-ok{color:#4ade80}
.trm-warn{color:#ffa500}
.trm-err{color:#ff5555}
.trm-hi{color:#e2e8f0}
.trm-cursor{display:inline-block;width:8px;height:.85em;background:#00ff41;animation:trm-blink 1s step-start infinite;vertical-align:middle}
@keyframes trm-blink{0%,100%{opacity:1}50%{opacity:0}}
.trm-cap{position:fixed;left:8px;bottom:7px;font:600 10px ui-monospace,monospace;color:#00ff41;opacity:.35;letter-spacing:.5px;pointer-events:none;z-index:99}
</style><script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/terminal/04-build-runner.html",
 "title": "Build Runner",
 "description": "Simulates npm install + build pipeline in a scrolling terminal; packages, lint/compile steps, and file-change events stream in sequence and loop endlessly.",
 "useWhen": "Developer-tool landing pages, loading screens for build/deploy dashboards, or any context needing a credible \"code is running\" ambient backdrop.",
 "avoidWhen": "Non-technical audiences (output is meaningless without dev context). Light-background UIs — background is hardcoded dark (#0d0f0a).",
 "agentPrompt": "Change the package list in the pkgs array to your project's dependencies, update the bundle output line, and slow each step interval to 350ms.",
 "editableAreas": [
  "package list (pkgs array)",
  "build step messages (steps array)",
  "per-phase interval timings (120/180/280ms)",
  "MAX visible lines (MAX=16)",
  "terminal accent color (#00ff41)",
  "line cadence (setInterval(tick, 440 ms); rerun after a ~1.3 s hold)"
 ],
 "preserveElements": [
  "visibilitychange stop/play guard",
  "prefers-reduced-motion instant-render path",
  "IIFE wrapper",
  "while(running) loop with running flag",
  "pre-rolled prompt + tick loop (paused on visibilitychange)"
 ],
 "knownLimitations": [
  "Cursor CSS class defined but never injected into DOM during streaming",
  "Background hardcoded dark — must edit CSS to change terminal look",
  "Loops forever with no pause control exposed to the user"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "accessible",
  "copy-paste-safe",
  "minimal-deps"
 ],
 "tags": [
  "terminal",
  "build",
  "typewriter",
  "loop",
  "developer",
  "cli",
  "text-animation"
 ]
}
</script>
</head><body>
<div class="trm-wrap" id="trm-wrap" role="img" aria-label="Terminal running npm install and npm run build: packages resolve and install, then lint, compile and bundle steps stream in and finish successfully before the watcher picks up a file change."></div>
<div class="trm-cap" aria-hidden="true">build runner</div>
<script>(()=>{
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const wrap=document.getElementById('trm-wrap');
  if(!wrap)return;
  const D='trm-dim',K='trm-ok',H='trm-hi',W='trm-warn';
  // one entry = one emitted line: [text, class]. resolve -> fetch -> install -> build -> watch
  const SCRIPT=[
    ['$ npm install',H],['',''],
    ['  resolving packages ...',D],
    ['  fetched 127 manifests in 640ms',D],
    ['  added chalk@5.3.0',D],
    ['  added dotenv@16.4.5',D],
    ['  added express@4.18.2',D],
    ['  added nodemon@3.1.0',D],
    ['  added ws@8.17.0',D],['',''],
    ['  added 127 packages in 2.4s',K],['',''],
    ['$ npm run build',H],['',''],
    ['  [1/3] linting ...',D],
    ['  [1/3] lint OK \u2014 0 errors (312ms)',K],
    ['  [2/3] compiling src/index.ts ...',D],
    ['  [2/3] compiled 42 modules (1.1s)',K],
    ['  [3/3] bundling ...',D],
    ['  [3/3] bundle 84.2 kB \u2192 dist/app.js',K],['',''],
    ['  \u2713 Compiled successfully in 1.8s',K],['',''],
    ['  watching for file changes...',D],
    ['  change detected: src/server.ts',W]
  ];
  const caret=document.createElement('span');caret.className='trm-cursor';

  let LH=22,MAX=10;
  function fit(){                       // keep the newest line on screen: cap rows to what fits
    LH=parseFloat(getComputedStyle(wrap).lineHeight)||22;
    MAX=Math.max(4,Math.floor((wrap.clientHeight-24)/LH));
    trim();
  }
  function trim(){while(wrap.children.length>MAX)wrap.removeChild(wrap.firstChild);}
  function line(txt,cls){
    const d=document.createElement('div');
    d.className='trm-line'+(cls?' '+cls:'');
    d.textContent=txt;
    wrap.appendChild(d);trim();
    return d;
  }

  let i=0,hold=0,running=true;
  function tick(){                      // one visible line per tick; blanks ride along with the next
    if(!running)return;
    if(hold){hold--;return;}
    if(i>=SCRIPT.length){wrap.textContent='';i=0;}
    let last;
    do{last=line(SCRIPT[i][0],SCRIPT[i][1]);i++;}while(i<SCRIPT.length&&SCRIPT[i-1][0]==='');
    last.appendChild(caret);
    if(i>=SCRIPT.length)hold=3;         // hold the finished build ~1.3s, then rerun
  }

  fit();
  addEventListener('resize',fit);
  if(reduce){                           // static representative frame: a finished, successful build
    SCRIPT.forEach(s=>line(s[0],s[1]));
    return;
  }
  tick();tick();                        // pre-roll so the prompt is up before the first tick
  document.addEventListener('visibilitychange',()=>{running=!document.hidden;});
  setInterval(tick,440);
})();</script>
</body></html>
