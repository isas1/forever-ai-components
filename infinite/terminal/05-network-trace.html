<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="description" content="Network Trace — Terminal. A self-contained, zero-dependency animated web component."><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Network Trace</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0d1117;font:clamp(11px,2.3vmin,12px)/1.5 ui-monospace,Menlo,"Courier New",monospace}
.nt05-wrap{padding:8px 10px 24px;height:100%;display:flex;flex-direction:column;overflow:hidden}
.nt05-header{color:#e2e8f0;margin-bottom:4px;border-bottom:1px solid #1e2a1e;padding-bottom:4px;flex-shrink:0}
.nt05-cmd{color:#4ade80;margin-bottom:4px;flex-shrink:0}
.nt05-table{flex:1;min-height:0;overflow:hidden}
.nt05-row{display:grid;grid-template-columns:26px 106px minmax(0,1fr) 44px;gap:4px;white-space:nowrap;line-height:1.7}
.nt05-row.nt05-hdr{color:#93a593;border-bottom:1px solid #1a2a1a;margin-bottom:2px}
.nt05-hop{color:#81a4bd}.nt05-ip{color:#e2e8f0}
.nt05-host{color:#93b3a6;overflow:hidden;text-overflow:ellipsis}
.nt05-ms-ok{color:#4ade80}.nt05-ms-med{color:#ffa500}.nt05-ms-hi{color:#ff5555}.nt05-ms-to{color:#929292}
.nt05-footer{color:#93a593;margin-top:4px;flex-shrink:0}
.nt05-cap{position:fixed;left:8px;bottom:7px;font:600 10px ui-monospace,monospace;color:#4ade80;opacity:.35;letter-spacing:.5px;pointer-events:none;z-index:99}
@media(max-width:380px){.nt05-row{grid-template-columns:20px minmax(0,1fr) 36px;gap:3px;line-height:1.6}.nt05-host,.nt05-hosthead{display:none}}
</style><script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/terminal/05-network-trace.html",
 "title": "Network Trace",
 "description": "Simulates a live traceroute — hops appear one by one with color-coded latency (green/orange/red); ms values fluctuate after trace completes, then loop.",
 "useWhen": "Terminal-aesthetic dashboards, network/devops themed hero sections, or ambient tech backgrounds.",
 "avoidWhen": "Contexts requiring real network data — all hops are hardcoded fiction. Not suitable as an actual diagnostic tool.",
 "agentPrompt": "Change the target to '1.1.1.1' (update nt05-cmd text and hops array IPs), add a 4th column with packet loss %, set interval between hops to 400ms.",
 "editableAreas": [
  "hops array (IPs, hostnames, base latency)",
  "hop reveal interval (600ms in setInterval)",
  "ms update interval (500ms in updateTimer)",
  "latency thresholds in msClass (20ms/60ms)",
  "loop restart delay (4000ms in setTimeout)"
 ],
 "preserveElements": [
  "visibilitychange stop/play guard",
  "IIFE wrapper",
  "reduce (prefers-reduced-motion) instant-render path"
 ],
 "knownLimitations": [
  "All network data is fictional — misleading if users expect real diagnostics",
  "Grid column widths hardcoded; long hostnames truncate silently"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps"
 ],
 "tags": [
  "terminal",
  "network",
  "traceroute",
  "table",
  "loop",
  "monospace",
  "hacker"
 ]
}
</script>
</head><body>
<div class="nt05-wrap" role="img" aria-label="Simulated traceroute showing hop addresses and latency; compact frames retain the gateway and newest hops.">
  <div class="nt05-header">&#x25b6; NETWORK TRACE</div>
  <div class="nt05-cmd" id="nt05-cmd">traceroute 8.8.8.8</div>
  <div class="nt05-table">
    <div class="nt05-row nt05-hdr"><span>hop</span><span>address</span><span class="nt05-hosthead">hostname</span><span>ms</span></div>
    <div id="nt05-rows"></div>
  </div>
  <div class="nt05-footer" id="nt05-footer"></div>
</div>
<div class="nt05-cap" aria-hidden="true">network trace</div>
<script>(()=>{
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const rowsEl=document.getElementById('nt05-rows');
  const footer=document.getElementById('nt05-footer');

  const hops=[
    {ip:'192.168.1.1',  host:'gateway.local',          base:1},
    {ip:'10.10.0.1',    host:'isp-edge.net',            base:8},
    {ip:'72.14.209.1',  host:'be3.cr2.chi2.google.com', base:12},
    {ip:'108.170.246.1',host:'ae0.cr4.ord2.google.com', base:14},
    {ip:'',             host:'',                        base:0,  timeout:true},
    {ip:'142.250.69.14',host:'lga25s77-in-f14.1e100.net',base:18},
    {ip:'8.8.8.8',      host:'dns.google',              base:19},
  ];

  let state=[],hi=0,timer=null,hold=0;
  function msClass(ms){return ms===null?'nt05-ms-to':ms<20?'nt05-ms-ok':ms<60?'nt05-ms-med':'nt05-ms-hi';}
  function fmtMs(ms){return ms===null?'* * *':ms+'ms';}
  function randMs(base){return base+Math.round((Math.random()-.4)*base*.4+Math.random()*3);}
  function render(){
    footer.textContent=state.length===hops.length?hops.length+' hops · '+state.at(-1).ms+'ms':state.length+'/'+hops.length+' hops';
    const table=rowsEl.parentElement,hdr=table.firstElementChild;
    const rowHeight=parseFloat(getComputedStyle(hdr).lineHeight);
    const capacity=Math.max(1,Math.floor((table.clientHeight-hdr.offsetHeight-3)/rowHeight));
    const visible=state.length<=capacity?state:capacity===1?[state.at(-1)]:[state[0],...state.slice(-(capacity-1))];
    rowsEl.replaceChildren();
    visible.forEach(r=>{
      const row=document.createElement('div');row.className='nt05-row';
      const cells=[[String(r.hop).padStart(2,' '),'nt05-hop'],[r.timeout?'*':r.ip,'nt05-ip'],[r.timeout?'* * *':r.host,'nt05-host'],[fmtMs(r.timeout?null:r.ms),msClass(r.timeout?null:r.ms)]];
      cells.forEach(([text,cls])=>{const el=document.createElement('span');el.className=cls;el.textContent=text;row.appendChild(el);});
      rowsEl.appendChild(row);
    });
  }
  function addNextHop(){
    const h=hops[hi];state.push({hop:++hi,ip:h.ip,host:h.host,ms:randMs(h.base),timeout:!!h.timeout});
  }
  function reset(){state=[];hi=0;hold=0;addNextHop();addNextHop();render();}
  function tick(){
    if(document.hidden)return;
    if(hi<hops.length)addNextHop();
    else{
      state.forEach(r=>{if(!r.timeout)r.ms=randMs(hops[r.hop-1].base);});
      if(++hold>8){reset();return;}
    }
    render();
  }
  function stop(){clearInterval(timer);}
  function play(){stop();if(!document.hidden&&!reduce)timer=setInterval(tick,600);}
  reset();
  if(reduce){while(hi<hops.length)addNextHop();render();}
  addEventListener('resize',render);
  document.addEventListener('visibilitychange',()=>document.hidden?stop():play());
  play();
})();</script>
</body></html>
