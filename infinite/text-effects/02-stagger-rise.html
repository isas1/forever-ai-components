<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="description" content="Serif gold headline whose letters rise into view one by one from a clipped baseline, hold, then exit upward in a graceful staggered loop.">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Stagger Rise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
/* theme tokens — dark values are the defaults (solid-dark-bg contract);
   the light re-theme is the [data-theme="light"] block */
:root{
  --tte02-bg:#0a0b10; --tte02-acc:#f5d76e; --tte02-cap-o:.4;
}
:root[data-theme="light"]{
  --tte02-bg:#f2f4f8; --tte02-acc:#866a09; --tte02-cap-o:.5;
}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--tte02-bg);display:grid;place-items:center}
.tte02-stage{display:flex;gap:.04em;align-items:flex-end;
  font-family:"Fraunces",Georgia,serif;font-weight:600;
  font-size:clamp(34px,17vmin,116px);line-height:1;color:var(--tte02-acc);
  letter-spacing:.01em;user-select:none}
.tte02-clip{position:relative;overflow:hidden;display:inline-block;
  padding:.12em 0 .04em}
.tte02-clip::after{content:"";position:absolute;left:-6%;right:-6%;bottom:0;height:2px;
  background:var(--tte02-acc);opacity:.32}
.tte02-ch{display:inline-block;will-change:transform,opacity;
  transform:translateY(115%);opacity:0;
  animation:tte02-rise 4.6s infinite both;
  animation-delay:calc(var(--i)*.085s)}
.tte02-sp{width:.32em}
@keyframes tte02-rise{
  0%      {transform:translateY(115%);opacity:0}
  14%     {transform:translateY(0);opacity:1}      /* settle on a confident overshoot-free cubic */
  62%     {transform:translateY(0);opacity:1}      /* hold the word, legible */
  82%,100%{transform:translateY(-118%);opacity:0}  /* graceful upward exit */
}
.tte02-ch{animation-timing-function:cubic-bezier(.22,1,.36,1)}
@media (prefers-reduced-motion:reduce){
  .tte02-ch{animation:none!important;transform:translateY(0)!important;opacity:1!important}
}
.cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;
  color:var(--tte02-acc);opacity:var(--tte02-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
</style><script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/text-effects/02-stagger-rise.html",
 "title": "Stagger Rise",
 "description": "Gold serif letters rise through a clipped baseline one by one, hold as a word, then exit upward in a staggered loop.",
 "useWhen": "Hero headlines, loading screens, or ambient brand displays needing elegant looping text reveal on dark backgrounds.",
 "avoidWhen": "Light backgrounds (dark navy is hardcoded). Strings over ~12 characters where stagger delay makes last letters slow to appear.",
 "agentPrompt": "Change the word to 'LUXE' by setting word=\"LUXE\", update color from #f5d76e to #e8c4ff, and slow stagger delay from .085s to .12s per letter. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "word content (word variable)",
  "letter color (#f5d76e)",
  "stagger delay per letter (0.085s multiplier)",
  "animation cycle duration (4.6s)",
  "baseline underline opacity (0.32)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "tte02-clip overflow:hidden wrapper (creates the reveal mask)",
  "IIFE wrapper",
  "prefers-reduced-motion guard",
  "visibilitychange pause",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "Background color hardcoded in CSS — must edit to use on non-dark backgrounds",
  "Google Fonts (Fraunces) required — falls back to Georgia if offline but weight may differ"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "typography",
  "stagger",
  "text-animation",
  "loop",
  "serif",
  "reveal",
  "clip"
 ]
}
</script>
</head><body>
<div class="tte02-stage" id="tte02-c" role="img" aria-label="Stagger Rise"></div>
<div class="cap">Stagger Rise</div>
<script>(function(){
  var root=document.getElementById('tte02-c');
  var word="Stagger Rise";
  var idx=0;
  for(var k=0;k<word.length;k++){
    var c=word[k];
    if(c===' '){
      var sp=document.createElement('span');
      sp.className='tte02-sp';
      root.appendChild(sp);
      continue;
    }
    var clip=document.createElement('span');
    clip.className='tte02-clip';
    var ch=document.createElement('span');
    ch.className='tte02-ch';
    ch.style.setProperty('--i',idx++);
    ch.textContent=c;
    clip.appendChild(ch);
    root.appendChild(clip);
  }
  function vis(){
    var s=document.hidden?'paused':'running';
    var nodes=root.querySelectorAll('.tte02-ch');
    for(var i=0;i<nodes.length;i++){nodes[i].style.animationPlayState=s;}
  }
  document.addEventListener('visibilitychange',vis);
  vis();
  // live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
  addEventListener('message',function(e){
    var d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
      document.documentElement.setAttribute('data-theme',d.theme);
    }
  });
})();</script>
</body></html>
