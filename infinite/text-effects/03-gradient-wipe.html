<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="description" content="Bold sans headline rendered as dim steel with a bright gold metallic sheen band that sweeps across the glyphs, blooming as it crosses center">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Gradient Wipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
/* theme tokens — dark values are the defaults (solid-dark-bg contract);
   the light re-theme is the [data-theme="light"] block */
:root{
  --tte03-bg:#0a0b10; --tte03-stage-a:#13141d;
  --tte03-steel-dim:#2c2f3d; --tte03-steel-mid:#4a4e60;
  --tte03-sheen:#f5d76e; --tte03-sheen-hi:#fff6d6; --tte03-cap:#f5d76e; --tte03-cap-o:.42;
}
:root[data-theme="light"]{
  --tte03-bg:#f2f4f8; --tte03-stage-a:#ffffff;
  --tte03-steel-dim:#2c2f3d; --tte03-steel-mid:#4a4e60;
  --tte03-sheen:#ac880c; --tte03-sheen-hi:#c9a247; --tte03-cap:#866a09; --tte03-cap-o:.5;
}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--tte03-bg);display:grid;place-items:center}
.tte03-stage{
  position:relative;width:100%;height:100%;display:grid;place-items:center;
  background:radial-gradient(120% 90% at 50% 38%,var(--tte03-stage-a) 0%,var(--tte03-bg) 70%);
}
/* The headline. background-clip:text reveals the moving gradient through the glyphs. */
.tte03-word{
  margin:0;padding:0 6vmin;text-align:center;line-height:.92;
  font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;
  font-size:clamp(34px,17vmin,150px);letter-spacing:-.02em;
  /* base metal: cool dim steel so the sheen reads as a highlight, not the whole word */
  background:
    linear-gradient(110deg,
      var(--tte03-steel-dim) 0%, var(--tte03-steel-mid) 22%, var(--tte03-steel-dim) 44%,
      /* bright sheen band */
      var(--tte03-sheen) 49%, var(--tte03-sheen-hi) 50%, var(--tte03-sheen) 51%,
      var(--tte03-steel-dim) 56%, var(--tte03-steel-mid) 78%, var(--tte03-steel-dim) 100%);
  background-size:280% 100%;
  background-position:130% 0;
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
  animation:tte03-wipe 3.6s cubic-bezier(.5,0,.18,1) infinite;
  will-change:background-position;
}
/* soft golden bloom underneath, pulses with the wipe arrival */
.tte03-word::after{
  content:attr(data-w);position:absolute;inset:0;display:grid;place-items:center;
  padding:0 6vmin;line-height:.92;letter-spacing:-.02em;
  font-family:inherit;font-weight:inherit;font-size:inherit;
  color:var(--tte03-sheen);filter:blur(14px);opacity:0;z-index:-1;
  animation:tte03-bloom 3.6s cubic-bezier(.5,0,.18,1) infinite;
}
.tte03-wrap{position:relative;display:inline-grid}
@keyframes tte03-wipe{
  0%   {background-position:130% 0}
  /* hold dim before the light arrives — anticipation */
  18%  {background-position:118% 0}
  100% {background-position:-30% 0}
}
@keyframes tte03-bloom{
  0%,30%,100%{opacity:0}
  /* bloom peaks as the sheen crosses the word's centre */
  55%{opacity:.5}
  80%{opacity:0}
}
.cap{position:fixed;left:8px;bottom:7px;font:600 10px/1 ui-monospace,Menlo,monospace;
  color:var(--tte03-cap);opacity:var(--tte03-cap-o);letter-spacing:.08em;text-transform:uppercase;user-select:none}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important}
  /* settle on a legible frame: sheen parked over the word centre, no bloom */
  .tte03-word{background-position:50% 0;animation:none}
  .tte03-word::after{animation:none;opacity:0}
}
</style><script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/text-effects/03-gradient-wipe.html",
 "title": "Gradient Wipe",
 "description": "Bold headline in dim steel; a bright gold sheen band sweeps across via background-clip:text with a soft bloom glow pulsing beneath at center crossing.",
 "useWhen": "Dark-mode hero titles, product names, or brand wordmarks needing a premium metallic reveal loop.",
 "avoidWhen": "Light backgrounds (hardcoded dark body). Multi-word strings longer than ~10 chars where the sheen band looks thin.",
 "agentPrompt": "Change the word from 'METALLIC' to 'CHROME', shift sheen color from gold (#f5d76e) to silver (#e8eaf0), and slow the cycle to 5s. Theme: dark tokens live in :root, the light variant in :root[data-theme=\"light\"]; ?theme=light or a {type:'forever:theme'} postMessage switches at runtime.",
 "editableAreas": [
  "word content (data-w attribute + h1 text)",
  "sheen band color (#f5d76e / #fff6d6)",
  "animation duration (3.6s)",
  "background-size:280% controls band width",
  "bloom opacity peak (0.5 at 55%)",
  "theme tokens (:root dark defaults + [data-theme=light] overrides)"
 ],
 "preserveElements": [
  "background-clip:text / -webkit-text-fill-color:transparent pair",
  "::after bloom uses data-w attr for matching text",
  "visibilitychange pause guard",
  "prefers-reduced-motion settled static frame",
  "theme hook (?theme= bootstrap + forever:theme message listener + theme tokens)"
 ],
 "knownLimitations": [
  "background-clip:text unsupported in some older browsers — text falls invisible without the -webkit- prefix",
  "Light re-theme via the [data-theme=light] token block; catalog bg/accent describe the dark default"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "typography",
  "gradient",
  "metallic",
  "text-animation",
  "background-clip",
  "loop",
  "sheen"
 ]
}
</script>
</head><body>
<div class="tte03-stage" role="img" aria-label="Gradient sheen wiping across the word METALLIC">
  <span class="tte03-wrap">
    <h1 class="tte03-word" id="tte03-w" data-w="METALLIC">METALLIC</h1>
  </span>
</div>
<div class="cap">Gradient Wipe</div>
<script>(function(){
  var word=document.getElementById('tte03-w');
  function vis(){
    // pausing the host element pauses its ::after pseudo-animation too
    word.style.animationPlayState=document.hidden?'paused':'running';
  }
  document.addEventListener('visibilitychange',vis);vis();
  // live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
  addEventListener('message',function(e){
    var d=e.data;
    if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark')){
      document.documentElement.setAttribute('data-theme',d.theme);
    }
  });
})();</script>
</body></html>
