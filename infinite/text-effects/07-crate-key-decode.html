<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Crate Key Decode — masked API key box with left-to-right cipher scramble reveal, copy feedback, and key regeneration.">
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crate Key Decode</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
:root{--b:#131316;--i:#F1F1F4;--m:#9A9CA6;--l:#2B2C31;--c:#7B95C4;--sp:cubic-bezier(.3,1.45,.5,1);color-scheme:dark}
:root[data-theme="light"]{--b:#EFF0F3;--i:#000;--m:#5F616B;--l:#CDCFD8;--c:#2B4473;color-scheme:light}
html,body{margin:0;height:100%;overflow:hidden;background:var(--b);color:var(--i);font:14px/1.3 "Avenir Next",Avenir,system-ui,sans-serif}
.cr17-st,.cr17-st *{box-sizing:border-box}
.cr17-st{position:relative;width:100%;height:100%;display:grid;place-items:center;padding:clamp(6px,3vmin,20px);background:var(--b);color:var(--i)}
.cr17-st :focus-visible{outline:2px solid var(--c);outline-offset:2px}
.cr17-dc{display:grid;gap:clamp(6px,2.5vmin,10px);width:min(100%,290px)}
.cr17-lab{font-size:clamp(10px,3vmin,12px);color:var(--m)}
.cr17-box{display:flex;align-items:center;height:clamp(34px,11vmin,48px);padding:0 clamp(6px,2.5vmin,12px);border:1.5px solid var(--l);border-radius:3px;font:500 clamp(9.5px,3.2vmin,14px) ui-monospace,"SF Mono",Menlo,monospace;white-space:nowrap;overflow:hidden}
.cr17-pre{color:var(--m)}
.cr17-ch{display:inline-block;width:.6em;text-align:center;font-style:normal;transition:color .2s}
.cr17-ch.cr17-hot{color:var(--c)}
.cr17-act{display:flex;gap:6px}
.cr17-ib{position:relative;display:inline-grid;place-items:center;width:clamp(30px,9.5vmin,40px);height:clamp(30px,9.5vmin,40px);border-radius:50%;border:1.5px solid var(--l);background:none;padding:0;color:inherit;cursor:pointer;touch-action:manipulation;transition:border-color .2s,scale .15s}
.cr17-ib:hover{border-color:var(--i)}.cr17-ib:active{scale:.9}
.cr17-ic{display:block;width:clamp(14px,4.5vmin,18px);height:clamp(14px,4.5vmin,18px);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:scale .3s var(--sp),opacity .15s}
.cr17-ic2{position:absolute;inset:0;margin:auto;scale:0;opacity:0}
.cr17-sw.cr17-alt .cr17-ic1{scale:0;opacity:0}.cr17-sw.cr17-alt .cr17-ic2{scale:1;opacity:1}
.cr17-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.cr17-cap{position:absolute;left:10px;bottom:8px;font:500 11px/1 ui-monospace,monospace;color:var(--i);opacity:.45;letter-spacing:.04em;text-transform:uppercase;pointer-events:none;user-select:none}
@media (prefers-reduced-motion:reduce){.cr17-st *{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/text-effects/07-crate-key-decode.html",
 "title": "Crate Key Decode",
 "description": "Masked API token box with left-to-right cipher scramble reveal, copy confirmation checkmark, and regenerate spin.",
 "useWhen": "Developer API dashboards, webhook secrets, and token copy widgets.",
 "avoidWhen": "Long multi-line private keys.",
 "agentPrompt": "Edit --b/--i/--c/--l tokens in :root and [data-theme=\"light\"].",
 "editableAreas": [
  "theme CSS tokens (--b/--i/--c/--l), data arrays & timings"
 ],
 "preserveElements": [
  "IIFE + crNN- prefix, reduced-motion, visibilitychange, theme/demo-v1"
 ],
 "knownLimitations": [
  "Demo state resets on remount"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "themeable",
  "light-ready"
 ],
 "tags": [
  "cipher",
  "text-scramble",
  "api-key",
  "clipboard",
  "reveal",
  "crate"
 ]
}
</script>
</head>
<body>
<div class="cr17-st" id="cr17-st"></div>
<div class="cr17-cap" aria-hidden="true">Key Decode</div>
<script>(()=>{
  const s=document.getElementById('cr17-st'),RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  const anim=(el,kf,o)=>RM()?{finished:Promise.resolve()}:el.animate(kf,Object.assign({duration:500,easing:'cubic-bezier(.2,.8,.2,1)'},o));
  const G='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789',N=16,DOTS=Array(N).fill('•');
  const gen=()=>[...Array(N)].map(()=>G[Math.random()*G.length|0]);
  const I=(d,x='')=>`<svg class="cr17-ic${x?' '+x:''}" viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;
  s.innerHTML=`<div class="cr17-dc"><span class="cr17-lab" id="cr17-l">API key</span><div class="cr17-box" role="group" aria-labelledby="cr17-l"><span class="cr17-pre" aria-hidden="true">cr_live_</span><span class="cr17-v" aria-hidden="true">${'<i class="cr17-ch">•</i>'.repeat(N)}</span></div><div class="cr17-act"><button type="button" class="cr17-ib cr17-sw cr17-eye" aria-pressed="false" aria-label="Show key">${I('M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12zM12 9.5a2.5 2.5 0 100 5 2.5 2.5 0 000-5z','cr17-ic1')}${I('M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12zM4 4l16 16','cr17-ic2')}</button><button type="button" class="cr17-ib cr17-sw cr17-cp" aria-label="Copy key">${I('M9 9h10v10H9zM5 15V5h10','cr17-ic1')}${I('M5 12.5l4.5 4.5L19 7.5','cr17-ic2')}</button><button type="button" class="cr17-ib cr17-nw" aria-label="Generate new key">${I('M20 12a8 8 0 11-2.6-5.9M20 4v4.5h-4.5')}</button></div><span class="cr17-sr" role="status" data-fit-clip-ok>Hidden</span></div>`;
  const cells=[...s.querySelectorAll('.cr17-ch')],sr=s.querySelector('.cr17-sr'),eye=s.querySelector('.cr17-eye'),cp=s.querySelector('.cr17-cp'),nw=s.querySelector('.cr17-nw');
  let key=gen(),shown=false,raf=0,ct=0,timer=0,kick=0,step=0;
  const full=()=>'cr_live_'+key.join('');
  const scramble=(target,rtl)=>{cancelAnimationFrame(raf);raf=0;
    if(RM()||document.hidden){cells.forEach((c,i)=>{c.textContent=target[i];c.classList.remove('cr17-hot')});return}
    const t0=performance.now(),per=24,hold=260;
    const tick=now=>{let busy=false;cells.forEach((c,i)=>{const t=now-t0-(rtl?N-1-i:i)*per;
        if(t<0){busy=true;return}
        if(t<hold){busy=true;const f=t/48|0;if(c._f!==f){c._f=f;c.textContent=G[Math.random()*G.length|0]}c.classList.add('cr17-hot')}
        else{c._f=-1;c.textContent=target[i];c.classList.remove('cr17-hot')}});
      raf=busy&&!document.hidden?requestAnimationFrame(tick):0};
    raf=requestAnimationFrame(tick)};
  const reveal=v=>{shown=v;eye.setAttribute('aria-pressed',String(v));eye.classList.toggle('cr17-alt',v);scramble(v?key:DOTS,!v);sr.textContent=v?full():'Hidden'};
  const regen=()=>{key=gen();anim(nw.firstChild,[{transform:'rotate(0)'},{transform:'rotate(360deg)'}],{duration:500});scramble(shown?key:DOTS,false);sr.textContent=shown?full():'New key'};
  eye.onclick=()=>reveal(!shown);nw.onclick=regen;
  cp.onclick=async()=>{let ok=false;try{await navigator.clipboard.writeText(full());ok=true}catch(_){}
    if(ok){cp.classList.add('cr17-alt');clearTimeout(ct);ct=setTimeout(()=>cp.classList.remove('cr17-alt'),1400)}else shown||reveal(true)};

  let demo=!RM()&&!(window.__foreverPreview&&window.__foreverPreview.demoEnabled===false);
  const play=()=>{if(!demo||RM()||document.hidden)return;const p=step++%4;if(p===0)reveal(true);else if(p===1)regen();else if(p===2)regen();else reveal(false)};
  const stop=()=>{clearInterval(timer);clearTimeout(kick);clearTimeout(ct);cancelAnimationFrame(raf);timer=kick=ct=raf=0},start=()=>{if(!timer&&demo&&!RM())timer=setInterval(play,1250)},tk=()=>{demo=false;clearInterval(timer);clearTimeout(kick);timer=kick=0};
  window.addEventListener('forever:interactive',tk);s.addEventListener('pointerdown',tk,true);s.addEventListener('keydown',tk,true);
  document.addEventListener('visibilitychange',()=>document.hidden?stop():demo&&start());
  window.addEventListener('message',e=>{if(e.data&&e.data.type==='forever:theme'&&(e.data.theme==='light'||e.data.theme==='dark'))document.documentElement.setAttribute('data-theme',e.data.theme)});
  if(demo){kick=setTimeout(play,550);start()}
})();</script>
</body>
</html>
