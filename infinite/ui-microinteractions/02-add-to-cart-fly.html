<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta name="description" content="E-commerce Add button flings a product tile in an arc into a cart icon, bumping a count badge each time.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add to Cart</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract);
     the light re-theme is the [data-theme="light"] block */
  :root{
    --c02-bg:#0e1726; --c02-surface:#13243a; --c02-border:#2a4a66; --c02-accent:#5cc8ff;
    --c02-badge-ink:#0e1726; --c02-grad-a:#ff9d5c; --c02-grad-b:#ff5c8a; --c02-shadow:rgba(0,0,0,.35);
    --c02-cap:#fff; --c02-cap-o:.28;
  }
  :root[data-theme="light"]{
    --c02-bg:#eef3f9; --c02-surface:#ffffff; --c02-border:#c7d7e6; --c02-accent:#0073ad;
    --c02-badge-ink:#ffffff; --c02-shadow:rgba(20,40,60,.16);
    --c02-cap:#16202c; --c02-cap-o:.5;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--c02-bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  #um02-wrap{position:fixed;inset:0;display:grid;place-items:center}
  #um02-stage{position:relative;width:min(78%,240px,calc((100vh - 32px)*1.1));aspect-ratio:1.1}
  .um02-prod{position:absolute;left:6%;top:12%;width:34%;aspect-ratio:1;border-radius:14px;background:linear-gradient(135deg,var(--c02-grad-a),var(--c02-grad-b));display:grid;place-items:center;box-shadow:0 8px 20px var(--c02-shadow)}
  .um02-prod span{font-size:26px}
  .um02-cart{position:absolute;right:8%;bottom:10%;width:30%;aspect-ratio:1;display:grid;place-items:center}
  .um02-cart svg{width:90%;fill:none;stroke:var(--c02-accent);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .um02-badge{position:absolute;right:4%;bottom:34%;min-width:16px;height:16px;padding:0 3px;border-radius:9px;background:var(--c02-accent);color:var(--c02-badge-ink);font-size:12px;font-weight:700;display:grid;place-items:center;transition:transform .25s cubic-bezier(.2,1.5,.4,1)}
  .um02-badge.um02-empty{transform:scale(0)}   /* empty cart: no badge, so the first add reads */
  .um02-btn{position:absolute;left:6%;bottom:10%;font-family:inherit;font-size:12px;letter-spacing:.05em;color:var(--c02-accent);border:1px solid var(--c02-border);border-radius:8px;padding:5px 9px;background:var(--c02-surface);cursor:pointer}
  .um02-btn:focus-visible{outline:2px solid var(--c02-accent);outline-offset:3px}
  .um02-fly{position:absolute;width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,var(--c02-grad-a),var(--c02-grad-b));pointer-events:none}
  .cap{position:fixed;left:8px;bottom:7px;font-size:10px;letter-spacing:.08em;color:var(--c02-cap);opacity:var(--c02-cap-o);text-transform:uppercase}
</style>

</head>
<body>
<div id="um02-wrap">
  <div id="um02-stage">
    <div class="um02-prod" id="um02-prod"><span>🎧</span></div>
    <button type="button" class="um02-btn" id="um02-btn">Add</button>
    <div class="um02-cart" id="um02-cart"><svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.2 12h11l2-8H6"/></svg></div>
    <div class="um02-badge um02-empty" id="um02-badge">0</div>
  </div>
</div>
<div class="cap">Add to cart</div>
<script>
(()=>{
const stage=document.getElementById('um02-stage'),prod=document.getElementById('um02-prod'),cart=document.getElementById('um02-cart'),badge=document.getElementById('um02-badge'),btn=document.getElementById('um02-btn');
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;let count=0;const flights=new Set();
function fly(user=true){
  const a=prod.getBoundingClientRect(),b=cart.getBoundingClientRect(),s=stage.getBoundingClientRect();
  const x0=a.left-s.left+a.width/2-9,y0=a.top-s.top+a.height/2-9;
  const x1=b.left-s.left+b.width/2-9,y1=b.top-s.top+b.height/2-9;
  const f=document.createElement('div');f.className='um02-fly';f.style.left=x0+'px';f.style.top=y0+'px';stage.appendChild(f);
  const animation=f.animate([
    {transform:'translate(0,0) scale(1)',opacity:1},
    {transform:'translate('+(x1-x0)*.5+'px,'+((y1-y0)*.5-50)+'px) scale(.8)',opacity:1,offset:.5},
    {transform:'translate('+(x1-x0)+'px,'+(y1-y0)+'px) scale(.2)',opacity:.3}
  ],{duration:680,easing:'cubic-bezier(.5,-.2,.4,1)'});
  const flight={node:f,animation,user};flights.add(flight);
  animation.onfinish=()=>{
    if(!flights.delete(flight))return; // A canceled attract finish may already be queued.
    f.remove();const wasEmpty=badge.classList.contains('um02-empty');count++;badge.textContent=count;badge.classList.remove('um02-empty');
    badge.animate(wasEmpty?[{transform:'scale(0)'},{transform:'scale(1.6)'},{transform:'scale(1)'}]:[{transform:'scale(1.6)'},{transform:'scale(1)'}],{duration:300,easing:'cubic-bezier(.2,1.5,.4,1)'});
    cart.animate([{transform:'scale(1)'},{transform:'scale(.85)'},{transform:'scale(1)'}],{duration:260});};
  btn.animate([{transform:'scale(1)'},{transform:'scale(.9)'},{transform:'scale(1)'}],{duration:240});
}
/* Idle demo: nobody clicks a tile on the wall, so the Add button presses itself — the first add
   lands ~FIRST ms after mount, then one every DEMO_EVERY ms, through the same fly() a real click
   runs, so demo and real interaction look identical. The first deliberate input ends the autonomous demo for this mount. setInterval keeps the cadence honest. */
const TICK=100,FIRST=400,DEMO_EVERY=2800,IDLE_BACK=3600;
let demo=window.__foreverPreview?.demoEnabled!==false,t=0,idle=0,timer=0,firstRun=true;
function takeover(){if(!demo)return;demo=false;idle=0;stop();for(const flight of flights){if(!flight.user){flights.delete(flight);flight.animation.cancel();flight.node.remove();}}}
window.addEventListener('forever:interactive',takeover,{once:true});
document.addEventListener('pointerdown',takeover,{once:true});
document.addEventListener('keydown',e=>{if(['Enter',' ' ,'ArrowLeft','ArrowRight'].includes(e.key))takeover();},{once:true});
btn.addEventListener('click',()=>{takeover();fly();});
function tick(){
  if(!demo)return;
  t+=TICK;if(t<(firstRun?FIRST:DEMO_EVERY))return;
  t=0;firstRun=false;
  if(count>=5){count=0;badge.classList.add('um02-empty');}   // cart empties, then fills again
  fly(false);
}
function start(){if(demo&&!timer&&!reduce)timer=setInterval(tick,TICK);}
function stop(){clearInterval(timer);timer=0;}
document.addEventListener('visibilitychange',()=>{document.hidden?stop():start();});
// live re-theme: the canvas broadcasts {type:'forever:theme', theme:'light'|'dark'}
addEventListener('message',(e)=>{const d=e.data;if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark'))document.documentElement.setAttribute('data-theme',d.theme);});
if(reduce){count=2;badge.textContent='2';badge.classList.remove('um02-empty');}   // reduced motion: one static, representative state
else if(demo)start();
})();
</script>
</body>
</html>
