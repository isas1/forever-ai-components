<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta name="description" content="Mobile list frame you drag down to trigger a rotating arc spinner that refreshes and flashes skeleton rows.">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pull to Refresh</title>
<script>
/* theme hook: the canvas loads the tile with ?theme=light|dark (or stamps data-theme on <html>).
   Runs before first paint — no dark flash. Standalone default stays dark. */
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
  /* theme tokens — dark values are the defaults (solid-dark-bg contract);
     the light re-theme is the [data-theme="light"] block */
  :root{
    --c06-bg:#0f1a24; --c06-frame-bg:#16252f; --c06-shadow:rgba(0,0,0,.4);
    --c06-accent:#3ad6c5; --c06-row-bg:#22404e; --c06-hint:#5a7585;
    --c06-cap:#fff; --c06-cap-o:.28;
  }
  :root[data-theme="light"]{
    --c06-bg:#eef4f9; --c06-frame-bg:#ffffff; --c06-shadow:rgba(20,40,60,.14);
    --c06-accent:#1a7c71; --c06-row-bg:#dbe7ef; --c06-hint:#5a7585;
    --c06-cap:#1b2130; --c06-cap-o:.5;
  }
  html,body{margin:0;height:100%;overflow:hidden;background:var(--c06-bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  #um06-wrap{position:fixed;inset:0;display:grid;place-items:center;cursor:ns-resize;touch-action:none}
  #um06-frame{position:relative;width:min(62%,200px,calc(82vh - 16px));aspect-ratio:.82;background:var(--c06-frame-bg);border-radius:20px;overflow:hidden;box-shadow:0 14px 34px var(--c06-shadow)}
  #um06-spinarea{position:absolute;top:0;left:0;right:0;height:46px;display:grid;place-items:center}
  #um06-spin{width:24px;height:24px}
  #um06-spin circle{fill:none;stroke:var(--c06-accent);stroke-width:3;stroke-linecap:round;stroke-dasharray:60;stroke-dashoffset:60}
  #um06-list{position:absolute;top:0;left:0;right:0;padding:clamp(4px,3vmin,12px);will-change:transform}
  .um06-row{height:clamp(7px,4vmin,14px);border-radius:7px;background:var(--c06-row-bg);margin-bottom:clamp(4px,2.5vmin,9px)}
  .um06-row:nth-child(odd){width:80%}.um06-row:nth-child(even){width:60%}
  .cap{position:fixed;left:8px;bottom:7px;font-size:10px;letter-spacing:.08em;color:var(--c06-cap);opacity:var(--c06-cap-o);text-transform:uppercase}
  .um06-hint{border:0;background:transparent;padding:0;cursor:pointer;position:absolute;z-index:2;bottom:12px;left:0;right:0;text-align:center;font-size:12px;color:var(--c06-hint);letter-spacing:.1em}
.um06-hint:focus-visible{outline:2px solid var(--c06-accent);outline-offset:3px}
.um06-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/ui-microinteractions/06-pull-to-refresh.html",
 "title": "Pull to Refresh",
 "description": "A phone-frame list supports pointer/touch pull and a native Refresh button. First input stops attract refreshes; manual refresh completes its spinner, row flash and settling, or completes immediately with reduced motion.",
 "useWhen": "Demoing mobile pull-to-refresh patterns, onboarding flows showing gesture affordances, or UI kit showcases.",
 "avoidWhen": "Production data refresh without connecting the local action to a request. This mockup updates local visual feedback only.",
 "agentPrompt": "Tune MAX=60 pull distance, SPIN_MS=1400 refresh duration, SETTLE_MS=260 return duration and the --c06-* palette tokens. Preserve native Refresh button, Enter/Space activation, pointer capture/cancel, finite manual work, elapsed-time suspension while hidden and permanent attract stop at first input. The idle demo delay is 2400ms and runs only while demo is enabled. Theme: :root tokens, [data-theme=\"light\"] and forever:theme message hook.",
 "editableAreas": [
  "pull threshold and maximum pull (MAX=60; clamp MAX*1.3)",
  "refresh spin duration (SPIN_MS=1400)",
  "settle duration (SETTLE_MS=260)",
  "guarded idle demo delay (2400ms)",
  "row count (7), responsive dimensions and row flash timing (300ms +40ms stagger)",
  "theme tokens (--c06-* and [data-theme=light])"
 ],
 "preserveElements": [
  "IIFE wrapper and um06 namespace",
  "native Refresh button, visible focus, Enter/Space and status announcements",
  "unified Pointer Events, pointer capture/cancel and touch-action:none",
  "finite spin/settle state, idle renderer sleep and visibility elapsed-time pause/resume",
  "meaningful reduced-motion refresh completion",
  "demo-v1 lifecycle; initial __foreverPreview.demoEnabled flag and forever:interactive event stop attract only",
  "theme bootstrap and forever:theme message listener"
 ],
 "knownLimitations": [
  "Refresh visual feedback is local; no network request or data persistence is connected.",
  "Input during an active manual refresh is ignored until it completes; the first input can interrupt an attract refresh.",
  "Format/theme remount preserves takeover, not local refresh count or component values."
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "light-ready"
 ],
 "tags": [
  "pull-to-refresh",
  "mobile",

</script>
</head>
<body>
<div id="um06-wrap">
  <div id="um06-frame">
    <div id="um06-spinarea"><svg id="um06-spin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg></div>
    <button type="button" class="um06-hint" id="um06-hint" aria-label="Refresh list. Drag down or activate with Enter or Space.">PULL DOWN / REFRESH</button>
    <div id="um06-list" aria-hidden="true"></div>
    <span class="um06-live" id="um06-live" role="status" aria-live="polite" data-fit-clip-ok></span>
  </div>
</div>
<div class="cap">Pull refresh</div>
<script>
(()=>{
const list=document.getElementById('um06-list'),spin=document.getElementById('um06-spin'),circle=spin.querySelector('circle'),wrap=document.getElementById('um06-wrap'),hint=document.getElementById('um06-hint'),live=document.getElementById('um06-live');
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
for(let i=0;i<7;i++){const row=document.createElement('div');row.className='um06-row';list.appendChild(row);}
const MAX=60,SPIN_MS=1400,SETTLE_MS=260;
let y=0,sy=0,pointer=null,phase='idle',elapsed=0,from=0,manual=false,raf=0,last=0,timer=0,count=0;
let demo=window.__foreverPreview?.demoEnabled!==false,flashes=[];
function render(){
  const p=Math.min(1,y/MAX);list.style.transform='translateY('+y+'px)';
  spin.style.transform='rotate('+(p*270)+'deg)';circle.style.strokeDashoffset=60-p*50;spin.style.opacity=p;
  hint.disabled=manual&&phase==='spin';
  const label=manual&&phase==='spin'?'REFRESHING':count?'REFRESH AGAIN':'PULL DOWN / REFRESH';
  if(hint.textContent!==label)hint.textContent=label;
  wrap.dataset.phase=phase;wrap.dataset.refreshCount=count;wrap.setAttribute('aria-busy',phase==='spin');
}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;last=0;}
function wake(){if(!document.hidden&&!raf&&(phase==='spin'||phase==='settle'))raf=requestAnimationFrame(frame);}
function loop(){clearTimeout(timer);timer=0;if(demo&&!reduce&&!document.hidden&&phase==='idle')timer=setTimeout(()=>{timer=0;refresh(false);},2400);}
function flash(){
  flashes.forEach(a=>a.cancel());flashes=[];
  if(!reduce)for(const [i,row] of [...list.children].entries())flashes.push(row.animate([{opacity:.4},{opacity:1}],{duration:300,delay:i*40,easing:'ease-out'}));
}
function settle(){from=y;elapsed=0;phase='settle';if(reduce){y=0;phase='idle';render();loop();}else{render();wake();}}
function complete(){count++;flash();live.textContent='List refreshed. Refresh '+count+' complete.';settle();}
function refresh(user=true){
  if(document.hidden||phase==='spin')return;stop();manual=user;pointer=null;phase='spin';elapsed=0;y=MAX;
  live.textContent='Refreshing list.';render();if(reduce)complete();else wake();
}
function frame(t){
  raf=0;if(document.hidden){last=0;return;}elapsed+=last?Math.min(50,t-last):0;last=t;
  if(phase==='spin'){
    if(elapsed>=SPIN_MS){complete();return;}
    spin.style.transform='rotate('+(270+elapsed/700*360)+'deg)';
  }else if(phase==='settle'){
    const k=Math.min(1,elapsed/SETTLE_MS);y=from*Math.pow(1-k,3);if(k===1){y=0;phase='idle';last=0;render();loop();return;}render();
  }
  wake();
}
function takeover(){
  if(!demo)return;demo=false;clearTimeout(timer);timer=0;
  // Discard only an attract refresh. A manual refresh keeps its finite work.
  if(!manual&&phase!=='idle'){stop();flashes.forEach(a=>a.cancel());flashes=[];phase='idle';y=0;render();}
}
function down(e){
  if(e.button!==0||e.target.closest('button')||phase==='spin')return;
  takeover();stop();manual=true;pointer=e.pointerId;sy=e.clientY;phase='pull';y=0;wrap.setPointerCapture(pointer);render();
}
function move(e){if(e.pointerId!==pointer)return;y=Math.max(0,Math.min(MAX*1.3,(e.clientY-sy)*.7));render();}
function up(e){if(e.pointerId!==pointer)return;pointer=null;if(phase!=='pull')return;e.type==='pointercancel'||y<MAX?settle():refresh();}
wrap.addEventListener('pointerdown',down);wrap.addEventListener('pointermove',move);wrap.addEventListener('pointerup',up);wrap.addEventListener('pointercancel',up);wrap.addEventListener('lostpointercapture',up);
hint.addEventListener('click',()=>{takeover();refresh();});
window.addEventListener('forever:interactive',takeover);document.addEventListener('pointerdown',takeover,{capture:true});document.addEventListener('click',takeover,{capture:true});document.addEventListener('keydown',e=>{if(e.key!=='Tab'&&!e.metaKey&&!e.ctrlKey&&!e.altKey)takeover();},{capture:true});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stop();clearTimeout(timer);timer=0;flashes.forEach(a=>{if(a.playState==='running')a.pause();});if(phase==='pull'){pointer=null;settle();}}
  else{flashes.forEach(a=>{if(a.playState==='paused')a.play();});wake();loop();}
});
addEventListener('message',e=>{const d=e.data;if(d&&d.type==='forever:theme'&&(d.theme==='light'||d.theme==='dark'))document.documentElement.setAttribute('data-theme',d.theme);});
render();loop();
})();
</script>
</body>
</html>
