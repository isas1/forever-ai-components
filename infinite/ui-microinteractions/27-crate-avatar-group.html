<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="Crate Avatar Group — overlapping staff filter stack that fans open with active checkmarks.">
<meta name="forever-preview-lifecycle" content="demo-v1">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crate Avatar Group</title>
<script>/* theme hook: ?theme=light|dark before first paint */(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
:root{
  --cr03-bg:#131316;--cr03-ink:#F1F1F4;--cr03-on:#000;--cr03-mute:#9A9CA6;--cr03-soft:#1F2024;--cr03-cobalt:#7B95C4;
  --cr03-sz:clamp(32px,14vmin,46px);--cr03-ease:cubic-bezier(.2,.8,.2,1);--cr03-spr:cubic-bezier(.3,1.45,.5,1);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --cr03-bg:#EFF0F3;--cr03-ink:#000;--cr03-on:#EFF0F3;--cr03-mute:#5F616B;--cr03-soft:#E1E3EA;--cr03-cobalt:#2B4473;
  color-scheme:light;
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--cr03-bg);color:var(--cr03-ink);font-family:"Avenir Next",Avenir,"Segoe UI",ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.cr03-stage,.cr03-stage *,.cr03-stage *::before,.cr03-stage *::after{box-sizing:border-box}
.cr03-stage{position:relative;width:100%;height:100%;display:grid;place-items:center;padding:clamp(8px,3vmin,20px);background:var(--cr03-bg);color:var(--cr03-ink)}
.cr03-stage :focus-visible{outline:2px solid var(--cr03-cobalt);outline-offset:2px}
.cr03-ag{display:grid;justify-items:center;gap:clamp(10px,4vmin,16px);width:100%}
.cr03-ul{display:flex;flex-wrap:wrap;justify-content:center;row-gap:clamp(6px,2.5vmin,10px);list-style:none;margin:0;padding:0 0 0 10px}
.cr03-li{width:var(--cr03-sz);margin-left:clamp(-12px,-3vmin,-8px);transition:margin .35s var(--cr03-spr),width .35s var(--cr03-ease),opacity .25s,transform .35s var(--cr03-spr),visibility 0s}
@media (hover:hover){.cr03-ul:hover .cr03-li{margin-left:3px}}
.cr03-ul:focus-within .cr03-li,.cr03-ag.cr03-open .cr03-li{margin-left:3px}
.cr03-ag:not(.cr03-open) .cr03-li.cr03-ex{width:0;margin-left:0;opacity:0;transform:scale(.3);visibility:hidden;transition-delay:0s,0s,0s,0s,.35s}
.cr03-ag.cr03-open .cr03-li.cr03-ex:nth-child(5){transition-delay:0ms,0ms,0ms,0ms,0s}
.cr03-ag.cr03-open .cr03-li.cr03-ex:nth-child(6){transition-delay:45ms,45ms,45ms,45ms,0s}
.cr03-ag.cr03-open .cr03-li.cr03-ex:nth-child(7){transition-delay:90ms,90ms,90ms,90ms,0s}
.cr03-av{position:relative;display:grid;place-items:center;width:var(--cr03-sz);height:var(--cr03-sz);border-radius:50%;border:2.5px solid var(--cr03-bg);background:var(--cr03-c);color:#fff;font:inherit;font-weight:600;font-size:clamp(10px,3.2vmin,13px);padding:0;margin:0;cursor:pointer;transition:transform .3s var(--cr03-spr);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.cr03-av:hover,.cr03-av:focus-visible{transform:translateY(-4px);z-index:2}
.cr03-av[aria-pressed="true"]{transform:translateY(-6px)}
.cr03-chk{position:absolute;right:-3px;bottom:-3px;display:grid;place-items:center;width:clamp(14px,4.5vmin,18px);height:clamp(14px,4.5vmin,18px);border-radius:50%;background:var(--cr03-ink);color:var(--cr03-on);border:2px solid var(--cr03-bg);scale:0;transition:scale .3s var(--cr03-spr)}
.cr03-av[aria-pressed="true"] .cr03-chk{scale:1}
.cr03-i{display:block;width:62%;height:62%}
.cr03-b{--cr03-c:#2B4473}.cr03-r{--cr03-c:#C8371F}.cr03-y{--cr03-c:#E2B01A;color:#000}.cr03-g{--cr03-c:#3F7A55}.cr03-u{--cr03-c:#5A3A5C}.cr03-k{--cr03-c:#55575F}
.cr03-more{background:var(--cr03-soft);color:var(--cr03-ink)}
.cr03-tip{height:18px;margin:0;font-size:clamp(11px,3.2vmin,13px);color:var(--cr03-mute)}
.cr03-tip-tx{display:inline-block;white-space:nowrap;transition:transform .35s var(--cr03-spr)}
.cr03-cap{position:absolute;left:10px;bottom:8px;font:500 11px/1 ui-monospace,monospace;color:var(--cr03-ink);opacity:.45;letter-spacing:.04em;text-transform:uppercase;pointer-events:none;user-select:none}
@media (prefers-reduced-motion:reduce){.cr03-stage *,.cr03-stage *::before,.cr03-stage *::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/ui-microinteractions/27-crate-avatar-group.html",
 "title": "Crate Avatar Group",
 "description": "Overlapping collector avatar stack that fans open on hover or expand with toggleable check badges and gliding tooltip.",
 "useWhen": "Assignee pickers, collaborator lists, and crate contributor bars.",
 "avoidWhen": "Very large user directories over 20 members.",
 "agentPrompt": "Edit --b/--i/--c/--l tokens in :root and [data-theme=\"light\"].",
 "editableAreas": [
  "theme CSS tokens (--b/--i/--c/--l), data arrays & timings"
 ],
 "preserveElements": [
  "IIFE + crNN- prefix, reduced-motion, visibilitychange, theme/demo-v1"
 ],
 "knownLimitations": [
  "Demo state resets on remount"
 ],
 "tier": "curated",
 "labels": [
  "agent-ready",
  "easy-to-modify",
  "mobile-ready",
  "accessible",
  "copy-paste-safe",
  "minimal-deps",
  "themeable",
  "light-ready"
 ],
 "tags": [
  "avatar-group",
  "avatars",

  "crate"
 ]
}
</script>
</head>
<body>
<div class="cr03-stage" id="cr03-stage"></div>
<div class="cr03-cap" aria-hidden="true">Avatar Group</div>
<script>(()=>{
  const s=document.getElementById('cr03-stage');
  const mq=matchMedia('(prefers-reduced-motion: reduce)');
  const RM=()=>mq.matches;
  const P=[['Juno Abara','b'],['Petra Voss','r'],['Marlo Finch','y'],['Ines Maro','g'],['Kofi Okoro','u'],['Dee Quay','k'],['Rue Sable','b']];
  const ini=n=>n.split(' ').map(w=>w[0]).join('');
  const CHK='<svg class="cr03-i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  s.innerHTML=`<div class="cr03-ag" role="group" aria-label="Filter by staff"><ul class="cr03-ul">${P.map(([n,c],i)=>`<li class="cr03-li${i>3?' cr03-ex':''}"><button type="button" class="cr03-av cr03-${c}" aria-pressed="false" aria-label="${n}">${ini(n)}<i class="cr03-chk">${CHK}</i></button></li>`).join('')}<li class="cr03-li"><button type="button" class="cr03-av cr03-more" aria-expanded="false" aria-label="Show 3 more">+3</button></li></ul><p class="cr03-tip" aria-hidden="true"><span class="cr03-tip-tx">Everyone</span></p></div>`;
  const root=s.querySelector('.cr03-ag'),more=s.querySelector('.cr03-more'),tip=s.querySelector('.cr03-tip-tx');
  const avs=[...s.querySelectorAll('.cr03-av:not(.cr03-more)')];
  let hov=null,tm=0;
  const paint=()=>{
    const n=avs.filter(a=>a.getAttribute('aria-pressed')==='true').length;
    tip.textContent=hov?hov.getAttribute('aria-label'):n?`${n} selected`:'Everyone';
    const r=root.getBoundingClientRect(),h=hov&&hov.getBoundingClientRect();
    const dx=h?Math.max(-r.width*.28,Math.min(r.width*.28,h.left+h.width/2-r.left-r.width/2)):0;
    tip.style.transform=`translateX(${dx.toFixed(1)}px)`;
  };
  const track=a=>{hov=a;paint();clearTimeout(tm);tm=setTimeout(paint,380)};
  const toggleMore=force=>{
    const o=force!==undefined?root.classList.toggle('cr03-open',force):root.classList.toggle('cr03-open');
    more.setAttribute('aria-expanded',String(o));
    more.textContent=o?'−':'+3';
    more.setAttribute('aria-label',o?'Show fewer':'Show 3 more');
  };
  avs.forEach(a=>{
    a.addEventListener('click',()=>{a.setAttribute('aria-pressed',String(a.getAttribute('aria-pressed')!=='true'));paint()});
    a.addEventListener('pointerenter',()=>track(a));a.addEventListener('focus',()=>track(a));
    a.addEventListener('pointerleave',()=>{hov===a&&track(null)});a.addEventListener('blur',()=>{hov===a&&track(null)});
  });
  more.addEventListener('click',()=>toggleMore());

  let demo=!RM()&&!(window.__foreverPreview&&window.__foreverPreview.demoEnabled===false);
  let timer=0,kick=0,step=0;
  const play=()=>{
    if(!demo||RM()||document.hidden)return;
    const ph=step++%4;
    if(ph===0){toggleMore(true);track(avs[1]);avs[1].setAttribute('aria-pressed','true');paint()}
    else if(ph===1){track(avs[4]);avs[4].setAttribute('aria-pressed','true');paint()}
    else if(ph===2){track(null);avs[1].setAttribute('aria-pressed','false');paint()}
    else{avs.forEach(a=>a.setAttribute('aria-pressed','false'));track(null);toggleMore(false);paint()}
  };
  const stop=()=>{if(timer){clearInterval(timer);timer=0}if(kick){clearTimeout(kick);kick=0}};
  const start=()=>{if(!timer&&demo&&!RM())timer=setInterval(play,1150)};
  const takeover=()=>{demo=false;stop()};
  window.addEventListener('forever:interactive',takeover);
  s.addEventListener('pointerdown',takeover,true);
  s.addEventListener('keydown',takeover,true);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else if(demo)start()});
  window.addEventListener('message',e=>{if(e.data&&e.data.type==='forever:theme'&&(e.data.theme==='light'||e.data.theme==='dark'))document.documentElement.setAttribute('data-theme',e.data.theme)});
  if(demo){kick=setTimeout(play,650);start()}
})();</script>
</body>
</html>
