<script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
:root{--b:#131316;--i:#F1F1F4;--o:#000;--l:#2B2C31;--s:#1F2024;--c:#7B95C4;--sp:cubic-bezier(.3,1.45,.5,1);color-scheme:dark}
:root[data-theme="light"]{--b:#EFF0F3;--i:#000;--o:#EFF0F3;--l:#CDCFD8;--s:#E1E3EA;--c:#2B4473;color-scheme:light}
html,body{margin:0;height:100%;overflow:hidden;background:var(--b);color:var(--i);font:14px/1.3 "Avenir Next",Avenir,system-ui,sans-serif}
.cr10-st,.cr10-st *{box-sizing:border-box}
.cr10-st{position:relative;width:100%;height:100%;display:grid;place-items:center;padding:clamp(8px,3vmin,20px);background:var(--b);color:var(--i)}
.cr10-st :focus-visible{outline:2px solid var(--c);outline-offset:2px}
.cr10-rx{width:min(100%,290px);display:grid;gap:clamp(10px,4vmin,16px)}
.cr10-ps{display:grid;grid-template-columns:clamp(42px,18vmin,72px) 1fr;gap:clamp(8px,3vmin,14px);align-items:center}
.cr10-ps b{display:block;font-family:Futura,"Avenir Next",sans-serif;font-size:clamp(13px,4vmin,17px);margin-bottom:clamp(4px,2vmin,10px)}
.cr10-art{display:block;width:100%;aspect-ratio:1;border-radius:2px}
.cr10-ln{display:block;height:5px;border-radius:3px;background:var(--l);margin-top:6px}.cr10-w1{width:92%}.cr10-w2{width:62%}
.cr10-row{position:relative;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.cr10-pill,.cr10-op,.cr10-mb{border:1.5px solid var(--l);background:none;padding:0;color:inherit;font:inherit;cursor:pointer;touch-action:manipulation}
.cr10-pill{display:inline-flex;align-items:center;gap:clamp(3px,1.5vmin,6px);height:clamp(28px,9vmin,38px);padding:0 clamp(8px,2.5vmin,12px) 0 clamp(6px,2vmin,9px);border-radius:999px;font-weight:600;font-size:clamp(11px,3.2vmin,13px);overflow:hidden;transition:border-color .2s,background .2s,scale .15s}
.cr10-pill[aria-pressed="true"]{border-color:var(--i);background:var(--s)}.cr10-pill:active{scale:.94}
.cr10-e{display:block;font-size:clamp(13px,4vmin,17px);line-height:1}.cr10-n{display:block;min-width:.7em;text-align:center}
.cr10-op{display:inline-grid;place-items:center;width:clamp(28px,9vmin,38px);height:clamp(28px,9vmin,38px);border-radius:50%;transition:border-color .2s,scale .15s}
.cr10-op:hover{border-color:var(--i)}.cr10-op:active{scale:.9}
.cr10-ic{display:block;width:clamp(14px,4vmin,18px);height:clamp(14px,4vmin,18px);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cr10-menu{position:absolute;left:50%;bottom:calc(100% + 8px);z-index:3;display:flex;gap:2px;padding:clamp(3px,1.2vmin,6px);border-radius:999px;background:var(--b);border:1.5px solid var(--i);translate:-50% 0;transform-origin:50% 100%;visibility:hidden;opacity:0;scale:.6;transition:opacity .15s,scale .2s ease,visibility 0s .2s}
.cr10-menu.cr10-open{visibility:visible;opacity:1;scale:1;transition:opacity .15s,scale .35s var(--sp),visibility 0s}
.cr10-mb{width:clamp(22px,10vmin,36px);height:clamp(22px,10vmin,36px);border-radius:50%;border-color:transparent;font-size:clamp(13px,5vmin,21px);line-height:1;scale:0;transition:scale .15s,transform .2s var(--sp),background .2s}
.cr10-menu.cr10-open .cr10-mb{scale:1;transition:scale .35s var(--sp),transform .2s var(--sp),background .2s}
.cr10-mb:hover,.cr10-mb:focus-visible{transform:translateY(-5px) scale(1.3)}.cr10-mb[aria-checked="true"]{background:var(--s)}
.cr10-fly{position:absolute;z-index:9;left:0;top:0;font-size:clamp(16px,5vmin,22px);line-height:1;pointer-events:none}
.cr10-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.cr10-cap{position:absolute;left:10px;bottom:8px;font:500 11px/1 ui-monospace,monospace;color:var(--i);opacity:.45;letter-spacing:.04em;text-transform:uppercase;pointer-events:none;user-select:none}
@media (prefers-reduced-motion:reduce){.cr10-st *{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
<script type="application/json" id="forever-agent-meta">
{
 "file": "infinite/ui-microinteractions/28-crate-emoji-reactions.html",
 "title": "Crate Emoji Reactions",
 "description": "Reaction pill row featuring an add-emoji picker, floating SVG bursts, and vertical rolling digit counters.",

<body>
<div class="cr10-st" id="cr10-st"></div>
<div class="cr10-cap" aria-hidden="true">Emoji Reactions</div>
<script>(()=>{
  const s=document.getElementById('cr10-st'),RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SPR='cubic-bezier(.3,1.45,.5,1)',NO={finished:Promise.resolve(),cancel(){}},anim=(el,kf,o)=>RM()?NO:el.animate(kf,Object.assign({duration:300,easing:'cubic-bezier(.2,.8,.2,1)'},o));
  const E=[['🔥','Fire'],['❤️','Love'],['🕺','Dance'],['😮','Wow'],['😂','Funny'],['👏','Clap']],name=e=>E.find(x=>x[0]===e)[1];
  s.innerHTML=`<div class="cr10-rx"><div class="cr10-ps"><svg class="cr10-art" viewBox="0 0 10 10" aria-hidden="true"><rect width="10" height="10" fill="#2B4473"/><circle cx="3" cy="3" r="1.4" fill="#F2F0EA"/><circle cx="7" cy="3" r="1.4" fill="#F2F0EA"/><circle cx="5" cy="7" r="1.4" fill="#E2B01A"/></svg><div><b>Slow Hands</b><i class="cr10-ln cr10-w1"></i><i class="cr10-ln cr10-w2"></i></div></div><div class="cr10-row" role="group" aria-label="Reactions"><button type="button" class="cr10-op" aria-haspopup="menu" aria-expanded="false" aria-controls="cr10-menu" aria-label="Add reaction"><svg class="cr10-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zM8.5 14c.8 1.2 2 2 3.5 2s2.7-.8 3.5-2M9 9.5v.5M15 9.5v.5"/></svg></button><div class="cr10-menu" id="cr10-menu" role="menu" aria-orientation="horizontal" aria-label="Pick a reaction">${E.map(([e,l])=>`<button type="button" class="cr10-mb" role="menuitemcheckbox" aria-checked="false" aria-label="${l}" tabindex="-1" data-e="${e}">${e}</button>`).join('')}</div></div><div class="cr10-sr" aria-live="polite"></div></div>`;
  const row=s.querySelector('.cr10-row'),opener=s.querySelector('.cr10-op'),menu=s.querySelector('.cr10-menu'),mi=[...menu.querySelectorAll('.cr10-mb')],sr=s.querySelector('.cr10-sr'),pills=new Map();
  let alive=true;
  const paint=p=>{p.el.setAttribute('aria-pressed',String(p.mine));p.el.setAttribute('aria-label',`${name(p.e)}, ${p.n}`);mi.find(b=>b.dataset.e===p.e).setAttribute('aria-checked',String(p.mine))};
  const num=(p,dir)=>{const el=p.el.querySelector('.cr10-n');el.textContent=p.n;anim(el,[{transform:`translateY(${dir*80}%)`,opacity:0},{transform:'none',opacity:1}],{duration:320,easing:SPR})};
  const mk=(e,n)=>{const b=document.createElement('button');b.type='button';b.className='cr10-pill';b.innerHTML=`<span class="cr10-e">${e}</span><span class="cr10-n">${n}</span>`;row.insertBefore(b,opener);const p={e,n,mine:false,el:b};pills.set(e,p);b.onclick=()=>toggle(e);paint(p);return p};
  const fly=(e,from,to)=>{const R=s.getBoundingClientRect(),f=document.createElement('span');f.className='cr10-fly';f.textContent=e;s.appendChild(f);const A=from.getBoundingClientRect(),B=to.getBoundingClientRect(),x0=A.left-R.left+A.width/2-10,y0=A.top-R.top+A.height/2-10,x1=B.left-R.left+B.width/2-10,y1=B.top-R.top+B.height/2-10;
    return f.animate([{transform:`translate(${x0}px,${y0}px) scale(1.3)`},{transform:`translate(${(x0+x1)/2}px,${Math.min(y0,y1)-32}px) scale(1.75)`,offset:.45},{transform:`translate(${x1}px,${y1}px) scale(.8)`}],{duration:480,easing:'cubic-bezier(.4,0,.3,1)'}).finished.catch(()=>{}).then(()=>f.remove())};
  const toggle=(e,from,foc)=>{let p=pills.get(e);
    if(p&&p.mine){p.mine=false;p.n--;num(p,-1);paint(p);sr.textContent=`${name(e)} removed`;
      if(!p.n){pills.delete(e);const el=p.el;el.inert=true;anim(el,[{width:el.offsetWidth+'px',opacity:1},{width:'0px',paddingLeft:'0px',paddingRight:'0px',marginRight:'-6px',opacity:0}],{duration:240,fill:'forwards'}).finished.catch(()=>{}).then(()=>{if(alive)el.remove()});if(foc)opener.focus({preventScroll:true})}return}
    const fresh=!p;if(fresh){p=mk(e,0);anim(p.el,[{transform:'scale(.4)',opacity:0},{transform:'none',opacity:1}],{duration:340,easing:SPR})}
    p.mine=true;p.n++;paint(p);sr.textContent=`${name(e)} added`;const em=p.el.querySelector('.cr10-e');
    const land=()=>{if(!alive)return;em.style.opacity='';num(p,1);anim(em,[{transform:'scale(1.6) rotate(-14deg)'},{transform:'none'}],{duration:420,easing:SPR})};
    if(from&&!RM()){if(fresh)em.style.opacity='0';fly(e,from,em).then(land)}else land()};
  const closeM=foc=>{menu.classList.remove('cr10-open');opener.setAttribute('aria-expanded','false');if(foc)opener.focus({preventScroll:true})};
  const openM=foc=>{menu.classList.add('cr10-open');opener.setAttribute('aria-expanded','true');if(foc)mi[0].focus({preventScroll:true})};
  opener.onclick=()=>menu.classList.contains('cr10-open')?closeM():openM(true);
  opener.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();openM(true)}});
  menu.addEventListener('keydown',e=>{const i=mi.indexOf(document.activeElement),k=e.key,L=mi.length;let n;if(k==='ArrowRight')n=(i+1)%L;else if(k==='ArrowLeft')n=(i+L-1)%L;else if(k==='Home')n=0;else if(k==='End')n=L-1;else if(k==='Escape'){closeM(true);return}else if(k==='Tab'){closeM();return}else return;e.preventDefault();mi[n].focus()});
  menu.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;closeM(true);toggle(b.dataset.e,b,true)});
  document.addEventListener('pointerdown',e=>{if(menu.classList.contains('cr10-open')&&!menu.contains(e.target)&&!opener.contains(e.target))closeM()});
  mk('🔥',4);mk('❤️',2);

  let demo=!RM()&&!(window.__foreverPreview&&window.__foreverPreview.demoEnabled===false),timer=0,kick=0,step=0;
  const play=()=>{if(!demo||RM()||document.hidden)return;const p=step++%4;
    if(p===0)openM(false);else if(p===1){closeM(false);toggle('🕺',mi[2],false)}else if(p===2)toggle('🔥',null,false);else{toggle('🕺',null,false);toggle('🔥',null,false)}};
  const stop=()=>{clearInterval(timer);clearTimeout(kick);timer=kick=0},start=()=>{if(!timer&&demo&&!RM())timer=setInterval(play,1200)},tk=()=>{demo=false;stop()};
  window.addEventListener('forever:interactive',tk);s.addEventListener('pointerdown',tk,true);s.addEventListener('keydown',tk,true);
  document.addEventListener('visibilitychange',()=>document.hidden?stop():demo&&start());
  window.addEventListener('message',e=>{if(e.data&&e.data.type==='forever:theme'&&(e.data.theme==='light'||e.data.theme==='dark'))document.documentElement.setAttribute('data-theme',e.data.theme)});
  if(demo){kick=setTimeout(play,600);start()}
})();</script>
</body>
