<script>
(function(){
"use strict";
var D=document,root=D.documentElement,$=function(i){return D.getElementById(i);},card=$("sf-card"),inn=$("sf-in"),cv=$("sf-cv"),ag=$("sf-ag"),gh=$("sf-g"),live=$("sf-live"),g=cv.getContext("2d"),M=Math;

function mark(x,y){

var s=p*(ZZ.length-1),i=M.min(ZZ.length-2,M.floor(s)),f=s-i;
